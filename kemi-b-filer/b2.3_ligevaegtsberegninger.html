<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beregninger med ligevægtskonstanter</title>
<style>
:root{
    --bg:      #0f1115;
    --panel:   #1a1d24;
    --main:    #f3f4f6;
    --muted:   #9ca3af;
    --blue:    #3b82f6;
    --green:   #10b981;
    --red:     #ef4444;
    --yellow:  #fbbf24;
    --purple:  #a78bfa;
    --radius:  12px;
}

*{ box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
[hidden]{ display:none !important; }

body{ background:var(--bg); color:var(--main); min-height:100vh; }

#bgCanvas{ position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:0; }

/* ── HEADER ── */
header{
    position:sticky; top:0; z-index:100;
    background:#14161a; padding:10px 20px;
    border-bottom:2px solid #232730;
    display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
    box-shadow:0 4px 15px rgba(0,0,0,0.5);
}
header h1{ font-size:1.05rem; color:var(--blue); letter-spacing:1px; text-transform:uppercase; }

.niveau-valg{ display:flex; gap:6px; flex-wrap:wrap; }
.niv-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.15);
    color:var(--muted); padding:5px 12px; border-radius:20px;
    font-size:0.8rem; cursor:pointer; transition:all .2s;
}
.niv-btn:hover{ border-color:var(--blue); color:var(--main); }
.niv-btn.aktiv{ background:rgba(59,130,246,0.18); border-color:var(--blue); color:#bfdbfe; font-weight:bold; }

.stats{ display:flex; gap:10px; }
.stat-box{
    background:rgba(255,255,255,0.05); padding:5px 12px; border-radius:8px;
    font-weight:bold; font-size:0.82rem; display:flex; align-items:center; gap:6px;
}
.stat-value{ color:var(--green); font-size:0.95rem; }

.top-btn{
    background:rgba(59,130,246,0.1); border:1px solid var(--blue); color:var(--blue);
    padding:6px 14px; border-radius:20px; font-size:0.82rem; font-weight:bold;
    cursor:pointer; transition:all .2s;
}
.top-btn:hover{ background:var(--blue); color:#06232c; }
.top-btn.gul{ background:rgba(251,191,36,0.1); border-color:var(--yellow); color:var(--yellow); }
.top-btn.gul:hover{ background:var(--yellow); color:#2a2110; }

/* ── SIDE ── */
.page{ position:relative; z-index:1; padding:24px 22px 70px; display:flex; justify-content:center; }
.column{ width:100%; max-width:1020px; display:flex; flex-direction:column; gap:14px; }

.card{
    background:rgba(20,22,28,0.88);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius); padding:18px 20px;
}

.step-card{ border-left:3px solid var(--blue); transition:border-left-color .3s; animation:fadeIn .35s ease; }
.step-card.skjult{ display:none; }
.step-card.done{ border-left-color:var(--green); padding:12px 20px; }
.step-card.done.aaben{ padding:18px 20px; }

/* Sammenfoldning: et gennemført trin viser kun overskrift og svar. */
.step-hoved-rad{ display:flex; align-items:flex-start; gap:10px; }
.step-card.done .step-hoved-rad{ cursor:pointer; }
.step-card.done .step-sub{ display:none; }
.step-body{ margin-top:14px; }
.step-card.done .step-body{ display:none; }
.step-card.done.aaben .step-body{ display:block; }
.step-hoved-tekst{ flex:1; min-width:0; }
.step-resume{
    display:none; margin-top:4px; font-size:0.9rem; color:#a7f3d0; line-height:1.6;
}
.step-card.done .step-resume{ display:block; }
.step-card.done.aaben .step-resume{ display:none; }
.fold-pil{ display:none; color:var(--muted); font-size:0.75rem; flex-shrink:0; margin-top:6px; }
.step-card.done .fold-pil{ display:block; }
.step-card.done .fold-pil::after{ content:"Vis ▸"; }
.step-card.done.aaben .fold-pil::after{ content:"Skjul ▾"; }

/* Markering af de enkelte svarfelter, når man trykker "Tjek svar". */
input[type="text"].rigtig{  border-color:var(--green) !important; box-shadow:0 0 0 2px rgba(16,185,129,.45); }
input[type="text"].forkert{ border-color:var(--red)   !important; box-shadow:0 0 0 2px rgba(239,68,68,.30); }
select.sel.rigtig{  border-color:var(--green) !important; box-shadow:0 0 0 2px rgba(16,185,129,.45); }
select.sel.forkert{ border-color:var(--red)   !important; box-shadow:0 0 0 2px rgba(239,68,68,.30); }

/* ── OPGAVEOVERSIGT ── */
#oversigt-kort{ padding:14px 18px; }
.oversigt-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:11px; }
.oversigt-titel{ font-size:0.82rem; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:bold; }
.oversigt-nav{ display:flex; gap:8px; }
.nav-btn{
    background:transparent; border:1px solid rgba(255,255,255,0.18); color:var(--muted);
    padding:5px 13px; border-radius:16px; font-size:0.8rem; font-family:inherit;
    cursor:pointer; transition:all .2s;
}
.nav-btn:hover:not(:disabled){ border-color:var(--blue); color:var(--blue); }
.nav-btn:disabled{ opacity:.28; cursor:default; }
.oversigt-liste{ display:flex; flex-wrap:wrap; gap:7px; }
.opg-chip{
    display:flex; align-items:center; gap:7px;
    background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1); color:var(--muted);
    padding:6px 12px; border-radius:18px; font-size:0.82rem; font-family:inherit;
    cursor:pointer; transition:all .18s; text-align:left;
}
.opg-chip:hover{ border-color:var(--blue); color:var(--main); }
.opg-chip.aktiv{ background:rgba(59,130,246,0.18); border-color:var(--blue); color:#bfdbfe; font-weight:bold; }
.opg-chip.loest{ border-color:rgba(16,185,129,0.45); }
.chip-nr{
    background:rgba(255,255,255,0.1); border-radius:50%; width:19px; height:19px;
    display:flex; align-items:center; justify-content:center; font-size:0.71rem; flex-shrink:0;
}
.opg-chip.aktiv .chip-nr{ background:var(--blue); color:#fff; }
.chip-ok{ color:var(--green); font-weight:bold; }
.chip-niv{ font-size:0.65rem; padding:1px 6px; border-radius:10px; }

/* ── OPLYSTE DATA I ET TRIN ── */
.data-boks{
    background:rgba(167,139,250,0.08); border:1px solid rgba(167,139,250,0.22);
    border-radius:8px; padding:11px 13px; margin-bottom:14px;
}
.data-lab{ font-size:0.71rem; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.data-krop{ font-size:0.97rem; line-height:1.75; }

/* ── OPGAVEKORT ── */
.opg-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
.opg-titel{ font-size:1.25rem; font-weight:bold; color:#fff; }
.opg-mærkat{
    font-size:0.72rem; text-transform:uppercase; letter-spacing:1px;
    padding:3px 10px; border-radius:20px; white-space:nowrap;
}
.niv1{ background:rgba(16,185,129,0.15); color:#6ee7b7; border:1px solid rgba(16,185,129,0.35); }
.niv2{ background:rgba(251,191,36,0.15); color:#fcd34d; border:1px solid rgba(251,191,36,0.35); }
.niv3{ background:rgba(239,68,68,0.15);  color:#fca5a5; border:1px solid rgba(239,68,68,0.35); }

.reaktion{
    text-align:center; font-size:1.15rem; font-weight:bold; color:#fff;
    background:rgba(59,130,246,0.08); border:1px solid rgba(59,130,246,0.2);
    border-radius:8px; padding:12px 10px; margin:12px 0;
    overflow-x:auto; white-space:nowrap;
}
.pil{ color:var(--blue); margin:0 10px; display:inline-block; animation:pulsPil 2.4s ease-in-out infinite; }
@keyframes pulsPil{ 0%,100%{ transform:scale(1); opacity:.85 } 50%{ transform:scale(1.18); opacity:1 } }

.opg-tekst{ font-size:0.95rem; line-height:1.65; color:#e5e7eb; }
.opg-tekst b{ color:#fff; }
.opg-spm{
    margin-top:12px; padding:11px 14px;
    background:rgba(167,139,250,0.09); border-left:3px solid var(--purple);
    border-radius:0 8px 8px 0; font-size:0.95rem; line-height:1.6;
}

/* ── TRINHOVED ── */
.step-num{
    background:var(--blue); color:#fff; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:0.82rem; flex-shrink:0; margin-top:2px; transition:background .3s;
}
.step-card.done .step-num{ background:var(--green); }
.step-title{ font-size:0.99rem; font-weight:bold; line-height:1.3; }
.step-sub{ font-size:0.8rem; color:var(--muted); margin-top:3px; line-height:1.45; }

/* ── MULTIPLE CHOICE ── */
.mc-liste{ display:flex; flex-direction:column; gap:8px; }
.mc-opt{
    display:flex; align-items:center; gap:11px;
    background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.1);
    border-radius:8px; padding:10px 13px; cursor:pointer; transition:all .18s;
}
.mc-opt:hover{ border-color:var(--blue); background:rgba(59,130,246,0.07); }
.mc-opt input{ accent-color:var(--blue); width:16px; height:16px; flex-shrink:0; cursor:pointer; }
.mc-opt.facit{ border-color:var(--green); background:rgba(16,185,129,0.1); }
/* Almindeligt tekstflow — ikke flex. Ellers bliver <b> og <sub> til selvstændige
   flex-elementer, og sætningerne brækker i stykker. */
.mc-krop{ display:block; flex:1; min-width:0; font-size:1rem; line-height:1.7; }

/* ── BRØK ── */
.fraction{ display:inline-flex; flex-direction:column; align-items:stretch; vertical-align:middle; }
.frac-top{ padding:0 9px 4px; border-bottom:2px solid rgba(255,255,255,0.6); text-align:center; white-space:nowrap; }
.frac-bot{ padding:4px 9px 0; text-align:center; white-space:nowrap; }
.kc-mærke{ font-weight:bold; white-space:nowrap; }

/* ── SKEMA ── */
.skema-wrap{ overflow-x:auto; margin:6px 0 4px; }
.skema{ width:100%; border-collapse:collapse; font-size:0.88rem; min-width:380px; }
.skema th,.skema td{ border:1px solid rgba(255,255,255,0.12); padding:8px 9px; text-align:center; white-space:nowrap; }
.skema th{ background:rgba(255,255,255,0.05); font-size:0.85rem; }
.skema td.rowlab{ text-align:left; color:var(--muted); font-size:0.82rem; }
.skema tr.skjult td{ color:transparent; }
.skema tr.vist{ animation:fadeIn .45s ease; }
.skema tr.vist td{ color:var(--green); font-weight:bold; }
.skema tr.vist td.rowlab{ color:var(--muted); font-weight:normal; }

/* ── INPUT ── */
.in-liste{ display:flex; flex-direction:column; gap:10px; }
.in-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:1rem; }
.in-lab{ font-weight:bold; min-width:92px; }
input[type="text"]{
    width:120px; padding:8px 10px; background:rgba(0,0,0,0.45);
    border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:1rem;
    text-align:center; border-radius:7px; transition:border-color .2s;
}
input[type="text"]:focus{ outline:none; border-color:var(--blue); }
.enhed-fast{ color:var(--muted); font-weight:bold; }
select.sel{
    padding:8px 9px; background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:0.95rem; border-radius:7px; cursor:pointer;
}
select.sel:focus{ outline:none; border-color:var(--blue); }
select.sel option{ background:var(--panel); }
.mini-note{ font-size:0.78rem; color:var(--muted); margin-top:4px; font-style:italic; }

/* ── FORMELBOKS & HINT ── */
.formel-boks{
    background:rgba(59,130,246,0.06); border:1px solid rgba(59,130,246,0.18);
    border-radius:8px; padding:10px 12px; margin-bottom:13px;
}
.formel-lab{ font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
.formel-hoved{ font-size:1.02rem; text-align:center; color:#dbeafe; }
.btn-hint{
    width:100%; text-align:left; background:transparent;
    border:1px solid rgba(59,130,246,0.22); color:var(--blue);
    font-size:0.83rem; padding:6px 10px; border-radius:6px; cursor:pointer;
    margin-top:11px; transition:background .2s;
}
.btn-hint:hover{ background:rgba(59,130,246,0.1); }
.hint-box{ display:none; margin-top:8px; padding:9px 11px; background:rgba(0,0,0,0.3); border-radius:6px; }
.hint-step{ display:flex; gap:9px; padding:5px 0; font-size:0.87rem; line-height:1.55; border-bottom:1px solid rgba(255,255,255,0.05); }
.hint-step:last-child{ border-bottom:none; }
.hint-num{ color:var(--blue); font-weight:bold; flex-shrink:0; min-width:16px; }

/* ── KNAPPER & FEEDBACK ── */
.btn-check{
    width:100%; margin-top:12px; padding:10px; border:none; border-radius:8px;
    font-size:0.93rem; font-weight:bold; cursor:pointer; letter-spacing:.4px;
    background:linear-gradient(135deg,rgba(59,130,246,.8),rgba(37,99,235,.8)); color:#fff;
    transition:all .22s;
}
.btn-check:hover{ opacity:.87; transform:translateY(-1px); }

.step-feedback{ display:none; margin-top:10px; padding:9px 12px; border-radius:7px; font-size:0.87rem; line-height:1.55; animation:fadeIn .3s; }
.step-feedback.ok{  display:block; background:rgba(16,185,129,.12); border:1px solid var(--green); color:#a7f3d0; }
.step-feedback.err{ display:block; background:rgba(239,68,68,.12);  border:1px solid var(--red);   color:#fecaca; }
.step-feedback.tip{ display:block; background:rgba(251,191,36,.12); border:1px solid var(--yellow);color:#fde68a; }

#btn-next{
    display:none; width:100%; padding:13px; border:none; border-radius:8px;
    font-size:1.02rem; font-weight:bold; cursor:pointer; text-transform:uppercase; letter-spacing:1px;
    background:linear-gradient(135deg,var(--green),#059669); color:#fff;
    box-shadow:0 4px 15px rgba(16,185,129,.3); transition:all .25s;
}
#btn-next:hover{ transform:translateY(-2px); box-shadow:0 6px 20px rgba(16,185,129,.5); }

/* ── RESULTATKORT ── */
.res-titel{ font-size:1.05rem; font-weight:bold; color:var(--green); margin-bottom:12px; letter-spacing:.5px; text-transform:uppercase; }
.viz-wrap{ position:relative; width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:8px; padding:8px; }
#vizCanvas{ width:100%; height:290px; display:block; }
.viz-knap{
    background:transparent; border:1px solid rgba(255,255,255,0.18); color:var(--muted);
    font-size:0.78rem; padding:4px 12px; border-radius:16px; cursor:pointer; margin-top:8px;
}
.viz-knap:hover{ border-color:var(--blue); color:var(--blue); }

.facit-boks{ margin-top:16px; background:rgba(0,0,0,0.28); border-radius:8px; padding:14px 16px; }
.facit-h{ font-size:0.78rem; text-transform:uppercase; letter-spacing:.8px; color:var(--blue); margin:14px 0 6px; }
.facit-h:first-child{ margin-top:0; }
.facit-linje{ font-size:0.93rem; line-height:1.75; padding:2px 0 2px 12px; border-left:2px solid rgba(255,255,255,0.08); }
.facit-svar{
    margin-top:14px; padding:11px 14px; background:rgba(16,185,129,.1);
    border-left:4px solid var(--green); border-radius:0 8px 8px 0; font-size:1rem; line-height:1.7;
}
.kontrol-boks{
    margin-top:12px; padding:10px 13px; background:rgba(167,139,250,.09);
    border-left:3px solid var(--purple); border-radius:0 8px 8px 0; font-size:0.88rem; line-height:1.6;
}

/* ── MODAL ── */
.modal-overlay{
    position:fixed; inset:0; z-index:300; background:rgba(6,6,10,.82);
    backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
    background:var(--panel); border:1px solid rgba(255,255,255,0.12); border-radius:14px;
    width:100%; max-width:880px; max-height:86vh; display:flex; flex-direction:column;
    box-shadow:0 24px 60px rgba(0,0,0,.6); animation:popIn .28s cubic-bezier(.175,.885,.32,1.275);
}
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:15px 20px; border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; }
.modal-head h2{ font-size:1rem; letter-spacing:1.2px; text-transform:uppercase; color:var(--blue); }
.modal-close{
    width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15); color:#bbb; font-size:0.85rem; cursor:pointer; flex-shrink:0;
}
.modal-close:hover{ border-color:var(--red); color:var(--red); }
.modal-body{ padding:18px 22px 24px; overflow-y:auto; line-height:1.68; font-size:0.93rem; }
.modal-body h3{ color:var(--yellow); font-size:0.95rem; margin:18px 0 6px; }
.modal-body h3:first-child{ margin-top:0; }
.modal-body ul{ margin:6px 0 6px 20px; }
.modal-body li{ margin-bottom:5px; }
.modal-body .regel{
    background:rgba(59,130,246,.07); border-left:3px solid var(--blue);
    border-radius:0 8px 8px 0; padding:9px 13px; margin:9px 0;
}
.modal-body .advarsel{
    background:rgba(239,68,68,.08); border-left:3px solid var(--red);
    border-radius:0 8px 8px 0; padding:9px 13px; margin:9px 0;
}

@keyframes fadeIn{ from{ opacity:0; transform:translateY(-4px) } to{ opacity:1; transform:translateY(0) } }
@keyframes popIn{ from{ opacity:0; transform:scale(.94) } to{ opacity:1; transform:scale(1) } }

@media (max-width:620px){
    header h1{ font-size:0.92rem; }
    .in-lab{ min-width:0; }
    .card{ padding:15px 14px; }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>
    <h1>Beregninger med ligevægtskonstanter</h1>
    <div class="niveau-valg" id="niveau-valg">
        <button class="niv-btn" data-niv="0">Alle</button>
        <button class="niv-btn aktiv" data-niv="1">Niveau 1</button>
        <button class="niv-btn" data-niv="2">Niveau 2</button>
        <button class="niv-btn" data-niv="3">Niveau 3</button>
    </div>
    <div class="stats">
        <div class="stat-box">Løst: <span id="loest" class="stat-value">0</span></div>
        <div class="stat-box">Stribe: <span id="stribe" class="stat-value">0</span></div>
    </div>
    <div style="display:flex; gap:8px;">
        <button class="top-btn" onclick="visModal('teori')">Teori</button>
        <button class="top-btn gul" onclick="visModal('hjaelp')">Hjælp</button>
    </div>
</header>

<div class="page">
<div class="column">
    <div class="card" id="oversigt-kort"></div>
    <div class="card" id="opgave-kort"></div>
    <div id="trin-container"></div>
    <div class="card" id="resultat-kort" hidden></div>
    <button id="btn-next" onclick="naesteOpgave()">Næste opgave &nbsp;&#8594;</button>
</div>
</div>

<div class="modal-overlay" id="modal" hidden onclick="if(event.target===this) lukModal()">
    <div class="modal">
        <div class="modal-head">
            <h2 id="modal-titel"></h2>
            <button class="modal-close" onclick="lukModal()">&#10005;</button>
        </div>
        <div class="modal-body" id="modal-krop"></div>
    </div>
</div>

<script>
/* =====================================================================
   OPGAVEBANK
   Alle talværdier er konstrueret, så regningen bliver overskuelig.
   Fremgangsmåden er den samme som ved rigtige måledata.
   ===================================================================== */

var OPGAVER = [

/* ---------- NIVEAU 1: uden ligning ---------- */
{
    id:"n1-1", niveau:1, type:"kcFraStofmaengder",
    titel:"Nitrosylchlorid spaltes",
    temp:"462 °C", V:2.00,
    reaktanter:[{navn:"NOCl", html:"NOCl", koef:2, fase:"g"}],
    produkter: [{navn:"NO", html:"NO", koef:2, fase:"g"},
                {navn:"Cl2", html:"Cl<sub>2</sub>", koef:1, fase:"g"}],
    n:{ NOCl:0.600, NO:0.0800, Cl2:0.0400 },
    ceq:{ NOCl:0.300, NO:0.0400, Cl2:0.0200 },
    Kc:3.5556e-4,
    tekst:"Nitrosylchlorid, NOCl(g), lukkes inde i en beholder og opvarmes, indtil ligevægten har indstillet sig.",
    spm:"Bestem ligevægtskonstanten K<sub>c</sub> — med enhed."
},
{
    id:"n1-2", niveau:1, type:"kcFraStofmaengder",
    titel:"Ammoniaksyntesen",
    temp:"400 °C", V:5.00,
    reaktanter:[{navn:"N2", html:"N<sub>2</sub>", koef:1, fase:"g"},

/* =====================================================================
   TALFORMAT OG SVARKONTROL
   ===================================================================== */

/* Skriver et tal på dansk form med det ønskede antal betydende cifre. */
function tal(v, cifre){
    cifre = cifre || 3;
    if (v === 0) return "0";
    var a = Math.abs(v);
    if (a >= 0.001 && a < 100000){
        return v.toPrecision(cifre).replace(".", ",").replace("-", "−");
    }
    var eks = Math.floor(Math.log10(a));
    var man = v / Math.pow(10, eks);
    return man.toPrecision(cifre).replace(".", ",").replace("-", "−")
           + "·10<sup>" + String(eks).replace("-", "−") + "</sup>";
}

/* Hævede cifre, fx 10⁻⁴, oversættes til almindelig eksponentskrivning: ^-4 */
var HAEVEDE = { "⁰":"0", "¹":"1", "²":"2", "³":"3", "⁴":"4",
                "⁵":"5", "⁶":"6", "⁷":"7", "⁸":"8", "⁹":"9",
                "⁻":"-", "⁺":"+" };

/* Læser elevens indtastning. Både almindelige decimaltal (0,000356) og videnskabelig
   skrivemåde (3,56e-4, 3,56·10^-4, 3,56·10⁻⁴) godtages — de giver samme værdi. */
function laesTal(s){
    if (s === null || s === undefined) return NaN;
    s = String(s).toLowerCase().replace(/\s+/g, "")
                 .replace(/[−–—]/g, "-")   /* minus, en- og em-streg */
                 .replace(/,/g, ".");
    s = s.replace(/[⁰¹²³⁴-⁹⁺⁻]+/g, function(m){
        var r = "^";
        for (var i = 0; i < m.length; i++) r += HAEVEDE[m.charAt(i)];
        return r;
    });
    s = s.replace(/[·*x×]10\^?/g, "e");   /* 3.56·10^-4  →  3.56e-4 */
    s = s.replace(/^10\^/, "1e");         /* 10^-4       →  1e-4    */
    s = s.replace(/\^/g, "e");            /* 3.56e^-4    →  3.56e-4 */
    s = s.replace(/^e/, "1e");            /* ·10^-4      →  1e-4    */
    return parseFloat(s);
}

/* Sammenligner elevens svar med facit inden for 2 % relativ afvigelse. */
function taetPaa(elev, facit){
    if (isNaN(elev)) return false;
    if (facit === 0) return Math.abs(elev) < 1e-9;
    return Math.abs(elev - facit) <= Math.abs(facit) * 0.02;
}

function bland(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
}

/* =====================================================================
   KEMISK OPSKRIVNING
   ===================================================================== */

function alleArter(op){ return op.reaktanter.concat(op.produkter); }

function sideHTML(arter){
    return arter.map(function(s){
        return (s.koef > 1 ? s.koef + " " : "") + s.html + "(" + s.fase + ")";
    }).join(" + ");
}

function reaktionHTML(op){
    return sideHTML(op.reaktanter) + '<span class="pil">&#8652;</span>' + sideHTML(op.produkter);
}

function brok(taeller, naevner){
    return '<div class="fraction"><div class="frac-top">' + taeller +
           '</div><div class="frac-bot">' + naevner + '</div></div>';
}

/* Enheden for Kc: M opløftet i (sum af produktkoefficienter − sum af reaktantkoefficienter). */
function kcEksponent(op){
    var s = 0;
    op.produkter.forEach(function(a){ s += a.koef; });
    op.reaktanter.forEach(function(a){ s -= a.koef; });
    return s;
}

function kcEnhedHTML(op){
    var e = kcEksponent(op);
    if (e === 0) return "ingen enhed";
    if (e === 1) return "M";
    return "M<sup>" + String(e).replace("-", "−") + "</sup>";
}

/* Bygger ligevægtslovens højreside i forskellige varianter (til multiple choice). */
function kcUdtryk(op, variant){
    function led(s, form){
        var k = "[" + s.html + "]";
        if (form === "faktor") return (s.koef > 1 ? s.koef + "·" : "") + k;
        if (form === "ingen")  return k;
        return s.koef > 1 ? k + "<sup>" + s.koef + "</sup>" : k;
    }
    function saml(arr, form, sammen){
        return arr.map(function(s){ return led(s, form); }).join(sammen);
    }
    var P = op.produkter, R = op.reaktanter;
    switch (variant){
        case "korrekt": return brok(saml(P, "eks", " · "), saml(R, "eks", " · "));
        case "omvendt": return brok(saml(R, "eks", " · "), saml(P, "eks", " · "));
        case "faktor":  return brok(saml(P, "faktor", " · "), saml(R, "faktor", " · "));
        case "ingen":   return brok(saml(P, "ingen", " · "), saml(R, "ingen", " · "));
        case "sum":     return brok(saml(P, "eks", " + "), saml(R, "eks", " + "));
        case "kunP":    return brok(led(P[0], "eks"), saml(R, "eks", " · "));
        case "kunR":    return brok(saml(P, "eks", " · "), led(R[0], "eks"));
    }
    return "";
}

/* Ligevægtsloven skrevet på én linje — til hints, hvor en brøk fylder for meget. */
function kcFlad(op){
    function led(s){ return "[" + s.html + "]" + (s.koef > 1 ? "<sup>" + s.koef + "</sup>" : ""); }
    var P = op.produkter.map(led).join(" · ");
    var R = op.reaktanter.map(led).join(" · ");
    return "(" + P + ") / (" + R + ")";
}

/* Finder tre forkerte udtryk, der alle er forskellige fra det rigtige. */
function kcDistraktorer(op){
    var korrekt = kcUdtryk(op, "korrekt");
    var kandidater = ["omvendt", "faktor", "ingen", "sum", "kunP", "kunR"];
    var ud = [];
    for (var i = 0; i < kandidater.length && ud.length < 3; i++){
        var h = kcUdtryk(op, kandidater[i]);
        if (h !== korrekt && ud.indexOf(h) === -1) ud.push(h);
    }
    return ud;
}

/* Volumen og de målte stofmængder (til trinnet, hvor c = n/V skal bruges). */
function oplystStofmaengder(op){

            'Ved ligevægt måles følgende stofmængder:' +
            '<div class="skema-wrap" style="margin-top:8px;"><table class="skema"><tr><th>Stof</th>';
    arter.forEach(function(s){ h += '<th>' + s.html + '(' + s.fase + ')</th>'; });
    h += '</tr><tr><td class="rowlab">Stofmængde ved ligevægt</td>';
    arter.forEach(function(s){ h += '<td>' + tal(op.n[s.navn]) + ' mol</td>'; });
    return h + '</tr></table></div>';
}

/* Ligevægtskonstanten alene. */
function oplystKc(op){
    return 'K<sub>c</sub> = <b>' + op.KcHTML + '</b> ved ' + op.temp + '.';
}

/* Ligevægtskonstanten og de målte koncentrationer. */
function oplystKendte(op){
    var arter = alleArter(op);
    var linjer = Object.keys(op.kendte).map(function(k){
        var a = arter.filter(function(s){ return s.navn === k; })[0];
        return "[" + a.html + "] = <b>" + tal(op.kendte[k]) + " M</b>";
    }).join(" &nbsp;&nbsp; ");
    return oplystKc(op) + '<br>Ved ligevægt er målt: ' + linjer;
}

/* =====================================================================

   Hvert trin er et objekt: { titel, sub, html, tjek(), facit, resume, hint }

   og kan foldes ud igen ved klik på overskriften.
   ===================================================================== */

var trinListe = [];
var fejlTaeller = [];

/* Bygger et multiple-choice-felt og husker, hvilket svar der er det rigtige. */
function mcFelt(trin, nr, korrektHTML, forkerteHTML){
    var alle = bland([{h:korrektHTML, ok:true}].concat(
        forkerteHTML.map(function(f){ return {h:f, ok:false}; })
    ));
    trin.mcKorrekt = -1;
    var h = '<div class="mc-liste">';
    alle.forEach(function(o, i){
        if (o.ok) trin.mcKorrekt = i;
        h += '<label class="mc-opt" id="mc-' + nr + '-' + i + '">' +
                '<input type="radio" name="mc-' + nr + '" value="' + i + '">' +
                '<span class="mc-krop">' + o.h + '</span>' +
             '</label>';
    });
    return h + '</div>';
}

function mcValgt(nr){
    var r = document.querySelector('input[name="mc-' + nr + '"]:checked');
    return r ? parseInt(r.value, 10) : -1;
}

function hintHTML(punkter){
    return punkter.map(function(p, i){
        return '<div class="hint-step"><span class="hint-num">' + (i + 1) + '</span><span>' + p + '</span></div>';
    }).join("");
}

function visHint(nr){
    var boks = document.getElementById("hint-" + nr);
    var knap = document.getElementById("hintknap-" + nr);
    if (boks.style.display !== "block"){
        boks.style.display = "block";
        knap.innerHTML = "▼ Skjul fremgangsmåde";
    } else {
        boks.style.display = "none";
        knap.innerHTML = "▶ Vis fremgangsmåde";
    }
}

function tegnTrin(){
    var c = document.getElementById("trin-container");
    c.innerHTML = "";
    fejlTaeller = [];

    trinListe.forEach(function(t, i){
        fejlTaeller.push(0);
        var d = document.createElement("div");
        /* Kun første trin vises. De øvrige folder sig ud, efterhånden som man kommer videre. */
        d.className = "card step-card" + (i === 0 ? "" : " skjult");
        d.id = "trin-" + i;

        var krop = t.html;
        if (t.hint && t.hint.length){
            krop += '<button class="btn-hint" id="hintknap-' + i + '" onclick="visHint(' + i + ')">▶ Vis fremgangsmåde</button>' +
                    '<div class="hint-box" id="hint-' + i + '">' + hintHTML(t.hint) + '</div>';
        }
        krop += '<button class="btn-check" id="tjekknap-' + i + '" onclick="tjekTrin(' + i + ')">Tjek svar</button>' +
                '<div class="step-feedback" id="fb-' + i + '"></div>';

        d.innerHTML =
            '<div class="step-hoved-rad" onclick="skiftFold(' + i + ')">' +
                '<div class="step-num">' + (i + 1) + '</div>' +
                '<div class="step-hoved-tekst">' +
                    '<div class="step-title">' + t.titel + '</div>' +
                    '<div class="step-sub">' + t.sub + '</div>' +
                    '<div class="step-resume" id="resume-' + i + '"></div>' +
                '</div>' +
                '<div class="fold-pil"></div>' +
            '</div>' +
            '<div class="step-body">' + krop + '</div>';

        c.appendChild(d);
    });
}

/* Folder et gennemført trin ud og sammen igen. */
function skiftFold(i){
    var kort = document.getElementById("trin-" + i);
    if (!kort.classList.contains("done")) return;
    kort.classList.toggle("aaben");
}

function tjekTrin(i){
    var t  = trinListe[i];
    var fb = document.getElementById("fb-" + i);
    var r  = t.tjek();

    if (r.ok){
        fb.className = "step-feedback ok";
        fb.innerHTML = r.besked;
        document.getElementById("resume-" + i).innerHTML = "✓ &nbsp;" + (t.resume || t.facit || "");
        document.getElementById("trin-" + i).classList.add("done");
        document.getElementById("tjekknap-" + i).style.display = "none";
        laasFelter(i);

        if (i + 1 < trinListe.length){
            document.getElementById("trin-" + (i + 1)).classList.remove("skjult");
            rulTil("trin-" + (i + 1));
        } else {
            afslutOpgave();
        }
    } else {
        fejlTaeller[i]++;
        if (fejlTaeller[i] >= 3 && t.facit){
            fb.className = "step-feedback tip";
            fb.innerHTML = "<b>Facit for dette trin:</b><br>" + t.facit +
                           "<br><br>Skriv/vælg det rigtige svar, og tryk på “Tjek svar” igen.";
            if (t.mcKorrekt >= 0){
                var lab = document.getElementById("mc-" + i + "-" + t.mcKorrekt);
                if (lab) lab.classList.add("facit");
            }
        } else {
            fb.className = "step-feedback err";
            fb.innerHTML = r.besked;
        }
        stribe = 0;
        opdaterStats();
    }
}

/* Markerer et enkelt svarfelt grønt eller rødt, så delvist rigtige svar kan ses. */
function maerkFelt(id, rigtigt){
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("rigtig", "forkert");
    el.classList.add(rigtigt ? "rigtig" : "forkert");
}

/* Låser alle input og select i et gennemført trin. */
function laasFelter(i){
    var kort = document.getElementById("trin-" + i);
    Array.prototype.forEach.call(kort.querySelectorAll("input, select"), function(el){
        el.disabled = true;
    });
}

function rulTil(id){
    setTimeout(function(){
        var el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    }, 130);
}

function opdaterStats(){
    document.getElementById("loest").textContent  = antalLoest;
    document.getElementById("stribe").textContent = stribe;
    document.getElementById("stribe").style.color = stribe >= 3 ? "var(--yellow)" : "var(--green)";
}

            "Rene faste stoffer (s) og rene væsker (l) skrives ikke med. Her er alle stoffer på gasform, " +

    };

/* Enheder til rullemenuerne. Nøglen bruges som værdi, så der ikke står HTML i attributterne. */
var ENH = {
    ingen: { vis:"ingen enhed", html:"ingen enhed" },
    M:     { vis:"M",   html:"M" },
    Mm1:   { vis:"M⁻¹", html:"M<sup>−1</sup>" },
    M2:    { vis:"M²",  html:"M<sup>2</sup>" },
    Mm2:   { vis:"M⁻²", html:"M<sup>−2</sup>" },
    M3:    { vis:"M³",  html:"M<sup>3</sup>" },
    Mm3:   { vis:"M⁻³", html:"M<sup>−3</sup>" },
    mol:   { vis:"mol", html:"mol" }
};
var ENHEDER_KC = ["ingen", "M", "Mm1", "M2", "Mm2", "M3", "Mm3"];

/* Nøglen for K_c's enhed, bestemt ud fra koefficienterne. */
function kcEnhedNoegle(op){
    var e = kcEksponent(op);
    if (e === 0) return "ingen";
    if (e === 1) return "M";
    if (e === 2) return "M2";
    if (e === 3) return "M3";
    if (e === -1) return "Mm1";
    if (e === -2) return "Mm2";
    return "Mm3";
}

function enhedSelect(id, noegler){
    var h = '<select class="sel" id="' + id + '"><option value="">– vælg enhed –</option>';
    noegler.forEach(function(k){
        h += '<option value="' + k + '">' + ENH[k].vis + '</option>';
    });
    return h + '</select>';
}

    h += '</div><div class="mini-note">Brug komma som decimaltegn. Angiv 3 betydende cifre.</div>';
    t.html = h;

function trinBeregnKc(op, nr){
    var arter = alleArter(op);

        return "(" + tal(op.ceq[s.navn]) + " M)" + (s.koef > 1 ? "<sup>" + s.koef + "</sup>" : "");
    }).join(" · ");
    var indsatN = op.reaktanter.map(function(s){
        return "(" + tal(op.ceq[s.navn]) + " M)" + (s.koef > 1 ? "<sup>" + s.koef + "</sup>" : "");
    }).join(" · ");

    var t = {
        titel: "Beregn K<sub>c</sub> — og angiv enheden",
        sub:   "Både talværdi og enhed skal være rigtige.",
        hint: [
            "Indsæt de koncentrationer, du beregnede i forrige trin, i ligevægtsloven:<br>" +
                "K<sub>c</sub> = " + brok(indsat, indsatN),
            "Husk eksponenterne. Fx er (0,0400 M)<sup>2</sup> = 1,60·10<sup>−3</sup> M<sup>2</sup>.",
            "Enheden findes ved at forkorte M'erne. Den bliver M opløftet i " +
                "(summen af produkternes koefficienter − summen af reaktanternes koefficienter) = " +
                String(kcEksponent(op)).replace("-", "−") + ".",
            "Er dette tal 0, har K<sub>c</sub> <b>ingen enhed</b>. Så skriver man K<sub>c</sub> = tal (ingen enhed) — ikke bare et tal uden kommentar."

    };

             '<div class="mini-note">Talværdien kan skrives som almindeligt decimaltal eller i videnskabelig ' +
             'skrivemåde — begge dele godtages. Brug komma som decimaltegn, og angiv 3 betydende cifre.</div>';

    t.facit = "K<sub>c</sub> = " + tal(op.Kc) + " " + (enhed === "ingen enhed" ? "(ingen enhed)" : enhed);

        if (e === "")  return { ok:false, besked:"Vælg også en enhed. Et svar uden enhed er ikke fuldstændigt — " +
                                "og “ingen enhed” er et gyldigt valg, hvis M'erne går ud med hinanden." };
        var talOk   = taetPaa(v, op.Kc);
        var enhedOk = (e === kcEnhedNoegle(op));

/* =====================================================================
   NIVEAU 2 OG 3 — x-METODEN
   ===================================================================== */

/* Ændringen for et stof, udtrykt ved x. Reaktanter forbruges, produkter dannes. */
function dxFor(op, s){
    var erReaktant = op.reaktanter.indexOf(s) !== -1;
    return (erReaktant ? -1 : 1) * s.koef;
}

function dxTekst(d){
    if (d === 0)  return "0";
    var fortegn = d < 0 ? "−" : "+";
    var t = Math.abs(d);
    return fortegn + (t === 1 ? "x" : t + "x");
}

/* Udtrykket for ligevægtskoncentrationen, fx "0,200 M − x" eller "2x". */
function ligevaegtsUdtryk(op, s){
    var c0 = op.start[s.navn];
    var d  = dxFor(op, s);
    var xLed = (Math.abs(d) === 1 ? "x" : Math.abs(d) + "x");
    if (c0 === 0) return d > 0 ? xLed : "−" + xLed;
    return tal(c0) + " M " + (d < 0 ? "−" : "+") + " " + xLed;
}

/* Samme udtryk, men med x erstattet af den beregnede talværdi. */
function ligevaegtsIndsat(op, s){
    var c0 = op.start[s.navn];
    var d  = dxFor(op, s);
    var n  = Math.abs(d);
    var xVaerdi = (n === 1 ? tal(op.x) + " M" : n + " · " + tal(op.x) + " M");
    if (c0 === 0) return (d > 0 ? "" : "−") + xVaerdi;
    return tal(c0) + " M " + (d < 0 ? "−" : "+") + " " + xVaerdi;
}

function trinSkema(op, nr){
    var arter = alleArter(op);
    var t = {
        titel: "Udfyld koncentrationsskemaet",
        sub:   "Startkoncentrationerne er oplyst i skemaet. Udfyld ændringsrækken.",
        hint: [
            "Ændringerne følger koefficienterne i reaktionsskemaet: reaktanter forbruges, produkter dannes.",
            "x er knyttet til " + op.xArtHTML + ", som har koefficienten 1. Ændringen for " + op.xArtHTML + " er derfor −x.",
            "Et stof med koefficienten 2 ændres dobbelt så meget: ændringen bliver ±2x.",
            "Ligevægtskoncentrationen er start + ændring. Den udfyldes automatisk, når ændringerne er rigtige."
        ]
    };

    var h = '<div class="skema-wrap"><table class="skema"><tr><th></th>';
    arter.forEach(function(s){ h += '<th>' + s.html + '(' + s.fase + ')</th>'; });

    arter.forEach(function(s, k){
        h += '<td><select class="sel" id="dx-' + nr + '-' + k + '" style="font-size:0.9rem; padding:5px 6px;">' +
             '<option value="">?</option><option value="0">0</option>' +
             '<option value="−x">−x</option><option value="+x">+x</option>' +
             '<option value="−2x">−2x</option><option value="+2x">+2x</option>' +

    t.resume = arter.map(function(s){

    }).join(", &nbsp;");

    t.tjek = function(){

        }
        return { ok:false, besked:"De grønt markerede er rigtige. Der er stadig fejl ved: " + fejl.join(", ") + "." };
    };
    return t;
}

        if (e === "")  return { ok:false, besked:"Vælg også enheden for x." };
        var talOk = taetPaa(v, op.x);
        maerkFelt("in-" + nr + "-v", talOk);
        maerkFelt("in-" + nr + "-e", e === "M");
        if (!talOk) return { ok:false, besked:"Talværdien passer ikke. Brug “Vis fremgangsmåde”. " +
                             "Kontrollér også, at x er positiv og mindre end startkoncentrationen." };
        if (e !== "M") return { ok:false, besked:"Talværdien er rigtig, men enheden er forkert. " +
                                "x er en koncentrationsændring og måles derfor i M." };
        return { ok:true, besked:"Korrekt: x = " + tal(op.x) + " M." };
    };
    return t;
}

function trinAndengrad(op, nr){
    var t = {
        titel: "Omskriv til en andengradsligning",
        sub:   "Hvilken andengradsligning svarer ligningen til?",
        hint: [
            "Kvadratrodsmetoden kan ikke bruges her. Målet er formen &nbsp;a·x<sup>2</sup> + b·x + c = 0.",
            "Gang nævneren op på begge sider af ligningen.",
            "Gang parentesen(erne) ud.",
            "Flyt alle led over på den ene side, så der står 0 på den anden.",
            "Bemærk enhederne: leddet med x<sup>2</sup> har enheden M<sup>2</sup>, så b skal have enheden M og c enheden M<sup>2</sup>. " +
            "Er det ikke tilfældet, er der en fejl i omskrivningen."
        ]
    };
    t.html = '<div class="formel-boks"><div class="formel-lab">Din ligning fra trin ' + nr + '</div>' +
             '<div class="formel-hoved">' + op.ligningKorrekt + '</div></div>' +
             mcFelt(t, nr, op.andengradKorrekt, op.andengradForkerte);
    t.facit = op.andengradKorrekt;
    t.tjek = function(){
        var v = mcValgt(nr);
        if (v < 0) return { ok:false, besked:"Vælg en andengradsligning." };
        if (v === t.mcKorrekt){
            return { ok:true, besked:"Korrekt. Læg mærke til, at alle tre led har enheden M<sup>2</sup> — " +
                     "det er en god kontrol af, at omskrivningen er rigtig." };
        }
        return { ok:false, besked:"Ikke korrekt. Gang nævneren op, gang parentesen ud, og saml leddene. " +
                 "Kontrollér fortegnene, når du flytter led over på den anden side." };
    };
    return t;
}

function trinRoedder(op, nr){
    var t = {
        titel: "Løs andengradsligningen og vælg den brugbare løsning",
        sub:   "Begge løsninger skal beregnes.",
        hint: [
            "Kun den ene løsning giver kemisk mening — og du skal kunne begrunde hvorfor.",
            "Diskriminanten er d = b<sup>2</sup> − 4ac. Enheden bliver M<sup>2</sup>, så d<sup>1/2</sup> har enheden M.",
            "Løsningsformlen er x = (−b ± d<sup>1/2</sup>) / (2a).",
            "Begge løsninger skal beregnes og skrives ned — også den, du ender med at forkaste.",
            "En løsning forkastes, hvis den giver en negativ koncentration eller en negativ koncentrationsændring. " +
            "Skriv begrundelsen ned i din besvarelse."
        ]
    };
    t.html = '<div class="in-liste">' +
             '<div class="in-row"><span class="in-lab">x<sub>1</sub> =</span>' +
             '<input type="text" id="in-' + nr + '-a" autocomplete="off">' +
             '<span class="enhed-fast">M</span></div>' +
             '<div class="in-row"><span class="in-lab">x<sub>2</sub> =</span>' +
             '<input type="text" id="in-' + nr + '-b" autocomplete="off">' +
             '<span class="enhed-fast">M</span></div></div>' +
             '<div class="step-sub" style="margin:14px 0 8px;">Hvilken løsning kan bruges — og hvorfor?</div>' +
             mcFelt(t, nr, op.rodValgKorrekt, op.rodValgForkerte);
    t.facit = "x<sub>1</sub> = " + tal(op.x1) + " M &nbsp;og&nbsp; x<sub>2</sub> = " + tal(op.x2) + " M.<br>" + op.rodValgKorrekt;
    t.resume = "x = " + tal(op.x) + " M &nbsp;(den anden løsning forkastet)";
    t.tjek = function(){
        var a = laesTal(document.getElementById("in-" + nr + "-a").value);
        var b = laesTal(document.getElementById("in-" + nr + "-b").value);
        /* Rækkefølgen er ligegyldig: hvert felt markeres, hvis det rammer én af de to løsninger. */
        var aOk = taetPaa(a, op.x1) || taetPaa(a, op.x2);
        var bOk = taetPaa(b, op.x1) || taetPaa(b, op.x2);
        if (!isNaN(a)) maerkFelt("in-" + nr + "-a", aOk);
        if (!isNaN(b)) maerkFelt("in-" + nr + "-b", bOk);
        if (isNaN(a) || isNaN(b)) return { ok:false, besked:"Indtast begge løsninger — også den, der skal forkastes." };
        var parOk = (taetPaa(a, op.x1) && taetPaa(b, op.x2)) || (taetPaa(a, op.x2) && taetPaa(b, op.x1));
        if (!parOk) return { ok:false, besked:(aOk || bOk ? "Den grønt markerede løsning er rigtig. " : "") +
                             "Kontrollér diskriminanten d = b<sup>2</sup> − 4ac " +
                             "og løsningsformlen x = (−b ± d<sup>1/2</sup>)/(2a)." };
        var v = mcValgt(nr);
        if (v < 0) return { ok:false, besked:"Løsningerne er rigtige. Vælg nu, hvilken af dem der kan bruges, og hvorfor." };
        if (v !== t.mcKorrekt) return { ok:false, besked:"Løsningerne er rigtige, men begrundelsen holder ikke. " +
                                        "Sæt hver løsning ind i skemaets nederste række, og se, om nogen koncentration bliver negativ." };
        return { ok:true, besked:"Korrekt. " + op.rodValgKorrekt };
    };
    return t;
}

function trinLigevaegtskoncentrationer(op, nr){

        ]
    };
    var h = '<div class="in-liste">';

    t.resume = arter.map(function(s){ return "[" + s.html + "] = " + tal(op.ceq[s.navn]) + " M"; }).join(", &nbsp;");

function byggeTrin(op){
    var t = [];
    if (op.type === "kcFraStofmaengder"){
        t.push(trinLigevaegtslov(op, 0));
        t.push(trinKoncentrationer(op, 1));
        t.push(trinBeregnKc(op, 2));
    } else if (op.type === "isolerKoncentration"){
        t.push(trinLigevaegtslov(op, 0));
        t.push(trinIsoler(op, 1));
        t.push(trinBeregnUkendt(op, 2));
    } else if (op.type === "ligningX"){
        t.push(trinLigevaegtslov(op, 0));
        t.push(trinDefinerX(op, 1));
        t.push(trinSkema(op, 2));
        t.push(trinOpstilLigning(op, 3));
        if (op.metode === "andengrad"){
            t.push(trinAndengrad(op, 4));
            t.push(trinRoedder(op, 5));
            t.push(trinLigevaegtskoncentrationer(op, 6));
        } else {
            t.push(trinBeregnX(op, 4));
            t.push(trinLigevaegtskoncentrationer(op, 5));
        }
    }
    return t;
}

/* Genberegner Kc ud fra ligevægtskoncentrationerne — kontrollen til sidst. */
function kcAfKoncentrationer(op){
    var t = 1, n = 1;
    op.produkter.forEach(function(s){ t *= Math.pow(op.ceq[s.navn], s.koef); });
    op.reaktanter.forEach(function(s){ n *= Math.pow(op.ceq[s.navn], s.koef); });
    return t / n;
}

/* =====================================================================
   ANIMATION AF KONCENTRATIONERNE
   Niveau 2 og 3: koncentration som funktion af tiden, fra start til ligevægt.
   Niveau 1: søjlediagram over ligevægtskoncentrationerne.
   ===================================================================== */

var FARVER = ["#4cc9f0", "#4ade80", "#fbbf24", "#a78bfa", "#ef476f", "#f472b6"];
var viz = { arter:[], tilstand:"soejler", start:0, koerer:false };

/* Fjerner HTML-mærker, så navnet kan tegnes på canvas. */
function rentNavn(html){
    return html.replace(/<sub>/g, "").replace(/<\/sub>/g, "")
               .replace(/<sup>/g, "").replace(/<\/sup>/g, "")
               .replace(/<[^>]+>/g, "");
}

function startViz(){
    var op = aktuel;
    if (!op) return;
    viz.arter = alleArter(op).map(function(s, i){
        return {
            navn:  rentNavn(s.html),
            farve: FARVER[i % FARVER.length],
            c0:    op.start ? op.start[s.navn] : op.ceq[s.navn],
            ceq:   op.ceq[s.navn]
        };
    });
    viz.tilstand = op.start ? "kurver" : "soejler";
    viz.start = performance.now();
    if (!viz.koerer){ viz.koerer = true; requestAnimationFrame(vizLoop); }
}

function vizLoop(nu){
    var c = document.getElementById("vizCanvas");
    if (!c){ viz.koerer = false; return; }
    var p = Math.min(1, (nu - viz.start) / 2600);
    tegnViz(c, p);
    if (p < 1){ requestAnimationFrame(vizLoop); } else { viz.koerer = false; }
}

function tegnViz(c, p){
    var dpr = window.devicePixelRatio || 1;
    var b = c.clientWidth, h = c.clientHeight;
    if (c.width !== Math.round(b * dpr) || c.height !== Math.round(h * dpr)){
        c.width  = Math.round(b * dpr);
        c.height = Math.round(h * dpr);
    }
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, b, h);

    var mV = 58, mH = 34, mT = 14, mB = 34;
    var bx = b - mV - mH, by = h - mT - mB;
    if (bx <= 10 || by <= 10) return;

    var cmax = 0;
    viz.arter.forEach(function(a){ cmax = Math.max(cmax, a.c0, a.ceq); });
    cmax = cmax * 1.18 || 1;

    /* Akser og gitter */
    g.strokeStyle = "rgba(255,255,255,0.13)";
    g.fillStyle   = "#9ca3af";
    g.font        = "11px Segoe UI, sans-serif";
    g.lineWidth   = 1;
    for (var i = 0; i <= 4; i++){
        var y = mT + by - (by * i / 4);
        g.beginPath(); g.moveTo(mV, y); g.lineTo(mV + bx, y); g.stroke();
        g.textAlign = "right"; g.textBaseline = "middle";
        g.fillText((cmax * i / 4).toFixed(2).replace(".", ","), mV - 7, y);
    }
    g.strokeStyle = "rgba(255,255,255,0.3)";
    g.beginPath(); g.moveTo(mV, mT); g.lineTo(mV, mT + by); g.lineTo(mV + bx, mT + by); g.stroke();

    g.save();
    g.translate(13, mT + by / 2); g.rotate(-Math.PI / 2);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = "#9ca3af";
    g.fillText("c / M", 0, 0);
    g.restore();

    if (viz.tilstand === "kurver"){
        g.textAlign = "center"; g.textBaseline = "top";
        g.fillText("tid", mV + bx / 2, mT + by + 9);

        var T = 100, tau = 20;
        viz.arter.forEach(function(a){
            g.strokeStyle = a.farve;
            g.lineWidth = 2.4;
            g.beginPath();
            var n = 140, sidsteX = mV, sidsteY = mT + by;
            for (var k = 0; k <= n; k++){
                var t = (T * p) * k / n;
                var cv = a.ceq + (a.c0 - a.ceq) * Math.exp(-t / tau);
                var X = mV + bx * (t / T);
                var Y = mT + by - by * (cv / cmax);
                if (k === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
                sidsteX = X; sidsteY = Y;
            }
            g.stroke();
            g.fillStyle = a.farve;
            g.beginPath(); g.arc(sidsteX, sidsteY, 3.5, 0, Math.PI * 2); g.fill();
            if (p > 0.55){
                g.globalAlpha = Math.min(1, (p - 0.55) / 0.3);
                g.textAlign = "left"; g.textBaseline = "middle";
                g.fillText(a.navn, Math.min(sidsteX + 7, mV + bx - 4), sidsteY);
                g.globalAlpha = 1;
            }
        });

        if (p >= 1){
            g.fillStyle = "#9ca3af";
            g.textAlign = "right"; g.textBaseline = "bottom";
            g.fillText("ligevægt indstillet", mV + bx - 4, mT + 12);
        }
    } else {
        var n2 = viz.arter.length;
        var bredde = Math.min(62, (bx / n2) * 0.56);
        viz.arter.forEach(function(a, i){
            var cx = mV + bx * (i + 0.5) / n2;
            var hoejde = by * (a.ceq / cmax) * p;
            g.fillStyle = a.farve;
            g.globalAlpha = 0.85;
            g.fillRect(cx - bredde / 2, mT + by - hoejde, bredde, hoejde);
            g.globalAlpha = 1;
            g.fillStyle = "#f3f4f6";
            g.textAlign = "center"; g.textBaseline = "bottom";
            g.font = "bold 11px Segoe UI, sans-serif";
            if (p > 0.6) g.fillText(a.ceq.toPrecision(3).replace(".", ",") + " M", cx, mT + by - hoejde - 5);
            g.fillStyle = "#9ca3af";
            g.font = "11px Segoe UI, sans-serif";
            g.textBaseline = "top";
            g.fillText(a.navn, cx, mT + by + 8);
        });
    }
}

window.addEventListener("resize", function(){
    var c = document.getElementById("vizCanvas");
    if (c && viz.arter.length) tegnViz(c, 1);
});

/* =====================================================================
   BAGGRUNDSANIMATION
   ===================================================================== */

(function baggrund(){
    var c = document.getElementById("bgCanvas");
    var g = c.getContext("2d");
    var partikler = [];

    function nulstil(){
        c.width  = window.innerWidth;
        c.height = window.innerHeight;
    }
    nulstil();
    window.addEventListener("resize", nulstil);

    for (var i = 0; i < 34; i++){
        partikler.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: 1 + Math.random() * 2.4,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            f: FARVER[i % FARVER.length]
        });
    }

    function tegn(){
        g.clearRect(0, 0, c.width, c.height);
        partikler.forEach(function(p){
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = c.width;  if (p.x > c.width)  p.x = 0;
            if (p.y < 0) p.y = c.height; if (p.y > c.height) p.y = 0;
            g.globalAlpha = 0.16;
            g.fillStyle = p.f;
            g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI * 2); g.fill();
        });
        g.globalAlpha = 1;
        requestAnimationFrame(tegn);
    }
    tegn();

/* =====================================================================

   ===================================================================== */

function fyldListe(){
    opgaveListe = OPGAVER.filter(function(o){ return valgtNiveau === 0 || o.niveau === valgtNiveau; });
}

/* Oversigten over niveauets opgaver — man kan springe frit frem og tilbage. */
function tegnOversigt(){
    var navn = valgtNiveau === 0 ? "Alle niveauer" : "Niveau " + valgtNiveau;
    var h = '<div class="oversigt-top">' +
                '<div class="oversigt-titel">' + navn + ' &middot; opgave ' +
                    (aktuelIndex + 1) + ' af ' + opgaveListe.length + '</div>' +
                '<div class="oversigt-nav">' +
                    '<button class="nav-btn" onclick="spol(-1)"' +
                        (aktuelIndex === 0 ? ' disabled' : '') + '>&#8249; Forrige</button>' +
                    '<button class="nav-btn" onclick="spol(1)"' +
                        (aktuelIndex === opgaveListe.length - 1 ? ' disabled' : '') + '>Næste &#8250;</button>' +
                '</div>' +
            '</div><div class="oversigt-liste">';

    opgaveListe.forEach(function(o, i){
        h += '<button class="opg-chip' + (i === aktuelIndex ? ' aktiv' : '') +
                (loeste[o.id] ? ' loest' : '') + '" onclick="visOpgave(' + i + ')">' +
                '<span class="chip-nr">' + (i + 1) + '</span>' +
                (valgtNiveau === 0 ? '<span class="chip-niv niv' + o.niveau + '">N' + o.niveau + '</span>' : '') +
                '<span>' + o.titel + '</span>' +
                (loeste[o.id] ? '<span class="chip-ok">&#10003;</span>' : '') +
             '</button>';
    });
    document.getElementById("oversigt-kort").innerHTML = h + '</div>';
}

/* Viser opgave nr. i på det valgte niveau og nulstiller alle trin. */
function visOpgave(i){
    if (i < 0 || i >= opgaveListe.length) return;
    aktuelIndex = i;
    aktuel = opgaveListe[i];

    document.getElementById("resultat-kort").hidden = true;
    document.getElementById("resultat-kort").innerHTML = "";
    document.getElementById("btn-next").style.display = "none";

    tegnOversigt();
    tegnOpgaveKort(aktuel);
    trinListe = byggeTrin(aktuel);
    tegnTrin();
    window.scrollTo({ top:0, behavior:"smooth" });
}

function spol(retning){ visOpgave(aktuelIndex + retning); }

/* Knappen under en løst opgave: videre til den næste, og forfra efter den sidste. */
function naesteOpgave(){
    visOpgave((aktuelIndex + 1) % opgaveListe.length);
}

Array.prototype.forEach.call(document.querySelectorAll(".niv-btn"), function(b){
    b.addEventListener("click", function(){
        Array.prototype.forEach.call(document.querySelectorAll(".niv-btn"), function(x){
            x.classList.remove("aktiv");
        });
        b.classList.add("aktiv");
        valgtNiveau = parseInt(b.getAttribute("data-niv"), 10);
        fyldListe();
        visOpgave(0);
    });
});
