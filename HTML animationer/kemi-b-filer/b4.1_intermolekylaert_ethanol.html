<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethanol: Stærkere London-kræfter</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        h1 { margin-bottom: 5px; color: #2c3e50; }
        p { margin-bottom: 20px; color: #555; max-width: 700px; text-align: center; line-height:1.5; }

        .main-container {
            display: flex;
            gap: 25px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            flex-wrap: wrap;
            justify-content: center;
        }

        .canvas-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            border: 8px solid #607D8B;
            background: radial-gradient(circle, #ffffff 40%, #eceff1 100%);
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        canvas { display: block; width: 100%; height: 100%; }

        .controls-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .slider-card {
            background: #fff3e0;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ffe0b2;
            text-align: center;
        }

        .temp-display { font-size: 24px; font-weight: 900; color: #d32f2f; margin: 10px 0; }
        input[type=range] { width: 100%; cursor: pointer; }

        .legend {
            background: #fafafa; padding: 15px; border-radius: 10px; font-size: 13px; border: 1px solid #eee;
        }
        .legend-item { display: flex; align-items: center; margin-bottom: 8px; }
        
        .line-h { width: 25px; height: 0; border-top: 3px dashed red; margin-right: 8px; }
        .line-london { width: 25px; height: 0; border-top: 3px dotted #555; margin-right: 8px; } /* Gjort mørkere/tykkere */

        .toggles { display: flex; gap: 10px; flex-direction: column; }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; font-weight: 500; font-size: 14px;}
        .checkbox-label input { margin-right: 10px; width: 18px; height: 18px; }

    </style>
</head>
<body>

    <h1>Ethanol: Bindinger i Balance</h1>
    <p>Nu er London-kræfterne (mellem halerne) stærkere, så du tydeligt kan se, at de upolære ender også søger sammen.</p>

    <div class="main-container">
        <div class="canvas-wrapper">
            <canvas id="simCanvas" width="500" height="500"></canvas>
        </div>

        <div class="controls-panel">
            <div class="slider-card">
                <label style="font-weight:600; color:#d84315;">Temperatur</label>
                <input type="range" id="tempSlider" min="0" max="100" value="20">
                <div class="temp-display"><span id="tempValue">Lav (Væske)</span></div>
            </div>

            <div class="toggles">
                <label class="checkbox-label">
                    <input type="checkbox" id="checkH" checked>
                    Vis Hydrogenbindinger (Rød)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="checkL" checked>
                    Vis London-kræfter (Grå)
                </label>
            </div>

            <div class="legend">
                <strong>Signaturforklaring:</strong>
                <div class="legend-item" style="margin-top:8px;">
                    <div class="line-h"></div>
                    <div>
                        <strong>Hydrogenbinding</strong><br>
                        <span style="color:#d32f2f; font-size:11px;">Stærk tiltrækning (O ↔ H)</span>
                    </div>
                </div>
                <div class="legend-item">
                    <div class="line-london"></div>
                    <div>
                        <strong>London-kraft</strong><br>
                        <span style="color:#555; font-size:11px;">Mellem-stærk (Hale ↔ Hale)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
window.onload = function() {
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    let currentTemp = 20;
    let showHBonds = true;
    let showLondon = true;
    
    // Antal molekyler
    const numMolecules = 10; 
    let molecules = [];

    // Ethanol struktur
    const ethanolStructure = [
        { t: 'C_Tail', x: -20, y: 2, r: 10, col: '#37474F' }, 
        { t: 'C', x: 0, y: 0, r: 10, col: '#37474F' },   
        { t: 'H_C', x: -28, y: -8, r: 6, col: '#f5f5f5' }, 
        { t: 'H_C', x: -28, y: 12, r: 6, col: '#f5f5f5' },
        { t: 'H_C', x: -10, y: 20, r: 6, col: '#f5f5f5' }, 
        { t: 'H_C', x: 10, y: 18, r: 6, col: '#f5f5f5' },
        { t: 'H_C', x: -10, y: -18, r: 6, col: '#f5f5f5' },
        { t: 'O', x: 22, y: -8, r: 11, col: '#ff5252' }, 
        { t: 'H_O', x: 32, y: 4, r: 7, col: '#ffffff', border: '#ff5252' } 
    ];

    class Molecule {
        constructor() {
            this.x = Math.random() * (width - 100) + 50;
            this.y = Math.random() * (height - 100) + 50;
            
            // Lav hastighed
            this.vx = (Math.random() - 0.5) * 0.2; 
            this.vy = (Math.random() - 0.5) * 0.2;
            
            this.angle = Math.random() * Math.PI * 2;
            this.spin = (Math.random() - 0.5) * 0.01; 
            this.radius = 45; 
        }

        update() {
            // Slow motion logic
            let speedFactor = currentTemp / 45; 
            if(speedFactor < 0.15) speedFactor = 0.15; 

            this.x += this.vx * speedFactor;
            this.y += this.vy * speedFactor;
            this.angle += this.spin * Math.sqrt(speedFactor);

            // Bounce
            let dx = this.x - width/2;
            let dy = this.y - height/2;
            let distFromCenter = Math.sqrt(dx*dx + dy*dy);
            if (distFromCenter + this.radius > width/2) {
                let angleToCenter = Math.atan2(dy, dx);
                this.vx = -Math.cos(angleToCenter) * Math.abs(this.vx);
                this.vy = -Math.sin(angleToCenter) * Math.abs(this.vy);
                this.x -= Math.cos(angleToCenter) * 2;
                this.y -= Math.sin(angleToCenter) * 2;
            }
            
            this.x += (Math.random()-0.5)*speedFactor*0.3;
            this.y += (Math.random()-0.5)*speedFactor*0.3;
        }

        getAtomAbsPos(atomDef) {
            let rotatedX = atomDef.x * Math.cos(this.angle) - atomDef.y * Math.sin(this.angle);
            let rotatedY = atomDef.x * Math.sin(this.angle) + atomDef.y * Math.cos(this.angle);
            return { x: this.x + rotatedX, y: this.y + rotatedY };
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.angle);

            ctx.strokeStyle = "rgba(0,0,0,0.4)";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(ethanolStructure[0].x, ethanolStructure[0].y);
            ctx.lineTo(ethanolStructure[1].x, ethanolStructure[1].y);
            ctx.lineTo(ethanolStructure[7].x, ethanolStructure[7].y);
            ctx.lineTo(ethanolStructure[8].x, ethanolStructure[8].y);
            ctx.stroke();

            ethanolStructure.forEach(atom => {
                ctx.beginPath();
                ctx.arc(atom.x, atom.y, atom.r, 0, Math.PI*2);
                ctx.fillStyle = atom.col;
                ctx.fill();
                if(atom.border) { ctx.strokeStyle = atom.border; ctx.lineWidth = 2; ctx.stroke(); } 
                else { ctx.strokeStyle = "rgba(0,0,0,0.2)"; ctx.lineWidth = 1; ctx.stroke(); }
            });
            ctx.restore();
        }
    }

    function animate() {
        ctx.clearRect(0, 0, width, height);
        
        molecules.forEach(m => m.update());

        for (let i = 0; i < molecules.length; i++) {
            for (let j = i + 1; j < molecules.length; j++) {
                let molA = molecules[i];
                let molB = molecules[j];

                // HYDROGEN BINDINGER (Rød)
                // STYRKE: 2.5 (Op fra 2.0)
                // RANGE: 85 (Lidt mere tolerant)
                if (showHBonds) {
                    let O_A = molA.getAtomAbsPos(ethanolStructure[7]);
                    let H_A = molA.getAtomAbsPos(ethanolStructure[8]);
                    let O_B = molB.getAtomAbsPos(ethanolStructure[7]);
                    let H_B = molB.getAtomAbsPos(ethanolStructure[8]);
                    
                    applyForceAndDraw(O_A, H_B, molA, molB, 'red', 2.5, 85); 
                    applyForceAndDraw(O_B, H_A, molB, molA, 'red', 2.5, 85); 
                }

                // LONDON BINDINGER (Grå)
                // STYRKE: 1.4 (Op fra 0.6 - Kæmpe boost)
                // RANGE: 115 (Op fra 100 - Griber tidligere fat)
                if (showLondon) {
                    let C_A = molA.getAtomAbsPos(ethanolStructure[0]);
                    let C_B = molB.getAtomAbsPos(ethanolStructure[0]);
                    
                    applyForceAndDraw(C_A, C_B, molA, molB, 'london', 1.4, 115); 
                }
            }
        }

        molecules.forEach(m => m.draw());
        requestAnimationFrame(animate);
    }

    // Funktion med variabel Range og Styrke
    function applyForceAndDraw(pos1, pos2, mol1, mol2, type, strengthFactor, baseRange) {
        let dx = pos1.x - pos2.x;
        let dy = pos1.y - pos2.y;
        let distSq = dx*dx + dy*dy;
        
        // Temp modifikation: Høj varme reducerer rækkevidden (bliver sværere at binde)
        let tempMod = currentTemp * 0.5;
        let threshold = baseRange - tempMod; 

        if (distSq < threshold * threshold && distSq > 100) {
            
            if (type === 'red') {
                ctx.strokeStyle = "rgba(255, 0, 0, 0.8)"; 
                ctx.lineWidth = 3; 
                ctx.setLineDash([5, 5]);
            } else {
                // Gjort linjen mørkere og mere tydelig
                ctx.strokeStyle = "rgba(80, 80, 80, 0.6)"; 
                ctx.lineWidth = 3; 
                ctx.setLineDash([3, 5]); 
            }
            
            ctx.beginPath();
            ctx.moveTo(pos1.x, pos1.y);
            ctx.lineTo(pos2.x, pos2.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // Physics: Tiltrækning
            // Jo lavere temp, jo stærkere træk
            let forceStrength = (100 - currentTemp) * 0.00003 * strengthFactor;
            let angle = Math.atan2(dy, dx);
            
            mol1.vx -= Math.cos(angle) * forceStrength;
            mol1.vy -= Math.sin(angle) * forceStrength;
            mol2.vx += Math.cos(angle) * forceStrength;
            mol2.vy += Math.sin(angle) * forceStrength;
        }
    }

    document.getElementById('checkH').onchange = function() { showHBonds = this.checked; };
    document.getElementById('checkL').onchange = function() { showLondon = this.checked; };

    const slider = document.getElementById('tempSlider');
    const tempVal = document.getElementById('tempValue');
    slider.oninput = function() {
        currentTemp = parseInt(this.value);
        if(currentTemp < 30) tempVal.innerText = "Lav (Væske)";
        else if(currentTemp < 70) tempVal.innerText = "Mellem (Koger)";
        else tempVal.innerText = "Høj (Damp)";
    };

    for(let i=0; i<numMolecules; i++) molecules.push(new Molecule());
    animate();
};
</script>
</body>
</html>
