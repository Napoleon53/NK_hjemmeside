<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Turnering er flyttet</title>
<link rel="canonical" href="https://simdeme.github.io/mg-elev/vaerktoejer/turnering/">
<style>body{font-family:system-ui,sans-serif;max-width:32rem;margin:3rem auto;padding:0 1rem;line-height:1.5}</style>
</head>
<body>
<p>Turnering er flyttet til <a id="ny" href="https://simdeme.github.io/mg-elev/vaerktoejer/turnering/">MG Intern</a>.</p>
<script>
// Sender videre til MG Intern. Gemte data i browseren følger med som #flyt=... og gemmes dér én gang.
(function(){
  var ny = 'https://simdeme.github.io/mg-elev/vaerktoejer/turnering/', standard = '', noegler = ["mg_turnering_v1"], data = {}, n = 0;
  try {
    noegler.forEach(function(k){ var v = localStorage.getItem(k); if (v !== null) { data[k] = v; n++; } });
  } catch(e){}
  var url = ny + location.search + (n ? '#flyt=' + encodeURIComponent(JSON.stringify(data)) : (location.hash || standard));
  document.getElementById('ny').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
