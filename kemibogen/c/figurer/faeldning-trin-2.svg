<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="780" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 2. De fire ioner står på række. En bue forbinder Pb 2 plus og I minus, som er tungtopløselige og danner bundfald. En stiplet bue forbinder K plus og NO3 minus, som er letopløselige">
<title>Trin 2. De fire ioner står på række. En bue forbinder Pb 2 plus og I minus, som er tungtopløselige og danner bundfald. En stiplet bue forbinder K plus og NO3 minus, som er letopløselige</title>
<text x="170.0" y="104.0" font-size="24" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>Pb</tspan><tspan dy="-9.12" font-size="16.3">2+</tspan></text><text x="310.0" y="104.0" font-size="24" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>NO</tspan><tspan dy="5.28" font-size="16.3">3</tspan><tspan dy="-14.40" font-size="16.3">−</tspan></text><text x="470.0" y="104.0" font-size="24" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>K</tspan><tspan dy="-9.12" font-size="16.3">+</tspan></text><text x="610.0" y="104.0" font-size="24" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>I</tspan><tspan dy="-9.12" font-size="16.3">−</tspan></text><path d="M 170,78 Q 390,2 610,78" fill="none" stroke="#0f766e" stroke-width="3"/><path d="M 310,78 Q 390,46 470,78" fill="none" stroke="#556766" stroke-width="2" stroke-dasharray="6 5"/><text x="390.0" y="32.0" font-size="14.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>tungtopløseligt: bundfald</tspan></text><text x="390.0" y="82.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>letopløseligt</tspan></text><rect x="140.0" y="156.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="160.0" y="180.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Pb</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70"> og I</tspan><tspan dy="-5.70" font-size="10.2">−</tspan><tspan dy="5.70">: tungtopløseligt i tabellen</tspan></text><text x="160.0" y="202.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>K</tspan><tspan dy="-5.70" font-size="10.2">+</tspan><tspan dy="5.70"> og NO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-9.00" font-size="10.2">−</tspan><tspan dy="5.70">: letopløseligt i tabellen</tspan></text><text x="160.0" y="226.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Bundfaldet består af Pb</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70"> og I</tspan><tspan dy="-5.70" font-size="10.2">−</tspan><tspan dy="5.70">.</tspan></text>
</svg>
