<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 216" width="780" height="216" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre trin efter hinanden. Strøm fra sol og vind bruges til at spalte vand til hydrogen og oxygen. Hydrogenet reagerer med carbondioxid, der er fanget fra røg, og bliver til methanol, som kan bruges som brændstof til skibe og fly">
<title>Tre trin efter hinanden. Strøm fra sol og vind bruges til at spalte vand til hydrogen og oxygen. Hydrogenet reagerer med carbondioxid, der er fanget fra røg, og bliver til methanol, som kan bruges som brændstof til skibe og fly</title>
<rect x="30.0" y="78.0" width="150.0" height="74.0" rx="12" fill="#fdf3d6" stroke="#e2c56f" stroke-width="1.3"/><text x="105.0" y="108.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Strøm</tspan></text><text x="105.0" y="132.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>fra sol og vind</tspan></text><rect x="236.0" y="78.0" width="190.0" height="74.0" rx="12" fill="#e6f0f9" stroke="#c5d9ec" stroke-width="1.3"/><text x="331.0" y="108.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Vand spaltes</tspan></text><text x="331.0" y="132.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>2 H</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97">O → 2 H</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97"> + O</tspan><tspan dy="2.97" font-size="9.2">2</tspan></text><rect x="498.0" y="78.0" width="252.0" height="74.0" rx="12" fill="#e3f2e1" stroke="#b7d6b2" stroke-width="1.3"/><text x="624.0" y="108.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Methanol dannes</tspan></text><text x="624.0" y="132.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>CO</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97"> + 3 H</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97"> → CH</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">OH + H</tspan><tspan dy="2.97" font-size="9.2">2</tspan><tspan dy="-2.97">O</tspan></text><line x1="186.0" y1="115.0" x2="218.0" y2="115.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="230.0,115.0 218.0,121.0 218.0,109.0" fill="#14201f"/><line x1="432.0" y1="115.0" x2="480.0" y2="115.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="492.0,115.0 480.0,121.0 480.0,109.0" fill="#14201f"/><text x="462.0" y="103.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="3.08" font-size="9.5">2</tspan></text><line x1="624.0" y1="22.0" x2="624.0" y2="60.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="624.0,72.0 618.0,60.0 630.0,60.0" fill="#14201f"/><text x="612.0" y="40.0" font-size="14" text-anchor="end" fill="#14201f" font-weight="700"><tspan>CO</tspan><tspan dy="3.08" font-size="9.5">2</tspan><tspan dy="-3.08"> fanget fra røg</tspan></text><line x1="624.0" y1="158.0" x2="624.0" y2="192.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="624.0,204.0 618.0,192.0 630.0,192.0" fill="#14201f"/><text x="612.0" y="190.0" font-size="14" text-anchor="end" fill="#14201f" font-weight="700"><tspan>brændstof til skibe og fly</tspan></text>
</svg>
