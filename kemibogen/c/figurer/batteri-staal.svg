<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Jernmalm kan laves til jern på to måder. Med kul dannes der jern og carbondioxid. Med hydrogen dannes der jern og vand">
<title>Jernmalm kan laves til jern på to måder. Med kul dannes der jern og carbondioxid. Med hydrogen dannes der jern og vand</title>
<rect x="30.0" y="80.0" width="170.0" height="70.0" rx="12" fill="#efe3da" stroke="#b98b6b" stroke-width="1.4"/><text x="115.0" y="110.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Jernmalm</tspan></text><text x="115.0" y="132.0" font-size="14.5" text-anchor="middle" fill="#556766"><tspan>Fe</tspan><tspan dy="3.19" font-size="9.9">2</tspan><tspan dy="-3.19">O</tspan><tspan dy="3.19" font-size="9.9">3</tspan></text><line x1="204.0" y1="115.0" x2="286.6" y2="63.8" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="296.0,58.0 289.5,68.5 283.8,59.1" fill="#14201f"/><rect x="302.0" y="14.0" width="448.0" height="88.0" rx="12" fill="#eceff1" stroke="#9aa7a9" stroke-width="1.4"/><text x="322.0" y="42.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Med kul</tspan></text><text x="322.0" y="66.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Fe</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">O</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30"> + 3 CO → 2 Fe + 3 CO</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text><text x="322.0" y="87.0" font-size="13" text-anchor="start" fill="#556766"><tspan>der dannes carbondioxid</tspan></text><line x1="204.0" y1="115.0" x2="286.6" y2="166.2" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="296.0,172.0 283.8,170.9 289.5,161.5" fill="#14201f"/><rect x="302.0" y="128.0" width="448.0" height="88.0" rx="12" fill="#e3f2e1" stroke="#7fb277" stroke-width="1.4"/><text x="322.0" y="156.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Med hydrogen</tspan></text><text x="322.0" y="180.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Fe</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">O</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30"> + 3 H</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30"> → 2 Fe + 3 H</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">O</tspan></text><text x="322.0" y="201.0" font-size="13" text-anchor="start" fill="#556766"><tspan>der dannes kun vand</tspan></text>
</svg>
