an er en væske." data-noegle="heptan"><rect class="peg-maal" x="457.0" y="26.0" width="62.0" height="274.0" fill="none"/><circle cx="488.0" cy="84.7" r="5.0" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="276.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>7</tspan></text><text x="488.0" y="294.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>heptan</tspan></text></g><g class="peg" data-titel="Octan, C_{8}H_{18}" data-tekst="Octan har 8 carbonatomer i kæden og koger ved 126 °C. Kogepunktet ligger over stuetemperatur, så octan er en væske." data-noegle="octan"><rect class="peg-maal" x="519.0" y="26.0" width="62.0" height="274.0" fill="none"/><circle cx="550.0" cy="68.6" r="5.0" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="550.0" y="276.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>8</tspan></text><text x="550.0" y="294.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>octan</tspan></text></g><g class="peg" data-titel="Nonan, C_{9}H_{20}" data-tekst="Nonan har 9 carbonatomer i kæden og koger ved 151 °C. Kogepunktet ligger over stuetemperatur, så nonan er en væske." data-noegle="nonan"><rect class="peg-maal" x="581.0" y="26.0" width="62.0" height="274.0" fill="none"/><circle cx="612.0" cy="54.2" r="5.0" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="612.0" y="276.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>9</tspan></text><text x="612.0" y="294.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>nonan</tspan></text></g><g class="peg" data-titel="Decan, C_{10}H_{22}" data-tekst="Decan har 10 carbonatomer i kæden og koger ved 174 °C. Kogepunktet ligger over stuetemperatur, så decan er en væske." data-noegle="decan"><rect class="peg-maal" x="643.0" y="26.0" width="62.0" height="274.0" fill="none"/><circle cx="674.0" cy="40.9" r="5.0" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><