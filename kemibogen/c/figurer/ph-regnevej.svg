<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 246" width="770" height="246" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnevejen til pH: for en stærk syre er koncentrationen af oxonium lig med syrens koncentration, og pH er minus logaritmen til den. For en stærk base findes først koncentrationen af hydroxid, og vands ionprodukt giver koncentrationen af oxonium">
<title>Regnevejen til pH: for en stærk syre er koncentrationen af oxonium lig med syrens koncentration, og pH er minus logaritmen til den. For en stærk base findes først koncentrationen af hydroxid, og vands ionprodukt giver koncentrationen af oxonium</title>
<g class="peg-vejledning" data-tekst="Peg på en pil, og se et regneeksempel."/><g class="peg" data-titel="c(syre): syrens formelle koncentration" data-tekst="En stærk syre afgiver alle sine hydroner til vandet. Det gælder for saltsyre og salpetersyre." data-noegle="syre"><rect x="30.0" y="51.0" width="140.0" height="54.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="100.0" y="78.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c(syre)</tspan></text><text x="100.0" y="96.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>stærk syre</tspan></text></g><g class="peg" data-titel="[H_{3}O^{+}]: den aktuelle koncentration af oxoniumioner" data-tekst="Det er koncentrationen af oxoniumioner, der bestemmer pH." data-noegle="oxonium"><rect x="320.0" y="51.0" width="140.0" height="54.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="390.0" y="84.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="3.74" font-size="11.6">3</tspan><tspan dy="-3.74">O</tspan><tspan dy="-6.46" font-size="11.6">+</tspan><tspan dy="6.46">]</tspan></text></g><g class="peg" data-titel="pH" data-tekst="pH fortæller, hvor høj koncentrationen af oxoniumioner er. Jo flere oxoniumioner, jo lavere er pH. pH har ingen enhed." data-noegle="pH"><rect x="610.0" y="51.0" width="140.0" height="54.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="680.0" y="84.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH</tspan></text></g><g class="peg" data-titel="c(base): basens formelle koncentration" data-tekst="Natriumhydroxid består af ioner. Når stoffet opløses i vand, bliver alle hydroxidionerne frie." data-noegle="base"><rect x="30.0" y="179.0" width="140.0" height="54.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="100.0" y="206.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c(base)</tspan></text><text x="100.0" y="224.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>stærk base</tspan></text></g><g class="peg" data-titel="[OH^{−}]: den aktuelle koncentration af hydroxidioner" data-tekst="Fra koncentrationen af hydroxidioner går vejen til pH over vands ionprodukt." data-noegle="hydroxid"><rect x="320.0" y="179.0" width="140.0" height="54.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="390.0" y="212.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[OH</tspan><tspan dy="-6.46" font-size="11.6">−</tspan><tspan dy="6.46">]</tspan></text></g><g class="peg" data-titel="Stærk syre: [H_{3}O^{+}] = c(syre)" data-tekst="Hvert syremolekyle bliver til én oxoniumion. Koncentrationen af oxoniumioner er derfor den samme som syrens formelle koncentration.&#10;I 0,020 M saltsyre er [H_{3}O^{+}] = 0,020 M." data-med="syre oxonium"><line x1="176.0" y1="78.0" x2="303.0" y2="78.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="314.0,78.0 303.0,83.5 303.0,72.5" fill="#b45309"/><text x="245.0" y="66.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">] = c</tspan></text></g><g class="peg" data-titel="Fra koncentration til pH: pH = −log[H_{3}O^{+}]" data-tekst="Koncentrationen sættes ind som et tal uden enhed, og den skal være målt i M.&#10;Er [H_{3}O^{+}] = 0,020 M, er pH = −log(0,020) = 1,70." data-med="oxonium pH"><line x1="466.0" y1="68.0" x2="593.0" y2="68.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="604.0,68.0 593.0,73.5 593.0,62.5" fill="#b45309"/><text x="535.0" y="56.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH = −log[H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">]</tspan></text></g><g class="peg" data-titel="Fra pH til koncentration: [H_{3}O^{+}] = 10^{−pH} M" data-tekst="Formlen for pH kan vendes om, så den giver koncentrationen af oxoniumioner.&#10;Er pH = 3,20, er [H_{3}O^{+}] = 10^{−3,20} M = 6,3 · 10^{−4} M." data-med="oxonium pH"><line x1="604.0" y1="88.0" x2="477.0" y2="88.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="466.0,88.0 477.0,82.5 477.0,93.5" fill="#b45309"/><text x="535.0" y="110.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">] = 10</tspan><tspan dy="-5.13" font-size="9.2">−pH</tspan><tspan dy="5.13"> M</tspan></text></g><g class="peg" data-titel="Stærk base: [OH^{−}] = c(base)" data-tekst="Koncentrationen af hydroxidioner er den samme som den formelle koncentration af natriumhydroxid.&#10;I 0,010 M natriumhydroxid er [OH^{−}] = 0,010 M." data-med="base hydroxid"><line x1="176.0" y1="206.0" x2="303.0" y2="206.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="314.0,206.0 303.0,211.5 303.0,200.5" fill="#b45309"/><text x="245.0" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">] = c</tspan></text></g><g class="peg" data-titel="Vands ionprodukt: fra [OH^{−}] til [H_{3}O^{+}]" data-tekst="Ganges de to koncentrationer med hinanden, får man altid 1,0 · 10^{−14} M^{2}. Kender man den ene, kan man derfor beregne den anden.&#10;Er [OH^{−}] = 0,010 M, er [H_{3}O^{+}] = 1,0 · 10^{−14} M^{2} / 0,010 M = 1,0 · 10^{−12} M." data-med="hydroxid oxonium"><rect class="peg-maal" x="380.0" y="126.0" width="240.0" height="48.0" fill="none"/><line x1="390.0" y1="173.0" x2="390.0" y2="122.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="390.0,111.0 395.5,122.0 384.5,122.0" fill="#b45309"/><text x="404.0" y="144.0" font-size="13.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>vands ionprodukt:</tspan></text><text x="404.0" y="164.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>[H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">] · [OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">] = 1,0 · 10</tspan><tspan dy="-5.13" font-size="9.2">−14</tspan><tspan dy="5.13"> M</tspan><tspan dy="-5.13" font-size="9.2">2</tspan></text></g>
</svg>
