<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 160" width="792" height="160" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningsvejen i en titrering: fra forbruget på buretten til stofmængde, til stofmængden af natriumchlorid, til massen og til masseprocenten">
<title>Beregningsvejen i en titrering: fra forbruget på buretten til stofmængde, til stofmængden af natriumchlorid, til massen og til masseprocenten</title>
<g class="peg-vejledning" data-tekst="Peg på et trin eller en kasse, og se, hvad der regnes ud."/><g class="peg" data-titel="Forbruget af sølv(I)nitrat" data-tekst="Det volumen sølv(I)nitrat, der er løbet ud af buretten, når farven slår om. Det aflæses i mL og regnes om til liter." data-noegle="kasse0"><rect x="16.0" y="76.0" width="120.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="76.0" y="106.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>V(AgNO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30">)</tspan></text><text x="76.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>aflæst på buretten</tspan></text></g><g class="peg" data-titel="Stofmængden af sølv(I)nitrat" data-tekst="Så mange mol sølv(I)nitrat er der tilsat ved ækvivalenspunktet." data-noegle="kasse1"><rect x="176.0" y="76.0" width="120.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="236.0" y="106.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(AgNO</tspan><tspan dy="3.30" font-size="10.2">3</tspan><tspan dy="-3.30">)</tspan></text></g><g class="peg" data-titel="Stofmængden af natriumchlorid" data-tekst="Så mange mol natriumchlorid var der i prøven." data-noegle="kasse2"><rect x="336.0" y="76.0" width="120.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="396.0" y="106.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(NaCl)</tspan></text></g><g class="peg" data-titel="Massen af natriumchlorid" data-tekst="Så mange gram natriumchlorid var der i prøven." data-noegle="kasse3"><rect x="496.0" y="76.0" width="120.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="556.0" y="106.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>m(NaCl)</tspan></text></g><g class="peg" data-titel="Masseprocenten af natriumchlorid" data-tekst="Så stor en del af prøvens masse er natriumchlorid." data-noegle="kasse4"><rect x="656.0" y="76.0" width="120.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="716.0" y="106.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>masseprocent</tspan></text><text x="716.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>af NaCl i prøven</tspan></text></g><g class="peg" data-titel="Trin 1: n = c · V" data-tekst="Stofmængden af sølv(I)nitrat er koncentrationen gange det volumen, der er brugt. Volumenet skal stå i liter." data-noegle="trin1" data-med="kasse0 kasse1"><line x1="138.0" y1="100.0" x2="164.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="174.0,100.0 164.0,105.0 164.0,95.0" fill="#b45309"/><circle cx="156.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="156.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="156.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n = c · V</tspan></text><rect class="peg-maal" x="94.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 2: forholdet 1 : 1" data-tekst="Én sølvion reagerer med én chloridion. Ved ækvivalenspunktet er stofmængden af natriumchlorid derfor den samme som stofmængden af sølv(I)nitrat." data-noegle="trin2" data-med="kasse1 kasse2"><line x1="298.0" y1="100.0" x2="324.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="334.0,100.0 324.0,105.0 324.0,95.0" fill="#b45309"/><circle cx="316.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="316.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="316.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>forholdet 1 : 1</tspan></text><rect class="peg-maal" x="254.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 3: m = n · M" data-tekst="Massen af natriumchlorid er stofmængden gange molarmassen. Molarmassen for natriumchlorid er 58,44 g/mol." data-noegle="trin3" data-med="kasse2 kasse3"><line x1="458.0" y1="100.0" x2="484.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="494.0,100.0 484.0,105.0 484.0,95.0" fill="#b45309"/><circle cx="476.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="476.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="476.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>m = n · M</tspan></text><rect class="peg-maal" x="414.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 4: del med prøvens masse" data-tekst="Masseprocenten er massen af natriumchlorid divideret med prøvens masse og ganget med 100 %." data-noegle="trin4" data-med="kasse3 kasse4"><line x1="618.0" y1="100.0" x2="644.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="654.0,100.0 644.0,105.0 644.0,95.0" fill="#b45309"/><circle cx="636.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="636.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="636.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>del med m(prøve)</tspan></text><rect class="peg-maal" x="574.0" y="18.0" width="124.0" height="54.0" fill="none"/></g>
</svg>
