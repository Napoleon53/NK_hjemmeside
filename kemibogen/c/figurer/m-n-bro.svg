<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fra masse til stofmængde divideres med molarmassen, og fra stofmængde til masse ganges med molarmassen">
<title>Fra masse til stofmængde divideres med molarmassen, og fra stofmængde til masse ganges med molarmassen</title>
