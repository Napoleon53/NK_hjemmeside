<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 196" width="730" height="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skala over forskellen i elektronegativitet: under 0,5 upolær, fra 0,5 op til 2,0 polær, og 2,0 eller mere ionbinding">
<title>Skala over forskellen i elektronegativitet: under 0,5 upolær, fra 0,5 op til 2,0 polær, og 2,0 eller mere ionbinding</title>
<g class="peg-vejledning" data-tekst="Peg på et eksempel, og se, hvordan forskellen i elektronegativitet er regnet ud."/><g class="peg" data-titel="Upolær elektronparbinding" data-tekst="Er forskellen i elektronegativitet under 0,5, er bindingen upolær. Elektronparret deles ligeligt mellem de to atomer." data-noegle="upolær" data-med="i-upolær"><rect x="45.0" y="96.0" width="98.0" height="40.0" rx="6" fill="#eef6f4"/><text x="94.0" y="122.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>upolær</tspan></text></g><g class="peg" data-titel="Polær elektronparbinding" data-tekst="Er forskellen i elektronegativitet fra 0,5 op til 2,0, er bindingen polær. Elektronparret ligger tættest på det mest elektronegative atom." data-noegle="polær" data-med="i-polær"><rect x="145.0" y="96.0" width="298.0" height="40.0" rx="6" fill="#cde6e1"/><text x="294.0" y="122.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>polær</tspan></text></g><g class="peg" data-titel="Ionbinding" data-tekst="Er forskellen i elektronegativitet 2,0 eller mere, er det en ionbinding. Det mest elektronegative atom tager elektronerne helt." data-noegle="ionbinding" data-med="i-ionbinding"><rect x="445.0" y="96.0" width="258.0" height="40.0" rx="6" fill="#9fd3c9"/><text x="574.0" y="122.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ionbinding</tspan></text></g><line x1="44.0" y1="136.0" x2="44.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="44.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>0,0</tspan></text><line x1="144.0" y1="136.0" x2="144.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="144.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>0,5</tspan></text><line x1="244.0" y1="136.0" x2="244.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="244.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>1,0</tspan></text><line x1="344.0" y1="136.0" x2="344.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="344.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>1,5</tspan></text><line x1="444.0" y1="136.0" x2="444.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="444.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>2,0</tspan></text><line x1="544.0" y1="136.0" x2="544.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="544.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>2,5</tspan></text><line x1="644.0" y1="136.0" x2="644.0" y2="144.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="644.0" y="162.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>3,0</tspan></text><text x="704.0" y="186.0" font-size="14" text-anchor="end" fill="#556766"><tspan>forskel i elektronegativitet, ΔEN</tspan></text><g class="peg" data-titel="Bindingen Cl−Cl" data-tekst="Begge atomer er chlor med elektronegativiteten 3,0.&#10;ΔEN = 3,0 − 3,0 = 0,0&#10;Forskellen er under 0,5, så bindingen er upolær." data-noegle="Cl−Cl" data-i="i-upolær" data-med="upolær"><line x1="44.0" y1="74.0" x2="44.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="44.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="44.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl−Cl</tspan></text><text x="44.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>0,0</tspan></text></g><g class="peg" data-titel="Bindingen C−H" data-tekst="Carbon har elektronegativiteten 2,5, og hydrogen har 2,1.&#10;ΔEN = 2,5 − 2,1 = 0,4&#10;Forskellen er under 0,5, så bindingen er upolær." data-noegle="C−H" data-i="i-upolær" data-med="upolær"><line x1="124.0" y1="74.0" x2="124.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="124.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="124.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>C−H</tspan></text><text x="124.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>0,4</tspan></text></g><g class="peg" data-titel="Bindingen H−Cl" data-tekst="Chlor har elektronegativiteten 3,0, og hydrogen har 2,1.&#10;ΔEN = 3,0 − 2,1 = 0,9&#10;Forskellen ligger mellem 0,5 og 2,0, så bindingen er polær." data-noegle="H−Cl" data-i="i-polær" data-med="polær"><line x1="224.0" y1="74.0" x2="224.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="224.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="224.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H−Cl</tspan></text><text x="224.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>0,9</tspan></text></g><g class="peg" data-titel="Bindingen O−H" data-tekst="Oxygen har elektronegativiteten 3,5, og hydrogen har 2,1.&#10;ΔEN = 3,5 − 2,1 = 1,4&#10;Forskellen ligger mellem 0,5 og 2,0, så bindingen er polær." data-noegle="O−H" data-i="i-polær" data-med="polær"><line x1="324.0" y1="74.0" x2="324.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="324.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="324.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>O−H</tspan></text><text x="324.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>1,4</tspan></text></g><g class="peg" data-titel="Natrium og chlor" data-tekst="Chlor har elektronegativiteten 3,0, og natrium har 0,9.&#10;ΔEN = 3,0 − 0,9 = 2,1&#10;Forskellen er over 2,0, så det er en ionbinding." data-noegle="NaogCl" data-i="i-ionbinding" data-med="ionbinding"><line x1="464.0" y1="74.0" x2="464.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="464.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="464.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Na og Cl</tspan></text><text x="464.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>2,1</tspan></text></g><g class="peg" data-titel="Kalium og fluor" data-tekst="Fluor har elektronegativiteten 4,0, og kalium har 0,8.&#10;ΔEN = 4,0 − 0,8 = 3,2&#10;Forskellen er over 2,0, så det er en ionbinding." data-noegle="KogF" data-i="i-ionbinding" data-med="ionbinding"><line x1="684.0" y1="74.0" x2="684.0" y2="94.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="684.0" cy="94.0" r="4.5" fill="#14201f" stroke="#ffffff" stroke-width="2"/><text x="684.0" y="50.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>K og F</tspan></text><text x="684.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>3,2</tspan></text></g>
</svg>
