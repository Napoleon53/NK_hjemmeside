<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="780" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hovedgruppens nummer viser, hvilken ladning ionen typisk får">
<title>Hovedgruppens nummer viser, hvilken ladning ionen typisk får</title>
<g class="peg-vejledning" data-tekst="Peg på en hovedgruppe, og se, hvilken ion grundstofferne danner."/><g class="peg" data-titel="Hovedgruppe 1" data-tekst="Metallerne i hovedgruppe 1 har 1 elektron i yderste skal. De afgiver den og danner positive ioner med ladningen 1+. Na^{+} og K^{+} er to af dem." data-noegle="hg1"><rect x="114.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#fbd3ca"/><text x="153.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>1</tspan></text><text x="153.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>1</tspan></text><text x="153.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>afgive 1</tspan></text><rect x="126.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="153.0" y="178.0" font-size="21" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>+</tspan></text><text x="153.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Na</tspan><tspan dy="-5.51" font-size="9.9">+</tspan><tspan dy="5.51">, K</tspan><tspan dy="-5.51" font-size="9.9">+</tspan></text></g><g class="peg" data-titel="Hovedgruppe 2" data-tekst="Metallerne i hovedgruppe 2 har 2 elektroner i yderste skal. De afgiver dem og danner positive ioner med ladningen 2+. Mg^{2+} og Ca^{2+} er to af dem." data-noegle="hg2"><rect x="196.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#fbd3ca"/><text x="235.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2</tspan></text><text x="235.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>2</tspan></text><text x="235.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>afgive 2</tspan></text><rect x="208.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="235.0" y="178.0" font-size="21" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>2+</tspan></text><text x="235.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Mg</tspan><tspan dy="-5.51" font-size="9.9">2+</tspan><tspan dy="5.51">, Ca</tspan><tspan dy="-5.51" font-size="9.9">2+</tspan></text></g><g class="peg" data-titel="Hovedgruppe 3" data-tekst="Metallerne i hovedgruppe 3 har 3 elektroner i yderste skal. De afgiver dem og danner positive ioner med ladningen 3+. Al^{3+} er den vigtigste." data-noegle="hg3"><rect x="278.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#fbd3ca"/><text x="317.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3</tspan></text><text x="317.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>3</tspan></text><text x="317.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>afgive 3</tspan></text><rect x="290.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="317.0" y="178.0" font-size="21" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>3+</tspan></text><text x="317.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Al</tspan><tspan dy="-5.51" font-size="9.9">3+</tspan></text></g><g class="peg" data-titel="Hovedgruppe 4" data-tekst="Grundstofferne i hovedgruppe 4 skulle afgive eller optage hele fire elektroner. Det sker sjældent. Carbon deler i stedet elektroner med andre atomer og danner molekyler." data-noegle="hg4"><rect x="360.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#eceff1"/><text x="399.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>4</tspan></text><text x="399.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>4</tspan></text><text x="399.0" y="116.0" font-size="14.5" text-anchor="middle" fill="#556766"><tspan>dele</tspan></text><text x="399.0" y="133.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>elektroner</tspan></text><text x="399.0" y="168.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>sjældent</tspan></text><text x="399.0" y="185.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>ioner</tspan></text></g><g class="peg" data-titel="Hovedgruppe 5" data-tekst="Ikke-metallerne i hovedgruppe 5 har 5 elektroner i yderste skal. De optager 3 elektroner, så de har 8, og danner negative ioner med ladningen 3−. N^{3−} er en af dem." data-noegle="hg5"><rect x="442.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#cfe0fb"/><text x="481.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>5</tspan></text><text x="481.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>5</tspan></text><text x="481.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>optage 3</tspan></text><rect x="454.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="481.0" y="178.0" font-size="21" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>3−</tspan></text><text x="481.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>N</tspan><tspan dy="-5.51" font-size="9.9">3−</tspan></text></g><g class="peg" data-titel="Hovedgruppe 6" data-tekst="Ikke-metallerne i hovedgruppe 6 har 6 elektroner i yderste skal. De optager 2 elektroner, så de har 8, og danner negative ioner med ladningen 2−. O^{2−} og S^{2−} er to af dem." data-noegle="hg6"><rect x="524.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#cfe0fb"/><text x="563.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>6</tspan></text><text x="563.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>6</tspan></text><text x="563.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>optage 2</tspan></text><rect x="536.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="563.0" y="178.0" font-size="21" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>2−</tspan></text><text x="563.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>O</tspan><tspan dy="-5.51" font-size="9.9">2−</tspan><tspan dy="5.51">, S</tspan><tspan dy="-5.51" font-size="9.9">2−</tspan></text></g><g class="peg" data-titel="Hovedgruppe 7" data-tekst="Ikke-metallerne i hovedgruppe 7 har 7 elektroner i yderste skal. De optager 1 elektron, så de har 8, og danner negative ioner med ladningen 1−. F^{−} og Cl^{−} er to af dem." data-noegle="hg7"><rect x="606.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#cfe0fb"/><text x="645.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>7</tspan></text><text x="645.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>7</tspan></text><text x="645.0" y="124.0" font-size="14.5" text-anchor="middle" fill="#14201f"><tspan>optage 1</tspan></text><rect x="618.0" y="150.0" width="54.0" height="40.0" rx="20" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.6"/><text x="645.0" y="178.0" font-size="21" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>−</tspan></text><text x="645.0" y="228.0" font-size="14.5" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>F</tspan><tspan dy="-5.51" font-size="9.9">−</tspan><tspan dy="5.51">, Cl</tspan><tspan dy="-5.51" font-size="9.9">−</tspan></text></g><g class="peg" data-titel="Hovedgruppe 8" data-tekst="Ædelgasserne i hovedgruppe 8 har allerede 8 elektroner i yderste skal. De danner ikke ioner." data-noegle="hg8"><rect x="688.0" y="10.0" width="78.0" height="238.0" rx="9" fill="#eceff1"/><text x="727.0" y="37.0" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>8</tspan></text><text x="727.0" y="79.0" font-size="17" text-anchor="middle" fill="#14201f"><tspan>8</tspan></text><text x="727.0" y="116.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>ingenting,</tspan></text><text x="727.0" y="133.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>har 8</tspan></text><text x="727.0" y="168.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>ingen</tspan></text><text x="727.0" y="185.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>ioner</tspan></text></g><text x="102.0" y="35.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>Hovedgruppe</tspan></text><text x="102.0" y="70.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>Elektroner i</tspan></text><text x="102.0" y="87.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>yderste skal</tspan></text><g pointer-events="none"><line x1="114.0" y1="50.0" x2="766.0" y2="50.0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g><text x="102.0" y="124.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>Atomet vil</tspan></text><g pointer-events="none"><line x1="114.0" y1="96.0" x2="766.0" y2="96.0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g><text x="102.0" y="167.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>Ionens</tspan></text><text x="102.0" y="184.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>ladning</tspan></text><g pointer-events="none"><line x1="114.0" y1="142.0" x2="766.0" y2="142.0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g><text x="102.0" y="228.0" font-size="13.5" text-anchor="end" fill="#556766"><tspan>Eksempler</tspan></text><g pointer-events="none"><line x1="114.0" y1="198.0" x2="766.0" y2="198.0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/></g>
</svg>
