<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 212" width="740" height="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En skala fra lille til stor dosis med tre områder. For lidt virker ikke, en passende dosis virker, som den skal, og for meget skader kroppen. For paracetamol til en voksen er dosis 1 gram ad gangen og højst 4 gram i døgnet">
<title>En skala fra lille til stor dosis med tre områder. For lidt virker ikke, en passende dosis virker, som den skal, og for meget skader kroppen. For paracetamol til en voksen er dosis 1 gram ad gangen og højst 4 gram i døgnet</title>
<rect x="40.0" y="64.0" width="200.0" height="40.0" rx="0" fill="#e9edf0"/><text x="140.0" y="89.0" font-size="15.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>for lidt</tspan></text><text x="140.0" y="124.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>virker ikke</tspan></text><rect x="240.0" y="64.0" width="260.0" height="40.0" rx="0" fill="#cfeedd"/><text x="370.0" y="89.0" font-size="15.5" text-anchor="middle" fill="#1d7a3a" font-weight="700"><tspan>passende dosis</tspan></text><text x="370.0" y="124.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>virker, som det skal</tspan></text><rect x="500.0" y="64.0" width="200.0" height="40.0" rx="0" fill="#f9d2cb"/><text x="600.0" y="89.0" font-size="15.5" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>for meget</tspan></text><text x="600.0" y="124.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>skader kroppen</tspan></text><rect x="40.0" y="64.0" width="660.0" height="40.0" rx="6" fill="none" stroke="#556766" stroke-width="1.4"/><line x1="40.0" y1="46.0" x2="690.0" y2="46.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><polygon points="700.0,46.0 690.0,51.0 690.0,41.0" fill="#556766"/><text x="40.0" y="36.0" font-size="13" text-anchor="start" fill="#556766"><tspan>lille dosis</tspan></text><text x="700.0" y="36.0" font-size="13" text-anchor="end" fill="#556766"><tspan>stor dosis</tspan></text><rect x="160.0" y="148.0" width="420.0" height="52.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="370.0" y="170.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Paracetamol til en voksen:</tspan></text><text x="370.0" y="190.0" font-size="14" text-anchor="middle" fill="#14201f"><tspan>1 g ad gangen og højst 4 g i døgnet</tspan></text>
</svg>
