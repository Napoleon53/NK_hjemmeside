dy="-5.72">​</tspan></tspan><tspan fill="#0f766e"><tspan>(s)​</tspan></tspan></text><rect x="140.0" y="156.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="160.0" y="180.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Ladning til venstre: (+2) + 2 · (−1) = 0</tspan></text><text x="160.0" y="202.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Ladning til højre: 0</tspan></text><text x="160.0" y="226.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Der er 1 Pb og 2 I på begge sider. Skemaet er afstemt.</tspan></text>
