<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 160" width="792" height="160" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningsvejen i titreringen af eddike: fra forbruget af natriumhydroxid til stofmængden, til stofmængden af eddikesyre, til massen og til masseprocenten">
<title>Beregningsvejen i titreringen af eddike: fra forbruget af natriumhydroxid til stofmængden, til stofmængden af eddikesyre, til massen og til masseprocenten</title>
<g class="peg-vejledning" data-tekst="Peg på et trin eller en kasse, og se, hvad der regnes ud."/><g class="peg" data-titel="Forbruget af natriumhydroxid" data-tekst="Det volumen natriumhydroxid, der er løbet ud af buretten, når farven slår om. Det aflæses i mL og regnes om til liter." data-noegle="kasse0"><rect x="14.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="76.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>V(NaOH)</tspan></text><text x="76.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>aflæst på buretten</tspan></text></g><g class="peg" data-titel="Stofmængden af natriumhydroxid" data-tekst="Så mange mol natriumhydroxid er der tilsat ved ækvivalenspunktet." data-noegle="kasse1"><rect x="174.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="236.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(NaOH)</tspan></text></g><g class="peg" data-titel="Stofmængden af eddikesyre" data-tekst="Så mange mol eddikesyre var der i prøven." data-noegle="kasse2"><rect x="334.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="396.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">COOH)</tspan></text></g><g class="peg" data-titel="Massen af eddikesyre" data-tekst="Så mange gram eddikesyre var der i prøven." data-noegle="kasse3"><rect x="494.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="556.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>m(CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">COOH)</tspan></text></g><g class="peg" data-titel="Masseprocenten af eddikesyre" data-tekst="Så stor en del af eddikens masse er eddikesyre." data-noegle="kasse4"><rect x="654.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="716.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>masseprocent</tspan></text><text x="716.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>af eddikesyre i eddiken</tspan></text></g><g class="peg" data-titel="Trin 1: n = c · V" data-tekst="Stofmængden af natriumhydroxid er koncentrationen gange det volumen, der er brugt. Volumenet skal stå i liter." data-noegle="trin1" data-med="kasse0 kasse1"><line x1="140.0" y1="100.0" x2="162.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="172.0,100.0 162.0,105.0 162.0,95.0" fill="#b45309"/><circle cx="156.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="156.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="156.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n = c · V</tspan></text><rect class="peg-maal" x="94.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 2: forholdet 1 : 1" data-tekst="Forholdet mellem eddikesyre og hydroxid er 1 : 1. Ved ækvivalenspunktet er stofmængden af eddikesyre derfor den samme som stofmængden af natriumhydroxid." data-noegle="trin2" data-med="kasse1 kasse2"><line x1="300.0" y1="100.0" x2="322.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="332.0,100.0 322.0,105.0 322.0,95.0" fill="#b45309"/><circle cx="316.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="316.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="316.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>forholdet 1 : 1</tspan></text><rect class="peg-maal" x="254.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 3: m = n · M" data-tekst="Massen af eddikesyre er stofmængden gange molarmassen. Molarmassen for eddikesyre er 60,05 g/mol." data-noegle="trin3" data-med="kasse2 kasse3"><line x1="460.0" y1="100.0" x2="482.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="492.0,100.0 482.0,105.0 482.0,95.0" fill="#b45309"/><circle cx="476.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="476.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="476.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>m = n · M</tspan></text><rect class="peg-maal" x="414.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 4: del med prøvens masse" data-tekst="Masseprocenten er massen af eddikesyre divideret med eddikens masse og ganget med 100 %." data-noegle="trin4" data-med="kasse3 kasse4"><line x1="620.0" y1="100.0" x2="642.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="652.0,100.0 642.0,105.0 642.0,95.0" fill="#b45309"/><circle cx="636.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="636.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="636.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>del med m(prøve)</tspan></text><rect class="peg-maal" x="574.0" y="18.0" width="124.0" height="54.0" fill="none"/></g>
</svg>
