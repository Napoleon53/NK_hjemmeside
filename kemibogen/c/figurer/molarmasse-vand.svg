<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 204" width="720" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et vandmolekyle vejer 18,02 u, og et mol vand vejer 18,02 gram">
