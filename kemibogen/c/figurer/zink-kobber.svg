6766"><tspan>zink</tspan></text><text x="350.0" y="236.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>opløsningen er blevet lysere</tspan></text><line x1="212.0" y1="130.0" x2="247.0" y2="130.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="258.0,130.0 247.0,135.5 247.0,124.5" fill="#14201f"/><rect x="480.0" y="40.0" width="262.0" height="170.0" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="611.0" y="26.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>På mikroniveau</tspan></text><circle cx="540.0" cy="106.0" r="22.0" fill="#e9edee" stroke="#6b7780" stroke-width="1.6"/><text x="540.0" y="112.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Zn</tspan></text><circle cx="680.0" cy="106.0" r="22.0" fill="#fbd3ca" stroke="#c0392b" stroke-width="1.6"/><text x="680.0" y="112.0" font-size="15" text-anchor="middle" fill="#7a1f14" font-weight="700"><tspan>Cu</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan></text><path d="M 556.0,82.0 Q 611.0,39.0 658.3,77.7" fill="none" stroke="#1b4aa3" stroke-width="2.4" stroke-linecap="round"/><polygon points="666.0,84.0 655.1,81.5 661.4,73.8" fill="#1b4aa3"/><circle cx="600.0" cy="62.0" r="6.5" fill="#2f6fde" stroke="#1b4aa3" stroke-width="1"/><line x1="596.8" y1="62.0" x2="603.2" y2="62.0" stroke="#ffffff" stroke-width="1.69" stroke-linecap="round"/><circle cx="620.0" cy="61.0" r="6.5" fill="#2f6fde" stroke="#1b4aa3" stroke-width="1"/><line x1="616.8" y1="61.0" x2="623.2" y2="61.0" stroke="#ffffff" stroke-width="1.69" stroke-linecap="round"/><text x="611.0" y="160.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>Zinkatomet afgiver 2 elektroner</tspan></text><text x="611.0" y="178.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>til kobber(II)ionen.</tspan></text><text x="611.0" y="236.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Zn + Cu</tspan><tsp