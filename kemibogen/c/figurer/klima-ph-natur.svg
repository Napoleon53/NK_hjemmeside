<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 186" width="780" height="186" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="pH-skalaen fra −1 til 15 med tre slags vand fra naturen: syreregn ved pH 4,2, rent regnvand ved pH 5,6 og havvand ved pH 8,1">
<title>pH-skalaen fra −1 til 15 med tre slags vand fra naturen: syreregn ved pH 4,2, rent regnvand ved pH 5,6 og havvand ved pH 8,1</title>
<g class="peg-vejledning" data-tekst="Peg på en af de tre slags vand eller på et tal på skalaen."/><g class="peg" data-titel="Under −1" data-tekst="Skalaen fortsætter. De mest koncentrerede syrer har en pH lidt under −1." data-noegle="under"><defs><linearGradient id="ud-6b130c-v" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#6b130c" stop-opacity="1"/><stop offset="1" stop-color="#6b130c" stop-opacity="0"/></linearGradient></defs><rect x="6.0" y="112.0" width="26.0" height="36.0" rx="5" fill="url(#ud-6b130c-v)"/></g><g class="peg" data-titel="Over 15" data-tekst="Skalaen fortsætter. De mest koncentrerede baser har en pH over 15." data-noegle="over"><defs><linearGradient id="ud-122b70-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#122b70" stop-opacity="1"/><stop offset="1" stop-color="#122b70" stop-opacity="0"/></linearGradient></defs><rect x="748.0" y="112.0" width="26.0" height="36.0" rx="5" fill="url(#ud-122b70-h)"/></g><g class="peg" data-titel="pH −1" data-tekst="En opløsning med pH −1 er sur. Der er flest oxoniumioner. Så lav en pH har kun en meget koncentreret syre.&#10;[H_{3}O^{+}] = 10^{1} M = 10 M" data-noegle="pH-1"><rect x="34.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#6b130c"/><text x="54.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>−1</tspan></text></g><g class="peg" data-titel="pH 0" data-tekst="En opløsning med pH 0 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{0} M = 1 M" data-noegle="pH0"><rect x="76.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#8f1d14"/><text x="96.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>0</tspan></text></g><g class="peg" data-titel="pH 1" data-tekst="En opløsning med pH 1 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−1} M = 0,1 M" data-noegle="pH1"><rect x="118.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#b52a1e"/><text x="138.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text></g><g class="peg" data-titel="pH 2" data-tekst="En opløsning med pH 2 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−2} M = 0,01 M" data-noegle="pH2"><rect x="160.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#d1432f"/><text x="180.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text></g><g class="peg" data-titel="pH 3" data-tekst="En opløsning med pH 3 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−3} M = 0,001 M" data-noegle="pH3"><rect x="202.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#e06a52"/><text x="222.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text></g><g class="peg" data-titel="pH 4" data-tekst="En opløsning med pH 4 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−4} M" data-noegle="pH4"><rect x="244.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#ec9580"/><text x="264.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>4</tspan></text></g><g class="peg" data-titel="pH 5" data-tekst="En opløsning med pH 5 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−5} M" data-noegle="pH5"><rect x="286.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#f4bcae"/><text x="306.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>5</tspan></text></g><g class="peg" data-titel="pH 6" data-tekst="En opløsning med pH 6 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−6} M" data-noegle="pH6"><rect x="328.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#fae0d9"/><text x="348.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>6</tspan></text></g><g class="peg" data-titel="pH 7" data-tekst="En opløsning med pH 7 er neutral. Der er lige mange oxoniumioner og hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−7} M" data-noegle="pH7"><rect x="370.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#eef1ef"/><text x="390.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>7</tspan></text></g><g class="peg" data-titel="pH 8" data-tekst="En opløsning med pH 8 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−8} M" data-noegle="pH8"><rect x="412.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#dbe7fb"/><text x="432.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>8</tspan></text></g><g class="peg" data-titel="pH 9" data-tekst="En opløsning med pH 9 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−9} M" data-noegle="pH9"><rect x="454.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#b9d0f7"/><text x="474.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>9</tspan></text></g><g class="peg" data-titel="pH 10" data-tekst="En opløsning med pH 10 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−10} M" data-noegle="pH10"><rect x="496.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#93b4f0"/><text x="516.0" y="135.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10</tspan></text></g><g class="peg" data-titel="pH 11" data-tekst="En opløsning med pH 11 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−11} M" data-noegle="pH11"><rect x="538.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#6a93e6"/><text x="558.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>11</tspan></text></g><g class="peg" data-titel="pH 12" data-tekst="En opløsning med pH 12 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−12} M" data-noegle="pH12"><rect x="580.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#4672d8"/><text x="600.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>12</tspan></text></g><g class="peg" data-titel="pH 13" data-tekst="En opløsning med pH 13 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−13} M" data-noegle="pH13"><rect x="622.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#2b55c0"/><text x="642.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>13</tspan></text></g><g class="peg" data-titel="pH 14" data-tekst="En opløsning med pH 14 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−14} M" data-noegle="pH14"><rect x="664.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#1b3c96"/><text x="684.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>14</tspan></text></g><g class="peg" data-titel="pH 15" data-tekst="En opløsning med pH 15 er basisk. Der er flest hydroxidioner. Så høj en pH har kun en meget koncentreret base.&#10;[H_{3}O^{+}] = 10^{−15} M" data-noegle="pH15"><rect x="706.0" y="112.0" width="40.0" height="36.0" rx="5" fill="#122b70"/><text x="726.0" y="135.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>15</tspan></text></g><g class="peg" data-titel="Syreregn" data-tekst="Røg fra kraftværker, skibe og biler kan give svovlsyre og salpetersyre i regnen. Syreregn har en pH omkring 4,2 og er meget surere end rent regnvand." data-noegle="syreregn"><rect class="peg-maal" x="220.4" y="5.0" width="104.0" height="38.0" fill="none"/><line x1="272.4" y1="46.0" x2="272.4" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="272.4,108.0 267.4,98.0 277.4,98.0" fill="#14201f"/><text x="272.4" y="20.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>syreregn</tspan></text><text x="272.4" y="38.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>pH 4,2</tspan></text></g><g class="peg" data-titel="Rent regnvand" data-tekst="Regnen indeholder kulsyre, fordi carbondioxid fra luften opløses i vandet. Derfor er rent regnvand svagt surt med en pH omkring 5,6." data-noegle="rent-regnvand"><rect class="peg-maal" x="279.2" y="47.0" width="104.0" height="38.0" fill="none"/><line x1="331.2" y1="88.0" x2="331.2" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="331.2,108.0 326.2,98.0 336.2,98.0" fill="#14201f"/><text x="331.2" y="62.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>rent regnvand</tspan></text><text x="331.2" y="80.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>pH 5,6</tspan></text></g><g class="peg" data-titel="Havvand" data-tekst="Havvand er svagt basisk. Havets pH er faldet fra omkring 8,2 til omkring 8,1, fordi havet optager carbondioxid. Det kaldes havforsuring." data-noegle="havvand"><rect class="peg-maal" x="384.2" y="5.0" width="104.0" height="38.0" fill="none"/><line x1="436.2" y1="46.0" x2="436.2" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="436.2,108.0 431.2,98.0 441.2,98.0" fill="#14201f"/><text x="436.2" y="20.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>havvand</tspan></text><text x="436.2" y="38.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>pH 8,1</tspan></text></g><text x="201.0" y="172.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>surt</tspan></text><text x="390.0" y="172.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>neutralt</tspan></text><text x="579.0" y="172.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>basisk</tspan></text>
</svg>
