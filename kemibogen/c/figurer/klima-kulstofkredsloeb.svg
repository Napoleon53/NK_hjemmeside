<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" width="780" height="316" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Carbon bevæger sig i et kredsløb. Planter optager carbondioxid fra luften ved fotosyntese, og planter og dyr sender det tilbage ved ånding og forrådnelse. Når kul, olie og gas brændes af, kommer der ekstra carbondioxid ud i luften">
<title>Carbon bevæger sig i et kredsløb. Planter optager carbondioxid fra luften ved fotosyntese, og planter og dyr sender det tilbage ved ånding og forrådnelse. Når kul, olie og gas brændes af, kommer der ekstra carbondioxid ud i luften</title>
<rect x="290.0" y="18.0" width="200.0" height="66.0" rx="12" fill="#e6f0f9" stroke="#c5d9ec" stroke-width="1.2"/><text x="390.0" y="46.0" font-size="16.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Luften</tspan></text><text x="390.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>carbon som CO</tspan><tspan dy="2.97" font-size="9.2">2</tspan></text><rect x="50.0" y="232.0" width="240.0" height="70.0" rx="12" fill="#e3f2e1" stroke="#b7d6b2" stroke-width="1.2"/><text x="170.0" y="262.0" font-size="16.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Planter og dyr</tspan></text><text x="170.0" y="284.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>carbon i levende stof</tspan></text><rect x="490.0" y="232.0" width="240.0" height="70.0" rx="12" fill="#ebe6dd" stroke="#cdc3b2" stroke-width="1.2"/><text x="610.0" y="262.0" font-size="16.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kul, olie og gas</tspan></text><text x="610.0" y="284.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>carbon gemt i millioner af år</tspan></text><line x1="312.0" y1="90.0" x2="161.9" y2="217.6" stroke="#0f766e" stroke-width="3.2" stroke-linecap="round"/><polygon points="152.0,226.0 157.7,212.6 166.1,222.5" fill="#0f766e"/><text x="212.0" y="150.0" font-size="14.5" text-anchor="end" fill="#0f766e" font-weight="700"><tspan>fotosyntese</tspan></text><line x1="222.0" y1="226.0" x2="366.2" y2="100.5" stroke="#556766" stroke-width="3.2" stroke-linecap="round"/><polygon points="376.0,92.0 370.5,105.4 361.9,95.6" fill="#556766"/><text x="306.0" y="186.0" font-size="14.5" text-anchor="start" fill="#556766" font-weight="700"><tspan>ånding og forrådnelse</tspan></text><line x1="606.0" y1="226.0" x2="458.3" y2="102.3" stroke="#b45309" stroke-width="5" stroke-linecap="round"/><polygon points="446.0,92.0 463.4,96.1 453.1,108.4" fill="#b45309"/><text x="548.0" y="150.0" font-size="14.5" text-anchor="start" fill="#b45309" font-weight="700"><tspan>afbrænding</tspan></text><text x="566.0" y="170.0" font-size="13" text-anchor="start" fill="#556766"><tspan>ekstra CO</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86"> til luften</tspan></text>
</svg>
