<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 308" width="720" height="308" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Rene stoffer deles i grundstoffer og kemiske forbindelser">
<title>Rene stoffer deles i grundstoffer og kemiske forbindelser</title>
<defs><linearGradient id="mi" x1="0" x2="1" y1="0" y2="0"><stop offset="0.5" stop-color="#f6dc9a"/><stop offset="0.5" stop-color="#9ed9cf"/></linearGradient></defs><path d="M 360,58 V 81.0 H 190 V 104" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><path d="M 360,58 V 81.0 H 530 V 104" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><path d="M 190,162 V 186.0 H 100 V 210" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><path d="M 190,162 V 186.0 H 280 V 210" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><path d="M 530,162 V 186.0 H 450 V 210" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><path d="M 530,162 V 186.0 H 630 V 210" fill="none" stroke="#556766" stroke-width="1.6" stroke-linejoin="round"/><g class="peg-vejledning" data-tekst="Peg på en kasse, og se, hvad ordet betyder."/><g class="peg" data-titel="Rent stof" data-tekst="Et rent stof består af kun ét stof. Rent vand er et rent stof. Saltvand er en blanding, fordi det indeholder både vand og salt." data-noegle="Rent-stof"><rect x="280.0" y="14.0" width="160.0" height="44.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="360.0" y="43.0" font-size="18" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Rent stof</tspan></text></g><g class="peg" data-titel="Grundstof" data-tekst="Et grundstof består af kun én slags atomer. Guld består kun af guldatomer. Et grundstof er enten et metal eller et ikke-metal." data-noegle="Grundstof" data-med="Rent-stof Metal Ikke-metal"><rect x="85.0" y="104.0" width="210.0" height="58.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="129.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Grundstof</tspan></text><text x="190.0" y="150.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>én slags atomer</tspan></text></g><g class="peg" data-titel="Kemisk forbindelse" data-tekst="I en kemisk forbindelse er atomer fra flere grundstoffer bundet sammen. Vand er en kemisk forbindelse af hydrogen og oxygen. En kemisk forbindelse er enten en ionforbindelse eller et molekyle." data-noegle="Kemisk-forbindelse" data-med="Rent-stof Ionforbindelse Molekyle"><rect x="425.0" y="104.0" width="210.0" height="58.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.5"/><text x="530.0" y="129.0" font-size="17" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kemisk forbindelse</tspan></text><text x="530.0" y="150.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>flere slags atomer</tspan></text></g><g class="peg" data-titel="Metal" data-tekst="Et metal er et grundstof. Metaller er blanke og leder strøm og varme godt. Eksempler er natrium (Na), jern (Fe) og guld (Au)." data-noegle="Metal" data-med="Rent-stof Grundstof"><rect x="24.0" y="210.0" width="152.0" height="58.0" rx="10" fill="#f6dc9a" stroke="#556766" stroke-width="1.3"/><text x="100.0" y="245.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Metal</tspan></text><text x="100.0" y="293.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>fx Na, Fe, Au</tspan></text></g><g class="peg" data-titel="Ikke-metal" data-tekst="Et ikke-metal er et grundstof. Mange ikke-metaller er farveløse gasser, og de leder for det meste strøm og varme dårligt. Eksempler er chlor (Cl_{2}), oxygen (O_{2}) og helium (He)." data-noegle="Ikke-metal" data-med="Rent-stof Grundstof"><rect x="204.0" y="210.0" width="152.0" height="58.0" rx="10" fill="#9ed9cf" stroke="#556766" stroke-width="1.3"/><text x="280.0" y="245.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ikke-metal</tspan></text><text x="280.0" y="293.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>fx Cl</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, O</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, He</tspan></text></g><g class="peg" data-titel="Ionforbindelse" data-tekst="En ionforbindelse er en kemisk forbindelse af et metal og et ikke-metal. Køkkensalt (NaCl) består af metallet natrium og ikke-metallet chlor." data-noegle="Ionforbindelse" data-med="Rent-stof Kemisk-forbindelse"><rect x="374.0" y="210.0" width="152.0" height="58.0" rx="10" fill="url(#mi)" stroke="#556766" stroke-width="1.3"/><text x="450.0" y="235.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ionforbindelse</tspan></text><text x="450.0" y="255.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>metal + ikke-metal</tspan></text><text x="450.0" y="293.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>fx NaCl</tspan></text></g><g class="peg" data-titel="Molekyle" data-tekst="Et molekyle består kun af ikke-metaller. Vand (H_{2}O) og carbondioxid (CO_{2}) er molekyler." data-noegle="Molekyle" data-med="Rent-stof Kemisk-forbindelse"><rect x="554.0" y="210.0" width="152.0" height="58.0" rx="10" fill="#9ed9cf" stroke="#556766" stroke-width="1.3"/><text x="630.0" y="235.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Molekyle</tspan></text><text x="630.0" y="255.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>kun ikke-metaller</tspan></text><text x="630.0" y="293.0" font-size="15" text-anchor="middle" fill="#14201f"><tspan>fx H</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">O, CO</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text></g>
</svg>
