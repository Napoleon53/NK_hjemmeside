<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" width="780" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Trin 3. Én Pb 2 plus med ladningen plus 2 og to I minus med ladningen minus 1 hver giver tilsammen 0. Formlen for bundfaldet er PbI2">
<title>Trin 3. Én Pb 2 plus med ladningen plus 2 og to I minus med ladningen minus 1 hver giver tilsammen 0. Formlen for bundfaldet er PbI2</title>
<text x="240.0" y="62.0" font-size="26" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>Pb</tspan><tspan dy="-9.88" font-size="17.7">2+</tspan></text><text x="400.0" y="62.0" font-size="26" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>I</tspan><tspan dy="-9.88" font-size="17.7">−</tspan></text><text x="480.0" y="62.0" font-size="26" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>I</tspan><tspan dy="-9.88" font-size="17.7">−</tspan></text><text x="240.0" y="100.0" font-size="16" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>(+2)</tspan></text><text x="400.0" y="100.0" font-size="16" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>(−1)</tspan></text><text x="480.0" y="100.0" font-size="16" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>(−1)</tspan></text><line x1="530.0" y1="53.0" x2="576.0" y2="53.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="588.0,53.0 576.0,59.0 576.0,47.0" fill="#14201f"/><rect x="604.0" y="32.0" width="96.0" height="44.0" rx="8" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.2"/><text x="652.0" y="63.0" font-size="26" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>PbI</tspan><tspan dy="5.72" font-size="17.7">2</tspan></text><rect x="140.0" y="156.0" width="500.0" height="92.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="160.0" y="180.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Ladning fra 1 Pb</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">: +2</tspan></text><text x="160.0" y="202.0" font-size="15" text-anchor="start" fill="#14201f"><tspan>Ladning fra 2 I</tspan><tspan dy="-5.70" font-size="10.2">−</tspan><tspan dy="5.70">: 2 · (−1) = −2</tspan></text><text x="160.0" y="226.0" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Summen er 0, så formlen er PbI</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">.</tspan></text>
</svg>
