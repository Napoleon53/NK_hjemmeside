<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 262" width="780" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Brugt plast kan gå tre veje. Ved genbrug smeltes plasten om til nye ting. Ved forbrænding giver den varme, men også carbondioxid. I naturen nedbrydes den ikke, men bliver til mikroplast">
<title>Brugt plast kan gå tre veje. Ved genbrug smeltes plasten om til nye ting. Ved forbrænding giver den varme, men også carbondioxid. I naturen nedbrydes den ikke, men bliver til mikroplast</title>
<rect x="30.0" y="96.0" width="150.0" height="64.0" rx="12" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.4"/><text x="105.0" y="124.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Brugt plast</tspan></text><text x="105.0" y="145.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>poser, flasker, emballage</tspan></text><line x1="184.0" y1="128.0" x2="306.8" y2="46.1" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="316.0,40.0 309.9,50.7 303.8,41.5" fill="#14201f"/><rect x="322.0" y="8.0" width="420.0" height="64.0" rx="12" fill="#e3f2e1" stroke="#7fb277" stroke-width="1.4"/><text x="342.0" y="36.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Genbrug</tspan></text><text x="342.0" y="57.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>plasten smeltes om til nye ting</tspan></text><line x1="184.0" y1="128.0" x2="305.0" y2="128.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="316.0,128.0 305.0,133.5 305.0,122.5" fill="#14201f"/><rect x="322.0" y="96.0" width="420.0" height="64.0" rx="12" fill="#fdf0dc" stroke="#d9a352" stroke-width="1.4"/><text x="342.0" y="124.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Forbrænding</tspan></text><text x="342.0" y="145.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>giver varme, men også CO</tspan><tspan dy="2.97" font-size="9.2">2</tspan></text><line x1="184.0" y1="128.0" x2="306.8" y2="209.9" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="316.0,216.0 303.8,214.5 309.9,205.3" fill="#14201f"/><rect x="322.0" y="184.0" width="420.0" height="64.0" rx="12" fill="#eceff1" stroke="#9aa7a9" stroke-width="1.4"/><text x="342.0" y="212.0" font-size="16" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Naturen</tspan></text><text x="342.0" y="233.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>nedbrydes ikke, bliver til mikroplast</tspan></text>
</svg>
