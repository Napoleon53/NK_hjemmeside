<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 322" width="780" height="322" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et batteri af zink og kobber. En zinkplade står i ét glas og en kobberplade i et andet. Pladerne er forbundet med en ledning med en pære, og elektronerne løber fra zink til kobber. En saltbro mellem glassene lader ioner vandre. Zink er minuspol og bliver oxideret, og ved pluspolen bliver kobber(II)ioner reduceret">
<title>Et batteri af zink og kobber. En zinkplade står i ét glas og en kobberplade i et andet. Pladerne er forbundet med en ledning med en pære, og elektronerne løber fra zink til kobber. En saltbro mellem glassene lader ioner vandre. Zink er minuspol og bliver oxideret, og ved pluspolen bliver kobber(II)ioner reduceret</title>
