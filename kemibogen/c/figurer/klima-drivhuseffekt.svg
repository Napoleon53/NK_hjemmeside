<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 314" width="780" height="314" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Sollys rammer Jordens overflade og varmer den op. Jorden sender varme ud igen. Noget af varmen slipper ud i rummet, og noget bliver sendt tilbage af drivhusgasserne i luften. Uden drivhusgasser ville Jordens temperatur være minus 18 grader, med drivhusgasser er den 15 grader">
<title>Sollys rammer Jordens overflade og varmer den op. Jorden sender varme ud igen. Noget af varmen slipper ud i rummet, og noget bliver sendt tilbage af drivhusgasserne i luften. Uden drivhusgasser ville Jordens temperatur være minus 18 grader, med drivhusgasser er den 15 grader</title>
