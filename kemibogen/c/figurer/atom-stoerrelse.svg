<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 305" width="690" height="305" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Atomet er meget større end sin kerne">
<title>Atomet er meget større end sin kerne</title>
<defs><radialGradient id="tom"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6effc"/></radialGradient></defs><circle cx="170.0" cy="155.0" r="135.0" fill="url(#tom)" stroke="#1b4aa3" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="170.0" cy="155.0" r="3.0" fill="#e5533d" stroke="#a93226" stroke-width="0.8"/><line x1="253.1" y1="48.6" x2="350.0" y2="52.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="253.1" cy="48.6" r="2.4" fill="#556766"/><text x="358.0" y="50.0" font-size="17" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Atomet</tspan></text><text x="358.0" y="71.0" font-size="14.5" text-anchor="start" fill="#556766"><tspan>Forestil dig, at det fylder en hel by.</tspan></text><line x1="170.0" y1="155.0" x2="350.0" y2="150.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="170.0" cy="155.0" r="2.4" fill="#556766"/><text x="358.0" y="148.0" font-size="17" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Kernen</tspan></text><text x="358.0" y="169.0" font-size="14.5" text-anchor="start" fill="#556766"><tspan>Så er kernen kun en golfbold midt i byen.</tspan></text><text x="358.0" y="240.0" font-size="14.5" text-anchor="start" fill="#556766"><tspan>Resten af atomet er næsten tomt rum,</tspan></text><text x="358.0" y="260.0" font-size="14.5" text-anchor="start" fill="#556766"><tspan>hvor elektronerne bevæger sig.</tspan></text>
</svg>
