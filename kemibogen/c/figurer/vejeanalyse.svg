dth="1.6"/><rect x="458.0" y="128.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><rect x="471.0" y="124.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><rect x="484.0" y="128.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><path d="M 448,116 q -5,-7 0,-13 q 5,-6 0,-12" fill="none" stroke="#e5533d" stroke-width="1.5" stroke-linecap="round"/><path d="M 470,116 q -5,-7 0,-13 q 5,-6 0,-12" fill="none" stroke="#e5533d" stroke-width="1.5" stroke-linecap="round"/><path d="M 492,116 q -5,-7 0,-13 q 5,-6 0,-12" fill="none" stroke="#e5533d" stroke-width="1.5" stroke-linecap="round"/><rect x="597.0" y="142.0" width="116.0" height="8.0" rx="3" fill="#9aa7a9"/><path d="M 603.0,150 H 707.0 L 713.0,182 H 597.0 Z" fill="#dfe5e6" stroke="#556766" stroke-width="1.3"/><rect x="617.0" y="157.0" width="76.0" height="20.0" rx="4" fill="#1f2d2c"/><text x="655.0" y="172.0" font-size="13.5" text-anchor="middle" fill="#b7f5d0" font-weight="700"><tspan>1,537 g</tspan></text><path d="M 619,128 Q 655,150 691,128" fill="#ffffff" stroke="#556766" stroke-width="1.6"/><rect x="630.0" y="118.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><rect x="643.0" y="122.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><rect x="656.0" y="118.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><rect x="669.0" y="122.0" width="11.0" height="11.0" rx="2" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><g class="peg-vejledning" data-tekst="Peg på et af de fire trin i vejeanalysen."/><g class="peg" data-titel="Trin 1: Fældning" data-tekst="Der tilsættes en opløsning, som danner et tungtopløseligt salt med den ion, der skal måles. Opløsningen kaldes fældningsmidlet. Der tilsættes mere af den, end der er brug for, så alle de ioner, der skal måles, ender i bundfaldet."><rect class="peg-maal" x="12.0" y="8.0" width="176.0" height="222.0" fill="none"/></g><g class="peg" data-titel="Trin 2: Filtrering" data-tekst="Bundfaldet samles i et filter, som er vejet på forhånd. Bundfaldet skylles med lidt vand, så de ioner, der ikke hører til bundfaldet, bliver vasket væk."><rect class="peg-maal" x="197.0" y="8.0" width="176.0" height="222.0" fill="none"/></g><g class="peg" data-titel="Trin 3: Tørring" data-tekst="Filteret med bundfaldet tørres i et varmeskab, til massen ikke ændrer sig mere."><rect class="peg-maal" x="382.0" y="8.0" width="176.0" height="222.0" fill="none"/></g><g class="peg" data-titel="Trin 4: Vejning" data-tekst="Filteret med bundfaldet vejes. Når filterets masse trækkes fra, har man bundfaldets masse."><rect class="peg-maal" x="567.0" y="8.0" width="176.0" height="222.0" fill="none"/></g>
</svg>
