<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 236" width="756" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En vejeanalyse i fire trin: ionen fældes ud med et fældningsmiddel i overskud, bundfaldet filtreres fra og skylles, filteret med bundfaldet tørres i et varmeskab, og til sidst vejes det">
<title>En vejeanalyse i fire trin: ionen fældes ud med et fældningsmiddel i overskud, bundfaldet filtreres fra og skylles, filteret med bundfaldet tørres i et varmeskab, og til sidst vejes det</title>
<text x="100.0" y="26.0" font-size="14.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>1 Fældning</tspan></text><text x="100.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>fældningsmidlet tilsættes</tspan></text><text x="100.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>i overskud</tspan></text><text x="285.0" y="26.0" font-size="14.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2 Filtrering</tspan></text><text x="285.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>bundfaldet bliver i filteret</tspan></text><text x="285.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>og skylles med vand</tspan></text><text x="470.0" y="26.0" font-size="14.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3 Tørring</tspan></text><text x="470.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>tørres i varmeskab, til</tspan></text><text x="470.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>massen ikke ændrer sig</tspan></text><text x="655.0" y="26.0" font-size="14.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>4 Vejning</tspan></text><text x="655.0" y="206.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>filter med bundfald vejes,</tspan></text><text x="655.0" y="222.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>og filterets masse trækkes fra</tspan></text><line x1="174.0" y1="118.0" x2="201.0" y2="118.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="210.0,118.0 201.0,122.5 201.0,113.5" fill="#556766"/><line x1="359.0" y1="118.0" x2="386.0" y2="118.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="395.0,118.0 386.0,122.5 386.0,113.5" fill="#556766"/><line x1="544.0" y1="118.0" x2="571.0" y2="118.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="580.0,118.0 571.