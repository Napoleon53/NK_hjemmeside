<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="pH-skalaen fra −1 til 15 med tretten stoffer fra hverdagen, fra mavesyre ved pH 1,5 over rent vand ved pH 7 til afløbsrens ved pH 14. I enderne står to opløsninger fra laboratoriet: 10 M saltsyre ved pH −1 og 10 M natriumhydroxid ved pH 15">
<title>pH-skalaen fra −1 til 15 med tretten stoffer fra hverdagen, fra mavesyre ved pH 1,5 over rent vand ved pH 7 til afløbsrens ved pH 14. I enderne står to opløsninger fra laboratoriet: 10 M saltsyre ved pH −1 og 10 M natriumhydroxid ved pH 15</title>
<g class="peg-vejledning" data-tekst="Peg på et stof eller på et tal på skalaen."/><g class="peg" data-titel="Under −1" data-tekst="Skalaen fortsætter. De mest koncentrerede syrer har en pH lidt under −1." data-noegle="under"><defs><linearGradient id="ud-6b130c-v" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#6b130c" stop-opacity="1"/><stop offset="1" stop-color="#6b130c" stop-opacity="0"/></linearGradient></defs><rect x="6.0" y="104.0" width="26.0" height="40.0" rx="5" fill="url(#ud-6b130c-v)"/></g><g class="peg" data-titel="Over 15" data-tekst="Skalaen fortsætter. De mest koncentrerede baser har en pH over 15." data-noegle="over"><defs><linearGradient id="ud-122b70-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#122b70" stop-opacity="1"/><stop offset="1" stop-color="#122b70" stop-opacity="0"/></linearGradient></defs><rect x="748.0" y="104.0" width="26.0" height="40.0" rx="5" fill="url(#ud-122b70-h)"/></g><g class="peg" data-titel="pH −1" data-tekst="En opløsning med pH −1 er sur. Der er flest oxoniumioner. Så lav en pH har kun en meget koncentreret syre.&#10;[H_{3}O^{+}] = 10^{1} M = 10 M" data-noegle="pH-1"><rect x="34.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#6b130c"/><text x="54.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>−1</tspan></text></g><g class="peg" data-titel="pH 0" data-tekst="En opløsning med pH 0 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{0} M = 1 M" data-noegle="pH0"><rect x="76.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#8f1d14"/><text x="96.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>0</tspan></text></g><g class="peg" data-titel="pH 1" data-tekst="En opløsning med pH 1 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−1} M = 0,1 M" data-noegle="pH1"><rect x="118.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#b52a1e"/><text x="138.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text></g><g class="peg" data-titel="pH 2" data-tekst="En opløsning med pH 2 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−2} M = 0,01 M" data-noegle="pH2"><rect x="160.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#d1432f"/><text x="180.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text></g><g class="peg" data-titel="pH 3" data-tekst="En opløsning med pH 3 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−3} M = 0,001 M" data-noegle="pH3"><rect x="202.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#e06a52"/><text x="222.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text></g><g class="peg" data-titel="pH 4" data-tekst="En opløsning med pH 4 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−4} M" data-noegle="pH4"><rect x="244.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#ec9580"/><text x="264.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>4</tspan></text></g><g class="peg" data-titel="pH 5" data-tekst="En opløsning med pH 5 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−5} M" data-noegle="pH5"><rect x="286.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#f4bcae"/><text x="306.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>5</tspan></text></g><g class="peg" data-titel="pH 6" data-tekst="En opløsning med pH 6 er sur. Der er flest oxoniumioner.&#10;[H_{3}O^{+}] = 10^{−6} M" data-noegle="pH6"><rect x="328.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#fae0d9"/><text x="348.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>6</tspan></text></g><g class="peg" data-titel="pH 7" data-tekst="En opløsning med pH 7 er neutral. Der er lige mange oxoniumioner og hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−7} M" data-noegle="pH7"><rect x="370.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#eef1ef"/><text x="390.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>7</tspan></text></g><g class="peg" data-titel="pH 8" data-tekst="En opløsning med pH 8 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−8} M" data-noegle="pH8"><rect x="412.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#dbe7fb"/><text x="432.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>8</tspan></text></g><g class="peg" data-titel="pH 9" data-tekst="En opløsning med pH 9 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−9} M" data-noegle="pH9"><rect x="454.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#b9d0f7"/><text x="474.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>9</tspan></text></g><g class="peg" data-titel="pH 10" data-tekst="En opløsning med pH 10 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−10} M" data-noegle="pH10"><rect x="496.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#93b4f0"/><text x="516.0" y="129.4" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10</tspan></text></g><g class="peg" data-titel="pH 11" data-tekst="En opløsning med pH 11 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−11} M" data-noegle="pH11"><rect x="538.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#6a93e6"/><text x="558.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>11</tspan></text></g><g class="peg" data-titel="pH 12" data-tekst="En opløsning med pH 12 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−12} M" data-noegle="pH12"><rect x="580.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#4672d8"/><text x="600.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>12</tspan></text></g><g class="peg" data-titel="pH 13" data-tekst="En opløsning med pH 13 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−13} M" data-noegle="pH13"><rect x="622.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#2b55c0"/><text x="642.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>13</tspan></text></g><g class="peg" data-titel="pH 14" data-tekst="En opløsning med pH 14 er basisk. Der er flest hydroxidioner.&#10;[H_{3}O^{+}] = 10^{−14} M" data-noegle="pH14"><rect x="664.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#1b3c96"/><text x="684.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>14</tspan></text></g><g class="peg" data-titel="pH 15" data-tekst="En opløsning med pH 15 er basisk. Der er flest hydroxidioner. Så høj en pH har kun en meget koncentreret base.&#10;[H_{3}O^{+}] = 10^{−15} M" data-noegle="pH15"><rect x="706.0" y="104.0" width="40.0" height="40.0" rx="5" fill="#122b70"/><text x="726.0" y="129.4" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>15</tspan></text></g><g class="peg" data-titel="Mavesyre" data-tekst="Mavesyre er fortyndet saltsyre med en pH mellem 1 og 2. Syren dræber bakterier og hjælper med at nedbryde maden." data-noegle="mavesyre"><rect class="peg-maal" x="117.1" y="29.0" width="63.2" height="37.0" fill="none"/><line x1="159.0" y1="102.0" x2="148.7" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="159.0" cy="102.0" r="2.4" fill="#556766"/><text x="148.7" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>mavesyre</tspan></text><text x="148.7" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 1,5</tspan></text></g><g class="peg" data-titel="Cola" data-tekst="Cola har en pH omkring 2,5. Det er en sur opløsning." data-noegle="cola"><rect class="peg-maal" x="186.3" y="29.0" width="50.0" height="37.0" fill="none"/><line x1="201.0" y1="102.0" x2="211.3" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="201.0" cy="102.0" r="2.4" fill="#556766"/><text x="211.3" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>cola</tspan></text><text x="211.3" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 2,5</tspan></text></g><g class="peg" data-titel="Kaffe" data-tekst="Kaffe har en pH omkring 5. Det er en svagt sur opløsning." data-noegle="kaffe"><rect class="peg-maal" x="281.0" y="29.0" width="50.0" height="37.0" fill="none"/><line x1="306.0" y1="102.0" x2="306.0" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="306.0" cy="102.0" r="2.4" fill="#556766"/><text x="306.0" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>kaffe</tspan></text><text x="306.0" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 5,0</tspan></text></g><g class="peg" data-titel="Rent vand" data-tekst="Rent vand har pH 7,0. Det er neutralt, for der er lige mange oxoniumioner og hydroxidioner." data-noegle="rent-vand"><rect class="peg-maal" x="343.2" y="29.0" width="70.6" height="37.0" fill="none"/><line x1="390.0" y1="102.0" x2="378.5" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="390.0" cy="102.0" r="2.4" fill="#556766"/><text x="378.5" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>rent vand</tspan></text><text x="378.5" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 7,0</tspan></text></g><g class="peg" data-titel="Havvand" data-tekst="Havvand har en pH omkring 8,1. Det er svagt basisk." data-noegle="havvand"><rect class="peg-maal" x="419.8" y="29.0" width="55.8" height="37.0" fill="none"/><line x1="436.2" y1="102.0" x2="447.7" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="436.2" cy="102.0" r="2.4" fill="#556766"/><text x="447.7" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>havvand</tspan></text><text x="447.7" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 8,1</tspan></text></g><g class="peg" data-titel="Sæbevand" data-tekst="Sæbevand har en pH omkring 10. Det er en basisk opløsning." data-noegle="sæbevand"><rect class="peg-maal" x="484.4" y="29.0" width="63.2" height="37.0" fill="none"/><line x1="516.0" y1="102.0" x2="516.0" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="516.0" cy="102.0" r="2.4" fill="#556766"/><text x="516.0" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>sæbevand</tspan></text><text x="516.0" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 10,0</tspan></text></g><g class="peg" data-titel="10 M natriumhydroxid" data-tekst="En opløsning af natriumhydroxid med koncentrationen 10 M findes i laboratoriet. Den har en pH omkring 15. pH kan altså godt være over 14." data-noegle="10-M-natriumhydroxid"><rect class="peg-maal" x="624.0" y="29.0" width="152.0" height="37.0" fill="none"/><line x1="726.0" y1="102.0" x2="700.0" y2="70.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="726.0" cy="102.0" r="2.4" fill="#556766"/><text x="700.0" y="44.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10 M natriumhydroxid</tspan></text><text x="700.0" y="60.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 15,0</tspan></text></g><g class="peg" data-titel="10 M saltsyre" data-tekst="Saltsyre med koncentrationen 10 M findes i laboratoriet. Den har en pH omkring −1. pH kan altså godt være under 0." data-noegle="10-M-saltsyre"><rect class="peg-maal" x="4.0" y="179.0" width="100.2" height="37.0" fill="none"/><line x1="54.0" y1="146.0" x2="54.1" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="54.0" cy="146.0" r="2.4" fill="#556766"/><text x="54.1" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10 M saltsyre</tspan></text><text x="54.1" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH −1,0</tspan></text></g><g class="peg" data-titel="Citronsaft" data-tekst="Citronsaft har en pH omkring 2,3. Den er sur, fordi den indeholder citronsyre." data-noegle="citronsaft"><rect class="peg-maal" x="127.7" y="179.0" width="78.0" height="37.0" fill="none"/><line x1="192.6" y1="146.0" x2="166.7" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="192.6" cy="146.0" r="2.4" fill="#556766"/><text x="166.7" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>citronsaft</tspan></text><text x="166.7" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 2,3</tspan></text></g><g class="peg" data-titel="Appelsinjuice" data-tekst="Appelsinjuice har en pH omkring 3,7. Det er en sur opløsning." data-noegle="appelsinjuice"><rect class="peg-maal" x="211.7" y="179.0" width="100.2" height="37.0" fill="none"/><line x1="251.4" y1="146.0" x2="261.8" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="251.4" cy="146.0" r="2.4" fill="#556766"/><text x="261.8" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>appelsinjuice</tspan></text><text x="261.8" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 3,7</tspan></text></g><g class="peg" data-titel="Mælk" data-tekst="Mælk har en pH omkring 6,7. Den er næsten neutral, men en lille smule sur." data-noegle="mælk"><rect class="peg-maal" x="317.9" y="179.0" width="50.0" height="37.0" fill="none"/><line x1="377.4" y1="146.0" x2="342.9" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="377.4" cy="146.0" r="2.4" fill="#556766"/><text x="342.9" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>mælk</tspan></text><text x="342.9" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 6,7</tspan></text></g><g class="peg" data-titel="Blod" data-tekst="Blod har en pH på 7,4. Det er svagt basisk. Kroppen holder værdien meget konstant, og selv små ændringer er farlige." data-noegle="blod"><rect class="peg-maal" x="373.9" y="179.0" width="50.0" height="37.0" fill="none"/><line x1="406.8" y1="146.0" x2="398.9" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="406.8" cy="146.0" r="2.4" fill="#556766"/><text x="398.9" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>blod</tspan></text><text x="398.9" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 7,4</tspan></text></g><g class="peg" data-titel="Natron i vand" data-tekst="Natron opløst i vand har en pH omkring 8,4. Opløsningen er svagt basisk, fordi natron indeholder basen hydrogencarbonat." data-noegle="natron-i-vand"><rect class="peg-maal" x="429.9" y="179.0" width="100.2" height="37.0" fill="none"/><line x1="448.8" y1="146.0" x2="480.0" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="448.8" cy="146.0" r="2.4" fill="#556766"/><text x="480.0" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>natron i vand</tspan></text><text x="480.0" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 8,4</tspan></text></g><g class="peg" data-titel="Salmiakspiritus" data-tekst="Salmiakspiritus har en pH omkring 11,5. Det er en opløsning af basen ammoniak i vand." data-noegle="salmiakspiritus"><rect class="peg-maal" x="536.1" y="179.0" width="115.0" height="37.0" fill="none"/><line x1="579.0" y1="146.0" x2="593.6" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="579.0" cy="146.0" r="2.4" fill="#556766"/><text x="593.6" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>salmiakspiritus</tspan></text><text x="593.6" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 11,5</tspan></text></g><g class="peg" data-titel="Afløbsrens" data-tekst="Afløbsrens har en pH omkring 14. Det er en stærkt basisk opløsning af natriumhydroxid." data-noegle="afløbsrens"><rect class="peg-maal" x="657.1" y="179.0" width="78.0" height="37.0" fill="none"/><line x1="684.0" y1="146.0" x2="696.1" y2="178.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="684.0" cy="146.0" r="2.4" fill="#556766"/><text x="696.1" y="194.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>afløbsrens</tspan></text><text x="696.1" y="210.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>pH 14,0</tspan></text></g><line x1="364.8" y1="244.0" x2="19.9" y2="244.0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/><polygon points="9.9,244.0 19.9,239.0 19.9,249.0" fill="#c0392b"/><line x1="415.2" y1="244.0" x2="760.1" y2="244.0" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/><polygon points="770.1,244.0 760.1,249.0 760.1,239.0" fill="#1d4ed8"/><circle cx="390.0" cy="244.0" r="4.0" fill="#556766"/><text x="201.0" y="266.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>sur: flest oxoniumioner</tspan></text><text x="390.0" y="266.0" font-size="14" text-anchor="middle" fill="#556766" font-weight="700"><tspan>neutral</tspan></text><text x="579.0" y="266.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>basisk: flest hydroxidioner</tspan></text>
</svg>
