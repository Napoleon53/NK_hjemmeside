<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et destillationstårn på et raffinaderi. Råolien varmes op og ledes ind forneden. Øverst, hvor der er koldest, tages gas ud. Derunder benzin, så petroleum og diesel, så smøreolie og paraffin og nederst asfalt. Jo længere nede, jo længere er carbonkæderne">
<title>Et destillationstårn på et raffinaderi. Råolien varmes op og ledes ind forneden. Øverst, hvor der er koldest, tages gas ud. Derunder benzin, så petroleum og diesel, så smøreolie og paraffin og nederst asfalt. Jo længere nede, jo længere er carbonkæderne</title>
<clipPath id="taarn"><rect x="300" y="30" width="96" height="310" rx="12"/></clipPath><g class="peg-vejledning" data-tekst="Peg på et lag i tårnet, og se, hvorfor det kommer ud netop der."/><g class="peg" data-titel="Gas" data-tekst="Gassen har de korteste kæder med 1 til 4 carbonatomer og det laveste kogepunkt. Den når helt til tops i tårnet. Den bruges som flaskegas. Jo længere kæden er, jo højere er kogepunktet."><rect x="300" y="30.0" width="96" height="62.0" fill="#fdf6e3" clip-path="url(#taarn)"/><line x1="396.0" y1="61.0" x2="432.0" y2="61.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="442.0,61.0 432.0,66.0 432.0,56.0" fill="#14201f"/><text x="452.0" y="58.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>gas</tspan></text><text x="452.0" y="77.0" font-size="13" text-anchor="start" fill="#556766"><tspan>1 til 4 carbonatomer · flaskegas</tspan></text></g><g class="peg" data-titel="Benzin" data-tekst="Benzin har kæder med 5 til 11 carbonatomer og kommer ud næstøverst i tårnet. Benzin bruges i biler. Jo længere kæden er, jo højere er kogepunktet."><rect x="300" y="92.0" width="96" height="62.0" fill="#f8e2a8" clip-path="url(#taarn)"/><line x1="396.0" y1="123.0" x2="432.0" y2="123.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="442.0,123.0 432.0,128.0 432.0,118.0" fill="#14201f"/><text x="452.0" y="120.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>benzin</tspan></text><text x="452.0" y="139.0" font-size="13" text-anchor="start" fill="#556766"><tspan>5 til 11 carbonatomer · biler</tspan></text></g><g class="peg" data-titel="Petroleum og diesel" data-tekst="Petroleum og diesel har kæder med 10 til 20 carbonatomer og kommer ud midt i tårnet. De bruges i fly, lastbiler og skibe. Jo længere kæden er, jo højere er kogepunktet."><rect x="300" y="154.0" width="96" height="62.0" fill="#eebf6b" clip-path="url(#taarn)"/><line x1="396.0" y1="185.0" x2="432.0" y2="185.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="442.0,185.0 432.0,190.0 432.0,180.0" fill="#14201f"/><text x="452.0" y="182.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>petroleum og diesel</tspan></text><text x="452.0" y="201.0" font-size="13" text-anchor="start" fill="#556766"><tspan>10 til 20 carbonatomer · fly, lastbiler og skibe</tspan></text></g><g class="peg" data-titel="Smøreolie og paraffin" data-tekst="Smøreolie og paraffin har kæder med over 20 carbonatomer og kommer ud langt nede i tårnet. De bruges til maskiner og stearinlys. Jo længere kæden er, jo højere er kogepunktet."><rect x="300" y="216.0" width="96" height="62.0" fill="#c98f3f" clip-path="url(#taarn)"/><line x1="396.0" y1="247.0" x2="432.0" y2="247.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="442.0,247.0 432.0,252.0 432.0,242.0" fill="#14201f"/><text x="452.0" y="244.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>smøreolie og paraffin</tspan></text><text x="452.0" y="263.0" font-size="13" text-anchor="start" fill="#556766"><tspan>over 20 carbonatomer · maskiner og stearinlys</tspan></text></g><g class="peg" data-titel="Asfalt" data-tekst="Asfalt har de allerlængste kæder og det højeste kogepunkt. Den bliver til væske igen allerede nederst i tårnet. Asfalt bruges til veje og tage. Jo længere kæden er, jo højere er kogepunktet."><rect x="300" y="278.0" width="96" height="62.0" fill="#6b4a2b" clip-path="url(#taarn)"/><line x1="396.0" y1="309.0" x2="432.0" y2="309.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="442.0,309.0 432.0,314.0 432.0,304.0" fill="#14201f"/><text x="452.0" y="306.0" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>asfalt</tspan></text><text x="452.0" y="325.0" font-size="13" text-anchor="start" fill="#556766"><tspan>de allerlængste kæder · veje og tage</tspan></text></g><g pointer-events="none"><rect x="300.0" y="30.0" width="96.0" height="310.0" rx="12" fill="none" stroke="#556766" stroke-width="2.2"/><line x1="308.0" y1="92.0" x2="388.0" y2="92.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="308.0" y1="154.0" x2="388.0" y2="154.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="308.0" y1="216.0" x2="388.0" y2="216.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/><line x1="308.0" y1="278.0" x2="388.0" y2="278.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="5 4"/></g><g class="peg" data-titel="Råolie" data-tekst="Råolie er en tyk, sort blanding af flere hundrede forskellige carbonhydrider."><rect x="40.0" y="278.0" width="110.0" height="44.0" rx="10" fill="#3d2c1e"/><text x="95.0" y="305.0" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>råolie</tspan></text><text x="95.0" y="340.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>en blanding af</tspan></text><text x="95.0" y="356.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>mange carbonhydrider</tspan></text></g><line x1="150.0" y1="300.0" x2="185.0" y2="300.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="196.0,300.0 185.0,305.5 185.0,294.5" fill="#14201f"/><g class="peg" data-titel="Olien varmes op" data-tekst="Olien varmes op, så det meste fordamper, og dampen ledes ind i et højt tårn."><rect x="198.0" y="278.0" width="56.0" height="44.0" rx="10" fill="#f6cfc8" stroke="#c0392b" stroke-width="1.4"/><text x="226.0" y="305.0" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>varme</tspan></text></g><line x1="254.0" y1="300.0" x2="287.0" y2="300.0" stroke="#14201f" stroke-width="2.4" stroke-linecap="round"/><polygon points="298.0,300.0 287.0,305.5 287.0,294.5" fill="#14201f"/><g class="peg" data-titel="Temperaturen i tårnet" data-tekst="Tårnet er varmest forneden og koldest foroven. De lange molekyler har et højt kogepunkt, så de bliver til væske igen allerede nederst i tårnet. De korte molekyler har et lavt kogepunkt og når helt til tops."><line x1="270.0" y1="250.0" x2="270.0" y2="62.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="270.0,52.0 275.0,62.0 265.0,62.0" fill="#1d4ed8"/><text x="258.0" y="60.0" font-size="13.5" text-anchor="end" fill="#1d4ed8" font-weight="700"><tspan>koldest</tspan></text><text x="258.0" y="78.0" font-size="12.5" text-anchor="end" fill="#556766"><tspan>lavt kogepunkt</tspan></text><text x="258.0" y="240.0" font-size="13.5" text-anchor="end" fill="#c0392b" font-weight="700"><tspan>varmest</tspan></text><text x="258.0" y="258.0" font-size="12.5" text-anchor="end" fill="#556766"><tspan>højt kogepunkt</tspan></text></g>
</svg>
