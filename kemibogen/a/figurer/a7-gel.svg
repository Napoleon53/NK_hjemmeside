<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En gel til elektroforese set fra oven. Prøverne sættes i brønde øverst ved minuspolen, og DNA vandrer ned mod pluspolen. I den første bane er en markør med stykker på 1000, 500, 200 og 100 basepar, som har vandret længere, jo kortere de er. Prøve 1 har to bånd ud for 500 og 100 basepar. Prøve 2 har ét bånd ud for 200 basepar">
