<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Zigzagformler for to stoffer med numre på carbonatomerne. Stof A har seks carbonatomer i en kæde: en dobbeltbinding mellem carbonatom 1 og 2, enkeltbindinger fra 2 til 3 og fra 3 til 4, en tripelbinding mellem carbonatom 4 og 5 og en enkeltbinding fra 5 til 6. Stof B har fem carbonatomer i en kæde med enkeltbindinger. Carbonatom 2 har en dobbeltbinding til et oxygenatom, og på carbonatom 4 sidder en hydroxygruppe">
