<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 158" width="760" height="158" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsskema. Menthon er en ring med seks carbonatomer uden dobbeltbindinger i ringen. På carbonatom nummer 1 sidder et oxygenatom med en dobbeltbinding, på carbonatom nummer 2 sidder en sidegruppe med tre carbonatomer, og på carbonatom nummer 5 sidder en methylgruppe. I reaktion I bliver menthon til menthol, som har en hydroxygruppe og et hydrogenatom på carbonatom nummer 1. I reaktion II bliver menthol og ethansyre til stof B og vand">
