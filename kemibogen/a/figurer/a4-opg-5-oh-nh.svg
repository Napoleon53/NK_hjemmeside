<title>Fire udsnit fra 3800 til 2400 af IR-spektre, mærket A, B, C og D. Alle fire har skarpe bånd mellem 3000 og 2850. Udsnit A har desuden én smal spids ved omkring 3300. Udsnit B har et meget bredt bånd, som begynder ved omkring 3400 og når helt ned til 2500, hen over de skarpe bånd. Udsnit C har et bredt og kraftigt bånd ved omkring 3340. Udsnit D har to smalle spidser ved omkring 3370 og 3300</title>
