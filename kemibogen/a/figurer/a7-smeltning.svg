<title>Dobbeltstrenget DNA i ligevægt med to enkeltstrenge. Opvarmning skiller strengene, og afkøling får dem til at finde sammen igen. Når strengene skilles, er tilvæksten i entalpi positiv, fordi hydrogenbindinger og stablingen af baserne brydes, og tilvæksten i entropi er positiv, fordi to frie strenge har mere uorden</title>
