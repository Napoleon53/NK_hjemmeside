<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for methylbutanoat, CH3−CH2−CH2−CO−O−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 0,95 ppm er methylgruppen i enden af carbonkæden og har rød ring. Signal B ved 1,65 ppm er CH2-gruppen ét carbonatom fra C=O og har blå ring. Signal C ved 2,29 ppm er CH2-gruppen ved siden af C=O og har grøn ring. Signal D ved 3,67 ppm er methylgruppen på oxygenatomet i estergruppen og har orange ring">
