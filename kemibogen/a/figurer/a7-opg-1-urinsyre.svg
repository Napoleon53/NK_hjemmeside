<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for urinsyre. Molekylet har to ringe, der er bygget sammen: en ring med seks atomer og en ring med fem atomer. De to ringe er fælles om to carbonatomer med en dobbeltbinding imellem. Hver ring har to nitrogenatomer, og hvert af de fire nitrogenatomer har et hydrogenatom. Tre carbonatomer i ringene har hver et oxygenatom i dobbeltbinding: to i ringen med seks atomer og ét i ringen med fem atomer">
