<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skitse af energiprofilen for reaktionen mellem brommethan og en chloridion. Kurven har én bakke. Den begynder ved brommethan og chloridionen, går op til toppen, som er overgangstilstanden, hvor carbonatomet er halvt bundet til både chlor og brom, og ender ved chlormethan og en bromidion. Reaktanter og produkter ligger næsten lige højt">
<title>Skitse af energiprofilen for reaktionen mellem brommethan og en chloridion. Kurven har én bakke. Den begynder ved brommethan og chloridionen, går op til toppen, som er overgangstilstanden, hvor carbonatomet er halvt bundet til både chlor og brom, og ender ved chlormethan og en bromidion. Reaktanter og produkter ligger næsten lige højt</title>
