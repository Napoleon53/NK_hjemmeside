<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To skilletragte med et organisk lag øverst og et vandlag nederst. Når vandlaget er surt med pH 2, er benzoesyren i det organiske lag. Når vandlaget er basisk med pH 10, er stoffet som benzoat-ion i vandlaget">
<title>To skilletragte med et organisk lag øverst og et vandlag nederst. Når vandlaget er surt med pH 2, er benzoesyren i det organiske lag. Når vandlaget er basisk med pH 10, er stoffet som benzoat-ion i vandlaget</title>
