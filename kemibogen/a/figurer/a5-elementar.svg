<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="760" height="274" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre slags elementarreaktioner. Ét molekyle A, der omdannes, har hastighedsudtrykket v = k gange koncentrationen af A. Et molekyle A og et molekyle B, der støder sammen, har v = k gange koncentrationen af A gange koncentrationen af B. To molekyler A, der støder sammen, har v = k gange koncentrationen af A i anden">
