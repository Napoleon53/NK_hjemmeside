<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre slags hybridisering af carbon. sp3: 2s og tre 2p-orbitaler er blandet til fire hybridorbitaler, som peger mod hjørnerne i et tetraeder med vinklen 109,5 grader. sp2: 2s og to 2p-orbitaler er blandet til tre hybridorbitaler i samme plan med 120 grader imellem, og én 2p-orbital står vinkelret på planen. sp: 2s og én 2p-orbital er blandet til to hybridorbitaler på linje med 180 grader imellem, og to 2p-orbitaler står vinkelret på linjen">
