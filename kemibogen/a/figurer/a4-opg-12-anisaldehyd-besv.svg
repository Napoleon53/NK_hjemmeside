<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er anisaldehyd: en benzenring med en methoxygruppe og en aldehydgruppe over for hinanden. Signal 1 ved 3,88 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen på oxygen i methoxygruppen og har rød ring. Signal 2 ved 6,99 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest methoxygruppen og har blå ringe. Signal 3 ved 7,83 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aldehydgruppen og har grønne ringe. Signal 4 ved 9,88 ppm, 1 H, singlet, ingen nabo-H, er hydrogenatomet i aldehydgruppen og har orange ring">
