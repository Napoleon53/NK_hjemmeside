<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Energiprofil for en reaktion med to trin. Fra reaktanterne går kurven over en høj bakke til et mellemprodukt, som ligger i en lavning, og derefter over en lavere bakke ned til produkterne. Trin 1 har den højeste aktiveringsenergi og er det langsomme, hastighedsbestemmende trin. Trin 2 er hurtigt">
