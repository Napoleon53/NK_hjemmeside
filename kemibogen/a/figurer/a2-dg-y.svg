<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En kurve formet som en dal. Den viser blandingens Gibbs-energi fra kun reaktanter til kun produkter. I bunden af dalen er der ligevægt, delta G er 0, og Y er lig med K. Til venstre for bunden er delta G negativ, og reaktionen forløber mod højre. Til højre for bunden er delta G positiv, og reaktionen forløber mod venstre">
