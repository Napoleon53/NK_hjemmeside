<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 327" width="760" height="327" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To reaktionsskemaer. I reaktion I bliver æblesyre til fumarsyre og vand. Æblesyre har en kæde på fire carbonatomer med en carboxylgruppe i hver ende og en hydroxygruppe på carbonatom nummer 2. Fumarsyre har samme kæde uden hydroxygruppen og med en dobbeltbinding mellem carbonatom nummer 2 og 3. De to carboxylgrupper sidder på hver sin side af dobbeltbindingen. I reaktion II bliver fumarsyre og dihydrogen til ravsyre, som har enkeltbindinger mellem alle fire carbonatomer">
<title>To reaktionsskemaer. I reaktion I bliver æblesyre til fumarsyre og vand. Æblesyre har en kæde på fire carbonatomer med en carboxylgruppe i hver ende og en hydroxygruppe på carbonatom nummer 2. Fumarsyre har samme kæde uden hydroxygruppen og med en dobbeltbinding mellem carbonatom nummer 2 og 3. De to carboxylgrupper sidder på hver sin side af dobbeltbindingen. I reaktion II bliver fumarsyre og dihydrogen til ravsyre, som har enkeltbindinger mellem alle fire carbonatomer</title>
