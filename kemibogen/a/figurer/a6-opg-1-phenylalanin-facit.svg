<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Phenylalanin, skrevet som C6H5−CH2−CH(NH3+)−COO−, i et enzyms aktive center. Ved 1 peger sidekæden i leucin, som ender i CH(CH3)2, mod benzenringen. Ved 2 peger sidekæden i glutaminsyre med gruppen COO− mod gruppen NH3+. Ved 3 peger sidekæden i serin med gruppen OH mod gruppen COO−. Binding 1 er londonbindinger, binding 2 er en ion-ionbinding, og binding 3 er en hydrogenbinding">
