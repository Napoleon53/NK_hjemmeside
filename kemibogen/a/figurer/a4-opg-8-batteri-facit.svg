<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 161" width="760" height="161" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre stoffer med molekylformlen C3H6O3 med farvede ringe om de ens grupper. Stof A, dimethylcarbonat, CH3−O−CO−O−CH3, har 1 signal: begge methylgrupper er røde. Stof B, methylhydroxyethanoat, HO−CH2−CO−O−CH3, har 3 signaler: hydrogenatomet på oxygen, CH2-gruppen og methylgruppen har hver sin farve. Stof C, mælkesyre, CH3−CH(OH)−COOH, har 4 signaler: methylgruppen, CH-gruppen, hydrogenatomet i hydroxygruppen og hydrogenatomet i carboxylgruppen har hver sin farve">
