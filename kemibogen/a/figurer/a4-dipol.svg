<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre eksempler på, hvornår en svingning absorberer infrarødt lys. Dinitrogen har to ens atomer og ingen ladningsforskel og absorberer ikke. I carbondioxid flytter ladningerne sig i forhold til hinanden ved et asymmetrisk stræk, så molekylet absorberer infrarødt lys og er en drivhusgas. Carbonylgruppen er meget polær og giver et kraftigt bånd">
<title>Tre eksempler på, hvornår en svingning absorberer infrarødt lys. Dinitrogen har to ens atomer og ingen ladningsforskel og absorberer ikke. I carbondioxid flytter ladningerne sig i forhold til hinanden ved et asymmetrisk stræk, så molekylet absorberer infrarødt lys og er en drivhusgas. Carbonylgruppen er meget polær og giver et kraftigt bånd</title>
