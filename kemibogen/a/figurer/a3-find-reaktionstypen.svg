<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" width="760" height="364" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Syv spørgsmål, der fører til reaktionstypen. Er en dobbeltbinding mellem to carbonatomer blevet til en enkeltbinding: addition. Er der dannet en dobbeltbinding, og er et lille molekyle spaltet fra: elimination. Er to molekyler sat sammen, og er der dannet vand: kondensation. Er ét molekyle delt i to med vand som reaktant: hydrolyse. Er et atom eller en gruppe byttet ud: substitution. Har et carbonatom fået et andet oxidationstal: oxidation eller reduktion. Er kun en hydron flyttet: syre-basereaktion">
<title>Syv spørgsmål, der fører til reaktionstypen. Er en dobbeltbinding mellem to carbonatomer blevet til en enkeltbinding: addition. Er der dannet en dobbeltbinding, og er et lille molekyle spaltet fra: elimination. Er to molekyler sat sammen, og er der dannet vand: kondensation. Er ét molekyle delt i to med vand som reaktant: hydrolyse. Er et atom eller en gruppe byttet ud: substitution. Har et carbonatom fået et andet oxidationstal: oxidation eller reduktion. Er kun en hydron flyttet: syre-basereaktion</title>
<g class="peg-vejledning" data-tekst="Peg på et spørgsmål, og se, hvad reaktionstypen går ud på."/><g class="peg" data-titel="Sådan bruges spørgsmålene" data-tekst="Find det sted i molekylet, hvor reaktanten og produktet er forskellige. Resten af molekylet kan du se bort fra. Gå derefter spørgsmålene igennem ét ad gangen." data-noegle="start"><text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#556766" font-weight="700"><tspan>Sammenlign reaktanten og produktet der, hvor de er forskellige:</tspan></text></g><g class="peg" data-titel="Addition" data-tekst="En dobbeltbinding mellem to C-atomer er blevet til en enkeltbinding, og der sidder noget nyt på begge C-atomer.&#10;Eksempel: CH_{2}=CH_{2} + Br_{2} → CH_{2}Br−CH_{2}Br&#10;Ordet addition bruges kun, når der lægges noget til en dobbeltbinding eller tripelbinding mellem to carbonatomer." data-noegle="sp1" data-med="start"><rect x="14.0" y="38.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="36.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="58.0" y="61.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er en C=C blevet til en enkeltbinding med nye atomer på?</tspan></text><line x1="490.0" y1="56.0" x2="525.0" y2="56.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,56.0 525.0,60.5 525.0,51.5" fill="#0f766e"/><text x="512.0" y="48.0" font-size="12" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="40.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="642.0" y="61.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>addition</tspan></text></g><line x1="36.0" y1="74.0" x2="36.0" y2="76.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,82.0 33.0,76.0 39.0,76.0" fill="#556766"/><g class="peg" data-titel="Elimination" data-tekst="Der er dannet en dobbeltbinding mellem to C-atomer, og et lille molekyle er spaltet fra.&#10;Eksempel: CH_{3}CH_{2}OH → CH_{2}=CH_{2} + H_{2}O&#10;Addition og elimination er hinandens modsætninger." data-noegle="sp2" data-med="start sp1"><rect x="14.0" y="84.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="102.0" r="13.0" fill="#0f766e"/><text x="36.0" y="107.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="58.0" y="107.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der dannet en C=C, og er et lille molekyle spaltet fra?</tspan></text><line x1="490.0" y1="102.0" x2="525.0" y2="102.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,102.0 525.0,106.5 525.0,97.5" fill="#0f766e"/><text x="512.0" y="94.0" font-size="12" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="86.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="642.0" y="107.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>elimination</tspan></text></g><line x1="36.0" y1="120.0" x2="36.0" y2="122.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,128.0 33.0,122.0 39.0,122.0" fill="#556766"/><g class="peg" data-titel="Kondensation" data-tekst="To molekyler er sat sammen til ét, og der er dannet vand.&#10;Eksempel: CH_{3}COOH + CH_{3}OH → CH_{3}COOCH_{3} + H_{2}O&#10;En kondensation danner estere af en carboxylsyre og en alkohol og amider af en carboxylsyre og en amin." data-noegle="sp3" data-med="start sp1 sp2"><rect x="14.0" y="130.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="148.0" r="13.0" fill="#0f766e"/><text x="36.0" y="153.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="58.0" y="153.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er to molekyler sat sammen til ét, og er der dannet vand?</tspan></text><line x1="490.0" y1="148.0" x2="525.0" y2="148.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,148.0 525.0,152.5 525.0,143.5" fill="#1d4ed8"/><text x="512.0" y="140.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="132.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="642.0" y="153.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>kondensation</tspan></text></g><line x1="36.0" y1="166.0" x2="36.0" y2="168.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,174.0 33.0,168.0 39.0,168.0" fill="#556766"/><g class="peg" data-titel="Hydrolyse" data-tekst="Ét molekyle er delt i to, og vand er en reaktant.&#10;Eksempel: CH_{3}COOCH_{3} + H_{2}O → CH_{3}COOH + CH_{3}OH&#10;Kondensation og hydrolyse er hinandens modsætninger." data-noegle="sp4" data-med="start sp1 sp2 sp3"><rect x="14.0" y="176.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="194.0" r="13.0" fill="#0f766e"/><text x="36.0" y="199.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="58.0" y="199.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er ét molekyle delt i to, og er vand en reaktant?</tspan></text><line x1="490.0" y1="194.0" x2="525.0" y2="194.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,194.0 525.0,198.5 525.0,189.5" fill="#1d4ed8"/><text x="512.0" y="186.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="178.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="642.0" y="199.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>hydrolyse</tspan></text></g><line x1="36.0" y1="212.0" x2="36.0" y2="214.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,220.0 33.0,214.0 39.0,214.0" fill="#556766"/><g class="peg" data-titel="Substitution" data-tekst="Et atom eller en gruppe er byttet ud med en anden.&#10;Eksempel: CH_{4} + Cl_{2} → CH_{3}Cl + HCl" data-noegle="sp5" data-med="start sp1 sp2 sp3 sp4"><rect x="14.0" y="222.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="240.0" r="13.0" fill="#0f766e"/><text x="36.0" y="245.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>5</tspan></text><text x="58.0" y="245.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er et atom eller en gruppe byttet ud med en anden?</tspan></text><line x1="490.0" y1="240.0" x2="525.0" y2="240.0" stroke="#6d4bb5" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,240.0 525.0,244.5 525.0,235.5" fill="#6d4bb5"/><text x="512.0" y="232.0" font-size="12" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="224.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#6d4bb5" stroke-width="1.8"/><text x="642.0" y="245.0" font-size="14" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>substitution</tspan></text></g><line x1="36.0" y1="258.0" x2="36.0" y2="260.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,266.0 33.0,260.0 39.0,260.0" fill="#556766"/><g class="peg" data-titel="Oxidation eller reduktion" data-tekst="Se på oxidationstallet for det carbonatom, der ændrer sig. Stiger oxidationstallet, er carbonatomet blevet oxideret. Falder det, er carbonatomet blevet reduceret.&#10;Huskeregel: får et carbonatom flere bindinger til oxygen eller færre til hydrogen, er det en oxidation." data-noegle="sp6" data-med="start sp1 sp2 sp3 sp4 sp5"><rect x="14.0" y="268.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="286.0" r="13.0" fill="#0f766e"/><text x="36.0" y="291.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>6</tspan></text><text x="58.0" y="291.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Har et C-atom fået et andet oxidationstal?</tspan></text><line x1="490.0" y1="286.0" x2="525.0" y2="286.0" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,286.0 525.0,290.5 525.0,281.5" fill="#c2410c"/><text x="512.0" y="278.0" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="270.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="642.0" y="291.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>oxidation eller reduktion</tspan></text></g><line x1="36.0" y1="304.0" x2="36.0" y2="306.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,312.0 33.0,306.0 39.0,306.0" fill="#556766"/><g class="peg" data-titel="Syre-basereaktion" data-tekst="En hydron er flyttet fra ét stof til et andet. Kun et H og en ladning har flyttet sig. Carbonskelettet er uændret, og ingen oxidationstal ændres.&#10;Eksempel: R−COOH + OH^{−} → R−COO^{−} + H_{2}O" data-noegle="sp7" data-med="start sp1 sp2 sp3 sp4 sp5 sp6"><rect x="14.0" y="314.0" width="470.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="332.0" r="13.0" fill="#0f766e"/><text x="36.0" y="337.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>7</tspan></text><text x="58.0" y="337.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er det kun en hydron, der er flyttet?</tspan></text><line x1="490.0" y1="332.0" x2="525.0" y2="332.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="534.0,332.0 525.0,336.5 525.0,327.5" fill="#a93226"/><text x="512.0" y="324.0" font-size="12" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>ja</tspan></text><rect x="540.0" y="316.0" width="204.0" height="32.0" rx="16" fill="#ffffff" stroke="#a93226" stroke-width="1.8"/><text x="642.0" y="337.0" font-size="14" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>syre-basereaktion</tspan></text></g>
</svg>
