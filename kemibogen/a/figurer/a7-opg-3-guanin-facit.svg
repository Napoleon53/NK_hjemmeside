<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for guanin med de seks nummererede steder og farvede markeringer. De steder, der kan give et hydrogenatom, er røde: sted 2, som er N−H i ringen, og sted 3, som er aminogruppen. De steder, der kan tage imod med et ledigt elektronpar, er blå: sted 1, som er oxygenatomet i carbonylgruppen, og sted 4 og 5, som er nitrogenatomer i ringene uden hydrogenatom. Sted 6, et carbonatom i femringen, har ingen markering, for det kan ingen af delene">
<title>Strukturformlen for guanin med de seks nummererede steder og farvede markeringer. De steder, der kan give et hydrogenatom, er røde: sted 2, som er N−H i ringen, og sted 3, som er aminogruppen. De steder, der kan tage imod med et ledigt elektronpar, er blå: sted 1, som er oxygenatomet i carbonylgruppen, og sted 4 og 5, som er nitrogenatomer i ringene uden hydrogenatom. Sted 6, et carbonatom i femringen, har ingen markering, for det kan ingen af delene</title>
