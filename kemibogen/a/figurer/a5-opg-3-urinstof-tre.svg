<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" width="760" height="310" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De samme målinger af urinstof tegnet på tre måder med den bedste rette linje i hver graf. I graf 1 står koncentrationen af urinstof på y-aksen. Punkterne ligger tæt på en ret linje, der falder, og forklaringsgraden er 0,9997. I graf 2 står den naturlige logaritme til koncentrationen på y-aksen. Punkterne ligger i en bue, som er under linjen i begge ender og over linjen i midten, og forklaringsgraden er 0,9700. I graf 3 står 1 divideret med koncentrationen på y-aksen. Punkterne ligger i en bue, som er over linjen i begge ender og under linjen i midten, og forklaringsgraden er 0,8772">
