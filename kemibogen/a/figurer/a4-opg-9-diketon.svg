<title>Tre forslag til strukturen af en diketon med molekylformlen C6H10O2 og NMR-spektret af diketonen. Struktur I er CH3−CO−CH2−CH2−CO−CH3. Struktur II er CH3−CH2−CO−CO−CH2−CH3. Struktur III er CH3−CO−CO−CH2−CH2−CH3. Spektret har to signaler: signal A ved 2,19 ppm og signal B ved 2,71 ppm. Signal A er det højeste. Der er ingen signaler under 2 ppm ud over et lille signal fra TMS ved 0 ppm</title>
