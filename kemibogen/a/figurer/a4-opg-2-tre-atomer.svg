<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hybridorbitalerne på tre carbonatomer. Carbonatom A har tre hybridorbitaler, som ligger i papirets plan og peger væk fra hinanden med lige store vinkler imellem. Carbonatom B har fire hybridorbitaler, som peger ud i rummet mod hjørnerne i et tetraeder. Carbonatom C har to hybridorbitaler, som peger hver sin vej på en ret linje">
