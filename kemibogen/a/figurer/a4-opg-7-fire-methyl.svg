766"><tspan>kemisk skift, δ i ppm</tspan></text><line x1="402.2" y1="31.0" x2="94.4" y2="31.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="84.4,31.0 94.4,26.0 94.4,36.0" fill="#a93226"/><text x="243.3" y="23.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>dårligere skærmet</tspan></text><line x1="438.9" y1="31.0" x2="648.9" y2="31.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="658.9,31.0 648.9,36.0 648.9,26.0" fill="#1d4ed8"/><text x="548.9" y="23.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>bedre skærmet</tspan></text><line x1="561.1" y1="150.0" x2="561.1" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="561.1" y="90.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>0,9 ppm</tspan></text><text x="561.1" y="72.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">−CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan></text><line x1="365.6" y1="150.0" x2="365.6" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="365.6" y="90.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2,5 ppm</tspan></text><text x="365.6" y="72.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">−NH</tspan><tspan dy="3.19" font-size="9.9">2</tspan></text><line x1="255.6" y1="150.0" x2="255.6" y2="98.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="255.6" y="90.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3,4 ppm</tspan></text><text x="255.6" y="72.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19"