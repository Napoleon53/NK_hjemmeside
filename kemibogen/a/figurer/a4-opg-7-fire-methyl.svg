<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 204" width="760" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En akse med kemisk skift fra 5 ppm til venstre til 0 ppm til højre. Signalet fra methylgruppen i ethan står ved 0,9 ppm, i methylamin ved 2,5 ppm, i methanol ved 3,4 ppm og i fluormethan ved 4,3 ppm. Signalet fra TMS står ved 0 ppm. Jo længere til venstre et signal står, jo dårligere er hydrogenkernerne skærmet">
