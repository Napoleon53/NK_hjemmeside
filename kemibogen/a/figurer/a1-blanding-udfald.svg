<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre udfald, når 10,0 millimol af en svag syre blandes med stærk base. Med 3,0 millimol hydroxid er der 7,0 millimol syre og 3,0 millimol base bagefter: et puffersystem. Med 10,0 millimol hydroxid er der kun base: en svag base. Med 13,0 millimol er der 3,0 millimol hydroxid i overskud: en stærk base">
<title>Tre udfald, når 10,0 millimol af en svag syre blandes med stærk base. Med 3,0 millimol hydroxid er der 7,0 millimol syre og 3,0 millimol base bagefter: et puffersystem. Med 10,0 millimol hydroxid er der kun base: en svag base. Med 13,0 millimol er der 3,0 millimol hydroxid i overskud: en stærk base</title>
<text x="380.0" y="22.0" font-size="14.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>10,0 mmol af en svag syre blandes med</tspan></text><rect x="12.0" y="34.0" width="236.0" height="196.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="130.0" y="60.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>3,0 mmol hydroxid</tspan></text><text x="130.0" y="84.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>efter reaktionen:</tspan></text><rect x="32.5" y="96.0" width="105.0" height="26.0" rx="3" fill="#a93226" stroke="#ffffff" stroke-width="1.5"/><rect x="137.5" y="96.0" width="45.0" height="26.0" rx="3" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/><text x="130.0" y="144.0" font-size="13.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>7,0 mmol syre</tspan></text><text x="130.0" y="162.0" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>3,0 mmol base</tspan></text><text x="130.0" y="192.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>puffersystem</tspan></text><text x="130.0" y="214.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>pufferligningen</tspan></text><rect x="262.0" y="34.0" width="236.0" height="196.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="380.0" y="60.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10,0 mmol hydroxid</tspan></text><text x="380.0" y="84.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>efter reaktionen:</tspan></text><rect x="282.5" y="96.0" width="150.0" height="26.0" rx="3" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/><text x="380.0" y="144.0" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>10,0 mmol base</tspan></text><text x="380.0" y="192.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>svag base</tspan></text><text x="380.0" y="214.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>SÆL-skema og K</tspan><tspan dy="2.97" font-size="9.2">b</tspan></text><rect x="512.0" y="34.0" width="236.0" height="196.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="630.0" y="60.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>13,0 mmol hydroxid</tspan></text><text x="630.0" y="84.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>efter reaktionen:</tspan></text><rect x="532.5" y="96.0" width="150.0" height="26.0" rx="3" fill="#1d4ed8" stroke="#ffffff" stroke-width="1.5"/><rect x="682.5" y="96.0" width="45.0" height="26.0" rx="3" fill="#6d4bb5" stroke="#ffffff" stroke-width="1.5"/><text x="630.0" y="144.0" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>10,0 mmol base</tspan></text><text x="630.0" y="162.0" font-size="13.5" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>3,0 mmol OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan></text><text x="630.0" y="192.0" font-size="16" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>stærk base</tspan></text><text x="630.0" y="214.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>pOH = −log[OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">]</tspan></text>
