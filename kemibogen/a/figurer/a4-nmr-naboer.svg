<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Opsplitningen af et signal afhænger af antallet af nabo-hydrogenatomer. Ingen naboer giver en singlet. Én nabo kan pege op eller ned og giver en dublet med højderne 1 til 1. To naboer kan pege op-op, op-ned, ned-op eller ned-ned og giver en triplet med højderne 1 til 2 til 1. Tre naboer giver en kvartet med højderne 1 til 3 til 3 til 1">
