<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" width="760" height="350" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et basepar af adenin og thymin med de to hydrogenbindinger mellem baserne. Over adenin sidder sidekæden fra glutamin, som hænger ned fra et protein: to carbonatomer i en kæde og derefter en amidgruppe med et oxygenatom med dobbeltbinding og en gruppe NH2. Oxygenatomet i amidgruppen sidder lige over for det hydrogenatom i aminogruppen på adenin, som ikke bruges i baseparret. Et hydrogenatom på amidgruppens nitrogenatom peger ned mod et nitrogenatom i femringen i adenin. Der er ikke tegnet hydrogenbindinger mellem sidekæden og adenin">
<title>Et basepar af adenin og thymin med de to hydrogenbindinger mellem baserne. Over adenin sidder sidekæden fra glutamin, som hænger ned fra et protein: to carbonatomer i en kæde og derefter en amidgruppe med et oxygenatom med dobbeltbinding og en gruppe NH2. Oxygenatomet i amidgruppen sidder lige over for det hydrogenatom i aminogruppen på adenin, som ikke bruges i baseparret. Et hydrogenatom på amidgruppens nitrogenatom peger ned mod et nitrogenatom i femringen i adenin. Der er ikke tegnet hydrogenbindinger mellem sidekæden og adenin</title>
