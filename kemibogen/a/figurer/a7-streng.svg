<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En DNA-streng med fire nucleotider tegnet med symboler. Sukker og phosphat skiftes til at sidde i kæden og danner strengens rygrad. Baserne adenin, thymin, guanin og cytosin stikker ud til siden. Øverst er 5 mærke-enden med en phosphatgruppe, og nederst er 3 mærke-enden med en OH-gruppe. Hver phosphatgruppe har en negativ ladning. Rækkefølgen af baser skrives fra 5 mærke-enden til 3 mærke-enden: ATGC">
