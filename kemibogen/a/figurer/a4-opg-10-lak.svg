<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre forslag til strukturen af diacetonealkohol, som har molekylformlen C6H12O2, og NMR-spektret af stoffet. Struktur I er (CH3)2C(OH)−CH2−CO−CH3. Struktur II er HO−CH2−C(CH3)2−CO−CH3. Struktur III er (CH3)3C−CO−CH2−OH. Spektret har fire signaler. Signal A ved 1,26 ppm har integralet 3,00. Signal B ved 2,18 ppm har integralet 1,50. Signal C ved 2,60 ppm har integralet 1,00. Signal D ved 3,80 ppm er lavt og bredt og har integralet 0,50">
<title>Tre forslag til strukturen af diacetonealkohol, som har molekylformlen C6H12O2, og NMR-spektret af stoffet. Struktur I er (CH3)2C(OH)−CH2−CO−CH3. Struktur II er HO−CH2−C(CH3)2−CO−CH3. Struktur III er (CH3)3C−CO−CH2−OH. Spektret har fire signaler. Signal A ved 1,26 ppm har integralet 3,00. Signal B ved 2,18 ppm har integralet 1,50. Signal C ved 2,60 ppm har integralet 1,00. Signal D ved 3,80 ppm er lavt og bredt og har integralet 0,50</title>
