<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="DNA-polymerase sætter et nucleotid på en voksende streng. Øverst: den nye streng har baserne A, T og G og ender med en OH-gruppe i 3 mærke-enden. Den sidder på en skabelonstreng med baserne T, A, C, C, G og T. Et nyt nucleotid med basen G og tre phosphatgrupper ligger klar over for det næste C i skabelonstrengen. En buet pil går fra OH-gruppens ledige elektronpar til den inderste phosphatgruppe. Nederst: den nye streng er blevet ét nucleotid længere og har igen en fri OH-gruppe, og de to yderste phosphatgrupper er spaltet fra som diphosphat">
