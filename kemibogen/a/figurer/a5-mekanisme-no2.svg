<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mekanismen for reaktionen mellem nitrogendioxid og carbonmonoxid. Trin 1 er langsomt: to molekyler nitrogendioxid bliver til nitrogentrioxid og nitrogenoxid. Trin 2 er hurtigt: nitrogentrioxid og carbonmonoxid bliver til nitrogendioxid og carbondioxid. Nitrogentrioxid og det ene nitrogendioxid går ud, når trinene lægges sammen, og det samlede reaktionsskema er nitrogendioxid plus carbonmonoxid giver nitrogenoxid plus carbondioxid">
<title>Mekanismen for reaktionen mellem nitrogendioxid og carbonmonoxid. Trin 1 er langsomt: to molekyler nitrogendioxid bliver til nitrogentrioxid og nitrogenoxid. Trin 2 er hurtigt: nitrogentrioxid og carbonmonoxid bliver til nitrogendioxid og carbondioxid. Nitrogentrioxid og det ene nitrogendioxid går ud, når trinene lægges sammen, og det samlede reaktionsskema er nitrogendioxid plus carbonmonoxid giver nitrogenoxid plus carbondioxid</title>
