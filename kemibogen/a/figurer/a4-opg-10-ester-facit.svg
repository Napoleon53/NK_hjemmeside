<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for methyl-3,3-dimethylbutanoat, (CH3)3C−CH2−CO−O−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 1,02 ppm med trinnet 45 millimeter, 9 H, er de tre ens methylgrupper i carbonkæden og har rød ring. Signal B ved 2,19 ppm med trinnet 10 millimeter, 2 H, er CH2-gruppen ved siden af C=O og har blå ring. Signal C ved 3,65 ppm med trinnet 15 millimeter, 3 H, er methylgruppen på oxygenatomet i estergruppen og har grøn ring">
<title>Tilordningen for methyl-3,3-dimethylbutanoat, (CH3)3C−CH2−CO−O−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 1,02 ppm med trinnet 45 millimeter, 9 H, er de tre ens methylgrupper i carbonkæden og har rød ring. Signal B ved 2,19 ppm med trinnet 10 millimeter, 2 H, er CH2-gruppen ved siden af C=O og har blå ring. Signal C ved 3,65 ppm med trinnet 15 millimeter, 3 H, er methylgruppen på oxygenatomet i estergruppen og har grøn ring</title>
