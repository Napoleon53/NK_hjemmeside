<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Benzen. Til venstre en benzenring set skråt fra siden med en 2p-orbital på hvert af de seks carbonatomer. I midten er de seks p-orbitaler smeltet sammen til én fælles elektronsky, som ligger som en ring over og en ring under molekylet. Til højre de to måder at tegne benzen på: en sekskant med tre dobbeltbindinger og en sekskant med en cirkel. Alle seks bindinger er 139 picometer lange">
<title>Benzen. Til venstre en benzenring set skråt fra siden med en 2p-orbital på hvert af de seks carbonatomer. I midten er de seks p-orbitaler smeltet sammen til én fælles elektronsky, som ligger som en ring over og en ring under molekylet. Til højre de to måder at tegne benzen på: en sekskant med tre dobbeltbindinger og en sekskant med en cirkel. Alle seks bindinger er 139 picometer lange</title>
