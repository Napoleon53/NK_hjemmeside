<title>Den samme sidekæde ved to pH-værdier. Ved pH 7 er carboxylgruppen i asparaginsyre negativt ladet og danner en ion-ionbinding til substratets positivt ladede gruppe. Ved pH 2 har carboxylgruppen optaget en hydron og er uden ladning, så ion-ionbindingen er væk, og substratet slipper</title>
