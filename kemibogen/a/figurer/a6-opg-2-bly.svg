<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To kurver for starthastigheden som funktion af koncentrationen af substrat fra 0 til 20 millimolær. Kurven uden blyioner nærmer sig en stiplet linje ved 80 mikromolær pr. minut og går gennem 40 mikromolær pr. minut ved 2,0 millimolær. Kurven med blyioner ligger lavere. Den nærmer sig en stiplet linje ved 50 mikromolær pr. minut og går gennem 25 mikromolær pr. minut ved 2,0 millimolær. Koordinatsystemet har et fint net til aflæsning">
