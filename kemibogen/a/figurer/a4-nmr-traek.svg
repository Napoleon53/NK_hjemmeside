<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre methylgrupper med forskellige naboer. I en carbonkæde er hydrogenkernerne godt skærmet, og signalet ligger ved 0,9 ppm. Ved siden af C=O er de dårligere skærmet, og signalet ligger ved 2,1 ppm. På et oxygenatom er de dårligt skærmet, og signalet ligger ved 3,5 ppm. Jo mere elektronerne trækkes væk fra hydrogenkernerne, jo højere er det kemiske skift">
<title>Tre methylgrupper med forskellige naboer. I en carbonkæde er hydrogenkernerne godt skærmet, og signalet ligger ved 0,9 ppm. Ved siden af C=O er de dårligere skærmet, og signalet ligger ved 2,1 ppm. På et oxygenatom er de dårligt skærmet, og signalet ligger ved 3,5 ppm. Jo mere elektronerne trækkes væk fra hydrogenkernerne, jo højere er det kemiske skift</title>
<rect x="76.6" y="30.1" width="51.2" height="31.5" rx="9" fill="#dcf1ee" stroke="#0f766e" stroke-width="1.8"/><text x="102.2" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan></text><text x="136.0" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>−</tspan></text><text x="163.8" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan></text><text x="130.0" y="96.0" font-size="17" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>0,9 ppm</tspan></text><text x="130.0" y="122.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>kun carbon og hydrogen som naboer:</tspan></text><text x="130.0" y="139.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>godt skærmet</tspan></text><rect x="319.7" y="30.1" width="51.2" height="31.5" rx="9" fill="#fdebd3" stroke="#b45309" stroke-width="1.8"/><text x="345.3" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan></text><text x="379.1" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>−</tspan></text><text x="395.0" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>C</tspan></text><text x="413.8" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>=</tspan></text><text x="432.5" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>O</tspan></text><text x="380.0" y="96.0" font-size="17" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2,1 ppm</tspan></text><text x="380.0" y="122.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>C=O trækker lidt i elektronerne:</tspan></text><text x="380.0" y="139.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>dårligere skærmet</tspan></text><rect x="588.5" y="30.1" width="51.2" height="31.5" rx="9" fill="#fbe1dd" stroke="#c0392b" stroke-width="1.8"/><text x="614.1" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan></text><text x="647.8" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>−</tspan></text><text x="663.8" y="50.0" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>O</tspan></text><text x="630.0" y="96.0" font-size="17" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3,5 ppm</tspan></text><text x="630.0" y="122.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>oxygen trækker kraftigt i elektronerne:</tspan></text><text x="630.0" y="139.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>dårligt skærmet</tspan></text><line x1="200.0" y1="164.0" x2="551.0" y2="164.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="560.0,164.0 551.0,168.5 551.0,159.5" fill="#556766"/><text x="380.0" y="184.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>elektronerne trækkes væk fra hydrogenkernerne: det kemiske skift stiger</tspan></text><line x1="254.0" y1="16.0" x2="254.0" y2="148.0" stroke="#c3d6d4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="506.0" y1="16.0" x2="506.0" y2="148.0" stroke="#c3d6d4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
