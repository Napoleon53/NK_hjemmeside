<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 198" width="760" height="198" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En hårnål af DNA tegnet på to måder. Til venstre er strengen foldet: de fem første baser, G, C, T, A og C, sidder som basepar over for de fem sidste, G, T, A, G og C, og fire baser T danner en sløjfe mellem dem. Til højre er den samme streng foldet ud til en lige enkeltstreng med 14 baser fra 5′-enden til 3′-enden. Mellem de to former står en ligevægtspil, hvor opvarmning fører mod den udfoldede form og afkøling mod den foldede">
<title>En hårnål af DNA tegnet på to måder. Til venstre er strengen foldet: de fem første baser, G, C, T, A og C, sidder som basepar over for de fem sidste, G, T, A, G og C, og fire baser T danner en sløjfe mellem dem. Til højre er den samme streng foldet ud til en lige enkeltstreng med 14 baser fra 5′-enden til 3′-enden. Mellem de to former står en ligevægtspil, hvor opvarmning fører mod den udfoldede form og afkøling mod den foldede</title>
