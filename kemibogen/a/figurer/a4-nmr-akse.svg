<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Aksen i et NMR-spektrum. Den viser det kemiske skift i ppm fra 12 til venstre til 0 til højre. Nulpunktet er stoffet TMS. Jo dårligere skærmet en hydrogenkerne er, jo længere til venstre ligger dens signal. Eksempler: hydrogen i en methylgruppe på carbon omkring 0,9, methyl ved siden af C=O omkring 2,1, methyl på oxygen omkring 3,6, hydrogen på en dobbeltbinding omkring 5,3, hydrogen på en benzenring omkring 7,3, hydrogen i en aldehydgruppe omkring 9,7 og hydrogen i en carboxylgruppe omkring 11,5">
