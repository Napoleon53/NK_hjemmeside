<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for limonen og carvon. Limonen har en ring med seks carbonatomer og én dobbeltbinding i ringen. Carbonatomet øverst i ringen bærer en methylgruppe og er med i dobbeltbindingen. Carbonatomet nederst i ringen bærer en sidegruppe på tre carbonatomer med en dobbeltbinding til en CH2-gruppe. Carvon har samme skelet og desuden en dobbeltbinding til et oxygenatom på det carbonatom i ringen, der sidder ved siden af carbonatomet med methylgruppen">
<title>Strukturformler for limonen og carvon. Limonen har en ring med seks carbonatomer og én dobbeltbinding i ringen. Carbonatomet øverst i ringen bærer en methylgruppe og er med i dobbeltbindingen. Carbonatomet nederst i ringen bærer en sidegruppe på tre carbonatomer med en dobbeltbinding til en CH2-gruppe. Carvon har samme skelet og desuden en dobbeltbinding til et oxygenatom på det carbonatom i ringen, der sidder ved siden af carbonatomet med methylgruppen</title>
