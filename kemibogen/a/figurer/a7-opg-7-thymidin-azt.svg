<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 306" width="760" height="306" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for thymidin og AZT. I begge molekyler er basen thymin bundet med et nitrogenatom til carbonatom 1 mærke i sukkeret deoxyribose, som er en ring med fire carbonatomer og et oxygenatom. Thymin har to carbonylgrupper, en N−H-gruppe, en methylgruppe og en dobbeltbinding mellem to carbonatomer i ringen. På carbonatom 4 mærke sidder gruppen CH2OH med carbonatom 5 mærke. Thymidin har en OH-gruppe på carbonatom 3 mærke. AZT har i stedet en gruppe med tre nitrogenatomer, N3, på carbonatom 3 mærke">
<title>Strukturformler for thymidin og AZT. I begge molekyler er basen thymin bundet med et nitrogenatom til carbonatom 1 mærke i sukkeret deoxyribose, som er en ring med fire carbonatomer og et oxygenatom. Thymin har to carbonylgrupper, en N−H-gruppe, en methylgruppe og en dobbeltbinding mellem to carbonatomer i ringen. På carbonatom 4 mærke sidder gruppen CH2OH med carbonatom 5 mærke. Thymidin har en OH-gruppe på carbonatom 3 mærke. AZT har i stedet en gruppe med tre nitrogenatomer, N3, på carbonatom 3 mærke</title>
