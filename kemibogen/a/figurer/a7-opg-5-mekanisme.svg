<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Det nye nucleotid er tegnet som sukker og base bundet til en kæde af tre phosphatgrupper: oxygen, phosphor, oxygen, phosphor, oxygen, phosphor og oxygen med negativ ladning. Hvert phosphoratom har også et dobbeltbundet oxygenatom og et oxygenatom med negativ ladning. Phosphoratomerne har numrene 1, 2 og 3 regnet fra sukkeret, og de fem bindinger i kæden har bogstaverne a til e fra sukkeret og udad. Nedenunder ses 3 mærke-enden af den nye DNA-streng med en OH-gruppe, hvis oxygenatom har to ledige elektronpar">
