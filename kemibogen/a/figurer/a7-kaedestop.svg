<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To molekyler, der ligner hinanden. Thymidin er basen thymin bundet til deoxyribose og har en OH-gruppe på carbonatom 3 mærke, som kan binde det næste nucleotid. Lægemidlet AZT er magen til, men har på carbonatom 3 mærke en gruppe med tre nitrogenatomer i stedet for OH-gruppen, så kæden ikke kan blive længere">
<title>To molekyler, der ligner hinanden. Thymidin er basen thymin bundet til deoxyribose og har en OH-gruppe på carbonatom 3 mærke, som kan binde det næste nucleotid. Lægemidlet AZT er magen til, men har på carbonatom 3 mærke en gruppe med tre nitrogenatomer i stedet for OH-gruppen, så kæden ikke kan blive længere</title>
<text x="190.0" y="28.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Thymidin: kroppens egen byggesten</tspan></text><polygon points="140.9,114.1 182.6,91.3 181.5,89.1 139.1,110.7" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="197.4,91.3 239.1,114.1 240.9,110.7 198.5,89.1" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="238.4,111.3 215.6,144.4 220.4,147.6 241.6,113.5" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="218.0,143.1 162.0,143.1 162.0,148.9 218.0,148.9" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="164.4,144.4 141.6,111.3 138.4,113.5 159.6,147.6" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><text x="190.0" y="91.2" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>O</tspan></text><line x1="140.0" y1="112.4" x2="140.0" y2="96.4" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="151.4" y="92.7" font-size="15" text-anchor="end" fill="#14201f" font-weight="700"><tspan>HOCH</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text><line x1="240.0" y1="112.4" x2="240.0" y2="96.4" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="234.4" y="92.7" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>thymin</tspan></text><line x1="218.0" y1="146.0" x2="218.0" y2="162.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="218.0" y="176.2" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><line x1="162.0" y1="146.0" x2="162.0" y2="162.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><text x="156.4" y="176.2" font-size="15" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>OH</tspan></text><text x="127.0" y="117.4" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>4′</tspan></text><text x="253.0" y="117.4" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>1′</tspan></text><text x="231.0" y="148.0" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>2′</tspan></text><text x="149.0" y="148.0" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>3′</tspan></text><circle cx="162.0" cy="172.0" r="19.0" fill="none" stroke="#0f766e" stroke-width="2"/><text x="190.0" y="216.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>OH-gruppen på carbonatom 3′ kan</tspan></text><text x="190.0" y="233.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>binde det næste nucleotid</tspan></text><text x="570.0" y="28.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>AZT: et lægemiddel mod hiv</tspan></text><polygon points="520.9,114.1 562.6,91.3 561.5,89.1 519.1,110.7" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="577.4,91.3 619.1,114.1 620.9,110.7 578.5,89.1" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="618.4,111.3 595.6,144.4 600.4,147.6 621.6,113.5" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="598.0,143.1 542.0,143.1 542.0,148.9 598.0,148.9" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><polygon points="544.4,144.4 521.6,111.3 518.4,113.5 539.6,147.6" fill="#14201f" stroke="#14201f" stroke-width="0.6" stroke-linejoin="round"/><text x="570.0" y="91.2" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>O</tspan></text><line x1="520.0" y1="112.4" x2="520.0" y2="96.4" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="531.4" y="92.7" font-size="15" text-anchor="end" fill="#14201f" font-weight="700"><tspan>HOCH</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text><line x1="620.0" y1="112.4" x2="620.0" y2="96.4" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="614.5" y="92.7" font-size="15" text-anchor="start" fill="#14201f" font-weight="700"><tspan>thymin</tspan></text><line x1="598.0" y1="146.0" x2="598.0" y2="162.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="598.0" y="176.2" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan></text><line x1="542.0" y1="146.0" x2="542.0" y2="162.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><text x="536.5" y="176.2" font-size="15" text-anchor="start" fill="#a93226" font-weight="700"><tspan>N</tspan><tspan dy="3.30" font-size="10.2">3</tspan></text><text x="507.0" y="117.4" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>4′</tspan></text><text x="633.0" y="117.4" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>1′</tspan></text><text x="611.0" y="148.0" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>2′</tspan></text><text x="529.0" y="148.0" font-size="11.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>3′</tspan></text><circle cx="542.0" cy="172.0" r="19.0" fill="none" stroke="#a93226" stroke-width="2"/><text x="570.0" y="216.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>Her sidder en gruppe med tre nitrogenatomer,</tspan></text><text x="570.0" y="233.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>så kæden kan ikke blive længere</tspan></text><line x1="380.0" y1="14.0" x2="380.0" y2="240.0" stroke="#c3d6d4" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/>
</svg>
