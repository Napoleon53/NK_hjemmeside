<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for et nucleotid fra DNA med tre dele i hver sin kasse. Del 1 til venstre indeholder et phosphoratom med fire oxygenatomer omkring sig, og to af oxygenatomerne har en negativ ladning. Del 2 i midten er en ring med fire carbonatomer og et oxygenatom. Carbonatomerne har numrene 1 mærke til 5 mærke, og på carbonatom 3 mærke sidder en OH-gruppe. Del 3 øverst har to ringe med nitrogenatomer, der er bygget sammen, og på ringene sidder et oxygenatom med dobbeltbinding og en NH2-gruppe. Del 1 er bundet til carbonatom 5 mærke gennem et oxygenatom, og del 3 er bundet til carbonatom 1 mærke med et nitrogenatom">
<title>Strukturformlen for et nucleotid fra DNA med tre dele i hver sin kasse. Del 1 til venstre indeholder et phosphoratom med fire oxygenatomer omkring sig, og to af oxygenatomerne har en negativ ladning. Del 2 i midten er en ring med fire carbonatomer og et oxygenatom. Carbonatomerne har numrene 1 mærke til 5 mærke, og på carbonatom 3 mærke sidder en OH-gruppe. Del 3 øverst har to ringe med nitrogenatomer, der er bygget sammen, og på ringene sidder et oxygenatom med dobbeltbinding og en NH2-gruppe. Del 1 er bundet til carbonatom 5 mærke gennem et oxygenatom, og del 3 er bundet til carbonatom 1 mærke med et nitrogenatom</title>
