<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Sidekæden fra lysin, skrevet som peptidkæde−CH2−CH2−CH2−CH2−NH3+, i lommen i enzymet trypsin. Ved 1 peger sidekæden i valin, som ender i CH(CH3)2, mod carbonkæden. Ved 2 peger sidekæden i serin med gruppen OH mod gruppen NH3+. Ved 3 peger sidekæden i asparaginsyre med gruppen COO− mod gruppen NH3+. Binding 1 er londonbindinger, binding 2 er en hydrogenbinding, og binding 3 er en ion-ionbinding">
