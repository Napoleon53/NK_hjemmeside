<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er propan-2-ol, CH3−CH(OH)−CH3. Signal A ved 1,20 ppm, 6 H, dublet, 1 nabo-H, er de to methylgrupper på CH-gruppen og har røde ringe. Signal B ved 2,2 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har blå ring. Signal C ved 4,00 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen, som sidder på oxygenatomet mellem de to methylgrupper, og har grøn ring">
