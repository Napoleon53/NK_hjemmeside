<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 210" width="756" height="210" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnevejen for en base: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH">
<title>Regnevejen for en base: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH</title>
<g class="peg-vejledning" data-tekst="Peg på et trin eller en kasse i regnevejen."/><g class="peg" data-titel="*c*_{b}: basens formelle koncentration" data-tekst="Udgangspunktet er basens formelle koncentration." data-noegle="kasse0"><rect x="30.0" y="62.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="92.0" y="92.5" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c</tspan><tspan dy="3.52" font-size="10.9">b</tspan></text><text x="92.0" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>basens formelle</tspan></text><text x="92.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>koncentration</tspan></text><rect class="peg-maal" x="30.0" y="62.0" width="124.0" height="90.0" fill="none"/></g><g class="peg" data-titel="[OH^{−}]: koncentrationen af hydroxidioner" data-tekst="En base danner hydroxidioner, ikke oxoniumioner. Derfor finder man først [OH^{−}]." data-noegle="kasse1"><rect x="220.0" y="62.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="282.0" y="92.5" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[OH</tspan><tspan dy="-6.08" font-size="10.9">−</tspan><tspan dy="6.08">]</tspan></text></g><g class="peg" data-titel="pOH" data-tekst="pOH beregnes af koncentrationen af hydroxidioner: pOH = −log [OH^{−}]." data-noegle="kasse2"><rect x="410.0" y="62.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="472.0" y="92.5" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pOH</tspan></text></g><g class="peg" data-titel="pH" data-tekst="pH findes til sidst ud fra pOH." data-noegle="kasse3"><rect x="600.0" y="62.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="662.0" y="92.5" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH</tspan></text></g><g class="peg" data-titel="Trin 1: fra *c*_{b} til [OH^{−}]" data-tekst="For en stærk base er [OH^{−}] lig med den formelle koncentration, *c*_{b}. For en svag base har kun en del af basen reageret, og så skal ligningen løses." data-noegle="trin1" data-med="kasse0 kasse1"><line x1="161.0" y1="86.0" x2="203.0" y2="86.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="213.0,86.0 203.0,91.0 203.0,81.0" fill="#b45309"/><circle cx="187.0" cy="46.0" r="13.0" fill="#0f766e"/><text x="187.0" y="51.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="187.0" y="8.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>stærk base: [OH</tspan><tspan dy="-4.75" font-size="8.5">−</tspan><tspan dy="4.75">] = c</tspan><tspan dy="2.75" font-size="8.5">b</tspan></text><text x="187.0" y="24.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>svag base: løs ligningen</tspan></text><rect class="peg-maal" x="95.0" y="-6.0" width="184.0" height="66.0" fill="none"/></g><g class="peg" data-titel="Trin 2: pOH = −log [OH^{−}]" data-tekst="pOH beregnes af koncentrationen af hydroxidioner." data-noegle="trin2" data-med="kasse1 kasse2"><line x1="351.0" y1="86.0" x2="393.0" y2="86.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="403.0,86.0 393.0,91.0 393.0,81.0" fill="#b45309"/><circle cx="377.0" cy="46.0" r="13.0" fill="#0f766e"/><text x="377.0" y="51.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="377.0" y="24.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pOH = −log [OH</tspan><tspan dy="-4.75" font-size="8.5">−</tspan><tspan dy="4.75">]</tspan></text><rect class="peg-maal" x="285.0" y="-6.0" width="184.0" height="66.0" fill="none"/></g><g class="peg" data-titel="Trin 3: pH = 14,00 − pOH" data-tekst="Det sidste trin bruger sammenhængen pH + pOH = 14,00." data-noegle="trin3" data-med="kasse2 kasse3"><line x1="541.0" y1="86.0" x2="583.0" y2="86.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="593.0,86.0 583.0,91.0 583.0,81.0" fill="#b45309"/><circle cx="567.0" cy="46.0" r="13.0" fill="#0f766e"/><text x="567.0" y="51.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="567.0" y="24.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH = 14,00 − pOH</tspan></text><rect class="peg-maal" x="475.0" y="-6.0" width="184.0" height="66.0" fill="none"/></g><g class="peg" data-titel="Genvej for en svag base" data-tekst="Formlen pOH = ½ · (p*K*_{b} − log *c*_{b}) fører direkte fra den formelle koncentration til pOH. Genvejen gælder kun for svage baser." data-med="kasse0 kasse2"><path d="M 92,158 V 178 H 472 V 116" fill="none" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="472.0" y1="126.0" x2="472.0" y2="122.0" stroke="#1d4ed8" stroke-width="1.8" stroke-linecap="round"/><polygon points="472.0,114.0 476.0,122.0 468.0,122.0" fill="#1d4ed8"/><text x="282.0" y="198.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>genvej for en svag base: pOH = ½ · (pK</tspan><tspan dy="2.86" font-size="8.8">b</tspan><tspan dy="-2.86"> − log c</tspan><tspan dy="2.86" font-size="8.8">b</tspan><tspan dy="-2.86">)</tspan></text><rect class="peg-maal" x="98.0" y="182.0" width="368.0" height="24.0" fill="none"/></g>
</svg>
