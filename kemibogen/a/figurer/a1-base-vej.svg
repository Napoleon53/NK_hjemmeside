<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 210" width="756" height="210" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnevejen for en base: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH">
<title>Regnevejen for en base: fra basens koncentration til hydroxidkoncentrationen, til pOH og til pH. For en svag base er der en genvej direkte til pOH</title>
