<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Til venstre strukturformlen for ionen ethidium. Den har tre sekskantede ringe, der er bygget sammen i en bue og ligger i samme plan. Den midterste ring indeholder et nitrogenatom med en positiv ladning. På nitrogenatomet sidder en ethylgruppe, og på carbonatomet ved siden af sidder en benzenring. Hver af de to yderste ringe har en aminogruppe. Til højre er dobbeltspiralen tegnet fra siden på to måder. Uden ethidium ligger baseparrene som flade brikker i en stabel med 0,34 nanometer imellem. Med ethidium ligger en ethidiumion som en ekstra flad brik mellem to basepar, så stablen er blevet én brik højere">
<title>Til venstre strukturformlen for ionen ethidium. Den har tre sekskantede ringe, der er bygget sammen i en bue og ligger i samme plan. Den midterste ring indeholder et nitrogenatom med en positiv ladning. På nitrogenatomet sidder en ethylgruppe, og på carbonatomet ved siden af sidder en benzenring. Hver af de to yderste ringe har en aminogruppe. Til højre er dobbeltspiralen tegnet fra siden på to måder. Uden ethidium ligger baseparrene som flade brikker i en stabel med 0,34 nanometer imellem. Med ethidium ligger en ethidiumion som en ekstra flad brik mellem to basepar, så stablen er blevet én brik højere</title>
