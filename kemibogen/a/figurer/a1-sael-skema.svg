<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 256" width="780" height="256" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et SÆL-skema for PCl5 = PCl3 + Cl2. Rækken Start: 2,00 bar, 0 bar og 0 bar. Rækken Ændring: minus x, plus x og plus x. Rækken Ligevægt: 2,00 bar minus x, x og x. Forbogstaverne S, Æ og L er fremhævet">
<title>Et SÆL-skema for PCl5 = PCl3 + Cl2. Rækken Start: 2,00 bar, 0 bar og 0 bar. Rækken Ændring: minus x, plus x og plus x. Rækken Ligevægt: 2,00 bar minus x, x og x. Forbogstaverne S, Æ og L er fremhævet</title>
