<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for 4-hydroxy-4-methylpentan-2-on, (CH3)2C(OH)−CH2−CO−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 1,26 ppm med integralet 3,00, 6 H, er de to ens methylgrupper, som sidder ét carbonatom fra oxygenatomet, og har rød ring. Signal B ved 2,18 ppm med integralet 1,50, 3 H, er methylgruppen ved siden af C=O og har blå ring. Signal C ved 2,60 ppm med integralet 1,00, 2 H, er CH2-gruppen ved siden af C=O og har grøn ring. Signal D ved 3,80 ppm med integralet 0,50, 1 H, er hydrogenatomet på oxygen i hydroxygruppen og har orange ring">
<title>Tilordningen for 4-hydroxy-4-methylpentan-2-on, (CH3)2C(OH)−CH2−CO−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 1,26 ppm med integralet 3,00, 6 H, er de to ens methylgrupper, som sidder ét carbonatom fra oxygenatomet, og har rød ring. Signal B ved 2,18 ppm med integralet 1,50, 3 H, er methylgruppen ved siden af C=O og har blå ring. Signal C ved 2,60 ppm med integralet 1,00, 2 H, er CH2-gruppen ved siden af C=O og har grøn ring. Signal D ved 3,80 ppm med integralet 0,50, 1 H, er hydrogenatomet på oxygen i hydroxygruppen og har orange ring</title>
