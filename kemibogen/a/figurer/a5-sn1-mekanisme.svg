<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mekanismen for en S N 1-reaktion mellem 2-brom-2-methylpropan og en hydroxidion i to trin. I trin 1, som er langsomt, går bindingen mellem carbon og brom i stykker, og bromatomet tager begge elektroner med. Der dannes en bromidion og en carbokation, som er plan og kun har tre bindinger. I trin 2, som er hurtigt, angriber hydroxidionens ledige elektronpar det positive carbonatom, og der dannes 2-methylpropan-2-ol">
<title>Mekanismen for en S N 1-reaktion mellem 2-brom-2-methylpropan og en hydroxidion i to trin. I trin 1, som er langsomt, går bindingen mellem carbon og brom i stykker, og bromatomet tager begge elektroner med. Der dannes en bromidion og en carbokation, som er plan og kun har tre bindinger. I trin 2, som er hurtigt, angriber hydroxidionens ledige elektronpar det positive carbonatom, og der dannes 2-methylpropan-2-ol</title>
