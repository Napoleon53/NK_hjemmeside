<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To zigzagformler med en pil imellem, hvor der står lys. Begge molekyler har en ring med seks carbonatomer, én dobbeltbinding i ringen og tre methylgrupper på ringen. Fra ringen går en kæde på ni carbonatomer med fire dobbeltbindinger, som skifter med enkeltbindinger, to methylgrupper og en aldehydgruppe for enden. I 11-cis-retinal bøjer kæden samme vej på begge sider af dobbeltbindingen mellem carbonatom 11 og 12, så kæden har et knæk. I trans-retinal fortsætter kæden i zigzag hen over dobbeltbindingen mellem carbonatom 11 og 12, så kæden er strakt ud">
<title>To zigzagformler med en pil imellem, hvor der står lys. Begge molekyler har en ring med seks carbonatomer, én dobbeltbinding i ringen og tre methylgrupper på ringen. Fra ringen går en kæde på ni carbonatomer med fire dobbeltbindinger, som skifter med enkeltbindinger, to methylgrupper og en aldehydgruppe for enden. I 11-cis-retinal bøjer kæden samme vej på begge sider af dobbeltbindingen mellem carbonatom 11 og 12, så kæden har et knæk. I trans-retinal fortsætter kæden i zigzag hen over dobbeltbindingen mellem carbonatom 11 og 12, så kæden er strakt ud</title>
