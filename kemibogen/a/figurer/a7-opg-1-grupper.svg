<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for nucleotidet med cytosin fra DNA med fire grupper i farvede kasser. Gruppe 1 er et phosphoratom med fire oxygenatomer omkring sig. Det ene oxygenatom binder phosphoratomet til carbonatom 5 mærke i sukkeret. Gruppe 2 er en OH-gruppe på carbonatom 3 mærke i sukkeret. Gruppe 3 er en NH2-gruppe på ringen i basen. Gruppe 4 er et carbonatom i basens ring med et oxygenatom i dobbeltbinding, og carbonatomet har et nitrogenatom som nabo på begge sider">
