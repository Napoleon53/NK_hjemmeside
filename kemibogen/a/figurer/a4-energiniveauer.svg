<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 362" width="760" height="362" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Orbitalernes energi vist som kasser på en lodret akse. Nederst 1s, derefter 2s, 2p, 3s, 3p, 4s, 3d og 4p. En s-orbital er én kasse med plads til 2 elektroner, p-orbitalerne er tre kasser med plads til 6 elektroner, og d-orbitalerne er fem kasser med plads til 10 elektroner. 4s ligger lavere end 3d">
