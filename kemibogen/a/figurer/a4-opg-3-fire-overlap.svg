<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 204" width="760" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire tegninger af to orbitaler, der overlapper. A: to kugler, som overlapper på linjen mellem de to atomkerner. B: en hybridorbital med en stor og en lille lap, hvor den store lap peger mod en kugle og overlapper med den på linjen mellem kernerne. C: to p-orbitaler med hver to lapper, som står side om side og overlapper over og under linjen mellem kernerne. D: to hybridorbitaler, hvis store lapper peger mod hinanden og overlapper på linjen mellem kernerne">
