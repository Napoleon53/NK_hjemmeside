<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Zigzagformler for oliesyre og elaidinsyre. Begge er en kæde på 18 carbonatomer med en carboxylgruppe på carbonatom 1 og en dobbeltbinding mellem carbonatom 9 og 10. I oliesyre bøjer kæden samme vej på begge sider af dobbeltbindingen, så molekylet har et knæk. I elaidinsyre fortsætter kæden i zigzag hen over dobbeltbindingen, så molekylet er næsten lige">
<title>Zigzagformler for oliesyre og elaidinsyre. Begge er en kæde på 18 carbonatomer med en carboxylgruppe på carbonatom 1 og en dobbeltbinding mellem carbonatom 9 og 10. I oliesyre bøjer kæden samme vej på begge sider af dobbeltbindingen, så molekylet har et knæk. I elaidinsyre fortsætter kæden i zigzag hen over dobbeltbindingen, så molekylet er næsten lige</title>
