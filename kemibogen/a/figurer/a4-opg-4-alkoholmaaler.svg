<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 204" width="760" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tegning af en alkoholmåler set fra siden. Til venstre en lampe, som sender infrarødt lys mod højre. Lyset går gennem et kammer, hvor udåndingsluften blæses ind i den ene ende og ud i den anden. Lysstrålen bliver svagere gennem kammeret, fordi ethanol absorberer noget af lyset. Efter kammeret sidder et filter, som kun lader lys med bølgelængden 9,50 mikrometer slippe igennem, og til sidst en detektor, som måler lyset">
<title>Tegning af en alkoholmåler set fra siden. Til venstre en lampe, som sender infrarødt lys mod højre. Lyset går gennem et kammer, hvor udåndingsluften blæses ind i den ene ende og ud i den anden. Lysstrålen bliver svagere gennem kammeret, fordi ethanol absorberer noget af lyset. Efter kammeret sidder et filter, som kun lader lys med bølgelængden 9,50 mikrometer slippe igennem, og til sidst en detektor, som måler lyset</title>
