<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Til venstre zigzagformlen for efedrin: en benzenring med en kæde, hvor det første carbonatom har en hydroxygruppe, og det næste har en methylgruppe og en aminogruppe med en methylgruppe på nitrogenatomet. Til højre en graf over log D som funktion af pH. Kurven er vandret ved 1,1 fra pH 14 ned til omkring pH 11, knækker omkring pH 9,6 og falder derefter med 1 for hver pH-enhed, pH bliver lavere. Ved pH 7,4 er log D minus 1,1">
<title>Til venstre zigzagformlen for efedrin: en benzenring med en kæde, hvor det første carbonatom har en hydroxygruppe, og det næste har en methylgruppe og en aminogruppe med en methylgruppe på nitrogenatomet. Til højre en graf over log D som funktion af pH. Kurven er vandret ved 1,1 fra pH 14 ned til omkring pH 11, knækker omkring pH 9,6 og falder derefter med 1 for hver pH-enhed, pH bliver lavere. Ved pH 7,4 er log D minus 1,1</title>
