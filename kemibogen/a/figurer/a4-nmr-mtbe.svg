<title>Stoffet 2-methoxy-2-methylpropan, (CH3)3C−O−CH3, og dets NMR-spektrum. De tre ens methylgrupper er ringet ind med rødt og giver signal A ved 1,19 ppm. Methylgruppen på oxygenatomet er ringet ind med blåt og giver signal B ved 3,21 ppm. Signal A er tre gange så højt som signal B</title>
