<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Den naturlige logaritme til hastighedskonstanten som funktion af 1 divideret med temperaturen i kelvin for to reaktioner. Linjen for reaktion A, hvor bakterier dør, er stejl: den går gennem minus 4,0 ved 3,00 gange ti i minus tredje pr. kelvin, som svarer til 60 grader, og gennem 0,0 ved 2,90 gange ti i minus tredje pr. kelvin, som svarer til 72 grader. Linjen for reaktion B, hvor vitamin B1 nedbrydes, er flad: den går gennem minus 13,0 ved 60 grader og minus 12,0 ved 72 grader. To stiplede lodrette linjer viser 60 grader og 72 grader">
<title>Den naturlige logaritme til hastighedskonstanten som funktion af 1 divideret med temperaturen i kelvin for to reaktioner. Linjen for reaktion A, hvor bakterier dør, er stejl: den går gennem minus 4,0 ved 3,00 gange ti i minus tredje pr. kelvin, som svarer til 60 grader, og gennem 0,0 ved 2,90 gange ti i minus tredje pr. kelvin, som svarer til 72 grader. Linjen for reaktion B, hvor vitamin B1 nedbrydes, er flad: den går gennem minus 13,0 ved 60 grader og minus 12,0 ved 72 grader. To stiplede lodrette linjer viser 60 grader og 72 grader</title>
