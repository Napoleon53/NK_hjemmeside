<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 162" width="760" height="162" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Zigzagformler for geraniol og citral med en pil fra geraniol til citral, hvor der står oxidation. Geraniol har en kæde på otte carbonatomer med to dobbeltbindinger mellem carbonatomer, to methylgrupper og en hydroxygruppe for enden. Carbonatom 1 bærer hydroxygruppen. Carbonatom 2 og 3 er forbundet med en dobbeltbinding. Carbonatom 4 er methylgruppen på carbonatom 3. I citral har carbonatom 1 en dobbeltbinding til et oxygenatom i stedet for hydroxygruppen">
<title>Zigzagformler for geraniol og citral med en pil fra geraniol til citral, hvor der står oxidation. Geraniol har en kæde på otte carbonatomer med to dobbeltbindinger mellem carbonatomer, to methylgrupper og en hydroxygruppe for enden. Carbonatom 1 bærer hydroxygruppen. Carbonatom 2 og 3 er forbundet med en dobbeltbinding. Carbonatom 4 er methylgruppen på carbonatom 3. I citral har carbonatom 1 en dobbeltbinding til et oxygenatom i stedet for hydroxygruppen</title>
