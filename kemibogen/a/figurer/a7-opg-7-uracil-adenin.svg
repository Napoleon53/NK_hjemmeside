<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Til venstre strukturformlerne for cytosin og uracil med tre nummererede pladser på den kant, der vender mod den anden streng. I cytosin er plads 1 en aminogruppe, NH2, plads 2 et nitrogenatom i ringen uden hydrogenatom og plads 3 oxygenatomet i en carbonylgruppe. I uracil er plads 1 oxygenatomet i en carbonylgruppe, plads 2 en N−H-gruppe i ringen og plads 3 oxygenatomet i en carbonylgruppe. Til højre står adenin over for uracil uden hydrogenbindinger. Adenin har en aminogruppe over for det øverste oxygenatom i uracil og et nitrogenatom i ringen uden hydrogenatom over for N−H-gruppen i uracil">
