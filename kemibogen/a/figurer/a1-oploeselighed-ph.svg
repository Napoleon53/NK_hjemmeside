556766" stroke-width="2.2" stroke-linecap="round"/><path d="M 573.5,134 H 686.5 V 150 Q 686.5,156.5 679.5,156.5 H 580.5 Q 573.5,156.5 573.5,150 Z" fill="#ffffff" stroke="#6f7c7f" stroke-width="1.5"/><text x="630.0" y="188.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>mere bundfald</tspan></text><text x="630.0" y="209.0" font-size="13.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>mere OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">: mod venstre</tspan></text><line x1="302.0" y1="110.0" x2="231.0" y2="110.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="222.0,110.0 231.0,105.5 231.0,114.5" fill="#556766"/><line x1="458.0" y1="110.0" x2="529.0" y2="110.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="538.0,110.0 529.0,114.5 529.0,105.5" fill="#556766"/><text x="380.0" y="238.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Mg(OH)</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">(s) ⇌ Mg</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">(aq) + 2 OH</tspan><tspan dy="-5.70" font-size="10.2">−</tspan><tspan dy="5.70">(aq)</tspan></text>
