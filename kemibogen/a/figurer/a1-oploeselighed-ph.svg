<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre bægerglas med magnesiumhydroxid. I rent vand ligger der et lag hvidt bundfald. Når der tilsættes syre, går alt i opløsning. Når der tilsættes base, bliver laget af bundfald tykkere">
<title>Tre bægerglas med magnesiumhydroxid. I rent vand ligger der et lag hvidt bundfald. Når der tilsættes syre, går alt i opløsning. Når der tilsættes base, bliver laget af bundfald tykkere</title>
