<title>En kolonne til tre tidspunkter og det chromatogram, den giver. Ved start ligger blandingen som ét bånd øverst i kolonnen. Lidt senere er blandingen skilt i et blåt bånd, der er nået længst, og et orange bånd, der er bagefter. Endnu senere er det blå stof på vej ud af kolonnen. I chromatogrammet kommer toppen for det blå stof først og toppen for det orange stof senere</title>
