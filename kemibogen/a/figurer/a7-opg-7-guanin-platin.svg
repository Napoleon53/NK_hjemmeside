<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="760" height="274" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for guanin i et basepar med cytosin. De to baser holdes sammen af tre hydrogenbindinger på den kant af guanin, der vender mod cytosin. Guanin består af en ring med seks atomer og en ring med fem atomer. Et nitrogenatom i ringen med fem atomer er markeret med en grøn ring. Det sidder på den side af guanin, der vender væk fra cytosin. Det har en dobbeltbinding til ét carbonatom og en enkeltbinding til et andet carbonatom og intet hydrogenatom">
<title>Strukturformlen for guanin i et basepar med cytosin. De to baser holdes sammen af tre hydrogenbindinger på den kant af guanin, der vender mod cytosin. Guanin består af en ring med seks atomer og en ring med fem atomer. Et nitrogenatom i ringen med fem atomer er markeret med en grøn ring. Det sidder på den side af guanin, der vender væk fra cytosin. Det har en dobbeltbinding til ét carbonatom og en enkeltbinding til et andet carbonatom og intet hydrogenatom</title>
