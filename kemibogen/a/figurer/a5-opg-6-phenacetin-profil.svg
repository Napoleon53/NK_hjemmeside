<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skitse af energiprofilen for reaktionen mellem ionen af paracetamol og iodethan efter forslag 1. Kurven har én bakke. Den begynder ved ionen af paracetamol og iodethan, går op til toppen, som er overgangstilstanden, og ender ved phenacetin og en iodidion, som ligger lavere end reaktanterne. En pil fra reaktanternes niveau op til toppen viser aktiveringsenergien">
<title>Skitse af energiprofilen for reaktionen mellem ionen af paracetamol og iodethan efter forslag 1. Kurven har én bakke. Den begynder ved ionen af paracetamol og iodethan, går op til toppen, som er overgangstilstanden, og ender ved phenacetin og en iodidion, som ligger lavere end reaktanterne. En pil fra reaktanternes niveau op til toppen viser aktiveringsenergien</title>
