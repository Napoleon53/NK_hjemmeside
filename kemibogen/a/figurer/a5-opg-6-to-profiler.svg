<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 292" width="760" height="292" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To energiprofiler. Profil 1 har én bakke: kurven begynder ved A, går op til toppen B og ender ved C, som ligger lavere end A. Profil 2 har to bakker: kurven begynder ved D, går op til den høje top E, ned i lavningen F, op til den lavere top G og ender ved H, som ligger lavere end D. Højden fra D til E er større end højden fra F til G">
