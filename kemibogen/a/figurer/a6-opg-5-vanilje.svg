<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 444" width="760" height="444" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Øverst strukturformlerne for vanillin og ethylvanillin. Begge er en benzenring med en aldehydgruppe, en hydroxygruppe over for aldehydgruppen og en ethergruppe ved siden af hydroxygruppen. I vanillin sidder der en methylgruppe på ethergruppens oxygenatom. I ethylvanillin sidder der en ethylgruppe. Nederst chromatogrammet af opløsning B af vaniljesukkeret med to toppe. Top A ligger ved 3,2 minutter og har arealet 602. Top B ligger ved 4,9 minutter og har arealet 344">
<title>Øverst strukturformlerne for vanillin og ethylvanillin. Begge er en benzenring med en aldehydgruppe, en hydroxygruppe over for aldehydgruppen og en ethergruppe ved siden af hydroxygruppen. I vanillin sidder der en methylgruppe på ethergruppens oxygenatom. I ethylvanillin sidder der en ethylgruppe. Nederst chromatogrammet af opløsning B af vaniljesukkeret med to toppe. Top A ligger ved 3,2 minutter og har arealet 602. Top B ligger ved 4,9 minutter og har arealet 344</title>
