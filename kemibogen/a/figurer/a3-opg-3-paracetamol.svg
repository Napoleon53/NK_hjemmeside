<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 281" width="760" height="281" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To reaktionsskemaer. I reaktion I bliver paracetamol og vand til 4-aminophenol og ethansyre. Paracetamol har en benzenring med en hydroxygruppe og over for den et nitrogenatom med et hydrogenatom. Nitrogenatomet er bundet til et carbonatom, som har en dobbeltbinding til et oxygenatom og en methylgruppe. 4-aminophenol har en benzenring med en hydroxygruppe og over for den en aminogruppe. I reaktion II bliver 4-aminophenol og en oxoniumion til en ion, hvor aminogruppen har fået et hydrogenatom mere og en positiv ladning, og til vand">
<title>To reaktionsskemaer. I reaktion I bliver paracetamol og vand til 4-aminophenol og ethansyre. Paracetamol har en benzenring med en hydroxygruppe og over for den et nitrogenatom med et hydrogenatom. Nitrogenatomet er bundet til et carbonatom, som har en dobbeltbinding til et oxygenatom og en methylgruppe. 4-aminophenol har en benzenring med en hydroxygruppe og over for den en aminogruppe. I reaktion II bliver 4-aminophenol og en oxoniumion til en ion, hvor aminogruppen har fået et hydrogenatom mere og en positiv ladning, og til vand</title>
