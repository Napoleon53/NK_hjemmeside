<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Omvendt fase i en HPLC-kolonne. På overfladen af kornene i kolonnen sidder lange carbonkæder, som er den upolære stationære fase. Den mobile fase er en polær blanding af vand og methanol, som strømmer forbi. Et upolært stof holdes tilbage mellem carbonkæderne af londonbindinger. Et polært stof følger med den mobile fase og kommer hurtigt ud">
<title>Omvendt fase i en HPLC-kolonne. På overfladen af kornene i kolonnen sidder lange carbonkæder, som er den upolære stationære fase. Den mobile fase er en polær blanding af vand og methanol, som strømmer forbi. Et upolært stof holdes tilbage mellem carbonkæderne af londonbindinger. Et polært stof følger med den mobile fase og kommer hurtigt ud</title>
