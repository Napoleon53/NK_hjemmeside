<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Det samme udsnit af et IR-spektrum fra 1900 til 1500 tegnet på to måder. I kurve 1 går den lodrette akse fra 0 til 1,2. Kurven ligger tæt ved 0 og har to bånd, der peger opad: bånd X ved 1715 når op til 1,0, og bånd Y ved 1642 når op til 0,30. I kurve 2 går den lodrette akse fra 0 til 100. Kurven ligger tæt ved 100 og har to bånd, der peger nedad: bånd X når ned til 10, og bånd Y når ned til 50">
<title>Det samme udsnit af et IR-spektrum fra 1900 til 1500 tegnet på to måder. I kurve 1 går den lodrette akse fra 0 til 1,2. Kurven ligger tæt ved 0 og har to bånd, der peger opad: bånd X ved 1715 når op til 1,0, og bånd Y ved 1642 når op til 0,30. I kurve 2 går den lodrette akse fra 0 til 100. Kurven ligger tæt ved 100 og har to bånd, der peger nedad: bånd X når ned til 10, og bånd Y når ned til 50</title>
