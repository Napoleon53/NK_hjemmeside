<title>En enkeltbinding er en sigma-binding, som ser ens ud, uanset hvordan den ene ende drejes, så den kan drejes frit. En dobbeltbinding har også en pi-binding. Drejes den ene ende 90 grader, overlapper de to p-orbitaler ikke længere, og pi-bindingen er brudt. Derfor kan en dobbeltbinding ikke drejes</title>
