<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre zigzagformler med numre på carbonatomerne. Stof A er en kæde på fire carbonatomer med dobbeltbindinger mellem carbonatom 1 og 2 og mellem carbonatom 3 og 4. Stof B er en kæde på fire carbonatomer, hvor carbonatom 2 har en dobbeltbinding til et oxygenatom, og hvor der er en tripelbinding mellem carbonatom 3 og 4. Stof C er en ring med seks carbonatomer og én dobbeltbinding mellem carbonatom 1 og 2">
