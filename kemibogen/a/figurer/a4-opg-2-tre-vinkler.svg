<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 202" width="760" height="202" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre carbonatomer i propan, propen og propyn tegnet som kugler. I propan danner de tre carbonatomer en vinkel på 109,5 grader, og det midterste carbonatom er sp3-hybridiseret. I propen er der en dobbeltbinding mellem to af carbonatomerne, vinklen er 120 grader, og det midterste carbonatom er sp2-hybridiseret. I propyn er der en tripelbinding mellem to af carbonatomerne, de tre carbonatomer ligger på en ret linje med vinklen 180 grader, og det midterste carbonatom er sp-hybridiseret">
<title>De tre carbonatomer i propan, propen og propyn tegnet som kugler. I propan danner de tre carbonatomer en vinkel på 109,5 grader, og det midterste carbonatom er sp3-hybridiseret. I propen er der en dobbeltbinding mellem to af carbonatomerne, vinklen er 120 grader, og det midterste carbonatom er sp2-hybridiseret. I propyn er der en tripelbinding mellem to af carbonatomerne, de tre carbonatomer ligger på en ret linje med vinklen 180 grader, og det midterste carbonatom er sp-hybridiseret</title>
