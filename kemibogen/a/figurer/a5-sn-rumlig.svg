<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Den rumlige opbygning ved de to mekanismer, vist for 2-brombutan og en hydroxidion. Ved S N 2 kommer hydroxidionen ind fra den side, der er modsat bromatomet, og der dannes kun ét produkt, hvor opbygningen omkring carbonatomet er vendt. Ved S N 1 dannes først en plan carbokation, som hydroxidionen kan angribe fra begge sider. Der dannes to spejlbilledformer i lige store mængder, altså en racemisk blanding">
<title>Den rumlige opbygning ved de to mekanismer, vist for 2-brombutan og en hydroxidion. Ved S N 2 kommer hydroxidionen ind fra den side, der er modsat bromatomet, og der dannes kun ét produkt, hvor opbygningen omkring carbonatomet er vendt. Ved S N 1 dannes først en plan carbokation, som hydroxidionen kan angribe fra begge sider. Der dannes to spejlbilledformer i lige store mængder, altså en racemisk blanding</title>
