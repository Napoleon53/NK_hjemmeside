<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et stykke af rygraden i DNA skrevet som sukker, phosphatgruppe, sukker, phosphatgruppe og sukker. Hver phosphatgruppe har en negativ ladning. Over den første phosphatgruppe sidder sidekæden fra lysin med gruppen NH3 plus, og under den sidder sidekæden fra serin med en OH-gruppe. Over den anden phosphatgruppe sidder sidekæden fra arginin med en positivt ladet gruppe. De tre bindinger har numrene 1, 2 og 3, og deres navne er ikke vist">
<title>Et stykke af rygraden i DNA skrevet som sukker, phosphatgruppe, sukker, phosphatgruppe og sukker. Hver phosphatgruppe har en negativ ladning. Over den første phosphatgruppe sidder sidekæden fra lysin med gruppen NH3 plus, og under den sidder sidekæden fra serin med en OH-gruppe. Over den anden phosphatgruppe sidder sidekæden fra arginin med en positivt ladet gruppe. De tre bindinger har numrene 1, 2 og 3, og deres navne er ikke vist</title>
