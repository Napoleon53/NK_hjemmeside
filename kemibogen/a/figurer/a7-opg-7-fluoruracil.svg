<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for uracil, thymin og 5-fluoruracil. Alle tre er en ring med fire carbonatomer og to nitrogenatomer. De har to carbonylgrupper, to N−H-grupper og en dobbeltbinding mellem to carbonatomer i ringen. Det ene carbonatom i dobbeltbindingen er markeret med en kasse. På det carbonatom sidder der et hydrogenatom i uracil, en methylgruppe i thymin og et fluoratom i 5-fluoruracil. En pil med teksten enzym fører fra uracil til thymin">
