<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To thyminbaser ved siden af hinanden i samme DNA-streng før og efter belysning med ultraviolet lys. Før har hver base en dobbeltbinding mellem to carbonatomer i ringen. Efter er de to dobbeltbindinger blevet til enkeltbindinger, og der er dannet to nye bindinger mellem de to baser, så fire carbonatomer danner en firkantet ring. Det kaldes en thymindimer">
<title>To thyminbaser ved siden af hinanden i samme DNA-streng før og efter belysning med ultraviolet lys. Før har hver base en dobbeltbinding mellem to carbonatomer i ringen. Efter er de to dobbeltbindinger blevet til enkeltbindinger, og der er dannet to nye bindinger mellem de to baser, så fire carbonatomer danner en firkantet ring. Det kaldes en thymindimer</title>
