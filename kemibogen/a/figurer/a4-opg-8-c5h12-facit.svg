<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 161" width="760" height="161" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre alkaner med molekylformlen C5H12 med farvede ringe om de ens grupper. Pentan har 3 signaler: de to methylgrupper er røde, de to CH2-grupper ved siden af dem er blå, og den midterste CH2-gruppe er grøn. 2-methylbutan har 4 signaler: de to methylgrupper på samme carbonatom er røde, og CH-gruppen, CH2-gruppen og den sidste methylgruppe har hver sin farve. 2,2-dimethylpropan har 1 signal: alle fire methylgrupper er røde">
