<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" width="760" height="224" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mutationen bag seglcelleanæmi. I normalt hæmoglobin er et codon i DNA GAG, i mRNA GAG, og det giver aminosyren glutaminsyre, hvis sidekæde er negativt ladet og søger mod vandet. I seglcellehæmoglobin er den midterste base skiftet ud, så codonet i DNA er GTG og i mRNA GUG. Det giver aminosyren valin, hvis sidekæde er upolær og søger væk fra vandet">
<title>Mutationen bag seglcelleanæmi. I normalt hæmoglobin er et codon i DNA GAG, i mRNA GAG, og det giver aminosyren glutaminsyre, hvis sidekæde er negativt ladet og søger mod vandet. I seglcellehæmoglobin er den midterste base skiftet ud, så codonet i DNA er GTG og i mRNA GUG. Det giver aminosyren valin, hvis sidekæde er upolær og søger væk fra vandet</title>
