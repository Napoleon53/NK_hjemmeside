<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Til venstre zigzagformlerne for kanelsyre og kanelaldehyd. Begge har en benzenring og en kæde på tre carbonatomer med en dobbeltbinding. Kanelsyre ender med en carboxylgruppe, og kanelaldehyd ender med en aldehydgruppe. Til højre en graf over log D som funktion af pH. Kurven for kanelaldehyd er en vandret linje ved 1,9. Kurven for kanelsyre er vandret ved 2,1 fra pH 0 til omkring pH 4, knækker omkring pH 4,4 og falder derefter med 1 for hver pH-enhed">
<title>Til venstre zigzagformlerne for kanelsyre og kanelaldehyd. Begge har en benzenring og en kæde på tre carbonatomer med en dobbeltbinding. Kanelsyre ender med en carboxylgruppe, og kanelaldehyd ender med en aldehydgruppe. Til højre en graf over log D som funktion af pH. Kurven for kanelaldehyd er en vandret linje ved 1,9. Kurven for kanelsyre er vandret ved 2,1 fra pH 0 til omkring pH 4, knækker omkring pH 4,4 og falder derefter med 1 for hver pH-enhed</title>
