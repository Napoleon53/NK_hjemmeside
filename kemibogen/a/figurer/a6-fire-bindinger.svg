<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 220" width="756" height="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire slags intermolekylære bindinger mellem et substrat og en sidekæde i et enzym. Ion-ionbinding mellem en negativt ladet carboxylatgruppe og en positivt ladet aminogruppe. Hydrogenbinding mellem en OH-gruppe og oxygenatomet i en carbonylgruppe. Dipol-dipolbinding mellem to carbonylgrupper. Londonbindinger mellem to methylgrupper">
