<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for 2,2-dimethylpropylethanoat vist som en formel med farvede ringe og en tabel. Signal A ved 0,93 ppm er de tre ens methylgrupper i carbonkæden og har rød ring. Signal B ved 2,06 ppm er methylgruppen ved siden af C=O og har blå ring. Signal C ved 3,77 ppm er CH2-gruppen på oxygenatomet i estergruppen og har grøn ring">
