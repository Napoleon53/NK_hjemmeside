<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for aspartam med de funktionelle grupper markeret. Til venstre sidder en aminogruppe, NH2. Sidekæden øverst til venstre ender i en carboxylgruppe, COOH. Midt i molekylet sidder en amidgruppe, hvor en carbonylgruppe er bundet til NH. Til højre sidder en estergruppe, hvor en carbonylgruppe er bundet til et oxygenatom med en methylgruppe. Nederst til højre sidder en benzenring">
