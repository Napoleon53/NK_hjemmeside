<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 279" width="760" height="279" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To stykker af enzymet aldehyddehydrogenase med hver sin sidekæde. Fra det øverste stykke stikker sidekæden fra glutaminsyre ned med den negativt ladede gruppe COO minus. Fra det nederste stykke stikker sidekæden fra arginin op. Den ender i et carbonatom med to NH2-grupper og en positiv ladning, og carbonatomet er bundet til resten af sidekæden gennem NH. Bindingen mellem de to sidekæder har nummeret 1">
<title>To stykker af enzymet aldehyddehydrogenase med hver sin sidekæde. Fra det øverste stykke stikker sidekæden fra glutaminsyre ned med den negativt ladede gruppe COO minus. Fra det nederste stykke stikker sidekæden fra arginin op. Den ender i et carbonatom med to NH2-grupper og en positiv ladning, og carbonatomet er bundet til resten af sidekæden gennem NH. Bindingen mellem de to sidekæder har nummeret 1</title>
