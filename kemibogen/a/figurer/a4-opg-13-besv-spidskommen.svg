<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er cuminaldehyd: en benzenring med aldehydgruppen H−CO− på den ene side og isopropylgruppen −CH(CH3)2 på den modsatte side. Signal 1 ved 1,28 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper og har rød ring. Signal 2 ved 2,90 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen på benzenringen og har blå ring. Signal 3 ved 7,38 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest isopropylgruppen og har grønne ringe. Signal 4 ved 7,80 ppm, 2 H, dublet, 1 nabo-H, er de to hydrogenatomer på ringen nærmest aldehydgruppen og har orange ringe. Signal 5 ved 9,96 ppm, 1 H, singlet, er hydrogenatomet i aldehydgruppen og har lilla ring">
