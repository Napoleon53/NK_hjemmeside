<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for ATP ved pH 7. Til venstre sidder tre phosphatgrupper i en kæde, bundet sammen gennem oxygenatomer. Hvert phosphoratom har et oxygenatom i dobbeltbinding og et oxygenatom med en negativ ladning, og den yderste phosphatgruppe har et oxygenatom mere med en negativ ladning, så der er fire negative ladninger i alt. Den inderste phosphatgruppe er bundet gennem et oxygenatom til carbonatom 5 mærke i en sukkerring. Sukkeret har en OH-gruppe på carbonatom 2 mærke og 3 mærke. På carbonatom 1 mærke sidder basen adenin, som har to ringe med nitrogenatomer og en NH2-gruppe">
<title>Strukturformlen for ATP ved pH 7. Til venstre sidder tre phosphatgrupper i en kæde, bundet sammen gennem oxygenatomer. Hvert phosphoratom har et oxygenatom i dobbeltbinding og et oxygenatom med en negativ ladning, og den yderste phosphatgruppe har et oxygenatom mere med en negativ ladning, så der er fire negative ladninger i alt. Den inderste phosphatgruppe er bundet gennem et oxygenatom til carbonatom 5 mærke i en sukkerring. Sukkeret har en OH-gruppe på carbonatom 2 mærke og 3 mærke. På carbonatom 1 mærke sidder basen adenin, som har to ringe med nitrogenatomer og en NH2-gruppe</title>
