<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hver base tegnet som en blok med tre pladser langs den kant, der vender mod den anden base. En plads kan give et hydrogenatom, tage imod med et ledigt elektronpar eller være tom. Adenin giver, tager og har en tom plads, og thymin tager, giver og tager: det giver to hydrogenbindinger. Guanin tager, giver og giver, og cytosin giver, tager og tager: det giver tre hydrogenbindinger. Adenin og cytosin passer ikke sammen, for to pladser, der begge giver, står over for hinanden, og det samme gør to pladser, der begge tager imod">
<title>Hver base tegnet som en blok med tre pladser langs den kant, der vender mod den anden base. En plads kan give et hydrogenatom, tage imod med et ledigt elektronpar eller være tom. Adenin giver, tager og har en tom plads, og thymin tager, giver og tager: det giver to hydrogenbindinger. Guanin tager, giver og giver, og cytosin giver, tager og tager: det giver tre hydrogenbindinger. Adenin og cytosin passer ikke sammen, for to pladser, der begge giver, står over for hinanden, og det samme gør to pladser, der begge tager imod</title>
