<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 166" width="760" height="166" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Zigzagformler for tre naturstoffer. Linalool er en kæde på otte carbonatomer med en dobbeltbinding i hver ende, en hydroxygruppe og en methylgruppe på carbonatom nummer tre og en methylgruppe på carbonatom nummer syv. Thymol er en benzenring med en hydroxygruppe, en methylgruppe og en sidegruppe med tre carbonatomer. Efedrin er en benzenring med en kæde, hvor det første carbonatom har en hydroxygruppe, og det næste har en methylgruppe og en aminogruppe med en methylgruppe på nitrogenatomet">
