<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" width="760" height="328" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire bromalkaner med stigende antal carbonatomer på det carbonatom, der bærer bromatomet. Brommethan har ingen og reagerer efter S N 2. Et primært bromalkan som bromethan har ét og reagerer efter S N 2. Et sekundært som 2-brompropan har to og kan reagere efter begge mekanismer. Et tertiært som 2-brom-2-methylpropan har tre og reagerer efter S N 1. Jo færre carbonatomer, jo mere plads er der til angreb bagfra. Jo flere carbonatomer, jo mere stabil er carbokationen">
<title>Fire bromalkaner med stigende antal carbonatomer på det carbonatom, der bærer bromatomet. Brommethan har ingen og reagerer efter S N 2. Et primært bromalkan som bromethan har ét og reagerer efter S N 2. Et sekundært som 2-brompropan har to og kan reagere efter begge mekanismer. Et tertiært som 2-brom-2-methylpropan har tre og reagerer efter S N 1. Jo færre carbonatomer, jo mere plads er der til angreb bagfra. Jo flere carbonatomer, jo mere stabil er carbokationen</title>
