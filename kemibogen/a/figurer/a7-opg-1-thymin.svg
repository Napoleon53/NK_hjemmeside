<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 208" width="760" height="208" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for thymin: en ring med seks atomer. To af atomerne i ringen er nitrogenatomer med hver sit hydrogenatom. De fire andre er carbonatomer med numrene 2, 4, 5 og 6. Carbonatom 2 sidder mellem de to nitrogenatomer og har et oxygenatom i dobbeltbinding. Carbonatom 4 har også et oxygenatom i dobbeltbinding. Carbonatom 5 har en methylgruppe, og der er en dobbeltbinding mellem carbonatom 5 og carbonatom 6">
<title>Strukturformlen for thymin: en ring med seks atomer. To af atomerne i ringen er nitrogenatomer med hver sit hydrogenatom. De fire andre er carbonatomer med numrene 2, 4, 5 og 6. Carbonatom 2 sidder mellem de to nitrogenatomer og har et oxygenatom i dobbeltbinding. Carbonatom 4 har også et oxygenatom i dobbeltbinding. Carbonatom 5 har en methylgruppe, og der er en dobbeltbinding mellem carbonatom 5 og carbonatom 6</title>
