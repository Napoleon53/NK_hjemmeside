<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Energiprofil med to kurver for dannelsen af ammoniak. Begge kurver begynder ved dinitrogen og dihydrogen og slutter lavere ved ammoniak. Uden katalysator går kurven over én høj bakke. Med jern som katalysator går kurven over tre lavere bakker. Aktiveringsenergien med katalysator er mindre end aktiveringsenergien uden. Tilvæksten i entalpi er afstanden fra reaktanterne ned til produkterne, og den er den samme for begge kurver">
<title>Energiprofil med to kurver for dannelsen af ammoniak. Begge kurver begynder ved dinitrogen og dihydrogen og slutter lavere ved ammoniak. Uden katalysator går kurven over én høj bakke. Med jern som katalysator går kurven over tre lavere bakker. Aktiveringsenergien med katalysator er mindre end aktiveringsenergien uden. Tilvæksten i entalpi er afstanden fra reaktanterne ned til produkterne, og den er den samme for begge kurver</title>
