<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 213" width="760" height="213" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De fire stoffer med farvede ringe om de ens grupper. Ethoxyethan har 2 signaler: de to methylgrupper er røde, og de to CH2-grupper er blå. Methoxyethan har 3 signaler: methylgruppen på oxygen, CH2-gruppen og den anden methylgruppe har hver sin farve. Hexan har 3 signaler: de to methylgrupper er røde, de to yderste CH2-grupper er blå, og de to midterste CH2-grupper er grønne. Ethylpropanoat har 4 signaler: alle fire grupper har hver sin farve">
