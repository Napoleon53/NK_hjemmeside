<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 266" width="760" height="266" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To grafer over ln K som funktion af 1 over T. For en endoterm reaktion falder linjen mod højre, og K bliver større, når temperaturen stiger. For en exoterm reaktion stiger linjen mod højre, og K bliver mindre, når temperaturen stiger">
<title>To grafer over ln K som funktion af 1 over T. For en endoterm reaktion falder linjen mod højre, og K bliver større, når temperaturen stiger. For en exoterm reaktion stiger linjen mod højre, og K bliver mindre, når temperaturen stiger</title>
