</tspan></text><text x="605.0" y="210.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>koldt</tspan></text><line x1="451.0" y1="166.0" x2="679.0" y2="66.0" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/><text x="565.0" y="236.0" font-size="13.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>linjen stiger mod højre</tspan></text><text x="565.0" y="255.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>K bliver mindre, når temperaturen stiger</tspan></text>
