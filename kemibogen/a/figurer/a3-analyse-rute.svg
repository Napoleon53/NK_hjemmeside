<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks test i rækkefølge. Affarves dibromvand: en dobbeltbinding eller tripelbinding mellem carbonatomer. Gult bundfald med DNPH: en carbonylgruppe. Sølvspejl med Tollens' test: et aldehyd, ellers en keton. Bobler med natron: en carboxylsyre. Lilla farve med jern(III)chlorid: en phenol. Dichromat bliver grønt: en primær eller sekundær alkohol">
<title>Seks test i rækkefølge. Affarves dibromvand: en dobbeltbinding eller tripelbinding mellem carbonatomer. Gult bundfald med DNPH: en carbonylgruppe. Sølvspejl med Tollens' test: et aldehyd, ellers en keton. Bobler med natron: en carboxylsyre. Lilla farve med jern(III)chlorid: en phenol. Dichromat bliver grønt: en primær eller sekundær alkohol</title>
<text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#556766" font-weight="700"><tspan>Lav testene én ad gangen. Et nej betyder, at stoffet ikke har gruppen.</tspan></text><rect x="14.0" y="38.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="36.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="58.0" y="61.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Forsvinder den orange farve af dibromvand?</tspan></text><line x1="420.0" y1="56.0" x2="455.0" y2="56.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,56.0 455.0,60.5 455.0,51.5" fill="#0f766e"/><text x="442.0" y="48.0" font-size="12" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="40.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="607.0" y="61.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>C=C eller C≡C</tspan></text><line x1="36.0" y1="74.0" x2="36.0" y2="76.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,82.0 33.0,76.0 39.0,76.0" fill="#556766"/><rect x="14.0" y="84.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="102.0" r="13.0" fill="#0f766e"/><text x="36.0" y="107.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="58.0" y="107.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Giver DNPH et gult bundfald?</tspan></text><line x1="420.0" y1="102.0" x2="455.0" y2="102.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,102.0 455.0,106.5 455.0,97.5" fill="#b45309"/><text x="442.0" y="94.0" font-size="12" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="86.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/><text x="607.0" y="107.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>carbonylgruppe: aldehyd eller keton</tspan></text><line x1="36.0" y1="120.0" x2="36.0" y2="122.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,128.0 33.0,122.0 39.0,122.0" fill="#556766"/><rect x="14.0" y="130.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="148.0" r="13.0" fill="#0f766e"/><text x="36.0" y="153.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="58.0" y="153.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Giver Tollens' test et sølvspejl?</tspan></text><line x1="420.0" y1="148.0" x2="455.0" y2="148.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,148.0 455.0,152.5 455.0,143.5" fill="#b45309"/><text x="442.0" y="140.0" font-size="12" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="132.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/><text x="607.0" y="153.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>aldehyd (ellers keton)</tspan></text><line x1="36.0" y1="166.0" x2="36.0" y2="168.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,174.0 33.0,168.0 39.0,168.0" fill="#556766"/><rect x="14.0" y="176.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="194.0" r="13.0" fill="#0f766e"/><text x="36.0" y="199.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="58.0" y="199.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Bobler det, når der tilsættes natron?</tspan></text><line x1="420.0" y1="194.0" x2="455.0" y2="194.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,194.0 455.0,198.5 455.0,189.5" fill="#a93226"/><text x="442.0" y="186.0" font-size="12" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="178.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#a93226" stroke-width="1.8"/><text x="607.0" y="199.0" font-size="14" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>carboxylsyre</tspan></text><line x1="36.0" y1="212.0" x2="36.0" y2="214.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,220.0 33.0,214.0 39.0,214.0" fill="#556766"/><rect x="14.0" y="222.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="240.0" r="13.0" fill="#0f766e"/><text x="36.0" y="245.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>5</tspan></text><text x="58.0" y="245.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Giver jern(III)chlorid en lilla farve?</tspan></text><line x1="420.0" y1="240.0" x2="455.0" y2="240.0" stroke="#6d4bb5" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,240.0 455.0,244.5 455.0,235.5" fill="#6d4bb5"/><text x="442.0" y="232.0" font-size="12" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="224.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#6d4bb5" stroke-width="1.8"/><text x="607.0" y="245.0" font-size="14" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>phenol</tspan></text><line x1="36.0" y1="258.0" x2="36.0" y2="260.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,266.0 33.0,260.0 39.0,260.0" fill="#556766"/><rect x="14.0" y="268.0" width="400.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="286.0" r="13.0" fill="#0f766e"/><text x="36.0" y="291.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>6</tspan></text><text x="58.0" y="291.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Bliver orange dichromat grønt?</tspan></text><line x1="420.0" y1="286.0" x2="455.0" y2="286.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="464.0,286.0 455.0,290.5 455.0,281.5" fill="#1d4ed8"/><text x="442.0" y="278.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ja</tspan></text><rect x="470.0" y="270.0" width="274.0" height="32.0" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="607.0" y="291.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>primær eller sekundær alkohol</tspan></text>
</svg>
