<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 162" width="760" height="162" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et polarimeter tegnet fra venstre mod højre. Del 1 er en lysende kugle. Efter den svinger lyset i alle retninger. Del 2 er en lodret plade, og efter den svinger lyset kun lodret. Del 3 er et langt rør med væske. Efter røret svinger lyset i en retning, der er drejet. Del 4 er endnu en lodret plade, og del 5 er et øje">
<title>Et polarimeter tegnet fra venstre mod højre. Del 1 er en lysende kugle. Efter den svinger lyset i alle retninger. Del 2 er en lodret plade, og efter den svinger lyset kun lodret. Del 3 er et langt rør med væske. Efter røret svinger lyset i en retning, der er drejet. Del 4 er endnu en lodret plade, og del 5 er et øje</title>
