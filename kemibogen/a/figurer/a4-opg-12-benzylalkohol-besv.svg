<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er benzylalkohol: en benzenring med sidekæden CH2−OH. Signal 1 ved 2,2 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har rød ring. Signal 2 ved 4,65 ppm, 2 H, singlet, ingen nabo-H, er CH2-gruppen mellem benzenringen og oxygenatomet og har blå ring. Signal 3 ved 7,30 ppm, 5 H, multiplet, er de fem hydrogenatomer på benzenringen og har lilla ring">
