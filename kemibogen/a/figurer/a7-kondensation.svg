<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To nucleotider reagerer ved en kondensation. OH-gruppen på carbonatom 3 mærke i det ene nucleotid reagerer med en OH-gruppe på phosphatgruppen i det andet. Der fraspaltes et vandmolekyle, og de to nucleotider er nu bundet sammen gennem phosphatgruppen med en phosphodiesterbinding. Det nederste nucleotid har stadig en fri OH-gruppe på carbonatom 3 mærke">
<title>To nucleotider reagerer ved en kondensation. OH-gruppen på carbonatom 3 mærke i det ene nucleotid reagerer med en OH-gruppe på phosphatgruppen i det andet. Der fraspaltes et vandmolekyle, og de to nucleotider er nu bundet sammen gennem phosphatgruppen med en phosphodiesterbinding. Det nederste nucleotid har stadig en fri OH-gruppe på carbonatom 3 mærke</title>
