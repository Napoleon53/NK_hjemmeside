<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Den samme energiprofil med forklaringer. De tre bakker er trin 1, trin 2 og trin 3. Lavningerne C og E er mellemprodukter. En pil viser aktiveringsenergien for trin 1 fra reaktanterne A op til den første top, og den er meget længere end pilene for trin 2 og trin 3. Trin 1 er derfor det langsomste. Produkterne G ligger højere end reaktanterne A, så reaktionen er endoterm, og tilvæksten i entalpi er positiv">
<title>Den samme energiprofil med forklaringer. De tre bakker er trin 1, trin 2 og trin 3. Lavningerne C og E er mellemprodukter. En pil viser aktiveringsenergien for trin 1 fra reaktanterne A op til den første top, og den er meget længere end pilene for trin 2 og trin 3. Trin 1 er derfor det langsomste. Produkterne G ligger højere end reaktanterne A, så reaktionen er endoterm, og tilvæksten i entalpi er positiv</title>
