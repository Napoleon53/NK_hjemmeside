<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Phosphatgruppen mellem to sukkergrupper i en DNA-streng som syre og base. På syreformen har den en OH-gruppe. På baseformen har OH-gruppen afgivet en hydron og er blevet til et negativt ladet oxygenatom. Syrestyrkeeksponenten er omkring 1. En pH-skala viser, at gruppen ved pH 7, som i cellen, næsten helt er på baseformen, så DNA er negativt ladet">
