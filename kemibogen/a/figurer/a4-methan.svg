<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 258" width="760" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Methan vist på to måder. Til venstre carbonatomets fire sp3-hybridorbitaler, som hver overlapper med 1s-orbitalen fra et hydrogenatom og danner en sigma-binding. Til højre en kugle-pind-model, hvor de fire hydrogenatomer sidder i hjørnerne af et tetraeder med vinklen 109,5 grader">
