<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" width="760" height="216" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre reaktioner. Når nitrogen og hydrogen danner ammoniak, bliver 4 gasmolekyler til 2, og delta S er negativ. Når calciumcarbonat spaltes, bliver 0 gasmolekyler til 1, og delta S er positiv. Når hydrogen og iod danner hydrogeniodid, bliver 2 gasmolekyler til 2, og delta S er tæt på 0">
<title>Tre reaktioner. Når nitrogen og hydrogen danner ammoniak, bliver 4 gasmolekyler til 2, og delta S er negativ. Når calciumcarbonat spaltes, bliver 0 gasmolekyler til 1, og delta S er positiv. Når hydrogen og iod danner hydrogeniodid, bliver 2 gasmolekyler til 2, og delta S er tæt på 0</title>
<rect x="6.0" y="8.0" width="748.0" height="60.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="45.0" font-size="18" text-anchor="start" fill="#14201f" font-weight="700"><tspan>N</tspan><tspan dy="3.96" font-size="12.2">2</tspan><tspan dy="-3.96">(g) + 3 H</tspan><tspan dy="3.96" font-size="12.2">2</tspan><tspan dy="-3.96">(g) → 2 NH</tspan><tspan dy="3.96" font-size="12.2">3</tspan><tspan dy="-3.96">(g)</tspan></text><text x="470.0" y="44.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>4 gasmolekyler bliver til 2</tspan></text><rect x="590.0" y="21.0" width="150.0" height="34.0" rx="17" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="665.0" y="44.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ΔS</tspan><tspan dy="-5.70" font-size="10.2">⊖</tspan><tspan dy="5.70"> &lt; 0</tspan></text><rect x="6.0" y="78.0" width="748.0" height="60.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="115.0" font-size="18" text-anchor="start" fill="#14201f" font-weight="700"><tspan>CaCO</tspan><tspan dy="3.96" font-size="12.2">3</tspan><tspan dy="-3.96">(s) → CaO(s) + CO</tspan><tspan dy="3.96" font-size="12.2">2</tspan><tspan dy="-3.96">(g)</tspan></text><text x="470.0" y="114.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>0 gasmolekyler bliver til 1</tspan></text><rect x="590.0" y="91.0" width="150.0" height="34.0" rx="17" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="665.0" y="114.0" font-size="15" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>ΔS</tspan><tspan dy="-5.70" font-size="10.2">⊖</tspan><tspan dy="5.70"> &gt; 0</tspan></text><rect x="6.0" y="148.0" width="748.0" height="60.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="185.0" font-size="18" text-anchor="start" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="3.96" font-size="12.2">2</tspan><tspan dy="-3.96">(g) + I</tspan><tspan dy="3.96" font-size="12.2">2</tspan><tspan dy="-3.96">(g) → 2 HI(g)</tspan></text><text x="470.0" y="184.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>2 gasmolekyler bliver til 2</tspan></text><rect x="590.0" y="161.0" width="150.0" height="34.0" rx="17" fill="#ffffff" stroke="#556766" stroke-width="1.8"/><text x="665.0" y="184.0" font-size="15" text-anchor="middle" fill="#556766" font-weight="700"><tspan>ΔS</tspan><tspan dy="-5.70" font-size="10.2">⊖</tspan><tspan dy="5.70"> tæt på 0</tspan></text>
</svg>
