<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fra DNA til protein i to trin. Øverst et stykke dobbeltstrenget DNA, hvor den ene streng har baserne ATG GAG GTT. Ved transskription dannes en mRNA-streng med samme rækkefølge, men med U i stedet for T: AUG GAG GUU. Ved translation læses mRNA tre baser ad gangen. Hvert sæt på tre baser er et codon og giver én aminosyre: methionin, glutaminsyre og valin, som bindes sammen med peptidbindinger">
<title>Fra DNA til protein i to trin. Øverst et stykke dobbeltstrenget DNA, hvor den ene streng har baserne ATG GAG GTT. Ved transskription dannes en mRNA-streng med samme rækkefølge, men med U i stedet for T: AUG GAG GUU. Ved translation læses mRNA tre baser ad gangen. Hvert sæt på tre baser er et codon og giver én aminosyre: methionin, glutaminsyre og valin, som bindes sammen med peptidbindinger</title>
