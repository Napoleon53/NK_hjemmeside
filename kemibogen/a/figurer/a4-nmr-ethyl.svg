<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ethylgruppen, CH3−CH2−, og dens to signaler. Methylgruppen har 2 nabo-hydrogenatomer på CH2-gruppen og giver en triplet. CH2-gruppen har 3 nabo-hydrogenatomer på methylgruppen og giver en kvartet. En triplet med 3 hydrogenatomer og en kvartet med 2 hydrogenatomer viser en ethylgruppe">
