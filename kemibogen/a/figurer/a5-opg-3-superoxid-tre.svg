<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Målingerne af superoxid tegnet på tre måder med den bedste rette linje i hver graf. Koncentrationen som funktion af tiden er en krum kurve, hvor punkterne ligger over linjen i begge ender og under linjen i midten, og forklaringsgraden er 0,6515. Logaritmen til koncentrationen som funktion af tiden er også krum på samme måde, og forklaringsgraden er 0,9012. 1 divideret med koncentrationen som funktion af tiden følger en ret linje, der stiger, og forklaringsgraden er 0,9998">
