<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Temperaturen i et PCR-apparat som funktion af tiden gennem én cyklus. I trin A holdes temperaturen på 95 grader i omkring et halvt minut. I trin B er den 58 grader i et halvt minut. I trin C er den 72 grader i knap et minut, og derefter stiger den igen mod 95 grader. En stiplet vandret linje ved 87 grader viser smeltetemperaturen for DNA-stykket, og en stiplet linje ved 63 grader viser smeltetemperaturen for primerne">
