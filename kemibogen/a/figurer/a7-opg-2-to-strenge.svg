<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" width="760" height="366" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To korte DNA-strenge tegnet lodret med symboler: en gul cirkel for phosphatgruppen, en femkant for sukkeret og en farvet blok for basen. Streng 1 har øverst en phosphatgruppe, der kun sidder på ét sukker, og nederst en fri OH-gruppe. Baserne er oppefra T, C, A og G. Streng 2 har en fri OH-gruppe øverst og en phosphatgruppe, der kun sidder på ét sukker, nederst. Baserne er oppefra G, T, T og A. Enderne har ikke fået navne">
