<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 192" width="760" height="192" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mekanismen for reaktionen mellem 1-iodpropan og en hydroxidion med to buede pile. Iodatomet sidder til venstre for det elektrofile carbonatom, og hydroxidionen kommer ind fra højre. Pil 1 går fra hydroxidionens ledige elektronpar til carbonatomet. Pil 2 går fra midten af bindingen mellem carbon og iod ud til iodatomet. Produkterne er en iodidion og propan-1-ol, hvor ethylgruppen og de to hydrogenatomer er vippet over på venstre side af carbonatomet">
<title>Mekanismen for reaktionen mellem 1-iodpropan og en hydroxidion med to buede pile. Iodatomet sidder til venstre for det elektrofile carbonatom, og hydroxidionen kommer ind fra højre. Pil 1 går fra hydroxidionens ledige elektronpar til carbonatomet. Pil 2 går fra midten af bindingen mellem carbon og iod ud til iodatomet. Produkterne er en iodidion og propan-1-ol, hvor ethylgruppen og de to hydrogenatomer er vippet over på venstre side af carbonatomet</title>
