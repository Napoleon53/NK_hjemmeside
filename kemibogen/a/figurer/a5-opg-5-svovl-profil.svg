<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skitse af en energiprofil med to kurver for oxidationen af svovldioxid. Begge kurver begynder ved svovldioxid og dioxygen og slutter lavere ved svovltrioxid. Uden katalysator går kurven over én høj bakke. Med nitrogenoxid går kurven over tre lave bakker, og den første af dem er den højeste. Den er omkring halvt så høj som bakken uden katalysator">
<title>Skitse af en energiprofil med to kurver for oxidationen af svovldioxid. Begge kurver begynder ved svovldioxid og dioxygen og slutter lavere ved svovltrioxid. Uden katalysator går kurven over én høj bakke. Med nitrogenoxid går kurven over tre lave bakker, og den første af dem er den højeste. Den er omkring halvt så høj som bakken uden katalysator</title>
