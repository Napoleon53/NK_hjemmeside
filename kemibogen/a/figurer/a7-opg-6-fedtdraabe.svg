<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En phosphatgruppe i mRNA og to molekyler af et fedtstof. Phosphatgruppen sidder mellem to ribosegrupper og har et negativt ladet oxygenatom. Under den sidder fedtstoffets positivt ladede gruppe, R3NH plus, og bindingen mellem de to grupper har nummeret 1. Hvert molekyle af fedtstoffet har to lange carbonkæder, der er tegnet som zigzagstreger. Bindingen mellem carbonkæderne i de to molekyler har nummeret 2">
<title>En phosphatgruppe i mRNA og to molekyler af et fedtstof. Phosphatgruppen sidder mellem to ribosegrupper og har et negativt ladet oxygenatom. Under den sidder fedtstoffets positivt ladede gruppe, R3NH plus, og bindingen mellem de to grupper har nummeret 1. Hvert molekyle af fedtstoffet har to lange carbonkæder, der er tegnet som zigzagstreger. Bindingen mellem carbonkæderne i de to molekyler har nummeret 2</title>
