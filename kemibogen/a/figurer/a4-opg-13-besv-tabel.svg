<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er esteren CH3−CH2−CO−O−C(CH3)3. Signal 1 ved 1,08 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen ved siden af CH2 og har rød ring. Signal 2 ved 1,44 ppm, 9 H, singlet, ingen nabo-H, er de tre ens methylgrupper på samme carbonatom og har blå ring. Signal 3 ved 2,22 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen ved siden af C=O og har grøn ring">
<title>En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er esteren CH3−CH2−CO−O−C(CH3)3. Signal 1 ved 1,08 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen ved siden af CH2 og har rød ring. Signal 2 ved 1,44 ppm, 9 H, singlet, ingen nabo-H, er de tre ens methylgrupper på samme carbonatom og har blå ring. Signal 3 ved 2,22 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen ved siden af C=O og har grøn ring</title>
