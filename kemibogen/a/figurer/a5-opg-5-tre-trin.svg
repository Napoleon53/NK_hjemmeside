<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Energiprofil for en reaktion. Kurven begynder ved A til venstre, går over en høj bakke med toppen B, ned i en lavning C, over en lavere bakke med toppen D, ned i en lavning E, over en lille bakke med toppen F og ender ved G til højre. G ligger højere end A. Højden fra A til B er meget større end højden fra C til D og fra E til F">
