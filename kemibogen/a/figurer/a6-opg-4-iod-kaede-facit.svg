<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningen af koncentrationen af diiod som en kæde. Det aflæste volumen af thiosulfat ganges med koncentrationen af thiosulfat og giver stofmængden af thiosulfat. Den ganges med en halv, som er forholdet i reaktionsskemaet, og giver stofmængden af diiod i prøven. Den divideres med prøvens volumen og giver koncentrationen af diiod">
