<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En gel til elektroforese set fra oven. Brøndene er øverst ved minuspolen, og pluspolen er nederst. Den første bane er en markør med seks bånd, som oppefra er stykker på 1000, 700, 500, 300, 200 og 100 basepar. Prøve 1 har ét bånd ud for 700 basepar. Prøve 2 har to bånd ud for 500 og 200 basepar. Prøve 3 har ét bånd, som ligger midt mellem markørens bånd på 300 og 200 basepar">
