<title>Cisplatin og DNA. Cisplatin er et kompleks med platin i midten og fire ligander: to ammoniakmolekyler og to chloridioner. I cellen skiftes de to chloridioner ud, og platin binder sig i stedet til et nitrogenatom i hver af to guaninbaser, der sidder ved siden af hinanden i den samme DNA-streng. De to ammoniakmolekyler bliver siddende på platin</title>
