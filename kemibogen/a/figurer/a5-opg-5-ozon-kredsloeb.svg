<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et kredsløb med chloratomet Cl til venstre og chlormonoxid, ClO, til højre. I trin 1 øverst reagerer Cl med ozon, der kommer ind, og bliver til ClO, mens dioxygen går ud. I trin 2 nederst reagerer ClO med et oxygenatom, der kommer ind, og bliver til Cl igen, mens dioxygen går ud. Chloratomet er katalysator og bliver dannet igen. ClO er mellemprodukt og bliver brugt igen. Samlet bliver ozon og et oxygenatom til to dioxygenmolekyler">
<title>Et kredsløb med chloratomet Cl til venstre og chlormonoxid, ClO, til højre. I trin 1 øverst reagerer Cl med ozon, der kommer ind, og bliver til ClO, mens dioxygen går ud. I trin 2 nederst reagerer ClO med et oxygenatom, der kommer ind, og bliver til Cl igen, mens dioxygen går ud. Chloratomet er katalysator og bliver dannet igen. ClO er mellemprodukt og bliver brugt igen. Samlet bliver ozon og et oxygenatom til to dioxygenmolekyler</title>
