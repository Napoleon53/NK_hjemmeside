<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" width="760" height="206" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlerne for to lægemidler. Paracetamol er en benzenring med en hydroxygruppe på den ene side og en amidgruppe på den modsatte side: ringen er bundet til NH, som er bundet til et carbonatom med et dobbeltbundet oxygenatom og en methylgruppe. Ibuprofen er en benzenring med to sidekæder over for hinanden. Den ene er en forgrenet carbonkæde med fire carbonatomer. Den anden er et carbonatom med en methylgruppe og en carboxylgruppe">
<title>Strukturformlerne for to lægemidler. Paracetamol er en benzenring med en hydroxygruppe på den ene side og en amidgruppe på den modsatte side: ringen er bundet til NH, som er bundet til et carbonatom med et dobbeltbundet oxygenatom og en methylgruppe. Ibuprofen er en benzenring med to sidekæder over for hinanden. Den ene er en forgrenet carbonkæde med fire carbonatomer. Den anden er et carbonatom med en methylgruppe og en carboxylgruppe</title>
