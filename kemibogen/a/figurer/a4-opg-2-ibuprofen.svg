<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 164" width="760" height="164" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for ibuprofen. På den ene side af en benzenring sidder et carbonatom, som binder en methylgruppe og en carboxylgruppe. På den modsatte side af benzenringen sidder en kæde med en CH2-gruppe, en CH-gruppe og to methylgrupper. Carbonatomet i carboxylgruppen har nummer 1. Carbonatomet mellem benzenringen og carboxylgruppen har nummer 2. Det carbonatom i benzenringen, som carbonatom 2 sidder på, har nummer 3. CH2-gruppen på den modsatte side af benzenringen har nummer 4">
