<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To slags inhibitorer. En kompetitiv inhibitor ligner substratet og sætter sig i enzymets aktive center, så substratet ikke kan komme ind. En non-kompetitiv inhibitor sætter sig et andet sted på enzymet, og det aktive center skifter form, så substratet ikke passer">
<title>To slags inhibitorer. En kompetitiv inhibitor ligner substratet og sætter sig i enzymets aktive center, så substratet ikke kan komme ind. En non-kompetitiv inhibitor sætter sig et andet sted på enzymet, og det aktive center skifter form, så substratet ikke passer</title>
