<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 116" width="760" height="116" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsskema med tre stoffer. Citronellol har en kæde på otte carbonatomer med en hydroxygruppe på carbonatom nummer 1, en methylgruppe på carbonatom nummer 3 og nummer 7 og en dobbeltbinding mellem carbonatom nummer 6 og 7. I reaktion I bliver citronellol til citronellal, hvor carbonatom nummer 1 sidder i en aldehydgruppe. I reaktion II bliver citronellal til citronellsyre, hvor carbonatom nummer 1 sidder i en carboxylgruppe">
