<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mekanismen for reaktionen mellem 3-brom-3-methylhexan og hydroxid i to trin. I trin 1, som er langsomt, bliver 3-brom-3-methylhexan til en carbokation og en bromidion. Carbokationen har tre bindinger i samme plan til en methylgruppe, en ethylgruppe og en propylgruppe. I trin 2, som er hurtigt, står der en hydroxidion på hver side af carbokationen, og to reaktionspile fører til to produkter, som er spejlbilleder af hinanden: i det ene sidder hydroxygruppen til venstre for carbonatomet og i det andet til højre. I trin 1 går en buet pil fra midten af bindingen mellem carbon og brom ud til bromatomet. I trin 2 går en buet pil fra hver hydroxidions ledige elektronpar ind til det positive carbonatom. Der dannes 50 % af hvert produkt, altså en racemisk blanding">
<title>Mekanismen for reaktionen mellem 3-brom-3-methylhexan og hydroxid i to trin. I trin 1, som er langsomt, bliver 3-brom-3-methylhexan til en carbokation og en bromidion. Carbokationen har tre bindinger i samme plan til en methylgruppe, en ethylgruppe og en propylgruppe. I trin 2, som er hurtigt, står der en hydroxidion på hver side af carbokationen, og to reaktionspile fører til to produkter, som er spejlbilleder af hinanden: i det ene sidder hydroxygruppen til venstre for carbonatomet og i det andet til højre. I trin 1 går en buet pil fra midten af bindingen mellem carbon og brom ud til bromatomet. I trin 2 går en buet pil fra hver hydroxidions ledige elektronpar ind til det positive carbonatom. Der dannes 50 % af hvert produkt, altså en racemisk blanding</title>
