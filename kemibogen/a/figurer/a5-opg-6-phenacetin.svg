<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsskema med strukturformler. Ionen af paracetamol har en benzenring med et negativt ladet oxygenatom på den ene side og en amidgruppe på den modsatte side. Den reagerer med iodethan, som har to carbonatomer og et iodatom. Produkterne er phenacetin og en iodidion. I phenacetin sidder ethylgruppen fra iodethan på oxygenatomet, så der er dannet en ethergruppe, og resten af molekylet er uændret">
<title>Reaktionsskema med strukturformler. Ionen af paracetamol har en benzenring med et negativt ladet oxygenatom på den ene side og en amidgruppe på den modsatte side. Den reagerer med iodethan, som har to carbonatomer og et iodatom. Produkterne er phenacetin og en iodidion. I phenacetin sidder ethylgruppen fra iodethan på oxygenatomet, så der er dannet en ethergruppe, og resten af molekylet er uændret</title>
