<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for guanin, som har en seksring og en femring bygget sammen. Seks steder har et nummer. Sted 1 er oxygenatomet i en carbonylgruppe øverst på seksringen. Sted 2 er et hydrogenatom på et nitrogenatom i seksringen. Sted 3 er en aminogruppe nederst på seksringen. Sted 4 er et nitrogenatom uden hydrogenatom i seksringen. Sted 5 er et nitrogenatom uden hydrogenatom i femringen. Sted 6 er et carbonatom i femringen. Et nitrogenatom i femringen er bundet til R, som er resten af nucleotidet">
<title>Strukturformlen for guanin, som har en seksring og en femring bygget sammen. Seks steder har et nummer. Sted 1 er oxygenatomet i en carbonylgruppe øverst på seksringen. Sted 2 er et hydrogenatom på et nitrogenatom i seksringen. Sted 3 er en aminogruppe nederst på seksringen. Sted 4 er et nitrogenatom uden hydrogenatom i seksringen. Sted 5 er et nitrogenatom uden hydrogenatom i femringen. Sted 6 er et carbonatom i femringen. Et nitrogenatom i femringen er bundet til R, som er resten af nucleotidet</title>
