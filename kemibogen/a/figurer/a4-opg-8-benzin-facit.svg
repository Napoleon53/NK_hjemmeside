<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 161" width="760" height="161" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre ethere med molekylformlen C6H14O med farvede ringe om de ens grupper. ETBE, (CH3)3C−O−CH2−CH3, har 3 signaler: de tre methylgrupper på samme carbonatom er røde, CH2-gruppen er blå, og den sidste methylgruppe er grøn. TAME, CH3−O−C(CH3)2−CH2−CH3, har 4 signaler: methylgruppen på oxygen, de to methylgrupper på samme carbonatom, CH2-gruppen og methylgruppen for enden har hver sin farve. DIPE, (CH3)2CH−O−CH(CH3)2, har 2 signaler: de fire methylgrupper er røde, og de to CH-grupper er blå">
