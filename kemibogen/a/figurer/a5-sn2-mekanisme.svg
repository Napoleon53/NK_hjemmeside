<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Mekanismen for en S N 2-reaktion mellem en hydroxidion og brommethan i ét trin. Først angriber hydroxidionen carbonatomet bagfra, modsat bromatomet. I overgangstilstanden er bindingen fra oxygen til carbon ved at blive dannet, mens bindingen fra carbon til brom er ved at blive brudt, og de tre hydrogenatomer står i ét plan. Til sidst er der dannet methanol og en bromidion, og de tre hydrogenatomer er vippet over på den anden side af carbonatomet">
<title>Mekanismen for en S N 2-reaktion mellem en hydroxidion og brommethan i ét trin. Først angriber hydroxidionen carbonatomet bagfra, modsat bromatomet. I overgangstilstanden er bindingen fra oxygen til carbon ved at blive dannet, mens bindingen fra carbon til brom er ved at blive brudt, og de tre hydrogenatomer står i ét plan. Til sidst er der dannet methanol og en bromidion, og de tre hydrogenatomer er vippet over på den anden side af carbonatomet</title>
