<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skitse af energiprofilen for reaktionen mellem nitrogendioxid og difluor efter forslag 2. Kurven begynder ved to molekyler nitrogendioxid og et molekyle difluor, går over en høj bakke, som er det langsomme trin 1, ned i en lavning med mellemproduktet, som er et fluoratom, over en lavere bakke, som er det hurtige trin 2, og ender lavere end den begyndte ved to molekyler nitrylfluorid. En pil viser aktiveringsenergien for trin 1">
<title>Skitse af energiprofilen for reaktionen mellem nitrogendioxid og difluor efter forslag 2. Kurven begynder ved to molekyler nitrogendioxid og et molekyle difluor, går over en høj bakke, som er det langsomme trin 1, ned i en lavning med mellemproduktet, som er et fluoratom, over en lavere bakke, som er det hurtige trin 2, og ender lavere end den begyndte ved to molekyler nitrylfluorid. En pil viser aktiveringsenergien for trin 1</title>
