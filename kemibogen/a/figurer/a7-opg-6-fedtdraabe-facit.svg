<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 316" width="760" height="316" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En phosphatgruppe i mRNA og to molekyler af et fedtstof med bindingernes navne. Phosphatgruppen sidder mellem to ribosegrupper og har et negativt ladet oxygenatom. Under den sidder fedtstoffets positivt ladede gruppe, R3NH plus. Binding 1 mellem de to ladede grupper er en ion-ionbinding. Hvert molekyle af fedtstoffet har to lange carbonkæder. Binding 2 mellem carbonkæderne i de to molekyler er londonbindinger">
<title>En phosphatgruppe i mRNA og to molekyler af et fedtstof med bindingernes navne. Phosphatgruppen sidder mellem to ribosegrupper og har et negativt ladet oxygenatom. Under den sidder fedtstoffets positivt ladede gruppe, R3NH plus. Binding 1 mellem de to ladede grupper er en ion-ionbinding. Hvert molekyle af fedtstoffet har to lange carbonkæder. Binding 2 mellem carbonkæderne i de to molekyler er londonbindinger</title>
