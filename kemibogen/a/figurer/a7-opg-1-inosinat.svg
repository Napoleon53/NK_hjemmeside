<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for ionen inosinat. Til venstre sidder en phosphatgruppe: et phosphoratom med fire oxygenatomer, hvoraf to har en negativ ladning. Phosphatgruppen er bundet gennem et oxygenatom til carbonatom 5 mærke i en sukkerring med fire carbonatomer og et oxygenatom. På carbonatom 2 mærke og 3 mærke i sukkeret sidder der en OH-gruppe. På carbonatom 1 mærke sidder basen, som er bundet med et nitrogenatom. Basen har to ringe med i alt fire nitrogenatomer. På ringen med seks atomer sidder et oxygenatom i dobbeltbinding, og nitrogenatomet ved siden af har et hydrogenatom">
<title>Strukturformlen for ionen inosinat. Til venstre sidder en phosphatgruppe: et phosphoratom med fire oxygenatomer, hvoraf to har en negativ ladning. Phosphatgruppen er bundet gennem et oxygenatom til carbonatom 5 mærke i en sukkerring med fire carbonatomer og et oxygenatom. På carbonatom 2 mærke og 3 mærke i sukkeret sidder der en OH-gruppe. På carbonatom 1 mærke sidder basen, som er bundet med et nitrogenatom. Basen har to ringe med i alt fire nitrogenatomer. På ringen med seks atomer sidder et oxygenatom i dobbeltbinding, og nitrogenatomet ved siden af har et hydrogenatom</title>
