<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for 4,4-dimethylpentan-2-on, (CH3)3C−CH2−CO−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 1,02 ppm med integralet 4,50, 9 H, er de tre ens methylgrupper i carbonkæden og har rød ring. Signal B ved 2,10 ppm med integralet 1,50, 3 H, er methylgruppen ved siden af C=O og har blå ring. Signal C ved 2,35 ppm med integralet 1,00, 2 H, er CH2-gruppen ved siden af C=O og har grøn ring">
