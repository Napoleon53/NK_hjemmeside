<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En hydroxidion og et molekyle brommethan. Hydroxidionen er nucleofilen: den har et ledigt elektronpar. Carbonatomet i brommethan er elektrofilt: det er svagt positivt ladet, fordi bromatomet trækker i bindingens elektroner. Bromatomet er den udgående gruppe og tager bindingens to elektroner med sig. En buet pil går fra hydroxidionens elektronpar til carbonatomet, og en anden buet pil går fra bindingen mellem carbon og brom ud til bromatomet">
<title>En hydroxidion og et molekyle brommethan. Hydroxidionen er nucleofilen: den har et ledigt elektronpar. Carbonatomet i brommethan er elektrofilt: det er svagt positivt ladet, fordi bromatomet trækker i bindingens elektroner. Bromatomet er den udgående gruppe og tager bindingens to elektroner med sig. En buet pil går fra hydroxidionens elektronpar til carbonatomet, og en anden buet pil går fra bindingen mellem carbon og brom ud til bromatomet</title>
