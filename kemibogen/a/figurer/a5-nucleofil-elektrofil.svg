eight="700"><tspan>δ−</tspan></text><path d="M 180.8,112.0 Q 260.4,75.0 331.8,106.4" fill="none" stroke="#1b4aa3" stroke-width="2.2" stroke-linecap="round"/><polygon points="340.0,110.0 329.9,110.5 333.6,102.3" fill="#1b4aa3"/><path d="M 391.2,112.0 Q 410.1,77.0 423.7,94.8" fill="none" stroke="#1b4aa3" stroke-width="2.2" stroke-linecap="round"/><polygon points="429.1,102.0 420.1,97.5 427.2,92.1" fill="#1b4aa3"/><text x="150.0" y="40.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>nucleofil</tspan></text><text x="150.0" y="58.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>har et ledigt elektronpar</tspan></text><line x1="150.0" y1="102.0" x2="150.0" y2="66.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="150.0" cy="102.0" r="2.4" fill="#556766"/><text x="396.0" y="180.0" font-size="15" text-anchor="start" fill="#c0392b" font-weight="700"><tspan>elektrofilt carbonatom</tspan></text><text x="396.0" y="198.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>er svagt positivt ladet</tspan></text><line x1="380.0" y1="148.0" x2="392.0" y2="168.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><text x="560.0" y="76.0" font-size="15" text-anchor="start" fill="#a93226" font-weight="700"><tspan>udgående gruppe</tspan></text><text x="560.0" y="94.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>tager bindingens to</tspan></text><text x="560.0" y="110.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>elektroner med sig</tspan></text><line x1="445.1" y1="116.0" x2="552.0" y2="96.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="445.1" cy="116.0" r="2.4" fill="#556766"/><path d="M 92.0,232.0 Q 112.0,220.0 124.3,227.4" fill="none" stroke="#1b4aa3" stroke-width="2.2" stroke-linecap="round"/><polygon points="132.0,232.0 122.0,231.2 126.6,223.5" fill="#1b4aa3"/><text x="142.0" y="237.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>En buet pil viser et elektronpar, der flytter sig. Den begynder ved elektronparret og ender, hvor det havner.</tspan></text>
