<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 152" width="760" height="152" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for tre naturstoffer. Menthol har en ring med seks carbonatomer uden dobbeltbindinger. På ringen sidder en hydroxygruppe, en methylgruppe og en gruppe med tre carbonatomer. Eugenol har en benzenring med en hydroxygruppe, en gruppe O-CH3 og en sidekæde med tre carbonatomer, som ender med en dobbeltbinding mellem to carbonatomer. Kanelaldehyd har en benzenring med en sidekæde på tre carbonatomer, hvor der er en dobbeltbinding mellem to carbonatomer og en dobbeltbinding til oxygen i enden">
<title>Strukturformler for tre naturstoffer. Menthol har en ring med seks carbonatomer uden dobbeltbindinger. På ringen sidder en hydroxygruppe, en methylgruppe og en gruppe med tre carbonatomer. Eugenol har en benzenring med en hydroxygruppe, en gruppe O-CH3 og en sidekæde med tre carbonatomer, som ender med en dobbeltbinding mellem to carbonatomer. Kanelaldehyd har en benzenring med en sidekæde på tre carbonatomer, hvor der er en dobbeltbinding mellem to carbonatomer og en dobbeltbinding til oxygen i enden</title>
