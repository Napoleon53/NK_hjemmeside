<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Temperaturen i et PCR-apparat gennem én cyklus. Først varmes prøven til 95 grader i et halvt minut, så strengene skilles. Så køles den til 55 grader i et halvt minut, så primerne binder til enkeltstrengene. Til sidst varmes den til 72 grader i et minut, hvor polymerasen bygger nye strenge. Derefter begynder næste cyklus forfra ved 95 grader">
<title>Temperaturen i et PCR-apparat gennem én cyklus. Først varmes prøven til 95 grader i et halvt minut, så strengene skilles. Så køles den til 55 grader i et halvt minut, så primerne binder til enkeltstrengene. Til sidst varmes den til 72 grader i et minut, hvor polymerasen bygger nye strenge. Derefter begynder næste cyklus forfra ved 95 grader</title>
