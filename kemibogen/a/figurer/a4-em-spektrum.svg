<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Det elektromagnetiske spektrum fra ultraviolet lys over synligt lys, infrarødt lys og mikrobølger til radiobølger. Energien er størst til venstre, og bølgelængden er længst til højre. Ultraviolet og synligt lys flytter elektroner til orbitaler med højere energi. Infrarødt lys får bindingerne i molekylet til at svinge kraftigere. Radiobølger får atomkerner i et magnetfelt til at vende sig">
<title>Det elektromagnetiske spektrum fra ultraviolet lys over synligt lys, infrarødt lys og mikrobølger til radiobølger. Energien er størst til venstre, og bølgelængden er længst til højre. Ultraviolet og synligt lys flytter elektroner til orbitaler med højere energi. Infrarødt lys får bindingerne i molekylet til at svinge kraftigere. Radiobølger får atomkerner i et magnetfelt til at vende sig</title>
