<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er methylpropanoat, CH3−CH2−CO−O−CH3. Signal 1 ved 1,15 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen ved siden af CH2 og har rød ring. Signal 2 ved 2,32 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen mellem methyl og C=O og har blå ring. Signal 3 ved 3,67 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen på oxygenatomet i estergruppen og har grøn ring">
<title>En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er methylpropanoat, CH3−CH2−CO−O−CH3. Signal 1 ved 1,15 ppm, 3 H, triplet, 2 nabo-H, er methylgruppen ved siden af CH2 og har rød ring. Signal 2 ved 2,32 ppm, 2 H, kvartet, 3 nabo-H, er CH2-gruppen mellem methyl og C=O og har blå ring. Signal 3 ved 3,67 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen på oxygenatomet i estergruppen og har grøn ring</title>
