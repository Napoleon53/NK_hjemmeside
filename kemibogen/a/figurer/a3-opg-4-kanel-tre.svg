<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 159" width="760" height="159" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for tre stoffer. Alle tre har en benzenring med en kæde på tre carbonatomer, og der er en dobbeltbinding mellem de to carbonatomer nærmest ringen. I stof A, kanelaldehyd, ender kæden med en aldehydgruppe. I stof B, kanelsyre, ender kæden med en carboxylgruppe. I stof C, kanelalkohol, ender kæden med en hydroxygruppe">
