<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er 4-hydroxybutan-2-on, CH3−CO−CH2−CH2−OH. Signal 1 ved 2,20 ppm, 3 H, singlet, ingen nabo-H, er methylgruppen ved siden af C=O og har rød ring. Signal 2 ved 2,60 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen ved siden af C=O og har blå ring. Signal 3 ved 3,2 ppm, 1 H, bred singlet, er hydrogenatomet på oxygen i hydroxygruppen og har grøn ring. Signal 4 ved 3,85 ppm, 2 H, triplet, 2 nabo-H, er CH2-gruppen på oxygenatomet og har orange ring">
