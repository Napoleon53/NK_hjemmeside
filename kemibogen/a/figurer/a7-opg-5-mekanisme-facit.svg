<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Samme tegning som i opgaven med mekanismen tegnet ind. En buet pil går fra et ledigt elektronpar på oxygenatomet i strengens OH-gruppe til phosphoratom 1. En anden buet pil går fra binding b mellem phosphoratom 1 og det næste oxygenatom ud til oxygenatomet. OH-gruppen er mærket nucleofil. De to yderste phosphatgrupper med phosphoratom 2 og 3 er indrammet og mærket udgående gruppe: en diphosphation">
