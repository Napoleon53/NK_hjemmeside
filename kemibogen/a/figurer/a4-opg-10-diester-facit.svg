<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tilordningen for dimethylbutandioat, CH3−O−CO−CH2−CH2−CO−O−CH3, vist som en formel med farvede ringe og en tabel. Signal A ved 2,60 ppm med integralet 1,00, 4 H, er de to ens CH2-grupper ved siden af C=O og har røde ringe. Signal B ved 3,70 ppm med integralet 1,50, 6 H, er de to ens methylgrupper på oxygenatomerne i estergrupperne og har blå ringe">
