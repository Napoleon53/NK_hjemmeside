<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 186" width="760" height="186" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre tegninger af carbondioxid, O=C=O, med pile, der viser, hvordan atomerne bevæger sig. I svingning A bevæger de to oxygenatomer sig væk fra carbonatomet på samme tid, hver sin vej langs bindingerne. I svingning B bevæger de to oxygenatomer sig mod venstre og carbonatomet mod højre langs bindingerne, så den ene binding bliver kortere og den anden længere. I svingning C bevæger de to oxygenatomer sig opad og carbonatomet nedad, på tværs af bindingerne">
<title>Tre tegninger af carbondioxid, O=C=O, med pile, der viser, hvordan atomerne bevæger sig. I svingning A bevæger de to oxygenatomer sig væk fra carbonatomet på samme tid, hver sin vej langs bindingerne. I svingning B bevæger de to oxygenatomer sig mod venstre og carbonatomet mod højre langs bindingerne, så den ene binding bliver kortere og den anden længere. I svingning C bevæger de to oxygenatomer sig opad og carbonatomet nedad, på tværs af bindingerne</title>
