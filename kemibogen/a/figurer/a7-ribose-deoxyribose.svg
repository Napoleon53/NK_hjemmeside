<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 212" width="760" height="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ribose og deoxyribose tegnet som ringe med fem atomer: fire carbonatomer og et oxygenatom. Carbonatomerne har numrene 1 mærke til 5 mærke. Begge har en OH-gruppe på carbonatom 1 mærke og 3 mærke og gruppen CH2OH med carbonatom 5 mærke på carbonatom 4 mærke. Ribose har også en OH-gruppe på carbonatom 2 mærke. I deoxyribose sidder der et hydrogenatom i stedet">
<title>Ribose og deoxyribose tegnet som ringe med fem atomer: fire carbonatomer og et oxygenatom. Carbonatomerne har numrene 1 mærke til 5 mærke. Begge har en OH-gruppe på carbonatom 1 mærke og 3 mærke og gruppen CH2OH med carbonatom 5 mærke på carbonatom 4 mærke. Ribose har også en OH-gruppe på carbonatom 2 mærke. I deoxyribose sidder der et hydrogenatom i stedet</title>
