<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Den aktive form af simvastatin, skrevet som R−CH(OH)−CH2−CH(OH)−CH2−COO−, i et enzyms aktive center. Ved 1 peger sidekæden i leucin, som ender i CH(CH3)2, mod den upolære del R. Ved 2 peger sidekæden i asparaginsyre med gruppen COO− mod den hydroxygruppe, der sidder nærmest R. Ved 3 peger sidekæden i asparagin med gruppen CO−NH2 mod den anden hydroxygruppe. Ved 4 peger sidekæden i lysin med gruppen NH3+ mod gruppen COO−. Binding 1 er londonbindinger, binding 2 og binding 3 er hydrogenbindinger, og binding 4 er en ion-ionbinding">
