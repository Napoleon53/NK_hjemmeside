<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 230" width="770" height="230" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Reaktionsskemaet N2O4 = 2 NO2 og reaktionsbrøken skrevet med partialtryk: partialtrykket af NO2 i anden over partialtrykket af N2O4">
<title>Reaktionsskemaet N2O4 = 2 NO2 og reaktionsbrøken skrevet med partialtryk: partialtrykket af NO2 i anden over partialtrykket af N2O4</title>
<text x="215.0" y="60.0" font-size="30" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>N</tspan><tspan dy="6.60" font-size="20.4">2</tspan><tspan dy="-6.60">O</tspan><tspan dy="6.60" font-size="20.4">4</tspan><tspan dy="-6.60">(g)</tspan></text><text x="310.0" y="60.0" font-size="30" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>⇌</tspan></text><text x="352.0" y="60.0" font-size="30" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>2</tspan></text><text x="420.0" y="60.0" font-size="30" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>NO</tspan><tspan dy="6.60" font-size="20.4">2</tspan><tspan dy="-6.60">(g)</tspan></text><text x="138.0" y="56.0" font-size="13.5" text-anchor="end" fill="#1d4ed8" font-weight="700"><tspan>reaktant</tspan></text><text x="486.0" y="56.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>produkt</tspan></text><text x="214.0" y="181.0" font-size="28" text-anchor="end" fill="#14201f" font-weight="700"><tspan>Y =</tspan></text><line x1="232.0" y1="172.0" x2="420.0" y2="172.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="314.0" y="156.0" font-size="28" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>p(NO</tspan><tspan dy="6.16" font-size="19.0">2</tspan><tspan dy="-6.16">)</tspan></text><text x="373.0" y="142.0" font-size="19" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>2</tspan></text><text x="326.0" y="208.0" font-size="28" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>p(N</tspan><tspan dy="6.16" font-size="19.0">2</tspan><tspan dy="-6.16">O</tspan><tspan dy="6.16" font-size="19.0">4</tspan><tspan dy="-6.16">)</tspan></text><text x="446.0" y="150.0" font-size="14" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>produktets partialtryk står over brøkstregen</tspan></text><text x="446.0" y="178.0" font-size="14" text-anchor="start" fill="#b45309" font-weight="700"><tspan>koefficienten