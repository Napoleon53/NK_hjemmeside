<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Michaelis-Menten-kurven med to områder fremhævet. Når koncentrationen af substrat er meget mindre end K M, følger kurven en ret linje gennem nulpunktet, og reaktionen er af første orden med hensyn til substratet. Når koncentrationen er meget større end K M, ligger kurven næsten vandret ved v max, og reaktionen er af nulte orden">
