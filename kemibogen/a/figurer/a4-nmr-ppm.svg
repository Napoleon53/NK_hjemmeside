e" fill="#556766"><tspan>TMS</tspan></text><line x1="360.0" y1="178.0" x2="360.0" y2="124.0" stroke="#14201f" stroke-width="1.6" stroke-linecap="round"/><line x1="654.0" y1="152.0" x2="374.0" y2="152.0" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round"/><polygon points="366.0,152.0 374.0,148.0 374.0,156.0" fill="#c2410c"/><text x="510.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>1200 Hz</tspan></text><text x="360.0" y="196.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2,00 ppm</tspan></text><text x="660.0" y="196.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>0 ppm</tspan></text><text x="380.0" y="226.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Afstanden i hertz afhænger af apparatet. Det kemiske skift i ppm er det samme på begge.</tspan></text>
