<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" width="760" height="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Det samme stof målt på to spektrometre. På et spektrometer på 300 megahertz ligger signalet 600 hertz fra TMS. På et spektrometer på 600 megahertz ligger det 1200 hertz fra TMS. Det kemiske skift er 2,00 ppm på begge spektrometre">
