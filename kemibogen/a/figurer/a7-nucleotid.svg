<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et nucleotid fra DNA tegnet som strukturformel og som symbol. Strukturformlen har tre dele. Phosphatgruppen har to negative ladninger og er bundet gennem et oxygenatom til carbonatom 5 mærke i sukkeret. Sukkeret er deoxyribose, en ring med fire carbonatomer og et oxygenatom, med en OH-gruppe på carbonatom 3 mærke. Basen adenin er bundet med et nitrogenatom til carbonatom 1 mærke. Som symbol tegnes phosphatgruppen som en gul cirkel, sukkeret som en femkant og basen som en farvet blok med et bogstav">
