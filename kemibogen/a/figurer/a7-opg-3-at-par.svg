<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 233" width="760" height="233" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Adenin til venstre og thymin til højre, som de sidder over for hinanden i dobbeltspiralen. Øverst peger et hydrogenatom i aminogruppen på adenin mod et oxygenatom i thymin. I midten peger hydrogenatomet på et nitrogenatom i thymins ring mod et nitrogenatom i adenins ring. Nederst står et carbonatom i adenins ring over for det andet oxygenatom i thymin. Der er ikke tegnet nogen hydrogenbindinger mellem de to baser">
<title>Adenin til venstre og thymin til højre, som de sidder over for hinanden i dobbeltspiralen. Øverst peger et hydrogenatom i aminogruppen på adenin mod et oxygenatom i thymin. I midten peger hydrogenatomet på et nitrogenatom i thymins ring mod et nitrogenatom i adenins ring. Nederst står et carbonatom i adenins ring over for det andet oxygenatom i thymin. Der er ikke tegnet nogen hydrogenbindinger mellem de to baser</title>
