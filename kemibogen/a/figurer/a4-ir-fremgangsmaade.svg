<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" width="760" height="318" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks spørgsmål til et IR-spektrum. Et kraftigt, skarpt bånd ved 1600 til 1750 viser C=O. Et meget bredt bånd fra 3400 til 2500 sammen med C=O viser en carboxylsyre. Et bredt, kraftigt bånd ved 3640 til 3160 viser O−H i en alkohol eller phenol. En eller to spidser ved 3300 til 3500 viser N−H i en amin eller et amid. Bånd lige over 3000 viser C−H på sp2-carbon, altså et umættet stof. Bånd ved 2100 til 2260 viser en tripelbinding">
<title>Seks spørgsmål til et IR-spektrum. Et kraftigt, skarpt bånd ved 1600 til 1750 viser C=O. Et meget bredt bånd fra 3400 til 2500 sammen med C=O viser en carboxylsyre. Et bredt, kraftigt bånd ved 3640 til 3160 viser O−H i en alkohol eller phenol. En eller to spidser ved 3300 til 3500 viser N−H i en amin eller et amid. Bånd lige over 3000 viser C−H på sp2-carbon, altså et umættet stof. Bånd ved 2100 til 2260 viser en tripelbinding</title>
<g class="peg-vejledning" data-tekst="Peg på et spørgsmål, og se, hvad båndet viser."/><g class="peg" data-titel="Sådan bruges spørgsmålene" data-tekst="Se først efter C=O. Se derefter på området fra 3600 til 2500 cm^{−1}, så på C−H-båndene omkring 3000 cm^{−1} og til sidst efter bånd mellem 2300 og 2100 cm^{−1}.&#10;Et bånd, der mangler, er også en oplysning." data-noegle="start"><text x="20.0" y="24.0" font-size="14" text-anchor="start" fill="#556766" font-weight="700"><tspan>Gå spektret igennem fra venstre mod højre, men begynd med C=O. Alle bølgetal er i cm⁻¹.</tspan></text></g><g class="peg" data-titel="C=O" data-tekst="Carbonylgruppens bånd er kraftigt og skarpt og ligger ved 1600 til 1750 cm^{−1}. Det er som regel det første, man ser i et spektrum.&#10;Er der intet bånd ved 1600 til 1750 cm^{−1}, har stoffet ingen carbonylgruppe." data-noegle="sp1" data-med="start"><rect x="14.0" y="38.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="36.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="58.0" y="61.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der et kraftigt, skarpt bånd ved 1600 til 1750?</tspan></text><line x1="444.0" y1="56.0" x2="479.0" y2="56.0" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,56.0 479.0,60.5 479.0,51.5" fill="#c2410c"/><text x="466.0" y="48.0" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="40.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="619.0" y="61.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>C=O</tspan></text></g><line x1="36.0" y1="74.0" x2="36.0" y2="76.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,82.0 33.0,76.0 39.0,76.0" fill="#556766"/><g class="peg" data-titel="Carboxylsyre" data-tekst="En carboxylsyre giver to bånd: et meget bredt O−H-bånd fra 3400 til 2500 cm^{−1} og et C=O-bånd. O−H-båndet er så bredt, at det breder sig ud over C−H-båndene." data-noegle="sp2" data-med="start"><rect x="14.0" y="84.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="102.0" r="13.0" fill="#0f766e"/><text x="36.0" y="107.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="58.0" y="107.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der et meget bredt bånd fra 3400 til 2500 og en C=O?</tspan></text><line x1="444.0" y1="102.0" x2="479.0" y2="102.0" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,102.0 479.0,106.5 479.0,97.5" fill="#c2410c"/><text x="466.0" y="94.0" font-size="12" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="86.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="619.0" y="107.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>carboxylsyre</tspan></text></g><line x1="36.0" y1="120.0" x2="36.0" y2="122.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,128.0 33.0,122.0 39.0,122.0" fill="#556766"/><g class="peg" data-titel="O−H i en alkohol eller phenol" data-tekst="O−H i alkoholer og phenoler giver et kraftigt og bredt bånd ved 3640 til 3160 cm^{−1}. Båndet er bredt, fordi molekylerne danner hydrogenbindinger til hinanden." data-noegle="sp3" data-med="start"><rect x="14.0" y="130.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="148.0" r="13.0" fill="#0f766e"/><text x="36.0" y="153.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="58.0" y="153.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der et bredt, kraftigt bånd ved 3640 til 3160?</tspan></text><line x1="444.0" y1="148.0" x2="479.0" y2="148.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,148.0 479.0,152.5 479.0,143.5" fill="#1d4ed8"/><text x="466.0" y="140.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="132.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="619.0" y="153.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>O−H i en alkohol eller phenol</tspan></text></g><line x1="36.0" y1="166.0" x2="36.0" y2="168.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,174.0 33.0,168.0 39.0,168.0" fill="#556766"/><g class="peg" data-titel="N−H i en amin eller et amid" data-tekst="N−H i aminer og amider giver et middelstærkt bånd ved 3500 til 3300 cm^{−1}: to spidser for −NH_{2} og én for −NH−." data-noegle="sp4" data-med="start"><rect x="14.0" y="176.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="194.0" r="13.0" fill="#0f766e"/><text x="36.0" y="199.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="58.0" y="199.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der en eller to spidser ved 3300 til 3500?</tspan></text><line x1="444.0" y1="194.0" x2="479.0" y2="194.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,194.0 479.0,198.5 479.0,189.5" fill="#1d4ed8"/><text x="466.0" y="186.0" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="178.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="619.0" y="199.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>N−H i en amin eller et amid</tspan></text></g><line x1="36.0" y1="212.0" x2="36.0" y2="214.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,220.0 33.0,214.0 39.0,214.0" fill="#556766"/><g class="peg" data-titel="C−H på sp^{2}-carbon: umættet" data-tekst="C−H på sp^{2}-carbon ligger ved 3100 til 3000 cm^{−1}. Er der bånd lige over 3000 cm^{−1}, har stoffet en dobbeltbinding mellem carbonatomer eller en benzenring, og stoffet er umættet." data-noegle="sp5" data-med="start"><rect x="14.0" y="222.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="240.0" r="13.0" fill="#0f766e"/><text x="36.0" y="245.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>5</tspan></text><text x="58.0" y="245.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der bånd lige over 3000?</tspan></text><line x1="444.0" y1="240.0" x2="479.0" y2="240.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,240.0 479.0,244.5 479.0,235.5" fill="#0f766e"/><text x="466.0" y="232.0" font-size="12" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="224.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="619.0" y="245.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>C−H på sp</tspan><tspan dy="-5.32" font-size="9.5">2</tspan><tspan dy="5.32">-carbon: umættet</tspan></text></g><line x1="36.0" y1="258.0" x2="36.0" y2="260.0" stroke="#556766" stroke-width="1.6" stroke-linecap="round"/><polygon points="36.0,266.0 33.0,260.0 39.0,260.0" fill="#556766"/><g class="peg" data-titel="Tripelbinding: C≡C eller C≡N" data-tekst="C≡C i alkyner ligger ved 2260 til 2100 cm^{−1} og giver et svagt bånd. C≡N i nitriler ligger ved 2260 til 2200 cm^{−1} og giver et middelstærkt bånd." data-noegle="sp6" data-med="start"><rect x="14.0" y="268.0" width="424.0" height="36.0" rx="9" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><circle cx="36.0" cy="286.0" r="13.0" fill="#0f766e"/><text x="36.0" y="291.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>6</tspan></text><text x="58.0" y="291.0" font-size="13.5" text-anchor="start" fill="#14201f"><tspan>Er der bånd ved 2100 til 2260?</tspan></text><line x1="444.0" y1="286.0" x2="479.0" y2="286.0" stroke="#6d4bb5" stroke-width="2.2" stroke-linecap="round"/><polygon points="488.0,286.0 479.0,290.5 479.0,281.5" fill="#6d4bb5"/><text x="466.0" y="278.0" font-size="12" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>ja</tspan></text><rect x="494.0" y="270.0" width="250.0" height="32.0" rx="16" fill="#ffffff" stroke="#6d4bb5" stroke-width="1.8"/><text x="619.0" y="291.0" font-size="14" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>tripelbinding: C≡C eller C≡N</tspan></text></g>
</svg>
