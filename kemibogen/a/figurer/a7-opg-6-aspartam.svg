<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformlen for aspartam. Fra venstre har molekylet en aminogruppe, NH2, på et carbonatom, som også bærer en sidekæde med en CH2-gruppe og en carboxylgruppe, COOH. Derefter følger en carbonylgruppe bundet til NH, et carbonatom med en sidekæde af en CH2-gruppe og en benzenring og til sidst en carbonylgruppe bundet til et oxygenatom med en methylgruppe">
