<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En gaschromatograf tegnet som en række dele. En bæregas fra en gasflaske er den mobile fase. Prøven sprøjtes ind i en varm injektor, hvor den fordamper. Gassen fører stofferne gennem kolonnen, som er et langt, tyndt rør med stationær fase, der ligger oprullet i en ovn. En detektor måler stofferne, når de kommer ud, og en computer tegner chromatogrammet">
