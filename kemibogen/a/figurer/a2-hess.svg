<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" width="760" height="296" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Entalpidiagram for Hess' lov. Fra carbon og oxygen til carbondioxid er der to veje. Den direkte vej har delta H på minus 393,5 kilojoule pr. mol. Vejen over carbonmonoxid har først minus 110,5 og derefter minus 283,0, som tilsammen også giver minus 393,5">
