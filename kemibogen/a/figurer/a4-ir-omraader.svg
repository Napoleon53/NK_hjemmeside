<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Et kort over IR-spektret. Fra 4000 til 2500 ligger bindinger til hydrogen: O−H i alkoholer og phenoler ved 3640 til 3160, O−H i carboxylsyrer ved 3400 til 2500, N−H ved 3500 til 3300, C−H på sp-carbon ved 3300, C−H på sp2-carbon ved 3100 til 3000 og C−H på sp3-carbon ved 2960 til 2850. Fra 2500 til 2000 ligger tripelbindinger: C≡C ved 2260 til 2100 og C≡N ved 2260 til 2200. Fra 2000 til 1500 ligger dobbeltbindinger: C=O i aldehyder, ketoner, carboxylsyrer og estere ved 1750 til 1695, C=O i amider ved 1700 til 1600, C=C i alkener ved 1680 til 1640 og C=C i benzenringe omkring 1600 og 1500. Under 1500 ligger fingeraftryksområdet">
<title>Et kort over IR-spektret. Fra 4000 til 2500 ligger bindinger til hydrogen: O−H i alkoholer og phenoler ved 3640 til 3160, O−H i carboxylsyrer ved 3400 til 2500, N−H ved 3500 til 3300, C−H på sp-carbon ved 3300, C−H på sp2-carbon ved 3100 til 3000 og C−H på sp3-carbon ved 2960 til 2850. Fra 2500 til 2000 ligger tripelbindinger: C≡C ved 2260 til 2100 og C≡N ved 2260 til 2200. Fra 2000 til 1500 ligger dobbeltbindinger: C=O i aldehyder, ketoner, carboxylsyrer og estere ved 1750 til 1695, C=O i amider ved 1700 til 1600, C=C i alkener ved 1680 til 1640 og C=C i benzenringe omkring 1600 og 1500. Under 1500 ligger fingeraftryksområdet</title>
<g class="peg-vejledning" data-tekst="Peg på et område eller et bånd, og se, hvor båndet ligger, og hvordan det ser ud."/><g class="peg" data-titel="4000 til 2500 cm^{−1}: bindinger til hydrogen" data-tekst="Her ligger stræk af bindinger til hydrogen: O−H, N−H og C−H. Hydrogenatomet er let, og lettere atomer svinger hurtigere." data-noegle="omr0" data-med="baand0"><rect x="41.0" y="12.0" width="206.8" height="60.0" rx="6" fill="#e3ebfd" stroke="#1d4ed8" stroke-width="1.4"/><text x="144.4" y="30.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>bindinger</tspan></text><text x="144.4" y="45.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>til hydrogen</tspan></text><text x="144.4" y="63.0" font-size="11" text-anchor="middle" fill="#14201f"><tspan>O−H, N−H, C−H</tspan></text></g><g class="peg" data-titel="2500 til 2000 cm^{−1}: tripelbindinger" data-tekst="Her ligger stræk af tripelbindinger: C≡C og C≡N. Det er meget stærke bindinger, og en stærkere binding svinger hurtigere." data-noegle="omr1" data-med="baand1"><rect x="249.8" y="12.0" width="67.6" height="60.0" rx="6" fill="#ece5fa" stroke="#6d4bb5" stroke-width="1.4"/><text x="283.6" y="30.0" font-size="12.5" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>tripel-</tspan></text><text x="283.6" y="45.0" font-size="12.5" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>bindinger</tspan></text><text x="283.6" y="63.0" font-size="11" text-anchor="middle" fill="#14201f"><tspan>C≡C, C≡N</tspan></text></g><g class="peg" data-titel="2000 til 1500 cm^{−1}: dobbeltbindinger" data-tekst="Her ligger stræk af dobbeltbindinger: C=O og C=C. Det er stærke bindinger." data-noegle="omr2" data-med="baand2"><rect x="319.4" y="12.0" width="137.2" height="60.0" rx="6" fill="#fde3d6" stroke="#c2410c" stroke-width="1.4"/><text x="388.0" y="30.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>dobbelt-</tspan></text><text x="388.0" y="45.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>bindinger</tspan></text><text x="388.0" y="63.0" font-size="11" text-anchor="middle" fill="#14201f"><tspan>C=O, C=C</tspan></text></g><g class="peg" data-titel="Under 1500 cm^{−1}: fingeraftryksområdet" data-tekst="Her ligger stræk af enkeltbindinger og alle bøjninger. Der er så mange bånd oven i hinanden, at de ikke kan knyttes til bestemte grupper. Bånd i fingeraftryksområdet skal du ikke tolke." data-noegle="omr3" data-med="baand3"><rect x="458.6" y="12.0" width="276.4" height="60.0" rx="6" fill="#eef1f2" stroke="#556766" stroke-width="1.4"/><text x="596.8" y="30.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>fingeraftryks-</tspan></text><text x="596.8" y="45.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>området</tspan></text><text x="596.8" y="63.0" font-size="11" text-anchor="middle" fill="#14201f"><tspan>enkeltbindinger og bøjninger</tspan></text></g><line x1="708.2" y1="84.0" x2="708.2" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="708.2" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>600</tspan></text><line x1="652.5" y1="84.0" x2="652.5" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="652.5" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>800</tspan></text><line x1="596.8" y1="84.0" x2="596.8" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="596.8" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>1000</tspan></text><line x1="541.1" y1="84.0" x2="541.1" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="541.1" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>1200</tspan></text><line x1="485.4" y1="84.0" x2="485.4" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="485.4" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>1400</tspan></text><line x1="429.8" y1="84.0" x2="429.8" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="429.8" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>1600</tspan></text><line x1="374.1" y1="84.0" x2="374.1" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="374.1" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>1800</tspan></text><line x1="318.4" y1="84.0" x2="318.4" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="318.4" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>2000</tspan></text><line x1="248.8" y1="84.0" x2="248.8" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="248.8" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>2500</tspan></text><line x1="179.2" y1="84.0" x2="179.2" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="179.2" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>3000</tspan></text><line x1="109.6" y1="84.0" x2="109.6" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="109.6" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>3500</tspan></text><line x1="40.0" y1="84.0" x2="40.0" y2="360.0" stroke="#dfe9e8" stroke-width="0.9" stroke-linecap="round"/><text x="40.0" y="377.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>4000</tspan></text><line x1="248.8" y1="74.0" x2="248.8" y2="360.0" stroke="#c3d6d4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="318.4" y1="74.0" x2="318.4" y2="360.0" stroke="#c3d6d4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="457.6" y1="74.0" x2="457.6" y2="360.0" stroke="#c3d6d4" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><g class="peg" data-titel="O−H i alkoholer og phenoler" data-tekst="3640 til 3160 cm^{−1}. Båndet er kraftigt og bredt.&#10;Det er bredt, fordi molekylerne danner hydrogenbindinger til hinanden." data-i="baand0" data-med="omr0"><rect x="90.1" y="90.0" width="66.8" height="12.0" rx="4" fill="#1d4ed8"/><text x="164.9" y="101.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>O−H i alkoholer og phenoler: bredt og kraftigt</tspan></text></g><g class="peg" data-titel="O−H i carboxylsyrer" data-tekst="3400 til 2500 cm^{−1}. Båndet er kraftigt og meget bredt. Det breder sig ud over C−H-båndene og helt ned til 2500 cm^{−1}." data-i="baand0" data-med="omr0"><rect x="123.5" y="112.0" width="125.3" height="12.0" rx="4" fill="#1d4ed8"/><text x="256.8" y="123.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>O−H i carboxylsyrer: meget bredt</tspan></text></g><g class="peg" data-titel="N−H i aminer og amider" data-tekst="3500 til 3300 cm^{−1}. Båndet er middel: to spidser for −NH_{2} og én for −NH−." data-i="baand0" data-med="omr0"><rect x="109.6" y="134.0" width="27.8" height="12.0" rx="4" fill="#1d4ed8"/><text x="145.4" y="145.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>N−H i aminer og amider: middel</tspan></text></g><g class="peg" data-titel="C−H på sp-carbon" data-tekst="Omkring 3300 cm^{−1}. Båndet er kraftigt og skarpt. Det findes i alkyner." data-i="baand0" data-med="omr0"><rect x="133.3" y="156.0" width="8.4" height="12.0" rx="4" fill="#1d4ed8"/><text x="149.6" y="167.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C−H på sp-carbon: skarpt og kraftigt</tspan></text></g><g class="peg" data-titel="C−H på sp^{2}-carbon" data-tekst="3100 til 3000 cm^{−1}. Båndet er middel. Det findes i alkener og benzenringe.&#10;Bånd lige over 3000 cm^{−1} viser, at stoffet er umættet." data-i="baand0" data-med="omr0"><rect x="165.3" y="178.0" width="13.9" height="12.0" rx="4" fill="#1d4ed8"/><text x="187.2" y="189.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C−H på sp</tspan><tspan dy="-4.56" font-size="8.2">2</tspan><tspan dy="4.56">-carbon: middel</tspan></text></g><g class="peg" data-titel="C−H på sp^{3}-carbon" data-tekst="2960 til 2850 cm^{−1}. Båndet er kraftigt. Det findes i alkaner og carbonkæder." data-i="baand0" data-med="omr0"><rect x="184.8" y="200.0" width="15.3" height="12.0" rx="4" fill="#1d4ed8"/><text x="208.1" y="211.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C−H på sp</tspan><tspan dy="-4.56" font-size="8.2">3</tspan><tspan dy="4.56">-carbon: kraftigt</tspan></text></g><g class="peg" data-titel="C≡C i alkyner" data-tekst="2260 til 2100 cm^{−1}. Båndet er svagt." data-i="baand1" data-med="omr1"><rect x="282.2" y="222.0" width="22.3" height="12.0" rx="4" fill="#6d4bb5"/><text x="312.5" y="233.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C≡C i alkyner: svagt</tspan></text></g><g class="peg" data-titel="C≡N i nitriler" data-tekst="2260 til 2200 cm^{−1}. Båndet er middel." data-i="baand1" data-med="omr1"><rect x="282.2" y="244.0" width="8.4" height="12.0" rx="4" fill="#6d4bb5"/><text x="298.6" y="255.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C≡N i nitriler: middel</tspan></text></g><g class="peg" data-titel="C=O i aldehyder, ketoner, carboxylsyrer og estere" data-tekst="Estere 1750 til 1735, aldehyder 1740 til 1720, ketoner 1725 til 1705 og carboxylsyrer 1725 til 1695 cm^{−1}. Båndet er kraftigt og skarpt.&#10;Intervallerne overlapper, så bølgetallet alene afgør sjældent, hvilken slags carbonylgruppe det er." data-i="baand2" data-med="omr2"><rect x="388.0" y="266.0" width="15.3" height="12.0" rx="4" fill="#c2410c"/><text x="411.3" y="277.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C=O i aldehyder, ketoner, carboxylsyrer og estere: kraftigt</tspan></text></g><g class="peg" data-titel="C=O i amider" data-tekst="1700 til 1600 cm^{−1}. Båndet er kraftigt." data-i="baand2" data-med="omr2"><rect x="401.9" y="288.0" width="27.8" height="12.0" rx="4" fill="#c2410c"/><text x="437.8" y="299.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C=O i amider: kraftigt</tspan></text></g><g class="peg" data-titel="C=C i alkener" data-tekst="1680 til 1640 cm^{−1}. Båndet er svagt til middel." data-i="baand2" data-med="omr2"><rect x="407.5" y="310.0" width="11.1" height="12.0" rx="4" fill="#c2410c"/><text x="426.6" y="321.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C=C i alkener: svagt til middel</tspan></text></g><g class="peg" data-titel="C=C i benzenringe" data-tekst="Omkring 1600 og 1500 cm^{−1}. Båndene er svage til middel." data-i="baand2" data-med="omr2"><rect x="427.0" y="332.0" width="6.0" height="12.0" rx="4" fill="#c2410c"/><rect x="454.8" y="332.0" width="6.0" height="12.0" rx="4" fill="#c2410c"/><text x="470.4" y="343.0" font-size="12" text-anchor="start" fill="#14201f"><tspan>C=C i benzenringe: omkring 1600 og 1500</tspan></text></g><line x1="40.0" y1="360.0" x2="736.0" y2="360.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="388.0" y="396.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>bølgetal i cm</tspan><tspan dy="-4.75" font-size="8.5">−1</tspan></text>
</svg>
