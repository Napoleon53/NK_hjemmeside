<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 152" width="760" height="152" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for tre stoffer med numre på carbonatomerne i kæderne. Mælkesyre har tre carbonatomer: carbonatom 1 er carbonatomet i en carboxylgruppe, carbonatom 2 binder en hydroxygruppe, og carbonatom 3 er en methylgruppe. Linalool har en kæde med otte carbonatomer. Der er en dobbeltbinding mellem carbonatom 1 og 2 og en dobbeltbinding mellem carbonatom 6 og 7. Carbonatom 3 binder en hydroxygruppe og en methylgruppe, og carbonatom 7 binder en methylgruppe. Efedrin har en benzenring med en sidekæde. Carbonatom 1 sidder på benzenringen og binder en hydroxygruppe. Carbonatom 2 binder methylgruppen med carbonatom 3 og en NH-gruppe, som binder endnu en methylgruppe">
