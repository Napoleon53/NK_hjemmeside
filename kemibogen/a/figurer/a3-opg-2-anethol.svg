<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 124" width="760" height="124" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To strukturformler for anethol, A og B. Begge har en benzenring med en gruppe O-CH3 og over for den en sidekæde med tre carbonatomer. I sidekæden er der en dobbeltbinding mellem det første og det andet carbonatom. I struktur A fortsætter kæden i zigzag hen over dobbeltbindingen, så benzenringen og methylgruppen sidder på hver sin side af dobbeltbindingen. I struktur B bøjer kæden, så benzenringen og methylgruppen sidder på samme side af dobbeltbindingen">
<title>To strukturformler for anethol, A og B. Begge har en benzenring med en gruppe O-CH3 og over for den en sidekæde med tre carbonatomer. I sidekæden er der en dobbeltbinding mellem det første og det andet carbonatom. I struktur A fortsætter kæden i zigzag hen over dobbeltbindingen, så benzenringen og methylgruppen sidder på hver sin side af dobbeltbindingen. I struktur B bøjer kæden, så benzenringen og methylgruppen sidder på samme side af dobbeltbindingen</title>
