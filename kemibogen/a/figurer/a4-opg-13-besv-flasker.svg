<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 194" width="760" height="194" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En besvarelse vist som en struktur med farvede ringe og en tabel. Strukturen er 2-methylpropansyre, (CH3)2CH−CO−OH. Signal 1 ved 1,20 ppm, 6 H, dublet, 1 nabo-H, er de to ens methylgrupper på CH og har rød ring. Signal 2 ved 2,58 ppm, 1 H, septet, 6 nabo-H, er CH-gruppen ved siden af C=O og har blå ring. Signal 3 ved 11,8 ppm, 1 H, bred singlet, er hydrogenatomet i carboxylgruppen og har grøn ring">
