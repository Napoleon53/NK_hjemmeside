<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Strukturformler for tre molekyler. Molekyle 1 har to ringe med nitrogenatomer, der er bygget sammen: en ring med seks atomer og en ring med fem atomer. På ringen med seks atomer sidder et oxygenatom med dobbeltbinding, og der er ingen NH2-gruppe. Molekyle 2 har én ring med seks atomer, hvoraf to er nitrogenatomer. På ringen sidder to oxygenatomer med dobbeltbinding og et fluoratom. Molekyle 3 har én ring med seks atomer, hvoraf to er nitrogenatomer. På ringen sidder en NH2-gruppe, et oxygenatom med dobbeltbinding og en methylgruppe">
