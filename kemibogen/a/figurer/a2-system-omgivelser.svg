<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To tegninger af et system omgivet af sine omgivelser. Ved en exoterm reaktion går varmen fra systemet ud i omgivelserne, og delta H er negativ. Ved en endoterm reaktion går varmen fra omgivelserne ind i systemet, og delta H er positiv">
