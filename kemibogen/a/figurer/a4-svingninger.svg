<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre måder, et vandmolekyle kan svinge på. Symmetrisk stræk: de to bindinger bliver længere på samme tid, 3657. Asymmetrisk stræk: den ene binding bliver længere, mens den anden bliver kortere, 3756. Bøjning: vinklen mellem de to bindinger ændres, 1595. Tallene er bølgetal i reciprokke centimeter">
