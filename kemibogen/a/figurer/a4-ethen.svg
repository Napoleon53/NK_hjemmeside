<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ethen vist på to måder. Set ovenfra: hvert carbonatom har tre sp2-hybridorbitaler med 120 grader imellem. De danner en sigma-binding mellem de to carbonatomer og fire sigma-bindinger til hydrogenatomer, og alle seks atomer ligger i samme plan. Set fra siden: hvert carbonatom har en 2p-orbital, som står vinkelret på planen. De to 2p-orbitaler overlapper over og under planen og danner pi-bindingen">
