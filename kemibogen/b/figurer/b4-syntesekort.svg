<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 336" width="756" height="336" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Kort over, hvordan stofklasserne kan omdannes til hinanden ved substitution, addition, elimination, oxidation, kondensation og hydrolyse">
<title>Kort over, hvordan stofklasserne kan omdannes til hinanden ved substitution, addition, elimination, oxidation, kondensation og hydrolyse</title>
<g class="peg-vejledning" data-tekst="Peg på en stofklasse eller en pil, og se, hvilke reaktioner der fører til og fra."/><g class="peg" data-titel="Substitution: fra alkan til halogenalkan" data-tekst="Et hydrogenatom bliver skiftet ud med et bromatom. Reaktionen kræver lys." data-noegle="alkan-halogen" data-i="ved-alkan ved-halogen" data-med="alkan halogen"><line x1="149.0" y1="52.0" x2="241.0" y2="52.0" stroke="#6b7280" stroke-width="2.2" stroke-linecap="round"/><polygon points="251.0,52.0 241.0,57.0 241.0,47.0" fill="#6b7280"/><text x="200.0" y="28.0" font-size="12.5" text-anchor="middle" fill="#6b7280" font-weight="700"><tspan>substitution</tspan></text><text x="200.0" y="43.0" font-size="12.5" text-anchor="middle" fill="#6b7280"><tspan>med Br</tspan><tspan dy="2.75" font-size="8.5">2</tspan><tspan dy="-2.75"> og lys</tspan></text><rect class="peg-maal" x="146.7" y="15.0" width="106.6" height="34.0" fill="none"/></g><g class="peg" data-titel="Addition af H_{2}: fra alken til alkan" data-tekst="To hydrogenatomer sætter sig på dobbeltbindingen. Reaktionen kræver en katalysator." data-noegle="alken-alkan" data-i="ved-alken ved-alkan" data-med="alken alkan"><line x1="92.0" y1="150.0" x2="92.0" y2="88.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="92.0,78.0 97.0,88.0 87.0,88.0" fill="#0f766e"/><text x="46.0" y="110.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>addition</tspan></text><text x="46.0" y="125.0" font-size="12.5" text-anchor="middle" fill="#0f766e"><tspan>af H</tspan><tspan dy="2.75" font-size="8.5">2</tspan></text><rect class="peg-maal" x="13.4" y="97.0" width="65.2" height="34.0" fill="none"/></g><g class="peg" data-titel="Addition af HBr: fra alken til halogenalkan" data-tekst="Et hydrogenatom og et bromatom sætter sig på dobbeltbindingen." data-noegle="alken-halogen" data-i="ved-alken ved-halogen" data-med="alken halogen"><line x1="132.0" y1="146.5" x2="266.5" y2="74.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="275.3,69.2 268.9,78.4 264.2,69.6" fill="#0f766e"/><text x="169.7" y="85.8" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>addition</tspan></text><text x="169.7" y="100.8" font-size="12.5" text-anchor="middle" fill="#0f766e"><tspan>af HBr</tspan></text><rect class="peg-maal" x="137.1" y="72.8" width="65.2" height="34.0" fill="none"/></g><g class="peg" data-titel="Elimination: fra halogenalkan til alken" data-tekst="To atomer fjernes fra nabocarbonatomer, og der dannes en dobbeltbinding. Elimination er det modsatte af addition." data-noegle="halogen-alken" data-i="ved-halogen ved-alken" data-med="halogen alken"><line x1="282.0" y1="81.5" x2="147.5" y2="154.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><polygon points="138.7,158.8 145.1,149.6 149.8,158.4" fill="#b45309"/><text x="254.3" y="134.2" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>elimination</tspan></text><rect class="peg-maal" x="211.4" y="121.2" width="85.9" height="19.0" fill="none"/></g><g class="peg" data-titel="Addition af vand: fra alken til alkohol" data-tekst="Et vandmolekyle sætter sig på dobbeltbindingen. Reaktionen kræver en katalysator." data-noegle="alken-alkohol" data-i="ved-alken ved-alkohol" data-med="alken alkohol"><line x1="149.0" y1="169.0" x2="255.0" y2="169.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="265.0,169.0 255.0,174.0 255.0,164.0" fill="#0f766e"/><text x="207.0" y="155.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>addition af vand</tspan></text><rect class="peg-maal" x="146.8" y="142.0" width="120.4" height="19.0" fill="none"/></g><g class="peg" data-titel="Elimination: fra alkohol til alken" data-tekst="Der fjernes vand fra alkoholen, og der dannes en dobbeltbinding. Det kræver varme og koncentreret svovlsyre." data-noegle="alkohol-alken" data-i="ved-alkohol ved-alken" data-med="alkohol alken"><line x1="265.0" y1="183.0" x2="159.0" y2="183.0" stroke="#b45309" stroke-width="2.2" stroke-linecap="round"/><polygon points="149.0,183.0 159.0,178.0 159.0,188.0" fill="#b45309"/><text x="207.0" y="205.0" font-size="12.5" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>elimination</tspan></text><rect class="peg-maal" x="164.1" y="192.0" width="85.9" height="19.0" fill="none"/></g><g class="peg" data-titel="Polyaddition: fra alken til polymer" data-tekst="Mange alkenmolekyler sætter sig sammen til én lang kæde." data-noegle="alken-polymer" data-i="ved-alken ved-polymer" data-med="alken polymer"><line x1="92.0" y1="202.0" x2="92.0" y2="264.0" stroke="#0f766e" stroke-width="2.2" stroke-linecap="round"/><polygon points="92.0,274.0 87.0,264.0 97.0,264.0" fill="#0f766e"/><text x="52.0" y="234.0" font-size="12.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>poly-</tspan></text><text x="52.0" y="249.0" font-size="12.5" text-anchor="middle" fill="#0f766e"><tspan>addition</tspan></text><rect class="peg-maal" x="19.4" y="221.0" width="65.2" height="34.0" fill="none"/></g><g class="peg" data-titel="Oxidation: fra primær alkohol til aldehyd" data-tekst="En primær alkohol oxideres til et aldehyd. Som oxidationsmiddel bruges fx KMnO_{4} eller K_{2}Cr_{2}O_{7}." data-noegle="alkohol-aldehyd" data-i="ved-alkohol ved-aldehyd" data-med="alkohol aldehyd"><line x1="379.0" y1="176.0" x2="439.0" y2="176.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="449.0,176.0 439.0,181.0 439.0,171.0" fill="#a93226"/><text x="414.0" y="152.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>oxidation</tspan></text><text x="414.0" y="167.0" font-size="12.5" text-anchor="middle" fill="#a93226"><tspan>(primær)</tspan></text><rect class="peg-maal" x="377.9" y="139.0" width="72.1" height="34.0" fill="none"/></g><g class="peg" data-titel="Oxidation: fra aldehyd til carboxylsyre" data-tekst="Aldehydet kan oxideres videre til en carboxylsyre." data-noegle="aldehyd-syre" data-i="ved-aldehyd ved-syre" data-med="aldehyd syre"><line x1="563.0" y1="176.0" x2="605.0" y2="176.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="615.0,176.0 605.0,181.0 605.0,171.0" fill="#a93226"/><text x="589.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>oxidation</tspan></text><rect class="peg-maal" x="553.0" y="133.0" width="72.1" height="19.0" fill="none"/></g><g class="peg" data-titel="Oxidation: fra sekundær alkohol til keton" data-tekst="En sekundær alkohol oxideres til en keton. Ketonen kan ikke oxideres videre." data-noegle="alkohol-keton" data-i="ved-alkohol ved-keton" data-med="alkohol keton"><line x1="357.3" y1="199.8" x2="462.4" y2="270.6" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="470.7,276.2 459.6,274.8 465.2,266.5" fill="#a93226"/><text x="400.0" y="260.0" font-size="12.5" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>oxidation</tspan></text><text x="400.0" y="275.0" font-size="12.5" text-anchor="middle" fill="#a93226"><tspan>(sekundær)</tspan></text><rect class="peg-maal" x="360.5" y="247.0" width="79.0" height="34.0" fill="none"/></g><g class="peg" data-titel="Kondensation: fra alkohol til ether" data-tekst="To alkoholmolekyler bliver sat sammen, og der fraspaltes vand." data-noegle="alkohol-ether" data-i="ved-alkohol ved-ether" data-med="alkohol ether"><line x1="322.0" y1="202.0" x2="322.0" y2="264.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="322.0,274.0 317.0,264.0 327.0,264.0" fill="#1d4ed8"/><text x="272.0" y="242.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>kondensation</tspan></text><rect class="peg-maal" x="225.6" y="229.0" width="92.8" height="19.0" fill="none"/></g><g class="peg" data-titel="Kondensation: fra carboxylsyre til ester" data-tekst="En carboxylsyre og en alkohol bliver sat sammen, og der fraspaltes vand. Det kræver varme og koncentreret svovlsyre." data-noegle="syre-ester" data-i="ved-syre ved-ester" data-med="syre ester"><line x1="677.0" y1="202.0" x2="677.0" y2="264.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="677.0,274.0 672.0,264.0 682.0,264.0" fill="#1d4ed8"/><text x="623.0" y="234.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>kondensation</tspan></text><text x="623.0" y="249.0" font-size="12.5" text-anchor="middle" fill="#1d4ed8"><tspan>med alkohol</tspan></text><rect class="peg-maal" x="576.6" y="221.0" width="92.8" height="34.0" fill="none"/></g><g class="peg" data-titel="Hydrolyse: fra ester til carboxylsyre" data-tekst="Esteren spaltes af vand til carboxylsyren og alkoholen. Hydrolyse er det modsatte af kondensation." data-noegle="ester-syre" data-i="ved-ester ved-syre" data-med="ester syre"><line x1="691.0" y1="274.0" x2="691.0" y2="212.0" stroke="#7c3aed" stroke-width="2.2" stroke-linecap="round"/><polygon points="691.0,202.0 696.0,212.0 686.0,212.0" fill="#7c3aed"/><text x="727.0" y="242.0" font-size="12.5" text-anchor="middle" fill="#7c3aed" font-weight="700"><tspan>hydrolyse</tspan></text><rect class="peg-maal" x="691.0" y="229.0" width="72.1" height="19.0" fill="none"/></g><g class="peg" data-titel="Alkan" data-tekst="En alkan kan omdannes til en halogenalkan ved substitution. En alkan dannes af en alken ved addition af H_{2}." data-noegle="alkan" data-med="alken halogen ved-alkan"><rect x="40.0" y="31.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="92.0" y="57.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Alkan</tspan></text></g><g class="peg" data-titel="Halogenalkan" data-tekst="En halogenalkan dannes af en alkan ved substitution eller af en alken ved addition af HBr. Ved elimination bliver en halogenalkan til en alken." data-noegle="halogen" data-med="alkan alken ved-halogen"><rect x="256.0" y="31.0" width="132.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="322.0" y="57.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Halogenalkan</tspan></text></g><g class="peg" data-titel="Alken" data-tekst="En alken reagerer ved addition: med H_{2} til en alkan, med HBr til en halogenalkan og med vand til en alkohol. Ved polyaddition bliver mange alkenmolekyler til en polymer." data-noegle="alken" data-med="alkan alkohol halogen polymer ved-alken"><rect x="40.0" y="155.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="92.0" y="181.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Alken</tspan></text></g><g class="peg" data-titel="Alkohol" data-tekst="Fra en alkohol kan man komme til næsten alle de andre stofklasser: en alken ved elimination, et aldehyd eller en keton ved oxidation og en ether ved kondensation." data-noegle="alkohol" data-med="aldehyd alken ether keton ved-alkohol"><rect x="270.0" y="155.0" width="104.0" height="42.0" rx="9" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="322.0" y="181.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Alkohol</tspan></text></g><g class="peg" data-titel="Aldehyd" data-tekst="Et aldehyd dannes ved oxidation af en primær alkohol. Aldehydet kan oxideres videre til en carboxylsyre." data-noegle="aldehyd" data-med="alkohol syre ved-aldehyd"><rect x="454.0" y="155.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="506.0" y="181.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Aldehyd</tspan></text></g><g class="peg" data-titel="Carboxylsyre" data-tekst="En carboxylsyre dannes ved oxidation af et aldehyd eller ved hydrolyse af en ester. Ved kondensation med en alkohol bliver carboxylsyren til en ester." data-noegle="syre" data-med="aldehyd ester ved-syre"><rect x="620.0" y="155.0" width="128.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="684.0" y="181.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Carboxylsyre</tspan></text></g><g class="peg" data-titel="Polymer" data-tekst="En polymer dannes ved polyaddition, hvor mange alkenmolekyler sætter sig sammen til én lang kæde." data-noegle="polymer" data-med="alken ved-polymer"><rect x="40.0" y="279.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="92.0" y="305.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Polymer</tspan></text></g><g class="peg" data-titel="Keton" data-tekst="En keton dannes ved oxidation af en sekundær alkohol. Ketonen kan ikke oxideres videre." data-noegle="keton" data-med="alkohol ved-keton"><rect x="454.0" y="279.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="506.0" y="305.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Keton</tspan></text></g><g class="peg" data-titel="Ester" data-tekst="En ester dannes ved kondensation af en carboxylsyre og en alkohol. Ved hydrolyse bliver esteren spaltet til carboxylsyren og alkoholen igen." data-noegle="ester" data-med="syre ved-ester"><rect x="632.0" y="279.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="684.0" y="305.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ester</tspan></text></g><g class="peg" data-titel="Ether" data-tekst="En ether dannes ved kondensation af to alkoholmolekyler." data-noegle="ether" data-med="alkohol ved-ether"><rect x="270.0" y="279.0" width="104.0" height="42.0" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="322.0" y="305.5" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Ether</tspan></text></g>
</svg>
