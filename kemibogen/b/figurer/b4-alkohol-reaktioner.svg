<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 284" width="756" height="284" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Alkoholers fem vigtigste reaktioner: forbrænding, elimination, oxidation, kondensation med en syre og kondensation med en alkohol">
<title>Alkoholers fem vigtigste reaktioner: forbrænding, elimination, oxidation, kondensation med en syre og kondensation med en alkohol</title>
<g class="peg-vejledning" data-tekst="Peg på en reaktion, og se, hvad alkoholen bliver til."/><line x1="297.4" y1="109.9" x2="216.1" y2="79.6" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="206.7,76.1 217.8,74.9 214.3,84.3" fill="#556766"/><g class="peg" data-titel="Forbrænding" data-tekst="Alkoholer brænder med en blålig flamme og danner carbondioxid og vand.&#10;CH_{3}CH_{2}OH + 3 O_{2} → 2 CO_{2} + 3 H_{2}O" data-med="alkohol"><rect x="20.0" y="18.0" width="212.0" height="56.0" rx="9" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.4"/><text x="126.0" y="41.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Forbrænding</tspan></text><text x="126.0" y="60.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>CO</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86"> og H</tspan><tspan dy="2.86" font-size="8.8">2</tspan><tspan dy="-2.86">O</tspan></text></g><line x1="458.6" y1="109.9" x2="539.9" y2="79.6" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="549.3,76.1 541.7,84.3 538.2,74.9" fill="#556766"/><g class="peg" data-titel="Elimination" data-tekst="Opvarmes en alkohol med koncentreret svovlsyre, fjernes der vand, og der dannes en alken.&#10;CH_{3}CH_{2}OH → CH_{2}=CH_{2} + H_{2}O" data-med="alkohol"><rect x="524.0" y="18.0" width="212.0" height="56.0" rx="9" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.4"/><text x="630.0" y="41.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Elimination</tspan></text><text x="630.0" y="60.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>alken og vand</tspan></text></g><line x1="459.0" y1="140.0" x2="518.0" y2="140.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="528.0,140.0 518.0,145.0 518.0,135.0" fill="#556766"/><g class="peg" data-titel="Oxidation" data-tekst="Alkoholer kan oxideres til aldehyder, ketoner og carboxylsyrer. Hvad der dannes, afhænger af, om alkoholen er primær, sekundær eller tertiær." data-med="alkohol"><rect x="534.0" y="106.0" width="212.0" height="68.0" rx="9" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.4"/><text x="640.0" y="126.6" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Oxidation</tspan></text><text x="640.0" y="145.1" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>aldehyd, keton</tspan></text><text x="640.0" y="163.6" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>eller carboxylsyre</tspan></text></g><line x1="458.6" y1="170.7" x2="541.5" y2="202.3" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="550.9,205.9 539.8,207.0 543.3,197.6" fill="#556766"/><g class="peg" data-titel="Kondensation med syre" data-tekst="En alkohol reagerer med en carboxylsyre og danner en ester og vand. Det er den vigtigste kondensation." data-med="alkohol"><rect x="524.0" y="208.0" width="212.0" height="56.0" rx="9" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.4"/><text x="630.0" y="231.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kondensation med syre</tspan></text><text x="630.0" y="250.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>ester og vand</tspan></text></g><line x1="297.4" y1="170.7" x2="214.5" y2="202.3" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="205.1,205.9 212.7,197.6 216.2,207.0" fill="#556766"/><g class="peg" data-titel="Kondensation med alkohol" data-tekst="To alkoholmolekyler kan kondensere til en ether. Det kræver høj temperatur og en katalysator.&#10;2 CH_{3}CH_{2}OH → CH_{3}CH_{2}−O−CH_{2}CH_{3} + H_{2}O" data-med="alkohol"><rect x="20.0" y="208.0" width="212.0" height="56.0" rx="9" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.4"/><text x="126.0" y="231.8" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Kondensation med alkohol</tspan></text><text x="126.0" y="250.3" font-size="13.0" text-anchor="middle" fill="#556766"><tspan>ether og vand</tspan></text></g><g class="peg" data-titel="Alkohol, R−OH" data-tekst="Alkoholer kan reagere på fem måder. Oxidation og de to kondensationer giver nye stofklasser." data-noegle="alkohol"><rect x="303.0" y="110.0" width="150.0" height="60.0" rx="9" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.4"/><text x="378.0" y="135.3" font-size="18" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Alkohol</tspan></text><text x="378.0" y="157.3" font-size="16.5" text-anchor="middle" fill="#556766"><tspan>R−OH</tspan></text></g>
</svg>
