<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 262" width="756" height="262" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Regnefirkanten: fra oxoniumkoncentration til pH, fra hydroxidkoncentration til pOH, og på tværs med vands ionprodukt og pH plus pOH lig 14">
<title>Regnefirkanten: fra oxoniumkoncentration til pH, fra hydroxidkoncentration til pOH, og på tværs med vands ionprodukt og pH plus pOH lig 14</title>
<g class="peg-vejledning" data-tekst="Peg på en størrelse eller en sammenhæng i firkanten."/><g class="peg" data-titel="[H_{3}O^{+}]: koncentrationen af oxoniumioner" data-tekst="Den aktuelle koncentration af oxoniumioner i opløsningen, målt i M. Jo flere oxoniumioner, jo lavere er pH." data-noegle="[H_{3}O^{+}]"><rect x="124.0" y="36.0" width="132.0" height="48.0" rx="10" fill="#ffffff" stroke="#a93226" stroke-width="1.8"/><text x="190.0" y="67.0" font-size="19" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>[H</tspan><tspan dy="4.18" font-size="12.9">3</tspan><tspan dy="-4.18">O</tspan><tspan dy="-7.22" font-size="12.9">+</tspan><tspan dy="7.22">]</tspan></text></g><g class="peg" data-titel="[OH^{−}]: koncentrationen af hydroxidioner" data-tekst="Den aktuelle koncentration af hydroxidioner i opløsningen, målt i M." data-noegle="[OH^{−}]"><rect x="500.0" y="36.0" width="132.0" height="48.0" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="566.0" y="67.0" font-size="19" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>[OH</tspan><tspan dy="-7.22" font-size="12.9">−</tspan><tspan dy="7.22">]</tspan></text></g><g class="peg" data-titel="pH" data-tekst="pH defineres ud fra koncentrationen af oxoniumioner: pH = −log [H_{3}O^{+}]." data-noegle="pH"><rect x="124.0" y="192.0" width="132.0" height="48.0" rx="10" fill="#ffffff" stroke="#a93226" stroke-width="1.8"/><text x="190.0" y="223.0" font-size="19" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>pH</tspan></text></g><g class="peg" data-titel="pOH" data-tekst="pOH defineres ud fra koncentrationen af hydroxidioner: pOH = −log [OH^{−}]." data-noegle="pOH"><rect x="500.0" y="192.0" width="132.0" height="48.0" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/><text x="566.0" y="223.0" font-size="19" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>pOH</tspan></text></g><g class="peg" data-titel="Vands ionprodukt" data-tekst="Ganges de to koncentrationer med hinanden, får man altid 1,0 · 10^{−14} M^{2}. Kender man den ene koncentration, kan man derfor beregne den anden." data-med="[H_{3}O^{+}] [OH^{−}]"><rect class="peg-maal" x="266.0" y="30.0" width="224.0" height="60.0" fill="none"/><line x1="262.0" y1="60.0" x2="494.0" y2="60.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><text x="378.0" y="48.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="3.08" font-size="9.5">3</tspan><tspan dy="-3.08">O</tspan><tspan dy="-5.32" font-size="9.5">+</tspan><tspan dy="5.32">] · [OH</tspan><tspan dy="-5.32" font-size="9.5">−</tspan><tspan dy="5.32">] = 1,0 · 10</tspan><tspan dy="-5.32" font-size="9.5">−14</tspan><tspan dy="5.32"> M</tspan><tspan dy="-5.32" font-size="9.5">2</tspan></text><text x="378.0" y="82.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>vands ionprodukt</tspan></text></g><g class="peg" data-titel="pH + pOH = 14,00" data-tekst="Sammenhængen fås ved at tage −log på begge sider af vands ionprodukt. Ved pH 3 er pOH 11." data-med="pH pOH"><rect class="peg-maal" x="266.0" y="186.0" width="224.0" height="60.0" fill="none"/><line x1="262.0" y1="216.0" x2="494.0" y2="216.0" stroke="#556766" stroke-width="1.8" stroke-linecap="round"/><text x="378.0" y="204.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>pH + pOH = 14,00</tspan></text><text x="378.0" y="238.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>gælder ved 25 °C</tspan></text></g><g class="peg" data-titel="Mellem [H_{3}O^{+}] og pH" data-tekst="pH = −log [H_{3}O^{+}] fører fra koncentrationen til pH.&#10;[H_{3}O^{+}] = 10^{−pH} M fører fra pH tilbage til koncentrationen." data-med="[H_{3}O^{+}] pH"><line x1="176.0" y1="90.0" x2="176.0" y2="177.0" stroke="#a93226" stroke-width="2" stroke-linecap="round"/><polygon points="176.0,186.0 171.5,177.0 180.5,177.0" fill="#a93226"/><line x1="204.0" y1="186.0" x2="204.0" y2="99.0" stroke="#a93226" stroke-width="2" stroke-linecap="round"/><polygon points="204.0,90.0 208.5,99.0 199.5,99.0" fill="#a93226"/><text x="160.0" y="130.0" font-size="13.5" text-anchor="end" fill="#a93226" font-weight="700"><tspan>pH = −log [H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">]</tspan></text><text x="160.0" y="152.0" font-size="13.5" text-anchor="end" fill="#a93226" font-weight="700"><tspan>[H</tspan><tspan dy="2.97" font-size="9.2">3</tspan><tspan dy="-2.97">O</tspan><tspan dy="-5.13" font-size="9.2">+</tspan><tspan dy="5.13">] = 10</tspan><tspan dy="-5.13" font-size="9.2">−pH</tspan><tspan dy="5.13"> M</tspan></text><rect class="peg-maal" x="4.0" y="110.0" width="208.0" height="52.0" fill="none"/></g><g class="peg" data-titel="Mellem [OH^{−}] og pOH" data-tekst="pOH = −log [OH^{−}] fører fra koncentrationen til pOH.&#10;[OH^{−}] = 10^{−pOH} M fører fra pOH tilbage til koncentrationen." data-med="[OH^{−}] pOH"><line x1="552.0" y1="90.0" x2="552.0" y2="177.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><polygon points="552.0,186.0 547.5,177.0 556.5,177.0" fill="#1d4ed8"/><line x1="580.0" y1="186.0" x2="580.0" y2="99.0" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/><polygon points="580.0,90.0 584.5,99.0 575.5,99.0" fill="#1d4ed8"/><text x="596.0" y="130.0" font-size="13.5" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>pOH = −log [OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">]</tspan></text><text x="596.0" y="152.0" font-size="13.5" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>[OH</tspan><tspan dy="-5.13" font-size="9.2">−</tspan><tspan dy="5.13">] = 10</tspan><tspan dy="-5.13" font-size="9.2">−pOH</tspan><tspan dy="5.13"> M</tspan></text><rect class="peg-maal" x="544.0" y="110.0" width="208.0" height="52.0" fill="none"/></g>
</svg>
