<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fire udsnit af opløsningen i kolben under en titrering med EDTA, mærket A, B, C og D. De står ikke i rækkefølge. A: to calciumioner bundet til EDTA, to frie calciumioner, én fri magnesiumion og to magnesiumioner bundet til indikator. B: fire calciumioner og tre magnesiumioner bundet til EDTA og to frie indikatorer. C: fire frie calciumioner, én fri magnesiumion og to magnesiumioner bundet til indikator. D: fire calciumioner og to magnesiumioner bundet til EDTA, én magnesiumion bundet til indikator og én fri indikator">
