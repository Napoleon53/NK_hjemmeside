<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Udsnittet af vandprøven efter kogningen. Fire calciumioner ligger på bunden som fast calciumcarbonat, altså kedelsten, og fire molekyler carbondioxid er på vej væk. To calciumioner, én sulfation og to chloridioner er stadig opløst. En søjle under udsnittet viser, at fire af de seks calciumioner hører til den midlertidige hårdhed og to til den permanente">
<title>Udsnittet af vandprøven efter kogningen. Fire calciumioner ligger på bunden som fast calciumcarbonat, altså kedelsten, og fire molekyler carbondioxid er på vej væk. To calciumioner, én sulfation og to chloridioner er stadig opløst. En søjle under udsnittet viser, at fire af de seks calciumioner hører til den midlertidige hårdhed og to til den permanente</title>
