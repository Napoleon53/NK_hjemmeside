dt</tspan></text><rect class="peg-maal" x="50.9" y="28.0" width="75.7" height="20.0" fill="none"/></g><g class="peg" data-titel="Smør" data-tekst="Smør har et iodtal omkring 35. 100 g smør kan altså addere omkring 35 g iod. Det er et lavt iodtal, og det betyder få dobbeltbindinger."><line x1="172.0" y1="87.0" x2="172.0" y2="75.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="172.0" cy="96.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="172.0" y="68.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>smør</tspan></text><rect class="peg-maal" x="152.4" y="54.0" width="39.2" height="20.0" fill="none"/></g><g class="peg" data-titel="Palmeolie" data-tekst="Palmeolie har et iodtal omkring 52. 100 g palmeolie kan altså addere omkring 52 g iod. Det er et lavt iodtal, og det betyder få dobbeltbindinger."><line x1="226.4" y1="87.0" x2="226.4" y2="49.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="226.4" cy="96.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="226.4" y="42.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>palmeolie</tspan></text><rect class="peg-maal" x="188.6" y="28.0" width="75.7" height="20.0" fill="none"/></g><g class="peg" data-titel="Olivenolie" data-tekst="Olivenolie har et iodtal omkring 84. 100 g olivenolie kan altså addere omkring 84 g iod. Iodtallet ligger midt på skalaen."><line x1="328.8" y1="87.0" x2="328.8" y2="75.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="328.8" cy="96.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="328.8" y="68.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>olivenolie</tspan></text><rect class="peg-maal" x="287.3" y="54.0" width="83.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Rapsolie" data-tekst="Rapsolie har et iodtal omkring 112. 100 g rapsolie kan altså addere omkring