<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 186" width="756" height="186" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skala med iodtal fra 0 til 200. Kokosfedt og smør har lave iodtal, olivenolie og rapsolie ligger i midten, og solsikkeolie og hørfrøolie har høje iodtal">
