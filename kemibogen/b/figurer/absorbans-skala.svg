<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 222" width="750" height="222" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre kuvetter. Gennem rent vand slipper 100 procent af lyset, og absorbansen er 0. Med lidt farvestof slipper 10 procent igennem, og absorbansen er 1. Med meget farvestof slipper 1 procent igennem, og absorbansen er 2">
