<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 292" width="756" height="292" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Etiketten på en flaske ethanol med faresymbolerne brandfarlig og sundhedsskadelig, signalordet Fare, to H-sætninger om faren og to P-sætninger om, hvordan man undgår den">
<title>Etiketten på en flaske ethanol med faresymbolerne brandfarlig og sundhedsskadelig, signalordet Fare, to H-sætninger om faren og to P-sætninger om, hvordan man undgår den</title>
<rect x="14.0" y="12.0" width="452.0" height="268.0" rx="10" fill="#ffffff" stroke="#556766" stroke-width="2"/><text x="32.0" y="50.0" font-size="21" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Ethanol 96 %</tspan></text><text x="32.0" y="72.0" font-size="14" text-anchor="start" fill="#556766"><tspan>CH</tspan><tspan dy="3.08" font-size="9.5">3</tspan><tspan dy="-3.08">CH</tspan><tspan dy="3.08" font-size="9.5">2</tspan><tspan dy="-3.08">OH</tspan></text><svg x="314.0" y="22.0" width="66" height="66" viewBox="0 0 579 579"><path d="m25 290 264 264 264-264L289 26 25 290z" fill="#fff"/><path d="M148 148 6 290l142 141 141 142 142-142 142-141-142-142L289 6 148 148zm261 22 119 120-119 119-120 119-119-119L51 290l119-120L289 51l120 119z" fill="red"/><path d="M290 121c-18 34 3 53-20 102-13-10-6-47-30-48 3 12 1 16 0 20-3 17-8 31 3 52-17-8-18-23-32-33 3 16-4 49 15 81-17-2-23-8-41-26 19 100 34 103 105 109-6-1-42-7-55-48 0-10-1 9 34 10-22-35-16-28-14-48 10 13 2 15 27 25-8-26 13-43 8-73 6 13 26 11 25 73 17-19 18-6 26-26 1 11 6 25-17 49 6 2 16 3 31-8-15 18-1 18-40 46 49 1 81-30 80-97-2 6-3 18-29 21 16-16 25-49 12-75-5 4-12 24-29 29 8-14 6-32 6-32s3-25-12-45c-4 30-4 46-23 50 3-17 4-26-6-46-10-21-22-42-24-62zm-81 274v18h171v-18H209z"/></svg><svg x="386.0" y="22.0" width="66" height="66" viewBox="0 0 5790 5790"><path d="m253 2897 2640 2640 2641-2640c-880-880-1760-1762-2640-2640L253 2897" fill="#fff"/><path d="m60 2897 2833 2833 2834-2834L2894 63 60 2897zm5218 0L2893 5280 510 2896 2894 512l2384 2384" fill="red"/><path d="M2892 1428h-20a475 475 0 0 0-301 121 229 229 0 0 0-64 113c-3 11-3 14-3 35s0 25 3 37c2 14 195 1314 197 1336a213 213 0 0 0 239 182 213 213 0 0 0 180-182c3-27 195-1324 198-1337 2-12 2-16 2-35 0-23 0-31-5-47a234 234 0 0 0-106-138 496 496 0 0 0-291-85h-30zm20 2011h-12a302 302 0 0 0-243 141 338 338 0 0 0-55 232 343 343 0 0 0 114 218 310 310 0 0 0 199 74 316 316 0 0 0 258-141 341 341 0 0 0 54-234 390 390 0 0 0-32-110 317 317 0 0 0-281-180"/></svg><text x="32.0" y="108.0" font-size="17" text-anchor="start" fill="#a93226" font-weight="700"><tspan>Fare</tspan></text><text x="32.0" y="136.0" font-size="12.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>H225</tspan></text><text x="94.0" y="136.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>Meget brandfarlig væske og damp.</tspan></text><text x="32.0" y="158.0" font-size="12.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>H319</tspan></text><text x="94.0" y="158.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>Forårsager alvorlig øjenirritation.</tspan></text><text x="32.0" y="180.0" font-size="12.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>P210</tspan></text><text x="94.0" y="180.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>Holdes væk fra varme, varme overflader, gnister,</tspan></text><text x="94.0" y="197.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>åben ild og andre antændelseskilder. Rygning forbudt.</tspan></text><text x="32.0" y="219.0" font-size="12.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>P305+P351+P338</tspan></text><text x="94.0" y="236.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>VED KONTAKT MED ØJNENE: Skyl forsigtigt</tspan></text><text x="94.0" y="253.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>med vand i flere minutter. Fjern eventuelle</tspan></text><text x="94.0" y="270.0" font-size="12.5" text-anchor="start" fill="#14201f"><tspan>kontaktlinser, hvis dette kan gøres let. Fortsæt skylning.</tspan></text><line x1="454.0" y1="44.0" x2="504.0" y2="44.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="454.0" cy="44.0" r="2.4" fill="#556766"/><text x="512.0" y="49.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>faresymboler</tspan></text><text x="512.0" y="66.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>viser, hvilken slags fare</tspan></text><text x="512.0" y="82.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>stoffet udgør</tspan></text><line x1="76.0" y1="106.0" x2="504.0" y2="106.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="76.0" cy="106.0" r="2.4" fill="#556766"/><text x="512.0" y="111.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>signalord</tspan></text><text x="512.0" y="128.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>Fare er den alvorlige grad,</tspan></text><text x="512.0" y="144.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>Advarsel den mildere</tspan></text><line x1="314.0" y1="160.0" x2="504.0" y2="160.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="314.0" cy="160.0" r="2.4" fill="#556766"/><text x="512.0" y="165.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>H-sætninger</tspan></text><text x="512.0" y="182.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>fortæller, hvad faren er</tspan></text><line x1="454.0" y1="220.0" x2="504.0" y2="220.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="454.0" cy="220.0" r="2.4" fill="#556766"/><text x="512.0" y="225.0" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>P-sætninger</tspan></text><text x="512.0" y="242.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>fortæller, hvordan du</tspan></text><text x="512.0" y="258.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>undgår faren, og hvad du</tspan></text><text x="512.0" y="274.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>gør ved et uheld</tspan></text>
</svg>
