<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 266" width="756" height="266" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En TLC-plade med fem baner set under ultraviolet lys. Bane 1 er paracetamol med en plet lidt under midten, bane 2 er koffein med en plet langt nede, og bane 3 er ibuprofen med en plet højt oppe. Bane 4 er tablet X med to pletter: én i samme højde som paracetamol og én i samme højde som koffein. Bane 5 er tablet Y med én plet i samme højde som ibuprofen">
