<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Størrelsen af partikler i luften sammenlignet med et hår. Håret er 70 mikrometer tykt. Partikler i PM10 er under 10 mikrometer, og partikler i PM2,5 er under 2,5 mikrometer. Jo mindre en partikel er, jo længere når den ned i lungerne">
<title>Størrelsen af partikler i luften sammenlignet med et hår. Håret er 70 mikrometer tykt. Partikler i PM10 er under 10 mikrometer, og partikler i PM2,5 er under 2,5 mikrometer. Jo mindre en partikel er, jo længere når den ned i lungerne</title>
<g class="peg" data-titel="Et hår" data-tekst="Et hår er omkring 70 µm tykt. Det er syv gange så meget som de største partikler, der tælles med i PM_{10}."><circle cx="134.0" cy="148.0" r="112.0" fill="#d9b98a" stroke="#8c6f47" stroke-width="2"/><text x="134.0" y="142.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>et hår</tspan></text><text x="134.0" y="162.0" font-size="14" text-anchor="middle" fill="#5b4526"><tspan>70 µm</tspan></text></g><g class="peg" data-titel="PM_{10}" data-tekst="PM_{10} er alle partikler i luften, som er mindre end 10 µm. De største af dem bliver fanget i næsen og svælget."><circle cx="322.0" cy="148.0" r="16.0" fill="#8b949b" stroke="#4b5563" stroke-width="1.6"/><text x="322.0" y="194.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>PM</tspan><tspan dy="3.30" font-size="10.2">10</tspan></text><text x="322.0" y="213.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>under 10 µm</tspan></text><rect class="peg-maal" x="274.0" y="122.0" width="96.0" height="98.0" fill="none"/></g><g class="peg" data-titel="PM_{2,5}" data-tekst="PM_{2,5} er de partikler, som er mindre end 2,5 µm. De er så små, at de når helt ud i de fineste dele af lungerne. Meget af røgen fra fyrværkeri er så små partikler."><circle cx="426.0" cy="148.0" r="4.0" fill="#4b5563" stroke="#1f2937" stroke-width="1.2"/><text x="426.0" y="194.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>PM</tspan><tspan dy="3.30" font-size="10.2">2,5</tspan></text><text x="426.0" y="213.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>under 2,5 µm</tspan></text><rect class="peg-maal" x="378.0" y="122.0" width="96.0" height="98.0" fill="none"/></g><g class="peg-vejledning" data-tekst="Peg på håret og på de to slags partikler."/><line x1="306.0" y1="50.0" x2="338.0" y2="50.0" stroke="#14201f" stroke-width="2" stroke-linecap="round"/><line x1="306.0" y1="44.0" x2="306.0" y2="56.0" stroke="#14201f" stroke-width="2" stroke-linecap="round"/><line x1="338.0" y1="44.0" x2="338.0" y2="56.0" stroke="#14201f" stroke-width="2" stroke-linecap="round"/><text x="322.0" y="38.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>10 µm</tspan></text><rect x="520.0" y="54.0" width="224.0" height="188.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="632.0" y="88.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>1 µm er en tusindedel</tspan></text><text x="632.0" y="110.0" font-size="14" text-anchor="middle" fill="#556766"><tspan>af en millimeter.</tspan></text><text x="632.0" y="132.0" font-size="14" text-anchor="middle" fill="#556766"></text><text x="632.0" y="160.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Jo mindre en partikel er,</tspan></text><text x="632.0" y="182.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>jo længere når den</tspan></text><text x="632.0" y="204.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ned i lungerne.</tspan></text>
</svg>
