<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 176" width="760" height="176" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="100 gram krudt bliver efter reaktionsskemaet til 48,8 gram carbondioxid og 10,4 gram nitrogen, som er gasser, og 40,8 gram kaliumsulfid, som er et fast stof og bliver til røg">
<title>100 gram krudt bliver efter reaktionsskemaet til 48,8 gram carbondioxid og 10,4 gram nitrogen, som er gasser, og 40,8 gram kaliumsulfid, som er et fast stof og bliver til røg</title>
<text x="60.0" y="30.0" font-size="15.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>100 g krudt bliver til</tspan></text><rect x="60.0" y="84.0" width="312.3" height="50.0" rx="0" fill="#cfe3f5"/><text x="216.2" y="114.5" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>48,8 g CO</tspan><tspan dy="3.30" font-size="10.2">2</tspan></text><text x="216.2" y="156.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>carbondioxid</tspan></text><rect x="372.3" y="84.0" width="66.6" height="50.0" rx="0" fill="#a9c4f5"/><text x="405.6" y="114.5" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10,4 g N</tspan><tspan dy="2.86" font-size="8.8">2</tspan></text><text x="405.6" y="156.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>nitrogen</tspan></text><rect x="438.9" y="84.0" width="261.1" height="50.0" rx="0" fill="#9a8f84"/><text x="569.4" y="114.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>40,8 g K</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">S</tspan></text><text x="569.4" y="156.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>kaliumsulfid</tspan></text><rect x="60.0" y="84.0" width="640.0" height="50.0" rx="6" fill="none" stroke="#556766" stroke-width="1.6"/><line x1="438.9" y1="76.0" x2="438.9" y2="142.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><text x="249.4" y="54.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>gasser</tspan></text><text x="249.4" y="72.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>skubber raketten og giver knaldet</tspan></text><text x="569.4" y="54.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>fast stof</tspan></text><text x="569.4" y="72.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>bittesmå korn, der bliver til røg</tspan></text>
</svg>
