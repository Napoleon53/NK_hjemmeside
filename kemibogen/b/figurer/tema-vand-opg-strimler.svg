<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Farveskalaen til en teststrimmel for nitrat med felterne 0, 10, 25, 50, 100, 250 og 500 milligram pr. liter. Jo mere nitrat, jo mørkere rødviolet er feltet. Grænsen for drikkevand er 50. Under skalaen er der tre strimler: prøve A med et næsten hvidt felt, prøve B med et lyst rødt felt og prøve C med et mørkt rødviolet felt">
