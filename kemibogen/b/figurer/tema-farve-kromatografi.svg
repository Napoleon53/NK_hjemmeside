<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En chromatografiplade med fire prøver. Den brune farve fra en chokoladepastil har delt sig i en gul, en rød og en blå plet. Ved siden af er der sat et gult, et rødt og et blåt farvestof, og de tre pletter er nået lige så langt som pletterne fra den brune farve">
<title>En chromatografiplade med fire prøver. Den brune farve fra en chokoladepastil har delt sig i en gul, en rød og en blå plet. Ved siden af er der sat et gult, et rødt og et blåt farvestof, og de tre pletter er nået lige så langt som pletterne fra den brune farve</title>
<rect x="120.0" y="24.0" width="250.0" height="216.0" rx="3" fill="#f3f4ef" stroke="#556766" stroke-width="1.6"/><line x1="126.0" y1="212.0" x2="364.0" y2="212.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round"/><line x1="126.0" y1="40.0" x2="364.0" y2="40.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="151.2" y1="208.0" x2="151.2" y2="216.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round"/><text x="151.2" y="258.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>brun</tspan></text><line x1="213.8" y1="208.0" x2="213.8" y2="216.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round"/><text x="213.8" y="258.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>gul</tspan></text><line x1="276.2" y1="208.0" x2="276.2" y2="216.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round"/><text x="276.2" y="258.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>rød</tspan></text><line x1="338.8" y1="208.0" x2="338.8" y2="216.0" stroke="#556766" stroke-width="1.2" stroke-linecap="round"/><text x="338.8" y="258.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>blå</tspan></text><ellipse cx="151.2" cy="170.7" rx="9" ry="7.2" fill="#e9c21a" opacity="0.9"/><ellipse cx="151.2" cy="126.0" rx="9" ry="7.2" fill="#d9372c" opacity="0.9"/><ellipse cx="151.2" cy="77.8" rx="9" ry="7.2" fill="#2f7fd6" opacity="0.9"/><ellipse cx="213.8" cy="170.7" rx="9" ry="7.2" fill="#e9c21a" opacity="0.9"/><ellipse cx="276.2" cy="126.0" rx="9" ry="7.2" fill="#d9372c" opacity="0.9"/><ellipse cx="338.8" cy="77.8" rx="9" ry="7.2" fill="#2f7fd6" opacity="0.9"/><circle cx="151.2" cy="212.0" r="5.5" fill="#6b4a2b"/><text x="382.0" y="45.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>væskefront</tspan></text><text x="382.0" y="217.0" font-size="12.5" text-anchor="start" fill="#556766"><tspan>startlinje</tspan></text><text x="84.0" y="264.0" font-size="13" text-anchor="end" fill="#556766"><tspan>prøve:</tspan></text><rect x="480.0" y="44.0" width="262.0" height="168.0" rx="10" fill="#f4f8f7" stroke="#dfe9e8" stroke-width="1.2"/><text x="496.0" y="72.0" font-size="13.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>Den brune farve giver tre pletter:</tspan></text><text x="496.0" y="92.0" font-size="13.5" text-anchor="start" fill="#14201f" font-weight="700"><tspan>en gul, en rød og en blå.</tspan></text><text x="496.0" y="112.0" font-size="13.5" text-anchor="start" fill="#556766"></text><text x="496.0" y="132.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Hver plet er nået lige så langt</tspan></text><text x="496.0" y="152.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>som det rene farvestof ved siden af.</tspan></text><text x="496.0" y="172.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>Den brune farve er altså en blanding</tspan></text><text x="496.0" y="192.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>af de tre farvestoffer.</tspan></text>
</svg>
