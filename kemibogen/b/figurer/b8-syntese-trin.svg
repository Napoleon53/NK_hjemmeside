<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 124" width="756" height="124" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fem trin i fremstillingen af et lægemiddel: syntese, udfældning, filtrering, omkrystallisering og kontrol af renheden">
<title>Fem trin i fremstillingen af et lægemiddel: syntese, udfældning, filtrering, omkrystallisering og kontrol af renheden</title>
<g class="peg-vejledning" data-tekst="Peg på et trin, og se, hvad der sker i det."/><g class="peg" data-titel="Trin 1: Syntese" data-tekst="Salicylsyre, ethansyreanhydrid og katalysator varmes i et vandbad. Anhydridet er i overskud, så salicylsyren er den begrænsende faktor."><rect x="8.0" y="10.0" width="136.0" height="104.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.3"/><text x="76.0" y="34.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>1 Syntese</tspan></text><text x="76.0" y="58.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>salicylsyre og</tspan></text><text x="76.0" y="75.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>ethansyreanhydrid</tspan></text><text x="76.0" y="92.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>varmes med syre</tspan></text></g><line x1="146.0" y1="62.0" x2="150.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="157.0,62.0 150.0,65.5 150.0,58.5" fill="#556766"/><g class="peg" data-titel="Trin 2: Udfældning" data-tekst="Blandingen køles i isbad, og der tilsættes koldt vand. Acetylsalicylsyre er tungtopløselig i koldt vand og falder ud som hvide krystaller."><rect x="159.0" y="10.0" width="136.0" height="104.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.3"/><text x="227.0" y="34.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2 Udfældning</tspan></text><text x="227.0" y="58.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>blandingen køles,</tspan></text><text x="227.0" y="75.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>og krystallerne</tspan></text><text x="227.0" y="92.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>falder ud</tspan></text></g><line x1="297.0" y1="62.0" x2="301.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="308.0,62.0 301.0,65.5 301.0,58.5" fill="#556766"/><g class="peg" data-titel="Trin 3: Filtrering" data-tekst="Krystallerne suges fri for væske på en tragt. Det, man har nu, kaldes råproduktet. Det indeholder stadig lidt salicylsyre."><rect x="310.0" y="10.0" width="136.0" height="104.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.3"/><text x="378.0" y="34.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3 Filtrering</tspan></text><text x="378.0" y="58.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>krystallerne suges</tspan></text><text x="378.0" y="75.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>fri for væske:</tspan></text><text x="378.0" y="92.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>råprodukt</tspan></text></g><line x1="448.0" y1="62.0" x2="452.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="459.0,62.0 452.0,65.5 452.0,58.5" fill="#556766"/><g class="peg" data-titel="Trin 4: Omkrystallisering" data-tekst="Råproduktet renses. En omkrystallisering udnytter, at de fleste faste stoffer er mere opløselige i et varmt opløsningsmiddel end i et koldt."><rect x="461.0" y="10.0" width="136.0" height="104.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.3"/><text x="529.0" y="34.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>4 Omkrystallisering</tspan></text><text x="529.0" y="58.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>råproduktet opløses</tspan></text><text x="529.0" y="75.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>varmt og krystalliserer</tspan></text><text x="529.0" y="92.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>igen ved afkøling</tspan></text></g><line x1="599.0" y1="62.0" x2="603.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="610.0,62.0 603.0,65.5 603.0,58.5" fill="#556766"/><g class="peg" data-titel="Trin 5: Kontrol" data-tekst="Det rensede produkt undersøges med smeltepunkt, test med jern(III)ioner og TLC."><rect x="612.0" y="10.0" width="136.0" height="104.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.3"/><text x="680.0" y="34.0" font-size="13.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>5 Kontrol</tspan></text><text x="680.0" y="58.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>smeltepunkt,</tspan></text><text x="680.0" y="75.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>test med jern(III)</tspan></text><text x="680.0" y="92.0" font-size="12" text-anchor="middle" fill="#14201f"><tspan>og TLC</tspan></text></g>
</svg>
