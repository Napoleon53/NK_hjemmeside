<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En chromatografiplade med seks prøver. Prøve 1 har givet en gul og en blå plet. Prøve 2 har givet en rød og en blå plet. Prøve 3 har givet en gul og en rød plet. De tre sidste prøver er et gult, et rødt og et blåt farvestof, som hver har givet én plet. Den gule plet er nået kortest, og den blå er nået længst">
