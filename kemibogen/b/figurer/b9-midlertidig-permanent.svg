<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" width="760" height="322" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To bægerglas med vand. Før vandet koges, indeholder det fire calciumioner, seks hydrogencarbonationer og en sulfation. Efter kogning ligger tre af calciumionerne på bunden som fast calciumcarbonat, kedelsten, og carbondioxid er boblet væk. Én calciumion og sulfationen er stadig opløst. Under glassene viser søjler, at den midlertidige hårdhed er forsvundet, mens den permanente hårdhed er der endnu">
<title>To bægerglas med vand. Før vandet koges, indeholder det fire calciumioner, seks hydrogencarbonationer og en sulfation. Efter kogning ligger tre af calciumionerne på bunden som fast calciumcarbonat, kedelsten, og carbondioxid er boblet væk. Én calciumion og sulfationen er stadig opløst. Under glassene viser søjler, at den midlertidige hårdhed er forsvundet, mens den permanente hårdhed er der endnu</title>
