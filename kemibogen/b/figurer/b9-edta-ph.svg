<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 294" width="760" height="294" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="EDTA og en calciumion ved to pH-værdier. I sur opløsning sidder der hydroner på EDTA: de fire carboxylgrupper er COOH, og de to nitrogenatomer har en ekstra hydron. EDTA kan ikke binde calciumionen. Ved pH 10 er hydronerne afgivet, og alle seks tænder binder calciumionen">
<title>EDTA og en calciumion ved to pH-værdier. I sur opløsning sidder der hydroner på EDTA: de fire carboxylgrupper er COOH, og de to nitrogenatomer har en ekstra hydron. EDTA kan ikke binde calciumionen. Ved pH 10 er hydronerne afgivet, og alle seks tænder binder calciumionen</title>
