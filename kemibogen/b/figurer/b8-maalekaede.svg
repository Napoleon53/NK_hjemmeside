<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 142" width="756" height="142" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ét molekyle acetylsalicylsyre bliver ved forsæbning til én salicylation, som med jern(III)ioner danner ét lilla kompleks. Forholdet er 1 til 1 til 1">
<title>Ét molekyle acetylsalicylsyre bliver ved forsæbning til én salicylation, som med jern(III)ioner danner ét lilla kompleks. Forholdet er 1 til 1 til 1</title>
<rect x="30.0" y="30.0" width="176.0" height="66.0" rx="10" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.6"/><text x="118.0" y="60.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>1 acetylsalicylsyre</tspan></text><text x="118.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>farveløs</tspan></text><rect x="290.0" y="30.0" width="176.0" height="66.0" rx="10" fill="#ffffff" stroke="#c3d6d4" stroke-width="1.6"/><text x="378.0" y="60.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>1 salicylat</tspan></text><text x="378.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>farveløs</tspan></text><rect x="550.0" y="30.0" width="176.0" height="66.0" rx="10" fill="#e3d7f3" stroke="#6b3fa0" stroke-width="1.6"/><text x="638.0" y="60.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>1 kompleks med jern(III)</tspan></text><text x="638.0" y="80.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>lilla</tspan></text><line x1="212.0" y1="63.0" x2="274.0" y2="63.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="284.0,63.0 274.0,68.0 274.0,58.0" fill="#14201f"/><text x="248.0" y="52.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>NaOH</tspan></text><text x="248.0" y="82.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>forsæbning</tspan></text><line x1="472.0" y1="63.0" x2="534.0" y2="63.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="544.0,63.0 534.0,68.0 534.0,58.0" fill="#14201f"/><text x="508.0" y="52.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>Fe</tspan><tspan dy="-4.75" font-size="8.5">3+</tspan></text><text x="508.0" y="82.0" font-size="12" text-anchor="middle" fill="#556766"><tspan>farvereaktion</tspan></text><text x="378.0" y="126.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>Forholdet er 1 : 1 : 1. Koncentrationen af det lilla stof er derfor lig med koncentrationen af acetylsalicylsyre.</tspan></text>
</svg>
