<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="To røde blodlegemer. I det første har hæmoglobinet en jern(II)ion, som binder oxygen. Nitrit oxiderer jern(II) til jern(III). I det andet har hæmoglobinet en jern(III)ion, som ikke kan binde oxygen">
<title>To røde blodlegemer. I det første har hæmoglobinet en jern(II)ion, som binder oxygen. Nitrit oxiderer jern(II) til jern(III). I det andet har hæmoglobinet en jern(III)ion, som ikke kan binde oxygen</title>
