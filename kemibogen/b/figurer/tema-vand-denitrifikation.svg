<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="780" height="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Denitrifikation med oxidationstal over atomerne. Carbon i det organiske stof stiger fra 0 til plus 4 i carbondioxid, og nitrogen falder fra plus 5 i nitrat til 0 i nitrogen. Den samlede stigning er 4 gange 5, og det samlede fald er 5 gange 4">
