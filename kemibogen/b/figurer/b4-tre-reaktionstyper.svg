<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 258" width="756" height="258" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="De tre reaktionstyper substitution, addition og elimination vist med et eksempel hver">
<title>De tre reaktionstyper substitution, addition og elimination vist med et eksempel hver</title>
<rect x="6.0" y="8.0" width="744.0" height="74.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="36.0" font-size="17" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Substitution</tspan></text><text x="24.0" y="56.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>Et atom bliver skiftet ud.</tspan></text><text x="24.0" y="73.0" font-size="13" text-anchor="start" fill="#556766"><tspan>To stoffer bliver til to nye.</tspan></text><g transform="translate(337.6 45.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">4</tspan></text></g><g transform="translate(377.1 45.0)"><text x="0.0" y="8.4" font-size="24" text-anchor="middle" fill="#556766"><tspan>+</tspan></text></g><g transform="translate(414.7 45.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan><tspan dy="4.62" font-size="14.3">2</tspan></text></g><g transform="translate(445.5 45.0)"><line x1="0.0" y1="0.0" x2="52.0" y2="0.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="62.0,0.0 52.0,5.0 52.0,-5.0" fill="#14201f"/><text x="31.0" y="-12.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>lys</tspan></text></g><g transform="translate(553.9 45.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan><tspan dy="-4.62">Cl</tspan></text></g><g transform="translate(607.1 45.0)"><text x="0.0" y="8.4" font-size="24" text-anchor="middle" fill="#556766"><tspan>+</tspan></text></g><g transform="translate(648.5 45.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>HCl</tspan></text></g><rect x="6.0" y="92.0" width="744.0" height="74.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="120.0" font-size="17" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Addition</tspan></text><text x="24.0" y="140.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>Dobbeltbindingen forsvinder.</tspan></text><text x="24.0" y="157.0" font-size="13" text-anchor="start" fill="#556766"><tspan>To stoffer bliver til ét.</tspan></text><g transform="translate(342.5 129.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">=CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan></text></g><g transform="translate(407.5 129.0)"><text x="0.0" y="8.4" font-size="24" text-anchor="middle" fill="#556766"><tspan>+</tspan></text></g><g transform="translate(445.2 129.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Cl</tspan><tspan dy="4.62" font-size="14.3">2</tspan></text></g><g transform="translate(476.0 129.0)"><line x1="0.0" y1="0.0" x2="52.0" y2="0.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="62.0,0.0 52.0,5.0 52.0,-5.0" fill="#14201f"/></g><g transform="translate(620.9 129.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">Cl−CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">Cl</tspan></text></g><rect x="6.0" y="176.0" width="744.0" height="74.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.2"/><text x="24.0" y="204.0" font-size="17" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>Elimination</tspan></text><text x="24.0" y="224.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>Der dannes en dobbeltbinding.</tspan></text><text x="24.0" y="241.0" font-size="13" text-anchor="start" fill="#556766"><tspan>Ét stof bliver til to.</tspan></text><g transform="translate(357.2 213.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">3</tspan><tspan dy="-4.62">−CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">OH</tspan></text></g><g transform="translate(436.3 213.0)"><line x1="0.0" y1="0.0" x2="52.0" y2="0.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="62.0,0.0 52.0,5.0 52.0,-5.0" fill="#14201f"/><text x="31.0" y="-12.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>katalysator</tspan></text><text x="31.0" y="23.0" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>varme</tspan></text></g><g transform="translate(564.6 213.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">=CH</tspan><tspan dy="4.62" font-size="14.3">2</tspan></text></g><g transform="translate(629.7 213.0)"><text x="0.0" y="8.4" font-size="24" text-anchor="middle" fill="#556766"><tspan>+</tspan></text></g><g transform="translate(669.1 213.0)"><text x="0.0" y="7.3" font-size="21" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="4.62" font-size="14.3">2</tspan><tspan dy="-4.62">O</tspan></text></g>
</svg>
