<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 166" width="756" height="166" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En bjælke viser, at der blev tilsat 2,00 mmol brom fra start. Under den er bjælken delt i to: den brom, olien forbrugte, som er ukendt, og et overskud på 0,90 mmol">
<title>En bjælke viser, at der blev tilsat 2,00 mmol brom fra start. Under den er bjælken delt i to: den brom, olien forbrugte, som er ukendt, og et overskud på 0,90 mmol</title>
<text x="378.0" y="28.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>brom tilsat fra start</tspan></text><rect x="60.0" y="44.0" width="636.0" height="34.0" rx="6" fill="#f3d7a6" stroke="#b45309" stroke-width="1.6"/><text x="378.0" y="66.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, start) = 2,00 mmol</tspan></text><rect x="60.0" y="94.0" width="345.8" height="34.0" rx="6" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="234.9" y="116.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, forbrugt) = ?</tspan></text><rect x="413.8" y="94.0" width="282.2" height="34.0" rx="6" fill="#fdecc8" stroke="#b45309" stroke-width="1.6"/><text x="554.9" y="116.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, overskud) = 0,90 mmol</tspan></text><text x="234.9" y="150.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>adderede til dobbeltbindingerne i olien</tspan></text><text x="554.9" y="150.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>var tilbage ved titreringen</tspan></text>
</svg>
