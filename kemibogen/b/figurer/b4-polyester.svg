<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 198" width="756" height="198" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En syre med to carboxylgrupper og en alkohol med to hydroxygrupper kondenserer til en lang kæde, en polyester">
