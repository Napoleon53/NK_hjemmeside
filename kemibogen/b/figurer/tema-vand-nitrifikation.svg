<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 150" width="780" height="150" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Første trin i nitrifikationen med oxidationstal over atomerne. Nitrogen stiger fra minus 3 i ammonium til plus 3 i nitrit, og oxygen falder fra 0 til minus 2 i både nitrit og vand. Den samlede stigning er 6 gange 2, og det samlede fald er 2 gange 6">
<title>Første trin i nitrifikationen med oxidationstal over atomerne. Nitrogen stiger fra minus 3 i ammonium til plus 3 i nitrit, og oxygen falder fra 0 til minus 2 i både nitrit og vand. Den samlede stigning er 6 gange 2, og det samlede fald er 2 gange 6</title>
