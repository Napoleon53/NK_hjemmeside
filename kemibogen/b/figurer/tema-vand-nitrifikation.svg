" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>O</tspan></text><text x="618.5" y="40.0" font-size="15" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>−II</tspan></text><text x="649.0" y="77.0" font-size="22" text-anchor="middle" fill="#556766"><tspan>+</tspan></text><text x="669.0" y="78.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>4</tspan></text><text x="693.0" y="78.0" font-size="26" text-anchor="start" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="-9.88" font-size="17.7">+</tspan></text><line x1="366.0" y1="69.0" x2="402.0" y2="69.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><polygon points="414.0,69.0 402.0,75.0 402.0,63.0" fill="#14201f"/><text x="370.0" y="110.0" font-size="15" text-anchor="end" fill="#b45309" font-weight="700"><tspan>N</tspan></text><line x1="382.0" y1="112.0" x2="382.0" y2="103.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="382.0,95.0 386.0,103.0 378.0,103.0" fill="#b45309"/><text x="392.0" y="110.0" font-size="16" text-anchor="start" fill="#b45309" font-weight="700"><tspan>6</tspan></text><text x="408.0" y="110.0" font-size="15" text-anchor="start" fill="#b45309"><tspan>· 2 = 12</tspan></text><text x="370.0" y="136.0" font-size="15" text-anchor="end" fill="#1d4ed8" font-weight="700"><tspan>O</tspan></text><line x1="382.0" y1="121.0" x2="382.0" y2="130.0" stroke="#1d4ed8" stroke-width="2.4" stroke-linecap="round"/><polygon points="382.0,138.0 378.0,130.0 386.0,130.0" fill="#1d4ed8"/><text x="392.0" y="136.0" font-size="16" text-anchor="start" fill="#1d4ed8" font-weight="700"><tspan>2</tspan></text><text x="408.0" y="136.0" font-size="15" text-anchor="start" fill="#1d4ed8"><tspan>· 6 = 12</tspan></text>
