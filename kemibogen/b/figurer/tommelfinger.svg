<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 284" width="720" height="284" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Søjler for reaktionshastigheden ved 20, 30, 40 og 50 grader. Hastigheden er 1, 2, 4 og 8 gange så stor, altså en fordobling for hver 10 grader">
<title>Søjler for reaktionshastigheden ved 20, 30, 40 og 50 grader. Hastigheden er 1, 2, 4 og 8 gange så stor, altså en fordobling for hver 10 grader</title>
<line x1="120.0" y1="230.0" x2="620.0" y2="230.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><g class="peg-vejledning" data-tekst="Peg på en søjle, og se, hvordan tommelfingerreglen er brugt."/><g class="peg" data-titel="Reaktionshastigheden ved 20 °C" data-tekst="Hastigheden ved 20 °C er udgangspunktet. De andre søjler viser, hvor mange gange hurtigere reaktionen går ved en højere temperatur."><rect class="peg-maal" x="104.0" y="44.0" width="92.0" height="216.0" fill="none"/><rect x="124.0" y="208.0" width="52.0" height="22.0" rx="4" fill="#0f766e"/><text x="150.0" y="198.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>1 gang</tspan></text><text x="150.0" y="252.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>20 °C</tspan></text></g><g class="peg" data-titel="Reaktionshastigheden ved 30 °C" data-tekst="Fra 20 °C til 30 °C er der 1 trin på 10 °C. Hastigheden bliver ganget med 2 for hvert trin, så den er 2 gange så stor som ved 20 °C."><rect class="peg-maal" x="234.0" y="44.0" width="92.0" height="216.0" fill="none"/><rect x="254.0" y="186.0" width="52.0" height="44.0" rx="4" fill="#0f766e"/><text x="280.0" y="176.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>2 gange</tspan></text><text x="280.0" y="252.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>30 °C</tspan></text></g><text x="215.0" y="274.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>+10 °C</tspan></text><g class="peg" data-titel="Reaktionshastigheden ved 40 °C" data-tekst="Fra 20 °C til 40 °C er der 2 trin på 10 °C. Hastigheden bliver ganget med 2 for hvert trin, så den er 2 · 2 = 4 gange så stor som ved 20 °C."><rect class="peg-maal" x="364.0" y="44.0" width="92.0" height="216.0" fill="none"/><rect x="384.0" y="142.0" width="52.0" height="88.0" rx="4" fill="#0f766e"/><text x="410.0" y="132.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>4 gange</tspan></text><text x="410.0" y="252.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>40 °C</tspan></text></g><text x="345.0" y="274.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>+10 °C</tspan></text><g class="peg" data-titel="Reaktionshastigheden ved 50 °C" data-tekst="Fra 20 °C til 50 °C er der 3 trin på 10 °C. Hastigheden bliver ganget med 2 for hvert trin, så den er 2 · 2 · 2 = 8 gange så stor som ved 20 °C."><rect class="peg-maal" x="494.0" y="44.0" width="92.0" height="216.0" fill="none"/><rect x="514.0" y="54.0" width="52.0" height="176.0" rx="4" fill="#0f766e"/><text x="540.0" y="44.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>8 gange</tspan></text><text x="540.0" y="252.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>50 °C</tspan></text></g><text x="475.0" y="274.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>+10 °C</tspan></text><text x="106.0" y="34.0" font-size="13.5" text-anchor="start" fill="#556766"><tspan>reaktionshastighed i forhold til 20 °C</tspan></text>
</svg>
