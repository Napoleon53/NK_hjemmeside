<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 206" width="750" height="206" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Lambert-Beers lov: A er lig med epsilon gange l gange c. A er absorbansen, epsilon er ekstinktionskoefficienten, l er lysvejen, og c er koncentrationen">
