<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 276" width="756" height="276" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Fem zigzagformler. A dufter af ananas: fire carbonatomer, hvor det sidste har et dobbeltbundet O og et O, der er bundet videre til to carbonatomer. B lugter af harsk smør: fire carbonatomer, hvor det sidste har et dobbeltbundet O og en OH-gruppe. C lugter af gammel fisk: et N med tre methylgrupper. D lugter af blåskimmelost: syv carbonatomer med et dobbeltbundet O på det andet. E lugter af nyslået græs: seks carbonatomer med et dobbeltbundet O for enden">
