<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tværsnit af en mark. Gødning lægges på jorden, og planterne optager nitrat og ammonium. Den nitrat, planterne ikke optager, siver med regnvandet ned til grundvandet eller løber gennem dræn ud i åen. Et vandværk pumper grundvandet op som drikkevand">
<title>Tværsnit af en mark. Gødning lægges på jorden, og planterne optager nitrat og ammonium. Den nitrat, planterne ikke optager, siver med regnvandet ned til grundvandet eller løber gennem dræn ud i åen. Et vandværk pumper grundvandet op som drikkevand</title>
