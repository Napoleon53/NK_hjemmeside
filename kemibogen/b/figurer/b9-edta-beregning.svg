<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" width="760" height="172" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningen ved en titrering med EDTA som en kæde. Det aflæste volumen af EDTA ganges med koncentrationen og giver stofmængden af EDTA. Forholdet er 1 til 1, så stofmængden af calciumioner og magnesiumioner i prøven er den samme. Den divideres med prøvens volumen og giver den samlede koncentration af calciumioner og magnesiumioner. Til sidst divideres med 1,78 gange 10 i minus fjerde molær for at få hårdheden i hårdhedsgrader">
<title>Beregningen ved en titrering med EDTA som en kæde. Det aflæste volumen af EDTA ganges med koncentrationen og giver stofmængden af EDTA. Forholdet er 1 til 1, så stofmængden af calciumioner og magnesiumioner i prøven er den samme. Den divideres med prøvens volumen og giver den samlede koncentration af calciumioner og magnesiumioner. Til sidst divideres med 1,78 gange 10 i minus fjerde molær for at få hårdheden i hårdhedsgrader</title>
<rect x="8.0" y="44.0" width="152.0" height="62.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.4"/><text x="84.0" y="66.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>det, du måler</tspan></text><text x="84.0" y="90.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>V(EDTA)</tspan></text><line x1="166.0" y1="75.0" x2="189.3" y2="75.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="199.3,75.0 189.3,80.0 189.3,70.0" fill="#14201f"/><text x="182.7" y="32.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>· c(EDTA)</tspan></text><rect x="205.3" y="44.0" width="152.0" height="62.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.4"/><text x="281.3" y="66.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>stofmængde af EDTA</tspan></text><text x="281.3" y="90.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(EDTA)</tspan></text><line x1="363.3" y1="75.0" x2="386.7" y2="75.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="396.7,75.0 386.7,80.0 386.7,70.0" fill="#14201f"/><text x="380.0" y="32.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>· 1</tspan></text><text x="380.0" y="124.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>forholdet 1 : 1</tspan></text><rect x="402.7" y="44.0" width="152.0" height="62.0" rx="10" fill="#f4f8f7" stroke="#c3d6d4" stroke-width="1.4"/><text x="478.7" y="66.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>stofmængde i prøven</tspan></text><text x="478.7" y="90.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(Ca</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">) + n(Mg</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">)</tspan></text><line x1="560.7" y1="75.0" x2="584.0" y2="75.0" stroke="#14201f" stroke-width="2.2" stroke-linecap="round"/><polygon points="594.0,75.0 584.0,80.0 584.0,70.0" fill="#14201f"/><text x="577.3" y="32.0" font-size="14" text-anchor="middle" fill="#c2410c" font-weight="700"><tspan>÷ V(prøve)</tspan></text><rect x="600.0" y="44.0" width="152.0" height="62.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="2"/><text x="676.0" y="66.0" font-size="11.5" text-anchor="middle" fill="#556766"><tspan>det, du søger</tspan></text><text x="676.0" y="90.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[Ca</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">] + [Mg</tspan><tspan dy="-5.70" font-size="10.2">2+</tspan><tspan dy="5.70">]</tspan></text><text x="380.0" y="156.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>hårdhed i °dH = ([Ca</tspan><tspan dy="-4.75" font-size="8.5">2+</tspan><tspan dy="4.75">] + [Mg</tspan><tspan dy="-4.75" font-size="8.5">2+</tspan><tspan dy="4.75">]) ÷ 1,78 · 10</tspan><tspan dy="-4.75" font-size="8.5">−4</tspan><tspan dy="4.75"> M</tspan></text>
</svg>
