<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 154" width="756" height="154" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En londonbinding opstår i tre trin: jævn fordeling af elektroner, en midlertidig dipol og tiltrækning mellem to molekyler">
<title>En londonbinding opstår i tre trin: jævn fordeling af elektroner, en midlertidig dipol og tiltrækning mellem to molekyler</title>
<text x="110.0" y="22.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>1</tspan></text><ellipse cx="110" cy="62" rx="62" ry="30" fill="#dfe6ee" stroke="#7b8a8d" stroke-width="1.6"/><text x="110.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>Elektronerne er</tspan></text><text x="110.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>jævnt fordelt.</tspan></text><line x1="190.0" y1="62.0" x2="217.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="226.0,62.0 217.0,66.5 217.0,57.5" fill="#556766"/><text x="310.0" y="22.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>2</tspan></text><defs><linearGradient id="b4sky2" x1="0" x2="1" y1="0" y2="0"><stop offset="0.1" stop-color="#cfe0fb"/><stop offset="0.9" stop-color="#fbd3ca"/></linearGradient></defs><ellipse cx="310" cy="62" rx="62" ry="30" fill="url(#b4sky2)" stroke="#7b8a8d" stroke-width="1.6"/><text x="270.0" y="67.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>δ−</tspan></text><text x="350.0" y="67.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>δ+</tspan></text><text x="310.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>Et øjeblik er de flest i den ene</tspan></text><text x="310.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>ende: en midlertidig dipol.</tspan></text><line x1="392.0" y1="62.0" x2="419.0" y2="62.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><polygon points="428.0,62.0 419.0,66.5 419.0,57.5" fill="#556766"/><text x="586.0" y="22.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>3</tspan></text><defs><linearGradient id="b4sky3" x1="0" x2="1" y1="0" y2="0"><stop offset="0.1" stop-color="#cfe0fb"/><stop offset="0.9" stop-color="#fbd3ca"/></linearGradient></defs><ellipse cx="510" cy="62" rx="62" ry="30" fill="url(#b4sky3)" stroke="#7b8a8d" stroke-width="1.6"/><text x="470.0" y="67.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>δ−</tspan></text><text x="550.0" y="67.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>δ+</tspan></text><defs><linearGradient id="b4sky4" x1="0" x2="1" y1="0" y2="0"><stop offset="0.1" stop-color="#cfe0fb"/><stop offset="0.9" stop-color="#fbd3ca"/></linearGradient></defs><ellipse cx="662" cy="62" rx="62" ry="30" fill="url(#b4sky4)" stroke="#7b8a8d" stroke-width="1.6"/><text x="622.0" y="67.0" font-size="14" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>δ−</tspan></text><text x="702.0" y="67.0" font-size="14" text-anchor="middle" fill="#c0392b" font-weight="700"><tspan>δ+</tspan></text><line x1="576.0" y1="62.0" x2="596.0" y2="62.0" stroke="#556766" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 6"/><text x="586.0" y="122.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>Dipolen skubber til elektronerne i nabomolekylet.</tspan></text><text x="586.0" y="140.0" font-size="13.5" text-anchor="middle" fill="#14201f"><tspan>De to molekyler tiltrækker hinanden.</tspan></text>
</svg>
