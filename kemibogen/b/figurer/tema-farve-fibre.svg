<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Tre slags fibre. På bomuld sidder farvestoffet fast med hydrogenbindinger mellem OH-grupper. På uld og silke sidder et negativt ladet farvestof fast på positivt ladede grupper med ionbindinger. På polyester sidder et upolært farvestof fast med londonbindinger">
<title>Tre slags fibre. På bomuld sidder farvestoffet fast med hydrogenbindinger mellem OH-grupper. På uld og silke sidder et negativt ladet farvestof fast på positivt ladede grupper med ionbindinger. På polyester sidder et upolært farvestof fast med londonbindinger</title>
