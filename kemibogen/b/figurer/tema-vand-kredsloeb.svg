<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Nitrogenkredsløbet. Nitrogen fra luften bliver ved fiksering til ammonium. Ved nitrifikation bliver ammonium først til nitrit og så til nitrat. Planter optager nitrat og ammonium, og når planter og dyr nedbrydes, dannes der ammonium igen. Ved denitrifikation bliver nitrat til nitrogen, som går tilbage til luften. En del af nitraten vaskes ud til grundvand og åer">
<title>Nitrogenkredsløbet. Nitrogen fra luften bliver ved fiksering til ammonium. Ved nitrifikation bliver ammonium først til nitrit og så til nitrat. Planter optager nitrat og ammonium, og når planter og dyr nedbrydes, dannes der ammonium igen. Ved denitrifikation bliver nitrat til nitrogen, som går tilbage til luften. En del af nitraten vaskes ud til grundvand og åer</title>
<rect x="305.0" y="21.0" width="150.0" height="62.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="380.0" y="47.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>N</tspan><tspan dy="3.41" font-size="10.5">2</tspan><tspan dy="-3.41"> i luften</tspan></text><text x="380.0" y="68.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>oxidationstal 0</tspan></text><rect x="62.0" y="219.0" width="132.0" height="62.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="128.0" y="245.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>NH</tspan><tspan dy="3.41" font-size="10.5">4</tspan><tspan dy="-9.30" font-size="10.5">+</tspan></text><text x="128.0" y="266.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>ammonium, −III</tspan></text><rect x="314.0" y="299.0" width="132.0" height="62.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="380.0" y="325.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>NO</tspan><tspan dy="3.41" font-size="10.5">2</tspan><tspan dy="-9.30" font-size="10.5">−</tspan></text><text x="380.0" y="346.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>nitrit, +III</tspan></text><rect x="566.0" y="219.0" width="132.0" height="62.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="632.0" y="245.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>NO</tspan><tspan dy="3.41" font-size="10.5">3</tspan><tspan dy="-9.30" font-size="10.5">−</tspan></text><text x="632.0" y="266.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>nitrat, +V</tspan></text><rect x="296.0" y="151.0" width="168.0" height="58.0" rx="10" fill="#eef7ee" stroke="#2f7a45" stroke-width="1.6"/><text x="380.0" y="175.0" font-size="15.5" text-anchor="middle" fill="#2f7a45" font-weight="700"><tspan>planter og dyr</tspan></text><text x="380.0" y="196.0" font-size="13.5" text-anchor="middle" fill="#556766"><tspan>nitrogen i proteiner</tspan></text><g class="peg" data-titel="Fiksering" data-tekst="Ved fiksering bliver nitrogen fra luften til ammoniak og ammonium. Det gør bakterier på rødderne af kløver og ærter, og det gør fabrikker, der fremstiller kunstgødning. Oxidationstallet falder fra 0 til −III, så nitrogen bliver reduceret." data-noegle="fiksering"><path d="M 300.0,64.0 Q 196.7,110.7 154.1,204.9" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/><polygon points="150.0,214.0 149.6,202.8 158.7,206.9" fill="#1d4ed8"/><text x="116.0" y="118.0" font-size="14" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>fiksering</tspan></text><text x="116.0" y="136.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>bakterier og fabrikker</tspan></text></g><g class="peg" data-titel="Nitrifikation, første trin" data-tekst="Bakterier i jorden oxiderer ammonium til nitrit. De skal bruge oxygen. Oxidationstallet stiger fra −III til +III." data-noegle="nitri1"><path d="M 170.0,286.0 Q 232.6,331.7 300.0,335.4" fill="none" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="310.0,336.0 299.7,340.4 300.3,330.5" fill="#b45309"/><text x="214.0" y="338.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>nitrifikation</tspan></text></g><g class="peg" data-titel="Nitrifikation, andet trin" data-tekst="Andre bakterier oxiderer nitrit videre til nitrat. Oxidationstallet stiger fra +III til +V. Det andet trin går hurtigt, så der er normalt kun lidt nitrit i jord og vand." data-noegle="nitri2"><path d="M 450.0,336.0 Q 527.4,331.7 581.9,291.9" fill="none" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="590.0,286.0 584.9,295.9 579.0,287.9" fill="#b45309"/><text x="546.0" y="338.0" font-size="14" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>nitrifikation</tspan></text><text x="380.0" y="384.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>kræver oxygen</tspan></text></g><g class="peg" data-titel="Optagelse" data-tekst="Planterne optager nitrat og ammonium og bygger nitrogenet ind i proteiner. Dyr og mennesker får nitrogenet ved at spise planterne." data-noegle="optag"><line x1="566.0" y1="236.0" x2="480.2" y2="202.0" stroke="#2f7a45" stroke-width="2.6" stroke-linecap="round"/><polygon points="470.0,198.0 482.3,196.9 478.2,207.2" fill="#2f7a45"/><text x="536.0" y="196.0" font-size="13.5" text-anchor="middle" fill="#2f7a45" font-weight="700"><tspan>optagelse</tspan></text></g><g class="peg" data-titel="Nedbrydning" data-tekst="Når planter og dyr dør, og når dyr afleverer gødning, nedbryder bakterier proteinerne. Nitrogenet bliver til ammonium igen." data-noegle="nedbryd"><line x1="292.0" y1="198.0" x2="206.2" y2="232.0" stroke="#8c6f47" stroke-width="2.6" stroke-linecap="round"/><polygon points="196.0,236.0 204.2,226.8 208.3,237.1" fill="#8c6f47"/><text x="226.0" y="196.0" font-size="13.5" text-anchor="middle" fill="#5b4526" font-weight="700"><tspan>nedbrydning</tspan></text></g><g class="peg" data-titel="Denitrifikation" data-tekst="Hvor der ikke er oxygen, bruger nogle bakterier nitrat i stedet. De reducerer nitrat til nitrogen, som forsvinder op i luften. Oxidationstallet falder fra +V til 0." data-noegle="denitri"><path d="M 616.0,214.0 Q 567.1,109.5 471.1,66.1" fill="none" stroke="#1d4ed8" stroke-width="2.6" stroke-linecap="round"/><polygon points="462.0,62.0 473.2,61.6 469.1,70.7" fill="#1d4ed8"/><text x="644.0" y="118.0" font-size="14" text-anchor="middle" fill="#12307f" font-weight="700"><tspan>denitrifikation</tspan></text><text x="644.0" y="136.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>uden oxygen</tspan></text></g><g class="peg" data-titel="Udvaskning" data-tekst="Nitrat, som planterne ikke optager, følger vandet ned til grundvandet og ud i åer, søer og fjorde." data-noegle="udvask"><line x1="690.0" y1="284.0" x2="718.0" y2="310.4" stroke="#2a6fa3" stroke-width="2.6" stroke-linecap="round"/><polygon points="726.0,318.0 714.2,314.4 721.8,306.4" fill="#2a6fa3"/><text x="680.0" y="344.0" font-size="13.5" text-anchor="middle" fill="#1f5f8f" font-weight="700"><tspan>udvaskning</tspan></text><text x="680.0" y="362.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>til grundvand og åer</tspan></text></g><g class="peg-vejledning" data-tekst="Peg på en pil, og se, hvad der sker med nitrogenet."/>
</svg>
