<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Farvning med indigo i fire trin. Først ligger indigo som blåt pulver på bunden af et glas vand. Så bliver det reduceret til en gul opløsning. Tøjet dyppes i den gule opløsning. Når tøjet kommer op i luften, oxiderer oxygen farvestoffet, og tøjet bliver blåt">
<title>Farvning med indigo i fire trin. Først ligger indigo som blåt pulver på bunden af et glas vand. Så bliver det reduceret til en gul opløsning. Tøjet dyppes i den gule opløsning. Når tøjet kommer op i luften, oxiderer oxygen farvestoffet, og tøjet bliver blåt</title>
