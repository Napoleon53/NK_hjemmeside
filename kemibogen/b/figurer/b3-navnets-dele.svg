<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 190" width="756" height="190" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Navnet 4-methylpentan-2-ol delt i forled, stamme og endelse ved siden af stoffets zigzagformel">
<title>Navnet 4-methylpentan-2-ol delt i forled, stamme og endelse ved siden af stoffets zigzagformel</title>
<text x="40.0" y="58.0" font-size="34" text-anchor="start" font-weight="700"><tspan fill="#b45309"><tspan>4-methyl​</tspan></tspan><tspan fill="#14201f"><tspan>pentan​</tspan></tspan><tspan fill="#0f766e"><tspan>-2-ol​</tspan></tspan></text><line x1="44.0" y1="70.0" x2="175.0" y2="70.0" stroke="#b45309" stroke-width="3" stroke-linecap="round"/><line x1="183.0" y1="70.0" x2="288.0" y2="70.0" stroke="#14201f" stroke-width="3" stroke-linecap="round"/><line x1="296.0" y1="70.0" x2="366.0" y2="70.0" stroke="#0f766e" stroke-width="3" stroke-linecap="round"/><line x1="109.5" y1="72.0" x2="86.0" y2="104.0" stroke="#b45309" stroke-width="1.6" stroke-linecap="round"/><text x="86.0" y="124.0" font-size="15.5" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>forled</tspan></text><text x="86.0" y="144.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>sidegruppens navn</tspan></text><text x="86.0" y="161.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>og dens plads i kæden</tspan></text><line x1="235.5" y1="72.0" x2="232.0" y2="104.0" stroke="#14201f" stroke-width="1.6" stroke-linecap="round"/><text x="232.0" y="124.0" font-size="15.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>stamme</tspan></text><text x="232.0" y="144.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>den længste kæde</tspan></text><text x="232.0" y="161.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>har 5 carbonatomer</tspan></text><line x1="331.0" y1="72.0" x2="382.0" y2="104.0" stroke="#0f766e" stroke-width="1.6" stroke-linecap="round"/><text x="382.0" y="124.0" font-size="15.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>endelse</tspan></text><text x="382.0" y="144.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>stofklassen (alkohol)</tspan></text><text x="382.0" y="161.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>og gruppens plads</tspan></text><g transform="translate(527.3 106.5)"><line x1="0.0" y1="0.0" x2="36.4" y2="-21.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><line x1="36.4" y1="-21.0" x2="72.7" y2="0.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><line x1="72.7" y1="0.0" x2="109.1" y2="-21.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><line x1="109.1" y1="-21.0" x2="145.5" y2="0.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><line x1="36.4" y1="-21.0" x2="36.4" y2="-54.6" stroke="#0f766e" stroke-width="2.6" stroke-linecap="round"/><text x="29.7" y="-58.2" font-size="18" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>OH</tspan></text><line x1="109.1" y1="-21.0" x2="109.1" y2="-63.0" stroke="#14201f" stroke-width="2.6" stroke-linecap="round"/><text x="-0.0" y="-8.5" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>1</tspan></text><text x="36.4" y="-3.5" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>2</tspan></text><text x="72.7" y="-8.5" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>3</tspan></text><text x="109.1" y="-3.5" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>4</tspan></text><text x="145.5" y="-8.5" font-size="12.5" text-anchor="middle" fill="#556766" font-weight="700"><tspan>5</tspan></text></g><text x="600.0" y="160.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>kæden nummereres, så OH-gruppen</tspan></text><text x="600.0" y="177.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>får det laveste tal</tspan></text>
</svg>
