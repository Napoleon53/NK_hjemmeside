<title>Partiklerne i kolben under en titrering med EDTA i tre trin. Før titreringen er calciumioner og magnesiumioner frie, og indikatoren holder på en magnesiumion og er vinrød. Undervejs binder EDTA først de frie ioner. Ved ækvivalenspunktet er alle calciumioner og magnesiumioner bundet til EDTA, også den magnesiumion, indikatoren holdt på. Indikatoren er fri og blå</title>
