<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 132" width="756" height="132" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Hydrogencarbonat kan afgive en hydron og blive til carbonat, eller optage en hydron og blive til kulsyre">
<title>Hydrogencarbonat kan afgive en hydron og blive til carbonat, eller optage en hydron og blive til kulsyre</title>
<rect x="298.0" y="36.0" width="160.0" height="60.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="378.0" y="74.0" font-size="24" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>HCO</tspan><tspan dy="5.28" font-size="16.3">3</tspan><tspan dy="-14.40" font-size="16.3">−</tspan></text><text x="378.0" y="120.0" font-size="13" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>hydrogencarbonat er en amfolyt</tspan></text><line x1="290.0" y1="66.0" x2="206.0" y2="66.0" stroke="#a93226" stroke-width="2.2" stroke-linecap="round"/><polygon points="196.0,66.0 206.0,61.0 206.0,71.0" fill="#a93226"/><text x="243.0" y="54.0" font-size="13" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>afgiver H</tspan><tspan dy="-4.94" font-size="8.8">+</tspan></text><text x="243.0" y="88.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>virker som syre</tspan></text><text x="120.0" y="74.0" font-size="23" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>CO</tspan><tspan dy="5.06" font-size="15.6">3</tspan><tspan dy="-13.80" font-size="15.6">2−</tspan></text><text x="120.0" y="100.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>carbonat</tspan></text><line x1="466.0" y1="66.0" x2="550.0" y2="66.0" stroke="#1d4ed8" stroke-width="2.2" stroke-linecap="round"/><polygon points="560.0,66.0 550.0,71.0 550.0,61.0" fill="#1d4ed8"/><text x="513.0" y="54.0" font-size="13" text-anchor="middle" fill="#1d4ed8" font-weight="700"><tspan>optager H</tspan><tspan dy="-4.94" font-size="8.8">+</tspan></text><text x="513.0" y="88.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>virker som base</tspan></text><text x="636.0" y="74.0" font-size="23" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>H</tspan><tspan dy="5.06" font-size="15.6">2</tspan><tspan dy="-5.06">CO</tspan><tspan dy="5.06" font-size="15.6">3</tspan></text><text x="636.0" y="100.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>kulsyre</tspan></text>
