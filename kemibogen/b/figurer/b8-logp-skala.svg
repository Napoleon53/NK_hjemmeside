<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 236" width="756" height="236" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skala med log P fra minus 4 til 6. Glucose og adrenalin har negative værdier og er hydrofile, paracetamol, acetylsalicylsyre og salicylsyre ligger mellem 0 og 3, og ibuprofen og vitamin A har høje værdier og er hydrofobe">
<title>Skala med log P fra minus 4 til 6. Glucose og adrenalin har negative værdier og er hydrofile, paracetamol, acetylsalicylsyre og salicylsyre ligger mellem 0 og 3, og ibuprofen og vitamin A har høje værdier og er hydrofobe</title>
<defs><linearGradient id="logpgrad" x1="0" x2="1"><stop offset="0" stop-color="#9ccdf0"/><stop offset="1" stop-color="#f4d774"/></linearGradient></defs><g class="peg-vejledning" data-tekst="Peg på et stof, og se, hvad log *P* fortæller om det."/><g class="peg" data-titel="Her optages et stof bedst" data-tekst="Som tommelfingerregel bliver et stof bedst optaget, når log *P* ligger omkring 2 til 3."><rect x="444.0" y="88.0" width="64.0" height="58.0" rx="8" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.2"/><text x="476.0" y="184.0" font-size="11.5" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>optages bedst</tspan></text><rect class="peg-maal" x="430.0" y="170.0" width="92.0" height="20.0" fill="none"/></g><rect x="60.0" y="119.0" width="640.0" height="18.0" rx="9" fill="url(#logpgrad)"/><line x1="60.0" y1="137.0" x2="60.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="60.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>−4</tspan></text><line x1="124.0" y1="137.0" x2="124.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="124.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>−3</tspan></text><line x1="188.0" y1="137.0" x2="188.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="188.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>−2</tspan></text><line x1="252.0" y1="137.0" x2="252.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="252.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>−1</tspan></text><line x1="316.0" y1="137.0" x2="316.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="316.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>0</tspan></text><line x1="380.0" y1="137.0" x2="380.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="380.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>1</tspan></text><line x1="444.0" y1="137.0" x2="444.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="444.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>2</tspan></text><line x1="508.0" y1="137.0" x2="508.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="508.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>3</tspan></text><line x1="572.0" y1="137.0" x2="572.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="572.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>4</tspan></text><line x1="636.0" y1="137.0" x2="636.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="636.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>5</tspan></text><line x1="700.0" y1="137.0" x2="700.0" y2="145.0" stroke="#556766" stroke-width="1.4" stroke-linecap="round"/><text x="700.0" y="162.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>6</tspan></text><text x="712.0" y="162.0" font-size="13" text-anchor="start" fill="#14201f" font-weight="700"><tspan>log P</tspan></text><g class="peg" data-titel="Glucose" data-tekst="Glucose har log *P* omkring −3. Koncentrationen er altså omkring 1000 gange større i vand end i octanol. Glucose er hydrofil."><line x1="124.0" y1="119.0" x2="124.0" y2="75.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="124.0" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="124.0" y="68.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>glucose</tspan></text><rect class="peg-maal" x="94.5" y="54.0" width="59.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Adrenalin" data-tekst="Adrenalin har log *P* omkring −1,4. Værdien er negativ, så koncentrationen er størst i vand. Adrenalin er hydrofilt."><line x1="226.4" y1="119.0" x2="226.4" y2="103.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="226.4" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="226.4" y="96.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>adrenalin</tspan></text><rect class="peg-maal" x="189.9" y="82.0" width="73.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Paracetamol" data-tekst="Paracetamol har log *P* omkring 0,5. Værdien er lidt over 0, så koncentrationen er lidt større i octanol end i vand."><line x1="348.0" y1="119.0" x2="348.0" y2="103.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="348.0" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="348.0" y="96.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>paracetamol</tspan></text><rect class="peg-maal" x="304.5" y="82.0" width="87.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Acetylsalicylsyre" data-tekst="Acetylsalicylsyre har log *P* omkring 1,2. Koncentrationen er altså mere end 10 gange større i octanol end i vand."><line x1="392.8" y1="119.0" x2="392.8" y2="45.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="392.8" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="392.8" y="38.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>acetylsalicylsyre</tspan></text><rect class="peg-maal" x="328.3" y="24.0" width="129.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Salicylsyre" data-tekst="Salicylsyre har log *P* omkring 2,3. Det ligger i området omkring 2 til 3, hvor et stof bliver bedst optaget."><line x1="463.2" y1="119.0" x2="463.2" y2="75.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="463.2" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="463.2" y="68.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>salicylsyre</tspan></text><rect class="peg-maal" x="419.7" y="54.0" width="87.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Ibuprofen" data-tekst="Ibuprofen har log *P* omkring 4. Koncentrationen er altså omkring 10 000 gange større i octanol end i vand."><line x1="572.0" y1="119.0" x2="572.0" y2="103.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="572.0" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="572.0" y="96.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ibuprofen</tspan></text><rect class="peg-maal" x="535.5" y="82.0" width="73.0" height="20.0" fill="none"/></g><g class="peg" data-titel="Vitamin A" data-tekst="Vitamin A har log *P* omkring 5,7. Stoffet er hydrofobt og findes mest i fedt."><line x1="680.8" y1="119.0" x2="680.8" y2="75.0" stroke="#14201f" stroke-width="1.4" stroke-linecap="round"/><circle cx="680.8" cy="128.0" r="4.5" fill="#ffffff" stroke="#14201f" stroke-width="1.6"/><text x="680.8" y="68.0" font-size="12.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>vitamin A</tspan></text><rect class="peg-maal" x="644.3" y="54.0" width="73.0" height="20.0" fill="none"/></g><text x="60.0" y="224.0" font-size="12.5" text-anchor="start" fill="#2a6fa3" font-weight="700"><tspan>hydrofil: mest i vand</tspan></text><text x="700.0" y="224.0" font-size="12.5" text-anchor="end" fill="#8a6d1a" font-weight="700"><tspan>hydrofob: mest i fedt</tspan></text>
</svg>
