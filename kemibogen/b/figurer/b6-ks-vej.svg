<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 160" width="792" height="160" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Beregningsvejen fra en målt pH til syrestyrkekonstanten: først oxoniumkoncentrationen, så basens koncentration, så syrens koncentration og til sidst Ks">
<title>Beregningsvejen fra en målt pH til syrestyrkekonstanten: først oxoniumkoncentrationen, så basens koncentration, så syrens koncentration og til sidst Ks</title>
<g class="peg-vejledning" data-tekst="Peg på et trin eller en kasse, og se, hvad der regnes ud."/><g class="peg" data-titel="Målt pH" data-tekst="Man fremstiller en opløsning af syren med en kendt formel koncentration og måler pH." data-noegle="kasse0"><rect x="14.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="76.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>målt pH</tspan></text><text x="76.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>fra pH-metret</tspan></text></g><g class="peg" data-titel="[H_{3}O^{+}]: koncentrationen af oxoniumioner" data-tekst="Den aktuelle koncentration af oxoniumioner i opløsningen." data-noegle="kasse1"><rect x="174.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="236.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[H</tspan><tspan dy="3.19" font-size="9.9">3</tspan><tspan dy="-3.19">O</tspan><tspan dy="-5.51" font-size="9.9">+</tspan><tspan dy="5.51">]</tspan></text></g><g class="peg" data-titel="[B]: koncentrationen af den korresponderende base" data-tekst="Hver gang der dannes en oxoniumion, dannes der også en base. De to koncentrationer er derfor lige store." data-noegle="kasse2"><rect x="334.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="396.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[B]</tspan></text><text x="396.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>lige så stor</tspan></text></g><g class="peg" data-titel="[S]: koncentrationen af syren" data-tekst="Den del af syren, der ikke har afgivet en hydron." data-noegle="kasse3"><rect x="494.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="556.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>[S]</tspan></text></g><g class="peg" data-titel="Syrestyrkekonstanten *K*_{s}" data-tekst="*K*_{s} = [B] · [H_{3}O^{+}] / [S]. Jo større *K*_{s} er, jo stærkere er syren." data-noegle="kasse4"><rect x="654.0" y="76.0" width="124.0" height="48.0" rx="10" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="716.0" y="106.0" font-size="14.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>K</tspan><tspan dy="3.19" font-size="9.9">s</tspan></text><text x="716.0" y="146.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>syrens styrke</tspan></text></g><g class="peg" data-titel="Trin 1: [H_{3}O^{+}] = 10^{−pH} M" data-tekst="Koncentrationen af oxoniumioner findes ud fra den målte pH." data-noegle="trin1" data-med="kasse0 kasse1"><line x1="140.0" y1="100.0" x2="162.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="172.0,100.0 162.0,105.0 162.0,95.0" fill="#b45309"/><circle cx="156.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="156.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>1</tspan></text><text x="156.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>10</tspan><tspan dy="-4.94" font-size="8.8">−pH</tspan><tspan dy="4.94"> M</tspan></text><rect class="peg-maal" x="94.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 2: forholdet 1 : 1" data-tekst="Hver gang der dannes en oxoniumion, dannes der også en base. Derfor er [B] = [H_{3}O^{+}]." data-noegle="trin2" data-med="kasse1 kasse2"><line x1="300.0" y1="100.0" x2="322.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="332.0,100.0 322.0,105.0 322.0,95.0" fill="#b45309"/><circle cx="316.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="316.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>2</tspan></text><text x="316.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>forholdet 1 : 1</tspan></text><rect class="peg-maal" x="254.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 3: [S] = *c*_{s} − [B]" data-tekst="Den syre, der er blevet til base, trækkes fra den formelle koncentration. Resten er stadig syre." data-noegle="trin3" data-med="kasse2 kasse3"><line x1="460.0" y1="100.0" x2="482.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="492.0,100.0 482.0,105.0 482.0,95.0" fill="#b45309"/><circle cx="476.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="476.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>3</tspan></text><text x="476.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>c</tspan><tspan dy="2.86" font-size="8.8">s</tspan><tspan dy="-2.86"> − [B]</tspan></text><rect class="peg-maal" x="414.0" y="18.0" width="124.0" height="54.0" fill="none"/></g><g class="peg" data-titel="Trin 4: sæt ind i brøken" data-tekst="De tre koncentrationer sættes ind i *K*_{s} = [B] · [H_{3}O^{+}] / [S]." data-noegle="trin4" data-med="kasse3 kasse4"><line x1="620.0" y1="100.0" x2="642.0" y2="100.0" stroke="#b45309" stroke-width="2.4" stroke-linecap="round"/><polygon points="652.0,100.0 642.0,105.0 642.0,95.0" fill="#b45309"/><circle cx="636.0" cy="56.0" r="13.0" fill="#0f766e"/><text x="636.0" y="61.5" font-size="15" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>4</tspan></text><text x="636.0" y="34.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>sæt ind i brøken</tspan></text><rect class="peg-maal" x="574.0" y="18.0" width="124.0" height="54.0" fill="none"/></g>
</svg>
