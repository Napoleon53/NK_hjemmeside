 x2="127.0" y2="153.0" stroke="#e5533d" stroke-width="1.8" stroke-linecap="round"/><polygon points="127.0,146.0 130.5,153.0 123.5,153.0" fill="#e5533d"/><circle cx="134.0" cy="96.0" r="2.6" fill="#1d4ed8"/><circle cx="134.0" cy="122.0" r="2.6" fill="#1d4ed8"/><line x1="150.0" y1="112.0" x2="216.0" y2="108.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="150.0" cy="112.0" r="2.4" fill="#556766"/><text x="222.0" y="110.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>svaler: dampene bliver kølet</tspan></text><text x="222.0" y="127.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>og løber tilbage i kolben</tspan></text><line x1="160.0" y1="276.0" x2="216.0" y2="264.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="160.0" cy="276.0" r="2.4" fill="#556766"/><text x="222.0" y="264.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>syre, alkohol</tspan></text><text x="222.0" y="281.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>og lidt svovlsyre</tspan></text><line x1="148.0" y1="296.0" x2="216.0" y2="304.0" stroke="#556766" stroke-width="1.1" stroke-linecap="round"/><circle cx="148.0" cy="296.0" r="2.4" fill="#556766"/><text x="222.0" y="308.0" font-size="13" text-anchor="start" fill="#14201f"><tspan>pimpsten</tspan></text><text x="130.0" y="344.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>varmekappe</tspan></text><line x1="398.0" y1="14.0" x2="398.0" y2="346.0" stroke="#c3d6d4" stroke-width="1.4" stroke-linecap="round"/><text x="420.0" y="26.0" font-size="15.5" text-anchor="start" fill="#0f766e" font-weight="700"><tspan>2. Vask i skilletragt</tspan></text><clipPath id="b4tragt"><path d="M 460,70 C 424,70 430,150 478,226 L 484,250 L 496,250 L 502,226 C 550,150 556,70 520,70 Z"/></clipPath><rect x="420" y="96" width="140" height="56" fill="#f9e9b8" clip-path="url(#b4tragt)"/><rect x="420" y="152" width="140" height="100" fill="#cfe3f5" clip-path="url(#b4tragt)"/>