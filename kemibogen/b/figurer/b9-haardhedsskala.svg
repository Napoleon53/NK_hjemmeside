<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En skala over vands hårdhed i tyske hårdhedsgrader. 0 til 4 er meget blødt, 4 til 8 blødt, 8 til 12 middelhårdt, 12 til 18 temmelig hårdt, 18 til 24 hårdt, 24 til 30 meget hårdt og over 30 særdeles hårdt. Under skalaen står den samlede koncentration af calciumioner og magnesiumioner i millimolær: 4 grader svarer til 0,71, 8 til 1,42, 12 til 2,14, 18 til 3,20, 24 til 4,27 og 30 til 5,34">
<title>En skala over vands hårdhed i tyske hårdhedsgrader. 0 til 4 er meget blødt, 4 til 8 blødt, 8 til 12 middelhårdt, 12 til 18 temmelig hårdt, 18 til 24 hårdt, 24 til 30 meget hårdt og over 30 særdeles hårdt. Under skalaen står den samlede koncentration af calciumioner og magnesiumioner i millimolær: 4 grader svarer til 0,71, 8 til 1,42, 12 til 2,14, 18 til 3,20, 24 til 4,27 og 30 til 5,34</title>
<g class="peg-vejledning" data-tekst="Peg på et trin på skalaen, og se grænserne i °dH og i mM."/><g class="peg" data-titel="Meget blødt vand" data-tekst="Vand med en hårdhed fra 0 til 4 °dH kaldes meget blødt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 0,00 til 0,71 mM."><rect x="40.0" y="62.0" width="75.6" height="44.0" rx="0" fill="#e3f2fb" stroke="#ffffff" stroke-width="1.5"/><text x="77.8" y="89.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>meget blødt</tspan></text></g><g class="peg" data-titel="Blødt vand" data-tekst="Vand med en hårdhed fra 4 til 8 °dH kaldes blødt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 0,71 til 1,42 mM."><rect x="115.6" y="62.0" width="75.6" height="44.0" rx="0" fill="#c5e2f5" stroke="#ffffff" stroke-width="1.5"/><text x="153.3" y="89.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>blødt</tspan></text></g><g class="peg" data-titel="Middelhårdt vand" data-tekst="Vand med en hårdhed fra 8 til 12 °dH kaldes middelhårdt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 1,42 til 2,14 mM."><rect x="191.1" y="62.0" width="75.6" height="44.0" rx="0" fill="#a3cfee" stroke="#ffffff" stroke-width="1.5"/><text x="228.9" y="89.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>middelhårdt</tspan></text></g><g class="peg" data-titel="Temmelig hårdt vand" data-tekst="Vand med en hårdhed fra 12 til 18 °dH kaldes temmelig hårdt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 2,14 til 3,20 mM."><rect x="266.7" y="62.0" width="113.3" height="44.0" rx="0" fill="#7db5e0" stroke="#ffffff" stroke-width="1.5"/><text x="323.3" y="89.0" font-size="11.5" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>temmelig hårdt</tspan></text></g><g class="peg" data-titel="Hårdt vand" data-tekst="Vand med en hårdhed fra 18 til 24 °dH kaldes hårdt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 3,20 til 4,27 mM."><rect x="380.0" y="62.0" width="113.3" height="44.0" rx="0" fill="#5796cb" stroke="#ffffff" stroke-width="1.5"/><text x="436.7" y="89.0" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>hårdt</tspan></text></g><g class="peg" data-titel="Meget hårdt vand" data-tekst="Vand med en hårdhed fra 24 til 30 °dH kaldes meget hårdt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] ligger fra 4,27 til 5,34 mM."><rect x="493.3" y="62.0" width="113.3" height="44.0" rx="0" fill="#3a78b3" stroke="#ffffff" stroke-width="1.5"/><text x="550.0" y="89.0" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>meget hårdt</tspan></text></g><g class="peg" data-titel="Særdeles hårdt vand" data-tekst="Vand med en hårdhed over 30 °dH kaldes særdeles hårdt. Det svarer til, at [Ca^{2+}] + [Mg^{2+}] er over 5,34 mM."><rect x="606.7" y="62.0" width="113.3" height="44.0" rx="0" fill="#255c93" stroke="#ffffff" stroke-width="1.5"/><text x="663.3" y="89.0" font-size="11.5" text-anchor="middle" fill="#ffffff" font-weight="700"><tspan>særdeles hårdt</tspan></text></g><line x1="40.0" y1="54.0" x2="40.0" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="40.0" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>0</tspan></text><line x1="40.0" y1="106.0" x2="40.0" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="40.0" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>0,00</tspan></text><line x1="115.6" y1="54.0" x2="115.6" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="115.6" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>4</tspan></text><line x1="115.6" y1="106.0" x2="115.6" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="115.6" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>0,71</tspan></text><line x1="191.1" y1="54.0" x2="191.1" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="191.1" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>8</tspan></text><line x1="191.1" y1="106.0" x2="191.1" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="191.1" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>1,42</tspan></text><line x1="266.7" y1="54.0" x2="266.7" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="266.7" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>12</tspan></text><line x1="266.7" y1="106.0" x2="266.7" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="266.7" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>2,14</tspan></text><line x1="380.0" y1="54.0" x2="380.0" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="380.0" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>18</tspan></text><line x1="380.0" y1="106.0" x2="380.0" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="380.0" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>3,20</tspan></text><line x1="493.3" y1="54.0" x2="493.3" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="493.3" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>24</tspan></text><line x1="493.3" y1="106.0" x2="493.3" y2="114.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="493.3" y="130.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>4,27</tspan></text><line x1="606.7" y1="54.0" x2="606.7" y2="62.0" stroke="#556766" stroke-width="1.3" stroke-linecap="round"/><text x="606.7" y="48.0" font-size="13" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>30</tspan></text><line x1="606.7" y1="106.0" x2="606.7" y2="114.0" stroke="#556766" s