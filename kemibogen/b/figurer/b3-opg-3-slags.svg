<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 372" width="756" height="372" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Seks par af zigzagformler. A: en lige kæde på fem carbonatomer og en kæde på fire med en methylgruppe. B: to kæder på fem carbonatomer med et dobbeltbundet O på det andet og på det tredje carbonatom. C: fire carbonatomer med et dobbeltbundet O for enden og fire carbonatomer med et dobbeltbundet O på det andet. D: fire carbonatomer med OH for enden og tre carbonatomer med en methylgruppe på det midterste og OH for enden. E: fire carbonatomer, hvor det sidste har et dobbeltbundet O og en OH-gruppe, og tre carbonatomer, hvor det sidste har et dobbeltbundet O og et O, der er bundet videre til et carbonatom. F: to kæder på fem carbonatomer med en tripelbinding ved det første og ved det andet carbonatom">
