<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 180" width="740" height="180" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="En tallinje for reaktionsbrøken Y. Er Y mindre end K, går reaktionen mod højre. Er Y lig med K, er der ligevægt. Er Y større end K, går reaktionen mod venstre">
<title>En tallinje for reaktionsbrøken Y. Er Y mindre end K, går reaktionen mod højre. Er Y lig med K, er der ligevægt. Er Y større end K, går reaktionen mod venstre</title>
<line x1="60.0" y1="90.0" x2="680.0" y2="90.0" stroke="#556766" stroke-width="2" stroke-linecap="round"/><circle cx="370.0" cy="90.0" r="9.0" fill="#0f766e" stroke="#ffffff" stroke-width="2.4"/><text x="370.0" y="68.0" font-size="17" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Y = K</tspan></text><text x="370.0" y="124.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>ligevægt</tspan></text><text x="370.0" y="144.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>der sker ingen ændring</tspan></text><text x="170.0" y="68.0" font-size="17" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>Y &lt; K</tspan></text><line x1="100.0" y1="112.0" x2="238.0" y2="112.0" stroke="#b45309" stroke-width="2.6" stroke-linecap="round"/><polygon points="250.0,112.0 238.0,118.0 238.0,106.0" fill="#b45309"/><text x="170.0" y="138.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>for lidt produkt</tspan></text><text x="170.0" y="158.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>reaktionen går mod højre</tspan></text><text x="570.0" y="68.0" font-size="17" text-anchor="middle" fill="#6d4bb5" font-weight="700"><tspan>Y &gt; K</tspan></text><line x1="640.0" y1="112.0" x2="502.0" y2="112.0" stroke="#6d4bb5" stroke-width="2.6" stroke-linecap="round"/><polygon points="490.0,112.0 502.0,106.0 502.0,118.0" fill="#6d4bb5"/><text x="570.0" y="138.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>for meget produkt</tspan></text><text x="570.0" y="158.0" font-size="13" text-anchor="middle" fill="#556766"><tspan>reaktionen går mod venstre</tspan></text><text x="60.0" y="34.0" font-size="13" text-anchor="start" fill="#556766"><tspan>lille Y</tspan></text><text x="680.0" y="34.0" font-size="13" text-anchor="end" fill="#556766"><tspan>stor Y</tspan></text>
</svg>
