<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 238" width="756" height="238" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Ni zigzagformler mærket A til I. A: fire carbonatomer med en dobbeltbinding ved det første. B: fire carbonatomer med OH på det andet. C: fem carbonatomer med et dobbeltbundet O på det andet. D: fire carbonatomer, hvor det sidste har et dobbeltbundet O og et H. E: tre carbonatomer, hvor det sidste har et dobbeltbundet O og OH. F: et carbonatom, et carbonatom med et dobbeltbundet O, et O og tre carbonatomer. G: NH med to carbonatomer på hver side. H: fire carbonatomer med en methylgruppe på det andet. I: fire carbonatomer med en tripelbinding ved det første">
