<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 314" width="760" height="314" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Skitse af phenolphthalein. I sur og neutral opløsning har carbonatomet i midten fire enkeltbindinger, så de tre ringe er tre små systemer, og stoffet er farveløst. I basisk opløsning har carbonatomet en dobbeltbinding til den ene ring, så to af ringene bliver ét stort system, og stoffet er lyserødt">
<title>Skitse af phenolphthalein. I sur og neutral opløsning har carbonatomet i midten fire enkeltbindinger, så de tre ringe er tre små systemer, og stoffet er farveløst. I basisk opløsning har carbonatomet en dobbeltbinding til den ene ring, så to af ringene bliver ét stort system, og stoffet er lyserødt</title>
