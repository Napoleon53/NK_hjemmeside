<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 204" width="756" height="204" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Den stofmængde brom, der blev tilsat fra start, er summen af den brom, fedtstoffet forbrugte, og den brom, der var i overskud">
<title>Den stofmængde brom, der blev tilsat fra start, er summen af den brom, fedtstoffet forbrugte, og den brom, der var i overskud</title>
<text x="378.0" y="28.0" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>stofmængden af brom, der blev tilsat fra start</tspan></text><rect x="60.0" y="44.0" width="636.0" height="34.0" rx="6" fill="#f3d7a6" stroke="#b45309" stroke-width="1.6"/><text x="378.0" y="66.0" font-size="15" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, start)</tspan></text><rect x="60.0" y="94.0" width="390.3" height="34.0" rx="6" fill="#e3f2f0" stroke="#0f766e" stroke-width="1.6"/><text x="257.2" y="116.0" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, forbrugt)</tspan></text><rect x="458.3" y="94.0" width="237.7" height="34.0" rx="6" fill="#fdecc8" stroke="#b45309" stroke-width="1.6"/><text x="577.2" y="116.0" font-size="15" text-anchor="middle" fill="#b45309" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.30" font-size="10.2">2</tspan><tspan dy="-3.30">, overskud)</tspan></text><text x="257.2" y="150.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>adderede til dobbeltbindingerne</tspan></text><text x="577.2" y="150.0" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>blev tilbage og måles ved titrering</tspan></text><text x="378.0" y="188.0" font-size="16" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>n(Br</tspan><tspan dy="3.52" font-size="10.9">2</tspan><tspan dy="-3.52">, forbrugt) = n(Br</tspan><tspan dy="3.52" font-size="10.9">2</tspan><tspan dy="-3.52">, start) − n(Br</tspan><tspan dy="3.52" font-size="10.9">2</tspan><tspan dy="-3.52">, overskud)</tspan></text>
</svg>
