<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations Samling</title>
    <style>
        /* Nulstil alt så vi bruger hele skærmen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Hoved-containeren */
        .main-layout {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Sidebaren styling */
        .sidebar {
            width: 210px; /* Standard bredde */
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #1a252f;
            overflow-x: hidden;
            overflow-y: auto;
            transition: width 0.3s ease; /* Glidende animation */
            position: relative;
        }

        /* Når menuen er klappet sammen */
        .sidebar.collapsed {
            width: 60px; /* Smal stribe til knappen */
        }

        /* Headeren styling */
        .sidebar-header {
            height: 60px;
            padding: 0 15px;
            background-color: #1a252f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        /* Centrer knappen når menuen er lukket */
        .sidebar.collapsed .sidebar-header {
            justify-content: center;
            padding: 0;
        }

        /* Titlen i headeren */
        .header-text {
            font-weight: bold;
            font-size: 0.85em;
            letter-spacing: 0.5px;
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Skjul teksten når menuen er lukket */
        .sidebar.collapsed .header-text {
            display: none;
        }

        /* Toggle knappen (☰) */
        .toggle-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-btn:hover {
            color: #3498db;
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .header-actions .toggle-btn {
            font-size: 18px;
            padding: 3px;
        }

        .sidebar.collapsed .link-btn {
            display: none;
        }

        /* Knapperne */
        .tab-btn {
            background: transparent;
            border: none;
            border-left: 3px solid transparent;
            color: #bdc3c7;
            padding: 12px 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid #34495e;
            font-size: 14px;
            white-space: nowrap;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn:hover {
            background-color: #34495e;
            color: white;
            border-left-color: #3498db;
        }

        .tab-btn.active {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            border-left: 3px solid #2980b9;
        }

        /* Tal-badge */
        .btn-num {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background-color: #34495e;
            color: #ecf0f1;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-btn.active .btn-num {
            background-color: #2980b9;
            color: white;
        }

        .btn-text {
            transition: opacity 0.15s ease;
        }

        /* Kollaps: vis kun tal-badge, centrer det */
        .sidebar.collapsed .tab-btn {
            justify-content: center;
            padding: 12px 0;
        }

        .sidebar.collapsed .btn-text {
            opacity: 0;
            width: 0;
            overflow: hidden;
        }

        /* Content area */
        .content-area {
            flex-grow: 1;
            height: 100%;
            background-color: white;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Startside: boks-oversigt over kapitlets animationer */
        .startside {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 30px 40px;
            background-color: #eef1f4;
        }

        .startside-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .startside-box {
            background-color: white;
            border: 1px solid #dfe6ec;
            border-radius: 10px;
            padding: 16px;
            min-height: 150px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .startside-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            border-color: #3498db;
        }

        .startside-box-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .startside-box-title {
            font-weight: bold;
            font-size: 13px;
            color: #2c3e50;
        }

        .startside-box-desc {
            font-size: 13px;
            color: #5a6c7a;
            line-height: 1.4;
        }

        .header-text.clickable {
            cursor: pointer;
        }

        .header-text.clickable:hover {
            text-decoration: underline;
        }


        /* Fuld skaerm: sidepanelet skjules helt, naar en superanimation vises,
           og knappen i oeverste venstre hjoerne gendanner det */
        .sidebar.skjult { width: 0; border-right: none; }
        .gendan-knap {
            position: absolute;
            left: 10px;
            top: 10px;
            z-index: 5;
            display: none;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background-color: rgba(26, 37, 47, 0.75);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }
        .gendan-knap:hover { background-color: rgba(52, 152, 219, 0.9); }
        .content-area.fuld .gendan-knap { display: flex; }

    </style>
</head>
<body>

    <div class="main-layout">
        <div class="sidebar" id="sidebarMenu">
            <div class="sidebar-header">
                <span class="header-text clickable" onclick="visStartside()" title="Tilbage til oversigt">Organisk C</span>
                <div class="header-actions">
                    <button class="toggle-btn link-btn" onclick="kopierLink(this)" title="Kopiér link til denne animation">🔗</button>
                    <button class="toggle-btn" onclick="toggleMenu()" title="Vis/Skjul menu">☰</button>
                    <button class="toggle-btn fuld-btn" onclick="fuldSkaerm(true)" title="Fuld skærm: skjul panelet">⛶</button>
                </div>
            </div>

            <button class="tab-btn" data-emne="c6.1" data-beskrivelse="Se hvordan alkaners kogepunkt stiger, jo længere kulstofkæden er." onclick="visAnimation(this, 'c6.1_alkaner_kogepunkt.html')" title="Alkaners fysiske egenskaber"><span class="btn-num">1</span><span class="btn-text">Alkaners kogepunkt</span></button>
            <button class="tab-btn" data-emne="c6.2" data-beskrivelse="Tegn zigzagformler for alkaner, og sæt de rigtige atomer på de rigtige pladser." onclick="visAnimation(this, 'c6.2_zigzag.html')" title="Tegn zigzagformler og sæt atomer på"><span class="btn-num">2</span><span class="btn-text">Zigzagformler</span></button>
            <button class="tab-btn" data-emne="c6.3" data-beskrivelse="Byg alkaner og genkend deres isomerer — molekyler med samme formel, men forskellig struktur." onclick="visAnimation(this, 'c6.3_isomeri_alkaner.html')" title="Isomeri ved alkaner"><span class="btn-num">3</span><span class="btn-text">Isomeri ved alkaner</span></button>
            <button class="tab-btn" data-emne="c6.4" data-beskrivelse="Byg en alkan ud fra dens navn, eller navngiv en alkan du selv bygger." onclick="visAnimation(this, 'c6.4_byg_alkaner.html')" title="Byg alkaner ud fra navnet, eller navngiv dem selv"><span class="btn-num">4</span><span class="btn-text">Byg og navngiv alkaner</span></button>
            <button class="tab-btn" data-emne="c6.5" data-beskrivelse="Afgør om større, mere komplekse molekyler er polære eller upolære." onclick="visAnimation(this, 'c6.5_spil_polaritet.html')" title="Polaritet - større molekyler"><span class="btn-num">5</span><span class="btn-text">Polær eller upolær?</span></button>
            <!-- <button class="tab-btn" onclick="visAnimation(this, 'c6_addition_substitution_forskel_animation.html')" title="Addition og Substitution"><span class="btn-num">6</span><span class="btn-text">Addition/Substitution</span></button> -->
            <button class="tab-btn" data-emne="c6.6" data-beskrivelse="Byg dit eget fedtstof af glycerol og fedtsyrer, og se hvordan opbygningen påvirker dets egenskaber." onclick="visAnimation(this, 'c6.6_typer_fedtstof.html')" title="Byg et fedtstof"><span class="btn-num">6</span><span class="btn-text">Byg et fedtstof</span></button>
            <button class="tab-btn" data-emne="c6.7" data-beskrivelse="Animation hvor du tester 4 forskellige fedtstoffer med bromvand for at finde det mindst umættede." onclick="visAnimation(this, 'c6.7_fedtstoffer_additionsreaktioner.html')" title="Forsøg: Umættet fedt?"><span class="btn-num">7</span><span class="btn-text">Umættet fedt?</span></button>
            <button class="tab-btn" data-emne="c6.8" data-beskrivelse="Ryst bromvand med hexan, stil det ene glas i lys og det andet i mørke, og påvis HBr i vandfasen med pH-papir og AgNO₃." onclick="visAnimation(this, '../v2/superlab/sc6.8_substitution/index.html')" title="Forsøg: Substitution i benzin"><span class="btn-num">8</span><span class="btn-text">Substitution i benzin</span></button>
            <button class="tab-btn" data-emne="c6.9" data-beskrivelse="Afvej og knus chips, træk fedtet ud med et opløsningsmiddel, filtrer, inddamp og beregn fedtindholdet." onclick="visAnimation(this, '../v2/superlab/sc6.9_fedt_i_chips/index.html')" title="Forsøg: Fedt i chips"><span class="btn-num">9</span><span class="btn-text">Fedt i chips</span></button>

        </div>

        <div class="content-area">
            <button class="gendan-knap" id="gendanKnap" onclick="fuldSkaerm(false)" title="Vis samlingen">☰</button>
            <div class="startside" id="startside">
                <div class="startside-grid" id="startsideGrid"></div>
            </div>
            <iframe id="visningsVindue" style="display:none;"></iframe>
        </div>
    </div>

    <script>
        function visAnimation(knap, filsti) {
            var iframe = document.getElementById('visningsVindue');
            document.getElementById('startside').style.display = 'none';
            iframe.style.display = 'block';
            iframe.src = filsti;
            fuldSkaerm(('/' + filsti).indexOf('/v2/') >= 0);

            var alleKnapper = document.querySelectorAll('.tab-btn');
            alleKnapper.forEach(btn => btn.classList.remove('active'));
            knap.classList.add('active');
        }

        function visStartside() {
            document.getElementById('visningsVindue').style.display = 'none';
            document.getElementById('startside').style.display = 'block';
            document.getElementById('sidebarMenu').classList.remove('collapsed');
            fuldSkaerm(false);
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        }

        function byggStartside() {
            var grid = document.getElementById('startsideGrid');
            document.querySelectorAll('.tab-btn').forEach(function(knap) {
                var num = knap.querySelector('.btn-num').textContent;
                var titel = knap.querySelector('.btn-text').textContent;
                var beskrivelse = knap.getAttribute('data-beskrivelse') || '';
                var boks = document.createElement('div');
                boks.className = 'startside-box';
                boks.innerHTML = '<div class="startside-box-head"><span class="btn-num">' + num + '</span><span class="startside-box-title">' + titel + '</span></div><div class="startside-box-desc">' + beskrivelse + '</div>';
                boks.addEventListener('click', function() { knap.click(); });
                grid.appendChild(boks);
            });
        }
        byggStartside();

        // Fuld skaerm: laboratorieforsoegene (superanimationer) faar hele vinduet.
        // Sidepanelet skjules, og knappen i hjoernet gendanner det. Det ydre panel
        // (samling_alt) faar besked, saa det ogsaa skjuler sit.
        function fuldSkaerm(til) {
            var menu = document.getElementById('sidebarMenu');
            menu.classList.toggle('skjult', til);
            if (!til) menu.classList.remove('collapsed');
            document.querySelector('.content-area').classList.toggle('fuld', til);
            if (window.parent !== window) {
                window.parent.postMessage(til ? 'fuldSkaerm' : 'gendanPanel', '*');
            }
            markerFuldSkaerm();
        }

        // Animationen faar klassen samling-fuld paa <html> i fuld skaerm, saa den kan
        // give plads til knappen i hjoernet. Saettes igen, hver gang en side er indlaest.
        function markerFuldSkaerm() {
            var iframe = document.getElementById('visningsVindue');
            var til = document.querySelector('.content-area').classList.contains('fuld');
            try { iframe.contentDocument.documentElement.classList.toggle('samling-fuld', til); } catch (e) {}
        }
        document.getElementById('visningsVindue').addEventListener('load', markerFuldSkaerm);

        function toggleMenu() {
            var menu = document.getElementById('sidebarMenu');
            menu.classList.toggle('collapsed');
        }

        function kopierLink(btn) {
            var forrigeTekst = btn.textContent;
            var aktivKnap = document.querySelector('.tab-btn.active');
            var url = new URL('../samling_alt.html', window.location.href);
            if (aktivKnap) {
                url.search = '?emne=' + encodeURIComponent(aktivKnap.getAttribute('data-emne'));
            } else {
                var egetFilnavn = window.location.pathname.split('/').pop();
                url.search = '?side=' + encodeURIComponent(egetFilnavn);
            }
            function visManuelt() {
                window.prompt('Kopiér linket manuelt (Ctrl+C):', url.href);
            }
            try {
                navigator.clipboard.writeText(url.href).then(function() {
                    btn.textContent = '✓';
                    setTimeout(function() { btn.textContent = forrigeTekst; }, 1200);
                }).catch(visManuelt);
            } catch (e) {
                visManuelt();
            }
        }

        window.addEventListener('load', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const emneFil = urlParams.get('emne');

            if (emneFil) {
                const knapper = document.querySelectorAll('.tab-btn');
                const aliasKnap = Array.from(knapper).find(knap => knap.getAttribute('data-emne') === emneFil);
                if (aliasKnap) {
                    aliasKnap.click();
                } else {
                    knapper.forEach(knap => {
                        if (knap.getAttribute('onclick').includes(emneFil)) {
                            visAnimation(knap, emneFil);
                        }
                    });
                }
                // Direkte link til en bestemt animation skal altid vise et sammenklappet
                // sidepanel med det samme, i stedet for at vente på at brugeren interagerer
                // med animationen (blur-baseret kollaps kan være upålideligt).
                document.getElementById('sidebarMenu').classList.add('collapsed');
                if (window.parent !== window) {
                    window.parent.postMessage('animationFocus', '*');
                }
            }
        });

        window.addEventListener('blur', function() {
            if (document.activeElement === document.getElementById('visningsVindue')) {
                document.getElementById('sidebarMenu').classList.add('collapsed');
                if (window.parent !== window) {
                    window.parent.postMessage('animationFocus', '*');
                }
            }
        });

    </script>

</body>
</html>
