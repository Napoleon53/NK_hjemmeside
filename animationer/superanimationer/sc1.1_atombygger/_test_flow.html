<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Testdriver</title>
<style>
    html, body { margin:0; padding:0; height:100%; }
    iframe { border:0; width:1600px; height:832px; display:block; }
</style>
</head>
<body>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* Udviklerværktøj: klikker sig gennem fane 1, så et skærmbillede kan
   vise en tilstand, man ellers kun når med musen. ?trin=N klikker på
   opgaveknappen N gange, ?z=20 springer til grundstof nr. 20. */
var sp = new URLSearchParams(location.search);
var trin = parseInt(sp.get("trin") || "0", 10);
var z = parseInt(sp.get("z") || "0", 10);

document.getElementById("ramme").addEventListener("load", function () {
    var d = this.contentDocument;
    setTimeout(function () {
        if (z) d.querySelector('#byg-pertabel .pcelle[data-z="' + z + '"]').click();
        for (var i = 0; i < trin; i++) d.getElementById("byg-opgave-knap").click();
    }, 700);
});
</script>
</body>
</html>
