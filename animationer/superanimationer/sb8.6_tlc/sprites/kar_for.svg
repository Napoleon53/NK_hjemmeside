  <rect x="20" y="40" width="7" height="228" rx="3.5" fill="url(#glimt)"/>
  <rect x="31" y="46" width="2.5" height="190" rx="1.25" fill="#ffffff" fill-opacity="0.14"/>
  <rect x="212" y="52" width="4" height="210" rx="2" fill="#ffffff" fill-opacity="0.10"/>
