<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300">
  <!-- TLC-karret, forreste lag: glassets forside med lysglimt, kanter og
       den forreste del af randen. Tegnes OVEN PAA løbevæsken og pladen.
       Samme maal som kar_bag.svg: inderside x 18-222, bund y 284,
       randen ved y 24. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3f1fb" stop-opacity="0.30"/>
      <stop offset="0.07" stop-color="#e3f1fb" stop-opacity="0.06"/>
      <stop offset="0.9" stop-color="#e3f1fb" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#e3f1fb" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="glimt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
