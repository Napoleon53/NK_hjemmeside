<svg xmlns="http://www.w3.org/2000/svg" width="128" height="144" viewBox="0 0 64 72">
  <!-- Heksen, der sidder paa sin kost. Bunden (32, 72) staar paa hylden.
       Kosten peger mod hoejre; gnister og tale tegnes i koden. -->
  <defs>
    <linearGradient id="kjole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3fa0"/>
      <stop offset="1" stop-color="#3a1f63"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2b33"/>
      <stop offset="0.5" stop-color="#4a4a58"/>
      <stop offset="1" stop-color="#1b1b22"/>
    </linearGradient>
  </defs>
  <!-- Kosten -->
  <path d="M6 58 L50 52" stroke="#8a5a2c" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M48 52 L62 46 L63 58 L50 56 Z" fill="#c9a15a" stroke="#8a6a2c" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M52 53 L60 49 M52 55 L61 55" stroke="#8a6a2c" stroke-width="0.7"/>
  <!-- Ben og sko -->
  <path d="M26 50 L22 62 M34 50 L31 62" stroke="#2b2b33" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 63 L24 60 L25 65 Z M28 64 L33 61 L34 66 Z" fill="#1b1b22"/>
  <!-- Kjole -->
  <path d="M30 26 L20 54 L44 54 L36 26 Z" fill="url(#kjole)" stroke="#2a1548" stroke-width="0.8"/>
  <path d="M24 44 L40 44" stroke="#f2c53d" stroke-width="1.6"/>
  <!-- Arm med tryllestav -->
  <path d="M36 32 L48 24" stroke="#7fbf6a" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 24 L56 14" stroke="#e9e2c8" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M56 14 l1.6 -3.2 l1.2 3.4 l3.4 0.8 l-3 1.8 l0.4 3.4 l-2.6 -2.2 l-3.2 1.4 l1.4 -3.2 l-2.6 -2.2 Z" fill="#f2c53d"/>
  <!-- Hoved -->
  <circle cx="33" cy="22" r="7.5" fill="#8fd17a" stroke="#4f8a3f" stroke-width="0.8"/>
  <path d="M40 23 l4 1.6" stroke="#4f8a3f" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="30.5" cy="21" r="1.1" fill="#1b1b22"/>
  <circle cx="35.5" cy="21" r="1.1" fill="#1b1b22"/>
  <path d="M30 25.5 q3 2.6 6 0" fill="none" stroke="#1b1b22" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Haar -->
  <path d="M26 20 q-3 6 -1 12 M40 20 q3 6 1 12" fill="none" stroke="#c9c9d1" stroke-width="2" stroke-linecap="round"/>
  <!-- Hat -->
  <path d="M22 17 L44 17 L38 15 L33 0 L28 15 Z" fill="url(#hat)" stroke="#111318" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M21 17 h24" stroke="#111318" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 14 h10" stroke="#f2c53d" stroke-width="1.4"/>
</svg>
