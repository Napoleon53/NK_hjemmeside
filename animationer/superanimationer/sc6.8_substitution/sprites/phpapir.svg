<svg xmlns="http://www.w3.org/2000/svg" width="128" height="68" viewBox="0 0 64 34">
  <!-- Aeske med universalindikatorpapir. Farveskalaen pH 1-14 staar paa
       laaget. En strimmel stikker ud af aabningen til hoejre; strimlen
       tages ved (60, 20). Bunden hviler paa bordet ved y 34. -->
  <defs>
    <linearGradient id="aeske" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe2"/>
      <stop offset="1" stop-color="#d9d2bf"/>
    </linearGradient>
  </defs>
  <path d="M2 10 L54 10 L54 33 L2 33 Z" fill="url(#aeske)" stroke="#a89f88" stroke-width="0.9"/>
  <path d="M2 10 L6 4 L58 4 L54 10 Z" fill="#e7e0cd" stroke="#a89f88" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M54 10 L58 4 L58 27 L54 33 Z" fill="#c9c1ab" stroke="#a89f88" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- Farveskala -->
  <g>
    <rect x="6" y="14" width="3.4" height="7" fill="#d7262b"/>
    <rect x="9.4" y="14" width="3.4" height="7" fill="#e2532b"/>
    <rect x="12.8" y="14" width="3.4" height="7" fill="#ec7d2c"/>
    <rect x="16.2" y="14" width="3.4" height="7" fill="#f2a531"/>
    <rect x="19.6" y="14" width="3.4" height="7" fill="#f2cf3a"/>
    <rect x="23" y="14" width="3.4" height="7" fill="#c9d43b"/>
    <rect x="26.4" y="14" width="3.4" height="7" fill="#6db24b"/>
    <rect x="29.8" y="14" width="3.4" height="7" fill="#3a9f7e"/>
    <rect x="33.2" y="14" width="3.4" height="7" fill="#2b8fa3"/>
    <rect x="36.6" y="14" width="3.4" height="7" fill="#2a63b0"/>
    <rect x="40" y="14" width="3.4" height="7" fill="#3f3f9c"/>
    <rect x="43.4" y="14" width="3.4" height="7" fill="#5e2d84"/>
    <rect x="46.8" y="14" width="3.4" height="7" fill="#4a1f66"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="3.6" font-weight="700" fill="#4a4f57">
    <text x="7" y="26">1</text>
    <text x="26" y="26">7</text>
    <text x="45" y="26">13</text>
  </g>
  <text x="28" y="31.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="4.2" font-weight="800" fill="#1f2328">pH-papir</text>
  <!-- Strimmel, der stikker ud -->
  <rect x="52" y="17" width="10" height="5" fill="#f3e7a0" stroke="#c9b86a" stroke-width="0.6"/>
</svg>
