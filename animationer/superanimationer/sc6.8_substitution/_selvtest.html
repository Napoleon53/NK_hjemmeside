<!DOCTYPE html>

<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem med de
   samme funktioner, som klik og knapper bruger: modellen, raekke-
   foelgen, lys og moerke, testene, quizzen, paaskeaegget, sproget og
   ion-notationen. Skal aabnes gennem en lokal server (Chrome afviser
   iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    var i;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("forsoeg og quiz er bygget", !!(NK.forsoeg && NK.quiz));
    Object.keys(NK.Sprites.FILER).forEach(function (n) {
        paastand("sprite " + n + " er indlaest", NK.Sprites.klar(n));
    });

    var M = NK.Model, f = NK.forsoeg, S = NK.Scene;
    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) f.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function frisk() { NK.startForfra(); adv(0.1); }
    function g1() { return f.g.glas1; }
    function g2() { return f.g.glas2; }
    function komma(x) { return String(Math.round(x * 100) / 100).replace(".", ","); }
    var musTid = 0;
    /* Baerer et glas med musen fra dets plads til punktet (x, y) */
    function baer(gl, x, y) {
        var x0 = gl.p.x, y0 = gl.p.y + 80;
        f.ned({ x: x0, y: y0 });
        if (!f.holdt) return false;
        for (var s = 1; s <= 40; s++) {
            musTid += 40;
            f.flyt({ x: x0 + (x - x0) * s / 40, y: y0 + (y - y0) * s / 40 }, musTid);
            f.opdater(1 / 60);
        }
        f.op();
        return true;
    }

    overskrift("2. Modellen");
    paastand("substitutionen er afstemt", M.afstemt(M.REAKTIONER.substitution));
    paastand("syre-basereaktionen er afstemt", M.afstemt(M.REAKTIONER.syre));
    paastand("faeldningen er afstemt", M.afstemt(M.REAKTIONER.faeldning));
    paastand("additionen er afstemt", M.afstemt(M.REAKTIONER.addition));
    var alk = { brom: true, alken: true, brHex: 0.97, brVand: 0.03, reageret: 0, addition: 0 };
    for (i = 0; i < 900; i++) M.skridt(alk, 1 / 60, 0, 0);
    paastand("hex-1-en bruger Br2 uden lys, uden HBr", alk.addition > 0.9 && alk.reageret === 0 && M.br2Tilbage(alk) < 0.1, komma(alk.addition));
    paastand("formler med ladning", M.formel("Br-") === "Br⁻" && M.formel("H3O+") === "H₃O⁺" && M.formel("Ag+") === "Ag⁺" && M.formel("NO3-") === "NO₃⁻", M.formel("Br-") + " " + M.formel("H3O+"));
    paastand("ligningen skrives med pile og faser", M.ligning(M.REAKTIONER.substitution, true) === "C₆H₁₄(l) + Br₂(aq) → C₆H₁₃Br(l) + HBr(aq)", M.ligning(M.REAKTIONER.substitution, true));
    paastand("pH: uden reaktion naesten neutral, efter reaktion sur", M.pH(0) === 6 && M.pH(1) < 2 && M.pH(0.5) > M.pH(1));
    var testGlas = { brom: true, hexan: true, brHex: 0, brVand: 1, reageret: 0 };
    for (i = 0; i < 300; i++) M.skridt(testGlas, 1 / 60, 0, 0);
    paastand("uden rystning vandrer Br2 kun langsomt op", testGlas.brHex > 0.02 && testGlas.brHex < 0.3, komma(testGlas.brHex));
    testGlas = { brom: true, hexan: true, brHex: 0, brVand: 1, reageret: 0 };
    for (i = 0; i < 240; i++) M.skridt(testGlas, 1 / 60, 1, 0);
    paastand("efter 4 s rystning er naesten alt Br2 i hexanen", M.fordelt(testGlas) >= M.FORDELING.faerdig && testGlas.reageret === 0, komma(M.fordelt(testGlas)));
    var moerkt = JSON.parse(JSON.stringify(testGlas));
    for (i = 0; i < 1800; i++) M.skridt(moerkt, 1 / 60, 0, M.LYS.folie);
    paastand("i folie sker der ingenting paa 30 s", moerkt.reageret === 0);
    var lyst = JSON.parse(JSON.stringify(testGlas));
    for (i = 0; i < 1800; i++) M.skridt(lyst, 1 / 60, 0, M.LYS.lampe);
    paastand("under lampen er Br2 vaek paa 30 s", lyst.reageret >= M.LYS.faerdig && M.br2Tilbage(lyst) < 0.05, komma(lyst.reageret));
    var rum = JSON.parse(JSON.stringify(testGlas));
    for (i = 0; i < 1800; i++) M.skridt(rum, 1 / 60, 0, M.LYS.rum);
    paastand("i lokalets lys gaar det langsomt", rum.reageret > 0.02 && rum.reageret < 0.4, komma(rum.reageret));
    paastand("farvetekst: orange, svagt orange, farveloes", M.farveTekst(testGlas) === "orange" && M.farveTekst(lyst) === "farveløs" && M.farveTekst({ brom: true, brHex: 0.2, brVand: 0 }) === "svagt orange");

    overskrift("3. Raekkefoelge");
    frisk();
    paastand("glas 1 er valgt fra start", f.valgt === "glas1");
    paastand("bromvandet kan ikke aabnes uden udsugning", f.klik("bromflaske") === false && !f.handling);
    paastand("hexan kraever bromvand", f.klik("hexan") === false);
    paastand("proppen kraever bromvand i glasset", f.klik("prop1") === false);
    paastand("lampen kraever et klart glas", f.klik("lampe") === false);
    paastand("pH-papir kraever et glas i lys", f.klik("phpapir") === false);
    paastand("udsugningen taendes", f.klik("kontakt") === true && f.udsugning);
    paastand("bromvand haeldes i glas 1", f.klik("bromflaske") === true);
    adv(1);
    paastand("udsugningen kan ikke slukkes, mens flasken er aaben", f.klik("kontakt") === false && f.udsugning);
    adv(4);
    paastand("glas 1 har bromvand, og flasken er hjemme igen", g1().brom && g1().brVand === 1 && !f.handling && g1().vandAreal > 100);
    paastand("bromvandet er noteret som orange", f.iagttaget.brom);
    paastand("bromvand igen gaar i glas 2", f.klik("bromflaske") === true && f.valgt === "glas2");
    adv(5);
    paastand("begge glas har bromvand, trin 1 gjort", g1().brom && g2().brom && f.trinGjort("brom"));
    paastand("en tredje gang afvises", f.klik("bromflaske") === false);
    f.vaelg("glas1");
    paastand("hexan i glas 1", f.klik("hexan") === true);
    adv(4);
    paastand("glas 1 har to lag", g1().hexan && g1().hexAreal > 50 && g1().brHex < 0.1);
    paastand("lampen afviser et glas uden prop", f.klik("lampe") === false && g1().sted === "stativ");
    paastand("rystning afvises uden prop", f.rystKnap(true) === false && !f.rystKilde);
    paastand("prop i glas 1", f.klik("prop1") === true);
    adv(1.5);
    paastand("proppen sidder i glas 1", g1().prop === f.g.prop1 && f.g.prop1.iGlas === g1());
    paastand("lampen afviser et urystet glas", f.klik("lampe") === false);
    paastand("knappen ryster glas 1", f.rystKnap(true) === true && f.rystGlas === g1());
    adv(4);
    f.rystKnap(false);
    adv(1);
    paastand("Br2 er flyttet op i hexanen", f.rystet(g1()) && g1().brHex > 0.9 && g1().brVand < 0.1, komma(M.fordelt(g1())));
    paastand("fordelingen er noteret", f.iagttaget.fordelt);
    paastand("glasset er tilbage i stativet", Math.abs(g1().p.x - g1().hjem.x) < 2 && !f.rystKilde);
    paastand("glas 1 baeres med musen hen til lampen", baer(g1(), 700, 400) && !f.antalUheld);
    adv(2);
    paastand("lampen er taendt, og glasset staar i holderen", g1().sted === "lampe" && f.lampeTaendt && f.gjort.lys && Math.abs(g1().p.x - S.UNDER_LAMPE.x) < 2);
    paastand("den store visning aabner af sig selv foerste gang", f.stor === g1() && f.gjort.storVist);
    adv(0.5);
    paastand("partikelmodellen koerer langsomt i den store visning", g1().mikro.langsom > 1);
    paastand("et klik lukker den store visning", f.ned({ x: 500, y: 300 }) === false && !f.stor);
    adv(0.5);
    paastand("et klik paa boblen aabner den igen", f.klik("boble") === true && f.stor === g1());
    f.lukStor();
    paastand("lampens kontakt slukker og taender", f.klik("lampekontakt") === true && !f.lampeTaendt && f.klik("lampekontakt") === true && f.lampeTaendt);
    paastand("boblen viser glas 1 under lampen", f.bobleGlas === g1() && f.bobleTitel(g1()).indexOf("lampen") > 0);
    paastand("lampen slukkes med et klik", f.klik("lampe") === true && !f.lampeTaendt);
    var foer = g1().reageret;
    adv(3);
    paastand("med lampen slukket sker der naesten intet", g1().reageret - foer < 0.02, komma(g1().reageret - foer));
    paastand("lampen taendes igen", f.klik("lampe") === true && f.lampeTaendt);

    /* Glas 2 klargoeres, mens glas 1 staar i lyset */
    f.vaelg("glas2");
    paastand("folien afviser glas 2 uden hexan", f.klik("folie") === false);
    paastand("hexan i glas 2", f.klik("hexan") === true);
    adv(4);
    paastand("prop 2 i glas 2", f.klik("prop2") === true);
    adv(1.5);
    paastand("lampen har kun plads til ét glas", f.klik("lampe") === false);
    f.rystKnap(true); adv(4); f.rystKnap(false); adv(1);
    paastand("glas 2 er rystet", f.rystet(g2()));
    paastand("pH-papir afvises, foer lyset er faerdigt", f.klik("phpapir") === false);
    paastand("glas 2 pakkes i folie", f.klik("folie") === true);
    adv(3);
    paastand("glas 2 er i folie, trin 5 gjort", g2().folie && g2().folieVis === 1 && f.gjort.moerke && !f.handling);
    paastand("glas 1 er valgt igen efter indpakningen", f.valgt === "glas1");
    paastand("et glas i folie kan ikke vaelges eller tages fat i", f.hvad({ x: g2().p.x, y: g2().p.y + 80 }) === "glasfolie" && f.klik("glasfolie") === false && f.valgt === "glas1" && f.ned({ x: g2().p.x, y: g2().p.y + 80 }) === false && !f.holdt);
    paastand("folien tages ikke af med rullen", f.klik("folie") === false && g2().folie);
    paastand("knappen ryster glas 1 i stedet, fordi glas 2 er i folie", f.rystKnap(true) === true && f.rystGlas === g1());
    f.rystKnap(false);
    adv(1);
    f.vaelg("glas2");
    adv(0.2);
    paastand("boblen er moerk for glas 2", f.bobleGlas === g2() && g2().mikro.s.moerke === true);

    var t = vent(function () { return f.gjort.reageret; }, 45);
    paastand("farven i lyset er vaek inden 45 s", f.gjort.reageret && M.br2Tilbage(g1()) < 0.05, t + " s");
    paastand("glas 2 i folie er stadig orange", g2().reageret < 0.1 && M.br2Tilbage(g2()) > 0.85, komma(g2().reageret));
    paastand("iagttagelser om lyset", f.iagttaget.lys_start && f.iagttaget.lys_faerdig1);
    paastand("forklaringen under boblen naevner ikke lys", g1().mikro.typer().indexOf("lys") < 0);
    var mk = g1().mikro;
    paastand("partikelmodellen har dannet H3O+ og Br−", mk.h3oAntal() >= 4 && mk.brAntal() >= 4 && mk.antal("br2") <= 1, mk.h3oAntal() + " H3O+, " + mk.brAntal() + " Br-");
    paastand("hexan er blevet til bromhexan", mk.antal("bromhexan") >= 4, mk.antal("bromhexan"));
    paastand("glas 2 har ingen ioner", g2().mikro.h3oAntal() === 0 && g2().mikro.brAntal() === 0);

    overskrift("4. Testene");
    f.vaelg("glas1");
    paastand("pH-papir i glas 1", f.klik("phpapir") === true);
    adv(6);
    paastand("glas 1: proppen er taget af, og pH er lav", !g1().prop && g1().ph !== null && g1().ph < 2.5 && !f.handling, komma(g1().ph));
    paastand("strimlen ligger paa stativet, og der er noteret sur", !!g1().papir && f.iagttaget.ph_sur1);
    paastand("pH-papir igen gaar til glas 2", f.klik("phpapir") === true && f.valgt === "glas2");
    adv(7);
    paastand("glas 2: folien er taget af, pH naesten neutral", !g2().folie && g2().ph !== null && g2().ph > 5 && !f.handling, komma(g2().ph));
    paastand("moerket er noteret", f.iagttaget.moerke2 && f.iagttaget.ph_neutral2);
    paastand("en tredje strimmel afvises", f.klik("phpapir") === false);
    paastand("affald afvises foer AgNO3", f.klik("dunk") === false);
    f.vaelg("glas1");
    for (i = 0; i < 3; i++) { paastand("draabe " + (i + 1) + " i glas 1", f.klik("agno3") === true); adv(2.2); }
    adv(6);
    paastand("glas 1: tre draaber og bundfald", g1().agDraaber === 3 && g1().agTest && g1().agNoteret && g1().mikro.agbrAndel() >= 0.8 && g1().visBund > 0.3, komma(g1().mikro.agbrAndel()));
    paastand("bundfaldet er noteret", f.iagttaget.ag_bundfald1 && f.iagttaget.draabe);
    for (i = 0; i < 3; i++) { paastand("draabe " + (i + 1) + " gaar til glas 2", f.klik("agno3") === true && f.valgt === "glas2"); adv(2.2); }
    adv(4);
    paastand("glas 2: ingen forandring", g2().agTest && g2().agNoteret && g2().mikro.agbrAndel() === 0 && f.iagttaget.ag_intet2);
    paastand("en fjerde draabe afvises", f.klik("agno3") === false);
    paastand("begge tests er gjort, quizzen er laast op", f.testsFaerdige() && NK.quiz.tilstand !== "laast");
    paastand("forsoeget er gjort saerlig godt, og laereren dabber", f.flotUdfoert() && f.laerer.rost && f.laerer.scene && f.laerer.scene.navn === "dab");
    paastand("tegneserien er laast foer forsoeget er slut", d.getElementById("serieknap").hidden);
    adv(8);
    paastand("resterne afleveres", f.klik("dunk") === true);
    adv(12);
    paastand("forsoeget er slut, glassene er tomme", f.gjort.affald && !g1().brom && !g2().brom && !f.handling && f.aktueltTrin() === null);
    paastand("alle ni trin er gjort", NK.TRIN.every(function (tr) { return f.trinGjort(tr.id); }));
    paastand("tegneserien er laast op", !d.getElementById("serieknap").hidden);
    NK.aabnSerie();
    paastand("tegneserien har otte ruder med elevens tal", d.querySelectorAll("#serie-ruder .rude").length === 8 && d.getElementById("tegneserie").classList.contains("vis") && d.getElementById("serie-ruder").textContent.indexOf("pH ≈ 2") > 0);
    var celler = d.querySelectorAll("#serie-ruder .resultater td");
    paastand("resultatskemaet staar i sidste rude", celler.length === 8 && celler[0].textContent === "Lys" && celler[1].textContent === "Mørke" && celler[2].textContent === "farveløs" && celler[3].textContent === "orange" && celler[4].textContent.indexOf("pH ≈ 2") === 0 && celler[7].textContent.indexOf("ingen") === 0, celler.length ? celler[4].textContent : "");
    d.getElementById("serie-luk").click();
    paastand("tegneserien lukkes", !d.getElementById("tegneserie").classList.contains("vis"));
    paastand("udsugningen kan slukkes nu", f.klik("kontakt") === true && !f.udsugning);

    overskrift("5. Paaskeaegget: proppen springer af");
    var R = M.RYST;
    paastand("anden gang skal der rystes voldsommere, og hoejst 2 uheld", R.KNUS_FART[1] > R.KNUS_FART[0] && R.KNUS_TID[1] >= R.KNUS_TID[0] && R.MAKS_UHELD === 2);
    function musRyst(gl, A, hz, sek, stop) {
        var x0 = gl.p.x, y0 = gl.p.y + 80, s;
        f.ned({ x: x0, y: y0 });
        if (!f.holdt) return -1;
        for (s = 0; s <= Math.round(sek * 60); s++) {
            musTid += 1000 / 60;
            f.flyt({ x: x0 + 12 + A * Math.sin(2 * Math.PI * hz * s / 60), y: y0 }, musTid);
            f.opdater(1 / 60);
            if (f.pyt || (stop && stop())) break;
        }
        f.op();
        adv(1);
        return s / 60;
    }
    function klarGlas1() {
        if (!f.udsugning) f.klik("kontakt");
        f.vaelg("glas1");
        f.klik("bromflaske"); adv(5); f.klik("hexan"); adv(4); f.klik("prop1"); adv(1.5);
    }
    frisk();
    klarGlas1();
    var rolig = musRyst(g1(), 50, 3, 12, function () { return f.rystet(g1()); });
    paastand("almindelig rystning med musen fordeler Br2 inden 8 s", rolig >= 0 && f.rystet(g1()) && rolig < 8, rolig.toFixed(1) + " s");
    paastand("almindelig rystning taber ikke proppen", f.antalUheld === 0 && g1().prop);

    frisk();
    klarGlas1();
    musRyst(g1(), 120, 8, 3);
    paastand("meget voldsom rystning faar proppen til at springe", f.antalUheld === 1 && !g1().prop && !!f.pyt && f.pyt.brom);
    paastand("glasset er tomt og skal fyldes igen", !g1().brom && !g1().hexan && g1().vandAreal === 0);
    paastand("uheldet er noteret", f.iagttaget.uheld1);
    adv(0.5);
    paastand("laereren er paa vej", f.laererOptaget() && f.laerer.scene && f.laerer.scene.navn === "uheld");
    paastand("klik afvises, mens laereren er der", f.klik("bromflaske") === false);
    adv(12);
    paastand("laereren har toerret op og er gaaet", !f.pyt && !f.laererOptaget() && f.laerer.x < -200);
    paastand("proppen er tilbage paa bordet", !f.g.prop1.flyver && Math.abs(f.g.prop1.p.x - f.g.prop1.hjem.x) < 2);
    paastand("glas 1 kan fyldes igen", f.klik("bromflaske") === true);
    paastand("uheldet udelukker et saerlig godt forsoeg", f.flotUdfoert() === false);
    adv(5);
    f.klik("hexan"); adv(4); f.klik("prop1"); adv(1.5);
    musRyst(g1(), 120, 8, 3);
    paastand("anden gang taber samme voldsomhed ikke proppen", f.antalUheld === 1 && g1().prop);
    musRyst(g1(), 160, 9, 3);
    paastand("endnu voldsommere rystning faar proppen til at springe anden gang", f.antalUheld === 2);
    adv(13);
    klarGlas1();
    musRyst(g1(), 220, 10, 4);
    paastand("efter to uheld springer proppen ikke mere", f.antalUheld === 2 && f.knusGraense() === null && g1().prop);

    overskrift("6. Kaffen, uret, lampen og heksen");
    frisk();
    paastand("laereren henter kaffen", f.klik("kaffekop") === true);
    adv(1.5);
    paastand("laereren siger, at der ikke drikkes i laboratoriet", f.laerer.tale.indexOf("drikkes") >= 0);
    adv(12);
    paastand("koppen er vaek, og laereren er gaaet", f.g.kaffekop.skjult && !f.laererOptaget());
    paastand("uret faar tiden til at gaa hurtigere", f.klik("ur") === true && f.tidFart === M.UR.hurtig);
    var urFoer = f.urMinutter;
    adv(2);
    paastand("vaeguret loeber hurtigere", f.urMinutter - urFoer > 2 * M.UR.minPerSek * 3);
    adv(M.UR.hurtigTid);
    paastand("tiden gaar normalt igen", f.tidFart === 1);
    paastand("lampen kan taendes paa kontakten uden glas", f.klik("lampekontakt") === true && f.lampeTaendt);
    adv(21.5);
    paastand("laereren kommer for at slukke lampen", f.laerer.scene && f.laerer.scene.navn === "sluklampe");
    adv(12);
    paastand("lampen er slukket, og laereren er gaaet", !f.lampeTaendt && !f.laererOptaget());
    frisk();
    f.klik("kontakt"); f.klik("bromflaske"); adv(5); f.klik("hexan"); adv(4); f.klik("prop1"); adv(1.5);
    f.rystKnap(true); adv(4); f.rystKnap(false); adv(1);
    f.klik("lampe"); adv(2); f.lukStor();
    paastand("glasset kan baeres tilbage til stativet", baer(g1(), 395, 400));
    adv(2);
    paastand("glasset staar i stativet, og lampen er slukket", g1().sted === "stativ" && !f.lampeTaendt);

    overskrift("7. Hex-1-en: en addition uden for forsoeget");
    frisk();
    f.klik("kontakt");
    paastand("hexen kraever bromvand", f.klik("hexen") === false);
    f.klik("bromflaske"); adv(5);
    paastand("hexen haeldes i glas 1", f.klik("hexen") === true);
    adv(4);
    paastand("glasset har hexen, og laereren paataler det", g1().alken && !g1().hexan && f.laerer.scene && f.laerer.scene.navn === "hexen" && f.laerer.tale.indexOf("addition") >= 0);
    paastand("hexan kan ikke komme oveni", f.klik("hexan") === false);
    paastand("glasset taeller ikke i forsoeget", !f.trinGjort("hexan") && f.trinGjort("brom") === false);
    f.klik("prop1"); adv(1.5);
    f.rystKnap(true); adv(4); f.rystKnap(false); adv(1);
    paastand("lampen afviser glasset med hexen", f.klik("lampe") === false && g1().sted === "stativ");
    adv(8);
    paastand("farven forsvinder uden lys, og der dannes ingen HBr", M.br2Tilbage(g1()) < 0.1 && g1().addition > 0.9 && g1().reageret === 0, komma(g1().addition));
    paastand("partikelmodellen har dannet dibromhexan", g1().mikro.antal("dibromhexan") >= 4 && g1().mikro.h3oAntal() === 0, g1().mikro.antal("dibromhexan"));
    paastand("pH-papir kan proeves i glasset med hexen", f.klik("phpapir") === true);
    adv(6);
    paastand("vandfasen er naesten neutral", g1().ph !== null && g1().ph > 5, komma(g1().ph));
    for (i = 0; i < 3; i++) { f.klik("agno3"); adv(2.2); }
    adv(4);
    paastand("AgNO3 giver ingen forandring", g1().agNoteret && g1().mikro.agbrAndel() === 0);
    paastand("glasset toemmes i dunken", f.klik("dunk") === true);
    adv(6);
    paastand("glasset er tomt og kan bruges igen", !g1().brom && !g1().alken && g1().ph === null && !g1().agTest && g1().sted === "stativ" && f.klik("bromflaske") === true);
    adv(5);
    paastand("bromvand igen i glas 1", g1().brom && !g1().alken);

    overskrift("8. Quizzens spoergsmaal");
    paastand("quizzen har 10 spoergsmaal", NK.QUIZ.length === 10);
    NK.QUIZ.forEach(function (sp, n) {
        var unikke = sp.valg.filter(function (v, k) { return sp.valg.indexOf(v) === k; }).length === 4;
        var blandOk = true;
        for (i = 0; i < 100; i++) {
            var b = NK.quiz.bland(sp);
            if (b.valg[b.rigtig] !== sp.valg[sp.rigtig]) blandOk = false;
        }
        paastand("spoergsmaal " + (n + 1) + ": fire forskellige svar, blandingen holder styr paa det rigtige",
            sp.valg.length === 4 && unikke && !!sp.forklaring && blandOk);
    });

    overskrift("9. Sprog og notation");
    var tekster = [d.body.textContent];
    NK.QUIZ.forEach(function (sp) { tekster.push(sp.sp, sp.forklaring, sp.valg.join(" ")); });
    NK.TRIN.forEach(function (tr) { tekster.push(tr.tekst, tr.hint); });
    Object.keys(NK.IAGTTAGELSER).forEach(function (k) { tekster.push(NK.IAGTTAGELSER[k].tekst); });
    Object.keys(NK.Mikro.ETIKET).forEach(function (k) { tekster.push(NK.Mikro.ETIKET[k]); });
    var alt = tekster.join(" ");
    paastand("ingen tankestreger", !/[—–]/.test(alt));
    paastand("ingen ladning skrevet som 1+ eller 1−", !/[¹][⁺⁻]|[A-Za-z)\]₀-₉]1[+−-]/.test(alt));

    frisk();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
