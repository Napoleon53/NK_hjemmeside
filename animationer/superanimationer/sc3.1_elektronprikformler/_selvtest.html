<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc3.1 Elektronprikformler</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1100px; height:700px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe (1100 × 700, den mindste skærm, der
   skal kunne bruges) og kontrollerer det, man ikke kan se på et
   skærmbillede: at grundstofferne har det rigtige antal elektroner, at
   bogens regel for atomets tegning holder, at hvert facit har 8
   elektroner omkring hvert atom (hydrogen 2), at et molekyle, hvor alle
   elektroner er parret, altid er facit (prøvet med tilfældige
   byggerier), at atomerne aldrig står oven i hinanden, at Find fejlens
   tegninger har højst én fejl og en rigtig rettelse, at begge faner kan
   gennemføres (selv og med Vis svaret), at intet bedømmes før Indsend
   svar, at et forkert svar koster stjernen, at scenen er låst, når
   kortet er grønt, at sproget holder reglerne, og at kortet kan være på
   sin plads.

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1200); });

var NOEGLER = ["nk-sc3.1-b", "nk-sc3.1-f"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* En fane koeres sek sekunder, og der tegnes undervejs */
function koerF(F, sek) { for (var t = 0; t < sek; t += 1 / 30) { F.opdater(1 / 30); F.tegn(); } }

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, P = NK.Prik;
    var B = NK.sims["fane-b"], Fj = NK.sims["fane-f"];
    var zAlle = Object.keys(D.EL).map(Number);

    /* ------------------------------------------------------------------ */
    overskrift("1. Grundstofferne og atomets tegning");
    var UPARREDE = { 1: 1, 6: 4, 7: 3, 8: 2, 17: 1, 35: 1 };
    paastand("valenselektronerne er hovedgruppens nummer", zAlle.every(function (z) { return D.EL[z].v === D.EL[z].g; }));
    paastand("uparrede elektroner: H 1, C 4, N 3, O 2, Cl 1, Br 1", zAlle.every(function (z) { return P.uparrede(z) === UPARREDE[z]; }));
    paastand("bogens tegning af hvert atom er rigtig efter reglen", zAlle.every(function (z) { return P.tegningFejl(z, P.standard(z)) === null; }));
    paastand("bogens tegning: O har par oppe og nede, Cl har ét uparret til højre",
        P.standard(8).join() === "2,1,2,1" && P.standard(17).join() === "2,1,2,2" && P.standard(1).join() === "0,1,0,0");
    paastand("for få elektroner giver fejl om antallet", P.tegningFejl(8, [1, 1, 1, 1]).slags === "antal");
    paastand("et par, før alle fire sider har én, giver fejl om fordelingen",
        P.tegningFejl(8, [2, 2, 2, 0]).slags === "fordeling" && P.tegningFejl(6, [2, 2, 0, 0]).slags === "fordeling" && P.tegningFejl(7, [2, 2, 1, 0]).slags === "fordeling");
    paastand("O med to par og to uparrede er rigtig, uanset hvilke sider", P.tegningFejl(8, [1, 2, 1, 2]) === null && P.tegningFejl(8, [2, 2, 1, 1]) === null);
    paastand("hint til atomnummeret (8 for O), til det, der mangler (2 for O), og til perioden (2 for N)",
        /atomnummer 8/.test(D.antalHint(8, 8)) && /mangler/.test(D.antalHint(8, 2)) && /periode 2/.test(D.antalHint(7, 2)));
    paastand("hint til perioden (4 for Br)", /periode 4/.test(D.antalHint(35, 4)));

    /* ------------------------------------------------------------------ */
    overskrift("2. Molekylerne og facit");
    var facitFejl = [];
    D.MOLEKYLER.forEach(function (m) {
        var M = P.facit(m);
        M.atomer.forEach(function (a) { if (!P.status(M, a).ok) facitFejl.push(m.id + " atom " + a.id); });
        if (!P.faerdig(M).ok) facitFejl.push(m.id + " ikke færdig");
        M.bindinger.forEach(function (b) {
            var A = M.atomer[b.a], Bb = M.atomer[b.b];
            if (Math.abs(A.gx - Bb.gx) + Math.abs(A.gy - Bb.gy) !== 1) facitFejl.push(m.id + " binding ikke nabo");
        });
        var sum = 0;
        M.atomer.forEach(function (a) { sum += D.EL[a.z].v; });
        var talt = 0;
        M.atomer.forEach(function (a) { talt += P.status(M, a).frie; });
        M.bindinger.forEach(function (b) { talt += 2 * b.n; });
        if (sum !== talt) facitFejl.push(m.id + " elektronregnskab " + sum + "/" + talt);
        if (m.om < 0 || m.om >= m.atomer.length) facitFejl.push(m.id + " om");
        var tegnF = m.f.match(/[A-Z][a-z]?/g).join("");
        m.atomer.forEach(function (z) { if (tegnF.indexOf(D.EL[z].s) < 0) facitFejl.push(m.id + " formel"); });
    });
    paastand("alle ti facit har 8 elektroner omkring hvert atom (hydrogen 2) og et rigtigt elektronregnskab", facitFejl.length === 0, facitFejl.slice(0, 4).join(", "));
    paastand("ti molekyler fra H₂ til C₂H₂", D.MOLEKYLER.length === 10 && D.MOLEKYLER[0].id === "h2");

    /* Tilfaeldige byggerier: elektroner parres tilfaeldigt, til ingen flere kan.
       Er alt parret, skal resultatet vaere facit (samme bindinger mellem samme
       slags atomer), og atomerne maa aldrig staa oven i hinanden. */
    function bindingsAftryk(M) {
        return M.bindinger.map(function (b) {
            var s = [D.EL[M.atomer[b.a].z].s, D.EL[M.atomer[b.b].z].s].sort().join("-");
            return s + b.n;
        }).sort().join(",") + "|" + M.atomer.map(function (a) { return D.EL[a.z].s + P.naboer(M, a).length; }).sort().join(",");
    }
    var tilfFejl = [], kolFejl = [], faerdige = 0, laast = 0, ringe = 0;
    var r = 12345;
    function tilf(n) { r = (r * 1103515245 + 12345) % 2147483648; return r % n; }
    D.MOLEKYLER.forEach(function (m) {
        var facitAftryk = bindingsAftryk(P.facit(m));
        for (var k = 0; k < 250; k++) {
            var M = P.nytMolekyle(m.atomer);
            for (var skridt = 0; skridt < 40; skridt++) {
                var muligt = [];
                M.atomer.forEach(function (a) {
                    P.enligeSider(M, a).forEach(function (sa) {
                        M.atomer.forEach(function (b) {
                            if (b.id <= a.id) return;
                            P.enligeSider(M, b).forEach(function (sb) { muligt.push([a.id, sa, b.id, sb]); });
                        });
                    });
                });
                if (!muligt.length) break;
                var v = muligt[tilf(muligt.length)];
                var res = P.binde(M, v[0], v[1], v[2], v[3]);
                if (!res.ok) { if (res.grund === "ring") ringe++; continue; }
                var set = {};
                P.dele(M).forEach(function (del) {
                    del.forEach(function (id) {
                        var nogle = del[0] + ":" + M.atomer[id].gx + "," + M.atomer[id].gy;
                        if (set[nogle]) kolFejl.push(m.id);
                        set[nogle] = true;
                    });
                });
            }
            var f = P.faerdig(M);
            if (f.ok) { faerdige++; if (bindingsAftryk(M) !== facitAftryk) tilfFejl.push(m.id + ": " + bindingsAftryk(M)); }
            else laast++;
        }
    });
    paastand("2500 tilfældige byggerier: når alle elektroner er parret, er det altid facit", tilfFejl.length === 0, tilfFejl.slice(0, 3).join("; "));
    paastand("nogle tilfældige byggerier ender rigtigt, og nogle går i stå", faerdige > 100 && laast > 100, faerdige + " rigtige, " + laast + " i stå");
    paastand("atomerne står aldrig oven i hinanden", kolFejl.length === 0, kolFejl.slice(0, 3).join(", "));

    var Mx = P.nytMolekyle([8, 6, 8]);
    P.binde(Mx, 1, 3, 0, 1); P.binde(Mx, 1, 1, 2, 3);
    paastand("CO₂: to O på hver sin side af C er ikke naboer og kan ikke dele et par", P.binde(Mx, 0, P.enligeSider(Mx, Mx.atomer[0])[0], 2, P.enligeSider(Mx, Mx.atomer[2])[0]).grund === "ring");
    var Mn = P.nytMolekyle([7, 7]);
    var r1 = P.binde(Mn, 0, 1, 1, 3), r2 = P.binde(Mn, 0, P.enligeSider(Mn, Mn.atomer[0])[0], 1, P.enligeSider(Mn, Mn.atomer[1])[0]),
        r3 = P.binde(Mn, 0, P.enligeSider(Mn, Mn.atomer[0])[0], 1, P.enligeSider(Mn, Mn.atomer[1])[0]);
    paastand("N₂: tre par mellem de samme atomer bliver en tripelbinding", r1.ok && r2.slags === "flere" && r3.ok && Mn.bindinger[0].n === 3 && P.faerdig(Mn).ok);
    var Mc = P.nytMolekyle([6, 6]);
    for (var q = 0; q < 3; q++) P.binde(Mc, 0, P.enligeSider(Mc, Mc.atomer[0])[0], 1, P.enligeSider(Mc, Mc.atomer[1])[0]);
    paastand("to atomer kan højst dele 3 elektronpar", P.binde(Mc, 0, P.enligeSider(Mc, Mc.atomer[0])[0], 1, P.enligeSider(Mc, Mc.atomer[1])[0]).grund === "maks");
    P.bryd(Mn, Mn.bindinger[0]);
    paastand("et klik på et fælles par skiller ét par ad igen", Mn.bindinger[0].n === 2 && P.enlige(Mn, Mn.atomer[0]) === 1);
    P.bryd(Mn, Mn.bindinger[0]); P.bryd(Mn, Mn.bindinger[0]);
    paastand("det sidste par skilt ad: atomerne er ikke længere bundet", Mn.bindinger.length === 0 && P.dele(Mn).length === 2);

    /* ------------------------------------------------------------------ */
    overskrift("3. Find fejlen: tegningerne");
    var tegnFejl = [], rigtige = 0, retFejl = [];
    D.FEJL.forEach(function (o, i) {
        var M = P.elevTegning(o);
        var f = P.fejlAtomer(M);
        if (f.length > 1) tegnFejl.push((i + 1) + ": " + f.length + " fejl");
        if (!f.length) rigtige++;
        var R = P.rettet(o);
        R.atomer.forEach(function (a) { if (!P.status(R, a).ok) retFejl.push((i + 1) + " atom " + a.id); });
        var sum = 0, talt = 0;
        R.atomer.forEach(function (a) { sum += D.EL[a.z].v; talt += P.status(R, a).frie; });
        R.bindinger.forEach(function (b) { talt += 2 * b.n; });
        if (sum !== talt) retFejl.push((i + 1) + " regnskab");
        M.bindinger.forEach(function (b) {
            if (Math.abs(M.atomer[b.a].gx - M.atomer[b.b].gx) + Math.abs(M.atomer[b.a].gy - M.atomer[b.b].gy) !== 1) tegnFejl.push((i + 1) + " ikke nabo");
        });
    });
    paastand("tolv tegninger, hver med højst ét forkert atom", D.FEJL.length === 12 && tegnFejl.length === 0, tegnFejl.join(", "));
    paastand("tre tegninger er rigtige", rigtige === 3, rigtige);
    paastand("de rettede tegninger har 8 omkring hvert atom og et rigtigt elektronregnskab", retFejl.length === 0, retFejl.join(", "));

    /* ------------------------------------------------------------------ */
    overskrift("4. Byg: forløbet");
    NK.visFane("fane-b");
    var tekster = [];
    function noter() { tekster.push(B.kortTekst()); tekster.push(B.beskedTekst()); }
    function bygFacit(mol) {
        var guard = 0;
        mol.facit.b.forEach(function (fb) {
            for (var t = 0; t < fb[2]; t++) {
                koerF(B, 0.2);
                var ei = B.G.frie.filter(function (x) { return x.enlig && x.id === fb[0]; })[0];
                var ej = B.G.frie.filter(function (x) { return x.enlig && x.id === fb[1]; })[0];
                if (ei && ej) B.forsoegBind(fb[0], ei.side, fb[1], ej.side);
                guard++;
            }
        });
        koerF(B, 0.6);
    }
    var forloebFejl = [];
    var stjerneFejl = [];
    B.tegnede = {};
    D.MOLEKYLER.forEach(function (mol, i) {
        B.vaelg(i);
        noter();
        while (B.trin === "atom") {
            var z = B.atomZ();
            if (B.kanSendes()) forloebFejl.push(mol.id + ": indsend klar før der er tegnet");
            B.tegning = P.standard(z);
            B.indsendKlik();
            noter();
            if (!B.venter) { forloebFejl.push(mol.id + ": atom ikke godkendt"); break; }
            B.knap();
        }
        if (B.trin !== "byg") forloebFejl.push(mol.id + ": ikke på byg");
        if (B.kanSendes()) forloebFejl.push(mol.id + ": indsend klar før en binding");
        bygFacit(mol);
        if (!P.faerdig(B.M).ok) forloebFejl.push(mol.id + ": facit ikke bygget");
        /* Intet bedoemmes, foer eleven trykker Indsend svar */
        koerF(B, 0.5);
        if (B.venter || B.trin !== "byg") forloebFejl.push(mol.id + ": gik videre uden Indsend svar");
        B.indsendKlik();
        noter();
        if (!B.venter) forloebFejl.push(mol.id + ": byg ikke godkendt");
        B.knap();
        if (B.trin !== "tael") forloebFejl.push(mol.id + ": ikke på tæl");
        var st = P.status(B.M, B.omAtom());
        B.talValg = st.nu;
        B.indsendKlik();
        noter();
        koerF(B, 2.5);
        if (!B.faerdig) forloebFejl.push(mol.id + ": ikke løst");
        if (!B.status[i].stjerne) stjerneFejl.push(mol.id);
        if (!B.taelling || !B.taelling.faerdig) forloebFejl.push(mol.id + ": optællingen blev ikke færdig");
    });
    paastand("alle ti molekyler kan bygges, indsendes og tælles", forloebFejl.length === 0, forloebFejl.slice(0, 4).join("; "));
    paastand("rigtigt i første forsøg giver en stjerne", stjerneFejl.length === 0, stjerneFejl.join(", "));
    paastand("optællingen tæller lige så mange prikker, som status siger", (function () {
        var ok = true;
        D.MOLEKYLER.forEach(function (mol) {
            var M = P.facit(mol);
            var pos = {}; M.atomer.forEach(function (a) { pos[a.id] = { x: a.gx * 100, y: a.gy * 100 }; });
            var G = NK.T.geometri(M, pos, 40);
            M.atomer.forEach(function (a) { if (NK.T.atometsPrikker(G, M, a, pos).length !== P.status(M, a).nu) ok = false; });
        });
        return ok;
    }()));

    /* Fejl koster stjernen og giver en forklaring */
    try { W.localStorage.removeItem("nk-sc3.1-b"); } catch (e) { /* ingen hukommelse */ }
    B.status.forEach(function (s) { s.loest = false; s.stjerne = false; });
    B.tegnede = { 1: [0, 1, 0, 0] };
    B.vaelg(1);
    B.tegning = [2, 2, 1, 0];
    B.indsendKlik();
    paastand("O med 5 elektroner: rød linje med et hint om hovedgruppen", /Ikke rigtigt/.test(B.beskedTekst()) && /hovedgruppe/.test(B.beskedTekst()) && !B.venter);
    B.tegning = [2, 2, 2, 0];
    B.indsendKlik();
    paastand("O med par før alle sider har én: forklaringen om bogens regel", /hver sin side/.test(B.beskedTekst()));
    paastand("efter et forkert svar lyser hintknappen", /peg/.test(B.el.knap.className));
    B.tegning = [2, 1, 2, 1];
    B.indsendKlik(); B.knap();
    koerF(B, 0.4);
    var eh = B.G.frie.filter(function (x) { return x.enlig && x.id === 0; })[0], eh2 = B.G.frie.filter(function (x) { return x.enlig && x.id === 2; })[0];
    B.forsoegBind(0, eh.side, 2, eh2.side);
    koerF(B, 0.4);
    B.indsendKlik();
    paastand("H–H i vand: oxygen har stadig uparrede elektroner, og der vises vejen ud", /Oxygen har stadig 2 uparrede/.test(B.beskedTekst()) && /skille det ad/.test(B.beskedTekst()));
    paastand("atomet med uparrede elektroner får en rød ring", B.markering[1] === true);
    P.bryd(B.M, B.M.bindinger[0]); B.efterAendring();
    paastand("når molekylet ændres, forsvinder den røde linje og ringen", !Object.keys(B.markering).length && !/Ikke rigtigt/.test(B.beskedTekst()));
    bygFacit(D.MOLEKYLER[1]);
    B.indsendKlik(); B.knap();
    B.talValg = 6; B.indsendKlik();
    paastand("forkert optælling (6 for O): hint om de fælles elektronpar, og tallet bliver rødt",
        /fælles elektronpar/.test(B.beskedTekst()) && B.talForkert[6] === true && /data-tal="6" disabled/.test(B.el.skort.innerHTML));
    B.nulstil();
    paastand("Byg forfra efter en fejl giver ikke stjernen tilbage", B.fejlet === true && B.trin === "byg");
    bygFacit(D.MOLEKYLER[1]);
    B.indsendKlik(); B.knap();
    B.talValg = 8; B.indsendKlik();
    paastand("løst efter fejl: ingen stjerne, men løst", B.faerdig && B.status[1].loest && !B.status[1].stjerne);

    /* Byg atomet med musen: klik paa en plads saetter, klik paa en elektron
       fjerner, hoejreklik fjerner én */
    B.tegnede = { 1: [0, 1, 0, 0] };
    B.vaelg(1);
    koerF(B, 0.1);
    var la = B.lay, pp = NK.T.pladsPunkter(la.atom.x, la.atom.y, la.stor, 8);
    paastand("kortet siger Byg et oxygenatom og nævner, at et klik fjerner", /Byg atomet/i.test(B.kortTekst()) && /Byg et oxygenatom/.test(B.kortTekst()) && /fjerner den/.test(B.kortTekst()));
    B.nedScene(pp[0]);
    var efter1 = B.tegning.join();
    B.nedScene(pp[0]);
    var efter2 = B.tegning.join();
    paastand("klik på en tom plads sætter en elektron, klik på elektronen fjerner den", efter1 === "1,0,0,0" && efter2 === "0,0,0,0", efter1 + " / " + efter2);
    B.nedScene(pp[0]); B.nedScene(pp[1]);
    paastand("to pladser på samme side giver et par, og Indsend viser antallet", B.tegning.join() === "2,0,0,0" && B.indsendTekst() === "Indsend svar: 2 elektroner");
    var ude = { x: la.atom.x, y: la.atom.y - la.stor * 1.9 };
    B.nedScene(ude);
    paastand("klik ved en fuld side: intet ændres, og kortet siger, at der højst kan sidde 2", B.tegning.join() === "2,0,0,0" && /højst sidde 2/.test(B.beskedTekst()));
    B.hoejreKlik(ude);
    paastand("højreklik ved en side fjerner én elektron", B.tegning.join() === "1,0,0,0");
    B.nedScene({ x: la.atom.x + la.stor * 1.6, y: la.atom.y });
    paastand("klik ved siden af pladserne sætter en elektron på den nærmeste tomme plads", B.tegning.join() === "1,1,0,0");
    B.hoejreKlik({ x: la.atom.x - la.stor * 1.6, y: la.atom.y });
    paastand("højreklik ved en tom side ændrer intet", B.tegning.join() === "1,1,0,0");

    /* Vis svaret i hvert trin */
    B.tegnede = {};
    B.vaelg(6);
    var trin = [];
    var vagt = 0;
    while (!B.faerdig && vagt++ < 30) {
        if (B.venter) { B.knap(); continue; }
        trin.push(B.trin);
        B.knap(); B.knap(); B.knap();
        noter();
    }
    koerF(B, 2.5);
    paastand("Vis svaret fører gennem atom, byg og tæl (CH₂O)", B.faerdig && trin.indexOf("atom") >= 0 && trin.indexOf("byg") >= 0 && trin.indexOf("tael") >= 0, trin.join(","));
    paastand("med Vis svaret: ingen stjerne og et gult kort", !B.status[6].stjerne && /svar/.test(B.el.skort.className));

    /* Laasen: naar kortet er groent, saetter et klik i scenen intet i gang */
    B.tegnede = {};
    B.vaelg(0);
    B.tegning = [0, 1, 0, 0]; B.indsendKlik();
    var foer = B.tegning.join();
    B.nedScene({ x: B.lay.atom.x + B.lay.stor, y: B.lay.atom.y });
    paastand("låst, når kortet er grønt: atomet ændres ikke, og kortet blinker", B.tegning.join() === foer && /blink/.test(B.el.skort.className));
    B.knap();
    koerF(B, 0.4);
    var e0 = B.G.frie.filter(function (x) { return x.enlig; });
    B.forsoegBind(e0[0].id, e0[0].side, e0[1].id, e0[1].side);
    B.indsendKlik();
    koerF(B, 0.4);
    var q0 = B.G.par[0];
    B.el.skort.className = "scenekort loest";
    B.nedScene({ x: q0.x, y: q0.y });
    paastand("låst på det grønne kort: et klik på det fælles par skiller det ikke ad", B.M.bindinger.length === 1 && B.M.bindinger[0].n === 1);
    B.knap();
    B.nedScene({ x: q0.x, y: q0.y });
    paastand("under optællingen: et klik i scenen skiller intet ad og giver en linje på kortet", B.M.bindinger.length === 1 && /Tæl elektronerne/.test(B.beskedTekst()));

    /* ------------------------------------------------------------------ */
    overskrift("5. Find fejlen: forløbet");
    NK.visFane("fane-f");
    var fFejl = [], fStjerne = [];
    function noterF() { tekster.push(Fj.kortTekst()); tekster.push(Fj.beskedTekst()); }
    D.FEJL.forEach(function (o, i) {
        Fj.vaelg(i);
        noterF();
        if (Fj.kanSendes()) fFejl.push((i + 1) + ": indsend klar før valg");
        if (Fj.forkert) {
            Fj.valgt = Fj.forkert.id;
            Fj.indsendKlik(); noterF();
            if (!Fj.venter) fFejl.push((i + 1) + ": atom ikke godkendt");
            Fj.knap();
            Fj.talValg = P.status(Fj.M, Fj.forkert).nu;
            Fj.indsendKlik(); noterF();
        } else {
            Fj.valgt = "ingen";
            Fj.indsendKlik(); noterF();
        }
        koerF(Fj, 2.5);
        if (!Fj.faerdig) fFejl.push((i + 1) + ": ikke løst");
        if (!Fj.status[i].stjerne) fStjerne.push(i + 1);
        if (Fj.forkert && Fj.retAlfa < 0.99) fFejl.push((i + 1) + ": den rettede kom ikke frem");
    });
    paastand("alle tolv tegninger kan løses", fFejl.length === 0, fFejl.join("; "));
    paastand("rigtigt i første forsøg giver en stjerne", fStjerne.length === 0, fStjerne.join(","));
    try { W.localStorage.removeItem("nk-sc3.1-f"); } catch (e) { /* ingen hukommelse */ }
    Fj.status.forEach(function (s) { s.loest = false; s.stjerne = false; });
    Fj.vaelg(0);
    Fj.valgt = 0; Fj.indsendKlik();
    paastand("et rigtigt tegnet atom valgt: rød linje, og animationen tæller højt omkring det", /og det passer/.test(Fj.beskedTekst()) && Fj.taelling && Fj.taelling.id === 0);
    Fj.valgt = "ingen"; Fj.indsendKlik();
    paastand("Ingen fejl, når der er en fejl: rød linje, og knappen bliver rød", /tegnet forkert/.test(Fj.beskedTekst()) && /forkert/.test(Fj.el.skort.innerHTML));
    koerF(Fj, 0.1);
    Fj.nedScene(Fj.pos[1]);
    paastand("et klik på et atom vælger det kun (blå ring), intet bedømmes", Fj.valgt === 1 && !Fj.venter && !Fj.faerdig);
    Fj.indsendKlik(); Fj.knap();
    Fj.talValg = 8; Fj.indsendKlik();
    paastand("optælling: 8 for O med kun bindingerne giver hintet om det, der skal være", /skal være/.test(Fj.beskedTekst()));
    Fj.talValg = 4; Fj.indsendKlik();
    paastand("løst efter fejl: ingen stjerne", Fj.faerdig && !Fj.status[0].stjerne);
    Fj.vaelg(2);
    Fj.valgt = 1; Fj.indsendKlik();
    paastand("en rigtig tegning og et atom valgt: linjen spørger til de andre atomer", /andre atomer også rigtige/.test(Fj.beskedTekst()));
    Fj.vaelg(7);
    Fj.knap(); Fj.knap(); Fj.knap();
    koerF(Fj, 3);
    paastand("Vis svaret: gult kort med svaret og den rettede tegning", Fj.faerdig && /svar/.test(Fj.el.skort.className) && /midten/.test(Fj.kortTekst()) && Fj.retAlfa > 0.99);
    Fj.vaelg(4);
    Fj.valgt = Fj.forkert.id; Fj.indsendKlik();
    var foerV = Fj.valgt;
    koerF(Fj, 0.1);
    Fj.nedScene(Fj.pos[0]);
    paastand("låst på det grønne kort: et klik på et andet atom ændrer intet", Fj.venter && Fj.valgt === foerV);

    /* ------------------------------------------------------------------ */
    overskrift("6. Sproget");
    /* Alle tekster: data, hint, forklaringer og det, kortene har vist */
    var alle = tekster.slice();
    D.MOLEKYLER.forEach(function (m) { alle = alle.concat(m.hint, [m.bygt]); });
    D.FEJL.forEach(function (o) { alle.push(o.hint, o.forklaring); });
    zAlle.forEach(function (z) {
        alle.push(D.atomRigtigt(z));
        for (var t = 1; t <= 8; t++) if (t !== D.EL[z].v) alle.push(D.antalHint(z, t));
    });
    Object.keys(D.AEDELGAS).forEach(function (k) { alle.push(D.AEDELGAS[k]); });
    alle.push(D.FORDELING);
    alle = alle.filter(function (t) { return t && t.trim(); });
    var tankestreg = alle.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger", tankestreg.length === 0, tankestreg.slice(0, 2).join(" | "));
    var ladning = alle.filter(function (t) { return /1[+−-](?!\d)|¹[⁺⁻]/.test(t); });
    paastand("ingen ladning skrevet som 1+ eller 1−", ladning.length === 0, ladning.slice(0, 2).join(" | "));
    var indforstaaet = alle.filter(function (t) {
        return t.split(/(?<=[.?!])\s+/).some(function (s) { return /^(Også|Nu |Her |Den |Det her|Denne )/.test(s.trim()); });
    });
    paastand("intet indforstået: ingen sætning begynder med Også, Nu, Her eller Den", indforstaaet.length === 0, indforstaaet.slice(0, 2).join(" | "));
    var langeHint = [];
    D.MOLEKYLER.forEach(function (m) { m.hint.forEach(function (h) { if (h.length > 175) langeHint.push(m.id + " " + h.length); }); });
    D.FEJL.forEach(function (o, i) { if (o.hint.length > 175) langeHint.push("tegning " + (i + 1)); if (o.forklaring.length > 175) langeHint.push("forklaring " + (i + 1)); });
    paastand("hint og forklaringer højst 175 tegn", langeHint.length === 0, langeHint.join(", "));
    var ascii = alle.filter(function (t) { return /\b(foer|naeste|paa|staar|traek|aendr|loes|oeverst)\b/.test(t); });
    paastand("æ, ø og å i elevens tekster (ingen ae, oe, aa)", ascii.length === 0, ascii.slice(0, 2).join(" | "));

    /* ------------------------------------------------------------------ */
    overskrift("7. Kortet og skærmen (1100 × 700)");
    NK.visFane("fane-b");
    var hoejFejl = [];
    function maalKort(F, navn) {
        F.visKort();
        var h = F.el.skort.getBoundingClientRect().height;
        if (h > F.kortZone()) hoejFejl.push(navn + " " + Math.round(h) + " > " + F.kortZone());
    }
    B.tegnede = {};
    D.MOLEKYLER.forEach(function (mol, i) {
        B.vaelg(i);
        var g = 0;
        while (!B.faerdig && g++ < 30) {
            if (B.venter) { maalKort(B, mol.id + " grøn"); B.knap(); continue; }
            var h = B.hintNu();
            var laengst = h.reduce(function (a, b) { return b.length > a.length ? b : a; }, "");
            B.besked('<span class="b-maerke">Hint 2 af 2</span> ' + NK.html(laengst), "hint");
            maalKort(B, mol.id + " " + B.trin + " hint");
            B.besked("", "");
            B.knap(); B.knap(); B.knap();
        }
        maalKort(B, mol.id + " løst");
    });
    NK.visFane("fane-f");
    D.FEJL.forEach(function (o, i) {
        Fj.vaelg(i);
        Fj.besked('<span class="b-maerke">Hint 2 af 2</span> ' + NK.html(Fj.hintNu()[1]), "hint");
        maalKort(Fj, "tegning " + (i + 1) + " hint");
        Fj.besked("", "");
        Fj.knap(); Fj.knap(); Fj.knap();
        maalKort(Fj, "tegning " + (i + 1) + " løst");
    });
    paastand("kortet kan være på sin plads i alle dele med det længste hint", hoejFejl.length === 0, hoejFejl.slice(0, 4).join(", "));
    var scene = d.querySelector("#fane-f .scene").getBoundingClientRect();
    var nederst = Array.prototype.filter.call(d.querySelectorAll("#fane-b .scene *, #fane-f .scene *"), function (e) {
        if (e.tagName === "CANVAS" || !e.textContent.trim() || e.closest(".scenekort")) return false;
        var r = e.getBoundingClientRect();
        return r.height > 0 && r.top > scene.top + scene.height * 0.5;
    });
    paastand("ingen tekst nederst i scenen", nederst.length === 0, nederst.length);
    paastand("ingen Kemichael og ingen filer uden for mappen", !/kemichael/i.test(d.documentElement.innerHTML) &&
        Array.prototype.every.call(d.scripts, function (s) { return !/\.\.\//.test(s.getAttribute("src") || ""); }));
}
</script>
