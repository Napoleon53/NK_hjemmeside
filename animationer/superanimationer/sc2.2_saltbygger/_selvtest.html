<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest, sc2.2 Saltbyggeren</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1200px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at kemien i data.js stemmer (formler, navne,
   atomtal, ladningsbalance, opløselighed), at ingen opgave kan stilles
   med et stof, der ikke findes, at hvert sæt svarmuligheder har præcis
   ét rigtigt svar, at krystalgitteret holder reglerne for alle salte,
   at den ene opgaveknap virker på begge faner, og at sproget overholder
   reglerne.

   Åbn den gennem en lokal server (eller i Firefox). Chrome nægter en
   side på file:// at kigge ind i sin egen iframe.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () {
    setTimeout(function () {
        try { koer(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); vis(); }
    }, 1400);
});

function koer() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    var i, j;

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) { vis(); return; }
    var D = NK.Data;
    paastand("begge faner er bygget", !!(NK.sims && NK.sims["fane-bord"] && NK.sims["fane-vand"]));

    overskrift("2. Panelerne er fyldt ud ved opstart");
    var skalHaveTekst = ["bord-opgavetekst", "bord-opgaveknap", "vand-opgavetekst", "vand-opgaveknap", "vand-note"];
    var tomme = [];
    for (i = 0; i < skalHaveTekst.length; i++) {
        var e = d.getElementById(skalHaveTekst[i]);
        if (!e || !e.textContent.replace(/\s/g, "")) tomme.push(skalHaveTekst[i]);
    }
    paastand(skalHaveTekst.length + " udlæsninger fyldt ud", tomme.length === 0, "tomme: " + tomme.join(", "));

    overskrift("3. Faneskift: præcis én aktiv ad gangen");
    var faner = ["fane-bord", "fane-vand", "fane-ukendt", "fane-bord"];
    for (i = 0; i < faner.length; i++) {
        var knap = d.querySelector('.faneknap[data-fane="' + faner[i] + '"]');
        knap.click();
        var afsnit = d.querySelectorAll(".fane.aktiv");
        var knapper = d.querySelectorAll(".faneknap.aktiv");
        paastand(faner[i] + ": 1 afsnit + 1 knap",
            afsnit.length === 1 && knapper.length === 1 && afsnit[0].id === faner[i] && knapper[0] === knap,
            afsnit.length + " afsnit / " + knapper.length + " knapper");
    }

    overskrift("4. Formler");
    var formler = [["Al", "SO4", "Al₂(SO₄)₃"], ["NH4", "SO4", "(NH₄)₂SO₄"], ["Ca", "OH", "Ca(OH)₂"],
        ["Na", "HCO3", "NaHCO₃"], ["Fe3", "SO4", "Fe₂(SO₄)₃"], ["Ca", "PO4", "Ca₃(PO₄)₂"],
        ["K", "CO3", "K₂CO₃"], ["NH4", "NO3", "NH₄NO₃"], ["Ag", "NO3", "AgNO₃"], ["Al", "OH", "Al(OH)₃"],
        ["Mg", "PO4", "Mg₃(PO₄)₂"], ["Na", "Cl", "NaCl"], ["NH4", "PO4", "(NH₄)₃PO₄"], ["Fe2", "SO4", "FeSO₄"]];
    for (i = 0; i < formler.length; i++) {
        var fs = D.salt(formler[i][0], formler[i][1]);
        paastand(formler[i][0] + " + " + formler[i][1] + " -> " + fs.formel, fs.formel === formler[i][2],
            "ventede " + formler[i][2]);
    }

    overskrift("5. Navne");
    var navne = [["Al", "SO4", "aluminiumsulfat"], ["NH4", "SO4", "ammoniumsulfat"], ["Ca", "OH", "calciumhydroxid"],
        ["Na", "HCO3", "natriumhydrogencarbonat"], ["Fe3", "SO4", "jern(III)sulfat"], ["Fe2", "OH", "jern(II)hydroxid"],
        ["Cu", "NO3", "kobber(II)nitrat"], ["Ag", "PO4", "sølvphosphat"], ["Ca", "PO4", "calciumphosphat"]];
    for (i = 0; i < navne.length; i++) {
        var ns = D.salt(navne[i][0], navne[i][1]);
        paastand(ns.formel + " -> " + ns.navn, ns.navn === navne[i][2], "ventede " + navne[i][2]);
    }

    overskrift("6. Atomerne i formlen");
    var atomer = [["Al", 2, "SO4", 3, "Al 2  ·  S 3  ·  O 12"], ["NH4", 2, "SO4", 1, "N 2  ·  H 8  ·  S 1  ·  O 4"],
        ["Ca", 1, "NO3", 2, "Ca 1  ·  N 2  ·  O 6"], ["Na", 1, "HCO3", 1, "Na 1  ·  H 1  ·  C 1  ·  O 3"]];
    for (i = 0; i < atomer.length; i++) {
        var a = atomer[i];
        var tekst = D.atomTekst(D.atomtal(D.ion(a[0]), a[1], D.ion(a[2]), a[3]));
        paastand(D.formel(D.ion(a[0]), D.ion(a[2]), a[1], a[3]) + " -> " + tekst, tekst === a[4], "ventede " + a[4]);
    }

    overskrift("7. Alle opgaver: ladningsbalance, mindste forhold, findes");
    var lister = [["navn → formel", D.NAVN_OPGAVER], ["formel → navn", D.FORMEL_OPGAVER], ["opløsning", D.VAND_OPGAVER]];
    for (i = 0; i < lister.length; i++) {
        var daarlige = [];
        for (j = 0; j < lister[i][1].length; j++) {
            var o = lister[i][1][j];
            var s = D.salt(o.kat, o.an);
            var balance = s.p * s.kat.q + s.n * s.an.q;
            if (balance !== 0 || NK.gcd(s.p, s.n) !== 1 || D.findesIkke(s.kat, s.an)) daarlige.push(s.formel);
        }
        paastand(lister[i][0] + ": " + lister[i][1].length + " opgaver er neutrale, forkortede og findes",
            daarlige.length === 0, daarlige.join(", "));
    }

    overskrift("8. Svarmulighederne: fire forskellige, præcis ét rigtigt svar");
    function tjekValg(navn, valg, ventet) {
        var set = {}, rigtige = 0, udenGrund = 0;
        for (var k = 0; k < valg.length; k++) {
            set[valg[k].tekst] = 1;
            if (valg[k].rigtig) rigtige++;
            if (!valg[k].forklaring) udenGrund++;
        }
        var unikke = Object.keys(set).length;
        var rigtigTekst = valg.filter(function (v) { return v.rigtig; }).map(function (v) { return v.tekst; })[0];
        if (valg.length !== 4 || unikke !== 4 || rigtige !== 1 || udenGrund || rigtigTekst !== ventet) {
            return navn + " (" + valg.length + " svar, " + unikke + " unikke, " + rigtige + " rigtige, svar: " + rigtigTekst + ")";
        }
        return null;
    }
    var problemer = [];
    for (j = 0; j < D.NAVN_OPGAVER.length; j++) {
        var n2 = D.NAVN_OPGAVER[j], s2 = D.salt(n2.kat, n2.an);
        var p2 = tjekValg(s2.formel, D.formelValg(s2.kat, s2.an), s2.formel);
        if (p2) problemer.push(p2);
    }
    paastand("formelValg for " + D.NAVN_OPGAVER.length + " opgaver", problemer.length === 0, problemer.slice(0, 4).join(" | "));

    problemer = [];
    for (j = 0; j < D.FORMEL_OPGAVER.length; j++) {
        var n3 = D.FORMEL_OPGAVER[j], s3 = D.salt(n3.kat, n3.an);
        var p3 = tjekValg(s3.navn, D.navneValg(s3.kat, s3.an), s3.navn);
        if (p3) problemer.push(p3);
    }
    paastand("navneValg for " + D.FORMEL_OPGAVER.length + " opgaver", problemer.length === 0, problemer.slice(0, 4).join(" | "));

    problemer = [];
    for (j = 0; j < D.VAND_OPGAVER.length; j++) {
        var n4 = D.VAND_OPGAVER[j], s4 = D.salt(n4.kat, n4.an);
        var p4 = tjekValg(s4.formel + " opløst", D.oploesValg(s4), D.oploesHoejre(s4));
        if (p4) problemer.push(p4);
        var p5 = tjekValg(s4.formel + " talt", D.saltValg(s4, 3), s4.formel);
        if (p5) problemer.push(p5);
    }
    paastand("oploesValg og saltValg for " + D.VAND_OPGAVER.length + " opgaver", problemer.length === 0,
        problemer.slice(0, 4).join(" | "));

    overskrift("9. Opløselighed");
    var ikkeLet = [];
    for (j = 0; j < D.VAND_OPGAVER.length; j++) {
        var v4 = D.VAND_OPGAVER[j];
        if (D.oploeselighed(D.ion(v4.kat), D.ion(v4.an)) !== "let") ikkeLet.push(v4.kat + v4.an);
    }
    paastand("alle salte på vandfanen er letopløselige", ikkeLet.length === 0, ikkeLet.join(", "));
    var opl = [["Ba", "SO4", "tung"], ["Ag", "Cl", "tung"], ["Na", "Cl", "let"], ["Ca", "PO4", "tung"],
        ["Mg", "OH", "tung"], ["Ba", "OH", "let"], ["K", "PO4", "let"], ["NH4", "OH", "findes-ikke"],
        ["Na", "O", "reagerer"], ["Cu", "NO3", "let"]];
    for (i = 0; i < opl.length; i++) {
        var art = D.oploeselighed(D.ion(opl[i][0]), D.ion(opl[i][1]));
        paastand(D.salt(opl[i][0], opl[i][1]).formel + " -> " + art, art === opl[i][2], "ventede " + opl[i][2]);
    }

    overskrift("10. Tegningen passer med formlen");
    var uenige = [];
    var alleIoner = D.IONER.concat(D.UKENDTE);
    for (i = 0; i < alleIoner.length; i++) {
        var ion = alleIoner[i];
        if (!ion.sammensat) continue;
        var tegnet = {};
        ion.atomer.forEach(function (at) { tegnet[at[0]] = (tegnet[at[0]] || 0) + 1; });
        D.sammensaetning(ion).forEach(function (at) {
            if (tegnet[at[0]] !== at[1]) uenige.push(ion.formel + ": " + at[0] + " " + at[1] + " i formlen, "
                + (tegnet[at[0]] || 0) + " i tegningen");
        });
    }
    paastand("alle sammensatte ioner er tegnet med de rigtige atomer", uenige.length === 0, uenige.join(" | "));

    overskrift("11. Bordet");
    var fb = NK.sims["fane-bord"];
    var b = fb.bord;
    fb.visFrit();
    b.ryd();
    b.vaelg(D.ion("Al"));
    b.vaelg(D.ion("SO4"));
    paastand("Al³⁺ + SO₄²⁻ giver +3 mod −2", b.plus() === 3 && b.minus() === 2 && !b.neutral(),
        b.plus() + " / " + b.minus());
    b.tilfoej("kat");
    b.tilfoej("an");
    b.tilfoej("an");
    paastand("2 Al³⁺ og 3 SO₄²⁻ er neutralt og forkortet", b.neutral() && b.forkortet());
    b.tilfoej("kat");
    b.tilfoej("an");
    paastand("én mere af hver bryder balancen igen", b.plus() === 9 && b.minus() === 8 && !b.neutral(),
        b.plus() + " / " + b.minus());
    b.tilfoej("kat");
    b.tilfoej("an");
    b.tilfoej("an");
    paastand("4 Al³⁺ og 6 SO₄²⁻ er neutralt, men ikke forkortet", b.neutral() && !b.forkortet(),
        b.nKat + " : " + b.nAn);
    b.vaelg(D.ion("Na"));
    paastand("ny positiv ion nulstiller antallet", b.kat.id === "Na" && b.nKat === 1, b.nKat + " stk.");
    b.ryd();
    paastand("Ryd bordet tømmer begge rækker", !b.kat && !b.an && b.nKat === 0 && b.nAn === 0);

    /* Træk fra hylden: browseren må hverken markere hylden som tekst
       eller slæbe den med som et billede, og ionen skal lande. */
    var cw = ramme.contentWindow, chip = b.chips["Ca"];
    var cs = cw.getComputedStyle(chip);
    paastand("hylden kan ikke markeres som tekst", (cs.userSelect || cs.webkitUserSelect) === "none",
        cs.userSelect || cs.webkitUserSelect);
    var dragEv = new cw.Event("dragstart", { bubbles: true, cancelable: true });
    chip.dispatchEvent(dragEv);
    paastand("browserens eget træk er slået fra på hylden", dragEv.defaultPrevented);
    d.querySelector('.faneknap[data-fane="fane-bord"]').click();
    b.opdater(1 / 60);
    var cr = b.canvas.getBoundingClientRect(), chr = chip.getBoundingClientRect();
    function pe(type, x, y) {
        return new cw.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, button: 0,
            clientX: x, clientY: y, pointerType: "mouse", isPrimary: true });
    }
    var ned = pe("pointerdown", chr.left + 10, chr.top + 10);
    chip.dispatchEvent(ned);
    chip.dispatchEvent(pe("pointermove", chr.left + 40, chr.top + 80));
    chip.dispatchEvent(pe("pointermove", cr.left + cr.width / 2, cr.top + b.g.zy - 40));
    chip.dispatchEvent(pe("pointerup", cr.left + cr.width / 2, cr.top + b.g.zy - 40));
    paastand("pointerdown på en ion starter ikke en tekstmarkering", ned.defaultPrevented);
    paastand("en Ca²⁺ trukket ned på bordet lander dér", b.kat && b.kat.id === "Ca" && b.nKat === 1,
        b.kat ? b.kat.id + " × " + b.nKat : "ingen");
    b.ryd();
    b.slugKlik = false;
    b.saet(D.ion("Mg"), 2, D.ion("SO4"), 2);
    for (i = 0; i < 90; i++) b.opdater(1 / 60);
    paastand("2 Mg²⁺ og 2 SO₄²⁻ giver en note om ens enheder", /2 ens enheder/.test(b.note()), b.note());
    b.saet(D.ion("Al"), 2, D.ion("CO3"), 3);
    for (i = 0; i < 90; i++) b.opdater(1 / 60);
    paastand("Al₂(CO₃)₃ giver en note om, at stoffet ikke findes", /findes ikke/.test(b.note()), b.note());
    b.ryd();
    b.vaelg(D.ion("Ca"));
    b.vaelg(D.ion("PO4"));
    b.afstem();
    for (i = 0; i < 900 && b.demo; i++) b.opdater(1 / 60);
    paastand("Afstem for mig ender i Ca₃(PO₄)₂", b.nKat === 3 && b.nAn === 2 && !b.demo, b.nKat + " : " + b.nAn);
    b.ryd();

    overskrift("12. Byggefanen: den ene opgaveknap");
    var knap = d.getElementById("bord-opgaveknap");
    fb.visFrit();
    paastand("sandkassen viser Start opgave og knapperne til bordet",
        knap.textContent === "Start opgave" && !d.getElementById("byg-knapper").hidden && d.getElementById("bord-afslut").hidden);
    knap.click();
    paastand("Start opgave giver en opgave og knappen Giv hint",
        !!fb.opgave && fb.fase === "byg" && knap.textContent === "Giv hint" && d.getElementById("byg-knapper").hidden,
        knap.textContent);
    knap.click();
    paastand("Giv hint viser et hint og knappen Vis svaret",
        d.getElementById("bord-hint").textContent.length > 10 && knap.textContent === "Vis svaret", knap.textContent);
    var loestFoer = fb.loeste;
    knap.click();
    paastand("Vis svaret løser opgaven uden at tælle med", fb.fase === "faerdig" && fb.loeste === loestFoer
        && knap.textContent === "Ny opgave");
    knap.click();
    paastand("Ny opgave giver en ny opgave i den anden retning", fb.fase === "byg" && knap.textContent === "Giv hint"
        && fb.retning === "formel", fb.retning);
    d.getElementById("bord-afslut").click();
    paastand("Afslut fører tilbage til sandkassen", !fb.opgave && knap.textContent === "Start opgave"
        && !d.getElementById("byg-knapper").hidden);

    overskrift("13. Opgave: fra navn til formel");
    fb.startOpgave(D.salt("Al", "SO4"), "navn");
    paastand("formlen under bordet er slået fra under opgaven", !fb.bord.visFormel);
    fb.bord.vaelg(D.ion("S"));
    var besked = d.getElementById("bord-besked").textContent;
    paastand("sulfid i stedet for sulfat giver en besked om forskellen", /sulfid/.test(besked) && /sulfat/.test(besked), besked);
    fb.bord.saet(D.ion("Al"), 4, D.ion("SO4"), 6);
    paastand("4 : 6 åbner ikke formelvalget", fb.fase === "byg");
    fb.bord.saet(D.ion("Al"), 2, D.ion("SO4"), 3);
    paastand("de rigtige ioner åbner formelvalget", fb.fase === "valg" && fb.svar.knapper.length === 4);
    var rigtig2 = -1;
    for (i = 0; i < fb.svar.valg.length; i++) if (fb.svar.valg[i].rigtig) rigtig2 = i;
    loestFoer = fb.loeste;
    fb.svar.knapper[rigtig2].click();
    paastand("rigtigt svar tæller med, og knappen bliver Ny opgave",
        fb.fase === "faerdig" && fb.loeste === loestFoer + 1 && knap.textContent === "Ny opgave", "løst: " + fb.loeste);

    overskrift("13b. Opgave: fra formel til navn");
    fb.startOpgave(D.salt("Fe3", "SO4"), "formel");
    fb.bord.saet(D.ion("Fe2"), 2, D.ion("SO4"), 3);
    besked = d.getElementById("bord-besked").textContent;
    paastand("Fe²⁺ med formlens tal giver besked om ladningen", fb.fase === "byg" && /Jern findes/.test(besked), besked);
    paastand("hintet spørger efter ladningen", /ladning/.test(fb.hint()), fb.hint());
    fb.bord.saet(D.ion("Fe3"), 2, D.ion("SO4"), 3);
    paastand("Fe³⁺ åbner navnevalget", fb.fase === "valg");
    var rigtig3 = -1;
    for (i = 0; i < fb.svar.valg.length; i++) if (fb.svar.valg[i].rigtig) rigtig3 = i;
    paastand("det rigtige navn er jern(III)sulfat", fb.svar.valg[rigtig3].tekst === "jern(III)sulfat",
        fb.svar.valg[rigtig3].tekst);
    fb.visFrit();

    overskrift("13c. Hints findes for alle opgaver og alle trin");
    var tommeHints = [];
    D.NAVN_OPGAVER.forEach(function (o) {
        var s = D.salt(o.kat, o.an);
        fb.startOpgave(s, "navn");
        if (!fb.hint()) tommeHints.push(s.formel + " byg");
        fb.bord.saet(s.kat, s.p, s.an, s.n);
        if (fb.fase !== "valg" || !fb.hint()) tommeHints.push(s.formel + " valg");
    });
    D.FORMEL_OPGAVER.forEach(function (o) {
        var s = D.salt(o.kat, o.an);
        fb.startOpgave(s, "formel");
        if (!fb.hint()) tommeHints.push(s.formel + " byg");
        fb.bord.saet(s.kat, s.p, s.an, s.n);
        if (fb.fase !== "valg" || !fb.hint()) tommeHints.push(s.formel + " valg");
    });
    paastand("hint og formel- eller navnevalg for " + (D.NAVN_OPGAVER.length + D.FORMEL_OPGAVER.length) + " opgaver",
        tommeHints.length === 0, tommeHints.slice(0, 4).join(", "));
    fb.visFrit();

    overskrift("14. Skjul navnene, ogsaa i tooltip og beskeder");
    var navneBoks = d.getElementById("byg-navne");
    navneBoks.checked = false;
    navneBoks.dispatchEvent(new ramme.contentWindow.Event("change"));
    paastand("hylden skjuler navnene", d.getElementById("bord-scene").classList.contains("skjul-navne"));
    paastand("en ions tooltip viser kun formlen", fb.bord.chips["Na"].title === "Na⁺", fb.bord.chips["Na"].title);
    fb.startOpgave(D.salt("Na", "Cl"), "navn");
    fb.bord.vaelg(D.ion("O"));
    besked = d.getElementById("bord-besked").textContent;
    paastand("fejlbeskeden nævner ikke ionernes navne", !!besked && besked.indexOf("oxid") < 0 && besked.indexOf("chlorid") < 0, besked);
    navneBoks.checked = true;
    navneBoks.dispatchEvent(new ramme.contentWindow.Event("change"));
    paastand("navnene vises igen", fb.bord.chips["Na"].title === "natriumion  Na⁺", fb.bord.chips["Na"].title);
    fb.visFrit();

    overskrift("15. Vandfanen: sandkassen");
    var f4 = NK.sims["fane-vand"];
    d.querySelector('.faneknap[data-fane="fane-vand"]').click();
    f4.tilpas();
    function koerVand(sek) { for (var t = 0; t < sek * 60; t++) { f4.tilpas(); f4.opdater(1 / 60); } }
    paastand("lærredet har fået en rigtig størrelse", f4.l.b > 50, "l.b=" + f4.l.b);
    f4.haeldSalt("Na", "SO4");
    var antal = { kat: 0, an: 0 };
    f4.ioner.forEach(function (o) { antal[o.ion.q > 0 ? "kat" : "an"]++; });
    paastand("krystallen har 2 Na⁺ pr. SO₄²⁻", antal.kat === 2 * antal.an, antal.kat + " Na⁺ / " + antal.an + " SO₄²⁻");
    koerVand(9);
    paastand("natriumsulfat går i opløsning, og ligningen står", f4.fase === "oploest" && f4.ligning, f4.fase);
    f4.haeldSalt("Ba", "SO4");
    koerVand(2);
    paastand("bariumsulfat bliver liggende", f4.art === "tung" && f4.fase === "tung" && !f4.ligning, f4.fase);
    f4.haeldSalt("NH4", "OH");

    fb2.springIntro();
    koerB(1);
    ["fane-bord", "fane-vand", "fane-ukendt"].forEach(function (f) { cw.localStorage.removeItem("nk-sc2.2-intro-" + f); });
    fb2.startIntro(false);
    koerB(1.5);
    var tilbudB = d.getElementById("bord-tilbud");
    paastand("første gang: der står Start præsentation og Nej tak, og han kommer ikke af sig selv",
        !tilbudB.hidden && !fb2.laererIIntro() && !(fb2.introVent > 0));
    tilbudB.querySelector(".tilbud-start").click();
    koerB(4);
    var spring = d.getElementById("bord-spring");
    paastand("Start præsentation: han går ind og præsenterer, og knappen Spring præsentationen over står der",
        fb2.laererIIntro() && !spring.hidden && fb2.introTrin >= 1 && cw.localStorage.getItem("nk-sc2.2-intro-fane-bord") === "true",
        fb2.laererIIntro() + " / " + spring.hidden + " / " + fb2.introTrin + " / " + cw.localStorage.getItem("nk-sc2.2-intro-fane-bord"));
    var opgaveFoer = fb2.opgave;
    d.getElementById("bord-opgaveknap").click();
    paastand("præsentationen låser ikke: opgaven kan startes, og han bliver", !opgaveFoer && !!fb2.opgave && fb2.laererIIntro());
    fb2.visFrit();
    klikB(fb2.L.b - 5, fb2.L.h - 5);
    paastand("et klik ved siden af ham sender ham ikke ud", fb2.laererIIntro());
    var s2 = fb2.laererLaerredSkala(), Lb = fb2.laerer;
    var hx = Lb.x * s2, hy = (Lb.y + 60) * s2;
    klikB(hx, hy);
    paastand("første klik på ham: han bliver, og knappen blinker", fb2.laererIIntro() && spring.classList.contains("puf"));
    klikB(hx, hy);
    koerB(0.2);
    paastand("andet klik på ham sender ham ud", !fb2.laererIIntro() && spring.hidden);
    fb2.startIntro(false);
    koerB(1.5);
    paastand("anden gang i samme browser præsenterer han ikke", !fb2.laererIIntro());
    tast("k");
    koerB(0.5);
    paastand("K får ham til at præsentere igen", fb2.laererIIntro() && !spring.hidden);
    tast("Escape");
    koerB(0.2);
    paastand("Esc sender ham ud", !fb2.laererIIntro() && spring.hidden);
    tast("k");
    koerB(0.5);
    spring.click();
    koerB(0.2);
    paastand("knappen sender ham ud", !fb2.laererIIntro() && spring.hidden);
    paastand("replikkerne er to eller tre pr. fane og korte", ["fane-bord", "fane-vand", "fane-ukendt"].every(function (f) {
        var l = D.INTRO[f].linjer;
        return l.length >= 2 && l.length <= 3 && l.every(function (x) { return x.length <= 70; });
    }));
    var skala = fb2.laererLaerredSkala();
    paastand("Kemichael tegnes i samme størrelse som i sc2.3, og kitlen stopper ved lærredets bund",
        Math.abs(skala - NK.klamp(fb2.L.h / 600 * 0.92, 0.45, 1.25)) < 1e-9
        && Math.abs(NK.Scene.GULV - fb2.L.h / skala) < 1e-6, skala + " / " + NK.Scene.GULV);
    ["fane-vand", "fane-ukendt"].forEach(function (f) {
        var sim = NK.sims[f];
        sim.startIntro(true);
        for (var t = 0; t < 60; t++) { sim.tilpas(); sim.opdater(1 / 60); }
        var ok = sim.laererIIntro() && !d.getElementById(f === "fane-vand" ? "vand-spring" : "ukendt-spring").hidden;
        sim.springIntro();
        for (t = 0; t < 12; t++) { sim.tilpas(); sim.opdater(1 / 60); }
        paastand(f + ": præsentationen kan startes og stoppes", ok && !sim.laererIIntro());
    });

    overskrift("17. Ioner med ladningen 1 hedder + eller −, ikke 1+ eller 1−");
    var ladn = [[1, "+"], [-1, "−"], [2, "2+"], [-3, "3−"], [0, "0"]];
    for (i = 0; i < ladn.length; i++) {
        paastand("ladningstekst(" + ladn[i][0] + ") = \"" + ladn[i][1] + "\"",
            NK.ladningstekst(ladn[i][0]) === ladn[i][1], "fik \"" + NK.ladningstekst(ladn[i][0]) + "\"");
    }
    paastand("Na⁺ er skrevet uden 1-tal", D.ionTekst(D.ion("Na")) === "Na⁺", D.ionTekst(D.ion("Na")));

    overskrift("18. Sproget: ingen tankestreger og ingen 1+ eller 1−");
    var tekster = [];
    function saml(t, hvor) { if (t) tekster.push([String(t), hvor]); }
    var kopi = d.body.cloneNode(true);
    Array.prototype.forEach.call(kopi.querySelectorAll("script"), function (sc) { sc.parentNode.removeChild(sc); });
    saml(kopi.textContent, "index.html");
    D.NAVN_OPGAVER.concat(D.FORMEL_OPGAVER).forEach(function (o) {
        var s = D.salt(o.kat, o.an);
        D.formelValg(s.kat, s.an).concat(D.navneValg(s.kat, s.an)).forEach(function (v) { saml(v.tekst + " " + v.forklaring, s.formel); });
    });
    D.VAND_OPGAVER.forEach(function (o) {
        var s = D.salt(o.kat, o.an);
        D.oploesValg(s).concat(D.saltValg(s, 3)).forEach(function (v) { saml(v.tekst + " " + v.forklaring, s.formel + " vand"); });
    });
    D.KATIONER.forEach(function (k) { D.ANIONER.forEach(function (a) { saml(D.findesIkke(k, a), k.id + a.id); }); });
    ["fane-bord", "fane-vand", "fane-ukendt"].forEach(function (f) {
        NK.Rundvisning.ture[f].forEach(function (t) { saml(t.titel + " " + t.tekst, "rundvisning"); });
    });
    var fu3 = NK.sims["fane-ukendt"];
    ["fane-bord", "fane-vand", "fane-ukendt"].forEach(function (f) { D.INTRO[f].linjer.forEach(function (l) { saml(l, "præsentation " + f); }); });
    NK.Opslag.aabn("pt", "O");
    saml(d.getElementById("opslag-pt").textContent + " " + d.getElementById("opslag-ioner").textContent, "plakaterne");
    NK.Opslag.luk();
    D.UKENDT_OPGAVER.forEach(function (o) {
        var s = D.salt(o.kat, o.an);
        var valg = o.side === "kat" ? D.romertalValg(s.kat, s.an) : D.formelValg(D.ion(o.partner), s.an);
        valg.forEach(function (v) { saml(v.tekst + " " + v.forklaring, s.formel + " ukendt"); });
        var kendtIon = D.ion(o.side === "kat" ? o.an : o.kat);
        D.kendtValg(kendtIon).forEach(function (v) { saml(v.tekst + " " + v.forklaring, kendtIon.formel + " kendt"); });
        if (o.partner) D.kendtValg(D.ion(o.partner)).forEach(function (v) { saml(v.tekst + " " + v.forklaring, o.partner + " partner"); });
        fu3.startOpgave(o);
        saml(d.getElementById("ukendt-opgavetekst").textContent + " " + d.querySelector("#ukendt-opgavekort .trin").textContent, s.formel + " intro");
        fu3.begynd();
        saml(fu3.hint() + " " + d.getElementById("ukendt-opgavetekst").textContent, s.formel + " trin 1");
        vaelgRigtig(fu3);
        saml(fu3.hint() + " " + fu3.regnskab() + " " + d.getElementById("ukendt-note").textContent + " "
            + d.getElementById("ukendt-besked").textContent + " " + d.getElementById("ukendt-opgavetekst").textContent, s.formel + " trin 2");
        for (var gq = 1; gq <= D.UKENDT_MAKS; gq++) {
            if (fu3.fase !== "ladning") break;
            fu3.bord.saetGaet(gq);
            saml(d.getElementById("ukendt-note").textContent, s.formel + " skub " + gq);
        }
        if (fu3.fase === "partner") {
            saml(fu3.hint() + " " + d.getElementById("ukendt-opgavetekst").textContent + " "
                + d.getElementById("ukendt-spm").textContent, s.formel + " partner");
            vaelgRigtig(fu3);
        }
        saml(fu3.hint() + " " + d.getElementById("ukendt-besked").textContent + " "
            + d.getElementById("ukendt-spm").textContent + " " + d.getElementById("ukendt-opgavetekst").textContent + " "
            + d.querySelector("#ukendt-opgavekort .trin").textContent, s.formel + " sidste trin");
        vaelgRigtig(fu3);
        saml(d.getElementById("ukendt-besked").textContent, s.formel + " løst");
    });
    NK.Opslag.luk();
    var sprogFejl = [];
    tekster.forEach(function (t) {
        if (/[—–]/.test(t[0])) sprogFejl.push(t[1] + ": tankestreg");
        if (/(^|[^0-9,.])1[+−-](?![0-9])|¹[⁺⁻]/.test(t[0])) sprogFejl.push(t[1] + ": 1+ eller 1−");
    });
    paastand(tekster.length + " tekster er uden tankestreger og 1+ eller 1−", sprogFejl.length === 0, sprogFejl.slice(0, 4).join(" | "));

    overskrift("19. Rundvisningen peger på noget, der findes");
    var mangler = [];
    ["fane-bord", "fane-vand", "fane-ukendt"].forEach(function (f) {
        NK.Rundvisning.ture[f].forEach(function (t) { if (!d.querySelector(t.sel)) mangler.push(t.sel); });
    });
    paastand("alle trin i rundvisningen har et mål", mangler.length === 0, mangler.join(", "));

    vis();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
