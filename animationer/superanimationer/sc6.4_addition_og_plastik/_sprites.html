<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc6.4 Addition og plastik</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:"Segoe UI",sans-serif; margin:0; padding:24px; }
    h1 { font-size:1.1rem; margin:0 0 4px; }
    p { margin:0 0 20px; color:#a9b0ba; font-size:0.9rem; }
    .raekke { display:flex; gap:48px; align-items:flex-end; flex-wrap:wrap; }
    figure { margin:0; text-align:center; }
    figcaption { margin-top:10px; font-size:0.85rem; color:#cfd6de; }
    .bund { background:#1d1e26; border:1px solid #33343f; border-radius:10px; padding:20px 28px; }
</style>
</head>
<body>
<!-- Udviklerværktøj. Indgår ikke i animationen og kan slettes.
     Viser de to sprites alene, så de kan bedømmes, før de er i bevægelse. -->
<h1>Sprites i sc6.4</h1>
<p>Indholdet i reagensglasset (bromvand og carbonhydrid) tegnes af animationen bag glasset. Molekylerne er ikke sprites; de tegnes som strukturformler i koden.</p>
<div class="raekke">
    <figure><div class="bund"><img src="sprites/reagensglas.svg" width="120" alt="Reagensglas med prop"></div><figcaption>reagensglas.svg (fane 2)</figcaption></figure>
    <figure><div class="bund"><img src="sprites/reagensglas.svg" width="60" alt="Reagensglas med prop"></div><figcaption>i den størrelse, det har i scenen</figcaption></figure>
    <figure><div class="bund"><img src="sprites/frysepose.svg" width="200" alt="Frysepose med ærter"></div><figcaption>frysepose.svg (fane 3, zoomet ud)</figcaption></figure>
</div>
</body>
</html>
