<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc6.4 Addition og plastik</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:760px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at atomerne går op i alle additioner, at
   hvert carbonatom har fire bindinger før og efter, at bromvandet
   affarves af alkenerne og kun af dem, at luppen viser det, modellen
   siger, at alle opgaver på de tre faner kan løses (selv med mus og
   klik, med forkerte svar og med Vis svaret), at startbilledet kun
   viser det, første trin har brug for, at al tekst står på kortet øverst
   i scenen, at intet er indforstået, at sproget holder reglerne, og at
   tingene kan være der fra 1100 × 620 til 1600 × 950 (kortet måles i
   alle dele af alle opgaver, også med hvert hint og hvert forkert svar).

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + String(note).replace(/</g, "&lt;") + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sc6.4-a", "nk-sc6.4-b", "nk-sc6.4-p"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|staa|paa|foerst|hoejre|haeld\w*|oeverst|loest|proev\w*|vaeske\w*|maal|gaet\w*|spoerg\w*|taet|faa|saa|naar|kaede\w*|maettet|umaettet|traek\w*)\b/i;
var gemt = {};
/* naboens fremskridt (sc7.5) maa ikke blive roert af denne animation */
var gemtAndre = null;
try { gemtAndre = window.localStorage.getItem("nk-sc7.5-g"); } catch (e) { gemtAndre = null; }
var ramme = document.getElementById("ramme");
var trin = 0;

/* Første indlæsning: gem elevens fremskridt, ryd det, og indlæs siden igen,
   så fanerne begynder ved første opgave. Anden indlæsning: kør testen. */
ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 1200); }
});

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Kør en fane sek sekunder */
function koerF(F, sek) { for (var t = 0; t < sek; t += 1 / 60) F.opdater(1 / 60); }
function taet(a, b, tol) { return Math.abs(a - b) <= tol; }

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, K = NK.Kemi;
    var A = NK.sims["fane-a"], B = NK.sims["fane-b"], P = NK.sims["fane-p"];
    /* Al tekst staar paa kortet oeverst i scenen. statuslinje er beskeden i kortets
       nederste raekke (hint, fejl, klik og det, scenen har at tilfoeje); kortT er
       kortets hovedtekst (opgaven, spoergsmaalet eller forklaringen) */
    function statuslinje(X) { return X.el.besked.hidden ? "" : X.beskedTekst(); }
    function kortT(X) { var e = X.el.skort.querySelector(".sk-tekst") || X.el.skort.querySelector(".gk-tekst"); return e ? e.textContent : ""; }
    function linje(X) { return statuslinje(X); }
    function klasse(X) { return X.el.status.className; }
    function roed(X) { return /skidt/.test(klasse(X)); }
    function knaptekst(X) { return X.el.knap.textContent; }
    function videre(X) { return X.el.skort.querySelector(".sk-videre"); }
    function svarknapper(X) { return X.el.skort.querySelectorAll("[data-valg]"); }
    /* Er der en mellemtilstand med Næste spørgsmål, så gå videre fra den */
    function frem(X) { for (var n = 0; n < 3 && X.venter; n++) X.knap(); }
    /* Tryk på hjælpeknappen, til opgaven er løst (hint, hint, hint, Vis svaret ...) */
    function visSvaret(X, i) {
        X.vaelg(i);
        for (var n = 0; n < 30 && !X.faerdig; n++) { X.knap(); koerF(X, 0.1); }
        return X.faerdig;
    }
    function rigtigt(X) { var del = X.opg.o[X.opg.fase], j = -1; del.svar.forEach(function (s, i) { if (s.ok) j = i; }); return j; }
    function forkert(X) { var del = X.opg.o[X.opg.fase], j = -1; del.svar.forEach(function (s, i) { if (!s.ok && j < 0) j = i; }); return j; }
    /* En rigtig mus på lærredet (syntetiske hændelser) */
    function mus(X, type, x, y) {
        var r = X.L.canvas.getBoundingClientRect();
        var e = new W.PointerEvent(type, { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y, button: 0, pointerId: 1 });
        X.L.canvas.dispatchEvent(e);
    }
    function klik(X, x, y) {
        mus(X, "pointermove", x, y); mus(X, "pointerdown", x, y); mus(X, "pointerup", x, y);
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.MouseEvent("click", { bubbles: true, clientX: r.left + x, clientY: r.top + y }));
    }
    function traek(X, x0, y0, x1, y1) {
        mus(X, "pointermove", x0, y0); mus(X, "pointerdown", x0, y0);
        mus(X, "pointermove", (x0 + x1) / 2, (y0 + y1) / 2); mus(X, "pointermove", x1, y1);
        mus(X, "pointerup", x1, y1);
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.MouseEvent("click", { bubbles: true, clientX: r.left + x1, clientY: r.top + y1 }));
    }
    function sum(a, b) { var ud = {}; [a, b].forEach(function (x) { Object.keys(x).forEach(function (k) { ud[k] = (ud[k] || 0) + x[k]; }); }); return ud; }
    var VALENS = { C: 4, H: 1, Br: 1, O: 2 };
    function valensOK(rig, noegle) {
        var v = rig.atomer.map(function () { return 0; });
        rig.bindinger.forEach(function (b) { v[b.a] += b[noegle]; v[b.b] += b[noegle]; });
        return rig.atomer.every(function (a, i) { return v[i] === VALENS[a.el]; });
    }

    /* ------------------------------------------------------------------ */
    overskrift("1. Modellen: additionen");
    var kombi = [];
    ["ethen", "propen"].forEach(function (s) { K.REAGENSER.forEach(function (r) { kombi.push([s, r]); }); });
    var atomfejl = kombi.filter(function (k) {
        return !K.ens(sum(K.tael(K.STOF[k[0]].formel), K.tael(K.REAGENS[k[1]].formel)), K.tael(K.produkt(k[0], k[1]).formel));
    });
    paastand("alle seks additioner går op: atomerne i alkenen og i det lille molekyle er atomerne i produktet", kombi.length === 6 && atomfejl.length === 0, atomfejl.join(" | "));
    var tegnfejl = Object.keys(K.STOF).filter(function (s) { return !K.ens(K.taelAtomer(K.rig(s).atomer), K.tael(K.STOF[s].formel)); });
    paastand("strukturformlerne har de atomer, formlen siger (ethen C₂H₄, ethan C₂H₆, propen C₃H₆)", tegnfejl.length === 0, tegnfejl.join());
    var rigfejl = kombi.filter(function (k) { return !K.ens(K.taelAtomer(K.rig(k[0], k[1]).atomer), K.tael(K.produkt(k[0], k[1]).formel)); });
    paastand("det tegnede produkt har præcis produktets atomer", rigfejl.length === 0, rigfejl.join(" | "));
    var valfejl = kombi.filter(function (k) { var r = K.rig(k[0], k[1]); return !valensOK(r, "s0") || !valensOK(r, "s1"); });
    paastand("før og efter har hvert carbonatom fire bindinger, hydrogen og brom én og oxygen to", valfejl.length === 0 && valensOK(K.rig("ethan"), "s0"), valfejl.join(" | "));
    var enkelt = kombi.every(function (k) { return K.rig(k[0], k[1]).bindinger.every(function (b) { return b.s1 <= 1; }); });
    paastand("i produktet er dobbeltbindingen blevet til en enkeltbinding, og bindingen i det lille molekyle er brudt",
        enkelt && kombi.every(function (k) { var r = K.rig(k[0], k[1]); return r.bindinger.filter(function (b) { return b.brydes; }).length === 1 && r.bindinger.filter(function (b) { return b.ny; }).length === 2; }));
    paastand("ethan har ingen dobbeltbinding og kan ikke lave en addition", !K.kanAddere("ethan") && K.produkt("ethan", "Br2") === null && K.skema("ethan", "Br2") === "" && K.kanAddere("ethen") && K.kanAddere("propen"));
    paastand("skemaerne som i bogen", K.skema("ethen", "Br2") === "C₂H₄ + Br₂ → C₂H₄Br₂" && K.skema("ethen", "H2") === "C₂H₄ + H₂ → C₂H₆" && K.skema("ethen", "H2O") === "C₂H₄ + H₂O → C₂H₅OH" && K.skema("propen", "Br2") === "C₃H₆ + Br₂ → C₃H₆Br₂", K.skema("ethen", "H2O"));
    paastand("produkternes navne", K.produkt("ethen", "Br2").navn === "1,2-dibromethan" && K.produkt("ethen", "H2").navn === "ethan" && K.produkt("ethen", "H2O").navn === "ethanol" &&
        K.produkt("propen", "Br2").navn === "1,2-dibrompropan" && K.produkt("propen", "H2").navn === "propan" && K.produkt("propen", "H2O").navn === "propan-2-ol");
    var rv = K.rig("propen", "H2O"), oNr = -1;
    rv.atomer.forEach(function (a, i) { if (a.el === "O") oNr = i; });
    var cTilO = rv.bindinger.filter(function (b) { return b.ny && b.b === oNr; })[0];
    paastand("vand på propen: OH sætter sig på det midterste carbonatom (propan-2-ol)", !!cTilO && cTilO.a === 1 && K.STOF.propen.dobbelt.join() === "1,2", cTilO ? cTilO.a : "ingen");
    var re = K.rig("ethen", "H2O"), nyH = re.atomer.filter(function (a) { return a.del === "A"; })[0], oE = re.atomer.filter(function (a) { return a.el === "O"; })[0];
    paastand("vand deler sig i H og OH, der sætter sig på hver sit carbonatom", nyH.el === "H" && re.atomer.filter(function (a) { return a.del === "B"; }).length === 2 && nyH.p1[0] !== oE.p1[0]);
    var afstemt = D.A_MAAL.every(function (o) { return !/→/.test(o.loest) || kombi.some(function (k) { return o.loest.indexOf(K.skema(k[0], k[1])) >= 0; }); });
    paastand("skemaerne i teksterne er modellens skemaer", afstemt);

    /* ------------------------------------------------------------------ */
    overskrift("2. Modellen: bromvandet og kæden");
    var V = K.VAESKE;
    paastand("fem væsker med seks carbonatomer, alle lettere end vand", Object.keys(V).length === 5 && Object.keys(V).every(function (id) { return K.tael(V[id].formel).C === 6 && V[id].densitet < 1; }));
    paastand("formlerne: hex-1-en og cyclohexan C₆H₁₂, hexan C₆H₁₄, cyclohexen C₆H₁₀, benzen C₆H₆",
        V.hexen.formel === "C₆H₁₂" && V.cyclohexan.formel === "C₆H₁₂" && V.hexan.formel === "C₆H₁₄" && V.cyclohexen.formel === "C₆H₁₀" && V.benzen.formel === "C₆H₆" && V.hexen.navn === "hex-1-en");
    paastand("kun alkenerne affarver bromvand: hex-1-en og cyclohexen, ikke hexan, cyclohexan og benzen",
        K.affarver("hexen") && K.affarver("cyclohexen") && !K.affarver("hexan") && !K.affarver("cyclohexan") && !K.affarver("benzen"));
    paastand("hexan og cyclohexan er mættede, de tre andre har dobbeltbindinger", K.erMaettet("hexan") && K.erMaettet("cyclohexan") && !K.erMaettet("hexen") && !K.erMaettet("cyclohexen") && !K.erMaettet("benzen"));
    paastand("produkterne med brom går op: C₆H₁₂Br₂ og C₆H₁₀Br₂", ["hexen", "cyclohexen"].every(function (id) { return K.ens(sum(K.tael(V[id].formel), K.tael("Br₂")), K.tael(V[id].pFormel)); }));
    var sumOK = Object.keys(V).every(function (id) { return [0, 0.3, 0.7, 1].every(function (m) { var b = K.brom(id, m); return taet(b.vand + b.olie + b.brugt, 1, 1e-9) && b.vand >= 0 && b.olie >= 0; }); });
    paastand("brommet forsvinder ikke: i vandet, i carbonhydridet eller brugt er altid 1 i alt", sumOK);
    var bA = K.brom("hexen", 1), bH = K.brom("hexan", 1), b0 = K.brom("hexan", 0);
    paastand("rystet med en alken er al brom brugt; med en alkan er 90 % flyttet op, og intet er brugt", bA.brugt === 1 && bA.vand === 0 && bA.olie === 0 && taet(bH.olie, 0.9, 1e-9) && taet(bH.vand, 0.1, 1e-9) && bH.brugt === 0 && b0.vand === 1);
    paastand("det, eleven ser: farven forsvandt eller flyttede op", K.udfald("hexen") === "forsvandt" && K.udfald("cyclohexen") === "forsvandt" && K.udfald("hexan") === "flyttede" && K.udfald("benzen") === "flyttede");
    var k6 = K.kaede(6), k1 = K.kaede(1);
    paastand("kæden: 6 ethenmolekyler giver 12 C og 24 H og ingen dobbeltbindinger", k6.C === 12 && k6.H === 24 && k6.dobbelt === 0 && k6.enkelt === 11 && k1.C === 2 && k1.H === 4 && K.kaedeFormel(6) === "C₁₂H₂₄", K.kaedeFormel(6));
    paastand("kæden har de atomer, ethenmolekylerne havde", [2, 3, 6, 8].every(function (n) { var e = K.tael(K.STOF.ethen.formel), k = K.kaede(n); return k.C === n * e.C && k.H === n * e.H; }));

    /* ------------------------------------------------------------------ */
    overskrift("3. Glasset og luppen");
    function glasEfter(stof, sek, ryst) {
        var g = new NK.Roer({ id: "t", stof: stof });
        g.plads(300, 500, 50);
        if (ryst) g.klikRyst();
        for (var t = 0; t < sek; t += 1 / 60) g.opdater(1 / 60);
        return g;
    }
    var g0 = glasEfter("hexen", 3, false), f0 = g0.farver();
    paastand("et glas, der ikke er rystet: orange bromvand nederst, farveløst øverst", g0.m === 0 && !g0.faerdig() && f0.vand > 0.7 && f0.olie === 0, JSON.stringify(f0));
    var gM = glasEfter("hexan", 0.7, true);
    paastand("mens glasset rystes, er de to lag blandet, og glasset er løftet", gM.rystes() && gM.uro === 1 && !gM.faerdig() && gM.flyt().y < -2 && taet(gM.farver().vand, gM.farver().olie, 1e-9), gM.flyt().y);
    var gA = glasEfter("hexen", 3.2, true), fA = gA.farver();
    paastand("hex-1-en rystet: begge lag er farveløse", gA.faerdig() && fA.vand < 0.01 && fA.olie < 0.01, JSON.stringify(fA));
    var gB = glasEfter("hexan", 3.2, true), fB = gB.farver();
    paastand("hexan rystet: farven er flyttet op i det øverste lag", gB.faerdig() && fB.olie > 0.8 && fB.vand < 0.12, JSON.stringify(fB));
    var gC = glasEfter("benzen", 3.2, true);
    paastand("benzen rystet: farven er flyttet op, ikke forsvundet", gC.faerdig() && gC.farver().olie > 0.8);
    var gD = new NK.Roer({ id: "t", stof: "cyclohexen" });
    gD.plads(300, 500, 50);
    gD.holdt = true;
    gD.rystMus(325);
    var halvt = taet(gD.m, 0.5, 0.01) && !gD.faerdig();
    gD.rystMus(400);
    gD.holdt = false;
    for (var tt = 0; tt < 1.6; tt += 1 / 60) gD.opdater(1 / 60);
    paastand("glasset kan også rystes med musen: 650 pixels er en færdig rystning", halvt && gD.m === 1 && gD.faerdig() && gD.farver().vand < 0.01, gD.m);
    paastand("et klik ryster i 1,5 s, og lagene skiller på 1,3 s", NK.Roer.RYST_SEK === 1.5 && NK.Roer.SKIL_SEK === 1.3 && !glasEfter("hexan", 2.6, true).faerdig() && glasEfter("hexan", 2.95, true).faerdig());

    function koerM(M, sek, hvert) { for (var t = 0; t < sek; t += 1 / 60) { M.opdater(1 / 60); if (hvert) hvert(); } }
    var M1 = new NK.Mikro();
    M1.saetMaal(620, 180);
    M1.saet("hexen");
    var a1 = M1.antal();
    koerM(M1, 8);
    var a1b = M1.antal();
    paastand("luppen med hex-1-en: 6 molekyler og 4 brommolekyler; efter 8 s har alle fire sat sig på en dobbeltbinding",
        a1.mol === 6 && a1.frie === 4 && a1.reageret === 0 && a1b.reageret === 4 && a1b.frie === 0 && M1.ro(), JSON.stringify(a1b));
    var M2 = new NK.Mikro(), ude = 0;
    M2.saetMaal(620, 180);
    M2.saet("hexan");
    koerM(M2, 40, function () { M2.br.forEach(function (b) { if (b.fx < 0 || b.fx > 1 || b.fy < 0.1 || b.fy > 0.9) ude++; }); });
    var a2 = M2.antal();
    paastand("luppen med hexan: brommolekylerne bliver ved med at drive rundt og sætter sig ikke på", a2.reageret === 0 && a2.frie === 4 && ude === 0 && M2.ro(), JSON.stringify(a2) + " ude " + ude);
    var mellem = M2.br.every(function (b) { return M2.mol.every(function (m) { return Math.abs(b.fx - m.fx) > 0.1; }); });
    paastand("frie brommolekyler driver i mellemrummene, ikke oven i tegningerne", mellem);
    var M3 = new NK.Mikro();
    M3.saetMaal(620, 180);
    M3.saet("benzen");
    koerM(M3, 12);
    paastand("luppen med benzen: brom sætter sig ikke på, selv om ringen tegnes med dobbeltbindinger", M3.antal().reageret === 0 && M3.antal().frie === 4);
    paastand("to rækker i et højt vindue, én række i et lavt", M2.raekker() === 2 && (M2.saetMaal(620, 96), M2.raekker() === 1) && M2.mol.every(function (m) { return m.fy === 0.5; }) && M2.s() >= 11, M2.s());
    koerM(M2, 5);
    var bfri = M2.br[0], hitB = M2.ved(bfri.fx * 620, bfri.fy * 96), hitM = M2.ved(M2.mol[0].fx * 620, M2.mol[0].fy * 96);
    paastand("et klik rammer det, der ligger under musen", hitB && hitB.slags === "br" && hitM && hitM.slags === "mol" && M2.ved(-40, -40) === null);
    var geo = NK.Tegn.skeletGeo, antalD = function (id, br) { return geo(id, br).linjer.length; };
    paastand("tegningerne: hex-1-en og cyclohexen har én dobbeltbinding, benzen tre, hexan og cyclohexan ingen",
        antalD("hexan") === 5 && antalD("hexen") === 6 && antalD("cyclohexan") === 6 && antalD("cyclohexen") === 7 && antalD("benzen") === 9);
    paastand("produktet i luppen: dobbeltbindingen er væk, og der sidder to bromatomer på", geo("hexen", true).tekster.length === 2 && antalD("hexen", true) === 7 && geo("cyclohexen", true).tekster.length === 2 && antalD("cyclohexen", true) === 8);

    /* ------------------------------------------------------------------ */
    overskrift("4. Fane 1: Addition");
    NK.visFane("fane-a");
    A.vaelg(0); A.tilpas(); A.layout(); koerF(A, 0.2);
    var kA = A.el.skort;
    paastand("startbilledet: ethen midt i scenen, kun brom på hylden, intet produkt og intet i panelet",
        A.stof === "ethen" && !A.produkt && !A.reak && A.opg.fase === "gaet" && A.kanBruges("Br2") && !A.kanBruges("H2") && !A.kanBruges("H2O") && d.getElementById("a-regnkort").hidden);
    paastand("gættet står på det gule kort øverst med tre svar", kA.classList.contains("gaet") && kA.querySelectorAll(".gk-knap[data-valg]").length === 3 && /Gæt først/i.test(kA.textContent) && /Hvor mange stoffer/.test(kA.textContent), kA.textContent);

                    if (kort.left < sc.left + 4 || kort.right > sc.right - 4 || kort.top < sc.top + 4) pr.push(hvor + "kortet uden for scenen");
                    if (kort.width < 480) pr.push(hvor + "kortet er for smalt " + Math.round(kort.width));
                    if (X.gaetNu()) {
                        Array.prototype.forEach.call(e.querySelectorAll(".gk-knap"), function (k) { if (rk(k).height < 40 || rk(k).height > 130) pr.push(hvor + "svarknap " + Math.round(rk(k).height)); });
                    } else {
                        if (e.offsetHeight > X.kortZone()) pr.push(hvor + "kortet er højere end sin plads " + e.offsetHeight + " mod " + X.kortZone());
                        Array.prototype.forEach.call(e.querySelectorAll(".sk-knap"), function (k) { if (rk(k).height < 28) pr.push(hvor + "svarknap for lav " + Math.round(rk(k).height)); });
                    }
                    if (!X.el.knap.hidden && rk(X.el.knap).height < 28) pr.push(hvor + "hjælpeknappen er for lav");
                    if (!X.el.knap.hidden && (rk(X.el.knap).right > kort.right || rk(X.el.knap).bottom > kort.bottom + 1)) pr.push(hvor + "hjælpeknappen stikker ud af kortet");
                };
                var set = {};
                for (var n = 0; n < 60; n++) {
                    maal("");
                    if (X.faerdig) break;
                    /* Hvert forkert svar giver en forklaring i kortets nederste raekke: maal den ogsaa */
                    var fn = X.opg.fase + X.opg.fi;
                    if (!X.venter && !set[fn] && (X.opg.fase === "spm" || X.opg.fase === "spm2")) {
                        set[fn] = true;
                        X.opg.o[X.opg.fase].svar.forEach(function (sv, j) { if (!sv.ok) { X.svarValg(j); maal("forkert svar " + (j + 1)); } });
                    }
                    X.knap();
                    koerF(X, 0.05);
                    if (!X.faerdig && !X.venter && X.hjaelp > 0) maal("hint " + X.hjaelp);
                }
            });
            X.vaelg(0); X.tilpas(); X.layout(); koerF(X, 0.2);
        });

        /* Fane 1: molekylet, hylden og pladsen til det, der svaever */
        NK.visFane("fane-a");
        [[2, false], [3, false], [5, false], [0, true], [4, true]].forEach(function (x) {
            A.vaelg(x[0]); A.tilpas(); A.layout(); koerF(A, 0.3);
            var l = A.lay, u = A.u, hvor = "fane 1 opgave " + (x[0] + 1) + ": ", kb = rk(A.el.skort).bottom - rk(d.querySelector("#fane-a .scene")).top;
            if (u < 22) pr.push(hvor + "molekylet er for lille " + u.toFixed(1));
            if (A.cy - 1.25 * u < kb + 2) pr.push(hvor + "molekylet ligger under kortet " + Math.round(A.cy - 1.25 * u) + " mod " + Math.round(kb));
            if (!x[1] && A.cy - (K.SVAEV + K.OH + 0.3) * u < 10 + A.kortZone()) pr.push(hvor + "vandmolekylet kan ikke svæve under kortets plads");
            /* under molekylet: navnet og, naar additionen er set, skemaet (under et gaet kun navnet) */
            var under = x[1] ? 46 : 68;
            if (A.cy + 1.25 * u + under > l.hylde.y) pr.push(hvor + "navnet og skemaet når ned i hylden " + Math.round(A.cy + 1.25 * u + under) + " mod " + Math.round(l.hylde.y));
            if (l.W / 2 - 2.3 * u < 4) pr.push(hvor + "molekylet er for bredt");
            K.REAGENSER.forEach(function (r) { var Bk = l.brik[r]; if (Bk.x < 4 || Bk.x + Bk.b > l.W - 4 || Bk.y + Bk.h > l.Hs - 2 || Bk.h < 70) pr.push(hvor + "brikken " + r + " uden for hylden"); });
            if (l.brik.H2.x < l.brik.Br2.x + l.brik.Br2.b + 8 || l.brik.H2O.x < l.brik.H2.x + l.brik.H2.b + 8) pr.push(hvor + "brikkerne overlapper");
            /* Nyt molekyle staar til hoejre under kortets plads og roerer ikke molekylet */
            var ff = d.getElementById("a-forfra"), scA = rk(d.querySelector("#fane-a .scene"));
            if (!x[1]) {
                var fr = rk(ff);
                if (ff.hidden || fr.top - scA.top < 10 + A.kortZone() || fr.right > scA.right - 4) pr.push(hvor + "knappen Nyt molekyle ligger forkert");
                if (fr.left - scA.left < l.W / 2 + 2.3 * u && fr.bottom - scA.top > A.cy - (K.SVAEV + K.OH + 0.3) * u) pr.push(hvor + "knappen Nyt molekyle dækker molekylet");
            } else if (!ff.hidden) pr.push(hvor + "knappen Nyt molekyle er fremme under gættet");
        });

        /* Fane 2: glassene, luppen og gaettet */
        NK.visFane("fane-b");
        B.vaelg(0); B.tilpas(); B.layout(); koerF(B, 0.2);
        var lb = B.lay, scB = rk(d.querySelector("#fane-b .scene"));
        for (var i2 = 0; i2 < 4; i2++) if (B.glas[i2].x + B.glas[i2].b * 0.75 > B.glas[i2 + 1].x - B.glas[i2 + 1].b * 0.75) pr.push("fane 2 glassene overlapper");
        B.glas.forEach(function (g) { if (g.x - g.b < 2 || g.x + g.b > lb.W - 2) pr.push("fane 2 glas uden for scenen"); if (g.b < 34) pr.push("fane 2 glasset er for smalt " + Math.round(g.b)); });
        if (lb.yBord + 30 > lb.Hs) pr.push("fane 2 navnene under glassene når ud af scenen");
        if (lb.lup.y - 22 < 10 + B.kortZone()) pr.push("fane 2 luppens overskrift ligger under kortets plads");
        if (lb.lup.y + lb.lup.h > lb.glasTop - 24) pr.push("fane 2 luppen rører glassene " + Math.round(lb.lup.y + lb.lup.h) + " mod " + Math.round(lb.glasTop));
        if (lb.lup.h < 64 || lb.lup.b < 420) pr.push("fane 2 luppen er for lille " + Math.round(lb.lup.b) + " × " + Math.round(lb.lup.h));
        if (lb.lup.x < 6 || lb.lup.x + lb.lup.b > lb.W - 6) pr.push("fane 2 luppen uden for scenen");
        if (B.mikro.s() < 11) pr.push("fane 2 tegningerne i luppen er for små " + B.mikro.s().toFixed(1));
        [3, 4].forEach(function (i3) {
            B.vaelg(i3); B.tilpas(); B.layout(); koerF(B, 0.2);
            var bund = rk(B.el.skort).bottom - scB.top;
            if (bund > B.lay.glasTop - 4) pr.push("fane 2 opgave " + (i3 + 1) + ": gætkortet dækker glassene " + Math.round(bund) + " mod " + Math.round(B.lay.glasTop));
        });
        B.vaelg(0);

        /* Fane 3: kaeden, de loese molekyler, zoom og brom */
        NK.visFane("fane-p");
        var scP = rk(d.querySelector("#fane-p .scene"));
        P.vaelg(0); P.tilpas(); P.layout(); koerF(P, 0.3);
        P.pulje.forEach(function (p) { if (p.x - 1.6 * P.uP < 2 || p.x + 1.6 * P.uP > P.lay.W - 2 || p.y - 1.1 * P.uP < 10 + P.kortZone() || p.y + 1.1 * P.uP > P.lay.Hs - 2) pr.push("fane 3 et løst ethenmolekyle ligger uden for sin plads"); });
        if (P.uP < 18) pr.push("fane 3 ethenmolekylerne er for små " + P.uP.toFixed(1));
        P.vaelg(1); P.led = 8; P.tilpas(); P.layout(); koerF(P, 0.6);
        var uK = P.uK, bK = (2 * 8 + 0.9) * uK;
        if (bK > P.lay.W - 20) pr.push("fane 3 kæden på 8 er bredere end scenen " + Math.round(bK));
        if (uK < 15) pr.push("fane 3 kæden på 8 er for lille " + uK.toFixed(1));
        if (P.cyK - 1.4 * uK < 10 + P.kortZone()) pr.push("fane 3 kæden ligger under kortets plads");
        if (P.cyK + 1.4 * uK > P.lay.yPulje) pr.push("fane 3 kæden rører de løse molekyler");
        P.pulje.forEach(function (p) { if (p.y - 1.1 * P.uP < P.lay.yPulje - 2 || p.y + 1.1 * P.uP > P.lay.Hs) pr.push("fane 3 de løse molekyler ligger uden for båndet"); });
        P.vaelg(2); P.tilpas(); P.layout(); koerF(P, 0.3);
        var zk = rk(P.zoomKnap), nk = rk(d.getElementById("p-forfra"));
        if (zk.top - scP.top < 10 + P.kortZone() || zk.left < scP.left + 4) pr.push("fane 3 knappen Zoom ud ligger under kortet");
        if (nk.top - scP.top < 10 + P.kortZone() || nk.right > scP.right - 4 || nk.left < zk.right + 20) pr.push("fane 3 knappen Ny kæde ligger forkert");
        if (nk.bottom - scP.top > P.cyK - 1.4 * P.uK + 2 && nk.left - scP.left < P.lay.W / 2 + (2 * 6 + 0.9) * P.uK / 2) pr.push("fane 3 knappen Ny kæde dækker kæden");
        if (zk.bottom - scP.top > P.cyK - 1.4 * P.uK + 2 && zk.right - scP.left > P.lay.W / 2 - (2 * 6 + 0.9) * P.uK / 2) pr.push("fane 3 knappen Zoom ud dækker kæden");
        var Lg = P.lay.lang, Po = P.lay.pose;
        if (Lg.b < 300 || Lg.h < 150) pr.push("fane 3 den lange kæde har for lidt plads " + Math.round(Lg.b) + " × " + Math.round(Lg.h));
        if (Lg.y < 10 + P.kortZone() + 40 || Lg.y + Lg.h > P.lay.Hs) pr.push("fane 3 den lange kæde ligger uden for sin plads");
        if (Po.x + Po.b > P.lay.W - 4 || Po.y + Po.h + 46 > P.lay.Hs || Po.x < Lg.x + Lg.b) pr.push("fane 3 fryseposen uden for scenen");
        P.vaelg(3); P.tilpas(); P.layout(); koerF(P, 0.4);
        var kbP = rk(P.el.skort).bottom - scP.top, Bm = P.lay.brom;
        if (P.cyK - 1.4 * P.uK < kbP + 2) pr.push("fane 3 opgave 4: gætkortet dækker kæden " + Math.round(kbP) + " mod " + Math.round(P.cyK - 1.4 * P.uK));
        if (P.cyK + 1.4 * P.uK > Bm.y - 2) pr.push("fane 3 opgave 4: kæden rører brommolekylet");
        if (P.uK < 15) pr.push("fane 3 opgave 4: kæden er for lille under gættet " + P.uK.toFixed(1));
        if (Bm.y + Bm.h > P.lay.Hs - 2 || Bm.h < 60) pr.push("fane 3 brommolekylet uden for scenen");
        P.vaelg(0);

        /* Panelet og knapperne */
        ["a", "b", "p"].forEach(function (nv) {
            NK.visFane("fane-" + nv);
            var kn2 = rk(d.getElementById(nv + "-knap")), sc2 = rk(d.querySelector("#fane-" + nv + " .scene")), panel = d.querySelector("#fane-" + nv + " .panel");
            if (kn2.right > sc2.right || kn2.bottom > sc2.bottom + 1) pr.push(nv + " hintknappen uden for scenen");
            if (panel.scrollWidth > panel.clientWidth + 1) pr.push(nv + " panelet er for smalt til sit indhold");
        });
        paastand(navn + "tingene kan være der på alle tre faner", pr.length === 0, pr.join("; "));
    });
    ramme.style.width = "";
    ramme.style.height = "";
    A.vaelg(0); B.vaelg(0); P.vaelg(0);
    NK.visFane("fane-a");
}
</script>
