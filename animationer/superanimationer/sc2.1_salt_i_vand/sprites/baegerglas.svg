<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Baegerglas. Indholdet (vand, bundfald, ioner) tegnes af animationen
       BAG denne fil, saa glasset ligger ovenpaa.
       Inderside: x 21-179, bund y 229 (hjoerneradius 7).
       Stregerne: 50 mL ved y 168, 100 mL ved y 108, 150 mL ved y 48
       (1,2 enheder pr. mL). Randen ved y 10, haeldetud til hoejre. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.16"/>
      <stop offset="0.14" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="0.86" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <path d="M20 12 L20 222 Q20 230 28 230 L172 230 Q180 230 180 222 L180 14 Z" fill="url(#glas)"/>

  <!-- Vaeg og bund -->
  <path d="M13 8 Q18 9 20 13 L20 222 Q20 230 28 230 L172 230 Q180 230 180 222 L180 16 Q180 9 190 4"
        fill="none" stroke="#d6eaf8" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 226 L176 226" stroke="#d6eaf8" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Genskin -->
  <rect x="164" y="30" width="5" height="182" rx="2.5" fill="#ffffff" fill-opacity="0.13"/>
  <rect x="27" y="30" width="2.5" height="182" rx="1.2" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Inddeling -->
  <g stroke="#eef6fc" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round">
    <path d="M22 168 h18 M22 108 h18 M22 48 h18"/>
  </g>
  <g stroke="#eef6fc" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round">
    <path d="M22 198 h9 M22 138 h9 M22 78 h9"/>
  </g>
  <g fill="#eef6fc" fill-opacity="0.8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">
    <text x="44" y="172">50</text>
    <text x="44" y="112">100</text>
    <text x="44" y="52">150</text>
    <text x="44" y="32" font-size="9.5" fill-opacity="0.6">mL</text>
  </g>
</svg>
