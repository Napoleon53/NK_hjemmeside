<svg xmlns="http://www.w3.org/2000/svg" width="320" height="250" viewBox="0 0 320 250">
  <!-- Et klart plastkar (pneumatisk kar) set forfra. Indersiden er
       x 14-306, y 12-238. Vandet og det, der staar i det, tegnes af
       animationen FOER filen, saa vaeggene og genskinnet ligger oven
       paa. Bunden staar paa y 248. -->
  <defs>
    <linearGradient id="plast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9eefc" stop-opacity="0.34"/>
      <stop offset="0.06" stop-color="#d9eefc" stop-opacity="0.06"/>
      <stop offset="0.94" stop-color="#d9eefc" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d9eefc" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="kant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f8fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b9d6ea" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Skygge paa bordet -->
  <ellipse cx="160" cy="248" rx="156" ry="4" fill="#000000" fill-opacity="0.35"/>

  <!-- Vaeggene og bunden -->
  <path d="M8 10 L14 232 Q14 240 24 240 L296 240 Q306 240 306 232 L312 10 Z" fill="url(#plast)"/>
  <path d="M8 10 L14 232 Q14 240 24 240 L296 240 Q306 240 306 232 L312 10"
        fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
  <path d="M16 240 L304 240 L302 248 L18 248 Z" fill="#cfe3f2" fill-opacity="0.35" stroke="#dcecf8" stroke-opacity="0.5" stroke-width="1"/>

  <!-- Kanten foroven -->
  <rect x="2" y="4" width="316" height="8" rx="4" fill="url(#kant)" stroke="#9fc3dc" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Genskin -->
  <path d="M24 24 L28 224" stroke="#ffffff" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
  <path d="M292 30 L289 220" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round"/>
</svg>
