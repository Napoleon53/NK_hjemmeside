<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: Tegnebræt</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i tegnebrættet og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer motoren i
   ../../molekylemotor/ og tegnebrættet:
     navngivningen af carbonhydrider (bogens navne, alle isomerer af C4 til
     C9) og af de funktionelle grupper, stofklassen og de andre rigtige
     skrivemåder; molekylformel og molarmasse; tavlens regler; navn til
     tegning (også gamle og engelske skrivemåder, trivialnavne og
     beskederne ved navne, der ikke kan tegnes); at alle trivialnavne kan
     tegnes med luft mellem atomerne; tusind tilfældige molekyler med
     funktionelle grupper, hvis navn skal give det samme molekyle tilbage;
     panelet, billedet til rapporten og Kemichaels skuffe; at linket
     #klister=kaffekop og en gammel tegning fra sc6.2 virker; carboxylat-
     ionerne og de små ioner; grupperne med ét klik, ladningen, Pæn
     tegning, Spejlvend, Kopiér og Indsæt, og at en gemt SVG kan åbnes
     igen; sproget og layoutet fra 520 × 380 til 1500 × 900.

   Kræver en lokal server med animationer/ som rod. Testen gemmer
   tegningen og skuffen og lægger dem tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-tegnebraet", "nk-sc6.2-tegnebraet", "nk-skuffe", "nk-sc6.2-skuffe", "nk-tegnebraet-intro", "nk-tegnebraet-foldet"];
var gemt = {};

window.addEventListener("load", function () { setTimeout(koer, 1500); });

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    try { NOEGLER.forEach(function (n) { gemt[n] = localStorage.getItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    /* Til sidst: en ny side med #klister=kaffekop og en gammel tegning fra sc6.2 */
    try { anden(); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); slut(); }
}

function slut() {
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) localStorage.removeItem(n); else localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Et molekyle ud fra en lille SMILES-streng med tilfældige koordinater, så
   navnet ikke må afhænge af dem (undtagen cis/trans) */
function smiles(NK, s) {
    var m = NK.Smiles.laes(s);
    m.atomer.forEach(function (a) { a.x = Math.random() * 10; a.y = Math.random() * 10; });
    return m;
}

/* Carbonhydrider og halogenforbindelser efter bogens regler (IUPAC 1979/1993) */
var CARBONHYDRIDER = [
    ["CCCC", "butan"], ["CC(C)C", "2-methylpropan"], ["C", "methan"], ["CC", "ethan"],
    ["CC(CC)CC", "3-methylpentan"], ["CCC(C)CC", "3-methylpentan"], ["C(C)(C)CC", "2-methylbutan"],
    ["CC(C)C(C)C", "2,3-dimethylbutan"], ["CCC(CC)C(C)C", "3-ethyl-2-methylpentan"],
    ["CC(CC)C(C)C", "2,3-dimethylpentan"], ["CC(C)(C)C(C)CC", "2,2,3-trimethylpentan"],
    ["CCC(C)C(CC)CC", "3-ethyl-4-methylhexan"], ["CCC(C(C)C)CCC", "3-ethyl-2-methylhexan"],
    ["CCCCC(C(C)C)CCCC", "5-(1-methylethyl)nonan"], ["CCCCC(C(C)(C)C)CCCC", "5-(1,1-dimethylethyl)nonan"],
    ["CCCCC(CCl)CCCC", "5-(chlormethyl)nonan"],
    ["CC(Br)C", "2-brompropan"], ["BrCCBr", "1,2-dibromethan"], ["CC(C)(Br)C", "2-brom-2-methylpropan"],
    ["ClC(Cl)Cl", "trichlormethan"], ["CCCCCCBr", "1-bromhexan"], ["CC(Cl)C(C)C", "2-chlor-3-methylbutan"],
    ["CCBr", "bromethan"], ["FC(F)(F)C(Cl)Br", "2-brom-2-chlor-1,1,1-trifluorethan"],
    ["C=C", "ethen"], ["C=CC", "propen"], ["C=CCC", "but-1-en"], ["CC=CC", "but-2-en"], ["C=C(C)C", "2-methylpropen"],
    ["CC(C)=CC", "2-methylbut-2-en"], ["C=CC=C", "buta-1,3-dien"], ["C=CC(C)C", "3-methylbut-1-en"],
    ["CCC(=C)CC", "2-ethylbut-1-en"], ["CCC(C=C)CCC", "3-ethylhex-1-en"], ["CC(C)C=CC(C)C", "2,5-dimethylhex-3-en"],
    ["C#C", "ethyn"], ["CC#C", "propyn"], ["CC#CC", "but-2-yn"], ["C#CC=C", "but-1-en-3-yn"],
    ["BrCC=C", "3-brompropen"], ["ClC=CCl", "1,2-dichlorethen"], ["C=CCl", "chlorethen"],
    ["C1CCCCC1", "cyclohexan"], ["CC1CCCCC1", "methylcyclohexan"], ["CC1CCCCC1C", "1,2-dimethylcyclohexan"],
    ["C1=CCCCC1", "cyclohexen"], ["CC1C=CCCC1", "3-methylcyclohexen"], ["C1=CC=CC=C1", "benzen"],
    ["CC1=CC=CC=C1", "methylbenzen"], ["ClC1=CC=CC=C1", "chlorbenzen"], ["BrC1CCCCC1Br", "1,2-dibromcyclohexan"],
    ["CCCCCCCCCCCCCCCCCC", "octadecan"]
];

/* De funktionelle grupper: [SMILES, navn, stofklasse] */
var FUNKTIONELLE = [
    ["CO", "methanol", "alkohol"], ["CCO", "ethanol", "alkohol"], ["CCCO", "propan-1-ol"], ["CC(O)C", "propan-2-ol"], ["OC1CCCCC1", "cyclohexanol"],
    ["CC(C)(C)O", "2-methylpropan-2-ol"], ["OCCO", "ethan-1,2-diol"], ["OCC(O)CO", "propan-1,2,3-triol"],
    ["C=CCO", "prop-2-en-1-ol"], ["CC(O)C=C", "but-3-en-2-ol"], ["ClCCO", "2-chlorethanol"],
    ["OCc1ccccc1", "phenylmethanol"], ["OCCc1ccccc1", "2-phenylethanol"], ["Oc1ccccc1", "phenol", "phenol"],
    ["Cc1ccccc1O", "2-methylphenol"], ["Oc1ccccc1O", "benzen-1,2-diol"],
    ["C=O", "methanal", "aldehyd"], ["CC=O", "ethanal"], ["CC(C)C=O", "2-methylpropanal"], ["C=CC=O", "propenal"],
    ["O=Cc1ccccc1", "benzaldehyd"], ["CC(O)CC=O", "3-hydroxybutanal", "aldehyd og alkohol"],
    ["CC(C)=O", "propanon", "keton"], ["CCC(C)=O", "butanon"], ["CCCC(C)=O", "pentan-2-on"], ["CCC(=O)CC", "pentan-3-on"],
    ["O=C1CCCCC1", "cyclohexanon"], ["CC(=O)c1ccccc1", "1-phenylethanon"], ["CC(=O)CC(C)=O", "pentan-2,4-dion"],
    ["OC=O", "methansyre", "carboxylsyre"], ["CC(=O)O", "ethansyre"], ["CCCC(=O)O", "butansyre"], ["CC(C)C(=O)O", "2-methylpropansyre"],
    ["OC(=O)C(=O)O", "ethandisyre"], ["OC(=O)CCC(=O)O", "butandisyre"], ["C=CC(=O)O", "propensyre"],
    ["CC(O)C(=O)O", "2-hydroxypropansyre", "carboxylsyre og alkohol"], ["CC(=O)C(=O)O", "2-oxopropansyre", "carboxylsyre og keton"],
    ["ClCC(=O)O", "chlorethansyre"], ["OC(=O)CC(O)(CC(=O)O)C(=O)O", "2-hydroxypropan-1,2,3-tricarboxylsyre"],
    ["OC(=O)C(O)C(O)C(=O)O", "2,3-dihydroxybutandisyre"], ["OC(=O)c1ccccc1", "benzoesyre"],
    ["OC(=O)c1ccccc1O", "2-hydroxybenzoesyre", "carboxylsyre og phenol"], ["CC(=O)Oc1ccccc1C(=O)O", "2-(acetyloxy)benzoesyre", "carboxylsyre og ester"],
    ["OC(=O)c1ccc(cc1)C(=O)O", "benzen-1,4-dicarboxylsyre"], ["O=C(O)C1CCCCC1", "cyclohexancarboxylsyre"],
    ["NCC(=O)O", "aminoethansyre", "aminosyre"], ["CC(N)C(=O)O", "2-aminopropansyre", "aminosyre"],
    ["CC(C)Cc1ccc(cc1)C(C)C(=O)O", "2-[4-(2-methylpropyl)phenyl]propansyre"],
    ["CCOC(C)=O", "ethylethanoat", "ester"], ["COC(=O)CC", "methylpropanoat"], ["CC(C)CCOC(C)=O", "3-methylbutylethanoat"],
    ["CC(=O)OCc1ccccc1", "(phenylmethyl)ethanoat"], ["COC(=O)c1ccccc1", "methylbenzoat"], ["COC(=O)c1ccccc1O", "methyl-2-hydroxybenzoat"],
    ["CCOC(=O)C(=O)OCC", "diethylethandioat"], ["COC(=O)CCC(=O)OCC", "ethylmethylbutandioat"],
    ["CC(N)=O", "ethanamid", "amid"], ["CNC(C)=O", "N-methylethanamid"], ["CN(C)C=O", "N,N-dimethylmethanamid"], ["NC(N)=O", "urinstof", "amid"],
    ["CC(=O)Nc1ccc(O)cc1", "N-(4-hydroxyphenyl)ethanamid", "amid og phenol"], ["O=C(N)c1ccccc1", "benzamid"],
    ["CN", "methylamin", "amin"], ["CCN", "ethylamin"], ["CNC", "dimethylamin"], ["CN(C)C", "trimethylamin"], ["CCNC", "ethylmethylamin"],
    ["CC(C)N", "propan-2-amin"], ["Nc1ccccc1", "phenylamin"], ["NCCCCCCN", "hexan-1,6-diamin"], ["NCCO", "2-aminoethanol", "alkohol og amin"],
    ["COC", "dimethylether", "ether"], ["CCOCC", "diethylether"], ["CCOC", "ethylmethylether"], ["COc1ccccc1", "methoxybenzen"],
    ["COC(C)(C)C", "2-methoxy-2-methylpropan"],
    ["COc1cc(C=O)ccc1O", "4-hydroxy-3-methoxybenzaldehyd", "aldehyd, phenol og ether"],
    ["CC(C)C1CCC(C)CC1O", "5-methyl-2-(1-methylethyl)cyclohexanol"],
    ["CNCC(O)c1ccc(O)c(O)c1", "4-[1-hydroxy-2-(methylamino)ethyl]benzen-1,2-diol"],
    ["CCN(CC)CC(=O)Nc1c(C)cccc1C", "2-(diethylamino)-N-(2,6-dimethylphenyl)ethanamid"],
    ["OC(=O)CCC(=O)OC", "4-methoxy-4-oxobutansyre", "carboxylsyre og ester"],
    ["OCC(O)C(O)C(O)C(O)C=O", "2,3,4,5,6-pentahydroxyhexanal"]
];

var ISOMERER = { 4: 2, 5: 3, 6: 5, 7: 9, 8: 18, 9: 35 };
var C8 = "2,2,3,3-tetramethylbutan,2,2,3-trimethylpentan,2,2,4-trimethylpentan,2,2-dimethylhexan,2,3,3-trimethylpentan,2,3,4-trimethylpentan,2,3-dimethylhexan,2,4-dimethylhexan,2,5-dimethylhexan,2-methylheptan,3,3-dimethylhexan,3,4-dimethylhexan,3-ethyl-2-methylpentan,3-ethyl-3-methylpentan,3-ethylhexan,3-methylheptan,4-methylheptan,octan";

/* Mindste afstand mellem to tunge atomer og antal krydsende bindinger */
function taet(m) {
    var A = m.atomer.filter(function (a) { return a.el !== "H"; }), min = 9;
    for (var i = 0; i < A.length; i++) for (var j = i + 1; j < A.length; j++) min = Math.min(min, Math.hypot(A[i].x - A[j].x, A[i].y - A[j].y));
    return min;
}
function krydsninger(m) {
    function k(p1, p2, p3, p4) {
        var d = (p2.x - p1.x) * (p4.y - p3.y) - (p3.x - p4.x) * (p1.y - p2.y);
        if (Math.abs(d) < 1e-9) return false;
        var l = ((p4.y - p3.y) * (p4.x - p1.x) + (p3.x - p4.x) * (p4.y - p1.y)) / d, g = ((p1.y - p2.y) * (p4.x - p1.x) + (p2.x - p1.x) * (p4.y - p1.y)) / d;
        return l > 0.01 && l < 0.99 && g > 0.01 && g < 0.99;
    }
    var B = m.bindinger, n = 0;
    for (var i = 0; i < B.length; i++) for (var j = i + 1; j < B.length; j++) {
        var x = B[i], y = B[j];
        if (x.a === y.a || x.a === y.b || x.b === y.a || x.b === y.b) continue;
        if (k(m.atom(x.a), m.atom(x.b), m.atom(y.a), m.atom(y.b))) n++;
    }
    return n;
}

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i;

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("motoren er hentet fra ../../molekylemotor/", !!(NK.Molekyle && NK.Navn && NK.NavnLaeser && NK.Smiles && NK.Trivialnavne && NK.Layout && NK.Struktur && NK.Tegnebraet && NK.Skuffe && NK.Tavle));
    paastand("tegnebrættet er bygget", !!(NK.sims && NK.sims["fane-tegn"]));
    var T = NK.sims["fane-tegn"];
    var sprites = ["kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("Kemichaels " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    paastand("Kemichael er koblet på", !!T.laerer);
    paastand("siden har ingen faneknapper, men knapperne Navne og ?", !d.querySelector(".faneknap") && !!d.getElementById("teoriknap") && !!d.getElementById("hjaelpknap"));

    overskrift("2. Carbonhydrider og halogenforbindelser");
    var navnFejl = CARBONHYDRIDER.filter(function (r) { return NK.Navn.analyser(smiles(NK, r[0])).navnUdenStereo !== r[1]; });
    paastand(CARBONHYDRIDER.length + " navne efter bogens regler", navnFejl.length === 0,
        navnFejl.map(function (r) { return r[0] + " gav " + NK.Navn.analyser(smiles(NK, r[0])).navnUdenStereo + ", ikke " + r[1]; }).join("; "));
    function traeer(n) {
        var lag = [NK.Smiles.laes("C")];
        for (var k = 2; k <= n; k++) {
            var ny = [], set = {};
            lag.forEach(function (m) {
                m.atomer.forEach(function (a) {
                    if (m.grad(a.id) >= 4) return;
                    var m2 = m.kopi(), b = m2.tilfoej("C", Math.random(), Math.random());
                    m2.bind(a.id, b.id, 1);
                    var nv = NK.Navn.analyser(m2).navn;
                    if (!set[nv]) { set[nv] = true; ny.push(m2); }
                });
            });
            lag = ny;
        }
        return lag;
    }
    var talFejl = [];
    for (var n = 4; n <= 9; n++) { var l = traeer(n).length; if (l !== ISOMERER[n]) talFejl.push("C" + n + ": " + l); }
    paastand("alle alkaner C4-C9 får hver sit navn (2, 3, 5, 9, 18, 35 isomerer)", talFejl.length === 0, talFejl.join(", "));
    var c8 = traeer(8).map(function (m) { return NK.Navn.analyser(m).navn; }).sort().join(",");
    paastand("de 18 navne på C8H18 er bogens", c8 === C8, c8);
    function buten(cis) {
        var m = new NK.Molekyle();
        var p = [[0, 0], [0.866, -0.5], [1.732, 0], [2.598, cis ? 1 : -0.5]];
        var a = p.map(function (q) { return m.tilfoej("C", q[0], q[1]); });
        m.bind(a[0].id, a[1].id, 1); m.bind(a[1].id, a[2].id, 2); m.bind(a[2].id, a[3].id, 1);
        return m;
    }
    paastand("zigzag er trans, samme side er cis", NK.Navn.analyser(buten(false)).navn === "trans-but-2-en" && NK.Navn.analyser(buten(true)).navn === "cis-but-2-en");
    paastand("to ringe og S: intet navn, og grunden står", NK.Navn.analyser(smiles(NK, "C1CC2CCC1C2")).grund === "ringe" &&
        NK.Navn.analyser(smiles(NK, "CCS")).grund === "hetero" && NK.Navn.analyser(smiles(NK, "C1CCOC1")).grund === "heteroring");

    overskrift("3. De funktionelle grupper");
    var fFejl = FUNKTIONELLE.filter(function (r) { var x = NK.Navn.analyser(smiles(NK, r[0])); return x.navnUdenStereo !== r[1] || (r[2] && x.stofklasse !== r[2]); });
    paastand(FUNKTIONELLE.length + " navne og stofklasser: alkohol, aldehyd, keton, carboxylsyre, ester, amid, amin og ether", fFejl.length === 0,
        fFejl.map(function (r) { var x = NK.Navn.analyser(smiles(NK, r[0])); return r[0] + " gav " + x.navnUdenStereo + " (" + x.stofklasse + "), ikke " + r[1]; }).join("; "));
    paastand("navnet afhænger ikke af, hvilket atom man tegner fra: 2-hydroxypropansyre", ["CC(O)C(=O)O", "OC(=O)C(O)C", "C(C)(O)C(O)=O"].every(function (s) {
        return NK.Navn.analyser(smiles(NK, s)).navn === "2-hydroxypropansyre";
    }));
    paastand("hovedkæden har den vigtigste gruppe, også når en anden kæde er længere", NK.Navn.analyser(smiles(NK, "CCCCCC(CO)CC")).navn === "2-ethylheptan-1-ol");
    paastand("syren giver endelsen, OH står foran (hydroxy)", NK.Navn.analyser(smiles(NK, "OCCCC(=O)O")).navn === "4-hydroxybutansyre");
    var alt = NK.Navn.analyser(smiles(NK, "CCN")).alternativer.concat(NK.Navn.analyser(smiles(NK, "CCC(C)=O")).alternativer, NK.Navn.analyser(smiles(NK, "COC")).alternativer);
    paastand("de andre rigtige skrivemåder er med: ethanamin, butan-2-on, methoxymethan", ["ethanamin", "butan-2-on", "methoxymethan"].every(function (a) { return alt.indexOf(a) >= 0; }), alt.join(", "));
    paastand("cis-but-2-ensyre og trans-but-2-ensyre afgøres af tegningen", (function () {
        var r1 = NK.NavnLaeser.laes("cis-but-2-ensyre"), r2 = NK.NavnLaeser.laes("trans-but-2-ensyre");
        return r1.navn === "cis-but-2-ensyre" && r2.navn === "trans-but-2-ensyre";
    })());
    paastand("grupper uden for gymnasiet får intet navn: syrechlorid, anhydrid, kulsyre", ["CC(=O)Cl", "CC(=O)OC(C)=O", "OC(=O)O"].every(function (s) { return NK.Navn.analyser(smiles(NK, s)).grund === "gruppe"; }));

    overskrift("4. Molekylformel og molarmasse (H 1,01 som i sc4.1)");
    var fm = [["CCO", "C₂H₆O", "46,08"], ["CC(=O)O", "C₂H₄O₂", "60,06"], ["CCCCCC", "C₆H₁₄", "86,20"], ["CBr", "CH₃Br", "94,94"],
        ["CN", "CH₅N", "31,07"], ["C1=CC=CC=C1", "C₆H₆", "78,12"], ["ClC(Cl)Cl", "CHCl₃", "119,37"], ["CC(=O)Oc1ccccc1C(=O)O", "C₉H₈O₄", "180,17"]];
    var fmFejl = fm.filter(function (x) { var m = smiles(NK, x[0]); return m.formel() !== x[1] || NK.komma(m.molarmasse()) !== x[2]; });
    paastand("formel og M for ethanol, eddikesyre, hexan, brommethan, methylamin, benzen, chloroform, acetylsalicylsyre", fmFejl.length === 0,
        fmFejl.map(function (x) { var m = smiles(NK, x[0]); return m.formel() + " " + NK.komma(m.molarmasse()); }).join("; "));

    overskrift("5. Tavlen");
    function braet(regler) {
        return new NK.Tegnebraet({
            felt: function () { return { x: 0, y: 0, b: 1000, h: 700 }; }, skala: function () { return 50; },
            regler: regler, aendret: function () {}, toast: function () {}
        });
    }
    var F = braet({ kunC: false, ringe: true, tripel: true, dobbelt: true, knaek: true, sletAlt: true, flyt: true, maks: function () { return 80; } });
    F.nulstil(false, true);
    F.ring({ x: 500, y: 350 }, 6, true);
    paastand("benzenknappen giver benzen", NK.Navn.analyser(F.mol).navn === "benzen");
    F.nulstil(false, true);
    F.ring({ x: 500, y: 350 }, 6, false);
    var ringAtom = F.mol.atomer[0];
    F.grundstof = "C";
    F.klik({ slags: "atom", atom: ringAtom }, F.px(ringAtom));
    paastand("et klik på en ring med C valgt giver methylcyclohexan", NK.Navn.analyser(F.mol).navn === "methylcyclohexan");
    var metyl = F.mol.atomer[F.mol.atomer.length - 1];
    F.grundstof = "O";
    F.klik({ slags: "atom", atom: metyl }, F.px(metyl));
    paastand("O valgt og klik på et atom gør det til O: cyclohexanol", NK.Navn.analyser(F.mol).navn === "cyclohexanol", NK.Navn.analyser(F.mol).navn);
    F.grundstof = "Cl";
    F.klik({ slags: "atom", atom: metyl }, F.px(metyl));

    paastand("noterne og beskederne har ingen tankestreger", !noter.some(function (x) { return /[–—]/.test(x); }));

    overskrift("15. Layout");
    var ramme = document.getElementById("ramme");
    [[520, 380], [900, 600], [1300, 820], [1500, 900]].forEach(function (st) {
        ramme.style.width = st[0] + "px";
        ramme.style.height = st[1] + "px";
        W.dispatchEvent(new W.Event("resize"));
        T.tilpas();
        T.opdater(1 / 60);
        T.tegn();
        var f = T.felt(), fejlL = [];
        if (!T.lay || T.lay.tavle.b < 150 || T.lay.tavle.h < 100) fejlL.push("tavle " + (T.lay ? Math.round(T.lay.tavle.b) + "x" + Math.round(T.lay.tavle.h) : "mangler"));
        if (f.h < 60) fejlL.push("felt " + Math.round(f.h));
        var zr = d.getElementById("tb-zoom").getBoundingClientRect(), cr = T.L.canvas.getBoundingClientRect();
        if (zr.left < cr.left + T.lay.tavle.x || zr.right > cr.left + T.lay.tavle.x + T.lay.tavle.b || zr.top < cr.top + T.lay.tavle.y) fejlL.push("zoomknapperne uden for tavlen: " + [zr.left - cr.left, zr.right - cr.left, zr.top - cr.top, T.lay.tavle.x, T.lay.tavle.x + T.lay.tavle.b, T.lay.tavle.y].map(Math.round).join(","));
        var vandret = d.documentElement.scrollWidth > d.documentElement.clientWidth + 1;
        paastand(st[0] + " × " + st[1] + ": tavlen og zoomknapperne har plads, ingen vandret rulning", !fejlL.length && !vandret, fejlL.join(", ") + (vandret ? " rulning" : ""));
    });
    ramme.style.width = "1300px";
    ramme.style.height = "820px";
}
