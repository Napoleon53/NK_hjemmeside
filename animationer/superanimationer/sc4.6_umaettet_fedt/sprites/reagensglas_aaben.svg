<svg xmlns="http://www.w3.org/2000/svg" width="60" height="230" viewBox="0 0 60 230">
  <!-- Reagensglas uden prop (det glas, der dryppes i), tegnet til en lys baggrund. Samme maal som
       reagensglas.svg: inderside x 12-48, den runde bund har midte i
       (30, 200) og radius 18. Vaesken tegnes af animationen BAG filen. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb6cc" stop-opacity="0.3"/>
      <stop offset="0.2" stop-color="#9fb6cc" stop-opacity="0.05"/>
      <stop offset="0.8" stop-color="#9fb6cc" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#9fb6cc" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <path d="M11 22 L11 200 A19 19 0 0 0 49 200 L49 22 Z" fill="url(#glas)"/>

  <!-- Kanten foroven: en lille vulst, der kan ses ovenfra -->
  <ellipse cx="30" cy="20.5" rx="22" ry="3.2" fill="none" stroke="#7d91a6" stroke-opacity="0.85" stroke-width="2"/>

  <!-- Vaeg og bund -->
  <path d="M8 20.5 Q11 21.5 11 26 L11 200 A19 19 0 0 0 49 200 L49 26 Q49 21.5 52 20.5"
        fill="none" stroke="#7d91a6" stroke-opacity="0.95" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Genskin -->
  <rect x="40" y="44" width="3.5" height="140" rx="1.7" fill="#ffffff" fill-opacity="0.55"/>
  <rect x="15" y="44" width="2" height="140" rx="1" fill="#ffffff" fill-opacity="0.4"/>
</svg>
