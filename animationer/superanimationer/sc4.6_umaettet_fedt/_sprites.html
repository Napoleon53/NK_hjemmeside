<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc4.6 Umættet fedt og bromvand</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:"Segoe UI",sans-serif; margin:0; padding:24px; }
    h1 { font-size:1.1rem; margin:0 0 4px; }
    p { margin:0 0 20px; color:#a9b0ba; font-size:0.9rem; }
    .raekke { display:flex; gap:48px; align-items:flex-end; flex-wrap:wrap; }
    figure { margin:0; text-align:center; }
    figcaption { margin-top:10px; font-size:0.85rem; color:#cfd6de; }
    .bund { background:#1d1e26; border:1px solid #33343f; border-radius:10px; padding:20px 28px; }
</style>
</head>
<body>
<!-- Udviklerværktøj. Indgår ikke i animationen og kan slettes.
     Viser de tre sprites alene, så de kan bedømmes, før de er i bevægelse. -->
<h1>Sprites i sc4.6</h1>
<p>Indholdet i reagensglasset (heptan med fedtstof og vandet fra dråberne) tegnes af animationen bag glasset. Molekylerne er ikke sprites.</p>
<div class="raekke">
    <figure><div class="bund"><img src="sprites/reagensglas.svg" width="120" alt="Reagensglas med prop"></div><figcaption>reagensglas.svg (fra sc4.4)</figcaption></figure>
    <figure><div class="bund"><img src="sprites/reagensglas_aaben.svg" width="120" alt="Reagensglas uden prop"></div><figcaption>reagensglas_aaben.svg (det glas, der dryppes i)</figcaption></figure>
    <figure><div class="bund"><img src="sprites/pipette.svg" width="60" alt="Dråbepipette med bromvand"></div><figcaption>pipette.svg</figcaption></figure>
    <figure><div class="bund"><img src="sprites/pipette.svg" width="26" alt="Dråbepipette i scenens størrelse"> <img src="sprites/reagensglas_aaben.svg" width="47" alt="Reagensglas i scenens størrelse"></div><figcaption>i den størrelse, de har i scenen</figcaption></figure>
</div>
</body>
</html>
