<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 200" width="60" height="200">
  <!-- DNPH med et aldehyd eller en keton: uklar gul vaeske med gult bundfald,
       der svaever og samler sig i bunden. Benzaldehyd giver et mere orange
       bundfald; farven saettes i js/glas.js -->
  <defs>
    <linearGradient id="vaeske" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e3a63a"/>
      <stop offset="0.45" stop-color="#f2c160"/>
      <stop offset="1" stop-color="#e3a63a"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <path d="M13 92 L47 92 L47 172 A17 17 0 0 1 13 172 Z" fill="url(#vaeske)"/>
  <ellipse cx="30" cy="92" rx="17" ry="3.2" fill="#f2c160" opacity="0.9"/>
  <path d="M13 166 Q30 158 47 166 L47 172 A17 17 0 0 1 13 172 Z" fill="#e39a1e"/>
  <g fill="#e39a1e">
    <circle cx="20" cy="108" r="1.6"/><circle cx="33" cy="114" r="1.4"/><circle cx="41" cy="104" r="1.5"/>
    <circle cx="26" cy="126" r="1.7"/><circle cx="38" cy="131" r="1.5"/><circle cx="18" cy="140" r="1.4"/>
    <circle cx="31" cy="145" r="1.8"/><circle cx="42" cy="150" r="1.5"/><circle cx="23" cy="156" r="1.7"/>
    <circle cx="36" cy="158" r="1.6"/><circle cx="28" cy="100" r="1.3"/><circle cx="44" cy="122" r="1.4"/>
  </g>
  <path d="M13 12 L13 172 A17 17 0 0 0 47 172 L47 12" fill="url(#glas)" stroke="#6b7685" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M8 10 Q8 6 12 6 L48 6 Q52 6 52 10 L52 13 L8 13 Z" fill="#e9edf1" stroke="#6b7685" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M19 22 L19 165" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.75"/>
</svg>
