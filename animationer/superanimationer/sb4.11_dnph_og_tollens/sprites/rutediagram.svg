-maal" x="204.0" y="18.0" width="184.0" height="96.0" fill="none"/></g><line x1="387.3" y1="66.0" x2="429.6" y2="66.0" stroke="#556766" stroke-width="2.0" stroke-linecap="round"/><path d="M 436.7,66.0 L 425.7,70.8 L 429.0,66.0 L 425.7,61.2 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><rect x="397.7" y="40.0" width="28.5" height="18.0" rx="9" fill="url(#d4-ja)" stroke="#9cd0c5" stroke-width="1"/><text x="412.0" y="53.5" font-size="13" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><g class="peg" data-titel="Tollens' test" data-tekst="Tollens' reagens indeholder sølv(I)ioner. Et aldehyd bliver oxideret, og sølv(I)ionerne bliver reduceret til frit sølv, der sætter sig som et blankt spejl på glasset. En keton kan ikke oxideres videre og giver intet sølvspejl." data-noegle="tollens" data-med="stof dnph"><path d="M 522.7,20.8 Q 528.0,18.0 533.3,20.8 L 614.7,63.2 Q 620.0,66.0 614.7,68.8 L 533.3,111.2 Q 528.0,114.0 522.7,111.2 L 441.3,68.8 Q 436.0,66.0 441.3,63.2 Z" transform="translate(1 2)" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><path d="M 522.7,20.8 Q 528.0,18.0 533.3,20.8 L 614.7,63.2 Q 620.0,66.0 614.7,68.8 L 533.3,111.2 Q 528.0,114.0 522.7,111.2 L 441.3,68.8 Q 436.0,66.0 441.3,63.2 Z" fill="url(#d4-groen)" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round"/><path d="M 451.1,60.7 L 528.0,22.5 L 604.9,60.7" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="528.0" y="62.0" font-size="14" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Tollens</tspan></text><text x="528.0" y="80.0" font-size="13" text-anchor="middle" fill="#14201f"><tspan>sølvspejl?</tspan></text><rect class="peg-maal" x="436.0" y="18.0" width="184.0" height="96.0" fill="none"/></g><line x1="619.3" y1="66.0" x2="645.9" y2="66.0" stroke="#556766" stroke-width="2.0" stroke-linecap="round"/><path d="M 653.0,66.0 L 642.0,70.8 L 645.3,66.0 L 642.0,61.2 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><rect x="623.2" y="40.0" width="28.5" height="18.0" rx="9" fill="url(#d4-ja)" stroke="#9cd0c5" stroke-width="1"/><text x="637.5" y="53.5" font-size="13" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>ja</tspan></text><g class="peg" data-titel="Stoffet er et aldehyd" data-tekst="Stoffet giver gult bundfald med DNPH og sølvspejl med Tollens' reagens." data-noegle="aldehyd" data-med="stof dnph tollens"><rect x="656.0" y="44.8" width="86.0" height="46.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="655.0" y="43.0" width="86.0" height="46.0" rx="10" fill="url(#d4-svar)" stroke="#0f766e" stroke-width="1.6"/><path d="M 665.0,44.9 H 731.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="698.0" y="71.2" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Aldehyd</tspan></text><rect class="peg-maal" x="655.0" y="43.0" width="86.0" height="46.0" fill="none"/></g><line x1="296.0" y1="115.0" x2="296.0" y2="144.9" stroke="#556766" stroke-width="2.0" stroke-linecap="round"/><path d="M 296.0,152.0 L 291.2,141.0 L 296.0,144.3 L 300.8,141.0 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><rect x="309.1" y="126.0" width="35.8" height="18.0" rx="9" fill="url(#d4-nej)" stroke="#e6aaa0" stroke-width="1"/><text x="327.0" y="139.5" font-size="13" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>nej</tspan></text><line x1="528.0" y1="115.0" x2="528.0" y2="144.9" stroke="#556766" stroke-width="2.0" stroke-linecap="round"/><path d="M 528.0,152.0 L 523.2,141.0 L 528.0,144.3 L 532.8,141.0 Z" fill="#556766" stroke="#556766" stroke-width="0.8" stroke-linejoin="round"/><rect x="541.1" y="126.0" width="35.8" height="18.0" rx="9" fill="url(#d4-nej)" stroke="#e6aaa0" stroke-width="1"/><text x="559.0" y="139.5" font-size="13" text-anchor="middle" fill="#a93226" font-weight="700"><tspan>nej</tspan></text><g class="peg" data-titel="Stoffet er hverken et aldehyd eller en keton" data-tekst="Stoffet giver ikke bundfald med DNPH. Det er hverken et aldehyd eller en keton. Det kan godt have en carbonylgruppe, for carboxylsyrer og estere giver heller ikke bundfald." data-noegle="ingen" data-med="stof dnph"><rect x="187.0" y="156.8" width="220.0" height="50.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="186.0" y="155.0" width="220.0" height="50.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 196.0,156.9 H 396.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="296.0" y="175.9" font-size="14" text-anchor="middle" fill="#14201f" font-weight="700"><tspan>Hverken aldehyd</tspan></text><text x="296.0" y="193.9" font-size="12.5" text-anchor="middle" fill="#556766"><tspan>eller keton</tspan></text><rect class="peg-maal" x="186.0" y="155.0" width="220.0" height="50.0" fill="none"/></g><g class="peg" data-titel="Stoffet er en keton" data-tekst="Stoffet giver gult bundfald med DNPH, men intet sølvspejl med Tollens' reagens." data-noegle="keton" data-med="stof dnph tollens"><rect x="474.0" y="158.8" width="110.0" height="46.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="473.0" y="157.0" width="110.0" height="46.0" rx="10" fill="url(#d4-svar)" stroke="#0f766e" stroke-width="1.6"/><path d="M 483.0,158.9 H 573.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><text x="528.0" y="185.2" font-size="15" text-anchor="middle" fill="#0f766e" font-weight="700"><tspan>Keton</tspan></text><rect class="peg-maal" x="473.0" y="157.0" width="110.0" height="46.0" fill="none"/></g>
