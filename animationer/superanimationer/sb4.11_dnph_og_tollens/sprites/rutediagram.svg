<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 212" width="750" height="212" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Rutediagram: giver stoffet gult bundfald med DNPH, er det et aldehyd eller en keton. Giver det også sølvspejl med Tollens, er det et aldehyd, og ellers er det en keton">
<title>Rutediagram: giver stoffet gult bundfald med DNPH, er det et aldehyd eller en keton. Giver det også sølvspejl med Tollens, er det et aldehyd, og ellers er det en keton</title>
<defs><filter id="gs-blur-lille" x="-20%" y="-30%" width="140%" height="160%"><feGaussianBlur stdDeviation="2"/></filter><linearGradient id="d4-hvid" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf3f2"/></linearGradient><linearGradient id="d4-groen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f1faf8"/><stop offset="1" stop-color="#d3ece6"/></linearGradient><linearGradient id="d4-svar" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f3f0"/></linearGradient><linearGradient id="d4-ja" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#effaf7"/><stop offset="1" stop-color="#d4eee8"/></linearGradient><linearGradient id="d4-nej" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff5f3"/><stop offset="1" stop-color="#fadcd6"/></linearGradient><linearGradient id="d4-vaeske" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#d9eaf4"/><stop offset="1" stop-color="#a3c3d8"/></linearGradient><filter id="d4-glod" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="7"/></filter></defs><g class="peg-vejledning" data-tekst="Peg på en test eller et svar, og se, hvad testen viser."/><g class="peg" data-titel="Ukendt stof" data-tekst="Med to test i rækkefølge kan du afgøre, om et ukendt stof er et aldehyd, en keton eller ingen af delene." data-noegle="stof"><rect x="19.0" y="44.8" width="148.0" height="46.0" rx="10" fill="#4b5a64" opacity="0.16" filter="url(#gs-blur-lille)"/><rect x="18.0" y="43.0" width="148.0" height="46.0" rx="10" fill="url(#d4-hvid)" stroke="#b5cbc8" stroke-width="1.4"/><path d="M 28.0,44.9 H 156.0" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/><rect class="peg-maal" x="18.0" y="43.0" width="148.0" height="46.0" fill="none"/><clipPath id="d4-glas-klip"><path d="M 37.5,51.0 V 75.5 A 5.5,5.5 0 0 0 48.5,75.5 V 51.0 Z"/></clipPath><rect x="37.5" y="64.5" width="11" height="16.5" f