<svg xmlns="http://www.w3.org/2000/svg" width="690" height="626" viewBox="0 0 690 626">
  <!-- Bassinet. Molekylerne tegnes af animationen BAG denne fil, saa
       glasset ligger ovenpaa. 20 enheder pr. kuglediameter.
       Inderside: x 20-670 (32,5 kugler), y 30-604,4 (28,72 kugler).
       Det svarer til gitteret i js/model.js: 32 x 27 pladser plus 5,2
       kugler luft foroven. Den kolde zone er de oeverste 1,7 kugler
       (y 30-64), hvor koelekappen sidder udenpaa.
       Stregerne til venstre: én pr. portion (tre raekker kugler).
       Det samme sprite bruges til det lille glas. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.16"/>
      <stop offset="0.08" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="0.92" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="kappe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Glassets skaer -->
  <path d="M20 30 L20 596 Q20 604.4 28 604.4 L662 604.4 Q670 604.4 670 596 L670 30 Z" fill="url(#glas)"/>

  <!-- Vaeg og bund -->
  <path d="M8 22 Q15 23 17 29 L17 597 Q17 607.4 28 607.4 L662 607.4 Q673 607.4 673 597 L673 29 Q675 23 682 22"
        fill="none" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 600 L664 600" stroke="#d6eaf8" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Genskin -->
  <rect x="646" y="80" width="9" height="480" rx="4.5" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="30" y="80" width="4" height="480" rx="2" fill="#ffffff" fill-opacity="0.07"/>

  <!-- Koelekappen om toppen af glasset, med ind- og udloeb -->
  <rect x="11" y="31" width="668" height="34" rx="5" fill="url(#kappe)"/>
  <path d="M11 31 H679 M11 65 H679" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M679 37 h9 M679 59 h9" stroke="#7dd3fc" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  <g fill="#e0f2fe" fill-opacity="0.5">
    <circle cx="60" cy="44" r="1.6"/><circle cx="150" cy="54" r="1.3"/><circle cx="240" cy="41" r="1.5"/>
    <circle cx="330" cy="56" r="1.2"/><circle cx="420" cy="46" r="1.6"/><circle cx="510" cy="55" r="1.3"/>
    <circle cx="600" cy="42" r="1.5"/>
  </g>

  <!-- Inddeling: én streg pr. portion, laengere ved 3, 6 og 9 -->
  <g stroke="#eef6fc" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round">
    <path d="M22 549.8 h14 M22 497.8 h14 M22 393.9 h14 M22 341.9 h14 M22 238 h14 M22 186 h14"/>
  </g>
  <g stroke="#eef6fc" stroke-opacity="0.75" stroke-width="2.6" stroke-linecap="round">
    <path d="M22 445.8 h26 M22 290 h26 M22 134.1 h26"/>
  </g>
</svg>
