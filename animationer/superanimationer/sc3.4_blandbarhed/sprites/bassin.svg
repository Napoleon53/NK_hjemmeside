<svg xmlns="http://www.w3.org/2000/svg" width="690" height="686" viewBox="0 -60 690 686">
  <!-- Bassinet med laag. Molekylerne tegnes af animationen BAG denne fil,
       saa glasset ligger ovenpaa. Tegningen gaar fra y = -60 (tragten)
       til 626 (bunden); scene.js tegner den 60 enheder over bassinets top.
       Inderside: x 20-670 (40,5 kugler), y 30-604,4 (35,79 kugler),
       16,05 enheder pr. kuglediameter. Det svarer til gitteret i
       js/model.js: 40 x 33 pladser plus 7,08 kugler luft foroven.
       Laaget har to halse (maalene staar ogsaa i js/apparat.js):
         tragten   x 250, stilken 9 enheder fra midten, hanen i y -2
                   (haandtaget tegnes af animationen), aaben i y -50
         halsen    x 440, 26 enheder fra midten, til y -20, hvor
                   koeleren (tegnes af animationen) sidder
       Stregerne til venstre: én pr. portion (tre raekker kugler), elleve i alt.
       Det samme sprite bruges til det lille glas. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.16"/>
      <stop offset="0.08" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="0.92" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="tragt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#cfe6f7" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- Glassets skaer -->
  <path d="M20 30 L20 596 Q20 604.4 28 604.4 L662 604.4 Q670 604.4 670 596 L670 30 Z" fill="url(#glas)"/>
  <path d="M211 -50 L241 -12 L241 27 L259 27 L259 -12 L289 -50 Z" fill="url(#tragt)"/>
  <!-- Halsens krave er slebet (mat), resten er klart glas -->
  <rect x="409.5" y="-20" width="61" height="12" fill="#d6eaf8" fill-opacity="0.13"/>

  <g fill="none" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vaeg, bund og laaget op til tragten og halsen -->
    <path d="M238.5 27.5 L27 27.5 Q17 27.5 17 37.5 L17 597 Q17 607.4 28 607.4 L662 607.4 Q673 607.4 673 597 L673 37.5 Q673 27.5 663 27.5 L468.5 27.5"/>
    <path d="M261.5 27.5 L411.5 27.5"/>
    <!-- Tragten med stilk -->
    <path d="M238.5 27.5 L238.5 -12 L206 -52"/>
    <path d="M261.5 27.5 L261.5 -12 L294 -52"/>
    <!-- Halsen med en krave, som koeleren sidder i -->
    <path d="M411.5 27.5 L411.5 -6 L407 -9 L407 -20"/>
    <path d="M468.5 27.5 L468.5 -6 L473 -9 L473 -20"/>
  </g>
  <path d="M26 600 L664 600" stroke="#d6eaf8" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Genskin -->
  <rect x="646" y="80" width="9" height="480" rx="4.5" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="30" y="80" width="4" height="480" rx="2" fill="#ffffff" fill-opacity="0.07"/>

  <!-- Hanen paa stilken -->
  <circle cx="250" cy="-2" r="10" fill="#d6eaf8" fill-opacity="0.22" stroke="#d6eaf8" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Inddeling: én streg pr. portion, laengere ved 5 og 10 -->
  <g stroke="#eef6fc" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round">
    <path d="M22 560.6 h14 M22 518.9 h14 M22 477.2 h14 M22 435.5 h14 M22 352.1 h14 M22 310.4 h14 M22 268.7 h14 M22 227 h14 M22 143.6 h14"/>
  </g>
  <g stroke="#eef6fc" stroke-opacity="0.75" stroke-width="2.6" stroke-linecap="round">
    <path d="M22 393.8 h26 M22 185.3 h26"/>
  </g>
</svg>
