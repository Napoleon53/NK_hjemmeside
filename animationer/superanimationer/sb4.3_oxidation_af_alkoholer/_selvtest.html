<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sb4.3 Oxidation af alkoholer</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at modellen giver bogens oxidationstal og
   produkter (afsnit B4.3), at motoren navngiver alle svarene, at begge
   faner kan gennemføres, at forkerte svar får den rigtige forklaring og
   koster stjernen, at Vis svaret virker, at intet løses uden Indsend
   svar, at scenen er låst, når kortet er grønt, at teksterne er uden
   tankestreger og ASCII-dansk, og at kortet aldrig dækker whiteboardet
   fra 1100 × 620 til 1600 × 950.

   Iframen skal åbnes gennem en lokal server med mappen animationer/ som
   rod (motoren hentes fra ../../molekylemotor/). Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + String(note).replace(/</g, "&lt;") + ")" : ""), "fejl"); }
}
function samlet(navn, liste) { paastand(navn, liste.length === 0, liste.slice(0, 4).join(" | ")); }
function overskrift(t) { skriv("\n" + t, "h"); }
function note(t) { skriv("        " + t, "note"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sb4.3-serier", "nk-sb4.3-opgaver", "nk-sb4.3-forsoeg"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|staa|paa|foerst|hoejre|oeverst|loest|proev\w*|spoerg\w*|faa|saa|naar|kaede\w*|vaelg\w*|taelle?r?|traekker|primaer|sekundaer|tertiaer|groent)\b/i;
var gemt = {};
var ramme = document.getElementById("ramme");
var trin = 0;

ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 900); }
});

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
    window.faerdig = true;
}

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, K = NK.Kemi;
    var o = NK.sims["fane-o"], p = NK.sims["fane-p"], u = NK.sims["fane-u"];
    var tekster = [];

    function el(id) { return d.getElementById(id); }
    function besked(sim) { var b = el(sim.navn + "-besked"); return b.hidden ? "" : b.textContent; }
    function kort(sim) { return el(sim.navn + "-ind").textContent; }
    /* Papirkortet: forklaringen til et rigtigt svar staar under svarene (.sk-bund.bliv) */
    function bliv(sim) { var b = el(sim.navn + "-ind").querySelector(".sk-bund.bliv .st-tekst"); return b ? b.textContent : ""; }
    function husk(hvad, t) { if (t) tekster.push({ hvad: hvad, t: t }); }
    function tid(sim, sek) { for (var t = 0; t < sek; t += 1 / 60) sim.opdater(1 / 60); }
    function hPaaC(sim) { return K.hPaa(sim.mol, sim.c); }

    /* ================================================================= */
    overskrift("1. Modellen: bogens oxidationstal og produkter");
    var FORVENT = {
        "ethanol": [["ethanol", -1, "alkohol"], ["ethanal", 1, "aldehyd"], ["ethansyre", 3, "carboxylsyre"]],
        "propan-2-ol": [["propan-2-ol", 0, "alkohol"], ["propanon", 2, "keton"]],
        "2-methylpropan-2-ol": [["2-methylpropan-2-ol", 1, "alkohol"]]
    };
    D.SERIER.forEach(function (s) {
        var b = K.byg(s), mol = b.mol, fundet = [];
        for (var i = 0; i < 5; i++) {
            var n = K.navn(mol), t = K.optael(mol, b.c);
            fundet.push([n.navn, K.oxtal(mol, b.c), n.klasse]);
            paastand(n.navn + ": elektronegativiteten giver bogens regel (O − H)", K.oxtal(mol, b.c) === t.O - t.H);
            paastand(n.navn + ": carbonatomet har fire bindinger", t.O + t.H + t.C === 4);
            var h = K.hPaa(mol, b.c);
            if (!h.length) break;
            K.udfoer(mol, b.c, K.plan(mol, b.c, h[h.length - 1]));
        }
        paastand(s.navn + ": " + fundet.map(function (f) { return f[0] + " " + D.rom(f[1]); }).join(" → "),
            JSON.stringify(fundet) === JSON.stringify(FORVENT[s.id]), JSON.stringify(fundet));
        paastand(s.navn + " er " + D.TYPER[s.type].navn + " (motorens type)", K.type(K.tung(K.byg(s).mol), K.cMedOH(K.tung(K.byg(s).mol)).c) === s.type);
    });
    var ingenPlan = K.byg(D.SERIER[0]);
    paastand("intet kan oxideres på et H på et andet carbonatom", K.plan(ingenPlan.mol, ingenPlan.c, ingenPlan.id.H1) === null);

    var navnefejl = [], klassefejl = [], produktfejl = [], typefejl = [];
    var TYPE = { "propan-1-ol": "primaer", "propan-2-ol": "sekundaer", "2-methylpropan-2-ol": "tertiaer", "butan-1-ol": "primaer",
        "butan-2-ol": "sekundaer", "pentan-3-ol": "sekundaer", "2-methylbutan-2-ol": "tertiaer", "2-methylpropan-1-ol": "primaer",
        "3-methylbutan-2-ol": "sekundaer", "3-methylbutan-1-ol": "primaer" };
    D.OPGAVER.forEach(function (op) {
        var a = K.alkohol(op.alkohol);
        if (a.type !== TYPE[op.alkohol]) typefejl.push(op.alkohol + " " + a.type);
        if (K.produkt(a, op.maade) !== op.svar) produktfejl.push(op.alkohol + " → " + K.produkt(a, op.maade));
        if ((a.type === "primaer") !== !!op.maade) produktfejl.push(op.alkohol + ": mild/kraftig kun ved primære");
        op.valg.forEach(function (v, j) {
            if (!v) { if (D.VALG_KLASSE[j] !== null) klassefejl.push(op.alkohol + " null"); return; }
            var res = NK.Navn.analyser(NK.NavnLaeser.laes(v).mol);
            if (res.navn !== v) navnefejl.push(v + " → " + res.navn);
            if (res.stofklasse !== D.VALG_KLASSE[j]) klassefejl.push(v + " er " + res.stofklasse);
        });
        if (op.valg.indexOf(op.svar) < 0) produktfejl.push(op.alkohol + ": svaret er ikke blandt valgene");
    });
    samlet("typen af de ti alkoholer er rigtig", typefejl);
    samlet("modellens produkt er svaret i data.js", produktfejl);
    samlet("motoren giver alle svarene det samme navn", navnefejl);
    samlet("svarene står i rækkefølgen aldehyd, keton, carboxylsyre, ingen", klassefejl);
    var slags = {};
    D.OPGAVER.forEach(function (op) { slags[K.alkohol(op.alkohol).type + (op.maade || "")] = true; });
    var midler = [];
    D.OPGAVER.forEach(function (op) {
        if (!D.MIDLER[op.middel]) midler.push(op.alkohol + ": intet middel");
        if (op.maade && D.MAADE[op.maade].middel !== op.middel) midler.push(op.alkohol + ": " + op.maade + " med " + op.middel);
    });
    samlet("mild er dichromat, kraftig er permanganat", midler);
    paastand("begge oxidationsmidler bruges ved sekundære og tertiære",
        D.OPGAVER.some(function (op) { return !op.maade && op.middel === "dichromat"; }) && D.OPGAVER.some(function (op) { return !op.maade && op.middel === "permanganat"; }));
    paastand("fane 2 har primær mild, primær kraftig, sekundær og tertiær",
        slags.primaermild && slags.primaerkraftig && slags.sekundaer && slags.tertiaer, Object.keys(slags).join(","));

    /* ================================================================= */
    overskrift("2. Fane 1: Oxidationstallet");
    NK.visFane("fane-o");
    o.vaelg(0);
    paastand("Indsend svar kan ikke trykkes uden et valg", !o.kanSendes() && el("o-indsend").classList.contains("ikke-klar"));
    o.indsendKlik();
    paastand("intet sker uden et valg", o.fase === "ox" && o.trin.length === 0);
    o.svarValg(D.OXTAL.indexOf(1));
    paastand("et svar på kortet vælger kun", o.fase === "ox" && o.valgt === D.OXTAL.indexOf(1));
    paastand("knappen viser valget", /\+I/.test(el("o-indsend").textContent), el("o-indsend").textContent);
    o.indsendKlik();
    husk("fejl fortegn", besked(o));
    paastand("byttet fortegn får forklaringen om fortegnet", /Fortegnet er byttet om/.test(besked(o)), besked(o));
    paastand("det forkerte svar kan ikke vælges igen", el("o-ind").querySelectorAll(".brik.forkert").length === 1);
    paastand("hjælpeknappen lyser efter et forkert svar", el("o-knap").classList.contains("peg"));
    o.svarValg(D.OXTAL.indexOf(-1));
    paastand("elektronparrene er slået fra, før svaret er givet", !o.visPar && !o.oxVist);
    o.indsendKlik();
    husk("rigtigt ox", bliv(o));
    paastand("rigtigt: oxidationstallene kommer frem på alle atomer, og elektronparrene slås til",
        o.oxVist && o.visPar && el("o-kontakter").querySelector('[data-vis="par"]').classList.contains("til"));
    paastand("rigtigt: kortet bliver på spørgsmålet, −I er grønt, og regnestykket står under svarene",
        !!o.groen && o.fase === "ox" && /I alt −I/.test(bliv(o)) && /^Rigtigt/.test(bliv(o)) && besked(o) === "" &&
        (el("o-ind").querySelector(".sk-knap.rigtig") || {}).textContent === "−I" && el("o-ind").querySelectorAll(".sk-knap:not(:disabled)").length === 0 &&
        el("o-indsend").hidden && el("o-knap").hidden && /Næste trin/.test(el("o-ind").querySelector(".sk-videre").textContent), bliv(o));
    paastand("kortet beder ikke om Indsend svar, når svaret er givet", !/Indsend svar/.test(el("o-ind").querySelector(".sk-tekst").textContent));
    o.videreKlik();
    paastand("Næste trin: så kommer oxidationen", o.fase === "h" && !o.groen && besked(o) === "");
    paastand("ethanol står på trappen", el("o-trappe").textContent.indexOf("ethanol") >= 0);
    husk("kort oxider", kort(o));
    paastand("kortet siger før Oxidér, hvad der dannes", /Ethanol bliver oxideret til ethanal, et aldehyd\./.test(kort(o)), kort(o));
    var knapO = el("o-ind").querySelector('[data-handling="oxider"]');
    paastand("kortet har knappen Oxidér, og Indsend svar er væk", !!knapO && el("o-indsend").hidden);
    o.tegn();
    o.klikScene({ x: o.geo.P[o.c].x, y: o.geo.P[o.c].y });
    paastand("et klik i formlen oxiderer ikke", o.fase === "h");
    knapO.click();
    paastand("Oxidér starter oxidationen", o.fase === "anim");
    tid(o, 2.5);
    paastand("efter oxidationen går kortet direkte til næste spørgsmål uden et klik",
        !o.groen && o.fase === "ox" && /oxidationstallet for det markerede carbonatom i ethanal/.test(kort(o)) && !el("o-ind").querySelector('[data-handling="oxider"]'), kort(o));
    paastand("efter oxidationen er det nye stofs oxidationstal skjult", !o.oxVist);
    paastand("efter oxidationen er stoffet ethanal", o.fase === "ox" && o.stof.navn === "ethanal" && besked(o) === "", o.stof.navn);
    o.svarValg(D.OXTAL.indexOf(1)); o.indsendKlik();
    paastand("trappen viser, at tallet steg 2", /steg \+2/.test(el("o-trappe").textContent));
    o.videreKlik();
    o.oxider(); tid(o, 2.5);
    paastand("efter endnu en oxidation er stoffet ethansyre", o.stof.navn === "ethansyre", o.stof.navn);
    o.svarValg(D.OXTAL.indexOf(3)); o.indsendKlik();
    husk("slut ethanol", o.groen && o.groen.tekst);
    paastand("serien slutter af sig selv, når der ikke er flere H", !!o.groen && /−I til \+I til \+III/.test(o.groen.tekst), o.groen && o.groen.tekst);
    paastand("ethanol er klaret, men uden stjerne (der var fejl)", o.status[0].loest && !o.status[0].stjerne);
    var foer = o.stof.navn;
    o.klikScene({ x: o.lay.tavle.x + o.lay.tavle.b / 2, y: o.lay.tavle.y + o.lay.tavle.h / 2 });
    paastand("scenen er låst, når kortet er grønt", o.groen && o.stof.navn === foer);
    o.videreKlik();
    paastand("videre går til propan-2-ol", o.serie.id === "propan-2-ol");
    o.svarValg(D.OXTAL.indexOf(0)); o.indsendKlik();
    o.videreKlik();
    o.knap();
    paastand("hintet ved Oxidér peger på knappen", /Oxidér/.test(besked(o)), besked(o));
    o.knap();
    paastand("Vis svaret ved Oxidér oxiderer uden at koste noget", o.fase === "anim" && !o.sv);
    tid(o, 2.5);
    paastand("propan-2-ol bliver til propanon", o.stof.navn === "propanon", o.stof.navn);
    o.svarValg(D.OXTAL.indexOf(2)); o.indsendKlik();
    husk("slut propan-2-ol", o.groen && o.groen.tekst);
    paastand("propan-2-ol uden fejl giver stjerne", o.status[1].loest && o.status[1].stjerne);
    o.vaelg(2);
    o.saetPar(false);
    o.knap();
    husk("hint 1 ox", besked(o));
    paastand("første hint slår elektronparrene til", o.visPar && el("o-kontakter").querySelector('[data-vis="par"]').classList.contains("til"));
    o.knap();
    husk("hint 2 ox", besked(o));
    paastand("andet hint tæller bindingerne", /1 binding til O og 3 bindinger til C/.test(besked(o)), besked(o));
    o.knap();
    husk("slut tertiær", o.groen && o.groen.tekst);
    paastand("Vis svaret giver +I, og den tertiære kan ikke oxideres", !!o.groen && /I alt \+I/.test(o.groen.tekst) && /kan ikke oxideres\./.test(o.groen.tekst), o.groen && o.groen.tekst);
    paastand("Vis svaret koster stjernen", o.status[2].loest && !o.status[2].stjerne);
    paastand("alle tre er klaret i panelet", el("o-klaret").textContent === "3");
    o.videreKlik();
    paastand("efter den sidste går knappen til fane 2", el("fane-p").classList.contains("aktiv"));

    /* ================================================================= */
    overskrift("3. Fane 2: Hvad dannes?");
    NK.visFane("fane-p");
    var forkerteTekster = {};
    p.opgaver.forEach(function (op, i) {
        p.vaelg(i);
        var rigtigType = D.TYPE_ORDEN.indexOf(op.alk.type);
        husk("kort type " + i, kort(p));
        p.klikScene({ x: p.kasser.valg[0].x + 20, y: p.kasser.valg[0].y + 20 });
        if (p.valgt !== null) paastand("svarene på tavlen er skjult og låst, før typen er fundet (" + op.o.alkohol + ")", false);
        var forkertType = (rigtigType + 1) % 3;
        p.svarValg(forkertType); p.indsendKlik();
        husk("fejl type " + i, besked(p));
        p.svarValg(rigtigType); p.indsendKlik();
        husk("rigtig type " + i, bliv(p));
        if (!p.groen || p.fase !== "type" || !/^Rigtigt/.test(bliv(p)) || besked(p) !== "") paastand("rigtig type: kortet bliver på spørgsmålet (" + op.o.alkohol + ")", false, bliv(p));
        p.klikScene({ x: p.kasser.valg[0].x + 20, y: p.kasser.valg[0].y + 20 });
        if (p.valgt !== null) paastand("svarene om produktet er låst, til eleven trykker Næste spørgsmål (" + op.o.alkohol + ")", false);
        p.videreKlik();
        if (p.fase !== "produkt") paastand("typen går videre (" + op.o.alkohol + ")", false);
        husk("kort produkt " + i, kort(p));
        var rigtig = op.o.valg.indexOf(op.produkt);
        var forkert = (rigtig + 1) % 4;
        p.klikScene({ x: p.kasser.valg[forkert].x + 20, y: p.kasser.valg[forkert].y + 20 });
        if (p.valgt !== forkert) paastand("et klik på tavlen vælger et svar (" + op.o.alkohol + ")", false);
        if (p.groen) paastand("et klik løser ikke opgaven (" + op.o.alkohol + ")", false);
        p.indsendKlik();
        forkerteTekster[op.o.alkohol] = besked(p);
        husk("fejl produkt " + i, besked(p));
        p.klikScene({ x: p.kasser.valg[rigtig].x + 20, y: p.kasser.valg[rigtig].y + 20 });
        p.indsendKlik();
        husk("slut " + i, p.groen && p.groen.tekst);
        if (!p.groen) paastand("opgaven løses (" + op.o.alkohol + ")", false, besked(p));
        tid(p, 2);
    });
    paastand("alle ti opgaver er løst", p.antalLoest() === 10 && el("p-loest").textContent === "10");
    paastand("fejl koster stjernen", p.status.every(function (s) { return !s.stjerne; }));
    paastand("tabellen er fyldt ud", el("p-fundet").querySelectorAll(".fund-raekke.kendt").length === 4);
    paastand("tertiær: ingen reaktion forklares med det manglende H", /intet hydrogenatom/.test(forkerteTekster["2-methylpropan-2-ol"]), forkerteTekster["2-methylpropan-2-ol"]);
    paastand("mild oxidation: syren forklares med destillationen", /destilleres/.test(forkerteTekster["propan-1-ol"]) || /keton/.test(forkerteTekster["propan-1-ol"]), forkerteTekster["propan-1-ol"]);
    paastand("glasset er grønt efter en oxidation", p.glasT >= 1 || p.opg.produkt === null);

    /* Vis svaret paa fane 2 */
    p.vaelg(4);
    p.knap(); p.knap(); p.knap();
    paastand("Vis svaret finder typen: kortet bliver på spørgsmålet med svaret i gult", !!p.groen && p.fase === "type" && /^Svaret/.test(bliv(p)) &&
        !!el("p-ind").querySelector(".sk-knap.svar-vist"), bliv(p));
    p.knap();
    paastand("kortets knap går videre til produktet", p.fase === "produkt" && !p.groen);
    p.knap(); p.knap(); p.knap();
    var valgte = Array.prototype.map.call(el("p-liste").querySelectorAll(".opg-chip.valgt"), function (c) { return c.getAttribute("data-opg"); });
    paastand("kun opgave 5 er markeret i listen", valgte.join(",") === "4", valgte.join(","));
    paastand("Vis svaret finder produktet", !!p.groen && /butanon/.test(p.groen.tekst), p.groen && p.groen.tekst);

    /* ================================================================= */
    overskrift("4. Fane 3: Ukendte alkoholer");
    ["primaer", "sekundaer"].forEach(function (t) {
        var a = K.afstemt(t);
        paastand("skemaet for den " + D.TYPER[t].navn + " er afstemt (atomer og ladning " + a.ladning.join(" = ") + ")", a.ok, JSON.stringify(a));
        var m = K.afstem(t), sk = D.FORSOEG.skemaer[t];
        var tal = {};
        sk.venstre.concat(sk.hoejre).forEach(function (x) { tal[x[1]] = x[0]; });
        paastand("trinene for den " + D.TYPER[t].navn + " giver skemaet: " + m.kAlk + " og " + m.kMn + ", " + m.oh + " OH⁻, " + m.h2o + " H₂O",
            tal[m.alkohol] === m.kAlk && tal["MnO₄⁻"] === m.kMn && tal["OH⁻"] === m.oh && tal["H₂O"] === m.h2o && m.oV === m.oH);
    });
    var A2 = K.afstem("sekundaer"), A1 = K.afstem("primaer");
    paastand("oxidationstallene: propan-2-ol 0 → +II, propan-1-ol −I → +III, mangan +VII → +IV",
        A2.cFra === 0 && A2.cTil === 2 && A1.cFra === -1 && A1.cTil === 3 && A2.mnFra === 7 && A2.mnTil === 4);
    paastand("romertallene går til +VII", D.rom(7) === "+VII" && D.rom(-1) === "−I");
    paastand("bundfaldet følger skemaet: den primære giver dobbelt så meget som den sekundære",
        Math.abs(K.bundfald("primaer") / K.bundfald("sekundaer") - 2) < 1e-9 && K.bundfald("tertiaer") === 0);
    ["tertiaer", "sekundaer", "primaer"].forEach(function (t) {
        var f = K.fuldStruktur(D.FORSOEG.alkoholer.filter(function (a) { return a.type === t; })[0].navn);
        paastand("den fulde strukturformel for den " + D.TYPER[t].navn + " har " + f.h.length + " H på carbonatomet med OH",
            f.h.length === { tertiaer: 0, sekundaer: 1, primaer: 2 }[t]);
    });
    NK.visFane("fane-u");
    u.forfra();
    function pos(n) { tid(u, 1.5); return u.kortPos[n]; }
    paastand("første gang begynder fanen med forsøget, og Indsend svar er væk", u.trin() === "forsoeg" && el("u-indsend").hidden);
    paastand("glassene viser ingen resultater før forsøget", !u.udfoert);
    paastand("de tre alkoholer står i en række under glassene, den tertiære først",
        pos(2).y > u.baand.y + u.baand.h && pos(2).x < pos(1).x && pos(1).x < pos(0).x);
    var knapF = el("u-ind").querySelector('[data-handling="forsoeg"]');
    paastand("kortet har knappen Udfør forsøget", !!knapF);
    knapF.click();
    tid(u, 3.8);
    var it0 = u.glasMed("tertiaer"), ip0 = u.glasMed("primaer"), is0 = u.glasMed("sekundaer");
    paastand("midt i forsøget falder MnO₂ til bunds", u.glasTilstand(ip0).bundfald > 0 && u.glasTilstand(ip0).korn !== null && u.glasTilstand(it0).bundfald === 0);
    tid(u, 4);
    paastand("efter forsøget: mest bundfald hos den primære, intet hos den tertiære",
        u.glasTilstand(ip0).bundfald > u.glasTilstand(is0).bundfald && u.glasTilstand(it0).bundfald === 0 && u.glasTilstand(ip0).papir === 1);
    paastand("pH: tertiær 7, primær 8 og sekundær 10 (brugerens valg)", u.papir(it0) === 7 && u.papir(ip0) === 8 && u.papir(is0) === 10);
    paastand("nu er den tertiære i fokus, og de to andre venter",
        u.trin() === "t-H" && u.kortMaal(2).slags === "fokus" && u.kortMaal(1).slags === "venter" && u.kortMaal(0).slags === "venter");
    husk("u t-H", kort(u));
    u.indsendKlik();
    paastand("intet sker uden et valg", u.trin() === "t-H");
    var fejlTekster = {};
    var bobler = [];
    /* Papirkortet: efter et rigtigt svar bliver kortet paa spoergsmaalet med
       forklaringen under svarene, og tavlen venter, til eleven trykker Naeste */
    var blivFejl = [];
    function blivTjek(id) {
        husk("u bliv " + id, bliv(u));
        if (!(u.groen && u.groen.naeste && u.trin() === id && besked(u) === "" && /^(Rigtigt|Svaret)/.test(bliv(u)) && bliv(u).length > 12 &&
            /Næste spørgsmål/.test(el("u-ind").querySelector(".sk-videre").textContent))) blivFejl.push(id + ": " + bliv(u));
    }
    function trinMedFejl(id) {
        if (u.trin() !== id) { paastand("trinet " + id + " kommer i rækkefølge", false, u.trin()); return false; }
        var sp = u.spm();
        husk("u kort " + id, kort(u));
        if (sp.indtast) {
            var af = K.afstem(id.charAt(0) === "s" ? "sekundaer" : "primaer");
            u.tegn();
            if (u.koefFelt[0].hidden) paastand("felterne til koefficienterne vises i skemaet (" + id + ")", false);
            u.indsendKlik();
            if (u.trin() !== id) paastand("intet sker med tomme felter (" + id + ")", false);
            u.koefFelt[0].value = af.kMn; u.koefFelt[1].value = af.kAlk; u.indsendKlik();
            fejlTekster[id] = besked(u);
            husk("u fejl " + id, besked(u));
            u.koefFelt[0].value = af.kAlk * 2; u.koefFelt[1].value = af.kMn * 2; u.indsendKlik();
            husk("u fejl2 " + id, besked(u));
            if (!/så små som muligt/.test(besked(u))) paastand("dobbelte koefficienter forklares (" + id + ")", false, besked(u));
            u.knap(); husk("u hint1 " + id, besked(u)); u.knap(); husk("u hint2 " + id, besked(u));
            u.koefFelt[0].value = af.kAlk; u.koefFelt[1].value = af.kMn; u.indsendKlik();
            blivTjek(id);
            if (!u.koefFelt[0].disabled) paastand("felterne er låst, mens kortet venter på Næste (" + id + ")", false);
            u.videreKlik();
            bobler.push(!!u.boble && u.boble.stille);
            u.tegn();
            if (!u.koefFelt[0].hidden) paastand("felterne forsvinder efter det rigtige svar (" + id + ")", false);
            return true;
        }
        var forkert = (sp.rigtig + 1) % sp.svar.length;
        if (sp.laast) while (sp.laast[forkert] || forkert === sp.rigtig) forkert = (forkert + 1) % sp.svar.length;
        u.svarValg(forkert); u.indsendKlik();
        fejlTekster[id] = besked(u);
        husk("u fejl " + id, besked(u));
        u.knap(); husk("u hint1 " + id, besked(u)); u.knap(); husk("u hint2 " + id, besked(u));
        u.svarValg(sp.rigtig); u.indsendKlik();
        blivTjek(id);
        u.videreKlik();
        bobler.push((!!u.boble && u.boble.stille) || u.trin() === "forsoeg");
        if (besked(u)) paastand("kortets nederste linje er tom, når næste spørgsmål kommer (" + id + ")", false, besked(u));
        u.tegn();
        return true;
    }
    ["t-H", "t-reak", "t-forvent"].forEach(trinMedFejl);
    paastand("den tertiære: forventet violet og pH 7 før glasset vælges", u.trin() === "t-glas" && /violet/.test(fejlTekster["t-forvent"] + kort(u)));
    u.tegn();
    u.klikScene({ x: u.kol[ip0].x + u.kol[ip0].b / 2, y: u.baand.y + u.baand.h / 2 });
    paastand("et klik på et glas vælger det", u.valgt === ip0);
    u.indsendKlik();
    husk("u fejl t-glas", besked(u));
    paastand("et brunsort glas forklares med oxidationen", /brunsort/.test(besked(u)), besked(u));
    u.svarValg(it0); u.indsendKlik();
    blivTjek("t-glas");
    u.videreKlik();
    paastand("den tertiære er fundet og glider op i sit glas", u.kendt[it0] === 2 && Math.abs(pos(2).y - u.plads(it0).y) < 1);
    paastand("nu er den sekundære i fokus, og den primære venter", u.kortMaal(1).slags === "fokus" && u.kortMaal(0).slags === "venter");
    ["s-H", "s-reak", "s-oxC", "s-oxMn", "s-koef", "s-ladning", "s-brint", "s-forvent", "s-glas"].forEach(trinMedFejl);
    paastand("forkerte koefficienter forklares med stigning og fald", /samlede stigning/.test(fejlTekster["s-koef"]), fejlTekster["s-koef"]);
    paastand("hvert rigtigt svar lyser grønt ved det, der blev sat ind, når eleven trykker Næste (uden tekst: forklaringen stod på kortet)", bobler.length > 10 && bobler.every(function (b) { return b; }));
    paastand("skemaet bliver stående, mens den sekundære forventes", u.behold === true || u.trin() !== "s-forvent");
    paastand("den sekundære er fundet og står ved sit glas", u.kendt[is0] === 1);
    paastand("nu er den primære i fokus, og ingen venter", u.kortMaal(0).slags === "fokus" && [1, 2].every(function (n) { return u.kortMaal(n).slags === "glas"; }));
    ["p-H", "p-reak", "p-oxC", "p-koef", "p-ladning", "p-brint"].forEach(trinMedFejl);
    paastand("efter hvert rigtigt svar bliver kortet på spørgsmålet med forklaringen og Næste spørgsmål", blivFejl.length === 0, blivFejl.join(" | "));
    paastand("forkert antal OH⁻ hos den primære nævner propanoat", /propanoat/.test(fejlTekster["p-ladning"]), fejlTekster["p-ladning"]);
    paastand("teorien huskes", u.status.afstemt);
    paastand("til sidst spørges om, hvad man forventer af den primære", u.trin() === "p-forvent");
    u.svarValg(1); u.indsendKlik();
    husk("u fejl p-forvent", besked(u));
    paastand("mindre bundfald hos den primære forklares med skemaerne", /4 MnO/.test(besked(u)), besked(u));
    u.svarValg(0); u.indsendKlik();
    husk("u slut", u.groen && u.groen.tekst);
    paastand("rigtigt: den primære glider op i det sidste glas, og kortet er grønt", !!u.groen && u.kendt.every(function (k, i) { return k === u.glas[i]; }));
    paastand("fejl koster stjernen", !u.status.stjerne && u.status.runder === 1);
    u.klikScene({ x: 10, y: 10 });
    paastand("scenen er låst, når kortet er grønt", !!u.groen);
    var foer = u.glas.join();
    u.videreKlik();
    paastand("ny runde: forsøget, forventningerne og glassene, uden teorien", u.trin() === "forsoeg" && u.liste.length === 6);
    u.visSvar();
    tid(u, 8);
    paastand("Vis svaret på forsøget udfører det uden at koste noget", u.trin() === "t-forvent" && !u.sv);
    ["t-forvent", "t-glas", "s-forvent", "s-glas", "p-forvent"].forEach(function () { u.svarValg(u.spm().rigtig); u.indsendKlik(); if (u.groen && u.groen.naeste) u.videreKlik(); });
    paastand("anden runde uden fejl giver stjerne", u.status.runder === 2 && u.status.stjerne);
    u.nyRunde();
    paastand("pH er den samme i en ny runde", u.phV.primaer === 8 && u.phV.sekundaer === 10 && u.phV.tertiaer === 7);
    note("glassene i de to første runder: " + foer + " og videre");

    /* ================================================================= */
    overskrift("5. Teksterne");
    o.vaelg(0); o.knap(); o.knap();
    husk("hint", besked(o));
    var html = d.body.innerText;
    var streger = [], ascii = [], ladning = [], lange = [];
    tekster.forEach(function (x) {
        if (/[–—]/.test(x.t)) streger.push(x.hvad);
        if (ASCII_ORD.test(x.t)) ascii.push(x.hvad + ": " + x.t.match(ASCII_ORD)[0]);
        if (/\b1[+−]/.test(x.t)) ladning.push(x.hvad);
        if (x.t.length > 330) lange.push(x.hvad + " (" + x.t.length + ")");
    });
    samlet("ingen tankestreger (" + tekster.length + " tekster)", streger);
    samlet("intet ASCII-dansk", ascii);
    samlet("teksterne er korte", lange);
    samlet("ingen ladning skrevet som 1+ eller 1−", ladning);
    paastand("siden har ingen tankestreger", !/[–—]/.test(html));
    paastand("ingen Kemichael", !d.querySelector('script[src*="kemichael"]'));

    /* ================================================================= */
    overskrift("6. Kortet dækker aldrig whiteboardet");
    var daekker = [], raekke = [];
    [[1100, 620], [1300, 800], [1600, 950]].forEach(function (str) {
        ramme.style.width = str[0] + "px";
        ramme.style.height = str[1] + "px";
        [o, p, u].forEach(function (sim) {
            NK.visFane("fane-" + sim.navn);
            if (sim === u) { sim.forfra(); sim.udfoer(); tid(sim, 8); } else sim.vaelg(0);
            sim.lay = null; sim.tilpas(); sim.layout();
            sim.svarValg(1);
            var kortR = el(sim.navn + "-skort").getBoundingClientRect(), c = sim.L.canvas.getBoundingClientRect();
            var tavleTop = c.top + sim.lay.tavle.y;
            if (kortR.bottom > tavleTop + 1) daekker.push(str.join("×") + " " + sim.navn + " (" + Math.round(kortR.bottom - tavleTop) + " px)");
            var k = el(sim.navn + "-knap"), ind = el(sim.navn + "-indsend");
            if (Math.abs(k.getBoundingClientRect().top - ind.getBoundingClientRect().top) > 4) raekke.push(str.join("×") + " " + sim.navn);
        });
    });
    samlet("kortet slutter over whiteboardet", daekker);
    samlet("hint og Indsend svar står på samme række", raekke);
    ramme.style.width = ""; ramme.style.height = "";
}
</script>
