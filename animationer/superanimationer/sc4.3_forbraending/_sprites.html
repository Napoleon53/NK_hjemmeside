<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc4.3 Forbrænding</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:"Segoe UI",sans-serif; margin:0; padding:24px; }
    h1 { font-size:1.1rem; margin:0 0 4px; }
    p { margin:0 0 20px; color:#a9b0ba; font-size:0.9rem; }
    .raekke { display:flex; gap:48px; align-items:flex-end; flex-wrap:wrap; }
    figure { margin:0; text-align:center; }
    figcaption { margin-top:10px; font-size:0.85rem; color:#cfd6de; }
    .bund { background:#1d1e26; border:1px solid #33343f; border-radius:10px; padding:20px 28px; }
</style>
</head>
<body>
<!-- Udviklerværktøj. Indgår ikke i animationen og kan slettes.
     Viser de to sprites alene, så de kan bedømmes, før de er i bevægelse. -->
<h1>Sprites i sc4.3</h1>
<p>Flammen, luftkraven med hullet, luftreguleringens knap, stativet og soden på skeen tegnes af animationen, fordi de bevæger sig. Molekylerne er ikke sprites.</p>
<div class="raekke">
    <figure><div class="bund"><img src="sprites/braender.svg" width="135" alt="Bunsenbrænder uden luftkrave"></div><figcaption>braender.svg (efter sc5.9's bunsen.svg)</figcaption></figure>
    <figure><div class="bund"><img src="sprites/ske.svg" width="255" alt="Ske af stål"></div><figcaption>ske.svg</figcaption></figure>
</div>
</body>
</html>
