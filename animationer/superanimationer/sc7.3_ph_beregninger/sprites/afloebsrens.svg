<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">
  <!-- Afloebsrens: plastflaske med boernesikret laag og faremaerket for aetsende. Staar paa y 118. -->
  <defs>
    <linearGradient id="flaske" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c6d2"/>
      <stop offset="0.35" stop-color="#f4f7fa"/>
      <stop offset="1" stop-color="#aab6c2"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="116" rx="30" ry="3.2" fill="#000000" fill-opacity="0.3"/>
  <!-- Laaget -->
  <rect x="38" y="6" width="24" height="18" rx="3" fill="#e0671d" stroke="#9c4411" stroke-width="1.3"/>
  <g stroke="#9c4411" stroke-width="1.2"><path d="M42 8 v14 M47 8 v14 M52 8 v14 M57 8 v14"/></g>
  <!-- Flasken -->
  <path d="M40 24 L60 24 L60 32 Q74 36 74 50 L74 110 Q74 116 68 116 L32 116 Q26 116 26 110 L26 50 Q26 36 40 32 Z"
        fill="url(#flaske)" stroke="#7d8996" stroke-width="1.4"/>
  <!-- Etiket -->
  <rect x="29" y="52" width="42" height="56" rx="3" fill="#1f5fa8"/>
  <text x="50" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">AFLØBS-</text>
  <text x="50" y="74" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">RENS</text>
  <!-- Faremaerket: roed rombe med aetsende vaeske -->
  <g transform="translate(50 92)">
    <rect x="-11" y="-11" width="22" height="22" transform="rotate(45)" fill="#ffffff" stroke="#d42020" stroke-width="2.6"/>
    <!-- To glas, der drypper paa en plade og en haand -->
    <rect x="-8" y="-8" width="2.6" height="6" fill="#111111" transform="rotate(-40 -6.7 -5)"/>
    <rect x="3.4" y="-8" width="2.6" height="6" fill="#111111" transform="rotate(40 4.7 -5)"/>
    <circle cx="-5.2" cy="0" r="0.9" fill="#111111"/><circle cx="4.6" cy="0" r="0.9" fill="#111111"/>
    <path d="M-8.5 3 h4 l0.8 -1.2 l0.8 1.2 h1.4 v3 h-7 z" fill="#111111"/>
    <path d="M1.5 6 v-2.4 q0 -1.4 1.4 -1.4 h4.6 v1.2 h-3 v2.6 z" fill="#111111"/>
  </g>
  <rect x="31" y="40" width="4" height="66" rx="2" fill="#ffffff" fill-opacity="0.35"/>
</svg>
