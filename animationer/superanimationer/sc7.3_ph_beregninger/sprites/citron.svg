<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">
  <!-- Citron: en hel bagved og en halv med snitfladen fremad. Staar paa y 118. -->
  <defs>
    <radialGradient id="skal" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff07a"/>
      <stop offset="0.55" stop-color="#f4d12f"/>
      <stop offset="1" stop-color="#c99a12"/>
    </radialGradient>
    <path id="kile" d="M50 90 L67.48 90.81 A17.5 17.5 0 0 1 62.9 101.83 Z"/>
  </defs>
  <!-- Skygge -->
  <ellipse cx="54" cy="116" rx="40" ry="3.5" fill="#000000" fill-opacity="0.3"/>
  <!-- Den hele citron -->
  <path d="M34 78 Q36 52 64 52 Q88 53 92 70 Q97 72 97 76 Q93 80 90 80 Q84 100 62 101 Q36 100 34 78 Z"
        fill="url(#skal)" stroke="#a8800f" stroke-width="1.5"/>
  <path d="M50 60 Q60 55 72 58" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
  <!-- Den halve: skal, hvidt og kiler -->
  <circle cx="50" cy="90" r="25" fill="#f2cc2a" stroke="#a8800f" stroke-width="1.8"/>
  <circle cx="50" cy="90" r="21.5" fill="#fbf3c2"/>
  <g fill="#f7e36e" stroke="#eccf45" stroke-width="0.8">
    <use href="#kile"/>
    <use href="#kile" transform="rotate(45 50 90)"/>
    <use href="#kile" transform="rotate(90 50 90)"/>
    <use href="#kile" transform="rotate(135 50 90)"/>
    <use href="#kile" transform="rotate(180 50 90)"/>
    <use href="#kile" transform="rotate(225 50 90)"/>
    <use href="#kile" transform="rotate(270 50 90)"/>
    <use href="#kile" transform="rotate(315 50 90)"/>
  </g>
  <circle cx="50" cy="90" r="2.6" fill="#fbf3c2"/>
  <ellipse cx="44" cy="84" rx="3" ry="1.6" fill="#ffffff" fill-opacity="0.6" transform="rotate(-30 44 84)"/>
  <ellipse cx="57" cy="96" rx="2" ry="1.1" fill="#ffffff" fill-opacity="0.5" transform="rotate(20 57 96)"/>
</svg>
