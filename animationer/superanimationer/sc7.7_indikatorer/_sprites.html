<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc7.7 Indikatorer</title>
<style>
    body { background: #1b1d24; color: #dde3ea; font-family: "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 1rem; margin: 0 0 14px; color: #f2c53d; }
    .ark { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; padding: 12px; background: #f4f6f5; border: 1px solid #3a3a47; border-radius: 8px; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    figcaption { font-size: 0.8rem; color: #4a5260; }
</style>
</head>
<body>
<!-- Udviklerværktøj: viser sprites alene, før de sættes i bevægelse. Indgår ikke i animationen.
     Baggrunden er lys som tavlen, sprites er tegnet til den. -->
<h1>sc7.7: sprites i forstørret udgave</h1>
<div class="ark">
    <figure><img src="sprites/reagensglas_tom.svg" width="120"><figcaption>reagensglas_tom.svg (som sb4.11)</figcaption></figure>
    <figure><img src="sprites/draabeflaske.svg" width="168"><figcaption>draabeflaske.svg (som sb9.4)</figcaption></figure>
    <figure><img src="sprites/baegerglas.svg" width="300"><figcaption>baegerglas.svg (ny, til lys tavle)</figcaption></figure>
    <figure><img src="sprites/phmeter.svg" width="120"><figcaption>phmeter.svg (ny)</figcaption></figure>
</div>
</body>
</html>
