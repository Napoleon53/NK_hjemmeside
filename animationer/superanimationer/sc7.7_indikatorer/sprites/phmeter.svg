<svg xmlns="http://www.w3.org/2000/svg" width="48" height="190" viewBox="0 0 48 190">
  <!-- pH-meter som en pen, der staar i proeven (fane 2). Animationen skriver
       pH-tallet i displayet: x 8-40, y 30-56 (midten er (24, 43)).
       Elektroden er den lyse spids forneden; spidsen er (24, 186). -->
  <defs>
    <linearGradient id="krop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6f5e"/>
      <stop offset="0.35" stop-color="#3f8f79"/>
      <stop offset="1" stop-color="#25594b"/>
    </linearGradient>
    <linearGradient id="spids" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d3dc"/>
      <stop offset="0.4" stop-color="#f3f6f9"/>
      <stop offset="1" stop-color="#aeb9c4"/>
    </linearGradient>
  </defs>
  <!-- Elektroden -->
  <path d="M17 118 L17 178 Q17 188 24 188 Q31 188 31 178 L31 118 Z" fill="url(#spids)" stroke="#6b7685" stroke-width="1.6"/>
  <ellipse cx="24" cy="180" rx="5" ry="6" fill="#dfe7ee" stroke="#8a96a3" stroke-width="1"/>
  <!-- Kroppen -->
  <path d="M6 14 Q6 4 16 4 L32 4 Q42 4 42 14 L42 112 Q42 122 32 122 L16 122 Q6 122 6 112 Z"
        fill="url(#krop)" stroke="#1b4136" stroke-width="2" stroke-linejoin="round"/>
  <!-- Displayet -->
  <rect x="8" y="28" width="32" height="30" rx="4" fill="#dfe9d6" stroke="#1b4136" stroke-width="1.6"/>
  <!-- Knappen og teksten -->
  <circle cx="24" cy="84" r="7" fill="#e9eef2" stroke="#1b4136" stroke-width="1.6"/>
  <text x="24" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#e9f4ef" text-anchor="middle">pH</text>
  <path d="M11 12 L11 108" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
</svg>
