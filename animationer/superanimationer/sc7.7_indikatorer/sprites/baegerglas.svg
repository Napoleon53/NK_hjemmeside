  <g stroke="#6b7685" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
    <path d="M17 104 h14 M17 83 h14 M17 62 h14 M17 41 h14"/>
  </g>
  <path d="M24 26 L24 120" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>
