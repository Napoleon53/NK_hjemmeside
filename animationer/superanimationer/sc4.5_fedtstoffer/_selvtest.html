<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc4.6 Byg et fedtstof</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at smeltepunkterne passer med tabelværdierne,
   og at modellen falder, jo flere knæk der er, at kæderne har de
   rigtige vinkler, at hver ordre kan løses, at de rigtige fedtstoffer
   er faste og flydende de rigtige steder, at zoomvinduets molekyler
   holder sig inde og har den rigtige faste andel, at begge faner kan
   gennemføres (også med musen), at påskeægget virker, at sproget
   overholder reglerne, og at layoutet holder fra 520 × 380 til
   1500 × 900.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sc4.6-fabrik", "nk-sc4.6-koele", "nk-sc4.6-koele-opg", "nk-sc4.6-intro-fabrik", "nk-sc4.6-intro-koele", "nk-kemichael"];
var gemt = {};
try { NOEGLER.forEach(function (n) { gemt[n] = localStorage.getItem(n); localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }

var ramme = document.getElementById("ramme");
ramme.addEventListener("load", function () { setTimeout(koer, 1500); });
ramme.src = "index.html";

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) localStorage.removeItem(n); else localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    function tik(sim, sek) {
        var n = Math.round(sek * 60);
        for (var i = 0; i < n; i++) { sim.tilpas(); sim.opdater(1 / 60); }
        sim.tegn();
    }
    function klik(sel) { var e = d.querySelector(sel); if (e) e.click(); return !!e; }
    function mus(sim, type, x, y) {
        var r = sim.L.canvas.getBoundingClientRect();
        var e = new W.PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, pointerId: 1, bubbles: true, isPrimary: true, button: 0 });
        sim.L.canvas.dispatchEvent(e);
    }
    function traek(sim, x0, y0, x1, y1) {
        mus(sim, "pointerdown", x0, y0);
        for (var i = 1; i <= 8; i++) mus(sim, "pointermove", x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8);
        mus(sim, "pointerup", x1, y1);
    }
    function vises(el) { return !!el && W.getComputedStyle(el).display !== "none" && !el.closest("[hidden]"); }
    /* Papirkortet (6. nov. 2026): teksten paa kortet og kortets knap videre/hint */
    function bt(sim) { return sim.beskedTekst(); }
    function knapT(sim) {
        if (sim.sk.blivAaben()) { var v = sim.sk.blivEl.querySelector("[data-videre]"); return v ? v.textContent : ""; }
        if (!sim.sk.hintEl.hidden) return sim.sk.hintEl.textContent;
        return sim.sk.indsendEl.textContent;
    }
    function indsendGraa(sim) { return sim.sk.indsendEl.classList.contains("ikke-klar"); }
    function svarKnap(navn, j) { return d.querySelector("#" + navn + '-ind [data-valg="' + j + '"]'); }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, F = NK.Fedt;
    paastand("data.js og fedt.js er kørt", !!(D && D.SYRER && F && NK.Proeve));
    paastand("begge faner er bygget", !!(NK.sims && NK.sims["fane-fabrik"] && NK.sims["fane-koele"]));
    var sprites = ["koeleskab", "vindue", "glas", "kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var A = NK.sims["fane-fabrik"], B = NK.sims["fane-koele"];
    paastand("teorien er lukket fra start", !d.getElementById("teori").classList.contains("vis"));

    overskrift("2. Smeltepunkterne");
    paastand("tristearin 73 °C", F.smp(["S", "S", "S"]) === 73);
    paastand("triolein 5 °C", F.smp(["O", "O", "O"]) === 5);
    paastand("trilinolein −13 °C", F.smp(["L", "L", "L"]) === -13);
    paastand("trilinolenin −24 °C", F.smp(["Ln", "Ln", "Ln"]) === -24);
    paastand("SOS 43 °C (samme som SSO, rækkefølgen tæller ikke)", F.smp(["S", "O", "S"]) === 43 && F.smp(["S", "S", "O"]) === 43);
    var alle = F.alle();
    paastand("der er 20 fedtstoffer", alle.length === 20);
    var maalt = alle.filter(function (k) { return F.smpMaalt(k); });
    paastand("fem smeltepunkter er målte, resten står med ca.", maalt.length === 5 && /^ca\. /.test(F.smpTekst(["S", "O", "O"])) && !/ca/.test(F.smpTekst(["S", "S", "S"])));
    /* Et knaek mere giver aldrig et hoejere smeltepunkt */
    var raekke = ["S", "O", "L", "Ln"], brud = [];
    alle.forEach(function (k) {
        k.forEach(function (id, i) {
            var n = raekke.indexOf(id);
            if (n >= 3) return;
            var k2 = k.slice(); k2[i] = raekke[n + 1];
            if (F.smpRaa(k2) > F.smpRaa(k) + 1e-9) brud.push(k.join("") + "→" + k2.join(""));
        });
    });
    paastand("flere knæk giver lavere smeltepunkt", brud.length === 0, brud.slice(0, 4).join(", "));
    paastand("alle smeltepunkter ligger mellem −24 og 73 °C", alle.every(function (k) { var t = F.smp(k); return t >= -24 && t <= 73; }));

    overskrift("3. Kæderne");
    D.SYRER.forEach(function (s) {
        var k = F.kaede(s.id, 1), p = k.pkt;
        var laengder = true, vinkler = true;
        for (var i = 1; i < p.length; i++) {
            var l = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
            if (Math.abs(l - 1) > 1e-9) laengder = false;
        }
        for (i = 1; i < p.length - 1; i++) {
            var ax = p[i - 1].x - p[i].x, ay = p[i - 1].y - p[i].y, bx = p[i + 1].x - p[i].x, by = p[i + 1].y - p[i].y;
            var v = Math.acos((ax * bx + ay * by)) * 180 / Math.PI;
            var cis = s.cis.indexOf(i + 1) >= 0 || s.cis.indexOf(i) >= 0;
            if (Math.abs(v - (cis ? 135 : 120)) > 0.01) vinkler = false;
        }
        /* Boejningen: retningen af de sidste to bindinger mod de foerste to */
        function midt(a, b, c) { return Math.atan2(c.y - a.y, c.x - a.x); }
        var boej = (midt(p[15], p[16], p[17]) - midt(p[0], p[1], p[2])) * 180 / Math.PI;
        var ventet = 30 * s.db;
        paastand(s.navn + ": 18 C-atomer, alle bindinger lige lange", p.length === 18 && laengder);
        paastand(s.navn + ": 120° og 135° ved cis-dobbeltbindingerne", vinkler);
        paastand(s.navn + ": " + s.db + " dobbeltbinding(er) og kæden bøjer " + ventet + "°", k.dobbelt.length === s.db && Math.abs(boej - ventet) < 1.5, boej.toFixed(1));
    });

    overskrift("4. Ordrerne");
    D.ORDRER.forEach(function (o) {
        var ok = alle.filter(function (k) { return F.tjekOrdre(o, k).ok; });
        paastand(o.kunde + ": kan løses (" + ok.length + " måder), og svaret løser den", ok.length >= 1 && F.tjekOrdre(o, o.svar).ok);
    });
    var galt = F.tjekOrdre(D.ORDRER[1], ["S", "S", "S"]);
    paastand("for hårdt fedt til salatbaren giver \"haard\"", !galt.ok && galt.galt === "haard");
    galt = F.tjekOrdre(D.ORDRER[0], ["O", "O", "O"]);
    paastand("for blødt fedt til fuglehuset giver \"bloed\"", !galt.ok && galt.galt === "bloed");

    overskrift("5. De rigtige fedtstoffer");
    var ventet = {
        smoer: ["fast", "fast", "delvist", "flydende"], kakao: ["fast", "fast", "fast", "flydende"],
        oliven: ["fast", "delvist", "flydende", "flydende"], solsikke: ["delvist", "flydende", "flydende", "flydende"],
        hoerfroe: ["flydende", "flydende", "flydende", "flydende"]
    };
    D.FEDT.forEach(function (f) {
        var sum = f.andel.S + f.andel.O + f.andel.L + f.andel.Ln;
        var t = D.STEDER.map(function (st) { return F.tilstand(f, st.T); });
        paastand(f.navn + ": fedtsyrerne giver 100 %, og " + t.join(", "), Math.abs(sum - 100) < 0.01 && t.join() === ventet[f.id].join(), t.join());
    });
    var pO = new NK.Proeve(D.fedt("oliven"), 5, 6), nO = pO.mol.filter(function (m) { return m.fast; }).length;
    paastand("olivenolie i køleskabet: delvist fast, en række på mindst to og resten løse", nO >= 2 && nO <= 4, nO);
    D.OPG_KOELE.forEach(function (o) {
        o.trin.forEach(function (t) {
            if (!t.gaet) return;
            var ok = t.svar.filter(function (v) { return v.ok; })[0].j;
            var tt = F.tilstand(D.fedt(t.fedt), D.sted(t.sted).T);
            paastand("gættet " + t.fedt + " " + D.sted(t.sted).i + " har svaret " + ok, tt === ok, tt);
        });
    });

    overskrift("6. Vinduet med kuglemodellerne (runde T10d)");
    var antalFejl = [], orden = [], nan = [], udenfor = [], roerer = [];
    D.FEDT.concat([{ id: "dit", kaeder: ["S", "O", "L"] }, { id: "dit2", kaeder: ["O", "O", "O"] }]).forEach(function (f) {
        D.STEDER.forEach(function (st) {
            var p = new NK.Proeve(f, st.T, 6);
            for (var i = 0; i < 300; i++) p.opdater(1 / 60);
            var faste = p.mol.filter(function (m) { return m.fast; });
            var fa = F.fastAndel(f, st.T), tt = D.tilstand(fa);
            var forventet = tt === "fast" ? 6 : (tt === "flydende" ? 0 : Math.min(4, Math.max(2, Math.round(fa / 100 * 6))));
            if (faste.length !== forventet) antalFejl.push(f.id + " " + st.id + " " + faste.length + "/" + forventet);
            var min = Math.min.apply(null, faste.map(function (m) { return m.smp; }).concat([Infinity]));
            if (p.mol.some(function (m) { return !m.fast && m.smp > min + 1e-9; })) orden.push(f.id + " " + st.id);
            /* Ved maalet: inde i vinduet, og de faste roerer ikke hinanden */
            p.mol.forEach(function (m) { m.x = m.maal.x; m.y = m.maal.y; m.a = m.maal.a; m.sx = m.maal.sx; m.sy = m.maal.sy; });
            var kugler = p.mol.map(function (m) { return NK.Fedt.placer(m.form, m.maal, false); });
            /* Vinduet er et udsnit: en hoej krystal maa fortsaette op over
               kanten (fx olivenolie i fryseren), men ikke ud til siderne
               eller i bunden, og de loese molekyler er helt inde */
            kugler.forEach(function (k, i) {
                var fast = p.mol[i].fast;
                k.forEach(function (q) {
                    if (!isFinite(q.x) || !isFinite(q.y)) nan.push(f.id);
                    if (q.x - q.r < -1 || q.x + q.r > p.W + 1 || (!fast && q.y - q.r < -1) || q.y + q.r > p.H + 1) udenfor.push(f.id + " " + st.id);
                });
            });
            for (var a1 = 0; a1 < p.mol.length; a1++) {
                for (var b1 = a1 + 1; b1 < p.mol.length; b1++) {
                    if (p.mol[a1].fast && p.mol[b1].fast &&
                        NK.Fedt.overlapper(NK.Fedt.placer(p.mol[a1].form, p.mol[a1].maal, true), NK.Fedt.placer(p.mol[b1].form, p.mol[b1].maal, true), -2.6)) roerer.push(f.id + " " + st.id);
                }
            }
        });
    });
    paastand("fast er alle seks i rækker, flydende ingen, delvist fast 2 til 4", antalFejl.length === 0, antalFejl.slice(0, 4).join("; "));
    paastand("de faste er dem med det højeste smeltepunkt", orden.length === 0, orden.slice(0, 3).join("; "));
    paastand("ingen kugler får ugyldige tal", nan.length === 0);
    paastand("de løse molekyler er inde i vinduet, og krystallen står på bunden", udenfor.length === 0, udenfor.slice(0, 4).join("; "));
    paastand("molekylerne i krystallen ligger tæt og går højst 2,5 enheder ind i hinanden (T10f)", roerer.length === 0, roerer.slice(0, 4).join("; "));
    var ps = new NK.Proeve(D.fedt("smoer"), 5, 6);
    paastand("smør i køleskabet: alle molekyler i vinduet er faste", ps.mol.every(function (m) { return m.fast; }));
    var smTop = Math.min.apply(null, ps.mol.map(function (m) { return Math.min.apply(null, NK.Fedt.placer(m.form, m.maal, false).map(function (q) { return q.y - q.r; })); }));
    paastand("smørkrystallen i køleskabet kan ses helt", smTop >= -1, Math.round(smTop));
    paastand("kuglerne har bogens geometri: 12 carbonatomer i hver kæde", NK.Fedt.kalotte(["S", "S", "S"]).kugler.filter(function (q) { return q.g === "C"; }).length === 3 + 36);
    paastand("dobbeltbindingernes carbonatomer er turkise (Cdb): 2 pr. dobbeltbinding", NK.Fedt.kalotte(["O", "L", "S"]).kugler.filter(function (q) { return q.g === "Cdb"; }).length === 6);

    overskrift("7. Fane 1: Fabrikken");
    klik('[data-fane="fane-fabrik"]');
    tik(A, 0.5);
    var tilbudA = d.getElementById("fabrik-tilbud");
    paastand("tilbuddet om præsentationen står der første gang", vises(tilbudA));
    klik("#fabrik-tilbud .tilbud-nej");
    paastand("Nej tak fjerner knapperne", !vises(tilbudA));
    var lay = A.lay, fl = lay.fliser;
    /* Klik paa en flise: den foerste ledige plads */
    mus(A, "pointerdown", fl[0].x + fl[0].b / 2, fl[0].y + fl[0].h / 2);
    mus(A, "pointerup", fl[0].x + fl[0].b / 2, fl[0].y + fl[0].h / 2);
    tik(A, 0.6);
    var vand = A.vande.filter(function (v) { return !v.ind; }).length;
    tik(A, 1.2);
    paastand("et klik på stearinsyre sætter den på den første OH-gruppe", A.slots[0].syre === "S" && A.slots[0].t >= 1);
    paastand("bindingen danner et vandmolekyle", vand === 1);
    /* Traek oliesyre hen paa plads 2 */
    var geo = A.geo();
    traek(A, fl[1].x + fl[1].b / 2, fl[1].y + fl[1].h / 2, geo.slot[1].C1.x + 2.2 * A.b, geo.slot[1].y);
    tik(A, 1.2);
    paastand("oliesyre kan trækkes hen på den midterste OH-gruppe", A.slots[1].syre === "O");
    /* Traek linolensyre hen paa plads 1 (optaget): de bytter */
    geo = A.geo();
    traek(A, fl[3].x + fl[3].b / 2, fl[3].y + fl[3].h / 2, geo.slot[0].C1.x + 2.2 * A.b, geo.slot[0].y);
    tik(A, 1.2);
    paastand("en fedtsyre sluppet på en optaget plads bytter den ud", A.slots[0].syre === "Ln" && A.slots[1].syre === "O");
    /* Klik paa kaeden: den gaar af */
    geo = A.geo();
    var pk = A.syrePunkter("O", A.slots[1].fortegn, geo.slot[1].C1.x, geo.slot[1].C1.y);
    mus(A, "pointerdown", pk[8].x, pk[8].y);
    mus(A, "pointerup", pk[8].x, pk[8].y);
    tik(A, 1);
    paastand("et klik på en kæde tager den af igen", A.slots[1].syre === null && /Vand spaltede/.test(bt(A)));
    /* Forkert vare */
    A.nyOrdre(); tik(A, 1);
    ["O", "O", "O"].forEach(function (id, i) { A.saetPaa(i, id, { x: 100, y: 100 }); });
    tik(A, 1.5);
    paastand("tre fedtsyrer bedømmes ikke af sig selv, men Indsend svar bliver klar", !A.loest && !/Ikke endnu/.test(bt(A)) && !indsendGraa(A) && !vises(A.sk.blivEl));
    klik("#fabrik-indsend"); tik(A, 0.2);
    paastand("triolein til fuglehuset afvises med et råd", !A.loest && A.sk.bundEl.className.indexOf("skidt") >= 0 && /lige kæder/.test(bt(A)));
    paastand("panelet viser smeltepunktet og de fire steder", /5 °C/.test(d.getElementById("fabrik-fedt").textContent) && d.querySelectorAll("#fabrik-fedt .stedlinje").length === 4);
    /* Knappen: hint, svaret */
    A.knap();
    paastand("knappen giver først et hint", /Hint/.test(bt(A)) && knapT(A) === "Vis svaret");
    A.knap(); tik(A, 4);
    paastand("Vis svaret bygger tristearin og leverer ordren", A.loest && A.kaeder() && A.kaeder().join() === "S,S,S" && knapT(A) === "Næste ordre");
    paastand("NK.ditFedt er det byggede fedt", NK.ditFedt && NK.ditFedt.join() === "S,S,S");
    /* Resten af ordrerne */
    var leveret = 1;
    for (var n = 1; n < D.ORDRER.length; n++) {
        A.knap(); tik(A, 1.2);
        var o = A.ordre();
        o.svar.forEach(function (id, i) { A.saetPaa(i, id, { x: 100, y: 100 }); });
        tik(A, 1.5);
        if (n === 1) paastand("det rigtige fedt bedømmes først med Indsend svar", !A.loest);
        klik("#fabrik-indsend"); tik(A, 0.2);
        if (n === 1) {
            var videreKnap = A.sk.blivEl.querySelector("[data-videre]");
            paastand("et rigtigt svar bliver på ordren med rosen og Næste ordre", A.loest && /Leveret/.test(bt(A)) && !!videreKnap &&
                videreKnap.textContent === "Næste ordre" && A.sk.bundEl.hidden && /Salatbaren/.test(A.sk.ind.textContent));
        }
        if (A.loest) leveret++;
    }
    paastand("alle fem ordrer kan leveres", leveret === 5 && A.leveret.length === 5, leveret);
    tik(A, 1.5);
    paastand("Kemichael kommer med ros efter fem ordrer", A.laerer && A.laerer.scene && A.laerer.scene.navn === "faerdig");
    A.knap();
    paastand("så er det fri leg, og knappen går videre", A.frileg && knapT(A) === "Til køleskabet" && !/Leveret/.test(bt(A)));
    tik(A, 8);
    A.knap();
    paastand("knappen i fri leg åbner køleskabet", d.getElementById("fane-koele").classList.contains("aktiv"));
    klik('[data-fane="fane-fabrik"]');
    A.nulstil();
    paastand("R starter ordrerne forfra", !A.frileg && A.leveret.length === 0 && A.ordreNr === 0);
    for (n = 0; n < D.ORDRER.length; n++) {
        A.ordre().svar.forEach(function (id, i) { A.saetPaa(i, id, { x: 100, y: 100 }); });
        tik(A, 1.5);
        A.indsend(); A.knap(); tik(A, 1.2);
    }
    tik(A, 1.5);
    paastand("anden gang roser Kemichael ikke igen", A.leveret.length === 5 && !(A.laerer.scene && A.laerer.scene.navn === "faerdig"));
    A.saetPaa(0, "S", { x: 100, y: 100 }); tik(A, 1.2);
    klik("#fabrik-forfra"); tik(A, 1);
    paastand("Start forfra giver ordre 1, ingen leveret og en tom glycerol", !A.frileg && A.leveret.length === 0 && A.ordreNr === 0 &&
        A.slots.every(function (s) { return !s.syre; }) && knapT(A) === "Giv hint" && indsendGraa(A));
    paastand("Start forfra står i panelet og ikke på kortet", !!d.querySelector(".panel #fabrik-forfra") && !d.querySelector("#fabrik-skort #fabrik-forfra") &&
        !/forfra/i.test(d.getElementById("fabrik-skort").textContent));

    overskrift("8. Fane 2: Fast eller flydende? (runde T10e)");
    klik('[data-fane="fane-koele"]');
    tik(B, 0.5);
    var O = B.opgaver, OK = D.OPG_KOELE, boble = d.getElementById("koele-boble"), dekl = d.getElementById("koele-dekl");
    function kortT() { return d.getElementById("koele-skort").textContent.replace(/ /g, " "); }
    function besked() { return d.getElementById("koele-besked").textContent; }
    function svarK(i) { return d.querySelector('#koele-ind [data-nr="' + i + '"]'); }
    function rigtigt() { var t = O.trin(); svarK(O.rigtigNr(t)).click(); klik("#koele-indsend"); }
    function traekTil(id, sted) {
        var gl = B.glasMedId(id), G = B.glasMaal(gl), Z = B.lay.zoner[sted];
        traek(B, G.x, G.bund - G.h * 0.4, Z.x + Z.b / 2, Z.y + Z.h * 0.6);
    }
    var synlige = function () { return B.glas.filter(function (g) { return B.synlig[g.id]; }).map(function (g) { return g.id; }).join(); };
    paastand("intet panel og intet tilbud om præsentationen på fane 2", !d.querySelector("#fane-koele .panel") && !vises(d.getElementById("koele-tilbud")));
    var rk = d.querySelectorAll("#koele-liste .or-knap");
    paastand(OK.length + " opgaver i rækken; kun den første har titel, resten er låst", rk.length === OK.length && OK.length === 3 &&
        rk[0].querySelector(".or-navn").textContent === OK[0].navn &&
        [].slice.call(rk, 1).every(function (k) { return k.disabled && k.querySelector(".or-navn").textContent === ""; }));
    paastand("Start forfra og Fri leg står i rækken, ikke på kortet", !!d.querySelector("#koele-raekke #koele-forfra") && !!d.querySelector("#koele-raekke #koele-frileg") &&
        !/forfra/i.test(kortT()));
    paastand("intet gæt: opgaverne begynder med en handling og forklarer bagefter", OK.every(function (o) { return o.trin[0].type === "handling" && o.trin[1].type === "valg"; }));
    paastand("de tre fedtstoffer i køleskabet er fast, flydende og delvist fast",
        F.tilstand(D.fedt("smoer"), 5) === "fast" && F.tilstand(D.fedt("solsikke"), 5) === "flydende" && F.tilstand(D.fedt("oliven"), 5) === "delvist");
    paastand("første trin: kun smørret på bordet, vinduet viser smørret, varedeklarationen er en stiplet plads",
        synlige() === "smoer" && !B.skjult("zoom") && B.valgt === B.glasMedId("smoer") && B.skjult("dekl") && dekl.classList.contains("plads"));
    paastand("kortet beder om handlingen, og smørret har en boble", /Træk smørret ind i køleskabet/.test(kortT()) && !boble.hidden && /køleskabet/.test(boble.textContent));
    var smoer = B.glasMedId("smoer");
    traekTil("smoer", "fryser"); tik(B, 1.5);
    paastand("smørret kan ikke sættes i fryseren, når opgaven siger køleskabet, og boblen kommer igen", smoer.sted === "bord" && !boble.hidden);
    traekTil("smoer", "koele"); tik(B, 0.3);
    paastand("smørret kan trækkes ind i køleskabet, og boblen forsvinder", smoer.sted === "koele" && boble.hidden);
    tik(B, 2.5);
    paastand("kortet går selv videre, og vinduet viser smørret ved 5 °C, helt fast", O.trinNr === 1 && O.tilstand === "trin" &&
        smoer.proeve.T === 5 && smoer.proeve.mol.every(function (m) { return m.fast; }));
    traekTil("smoer", "bord"); tik(B, 1);
    paastand("under et spørgsmål kan glasset ikke trækkes, og kortet blinker", smoer.sted === "koele" && O.el.kort.classList.contains("blink"));
    paastand("ingen boble under et spørgsmål", boble.hidden);
    paastand("Indsend svar er gråt uden valg", O.el.indsend.classList.contains("ikke-klar"));
    svarK(1).click();
    paastand("et svar vælger kun og bedømmer ikke af sig selv", O.tilstand === "trin" && svarK(1).classList.contains("valgt") && O.el.indsend.classList.contains("klar"));
    klik("#koele-indsend");
    paastand("et forkert svar bliver rødt og har sin egen forklaring", svarK(1).classList.contains("forkert") && /flytter sig ikke/.test(besked()));
    svarK(0).click(); klik("#koele-indsend"); tik(B, 0.1);
    var vk = d.querySelector("#koele-ind [data-videre]");
    paastand("et rigtigt svar: kortet bliver med forklaringen og Næste opgave, og varedeklarationen kommer frem",
        O.tilstand === "bliv" && !!vk && /Næste opgave/.test(vk.textContent) && svarK(0).classList.contains("rigtig") &&
        !B.skjult("dekl") && !dekl.classList.contains("plads") && /66 %/.test(dekl.textContent));
    vk.click(); tik(B, 0.5);
    paastand("opgave 2: smørret står i køleskabet, solsikkeolien på bordet, og titlerne på opgave 1 og 2 kan ses", O.nr === 1 && smoer.sted === "koele" &&
        synlige() === "smoer,solsikke" && rk[1].querySelector(".or-navn").textContent === OK[1].navn && rk[2].disabled);
    /* Resten af opgaverne: rigtige svar og glassene med musen */
    var flyttet = 0, nye = [];
    while (O.tilstand !== "resultat") {
        var t = O.trin();
        if (O.tilstand === "bliv") { klik("#koele-ind [data-videre]"); tik(B, 0.4); continue; }
        if (O.trinNr === 0) nye.push(synlige());
        if (t.type === "valg") rigtigt();
        else { traekTil(t.glas, t.sted); tik(B, 2.5); if (B.glasMedId(t.glas).sted === t.sted) flyttet++; }
        if (nye.length > 40) break;
    }
    paastand("alle opgaverne kan løses, og glassene trækkes på plads med musen", O.alleLoest() && flyttet === 2, flyttet);
    paastand("glassene kommer på bordet ét ad gangen", nye.join(" | ") === "smoer,solsikke | smoer,oliven,solsikke", nye.join(" | "));
    var iSkab = ["smoer", "oliven", "solsikke"].map(function (id) { return B.glasMedId(id); });
    paastand("alle tre står i køleskabet, hver på sin egen plads", iSkab.every(function (g) { return g.sted === "koele"; }) &&
        iSkab.map(function (g) { return g.plads; }).sort().join() === "0,1,2" &&
        Math.abs(B.pladsPos(iSkab[0]).x - B.pladsPos(iSkab[1]).x) > 20 && Math.abs(B.pladsPos(iSkab[1]).x - B.pladsPos(iSkab[2]).x) > 20 &&
        Math.abs(B.pladsPos(iSkab[0]).x - B.pladsPos(iSkab[2]).x) > 20);
    tik(B, 1.5);
    paastand("Kemichael roser, når alle opgaverne er løst", B.laerer && B.laerer.scene && B.laerer.scene.navn === "faerdig");
    paastand("slutkortet lægger op til fri leg uden en grøn knap, og fri leg er slået til", /Fri leg/.test(kortT()) && /Sæt glassene i fryseren/.test(kortT()) &&
        !d.querySelector("#koele-ind [data-videre]") && !!d.querySelector("#koele-ind .sk-luk") && B.fri() && synlige().split(",").length === 6);
    tik(B, 8);
    O.enter(); tik(B, 0.3);
    paastand("Enter på slutkortet skifter ikke fane", d.getElementById("fane-koele").classList.contains("aktiv"));
    /* Fri leg: alle glas kan flyttes, og et fuldt sted bytter */
    B.flyt(B.glasMedId("oliven"), "fryser"); B.flyt(B.glasMedId("solsikke"), "fryser");
    traekTil("kakao", "fryser"); tik(B, 1);
    var iFryser = B.glas.filter(function (g) { return B.synlig[g.id] && g.sted === "fryser"; }).map(function (g) { return g.id; });
    paastand("i fri leg kan alle glas trækkes, og et fuldt sted bytter glas", iFryser.length === 2 && iFryser.indexOf("kakao") >= 0, iFryser.join());
    /* Start forfra, Vis svaret paa en handling og hinttrappen */
    O.aabn(1, true); tik(B, 0.3);
    paastand("Start forfra giver trinene igen", O.nr === 1 && O.trinNr === 0 && O.tilstand === "trin" && synlige() === "smoer,solsikke");
    O.hjaelpKlik(); O.hjaelpKlik(); O.hjaelpKlik(); tik(B, 3);
    paastand("Vis svaret på en handling flytter glasset selv, og kortet går videre", B.glasMedId("solsikke").sted === "koele" && O.trinNr === 1 && O.tilstand === "trin");
    O.hjaelpKlik(); O.hjaelpKlik(); O.hjaelpKlik();
    paastand("hinttrappen: tre hint og så Vis svaret", /Hint 3 af 3/.test(besked()) && O.el.knap.textContent === "Vis svaret");
    O.hjaelpKlik();
    paastand("Vis svaret giver det rigtige svar med gult", O.tilstand === "bliv" && !!d.querySelector("#koele-ind .svar-vist"));
    /* Fri leg midt i en opgave og tilbage */
    O.aabn(2, true); tik(B, 0.3);
    klik("#koele-frileg"); tik(B, 0.3);
    paastand("Fri leg midt i en opgave: alle glas, og kortet har et rødt kryds", B.fri() && synlige().split(",").length === 6 && !!d.querySelector("#koele-ind .sk-luk"));
    klik("#koele-frileg"); tik(B, 0.3);
    paastand("Tilbage til opgaverne bringer eleven tilbage til opgave 3", !B.fri() && O.nr === 2 && synlige().split(",").length === 3);
    /* Anden gang roser han ikke */
    tik(B, 8);
    O.visResultat(); O.alleLoest() && B.alleLoest(); tik(B, 1.5);
    paastand("anden gang roser Kemichael ikke igen", !(B.laerer.scene && B.laerer.scene.navn === "faerdig"));
    /* Paaskeaegget (kun i den fri leg) */
    smoer = B.glasMedId("smoer");
    B.flyt(smoer, "sol");
    tik(B, D.HARSK_TID + 0.5);
    paastand("smør i solen i " + D.HARSK_TID + " s bliver harskt", smoer.harsk && smoer.proeve.mol.some(function (m) { return m.kaeder[0] === "C4"; }));
    paastand("Kemichael kommer", B.laerer.scene && B.laerer.scene.navn === "harsk");
    tik(B, 14);
    paastand("han sætter nyt smør på bordet", !smoer.harsk && smoer.sted === "bord");
    O.aabn(0, true); tik(B, 0.3);
    B.flyt(smoer, "sol"); tik(B, D.HARSK_TID + 1);
    paastand("i en opgave bliver smørret ikke harskt", !smoer.harsk);
    O.aabn(0, true); tik(B, 0.3);

    overskrift("Kemichaels præsentation: ét trin ad gangen (fælles test)");
    ["fane-fabrik", "fane-koele"].forEach(function (fane) {
        klik('[data-fane="' + fane + '"]');
        var sim = NK.sims[fane];
        tik(sim, 3);
        NK.Praesentation.selvtest(sim, function (sek) { tik(sim, sek); }).forEach(function (r) {
            paastand(fane + ": " + r[0], r[1], r[2]);
        });
    });
    /* Under praesentationen kommer det nye smoer uden ham, og rosen venter */
    B.opgaver.visResultat(); tik(B, 1);
    B.startIntro(true); tik(B, 2.5);
    smoer = B.glasMedId("smoer");
    B.flyt(smoer, "sol");
    tik(B, D.HARSK_TID + 5);
    paastand("harskt smør under præsentationen bliver skiftet uden ham", !smoer.harsk && B.laererIIntro() && !(B.laerer.scene && B.laerer.scene.navn === "harsk"));
    B.ventRos = 0.1; tik(B, 1);
    paastand("rosen venter, til præsentationen er slut", B.ventRos > 0 && B.laererIIntro());
    B.springIntro(); tik(B, 3);
    paastand("efter præsentationen kommer rosen", !B.laererIIntro() && !!(B.laerer.scene && B.laerer.scene.navn === "faerdig"));
    tik(B, 12);
    B.opgaver.aabn(0, true); tik(B, 1);

    overskrift("9. Sproget");
    var krop = d.body.innerText;
    var intro = [].concat(D.INTRO_FABRIK, D.INTRO_KOELE).map(function (l) { return l.tekst; });
    var ros = [].concat([D.ORDRER_FAERDIG, D.KOELE_FAERDIG, D.HARSK, D.NYT_SMOER], D.HARSK_IGEN);
    var replikker = intro.concat(ros);
    var tekster = replikker.concat(
        D.ORDRER.map(function (o) { return o.kunde + " " + o.tekst + " " + o.hint; }),
        D.OPG_KOELE.map(function (o) {
            return o.navn + " " + o.trin.map(function (t) {
                return [t.tekst, t.spm, t.slut, t.ikkeEndnu, t.svarTekst].concat(t.hint || [],
                    (t.svar || []).map(function (v) { return v.t + " " + (v.nej || ""); })).join(" ");
            }).join(" ");
        }));
    /* Kemibogens fagord (C 4.6): lige kaeder, ikke rette */
    var rette = tekster.filter(function (t) { return /\b[Rr]ette? kæde|kæder er rette/.test(t); });
    paastand("bogens ord: lige kæder (ikke rette kæder)", rette.length === 0 && !/[Rr]ette kæder/.test(d.getElementById("teori").textContent), rette[0]);
    var paahaeng = tekster.filter(function (t) { return /, og (fra|det giver|svaret skal)/.test(t); });
    paastand("ingen påhængt ', og ...' i opgaverne", paahaeng.length === 0, paahaeng[0]);
    var streg = tekster.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger i replikker, hints og forklaringer", streg.length === 0, streg.join(" | "));
    paastand("ingen tankestreger på siden", !/[–—]/.test(krop));
    paastand("ingen 1+ eller 1− på siden", !/1[+−-](?!\d)/.test(krop.replace(/\d+[+−-]\d/g, "")));
    /* Brugerens regel 4. nov. 2026: han siger mere ad gangen, i hele saetninger */
    var lange = intro.filter(function (t) { var n = t.split(/[.?] /).length; return t.length > 420 || n < 2 || n > 4; });
    paastand("hvert trin i præsentationen er to til fire sætninger (højst 420 tegn)", lange.length === 0, lange[0]);
    paastand("hver præsentation har to til fire trin", [D.INTRO_FABRIK, D.INTRO_KOELE].every(function (l) { return l.length >= 2 && l.length <= 4; }));
    var halve = intro.filter(function (t) { return !/^[A-ZÆØÅ].*\.$/.test(t) || /^Her\b/.test(t); });
    paastand("præsentationens trin er hele sætninger, og intet begynder med 'Her'", halve.length === 0, halve[0]);
    var korte = ros.filter(function (t) { return t.length > 130 || !/^[A-ZÆØÅ].*\.$/.test(t) || t.split(" ").length < 5; });
    paastand("ros og påskeæg er hele sætninger på højst 130 tegn", korte.length === 0, korte[0]);
    var tur = ["#fabrik-anker-fliser", "#fabrik-anker-glycerol", "#fabrik-skort", "#fabrik-ordrer", "#fabrik-fedt-kort", "#fabrik-anker-glas", "#fabrik-forfra",
        "#koele-anker-bord", "#koele-anker-skab", "#koele-anker-vindue", "#koele-anker-zoom", "#koele-skort", "#koele-dekl", "#koele-liste", "#koele-frileg"];
    paastand("alle rundvisningens mål findes", tur.every(function (s) { return !!d.querySelector(s); }));

    overskrift("10. Papirkortet");
    ["fabrik", "koele"].forEach(function (n) {
        var k = d.getElementById(n + "-skort");
        paastand(n + ": kortet står i scenen og ikke i panelet", !!k && !!k.closest(".scene") && !d.querySelector(".panel .scenekort") &&
            !d.getElementById(n + "-kort"));
        paastand(n + ": ingen statuslinje nederst i scenen", !d.getElementById(n + "-status") && !d.querySelector("#fane-" + n + " .scene-mrk"));
    });
    paastand("siden har papirkortet", d.body.classList.contains("papirkort") && !!NK.Papir && !!NK.SceneKort);

    overskrift("11. Layoutet");
    A.nyOrdre();
    ["S", "L", "Ln"].forEach(function (id, i) { A.saetPaa(i, id, { x: 100, y: 100 }); });
    var stoerrelser = [[1500, 900], [1400, 860], [1300, 820], [1100, 700], [1000, 640], [860, 700], [700, 600], [520, 380]];
    stoerrelser.forEach(function (st) {
        ramme.style.width = st[0] + "px";
        ramme.style.height = st[1] + "px";
        var problemer = [];
        ["fane-fabrik", "fane-koele"].forEach(function (id) {
            /* Fane 2 har intet panel fra runde T10 og testes fra 860 px
               (som fane 1 i sc4.1 efter T9): smallere er der ikke plads
               til vinduet med molekylerne ved siden af koeleskabet */
            if (id === "fane-koele" && st[0] < 860) return;
            klik('[data-fane="' + id + '"]');
            var sim = NK.sims[id];
            tik(sim, 1.5);
            var lay = sim.lay, Wc = lay.W, Hc = lay.H;
            /* Papirkortet holder sig i sin plads oeverst (kortZone) */
            var kEl = sim.sk ? sim.sk.e : sim.e.skort, kB = kEl.offsetTop + kEl.offsetHeight;
            var kR = { x: kEl.offsetLeft, y: kEl.offsetTop, b: kEl.offsetWidth, h: kEl.offsetHeight };
            if (kB > sim.kortZone() - 6) problemer.push(id + ": kortet går ud over sin plads (" + kB + " > " + sim.kortZone() + ")");
            if (lay.zone !== sim.kortZone()) problemer.push(id + ": tegningen følger ikke kortets plads");
            function indeR(r, navn) {
                if (r.x < -1 || r.y < -1 || r.x + r.b > Wc + 1 || r.y + r.h > Hc + 1) problemer.push(id + ": " + navn + " uden for");
            }
            function over(a, b, navn) {
                if (a.x < b.x + b.b - 1 && a.x + a.b > b.x + 1 && a.y < b.y + b.h - 1 && a.y + a.h > b.y + 1) problemer.push(id + ": " + navn);
            }
            if (id === "fane-fabrik") {
                lay.fliser.forEach(function (f, k) { indeR(f, "flise " + k); });
                var G = lay.glas, gr = { x: G.venstre, y: G.top, b: G.b, h: G.h };
                indeR(gr, "glasset");
                /* Molekylet: alle punkter inde og over bordet */
                var g2 = sim.geo(), x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
                sim.slots.forEach(function (s, i) {
                    var sl = g2.slot[i];
                    var pkt = s.syre ? sim.syrePunkter(s.syre, s.fortegn, sl.C1.x, sl.C1.y) : [sl.H];
                    pkt.concat([sl.lbl]).forEach(function (p) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); });
                });
                var mr = { x: x0 - 20, y: y0 - 10, b: x1 - x0 + 30, h: y1 - y0 + 20 };
                indeR(mr, "molekylet");
                if (mr.y + mr.h > lay.bordY + 2) problemer.push(id + ": molekylet går ned i bordet");
                over(mr, gr, "molekylet over glasset");
                over(mr, kR, "kortet over molekylet");
                if (g2.px < 12) problemer.push(id + ": atomerne er skrevet med " + g2.px.toFixed(1) + " px");
            } else {
                var K = lay.K, V = lay.V, z = lay.zoom;
                indeR({ x: K.x, y: K.top, b: K.b, h: K.h }, "køleskabet");
                indeR({ x: V.x, y: V.top, b: V.b, h: V.h }, "vinduet");
                indeR(z, "zoomvinduet");
                over({ x: K.x, y: K.top, b: K.b, h: K.h }, kR, "kortet over køleskabet");
                over({ x: V.x, y: V.top, b: V.b, h: V.h }, kR, "kortet over vinduet");
                over(z, kR, "kortet over zoomvinduet");
                over(z, { x: K.x, y: K.top, b: K.b, h: K.h }, "zoomvinduet over køleskabet");
                over(z, { x: V.x, y: V.top, b: V.b, h: V.h }, "zoomvinduet over vinduet");
                over(z, { x: K.x + K.b, y: lay.bordY - lay.gh, b: Wc, h: lay.gh }, "zoomvinduet over glassene på bordet");
                if (z.b < 150) problemer.push(id + ": zoomvinduet er kun " + z.b + " px bredt");
                /* Varedeklarationen (T10) */
                var de = d.getElementById("koele-dekl");
                var dr = { x: de.offsetLeft, y: de.offsetTop, b: de.offsetWidth, h: de.offsetHeight };
                indeR(dr, "varedeklarationen");
                over(dr, kR, "kortet over varedeklarationen");
                over(dr, z, "varedeklarationen over zoomvinduet");
                over(dr, { x: K.x, y: K.top, b: K.b, h: K.h }, "varedeklarationen over køleskabet");
                over(dr, { x: V.x, y: V.top, b: V.b, h: V.h }, "varedeklarationen over vinduet");
                over(dr, { x: K.x + K.b, y: lay.bordY - lay.gh, b: Wc, h: lay.gh }, "varedeklarationen over glassene på bordet");
                if (de.scrollWidth > de.clientWidth + 1) problemer.push(id + ": varedeklarationens tekst er for bred");
                var raekke = d.getElementById("koele-liste");
                if (raekke.scrollWidth > raekke.clientWidth + 1) problemer.push(id + ": rækken med opgaverne er for lang");
                Object.keys(lay.pladser).forEach(function (sid) {
                    lay.pladser[sid].forEach(function (p) {
                        var G2 = NK.Tegn.glasMaal(p.x, p.y, lay.gh);
                        indeR({ x: G2.venstre, y: G2.top, b: G2.b, h: G2.h }, "et glas " + sid);
                    });
                });
                var rum = K.koeleGulv - K.koeleTop;
                if (lay.gh > rum - 30) problemer.push(id + ": glassene er for høje til køleskabet");
            }
        });
        paastand("layoutet holder ved " + st[0] + " × " + st[1], problemer.length === 0, problemer.slice(0, 3).join("; "));
    });
    ramme.style.width = "";
    ramme.style.height = "";
    klik('[data-fane="fane-fabrik"]');
}
