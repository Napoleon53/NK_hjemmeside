<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 280 140">
  <!-- Pneumatisk kar. Tegnes OVEN PAA maaleglasset, saa den del af glasset,
       der staar under vand, faar vandets farve. Vandoverfladen ligger ved
       y 34, hyldens overside (hvor glassets aabning hviler) ved y 80, og
       hullet i hylden er centreret ved x 140. -->
  <defs>
    <linearGradient id="vand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb4e0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2b6a96" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d6eaf8" stop-opacity="0.24"/>
      <stop offset="0.05" stop-color="#d6eaf8" stop-opacity="0.04"/>
      <stop offset="0.95" stop-color="#d6eaf8" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#d6eaf8" stop-opacity="0.24"/>
    </linearGradient>
  </defs>

  <!-- Vand -->
  <rect x="7" y="34" width="266" height="97" fill="url(#vand)"/>
  <rect x="7" y="32.5" width="266" height="3" fill="#bfe3fa" fill-opacity="0.6"/>

  <!-- Hylde med hul til gassen -->
  <g fill="#8d99ae" fill-opacity="0.9">
    <rect x="100" y="80" width="33" height="8" rx="2"/>
    <rect x="147" y="80" width="33" height="8" rx="2"/>
    <rect x="106" y="88" width="6" height="43"/>
    <rect x="168" y="88" width="6" height="43"/>
  </g>
  <rect x="100" y="80" width="80" height="1.5" fill="#ffffff" fill-opacity="0.25"/>

  <!-- Glasvaegge -->
  <path d="M4 4 L4 132 Q4 138 10 138 L270 138 Q276 138 276 132 L276 4" fill="url(#glas)" stroke="#d6eaf8" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M8 6 L8 131 L272 131 L272 6" fill="none" stroke="#d6eaf8" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="2" y="1.5" width="8" height="4" rx="1.5" fill="#e6f3fb" fill-opacity="0.65"/>
  <rect x="270" y="1.5" width="8" height="4" rx="1.5" fill="#e6f3fb" fill-opacity="0.65"/>
  <path d="M20 46 L20 118" stroke="#ffffff" stroke-opacity="0.12" stroke-width="5" stroke-linecap="round"/>
  <path d="M260 50 L260 90" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" stroke-linecap="round"/>
</svg>
