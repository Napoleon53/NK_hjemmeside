<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc7.5 Stærke og svage syrer</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:760px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at modellen rammer Databogens syrekonstanter,
   at luppen viser det antal oxoniumioner, modellen siger (100 i
   saltsyre, omkring 1 i eddikesyre), at den svage syre bytter hydroner
   frem og tilbage uden at antallet løber, at kalken bruser efter
   [H₃O⁺], at alle mål på de tre faner kan løses (selv, med forkerte
   svar og med Vis svaret), at opgaven står på kortet øverst i scenen
   og ikke i panelet (gættet, det, eleven skal gøre, og spørgsmålene),
   at et klik på forsøget før gættet får kortet til at blinke, at
   kortet aldrig dækker lupperne eller glassene, at sproget holder
   reglerne, og at tingene kan være der fra 1100 × 620 til 1600 × 950.

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sc7.5-g", "nk-sc7.5-s", "nk-sc7.5-f"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|staa|paa|foerst|hoejre|haeld\w*|staerk\w*|oeverst|loest|proev\w*|baeger\w*|vaeske\w*|maal|gaet\w*|spoerg\w*|taet|faa|saa|naar)\b/i;
var gemt = {};
var ramme = document.getElementById("ramme");
var trin = 0;

/* Første indlæsning: gem elevens fremskridt, ryd det, og indlæs siden igen,
   så fanerne begynder ved første mål. Anden indlæsning: kør testen. */
ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 1200); }
});

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Kør en fane sek sekunder */
function koerF(F, sek) { for (var t = 0; t < sek; t += 1 / 60) F.opdater(1 / 60); }
function taet(a, b, tol) { return Math.abs(a - b) <= tol; }

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, K = NK.Kemi;
    var G = NK.sims["fane-g"], S = NK.sims["fane-s"], F = NK.sims["fane-f"];
    /* Det, eleven faar at vide: forklaringen til et loest maal (og til et rigtigt
       svar med et spoergsmaal til) staar paa kortet oeverst, alt andet i linjen forneden */
    /* statuslinje er beskeden i kortets nederste raekke (hint, fejl, klik); kortT er
       kortets hovedtekst (opgaven, spoergsmaalet eller forklaringen) */
    function statuslinje(X) { return X.el.besked.hidden ? "" : X.beskedTekst(); }
    function kortT(X) { var e = X.el.skort.querySelector(".sk-tekst"); return e ? e.textContent : ""; }
    function linje(X) { return X.faerdig || X.venter ? kortT(X) : statuslinje(X); }
    function videre(X) { return X.el.skort.querySelector(".sk-videre"); }
    function klasse(X) { return X.el.status.className; }
    function roed(X) { return /skidt/.test(klasse(X)); }
    function groen(X) { return X.el.skort.classList.contains("loest") && !X.el.skort.classList.contains("svar"); }
    function knaptekst(X) { return X.el.knap.textContent; }
    /* Tryk på hjælpeknappen, til målet er løst (hint, hint, hint, Vis svaret ...) */
    function visSvaret(X, i) {
        X.vaelg(i);
        for (var n = 0; n < 24 && !X.faerdig; n++) { X.knap(); koerF(X, 0.1); }
        return X.faerdig;
    }
    function rigtigt(X) { var del = X.opg.o[X.opg.fase], j = -1; del.svar.forEach(function (s, i) { if (s.ok) j = i; }); return j; }
    function forkert(X) { var del = X.opg.o[X.opg.fase], j = -1; del.svar.forEach(function (s, i) { if (!s.ok && j < 0) j = i; }); return j; }
    /* En rigtig mus på lærredet (syntetiske hændelser) */
    function mus(X, type, x, y) {
        var r = X.L.canvas.getBoundingClientRect();
        var e = new W.PointerEvent(type, { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y, button: 0, pointerId: 1 });
        X.L.canvas.dispatchEvent(e);
    }
    function klik(X, x, y) {
        mus(X, "pointermove", x, y); mus(X, "pointerdown", x, y); mus(X, "pointerup", x, y);
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.MouseEvent("click", { bubbles: true, clientX: r.left + x, clientY: r.top + y }));
    }
    function glasMidt(g) { var m = g.maal(); return { x: g.x, y: (m.flade + m.indBund) / 2 }; }

    /* ------------------------------------------------------------------ */
    overskrift("1. Modellen: hvor stor en del afgiver en hydron");
    paastand("pKs fra Databogen: eddikesyre 4,76, myresyre 3,75, citronsyre 3,13", K.SYRE.eddike.pKs === 4.76 && K.SYRE.myre.pKs === 3.75 && K.SYRE.citron.pKs === 3.13);
    paastand("saltsyre og salpetersyre er stærke, de tre andre svage", K.erStaerk("HCl") && K.erStaerk("HNO3") && !K.erStaerk("eddike") && !K.erStaerk("myre") && !K.erStaerk("citron"));
    paastand("stærk syre: [H₃O⁺] = c", K.oxonium("HCl", 0.10) === 0.10 && K.oxonium("HNO3", 0.010) === 0.010);
    var xe = K.oxonium("eddike", 0.10), Kse = K.Ks("eddike");
    paastand("svag syre: x² / (c − x) = Ks", taet(xe * xe / (0.10 - xe) / Kse, 1, 1e-9), xe);
    paastand("0,10 M eddikesyre: 1,3 % har afgivet en hydron, pH 2,88", taet(K.andel("eddike", 0.10), 0.0131, 0.0002) && K.pHTekst("eddike", 0.10) === "2,88", K.andel("eddike", 0.10));
    paastand("0,10 M myresyre: 4,1 %, og citronsyre: 8,2 %", taet(K.andel("myre", 0.10), 0.0413, 0.0005) && taet(K.andel("citron", 0.10), 0.0825, 0.0006), K.andel("myre", 0.10) + " / " + K.andel("citron", 0.10));
    paastand("pH i saltsyre: 1,00 ved 0,10 M, så 2,00, 3,00 og 4,00", K.TRIN.map(function (c) { return K.pHTekst("HCl", c); }).join(" ") === "1,00 2,00 3,00 4,00", K.TRIN.map(function (c) { return K.pHTekst("HCl", c); }).join(" "));
    paastand("fortyndingen går 0,10 › 0,010 › 0,0010 › 0,00010 M", K.TRIN.map(K.konc).join(" › ") === "0,10 M › 0,010 M › 0,0010 M › 0,00010 M", K.TRIN.map(K.konc).join(" › "));
    var lh = K.iLup("HCl", 0.10), le = K.iLup("eddike", 0.10), lm = K.iLup("myre", 0.10), lc = K.iLup("citron", 0.10);
    paastand("luppen ved 0,10 M: saltsyre 100 delte af 100, eddikesyre 1, myresyre 4, citronsyre 8",
        lh.haeldt === 100 && lh.delte === 100 && lh.hele === 0 && le.delte === 1 && le.hele === 99 && lm.delte === 4 && lc.delte === 8, [lh.delte, le.delte, lm.delte, lc.delte].join(","));
    paastand("luppen med fortyndet saltsyre: 10, 1 og 0 molekyler, alle delte",
        K.iLup("HCl", 0.010).haeldt === 10 && K.iLup("HCl", 0.010).delte === 10 && K.iLup("HCl", 0.0010).haeldt === 1 && K.iLup("HCl", 0.0010).delte === 1 && K.iLup("HCl", 0.00010).haeldt === 0);
    paastand("luppens rum er 1,66 · 10⁻²¹ L med ca. 55.000 vandmolekyler", taet(K.LUP_L, 1.66e-21, 0.01e-21) && K.VAND_I_LUP === 55000, K.LUP_L + " / " + K.VAND_I_LUP);
    paastand("brusen følger [H₃O⁺]: 1 i 0,10 M saltsyre, 0,013 i eddikesyre", K.brus("HCl", 0.10) === 1 && taet(K.brus("eddike", 0.10), 0.0131, 0.0002));
    paastand("saltsyre fortyndet 100 gange bruser omtrent som 0,10 M eddikesyre (inden for en faktor 1,5)",
        K.brus("eddike", 0.10) / K.brus("HCl", 0.0010) > 1 && K.brus("eddike", 0.10) / K.brus("HCl", 0.0010) < 1.5, K.brus("eddike", 0.10) / K.brus("HCl", 0.0010));
    paastand("myresyre bruser mere end eddikesyre, og citronsyre mere end myresyre", K.brus("myre", 0.10) > K.brus("eddike", 0.10) && K.brus("citron", 0.10) > K.brus("myre", 0.10));
    paastand("skemaerne: enkeltpil for den stærke, dobbeltpil for den svage",
        K.skema("HCl") === "HCl + H₂O → Cl⁻ + H₃O⁺" && K.skema("eddike") === "CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺" && K.skema("HNO3") === "HNO₃ + H₂O → NO₃⁻ + H₃O⁺", K.skema("eddike"));
    var afstemt = Object.keys(K.SYRE).every(function (id) { return D.S_MAAL.concat(D.G_MAAL).every(function (o) { return o.loest.indexOf(K.SYRE[id].formel + " + H₂O") < 0 || o.loest.indexOf(K.skema(id)) >= 0; }); });
    paastand("skemaerne i teksterne er modellens skemaer", afstemt);

    /* ------------------------------------------------------------------ */
    overskrift("2. Luppen: partiklerne følger modellen");
    function koerL(L, sek, hvert) { for (var t = 0; t < sek; t += 1 / 60) { L.opdater(1 / 60); if (hvert) hvert(); } }
    var L1 = new NK.Lup({ syre: "HCl", b: 400, h: 280 });
    var a1 = L1.antal();
    koerL(L1, 20);
    var a1b = L1.antal();
    paastand("saltsyre: 100 chloridioner, 100 oxoniumioner og ingen hele molekyler, også efter 20 s",
        a1.haeldt === 100 && a1.hele === 0 && a1.ox === 100 && a1b.hele === 0 && a1b.ox === 100 && L1.byt === 0, JSON.stringify(a1b));
    var L2 = new NK.Lup({ syre: "eddike", b: 400, h: 280 });
    var a2 = L2.antal(), min = 99, max = 0, sumfejl = 0, ude = 0;
    koerL(L2, 90, function () {
        var a = L2.antal();
        min = Math.min(min, a.delte); max = Math.max(max, a.delte);
        if (a.haeldt !== 100 || a.ox !== a.delte) sumfejl++;
        L2.enh.concat(L2.ox).forEach(function (p) { if (p.x < -0.5 || p.x > 400.5 || p.y < -0.5 || p.y > 280.5) ude++; });
    });
    paastand("eddikesyre: 99 hele molekyler, 1 acetation og 1 oxoniumion", a2.hele === 99 && a2.delte === 1 && a2.ox === 1, JSON.stringify(a2));
    paastand("eddikesyre: hydroner byttes frem og tilbage (mindst 5 gange på 90 s)", L2.byt >= 5, L2.byt);
    paastand("antallet af delte bliver ved 1 (kortvarigt 2 under et bytte) og når aldrig 0", min === 1 && max === 2, min + " til " + max);
    paastand("der er altid 100 molekyler, og én oxoniumion for hvert delt molekyle", sumfejl === 0, sumfejl);
    paastand("partiklerne bliver i vinduet", ude === 0, ude);
    var L3 = new NK.Lup({ syre: "eddike", b: 400, h: 280 });
    L3.bytter = false;
    var stille = true;
    koerL(L3, 30, function () { if (L3.antal().delte !== 1) stille = false; });
    paastand("med byttet slået fra står antallet stille på 1 (målet, hvor eleven tæller)", stille && L3.byt === 0);
    var L4 = new NK.Lup({ syre: "citron", b: 400, h: 280 }), min4 = 99, max4 = 0;
    koerL(L4, 60, function () { var a = L4.antal(); min4 = Math.min(min4, a.delte); max4 = Math.max(max4, a.delte); });
    paastand("citronsyre: 8 delte (kortvarigt 9), aldrig i nærheden af alle", min4 === 8 && max4 <= 9 && L4.byt >= 8, min4 + " til " + max4 + ", byt " + L4.byt);
    L1.saet("HCl", 0.010); koerL(L1, 1.2);
    var f1 = L1.antal();
    L1.saet("HCl", 0.0010); koerL(L1, 1.2);
    var f2 = L1.antal();
    L1.saet("HCl", 0.00010); koerL(L1, 1.2);
    var f3 = L1.antal();
    paastand("en fortynding fjerner ni tiendedele af partiklerne: 10 + 10, så 1 + 1, så ingen",
        f1.haeldt === 10 && f1.ox === 10 && f2.haeldt === 1 && f2.ox === 1 && f3.haeldt === 0 && f3.ox === 0 && L1.enh.length === 0, JSON.stringify([f1, f2, f3]));
    var o2 = L2.ox[0], hit = L2.ved(o2.x, o2.y), hel = L2.enh.filter(function (e) { return !e.delt; })[0];
    paastand("et klik rammer partiklen under musen", hit && hit.slags === "ox" && L2.ved(-50, -50) === null && !!L2.ved(hel.x, hel.y));
    L2.saetMaal(320, 240);
    paastand("partiklerne følger med, når vinduet skifter størrelse", L2.enh.concat(L2.ox).every(function (p) { return p.x >= 0 && p.x <= 320 && p.y >= 0 && p.y <= 240; }) && L2.s < 1);
    var FO = NK.Lup.FORM;
    paastand("formen følger stoffet: HCl og Cl⁻ er kugler, eddikesyre, myresyre og citronsyre er aflange",
        FO.HCl.slags === "kugle" && FO.eddike.slags === "pille" && FO.myre.slags === "pille" && FO.citron.slags === "pille" && FO.eddike.l > FO.myre.l && FO.citron.l > FO.eddike.l && FO.HNO3.slags === "trekant");
    var Lk = new NK.Lup({ syre: "eddike", b: 400, h: 280 }), ek = Lk.enh.filter(function (e) { return !e.delt; })[0], kn = Lk.knopVed(ek);
    paastand("hydronen sidder uden på det hele molekyle, for enden af det",
        taet(Math.hypot(kn.x - ek.x, kn.y - ek.y), Lk.F.arm + Lk.F.knop * 0.55, 0.01) && Lk.F.arm === FO.eddike.l && Lk.F.kant >= Lk.F.arm + Lk.F.knop);
    paastand("klikteksterne: oxoniumion, chloridion, acetation og et helt molekyle",
        /oxoniumion, H₃O⁺/.test(D.partikel("ox", "HCl", true)) && /^En chloridion, Cl⁻/.test(D.partikel("ion", "HCl", true)) && /^En acetation, CH₃COO⁻/.test(D.partikel("ion", "eddike", true)) &&
        /^Citronsyrens ion, C₆H₇O₇⁻/.test(D.partikel("ion", "citron", true)) && /helt molekyle eddikesyre, CH₃COOH\. Den lille orange kugle er hydronen/.test(D.partikel("hel", "eddike", true)) &&
        !/Cl|HNO|CH/.test(D.partikel("ion", "HNO3", false) + D.partikel("hel", "HNO3", false)), D.partikel("ion", "citron", true));

    /* ------------------------------------------------------------------ */
    overskrift("3. Glasset: kalken bruser efter [H₃O⁺]");
    function glasEfter(syre, c, sek, kalk) {
        var g = new NK.Glas({ id: "t", syre: syre, c: c });
        g.plads(300, 500, 180);
        if (kalk) g.kalkI(true);
        for (var t = 0; t < sek; t += 1 / 60) g.opdater(1 / 60);
        return g;
    }
    function rate(syre, c, sek) { return glasEfter(syre, c, sek, true).lavet / sek; }
    var rH = rate("HCl", 0.10, 10), rE = rate("eddike", 0.10, 120), rF = rate("HCl", 0.0010, 120);
    paastand("0,10 M saltsyre: 60 bobler i sekundet", taet(rH, 60, 1), rH.toFixed(1));
    paastand("0,10 M eddikesyre: under 1 boble i sekundet (0,79)", taet(rE, 0.79, 0.03), rE.toFixed(2));
    paastand("saltsyre fortyndet 100 gange: også under 1 boble i sekundet (0,60)", taet(rF, 0.60, 0.03), rF.toFixed(2));
    var tom = glasEfter("HCl", 0.10, 3, false);
    paastand("uden kalk kommer der ingen bobler", tom.bobler.length === 0 && tom.skum.length === 0 && tom.bruset === 0);
    var gT = new NK.Glas({ id: "t", syre: "HCl" });
    gT.plads(300, 500, 180);
    gT.kalkI(false);
    gT.opdater(0.2);
    var falder = gT.bobler.length === 0 && gT.kalkT < 1;
    for (var tt = 0; tt < 60; tt++) gT.opdater(1 / 60);
    paastand("kalken falder først til bunds, og så begynder det at bruse", falder && gT.kalkT === 1 && gT.bobler.length > 5, gT.bobler.length);
    var mT = gT.maal();
    paastand("boblerne bliver i væsken", gT.bobler.every(function (b) { return b.y <= mT.indBund && b.y >= mT.flade - 6 && b.x > mT.indV && b.x < mT.indH; }));

    /* ------------------------------------------------------------------ */
    overskrift("4. Fane 1: To glas");
    NK.visFane("fane-g");
    G.vaelg(0); G.tilpas(); G.layout();
    var gkG = d.getElementById("g-skort");
    paastand("startbilledet: to glas uden kalk, skålen, ingen lupper og intet regnskab",
        G.harKalk() === 0 && !G.aaben[0] && !G.aaben[1] && G.opg.fase === "gaet" && d.getElementById("g-regnkort").hidden);
    paastand("al tekst står på kortet øverst: der er ingen linje nederst i scenen, og scenen går helt til bunds",
        !d.querySelector(".statuslinje") && gkG.contains(G.el.status) && gkG.contains(G.el.besked) && gkG.contains(G.el.knap) && G.baand().h === 0 && G.baand().y === G.L.h &&
        G.glas[0].bund > G.L.h - 40 && gkG.getBoundingClientRect().bottom < G.L.canvas.getBoundingClientRect().top + G.glas[0].maal().y0, Math.round(gkG.getBoundingClientRect().bottom));
    paastand("gættet står på det gule kort midt i scenen med tre svar, ikke i panelet",
        gkG.classList.contains("gaet") && gkG.offsetHeight > 150 && gkG.querySelectorAll("[data-valg]").length === 3 && /Gæt først/i.test(gkG.textContent) && /I hvilket glas bruser kalken mest\?/.test(gkG.textContent) &&
        !d.getElementById("g-kort") && !d.getElementById("g-prompt") && d.querySelectorAll("#fane-g .panel [data-valg]").length === 0, gkG.textContent);
    paastand("under gættet er hjælpeknappen kun et lille omrids, Spring gættet over, og kortet har ingen besked",
        knaptekst(G) === "Spring gættet over" && /svar/.test(G.el.knap.className) && /lille/.test(G.el.knap.className) && statuslinje(G) === "" && G.el.besked.hidden, knaptekst(G));
    var p0 = glasMidt(G.glas[0]);
    klik(G, p0.x, p0.y);
    paastand("et klik på et glas før gættet: ingen kalk, kortet blinker og siger Gæt først", G.harKalk() === 0 && gkG.classList.contains("blink") && statuslinje(G) === D.GAET_LINJE && !G.el.besked.hidden, statuslinje(G));
    gkG.classList.remove("blink");
    var sk0 = G.lay.skaal;
    klik(G, sk0.x + sk0.b / 2, sk0.y + sk0.h / 2);
    paastand("et klik på skålen før gættet gør det samme, og kalken kan ikke trækkes endnu", !G.traek && G.harKalk() === 0 && gkG.classList.contains("blink"));
    koerF(G, 5.5);
    paastand("beskeden på kortet forsvinder igen efter nogle sekunder", statuslinje(G) === "" && G.el.besked.hidden);
    gkG.querySelector('[data-valg="1"]').click();
    paastand("et svar på kortet er gættet, og kortet viser nu, hvad der skal gøres", G.opg.gaet === 1 && !gkG.classList.contains("gaet") && gkG.classList.contains("opgave") &&

        if (ls.sigY - 17 < 10 + S.kortZone() || R2.y < ls.sigY + 16) pr.push("fane 2 signaturen har ikke plads");
        if (R2.h < (lav ? 130 : 190)) pr.push("fane 2 luppen er for lav " + Math.round(R2.h));
        if (R2.y + R2.h > glasR(S.glas[0]).y - 16) pr.push("fane 2 luppen rører glassene");
        if (S.glas[0].bund > ls.Hs - 20) pr.push("fane 2 glassene når ned i statuslinjen");

        /* Statuslinjen og panelet */
        ["g", "s", "f"].forEach(function (nv) {
            NK.visFane("fane-" + nv);
            if (!d.getElementById(nv + "-skort").contains(d.getElementById(nv + "-status"))) pr.push(nv + " kortets nederste række er ikke på kortet");
            var liste = rk(d.getElementById(nv + "-opgaver")), panel = rk(d.querySelector("#fane-" + nv + " .panel"));
            if (liste.right > panel.right + 1 || panel.width < 280) pr.push(nv + " panelet er for smalt " + Math.round(panel.width));
            Array.prototype.forEach.call(d.querySelectorAll("#fane-" + nv + " .panel .talraekke"), function (r) { if (rk(r).height > 44) pr.push(nv + " en række i panelet brækker over"); });
        });
        paastand(navn + "tingene kan være der på alle tre faner, og kortet dækker aldrig lupperne", pr.length === 0, pr.join("; "));
    });
    ramme.style.width = "";
    ramme.style.height = "";
    G.vaelg(0); S.vaelg(0); F.vaelg(0);
    NK.visFane("fane-g");
}
</script>
