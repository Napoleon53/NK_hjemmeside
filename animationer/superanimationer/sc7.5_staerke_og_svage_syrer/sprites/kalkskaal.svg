<svg xmlns="http://www.w3.org/2000/svg" width="150" height="64" viewBox="0 0 150 64">
  <!-- En lav glasskaal med stykker af kalk (marmor). Staar paa bordet:
       bunden ved y 60. Stykkerne ligger mellem x 28 og 122. -->
  <defs>
    <linearGradient id="skaal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.2"/>
      <stop offset="0.2" stop-color="#cfe6f7" stop-opacity="0.05"/>
      <stop offset="0.8" stop-color="#cfe6f7" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- Stykkerne bagest -->
  <g stroke="#8f8b82" stroke-width="1.3" stroke-linejoin="round">
    <path d="M34 50 L37 38 L47 33 L58 37 L60 50 Z" fill="#d9d5cc"/>
    <path d="M37 38 L47 33 L50 42 L41 45 Z" fill="#f6f4ee" stroke="none"/>
    <path d="M86 50 L89 36 L100 31 L112 36 L116 50 Z" fill="#d5d1c8"/>
    <path d="M89 36 L100 31 L104 41 L93 44 Z" fill="#f8f6f1" stroke="none"/>
    <path d="M58 52 L61 30 L74 24 L88 30 L92 52 Z" fill="#e6e3db"/>
    <path d="M61 30 L74 24 L78 37 L66 42 Z" fill="#fdfcf9" stroke="none"/>
    <path d="M78 37 L74 24 L88 30 L86 41 Z" fill="#f0eee7" stroke="none"/>
  </g>
  <!-- Stykkerne forrest -->
  <g stroke="#8f8b82" stroke-width="1.3" stroke-linejoin="round">
    <path d="M42 56 L45 46 L55 42 L66 46 L68 56 Z" fill="#ebe8e1"/>
    <path d="M45 46 L55 42 L58 50 L49 52 Z" fill="#fdfcf9" stroke="none"/>
    <path d="M80 56 L82 45 L93 41 L104 46 L106 56 Z" fill="#e2dfd7"/>
    <path d="M82 45 L93 41 L96 50 L86 52 Z" fill="#faf9f5" stroke="none"/>
  </g>

  <!-- Skaalen -->
  <path d="M14 30 Q18 58 34 58 L116 58 Q132 58 136 30 Z" fill="url(#skaal)"/>
  <path d="M8 28 Q13 29 14 32 Q18 58 34 58 L116 58 Q132 58 136 32 Q137 29 142 28"
        fill="none" stroke="#d6eaf8" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 60 L120 60" stroke="#d6eaf8" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <path d="M126 36 Q124 50 116 54" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.4" stroke-linecap="round"/>
</svg>
