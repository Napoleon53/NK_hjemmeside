<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200">
  <!-- Baegerglas paa 400 mL. Animationen tegner vaesken BAG filen,
       klippet til det indre: x 18-142, y 16-186 (bundens hjoerner r 8).
       Rumfang: y = 186 - 0,35 * V (V i mL), saa 400 mL staar ved y 46.
       Tuden sidder oeverst til venstre. Bunden staar paa y 190. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.30"/>
      <stop offset="0.15" stop-color="#d4ebfa" stop-opacity="0.07"/>
      <stop offset="0.85" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.24"/>
    </linearGradient>
  </defs>
  <path d="M18 16 L18 178 Q18 186 26 186 L134 186 Q142 186 142 178 L142 16 Z" fill="url(#glas)"/>
  <path d="M10 10 Q18 10 18 18 L18 180 Q18 188 26 188 L134 188 Q142 188 142 180 L142 16 Q142 12 146 11"
        fill="none" stroke="#dcecf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="128" y="26" width="4" height="150" rx="2" fill="#ffffff" fill-opacity="0.14"/>
  <g stroke="#eef6fc" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round">
    <path d="M19 151 h20 M19 116 h20 M19 81 h20 M19 46 h20"/>
  </g>
  <g stroke="#eef6fc" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round">
    <path d="M19 168.5 h10 M19 133.5 h10 M19 98.5 h10 M19 63.5 h10"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#eef6fc" fill-opacity="0.85">
    <text x="43" y="155">100</text>
    <text x="43" y="120">200</text>
    <text x="43" y="85">300</text>
    <text x="43" y="50">400 mL</text>
  </g>
</svg>
