  <rect x="68" y="44" width="4" height="84" rx="2" fill="#ffffff" fill-opacity="0.18"/>
  <rect x="16" y="46" width="2.5" height="80" rx="1.2" fill="#ffffff" fill-opacity="0.12"/>
