      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.34"/>
      <stop offset="0.18" stop-color="#d4ebfa" stop-opacity="0.08"/>
      <stop offset="0.82" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <!-- Proppen -->
  <path d="M32 4 L58 4 Q61 4 61 7 L61 12 Q61 14 58 14 L32 14 Q29 14 29 12 L29 7 Q29 4 32 4 Z" fill="#e9f3fa" fill-opacity="0.55" stroke="#dcecf8" stroke-opacity="0.9" stroke-width="1.3"/>
  <path d="M36 14 L54 14 L53 24 L37 24 Z" fill="#e9f3fa" fill-opacity="0.35" stroke="#dcecf8" stroke-opacity="0.8" stroke-width="1.1"/>
