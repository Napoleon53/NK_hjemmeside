    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6f3fb" stop-opacity="0.28"/>
      <stop offset="0.2" stop-color="#e6f3fb" stop-opacity="0.06"/>
      <stop offset="0.82" stop-color="#e6f3fb" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e6f3fb" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="laag" x1="0" y1="0" x2="0" y2="1">
