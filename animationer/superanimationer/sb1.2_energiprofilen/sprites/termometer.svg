<svg xmlns="http://www.w3.org/2000/svg" width="26" height="250" viewBox="0 0 26 250">
<!-- sb1.2 glastermometer. Kapillaerroeret x 11.5-14.5; 0 °C ved y 200 og 50 °C ved y 40
     (3,2 px pr. °C). Den roede soejle tegnes i js/sim_temp.js. Kuglen: (13, 234), r 9. -->
<defs>
  <linearGradient id="tm-glas" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfe9ef" stop-opacity="0.75"/>
    <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.7" stop-color="#e9f1f5" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#b7c7d1" stop-opacity="0.85"/>
  </linearGradient>
  <radialGradient id="tm-kugle" cx="0.38" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#ffb3a6"/>
    <stop offset="0.45" stop-color="#e5533d"/>
    <stop offset="1" stop-color="#a32a1b"/>
  </radialGradient>
</defs>
<!-- Roeret -->
<rect x="6" y="2" width="14" height="230" rx="7" fill="url(#tm-glas)" stroke="#6f8491" stroke-width="1.3"/>
<!-- Kapillaeret -->
<rect x="11.5" y="16" width="3" height="214" rx="1.5" fill="#f4f6f7" stroke="#9aabb6" stroke-width="0.7"/>
<!-- Skalaen: en streg pr. 5 °C, lang pr. 10 °C -->
<g stroke="#4b5560" stroke-width="0.9">
  <path d="M15.5 200 H20 M15.5 168 H20 M15.5 136 H20 M15.5 104 H20 M15.5 72 H20 M15.5 40 H20"/>
  <path d="M15.5 184 H18 M15.5 152 H18 M15.5 120 H18 M15.5 88 H18 M15.5 56 H18"/>
</g>
<!-- Kuglen -->
<circle cx="13" cy="234" r="9.5" fill="url(#tm-kugle)" stroke="#8f2a1b" stroke-width="0.8"/>
<ellipse cx="10" cy="230.5" rx="2.6" ry="3.4" fill="#ffffff" fill-opacity="0.55"/>
<!-- Lyset i roeret -->
<rect x="8" y="8" width="2.2" height="210" rx="1.1" fill="#ffffff" fill-opacity="0.8"/>
</svg>
