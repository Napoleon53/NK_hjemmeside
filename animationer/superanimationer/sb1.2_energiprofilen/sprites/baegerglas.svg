<svg xmlns="http://www.w3.org/2000/svg" width="130" height="176" viewBox="0 0 130 176">
<!-- sb1.2 baegerglas paa 100 mL med 50 mL thiosulfat og syre. Svovlet goer blandingen
     maelket med et svagt gult skaer. Bunden ved y 172, 0 mL ved y 167, 100 mL ved y 46
     (1,21 px pr. mL). Vaeskens overflade ved y 106 (50 mL). Etiketten tegnes i js/sim_temp.js
     paa feltet x 18-96, y 32-78 (under vandbadets kant og over vandet). -->
<defs>
  <linearGradient id="bg-vaeske" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f3dc" stop-opacity="0.93"/>
    <stop offset="0.6" stop-color="#efe7c4" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#e4d9ad" stop-opacity="0.97"/>
  </linearGradient>
  <linearGradient id="bg-skygge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a7a3a" stop-opacity="0.22"/>
    <stop offset="0.18" stop-color="#8a7a3a" stop-opacity="0"/>
    <stop offset="0.82" stop-color="#8a7a3a" stop-opacity="0"/>
    <stop offset="1" stop-color="#8a7a3a" stop-opacity="0.26"/>
  </linearGradient>
  <linearGradient id="bg-glas" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
    <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.03"/>
    <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.02"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
  </linearGradient>
  <linearGradient id="bg-kant" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#cfe1ec"/>
  </linearGradient>
  <linearGradient id="bg-glans" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Glassets krop (svagt lys) -->
<path d="M12 10 V160 Q12 172 24 172 H106 Q118 172 118 160 V10 Z" fill="url(#bg-glas)"/>

<!-- Vaesken: 50 mL -->
<path d="M14.5 106 V159 Q14.5 169.5 25 169.5 H105 Q115.5 169.5 115.5 159 V106 Z" fill="url(#bg-vaeske)"/>
<path d="M14.5 106 V159 Q14.5 169.5 25 169.5 H105 Q115.5 169.5 115.5 159 V106 Z" fill="url(#bg-skygge)"/>
<!-- Overfladen og menisken -->
<path d="M14.5 103 Q16 107.5 22 108 H108 Q114 107.5 115.5 103" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.6"/>
<path d="M22 110.5 H108" stroke="#b9a970" stroke-opacity="0.35" stroke-width="1.2"/>

<!-- Skalaen -->
<g stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.3" stroke-linecap="round">
  <path d="M100 46 H112"/>
  <path d="M106 58.1 H112 M106 70.2 H112 M106 82.3 H112 M106 94.4 H112"/>
  <path d="M100 106.5 H112"/>
  <path d="M106 118.6 H112 M106 130.7 H112 M106 142.8 H112"/>
</g>
<g fill="#ffffff" fill-opacity="0.9" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" text-anchor="end">
  <text x="98" y="104">50</text>
  <text x="111" y="34" font-size="8" fill-opacity="0.75">mL</text>
</g>

<!-- Glassets kanter: tykt glas med lys inderkant -->
<path d="M12 8 V160 Q12 172 24 172 H106 Q118 172 118 160 V8" fill="none" stroke="url(#bg-kant)" stroke-width="3.4" stroke-linejoin="round"/>
<path d="M15 12 V159 Q15 169 25 169 H105 Q115 169 115 159 V12" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>
<!-- Den tykke bund -->
<path d="M18 171.5 H112" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
<!-- Kanten foroven med tud til venstre -->
<path d="M4 4 Q8 3 12 8" fill="none" stroke="url(#bg-kant)" stroke-width="3.4" stroke-linecap="round"/>
<path d="M118 8 Q120 4 125 4" fill="none" stroke="url(#bg-kant)" stroke-width="3.4" stroke-linecap="round"/>
<!-- Lyset i glasset -->
<rect x="19" y="14" width="7" height="146" rx="3.5" fill="url(#bg-glans)"/>
<rect x="29" y="20" width="2.4" height="120" rx="1.2" fill="#ffffff" fill-opacity="0.22"/>
<rect x="110" y="120" width="3" height="40" rx="1.5" fill="#ffffff" fill-opacity="0.28"/>
</svg>
