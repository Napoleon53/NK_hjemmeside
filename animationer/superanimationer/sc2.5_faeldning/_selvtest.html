<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - sc2.5 Fældning</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og kontrollerer det, man ikke kan se
   paa et skaermbillede: at formlerne og ladningerne gaar op, at skemaet
   giver de rigtige bundfald, at draaberne havner, hvor de skal, at
   ionerne i luppen passer med reaktionsskemaet, at opgaven kun godtager
   det rigtige svar og giver et hint, der passer til fejlen, at laereren
   dukker op efter nok fjol, at de ekstra flasker og det frie forsøg
   laases op, at opgaven i det frie forsøg kun godtager det helt rigtige
   svar, og at teksterne hverken har tankestreger eller "1+".

   Skal aabnes gennem en lokal server (eller i Firefox): Chrome nægter
   en side paa file:// at kigge ind i sin egen iframe.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1500); });

function koer() {
    var ramme = document.getElementById("ramme");
    var d, NK;
    try {
        d = ramme.contentDocument;
        NK = ramme.contentWindow.NK;
    } catch (e) {
        skriv("Kan ikke kigge ind i iframen. Åbn siden gennem en lokal server.", "fejl");
        fejl++;
        vis();
        return;
    }
    var tekster = [];

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) { vis(); return; }
    paastand("forsoeg, opgave og fri opgave er bygget", !!(NK.forsoeg && NK.opgave && NK.fritOpgave));
    NK.Sprites.NAVNE.forEach(function (n) { paastand("sprite " + n + " er indlaest", NK.Sprites.klar(n)); });

    var D = NK.Data, f = NK.forsoeg, O = NK.opgave;
    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) f.opdater(1 / 60); }
    function dryp(nr, oplId) { f.tagFlaske(D.opl(oplId).nr); adv(0.3); var ok = f.drypI(nr); adv(1.2); return ok; }
    function udfoer(nr) { var F = D.FELTER[nr]; dryp(nr, F.soejle); dryp(nr, F.raekke); f.saetTilbage(); adv(0.2); }
    function frisk() { f.nulstil(); NK.opdaterPanel(); }

    overskrift("2. Kemien i data.js");
    var formler = D.OPLOESNINGER.map(function (o) { return o.formel; }).join(" ");
    paastand("flaskernes formler", formler === "AgNO₃ BaCl₂ CuSO₄ NaCl Na₂SO₄ Na₂CO₃ Na₃PO₄ Na₂S Fe(NO₃)₃", formler);
    paastand("Na₂S og Fe(NO₃)₃ er de ekstra flasker", D.BONUS.join(",") === "Na2S,FeNO33", D.BONUS.join(","));
    paastand("ladningerne gaar op i alle opløsninger", D.OPLOESNINGER.every(function (o) {
        return o.p * D.IONER[o.kat].q + o.n * D.IONER[o.an].q === 0;
    }));
    var kat = ["Ag", "Ba", "Cu", "Fe", "Na"], an = ["NO3", "Cl", "SO4", "CO3", "PO4", "S"], mangler = [];
    kat.forEach(function (k) { an.forEach(function (a) { if (D.tungtoploeseligt(k, a) && !D.BUNDFALD[k + "-" + a]) mangler.push(k + "-" + a); }); });
    paastand("alle tungtopløselige par har en farve", mangler.length === 0, mangler.join(", "));

    var VENTET = ["Ag-Cl", "", "", "Ag-SO4", "Ba-SO4", "", "Ag-CO3", "Ba-CO3", "Cu-CO3", "Ag-PO4", "Ba-PO4", "Cu-PO4"];
    var fik = D.FELTER.map(function (F) { var b = D.forventet(F).bundfald; return b.length ? b.map(function (x) { return x.noegle; }).join("+") : ""; });
    paastand("skemaet giver de rigtige bundfald i alle 12 felter", fik.join(",") === VENTET.join(","), fik.join(","));
    var FORMLER = { "Ag-Cl": "AgCl", "Ag-SO4": "Ag₂SO₄", "Ag-CO3": "Ag₂CO₃", "Ag-PO4": "Ag₃PO₄", "Ba-SO4": "BaSO₄",
        "Ba-CO3": "BaCO₃", "Ba-PO4": "Ba₃(PO₄)₂", "Cu-CO3": "CuCO₃", "Cu-PO4": "Cu₃(PO₄)₂",
        "Fe-PO4": "FePO₄", "Fe-S": "Fe₂S₃", "Ag-S": "Ag₂S", "Cu-S": "CuS", "Fe-SO4": "Fe₂(SO₄)₃" };
    Object.keys(FORMLER).forEach(function (n) {
        var p = n.split("-");
        paastand("formlen for " + FORMLER[n], D.bundfaldFormel(p[0], p[1]) === FORMLER[n], D.bundfaldFormel(p[0], p[1]));
    });
    var skema = D.reaktionsskema("Ba", "PO4");
    paastand("reaktionsskemaet for Ba₃(PO₄)₂", skema === "3 Ba²⁺(aq) + 2 PO₄³⁻(aq) → Ba₃(PO₄)₂(s)", skema);
    var ionTekster = Object.keys(D.IONER).map(D.ionTekst).join(" ");
    paastand("ioner med ladning ±1 skrives uden 1", ionTekster === "Ag⁺ Ba²⁺ Cu²⁺ Fe³⁺ Na⁺ NO₃⁻ Cl⁻ SO₄²⁻ CO₃²⁻ PO₄³⁻ S²⁻", ionTekster);
    paastand("ingen bundfald er dobbelt i ét rigtigt udfoert felt", D.FELTER.every(function (F) { return D.forventet(F).bundfald.length <= 1; }));
    paastand("BaS er letopløseligt, CuS og Ag₂S tungtopløselige", !D.tungtoploeseligt("Ba", "S") && D.tungtoploeseligt("Cu", "S") && D.tungtoploeseligt("Ag", "S"));

    var jern = D.FRIT_OPGAVE[0].salte.map(function (s) { return s.formel; }).join(" ");
    var sulfid = D.FRIT_OPGAVE[1].salte.map(function (s) { return s.formel; }).join(" ");
    paastand("opgavens jern(III)salte, uden Fe₂(CO₃)₃", jern === "Fe(NO₃)₃ FeCl₃ Fe₂(SO₄)₃ FePO₄ Fe₂S₃", jern);
    paastand("opgavens sulfider", sulfid === "Ag₂S BaS CuS Na₂S Fe₂S₃", sulfid);
    var tunge = NK.fritOpgave.salte().filter(function (s) { return s.tung; }).map(function (s) { return s.formel; }).join(" ");
    paastand("de tungtopløselige er FePO₄, Fe₂S₃, Ag₂S og CuS", tunge === "FePO₄ Fe₂S₃ Ag₂S CuS", tunge);

    overskrift("3. Draabeflasker og felter");
    frisk();
    paastand("alle flasker staar i stativet fra start", f.flasker.every(function (x) { return x.iStativ; }) && f.haand === -1);
    f.tagFlaske(0);
    paastand("en flaske kan tages op", f.haand === 0 && !f.flasker[0].iStativ);
    paastand("uden en flaske i haanden kan der ikke dryppes", (function () { f.saetTilbage(); return f.drypI(0) === false; }()));
    dryp(0, "AgNO3");
    paastand("én draabe AgNO₃ i feltet AgNO₃ + NaCl", f.felter[0].draaber.AgNO3 === 1 && f.status(0) === "delvis", JSON.stringify(f.felter[0].draaber));
    paastand("draaben er landet paa folien", f.felter[0].r > 10 && f.faldende.length === 0, f.felter[0].r.toFixed(1));
    dryp(0, "NaCl");
    paastand("NaCl ovenpaa giver bundfald", f.status(0) === "bundfald" && f.felter[0].blandTid >= 0);
    paastand("den forrige flaske er sat tilbage, naar en ny tages", f.flasker[0].iStativ && f.haand === D.opl("NaCl").nr);
    adv(2);
    paastand("bundfaldet er fuldt synligt efter et par sekunder", f.makroGrad(0) === 1);
    f.saetTilbage();
    adv(1.5);
    paastand("Esc/saetTilbage staar flasken i stativet igen", f.flasker.every(function (x) { return x.iStativ; }));

    udfoer(1);
    paastand("BaCl₂ + NaCl giver intet bundfald", f.status(1) === "intet" && f.felter[1].blandTid === -1);
    dryp(1, "Na3PO4");
    f.saetTilbage();
    paastand("en fremmed opløsning goer feltet forurenet", f.status(1) === "forurenet");
    paastand("Ba₃(PO₄)₂ dannes ogsaa i det forurenede felt", f.felter[1].analyse.bundfald.some(function (b) { return b.noegle === "Ba-PO4"; }));

    var n4 = 0;
    for (var i = 0; i < 4; i++) if (dryp(2, "CuSO4")) n4++;
    paastand("et felt kan rumme " + f.MAKS_DRAABER + " draaber", n4 === 4 && f.felter[2].antal === 4);
    paastand("den femte draabe afvises", dryp(2, "CuSO4") === false && f.felter[2].antal === 4);
    f.saetTilbage();

    f.toerAf(2);
    adv(1);
    paastand("Tør feltet af tømmer netop det felt", f.status(2) === "tom" && f.status(0) === "bundfald");
    f.toerAlt();
    adv(2);
    paastand("Tør folien af tømmer alle felter", f.felter.every(function (x) { return x.antal === 0; }));
    paastand("antal udfoerte felter er 0 igen", f.antalUdfoert() === 0);

    overskrift("4. Luppen og ionerne");
    frisk();
    [9, 10, 3, 7].forEach(udfoer);
    paastand("et tomt felt kan ikke vaelges", (f.vaelgFelt(0), f.valgt === -1));
    f.vaelgFelt(9);
    adv(0.1);
    function tael() { return f.mikro.optael(); }
    var t = tael();
    paastand("AgNO₃ + Na₃PO₄: 6 Ag⁺, 6 NO₃⁻, 18 Na⁺ og 6 PO₄³⁻", t.Ag.fri + t.Ag.bundet === 6 && t.NO3.fri === 6 && t.Na.fri === 18 && t.PO4.fri + t.PO4.bundet === 6, JSON.stringify(t));
    paastand("bundfaldet er 6 Ag⁺ og 2 PO₄³⁻, resten er i overskud", t.Ag.bundet === 6 && t.PO4.bundet === 2 && t.PO4.fri === 4);
    paastand("tilskuerionerne er ikke med i bundfaldet", t.Na.bundet === 0 && t.NO3.bundet === 0);
    adv(4);
    paastand("efter reaktionen ligger alle bundne ioner paa plads", f.mikro.ioner.every(function (x) { return !x.bundet || x.fremme; }));
    paastand("at se bundfaldet i luppen fuldfoerer trin 2", f.harKigget && f.trin() === 3);
    var Z = NK.Scene.ZOOM;
    paastand("alle ioner er inden for cirklen", f.mikro.ioner.every(function (x) {
        var dx = x.x - Z.x, dy = x.y - Z.y; return Math.sqrt(dx * dx + dy * dy) <= Z.r;
    }));
    paastand("luppen ligger ikke paa skraa, mens den bruges", Math.abs(f.lup.vinkel) < 0.05, f.lup.vinkel.toFixed(2));

    f.vaelgFelt(10);
    adv(0.1);
    t = tael();
    paastand("BaCl₂ + Na₃PO₄: 6 Ba²⁺ og 4 PO₄³⁻ i bundfaldet, 12 Cl⁻ frie", t.Ba.bundet === 6 && t.PO4.bundet === 4 && t.Cl.fri === 12 && t.Cl.bundet === 0, JSON.stringify(t));
    f.vaelgFelt(3);
    adv(0.1);
    t = tael();
    paastand("AgNO₃ + Na₂SO₄: 6 Ag⁺ og 3 SO₄²⁻ i bundfaldet", t.Ag.bundet === 6 && t.SO4.bundet === 3 && t.SO4.fri === 3, JSON.stringify(t));
    var ladning = 0;
    f.mikro.ioner.forEach(function (x) { if (x.bundet) ladning += D.IONER[x.id].q; });
    paastand("bundfaldet i luppen har ingen samlet ladning", ladning === 0, ladning);
    paastand("med mere end to draaber er der faerre ioner pr. draabe", f.mikro.PR_DRAABE(3) < f.mikro.PR_DRAABE(2));
    f.vaelgFelt(-1);
    adv(2);
    paastand("luppen ligger paa skraa, naar den er lagt fra sig", Math.abs(f.lup.vinkel - NK.Scene.LUP_HVILE.vinkel) < 0.05, f.lup.vinkel.toFixed(2));

    overskrift("5. Reaktionsskemaet");
    f.vaelgFelt(9);
    NK.opdaterPanel();
    var bygger = d.getElementById("opg-bygger");
    paastand("byggeren vises for et felt med bundfald", !bygger.hidden);
    paastand("de fire ioner i draaben kan vaelges", d.querySelectorAll("#opg-ioner .ionchip").length === 4);
    paastand("Tjek uden ioner taeller ikke som et forkert svar", O.tjek() === false && O.fejl === 0);
    /* Aftørring maa ikke faa tegningen til at gaa i staa (en draabe, der
       skrumper, gav før en negativ radius, og flaskerne forsvandt). */
    udfoer(0);
    f.toerAf(0);
    var tegneFejl = null;
    for (i = 0; i < 90 && !tegneFejl; i++) {
        f.opdater(1 / 60);
        try { f.tegn(); } catch (e) { tegneFejl = e.message; }
    }
    paastand("et felt kan tørres af, uden at tegningen går i stå", tegneFejl === null && f.status(0) === "tom", tegneFejl);

    f.vaelgFelt(7);
    NK.opdaterPanel();
    O.vaelgIon("Ba"); O.vaelgIon("CO3"); O.tjek();
    d.getElementById("opg-i1").click(); d.getElementById("opg-i2").click();
    paastand("Ba₂(CO₃)₂ er ikke de mindste hele tal", O.tjek() === false && d.getElementById("opg-besked").textContent === "Ladningerne går op, men brug de mindste hele tal.", d.getElementById("opg-besked").textContent);
    f.vaelgFelt(10);
    NK.opdaterPanel();
    O.vaelgIon("Ba"); O.vaelgIon("PO4"); O.tjek();
    d.getElementById("opg-i1").click(); d.getElementById("opg-i1").click(); d.getElementById("opg-i2").click();
    paastand("formlen får parentes, når der er mere end én PO₄³⁻",
        !d.getElementById("opg-p1").hidden && !d.getElementById("opg-p2").hidden &&
        d.getElementById("opg-i1").textContent === "3" && d.getElementById("opg-i2").textContent === "2");

    f.vaelgFelt(9);
    NK.opdaterPanel();
    paastand("spørgsmålet er, hvilke 2 ioner der går sammen", d.getElementById("opg-tekst").textContent === "Hvilke 2 ioner går sammen og danner den tungtopløselige forbindelse?", d.getElementById("opg-tekst").textContent);
    paastand("reaktionspilen er skjult, indtil ionerne er rigtige", d.getElementById("opg-produktdel").hidden);
    O.vaelgIon("Na"); O.vaelgIon("PO4");
    paastand("Na⁺ og PO₄³⁻ er forkert", O.tjek() === false && O.fejl === 1);
    var hint1 = d.getElementById("opg-besked").textContent;
    tekster.push(hint1);
    paastand("hintet handler om Na⁺", hint1.indexOf("Na⁺") >= 0, hint1);
    paastand("Vis svaret skjules efter én fejl", d.getElementById("opg-svar").hidden);
    O.vaelgIon("Ag");
    paastand("kationen skiftes ved at vaelge en anden", O.kat === "Ag");
    paastand("Ag⁺ og PO₄³⁻ er de rigtige ioner", O.tjek() === true && O.trin === "formel" && !f.felter[9].loest);
    paastand("reaktionspilen dukker op", !d.getElementById("opg-produktdel").hidden);
    paastand("beskeden beder om den neutrale formel", d.getElementById("opg-tekst").textContent === "Opskriv den neutrale kemiske formel for det udfældede salt.", d.getElementById("opg-tekst").textContent);
    O.vaelgIon("Na");
    paastand("ionerne kan ikke skiftes, mens formlen skrives", O.kat === "Ag");
    paastand("AgPO₄ er forkert", O.tjek() === false && O.fejl === 1);
    var hint2 = d.getElementById("opg-besked").textContent;
    tekster.push(hint2);
    paastand("hintet regner formlens ladning ud", hint2 === "AgPO₄ har ladningen 1 · (+1) + 1 · (−3) = −2. Formlen skal være neutral.", hint2);
    paastand("Vis svaret skjules efter én fejl i formlen", d.getElementById("opg-svar").hidden);
    d.getElementById("opg-i1").click();
    paastand("Ag₂PO₄ er forkert", O.tjek() === false && O.fejl === 2);
    tekster.push(d.getElementById("opg-besked").textContent);
    paastand("Vis svaret kommer efter to fejl", !d.getElementById("opg-svar").hidden);
    d.getElementById("opg-i1").click();
    paastand("tallet skifter ved klik", O.iKat === 3 && d.getElementById("opg-i1").textContent === "3");
    paastand("ingen parentes om én PO₄³⁻", d.getElementById("opg-p1").hidden && d.getElementById("opg-p2").hidden);
    paastand("Ag₃PO₄ er rigtigt", O.tjek() === true && f.felter[9].loest);
    tekster.push(d.getElementById("opg-besked").textContent);
    var facit = d.getElementById("opg-facit");
    paastand("hele reaktionsskemaet vises", !facit.hidden && d.getElementById("opg-linje").hidden && facit.textContent === "3 Ag⁺(aq) + PO₄³⁻(aq) → Ag₃PO₄(s)", facit.textContent);
    paastand("efterskriften naevner tilskuerionerne", d.getElementById("opg-besked").textContent.indexOf("Na⁺ og NO₃⁻ er tilskuerioner") >= 0, d.getElementById("opg-besked").textContent);
    NK.opdaterPanel();
    paastand("der er 9 felter med bundfald at opskrive", O.ANTAL === 9, O.ANTAL);
    paastand("taelleren siger 1 af 9", d.getElementById("opg-taeller").textContent === "1 af 9", d.getElementById("opg-taeller").textContent);
    paastand("Næste felt med bundfald vises", !d.getElementById("opg-naeste").hidden);
    d.getElementById("opg-naeste").click();
    NK.opdaterPanel();
    paastand("og vaelger et andet uløst felt", f.valgt !== 9 && f.status(f.valgt) === "bundfald" && !f.felter[f.valgt].loest, f.valgt);

    f.vaelgFelt(7);
    NK.opdaterPanel();
    O.vaelgIon("Ba"); O.vaelgIon("Cl");
    O.tjek();
    var hint3 = d.getElementById("opg-besked").textContent;
    tekster.push(hint3);
    paastand("Cl⁻ i BaCl₂ + Na₂CO₃ peger paa feltet BaCl₂ + NaCl", hint3.indexOf("BaCl₂ + NaCl") >= 0, hint3);
    O.tjek();
    d.getElementById("opg-svar").click();
    tekster.push(d.getElementById("opg-besked").textContent, d.getElementById("opg-tekst").textContent);
    paastand("Vis svaret viser svaret uden at taelle med", O.kat === "Ba" && O.an === "CO3" && !f.felter[7].loest);
    f.vaelgFelt(9);
    NK.opdaterPanel();
    paastand("et løst felt vises laast med svaret", O.laast && d.getElementById("opg-tjek").hidden);
    f.vaelgFelt(7);
    NK.opdaterPanel();
    paastand("et vist svar kan proeves igen", !O.laast && O.fejl === 0);

    O.vaelgIon("Ag");
    paastand("ioner, der ikke er i draaben, kan ikke vaelges i panelet", d.querySelector('#opg-ioner [data-ion="Ag"]') === null);

    overskrift("6. Skemaet i panelet");
    var felter = d.querySelectorAll("#skema-tabel .skemafelt");
    paastand("12 felter", felter.length === 12);
    paastand("feltet AgNO₃ + Na₃PO₄ er markeret som løst", felter[9].classList.contains("loest") && felter[9].classList.contains("bundfald"));
    paastand("taelleren siger 4 af 12 felter", d.getElementById("skema-taeller").textContent === "4 af 12 felter", d.getElementById("skema-taeller").textContent);
    felter[3].click();
    paastand("klik i skemaet vaelger feltet til luppen", f.valgt === 3);

    overskrift("7. Den sarkastiske laerer");
    frisk();
    var L = f.laerer;
    udfoer(0);
    paastand("rigtige draaber faar ikke laereren frem", !L.aktiv && f.fjol === 0);
    dryp(1, "Na3PO4");
    dryp(2, "AgNO3");
    f.saetTilbage();
    paastand("to forkerte felter er ikke nok", f.fjol === 2 && !L.aktiv, f.fjol);
    dryp(1, "AgNO3");
    paastand("endnu en fremmed draabe i et felt, der allerede er forkert, taeller ikke", f.fjol === 2, f.fjol);
    dryp(4, "CuSO4");
    f.saetTilbage();
    paastand("det tredje forkerte felt faar laereren frem", f.fjol === 3 && L.aktiv && NK.LAERER_REPLIKKER.fjol.indexOf(L.tekst) >= 0, L.tekst);
    tekster.push(L.tekst);
    adv(1);
    NK.forsoeg.tegn();
    paastand("laereren og talebobblen kan klikkes paa", L.synlig() && L.omraade && L.omraade.length === 2);
    var bobbel = L.omraade[1];
    paastand("et klik paa talebobblen sender laereren vaek", f.ned({ x: bobbel.x + 10, y: bobbel.y + 10 }) === true && !L.aktiv);
    adv(1.5);
    paastand("laereren er gaaet igen", !L.synlig());
    for (i = 0; i < 4; i++) dryp(5, "CuSO4");
    dryp(5, "CuSO4");
    dryp(5, "CuSO4");
    f.saetTilbage();
    paastand("et fyldt felt taeller én gang, uanset hvor mange forsøg", f.fjol === 4, f.fjol);
    dryp(6, "BaCl2"); dryp(8, "NaCl");
    f.saetTilbage();
    paastand("efter tre fjol mere siger laereren noget igen", f.fjol === 6 && L.aktiv, f.fjol + " " + L.aktiv);
    tekster.push(L.tekst);
    paastand("Esc sender laereren vaek", (d.dispatchEvent(new ramme.contentWindow.KeyboardEvent("keydown", { key: "Escape", bubbles: true })), !L.aktiv));

    overskrift("8. De ekstra flasker og det frie forsøg");
    frisk();
    var naS = D.opl("Na2S").nr, feN = D.opl("FeNO33").nr;
    paastand("Na₂S kan ikke tages, foer skemaet er udfoert", f.tagFlaske(naS) === false);
    paastand("det frie forsøg er laast", f.skiftSide("frit") === false && d.getElementById("sidevalg").hidden);
    for (i = 0; i < 12; i++) udfoer(i);
    NK.opdaterPanel();
    paastand("alle tolv felter udfoert laaser op", f.bonus && f.antalUdfoert() === 12);
    paastand("laereren siger det", L.aktiv && L.slags === "bonus", L.slags);
    tekster.push(L.tekst);
    paastand("knapperne til at skifte side vises", !d.getElementById("sidevalg").hidden);
    adv(2);
    paastand("de ekstra flasker staar i det lille stativ", f.flasker[naS].iStativ && f.flasker[feN].iStativ);
    paastand("og kan tages", f.tagFlaske(naS) === true);
    f.saetTilbage();
    adv(1);

    d.querySelector('.sideknap[data-side="frit"]').click();
    paastand("Frit forsøg skifter folien", f.side === "frit" && f.felter === f.sider.frit);
    paastand("skemaets draaber er gemt", f.sider.skema.every(function (x) { return x.antal === 2; }));
    paastand("det frie forsøg starter tomt", f.felter.every(function (x) { return x.antal === 0; }));
    paastand("reaktionsskemaet er skjult, opgaven om salte vises", d.getElementById("opgave-kort").hidden && !d.getElementById("frit-kort").hidden);
    paastand("skemaet i panelet hedder Frit forsøg", d.getElementById("skema-titel").textContent === "Frit forsøg");

    var fjolFoer = f.fjol;
    dryp(0, "FeNO33");
    paastand("én opløsning i et frit felt", f.status(0) === "enkelt");
    dryp(0, "Na2S");
    paastand("Fe(NO₃)₃ + Na₂S giver Fe₂S₃", f.status(0) === "bundfald" && f.felter[0].analyse.bundfald[0].noegle === "Fe-S");
    dryp(0, "AgNO3");
    paastand("i det frie forsøg er intet forkert", f.fjol === fjolFoer, f.fjol);
    dryp(3, "Na2S"); dryp(3, "BaCl2");
    paastand("Na₂S + BaCl₂ giver intet bundfald", f.status(3) === "intet");
    dryp(7, "Na2S"); dryp(7, "CuSO4");
    paastand("Na₂S + CuSO₄ giver CuS, sort", f.felter[7].analyse.bundfald[0].noegle === "Cu-S" && f.felter[7].analyse.bundfald[0].info.ord === "sort");
    paastand("de to nederste rækker er hvide", NK.Scene.hvidtFelt(7) && !NK.Scene.hvidtFelt(3));

    var noter = [];
    var gammelBesked = f.vedBesked;
    f.vedBesked = function (tekst) { noter.push(tekst); };
    dryp(6, "FeNO33"); dryp(6, "Na2CO3");
    f.vedBesked = gammelBesked;
    f.saetTilbage();
    paastand("Fe(NO₃)₃ + Na₂CO₃ giver en besked om Fe(OH)₃", noter.some(function (x) { return x.indexOf("Fe(OH)₃") >= 0; }), noter.join(" / "));
    tekster = tekster.concat(noter);
    f.vaelgFelt(6);
    adv(0.1);
    t = tael();
    paastand("i luppen: 4 Fe³⁺ i bundfaldet og 6 CO₃²⁻ bliver til CO₂", t.Fe.bundet === 4 && t.CO3.bundet === 6 && t.Fe.fri === 2, JSON.stringify(t));
    adv(5);
    var co2 = f.mikro.ioner.filter(function (x) { return x.co2; });
    paastand("CO₂ stiger op og forsvinder", co2.length === 6 && co2.every(function (x) { return x.alfa < 0.2; }), co2.map(function (x) { return x.alfa.toFixed(2); }).join(","));

    NK.skiftSide("skema");
    paastand("tilbage i skemaet er alt som før", f.side === "skema" && f.antalUdfoert() === 12 && !d.getElementById("opgave-kort").hidden);

    overskrift("9. Opgaven om tungtopløselige salte");
    NK.skiftSide("frit");
    var FO = NK.fritOpgave;
    function chip(noegle) { return d.querySelector('.saltchip[data-salt="' + noegle + '"]'); }
    paastand("10 knapper, Fe₂S₃ i begge grupper", d.querySelectorAll("#frit-grupper .saltchip").length === 10 && d.querySelectorAll('.saltchip[data-salt="Fe-S"]').length === 2);
    chip("Fe-S").click();
    paastand("de to Fe₂S₃-knapper foelges ad", d.querySelectorAll('.saltchip.valgt[data-salt="Fe-S"]').length === 2);
    chip("Fe-PO4").click(); chip("Ag-S").click();
    paastand("tre ud af fire er forkert", FO.tjek() === false && d.getElementById("frit-besked").textContent === "Forkert. Prøv igen.");
    chip("Cu-S").click(); chip("Ba-S").click();
    paastand("alle fire plus BaS er forkert", FO.tjek() === false);
    tekster.push(d.getElementById("frit-besked").textContent);
    chip("Ba-S").click();
    paastand("de fire tungtopløselige er rigtigt", FO.tjek() === true && d.getElementById("frit-besked").textContent === "Rigtigt.");
    paastand("knapperne laases, og Tjek svar forsvinder", chip("Cu-S").disabled && d.getElementById("frit-tjek").hidden);
    paastand("laereren roser modvilligt", L.aktiv && L.slags === "ros", L.slags);
    tekster.push(L.tekst);
    NK.skiftSide("skema");

    overskrift("10. Sprog");
    frisk();
    tekster.push(d.body.textContent);
    Object.keys(NK.LAERER_REPLIKKER).forEach(function (k) { tekster = tekster.concat(NK.LAERER_REPLIKKER[k]); });
    Object.keys(D.BUNDFALD).forEach(function (k) { if (D.BUNDFALD[k].note) tekster.push(D.BUNDFALD[k].note); });
    f.vedBesked = function (tk) { tekster.push(tk); };
    dryp(0, "BaCl2"); dryp(0, "CuSO4"); dryp(0, "CuSO4"); dryp(0, "CuSO4"); dryp(0, "CuSO4");
    f.vedBesked = gammelBesked;
    f.vaelgFelt(0);
    NK.opdaterPanel();
    tekster.push(d.getElementById("opg-tekst").textContent);
    var alt = tekster.join(" ");
    paastand("ingen tankestreger i teksterne", !/[—–]/.test(alt));
    paastand("ingen 1+ eller 1− i teksterne", !/(¹⁺|¹⁻|1\+|1−)/.test(alt));

    frisk();
    vis();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
</body>
</html>
