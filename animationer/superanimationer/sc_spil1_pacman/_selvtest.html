<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest, Pacman Quiz</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fa6af; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i spillet og kan slettes.

   Aabner index.html i en iframe og kontrollerer det, man ikke kan se
   paa et skaermbillede:
     - at Svaer har samme balance som den gamle c_spil_pacman_emner.html
       (tallene sammenlignes med den gamle fil, hvis den kan hentes), og
       at Let og Mellem er langsommere og mildere end den
     - at spoegelserne opfoerer sig som i den gamle: sovetid, skridt,
       nye spoegelser paa Svaer, og den lange soevn efter et forkert rum
     - at musikken kun findes paa Svaer, foelger pausen og lydknappen
     - at pausen kan bruges frit paa Let og én gang i hvert spil paa
       Mellem og Svaer, ogsaa naar reglerne aabnes midt i en opgave
     - at alle opgaver har tre forskellige forkerte svar med et hint
     - at Svaer + Mix giver Labyrintmester, som escaperoommet spoerger om
     - at knapperne, tastaturet, Kemichael og sproget overholder reglerne
   Skal koeres gennem en lokal server (Chrome maa ikke kigge ind i en
   iframe paa file://). ?stop=N stopper efter afsnit N.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function note(t) { skriv("  ·     " + t, "note"); }
var STOP = +(new URLSearchParams(location.search).get("stop") || 0);
function overskrift(t) {
    if (STOP && parseInt(t, 10) > STOP) throw new Error("stoppet før " + t);
    skriv("\n" + t, "h");
}
function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

/* Det, spillet gemmer i browseren, gemmes og saettes tilbage til sidst.
   Iframen har samme oprindelse, saa den starter uden hukommelse. */
var gemt = {};
for (var gi = 0; gi < localStorage.length; gi++) {
    var gn = localStorage.key(gi);
    if (/^nk-pacman/.test(gn)) gemt[gn] = localStorage.getItem(gn);
}
Object.keys(gemt).forEach(function (k) { localStorage.removeItem(k); });
function afslut() {
    var nu = [];
    for (var i = 0; i < localStorage.length; i++) if (/^nk-pacman/.test(localStorage.key(i))) nu.push(localStorage.key(i));
    nu.forEach(function (k) { localStorage.removeItem(k); });
    Object.keys(gemt).forEach(function (k) { localStorage.setItem(k, gemt[k]); });
}

function hentTekst(sti) {
    try {
        var x = new XMLHttpRequest();
        x.open("GET", sti, false);
        x.send();
        return x.status === 200 ? x.responseText : null;
    } catch (e) { return null; }
}

var ramme = document.createElement("iframe");
ramme.src = "index.html";
document.body.appendChild(ramme);
ramme.addEventListener("load", function () {
    setTimeout(function () {
        try { koer(); } catch (e) { skriv("  FEJL  testen stoppede: " + e.message, "fejl"); fejl++; if (window.console) console.log("selvtest: " + e.stack); }
        afslut();
        vis();
    }, 900);
});

/* Fast tilfaeldighed, saa testen er ens hver gang */
function froe(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        var t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function koer() {
    var d = ramme.contentDocument, w = ramme.contentWindow, NK = w.NK;
    var BILLEDE = 1000 / 60;

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    var D = NK.Data, E = NK.Emner, A = NK.app;
    paastand("data, emner, spil, tegning og app er indlæst", !!(D && E && NK.Spil && NK.Tegning && A));
    paastand("Kemichael er med", !!NK.laerer);
    paastand("rundvisningen er med", !!NK.Rundvisning);

    /* --------------------------------------------------------------- */
    overskrift("2. Balancen: Svær som den gamle udgave, Let og Mellem mildere");
    /* Svaer er brugerens balance fra den gamle udgave. Let og Mellem blev
       gjort langsommere og mere tilgivende 3. okt. 2026. */
    var FORVENTET = {
        let:    { sovMs: 6000, trinMs: 800, tilfaeldigt: 0.4,  fredetMs: 4000, pauser: Infinity },
        mellem: { sovMs: 4000, trinMs: 500, tilfaeldigt: 0.33, fredetMs: 3000, pauser: 1 },
        svaer:  { sovMs: 2500, trinMs: 313, tilfaeldigt: 0.25, fredetMs: 2000, pauser: 1 }
    };
    Object.keys(FORVENTET).forEach(function (k) {
        var F = FORVENTET[k], S0 = D.SVAERHED[k];
        paastand(k + ": sover " + F.sovMs + " ms og går hvert " + F.trinMs + " ms",
            S0.sovMs === F.sovMs && S0.trinMs === F.trinMs, S0.sovMs + " / " + S0.trinMs);
        paastand(k + ": " + F.tilfaeldigt + " tilfældige skridt, fredet " + F.fredetMs + " ms, pauser " + F.pauser,
            S0.tilfaeldigt === F.tilfaeldigt && S0.fredetMs === F.fredetMs && S0.pauser === F.pauser,
            S0.tilfaeldigt + " / " + S0.fredetMs + " / " + S0.pauser);
    });
    var rk = D.SVAERHED_ORDEN.map(function (k) { return D.SVAERHED[k]; });
    paastand("hvert niveau er hurtigere og strengere end det forrige", rk.every(function (S1, i) {
        var S0 = rk[i - 1];
        return i === 0 || (S1.sovMs < S0.sovMs && S1.trinMs < S0.trinMs && S1.tilfaeldigt < S0.tilfaeldigt
            && S1.fredetMs < S0.fredetMs && S1.pauser <= S0.pauser);
    }));
    paastand("kun Svær får nye spøgelser", !D.SVAERHED.let.nye && !D.SVAERHED.mellem.nye && D.SVAERHED.svaer.nye);
    paastand("et nyt spøgelse hvert 5000 ms, højst 4", D.NYT_SPOEGELSE_MS === 5000 && D.SPOEGELSE_START.length === 4);
    paastand("3 liv, to spøgelser fra opgave 5", D.LIV === 3 && D.TO_SPOEGELSER_FRA === 4);
    paastand("skjold 5 s (300 billeder)", D.SKJOLD_MS === 5000);
    paastand("Mix: 3 fra hvert emne", D.MIX_PR_EMNE === 3);
    paastand("spøgelserne starter samme steder",
        JSON.stringify(D.SPOEGELSE_START) === JSON.stringify([{ x: 1, y: 6 }, { x: 17, y: 6 }, { x: 9, y: 1 }, { x: 9, y: 13 }]));
    paastand("spilleren starter i (9, 6)", D.START.x === 9 && D.START.y === 6);

    /* Sammenlign med den gamle fil, hvis den kan hentes */
    var gammel = hentTekst("../../kemi-c-filer/c_spil_pacman_emner.html") || hentTekst("../../kemi-c-filer/arkiv/c_spil_pacman_emner_oldversion.html");
    if (!gammel) {
        note("den gamle fil blev ikke fundet; tallene ovenfor er skrevet ind i testen");
    } else {
        var mKort = /const MAP = (\[[\s\S]*?\]);\s*\n/.exec(gammel);
        var gKort = mKort ? JSON.parse(mKort[1].replace(/\s+/g, "")) : null;
        paastand("labyrinten er felt for felt den samme som den gamle", gKort && JSON.stringify(gKort) === JSON.stringify(D.KORT));
        var GAMLE = {};
        ["let", "mellem", "svaer"].forEach(function (k) {
            var m = new RegExp(k + ":\\s*\\{[^}]*freezeTime:\\s*(\\d+),\\s*ghostMoveMs:\\s*(\\d+)").exec(gammel);
            GAMLE[k] = m ? { sovMs: +m[1], trinMs: +m[2] } : null;
        });
        paastand("svaer har samme tal som den gamle fil", GAMLE.svaer && GAMLE.svaer.sovMs === D.SVAERHED.svaer.sovMs && GAMLE.svaer.trinMs === D.SVAERHED.svaer.trinMs,
            GAMLE.svaer ? GAMLE.svaer.sovMs + "/" + GAMLE.svaer.trinMs : "ikke fundet");
        ["let", "mellem"].forEach(function (k) {
            paastand(k + " sover længere og går langsommere end i den gamle fil",
                GAMLE[k] && D.SVAERHED[k].sovMs > GAMLE[k].sovMs && D.SVAERHED[k].trinMs > GAMLE[k].trinMs,
                GAMLE[k] ? GAMLE[k].sovMs + "/" + GAMLE[k].trinMs : "ikke fundet");
        });
        var mInt = /GHOST_SPAWN_INTERVAL = (\d+)/.exec(gammel);
        paastand("nye spøgelser med samme interval som den gamle", mInt && +mInt[1] === D.NYT_SPOEGELSE_MS);
        paastand("skjoldet 300 billeder og fredet 120 billeder i den gamle, som på Svær", /shieldT = 300/.test(gammel) && /shieldT = 120/.test(gammel)
            && D.SVAERHED.svaer.fredetMs === 2000);
        paastand("0,25 tilfældige skridt i den gamle, som på Svær", /Math\.random\(\) < 0\.25/.test(gammel) && D.SVAERHED.svaer.tilfaeldigt === 0.25);
        paastand("to spøgelser fra opgave 5 i den gamle", /this\.currentIdx < 4 \? 1 : 2/.test(gammel));
    }

    /* --------------------------------------------------------------- */
    overskrift("3. Labyrinten");
    var K = D.KORT;
    paastand("15 rækker og 19 kolonner", K.length === 15 && K.every(function (r) { return r.length === 19; }));
    var kant = true;
    for (var x = 0; x < 19; x++) kant = kant && K[0][x] === 1 && K[14][x] === 1;
    for (var y = 0; y < 15; y++) kant = kant && K[y][0] === 1 && K[y][18] === 1;
    paastand("kanten er mur hele vejen rundt", kant);
    paastand("starten er en gang", K[D.START.y][D.START.x] === 0);
    /* De to oeverste rum er 4 x 4 felter, de to nederste 4 x 5 */
    var FELTER = { 2: 16, 3: 16, 4: 20, 5: 20 };
    [2, 3, 4, 5].forEach(function (z) {
        var n = 0;
        K.forEach(function (r) { r.forEach(function (v) { if (v === z) n++; }); });
        paastand("rum " + z + " har " + FELTER[z] + " felter", n === FELTER[z], n);
        paastand("rum " + z + " kan nås fra starten", !!vej({ x: D.START.x, y: D.START.y }, z));
    });
    D.SPOEGELSE_START.forEach(function (s, i) {
        var ud = [[0, -1], [0, 1], [-1, 0], [1, 0]].some(function (r) { return !NK.Spil.mur(s.x + r[0], s.y + r[1]); });
        paastand("spøgelse " + (i + 1) + " kan komme ud fra sin plads", ud);
    });

    /* Korteste vej fra et felt til et rum gennem gangene */
    function vej(fra, z) {
        var ko = [[fra.x, fra.y]], set = {}, far = {};
        set[fra.x + "," + fra.y] = 1;
        while (ko.length) {
            var p = ko.shift();
            if (K[p[1]][p[0]] === z) {
                var v = [], n = p[0] + "," + p[1];
                while (far[n]) { var a = n.split(",").map(Number), b = far[n].split(",").map(Number); v.unshift([a[0] - b[0], a[1] - b[1]]); n = far[n]; }
                return v;
            }
            [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (r) {
                var x2 = p[0] + r[0], y2 = p[1] + r[1], k = x2 + "," + y2;
                if (K[y2] && (K[y2][x2] === 0 || K[y2][x2] === z) && !set[k]) { set[k] = 1; far[k] = p[0] + "," + p[1]; ko.push([x2, y2]); }
            });
        }
        return null;
    }
    function gaaTil(S, z) {
        vej(S.spiller, z).forEach(function (r) { S.styr(r[0], r[1]); S.opdater(BILLEDE); });
    }

    /* --------------------------------------------------------------- */
    overskrift("4. Opgaverne");
    var alleTekster = [];
    var TAL = { grundstoffer: 32, ioner: 10, maengde: 10, oplosning: 10, syrebase: 10, binding: 10, organisk: 10, redox: 10 };
    E.ALMINDELIGE.forEach(function (k) {
        var em = E.EMNER[k], ok = true, noter = [];
        paastand(em.titel + ": " + TAL[k] + " opgaver", em.niveauer.length === TAL[k], em.niveauer.length);
        for (var gang = 0; gang < 12; gang++) {
            var rng = froe(gang * 97 + 3);
            em.niveauer.forEach(function (data) {
                var q = E.lav({ emne: k, data: data }, rng);
                var svar = [q.rigtig].concat(q.forkerte.map(function (f) { return f.t; }));
                var god = q.forkerte.length === 3
                    && svar.every(function (s, i) { return s && svar.indexOf(s) === i; })
                    && q.forkerte.every(function (f) { return f.hint && f.hint.length > 5; })
                    && !svar.some(function (s) { return /\?/.test(s); })
                    && q.tekst && q.forklaring;
                if (!god && noter.length < 2) noter.push(q.tekst + " -> " + svar.join(" | "));
                ok = ok && god;
                alleTekster.push(q.tekst, q.rigtig, q.forklaring);
                q.forkerte.forEach(function (f) { alleTekster.push(f.t, f.hint); });
            });
        }
        paastand(em.titel + ": tre forskellige forkerte svar, hvert med et hint", ok, noter.join(" / "));
    });

    function svarPaa(k, filter) {
        var d0 = E.EMNER[k].niveauer.filter(filter)[0];
        return E.lav({ emne: k, data: d0 }, froe(1)).rigtig;
    }
    var SALTE = ["NaCl", "MgO", "K₂S", "CaI₂", "AlCl₃", "Na₂SO₄", "Ca(NO₃)₂", "NH₄Cl", "Al₂O₃", "Fe₂(SO₄)₃"];
    paastand("saltenes formler er rigtige", E.EMNER.ioner.niveauer.every(function (dd, i) {
        return E.lav({ emne: "ioner", data: dd }, froe(2)).rigtig === SALTE[i];
    }), E.EMNER.ioner.niveauer.map(function (dd) { return E.lav({ emne: "ioner", data: dd }, froe(2)).rigtig; }).join(" "));
    paastand("H og Cl: polær, Na og Cl: ion, C og H: upolær",
        svarPaa("binding", function (b) { return b.a === "H" && b.b === "Cl"; }) === "Polær binding"
        && svarPaa("binding", function (b) { return b.a === "Na"; }) === "Ionbinding"
        && svarPaa("binding", function (b) { return b.a === "C" && b.b === "H"; }) === "Upolær binding");
    paastand("C₈H₁₈ hedder octan", svarPaa("organisk", function (o) { return o.n === 8; }) === "Octan");
    paastand("pH i 0,001 M stærk syre er 3", svarPaa("syrebase", function (s) { return s.c === 0.001; }) === "3");
    paastand("c = 0,25 mol / 0,5 L = 0,5 M", svarPaa("oplosning", function (o) { return o.n === 0.25; }) === "0,5 M");
    paastand("m = 3 mol · 18 g/mol = 54 g", svarPaa("maengde", function (m) { return m.n === 3; }) === "54 g");
    paastand("oxidationstallet for S i H₂S er −2", svarPaa("redox", function (r) { return r.formel === "H₂S"; }) === "−2");
    paastand("iod skrives I", svarPaa("grundstoffer", function (g) { return g.navn === "Iod"; }) === "I");

    var mix = E.raekke("mix", froe(5));
    var prEmne = {};
    mix.forEach(function (o) { prEmne[o.emne] = (prEmne[o.emne] || 0) + 1; });
    paastand("Mix har 24 opgaver, 3 fra hvert af de 8 emner", mix.length === 24
        && E.ALMINDELIGE.every(function (k) { return prEmne[k] === 3; }), JSON.stringify(prEmne));
    var nogler = mix.map(function (o) { return o.emne + JSON.stringify(o.data); });
    paastand("Mix har ingen opgave to gange", nogler.every(function (n, i) { return nogler.indexOf(n) === i; }));
    var mix2 = E.raekke("mix", froe(6)).map(function (o) { return o.emne + JSON.stringify(o.data); });
    paastand("Mix trækker nye opgaver hver gang", mix2.join() !== nogler.join());

    /* Skiltene: ved en almindelig skaerm (felter paa 40 px) er skriften mindst 14 px */
    var tg = A.tegning, gammelT = tg.T, ctx = tg.L.ctx, mindst = 99, hvilket = "";
    tg.T = 40;
    E.ALMINDELIGE.forEach(function (k) {
        E.EMNER[k].niveauer.forEach(function (dd) {
            var q = E.lav({ emne: k, data: dd }, froe(4));
            var s = tg.skilte(ctx, [q.rigtig].concat(q.forkerte.map(function (f) { return f.t; }))).s;
            if (s < mindst) { mindst = s; hvilket = q.rigtig; }
        });
    });
    tg.T = gammelT;
    paastand("svarene på skiltene er mindst 14 px med felter på 40 px", mindst >= 14, Math.round(mindst) + " px ved " + hvilket);

    /* --------------------------------------------------------------- */
    overskrift("5. Reglerne");
    function nyt(sv, emne, frø) {
        var S = new NK.Spil(froe(frø || 11));
        S.vaelgSvaerhed(sv);
        S.start(emne || "ioner");
        return S;
    }
    var S = nyt("mellem");
    paastand("et forløb starter med 3 liv, opgave 1 og ét spøgelse", S.liv === 3 && S.nr === 0 && S.spoegelser.length === 1 && S.skaerm === "spil");
    paastand("fire rum med ét rigtigt svar", S.rum.length === 4 && S.rum.filter(function (r) { return r.ok; }).length === 1);
    paastand("ét skjold i gangene", S.skjolde.length === 1 && K[S.skjolde[0].y][S.skjolde[0].x] === 0);
    S.nr = 4; S.opgave();
    paastand("fra opgave 5 er der to spøgelser", S.spoegelser.length === 2);

    /* Sovetid og skridt ved 60 billeder i sekundet */
    ["let", "mellem", "svaer"].forEach(function (k) {
        var T = nyt(k, "ioner", 21), g = T.spoegelser[0], start = g.x + "," + g.y;
        T.spiller.skjold = true; T.spiller.skjoldMs = T.spiller.skjoldMax = 1e9;
        var foerste = null, skridt = [], sidst = start, sb = 0;
        for (var b = 1; b <= 60 * 12; b++) {
            T.opdater(BILLEDE);
            var nu = T.spoegelser[0].x + "," + T.spoegelser[0].y;
            if (nu !== sidst) { if (foerste === null) foerste = T.tid; skridt.push(b - sb); sb = b; sidst = nu; }
        }
        var S2 = D.SVAERHED[k];
        paastand(k + ": første skridt lige efter " + S2.sovMs + " ms", foerste !== null && foerste > S2.sovMs && foerste <= S2.sovMs + BILLEDE + 0.01, foerste);
        /* 800 og 500 ms er et helt antal billeder; saa afgoer afrundingen
           i den summerede tid, om skridtet falder paa det billede eller
           det naeste */
        var forventet = Math.ceil(S2.trinMs / BILLEDE - 1e-9);
        var mellem = skridt.slice(1);
        paastand(k + ": et skridt hvert " + forventet + ". billede (" + S2.trinMs + " ms)", mellem.length > 3 && mellem.every(function (n) { return n === forventet || n === forventet + 1; }), mellem.slice(0, 6).join(","));
        paastand(k + ": vågner-uret viser sovetiden", Math.abs(nyt(k).vaagnerOm() - S2.sovMs) < 1);
    });

    /* Nye spoegelser paa Svaer */
    var Sv = nyt("svaer", "ioner", 31);
    Sv.spiller.skjold = true; Sv.spiller.skjoldMs = Sv.spiller.skjoldMax = 1e9;
    var antal = [];
    [4.9, 5.1, 9.9, 10.1, 15.1, 25].forEach(function (sek) {
        while (Sv.tid < sek * 1000) Sv.opdater(BILLEDE);
        antal.push(Sv.spoegelser.length);
    });
    paastand("Svær: nyt spøgelse efter 5, 10 og 15 s, højst 4", antal.join(",") === "1,2,2,3,4,4", antal.join(","));
    var Sm = nyt("mellem", "ioner", 31);
    Sm.spiller.skjold = true; Sm.spiller.skjoldMs = Sm.spiller.skjoldMax = 1e9;
    while (Sm.tid < 20000) Sm.opdater(BILLEDE);
    paastand("Mellem: ingen nye spøgelser", Sm.spoegelser.length === 1);

    /* Styring: ikke gennem mure */
    var Ss = nyt("mellem");
    paastand("spilleren kan ikke gå ind i en mur", Ss.styr(-1, 0) === false && Ss.spiller.retning.x === 0);
    var fy = Ss.spiller.y;
    Ss.styr(0, -1); Ss.opdater(BILLEDE);
    paastand("ét tryk flytter ét felt", Ss.spiller.y === fy - 1);

    /* Et forkert rum */
    var Sf = nyt("mellem", "ioner", 41);
    var forkertRum = Sf.rum.filter(function (r) { return !r.ok; })[0];
    Sf.spoegelser = [];
    while (Sf.tid < 12000) Sf.opdater(BILLEDE);
    var gammelTid = Sf.tid, skridtTil = vej(Sf.spiller, forkertRum.z).length;
    gaaTil(Sf, forkertRum.z);
    paastand("et forkert rum koster et liv", Sf.liv === 2 && Sf.skaerm === "spil");
    paastand("hintet til netop det svar vises", Sf.hint === forkertRum.hint && forkertRum.proevet);
    paastand("spilleren er tilbage i starten med ét spøgelse", Sf.spiller.x === D.START.x && Sf.spiller.y === D.START.y && Sf.spoegelser.length === 1);
    var MS = D.SVAERHED.mellem;

/* Den gamle Game.update(), koert i et lukket miljoe med falsk tid:
   hvor laenge sover spoegelset efter et forkert rum efter 12 s? */
function gammelSoevn(kilde) {
    try {
        var s = /<script>([\s\S]*?)<\/script>/.exec(kilde)[1];
        s = s.replace(/window\.onload\s*=.*$/m, "");
        var tid = { nu: 0 };
        var falskDok = {
            getElementById: function () { return { style: {}, classList: { add: function () {}, remove: function () {}, contains: function () { return true; }, toggle: function () {} }, innerText: "", innerHTML: "" }; },
            querySelectorAll: function () { return []; }
        };
        var fabrik = new Function("document", "Date", "window", "setTimeout", "requestAnimationFrame", s + "\nreturn { Game: Game, EMNER: EMNER };");
        var ud = fabrik(falskDok, { now: function () { return tid.nu; } }, {}, function () {}, function () {});
        var G = ud.Game;
        G.selectDifficulty("mellem");
        G.currentMode = "ioner";
        G.currentIdx = 0;
        G.lives = 3;
        tid.nu = 1000;
        G.setupLevel();
        G.ghosts = [];
        /* 12 s + det samme antal billeder, som testen brugte paa at gaa */
        for (var b = 0; b < 12 * 60; b++) { tid.nu += 1000 / 60; G.update(); }
        var forkert = G.answers.filter(function (a) { return !a.ok; })[0].z;
        /* Gaa den korteste vej til det forkerte rum */
        var K = window.frames[0].NK.Data.KORT;
        var ko = [[G.player.tx, G.player.ty]], set = {}, far = {}, maal = null;
        set[G.player.tx + "," + G.player.ty] = 1;
        while (ko.length) {
            var p = ko.shift();
            if (K[p[1]][p[0]] === forkert) { maal = p; break; }
            [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(function (r) {
                var x2 = p[0] + r[0], y2 = p[1] + r[1], k = x2 + "," + y2;
                if (K[y2] && (K[y2][x2] === 0 || K[y2][x2] === forkert) && !set[k]) { set[k] = 1; far[k] = p[0] + "," + p[1]; ko.push([x2, y2]); }
            });
        }
        var v = [], n = maal[0] + "," + maal[1];
        while (far[n]) { var a = n.split(",").map(Number), c = far[n].split(",").map(Number); v.unshift([a[0] - c[0], a[1] - c[1]]); n = far[n]; }
        var TAST = { "0,-1": "ArrowUp", "0,1": "ArrowDown", "-1,0": "ArrowLeft", "1,0": "ArrowRight" };
        v.forEach(function (r) { G.input(TAST[r[0] + "," + r[1]]); tid.nu += 1000 / 60; G.update(); });
        if (G.lives !== 2) return null;
        var g = G.ghosts[0], pos = g.tx + "," + g.ty, start = tid.nu;
        G.player.invincible = true; G.player.shieldT = 1e9;
        for (var b2 = 0; b2 < 60 * 20; b2++) {
            tid.nu += 1000 / 60; G.update();
            if (G.ghosts[0].tx + "," + G.ghosts[0].ty !== pos) return tid.nu - start;
        }
        return null;
    } catch (e) {
        if (window.console) console.log("gammel: " + e.stack);
        return null;
    }
}
