<svg xmlns="http://www.w3.org/2000/svg" width="36" height="480" viewBox="0 0 36 480">
  <!-- Termometer, langt og smalt. Animationen tegner den roede soejle og
       skalaen: soejlen er x 16-20 og gaar fra y 456 (kuglen) op til
       temperaturen; skalaens oeverste streg er y 16, nederste y 432.
       Kuglen har midte i (18, 460) og radius 13. -->
  <rect x="11" y="4" width="14" height="448" rx="7" fill="#dfeaf3" fill-opacity="0.13" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="1.4"/>
  <rect x="16" y="10" width="4" height="446" rx="2" fill="#ffffff" fill-opacity="0.1"/>
  <circle cx="18" cy="460" r="13" fill="#d9453a" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="1.4"/>
  <circle cx="14" cy="455" r="3.6" fill="#ffffff" fill-opacity="0.45"/>
  <rect x="21.5" y="14" width="1.6" height="422" rx="0.8" fill="#ffffff" fill-opacity="0.16"/>
</svg>
