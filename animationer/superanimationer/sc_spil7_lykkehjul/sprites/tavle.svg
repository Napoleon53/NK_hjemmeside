<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<!-- Gaadetavlens ramme. Fliserne ligger i et gitter paa 14 x 4: felt (r, k)
     staar ved x = 55 + 64k, y = 44 + 80r og er 58 x 72. Raekke 1 og 4 har
     kolonne 1 til 12. Samme maal staar i js/visning.js (bygTavle). -->
<defs>
  <filter id="glod" x="-10%" y="-20%" width="120%" height="140%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <linearGradient id="kant" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2f7bff"/>
    <stop offset="0.5" stop-color="#1647c9"/>
    <stop offset="1" stop-color="#0c2a86"/>
  </linearGradient>
</defs>
<polygon points="85,10 915,10 915,90 979,90 979,310 915,310 915,390 85,390 85,310 21,310 21,90 85,90" fill="#1e78ff" opacity="0.55" filter="url(#glod)"/>
<polygon points="89,14 911,14 911,94 975,94 975,306 911,306 911,386 89,386 89,306 25,306 25,94 89,94" fill="url(#kant)" stroke="#63d4ff" stroke-width="5" stroke-linejoin="round"/>
<polygon points="98,23 902,23 902,103 966,103 966,297 902,297 902,377 98,377 98,297 34,297 34,103 98,103" fill="#0a2172" stroke="#dff4ff" stroke-width="3.5" stroke-linejoin="round"/>
<polygon points="104,29 896,29 896,109 960,109 960,291 896,291 896,371 104,371 104,291 40,291 40,109 104,109" fill="#1a3fae" stroke="#0a1a55" stroke-width="2" stroke-linejoin="round"/>
<polygon points="111,36 889,36 889,116 953,116 953,284 889,284 889,364 111,364 111,284 47,284 47,116 111,116" fill="#050d2c"/>
</svg>
