<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc5.2 Formel og aktuel koncentration</title>
<style>
    body { background: #1b1d24; color: #dde3ea; font-family: "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 1rem; margin: 0 0 14px; color: #f2c53d; }
    .ark { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; padding: 12px; background: #262833; border: 1px solid #3a3a47; border-radius: 8px; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    figcaption { font-size: 0.8rem; color: #a9b0ba; }
</style>
</head>
<body>
<!-- Udviklerværktøj: viser sprites alene, før de sættes i bevægelse. Indgår ikke i animationen. -->
<h1>sc5.2: sprites i dobbelt størrelse</h1>
<div class="ark">
    <figure><img src="sprites/glas1l.svg" width="480"><figcaption>glas1l.svg (ny)</figcaption></figure>
    <figure><img src="sprites/baegerglas.svg" width="320"><figcaption>baegerglas.svg (som sc5.1)</figcaption></figure>
    <figure><img src="sprites/flaske.svg" width="180"><figcaption>flaske.svg (som sc7.2)</figcaption></figure>
    <figure><img src="sprites/pulverglas.svg" width="200"><figcaption>pulverglas.svg (som sc4.5)</figcaption></figure>
    <figure><img src="sprites/spatel.svg" width="320"><figcaption>spatel.svg (som sc2.1)</figcaption></figure>
    <figure><img src="sprites/lup.svg" width="140"><figcaption>lup.svg (som sc2.1)</figcaption></figure>
    <figure><img src="sprites/kateder.svg" width="600"><figcaption>kateder.svg (som sc4.5)</figcaption></figure>
</div>
</body>
</html>
