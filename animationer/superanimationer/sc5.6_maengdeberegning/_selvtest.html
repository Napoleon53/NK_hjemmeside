<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc5.6 Mængdeberegning</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
<script>window.goatcounter = {path: function (p) { return location.host + p; }};</script>
<script data-goatcounter="https://napoleon53.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at skemaerne er afstemt, at molarmasserne
   passer med tabellen, at masserne i opgaverne går op i hele
   hundrededele, at massen er bevaret, at det begrænsende stof er det
   rigtige for alle tal, "Nye tal" kan trække, at tjekket giver den
   rigtige besked ved de typiske fejl, at sproget holder reglerne, at
   alle tre faner kan gennemføres ved at skrive i felterne, at hint og
   svar står i opgavekortet ved den gule knap, og at layoutet holder fra
   520 × 380 til 1500 × 900.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sc5.5-vej", "nk-sc5.5-skema", "nk-sc5.5-begr", "nk-sc5.5-skema-frit", "nk-sc5.6-vej-opg"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Molarmasserne regnet i hånden med atommasserne i sc5.1 (to decimaler) */
var MOLAR = {
    Fe: "55,85", S: "32,06", FeS: "87,91", Mg: "24,31", MgO: "40,31", Al: "26,98", Al2O3: "101,96",
    Fe2O3: "159,70", C: "12,01", O2: "32,00", CO2: "44,01", H2O: "18,02", CH4: "16,05", N2: "28,02",
    H2: "2,02", NH3: "17,04", C3H8: "44,11", C6H12O6: "180,18", HCl: "36,46", MgCl2: "95,21",
    Cl2: "70,90", AlCl3: "133,33"
};

/* Ord, der er skrevet uden æ, ø og å, og som derfor ikke må nå eleven */
var ASCII_ORD = /\b(Vaegt\w*|vaegt\w*|maengde\w*|Maengde\w*|stofmaengde\w*|foer|faerdig|naeste|Naeste|haeld\w*|gaa|staa|paa|aaben|Saet|saet|foerst|hoejre|venstre side)\b/;

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;

    function tik(sim, sek) { for (var k = 0; k < Math.round(sek * 60); k++) sim.opdater(1 / 60); }
    function komma(v, dec) { return v.toFixed(dec).replace(".", ","); }
    function enter(inp) { inp.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); }
    /* Skriv i et felt i skemaet og tryk Enter, som eleven gør */
    function skrivI(sim, id, tekst) {
        var c = sim.skema.celle(id);
        if (!c || !c.input) return false;
        c.input.value = tekst;
        enter(c.input);
        return true;
    }
    function rigtigTekst(sim, id) {
        var c = sim.skema.celle(id), v = sim.skema.vaerdi(id);
        return komma(v, c.raekke === "n" ? 3 : 2);
    }
    function afstem(sim) {
        var k = sim.skema.koefEl;
        k.forEach(function (e, j) { e.input.value = String(sim.opg.r.led[j].k); });
        enter(k[k.length - 1].input);
    }
    /* Løs resten af opgaven ved at skrive de rigtige tal */
    function loesAlt(sim, valgJ) {
        var n = 0, t;
        while ((t = sim.skema.naeste()) && n++ < 40) {
            if (t === "afstem") afstem(sim);
            else if (t === "valg") { sim.vaelgBegr(valgJ === undefined ? sim.opg.kilde : valgJ, "gaet"); tik(sim, sim.reaktionTid() + 0.3); }
            else if (!skrivI(sim, t, rigtigTekst(sim, t))) return "intet felt til " + t;
        }
        return sim.skema.naeste();
    }
    function inputs(navn) { return d.querySelectorAll("#" + navn + "-felter .skemafelt input").length; }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, T = NK.Tjek;
    paastand("data.js, tjek.js og skema.js er kørt", !!(D && D.REAKTIONER && T && T.nFraM && NK.Skema));
    paastand("alle tre faner er bygget", !!(NK.sims && NK.sims["fane-vej"] && NK.sims["fane-skema"] && NK.sims["fane-begr"]));
    var sprites = ["vaegt", "vejebaad", "pulverglas", "skaal_fod", "skaal_arm", "skaal_skaal"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var V = NK.sims["fane-vej"], S = NK.sims["fane-skema"], B = NK.sims["fane-begr"];
    paastand("Kemichael er ikke med (brugerens valg 9. okt. 2026)", !NK.RoligLaerer && !NK.Kemichael && !V.k && !d.querySelector(".kboble, .kknap"));
    paastand("der er ingen tilbudsknapper (brugerens valg)", !d.querySelector(".tilbud") && !d.querySelector(".spring-over"));
    paastand("hver fane har den gule hintknap", [S, B].every(function (s) {
        return s.el.knap.textContent === "Giv hint" && s.el.knap.classList.contains("hjaelp") && !s.el.knap.classList.contains("svar");
    }) && d.getElementById("vej-hjknap").textContent === "Giv et hint" && d.getElementById("vej-hjknap").classList.contains("hjaelp"));

    overskrift("2. Kemien");
    var ikkeAfstemt = D.REAKTIONER.filter(function (r) { return !D.afstemt(r, r.led.map(function (l) { return l.k; })).ok; });
    paastand("de " + D.REAKTIONER.length + " skemaer er afstemt", ikkeAfstemt.length === 0, ikkeAfstemt.map(function (r) { return r.id; }).join(", "));
    var ikkeMindst = D.REAKTIONER.filter(function (r) { return r.led.map(function (l) { return l.k; }).reduce(function (a, b) { return NK.gcd(a, b); }) !== 1; });
    paastand("koefficienterne er de mindste hele tal", ikkeMindst.length === 0, ikkeMindst.map(function (r) { return r.id; }).join(", "));
    var forkertM = Object.keys(MOLAR).filter(function (id) { return !D.stof(id) || D.tekstMolar(D.stof(id)) !== MOLAR[id]; });
    paastand("alle " + Object.keys(MOLAR).length + " molarmasser passer med tabellen", forkertM.length === 0 && Object.keys(D.STOFFER).length === Object.keys(MOLAR).length,
        forkertM.map(function (id) { return id + " " + (D.stof(id) ? D.tekstMolar(D.stof(id)) : "?"); }).join(", "));
    paastand("M(CO₂) skrives (12,01 + 2 · 16,00) g/mol", D.molarLed(D.stof("CO2")) === "(12,01 + 2 · 16,00) g/mol");
    paastand("M(Fe) skrives 55,85 g/mol", D.molarLed(D.stof("Fe")) === "55,85 g/mol");
    paastand("propan skrives C₃H₈ + 5 O₂ ⟶ 3 CO₂ + 4 H₂O", D.skema(D.reaktion("propan")) === "C₃H₈ + 5 O₂ ⟶ 3 CO₂ + 4 H₂O");
    paastand("fotosyntesen skrives 6 CO₂ + 6 H₂O ⟶ C₆H₁₂O₆ + 6 O₂", D.skema(D.reaktion("fotosyntese")) === "6 CO₂ + 6 H₂O ⟶ C₆H₁₂O₆ + 6 O₂");

    overskrift("3. Opgaverne regner rigtigt");
    /* Fane 1: masserne går op i hele hundrededele, og svaret er n · M af det søgte */
    function hel(x) { return Math.abs(x * 100 - Math.round(x * 100)) < 1e-6; }
    var vejFejl = [];
    D.VEJ.forEach(function (o) {
        var r = D.reaktion(o.r), jK = D.plads(r, o.kendt), jS = D.plads(r, o.soegt);
        if (jK < 0 || jS < 0) { vejFejl.push(o.id + ": stof mangler"); return; }
        if (D.stof(o.kendt).slags !== "fast" || D.stof(o.soegt).slags !== "fast") vejFejl.push(o.id + ": ikke fast stof");
        o.n.forEach(function (n) {
            var m = n * D.stof(o.kendt).M / 100;
            var mS = n * r.led[jS].k / r.led[jK].k * D.stof(o.soegt).M / 100;
            if (!hel(m) || !hel(mS)) vejFejl.push(o.id + " n=" + n);
        });
    });
    paastand("fane 1: de fire opgaver har faste stoffer og masser i hele hundrededele", D.VEJ.length === 4 && vejFejl.length === 0, vejFejl.join("; "));
    function vejFacit(i, n) { return D.tekstMasse(V.kontekst({ vej: D.VEJ[i].id, n: n }).mS); }
    paastand("2,00 mol Fe giver 175,82 g FeS", vejFacit(0, 2) === "175,82");
    paastand("3,00 mol Mg giver 120,93 g MgO", vejFacit(1, 3) === "120,93");
    paastand("4,00 mol Al giver 203,92 g Al₂O₃", vejFacit(2, 4) === "203,92");
    paastand("1,50 mol Fe₂O₃ giver 167,55 g Fe", vejFacit(3, 1.5) === "167,55");
    /* Fane 2: massebevarelsen går op for alle tal, og kul og fotosyntese passer med facit */
    var bevarFejl = [];
    D.SKEMA.forEach(function (o) {
        var r = D.reaktion(o.r), jG = D.plads(r, o.givet);
        o.n.forEach(function (n) {
            var m = n * D.stof(o.givet).M / 100;
            if (!hel(m)) bevarFejl.push(o.id + " n=" + n + " giver ikke hele hundrededele");
            if (!o.massebevarelse) return;
            var sum = [0, 0];
            r.led.forEach(function (l) {
                var mm = n * l.k / r.led[jG].k * D.stof(l.s).M;
                if (Math.abs(mm - Math.round(mm)) > 1e-6) bevarFejl.push(o.id + " " + l.s + " n=" + n);
                sum[l.side] += Math.round(mm);
            });
            if (sum[0] !== sum[1]) bevarFejl.push(o.id + " n=" + n + ": " + sum[0] + " ≠ " + sum[1]);
        });
    });
    paastand("fane 2: massen er bevaret på hundrededele for alle tal", bevarFejl.length === 0, bevarFejl.join("; "));
    paastand("fane 2: fem opgaver, to med skålvægten, fire afstemmes", D.SKEMA.length === 5 &&
        D.SKEMA.filter(function (o) { return o.massebevarelse; }).length === 2 && D.SKEMA.filter(function (o) { return o.afstem; }).length === 4);
    var foto = NK.Skema.lavOpgave({ r: D.reaktion("fotosyntese"), givet: { C6H12O6: 180.18 }, kilde: "C6H12O6", spoerg: [] });
    paastand("1 mol glucose kræver 264,06 g CO₂", D.tekstMasse(foto.m[0]) === "264,06");
    /* Fane 3: det begrænsende stof er rigtigt for alle tal, "Nye tal" kan trække */
    var begrFejl = [];
    D.BEGR.forEach(function (o) {
        var mulige = B.muligeTal(o);
        if (!mulige.length) begrFejl.push(o.id + ": ingen tal");
        mulige.concat([o.std]).forEach(function (t) {
            var r = D.reaktion(o.r);
            var L = t.L, E = L === o.a ? o.b : o.a;
            var kL = r.led[D.plads(r, L)].k, kE = r.led[D.plads(r, E)].k;
            var nL = kL * t.saet, nE = kE * t.saet + t.rest;
            if (!(nE / kE > nL / kL * 1.19)) begrFejl.push(o.id + " " + JSON.stringify(t) + ": for tæt");
            if (nL > D.BEGR_MAKS || nE > D.BEGR_MAKS) begrFejl.push(o.id + " " + JSON.stringify(t) + ": for mange poser");
            if (Math.abs(t.rest * 2 - Math.round(t.rest * 2)) > 1e-9) begrFejl.push(o.id + ": resten er ikke hele eller halve poser");
        });
        var r = D.reaktion(o.r);
        if (D.plads(r, o.p) < 0 || r.led[D.plads(r, o.p)].side !== 1) begrFejl.push(o.id + ": produktet");
    });
    paastand("fane 3: det begrænsende stof giver hele sæt, resten er 0,5 til 2 mol", begrFejl.length === 0, begrFejl.slice(0, 4).join("; "));
    paastand("fane 3: magnesium og saltsyre fra den gamle c5.5 er med", D.BEGR.some(function (o) { return o.r === "saltsyre"; }));
    var nyeFejl = [];
    for (var nt = 0; nt < 30; nt++) {
        var bi = nt % D.BEGR.length;
        var sp = B.lavSpec(bi, true);
        var op = NK.Skema.lavOpgave(sp), ob = D.BEGR[bi];
        var jA = D.plads(op.r, ob.a), jB = D.plads(op.r, ob.b);
        var eA = op.n[jA] / op.r.led[jA].k, eB = op.n[jB] / op.r.led[jB].k;
        var rigtigL = eA < eB ? jA : jB;
        if (rigtigL !== op.kilde) nyeFejl.push(ob.id);
    }
    paastand("fane 3: med nye tal er kilden det stof, der slipper op først (30 træk)", nyeFejl.length === 0, nyeFejl.join(", "));

    overskrift("4. Tjek af de typiske fejl");
    var fe = D.stof("Fe"), co2 = D.stof("CO2"), o2 = D.stof("O2"), al = D.stof("Al"), al2o3 = D.stof("Al2O3"), fe2o3 = D.stof("Fe2O3");
    function b(res, del) { return !!res && !res.ok && res.besked && res.besked.indexOf(del) >= 0; }
    paastand("M: 44,01 og 44 godkendes for CO₂", T.molar("44,01", { st: co2, k: 1 }).ok && T.molar("44", { st: co2, k: 1 }).ok);
    paastand("M: 28,01 for CO₂ giver: husk tallet efter O", b(T.molar("28,01", { st: co2, k: 1 }), "Husk tallet"));
    paastand("M: 64,00 for 2 O₂ giver: koefficienten hører ikke med", b(T.molar("64", { st: o2, k: 2 }), "hører ikke med"));
    paastand("M: 440,1 giver: tjek kommaet", b(T.molar("440,1", { st: co2, k: 1 }), "kommaet"));
    var nm = { st: fe, m: 111.7, k: 1 };
    paastand("n = m / M: 2 og 2,00 mol godkendes", T.nFraM("2", nm).ok && T.nFraM("2,00 mol", nm).ok);
    paastand("n: m · M giver: du har ganget", b(T.nFraM("6238,4", nm), "ganget"));
    paastand("n: M / m giver: brøken er vendt om", b(T.nFraM("0,5", nm), "vendt om"));
    paastand("n: massen skrevet af giver: det er massen", b(T.nFraM("111,70", nm), "massen i gram"));
    paastand("n: 0,2 giver: tjek kommaet", b(T.nFraM("0,2", nm), "kommaet"));
    paastand("n: et tomt felt er ikke en fejl", T.nFraM("", nm).tom === true);
    var nf = { st: al2o3, kilde: al, nKilde: 3, kj: 2, kk: 4, mKilde: 80.94, andre: [] };
    paastand("n(Al₂O₃) = 2/4 · 3,00 mol = 1,50 godkendes", T.nFraForhold("1,50", nf).ok);
    paastand("forhold: 6 giver: brøken er vendt om", b(T.nFraForhold("6", nf), "vendt om"));
    paastand("forhold: 3 giver: det er stofmængden af Al", b(T.nFraForhold("3", nf), "stofmængden af Al"));
    paastand("forhold: 40,47 giver: koefficienterne gælder mol", b(T.nFraForhold("40,47", nf), "gælder mol"));
    paastand("forhold: kun ganget (6/1) fanges også af vendt om", b(T.nFraForhold("6", nf), "Koefficienten for Al₂O₃"));
    var mf = { st: fe, n: 2, k: 4, kilde: fe2o3, mKilde: 159.7, nKilde: 1, kj: 4, kk: 2 };
    paastand("m(Fe) = 2,00 mol · 55,85 g/mol = 111,70 g godkendes", T.mFraN("111,70", mf).ok && T.mFraN("111,7 g", mf).ok);
    paastand("m: divideret giver: du har divideret", b(T.mFraN("0,0358", mf), "divideret"));
    paastand("m: gram gange forholdet giver: koefficienterne gælder mol", b(T.mFraN("319,40", mf), "gælder mol"));
    paastand("m: massen af Fe₂O₃ skrevet af giver: det er massen af Fe₂O₃", b(T.mFraN("159,70", mf), "massen af Fe₂O₃"));
    paastand("m: ganget med koefficienten igen giver: allerede brugt", b(T.mFraN("446,8", mf), "allerede brugt"));
    paastand("m: stofmængden skrevet af giver: det er stofmængden", b(T.mFraN("2", mf), "stofmængden"));
    var me = D.reaktion("methan");
    paastand("afstemning: 1 2 1 2 er rigtig", T.koefficienter(["1", "2", "1", "2"], me).ok);
    paastand("afstemning: 1 1 1 1 tæller H", b(T.koefficienter(["1", "1", "1", "1"], me), "4 H til venstre og 2 H til højre"));
    paastand("afstemning: 2 4 2 4 skal forkortes", b(T.koefficienter(["2", "4", "2", "4"], me), "forkort"));

    overskrift("5. Sproget");
    var replikker = [].concat(
        Object.keys(D.INTRO).map(function (k) { return D.INTRO[k]; }),
        Object.keys(D.FAERDIG).map(function (k) { return D.FAERDIG[k]; }),
        D.ROS, D.ROS_OPGAVE);
    var tekster = replikker.concat(
        D.VEJ.map(function (o) { return o.tekst; }), D.SKEMA.map(function (o) { return o.tekst; }), D.BEGR.map(function (o) { return o.tekst; }),
        Object.keys(D.AFSTEM_HINT).map(function (k) { return D.AFSTEM_HINT[k]; }));
    /* Fane 1 efter runde T12: opgaverne, teksterne til felterne, formlerne og den fri leg */
    function flad(v) {
        if (v === undefined || v === null) return [];
        if (typeof v === "string") return [v];
        if (Array.isArray(v)) return v.reduce(function (a, x) { return a.concat(flad(x)); }, []);
        return Object.keys(v).reduce(function (a, k) { return a.concat(flad(v[k])); }, []);
    }
    D.OPG_VEJ.forEach(function (o) {
        tekster.push(o.navn);
        o.trin.forEach(function (t) { tekster = tekster.concat(flad(t.tekst), flad(t.slut), (t.svar || []).map(function (x) { return x.nej || x.t; })); });
    });
    tekster = tekster.concat(flad(D.VEJ_TEKST), flad(D.VEJ_FRI),
        Object.keys(D.FORMLER).reduce(function (a, k) { var F = D.FORMLER[k]; return a.concat([F.tekst, F.godt], F.svar.map(function (x) { return x.nej || ""; })); }, []));
    var krop = d.body.innerText + " " + d.getElementById("teori").innerText;
    var streg = tekster.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger i replikker og opgavetekster", streg.length === 0, streg.join(" | "));
    paastand("ingen tankestreger på siden", !/[–—]/.test(krop));
    paastand("ingen 1+ eller 1− nogen steder", !tekster.concat([krop]).some(function (t) { return /[A-Za-z]1[+−]|¹[⁺⁻]/.test(t); }));
    var lange = replikker.filter(function (t) { return t.length > 62; });
    paastand("de faste linjer i opgavekortet er højst ca. 60 tegn", lange.length === 0, lange.join(" | "));
    var ascii = tekster.concat([krop]).filter(function (t) { return ASCII_ORD.test(t); });
    paastand("ingen ord uden æ, ø og å i det, eleven ser", ascii.length === 0, ascii.map(function (t) { return t.match(ASCII_ORD)[0]; }).join(", "));
    paastand("teorien er lukket fra start", !d.getElementById("teori").classList.contains("vis"));

    /* Alle linjer, opgavekortet siger undervejs, samles og tjekkes til sidst */
    var sagt = [], hintUbedt = 0;
    [S, B].forEach(function (sim) {
        var besked = sim.besked;
        sim.besked = function (h, kl) { sagt.push(h); return besked.call(this, h, kl); };
    });
    (function () {
        var O1 = V.opgaver, sb = O1.saetBesked;
        O1.saetBesked = function (h, kl) { if (h) sagt.push(h); return sb.call(this, h, kl); };

    overskrift("10. Rundvisningen");
    ["fane-vej", "fane-skema", "fane-begr"].forEach(function (id) {
        klik('[data-fane="' + id + '"]');
        if (id === "fane-skema") S.vaelg(2, false);
        NK.sims[id].tilpas();
        NK.sims[id].layout();
        var r = W.NK.Rundvisning;
        r.start(id);
        var tal = d.getElementById("rv-tal").textContent;
        var n = parseInt(tal.split("/")[1], 10), set = 0;
        for (var i = 0; i < n; i++) {
            var titel = d.getElementById("rv-titel").textContent;
            if (titel) set++;
            d.getElementById("rv-naeste").click();
        }
        paastand("rundvisningen på " + id + " viser alle " + n + " trin", set === n && !r.aktiv());
        var mangler = [];
        (W.NK.Rundvisning.ture[id] || []).forEach(function (t) { if (!d.querySelector(t.sel)) mangler.push(t.sel); });
        paastand("alle rundvisningens ankre på " + id + " findes", mangler.length === 0, mangler.join(", "));
    });

    overskrift("11. Papirkortet");
    var ramme = document.getElementById("ramme");
    /* Kortet står øverst midt i scenen, ikke i panelet, og der er ingen linje nederst */
    var iScene = [S, B].every(function (sim) {
        var sk = sim.el.skort;
        return sk && sk.parentNode.classList.contains("scene") && sk.contains(sim.el.besked) && sk.contains(sim.el.knap) && sk.contains(sim.el.indsend);
    });
    var vk = V.opgaver.el;
    iScene = iScene && vk.kort.parentNode.classList.contains("scene") && vk.kort.contains(vk.besked) && vk.kort.contains(vk.knap) && vk.kort.contains(vk.indsend);
    paastand("kortet med opgaven, linjen, Giv hint og Indsend svar står i scenen på alle tre faner", iScene);
    paastand("panelet har intet opgavekort, og der er ingen statuslinje nederst i scenen",
        !d.querySelector(".panel .opgavekort") && !d.querySelector(".panel [id$='-besked']") && !d.querySelector(".scene-mrk, .statuslinje"));
    paastand("papirkortet er slået til (body.papirkort, Lexend på kortet)",
        d.body.classList.contains("papirkort") && /Lexend/.test(W.getComputedStyle(V.e.skort).fontFamily));
    paastand("Nye tal står i panelet og aldrig på kortet", [S, B].every(function (sim) { return !sim.el.skort.contains(sim.el.nye) && !!sim.el.nye.closest(".panel"); }));
    function indsendKlar(sim) { var k = sim.el.indsend; return !k.hidden && k.classList.contains("klar"); }
    /* Valget på fane 3: svarene vælger kun, Indsend svar sender ind */
    klik('[data-fane="fane-begr"]');
    B.vaelg(0, true);
    skrivI(B, B.skema.naeste(), rigtigTekst(B, B.skema.naeste()));
    skrivI(B, B.skema.naeste(), rigtigTekst(B, B.skema.naeste()));
    paastand("valget står på kortet som et spørgsmål med to svar, og Indsend svar er gråt",
        /Hvilket stof slipper op først\?/.test(kortTxt(B)) && B.el.ind.querySelectorAll(".sk-svar .sk-knap").length === 2 && !indsendKlar(B));
    var forkertB = B.opg.kilde === B.jA ? B.jB : B.jA;
    B.el.ind.querySelector('.sk-knap[data-valg="' + forkertB + '"]').click();
    paastand("et klik på et svar vælger det uden at bedømme det", B.skema.naeste() === "valg" && B.a.fase === 0 &&
        B.el.ind.querySelector('.sk-knap[data-valg="' + forkertB + '"]').classList.contains("valgt") && indsendKlar(B));
    var pt = { x: B.lay.xA, y: B.lay.poseBund - B.lay.pose * 0.5 };
    B.klikScene(pt);
    paastand("et klik på poserne vælger også kun", B.skema.naeste() === "valg" && B.valgtSvar === B.jA && B.a.fase === 0);
    B.vaelgKortSvar(B.opg.kilde);
    B.indsendKlik();
    paastand("Indsend svar sender valget ind; mens poserne reagerer, er svarene låst og knapperne væk",
        B.reagerer() && B.el.ind.querySelector(".sk-knap:disabled") && B.el.indsend.hidden && B.el.knap.hidden);
    tik(B, B.reaktionTid() + 0.3);
    var rk = B.el.ind.querySelector('.sk-knap[data-valg="' + B.opg.kilde + '"]');
    paastand("rigtigt valg: kortet bliver på spørgsmålet, svaret er grønt, forklaringen under og Næste skridt, hvor Indsend svar stod",
        B.venter && rk && rk.classList.contains("rigtig") && /Rigtigt/.test(blivT(B)) && /slap op/.test(blivT(B)) && /Næste skridt/.test(videreT(B)) &&
        B.el.indsend.hidden && B.el.status.hidden, blivT(B));
    W.document.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    paastand("Enter går videre fra valget til næste felt", !B.venter && !B.el.ind.querySelector(".sk-svar") && !B.el.status.hidden);

    /* Kortet holder sig i den plads, der er sat af til det, og tavlen står under det */
    var zFejl = [];
    function zoneOK(sim, n, navn) {
        var e = sim.el.skort, h = e.offsetHeight, zone = sim.kortZone();
        sim.tilpas();
        var sc = e.parentNode.getBoundingClientRect(), r = e.getBoundingClientRect();
        if (h > sim.lay.zone + 1) zFejl.push(n + " " + sim.navn + " " + navn + " " + h + ">" + sim.lay.zone);
        if (r.bottom - sc.top > sim.lay.tavle.y + 1) zFejl.push(n + " " + sim.navn + " " + navn + ": kortet dækker tavlen");
        if (Math.abs((r.left + r.right) / 2 - (sc.left + sc.right) / 2) > 2 || r.top - sc.top > 14) zFejl.push(n + " " + sim.navn + " " + navn + ": ikke øverst i midten");
        return zone;
    }
    var hoej = [];
    [[1400, 860], [1100, 640]].forEach(function (m) {
        var n = m.join("×");
        ramme.style.width = m[0] + "px";
        ramme.style.height = m[1] + "px";
        [S, B].forEach(function (sim) {
            klik('[data-fane="fane-' + sim.navn + '"]');
            sim.vaelg(sim === S ? 3 : 2, true);
            zoneOK(sim, n, "start");
            /* Det længste hint og en lang fejl */
            sim.knap(); zoneOK(sim, n, "hint");
            sim.fejlLinje(NK.html("Koefficienterne gælder stofmængder og ikke masser. Regn først stofmængden af det kendte stof ud, og brug så forholdet."));
            zoneOK(sim, n, "fejl");
            loesAlt(sim);
            zoneOK(sim, n, "løst");
        });
        B.vaelg(4, true);
        skrivI(B, B.skema.naeste(), rigtigTekst(B, B.skema.naeste()));
        skrivI(B, B.skema.naeste(), rigtigTekst(B, B.skema.naeste()));
        zoneOK(B, n, "valget");
        B.vaelgBegr(B.opg.kilde === B.jA ? B.jB : B.jA, "gaet");
        tik(B, B.reaktionTid() + 0.3);
        zoneOK(B, n, "valget forkert");
        hoej.push(n + ": " + [S, B].map(function (sim) { return sim.navn + " " + sim.el.skort.offsetHeight; }).join(", "));
    });
    paastand("kortet holder sig i sin plads øverst i midten, og tavlen står under det (1400 × 860 og 1100 × 640)", zFejl.length === 0, zFejl.slice(0, 4).join("; "));
    skriv("  note  kortets højde: " + hoej.join(" | "), "note");
    ramme.style.width = "";
    ramme.style.height = "";

    overskrift("12. Layoutet");
    var stoerrelser = [[1500, 900], [1400, 860], [1300, 820], [1100, 700], [1000, 640], [860, 700], [700, 600], [520, 380]];
    stoerrelser.forEach(function (st) {
        ramme.style.width = st[0] + "px";
        ramme.style.height = st[1] + "px";
        var problemer = [];
        ["fane-vej", "fane-skema", "fane-begr"].forEach(function (id) {
            klik('[data-fane="' + id + '"]');
            var sim = NK.sims[id];
            if (id === "fane-skema") sim.vaelg(3, false);
            /* Fane 1 testes fra 1000 × 640 (REGELSAET 47: 1100 × 760 er det mindste) */
            if (id === "fane-vej") { if (st[0] < 1000) return; sim.opgaver.aabn(2, true); }
            if (id === "fane-begr") sim.vaelg(1, false);
            sim.tilpas();
            sim.layout();
            var lay = sim.lay, Wc = lay.W, Hc = lay.H, sl = sim.skema.lay;
            function inde(r, navn) {
                if (r.x < -1 || r.y < -1 || r.x + r.b > Wc + 1 || r.y + r.h > Hc + 1) problemer.push(id + ": " + navn + " uden for");
            }
            function over(a, b2, navn) {
                if (a.x < b2.x + b2.b - 1 && a.x + a.b > b2.x + 1 && a.y < b2.y + b2.h - 1 && a.y + a.h > b2.y + 1) problemer.push(id + ": " + navn);
            }
            inde(lay.tavle, "tavlen");
            if (sl.rekt.x < lay.tavle.x - 1 || sl.rekt.x + sl.rekt.b > lay.tavle.x + lay.tavle.b + 1 || sl.bund > lay.tavle.y + lay.tavle.h + 1) problemer.push(id + ": skemaet uden for tavlen");
            for (var j = 1; j < sl.midter.length; j++) {
                if (sl.midter[j] - sl.midter[j - 1] < sl.feltB + 2) problemer.push(id + ": felterne overlapper");
            }
            if (sl.feltH < 26) problemer.push(id + ": felterne er for lave");
            /* Bordet står nederst i scenen, og hintknappen kan ses i panelet */
            if (lay.bordY > Hc - 12 || lay.bordY < lay.tavle.y + lay.tavle.h) problemer.push(id + ": bordet står forkert");
            var kn = (id === "fane-vej" ? d.getElementById("vej-hjknap") : sim.el.knap).getBoundingClientRect();
            if (kn.width < 70 || kn.height < 28) problemer.push(id + ": hintknappen er for lille " + Math.round(kn.width) + "×" + Math.round(kn.height));
            if (id === "fane-vej") {
                var vV = { x: lay.vaegtV.x - lay.vb / 2, y: lay.bordY - lay.vh, b: lay.vb, h: lay.vh };
                var vH = { x: lay.vaegtH.x - lay.vb / 2, y: lay.bordY - lay.vh, b: lay.vb, h: lay.vh };
                inde(vV, "vægten til venstre"); inde(vH, "vægten til højre");
                over(vV, vH, "vægtene over hinanden");
                if (lay.pilX1 - lay.pilX0 < 40) problemer.push(id + ": ingen plads til pilen");
                if (lay.skaalY - 1.8 * lay.pose < lay.tavle.y + lay.tavle.h) problemer.push(id + ": poserne når op i tavlen");
                if (lay.ark) { inde(lay.ark, "arket"); over(lay.ark, lay.tavle, "arket over tavlen"); }
                if (lay.pilY - 24 < lay.tavle.y + lay.tavle.h) problemer.push(id + ": pilens tekst når op i tavlen");
                var kr = d.getElementById("vej-skort").getBoundingClientRect(), scr = d.querySelector("#fane-vej .scene").getBoundingClientRect();
                if (kr.bottom - scr.top > lay.tavle.y + 1) problemer.push(id + ": kortet dækker tavlen");
            }
            if (id === "fane-skema" && lay.vaegt) {
                var v = lay.v;
                var skaal = { x: v.x - v.L - 80 * v.sk, y: v.y - 0.3 * v.L, b: 2 * v.L + 160 * v.sk, h: lay.bordY - v.y + 0.3 * v.L };
                inde(skaal, "skålvægten");
                over(skaal, lay.tavle, "skålvægten over tavlen");
            }
            if (id === "fane-begr") {
                var bred = 3 * 0.96 * lay.pose;
                if (lay.xB - lay.xA < bred) problemer.push(id + ": poserne af de to stoffer overlapper");
                if (lay.pilX0 - lay.xB < bred / 2) problemer.push(id + ": poserne når ind i pilen");
                if (lay.xP + bred / 2 > Wc) problemer.push(id + ": produktets poser uden for");
                if (lay.poseBund - 2 * lay.pose < lay.tavle.y + lay.tavle.h) problemer.push(id + ": poserne når op i tavlen");
            }
        });
        paastand("layoutet holder ved " + st[0] + " × " + st[1], problemer.length === 0, problemer.slice(0, 3).join("; "));
    });
    ramme.style.width = "";
    ramme.style.height = "";
    klik('[data-fane="fane-vej"]');

    /* ================================================================ */
    overskrift("Opgaverækken på fane 1: titlerne låses op i takt (21. nov. 2026)");
    (function () {
        var O = V.opgaver;
        function knapper() { return [].slice.call(d.querySelectorAll("#vej-liste .or-knap")); }
        function tekster() { return knapper().map(function (c) { return c.textContent.trim(); }).join(" | "); }
        NK.visFane("fane-vej");
        O.status = {};
        O.aabn(0, true);
        var ch = knapper();
        paastand("ved start viser rækken kun titlen på opgave 1; de andre er et nummer med en grå streg og kan ikke klikkes",
            ch.length === 3 && /Jern og svovl/.test(ch[0].textContent) && !ch[0].disabled &&
            ch.slice(1).every(function (c, j) { return c.disabled && c.classList.contains("laast") && c.textContent.trim() === String(j + 2); }), tekster());
        ch[2].click();
        paastand("et klik på en låst opgave gør intet", O.nr === 0, O.nr);
        for (var n = 0; n < 30 && O.nr === 0; n++) {
            if (O.tilstand === "trin") O.hjaelpKlik();
            else { var b = O.el.ind.querySelector("[data-videre]"); if (b) b.click(); }
        }
        ch = knapper();
        paastand("når opgave 1 er løst (Vis svaret tæller som løst), kommer titlen på opgave 2 frem; opgave 3 er stadig låst",
            O.status.jern === "loest" && /Mere jern/.test(ch[1].textContent) && !ch[1].disabled && ch[2].disabled, tekster());
        O.status.aluminium = "loest";
        O.visRaekke();
        paastand("en opgave, der er løst før (gemt i browseren), har sin titel og kan vælges",
            /Aluminium brænder/.test(ch[2].textContent) && !ch[2].disabled, tekster());
        O.status = {};
        O.gem();
        O.aabn(0, true);
    })();
}
</script>
