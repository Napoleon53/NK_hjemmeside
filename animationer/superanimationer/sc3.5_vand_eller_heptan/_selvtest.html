<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc3.5 Vand eller heptan</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at strukturformlerne passer med sumformlerne
   og valenserne, at de polære grupper findes rigtigt, at svarene passer
   med reglen fra nabo-animationen (C-atomer pr. polær gruppe mod 4), at
   hvert stof opfører sig rigtigt i hvert glas (lag, rækkefølge,
   opløsning), at begge faner kan gennemføres (også med musen), at
   sproget overholder reglerne, og at layoutet holder fra 390 × 844 til
   1500 × 900 (ogsaa at hver tekst kan vaere i tekstboksen). Fane 1
   begynder med spoergsmaalene om vand og heptan; testen svarer paa dem,
   foer forsoeget testes.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens rekord og valg og lægger dem tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sc3.5-gaet", "nk-sc3.5-skema-ros", "nk-sc3.5-intro-forsoeg", "nk-sc3.5-intro-gaet"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Massefylde ved 20 °C i g/mL (Databogen) */
var RHO = { vand: 0.998, heptan: 0.684, glycerol: 1.261, hexanol: 0.814, methanol: 0.792, methansyre: 1.22,
            ethandiol: 1.113, pentanol: 0.815, octanol: 0.826, hexansyre: 0.929 };

/* Antal C-atomer og polære grupper, talt i hånden */
var TAL = { vand: [0, 1], heptan: [7, 0], glycerol: [3, 3], hexanol: [6, 1], glucose: [6, 6], urinstof: [1, 3],
            citronsyre: [6, 4], iod: [0, 0], methanol: [1, 1], methansyre: [1, 1], ethandiol: [2, 2],
            pentanol: [5, 1], octanol: [8, 1], hexansyre: [6, 1] };

var VALENS = { H: 1, C: 4, N: 3, O: 2, I: 1 };

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, M = NK.Molekyle;
    paastand("data.js, molekyle.js og glas.js er kørt", !!(D && D.STOFFER && M && M.grupper && NK.Glas));
    paastand("begge faner er bygget", !!(NK.sims && NK.sims["fane-forsoeg"] && NK.sims["fane-gaet"]));
    var sprites = ["reagensglas", "stativ", "stativ_forkant", "pipette", "spatel", "proeveglas", "kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var F = NK.sims["fane-forsoeg"], G = NK.sims["fane-gaet"];
    paastand("Kemichael er koblet på begge faner", !!(F.laerer && G.laerer));

    function steg(sim, s) { for (var i = 0; i < Math.round(s * 60); i++) sim.opdater(1 / 60); sim.tegn(); }

    overskrift("2. Stofferne og formlerne");
    var ider = Object.keys(D.STOFFER);
    paastand("14 stoffer: 2 opløsningsmidler, 6 i forsøget og 6 nye i gættelegen", ider.length === 14 && D.FORSOEG.length === 6 && D.GAET_NYE.length === 6 &&
        D.GAET_NYE.every(function (id) { return D.FORSOEG.indexOf(id) < 0; }));
    paastand("vand og heptan tilsættes ikke (de er opløsningsmidlerne)", D.OPL.every(function (o) {
        return D.FORSOEG.indexOf(o) < 0 && D.GAET_NYE.indexOf(o) < 0;
    }));
    paastand("vand er polært, heptan er upolært", D.polaritet("vand") === "polært" && D.polaritet("heptan") === "upolært");
    paastand("forsøget som én sætning: blandes med / opløses i, og iod næsten ikke i vand",
        D.obsSaetning("glycerol") === "Glycerol blandes med vand, men ikke med heptan." &&
        D.obsSaetning("hexanol") === "Hexan-1-ol blandes med heptan, men ikke med vand." &&
        D.obsSaetning("iod") === "Iod opløses i heptan, men næsten ikke i vand." &&
        D.obsSaetning("glucose") === "Glucose opløses i vand, men ikke i heptan.", D.obsSaetning("iod"));
    paastand("de tre første spørgsmål: vand polært, heptan upolært, et polært stof blandes med vand",
        D.START.length === 3 && D.START[0].rigtig === "polaert" && D.START[1].rigtig === "upolaert" && D.START[2].rigtig === "vand");
    var sumFejl = [], valFejl = [], afstand = [], talFejl = [], rhoFejl = [];
    ider.forEach(function (id) {
        var s = D.stof(id), mol = M.laes(s);
        var t = M.taelAtomer(mol), sum = {};
        s.sum.replace(/([A-Z][a-z]?)(\d*)/g, function (_, el, n) { if (el) sum[el] = (sum[el] || 0) + (n ? parseInt(n, 10) : 1); return ""; });
        var ens = Object.keys(sum).length === Object.keys(t).length && Object.keys(sum).every(function (el) { return sum[el] === t[el]; });
        if (!ens) sumFejl.push(id + " " + JSON.stringify(t));
        mol.atomer.forEach(function (a, i) {
            var v = M.naboer(mol, i).reduce(function (x, nb) { return x + nb.n; }, 0);
            if (v !== VALENS[a.el]) valFejl.push(id + " " + a.el + i + "=" + v);
        });
        for (var i = 0; i < mol.atomer.length; i++) {
            for (var j = i + 1; j < mol.atomer.length; j++) {
                var bundet = M.naboer(mol, i).some(function (nb) { return nb.j === j; });
                var a = mol.atomer[i], b = mol.atomer[j];
                var dd = Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
                if (!bundet && dd < 0.95) afstand.push(id + " " + a.el + i + "/" + b.el + j);
            }
        }
        var g = M.grupper(mol);
        if (M.antalC(mol) !== TAL[id][0] || g.length !== TAL[id][1]) talFejl.push(id + " " + M.antalC(mol) + "/" + g.length);
        if (s.tilstand === "vaeske" && Math.abs(s.rho - RHO[id]) > 0.002) rhoFejl.push(id);
    });
    paastand("strukturformlerne har de rigtige atomer (sumformlen)", sumFejl.length === 0, sumFejl.join("; "));
    paastand("hvert atom har sin valens (H 1, C 4, N 3, O 2, I 1)", valFejl.length === 0, valFejl.slice(0, 5).join("; "));
    paastand("ingen atomer uden binding står oven i hinanden", afstand.length === 0, afstand.slice(0, 5).join("; "));
    paastand("C-atomer og polære grupper passer med optællingen i hånden", talFejl.length === 0, talFejl.join("; "));
    paastand("massefylderne passer med Databogen", rhoFejl.length === 0, rhoFejl.join(", "));
    var cooh = M.grupper(M.laes(D.stof("citronsyre"))).filter(function (x) { return x.slags === "COOH"; });
    paastand("citronsyre: tre COOH-grupper med C'et i gruppen", cooh.length === 3 && cooh.every(function (x) { return x.atomer.length === 4; }));

    /* Reglen fra 6.5 (sc4.2): C-atomer pr. polær gruppe under 4 giver vand, over 4 heptan */
    var regel = ider.filter(function (id) {
        var c = TAL[id][0], n = TAL[id][1];
        var efterRegel = n === 0 ? "heptan" : (c < 4 * n ? "vand" : (c > 4 * n ? "heptan" : "graense"));
        return efterRegel !== D.stof(id).blandes;
    });
    paastand("svarene passer med reglen i nabo-animationen, og intet stof ligger på grænsen", regel.length === 0, regel.join(", "));
    ["vand", "heptan"].forEach(function (slags) {
        var n = D.FORSOEG.concat(D.GAET_NYE).filter(function (id) { return D.stof(id).blandes === slags; }).length;
        paastand("mindst 5 stoffer blandes med " + slags, n >= 5);
    });
    var flydende = ider.filter(function (id) { return D.stof(id).tilstand === "vaeske"; });
    paastand("de faste stoffer er glucose, urinstof, citronsyre og iod", ider.length - flydende.length === 4 &&
        ["glucose", "urinstof", "citronsyre", "iod"].every(function (id) { return D.stof(id).tilstand === "fast"; }));

    overskrift("3. Glassene");
    function test(stofId, opl, portioner) {
        var g = new NK.Glas(opl), rystninger = 0, t = 0;
        for (var p = 0; p < (portioner || 1); p++) {
            g.tilsaet(stofId);
            for (var i = 0; i < 90 && g.tilsaetT >= 0; i++) g.opdater(1 / 60);
        }
        while (!g.resultat && t < 30) {
            if (g.rystT < 0 && (!g.rystet || g.mereAtRyste())) { g.ryst(); rystninger++; }
            g.opdater(1 / 60);
            t += 1 / 60;
        }
        return { g: g, rystninger: rystninger, t: t };
    }
    var modelFejl = [], raekkeFejl = [], tidFejl = [];
    ider.forEach(function (id) {
        D.OPL.forEach(function (opl) {
            var r = test(id, opl);
            var s = D.stof(id);
            if (!r.g.resultat) { modelFejl.push(id + "/" + opl + " intet resultat"); return; }
            if (r.g.resultat.blandes !== D.blandbar(id, opl)) modelFejl.push(id + "/" + opl);
            if (r.t > 6) tidFejl.push(id + "/" + opl + " " + r.t.toFixed(1) + " s");
            var lag = r.g.lag();
            if (s.tilstand === "vaeske") {
                if (D.blandbar(id, opl) !== (lag.length === 1)) raekkeFejl.push(id + "/" + opl + " " + lag.length + " lag");
                if (lag.length === 2) {
                    var nederst = lag[0].navn === s.navn ? s.rho : D.stof(opl).rho;
                    var oeverst = lag[1].navn === s.navn ? s.rho : D.stof(opl).rho;
                    if (!(nederst > oeverst)) raekkeFejl.push(id + "/" + opl + " det tunge lag ligger ikke nederst");
                }
            }
        });
    });
    paastand("hvert stof blandes med det rigtige glas (28 forsøg)", modelFejl.length === 0, modelFejl.join(", "));
    paastand("to lag, når det ikke blandes, og det tungeste lag nederst", raekkeFejl.length === 0, raekkeFejl.join(", "));
    paastand("hvert forsøg er klar inden 6 s efter én portion", tidFejl.length === 0, tidFejl.join(", "));
    paastand("iagttagelserne: to lag, ét lag, opløst, opløses næsten ikke",
        D.iagttagelse("heptan", "vand") === "to lag" && D.iagttagelse("hexanol", "heptan") === "ét lag" &&
        D.iagttagelse("glucose", "vand") === "opløst" && D.iagttagelse("glucose", "heptan") === "opløses ikke" &&
        D.iagttagelse("iod", "vand") === "opløses næsten ikke");
    var tre = test("glucose", "vand", 3);
    paastand("tre spatelspidser glucose kræver mere end én rystning", tre.g.resultat && tre.rystninger >= 2, tre.rystninger);
    var iod = test("iod", "heptan");
    var farve = iod.g.lag()[0].tint;
    paastand("iod farver heptan violet", farve[0] > farve[1] && farve[2] > farve[1] && farve[3] > 0.25, JSON.stringify(farve));
    var iv = test("iod", "vand").g.lag()[0].tint;
    paastand("iod i vand giver kun et svagt skær", iv[3] <= 0.2, iv[3]);
    var hep = test("heptan", "vand").g.lag();
    paastand("heptan lægger sig oven på vand", hep[1].navn === "heptan" && hep[0].navn === "vand");
    var gly = new NK.Glas("vand");
    gly.tilsaet("glycerol");
    for (var ii = 0; ii < 90 && gly.tilsaetT >= 0; ii++) gly.opdater(1 / 60);
    paastand("glycerol ligger for sig, til glasset rystes", gly.blandet < 0.05 && !gly.resultat);
    var fuld = new NK.Glas("vand");
    for (var p = 0; p < 4; p++) { fuld.tilsaet("methanol"); for (ii = 0; ii < 90 && fuld.tilsaetT >= 0; ii++) fuld.opdater(1 / 60); }
    paastand("højst tre portioner i et glas", fuld.portioner === 3 && fuld.fuld());

    /* Tekstboksen paa kortet: det, eleven laeser og svarer */
    function tbTekst(p) { return d.getElementById(p + "-tb-tekst").textContent; }
    function tbLinje(p) { return d.getElementById(p + "-tb-linje").textContent; }
    function tbLinjeKlasse(p, k) { return d.getElementById(p + "-tb-linje").classList.contains(k); }
    function svarKnap(p, id) { return d.querySelector("#" + p + "-tb-svar [data-svar=\"" + id + "\"]"); }
    function tbKnap(p) { return d.getElementById(p + "-tb-knap"); }
    function svar(p, sim, id) { sim.visTb(); var b = svarKnap(p, id); if (b) b.click(); steg(sim, 0.05); }
    function knap(p, sim) { sim.visTb(); tbKnap(p).click(); steg(sim, 0.05); }
    function iKortet(sim, p) {
        var e = d.getElementById(p + "-tb"), r = sim.lay.kort;
        var q = { x: e.offsetLeft, y: e.offsetTop, b: e.offsetWidth, h: e.offsetHeight };
        return e.parentNode.classList.contains("scene") && q.x >= r.x - 1 && q.y >= r.y - 1 && q.x + q.b <= r.x + r.b + 1 && q.y + q.h <= r.y + r.h + 1;
    }
    /* Fang det, der tegnes paa kortet */
    function fang(obj, navn, sim) {
        var kald = [], gammel = obj[navn];
        obj[navn] = function () { kald.push(Array.prototype.slice.call(arguments)); return gammel.apply(this, arguments); };
        sim.tegn();
        obj[navn] = gammel;
        return kald;
    }
    function markerAlle(sim) {
        sim.grupper.forEach(function (g) {
            var a = g.atomer[g.atomer.length > 1 ? 1 : 0];
            sim.klikKort(M.px(sim.plan, sim.mol.atomer[a]));
        });
    }

    overskrift("4. Fane 1: vand og heptan");
    try { W.localStorage.removeItem("nk-sc3.5-intro-forsoeg"); } catch (e) { /* ingen hukommelse */ }
    klik('[data-fane="fane-forsoeg"]');
    F.startForfra();
    F.tilpas();
    steg(F, 0.1);
    paastand("fanen begynder med spørgsmålet: er vand polært eller upolært?", F.fase === "start" &&
        tbTekst("forsoeg") === "Er vand polært eller upolært?" && !!svarKnap("forsoeg", "polaert") && !!svarKnap("forsoeg", "upolaert"));
    paastand("spørgsmålet står på kortet i scenen, ikke i panelet", iKortet(F, "forsoeg"));
    paastand("der er ingen tekstlinje nederst i scenen", !d.querySelector(".scene-mrk") && !d.getElementById("gaet-kort"));
    var deltaKald = fang(NK.Tegn, "delta", F);
    paastand("kortet viser vandmolekylet med δ− og δ+", deltaKald.length === 1);
    paastand("prøveglasset er ikke fremme endnu, og skemaet er dæmpet", F.skjulProeve() &&
        !F.overProeve({ x: F.lay.vial.cx, y: F.lay.vial.y + 40 }) && d.getElementById("forsoeg-anker-proeve").offsetWidth === 0 &&
        d.getElementById("forsoeg-skema").classList.contains("daempet"));
    paastand("intet mærke på glassene, før eleven har svaret", F.visPraedikat("vand") === 0 && F.visPraedikat("heptan") === 0);
    paastand("tilbuddet om præsentationen venter", W.getComputedStyle(d.getElementById("forsoeg-tilbud")).display === "none");
    F.klikGlas(0);
    steg(F, 0.1);
    paastand("et klik på vandglasset svarer og tilsætter intet", /Glasset med vand/.test(tbLinje("forsoeg")) && F.glas[0].tom());
    svar("forsoeg", F, "upolaert");
    paastand("forkert svar: forklaring i rødt, og spørgsmålet står stadig", /^Nej\./.test(tbLinje("forsoeg")) && tbLinjeKlasse("forsoeg", "skidt") &&
        svarKnap("forsoeg", "upolaert").classList.contains("forkert") && !F.spm.loest);
    svar("forsoeg", F, "polaert");
    paastand("rigtigt svar: kort ros i grønt, og knappen hedder Næste", tbLinje("forsoeg") === "Rigtigt. Vand er polært." &&
        tbLinjeKlasse("forsoeg", "god") && tbKnap("forsoeg").textContent === "Næste →" && svarKnap("forsoeg", "polaert").classList.contains("rigtig"));
    steg(F, 0.6);
    paastand("mærket polært kommer på vandglasset", F.visPraedikat("vand") === 1 && F.visPraedikat("heptan") === 0);
    paastand("næste spørgsmål kommer først, når eleven trykker Næste", F.startNr === 0);
    knap("forsoeg", F);
    paastand("andet spørgsmål: er heptan polært eller upolært?", F.startNr === 1 && tbTekst("forsoeg") === "Er heptan polært eller upolært?" &&
        /kun af carbon og hydrogen/.test(tbLinje("forsoeg")));
    knap("forsoeg", F);
    paastand("Giv hint giver et hint, og knappen hedder Vis svaret", /^Hint:/.test(tbLinje("forsoeg")) && tbKnap("forsoeg").textContent === "Vis svaret");
    knap("forsoeg", F);
    steg(F, 0.6);
    paastand("Vis svaret viser svaret og sætter upolært på heptanglasset", F.spm.loest && /^Svaret: Heptan er upolært/.test(tbLinje("forsoeg")) &&
        F.visPraedikat("heptan") === 1);
    knap("forsoeg", F);
    paastand("tredje spørgsmål: hvad blandes et polært stof med?", F.startNr === 2 && tbTekst("forsoeg") === "Hvad blandes et polært stof med?" &&
        !!svarKnap("forsoeg", "vand") && !!svarKnap("forsoeg", "heptan"));
    F.vaelgStof("hexanol");
    steg(F, 0.05);
    paastand("skemaet venter, til spørgsmålene er besvaret", F.fase === "start" && /Svar først/.test(tbLinje("forsoeg")));
    svar("forsoeg", F, "vand");
    paastand("efter det sidste spørgsmål hedder knappen Test stofferne", tbKnap("forsoeg").textContent === "Test stofferne →");
    knap("forsoeg", F);
    paastand("så kommer stofferne: glycerol, prøveglasset og skemaet", F.fase === "test" && F.stof === "glycerol" && !F.skjulProeve() &&
        !d.getElementById("forsoeg-skema").classList.contains("daempet") && tbTekst("forsoeg") === "Test glycerol i begge glas.");
    paastand("bagefter tilbydes præsentationen", W.getComputedStyle(d.getElementById("forsoeg-tilbud")).display !== "none");
    F.afvisTilbud();

    overskrift("5. Fane 1: forsøget, polært eller upolært og de polære grupper");
    paastand("to tomme glas og en pipette", F.glas[0].tom() && F.glas[1].tom() && F.redskab() === "pipette");
    paastand("tekstboksen siger, hvad man skal", /Træk pipetten/.test(tbLinje("forsoeg")));
    /* Med musen: grib pipetten, træk den over vandglasset og slip */
    var c = F.L.canvas, r = c.getBoundingClientRect();
    function mus(cv, type, x, y) {
        var rr = cv.getBoundingClientRect();
        cv.dispatchEvent(new W.PointerEvent(type, { clientX: rr.left + x, clientY: rr.top + y, bubbles: true, pointerId: 1, isPrimary: true }));
    }
    function traek(sim, i) {
        var cv = sim.L.canvas, pp = sim.pipPos(), gl = sim.lay.glas[i];
        mus(cv, "pointerdown", pp.x, pp.y - 60 * sim.lay.k);
        mus(cv, "pointermove", pp.x - 30, pp.y - 70 * sim.lay.k);
        mus(cv, "pointermove", gl.cx, gl.y + 20 * sim.lay.k);
        var undervejs = { tilstand: sim.pip.tilstand, over: sim.over };
        mus(cv, "pointerup", gl.cx, gl.y + 20 * sim.lay.k);
        return undervejs;
    }
    var uv = traek(F, 0);
    paastand("pipetten følger musen og finder vandglasset", uv.tilstand === "traek" && uv.over === 0, uv.tilstand + " " + uv.over);
    steg(F, 1.6);
    paastand("sluppet over glasset drypper den glycerol i vandet", F.glas[0].portioner === 1 && F.glas[0].stof === "glycerol");
    paastand("tekstboksen beder om en rystning", /ryste/.test(tbLinje("forsoeg")));
    var gl0 = F.lay.glas[0];
    mus(c, "pointerdown", gl0.cx, F.lay.bordY - 40);
    mus(c, "pointerup", gl0.cx, F.lay.bordY - 40);

            if (lay.rack.x + lay.rack.b + 4 + 150 > lay.vial.x + 1 && Wc >= 700) problemer.push(id + ": mærkaterne til højre rammer prøven");
            [0, 1].forEach(function (j) {
                if (sim.pipOver(j).y - 170 * k < 0) problemer.push(id + ": pipetten går op over kanten");
            });
            var mk = sim.maerker(sim.L.ctx);
            mk.forEach(function (m) {
                var r = { x: m.cx - m.b / 2, y: m.navnY - 14, b: m.b, h: m.polY + 11 - (m.navnY - 14) };
                if (r.x < -1 || r.x + r.b > Wc + 1 || r.y < -1) problemer.push(id + ": mærket over " + m.navn + " uden for");
                over(r, lay.kort, "kortet over mærket ved " + m.navn);
            });
            if (mk[0].cx + mk[0].b / 2 + 4 > mk[1].cx - mk[1].b / 2) problemer.push(id + ": mærkerne over glassene rører hinanden");
            /* Den hoejeste og den bredeste formel skal kunne laeses */
            var mindst = Math.min.apply(null, ["octanol", "citronsyre", "glucose"].map(function (sid) {
                return M.plan(M.laes(D.stof(sid)), lay.formel, 46).u;
            }));
            if (mindst < 18 && Wc >= 700) problemer.push(id + ": formlen er for lille (" + mindst.toFixed(1) + " px pr. binding)");
            if (mindst < 14) problemer.push(id + ": formlen er ulæselig (" + mindst.toFixed(1) + ")");
            /* Teksterne i tekstboksen */
            var ruller = [];
            (id === "fane-forsoeg" ? f1Tilstande() : f2Tilstande()).forEach(function (saet) {
                var navn = saet();
                if (!tbPasser(sim, id === "fane-forsoeg" ? "forsoeg" : "gaet")) ruller.push(navn);
            });
            if (ruller.length) problemer.push(id + ": tekstboksen ruller ved " + ruller.slice(0, 3).join(", ") + (ruller.length > 3 ? " (+" + (ruller.length - 3) + ")" : ""));
        });
        paastand("layoutet holder ved " + st[0] + " × " + st[1], problemer.length === 0, problemer.slice(0, 3).join("; "));
    });
    ramme.style.width = "";
    ramme.style.height = "";
    klik('[data-fane="fane-gaet"]');
    G.nyRunde();
    klik('[data-fane="fane-forsoeg"]');
    F.startForfra();

    function klik(sel) {
        var e = d.querySelector(sel);
        if (e) e.click();
    }
}
</script>
