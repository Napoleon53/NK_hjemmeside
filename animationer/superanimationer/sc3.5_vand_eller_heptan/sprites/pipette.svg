<svg xmlns="http://www.w3.org/2000/svg" width="30" height="170" viewBox="0 0 30 170">
  <!-- Pasteurpipette med gummisut. Spidsen er i (15, 170); det er
       ankerpunktet, naar den haenger over et glas. Lidt klar vaeske i den
       nederste del, saa man kan se, at den er fyldt. -->
  <!-- Vaesken -->
  <path d="M10.5 112 L10.5 116 L13.6 150 L14.2 167 L15.8 167 L16.4 150 L19.5 116 L19.5 112 Z"
        fill="#cfe3f3" fill-opacity="0.55"/>
  <path d="M10.5 112 H19.5" stroke="#5f7182" stroke-opacity="0.55" stroke-width="1"/>

  <!-- Glasset -->
  <path d="M9 44 L9 116 L13 150 L13.6 169 L16.4 169 L17 150 L21 116 L21 44"
        fill="#e4f1fb" fill-opacity="0.22" stroke="#3f4b57" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M11.5 50 L11.5 112" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Gummisutten -->
  <path d="M8 46 L8 20 Q8 2 15 2 Q22 2 22 20 L22 46 Z" fill="#c2452c" stroke="#6e2213" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M6.5 44 H23.5 V50 H6.5 Z" fill="#a8391f" stroke="#6e2213" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M11 8 Q10.5 16 11 30" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round"/>
</svg>
