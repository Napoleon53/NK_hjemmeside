<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Tegningerne i sc7.4</title>
<style>
    body { background:#1b1d24; color:#dde3ea; font-family:"Segoe UI",sans-serif; margin:0; padding:20px; }
    h1 { font-size:1.1rem; margin:0 0 6px; }
    p { margin:0 0 18px; color:#a9b0ba; font-size:0.9rem; }
    .raekke { display:flex; flex-wrap:wrap; gap:26px; align-items:flex-end; }
    figure { margin:0; text-align:center; }
    figure img { display:block; margin:0 auto 6px; background:repeating-conic-gradient(#262833 0% 25%, #2d303b 0% 50%) 50% / 16px 16px; }
    figcaption { font-size:0.82rem; color:#a9b0ba; }
</style>
</head>
<body>
<!-- Udviklerværktøj. Indgår ikke i animationen og kan slettes. -->
<h1>Tegningerne i sc7.4</h1>
<p>Glasudstyret uden væske. Væsken, tallene på buretten, hanens håndtag og teksten på etiketten tegnes af animationen.</p>
<div class="raekke">
    <figure><img src="sprites/buret.svg" width="60" height="900" alt=""><figcaption>buret.svg (40 × 600)</figcaption></figure>
    <figure><img src="sprites/kolbe.svg" width="225" height="300" alt=""><figcaption>kolbe.svg (150 × 200)</figcaption></figure>
    <figure><img src="sprites/omroerer.svg" width="255" height="75" alt=""><figcaption>omroerer.svg (170 × 50)</figcaption></figure>
    <figure><img src="sprites/eddike.svg" width="105" height="225" alt=""><figcaption>eddike.svg (70 × 150)</figcaption></figure>
    <figure><img src="sprites/sproejteflaske.svg" width="165" height="195" alt=""><figcaption>sproejteflaske.svg (fra sc7.2)</figcaption></figure>
</div>
</body>
</html>
