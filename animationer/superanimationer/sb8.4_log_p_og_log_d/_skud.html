<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skærmbilleder: sb8.4 Log P og log D</title>
<style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    iframe { border: 0; display: block; }
</style>
</head>
<body>
<!--
    Udviklerværktøj. Indgår ikke i animationen.
    Åbner index.html i en ramme med fast størrelse og stiller animationen i et
    bestemt trin, så det kan ses som skærmbillede:
      _skud.html?b=1400&h=860&s=<scenarie>
    Kræver en lokal server med mappen animationer/ som rod.
-->
<script>
var q = {};
location.search.replace(/^\?/, "").split("&").forEach(function (p) { var a = p.split("="); if (a[0]) q[a[0]] = decodeURIComponent(a[1] || ""); });
var B = parseInt(q.b || "1400", 10), H = parseInt(q.h || "860", 10);
var f = document.createElement("iframe");
f.width = B; f.height = H;
f.src = "index.html";
document.body.appendChild(f);

function tid(sim, sek) { for (var t = 0; t < sek; t += 1 / 60) sim.opdater(1 / 60); }
function lp(NK) { NK.visFane("fane-p"); var s = NK.sims["fane-p"]; s.vaelg(0); return s; }
function ld(NK) { NK.visFane("fane-d"); var s = NK.sims["fane-d"]; s.vaelg(0); return s; }
function lb(NK) { NK.visFane("fane-b"); var s = NK.sims["fane-b"]; s.vaelg(0); return s; }
function ryst(s) { s.rystTragt(); tid(s, 2.6); }
function spor(s) { for (var p = 0; p <= 14.01; p += 0.1) s.saetPh(p); tid(s, 0.3); }
/* Fane 1 til et bestemt trin (0-3) */
function lpTil(NK, n) {
    var s = lp(NK);
    if (n >= 1) { ryst(s); s.videreKlik(); }
    if (n >= 2) { s.talTekst = "3,0"; s.indsendKlik(); s.videreKlik(); }
    if (n >= 3) { s.talTekst = "0,48"; s.indsendKlik(); s.videreKlik(); }
    return s;
}
function ldTil(NK, n) {
    var s = ld(NK);
    if (n >= 1) { spor(s); s.videreKlik(); }
    if (n >= 2) { s.valgt = 0; s.indsendKlik(); s.videreKlik(); }
    if (n >= 3) { s.talTekst = "-1,8"; s.indsendKlik(); tid(s, 2); s.videreKlik(); }
    return s;
}
function lbTil(NK, n) {
    var s = lb(NK);
    if (n >= 1) { spor(s); s.videreKlik(); }
    if (n >= 2) { s.talTekst = "-0,7"; s.indsendKlik(); tid(s, 2); s.videreKlik(); }
    if (n >= 3) { s.valgt = 1; s.indsendKlik(); s.videreKlik(); }
    return s;
}

var SCENARIER = {
    "p-start": function (NK) { lp(NK); },
    "p-ryster": function (NK) { var s = lp(NK); s.rystTragt(); tid(s, 0.7); },
    "p-skiller": function (NK) { var s = lp(NK); s.rystTragt(); tid(s, 1.6); },
    "p-rystet": function (NK) { var s = lp(NK); ryst(s); },
    "p-kf": function (NK) { var s = lpTil(NK, 1); s.talTekst = "0,33"; s.visKort(); s.indsendKlik(); },
    "p-kf-ok": function (NK) { var s = lpTil(NK, 1); s.talTekst = "3,0"; s.indsendKlik(); },
    "p-logp-ok": function (NK) { var s = lpTil(NK, 2); s.talTekst = "0,48"; s.indsendKlik(); },
    "p-x": function (NK) { lpTil(NK, 3); },
    "p-x-spm": function (NK) { var s = lpTil(NK, 3); ryst(s); s.valgt = 0; s.visKort(); },
    "p-x-ok": function (NK) { var s = lpTil(NK, 3); ryst(s); s.valgt = 2; s.indsendKlik(); },
    "p-frit": function (NK) { var s = lpTil(NK, 3); ryst(s); s.valgt = 2; s.indsendKlik(); s.proevStof("glu"); ryst(s); },
    "d-start": function (NK) { var s = ld(NK); tid(s, 0.5); },
    "d-halv": function (NK) { var s = ld(NK); for (var p = 0; p <= 4.6; p += 0.1) s.saetPh(p); tid(s, 1.5); },
    "d-tegnet": function (NK) { var s = ld(NK); spor(s); s.saetPh(7.4); tid(s, 1.5); },
    "d-hvorfor": function (NK) { var s = ldTil(NK, 1); s.saetPh(10); tid(s, 1.5); s.valgt = 1; s.indsendKlik(); },
    "d-regn": function (NK) { var s = ldTil(NK, 2); s.talTekst = "1,2"; s.visKort(); s.indsendKlik(); },
    "d-regn-ok": function (NK) { var s = ldTil(NK, 2); s.talTekst = "-1,8"; s.indsendKlik(); tid(s, 2); },
    "d-genvej": function (NK) { var s = ldTil(NK, 3); s.valgt = 3; s.visKort(); },
    "d-slut": function (NK) { var s = ldTil(NK, 3); s.valgt = 1; s.indsendKlik(); tid(s, 2); },
    "b-start": function (NK) { var s = lb(NK); tid(s, 0.5); },
    "b-tegnet": function (NK) { var s = lb(NK); spor(s); s.saetPh(5); tid(s, 1.5); },
    "b-regn-ok": function (NK) { var s = lbTil(NK, 1); s.talTekst = "-0,7"; s.indsendKlik(); tid(s, 2); },
    "b-krop": function (NK) { var s = lbTil(NK, 2); s.saetPh(2); tid(s, 1.5); s.valgt = 0; s.visKort(); },
    "b-ukendt": function (NK) { var s = lbTil(NK, 3); for (var p = 0; p <= 9; p += 0.1) s.saetPh(p); tid(s, 1.5); },
    "b-ukendt-fejl": function (NK) { var s = lbTil(NK, 3); spor(s); s.valgt = 0; s.talTekst = "2,4"; s.indsendKlik(); },
    "b-slut": function (NK) { var s = lbTil(NK, 3); spor(s); s.saetPh(12); tid(s, 1.5); s.valgt = 1; s.talTekst = "2,4"; s.indsendKlik(); },
    "teori": function (NK, W) { W.document.getElementById("teoriknap").click(); }
};

f.addEventListener("load", function () {
    var W = f.contentWindow;
    try { W.localStorage.clear(); } catch (e) { /* ingen hukommelse */ }
    setTimeout(function () {
        var NK = W.NK;
        try { (SCENARIER[q.s] || function () {})(NK, W); } catch (e) { document.title = "FEJL " + e.message; console.log("FEJL " + e.message + " " + e.stack); }
        NK.tid.skala = 0;
        var sims = NK.sims;
        Object.keys(sims).forEach(function (k) { sims[k].tilpas(); });
        setTimeout(function () { Object.keys(sims).forEach(function (k) { try { sims[k].tegn(); } catch (e) { document.title = "FEJL " + e.message; console.log("FEJL tegn " + e.message + " " + e.stack); } }); window.klar = true; }, 80);
    }, 400);
});
</script>
</body>
</html>
