<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc4.4 Ækvivalente mængder</title>
<style>
    body { background: #1b1d24; color: #dde3ea; font-family: "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 1rem; margin: 0 0 14px; color: #f2c53d; }
    .ark { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; padding: 12px; background: #262833; border: 1px solid #3a3a47; border-radius: 8px; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    figcaption { font-size: 0.8rem; color: #a9b0ba; }
    .lys { background: #3b404c; }
</style>
</head>
<body>
<!-- Udviklerværktøj: viser sprites alene, før de sættes i bevægelse. Indgår ikke i animationen. -->
<h1>sc4.4: sprites i dobbelt størrelse</h1>
<div class="ark">
    <figure><img src="sprites/poelse.svg" width="240"><figcaption>poelse.svg</figcaption></figure>
    <figure><img src="sprites/broed.svg" width="260"><figcaption>broed.svg</figcaption></figure>
    <figure><img src="sprites/agurk.svg" width="64"><figcaption>agurk.svg</figcaption></figure>
    <figure><img src="sprites/bolle.svg" width="128"><figcaption>bolle.svg</figcaption></figure>
    <figure><img src="sprites/boef.svg" width="120"><figcaption>boef.svg</figcaption></figure>
    <figure><img src="sprites/ost.svg" width="112"><figcaption>ost.svg</figcaption></figure>
    <figure><img src="sprites/stegeplade.svg" width="320"><figcaption>stegeplade.svg</figcaption></figure>
    <figure><img src="sprites/ostepakke.svg" width="240"><figcaption>ostepakke.svg</figcaption></figure>
    <figure><img src="sprites/gryde.svg" width="300"><figcaption>gryde.svg</figcaption></figure>
    <figure><img src="sprites/kurv.svg" width="300"><figcaption>kurv.svg</figcaption></figure>
    <figure class="lys"><img src="sprites/agurkglas.svg" width="200"><figcaption>agurkglas.svg (tomt)</figcaption></figure>
    <figure><img src="sprites/klokke.svg" width="160"><figcaption>klokke.svg</figcaption></figure>
    <figure><img src="sprites/kammer.svg" width="450"><figcaption>kammer.svg</figcaption></figure>
</div>
</body>
</html>
