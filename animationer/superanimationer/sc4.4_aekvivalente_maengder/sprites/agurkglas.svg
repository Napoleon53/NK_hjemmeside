<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
<!-- Glasset med syltede agurker, set forfra og tomt. Skiverne og
     etiketten tegnes i koden, saa glasset kan blive tomt.
     Laaget y 2-20, halsen y 20-30, det indre x 10-90 og y 32-124,
     etiketten y 68-102. Bunden staar i y 128. -->
<defs>
  <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#cfe6d8" stop-opacity="0.35"/>
    <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.12"/>
    <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.05"/>
    <stop offset="1" stop-color="#cfe6d8" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="laag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c54a"/>
    <stop offset="1" stop-color="#a8841c"/>
  </linearGradient>
</defs>
<path d="M18 20 L82 20 L82 28 Q92 30 92 40 L92 118 Q92 128 82 128 L18 128 Q8 128 8 118 L8 40 Q8 30 18 28 Z"
      fill="url(#glas)" stroke="#9fb8ab" stroke-width="2"/>
<rect x="14" y="2" width="72" height="19" rx="4" fill="url(#laag)" stroke="#7a5f12" stroke-width="1.5"/>
<g stroke="#7a5f12" stroke-width="1" opacity="0.6">
  <path d="M22 5 L22 18"/><path d="M32 5 L32 18"/><path d="M42 5 L42 18"/><path d="M52 5 L52 18"/>
  <path d="M62 5 L62 18"/><path d="M72 5 L72 18"/><path d="M80 5 L80 18"/>
</g>
<path d="M15 44 L15 112" stroke="#ffffff" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
<path d="M84 50 L84 80" stroke="#ffffff" stroke-width="2" opacity="0.25" stroke-linecap="round"/>
</svg>
