<svg xmlns="http://www.w3.org/2000/svg" width="160" height="56" viewBox="0 0 80 28">
  <!-- Et lod paa 1 bar set fra siden. Knoppen er y 0-7, kroppen y 6-28
       (bunden er y 28). Loddet tegnes, saa bunden ligger paa stemplet
       eller hylden. -->
  <defs>
    <linearGradient id="krop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a9099"/>
      <stop offset="0.18" stop-color="#6c727b"/>
      <stop offset="0.7" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#34383e"/>
    </linearGradient>
    <linearGradient id="knop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/>
      <stop offset="1" stop-color="#555a62"/>
    </linearGradient>
  </defs>
  <rect x="31" y="1" width="18" height="7" rx="2.5" fill="url(#knop)" stroke="#2c2f34" stroke-width="1"/>
  <rect x="2" y="6.5" width="76" height="21" rx="4" fill="url(#krop)" stroke="#23262b" stroke-width="1.2"/>
  <rect x="5" y="8.5" width="70" height="2" rx="1" fill="#ffffff" opacity="0.18"/>
  <text x="40" y="22.6" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#e9edf2">1 bar</text>
</svg>
