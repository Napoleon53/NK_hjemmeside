<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc5.9 Lightergas</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at molarmasserne og molvolumenet passer, at
   eksemplerne og den ukendte gas giver den rigtige alkan, at lighterens
   ventil og tuningen opfører sig som beskrevet, at formlerne og tallene
   genkendes med de typiske fejl, at fane 1 kan gennemføres med musen,
   at påskeæggene (stikflamme, vand i lighteren, brandkugle) kalder
   Kemichael ind, at fane 2 og 3 kan gennemføres, at de seks fejlkilder
   går den rigtige vej, at sproget holder reglerne, og at layoutet holder
   fra 520 × 380 til 1500 × 900.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sc5.9-forsoeg", "nk-sc5.9-beregning", "nk-sc5.9-fejl", "nk-sc5.9-maalinger", "nk-kemichael"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Ord, der er skrevet uden æ, ø og å, og som derfor ikke må nå eleven */
var ASCII_ORD = /\b(foer|faerdig|naeste|Naeste|gaa|staa|paa|foerst|hoejre|hoejere|vaegt\w*|Vaegt\w*|laerer\w*|forsoeg\w*|maaling\w*|Maaling\w*|haette\w*|maaleglas\w*|fejlkild\w*|toer\w*)\b/;

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;

    function tik(sim, sek) { for (var k = 0; k < Math.round(sek * 60); k++) sim.opdater(1 / 60); }
    function enter(inp) { inp.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); }
    function felt(id, tekst) { var e = d.getElementById(id); e.value = tekst; enter(e); }
    /* Indsend svar paa kortet (Aflaes vaegten skriver kun tallet i feltet) */
    function indsend(fane) { d.getElementById((fane || "forsoeg") + "-indsend").click(); }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, K = NK.Kemi, T = NK.Tjek, Tg = NK.Tegn;
    paastand("data.js, kemi.js, tjek.js, regning.js og laerer.js er kørt", !!(D && D.FEJL && K && K.Lighter && K.Forloeb && T && T.formel && NK.Regning && NK.Laerer));
    paastand("alle tre faner er bygget", !!(NK.sims && NK.sims["fane-forsoeg"] && NK.sims["fane-beregning"] && NK.sims["fane-fejl"]));
    var sprites = ["lighter", "haette", "maaleglas", "kar", "stativ", "vaegt", "lup", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var A = NK.sims["fane-forsoeg"], B = NK.sims["fane-beregning"], C = NK.sims["fane-fejl"];
    paastand("Kemichael præsenterer ikke: ingen tilbudsknapper og ingen kateder", !d.querySelector(".tilbud") && !d.querySelector(".kknap") && !NK.RoligLaerer);
    paastand("Kemichael står uden for scenen fra start", !A.laerer.synlig());

    overskrift("2. Kemien");
    var M = D.ALKANER.map(function (a) { return K.Mtekst(D.ALKANER.indexOf(a)); });
    paastand("molarmasserne: 16,05, 30,08, 44,11, 58,14 og 72,17 g/mol", M.join(" ") === "16,05 30,08 44,11 58,14 72,17", M.join(" "));
    paastand("formlerne er CₙH₂ₙ₊₂", D.ALKANER.map(function (a) { return a.formel; }).join(" ") === "CH4 C2H6 C3H8 C4H10 C5H12");
    paastand("1 mol butan fylder 24,0 L ved 20 °C", Math.abs(K.mL(K.M_GAS) - 24000) < 1e-6);
    paastand("150 mL butan vejer 0,363 g", NK.betydende(K.gram(150), 3) === "0,363", K.gram(150));
    paastand("ved 30 °C fylder den samme gas 3,4 % mere", Math.abs(K.vm(30) / K.vm(20) - 303 / 293) < 1e-9);
    D.EKSEMPEL.forEach(function (e, i) {
        var f = K.facit(e);
        paastand("eksempel " + (i + 1) + " giver butan (" + K.Mv(f.M) + " g/mol)", f.alkan === D.LIGHTERGAS && Math.abs(f.M / K.M_GAS - 1) < 0.02);
        /* Og det er det, modellen giver: m(efter) = m(før) − massen af V mL */
        paastand("eksempel " + (i + 1) + " passer med modellen", K.r2(e.mf - K.gram(e.V)) === e.me, K.r2(e.mf - K.gram(e.V)) + " / " + e.me);
    });
    var ukendt = D.BEREGNING[2].tal.map(function (t) { var f = K.facit(t); return { a: f.alkan, afv: Math.abs(f.M / K.M(f.alkan) - 1) }; });
    paastand("de fire ukendte gasser er fire forskellige alkaner", ukendt.map(function (u) { return u.a; }).sort().join("") === "0123");
    paastand("de ukendte gasser ligger højst 1,5 % fra deres alkan", ukendt.every(function (u) { return u.afv < 0.015; }), JSON.stringify(ukendt));

    overskrift("3. Lighteren og tuningen");
    var lt = new K.Lighter(17.84);
    paastand("den nye lighter vejer det, den skal (med hætte)", lt.visning() === 17.84);
    paastand("fabrikkens indstilling giver 24 mL/s", lt.flow() === 24);
    paastand("pinden kan ikke løftes med hætten på", lt.loeft() === false && !lt.loeftet);
    lt.saetPind(1);
    paastand("pinden helt frem giver åbning 1 (ikke tunet)", lt.aabning() === 1 && !lt.tunet());
    lt.haette = false;
    paastand("hætten vejer " + NK.tal2(D.HAETTE) + " g", Math.abs(K.r2(17.84 - D.HAETTE) - lt.visning()) < 0.001);
    lt.loeft(); lt.saetPind(0); lt.saenk(); lt.saetPind(1);
    paastand("frem, løft, tilbage, ned, frem: åbning 2 og tunet", Math.abs(lt.aabning() - 2) < 1e-9 && lt.tunet());
    lt.saetPind(0);
    paastand("tilbage uden løft: åbning 1 og stadig tunet", Math.abs(lt.aabning() - 1) < 1e-9 && !lt.tunet());
    lt.saetPind(1);
    for (var n = 0; n < 6; n++) { lt.loeft(); lt.saetPind(0); lt.saenk(); lt.saetPind(1); }
    paastand("åbningen stopper ved " + D.AABEN_MAKS, lt.aabning() === D.AABEN_MAKS);
    paastand("en tunet lighter giver store bobler, og en del slipper forbi", K.fang(lt.flow()) < 0.7 && K.fang(24) === 1);
    var m0 = lt.masse(), ud = lt.slip(100);
    paastand("100 mL gas ud: lighteren bliver 0,242 g lettere", Math.abs(m0 - lt.masse() - K.gram(100)) < 1e-9 && Math.abs(ud - 100) < 1e-9);

    overskrift("4. Formler og tal");
    var formler = [
        ["dm", "m(før) − m(efter)", true], ["dm", "mfør-mefter", true], ["dm", "m1 - m2", true], ["dm", "m(gas) = m(før) - m(efter)", true],
        ["dm", "m(efter) - m(før)", "Omvendt"], ["dm", "m(før) + m(efter)", "tabte masse"],
        ["n", "V/Vm", true], ["n", "n = V / Vₘ", true], ["n", "V_m", false], ["n", "n(gas) = p*V/(R*T)", true], ["n", "pV/(RT)", true],
        ["n", "V/(1000*Vm)", "V er i mL"], ["n", "V/24", "Skriv molvolumenet som Vₘ"], ["n", "V*Vm", "ikke ganget"], ["n", "Vm/V", "vendt om"],
        ["n", "m(gas)/M(gas)", "kender du ikke endnu"], ["n", "0,150/24", "symboler først"],
        ["M", "m/n", true], ["M", "M = m(gas)/n(gas)", true], ["M", "(m(før)-m(efter))/n", true], ["M", "m(gas)*n(gas)", "ikke ganget"],
        ["M", "n/m", "vendt om"], ["M", "m(før)/n(gas)", "hele lighteren"]
    ];
    var skaeve = [];
    formler.forEach(function (f) {
        var s = T.formel(f[0], f[1]);
        var ok = f[2] === true ? s.ok : (f[2] === false ? !s.ok : (!s.ok && s.besked && s.besked.indexOf(f[2]) >= 0) || (s.ok && s.note && s.note.indexOf(f[2]) >= 0));
        if (!ok) skaeve.push(f[0] + " " + f[1] + " → " + (s.ok ? "ok" : s.besked));
    });
    paastand(formler.length + " formler og typiske fejl genkendes", skaeve.length === 0, skaeve.join("; "));
    var o = { tal: { mf: 17.84, V: 150, me: 17.48 } };
    o.facit = K.facit(o.tal);
    var tal = [
        ["dm", "0,36", true], ["dm", "-0,36", "Omvendt"], ["dm", "17,84", "m(før)"],
        ["n", "0,00625", true], ["n", "6,25·10^-3", true], ["n", "6,25e-3", true], ["n", "6,25 · 10⁻³ mol", true],
        ["n", "6,25", "liter"], ["n", "0,00670", "22,4"], ["n", "3,6", "ganget"],
        ["M", "57,6", true], ["M", "57,6 g/mol", true], ["M", "0,00225", "ganget"], ["M", "0,0174", "vendt om"], ["M", "2854", "hele beholderen"], ["M", "0,0576", "liter"]
    ];
    skaeve = [];
    tal.forEach(function (t) {
        var s = T.trin(t[0], t[1], o);
        var ok = t[2] === true ? s.ok : (!s.ok && s.besked && s.besked.indexOf(t[2]) >= 0);
        if (!ok) skaeve.push(t[0] + " " + t[1] + " → " + (s.ok ? "ok" : s.besked));
    });
    paastand(tal.length + " tal og typiske fejl genkendes", skaeve.length === 0, skaeve.join("; "));
    var regn = D.TRIN_ID.map(function (id) { var r = T.regning(id, o); return r[0] + " " + r[1]; });
    paastand("de pæne beregninger", regn[0] === "m(gas) = m(før) − m(efter) = 17,84 g − 17,48 g = 0,36 g" &&
        regn[1] === "n(gas) = V / Vₘ = 0,150 L / 24,0 L/mol = 6,25 · 10⁻³ mol" &&
        regn[2] === "M(gas) = m(gas) / n(gas) = 0,36 g / 6,25 · 10⁻³ mol = 57,6 g/mol", regn.join(" | "));

    overskrift("5. Fane 1 med musen");
    W.NK.visFane("fane-forsoeg");
    A.vaelg(0, false);
    A.forfra();
    function mus(type, sx, sy) {
        var r = A.L.canvas.getBoundingClientRect(), l = A.lay;
        A.L.canvas.dispatchEvent(new W.PointerEvent(type, { clientX: r.left + l.ox + sx * l.k, clientY: r.top + l.oy + sy * l.k, bubbles: true, pointerId: 1, button: 0, isPrimary: true }));
    }
    function veje(pts) {
        mus("pointerdown", pts[0][0], pts[0][1]);
        for (var i = 1; i < pts.length; i++) {
            var a = pts[i - 1], b = pts[i];
            for (var j = 1; j <= 5; j++) { mus("pointermove", a[0] + (b[0] - a[0]) * j / 5, a[1] + (b[1] - a[1]) * j / 5); tik(A, 0.02); }
        }
        var z = pts[pts.length - 1];
        mus("pointerup", z[0], z[1]);
        tik(A, 0.4);
    }
    function midt() { var b = A.lighterBund(); return [b.x, b.yb - 55]; }
    function ventUd() { var n = 0; while (A.laerer.optaget() && n++ < 40) tik(A, 0.5); return !A.laerer.optaget(); }
    tik(A, 0.2);
    paastand("første skridt: lighteren på vægten", A.fase() === "foer" && /vægten/.test(A.beskedTekst()), A.beskedTekst());
    paastand("målingens tre felter er åbne fra start", ["f0", "v0", "e0"].every(function (id) { return !d.getElementById("forsoeg-" + id).disabled; }) &&
        d.getElementById("forsoeg-f1").disabled);
    felt("forsoeg-v0", "100");
    paastand("V før m(før) giver en forklaring", A.noteret.V === null && /Vej lighteren først/.test(A.beskedTekst()), A.beskedTekst());
    felt("forsoeg-f0", "17,00");
    paastand("m(før), før lighteren står på vægten, afvises", A.noteret.mf === null && /på vægten først/.test(A.beskedTekst()));
    d.getElementById("forsoeg-aflaes").click();
    paastand("Aflæs vægten uden lighter på vægten giver en forklaring", A.noteret.mf === null && /på vægten først/.test(A.beskedTekst()));
    veje([midt(), [130, 430]]);
    paastand("lighteren kan trækkes op på vægten", A.sted === "vaegt");
    paastand("nu banker knappen Aflæs vægten", d.getElementById("forsoeg-aflaes").classList.contains("banker") && /Aflæs vægten/.test(A.beskedTekst()), A.beskedTekst());
    felt("forsoeg-f0", "12,34");
    paastand("et forkert tal afvises", A.noteret.mf === null);
    ["f0", "v0", "e0"].forEach(function (id) { d.getElementById("forsoeg-" + id).value = ""; });
    A.visIndsend();
    var ind1 = d.getElementById("forsoeg-indsend");
    paastand("Indsend svar er gråt, når intet felt har et tal", !ind1.hidden && ind1.classList.contains("ikke-klar"));
    indsend();
    paastand("Indsend svar uden tal sender intet, og kortet blinker", A.noteret.mf === null && A.el.kort.classList.contains("blink"));
    d.getElementById("forsoeg-aflaes").click();
    tik(A, 0.1);
    paastand("Aflæs vægten skriver kun tallet i feltet; det er ikke sendt endnu", A.noteret.mf === null && d.getElementById("forsoeg-f0").value === NK.tal2(A.lt.m0) &&
        ind1.classList.contains("klar") && /Indsend svar/.test(A.beskedTekst()), A.beskedTekst());
    indsend();
    tik(A, 0.1);
    paastand("Indsend svar sender m(før)", A.noteret.mf === A.lt.m0 && d.getElementById("forsoeg-f0").value === NK.tal2(A.lt.m0));
    paastand("m(før) noteres, og næste skridt er vandet", A.noteret.mf === A.lt.m0 && A.fase() === "saenk" && /vandet/.test(A.beskedTekst()), A.beskedTekst());
    veje([midt(), [640, 420]]);
    paastand("lighteren kan trækkes ned under måleglasset", A.sted === "vand");
    var p = midt();
    mus("pointerdown", p[0], p[1]);
    tik(A, 2);
    paastand("et tryk på lighteren under vand lukker gas ud i glasset", A.gasPaa && Math.abs(A.glas.V - 48) < 1.5, A.glas.V);
    felt("forsoeg-v0", "48");
    paastand("V kan ikke skrives, mens gassen bobler", A.noteret.V === null && /Slip/.test(A.beskedTekst()));
    tik(A, 4.25);
    mus("pointerup", p[0], p[1]);
    tik(A, 0.2);
    var V = A.glas.V;
    paastand("slippet: ca. 150 mL i glasset", !A.gasPaa && Math.abs(V - 150) < 2, V);
    felt("forsoeg-v0", String(Math.round(250 - V)));
    paastand("aflæst fra den forkerte ende: forklaring", A.noteret.V === null && /på hovedet/.test(A.beskedTekst()), A.beskedTekst());
    felt("forsoeg-v0", String(Math.round(V) + 1));
    paastand("V inden for en streg godkendes", A.noteret.V === Math.round(V) + 1);
    tik(A, 0.1);
    paastand("så kommer gættet med tre svar på kortet", A.fase() === "gaet" && d.querySelectorAll("#forsoeg-kort #forsoeg-valg button").length === 3);
    paastand("under gættet er Indsend svar væk (et gæt virker med det samme)", d.getElementById("forsoeg-indsend").hidden);
    felt("forsoeg-e0", "1");
    paastand("m(efter) kan ikke skrives før gættet", A.noteret.me === null);
    A.el.kort.classList.remove("blink");
    var pg = midt();
    mus("pointerdown", pg[0], pg[1]);
    mus("pointerup", pg[0], pg[1]);
    paastand("under gættet er forsøget låst, og kortet blinker ved et klik", !A.haand && !A.gasPaa && A.el.kort.classList.contains("blink"));
    d.querySelectorAll("#forsoeg-valg button")[0].click();
    tik(A, 0.1);
    paastand("gættet noteres, og næste skridt er at tørre og veje", A.valgt === 0 && A.fase() === "op");
    veje([midt(), [midt()[0], midt()[1] - 30], [130, 430]]);
    paastand("op af vandet er lighteren våd", A.lt.vaad() && A.fase() === "toer");
    d.getElementById("forsoeg-aflaes").click();
    indsend();
    paastand("den våde vejning afvises med en forklaring, også med knappen", A.noteret.me === null && /vejer med/.test(A.beskedTekst()), A.beskedTekst());
    veje([midt(), [400, 520]]);
    tik(A, 1.2);
    paastand("papiret tørrer lighteren", A.sted === "papir" && !A.lt.vaad());
    veje([midt(), [130, 430]]);
    d.getElementById("forsoeg-aflaes").click();
    indsend();
    tik(A, 0.1);
    var mA = NK.maalinger[0];
    paastand("måling 1 er færdig og gemt", A.faerdig && mA && mA.mf === A.noteret.mf && mA.me === A.lt.visning());
    paastand("målingen giver butan", K.facit(mA).alkan === D.LIGHTERGAS, K.Mv(K.facit(mA).M));
    paastand("gættet (0,04 g) får sin forklaring", /Gas er let/.test(A.beskedTekst()), A.beskedTekst());
    paastand("fane 2 bruger den nye måling", B.opg.tal.egen && B.opg.tal.mf === mA.mf, JSON.stringify(B.opg.tal));
    paastand("knappen Aflæs vægten kan ikke bruges, når målingen er færdig", d.getElementById("forsoeg-aflaes").disabled);

    /* Maaling 2 i en anden raekkefoelge: m(efter) foer V, og klik paa vaegten */
    A.vaelg(1, false);
    tik(A, 0.2);
    veje([midt(), [130, 430]]);
    var gv = A.lay, rv = A.L.canvas.getBoundingClientRect();
    A.L.canvas.dispatchEvent(new W.PointerEvent("pointerdown", { clientX: rv.left + gv.ox + 130 * gv.k, clientY: rv.top + gv.oy + 560 * gv.k, bubbles: true, pointerId: 1, button: 0 }));
    A.L.canvas.dispatchEvent(new W.PointerEvent("pointerup", { clientX: rv.left + gv.ox + 130 * gv.k, clientY: rv.top + gv.oy + 560 * gv.k, bubbles: true, pointerId: 1, button: 0 }));
    tik(A, 0.1);
    paastand("et klik på vægten virker som Aflæs vægten (skriver tallet)", A.noteret.mf === null && d.getElementById("forsoeg-f1").value === NK.tal2(A.lt.m0));
    enter(d.getElementById("forsoeg-f1"));
    paastand("Enter i feltet er Indsend svar", A.noteret.mf === A.lt.m0);
    veje([midt(), [640, 420]]);
    p = midt();
    mus("pointerdown", p[0], p[1]);
    tik(A, 5);
    mus("pointerup", p[0], p[1]);
    tik(A, 0.2);
    veje([midt(), [midt()[0], midt()[1] - 30], [400, 520]]);
    tik(A, 1.2);
    veje([midt(), [130, 430]]);
    d.getElementById("forsoeg-aflaes").click();
    indsend();
    tik(A, 0.1);
    paastand("m(efter) kan skrives, før V står der", A.noteret.me !== null && A.noteret.V === null && !A.faerdig && A.fase() === "aflaes");
    felt("forsoeg-v1", String(Math.round(A.glas.V)));
    tik(A, 0.1);
    paastand("V til sidst gør målingen færdig", A.faerdig && NK.maalinger[1] && NK.maalinger[1].V === Math.round(A.glas.V) &&
        K.facit(NK.maalinger[1]).alkan === D.LIGHTERGAS, JSON.stringify(NK.maalinger[1]));

    overskrift("6. Påskeæggene");
    function tuning() {
        var g = A.lighterGeo();
        var hx = (g.haette.x0 + g.haette.x1) / 2, hy = (g.haette.y0 + g.haette.y1) / 2;
        veje([[hx, hy], [hx, hy - 8]]);
        var sidderFast = A.lt.haette;
