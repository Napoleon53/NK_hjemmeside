<svg xmlns="http://www.w3.org/2000/svg" width="64" height="180" viewBox="0 0 64 180">
  <!-- Engangslighter set forfra, UDEN haette, pind og gasknap (dem tegner
       animationen, saa de kan bevaege sig).
       Tanken er gennemsigtig plast: indersiden er x 9-55, y 56-174, og
       vaesken (flydende butan og evt. vand) tegnes BAG filen.
       Dysen: toppen (24, 20). Justeringsringen: midte (24, 41).
       Hjulet: midte (46, 30), radius 9. Gasknappen: x 36-60, y 40-47.
       Haetten daekker x 10-38, y 14-48. Bunden staar paa y 178. -->
  <defs>
    <linearGradient id="plast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a7a" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#e2493b" stop-opacity="0.22"/>
      <stop offset="0.8" stop-color="#c8392d" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8e2219" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="krave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505a"/>
      <stop offset="1" stop-color="#23262c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c96a1"/>
      <stop offset="0.35" stop-color="#f1f4f7"/>
      <stop offset="0.7" stop-color="#b9c2cc"/>
      <stop offset="1" stop-color="#6d7782"/>
    </linearGradient>
    <radialGradient id="hjul" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e9edf1"/>
      <stop offset="1" stop-color="#737d88"/>
    </radialGradient>
  </defs>

  <!-- Skygge paa bordet -->
  <ellipse cx="32" cy="178" rx="27" ry="2.4" fill="#000000" fill-opacity="0.35"/>

  <!-- Roeret fra ventilen ned i vaesken og roeret med flintens fjeder (ses gennem plasten) -->
  <rect x="22.6" y="54" width="2.8" height="62" rx="1.2" fill="#2d3138" fill-opacity="0.55"/>
  <rect x="44" y="54" width="4" height="72" rx="1.6" fill="#3a3f47" fill-opacity="0.6"/>
  <path d="M44.6 60 h2.8 M44.6 66 h2.8 M44.6 72 h2.8 M44.6 78 h2.8 M44.6 84 h2.8 M44.6 90 h2.8 M44.6 96 h2.8 M44.6 102 h2.8 M44.6 108 h2.8 M44.6 114 h2.8 M44.6 120 h2.8"
        stroke="#9aa3ad" stroke-opacity="0.6" stroke-width="0.9"/>

  <!-- Tanken -->
  <path d="M6 52 L58 52 L58 166 Q58 178 46 178 L18 178 Q6 178 6 166 Z" fill="url(#plast)"/>
  <path d="M6 52 L58 52 L58 166 Q58 178 46 178 L18 178 Q6 178 6 166 Z" fill="none" stroke="#9e2c24" stroke-opacity="0.9" stroke-width="1.4"/>
  <rect x="10.5" y="58" width="3.4" height="108" rx="1.7" fill="#ffffff" fill-opacity="0.38"/>
  <rect x="51" y="62" width="2" height="96" rx="1" fill="#ffffff" fill-opacity="0.16"/>
  <!-- Bunden er tykkere plast -->
  <path d="M8 170 Q10 176 18 176 L46 176 Q54 176 56 170" fill="none" stroke="#7a1b14" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Kraven, hvor mekanikken sidder -->
  <rect x="4" y="44" width="56" height="11" rx="2.5" fill="url(#krave)" stroke="#15171b" stroke-width="1"/>
  <rect x="6" y="45.2" width="52" height="1.4" rx="0.7" fill="#ffffff" fill-opacity="0.18"/>

  <!-- Justeringsringen med taender om dysen -->
  <rect x="14" y="37" width="20" height="8" rx="2" fill="#343942" stroke="#15171b" stroke-width="0.8"/>
  <path d="M16.5 38 v6 M19 38 v6 M21.5 38 v6 M24 38 v6 M26.5 38 v6 M29 38 v6 M31.5 38 v6" stroke="#8a939d" stroke-width="0.8"/>

  <!-- Dysen -->
  <rect x="21" y="20" width="6" height="18" rx="1" fill="url(#metal)" stroke="#59626c" stroke-width="0.7"/>
  <rect x="20" y="19" width="8" height="3" rx="1" fill="url(#metal)" stroke="#59626c" stroke-width="0.7"/>
  <circle cx="24" cy="20" r="1" fill="#1d2127"/>

  <!-- Hjulets beslag og hjulet -->
  <path d="M37 44 L39 27 L42 27 L41 44 Z M55 44 L53 27 L50 27 L51 44 Z" fill="url(#metal)" stroke="#59626c" stroke-width="0.6"/>
  <circle cx="46" cy="30" r="9" fill="url(#hjul)" stroke="#4d5660" stroke-width="1"/>
  <g stroke="#4d5660" stroke-width="0.8" stroke-opacity="0.8">
    <path d="M46 21.5 v17 M40 24 l12 12 M37.5 30 h17 M40 36 l12 -12"/>
  </g>
  <circle cx="46" cy="30" r="3.2" fill="#9aa4ae" stroke="#4d5660" stroke-width="0.8"/>
</svg>
