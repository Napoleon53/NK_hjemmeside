<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480">
  <!-- Roeret med de tre haner og skiltene over dem. Tegnes med oeverste
       venstre hjoerne i (120, 60) paa scenen. Hanerne sidder i x = 170,
       280 og 390 (scenens 290, 400 og 510), hanegrebet midt paa ventilen
       i y = 136 (scenens 196), og tuden slutter i y = 186 (scenens 246).
       Navnene paa skiltene og grebene tegnes i vand_tegning.js. -->
  <defs>
    <linearGradient id="lodret" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8690"/>
      <stop offset="0.45" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#646a73"/>
    </linearGradient>
    <linearGradient id="vandret" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8690"/>
      <stop offset="0.4" stop-color="#e3e7ec"/>
      <stop offset="1" stop-color="#5a6069"/>
    </linearGradient>
    <linearGradient id="ventil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d949e"/>
      <stop offset="0.4" stop-color="#eef1f4"/>
      <stop offset="1" stop-color="#6b727b"/>
    </linearGradient>
    <linearGradient id="fod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5462"/>
      <stop offset="1" stop-color="#262b33"/>
    </linearGradient>
    <linearGradient id="skilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f2e3"/>
      <stop offset="1" stop-color="#e6dfca"/>
    </linearGradient>

    <g id="hane">
      <rect x="-11" y="79" width="22" height="22" rx="3" fill="url(#ventil)" stroke="#4d535c" stroke-width="1"/>
      <rect x="-5" y="100" width="10" height="21" fill="url(#lodret)"/>
      <rect x="-16" y="120" width="32" height="32" rx="6" fill="url(#ventil)" stroke="#4d535c" stroke-width="1"/>
      <path d="M-7 151 H7 L5 178 H-5 Z" fill="url(#lodret)" stroke="#4d535c" stroke-width="1" stroke-linejoin="round"/>
      <rect x="-6" y="177" width="12" height="9" rx="2" fill="url(#ventil)" stroke="#4d535c" stroke-width="1"/>
      <rect x="-4" y="184" width="8" height="2" fill="#1b1e24"/>
    </g>

    <g id="skiltet">
      <rect x="-44" y="26" width="88" height="44" rx="5" fill="url(#skilt)" stroke="#8a8f98" stroke-width="1.4"/>
      <circle cx="-38" cy="32" r="1.8" fill="#8a8f98"/>
      <circle cx="38" cy="32" r="1.8" fill="#8a8f98"/>
      <circle cx="-38" cy="64" r="1.8" fill="#8a8f98"/>
      <circle cx="38" cy="64" r="1.8" fill="#8a8f98"/>
    </g>
  </defs>

  <!-- Skiltene sidder paa vaeggen over roeret -->
  <use href="#skiltet" x="170"/>
  <use href="#skiltet" x="280"/>
  <use href="#skiltet" x="390"/>

  <!-- Stigeroeret fra bordet og det vandrette roer -->
  <rect x="20" y="470" width="34" height="10" rx="3" fill="url(#fod)" stroke="#181b21" stroke-width="1"/>
  <rect x="30" y="100" width="14" height="372" fill="url(#lodret)"/>
  <path d="M30 104 Q30 83 51 83 H60 V97 H51 Q44 97 44 104 Z" fill="url(#vandret)"/>
  <rect x="58" y="83" width="398" height="14" fill="url(#vandret)"/>
  <rect x="454" y="80" width="10" height="20" rx="3" fill="url(#ventil)" stroke="#4d535c" stroke-width="1"/>

  <!-- De tre haner -->
  <use href="#hane" x="170"/>
  <use href="#hane" x="280"/>
  <use href="#hane" x="390"/>
</svg>
