<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc3.3 Polære molekyler</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.36; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1400px; height:860px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at grænserne for upolær, polær og ionbinding
   giver de rigtige svar for alle par på fane 1, og at et metal kun kan
   sættes sammen med N, O, F og Cl; at elektronparret glider mod det
   atom, der trækker hårdest; at molekylerne på fane 2 har lærebogens
   polaritet; at vandstrålen bøjer mest for vand, mindre for ethanol og
   ikke for heptan; at alle opgaver kan løses; at der ingen
   præsentation er; og at teksterne overholder sitets regler.

   Chrome kigger kun ind i en iframe på file://, hvis den startes med
   --allow-file-access-from-files. Ellers: brug en lokal server eller
   Firefox.
   ===================================================================== */
var linjer = [], fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1500); });

function koer() {
    try { koerTest(); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    skriv("\n" + (antal - fejl) + " af " + antal + " påstande holder.", fejl ? "fejl" : "ok");
    skriv(fejl ? fejl + " FEJL" : "ALT OK (" + antal + " påstande)", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var W = ramme.contentWindow;
    var NK = W.NK;

    overskrift("1. Indlæsning");
    paastand("NK og de tre faner findes", !!(NK && NK.sims && NK.sims["fane-en"] && NK.sims["fane-polaritet"] && NK.sims["fane-vand"]) && d.querySelectorAll(".faneknap").length === 3);
    if (!NK || !NK.sims) return;
    var D = NK.Data;
    var mangler = Object.keys(NK.Sprites.FILER).filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + Object.keys(NK.Sprites.FILER).length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    paastand("ingen præsentation: hverken Kemichael, tilbud eller Spring over",
        !NK.Kemichael && !NK.laerer && !d.getElementById("tilbud") && !d.getElementById("spring-over") && !d.getElementById("laerer-lag"));
    paastand("?-knappen til rundvisningen er der stadig", !!d.getElementById("hjaelpknap"));

    overskrift("2. Bindingerne på fane 1");
    paastand("C-N er præcis 0,5 og polær, C-H 0,4 og upolær", D.dEN("C", "N") === 0.5 && D.bindingstype("C", "N") === "polaer" && D.dEN("C", "H") === 0.4 && D.bindingstype("C", "H") === "upolaer");
    paastand("Li-Cl er præcis 2,0 og en ionbinding, H-F 1,9 og polær", D.dEN("Li", "Cl") === 2 && D.bindingstype("Li", "Cl") === "ion" && D.bindingstype("H", "F") === "polaer");
    paastand("Na og H, Na og C og Na og K kan ikke sættes sammen", typeof D.tilladt("Na", "H") === "string" && typeof D.tilladt("C", "Na") === "string" && typeof D.tilladt("Na", "K") === "string");
    var par = D.par();
    var metalFejl = par.filter(function (p) {
        var metal = !!(D.GRUNDSTOFFER[p[0]].metal || D.GRUNDSTOFFER[p[1]].metal);
        return metal !== (D.bindingstype(p[0], p[1]) === "ion");
    });
    paastand("alle " + par.length + " par: ionbinding netop når et metal er med", metalFejl.length === 0, metalFejl.map(function (p) { return p.join("-"); }).join(", "));
    var typer = {};
    par.forEach(function (p) { var t = D.bindingstype(p[0], p[1]); typer[t] = (typer[t] || 0) + 1; });
    skriv("        upolære " + typers(typer, "upolaer") + ", polære " + typers(typer, "polaer") + ", ionbindinger " + typers(typer, "ion"), "note");
    function typers(t, k) { return t[k] || 0; }
    paastand("der er par af alle tre slags", typer.upolaer >= 2 && typer.polaer >= 5 && typer.ion >= 5);

    var en = NK.sims["fane-en"], EO = en.opgaver;
    NK.visFane("fane-en");
    function koer1(n) { for (var i = 0; i < (n || 120); i++) en.opdater(1 / 60); en.tegn(); }
    function parTil(a, b) { en.saetPar(a, b); koer1(); }
    function tavle() { return d.getElementById("en-tavle").textContent; }
    function besked1() { return d.getElementById("en-besked").textContent; }
    EO.visResultat();

    parTil("H", "Cl");
    var g = en.geo, px = en.parPlads(g);
    paastand("H−Cl: parret ligger tættest på Cl og er glidet mod det", en.vist.skift > 0.4 && Math.abs(px - g.x[1]) < Math.abs(px - g.x[0]));
    paastand("tavlen regner ΔEN = EN(Cl) − EN(H) = 3,0 − 2,1 = 0,9 og siger polær", /ΔEN = EN\(Cl\) − EN\(H\)/.test(tavle()) && /3,0 − 2,1 = 0,9/.test(tavle()) && /Bindingen erpolær/.test(tavle()), tavle());
    parTil("Cl", "Cl");
    paastand("Cl−Cl: parret ligger i midten, og bindingen er upolær", Math.abs(en.vist.skift) < 0.01 && /upolær/.test(tavle()));
    parTil("F", "Na");
    paastand("F−Na: F tager parret helt, og atomerne skilles som ioner", en.vist.skift < -0.98 && en.vist.adskil > 0.98 && /ionbinding/.test(tavle()));
    parTil("H", "F");
    var hf = en.vist.skift;
    parTil("H", "N");
    paastand("parret glider længere i H−F end i H−N", hf > en.vist.skift && en.vist.skift > 0);

    en.slot = 0;
    parTil("H", "Cl");
    en.vaelg("O");
    paastand("i den fri leg skifter et klik i tabellen atomet med ringen ud, og ringen hopper", en.par[0] === "O" && en.par[1] === "Cl" && en.slot === 1);
    en.saetPar("H", "Cl");
    en.slot = 0;
    en.opdaterTabel();
    var naFelt = d.querySelector('.pt-felt[data-el="Na"]');
    var foer = naFelt.classList.contains("spaerret");
    en.slot = 1;
    en.opdaterTabel();
    paastand("metallerne er dæmpet, når ringen står over for H, men kan stadig klikkes",
        !foer && naFelt.classList.contains("spaerret") && !naFelt.disabled && !d.querySelector('.pt-felt[data-el="O"]').classList.contains("spaerret"));
    naFelt.click();
    paastand("natrium kan ikke sættes på hydrogen, og kortet siger hvorfor", en.par[0] === "H" && en.par[1] === "Cl" && en.slot === 1 && /Natrium og hydrogen/.test(besked1()), besked1());
    en.slot = 0;
    en.opdaterTabel();
    d.querySelector(".pt-felt.tom").click();
    paastand("et tomt felt svarer på klik", /er ikke med her/.test(besked1()));
    paastand("tabellen har 9 atomer, 13 tomme felter og hul i første periode", d.querySelectorAll(".pt-felt[data-el]").length === 9 && d.querySelectorAll(".pt-felt.tom").length === 13 && d.querySelectorAll(".pt-hul").length === 6);
    paastand("fane 1 har intet panel: tabellen og tavlen står i scenen", !d.querySelector("#fane-en .panel") && !!d.getElementById("en-pt").closest(".scene") && !!d.getElementById("en-tavle").closest(".scene"));

    overskrift("3. Molekylerne på fane 2");
    var POLAER = { H2O: true, NH3: true, CH4: false, CO2: false, HCN: true, CH2O: true, C2H4: false, C2H2: false, CCl4: false, CH3Cl: true, HCl: true };
    var polFejl = D.MOLEKYLER.filter(function (m) { return m.polaer !== POLAER[m.id]; }).map(function (m) { return m.id; });
    paastand("alle " + D.MOLEKYLER.length + " molekyler har lærebogens polaritet", polFejl.length === 0 && D.MOLEKYLER.length === 11, polFejl.join(", "));
    var oktetFejl = D.MOLEKYLER.filter(function (mol) {
        return !mol.atomer.every(function (a, i) {
            var sum = mol.naboer[i].reduce(function (s, n) { return s + n.orden; }, 0);
            return 2 * sum + 2 * mol.frieAntal[i] === (a.el === "H" ? 2 : 8);
        });
    }).map(function (m) { return m.id; });
    paastand("alle molekyler opfylder oktetreglen", oktetFejl.length === 0, oktetFejl.join(", "));

    overskrift("4. Opgaverne kan løses (Indsend svar)");
    /* Et svar eller et atom vaelges kun; Indsend svar sender det ind */
    function loestOpgave(sim, o, loes) {
        sim.opgaver.startOpgave(o);
        loes(o);
        sim.opgaver.indsendKlik();
        sim.opdater(1 / 60);
        return o.afsluttet && o.maade === "selv" && sim.opgaver.tilstand() === "loest";
    }

    NK.visFane("fane-en");
    var pt = d.getElementById("en-pt"), tv = d.getElementById("en-tavle");
    EO.status = {};
    EO.aabn(0, true);
    en.opdater(1 / 60);
    var rk = d.querySelectorAll("#en-liste .or-knap");
    paastand("rækken har 6 opgaver, og kun den første har en titel", rk.length === 6 && /Hydrogenchlorid/.test(rk[0].textContent) && rk[1].classList.contains("laast") && !rk[2].querySelector(".or-navn").textContent);
    paastand("opgave 1, trin 1: parret står i midten, og tabel, skala og tavle er stiplede pladser",
        en.maalSkift() === 0 && pt.classList.contains("plads") && tv.classList.contains("plads") && en.skjult("skala") && !en.skjult("delta"));
    paastand("under spørgsmålet er tabellen en låst figur, og ingen boble står fremme", pt.classList.contains("laast") && d.getElementById("en-boble").hidden);
    EO.vaelg(1); EO.indsendKlik(); en.opdater(1 / 60);
    paastand("efter svaret glider parret mod Cl, men skala, tavle og tabel venter", en.maalSkift() > 0 && en.skjult("tavle") && en.skjult("skala") && en.skjult("tabel"));
    EO.videre(); EO.vaelg(2); EO.indsendKlik(); EO.videre(); en.opdater(1 / 60);
    paastand("trin 3: tavlen spørger 'ΔEN = ?' med gul ramme og viser ikke 0,9", /ΔEN = \?/.test(tavle()) && !/0,9/.test(tavle()) && !!d.querySelector("#en-tavle .tv-linje.spm"), tavle());
    EO.vaelg(0); EO.indsendKlik(); en.opdater(1 / 60);
    paastand("efter trin 3 står regnestykket, men ikke bindingstypen", /3,0 − 2,1 = 0,9/.test(tavle()) && !/polær/.test(tavle()), tavle());

    EO.status = {};
    EO.aabn(0, true);
    var gennem = true, note1 = "";
    function nej1(t) { if (gennem) { gennem = false; note1 = t; } }
    en.OPGAVER.forEach(function (op, i) {
        if (EO.nr !== i) nej1("opgave " + (i + 1) + " åbnede ikke");
        op.trin.forEach(function (t, j) {
            var navn = (i + 1) + "." + (j + 1) + " ";
            if (EO.nr !== i || EO.trinNr !== j || EO.tilstand !== "trin") { nej1(navn + "ikke nået"); return; }
            en.opdater(1 / 60);
            if (t.type === "valg") {
                if (!pt.classList.contains("laast")) nej1(navn + "tabellen kan bruges under spørgsmålet");
                var f = -1;
                t.svar.forEach(function (sv, k) { if (!sv.ok && f < 0) f = k; });
                var parF = en.par.join();
                d.querySelector('#en-tabel [data-el="F"]').click();
                if (en.par.join() !== parF) nej1(navn + "et klik i tabellen ændrede atomerne under spørgsmålet");
                EO.vaelg(f);
                if (EO.tilstand !== "trin") nej1(navn + "et valg blev bedømt af sig selv");
                EO.indsendKlik();
                if (EO.tilstand !== "trin" || !/Ikke rigtigt/.test(besked1())) nej1(navn + "forkert svar uden forklaring");
                EO.vaelg(EO.rigtigNr(t)); EO.indsendKlik();
            } else if (t.type === "felt") {
                if (EO.kanSendes()) nej1(navn + "Indsend svar klar uden tal");
                EO.felt = NK.tal(-t.facit, 1); EO.indsendKlik();
                if (EO.tilstand !== "trin" || !/aldrig negativ/.test(besked1())) nej1(navn + "negativt ΔEN uden forklaring");
                EO.felt = "4,6"; EO.indsendKlik();
                if (EO.tilstand !== "trin") nej1(navn + "forkert tal godtaget");
                EO.felt = NK.tal(t.facit, 1).replace(",", "."); EO.indsendKlik();
            } else if (t.type === "handling") {
                var celle = d.querySelector('#en-tabel [data-el="' + t.el + '"]');
                if (EO.kanSendes()) nej1(navn + "Indsend svar klar før klikket");
                if (!celle.classList.contains("opfordring") || d.getElementById("en-boble").hidden || !/Klik: /.test(d.getElementById("en-boble").textContent)) nej1(navn + "ingen gul ramme og boble ved " + t.el);
                var anden = d.querySelector('#en-tabel [data-el="F"]'), parH = en.par.join();
                if (t.el !== "F") { anden.click(); if (en.par.join() !== parH) nej1(navn + "et andet felt kunne bruges"); }
                celle.click();
                if (EO.trinNr !== j) nej1(navn + "gik videre med det samme");
                for (var k = 0; k < 70; k++) en.opdater(1 / 60);
                if (EO.trinNr !== j + 1) nej1(navn + "gik ikke selv videre efter ca. 1 s");
                return;
            } else if (t.type === "byg") {
                if (EO.kanSendes()) nej1(navn + "Indsend svar klar før en ændring");
                var slot = en.slot, andet = en.par[1 - slot];
                var kand = D.EN_ORDEN.filter(function (e) { return D.tilladt(e, andet) === true && e !== en.par[slot]; });
                function med(e) { var q = en.par.slice(); q[slot] = e; return q; }
                var fe = kand.filter(function (e) { var q = med(e); return !t.ok(q[0], q[1]); })[0];
                en.vaelg(fe);
                if (EO.tilstand !== "trin") nej1(navn + "bedømt uden Indsend svar");
                EO.indsendKlik();
                if (EO.tilstand !== "trin" || !/Ikke rigtigt/.test(besked1())) nej1(navn + "forkert binding uden forklaring");
                if (en.slot !== slot) nej1(navn + "ringen flyttede sig fra det atom, kortet nævner");
                var re = kand.filter(function (e) { var q = med(e); return t.ok(q[0], q[1]); })[0];
                en.vaelg(re); EO.indsendKlik();
            }
            if (EO.tilstand !== "bliv") { nej1(navn + "blev ikke løst"); return; }
            if (!d.querySelector("#en-skort .sk-bund.bliv .sk-videre")) nej1(navn + "ingen knap videre på kortet");
            EO.videre();
        });
    });
    paastand("fane 1: alle seks opgaver kan løses trin for trin, og forkerte svar giver en forklaring", gennem, note1);
    paastand("fane 1: alle seks er gemt med stjerne, og den fri leg står fremme", EO.tilstand === "resultat" && en.OPGAVER.every(function (o) { return EO.status[o.id] === "stjerne"; }) && !pt.classList.contains("laast"));
    paastand("fane 1: kortet fører videre til Polær eller upolær?", /Videre til Polær eller upolær\?/.test(d.getElementById("en-skort").textContent));
    EO.aabn(0);
    en.opdater(1 / 60);
    paastand("en løst opgave har alt fremme fra start", !pt.classList.contains("plads") && !tv.classList.contains("plads") && en.maalSkift() > 0);
    EO.forfra();
    en.opdater(1 / 60);
    paastand("Start forfra giver trinene igen", EO.trinNr === 0 && tv.classList.contains("plads"));
    paastand("Start forfra står i rækken, ikke på kortet", !!d.getElementById("en-forfra").closest(".opgaverad") && !d.querySelector("#en-skort .nulstil"));
    EO.aabn(2, true);
    d.getElementById("en-frileg").click();
    paastand("fane 1, Fri leg: hele tabellen kan bruges, og kortet tilbyder Tilbage til opgaverne", EO.fri && EO.tabelAktiv() && /Tilbage til opgaverne/.test(d.getElementById("en-skort").textContent));
    d.querySelector("#en-skort [data-luk]").click();
    var enLukket = d.getElementById("en-skort").hidden;
    d.querySelector('.pt-felt.tom').click();
    paastand("fane 1, fri leg: krydset lukker kortet, og en besked åbner det igen", enLukket && !d.getElementById("en-skort").hidden);
    d.querySelector("#en-skort [data-tilbage]").click();
    paastand("fane 1, Tilbage til opgaverne: samme opgave igen", !EO.fri && EO.nr === 2 && EO.tilstand === "trin");

    var pol = NK.sims["fane-polaritet"];
    NK.visFane("fane-polaritet");
    pol.OPGAVER.forEach(function (lav, i) {
        var alleOk = true, note = "";
        for (var gang = 0; gang < 10; gang++) {
            var o = lav(pol);
            var mol = D.molekyle(o.mol);
            var ok = loestOpgave(pol, o, function (o) {
                if (o.valg) { pol.opgaver.vaelg(o.rigtig); return; }
                pol.opgaver.klik(mol.delta.indexOf(-1));
            });
            /* Kortet venter paa Naeste: menuen er laast, og molekylet staar */
            ok = ok && pol.menuLaast() && pol.molId() === o.mol;
            if (!ok) { alleOk = false; note = o.mol + ": " + o.tekst; break; }
        }
        paastand("polær eller upolær, opgavetype " + (i + 1) + " (10 tilfældige)", alleOk, note);
    });
    var PO = pol.opgaver, polFane = d.getElementById("fane-polaritet");
    PO.nulstil();
    pol.opdater(1 / 60);
    paastand("fane 2 begynder i opgave 1, og menuen og visningen er skjult (ikke låst)", PO.nr === 0 && !!PO.opgave && polFane.classList.contains("mission") && !d.getElementById("pol-menu").offsetWidth);
    var polMol = pol.molId(), polNr = PO.nr;
    d.getElementById("pol-frileg").click();
    paastand("Fri leg: menuen og visningen kommer frem og kan bruges", PO.fri && !polFane.classList.contains("mission") && !!d.getElementById("pol-menu").offsetWidth && !pol.menuLaast() && !d.querySelector("#pol-menu button:disabled, #pol-menu button.laast") && /Tilbage til opgaverne/.test(d.getElementById("pol-skort").textContent));
    d.querySelector("#pol-skort [data-luk]").click();
    paastand("fri leg: det røde kryds lukker kortet", d.getElementById("pol-skort").hidden);
    d.getElementById("pol-frileg").click();
    paastand("Tilbage til opgaverne: samme opgave og samme molekyle", !PO.fri && PO.nr === polNr && pol.molId() === polMol && polFane.classList.contains("mission"));
    for (var pn = 0; pn < 6; pn++) {
        var po = PO.opgave;
        if (!po.afsluttet) PO.visSvar();
        PO.videre();
    }
    paastand("efter sidste opgave: tillykke, fri leg og videre til Vandstrålen", PO.fri && PO.faerdig && /klaret alle 6 opgaver/.test(d.getElementById("pol-skort").textContent) && /Videre til Vandstrålen/.test(d.getElementById("pol-skort").textContent) && d.getElementById("pol-frileg").hidden);
    PO.nulstil();

    overskrift("5. Fane 3: vandstrålen");
    var vand = NK.sims["fane-vand"];
    NK.visFane("fane-vand");
    var GRAD16 = 16 * Math.PI / 180;
    var TV = NK.VandTegning;
    var naesteTekster = [];

    /* Straale af vaesken v, ladet stav med spidsen afst til hoejre for straalen. */
    function forsoeg(v, stav, afst, nulstil) {
        if (nulstil !== false) vand.nulstilForsoeg();
        vand.slip();
        vand.aabn(v);
        for (var n = 0; n < 50; n++) vand.opdater(1 / 60);
        naesteTekster.push(vand.naeste());
        var x0 = TV.hane(v).x;
        var tip = { x: x0 + afst, y: 340 };
        vand.grib(stav, tip.x + 0.8 * 200 * Math.cos(GRAD16), tip.y + 0.8 * 200 * Math.sin(GRAD16), 0.8);
        vand.stave[stav].vinkel = GRAD16;
        vand.stave[stav].ladning = 1;
        var sum = 0, tal = 0;
        for (n = 0; n < 100; n++) {
            vand.opdater(1 / 60);
            if (n === 20) naesteTekster.push(vand.naeste());
            if (n >= 60) vand.partikler.forEach(function (p) { if (p.vaeske === v && p.y > 420) { sum += p.x - x0; tal++; } });
        }
        naesteTekster.push(vand.naeste());
        var ud = { udsving: tal ? sum / tal : 0, ladning: vand.stave[stav].ladning, registreret: !!vand.resultater[v][stav],
                   spild: vand.sidsteBesked.spild !== undefined };
        vand.slip();
        return ud;
    }

    vand.nulstilForsoeg();
    vand.opdater(1 / 60);
    paastand("kortet øverst siger, at man skal klikke på en hane", /hane/.test(d.getElementById("vand-ind").textContent));

    var rv = forsoeg("vand", "plastik", 45), re = forsoeg("ethanol", "plastik", 45), rh = forsoeg("heptan", "plastik", 45), rg = forsoeg("vand", "glas", 45);
    skriv("        udsving ved vasken: vand " + rv.udsving.toFixed(1) + ", ethanol " + re.udsving.toFixed(1) + ", heptan " + rh.udsving.toFixed(1) + ", vand med glasstav " + rg.udsving.toFixed(1), "note");
    paastand("vandstrålen bøjer tydeligt mod staven", rv.udsving > 20 && rv.ladning > 0.5);
    paastand("ethanol bøjer mindre end vand, men mere end heptan", re.udsving > 5 && re.udsving < rv.udsving * 0.8);
    paastand("heptan løber næsten lige ned", Math.abs(rh.udsving) < 3);
    paastand("vandstrålen bøjer også mod den positive glasstav", rg.udsving > 20);
    paastand("et test registreres efter lidt over et sekund", rv.registreret && re.registreret && rh.registreret && rg.registreret);
    paastand("den bøjede stråle lander stadig i vasken", !rv.spild && !re.spild && !rg.spild);

    var rr = forsoeg("vand", "plastik", 2);
    paastand("rører staven strålen, mister den ladningen", rr.ladning === 0);

    vand.nulstilForsoeg();
    vand.grib("plastik", 700, 590, 0.7);
    for (var gn = 0; gn < 40; gn++) { vand.flytStav(gn % 2 ? 900 : 960, 598); vand.opdater(1 / 60); }
    paastand("staven bliver ladet, når den gnides på kluden (" + vand.stave.plastik.ladning.toFixed(2) + ")", vand.stave.plastik.ladning > 0.5);
    vand.slip();

    vand.nulstilForsoeg();
    vand.skiftHane("vand");
    for (gn = 0; gn < 60 * 20; gn++) vand.opdater(1 / 60);
    var loeber = vand.aaben === "vand" && vand.partikler.length > 30;
    vand.skiftHane("ethanol");
    for (gn = 0; gn < 60; gn++) vand.opdater(1 / 60);
    var skiftet = vand.aaben === "ethanol" && vand.partikler.some(function (p) { return p.vaeske === "ethanol" && p.x0 === TV.hane("ethanol").x; });
    paastand("en hane løber, til den lukkes, og en ny hane lukker den gamle", loeber && skiftet);
    vand.skiftHane("ethanol");
    for (gn = 0; gn < 90; gn++) vand.opdater(1 / 60);
    paastand("et klik mere lukker hanen, og strålen er væk efter halvandet sekund", vand.aaben === null && vand.partikler.length === 0);

    vand.nulstilForsoeg();
    vand.opdater(1 / 60);
    paastand("opgaven er låst, før skemaet er udfyldt", d.getElementById("vand-indsend").hidden);
    [["vand", "plastik"], ["vand", "glas"], ["ethanol", "plastik"], ["ethanol", "glas"], ["heptan", "plastik"]].forEach(function (k) {
        forsoeg(k[0], k[1], 45, false);
    });
    vand.opdater(1 / 60);
    var skema = d.getElementById("vand-skema");
    paastand("efter fem af seks felter mangler ét, og kortet peger på glasstaven",
        !vand.slut() && d.getElementById("vand-taeller").textContent === "5/6" &&
        skema.querySelectorAll("td.ikke").length === 1 && /glasstaven/.test(d.getElementById("vand-ind").textContent),
        d.getElementById("vand-ind").textContent);
    forsoeg("heptan", "glas", 45, false);
    paastand("skemaet er udfyldt, og tegneserien og opgaven er låst op",
        vand.slut() && d.getElementById("vand-taeller").textContent === "6/6" && !skema.querySelector("td.ikke") &&
        !d.getElementById("vand-serieknap").hidden && !d.getElementById("vand-indsend").hidden);
    NK.aabnSerie();
    var ruder = d.querySelectorAll("#serie-ruder .rude");
    var tabel = d.querySelector("#serie-ruder .resultater");
    paastand("tegneserien har " + ruder.length + " ruder og resultatskemaet i sidste rude",
        ruder.length >= 8 && tabel && ruder[ruder.length - 1].contains(tabel) && tabel.querySelectorAll("tr").length === 4);
    var serieTekst = d.getElementById("serie-ruder").innerText;
    d.getElementById("tegneserie").classList.remove("vis");

    vand.OPGAVER.forEach(function (lav, i) {
        var o = lav(vand);
        paastand("vandstrålen, opgave " + (i + 1) + ": " + o.tekst, loestOpgave(vand, o, function (o) { vand.opgaver.vaelg(o.rigtig); }));
    });

    overskrift("6. Tekster og skrift");
    var tekster = [d.body.innerText, serieTekst, d.getElementById("teori").textContent];
    D.MOLEKYLER.forEach(function (m) { tekster.push(m.navn, m.hintPol, m.svarPol); });
    [pol, vand].forEach(function (sim) {
        sim.OPGAVER.forEach(function (lav) {
            var o = lav(sim);
            tekster.push(o.tekst, o.hint || "", o.svar || "");
            (o.valg || []).forEach(function (v) { tekster.push(v); });
        });
    });
    en.OPGAVER.forEach(function (op) {
        tekster.push(op.navn);
        op.trin.forEach(function (t) {
            [t.tekst, t.spm, t.slut].forEach(function (x) { if (typeof x === "string") tekster.push(x); });
            (t.hint || []).forEach(function (x) { tekster.push(x); });
            (t.svar || []).forEach(function (sv) { tekster.push(sv.t, sv.nej || ""); });
            if (t.type === "felt") [-t.facit, 4.6, 99].forEach(function (v) { tekster.push(t.fejl(v)); });
            if (t.type === "byg") D.par().forEach(function (p) { if (!t.ok(p[0], p[1])) tekster.push(t.fejl(p[0], p[1])); else if (typeof t.slut === "function") tekster.push(t.slut({ par: p })); });
        });
    });
    D.EN_ORDEN.forEach(function (a) { D.EN_ORDEN.forEach(function (b) { var t = D.tilladt(a, b); if (t !== true) tekster.push(t); }); });
    naesteTekster.forEach(function (t) { tekster.push(t); });
    NK.Rundvisning.TUR.forEach(function (t) { tekster.push(t.titel, t.tekst); });
    var alt = tekster.join("\n");
    var streger = alt.match(/.{0,30}[–—].{0,30}/g);
    paastand("ingen tankestreger (– eller —)", !streger, streger && streger.slice(0, 3).join(" | "));
    var enPlus = alt.match(/.{0,20}(1\+|1−|1-)(?![0-9,]).{0,10}/g);
    paastand("ingen ladning skrevet som 1+ eller 1−", !enPlus, enPlus && enPlus.slice(0, 3).join(" | "));

    var smaa = [];
    ["fane-en", "fane-polaritet", "fane-vand"].forEach(function (fane) {
        NK.visFane(fane);
        Array.prototype.forEach.call(d.querySelectorAll("body *"), function (e) {
            if (!e.offsetWidth && !e.offsetHeight) return;
            var harTekst = Array.prototype.some.call(e.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
            if (!harTekst) return;
            var px = parseFloat(W.getComputedStyle(e).fontSize);
            if (px < 12) smaa.push((e.id || e.className || e.tagName) + " " + px + "px");
        });
    });
    NK.visFane("fane-en");
    paastand("ingen synlig tekst under 12 px", smaa.length === 0, smaa.slice(0, 6).join(", "));
    papirkortTest(d, W, NK, D);
}

/* Papirkortet (6. nov. 2026): kortet staar i scenen, Indsend svar sender ind,
   kortet bliver paa spoergsmaalet, og det holder sig i kortZone. */
function papirkortTest(d, W, NK, D) {
    overskrift("7. Papirkortet");
    var ramme = document.getElementById("ramme");
    var F = [["fane-en", "en"], ["fane-polaritet", "pol"], ["fane-vand", "vand"]];
    paastand("body har klassen papirkort", d.body.classList.contains("papirkort"));
    F.forEach(function (f) {
        var k = d.getElementById(f[1] + "-skort");
        paastand(f[1] + ": kortet står i scenen, ikke i panelet", !!k && !!k.closest(".scene") && !k.closest(".panel"));
        var ff = d.getElementById(f[1] + "-forfra");
        paastand(f[1] + ": Start forfra står i " + (f[1] === "en" ? "rækken" : "panelet") + ", ikke på kortet", !!ff && !!ff.closest(f[1] === "en" ? ".opgaverad" : ".panel") && !k.querySelector(".nulstil"));
        paastand(f[1] + ": ingen opgavetekst i panelet", !d.getElementById(f[1] + "-opg-tekst") && !d.querySelector("#" + f[0] + " .panel .opgave-spm"));
    });
    paastand("ingen statuslinje nederst i scenen", !d.querySelector(".scenebesked"));

    /* Et valgspoergsmaal paa fane 1 */
    NK.visFane("fane-en");
    var en = NK.sims["fane-en"], O = en.opgaver;
    O.aabn(0, true);
    var t1 = O.trin();
    var ind = d.getElementById("en-indsend");
    paastand("Indsend svar er grå uden valg", ind.classList.contains("ikke-klar") && !ind.hidden && ind.textContent === "Indsend svar");
    paastand("hintknappen står på kortet", !d.getElementById("en-hjknap").hidden && !!d.getElementById("en-hjknap").closest(".scenekort"));
    O.vaelg(0);
    paastand("et valgt svar bedømmes ikke af sig selv", O.tilstand === "trin" && ind.classList.contains("klar"));
    O.indsendKlik();
    paastand("forkert svar: forklaringen står på kortet", O.tilstand === "trin" && /Ikke rigtigt/.test(d.getElementById("en-besked").textContent));
    O.vaelg(1);
    O.indsendKlik();
    var kort = d.getElementById("en-skort");
    var groen = kort.querySelector('.sk-knap.rigtig[data-nr="1"]');
    var bliv = kort.querySelector(".sk-bund.bliv .sk-videre");
    paastand("rigtigt svar: kortet bliver på spørgsmålet med grønt svar og Næste", O.tilstand === "bliv" && !!groen && !!bliv && d.getElementById("en-status").hidden && kort.textContent.indexOf(t1.spm.slice(0, 15)) >= 0);
    paastand("etiketten er en indlejret overskrift", !!kort.querySelector(".sk-tekst .sk-chip"));
    bliv.click();
    paastand("Næste går videre til trin 2 uden rosen", O.trinNr === 1 && !kort.querySelector(".sk-bund.bliv"));

    /* Klik-opgaven paa fane 2: et klik vaelger kun atomet */
    NK.visFane("fane-polaritet");
    var pol = NK.sims["fane-polaritet"], ok = pol.OPGAVER[1](pol), mol = D.molekyle(ok.mol);
    pol.opgaver.startOpgave(ok);
    pol.opgaver.klik(mol.delta.indexOf(-1));
    paastand("pol: et klik på det rigtige atom bedømmes ikke af sig selv", !ok.afsluttet && !!pol.markeret());
    pol.opgaver.nulstil();

    /* Hoejden: alle opgavetyper med hint, forklaringer og det rigtige svar */
    var fejlH = [], sims = { en: en, pol: pol, vand: NK.sims["fane-vand"] };
    [[1400, 860], [1100, 700]].forEach(function (m) {
        ramme.style.width = m[0] + "px"; ramme.style.height = m[1] + "px";
        F.forEach(function (f) {
            var sim = sims[f[1]];
            NK.visFane(f[0]); sim.tilpas();
            var Q = sim.opgaver, k = d.getElementById(f[1] + "-skort"), zone = NK.kortZone();
            function maal(navn) { if (k.offsetHeight > zone) fejlH.push(m.join("x") + " " + f[1] + " " + navn + " " + k.offsetHeight + ">" + zone); }
            if (f[1] === "en") {
                /* Fane 1: hvert trin med alle hint, alle forkerte svar og forklaringen */
                en.OPGAVER.forEach(function (op, i) {
                    Q.aabn(i, true);
                    op.trin.forEach(function (t, j) {
                        Q.trinNr = j; Q.tilstand = "trin"; Q.nytTrin();
                        maal(i + "." + j + " trin");
                        (t.hint || []).forEach(function () { Q.hjaelpKlik(); maal(i + "." + j + " hint"); });
                        Q.hjaelp = 0;
                        (t.svar || []).forEach(function (sv) { if (sv.nej) { Q.fejl(sv.nej); maal(i + "." + j + " fejl"); } });
                        if (t.type === "felt") [-t.facit, 4.6, 99].forEach(function (v) { Q.fejl(t.fejl(v)); maal(i + "." + j + " fejl"); });
                        if (t.type === "byg") D.par().forEach(function (p) { if (!t.ok(p[0], p[1])) { Q.fejl(t.fejl(p[0], p[1])); maal("byg fejl"); } });
                        if (t.type !== "handling") { Q.tilstand = "bliv"; Q.visKort(); maal(i + "." + j + " løst"); }
                    });
                });
                Q.aabn(0, true);
                return;
            }
            Q.nulstil(); maal("start");
            sim.OPGAVER.forEach(function (lav, i) {
                for (var g = 0; g < 6; g++) {
                    var q = lav(sim);
                    Q.startOpgave(q); maal(i + " opgave");
                    if (q.hint) { Q.saetFast(q.hint, "hint", "Hint"); Q.vis(); maal(i + " hint"); }
                    var ft = [];
                    if (q.fejlValg) q.valg.forEach(function (v, j) { if (j !== q.rigtig) ft.push(q.fejlValg(j)); });
                    ft.forEach(function (t) { Q.fejl(t); maal(i + " fejl"); });
                    Q.loest(); maal(i + " løst");
                }
            });
            Q.nulstil();
        });
    });
    paastand("kortet holder sig i kortZone (1400x860 og 1100x700)", fejlH.length === 0, fejlH.slice(0, 5).join("; "));
    ramme.style.width = "1400px"; ramme.style.height = "860px";
    NK.visFane("fane-en"); en.tilpas();
}
