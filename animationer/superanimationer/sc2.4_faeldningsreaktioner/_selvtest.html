<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest, sc2.4 Fældningsreaktioner</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1400px; height:860px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og kontrollerer det, man ikke kan se
   paa et skaermbillede: at tabellen og opgaverne stemmer, at alle
   skemaer er afstemt, at svarmulighederne har praecis ét rigtigt svar,
   at skrivefelterne goer det rigtige med det, eleven taster, at de
   typiske fejl bliver genkendt, at alle tre niveauer kan gennemfoeres,
   at baegerglassene ender med det rigtige bundfald, og at sproget
   overholder reglerne. Skal koeres gennem en lokal server (Chrome
   maa ikke kigge ind i en iframe paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1200); });

function koer() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument, w = ramme.contentWindow, NK = w.NK;
    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) { vis(); return; }
    var D = NK.Data, F = NK.Formel;
    paastand("tre niveauer er bygget", !!(NK.niveauer && NK.niveauer.tabel && NK.niveauer.vaelg && NK.niveauer.skriv));
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i, j, o, par, fejlliste;

    overskrift("2. Fældningstabellen");
    paastand("alle " + D.OPLOESNINGER.length + " opløsninger er L i tabellen",
        D.OPLOESNINGER.every(function (s) { return D.opl(s.kat.id, s.an.id) === "L"; }));
    var xCeller = [];
    D.KAT_ORDEN.forEach(function (k) { D.AN_ORDEN.forEach(function (a) { if (D.opl(k, a) === "x") xCeller.push(k + "-" + a); }); });
    paastand("hvert ÷ har en forklaring, og hver forklaring et ÷ (" + xCeller.length + ")",
        xCeller.every(function (k) { return !!D.FINDES_IKKE[k]; }) && Object.keys(D.FINDES_IKKE).length === xCeller.length);
    paastand("nitrater og alle salte med Na⁺, K⁺ er L",
        D.KAT_ORDEN.every(function (k) { return D.opl(k, "NO3") === "L"; })
        && D.AN_ORDEN.every(function (a) { return D.opl("Na", a) === "L" && D.opl("K", a) === "L"; }));
    var kendte = { "Ag-Cl": "T", "Ba-SO4": "T", "Pb-I": "T", "Ca-CO3": "T", "Ba-OH": "L", "Mg-SO4": "L", "Cu-OH": "T", "Ca-SO4": "T", "Ag-SO4": "T" };
    paastand("stikprøver: AgCl, BaSO₄, PbI₂, CaCO₃ T, Ba(OH)₂ og MgSO₄ L",
        Object.keys(kendte).every(function (k) { var x = k.split("-"); return D.opl(x[0], x[1]) === kendte[k]; }));

    overskrift("3. Opgaverne");
    var antal = { en: 0, ingen: 0, begge: 0 }, trin = { 1: 0, 2: 0, 3: 0 };
    fejlliste = [];
    D.PAR.forEach(function (p) {
        antal[p.udfald]++;
        if (p.udfald === "en") trin[p.trin]++;
        var o = D.lavOpgave(p, false), m = o.maengde;
        if (!m || m.ioner > D.MAKS_IONER || m.glasA > D.MAKS_GLAS || m.glasB > D.MAKS_GLAS) fejlliste.push(p.noegle + " maengde");
        var t = o.nye.filter(function (n) { return n.kode === "T"; }).length;
        if ((p.udfald === "en") !== (t === 1) || (p.udfald === "ingen") !== (t === 0)) fejlliste.push(p.noegle + " udfald");
        if (o.nye.some(function (n) { return n.kode === "x"; })) fejlliste.push(p.noegle + " ÷");
        if (p.udfald !== "ingen") {
            var f = D.fuldtSkema(o.A, o.B);
            var ok = f && f.cA * o.A.p === f.c0 * o.nye[0].salt.p && f.cB * o.B.n === f.c0 * o.nye[0].salt.n
                && f.cB * o.B.p === f.c1 * o.nye[1].salt.p && f.cA * o.A.n === f.c1 * o.nye[1].salt.n;
            if (!ok) fejlliste.push(p.noegle + " fuldt skema");
        }
    });
    paastand(D.PAR.length + " par: " + antal.en + " med ét bundfald, " + antal.ingen + " uden, " + antal.begge + " med to",
        antal.en > 60 && antal.ingen > 20 && antal.begge > 3);
    paastand("ét bundfald fordelt på trin 1, 2, 3: " + trin[1] + ", " + trin[2] + ", " + trin[3], trin[1] >= 5 && trin[2] >= 10 && trin[3] >= 10);
    paastand("alle par: rigtigt udfald, ingen ÷, afstemt fuldt skema, højst 20 ioner og 12 pr. glas",
        fejlliste.length === 0, fejlliste.slice(0, 4).join(", "));
    fejlliste = [];
    D.PAR.forEach(function (p) {
        var o = D.lavOpgave(p, false);
        o.faeld.forEach(function (S) {
            if (S.p * S.kat.q + S.n * S.an.q !== 0 || NK.gcd(S.p, S.n) !== 1) fejlliste.push(S.formel);
            var sk = D.ionskema(S);
            if (sk.indexOf(S.formel + "(s)") < 0 || sk.indexOf("(aq)") < 0) fejlliste.push(sk);
        });
    });
    paastand("alle bundfald er neutrale i mindste forhold, og ionskemaet slutter med (s)", fejlliste.length === 0, fejlliste.slice(0, 3).join(", "));

    overskrift("4. Svarmuligheder på niveau 2");
    var fejlIon = [], fejlFormel = [];
    D.PAR.filter(function (p) { return p.udfald === "en"; }).forEach(function (p) {
        var o = D.lavOpgave(p, false);
        var rigtige = o.ioner.map(D.ionTekst), at = D.ionAtrapper(o), set = {};
        at.forEach(function (a) { set[a.tekst] = 1; });
        if (at.length !== 4 || Object.keys(set).length !== 4 || at.some(function (a) { return rigtige.indexOf(a.tekst) >= 0 || !a.forklaring; })) {
            fejlIon.push(p.noegle);
        }
        var fv = D.formelVarianter(o.P).slice(0, 3), fs = {};
        fv.forEach(function (v) { fs[v.ascii] = 1; });
        if (fv.length !== 3 || Object.keys(fs).length !== 3 || fv.some(function (v) { return v.ascii === o.P.ascii || !v.forklaring; })) fejlFormel.push(p.noegle);
    });
    paastand("fire forskellige forkerte ioner med forklaring i hver opgave", fejlIon.length === 0, fejlIon.slice(0, 3).join(", "));
    paastand("tre forskellige forkerte formler med forklaring i hver opgave", fejlFormel.length === 0, fejlFormel.slice(0, 3).join(", "));
    o = D.lavOpgave(D.PAR.filter(function (p) { return p.noegle === "Ba-Cl+K-CO3"; })[0], false);
    var atTekst = D.ionAtrapper(o).map(function (a) { return a.tekst; }).join(" ");
    paastand("BaCl₂ + K₂CO₃ giver de typiske fejl Ba⁺, Cl₂⁻, K₂⁺ og O²⁻: " + atTekst,
        ["Ba⁺", "Cl₂⁻", "K₂⁺", "O²⁻"].every(function (t) { return atTekst.indexOf(t) >= 0; }));

    overskrift("5. Skrivefeltet formaterer, mens der tastes");
    var TAST = [["Ag3PO4", "Ag₃PO₄"], ["PO43-", "PO₄³⁻"], ["NO3-", "NO₃⁻"], ["Fe3+", "Fe³⁺"], ["NH4+", "NH₄⁺"],
        ["CO32-", "CO₃²⁻"], ["SO42-", "SO₄²⁻"], ["OH-", "OH⁻"], ["Ca3(PO4)2", "Ca₃(PO₄)₂"], ["3 Ag+", "3 Ag⁺"],
        ["PO4-", "PO₄⁻"], ["Cl-", "Cl⁻"], ["Ba2+", "Ba²⁺"], ["Al3+", "Al³⁺"], ["HCO3-", "HCO₃⁻"], ["Fe(OH)3", "Fe(OH)₃"],
        ["no3-", "NO₃⁻"], ["po43-", "PO₄³⁻"], ["co32-", "CO₃²⁻"], ["so42-", "SO₄²⁻"], ["fe3+", "Fe³⁺"], ["nh4+", "NH₄⁺"],
        ["hco3-", "HCO₃⁻"], ["CL-", "Cl⁻"], ["ag3po4", "Ag₃PO₄"], ["ca3(po4)2", "Ca₃(PO₄)₂"], ["feoh3", "Fe(OH)₃"], ["2i-", "2I⁻"], ["pbi2", "PbI₂"],
        ["ca3po42", "Ca₃(PO₄)₂"], ["Ca3PO42", "Ca₃(PO₄)₂"], ["nh42so4", "(NH₄)₂SO₄"], ["al2so43", "Al₂(SO₄)₃"], ["bano32", "Ba(NO₃)₂"], ["caoh2", "Ca(OH)₂"]];
    TAST.forEach(function (x) {
        /* Tegn for tegn, som naar eleven taster. */
        var s = "";
        x[0].split("").forEach(function (c) { s = F.formater(s + c); });
        paastand(x[0] + " bliver til " + x[1], s === x[1], "fik " + s);
    });
    var LAD = [["Fe₃", 3, "Fe³⁺"], ["NO₃", -1, "NO₃⁻"], ["PO₄₃", -3, "PO₄³⁻"], ["PO₄", -3, "PO₄³⁻"], ["Ag⁺", 2, "Ag²⁺"], ["SO₄", -2, "SO₄²⁻"]];
    LAD.forEach(function (x) {
        var s = F.saetLadning(x[0], x[1]);
        paastand("ladningsknap " + NK.ladningstekst(x[1]) + " på " + x[0] + " giver " + x[2], s === x[2], "fik " + s);
    });
    fejlliste = [];
    D.IONER.forEach(function (ion) {
        var tast = D.ascii(ion.formel) + (Math.abs(ion.q) > 1 ? Math.abs(ion.q) : "") + (ion.q > 0 ? "+" : "-"), s = "";
        tast.split("").forEach(function (c) { s = F.formater(s + c); });
        if (s !== D.ionTekst(ion)) fejlliste.push(tast + " -> " + s);
    });
    paastand("alle " + D.IONER.length + " ioner tastet på den korte måde bliver rigtige", fejlliste.length === 0, fejlliste.join(", "));

    overskrift("6. Typiske fejl bliver genkendt");
    function find(noegle) { return D.lavOpgave(D.PAR.filter(function (p) { return p.noegle === noegle; })[0], false); }
    o = find("Ag-NO3+Na-PO4");
    var ktxB = { o: o, salt: o.B, forventet: [o.B.kat, o.B.an], brugt: [], andre: [o.A.kat, o.A.an] };
    function ion(t) { return F.vurderIon(F.formater(t), ktxB); }
    function salt(t, oo) { return F.vurderSalt(F.formater(t), (oo || o).P, { o: oo || o }); }
    [["Na+", true, ""], ["PO43-", true, ""], ["Na3+", false, "3-tal"], ["Na", false, "ladning"], ["Na-", false, "Fortegnet"],
     ["P3-", false, "samlet ion"], ["O2-", false, "samlet ion"], ["Ag+", false, "anden opløsning"], ["na+", true, ""], ["po43-", true, ""],
     ["Na3PO4", false, "hele saltet"], ["Na1+", false, "uden tal"], ["Na+2", false, "før fortegnet"]].forEach(function (x) {
        var v = ion(x[0]);
        paastand("ion i Na₃PO₄: " + x[0] + (x[1] ? " godkendes" : " giver '" + x[2] + "'"),
            v.ok === x[1] && (x[1] || v.tekst.indexOf(x[2]) >= 0), v.tekst);
    });
    [["Ag3PO4", true, ""], ["AgPO4", false, "går ikke op"], ["PO4Ag3", false, "positive ion"], ["Ag6(PO4)2", false, "forkortes"],
     ["NaNO3", false, "letopløseligt"], ["Na3PO4", false, "ingen Na"], ["ag3po4", true, ""], ["Ag3(PO4)", false, "Parentes"],
     ["3Ag3PO4", false, "uden tal foran"]].forEach(function (x) {
        var v = salt(x[0]);
        paastand("formel for Ag₃PO₄: " + x[0] + (x[1] ? " godkendes" : " giver '" + x[2] + "'"),
            v.ok === x[1] && (x[1] || v.tekst.indexOf(x[2]) >= 0), v.tekst);
    });
    var o2 = find("Ca-Cl+Na-PO4");
    [["Ca3(PO4)2", true, ""], ["Ca3PO42", true, ""], ["ca3po42", true, ""], ["Ca3P2O8", false, "samlet"], ["Ca2(PO4)3", false, "byttet om"],
     ["CaPO4", false, "går ikke op"]].forEach(function (x) {
        var v = salt(x[0], o2);
        paastand("formel for Ca₃(PO₄)₂: " + x[0] + (x[1] ? " godkendes" : " giver '" + x[2] + "'"),
            v.ok === x[1] && (x[1] || v.tekst.indexOf(x[2]) >= 0), v.tekst);
    });
    function skema(l) {
        return F.vurderSkema(l.map(function (x) { return { koef: x[0], tekst: F.formater(x[1]), tilst: x[2] }; }), o);
    }
    [[[["3", "Ag+", "aq"], ["", "PO43-", "aq"], ["", "Ag3PO4", "s"]], true, ""],
     [[["", "PO43-", "aq"], ["3", "Ag+", "aq"], ["", "Ag3PO4", "s"]], true, ""],
     [[["3", "Ag+", "aq"], ["", "Na+", "aq"], ["", "Ag3PO4", "s"]], false, "tilskuerion"],
     [[["", "Ag+", "aq"], ["", "PO43-", "aq"], ["", "Ag3PO4", "s"]], false, "indeholder"],
     [[["6", "Ag+", "aq"], ["2", "PO43-", "aq"], ["2", "Ag3PO4", "s"]], false, "forkortes"],
     [[["3", "Ag+", "aq"], ["", "PO43-", "aq"], ["", "Ag3PO4", "aq"]], false, "fast stof"],
     [[["3", "Ag+", "aq"], ["", "PO43-", ""], ["", "Ag3PO4", "s"]], false, "tilstandsform"],
     [[["3", "AgNO3", "aq"], ["", "Na3PO4", "aq"], ["", "Ag3PO4", "s"]], false, "hver for sig"],
     [[["3", "Ag+", "aq"], ["3", "Ag+", "aq"], ["", "Ag3PO4", "s"]], false, "to gange"]].forEach(function (x, n) {
        var v = skema(x[0]);
        paastand("ionskema " + (n + 1) + (x[1] ? " godkendes" : " giver '" + x[2] + "'"),
            v.ok === x[1] && (x[1] || v.tekst.indexOf(x[2]) >= 0), v.tekst);
    });

    overskrift("7. Det rigtige svar godkendes i alle opgaver");
    fejlliste = [];
    D.PAR.filter(function (p) { return p.udfald === "en"; }).forEach(function (p) {
        [false, true].forEach(function (byt) {
            var o = D.lavOpgave(p, byt), P = o.P;
            [o.A, o.B].forEach(function (S) {
                var T = S === o.A ? o.B : o.A;
                [S.kat, S.an].forEach(function (i) {
                    var tast = D.ascii(i.formel) + (Math.abs(i.q) > 1 ? Math.abs(i.q) : "") + (i.q > 0 ? "+" : "-"), s = "";
                    tast.split("").forEach(function (c) { s = F.formater(s + c); });
                    var v = F.vurderIon(s, { o: o, salt: S, forventet: [S.kat, S.an], brugt: [], andre: [T.kat, T.an] });
                    if (!v.ok) fejlliste.push(p.noegle + ": " + s + " " + v.tekst);
                });
            });
            var sv = "";
            D.ascii(P.formel).split("").forEach(function (c) { sv = F.formater(sv + c); });
            if (!F.vurderSalt(sv, P, { o: o }).ok) fejlliste.push(p.noegle + ": " + sv);
            var led = [{ koef: P.p > 1 ? String(P.p) : "", tekst: D.ionTekst(P.kat), tilst: "aq" },
                       { koef: P.n > 1 ? String(P.n) : "", tekst: D.ionTekst(P.an), tilst: "aq" },
                       { koef: "", tekst: P.formel, tilst: "s" }];
            var vs = F.vurderSkema(led, o);
            if (!vs.ok) fejlliste.push(p.noegle + ": skema " + vs.tekst);
            var a = F.vurderAfstemning(P, P.p, P.n, 1, ["aq", "aq", "s"]);
            if (!a.ok) fejlliste.push(p.noegle + ": afstemning");
        });
    });
    paastand("ioner, formel og ionskema godkendes i begge rækkefølger", fejlliste.length === 0, fejlliste.slice(0, 3).join(" | "));

    overskrift("8. Alle tre niveauer kan gennemføres");
    function kor(niv, sek) { for (var t = 0; t < sek * 60; t++) niv.baeger.opdater(1 / 60, 900, 520); }
    /* Svarknapperne vaelger kun; Indsend svar sender ind */
    function svar(niv, liste) { [].concat(liste).forEach(function (i) { niv.valgKlik(i); }); niv.indsend(); }
    function parAf(n) { return D.PAR.filter(function (p) { return p.noegle === n; })[0]; }
    NK.visNiveau("tabel");
    var nt = NK.niveauer.tabel, f0 = nt.loest;
    nt.nyOpgave(parAf("Ag-NO3+Na-PO4"), false);
    paastand("niveau 1 (Let): samme fire trin, ionerne er givet, og man starter på trin 2",
        nt.def.trin.map(function (t) { return t.navn; }).join(",") === NK.NIVEAUER.skriv.trin.map(function (t) { return t.navn; }).join(",")
        && nt.status[0] === "givet" && nt.trin === 1);
    nt.tabelKlik("Ag", "NO3");
    paastand("niveau 1: klik på det gamle par giver en forklaring", /flasken/.test(nt.besked.tekst) && nt.trin === 1, nt.besked.tekst);
    nt.tabelKlik("Ag", "PO4"); nt.tabelKlik("Na", "NO3");
    paastand("niveau 1: begge nye par fundet, anden del af trin 2", nt.trin === 1 && nt.s.fase === "b");
    nt.valgKlik(1);
    paastand("niveau 1: et klik på et svar vælger det kun", nt.trin === 1 && !nt.klaret && nt.s.valgt === 1 && !nt.s.forkerte[1]
        && !!d.querySelector('#tekstboks .sk-knap.valgt[data-i="1"]') && !d.querySelector("#indsend.ikke-klar"));
    nt.indsend();
    paastand("niveau 1: NaNO₃ falder ud er forkert med forklaring", nt.trin === 1 && /letopløseligt/.test(nt.besked.tekst), nt.besked.tekst);
    nt.indsend();
    paastand("niveau 1: Indsend svar uden valg bedømmer intet", nt.trin === 1 && !nt.klaret && nt.besked.klasse === "peger");
    svar(nt, 0);
    paastand("niveau 1: kortet bliver på spørgsmålet: svaret grønt og knappen Ny opgave, hvor Indsend svar stod",
        !!nt.klaret && !!d.querySelector('#tekstboks .sk-knap.rigtig[data-i="0"]') && /Ny opgave/.test((d.querySelector("#tekstboks [data-videre]") || {}).textContent || "")
        && !d.getElementById("indsend") && /Ag₃PO₄/.test(d.getElementById("tekstboks").textContent));
    paastand("niveau 1: løst, formel og ionskema vises, tælleren går op", nt.faerdig && nt.loest === f0 + 1
        && nt.status[2] === "givet" && nt.status[3] === "givet" && d.getElementById("tavle").textContent.indexOf("3 Ag⁺(aq) + PO₄³⁻(aq) → Ag₃PO₄(s)") >= 0);
    kor(nt, 7);
    var b = nt.baeger, iBunke = b.ioner.filter(function (p) { return p.bunke; }), P1 = nt.o.P;
    var enh = nt.o.maengde.nA / 3;
    paastand("niveau 1: bundfaldet i glasset er " + iBunke.length + " ioner = " + enh + " Ag₃PO₄, alle landet",
        iBunke.length === enh * 4 && iBunke.every(function (p) { return p.fast; }));
    paastand("niveau 1: tilskuerionerne svømmer stadig (" + (b.ioner.length - iBunke.length) + ")",
        b.ioner.filter(function (p) { return !p.bunke; }).every(function (p) { return p.ion.id === "Na" || p.ion.id === "NO3"; }));
    paastand("niveau 1: ionerne er inde i glasset", b.ioner.every(function (p) { return p.u >= -0.01 && p.u <= 1.01 && p.v >= -0.01 && p.v <= 1.01; }));

    nt.nyOpgave(parAf("K-NO3+Na-Cl"), false);
    nt.knap(); nt.knap();
    svar(nt, 3);
    paastand("niveau 1: intet bundfald, svaret vist, tælleren står stille", nt.faerdig && nt.vist && nt.loest === f0 + 1);
    kor(nt, 6);
    paastand("niveau 1: intet bundfald i glasset", nt.baeger.ioner.every(function (p) { return !p.bunke; }) && nt.baeger.fase === "blandet");

    NK.visNiveau("vaelg");
    var nv = NK.niveauer.vaelg;
    nv.nyOpgave(parAf("Fe3-Cl+Na-OH"), false);
    var fejlKlik = -1;
    nv.s.chips.forEach(function (c, i) { if (!c.ion && fejlKlik < 0) fejlKlik = i; });
    var indexAf = function (ion) { var ud = -1; nv.s.chips.forEach(function (c, i) { if (c.ion === ion) ud = i; }); return ud; };
    var synlige = function (g) { return nv.baeger.ioner.filter(function (p) { return p.glas === g; }).every(function (p) { return p.maalAlfa === 1; }); };
    svar(nv, [fejlKlik, indexAf(nv.o.A.kat)]);
    paastand("niveau 2: et forkert valg med giver forklaring, og intet godkendes", nv.trin === 0 && nv.besked.klasse === "skidt"
        && nv.s.forkerte[fejlKlik] && !nv.s.fundneIoner[nv.o.A.kat.id] && nv.s.valgt.indexOf(indexAf(nv.o.A.kat)) >= 0);
    nv.indsend();
    paastand("niveau 2: én ion fra et salt fundet, glassene er stadig tomme", nv.s.fundneIoner[nv.o.A.kat.id] && !synlige("A") && !synlige("B"));
    svar(nv, indexAf(nv.o.A.an));
    paastand("niveau 2: begge ioner fra " + nv.o.A.formel + " fundet, de dukker op i dets glas", synlige("A") && !synlige("B"));
    svar(nv, [indexAf(nv.o.B.kat), indexAf(nv.o.B.an)]);
    paastand("niveau 2: fire ioner fundet, kortet bliver på trin 1 med Næste trin", nv.trin === 0 && !!nv.klaret
        && /Næste trin/.test((d.querySelector("#tekstboks [data-videre]") || {}).textContent || ""));
    nv.videre();
    paastand("niveau 2: Næste trin fører til trin 2, og kortet beder om at slå op", nv.trin === 1 && !!d.getElementById("slaa-op"));
    nv.tabelKlik("Na", "Cl");
    paastand("niveau 2: det letopløselige par giver L-forklaring", nv.trin === 1 && /letopløseligt/.test(nv.besked.tekst));
    nv.tabelKlik("Fe3", "OH");
    paastand("niveau 2: Fe(OH)₃ fundet, tilskuerionerne streget ud", !!nv.klaret && d.querySelectorAll("#tavle .ion.tilskuer").length === 2);
    nv.videre();
    svar(nv, nv.s.formelValg.map(function (v) { return v.rigtig; }).indexOf(true));
    nv.videre();
    paastand("niveau 2: formlen valgt, trin 4", nv.trin === 3);
    nv.s.k = [1, 3, 1]; nv.s.t = ["aq", "aq", "s"]; nv.indsend();
    paastand("niveau 2: ionskemaet afstemt, løst", nv.faerdig && !nv.vist && nv.loest === 1);
    paastand("niveau 2: tavlen viser Fe³⁺(aq) + 3 OH⁻(aq) → Fe(OH)₃(s)",
        d.getElementById("tavle").textContent.indexOf("Fe³⁺(aq) + 3 OH⁻(aq) → Fe(OH)₃(s)") >= 0);

    NK.visNiveau("skriv");
    var ns = NK.niveauer.skriv;
    ns.nyOpgave(parAf("Pb-NO3+K-I"), false);
    function tast(t) { var s = ""; t.split("").forEach(function (c) { s = F.formater(s + c); }); return s; }
    ns.s.felt.A0 = tast("Pb2+"); ns.s.felt.A1 = tast("NO3-"); ns.s.felt.B0 = tast("K+"); ns.s.felt.B1 = tast("I");
    ns.tjek();
    paastand("niveau 3: tre rigtige felter låses, I uden ladning giver besked", ns.trin === 0 && ns.s.ok.A0 && ns.s.ok.B0 && !ns.s.ok.B1
        && /ladning/.test(ns.besked.tekst), ns.besked.tekst);
    paastand("niveau 3: ionerne i Pb(NO₃)₂ er i glasset, KI's er ikke",
        ns.baeger.ioner.every(function (p) { return (p.glas === "A") === (p.maalAlfa === 1); }));
    ns.s.felt.B1 = tast("I-"); ns.tjek();
    paastand("niveau 3: ionerne godkendt, felterne låst, kortet venter på Næste trin", ns.trin === 0 && !!ns.klaret
        && d.querySelectorAll("#tavle .skrivefelt:not([readonly])").length === 0);
    ns.videre();
    paastand("niveau 3: trin 2", ns.trin === 1);
    ns.tabelKlik("Pb", "I"); ns.videre();
    ns.s.felt.P = tast("PbI2"); ns.tjek(); ns.videre();
    paastand("niveau 3: PbI₂ godkendt, trin 4 med formlen skrevet i forvejen", ns.trin === 3 && ns.s.felt.f2 === "PbI₂");
    ns.s.felt.k0 = ""; ns.s.felt.f0 = tast("Pb2+"); ns.s.felt.t0 = "aq";
    ns.s.felt.k1 = ""; ns.s.felt.f1 = tast("2I-"); ns.s.felt.t1 = "aq"; ns.s.felt.t2 = "s";
    ns.tjek();
    paastand("niveau 3: 2 skrevet foran I⁻ flyttes over i talfeltet, løst", ns.faerdig && ns.s.felt.k1 === "2" && ns.loest === 1, ns.besked.tekst);
    kor(ns, 7);
    var bs = ns.baeger.ioner.filter(function (p) { return p.bunke; });
    paastand("niveau 3: bundfaldet er PbI₂ i forholdet 1 : 2",
        bs.length > 0 && bs.filter(function (p) { return p.ion.id === "I"; }).length === 2 * bs.filter(function (p) { return p.ion.id === "Pb"; }).length);

    /* Tastning i et rigtigt felt paa siden, som naar eleven skriver. */
    ns.nyOpgave(parAf("Ag-NO3+Na-PO4"), true);
    var felt = d.querySelector('#tavle .skrivefelt[data-felt="A1"]');
    felt.focus();
    felt.value = "PO43-";
    felt.setSelectionRange(5, 5);
    felt.dispatchEvent(new w.Event("input", { bubbles: true }));
    paastand("niveau 3: PO43- tastet i feltet står som PO₄³⁻ og gemmes", felt.value === "PO₄³⁻" && ns.s.felt.A1 === "PO₄³⁻", felt.value);
    var felt2 = d.querySelector('#tavle .skrivefelt[data-felt="B0"]');
    felt2.focus();
    felt2.value = "Ag";
    felt2.dispatchEvent(new w.Event("input", { bubbles: true }));
    d.querySelector('#ab-valg [data-q="1"]').click();
    paastand("niveau 3: ladningsknappen + sætter Ag⁺ i det felt, man står i", felt2.value === "Ag⁺" && ns.s.felt.B0 === "Ag⁺", felt2.value);
    felt2.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    paastand("niveau 3: Enter tjekker", ns.besked.klasse === "skidt" && ns.s.ok.B0 === "Ag", ns.besked.tekst);

    ns.nyOpgave();
    for (i = 0; i < 16 && !ns.faerdig; i++) ns.knap();
    paastand("niveau 3: kun hjælpeknappen gennemfører opgaven, tælleren står stille", ns.faerdig && ns.vist && ns.loest === 1);
    paastand("niveau 3: knappen hedder Ny opgave til sidst, og hintknappen er væk", !d.getElementById("opgaveknap")
        && /Ny opgave/.test((d.querySelector("#tekstboks [data-videre]") || {}).textContent || ""));

    overskrift("9. Mange tilfældige opgaver i glassene");
    fejlliste = [];
    var nb = new NK.Baeger();
    D.PAR.filter(function (p, n) { return n % 7 === 0; }).forEach(function (p) {
        var o = D.lavOpgave(p);
        nb.saetOpgave(o, true);
        for (var t = 0; t < 30; t++) nb.opdater(1 / 60, 900, 520);
        nb.bland(o.faeld);
        for (t = 0; t < 8 * 60; t++) nb.opdater(1 / 60, 900, 520);
        var forvent = 0;
        o.faeld.forEach(function (S) {
            var nKat = 0, nAn = 0;
            nb.ioner.forEach(function (q) { if (q.ion === S.kat) nKat++; if (q.ion === S.an) nAn++; });
            forvent += Math.min(Math.floor(nKat / S.p), Math.floor(nAn / S.n)) * (S.p + S.n);
        });
        var iB = nb.ioner.filter(function (q) { return q.bunke; });
        if (iB.length !== forvent || !iB.every(function (q) { return q.fast; }) || nb.fase !== "blandet") fejlliste.push(p.noegle);
        if (!nb.ioner.every(function (q) { return q.glas === "M" && q.u > -0.02 && q.u < 1.02 && q.v > -0.02 && q.v < 1.02; })) fejlliste.push(p.noegle + " uden for");
    });
    paastand("glassene blandes, og bundfaldet lander helt i " + Math.ceil(D.PAR.length / 7) + " opgaver", fejlliste.length === 0, fejlliste.slice(0, 3).join(", "));

    overskrift("10. Kemichael præsenterer");
    var K = NK.Kemichael, lr = NK.laerer;
    paastand("Kemichael er indlæst fra den fælles mappe", !!(K && lr && lr.laerer));
    if (lr) {
        var korL = function (sek) { for (var t = 0; t < sek * 60; t++) lr.opdater(1 / 60); };
        lr.stopIntro(); korL(3);
        w.localStorage.removeItem("nk-sc2.4-intro");
        NK.visNiveau("vaelg");
        korL(1.2);
        var tilbud = d.getElementById("tilbud");
        paastand("første gang Middel åbnes, står der Start præsentation og Nej tak, og han kommer ikke af sig selv",
            !tilbud.hidden && !lr.laererIIntro() && !(lr.introVent > 0));
        tilbud.querySelector(".tilbud-start").click();
        korL(3);
        var boble = d.getElementById("laerred-boble");
        paastand("Start præsentation: han går ind og præsenterer Middel med Næste og Spring præsentationen over",
            tilbud.hidden && lr.laererIIntro() && lr.introId === "vaelg" && !!boble && !boble.hidden
            && boble.querySelector(".km-tekst").textContent === D.INTRO.vaelg[0].tekst);
        var rOpg = d.getElementById("opgavekort").getBoundingClientRect(), r0 = NK.Fremhaev.synlige()[0];
        paastand("trin 1 på Middel: trinene i panelet har en gul ramme, og han peger op mod dem",
            NK.Fremhaev.synlige().length === 1 && Math.abs(r0.left - (rOpg.left - 5)) < 2 && lr.laerer.arm > -0.25 && lr.laerer.arm < 1.6,
            lr.laerer.arm.toFixed(2));
        korL(25);
        paastand("han går ikke videre af sig selv (25 s)", lr.laererIIntro() && lr.introStatus().nr === 0);
        boble.querySelector(".km-naeste").click(); korL(1);
        paastand("trin 2 på Middel: tavlen og de to glas har en gul ramme, og han peger op mod tavlen",
            lr.introStatus().nr === 1 && NK.Fremhaev.synlige().length === 3 && lr.laerer.arm > -0.25 && lr.laerer.arm < 0.6,
            NK.Fremhaev.synlige().length + " / " + lr.laerer.arm.toFixed(2));
        NK.visNiveau("tabel"); korL(0.5);
        paastand("et andet niveau sender ham ud", !lr.laererIIntro() && boble.hidden);
        NK.visNiveau("vaelg"); korL(1.5);
        paastand("anden gang Middel åbnes, præsenterer han ikke igen", !lr.laererIIntro());
        lr.startIntro("vaelg", true); korL(2.5);
        paastand("K viser præsentationen igen", lr.laererIIntro() && !boble.hidden);
        boble.querySelector(".km-spring").click(); korL(0.2);
        paastand("Spring præsentationen over sender ham ud", !lr.laererIIntro() && boble.hidden);
        NK.visNiveau("skriv"); korL(1.2);
        var visteTilbud = !tilbud.hidden;
        d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true })); korL(0.2);
        paastand("Svær: tilbuddet står fremme, og Esc er Nej tak (huskes)", visteTilbud && tilbud.hidden && !lr.laererIIntro() &&
            !!(JSON.parse(w.localStorage.getItem("nk-sc2.4-intro")) || {}).skriv);
        NK.visNiveau("vaelg"); korL(0.3);
        paastand("et niveau, der er set, viser ikke tilbuddet", tilbud.hidden);
        lr.startIntro("skriv", true); korL(2.5);
        d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true })); korL(0.2);
        paastand("Esc under præsentationen sender ham ud", !lr.laererIIntro());
        NK.visNiveau("tabel"); NK.niveauer.tabel.nyOpgave(); lr.startIntro("tabel", true); korL(2.5);
        var iIntroLet = lr.laererIIntro();
        NK.Opslag.aabn();
        korL(0.2);
        paastand("opslaget i fældningstabellen sender ham ud, så Esc lukker opslaget", iIntroLet && NK.Opslag.aaben() && !lr.laererIIntro(),
            iIntroLet + " / " + NK.Opslag.aaben());
        if (NK.Opslag.aaben()) NK.Opslag.luk(false);
        korL(2);
        /* Brugerens regel 4. nov. 2026: han siger mere ad gangen, i hele saetninger */
        var forkerte = [];
        ["tabel", "vaelg", "skriv"].forEach(function (id) {
            D.INTRO[id].forEach(function (l) {
                var n = l.tekst.split(/[.?] /).length;
                if (l.tekst.length > 420 || l.tekst.length < 100 || n < 2 || n > 4 || !/^[A-ZÆØÅ].*\.$/.test(l.tekst) || /^Her\b/.test(l.tekst)) forkerte.push(l.tekst.slice(0, 40));
            });
        });
        paastand("tre præsentationer à tre trin, hvert trin to til fire hele sætninger (højst 420 tegn)",
            Object.keys(D.INTRO).length === 3 && forkerte.length === 0 && D.INTRO.tabel.length === 3, forkerte.join(" | "));

        /* Den faelles test paa hver sværhedsgrad. startIntro(tving) er her
           startIntro(id, tving), saa den kobles om, mens testen koerer. */
        overskrift("10b. Kemichaels præsentation: ét trin ad gangen (fælles test)");
        ["tabel", "vaelg", "skriv"].forEach(function (id) {
            NK.visNiveau(id);
            lr.stopIntro(); korL(2);
            lr.introId = id;          /* introLinjer() er trinnene for introId */
            lr.startIntro = function (tving) { return NK.Laerer.prototype.startIntro.call(this, id, tving); };
            NK.Praesentation.selvtest(lr, korL).forEach(function (r) { paastand(id + ": " + r[0], r[1], r[2]); });
            delete lr.startIntro;
            korL(2);
        });
        NK.visNiveau("tabel"); korL(1);
    }

    overskrift("11. Tekstboksen og opslaget i fældningstabellen");
    var Op = NK.Opslag, tb = d.getElementById("tekstboks"), panelTabel = d.getElementById("tabel-hjem");
    NK.visNiveau("tabel");
    nt.nyOpgave(parAf("Ag-NO3+Na-PO4"), false);
    var r1 = tb.getBoundingClientRect(), r2 = d.getElementById("arbejdsbord").getBoundingClientRect(), r3 = d.getElementById("baeger-omraade").getBoundingClientRect();
    paastand("tekstboksen står øverst i scenen, tavlen lige under og glassene nederst", r1.top < r2.top && r2.top < r3.top && r1.top < 90);
    paastand("tekstboksen siger, hvad der blandes, og at der skal slås op", /Sølv\(I\)nitrat og natriumphosphat blandes/.test(tb.textContent)
        && /Slå de to nye par op i fældningstabellen/.test(tb.textContent) && !!d.getElementById("slaa-op"));
    paastand("ingen tekstlinje nederst på arbejdsbordet", !d.getElementById("besked") || !!d.getElementById("besked").closest("#tekstboks"));
    d.getElementById("slaa-op").click();
    var ob = d.getElementById("opslag");
    paastand("knappen Slå op åbner opslaget med tabellen og skemaet", Op.aaben() && !ob.hidden && !!ob.querySelector("#tabel .ftabel")
        && /AgNO₃/.test(d.getElementById("opslag-skema").textContent) && !panelTabel.querySelector("#tabel"));
    var rb = d.getElementById("opslag-boks").getBoundingClientRect();
    paastand("opslaget fylder næsten hele skærmen (" + Math.round(rb.width) + " x " + Math.round(rb.height) + ")", rb.width > 0.9 * w.innerWidth && rb.height > 0.9 * w.innerHeight);
    var celle = function (k, a) { return ob.querySelector('#tabel td[data-kat="' + k + '"][data-an="' + a + '"]'); };
    celle("Ag", "NO3").click();
    paastand("i opslaget giver det gamle par en forklaring i opslagets kort", /flasken/.test(d.getElementById("opslag-kort").textContent) && Op.aaben());
    celle("Ag", "PO4").click();
    paastand("første nye par fundet, opslaget bliver", Op.aaben() && !Op.lukker() && /\?/.test(d.getElementById("opslag-skema").textContent));
    celle("Na", "NO3").click();
    paastand("begge nye par fundet: opslaget lukker af sig selv om lidt", Op.aaben() && Op.lukker() && nt.s.fase === "b");
    Op.lukNu();
    paastand("tilbage ved blandingen: tabellen er i panelet igen, og kortet spørger, hvad der falder ud",
        !Op.aaben() && ob.hidden && !!panelTabel.querySelector("#tabel .ftabel") && /Hvad falder ud\?/.test(tb.textContent)
        && tb.querySelectorAll(".sk-knap").length === 4 && !/Begge nye par/.test(tb.textContent));
    nt.nyOpgave(parAf("K-NO3+Na-Cl"), false);
    d.querySelector('#tabel-hjem td[data-kat="Na"][data-an="NO3"]').click();
    paastand("et klik på tabellen i panelet åbner opslaget i stedet for at svare", Op.aaben() && (nt.s.fundne || []).length === 0);
    d.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    paastand("Esc lukker opslaget, og knappen Slå op står der stadig", !Op.aaben() && !!d.getElementById("slaa-op"));
    NK.visNiveau("vaelg");
    nv.nyOpgave(parAf("Fe3-Cl+Na-OH"), false);
    nv.knap(); nv.knap(); nv.videre();
    d.getElementById("slaa-op").click();
    celle("Fe3", "OH").click();
    paastand("Middel: det tungtopløselige par fundet i opslaget, opslaget lukker", Op.lukker() && !!nv.klaret
        && /Fe³⁺ og OH⁻ er T/.test(d.getElementById("opslag-kort").textContent));
    Op.lukNu();
    paastand("Middel: kortet bliver på trin 2 med forklaringen og Næste trin", !Op.aaben() && nv.trin === 1
        && /Fe³⁺ og OH⁻ er T/.test(tb.textContent) && !!tb.querySelector("[data-videre]"));
    var hMax = 0;
    ["tabel", "vaelg", "skriv"].forEach(function (id) {
        NK.visNiveau(id);
        var n = NK.niveauer[id];
        for (var r = 0; r < 4; r++) {
            n.nyOpgave();
            for (var k2 = 0; k2 < 14 && !n.faerdig; k2++) { hMax = Math.max(hMax, tb.offsetHeight); n.knap(); }
            hMax = Math.max(hMax, tb.offsetHeight);
        }
    });
    paastand("tekstboksen er højst 215 px høj ved 1400 x 860 (" + hMax + " px)", hMax <= 215);

    overskrift("12. Sproget");
    var tekster = [d.body.innerText];
    D.PAR.forEach(function (p) {
        var o = D.lavOpgave(p);
        D.ionAtrapper(o).forEach(function (a) { tekster.push(a.tekst + " " + a.forklaring); });
        if (o.P) {
            D.formelVarianter(o.P).forEach(function (v) { tekster.push(v.tekst + " " + v.forklaring); });
            var k = D.formelKatalog(o.P);
            Object.keys(k).forEach(function (x) { tekster.push(k[x]); });
            tekster.push(D.ionskema(o.P), D.hvorforFormel(o.P));
        }
    });
    Object.keys(D.FINDES_IKKE).forEach(function (k) { tekster.push(D.FINDES_IKKE[k]); });
    Object.keys(D.INTRO).forEach(function (k) { D.INTRO[k].forEach(function (l) { tekster.push(l.tekst); }); });
    ["tabel", "vaelg", "skriv"].forEach(function (id) {
        NK.NIVEAUER[id].trin.forEach(function (t) { tekster.push(typeof t.spm === "string" ? t.spm : "", t.navn); });
    });
    var alt = tekster.join("\n");
    paastand("ingen tankestreger", !/[—–]/.test(alt), (alt.match(/.{0,30}[—–].{0,30}/) || [""])[0]);
    paastand("ingen ladning skrevet som 1+ eller 1−", !/(^|[^0-9·(+−])1[+−]|¹[⁺⁻]/.test(alt), (alt.match(/.{0,20}(1[+−]|¹[⁺⁻]).{0,20}/) || [""])[0]);
    var ingenSmaa = [];
    Array.prototype.forEach.call(d.querySelectorAll("body *"), function (e) {
        if (!e.offsetWidth || !e.childNodes.length) return;
        var harTekst = Array.prototype.some.call(e.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
        if (!harTekst) return;
        var fs = parseFloat(w.getComputedStyle(e).fontSize);
        if (fs < 11.5) ingenSmaa.push(e.tagName + "." + e.className + " " + fs + "px");
    });
    paastand("ingen synlig tekst under 12 px", ingenSmaa.length === 0, ingenSmaa.slice(0, 4).join(", "));

    vis();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
</body>
