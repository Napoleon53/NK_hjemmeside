    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1400px; height:860px; opacity:0.001; pointer-events:none; }

<pre id="ud">Kører …</pre>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i spillet og kan slettes.

   Aabner index.html i en iframe og kontrollerer det, man ikke kan se paa
   et skaermbillede: at de seks indbyggede saet kan laeses, at
   tekstformatet fanger de fejl, en laerer laver, at et eget saet kan
   gemmes, vaelges og slettes igen, at alle tre spil kan spilles fra ende
   til anden, at rekorderne foelger saettet, og at sproget og
   skriftstoerrelserne holder reglerne.

   Testen laegger elevens egne saet og rekorder tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined && note !== "" ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

/* Elevens eget indhold gemmes og laegges tilbage til sidst */
var NOEGLER = ["nk-kemikort-egne", "nk-kemikort-valgt", "nk-kemikort-rekord", "nk-spil-navn"];
var GEMT = {};
NOEGLER.forEach(function (k) {
    try { GEMT[k] = localStorage.getItem(k); localStorage.removeItem(k); } catch (e) {}
});
function laegTilbage() {
    NOEGLER.forEach(function (k) {
        try { if (GEMT[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, GEMT[k]); } catch (e) {}
    });
}

var ramme = document.createElement("iframe");
ramme.src = "index.html";
document.body.appendChild(ramme);
ramme.addEventListener("load", function () { setTimeout(koer, 400); });

function koer() {
    try { tests(); } catch (e) { fejl++; skriv("UNDTAGELSE " + e + "\n" + e.stack, "fejl"); }
    /* Filen laeses med FileReader, som svarer senere */
    try {
        filTest(function () {
            listeTest(function () { laegTilbage(); vis(); });
        });
    } catch (e) {
        fejl++; skriv("UNDTAGELSE " + e + "\n" + e.stack, "fejl");
        laegTilbage(); vis();
    }
}

/* Henter en Quizlet-fil uden Sæt: gennem knappen Hent fil og ser, at
   filnavnet bliver saettets navn, og at Tab-tasten skriver et tabulatortegn. */
function filTest(faerdig) {
    var w = ramme.contentWindow, d = ramme.contentDocument, NK = w.NK;
    overskrift("9. Hent fil og Tab-tasten");
    NK.Editor.aabn(null, function () {});
    var felt = d.getElementById("egne-tekst");
    felt.value = "";
    felt.focus();
    felt.dispatchEvent(new w.KeyboardEvent("keydown", { key: "Tab", bubbles: true, cancelable: true }));
    paastand("Tab-tasten skriver et tabulatortegn i feltet", felt.value === "\t", JSON.stringify(felt.value));

    var fil = new w.File(["﻿Na⁺\tnatriumion\nK⁺\tkaliumion\nCl⁻\tchloridion\nBr⁻\tbromidion\n"], "Ioner fra Quizlet.txt", { type: "text/plain" });
    var dt = new w.DataTransfer();
    dt.items.add(fil);
    var input = d.getElementById("egne-fil");
    input.files = dt.files;
    input.dispatchEvent(new w.Event("change"));
    var forsoeg = 0;
    (function vent() {
        if (felt.value.indexOf("Sæt:") < 0 && forsoeg++ < 40) { setTimeout(vent, 50); return; }
        paastand("filnavnet bliver sættets navn", felt.value.indexOf("Sæt: Ioner fra Quizlet") === 0, felt.value.split("\n")[0]);
        paastand("BOM'en i starten af filen er fjernet", felt.value.indexOf("﻿") < 0);
        var r = NK.Tekstformat.fraTekst(felt.value);
        paastand("filen giver fire kort", !!r.saet && r.saet.kort.length === 4);
        NK.Editor.luk();
        faerdig();
    }());
}

/* Parring: uret, straffen for fejl og den faelles Top 10 med en falsk
   fetch. Intet sendes ud: fetch er falsk, og NK.ingenNet saettes igen
   til sidst. */
function listeTest(faerdig) {
    var w = ramme.contentWindow, d = ramme.contentDocument, NK = w.NK;
    var P = NK.Parring, B = NK.Bibliotek, D = NK.Data;
    function el(id) { return d.getElementById(id); }
    function vent(ms) { return new Promise(function (ok) { setTimeout(ok, ms); }); }
    function til(f, navn) {
        return new Promise(function (ok) {
            var n = 0;
            (function se() {
                if (f()) { ok(true); return; }
                if (n++ > 150) { paastand("venter på " + navn, false, "tiden løb ud"); ok(false); return; }
                setTimeout(se, 20);
            }());
        });
    }
    function vaelg(noegle) {
        el("saetvaelger").value = noegle;
        el("saetvaelger").dispatchEvent(new w.Event("change"));
    }
    function braek(nr) { return d.querySelector('#pa-hoejre .p-brik[data-nr="' + nr + '"]'); }
    function plads(nr) { return d.querySelector('#pa-venstre .p-plads[data-nr="' + nr + '"]'); }
    /* Parrer resten af runden og resten af saettet uden fejl */
    function parRunden() {
        var b, vaern = 0;
        while ((b = d.querySelector("#pa-hoejre .p-brik")) && vaern++ < 20) {
            var nr = b.getAttribute("data-nr");
            /* Efter en fejl er brikken stadig valgt; et klik mere ville fravaelge den */
            if (!b.classList.contains("valgt")) b.click();
            plads(nr).click();
        }
    }
    function parResten() {
        var vaern = 0;
        while (el("pa-slut").hidden && vaern++ < 30) {
            parRunden();
            if (!el("pa-naeste").hidden) P.naeste();
        }
    }
    function tast(maal, k) {
        maal.dispatchEvent(new w.KeyboardEvent("keydown", { key: k, bubbles: true, cancelable: true }));
    }
    /* Synlig tekst under 13 px i et element */
    function smaa(rod) {
        var ud = [], alle = rod.querySelectorAll("*");
        for (var i = 0; i < alle.length; i++) {
            var e = alle[i];
            if (!e.offsetWidth && !e.offsetHeight) continue;
            var tekst = [].some.call(e.childNodes, function (n) { return n.nodeType === 3 && n.nodeValue.trim(); });
            if (!tekst && e.tagName !== "INPUT") continue;
            var px = parseFloat(w.getComputedStyle(e).fontSize);
            if (px < 13) ud.push(e.tagName.toLowerCase() + "." + (e.className || "?") + " " + px.toFixed(1) + "px");
        }
        return ud;
    }
    /* Kortet staar helt inde i scenen og kan ses uden at rulle */
    function passer(kort) {
        var k = kort.getBoundingClientRect();
        var s = d.querySelector("#fane-parring .spilomraade").getBoundingClientRect();
        return k.top >= s.top - 1 && k.bottom <= s.bottom + 1 && k.left >= s.left - 1 && k.right <= s.right + 1
            && kort.scrollHeight <= kort.clientHeight + 1 && d.documentElement.scrollHeight <= w.innerHeight + 1;
    }
    async function iStoerrelse(b, h, f) {
        ramme.style.width = b + "px";
        ramme.style.height = h + "px";
        await vent(120);
        var r = f();
        ramme.style.width = "";
        ramme.style.height = "";
        await vent(60);
        return r;
    }

    async function koer() {
        overskrift("10. Parring: uret, straffen og Top 10");
        d.querySelector('.faneknap[data-fane="parring"]').click();
        vaelg("i:grundstoffer");
        P.saetStoerrelse(6);
        var antal = B.saet("i:grundstoffer").kort.length;

        paastand("tiden skrives 1:23 under spillet og 1:23,4 bagefter", P.tidTekst(83.44) === "1:23" && P.tidTekst(83.44, true) === "1:23,4" &&
            P.tidTekst(59.96, true) === "1:00,0" && P.tidTekst(7.25, true) === "0:07,3", P.tidTekst(83.44, true));
        paastand("hver fejl koster 5 sekunder", P.STRAF === 5);
        paastand("uden liste: intet startkort, og brættet kan ses som før", el("pa-start").hidden &&
            w.getComputedStyle(el("pa-braet")).visibility === "visible");
        paastand("uret står stille før det første træk", !P.urKoerer() && el("pa-tid").textContent === "0:00", el("pa-tid").textContent);

        var foer = P.tid();
        braek(0).click();
        plads(1).click();
        paastand("et forkert par lægger 5 sekunder til tiden", Math.abs(P.tid() - foer - 5) < 0.5, P.tid().toFixed(2));
        paastand("fejlen tælles i panelet", el("pa-fejl").textContent === "1");
        paastand("statuslinjen siger, hvad fejlen koster", /Det koster 5 sekunder\./.test(el("pa-status").textContent), el("pa-status").textContent);
        paastand("uret går, når runden er i gang", P.urKoerer());
        paastand("panelet viser hele sekunder under spillet", /^\d+:\d\d$/.test(el("pa-tid").textContent) && el("pa-tid").textContent === "0:05",
            el("pa-tid").textContent);
        parRunden();
        paastand("uret står stille, mens Næste runde venter", !el("pa-naeste").hidden && !P.urKoerer());
        paastand("statuslinjen siger, at uret står stille", /står stille/.test(el("pa-status").textContent), el("pa-status").textContent);
        var t1 = P.tid();
        await vent(250);
        paastand("tiden går ikke mellem runderne", P.tid() === t1);
        P.naeste();
        paastand("uret går igen, når næste runde kommer frem", P.urKoerer());
        parResten();
        paastand("hele sættet kan parres", !el("pa-slut").hidden);
        paastand("resultatet viser tiden med tiendedele og straffen", /på \d+:\d\d,\d med 1 fejl \(heraf 5 s for fejl\)\./.test(el("pa-slut-tekst").textContent),
            el("pa-slut-tekst").textContent);
        paastand("panelet viser tiendedele bagefter", /^\d+:\d\d,\d$/.test(el("pa-tid").textContent), el("pa-tid").textContent);
        paastand("rekorden er gemt under en ny nøgle med straf (par6straf), ikke par6", B.rekord("i:grundstoffer", "par6straf") !== null &&
            B.rekord("i:grundstoffer", "par6") === null);
        paastand("rekorden står med tiendedele i panelet", /^\d+:\d\d,\d$/.test(el("pa-rekord").textContent), el("pa-rekord").textContent);
        paastand("uden liste: hverken navnefelt, liste eller note på resultatet", el("pa-slut-liste").hidden && el("pa-slut-note").hidden &&
            !el("pa-slut").classList.contains("med-liste"));

        /* Scriptet kender ikke spil9 endnu (foer Niels lægger den nye version op) */
        var hentet = [], sendt = [];
        var svar = { fejl: "ukendt spil" };
        w.fetch = function (url, o) {
            if (o && o.method === "POST") sendt.push(JSON.parse(o.body)); else hentet.push(String(url));
            var s = svar;
            return Promise.resolve({ json: function () { return Promise.resolve(s); } });
        };
        NK.ingenNet = false;
        NK.Topliste.nulstil();
        P.nyt();
        await til(function () { return hentet.length > 0; }, "spørgsmålet til listen");
        await vent(40);
        paastand("spørgsmålet går til spil9-grundstoffer", /\?spil=spil9-grundstoffer$/.test(hentet[0] || ""), hentet[0]);
        paastand("svaret \"ukendt spil\": fanen ser ud som før", el("pa-start").hidden && !P.venter() &&
            w.getComputedStyle(el("pa-braet")).visibility === "visible" && !NK.Topliste.harListe("spil9-grundstoffer"));

        /* Listen svarer */
        var navne = ["Ida", "Mads", "Sofie Kristensen", "Ahmed", "Laura", "Emil", "Freja", "Noah", "Clara", "Oliver"];
        var alle = navne.map(function (n, i) { return { navn: n, sekunder: 71.3 + i * 8.7 }; });
        svar = { uge: alle.slice(0, 3), alle: alle };
        NK.Topliste.nulstil();
        P.nyt();
        await til(function () { return P.venter(); }, "startkortet");
        paastand("med en liste begynder spillet med et startkort", !el("pa-start").hidden);
        paastand("brættet er usynligt, så den første runde ikke kan læses før Start", w.getComputedStyle(el("pa-braet")).visibility === "hidden");
        var st = el("pa-start").textContent;
        paastand("startkortet har Top 10 denne uge og alle tider side om side", d.querySelectorAll("#pa-start .tl-liste").length === 2 &&
            /Top 10 denne uge/.test(st) && /Top 10 alle tider/.test(st) && /Ida/.test(st) && /1:11,3/.test(st) && /Oliver/.test(st));
        var lis = d.querySelectorAll("#pa-start .toplister > div");
        paastand("de to lister står ved siden af hinanden", lis.length === 2 &&
            Math.abs(lis[0].getBoundingClientRect().top - lis[1].getBoundingClientRect().top) < 2 &&
            lis[0].getBoundingClientRect().right <= lis[1].getBoundingClientRect().left);
        paastand("startkortet nævner straffen og sættets størrelse", /^\d+ kort i runder på 6 par\. Hver fejl koster 5 sekunder\.$/.test(el("pa-start-tekst").textContent),
            el("pa-start-tekst").textContent);
        paastand("uret står stille ved startkortet", !P.urKoerer() && el("pa-tid").textContent === "0:00");
        var s1 = smaa(el("pa-start"));
        paastand("ingen tekst på startkortet er under 13 px", !s1.length, s1.join(", "));
        paastand("startkortet kan ses uden at rulle ved 1400 × 860", passer(el("pa-start")));
        paastand("og ved 1100 × 760", await iStoerrelse(1100, 760, function () { return passer(el("pa-start")); }));

        tast(d.body, "Enter");
        paastand("Enter starter: kortene kommer frem, og uret går", !P.venter() && el("pa-start").hidden && P.urKoerer() &&
            w.getComputedStyle(el("pa-braet")).visibility === "visible");
        braek(0).click();
        plads(1).click();
        P.ur(40);
        parResten();
        await til(function () { return !el("pa-slut").hidden && !el("pa-slut-liste").hidden; }, "resultatet med listen");
        var minTid = Math.round(P.tid() * 10) / 10;
        paastand("resultatet har navnefelt, knap og de to lister", !el("pa-navn").hidden && /Sæt på listen/.test(el("pa-listeknap").textContent) &&
            d.querySelectorAll("#pa-slut-liste .tl-liste").length === 2 && /Sofie Kristensen/.test(el("pa-slut-liste").textContent));
        paastand("resultatet viser tiden med tiendedele", el("pa-slut-tekst").textContent.indexOf(P.tidTekst(minTid, true)) >= 0, el("pa-slut-tekst").textContent);
        paastand("navnefeltet har det gemte navn fra spillene (nk-spil-navn)", el("pa-navn").value === NK.Topliste.navn());
        var s2 = smaa(el("pa-slut"));
        paastand("ingen tekst på resultatet med listen er under 13 px", !s2.length, s2.join(", "));
        paastand("resultatet med listen kan ses uden at rulle ved 1400 × 860", passer(el("pa-slut")));
        paastand("og ved 1100 × 760", await iStoerrelse(1100, 760, function () { return passer(el("pa-slut")); }));

        el("pa-navn").value = "Selvtest";
        el("pa-navn").focus();
        ["t", "v", "s", "h", "p", "1", " "].forEach(function (k) { tast(el("pa-navn"), k); });
        paastand("bogstaver i navnefeltet er ikke genveje", !el("fane-parring").hidden && !NK.Editor.aaben() &&
            !NK.Rundvisning.aktiv() && !el("pa-slut").hidden && sendt.length === 0);
        svar = { ok: true, uge: [{ navn: "Selvtest", sekunder: minTid }], alle: [{ navn: "Ida", sekunder: 71.3 }, { navn: "Selvtest", sekunder: minTid }] };
        tast(el("pa-navn"), "Enter");
        await til(function () { return /Tiden er sendt/.test(el("pa-listeknap").textContent); }, "tiden er sendt");
        var k = sendt[0] || {};
        paastand("Enter i navnefeltet sender spil9-grundstoffer, navnet, tiden, 6 par og antal kort", k.spil === "spil9-grundstoffer" &&
            k.navn === "Selvtest" && k.sekunder === minTid && k.niveau === 6 && k.point === antal, JSON.stringify(k));
        paastand("kun én tid er sendt", sendt.length === 1, sendt.length);
        paastand("knappen og feltet er slået fra bagefter, og navnet huskes", el("pa-listeknap").disabled && el("pa-navn").disabled &&
            w.localStorage.getItem("nk-spil-navn") === "Selvtest");
        paastand("listen fra svaret står på resultatet", /Selvtest/.test(el("pa-slut-liste").textContent));
        paastand("resultatet står der stadig (Enter i feltet startede ikke et nyt spil)", !el("pa-slut").hidden);
        P.saetPaaListen();
        await vent(30);
        paastand("samme tid kan ikke sendes to gange", sendt.length === 1);

        tast(d.body, "Enter");
        paastand("Enter uden for feltet giver et nyt spil med startkortet", P.venter() && !el("pa-start").hidden && el("pa-slut").hidden);
        tast(d.body, "Enter");
        parResten();
        await til(function () { return !el("pa-slut").hidden; }, "resultatet");
        paastand("navnet står i feltet næste gang", el("pa-navn").value === "Selvtest");

        /* Listen svarer, foerst efter det foerste traek: brættet bliver, og
           spillet kan ikke komme paa listen */
        NK.Topliste.nulstil();
        P.nyt();
        paastand("før svaret: ingen startkort", !P.venter() && el("pa-start").hidden);
        braek(0).click();
        plads(0).click();
        await til(function () { return NK.Topliste.harListe("spil9-grundstoffer"); }, "listen svarer");
        await vent(30);
        paastand("brættet forsvinder ikke midt i et spil, når listen svarer", !P.venter() && el("pa-start").hidden &&
            w.getComputedStyle(el("pa-braet")).visibility === "visible" && P.urKoerer());
        parResten();
        await vent(30);
        paastand("et spil, der ikke startede fra startkortet, får intet navnefelt", !el("pa-slut").hidden && el("pa-slut-liste").hidden);

        /* Andre stoerrelser og egne saet */
        var hentetFoer = hentet.length;
        P.saetStoerrelse(4);
        paastand("4 par pr. runde: intet startkort", !P.venter() && el("pa-start").hidden && P.listeId() === null);
        parResten();
        paastand("4 par: ingen navnefelt, men en kort linje om Top 10", el("pa-slut-liste").hidden && !el("pa-slut-note").hidden &&
            /6 par pr\. runde/.test(el("pa-slut-note").textContent));
        P.saetStoerrelse(6);
        await til(function () { return P.venter(); }, "startkortet igen ved 6 par");
        var eget = B.gem("Sæt: Prøve\nSider: A | B\n\nen | to\ntre | fire\nfem | seks\nsyv | otte\n");
        P.saetSaet(B.saet(eget), eget);
        paastand("et eget sæt har ingen liste og intet startkort", !P.venter() && el("pa-start").hidden && P.listeId() === null);
        parResten();
        paastand("et eget sæt: hverken navnefelt eller note på resultatet", !el("pa-slut").hidden && el("pa-slut-liste").hidden &&
            el("pa-slut-note").hidden);
        paastand("et eget sæt spørger ikke listen", hentet.every(function (u, i) { return i < hentetFoer || /spil9-grundstoffer$/.test(u); }));
        paastand("kun den ene tid blev sendt i hele afsnittet", sendt.length === 1, sendt.length);
        B.slet(eget);

        /* Tilbage til det normale: intet net, standardsaettet */
        NK.ingenNet = true;
        w.fetch = function () { return Promise.reject(new Error("selvtest")); };
        NK.Topliste.nulstil();
        vaelg("i:" + D.STANDARD);
        d.querySelector('.faneknap[data-fane="traen"]').click();
    }

    koer().then(faerdig, function (e) {
        fejl++;
        skriv("UNDTAGELSE " + e + "\n" + (e && e.stack), "fejl");
        NK.ingenNet = true;
        faerdig();
    });
}

function tests() {
    var w = ramme.contentWindow, d = ramme.contentDocument, NK = w.NK;
    var F = NK.Tekstformat, B = NK.Bibliotek, D = NK.Data;

    /* Testen sender aldrig noget til den faelles liste, og et svar, der
       kom, mens siden blev indlaest, glemmes (afsnit 10 bruger en falsk fetch) */
    NK.ingenNet = true;
    NK.Topliste.nulstil();
    NK.Parring.nyt();

    /* ----------------------------------------------------------------- */
    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    paastand("alle dele er indlæst", !!(F && B && D && NK.Traen && NK.Vendespil && NK.Parring && NK.Editor && NK.Rundvisning));
    paastand("seks indbyggede sæt", D.INDBYGGEDE.length === 6, D.INDBYGGEDE.length);
    paastand("standardsættet findes", !!B.saet("i:" + D.STANDARD));

    /* ----------------------------------------------------------------- */
    overskrift("2. De indbyggede sæt");
    var ialt = 0;
    D.INDBYGGEDE.forEach(function (s) {
        var r = F.fraTekst(s.tekst);
        paastand(s.noegle + ": kan læses", !!r.saet, r.fejl.join(" / "));
        if (!r.saet) return;
        ialt += r.saet.kort.length;
        paastand(s.noegle + ": mindst 15 kort (" + r.saet.kort.length + ")", r.saet.kort.length >= 15);
        var lange = r.saet.kort.filter(function (k) { return k.bagside.length > 62 || k.forside.length > 40; });
        paastand(s.noegle + ": ingen side er for lang til en brik", !lange.length, lange.map(function (k) { return k.forside; }).join(", "));
        var dub = {}, ens = [];
        r.saet.kort.forEach(function (k) { if (dub[k.bagside]) ens.push(k.bagside); dub[k.bagside] = 1; });
        paastand(s.noegle + ": ingen ens bagsider (to rigtige svar i vendespillet)", !ens.length, ens.join(", "));
        var tekst = r.saet.kort.map(function (k) { return k.forside + " " + k.bagside; }).join(" ");
        paastand(s.noegle + ": ingen tankestreger", !/[–—]/.test(tekst));
        paastand(s.noegle + ": ladning ±1 skrives + og −, ikke 1+ og 1−", !/¹[⁺⁻]|1[+−-]\s/.test(tekst));
        paastand(s.noegle + ": to overskrifter på siderne", r.saet.sider.length === 2 && !!r.saet.sider[0] && !!r.saet.sider[1]);
        /* Skarpe par i vendespillet: bagsiden maa ikke roebe sin egen
           forside som et helt ord, og to bagsider maa ikke kunne forveksles,
           fordi de kun er forskellige i store og smaa bogstaver eller tegn. */
        function ord(t) { return " " + t.toLowerCase().replace(/[.,:;()]/g, " ").replace(/\s+/g, " ").trim() + " "; }
        var roeber = r.saet.kort.filter(function (k) {
            return k.forside.length >= 4 && ord(k.bagside).indexOf(ord(k.forside)) >= 0;
        });
        paastand(s.noegle + ": ingen bagside nævner sin egen forside", !roeber.length, roeber.map(function (k) { return k.forside; }).join(", "));
        var set = {}, naer = [];
        r.saet.kort.forEach(function (k) { var n = ord(k.bagside); if (set[n]) naer.push(k.bagside); set[n] = 1; });
        paastand(s.noegle + ": ingen bagsider er ens bortset fra tegnsætning", !naer.length, naer.join(", "));
    });
    paastand("mindst 150 kort i alt (" + ialt + ")", ialt >= 150);

    /* Nogle faglige stikproever, saa en tastefejl i data opdages */
    var ioner = B.saet("i:ioner").kort;
    function bagside(saetNoegle, forside) {
        var k = B.saet(saetNoegle).kort.filter(function (x) { return x.forside === forside; })[0];
        return k ? k.bagside : null;
    }
    paastand("Na⁺ er natriumion", bagside("i:ioner", "Na⁺") === "natriumion");
    paastand("SO₄²⁻ er sulfation", bagside("i:ioner", "SO₄²⁻") === "sulfation");
    paastand("Fe har to ioner med romertal", !!bagside("i:ioner", "Fe²⁺") && !!bagside("i:ioner", "Fe³⁺"));
    paastand("hver ion har en ladning i formlen", ioner.every(function (k) { return /[⁺⁻]/.test(k.forside); }));
    paastand("hvert ionnavn ender på ion", ioner.every(function (k) { return /ion(\s|\)|$)/.test(k.bagside); }));
    paastand("K er kalium (ikke potassium)", bagside("i:grundstoffer", "K") === "kalium");
    paastand("S er svovl", bagside("i:grundstoffer", "S") === "svovl");
    paastand("n = m / M står i formelsættet", !!bagside("i:beregninger", "n = m / M"));
    paastand("gaskonstanten er 0,0831 L·bar/(mol·K) som i sc5.6", /0,0831/.test(bagside("i:beregninger", "R")));
    paastand("molart rumfang er 24 L/mol", /24 L\/mol/.test(bagside("i:beregninger", "Vₘ")));
    paastand("oxidationstal skrives med romertal", bagside("i:syrebase-redox", "oxidationstal for O i forbindelser") === "−II");

    /* ----------------------------------------------------------------- */
    overskrift("3. Tekstformatet");
    var god = "Sæt: Prøve\nSider: A | B\n\nen | to\ntre | fire\nfem | seks\nsyv | otte\n";
    paastand("et gyldigt sæt godtages", !!F.fraTekst(god).saet);
    paastand("tabulator virker som deler (Quizlet)", !!F.fraTekst(god.replace(/ \| /g, "\t")).saet);
    paastand("semikolon virker som deler", !!F.fraTekst("Sæt: S\nSider: A | B\n\nen;to\ntre;fire\nfem;seks\nsyv;otte").saet);
    var fejlTekst = "Sæt: Fejl\nSider: A | B\n\nen | to\nuden streg\ntre | fire\nen | fem\nseks | syv\n";
    var rf = F.fraTekst(fejlTekst);
    paastand("et sæt med fejl godtages ikke", rf.saet === null);
    paastand("en linje uden streg meldes med linjenummer", !!rf.linjefejl[5]);
    paastand("den samme forside to gange meldes", !!rf.linjefejl[7]);
    paastand("udkastet viser de linjer, der kunne læses", rf.udkast.kort.length === 3, rf.udkast.kort.length);
    paastand("under fire kort godtages ikke", F.fraTekst("Sæt: L\nSider: A | B\n\nen | to").saet === null);
    paastand("m og M er ikke det samme kort", !!F.fraTekst("Sæt: S\nSider: A | B\n\nm | masse\nM | molarmasse\nn | stofmængde\nV | rumfang").saet);
    var kom = F.fraTekst("Sæt: K\nSider: A | B\n// kommentar\n[en] | [to]\ntre | fire // slut\nfem | seks\nsyv | otte");
    paastand("kommentarer og klammer fjernes", !!kom.saet && kom.saet.kort[0].forside === "en" && kom.saet.kort[1].bagside === "fire");
    paastand("skabelonen kan læses som et udkast", F.fraTekst(F.skabelon()).udkast.kort.length === 4);
    paastand("AI-vejledningen har formatet og et eksempel", /Sider:/.test(F.aiVejledning()) && /Na⁺ \| natriumion/.test(F.aiVejledning()));
    paastand("linket frem og tilbage giver den samme tekst", F.fraLink(F.tilLink(god)) === god);

    overskrift("3b. Quizlet (tabulator og linjeskift)");
    paastand("de indbyggede sæt står med tabulator, ikke lodret streg",
        D.INDBYGGEDE.every(function (s) { return s.tekst.indexOf(" | ") < 0 && s.tekst.indexOf("\t") > 0; }));
    var quizlet = "Na⁺\tnatriumion\nK⁺\tkaliumion\nCl⁻\tchloridion\nSO₄²⁻\tsulfation\n";
    var rq = F.fraTekst(quizlet);
    paastand("et rent Quizlet-sæt uden Sæt: godtages", !!rq.saet, rq.fejl.join(" / "));
    paastand("det får standardnavnet", !!rq.saet && rq.saet.navn === F.STANDARDNAVN);
    paastand("vinduet får at vide, at navnet mangler", rq.harNavn === false);
    paastand("Windows-linjeskift fra Quizlet virker", !!F.fraTekst(quizlet.replace(/\n/g, "\r\n")).saet);
    var titel = F.fraTekst("Titel: noget\tet kort\nK⁺\tkaliumion\nCl⁻\tchloridion\nNa⁺\tnatriumion\n");
    paastand("en Quizlet-forside, der begynder med Titel:, bliver et kort, ikke navnet",
        !!titel.saet && titel.saet.kort.length === 4 && !titel.harNavn);
    var ionsaet = B.saet("i:ioner");
    var ud = F.tilQuizlet(ionsaet);
    var udLinjer = ud.replace(/\n$/, "").split("\n");
    paastand("Kopiér til Quizlet giver én linje pr. kort", udLinjer.length === ionsaet.kort.length, udLinjer.length);
    paastand("hver linje har præcis ét tabulatortegn", udLinjer.every(function (l) { return l.split("\t").length === 2; }));
    paastand("navn og overskrifter er ikke med (Quizlet ville læse dem som kort)", !/^(Sæt|Sider):/m.test(ud));
    var tilbage = F.fraTekst(ud).saet;
    paastand("teksten til Quizlet læses tilbage til de samme kort",
        !!tilbage && JSON.stringify(tilbage.kort) === JSON.stringify(ionsaet.kort));
    paastand("tilTekst bruger tabulator og kan læses igen",
        JSON.stringify(F.fraTekst(F.tilTekst(ionsaet)).saet) === JSON.stringify(ionsaet));
    paastand("filnavnet er sættets navn uden kolon", NK.filnavn("C2 Ioner: formel og navn") === "C2 Ioner formel og navn.txt");
    paastand("skabelonen bruger tabulator", F.skabelon().indexOf("[forside 1]\t[bagside 1]") >= 0);

    /* ----------------------------------------------------------------- */
    overskrift("4. Biblioteket");
    var n1 = B.gem(god);
    paastand("et eget sæt gemmes med e:", /^e:/.test(n1));
    paastand("det kommer i listen", B.liste().length === 7);
    paastand("det samme sæt gemmes ikke to gange", B.gem(god) === n1);
    paastand("et indbygget sæt kan ikke slettes", B.slet("i:ioner") === false);
    B.slet(n1);
    paastand("et eget sæt kan slettes", B.liste().length === 6);
    paastand("#ioner i linket vælger ionsættet", B.fraHash("#ioner") === "i:ioner");
    paastand("#ioner&parring vælger også ionsættet", B.fraHash("#ioner&parring") === "i:ioner");
    paastand("et ukendt link giver null", B.fraHash("#findes-ikke") === null);
    var n2 = B.fraHash(B.link(god).replace(/^[^#]*#/, "#"));
    paastand("et link med sættet i giver sættet tilbage", !!B.saet(n2) && B.saet(n2).navn === "Prøve");
    B.slet(n2);
    var n3 = B.fraHash(B.link(god).replace(/^[^#]*#/, "#") + "&vendespil");
    paastand("et link med sættet og fanen (#kort=...&vendespil) giver også sættet", !!B.saet(n3) && B.saet(n3).navn === "Prøve");
    B.slet(n3);
    paastand("fanen alene foran sættet (#vendespil&kort=...) virker også",
        (function () { var n = B.fraHash("#vendespil&" + B.link(god).replace(/^[^#]*#/, "")); var ok = !!B.saet(n); B.slet(n); return ok; }()));
    B.nyRekord("i:ioner", "vend8", 60000);
    paastand("rekorden gemmes", B.rekord("i:ioner", "vend8") === 60000);
    paastand("en dårligere tid bliver ikke rekord", B.nyRekord("i:ioner", "vend8", 70000) === false);
    paastand("en bedre tid bliver rekord", B.nyRekord("i:ioner", "vend8", 50000) === true);
    paastand("et andet sæt har sin egen rekord", B.rekord("i:grundstoffer", "vend8") === null);
    paastand("et andet antal par har sin egen rekord", B.rekord("i:ioner", "vend6") === null);

    /* ----------------------------------------------------------------- */
    overskrift("5. Træn");
    function el(id) { return d.getElementById(id); }
    function vaelg(noegle) {
        el("saetvaelger").value = noegle;
        el("saetvaelger").dispatchEvent(new w.Event("change"));
    }
    vaelg("i:grundstoffer");
    var antalKort = B.saet("i:grundstoffer").kort.length;
    paastand("tælleren viser sættets antal", el("tr-taeller").textContent.indexOf("af " + antalKort) > 0, el("tr-taeller").textContent);
    paastand("bunken har alle kort", el("tr-bunke").textContent === String(antalKort));
    paastand("kortet viser forsidens overskrift", el("tr-for-etiket").textContent === "Symbol");
    var foerste = el("tr-for-tekst").textContent;
    NK.Traen.vend();
    paastand("kortet kan vendes", el("tr-kort").classList.contains("vendt"));
    paastand("svarknapperne kommer frem, når kortet er vendt", el("tr-svar").classList.contains("vis"));
    NK.Traen.svar(false);
    paastand("et misset kort bliver liggende i bunken", el("tr-bunke").textContent === String(antalKort));
    paastand("det kommer ikke igen med det samme", el("tr-for-tekst").textContent !== foerste);
    paastand("det står under dem, der driller", el("tr-svaere").textContent.indexOf(foerste) >= 0);
    NK.Traen.vend();
    NK.Traen.svar(true);
    paastand("et klaret kort ryger ud af bunken", el("tr-bunke").textContent === String(antalKort - 1));
    var vaern = 0;
    while (el("tr-faerdig").hidden && vaern++ < 400) { NK.Traen.vend(); NK.Traen.svar(true); }
    paastand("hele runden kan gennemføres", el("tr-faerdig").hidden === false, vaern);
    paastand("alle kort er klaret til sidst", el("tr-kan").textContent === antalKort + " af " + antalKort);
    NK.Traen.nulstil();
    paastand("Start forfra fylder bunken igen", el("tr-bunke").textContent === String(antalKort));
    NK.Traen.saetRetning("bf");
    paastand("den anden retning viser navnet først", el("tr-for-etiket").textContent === "Navn");
    paastand("knappen for retningen er markeret", el("tr-retning").querySelector('[data-retning="bf"]').classList.contains("valgt"));
    NK.Traen.saetRetning("fb");

    /* ----------------------------------------------------------------- */
    overskrift("6. Vendespil");
    d.querySelector('.faneknap[data-fane="vendespil"]').click();
    NK.Vendespil.saetStoerrelse(6);
    var brikker = d.querySelectorAll("#ve-gitter .brik");
    paastand("6 par giver 12 brikker", brikker.length === 12, brikker.length);
    paastand("alle brikker ligger med bagsiden op", [].every.call(brikker, function (b) { return !b.classList.contains("aaben") && !b.classList.contains("fundet"); }));

    /* Find parrene ud fra teksten paa brikkerne */
    var saet = B.saet(B.valgt());
    function kortNr(tekst) {
        for (var i = 0; i < saet.kort.length; i++) {
            if (saet.kort[i].forside === tekst || saet.kort[i].bagside === tekst) return i;
        }
        return -1;
    }
    var grupper = {};
    [].forEach.call(brikker, function (b, i) {
        var nr = kortNr(b.querySelector(".brik-for").textContent);
        (grupper[nr] = grupper[nr] || []).push(i);
    });
    var par = Object.keys(grupper).map(function (k) { return grupper[k]; });
    paastand("hver brik har en makker", par.length === 6 && par.every(function (p) { return p.length === 2; }));

    /* Ét forkert forsoeg, saa alle parrene */
    NK.Vendespil.klik(par[0][0]);
    NK.Vendespil.klik(par[1][0]);
    paastand("to brikker, der ikke passer, tæller en fejl", el("ve-fejl").textContent === "1");
    paastand("de bliver ikke fundet", !brikker[par[0][0]].classList.contains("fundet"));
    var galeTo = [brikker[par[0][0]], brikker[par[1][0]]];
    paastand("de bliver liggende åbne, så begge kan læses",
        galeTo.every(function (b) { return b.classList.contains("aaben") && b.classList.contains("gal"); }));
    paastand("der er ingen nedtælling", NK.Vendespil.laesetid === undefined);
    paastand("statuslinjen siger, at de vender ved næste klik", /klikker på en ny brik/.test(el("ve-status").textContent), el("ve-status").textContent);
    NK.Vendespil.klik(par[2][0]);
    paastand("et klik på en ny brik vender de to",
        galeTo.every(function (b) { return !b.classList.contains("aaben") && !b.classList.contains("gal"); }));
    paastand("og åbner den nye", brikker[par[2][0]].classList.contains("aaben"));
    NK.Vendespil.klik(par[2][1]);
    paastand("den nye kan stadig finde sin makker", brikker[par[2][1]].classList.contains("fundet"));
    par.forEach(function (p) { NK.Vendespil.klik(p[0]); NK.Vendespil.klik(p[1]); });
    paastand("alle par kan findes", el("ve-fundet").textContent === "6 af 6", el("ve-fundet").textContent);
    paastand("spillet melder, at det er slut", el("ve-slut").hidden === false);
    paastand("tiden er gemt som rekord", B.rekord(B.valgt(), "vend6") !== null);
    paastand("statuslinjen nævner tiden", /\d:\d\d/.test(el("ve-status").textContent), el("ve-status").textContent);
    NK.Vendespil.nyt();
    paastand("et nyt spil nulstiller fejlene", el("ve-fejl").textContent === "0");

    /* ----------------------------------------------------------------- */
    overskrift("7. Parring");
    d.querySelector('.faneknap[data-fane="parring"]').click();
    NK.Parring.saetStoerrelse(4);
    /* En sidste runde med ét kort laegges til den forrige */
    var runder = Math.ceil(saet.kort.length / 4) - (saet.kort.length % 4 === 1 ? 1 : 0);
    paastand("sættet deles i runder", el("pa-runde").textContent === "1 af " + runder, el("pa-runde").textContent);
    paastand("fire par i runden", d.querySelectorAll("#pa-hoejre .p-brik").length === 4);
    paastand("pladserne er tomme", d.querySelectorAll("#pa-venstre .p-plads.rigtig").length === 0);

    function braek(nr) { return d.querySelector('#pa-hoejre .p-brik[data-nr="' + nr + '"]'); }
    function plads(nr) { return d.querySelector('#pa-venstre .p-plads[data-nr="' + nr + '"]'); }

    /* Traek med musen: pointerdown, to traek og slip oven paa pladsen */
    function traek(fra, til) {
        var a = fra.getBoundingClientRect(), b = til.getBoundingClientRect();
        function send(type, x, y) {
            fra.dispatchEvent(new w.PointerEvent(type, {
                bubbles: true, cancelable: true, clientX: x, clientY: y,
                pointerId: 1, pointerType: "mouse", isPrimary: true, button: 0, buttons: 1
            }));
        }
        send("pointerdown", a.left + a.width / 2, a.top + a.height / 2);
        send("pointermove", a.left + a.width / 2 + 25, a.top + a.height / 2 + 12);
        send("pointermove", b.left + b.width / 2, b.top + b.height / 2);
        send("pointerup", b.left + b.width / 2, b.top + b.height / 2);
    }
    traek(braek(1), plads(2));
    paastand("et forkert træk tæller en fejl", el("pa-fejl").textContent === "1");
    paastand("den forkerte plads er stadig tom", !plads(2).classList.contains("rigtig"));
    traek(braek(1), plads(1));
    paastand("et rigtigt træk sætter svaret på pladsen", plads(1).classList.contains("rigtig"));
    paastand("den trukne brik forsvinder", !braek(1));
    paastand("ingen brik bliver hængende i luften", !d.querySelector(".p-flyver"));

    braek(0).click();
    paastand("et klik vælger svaret", braek(0).classList.contains("valgt"));
    plads(3).click();
    paastand("et forkert par tæller en fejl", el("pa-fejl").textContent === "2");
    paastand("pladsen er stadig tom", !plads(3).classList.contains("rigtig"));
    paastand("svaret er stadig valgt efter en fejl", braek(0).classList.contains("valgt"));
    plads(0).click();
    paastand("det rigtige par sætter sig på pladsen", plads(0).classList.contains("rigtig"));
    paastand("svaret forsvinder fra højre spalte", !braek(0));
    var vaern2 = 0;
    while (el("pa-slut").hidden && vaern2++ < 200) {
        var b = d.querySelector("#pa-hoejre .p-brik");
        if (b) {
            var nr = b.getAttribute("data-nr");
            b.click();
            plads(nr).click();
        } else if (!el("pa-naeste").hidden) {
            NK.Parring.naeste();
        } else break;
    }
    paastand("hele sættet kan parres", el("pa-slut").hidden === false, vaern2);
    paastand("tiden er gemt som rekord (med straf, par4straf)", B.rekord(B.valgt(), "par4straf") !== null);
    NK.Parring.nyt();
    paastand("et nyt spil starter forfra i runde 1", el("pa-runde").textContent === "1 af " + runder);
    paastand("fejlene er nulstillet", el("pa-fejl").textContent === "0");

    /* ----------------------------------------------------------------- */
    overskrift("8. Faner, sprog og skriftstørrelser");
    ["traen", "vendespil", "parring"].forEach(function (f) {
        d.querySelector('.faneknap[data-fane="' + f + '"]').click();
        paastand("fanen " + f + " kan vises alene", !el("fane-" + f).hidden
            && ["traen", "vendespil", "parring"].filter(function (a) { return a !== f && !el("fane-" + a).hidden; }).length === 0);
    });
    d.querySelector('.faneknap[data-fane="traen"]').click();

    /* Hele sidens tekst, ogsaa den skjulte, men uden koden i script-tags */
    var klon = d.body.cloneNode(true);
    [].forEach.call(klon.querySelectorAll("script"), function (s) { s.remove(); });
    var sidetekst = klon.textContent;
    paastand("ingen tankestreger i teksten på siden", !/[–—]/.test(sidetekst), (sidetekst.match(/.{0,18}[–—].{0,18}/) || [""])[0]);
    paastand("ingen 1+ eller 1− som ladning", !/¹[⁺⁻]/.test(sidetekst));
    paastand("reglerne forklarer formatet", d.getElementById("regler").textContent.indexOf("Na⁺ | natriumion") > 0);

    var forSmaa = [];
    var alle = d.querySelectorAll("body *");
    for (var i = 0; i < alle.length; i++) {
        var e = alle[i];
        if (!e.offsetWidth && !e.offsetHeight) continue;
        if (!e.firstChild || e.firstChild.nodeType !== 3 || !e.firstChild.nodeValue.trim()) continue;
        var px = parseFloat(w.getComputedStyle(e).fontSize);
        if (px < 12) forSmaa.push(e.tagName.toLowerCase() + "." + (e.className || "?") + " " + px.toFixed(1) + "px");
    }
    paastand("ingen synlig tekst under 12 px", !forSmaa.length, forSmaa.slice(0, 4).join(", "));

    var kortTekst = w.getComputedStyle(el("tr-for-tekst")).fontSize;
    paastand("kortets tekst er stor (" + kortTekst + ")", parseFloat(kortTekst) >= 24);

    /* Til sidst: standardsaettet igen, saa elevens valg ikke staar tilbage
       paa et proevesaet */
    vaelg("i:" + D.STANDARD);
    paastand("sættet kan vælges tilbage", B.valgt() === "i:" + D.STANDARD);
}
</script>
</body>
</html>
