<svg xmlns="http://www.w3.org/2000/svg" width="34" height="84" viewBox="0 0 34 84">
  <!-- Kuvette (1,00 cm). Animationen tegner vaesken BAG filen: det indre
       er x 7-27, fra vaeskeoverfladen y 18 til bunden y 80. De matterede
       sider (x 3-7 og 27-31) er dem, man holder paa. Bunden staar paa y 83. -->
  <path d="M3 4 L31 4 L31 82 L3 82 Z" fill="#dff0ff" fill-opacity="0.07"/>
  <!-- Matterede sider -->
  <rect x="3" y="4" width="4" height="78" fill="#eef3f8" fill-opacity="0.55"/>
  <rect x="27" y="4" width="4" height="78" fill="#eef3f8" fill-opacity="0.55"/>
  <!-- Kanten -->
  <path d="M3 4 L3 82 L31 82 L31 4" fill="none" stroke="#e3eef8" stroke-opacity="0.95" stroke-width="2" stroke-linejoin="round"/>
  <path d="M2 4 L32 4" stroke="#e3eef8" stroke-opacity="0.95" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Genskin paa den klare side -->
  <rect x="10" y="10" width="2" height="66" rx="1" fill="#ffffff" fill-opacity="0.35"/>
</svg>
