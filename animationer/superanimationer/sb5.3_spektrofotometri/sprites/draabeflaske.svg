<svg xmlns="http://www.w3.org/2000/svg" width="56" height="100" viewBox="0 0 56 100">
  <!-- Draabeflaske med reagens. Animationen skriver navnet paa etiketten
       (x 10-46, y 54-86). Spidsen af pipetten er (28, 2). Bunden staar
       paa y 98. -->
  <defs>
    <linearGradient id="brun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3415"/>
      <stop offset="0.35" stop-color="#8a5424"/>
      <stop offset="1" stop-color="#4a2a10"/>
    </linearGradient>
  </defs>
  <!-- Gummibolden og pipetten -->
  <path d="M22 26 L22 12 Q22 2 28 2 Q34 2 34 12 L34 26 Z" fill="#26272c" stroke="#111215" stroke-width="1.5"/>
  <!-- Skruelaaget -->
  <rect x="16" y="24" width="24" height="12" rx="2" fill="#1d1e22" stroke="#0e0f12" stroke-width="1.5"/>
  <!-- Flasken -->
  <path d="M19 36 L37 36 L37 42 Q50 46 50 58 L50 92 Q50 98 44 98 L12 98 Q6 98 6 92 L6 58 Q6 46 19 42 Z"
        fill="url(#brun)" stroke="#2e1a08" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Etiketten -->
  <rect x="10" y="54" width="36" height="32" rx="3" fill="#f4f1e8" stroke="#c9c3b2" stroke-width="1"/>
  <!-- Genskin -->
  <path d="M11 50 Q10 60 10 70" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>
</svg>
