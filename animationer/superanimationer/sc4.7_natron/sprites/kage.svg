<svg xmlns="http://www.w3.org/2000/svg" width="120" height="72" viewBox="0 0 120 72">
  <!-- Et stykke sukkerbroed paa en lille tallerken. Hullerne i kagen
       er CO₂ fra hævemidlet. Tallerkenen staar paa y 68. -->
  <defs>
    <linearGradient id="krumme" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dc92"/>
      <stop offset="1" stop-color="#e9c46a"/>
    </linearGradient>
    <linearGradient id="skorpe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8652a"/>
      <stop offset="1" stop-color="#c98a45"/>
    </linearGradient>
  </defs>
  <!-- Tallerkenen -->
  <ellipse cx="60" cy="63" rx="56" ry="8" fill="#dfe4ea" stroke="#9aa2ac" stroke-width="1"/>
  <ellipse cx="60" cy="61" rx="44" ry="5" fill="#f4f6f8"/>
  <!-- Kagestykket: en kile, set fra siden -->
  <path d="M22 60 L22 30 L98 22 L98 56 Z" fill="url(#krumme)" stroke="#b98a3a" stroke-width="1"/>
  <!-- Toppen med skorpe -->
  <path d="M22 30 Q60 18 98 22 L98 26 Q60 22 22 34 Z" fill="url(#skorpe)"/>
  <path d="M22 30 L30 22 Q64 12 104 16 L98 22 Q60 18 22 30 Z" fill="#c98a45" stroke="#8d5220" stroke-width="0.8"/>
  <!-- Flormelis -->
  <circle cx="48" cy="19" r="1.2" fill="#ffffff"/><circle cx="62" cy="17" r="1" fill="#ffffff"/>
  <circle cx="76" cy="17" r="1.3" fill="#ffffff"/><circle cx="88" cy="17" r="0.9" fill="#ffffff"/>
  <circle cx="38" cy="22" r="0.9" fill="#ffffff"/>
  <!-- Hullerne -->
  <g fill="#d3a84c">
    <ellipse cx="34" cy="42" rx="2.4" ry="1.8"/><ellipse cx="46" cy="50" rx="1.8" ry="1.4"/>
    <ellipse cx="55" cy="38" rx="2.8" ry="2"/><ellipse cx="66" cy="47" rx="2" ry="1.5"/>
    <ellipse cx="78" cy="36" rx="1.6" ry="1.2"/><ellipse cx="86" cy="46" rx="2.6" ry="1.9"/>
    <ellipse cx="41" cy="33" rx="1.4" ry="1.1"/><ellipse cx="92" cy="31" rx="1.5" ry="1.1"/>
    <ellipse cx="72" cy="53" rx="1.5" ry="1.1"/><ellipse cx="29" cy="53" rx="1.3" ry="1"/>
  </g>
</svg>
