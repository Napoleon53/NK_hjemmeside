<svg xmlns="http://www.w3.org/2000/svg" width="80" height="104" viewBox="0 0 80 104">
  <!-- Pulverglas med natron. Laaget er y 2-18, glasset y 18-100.
       Etiketten er x 10-70, y 40-82; teksten tegnes i filen.
       Bunden staar paa y 101. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb3c4" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#eef6fb" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#cfe0ec" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#8aa0b3" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="laag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f5d8f"/>
      <stop offset="0.45" stop-color="#4f95cc"/>
      <stop offset="1" stop-color="#1b4f7a"/>
    </linearGradient>
  </defs>
  <ellipse cx="40" cy="101" rx="34" ry="3" fill="#000000" fill-opacity="0.35"/>
  <!-- Pulveret i glasset -->
  <path d="M8 46 Q40 40 72 46 L72 94 Q72 99 67 99 L13 99 Q8 99 8 94 Z" fill="#f4f1ea"/>
  <!-- Glasset -->
  <path d="M8 22 L72 22 L72 94 Q72 100 66 100 L14 100 Q8 100 8 94 Z" fill="url(#glas)" stroke="#8fa4b6" stroke-width="1.3"/>
  <path d="M13 28 L13 92" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Laaget -->
  <rect x="5" y="4" width="70" height="17" rx="3" fill="url(#laag)" stroke="#143a5a" stroke-width="1"/>
  <path d="M9 9 L71 9 M9 13 L71 13 M9 17 L71 17" stroke="#9cc3e6" stroke-opacity="0.35" stroke-width="1"/>
  <!-- Etiketten -->
  <rect x="11" y="42" width="58" height="40" rx="2" fill="#fffdf6" stroke="#c9c2ad" stroke-width="0.8"/>
  <rect x="11" y="42" width="58" height="7" rx="2" fill="#d9534f"/>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <text x="40" y="61" font-size="11" font-weight="800" fill="#2a2f36">Natron</text>
    <text x="40" y="72" font-size="8.5" font-weight="700" fill="#3a4250">NaHCO₃</text>
    <text x="40" y="80" font-size="5.6" font-weight="600" fill="#6a7280">84,01 g/mol</text>
  </g>
</svg>
