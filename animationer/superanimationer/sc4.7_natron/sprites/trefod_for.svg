<svg xmlns="http://www.w3.org/2000/svg" width="170" height="160" viewBox="0 0 170 160">
  <!-- Trefodens forreste del: de to forreste ben, ringens forreste
       halvdel og porcelaenstrekantens forreste roer. Tegnes EFTER
       braenderen og diglen, saa diglen staar inde i trekanten. Samme maal
       som trefod_bag.svg: ringens midte (85, 22), rx 70, ry 12; det
       forreste roer i y 29 fra x 34 til 136. Benene staar paa y 157. -->
  <defs>
    <linearGradient id="jern" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f35"/>
      <stop offset="0.5" stop-color="#5d646d"/>
      <stop offset="1" stop-color="#2b2f35"/>
    </linearGradient>
    <linearGradient id="ler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#cfc6b2"/>
    </linearGradient>
  </defs>

  <!-- Skygger under de forreste ben -->
  <ellipse cx="10" cy="157" rx="9" ry="2.5" fill="#000000" fill-opacity="0.3"/>
  <ellipse cx="160" cy="157" rx="9" ry="2.5" fill="#000000" fill-opacity="0.3"/>

  <!-- De to forreste ben -->
  <path d="M22 30 L8 156" stroke="url(#jern)" stroke-width="6" stroke-linecap="round"/>
  <path d="M148 30 L162 156" stroke="url(#jern)" stroke-width="6" stroke-linecap="round"/>

  <!-- Ringens forreste halvdel -->
  <path d="M15 22 A70 12 0 0 0 155 22" fill="none" stroke="#5d646d" stroke-width="5"/>
  <path d="M20 25 A68 10 0 0 0 150 25" fill="none" stroke="#8a929b" stroke-width="1.2" opacity="0.6"/>

  <!-- Trekantens forreste roer og traadene, der haenger den paa ringen -->
  <path d="M34 29 Q24 31 17 27 M136 29 Q146 31 153 27" fill="none" stroke="#9aa1aa" stroke-width="1.6"/>
  <path d="M34 29 L136 29" stroke="#8d8570" stroke-width="7" stroke-linecap="round"/>
  <path d="M34 29 L136 29" stroke="#ebe3cf" stroke-width="5" stroke-linecap="round"/>
  <path d="M35 27.6 L135 27.6" stroke="#fffaf0" stroke-width="1.4" stroke-linecap="round"/>
</svg>
