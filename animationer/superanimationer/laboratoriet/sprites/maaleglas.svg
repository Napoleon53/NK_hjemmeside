  <path d="M10 6 L10 202 L34 202 L34 6 Z" fill="url(#glas)"/>
  <path d="M10 6 L10 202 L34 202 L34 6" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.5"/>
