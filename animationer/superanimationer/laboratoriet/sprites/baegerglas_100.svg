<svg xmlns="http://www.w3.org/2000/svg" width="144" height="220" viewBox="0 0 72 110">
  <!-- Baegerglas, 100 mL. Inderside x 6-66 fra y 6 til 104, 0,9 i hoejden
       pr. mL: 25 mL i y 81,5, 50 mL i y 59, 75 mL i y 36,5 og 100 mL i y 14.
       Aabningens midte er (36, 4), og tuden er (1, 3,5). Indholdet tegnes
       bag filen. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.34"/>
      <stop offset="0.14" stop-color="#d4ebfa" stop-opacity="0.07"/>
      <stop offset="0.85" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <path d="M4 5 L4 101 Q4 108 11 108 L61 108 Q68 108 68 101 L68 5 Z" fill="url(#glas)"/>
  <path d="M4 5 L4 101 Q4 108 11 108 L61 108 Q68 108 68 101 L68 5" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M6 6 L6 100 Q6 104 10 104 L62 104 Q66 104 66 100 L66 6" fill="none" stroke="#dcecf8" stroke-opacity="0.2" stroke-width="0.7"/>

  <!-- Kant med tud -->
  <path d="M0.5 3.5 Q1.5 0.8 5.5 2 L69 2 Q71 2 71 4 Q71 6 69 6 L5.5 6 Q2.5 6 0.5 3.5 Z" fill="#dcecf8" fill-opacity="0.26" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1"/>

  <!-- Genskin -->
  <rect x="10" y="12" width="3" height="84" rx="1.5" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Inddeling -->
  <g stroke="#eef6fc" stroke-opacity="0.8" stroke-width="1" stroke-linecap="round">
    <path d="M50 81.5 h12 M50 59 h12 M50 36.5 h12 M50 14 h12"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="6" font-weight="600" fill="#eef6fc" fill-opacity="0.78" text-anchor="end">
    <text x="48" y="83.5">25</text>
    <text x="48" y="61">50</text>
    <text x="48" y="38.5">75</text>
    <text x="48" y="16">100</text>
  </g>
  <text x="30" y="99" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5.6" font-weight="600" fill="#eef6fc" fill-opacity="0.6">100 mL</text>
</svg>
