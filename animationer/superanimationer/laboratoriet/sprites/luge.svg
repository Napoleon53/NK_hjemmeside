<svg xmlns="http://www.w3.org/2000/svg" width="340" height="320" viewBox="0 0 170 160">
  <!-- Gennemraekningsskab (luge) mellem to rum. Glas stilles paa hylden
       (y 132) inde i aabningen x 22-148. Knappen og lampen tegnes af
       animationen ved x 152-166, y 60-100. -->
  <defs>
    <linearGradient id="kabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c1ca"/>
      <stop offset="1" stop-color="#7f8894"/>
    </linearGradient>
    <linearGradient id="indre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d23"/>
      <stop offset="1" stop-color="#2b3039"/>
    </linearGradient>
    <linearGradient id="hylde" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d96a2"/>
      <stop offset="0.5" stop-color="#dfe5ea"/>
      <stop offset="1" stop-color="#7f8894"/>
    </linearGradient>
  </defs>
  <!-- Kabinettet -->
  <rect x="2" y="2" width="166" height="156" rx="5" fill="url(#kabinet)" stroke="#5f6874" stroke-width="1.2"/>
  <path d="M6 6 L164 6" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1"/>
  <!-- Aabningen -->
  <rect x="18" y="26" width="132" height="112" rx="3" fill="#4a525c"/>
  <rect x="22" y="30" width="126" height="106" fill="url(#indre)"/>
  <!-- Bagvaeggen: lys stribe fra det andet rum -->
  <rect x="30" y="38" width="110" height="88" fill="#22262e" stroke="#3a4049" stroke-width="1"/>
  <rect x="34" y="42" width="102" height="4" fill="#fff8e1" fill-opacity="0.35"/>
  <!-- Hylden -->
  <rect x="22" y="128" width="126" height="8" fill="url(#hylde)" stroke="#5f6874" stroke-width="0.8"/>
  <!-- Sidepanel med knap -->
  <rect x="152" y="30" width="14" height="106" rx="2" fill="#6b747f"/>
  <!-- Fodliste -->
  <rect x="2" y="150" width="166" height="8" fill="#5f6874"/>
  <!-- Skilt -->
  <rect x="40" y="10" width="90" height="12" rx="2" fill="#2f343b"/>
</svg>
