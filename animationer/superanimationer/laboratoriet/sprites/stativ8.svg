      <stop offset="0" stop-color="#d9ac72"/>
      <stop offset="1" stop-color="#a8773f"/>
    </linearGradient>
    <linearGradient id="stolpe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c6d38"/>
      <stop offset="0.5" stop-color="#d4a66c"/>
      <stop offset="1" stop-color="#946634"/>
    </linearGradient>
  </defs>
  <rect x="4" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="348" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="0" y="88" width="362" height="12" rx="2" fill="url(#trae)"/>
  <g fill="#6b4520" fill-opacity="0.6">
