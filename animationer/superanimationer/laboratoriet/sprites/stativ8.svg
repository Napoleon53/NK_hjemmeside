    <ellipse cx="286" cy="89" rx="10" ry="2"/>
    <ellipse cx="328" cy="89" rx="10" ry="2"/>
  </g>
  <rect x="0" y="20" width="362" height="14" rx="2" fill="url(#trae)"/>
  <path d="M2 21.5 h358" stroke="#f0cf9e" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M10 27 q30 -2 60 1 t70 -1 t70 1 t70 -1 t70 1 M8 30.5 q40 2 80 -1 t80 1 t100 -1 t80 1" fill="none" stroke="#9a6a36" stroke-opacity="0.45" stroke-width="0.8"/>
