<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc7.1 Syre-base-reaktioner</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at formlerne og ladningerne passer, at hver
   struktur opfylder oktetreglen før og efter hydronen er flyttet, at
   modellen udpeger den samme syre som opgaverne, at træningens par
   bevarer H og ladning, at de forkerte svar aldrig er rigtige, at
   mærkaterne vurderes rigtigt, at alle tre faner kan gennemføres (også
   med musen), at Kemichael kommer, når han skal, at sproget overholder
   reglerne, og at layoutet holder fra 520 × 380 til 1500 × 900.

   Kræver en lokal server med animationer/ som rod (Kemichael hentes
   derfra). Testen gemmer elevens fremskridt og lægger det tilbage.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sc7.1-hydron", "nk-sc7.1-produkter", "nk-sc7.1-par", "nk-sc7.1-niveau",
    "nk-sc7.1-intro-hydron", "nk-sc7.1-intro-produkter", "nk-sc7.1-intro-par", "nk-kemichael"];
var gemt = {};
try { NOEGLER.forEach(function (n) { gemt[n] = localStorage.getItem(n); localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }

var ramme = document.getElementById("ramme");
ramme.addEventListener("load", function () { setTimeout(koer, 1500); });
ramme.src = "index.html";

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) localStorage.removeItem(n); else localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    function tik(sim, sek) {
        var n = Math.round(sek * 60);
        for (var i = 0; i < n; i++) { sim.tilpas(); sim.opdater(1 / 60); }
        sim.tegn();
    }
    function klik(sel) { var e = d.querySelector(sel); if (e) e.click(); return !!e; }
    function mus(sim, type, x, y) {
        var r = sim.L.canvas.getBoundingClientRect();
        var e = new W.PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, pointerId: 1, bubbles: true, isPrimary: true, button: 0 });
        sim.L.canvas.dispatchEvent(e);
    }
    function traek(sim, x0, y0, x1, y1) {
        mus(sim, "pointerdown", x0, y0);
        for (var i = 1; i <= 8; i++) mus(sim, "pointermove", x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8);
        mus(sim, "pointerup", x1, y1);
    }
    function vises(el) { return !!el && W.getComputedStyle(el).display !== "none" && !el.closest("[hidden]"); }
    function ingenScene(sim) { return !(sim.laerer && sim.laerer.scene); }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, S = NK.Syrebase, M = NK.Mol;
    paastand("data.js og model.js er kørt", !!(D && D.FAM && S && M));
    paastand("alle tre faner er bygget", !!(NK.sims && NK.sims["fane-hydron"] && NK.sims["fane-produkter"] && NK.sims["fane-par"]));
    var sprites = ["kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("Kemichaels " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var A = NK.sims["fane-hydron"], B = NK.sims["fane-produkter"], C = NK.sims["fane-par"];
    paastand("teorien er lukket fra start", !d.getElementById("teori").classList.contains("vis"));

    overskrift("2. Formlerne og rollerne");
    var ventet = { "cl:1": "HCl", "cl:0": "Cl⁻", "vand:3": "H₃O⁺", "vand:2": "H₂O", "vand:1": "OH⁻", "nh:4": "NH₄⁺", "nh:3": "NH₃",
        "ac:1": "CH₃COOH", "ac:0": "CH₃COO⁻", "po4:3": "H₃PO₄", "po4:1": "HPO₄²⁻", "po4:0": "PO₄³⁻", "co3:1": "HCO₃⁻",
        "co3:0": "CO₃²⁻", "so4:1": "HSO₄⁻", "no3:0": "NO₃⁻", "fo:1": "HCOOH" };
    var forkerteF = Object.keys(ventet).filter(function (id) { return S.formel(id) !== ventet[id]; });
    paastand("formlerne skrives som i bogen (" + Object.keys(ventet).length + " stk.)", forkerteF.length === 0, forkerteF.map(function (id) { return S.formel(id); }).join(" "));
    paastand("ladning ±1 skrives uden 1", S.formel("cl:0") === "Cl⁻" && S.formel("vand:3") === "H₃O⁺" && S.formel("cl:0", 1) === "Cl⁺");
    D.HYDRON.forEach(function (o, i) {
        var r = S.roller(o.a, o.b);
        paastand("reaktion " + (i + 1) + ": modellen siger, at " + S.formel(o.syre) + " er syren", !!r && r.syre === o.syre, r && r.syre);
    });
    paastand("H₂O er base over for HCl og syre over for NH₃", S.roller("cl:1", "vand:2").base === "vand:2" && S.roller("nh:3", "vand:2").syre === "vand:2");
    paastand("HCO₃⁻ + H₂O er for tvetydig til træningen", !S.gyldig("co3:1", "vand:2"));
    paastand("HCO₃⁻ + CO₃²⁻ er ingen reaktion", !S.gyldig("co3:1", "co3:0"));
    paastand("NH₄⁺ + CH₃COO⁻ forløber ikke og er ikke med", !S.gyldig("nh:4", "ac:0"));
    paastand("SO₄²⁻ + H₂O er for svag til at være med", !S.gyldig("so4:0", "vand:2"));
    paastand("H₃O⁺ + OH⁻ er med", !!S.gyldig("vand:3", "vand:1"));
    var antal = {}, brud = [];
    D.NIVEAU_RAEKKE.forEach(function (n) {
        var par = S.par(n);
        antal[n] = par.length;
        par.forEach(function (p) {
            var o = S.opgave(p.roller.syre, p.roller.base, true);
            var h = S.del(o.syre).n + S.del(o.base).n - S.del(o.kb).n - S.del(o.ks).n;
            var q = S.ladning(o.syre) + S.ladning(o.base) - S.ladning(o.kb) - S.ladning(o.ks);
            if (h || q || !S.findes(o.kb) || !S.findes(o.ks)) brud.push(o.noegle);
            var medVand = p.a === "vand:2" || p.b === "vand:2";
            if (n === "let" && !medVand) brud.push("let uden vand " + p.noegle);
            if (n === "middel" && medVand) brud.push("middel med vand " + p.noegle);
            if (n === "svaer" && D.NIVEAUER.svaer.flere.indexOf(p.a) < 0 && D.NIVEAUER.svaer.flere.indexOf(p.b) < 0) brud.push("svær uden flere " + p.noegle);
        });
    });
    paastand("Let " + antal.let + ", Middel " + antal.middel + " og Svær " + antal.svaer + " reaktioner (mindst 10 hver)", antal.let >= 10 && antal.middel >= 10 && antal.svaer >= 10);
    paastand("hver træningsreaktion bevarer H og ladning og passer til sit niveau", brud.length === 0, brud.slice(0, 4).join("; "));

    overskrift("3. Strukturerne");
    function tjekMol(m) {
        var galt = [];
        m.atomer.forEach(function (a, i) {
            if (a.vaek || a.gruppe) return;
            var e = M.elektroner(m, i), maal = a.s === "H" ? 2 : 8;
            var ok = (a.s === "P" || a.s === "S") ? e >= 8 : e === maal;
            if (!ok || M.frie(m, i) % 1) galt.push(a.s + i + " har " + e);
        });
        var p = S.del(m.art), kerneH = D.KERNE_H[p.fam] || 0;
        if (M.hAntal(m) - kerneH !== p.n) galt.push("H passer ikke med " + m.art);
        if (M.ladning(m) !== S.ladning(m.art)) galt.push("ladningen passer ikke med " + m.art);
        return galt;
    }
    var strukGalt = [];
    Object.keys(D.STRUKTUR).forEach(function (id) { strukGalt = strukGalt.concat(tjekMol(M.lav(id, false)), tjekMol(M.lav(id, true))); });
    paastand("alle " + Object.keys(D.STRUKTUR).length + " strukturer: oktet (duet for H), rigtig ladning og antal H", strukGalt.length === 0, strukGalt.slice(0, 3).join("; "));
    var overGalt = [], antalOver = 0;
    D.HYDRON.forEach(function (o) {
        var base = o.a === o.syre ? o.b : o.a;
        M.loseH(M.lav(o.syre, false)).forEach(function (h) {
            var ms = M.lav(o.syre, false), info = M.fjernH(ms, h);
            if (ms.art !== S.korr(o.syre, -1)) overGalt.push("syren blev " + ms.art);
            overGalt = overGalt.concat(tjekMol(ms));
            M.modtagere(M.lav(base, true)).forEach(function (a) {
                M.parVinkler(M.lav(base, true), a).forEach(function (v) {
                    var mb = M.lav(base, true);
                    M.tilfoejH(mb, a, v);
                    antalOver++;
                    if (mb.art !== S.korr(base, 1)) overGalt.push("basen blev " + mb.art);
                    overGalt = overGalt.concat(tjekMol(mb));
                });
            });
            M.tilbage(ms, info);
            if (ms.art !== o.syre || tjekMol(ms).length) overGalt.push("tilbage " + o.syre);
        });
    });
    paastand("hver hydron kan flyttes til hvert frit par (" + antalOver + " måder), og begge sider holder oktetreglen", overGalt.length === 0, overGalt.slice(0, 3).join("; "));
    var ac = M.lav("ac:1", false);
    paastand("eddikesyre: 1 H kan tages, 3 H på C sidder fast", M.loseH(ac).length === 1 && M.fasteH(ac).length === 3);
    paastand("OH⁻ tager imod med O, og CH₃COO⁻ med det negative O", M.modtagere(M.lav("vand:1")).length === 1 &&
        (function () { var m = M.lav("ac:1"); M.fjernH(m, 7); var r = M.modtagere(m); return r.length === 1 && m.atomer[r[0]].q === -1; }()));

    overskrift("4. De forkerte svar og mærkaterne");
    var fkGalt = [], fkFaa = [];
    D.NIVEAU_RAEKKE.forEach(function (n) {
        S.par(n).forEach(function (p) {
            var o = S.opgave(p.roller.syre, p.roller.base, true), fk = S.forkerte(o);
            var rig = [S.formel(o.kb), S.formel(o.ks)];
            if (fk.length < 4) fkFaa.push(o.noegle + " " + fk.length);
            fk.forEach(function (f) { if (rig.indexOf(f.f) >= 0 || !f.hvorfor) fkGalt.push(f.f); });
        });
    });
    paastand("hver reaktion har mindst fire forkerte svar", fkFaa.length === 0, fkFaa.slice(0, 3).join("; "));
    paastand("et forkert svar er aldrig et af de rigtige, og det har en forklaring", fkGalt.length === 0, fkGalt.slice(0, 3).join(" "));
    var fkHCl = S.forkerte(S.opgave("cl:1", "vand:2", true)).map(function (f) { return f.f; });
    paastand("HCl + H₂O: Cl, Cl⁺, H₃O, OH⁻ og H₂Cl⁺ er blandt de forkerte", ["Cl", "Cl⁺", "H₃O", "OH⁻", "H₂Cl⁺"].every(function (f) { return fkHCl.indexOf(f) >= 0; }), fkHCl.join(" "));
    var fkP = S.forkerte(S.opgave("po4:3", "vand:2", true)).map(function (f) { return f.f; });
    paastand("H₃PO₄ + H₂O: HPO₄²⁻ (to hydroner) er blandt de forkerte", fkP.indexOf("HPO₄²⁻") >= 0);
    var mkGalt = [];
    D.NIVEAU_RAEKKE.forEach(function (n) {
        S.par(n).forEach(function (p) {
            var o = S.opgave(p.roller.syre, p.roller.base, true), arter = o.reaktanter.concat(o.produkter);
            S.MAERKER.forEach(function (mk) {
                arter.forEach(function (id, k) {
                    var ret = S.maerkeArt(o, mk);
                    var rigtig = (k < 2) === (mk === "syre" || mk === "base") && S.formel(ret) === S.formel(id);
                    var svar = S.maerkeFejl(o, mk, id, k < 2);
                    if (rigtig !== (svar === "")) mkGalt.push(o.noegle + " " + mk + " på " + id);
                });
            });
        });
    });
    paastand("hvert mærkat på hvert stof vurderes rigtigt, og et forkert får en forklaring", mkGalt.length === 0, mkGalt.slice(0, 3).join("; "));
    var oH2O = S.opgave("vand:3", "vand:1", true);
    paastand("H₃O⁺ + OH⁻: begge H₂O kan få korresp. base og korresp. syre", S.maerkeFejl(oH2O, "kb", "vand:2", false) === "" && S.maerkeFejl(oH2O, "ks", "vand:2", false) === "");
    paastand("syre på H₂O over for HCl forklarer, at H₂O her tager imod", /tager den imod/.test(S.maerkeFejl(S.opgave("cl:1", "vand:2", true), "syre", "vand:2", true)));

    overskrift("5. Fane 1: Hydronen");
    function videre(sim) { return sim.el.skort.querySelector("[data-videre]"); }
    function kortTekst(sim) { var e = sim.el.skort.querySelector(".sk-tekst"); return e ? e.textContent : ""; }
    klik('[data-fane="fane-hydron"]');
    tik(A, 0.5);
    var tilbudA = d.getElementById("hydron-tilbud");
    paastand("tilbuddet om præsentationen står der første gang", vises(tilbudA));
    klik("#hydron-tilbud .tilbud-nej");
    paastand("Nej tak fjerner knapperne", !vises(tilbudA));
    A.nyOpgave(0); tik(A, 0.3);
    var kA = A.el.skort;
    paastand("papirkortet står øverst i scenen, ikke i panelet", !!kA && !!kA.closest(".scene") && !kA.closest(".panel") && kA.offsetTop <= 12 &&
        d.body.classList.contains("papirkort"));
    paastand("der er ingen linje nederst i scenen og intet opgavekort i panelet", !d.querySelector(".scene-mrk") && !d.querySelector(".statuslinje") &&
        !d.querySelector(".panel .opgavekort") && !d.querySelector(".panel #hydron-knap"));
    paastand("kortet har etiketten Reaktion 1 af 10 og opgaven", /^Reaktion 1 af 10/.test(kortTekst(A)) && /Træk et H over på den anden partikel/.test(kortTekst(A)), kortTekst(A));
    paastand("Giv hint er en stille knap med gul kant på kortet", vises(A.el.knap) && A.el.knap.classList.contains("hjaelp") && !!A.el.knap.closest("#hydron-skort"));
    paastand("Indsend svar er grå, før hydronen er flyttet", vises(A.el.indsend) && A.el.indsend.classList.contains("ikke-klar"));
    klik("#hydron-indsend"); tik(A, 0.1);
    paastand("Indsend svar uden noget at sende: kortet blinker, og intet bedømmes", kA.classList.contains("blink") && !A.loest);
    paastand("Start forfra står ikke på kortet", !/forfra/i.test(kA.textContent) && !!d.querySelector(".panel #hydron-forfra"));
    paastand("første reaktion er HCl + H₂O med HCl til venstre", A.ids[0] === "cl:1" && A.ids[1] === "vand:2" && A.syreSide === 0);
    var hH = M.loseH(A.mols[0])[0], fra = A.atomPx(0, hH), til = A.parVed(1, fra);
    traek(A, fra.x, fra.y, til.x, til.y);
    tik(A, 0.8);
    paastand("et H sluppet på vandet bedømmes ikke af sig selv: det venter ved et frit elektronpar", !A.loest && !!A.parkeret &&
        A.mols[1].art === "vand:2" && A.el.indsend.classList.contains("klar"));
    var pp = A.parkPx(A.parkeret);
    mus(A, "pointerdown", pp.x, pp.y); mus(A, "pointerup", pp.x, pp.y);
    tik(A, 0.3);
    paastand("et klik på den ventende hydron sender den hjem", !A.parkeret && !A.loest && A.mols[0].art === "cl:1" && A.el.indsend.classList.contains("ikke-klar"));
    hH = M.loseH(A.mols[0])[0]; fra = A.atomPx(0, hH); til = A.parVed(1, fra);
    traek(A, fra.x, fra.y, til.x, til.y);
    tik(A, 0.8);
    klik("#hydron-indsend");
    tik(A, 0.8);
    paastand("Indsend svar: et H fra HCl over på vandet giver Cl⁻ og H₃O⁺", A.loest && A.mols[0].art === "cl:0" && A.mols[1].art === "vand:3");
    paastand("Cl⁻ har fire frie par og H₃O⁺ ét", M.frie(A.mols[0], 0) === 4 && M.frie(A.mols[1], 0) === 1);
    paastand("parkortet viser HCl / Cl⁻ og H₃O⁺ / H₂O", /HCl \/ Cl⁻/.test(d.getElementById("hydron-parliste").textContent) &&
        /H₃O⁺ \/ H₂O/.test(d.getElementById("hydron-parliste").textContent));
    var bliv = kA.querySelector(".sk-bund.bliv");
    paastand("kortet bliver på opgaven med forklaringen, og Næste reaktion står, hvor Indsend svar stod",
        /^Reaktion 1 af 10/.test(kortTekst(A)) && !!bliv && /HCl afgav en hydron/.test(bliv.textContent) && !!videre(A) &&
        videre(A).textContent === "Næste reaktion →" && !vises(A.el.indsend) && !vises(A.el.knap), bliv && bliv.textContent);
    mus(A, "pointerdown", fra.x, fra.y); mus(A, "pointerup", fra.x, fra.y);
    paastand("et klik på partiklerne, mens kortet venter på Næste, får kortet til at blinke", kA.classList.contains("blink"));
    videre(A).click(); tik(A, 0.3);
    paastand("Næste reaktion går til reaktion 2", A.opgNr === 1 && !A.loest && !kA.querySelector(".sk-bund.bliv"));
    /* Eddikesyre: H paa C sidder fast */
    A.nyOpgave(2); tik(A, 0.3);
    var sA = A.syreSide, fastH = M.fasteH(A.mols[sA])[0], pF = A.atomPx(sA, fastH);
    mus(A, "pointerdown", pF.x, pF.y); mus(A, "pointerup", pF.x, pF.y);
    tik(A, 0.1);
    paastand("et H på C ryster og sidder fast", !A.hold && A.ryst && M.hAntal(A.mols[sA]) === 4 && /bliver siddende/.test(A.el.besked.textContent));
    /* Ammoniak og vand: forkert vej og saa den rigtige */
    A.nyOpgave(3); tik(A, 0.3);
    var sN = A.ids.indexOf("nh:3"), sV = 1 - sN;
    var hN = M.loseH(A.mols[sN])[0], pN = A.atomPx(sN, hN), tilV = A.parVed(sV, pN);
    traek(A, pN.x, pN.y, tilV.x, tilV.y);
    tik(A, 0.5);
    paastand("et H fra NH₃ sluppet på vandet venter på Indsend svar uden en forklaring", !!A.parkeret && !A.loest && !/skidt/.test(A.el.status.className));
    klik("#hydron-indsend");
    tik(A, 0.1);
    var besked = A.el.besked.textContent;
    tik(A, 1.5);
    paastand("Indsend svar: et H fra NH₃ flyver hjem med en forklaring, og hintknappen lyser op", !A.loest && A.mols[sN].art === "nh:3" && A.mols[sV].art === "vand:2" &&
        /NH₃ afgiver ikke en hydron/.test(besked) && /skidt/.test(A.el.status.className) && A.el.knap.classList.contains("peg"), besked);
    var hV = M.loseH(A.mols[sV])[0], pV = A.atomPx(sV, hV), tilN = A.parVed(sN, pV);
    traek(A, pV.x, pV.y, tilN.x, tilN.y);
    tik(A, 0.8);
    A.enter(); tik(A, 0.8);
    paastand("et H fra vandet over på NH₃ og Enter (Indsend svar) giver NH₄⁺ og OH⁻", A.loest && A.mols[sN].art === "nh:4" && A.mols[sV].art === "vand:1");
    /* Sluppet i tomrummet: tilbage */
    A.nyOpgave(4); tik(A, 0.3);
    var sC = A.syreSide, hC = M.loseH(A.mols[sC])[0], pC = A.atomPx(sC, hC);
    traek(A, pC.x, pC.y, pC.x, A.lay.mol.y + 2);
    tik(A, 1);

    });
    paastand("forklaringerne ved et forkert svar er højst 110 tegn (" + laengstProd.length + " og " + laengstPar.length + ")", laengstProd.length <= 110 && laengstPar.length <= 110, laengstProd + " | " + laengstPar);
    [[1400, 860], [1100, 700]].forEach(function (st) {
        ramme.style.width = st[0] + "px";
        ramme.style.height = st[1] + "px";
        var hoejst = 0, pr = [];
        function maal(sim, hvor) {
            sim.tegn();
            var h = sim.el.skort.offsetHeight;
            hoejst = Math.max(hoejst, h);
            if (h > sim.kortZone()) pr.push(hvor + " " + h + " > " + sim.kortZone());
        }
        klik('[data-fane="fane-hydron"]');
        D.HYDRON.forEach(function (o, nr) {
            A.nyOpgave(nr); tik(A, 0.1); maal(A, "fane 1 reaktion " + (nr + 1));
            A.besked(NK.Skort.maerke("Ikke endnu", NK.html(A.forkertVej())), "skidt"); maal(A, "fane 1 fejl " + (nr + 1));
            A.knap(); maal(A, "fane 1 hint " + (nr + 1));
            A.knap(); tik(A, 2); maal(A, "fane 1 svaret " + (nr + 1));
            A.vist = false; A.visKort(); maal(A, "fane 1 rigtigt " + (nr + 1));
        });
        [["fane-produkter", B], ["fane-par", C]].forEach(function (x) {
            klik('[data-fane="' + x[0] + '"]');
            var sim = x[1];
            D.NIVEAU_RAEKKE.forEach(function (niv) {
                S.saetNiveau(niv);
                for (var g = 0; g < 6; g++) {
                    sim.nyOpgave(); tik(sim, 0.05); maal(sim, x[0] + " " + niv);
                    sim.knap(); maal(sim, x[0] + " hint " + niv);
                    sim.besked(NK.Skort.maerke("Ikke endnu", NK.html(x[0] === "fane-par" ? laengstPar + " 1 mærkat mere passede ikke." : laengstProd + " Det andet produkt passede heller ikke.")), "skidt");
                    maal(sim, x[0] + " fejl " + niv);
                    sim.knap(); tik(sim, 0.05); maal(sim, x[0] + " svaret " + niv);
                }
            });
        });
        paastand("ved " + st[0] + " × " + st[1] + " er kortet højst " + hoejst + " px og holder sig i kortZone", pr.length === 0, pr.slice(0, 3).join("; "));
    });
    S.saetNiveau("let");
    ramme.style.width = "";
    ramme.style.height = "";
    klik('[data-fane="fane-hydron"]');
}
