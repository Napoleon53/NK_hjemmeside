<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - sc6.9 Fedt i chips</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem med de
   samme funktioner, som klik og knapper bruger: modellen, raekke-
   foelgen, heptan med og uden skylning, vand, bunsenbraenderen,
   iagttagelserne, beregningen og den guidede hjaelp, paaskeaeggene,
   branden, quizzen, sproget og ion-notationen.
   Skal aabnes gennem en lokal server (Chrome afviser iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    var i;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("introen aabner og lukker", !!NK.intro && (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) && (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    paastand("forsoeg og quiz er bygget", !!(NK.forsoeg && NK.quiz));
    Object.keys(NK.Sprites.FILER).forEach(function (n) {
        paastand("sprite " + n + " er indlaest", NK.Sprites.klar(n));
    });

    var M = NK.Model, f = NK.forsoeg, S = NK.Scene;
    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) f.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function nyt() { NK.nytForsoeg(); adv(0.1); }
    function afvej() {
        var n = 0;
        while (f.chipsMasse() + f.iLuften < 4.6 && n++ < 30) { f.klik("pose"); adv(0.6); }
        adv(0.8);
        f.klik("vejebaad"); adv(4);
    }
    function tilFiltrat(opt) {
        nyt();
        afvej();
        f.arbejdKnap(true); adv(opt.knusTid || 3.5); f.arbejdKnap(false); adv(0.5);
        f.klik("morter"); adv(5.5);
        f.slipTil(opt.midl, "baegerA"); adv(4.5);
        f.arbejdKnap(true); adv(opt.roerTid || 6); f.arbejdKnap(false); adv(1);
        f.klik("skaal"); adv(5);
        f.klik("baegerA"); adv(10);
        if (opt.skyl) { f.slipTil(opt.midl, "tragt"); adv(8); }
    }
    function helt(opt) {
        tilFiltrat(opt);
        if (opt.trefod) { f.klik("braender"); adv(0.3); f.klik("trefod"); }
        else f.klik("skaal");
        adv(3);
        vent(function () { return f.gjort.inddamp || !!f.uheld; }, 40);
        if (f.braenderTaendt) { f.klik("braender"); }
        adv(8);
        f.klik("skaal"); adv(4.5);
        return f.mBF !== null ? M.fedtprocent(f.mChips, f.mB, f.mBF) : null;
    }
    function svar(tekst) {
        d.getElementById("svar").value = tekst;
        NK.tjek();
        return d.getElementById("beregn-hint").hidden ? "" : d.getElementById("beregn-hint").textContent;
    }
    function komma(x) { return String(Math.round(x * 10) / 10).replace(".", ","); }
    function iagttagelser() {
        return Array.prototype.map.call(d.querySelectorAll("#iagttagelse-liste li:not(.tom)"), function (li) { return li.textContent; });
    }

    overskrift("2. Modellen");
    paastand("uden roering er intet opløst", M.roerGrad(1, 0) === 0);
    paastand("roering og knusning oeger ekstraktionen", M.ekstraktion(M.MIDLER.heptan, 1, 4).fedt > M.ekstraktion(M.MIDLER.heptan, 0.5, 4).fedt && M.ekstraktion(M.MIDLER.heptan, 1, 4).fedt > M.ekstraktion(M.MIDLER.heptan, 1, 1).fedt);
    paastand("vand opløser intet fedt, men salt", M.ekstraktion(M.MIDLER.vand, 1, 10).fedt === 0 && M.ekstraktion(M.MIDLER.vand, 1, 10).salt > 0.9);
    paastand("heptan opløser intet salt", M.ekstraktion(M.MIDLER.heptan, 1, 10).salt === 0);
    paastand("skylning giver mere fedt med", M.opsamlet(1, true) > M.opsamlet(1, false));
    paastand("5,00 g chips og 1,60 g fedt giver 32 %", Math.abs(M.fedtprocent(5, 50, 51.6) - 32) < 1e-9);
    paastand("komma-format 4,50", M.komma(4.5) === "4,50" && M.komma(-0.001) === "0,00");
    var T = function (s) { return M.tjek(s, 5, 50, 51.6).slags; };
    paastand("tjek: 32 og 32,0 % er rigtige", T("32") === "rigtig" && T("32,0 %") === "rigtig" && T(" 31.8") === "rigtig");
    paastand("tjek: 0,32 er en brøkdel", T("0,32") === "broek");
    paastand("tjek: 1,6 er massen i gram", T("1,6") === "gram");
    paastand("tjek: 1032 mangler at trække skålen fra", T("1032") === "baeger");
    paastand("tjek: 312,5 er divideret omvendt", T("312,5") === "omvendt");
    paastand("tjek: tomt og tekst er tomt", T("") === "tom" && T("abc") === "tom");
    paastand("tjek: 17 er en anden fejl", T("17") === "andet");

    overskrift("3. Raekkefoelge");
    nyt();
    paastand("morteren er tom foer afvejning", f.klik("morter") === false);
    paastand("flaskerne kan ikke bruges foer chipsene er i glasset", f.slipTil("heptan", "baegerA") === false && !f.midl);
    paastand("petriskaalen kan ikke vejes, mens vejebaaden staar paa vaegten", f.klik("skaal") === false);
    paastand("vejebaaden uden chips giver ingen overfoersel", f.klik("vejebaad") === false);
    f.klik("pose"); adv(0.8);
    paastand("en chip lander i vejebaaden", f.chips.length === 1 && f.vaegtMaal() > 0.3);
    paastand("under 4,5 g kan der ikke haeldes i morteren", f.klik("vejebaad") === false && !f.gjort.afvej);
    f.chips = [{ m: 2, dx: 0, dy: 0, a: 0, s: 1 }, { m: 2, dx: 0, dy: 0, a: 0, s: 1 }, { m: 1.9, dx: 0, dy: 0, a: 0, s: 1 }];
    paastand("over 5,5 g laegges en chip tilbage", f.klik("vejebaad") === true && f.chips.length === 2);
    adv(1);
    f.chips.push({ m: 0.8, dx: 0, dy: 0, a: 0, s: 1 });
    paastand("4,8 g kan haeldes i morteren", f.klik("vejebaad") === true);
    adv(4);
    paastand("chipsenes masse er noteret", f.gjort.afvej && f.mChips === 4.8);
    paastand("ukrummede chips kan ikke haeldes over", f.klik("morter") === false);
    for (i = 0; i < Math.ceil(M.KNUS.vej / 40) + 2; i++) { f.knus(40, 2900); f.opdater(1 / 60); }
    paastand("voldsom knusning taber krummer, men laereren kommer ikke", f.krummerUd > 0 && f.mTab > 0 && !f.laerer.scene, f.krummerUd + " krummer");
    paastand("knust helt", f.knust === 1);
    f.klik("morter"); adv(5.5);
    paastand("chipsene er i baegerglasset, og pistillen staar i morteren igen", f.gjort.overfoer && f.g.baegerA.krummer.length > 10 && Math.abs(f.g.pistil.p.x - f.g.pistil.hjem.x) < 1);
    paastand("de fleste krummer rammer glasset, og hver krumme er talt", f.g.baegerA.krummer.length + f.krummerSpildt === 24 && f.krummerSpildt <= 6, f.krummerSpildt + " ved siden af");
    paastand("krummer ved siden af bliver liggende paa bordet", f.flyvende.filter(function (k) { return k.spild && k.hvile && Math.abs(k.y - (S.BORD - 1)) < 1; }).length === f.krummerSpildt);
    paastand("et klik paa flasken haelder ikke", f.klik("heptan") === false && !f.midl && !f.handling);
    f.slipTil("heptan", "baegerA"); adv(4.5);
    paastand("heptanen er haeldt i", f.midl === "heptan" && f.g.baegerA.areal === M.VOLUMEN);
    paastand("den anden flaske afvises", f.slipTil("vand", "baegerA") === false);
    paastand("uden roering kan der ikke filtreres", f.roerGrad() < M.ROER.min && f.klik("baegerA") === false);
    f.arbejdKnap(true); adv(2.2); f.arbejdKnap(false); adv(0.5);
    paastand("uden vejet petriskaal kan der ikke filtreres", f.klik("baegerA") === false && !f.handling);
    f.klik("skaal"); adv(5);
    paastand("petriskaalen er vejet og staar under tragten", f.mB === f.skaalMasse && f.g.skaal.sted === "tragt");
    paastand("m(tom petriskål) staar i maaleskemaet", d.getElementById("m-b").textContent === M.komma(f.mB) + " g");
    f.klik("baegerA"); adv(10);
    paastand("filtreret, og der er filtrat i skaalen", f.gjort.filtrer && f.g.skaal.fyld > 0.5, f.g.skaal.fyld.toFixed(2));
    f.klik("skaal"); adv(3);
    paastand("skaalen kan ikke vejes foer inddampningen er faerdig", f.klik("skaal") === false);
    vent(function () { return f.gjort.inddamp; }, 30);
    paastand("inddampet", f.gjort.inddamp && f.g.skaal.fyld === 0 && f.g.skaal.fedt > 0.3);
    paastand("tager man fat i den varme skaal, rykker haanden til", f.temp > 40 && f.klik("skaal") === true && f.mBF === null);
    adv(1);
    paastand("skaalen staar paa varmepladen igen, og laereren kigger ind", f.g.skaal.sted === "plade" && !f.handling && !!(f.laerer.scene && f.laerer.scene.navn === "varmSkaal"));
    vent(function () { return !f.laerer.scene && f.temp <= 40; }, 20);
    paastand("en afkoelet skaal kan vejes", f.klik("skaal") === true);
    adv(4.5);
    paastand("tabte krummer giver et lavere resultat", f.mBF !== null && M.fedtprocent(f.mChips, f.mB, f.mBF) < 29.5, komma(M.fedtprocent(f.mChips, f.mB, f.mBF)) + " %");

    overskrift("4. Iagttagelser (fejlkilder)");
    var ia = iagttagelser();
    paastand("krummer, kort roering og vaadt filter er noteret", f.iagttaget.krummer && f.iagttaget.kortRoer && f.iagttaget.vaad && ia.length === 3 + (f.iagttaget.spild ? 1 : 0), ia.join(" | "));
    paastand("ingen forsoegsnumre i listen", !/\bF\d/.test(ia.join(" ")));
    nyt();
    paastand("nyt forsoeg rydder listen", iagttagelser().length === 0);

    overskrift("5. Resultater og beregning");
    var uden = helt({ midl: "heptan" });
    paastand("heptan uden skylning: 27 til 30,5 %", uden !== null && uden > 27 && uden < 30.5, uden && komma(uden) + " %");
    paastand("kun det vaade filter (og evt. spildte krummer) er noteret", iagttagelser().length === 1 + (f.iagttaget.spild ? 1 : 0) && f.iagttaget.vaad, iagttagelser().join(" | "));
    paastand("knappen Hjælp til beregningen vises efter de ni trin", !d.getElementById("hjaelp-beregn").hidden);
    var r = M.fedtprocent(f.mChips, f.mB, f.mBF);
    paastand("hint: massen i gram", /massen af fedtet/.test(svar(M.komma(f.mBF - f.mB))));
    paastand("hint: broekdel", /procent/.test(svar(String(Math.round(r) / 100).replace(".", ","))));
    paastand("hint: skaalen er ikke trukket fra", /Træk massen af den tomme petriskål/.test(svar(komma(f.mBF / f.mChips * 100))));
    paastand("hint: divideret omvendt", /forkerte vej/.test(svar(komma(f.mChips / (f.mBF - f.mB) * 100))));
    paastand("hint efter flere forkerte: formlen og hjaelpen", /m\(fedt\) \/ m\(chips\)/.test(svar("17")) && /Hjælp til beregningen/.test(d.getElementById("beregn-hint").textContent));

    var G = NK.guide, tal = f.fedtTal();
    G.aabn();
    paastand("guiden aabnes med trin 1 aktivt", d.getElementById("guide").classList.contains("vis") && G.tilstand().trin === 1 && d.getElementById("g2-svar").disabled);
    d.getElementById("g1-svar").value = "0";
    G.tjek(1);
    paastand("guide trin 1: forkert giver hint", G.tilstand().trin === 1 && !d.getElementById("g1-hint").hidden);
    d.getElementById("g1-svar").value = M.komma(-tal.mF);
    G.tjek(1);
    paastand("guide trin 1: negativt tal giver hint om fortegn", /mindste masse/.test(d.getElementById("g1-hint").textContent));
    d.getElementById("g1-svar").value = M.komma(tal.mF);
    G.tjek(1);
    paastand("guide trin 1: rigtigt laaser trin 2 op", G.tilstand().trin === 2 && !d.getElementById("g2-svar").disabled);
    d.getElementById("g2-svar").value = String(Math.round((tal.andel + 0.004) * 1000) / 1000).replace(".", ",");
    G.tjek(2);
    paastand("guide trin 2: upraecist giver Næsten", G.tilstand().trin === 2 && /Næsten/.test(d.getElementById("g2-hint").textContent));
    d.getElementById("g2-svar").value = String(Math.round(tal.mChips / tal.mF * 100) / 100).replace(".", ",");
    G.tjek(2);
    paastand("guide trin 2: omvendt division giver hint", /forkerte vej/.test(d.getElementById("g2-hint").textContent));
    var andel = Math.round(tal.andel * 1000) / 1000;
    d.getElementById("g2-svar").value = String(andel).replace(".", ",");
    G.tjek(2);
    paastand("guide trin 2: tre decimaler godtages", G.tilstand().trin === 3);
    d.getElementById("g3-svar").value = "3";
    G.tjek(3);
    paastand("guide trin 3: forkert giver hint", G.tilstand().trin === 3 && /Gang andelen med 100/.test(d.getElementById("g3-hint").textContent));
    d.getElementById("g3-svar").value = komma(andel * 100);
    G.tjek(3);
    paastand("guide trin 3: rigtigt viser knappen", G.tilstand().trin === 4 && !d.getElementById("guide-brug").hidden);
    G.brug();
    paastand("svaret fra guiden godtages i maaleskemaet", f.gjort.beregn && !d.getElementById("guide").classList.contains("vis"));
    NK.opdaterPanel();
    paastand("hjaelpeknappen skjules, naar beregningen er gjort", d.getElementById("hjaelp-beregn").hidden);
    paastand("quizzen er laast op efter heptan", NK.quiz.tilstand === "klar");
    paastand("intet ros ved et lavt resultat", !f.laerer.rost);

    var med = helt({ midl: "heptan", skyl: true });
    paastand("skylning hæver resultatet til 30,5 til 33,5 %", med !== null && med > 30.5 && med < 33.5 && med > uden, med && komma(med) + " %");
    paastand("skyllet filter noteres ikke som vaadt", !f.iagttaget.vaad);
    svar(komma(M.fedtprocent(f.mChips, f.mB, f.mBF)));
    paastand("godt resultat: laereren roser", f.laerer.rost && f.laerer.scene && f.laerer.scene.navn === "ros");
    adv(6);

    var knust = helt({ midl: "heptan", knusTid: 1.6 });
    paastand("halvt knuste chips giver mindre og noteres", knust !== null && knust < uden && f.iagttaget.halvknust, knust && komma(knust) + " %");

    var saltFoer = f.antalSalt;
    var vand = helt({ midl: "vand" });
    paastand("vand giver ca. 1 % (salt)", vand !== null && vand > 0.5 && vand < 2, vand && komma(vand) + " %");
    paastand("inddampet salt: laereren kommer med en bemærkning", f.antalSalt === saltFoer + 1);
    svar(komma(vand));
    paastand("sammenligningen foreslaar et andet opløsningsmiddel", /andet opløsningsmiddel/.test(d.getElementById("sammenligning-tekst").textContent));

    overskrift("6. Bunsenbraenderen");
    nyt();
    paastand("braenderen taendes med et klik", f.klik("braender") === true && f.braenderTaendt);
    adv(1);
    paastand("flammen braender", f.flamme > 0.9);
    paastand("og slukkes igen", f.klik("braender") === true && !f.braenderTaendt);
    paastand("trefoden kan ikke bruges uden filtrat", f.klik("trefod") === false);
    tilFiltrat({ midl: "vand" });
    paastand("filtratet flyttes til trefoden", f.klik("trefod") === true);
    adv(4);
    paastand("uden flamme sker der intet", f.g.skaal.sted === "trefod" && f.fordampet === 0);
    f.klik("braender");
    vent(function () { return f.gjort.inddamp; }, 40);
    paastand("vand inddampes over braenderen uden brand", f.gjort.inddamp && !f.uheld);
    adv(6);
    paastand("skaalen kan ikke vejes, mens braenderen er taendt", f.klik("skaal") === false);
    f.klik("braender"); adv(8);
    paastand("efter slukning kan skaalen vejes", f.klik("skaal") === true);
    adv(4.5);
    paastand("resultatet er noteret", f.mBF !== null);

    tilFiltrat({ midl: "heptan" });
    f.klik("braender"); adv(0.3);
    f.klik("trefod"); adv(1.5 + M.BRAND.tid);
    paastand("heptan over den taendte braender antaendes", !!f.uheld && f.uheld.ild > 0.5 && f.alarm);
    paastand("scenen er laast under branden", f.klik("heptan") === false && f.klik("skaal") === false);
    vent(function () { return f.uheld && f.uheld.faerdig; }, 30);
    paastand("laereren slukker og konfiskerer braenderen", f.uheld.faerdig && f.uheld.slukket && f.braenderVaek && !f.alarm && !f.braenderTaendt);
    paastand("sod paa stinkskabets vaeg", f.sod > 0.3, f.sod.toFixed(2));
    paastand("branden staar i resultaterne", f.resultater[f.resultater.length - 1].brand === true);
    NK.opdaterPanel();
    paastand("panelet viser Start et nyt forsøg", !d.getElementById("uheld-boks").hidden);
    nyt();
    paastand("nyt forsoeg rydder uheldet, braenderen er stadig vaek", !f.uheld && f.braenderVaek && f.klik("braender") === false && f.klik("trefod") === false);

    overskrift("6b. Traek med musen");
    function traek(fra, til) {
        var greb = f.ned(fra);
        for (var k = 1; k <= 12; k++) {
            f.flyt({ x: fra.x + (til.x - fra.x) * k / 12, y: fra.y + (til.y - fra.y) * k / 12 }, Date.now());
            f.opdater(1 / 60);
        }
        f.op();
        return greb;
    }
    nyt();
    for (i = 0; i < 14 && f.chipsMasse() + f.iLuften < 5; i++) { f.klik("pose"); adv(0.15); }
    adv(1);
    paastand("chips i luften taelles helt ned til 0", f.chipsIFlugt === 0 && f.iLuften === 0);
    for (i = 0; i < 10 && f.chipsMasse() > M.AFVEJ.max; i++) { f.klik("vejebaad"); adv(0.7); }
    for (i = 0; i < 10 && f.chipsMasse() < M.AFVEJ.min; i++) { f.klik("pose"); adv(0.7); }
    var bp = f.g.vejebaad.p;
    paastand("vejebaaden rammes ogsaa oven paa chipsbunken", f.hvad({ x: bp.x + 10, y: bp.y - 28 }) === "vejebaad");
    paastand("vejebaaden kan tages", traek({ x: bp.x, y: bp.y - 6 }, { x: S.MORTER.midt, y: 450 }) === true);
    adv(4);
    paastand("traekket hen til morteren: chipsene er haeldt i", f.gjort.afvej && f.mChips !== null);
    f.arbejdKnap(true); adv(3.5); f.arbejdKnap(false); adv(0.5);
    f.klik("morter"); adv(5.5);
    var hp = f.g.heptan.p, hx = hp.x, hy = hp.y + 50;
    f.ned({ x: hx, y: hy }); f.op(); adv(0.2);
    paastand("et klik paa flasken giver kun en besked", !f.midl && !f.handling);
    traek({ x: hx, y: hy }, { x: 300, y: 250 });
    adv(1);
    paastand("sluppet et forkert sted flyver flasken hjem", !f.midl && Math.abs(f.g.heptan.p.x - f.g.heptan.hjem.x) < 1);
    traek({ x: hx, y: hy }, { x: S.A_MIDT, y: 430 });
    adv(4.5);
    paastand("traekket hen over baegerglasset: heptanen haeldes i", f.midl === "heptan");
    f.arbejdKnap(true); adv(6); f.arbejdKnap(false); adv(1);
    var mk = f.mikro;
    paastand("roering: stivelsen synker, fedt og heptan trækkes opad",
        mk.lag > 0.9 && mk.gennemsnitY("stivelse") > mk.gennemsnitY("fedtFri") + 20 && mk.gennemsnitY("heptan") < mk.gennemsnitY("stivelse") - 20,
        "stivelse " + Math.round(mk.gennemsnitY("stivelse")) + ", fedt " + Math.round(mk.gennemsnitY("fedtFri")) + ", heptan " + Math.round(mk.gennemsnitY("heptan")));
    var sp = f.g.skaal.p;
    traek({ x: sp.x, y: sp.y - 6 }, { x: S.VAEGT.midt, y: 440 });
    adv(5);
    paastand("petriskaalen traekkes paa vaegten og vejes", f.mB !== null && f.g.skaal.sted === "tragt");
    var ap = f.g.baegerA.p;
    traek({ x: ap.x - 36, y: ap.y + 60 }, { x: S.TRAGT.x, y: 390 });
    adv(10);
    paastand("baegerglasset traekkes hen over tragten og filtreres", f.gjort.filtrer);
    traek({ x: hx, y: hy }, { x: S.TRAGT.x, y: 390 });
    adv(8);
    paastand("heptan traekket hen over tragten skyller filteret", f.skyllet);
    sp = f.g.skaal.p;
    traek({ x: sp.x, y: sp.y - 6 }, { x: S.PLADE.midt, y: 450 });
    adv(2);
    paastand("petriskaalen traekkes paa varmepladen", f.g.skaal.sted === "plade");

    function tilBaegerglas() {
        nyt();
        afvej();
        f.arbejdKnap(true); adv(3.5); f.arbejdKnap(false); adv(0.5);
        f.klik("morter"); adv(5.5);
    }
    function holdVand(sek) {
        var vp = f.g.vand.p;
        f.ned({ x: vp.x - 20, y: vp.y + 60 });
        adv(sek);
    }
    tilBaegerglas();
    holdVand(0.8);
    paastand("vandflasken holdt under 1 s: ingen laerer", !f.laerer.scene);
    adv(0.5);
    var vandReplik = f.laerer.scene ? f.laerer.scene.trin.map(function (t) { return t.sig || ""; }).join(" ") : "";
    paastand("vandflasken holdt over 1 s: laereren advarer om baegerglasset", f.laerer.scene && f.laerer.scene.navn === "vand" && f.vandAdvaret && /hælde det i bægerglasset/.test(vandReplik), vandReplik);
    f.op(); adv(0.3);
    paastand("laereren laaser ikke scenen", !f.laererOptaget());
    f.slipTil("vand", "baegerA");
    adv(0.2);
    paastand("vandet haeldes alligevel i: laereren svarer igen", f.midl === null && /præcis det/.test(f.laerer.tale), f.laerer.tale);
    adv(5);
    paastand("og vandet er i baegerglasset", f.midl === "vand");
    vent(function () { return !f.laerer.scene; }, 15);

    tilBaegerglas();
    holdVand(1.3); f.op();
    vent(function () { return !f.laerer.scene; }, 15);
    holdVand(1.5); f.op(); adv(0.2);
    paastand("advarslen kommer kun én gang pr. forsøg", !f.laerer.scene);
    f.slipTil("vand", "baegerA"); adv(0.3);
    paastand("vand haeldt i efter advarslen: laereren kommer tilbage", f.laerer.scene && f.laerer.scene.navn === "vandBaeger");
    vent(function () { return !f.laerer.scene && !f.handling; }, 15);

    tilBaegerglas();
    f.slipTil("heptan", "baegerA"); adv(4.5);
    holdVand(1.5); f.op(); adv(0.2);
    paastand("ingen advarsel, naar opløsningsmidlet er valgt", !f.laerer.scene);

    overskrift("7. Paaskeaeg");
    nyt();
    afvej();
    for (i = 0; i < 300; i++) { f.knus(30, 900); f.opdater(1 / 60); }
    paastand("almindelig knusning med musen kalder ikke paa laereren", !f.laerer.scene);
    nyt();
    afvej();
    for (i = 0; i < 500 && !(f.laerer.scene && f.laerer.scene.navn === "morter"); i++) { f.arbejdKilde = "mus-knus"; f.knus(60, 4000); f.opdater(1 / 60); }
    paastand("morteren: vedvarende amok kalder laereren ind, skaalen holder", f.laerer.scene && f.laerer.scene.navn === "morter" && f.antalAmok === 1 && !f.oprydning, i + " billeder");
    paastand("knusningen stoppes, og scenen er laast", !f.arbejdKilde && f.laererOptaget());
    vent(function () { return !f.laerer.scene; }, 15);
    paastand("laereren er gaaet igen", !f.laerer.scene && f.laerer.x < -200);

    nyt();
    afvej();
    f.klik("pose"); adv(1.2);
    f.klik("pose"); adv(1.2);
    paastand("to chips spist uden laerer", f.spist === 2 && !f.laerer.scene);
    f.klik("pose"); adv(1.2);
    paastand("tredje chip: laereren kommer", f.laerer.scene && f.laerer.scene.navn === "spis1");
    paastand("scenen er laast, mens laereren taler", f.laererOptaget() && f.klik("morter") === false);
    vent(function () { return !f.laerer.scene; }, 15);
    for (i = 0; i < 3; i++) { f.klik("pose"); adv(1.2); }
    vent(function () { return !f.laerer.scene; }, 15);
    paastand("sjette chip: laereren tager posen", f.g.pose.skjult && f.poseTaget);
    paastand("uden pose kan der ikke spises", f.klik("pose") === false);
    nyt();
    paastand("posen er tilbage ved nyt forsoeg", !f.g.pose.skjult && !f.poseTaget);

    /* Kaffen er faelles og ikke den samme to gange; her vaelges posten */
    NK.Kemichael.kaffeTvang("kold");
    paastand("koppen kan hentes", f.klik("kaffekop") === true);
    vent(function () { return !f.laerer.scene; }, 20);
    paastand("koppen er vaek", f.koppenVaek && f.g.kaffekop.skjult);
    nyt();
    paastand("koppen er tilbage ved nyt forsoeg", !f.g.kaffekop.skjult && !f.koppenVaek);
    NK.Kemichael.kaffeTvang(null);

    f.laererKoer("test", [{ gaa: 150 }, { tid: 6 }], false);
    adv(1);
    /* Han taler faerdig, foer han svarer paa et nyt prik */
    function udtalt() { return vent(function () { return f.laerer.taleUr <= 0; }, 8); }
    f.klik("laerer");
    paastand("et klik midt i en replik afbryder ham ikke", f.klik("laerer") === false);
    udtalt();
    for (i = 0; i < 4; i++) { f.klik("laerer"); udtalt(); }
    paastand("fem klik paa laereren: damp af oererne, og laereren gaar", f.laerer.damp > 0 && f.laerer.scene && f.laerer.scene.navn === "gaaUd");
    vent(function () { return !f.laerer.scene; }, 10);

    overskrift("7b. Petriskaalen og heptanflasken");
    function knusVildt() {
        for (var k = 0; k < 400 && !f.oprydning; k++) { f.arbejdKilde = "mus-knus"; f.knus(60, 5200); f.opdater(1 / 60); }
        return k;
    }
    nyt();
    afvej();
    i = knusVildt();
    paastand("helt urimelig knusning knuser petriskaalen, foer laereren kommer", !!f.oprydning && !f.laerer.scene, i + " billeder");
    adv(3);
    var op = f.oprydning;
    paastand("skaalen er knust, skaar paa bordet og to oprydningstrin", !!op && f.g.skaal.sted === "knust" && op.skaar.length >= 15 && op.trin === "fej" && f.oprydningListe().length === 2);
    NK.opdaterPanel();
    paastand("panelet viser Oprydning", d.getElementById("forloeb-titel").textContent === "Oprydning");
    paastand("resten af forsoeget venter", f.klik("morter") === false && f.arbejdKnap(true) === false && !f.kanTraekke("heptan"));
    var ko = op.redskaber.kost;
    var greb = NK.tilVerden(ko.p, ko.anker, 65, 28);
    paastand("kosten kan tages", f.hvad(greb) === "kost" && f.ned(greb) === true);
    var minX = Infinity;
    op.skaar.forEach(function (s) { minX = Math.min(minX, s.x); });
    var gdx = greb.x - ko.p.x, gdy = greb.y - ko.p.y;
    var fraX = minX - 50, tilX = op.redskaber.fejeblad.p.x + 20;
    f.flyt({ x: fraX + gdx, y: S.BORD + gdy }, Date.now());
    for (i = 1; i <= 40; i++) {
        f.flyt({ x: fraX + (tilX - fraX) * i / 40 + gdx, y: S.BORD + gdy }, Date.now());
        f.opdater(1 / 60);
    }
    f.op();
    adv(0.5);
    var fejet = op.skaar.filter(function (s) { return s.fejet; }).length;
    paastand("kosten traekkes og fejer skaarene i fejebladet", fejet >= op.skaar.length - 3 || op.trin === "aflever", fejet + "/" + op.skaar.length);
    if (op.trin === "fej") { f.klik("kost"); adv(6); }
    paastand("alle skaar i fejebladet: naeste trin", op.trin === "aflever");
    adv(2);
    paastand("glasaffaldet tager imod", f.klik("glasaffald") === true);
    adv(6);
    paastand("ny petriskaal, og pistillen er tilbage i morteren", !f.oprydning && f.g.skaal.sted === "hjem" && !f.handling && Math.abs(f.g.pistil.p.x - f.g.pistil.hjem.x) < 1);
    paastand("chipsene er stadig i morteren", f.gjort.afvej && !f.gjort.overfoer && f.stykker.length > 0);
    knusVildt();
    adv(3);
    f.klik("kost"); adv(6);
    f.klik("glasaffald"); adv(6);
    paastand("anden knuste skaal: laereren fører regnskab", f.antalSkaalKnust === 2 && f.laerer.scene && f.laerer.scene.navn === "skaal");
    vent(function () { return !f.laerer.scene; }, 15);

    nyt();
    var hq = f.g.heptan.p, hqx = hq.x, hqy = hq.y + 50;
    f.ned({ x: hqx, y: hqy });
    for (i = 0; i < 60; i++) { f.flyt({ x: 600 + Math.sin(i * 0.4) * 120, y: 300 + Math.cos(i * 0.3) * 60 }, Date.now()); f.opdater(1 / 15); }
    paastand("heptanflasken holdt i 4 s: intet sker", !f.heptanSpild && !!f.holdt);
    for (i = 0; i < 80 && !f.heptanSpild; i++) { f.flyt({ x: 600 + Math.sin(i * 0.4) * 120, y: 300 }, Date.now()); f.opdater(1 / 15); }
    paastand("efter 8 s glider flasken ud af haanden", !!f.heptanSpild && !f.holdt, (4 + i / 15).toFixed(1) + " s");
    f.op();
    vent(function () { return f.heptanSpild && f.heptanSpild.fase !== "falder"; }, 5);
    paastand("flasken knuses paa gulvet med skaar og en pyt", f.g.heptan.skjult && !!f.heptanSpild.pyt && f.heptanSpild.skaar.length > 10);
    adv(1);
    paastand("laereren kommer og rydder op", f.laerer.scene && f.laerer.scene.navn === "heptan" && f.laererOptaget());
    paastand("imens kan intet bruges", f.kanTraekke("vand") === false && f.klik("pose") === false);
    vent(function () { return !f.heptanSpild; }, 25);
    adv(2);
    paastand("ryddet op, og en ny heptanflaske staar paa plads", !f.heptanSpild && !f.g.heptan.skjult && Math.abs(f.g.heptan.p.x - f.g.heptan.hjem.x) < 1 && !f.laerer.scene);
    paastand("den nye flaske kan bruges", f.kanTraekke("heptan"));

    overskrift("7c. Kemichael");
    var K = NK.Kemichael;
    K.glimtNulstil();
    paastand("et glimt vises foerste gang", K.glimt("navn") === K.GLIMT.navn);
    paastand("hoejst et glimt pr. sidevisning", K.glimt("frokost") === null);
    K.glimtNulstil();
    paastand("regnskabet giver et glimt ved tredje uheld", K.uheld().length === 0 && K.uheld().length === 0 && K.uheld().length === 1);
    paastand("alle glimt er korte", Object.keys(K.GLIMT).every(function (k) { return K.GLIMT[k].length <= 64; }));
    K.glimtNulstil();
    f.laererKoer("test", [{ udtryk: { briller: 1, laen: 1 } }, { gaa: K.KANT }, K.suk(0.5), { tid: 3 }], false);
    adv(2);
    paastand("han kan kigge ind fra kanten, over brillerne og sukke", Math.abs(f.laerer.x - K.KANT) < 1 && f.laerer.briller > 0.9 && f.laerer.laen > 0.9 && f.laerer.lukket < 0.01);
    nyt();
    paastand("nyt forsoeg retter brillerne igen", f.laerer.brillerMaal === 0 && f.laerer.laenMaal === 0);
    vent(function () { return f.laerer.x < -200; }, 5);

    overskrift("8. Quizzen");
    paastand("ti spoergsmaal", NK.QUIZ.length === 10);
    NK.QUIZ.forEach(function (sp, n) {
        var unikke = sp.valg.filter(function (v, k) { return sp.valg.indexOf(v) === k; }).length === 4;
        var blandOk = true;
        for (i = 0; i < 60; i++) {
            var b = NK.quiz.bland(sp);
            if (b.valg[b.rigtig] !== sp.valg[sp.rigtig]) blandOk = false;
        }
        paastand("spoergsmaal " + (n + 1) + ": fire forskellige svar, blandingen holder styr paa det rigtige", sp.valg.length === 4 && unikke && !!sp.forklaring && blandOk);
    });

    overskrift("9. Sprog og notation");
    var tekster = [d.body.textContent];
    NK.QUIZ.forEach(function (sp) { tekster.push(sp.sp, sp.forklaring, sp.valg.join(" ")); });
    NK.TRIN.forEach(function (t) { tekster.push(t.tekst, t.hint); });
    Object.keys(NK.IAGTTAGELSER).forEach(function (k) { tekster.push(NK.IAGTTAGELSER[k].tekst); });
    Object.keys(NK.Mikro.NAVNE).forEach(function (k) { tekster.push(NK.Mikro.NAVNE[k]); });
    var alt = tekster.join(" ");
    paastand("ingen tankestreger", !/[—–]/.test(alt));
    paastand("ingen ladning skrevet som 1+ eller 1−", !/[¹][⁺⁻]|[A-Za-z)\]₀-₉]1[+−-]/.test(alt));
    paastand("intet bægerglas, hvor der skal stå petriskål", !/tom(t|me) bægerglas|bægerglas med rest/.test(alt));
    paastand("Na⁺ og Cl⁻ i zoomboblen", NK.Mikro.NAVNE.na === "Na⁺" && NK.Mikro.NAVNE.cl === "Cl⁻");

    nyt();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
</body>
</html>
