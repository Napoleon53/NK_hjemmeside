<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - sc6.9 Fedt i chips</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem med de
   samme funktioner, som klik og knapper bruger: modellen, raekke-
   foelgen, heptan med og uden skylning, vand, beregningen og hintene,
   paaskeaeggene, branden, quizzen, sproget og ion-notationen.
   Skal aabnes gennem en lokal server (Chrome afviser iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("forsoeg og quiz er bygget", !!(NK.forsoeg && NK.quiz));
    Object.keys(NK.Sprites.FILER).forEach(function (n) {
        paastand("sprite " + n + " er indlaest", NK.Sprites.klar(n));
    });

    var M = NK.Model, f = NK.forsoeg;
    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) f.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function nyt() { NK.nytForsoeg(); adv(0.1); }
    function afvej() {
        var n = 0;
        while (f.chipsMasse() + f.iLuften < 4.6 && n++ < 30) { f.klik("pose"); adv(0.6); }
        adv(0.8);
        f.klik("vejebaad"); adv(4);
    }
    function tilFiltrat(opt) {
        nyt();
        afvej();
        f.arbejdKnap(true); adv(opt.knusTid || 3.5); f.arbejdKnap(false); adv(0.5);
        f.klik("morter"); adv(5);
        f.klik(opt.midl); adv(4.5);
        f.arbejdKnap(true); adv(opt.roerTid || 6); f.arbejdKnap(false); adv(1);
        f.klik("baegerB"); adv(5);
        f.klik("baegerA"); adv(10);
        if (opt.skyl) { f.klik(opt.midl); adv(8); }
    }
    function helt(opt) {
        tilFiltrat(opt);
        f.klik(opt.braender ? "braender" : "baegerB"); adv(3);
        vent(function () { return f.gjort.inddamp || !!f.uheld; }, 40);
        adv(6);
        f.klik("baegerB"); adv(4);
        return f.mBF !== null ? M.fedtprocent(f.mChips, f.mB, f.mBF) : null;
    }
    function svar(tekst) {
        d.getElementById("svar").value = tekst;
        NK.tjek();
        return d.getElementById("beregn-hint").hidden ? "" : d.getElementById("beregn-hint").textContent;
    }
    function komma(x) { return String(Math.round(x * 10) / 10).replace(".", ","); }

    overskrift("2. Modellen");
    paastand("uden roering er intet opløst", M.roerGrad(1, 0) === 0);
    paastand("roering og knusning oeger ekstraktionen", M.ekstraktion(M.MIDLER.heptan, 1, 4).fedt > M.ekstraktion(M.MIDLER.heptan, 0.5, 4).fedt && M.ekstraktion(M.MIDLER.heptan, 1, 4).fedt > M.ekstraktion(M.MIDLER.heptan, 1, 1).fedt);
    paastand("vand opløser intet fedt, men salt", M.ekstraktion(M.MIDLER.vand, 1, 10).fedt === 0 && M.ekstraktion(M.MIDLER.vand, 1, 10).salt > 0.9);
    paastand("heptan opløser intet salt", M.ekstraktion(M.MIDLER.heptan, 1, 10).salt === 0);
    paastand("skylning giver mere fedt med", M.opsamlet(1, true) > M.opsamlet(1, false));
    paastand("5,00 g chips og 1,60 g fedt giver 32 %", Math.abs(M.fedtprocent(5, 50, 51.6) - 32) < 1e-9);
    paastand("komma-format 4,50", M.komma(4.5) === "4,50" && M.komma(-0.001) === "0,00", M.komma(-0.001));
    var T = function (s) { return M.tjek(s, 5, 50, 51.6).slags; };
    paastand("tjek: 32 og 32,0 % er rigtige", T("32") === "rigtig" && T("32,0 %") === "rigtig" && T(" 31.8") === "rigtig");
    paastand("tjek: 0,32 er en brøkdel", T("0,32") === "broek", T("0,32"));
    paastand("tjek: 1,6 er massen i gram", T("1,6") === "gram", T("1,6"));
    paastand("tjek: 1032 mangler at trække glasset fra", T("1032") === "baeger", T("1032"));
    paastand("tjek: 312,5 er divideret omvendt", T("312,5") === "omvendt", T("312,5"));
    paastand("tjek: tomt og tekst er tomt", T("") === "tom" && T("abc") === "tom");
    paastand("tjek: 17 er en anden fejl", T("17") === "andet");

    overskrift("3. Raekkefoelge");
    nyt();
    paastand("morteren er tom foer afvejning", f.klik("morter") === false);
    paastand("flaskerne kan ikke bruges foer chipsene er i glasset", f.klik("heptan") === false && !f.midl);
    paastand("det tomme glas kan ikke vejes, mens vejebaaden staar paa vaegten", f.klik("baegerB") === false);
    paastand("vejebaaden uden chips giver ingen overfoersel", f.klik("vejebaad") === false);
    f.klik("pose"); adv(0.8);
    paastand("en chip lander i vejebaaden", f.chips.length === 1 && f.vaegtMaal() > 0.3);
    paastand("under 4,5 g kan der ikke haeldes i morteren", f.klik("vejebaad") === false && !f.gjort.afvej);
    f.chips = [{ m: 2, dx: 0, dy: 0, a: 0, s: 1 }, { m: 2, dx: 0, dy: 0, a: 0, s: 1 }, { m: 1.9, dx: 0, dy: 0, a: 0, s: 1 }];
    paastand("over 5,5 g laegges en chip tilbage", f.klik("vejebaad") === true && f.chips.length === 2);
    adv(1);
    f.chips.push({ m: 0.8, dx: 0, dy: 0, a: 0, s: 1 });
    paastand("4,8 g kan haeldes i morteren", f.klik("vejebaad") === true);
    adv(4);
    paastand("chipsenes masse er noteret", f.gjort.afvej && f.mChips === 4.8);
    paastand("ukrummede chips kan ikke haeldes over", f.klik("morter") === false);
    for (var i = 0; i < Math.ceil(M.KNUS.vej / 40) + 2; i++) f.knus(40, 5000);
    paastand("meget voldsom knusning taber krummer", f.krummerUd > 0 && f.mTab > 0, f.krummerUd + " krummer");
    paastand("knust helt", f.knust === 1);
    f.klik("morter"); adv(5);
    paastand("chipsene er i baegerglasset", f.gjort.overfoer && f.g.baegerA.krummer.length > 10);
    f.klik("heptan"); adv(4.5);
    paastand("heptanen er haeldt i", f.midl === "heptan" && f.g.baegerA.areal === M.VOLUMEN);
    paastand("den anden flaske afvises", f.klik("vand") === false);
    paastand("uden roering kan der ikke filtreres", f.roerGrad() < M.ROER.min && f.klik("baegerA") === false);
    f.arbejdKnap(true); adv(6); f.arbejdKnap(false); adv(0.5);
    paastand("roeringen er faerdig", f.trinGjort("roer"));
    paastand("uden vejet glas kan der ikke filtreres", f.klik("baegerA") === false && !f.handling);
    f.klik("baegerB"); adv(5);
    paastand("det tomme glas er vejet og staar under tragten", f.mB === f.baegerMasse && f.g.baegerB.sted === "tragt");
    f.klik("baegerA"); adv(10);
    paastand("filtreret, og der er filtrat i glasset", f.gjort.filtrer && f.g.baegerB.areal > 1000);
    f.klik("baegerB"); adv(3);
    paastand("glasset kan ikke vejes foer inddampningen er faerdig", f.klik("baegerB") === false);
    vent(function () { return f.gjort.inddamp; }, 30);
    paastand("inddampet", f.gjort.inddamp && f.g.baegerB.areal === 0);
    paastand("et varmt glas kan ikke vejes", f.klik("baegerB") === false);
    adv(6);
    paastand("et afkoelet glas kan vejes", f.klik("baegerB") === true);
    adv(4);
    paastand("tabte krummer giver et lavere resultat", f.mBF !== null && M.fedtprocent(f.mChips, f.mB, f.mBF) < 29.5, komma(M.fedtprocent(f.mChips, f.mB, f.mBF)) + " %");

    overskrift("4. Resultater");
    var uden = helt({ midl: "heptan" });
    paastand("heptan uden skylning: 27 til 30,5 %", uden !== null && uden > 27 && uden < 30.5, uden && komma(uden) + " %");
    var r = M.fedtprocent(f.mChips, f.mB, f.mBF);
    paastand("hint: massen i gram", /massen af fedtet/.test(svar(M.komma(f.mBF - f.mB))));
    paastand("hint: broekdel", /procent/.test(svar(String(Math.round(r) / 100).replace(".", ","))));
    paastand("hint: glasset er ikke trukket fra", /Træk massen/.test(svar(komma(f.mBF / f.mChips * 100))));
    paastand("hint: divideret omvendt", /forkerte vej/.test(svar(komma(f.mChips / (f.mBF - f.mB) * 100))));
    paastand("hint efter flere forkerte: formlen", /m\(fedt\) \/ m\(chips\)/.test(svar("17")));
    svar(komma(r));
    paastand("det rigtige svar godtages", f.gjort.beregn && f.resultater.length > 0);
    paastand("sammenligningen vises", !d.getElementById("sammenligning").hidden);
    paastand("quizzen er laast op efter heptan", NK.quiz.tilstand === "klar");
    paastand("intet ros ved et lavt resultat", !f.laerer.rost);

    var med = helt({ midl: "heptan", skyl: true });
    paastand("skylning hæver resultatet til 30,5 til 33,5 %", med !== null && med > 30.5 && med < 33.5 && med > uden, med && komma(med) + " %");
    svar(komma(M.fedtprocent(f.mChips, f.mB, f.mBF)));
    paastand("godt resultat: laereren roser", f.laerer.rost && f.laerer.scene && f.laerer.scene.navn === "ros");
    adv(6);

    var knust = helt({ midl: "heptan", knusTid: 1.6 });
    paastand("halvt knuste chips giver mindre", knust !== null && knust < uden, knust && komma(knust) + " %");

    var vand = helt({ midl: "vand" });
    paastand("vand giver ca. 1 % (salt)", vand !== null && vand > 0.5 && vand < 2, vand && komma(vand) + " %");
    paastand("iagttagelsen om den hvide belaegning", f.iagttaget.rest_vand);
    svar(komma(vand));
    paastand("sammenligningen foreslaar et andet opløsningsmiddel", /andet opløsningsmiddel/.test(d.getElementById("sammenligning-tekst").textContent));

    overskrift("5. Braenderen");
    var vb = helt({ midl: "vand", braender: true });
    paastand("vand kan inddampes over braenderen uden brand", !f.uheld && vb !== null, vb && komma(vb) + " %");
    tilFiltrat({ midl: "heptan" });
    f.klik("braender"); adv(1.6 + M.BRAND.tid);
    paastand("heptan over braenderen antaendes", !!f.uheld && f.uheld.ild > 0.5 && f.alarm);
    paastand("scenen er laast under branden", f.klik("heptan") === false && f.klik("baegerB") === false);
    vent(function () { return f.uheld && f.uheld.faerdig; }, 30);
    paastand("laereren slukker og konfiskerer braenderen", f.uheld.faerdig && f.uheld.slukket && f.braenderVaek && !f.alarm);
    paastand("sod paa vaeggen", f.sod > 0.3, f.sod.toFixed(2));
    paastand("branden staar i resultaterne", f.resultater[f.resultater.length - 1].brand === true);
    NK.opdaterPanel();
    paastand("panelet viser Start et nyt forsøg", !d.getElementById("uheld-boks").hidden);
    nyt();
    paastand("nyt forsoeg rydder uheldet, braenderen er stadig vaek", !f.uheld && f.braenderVaek && f.klik("braender") === false);

    overskrift("6. Paaskeaeg");
    nyt();
    afvej();
    f.klik("pose"); adv(1.2);
    f.klik("pose"); adv(1.2);
    paastand("to chips spist uden laerer", f.spist === 2 && !f.laerer.scene);
    f.klik("pose"); adv(1.2);
    paastand("tredje chip: laereren kommer", f.laerer.scene && f.laerer.scene.navn === "spis1");
    paastand("scenen er laast, mens laereren taler", f.laererOptaget() && f.klik("morter") === false);
    vent(function () { return !f.laerer.scene; }, 15);
    for (i = 0; i < 3; i++) { f.klik("pose"); adv(1.2); }
    vent(function () { return !f.laerer.scene; }, 15);
    paastand("sjette chip: laereren tager posen", f.g.pose.skjult && f.poseTaget);
    paastand("uden pose kan der ikke spises", f.klik("pose") === false);
    nyt();
    paastand("posen er tilbage ved nyt forsoeg", !f.g.pose.skjult && !f.poseTaget);

    paastand("koppen kan hentes", f.klik("kaffekop") === true);
    vent(function () { return !f.laerer.scene; }, 15);
    paastand("koppen er vaek", f.koppenVaek && f.g.kaffekop.skjult);
    nyt();
    paastand("koppen kommer ikke igen", f.g.kaffekop.skjult);

    f.laererKoer("test", [{ gaa: 150 }, { tid: 6 }], false);
    adv(1);
    for (i = 0; i < 5; i++) { f.klik("laerer"); adv(0.4); }
    paastand("fem klik paa laereren: damp af oererne, og laereren gaar", f.laerer.damp > 0 && f.laerer.scene && f.laerer.scene.navn === "gaaUd");
    vent(function () { return !f.laerer.scene; }, 10);

    overskrift("7. Quizzen");
    paastand("ti spoergsmaal", NK.QUIZ.length === 10);
    NK.QUIZ.forEach(function (sp, n) {
        var unikke = sp.valg.filter(function (v, k) { return sp.valg.indexOf(v) === k; }).length === 4;
        var blandOk = true;
        for (i = 0; i < 60; i++) {
            var b = NK.quiz.bland(sp);
            if (b.valg[b.rigtig] !== sp.valg[sp.rigtig]) blandOk = false;
        }
        paastand("spoergsmaal " + (n + 1) + ": fire forskellige svar, blandingen holder styr paa det rigtige", sp.valg.length === 4 && unikke && !!sp.forklaring && blandOk);
    });

    overskrift("8. Sprog og notation");
    var tekster = [d.body.textContent];
    NK.QUIZ.forEach(function (sp) { tekster.push(sp.sp, sp.forklaring, sp.valg.join(" ")); });
    NK.TRIN.forEach(function (t) { tekster.push(t.tekst, t.hint); });
    Object.keys(NK.IAGTTAGELSER).forEach(function (k) { tekster.push(NK.IAGTTAGELSER[k].tekst); });
    Object.keys(NK.Mikro.NAVNE).forEach(function (k) { tekster.push(NK.Mikro.NAVNE[k]); });
    var alt = tekster.join(" ");
    paastand("ingen tankestreger", !/[—–]/.test(alt));
    paastand("ingen ladning skrevet som 1+ eller 1−", !/[¹][⁺⁻]|[A-Za-z)\]₀-₉]1[+−-]/.test(alt));
    paastand("Na⁺ og Cl⁻ i zoomboblen", NK.Mikro.NAVNE.na === "Na⁺" && NK.Mikro.NAVNE.cl === "Cl⁻");

    nyt();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
</body>
</html>
