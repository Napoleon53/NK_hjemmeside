  <path d="M5 9 Q8 42 34 48 L34 52 Q34 56 38 56 L62 56 Q66 56 66 52 L66 48 Q92 42 95 9 Z" fill="url(#skaal)" stroke="#9aa3ad" stroke-width="1"/>
