      <stop offset="0" stop-color="#b9c0c8"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#e6eaee"/>
      <stop offset="1" stop-color="#a7afb8"/>
    </linearGradient>
    <linearGradient id="inde" x1="0" y1="0" x2="0" y2="1">
