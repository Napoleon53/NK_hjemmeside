<svg xmlns="http://www.w3.org/2000/svg" width="180" height="500" viewBox="0 0 90 250">
  <!-- Stativ med ring til tragten. Ringens midte er (58, 130),
       fodpladens overside er y 238. Ringen sidder lavt, saa tragten
       kan dryppe ned i en petriskaal paa fodpladen. -->
  <defs>
    <linearGradient id="stang" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6570"/>
      <stop offset="0.45" stop-color="#d9dee4"/>
      <stop offset="1" stop-color="#555c66"/>
    </linearGradient>
    <linearGradient id="fod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b525c"/>
      <stop offset="1" stop-color="#262a31"/>
    </linearGradient>
  </defs>
  <rect x="11" y="0" width="6" height="240" rx="2" fill="url(#stang)"/>
  <rect x="0" y="238" width="90" height="12" rx="2" fill="url(#fod)" stroke="#1c1f25" stroke-width="0.8"/>
  <path d="M2 239.5 h86" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Muffe og arm -->
  <rect x="7" y="124" width="15" height="12" rx="2" fill="#3a4049" stroke="#23272e" stroke-width="0.8"/>
  <circle cx="4" cy="130" r="3" fill="#8a929c"/>
  <rect x="22" y="128" width="12" height="4" fill="url(#stang)"/>
  <ellipse cx="58" cy="130" rx="25" ry="5" fill="none" stroke="#7d8591" stroke-width="3"/>
  <ellipse cx="58" cy="129.3" rx="25" ry="5" fill="none" stroke="#d3d8de" stroke-width="1" stroke-opacity="0.7"/>
</svg>
