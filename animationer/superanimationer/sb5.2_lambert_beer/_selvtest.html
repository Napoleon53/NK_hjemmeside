<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sb9.3 Lambert-Beers lov</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at modellen rammer Lambert-Beers lov og
   tabelværdierne, at fotonerne bliver absorberet efter I(x), at hver
   forudsigelse har ét rigtigt svar, der passer med modellen, at alle
   seks forudsigelser, fire standardkurver og otte regnestykker kan
   gennemføres med rigtige klik, træk og tastninger (og med Vis svaret),
   at hver typisk fejl får sin besked, at hintet er tre trin, sproget og
   layoutet fra 1100 × 700 til 1600 × 950.

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sb9.3-lys", "nk-sb9.3-kurve", "nk-sb9.3-regn"];
var ASCII_ORD = /\b(foer|faerdig|naeste|Naeste|gaa|staa|paa|foerst|hoejre|laerer\w*|traekker|aendr\w*|taeller|loest|maal\w*|proev\w*|toer\w*|broek\w*|staar)\b/;

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, LB = NK.LB, R = NK.Regn;
    var L = NK.sims["fane-lys"], K = NK.sims["fane-kurve"], G = NK.sims["fane-regn"];
    var tekster = [];
    function noter(t) { if (t !== undefined && t !== null) tekster.push(t); }

    /* Tegneloekken koerer ikke af sig selv i en skjult iframe: kør den */
    function koerTil(S, betingelse, max) {
        for (var i = 0; i < (max || 400); i++) {
            if (betingelse && betingelse()) return true;
            S.opdater(0.05);
        }
        return betingelse ? betingelse() : true;
    }
    function skyd(id, v) {
        var e = d.getElementById(id);
        e.value = v;
        e.dispatchEvent(new W.Event("input", { bubbles: true }));
        e.dispatchEvent(new W.Event("change", { bubbles: true }));
    }
    /* Pointer-hændelser paa et laerred i laerredets egne koordinater */
    function peg(cv, type, x, y) {
        var r = cv.getBoundingClientRect();
        cv.dispatchEvent(new W.PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, pointerId: 1, bubbles: true, button: 0, buttons: type === "pointerup" ? 0 : 1 }));
    }
    function klikPaa(cv, x, y) { peg(cv, "pointerdown", x, y); peg(cv, "pointerup", x, y); }
    /* Papirkortet */
    function kortTekst(S) { return S.el.skort.textContent; }
    function bliv(S, slags) { return !!S.el.ind.querySelector(".sk-bund.bliv" + (slags ? "." + slags : "")); }
    function graa(S) { return !S.el.indsend.hidden && S.el.indsend.classList.contains("ikke-klar"); }
    function klar(S) { return !S.el.indsend.hidden && S.el.indsend.classList.contains("klar"); }
    function indsend(S) { S.el.indsend.click(); }
    function skidt(S) { return /skidt/.test(S.el.status.className); }
    function traek(cv, x0, y0, x1, y1) {
        peg(cv, "pointerdown", x0, y0);
        for (var i = 1; i <= 8; i++) peg(cv, "pointermove", x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8);
        peg(cv, "pointerup", x1, y1);
    }

    /* ------------------------------------------------------------------ */
    overskrift("1. Modellen");
    paastand("A = ε · l · c: 2,45 · 1,00 · 0,20 = 0,490", Math.abs(LB.A(2.45, 1, 0.2) - 0.49) < 1e-12);
    paastand("T = 10^(−A): A = 1 giver 10 %, A = 2 giver 1 %", Math.abs(LB.T(1) - 0.1) < 1e-12 && Math.abs(LB.T(2) - 0.01) < 1e-12);
    paastand("lyset efter 2 cm er lyset efter 1 cm i anden", Math.abs(LB.lysEfter(2.45, 0.12, 2) - Math.pow(LB.lysEfter(2.45, 0.12, 1), 2)) < 1e-12);
    /* Fotonerne: andelen, der absorberes i den første halvdel, skal passe med I(x) */
    var n = 40000, foerst = 0, eps = 2.45, c = 0.4, l = 2;
    for (var i = 0; i < n; i++) if (LB.absorbX(eps, c, l, Math.random()) < l / 2) foerst++;
    var forventet = (1 - LB.lysEfter(eps, c, l / 2)) / (1 - LB.lysEfter(eps, c, l));
    paastand("de absorberede fotoner falder efter I(x): " + (foerst / n * 100).toFixed(1) + " % i første halvdel (forventet " + (forventet * 100).toFixed(1) + " %)",
        Math.abs(foerst / n - forventet) < 0.012);
    var ude = 0;
    for (i = 0; i < n; i++) { var x = LB.absorbX(eps, c, l, Math.random()); if (x < 0 || x > l + 1e-9) ude++; }
    paastand("ingen foton absorberes uden for kuvetten", ude === 0, ude);
    paastand("den bedste linje gennem (0, 0)", Math.abs(LB.haeldning([{ c: 1, A: 2 }, { c: 2, A: 4.2 }]) - (2 + 8.4) / 5) < 1e-12);
    var L1 = LB.laes("0,130 mM"), L2 = LB.laes("1,30·10^-4 M"), L3 = LB.laes("1,3e-4 M"), L4 = LB.laes("1,30 · 10⁻⁴ M"), L5 = LB.laes("0.13mmol/L");
    paastand("tal med enhed læses: 0,130 mM", L1.tal === 0.13 && L1.enhed === "mm", JSON.stringify(L1));
    paastand("potens læses: 1,30·10^-4 M, 1,3e-4 M og 1,30 · 10⁻⁴ M",
        Math.abs(L2.tal - 1.3e-4) < 1e-15 && Math.abs(L3.tal - 1.3e-4) < 1e-15 && Math.abs(L4.tal - 1.3e-4) < 1e-15 && L2.enhed === "m", JSON.stringify([L2, L3, L4]));
    paastand("M regnes om til mM, og mmol/L er mM", Math.abs(LB.omregn("c", L2).v - 0.13) < 1e-12 && LB.omregn("c", L5).enhed === "ok");
    paastand("en enhed efter A er forkert", LB.omregn("A", LB.laes("0,735 mM")).enhed === "forkert");

    /* ------------------------------------------------------------------ */
    overskrift("2. Stofferne og forudsigelserne");
    paastand("ε som i tabellerne: permanganat 2,45, FeSCN²⁺ 4,70 og [Fe(phen)₃]²⁺ 11,1 mM⁻¹·cm⁻¹",
        D.STOFFER.mno4.eps === 2.45 && D.STOFFER.fescn.eps === 4.70 && D.STOFFER.fephen.eps === 11.1);
    var fFejl = [];
    D.FORUD.forEach(function (f) {
        var ok = f.valg.filter(function (v) { return v.ok; });
        if (ok.length !== 1) fFejl.push(f.id + ": " + ok.length + " rigtige");
        var s = D.STOFFER[f.start.stof];
        if (Math.abs(f.start.c / s.cTrin - Math.round(f.start.c / s.cTrin)) > 1e-9) fFejl.push(f.id + ": c passer ikke med skyderen");
        if (f.hint.length !== 3) fFejl.push(f.id + ": hint");
        /* Facit ved maalet */
        var cM = f.maal.c ? (f.maal.c[0] + f.maal.c[1]) / 2 : f.start.c;
        var lM = f.maal.l ? (f.maal.l[0] + f.maal.l[1]) / 2 : f.start.l;
        if (f.maal.A) { cM = Math.round(1 / (s.eps * lM) / s.cTrin) * s.cTrin; }
        var A = LB.A(s.eps, lM, cM), T = LB.T(A);
        if (f.facit.T !== undefined && Math.abs(T - f.facit.T) > 0.006) fFejl.push(f.id + ": T = " + T.toFixed(4) + " mod " + f.facit.T);
        if (f.facit.A !== undefined && Math.abs(A - f.facit.A) > 0.0006) fFejl.push(f.id + ": A = " + A.toFixed(4) + " mod " + f.facit.A);
        /* Det rigtige svars tekst passer med facit */
        var t = ok[0] ? ok[0].t : "";
        if (f.facit.T !== undefined && /%/.test(t) && Math.round(T * 100) + " %" !== t) fFejl.push(f.id + ": " + t + " mod " + Math.round(T * 100) + " %");
        if (f.facit.A !== undefined && /^\d/.test(t) && NK.dk(A, 3) !== t) fFejl.push(f.id + ": " + t + " mod " + NK.dk(A, 3));
        noter(f.spm); noter(f.handling); noter(f.forklaring); f.hint.forEach(noter); f.valg.forEach(function (v) { noter(v.t); noter(v.n); });
        (f.trin || []).forEach(function (t) { noter(t.tekst); noter(t.ros); t.hint.forEach(noter); t.svar.forEach(function (v) { noter(v.t); noter(v.hvorfor); }); });
    });
    paastand("hver forudsigelse har ét rigtigt svar, og modellen giver det", fFejl.length === 0, fFejl.join(" | "));
    var start = D.FORUD[2].start, Ast = LB.A(D.STOFFER.mno4.eps, start.l, start.c);
    paastand("tallene i spørgsmålene passer: A = 0,490 og 32 % ved 0,20 mM", NK.dk(Ast, 3) === "0,490" && Math.round(LB.T(Ast) * 100) === 32);
    var A4 = LB.A(2.45, 1, 0.12);
    paastand("Én centimeter mere: 51 % efter 1 cm og 26 % efter 2 cm", Math.round(LB.T(A4) * 100) === 51 && Math.round(LB.T(2 * A4) * 100) === 26);

    /* ------------------------------------------------------------------ */
    overskrift("3. Fane 1 i brug: knapperne paa apparaterne (21. nov. 2026)");
    NK.visFane("fane-lys");
    var cv1 = d.getElementById("lys-laerred");
    L.tilpas();
    function synlig(id) { var e = d.getElementById(id); return !!e && !e.hidden && e.offsetParent !== null; }
    function klikN(id, n) { for (var q = 0; q < n; q++) d.getElementById(id).click(); }
    function tegnNu() { L.opdater(0.016); }
    /* Forbi trinene i den foerste forudsigelse med de rigtige svar */
    function forbiTrin() {
        for (var q = 0; q < 6 && L.fase === "trin"; q++) {
            var t = L.trinNu(), k = 0;
            t.svar.forEach(function (v, j) { if (v.ok) k = j; });
            d.querySelector('#lys-ind [data-valg="' + k + '"]').click();
            indsend(L);
            L.videreKlik();
        }
    }
    function vaelgSvar(nr, rigtig) {
        L.vaelg(nr);
        forbiTrin();
        var f = D.FORUD[nr], j = -1;
        f.valg.forEach(function (v, k) { if (!!v.ok === rigtig && j < 0) j = k; });
        d.querySelector('#lys-ind [data-gaet="' + j + '"]').click();
        return f;
    }
    /* Proev det med − og + (hoejst 12 klik), som eleven goer */
    function goerDet(nr) {
        var f = D.FORUD[nr], m = f.maal, e = 1e-9;
        for (var q = 0; q < 12; q++) {
            if (m.c && L.c > m.c[1] + e) d.getElementById("lys-c-ned").click();
            else if (m.c && L.c < m.c[0] - e) d.getElementById("lys-c-op").click();
            else if (m.l && L.l < m.l[0] - e) d.getElementById("lys-l-op").click();
            else if (m.l && L.l > m.l[1] + e) d.getElementById("lys-l-ned").click();
            else if (m.A && L.A() < m.A[0]) d.getElementById("lys-c-op").click();
            else if (m.A && L.A() > m.A[1]) d.getElementById("lys-c-ned").click();
            else break;
        }
        indsend(L);
    }
    function nulAlt() { L.status.forEach(function (st) { st.loest = false; st.stjerne = false; }); L.naaet = {}; }

    /* Trinene i den foerste forudsigelse */
    nulAlt();
    L.vaelg(0); tegnNu();
    paastand("forudsigelse 1 begynder med Trin 1 af 3 som et spørgsmål med tre svar",
        L.fase === "trin" && /Trin 1 af 3/.test(kortTekst(L)) && d.querySelectorAll("#lys-ind [data-valg]").length === 3, kortTekst(L).slice(0, 80));
    function knapperISzenen() {
        L.opdater(0.016);
        return ["lys-c-ned", "lys-c-op", "lys-l-ned", "lys-l-op", "lys-langsom", "lys-stoffer", "lys-boble"].filter(synlig);
    }
    paastand("fra start er kun lampen, strålen, kuvetten og detektoren fremme: kurven, T, A, tavlen og knapperne venter",
        !L.fremme("kurve") && !L.fremme("T") && !L.fremme("A") && !L.fremme("tavle") &&
        ["lys-c-ned", "lys-c-op", "lys-l-ned", "lys-l-op", "lys-langsom", "lys-stoffer", "lys-boble"].every(function (id) { return !synlig(id); }));
    paastand("under trinnet er scenen låst: et klik på kuvetten får kortet til at blinke", (function () {
        L.el.skort.classList.remove("blink");
        var g = L.geo();
        klikPaa(cv1, g.cx, g.ct + g.cuvH * 0.4);
        return L.el.skort.classList.contains("blink") && L.fase === "trin";
    })());
    paastand("et forkert svar i trin 1 bliver rødt og får sin egen forklaring", (function () {
        d.querySelector('#lys-ind [data-valg="1"]').click(); indsend(L);
        noter(L.beskedTekst());
        var b = d.querySelector('#lys-ind [data-valg="1"]');
        return b.classList.contains("forkert") && skidt(L) && /skifter ikke farve/.test(L.beskedTekst()) && !L.venter;
    })(), L.beskedTekst());
    paastand("det rigtige svar i trin 1: kurven Lys tilbage kommer frem, og kortet bliver på spørgsmålet med Næste", (function () {
        d.querySelector('#lys-ind [data-valg="0"]').click(); indsend(L);
        noter(kortTekst(L));
        return !!L.venter && bliv(L, "god") && L.fremme("kurve") && !L.fremme("T");
    })());
    paastand("trin 2: det rigtige svar (32 %) giver T i displayet; så kommer gættet som Trin 3 af 3", (function () {
        L.videreKlik();
        var ok1 = /Trin 2 af 3/.test(kortTekst(L));
        d.querySelector('#lys-ind [data-valg="1"]').click(); indsend(L);
        var ok2 = !!L.venter && L.fremme("T") && !L.fremme("A");
        L.videreKlik();
        return ok1 && ok2 && L.fase === "gaet" && /Trin 3 af 3/.test(kortTekst(L)) && d.querySelectorAll("#lys-ind [data-gaet]").length === 3;
    })(), kortTekst(L).slice(0, 80));
    paastand("mens kortet spørger, er der ingen klik-opfordring", (function () { tegnNu(); return !synlig("lys-boble") && !d.querySelector(".opfordring"); })());
    paastand("efter gættet kommer − og + frem ved etiketten, og − har gul ramme og boblen Klik: fortynd", (function () {
        d.querySelector('#lys-ind [data-gaet="0"]').click(); tegnNu();
        return synlig("lys-c-ned") && synlig("lys-c-op") && d.getElementById("lys-c-ned").classList.contains("opfordring") &&
            synlig("lys-boble") && d.getElementById("lys-boble").textContent === "Klik: fortynd" && !synlig("lys-l-op");
    })(), d.getElementById("lys-boble").textContent);
    paastand("fire klik på − giver 0 mM, og så forsvinder boblen; Indsend svar giver Rigtigt", (function () {
        klikN("lys-c-ned", 4); tegnNu();
        var ok = Math.abs(L.c) < 1e-9 && !synlig("lys-boble") && !d.querySelector(".opfordring") && klar(L);
        indsend(L);
        return ok && L.faerdig && /Rigtigt/.test(kortTekst(L));
    })(), L.c);
    paastand("forudsigelse 2: A i displayet, tavlen og (ved Prøv det) Langsomt lys kommer frem; bredden endnu ikke", (function () {
        L.vaelg(1); d.querySelector('#lys-ind [data-gaet="0"]').click(); tegnNu();
        return L.fremme("A") && L.fremme("tavle") && synlig("lys-langsom") && !L.fremme("l") && !synlig("lys-l-op");
    })());
    paastand("forudsigelse 4: ved Prøv det kommer − og + ved l og grebet på kuvetten frem, men ikke − og + ved c", (function () {
        L.vaelg(3); d.querySelector('#lys-ind [data-gaet="1"]').click(); tegnNu();
        return L.fremme("l") && synlig("lys-l-op") && synlig("lys-l-ned") && L.styrVis("l") && !synlig("lys-c-op");
    })());
    paastand("er forudsigelse 1 løst, er alt fremme fra start; Start forfra giver trinene igen", (function () {
        L.status[0].loest = true;
        L.vaelg(0);
        var foer = L.fase === "gaet" && L.fremme("kurve") && L.fremme("T");
        d.getElementById("lys-forfra").click();
        return foer && L.fase === "trin" && !L.fremme("kurve");
    })());
    paastand("stofferne kommer først frem, når alle seks forudsigelser er prøvet", (function () {
        nulAlt(); L.naaet[2] = true; L.vaelg(2); d.querySelector('#lys-ind [data-gaet="0"]').click(); tegnNu();
        var foer = !synlig("lys-stoffer");
        L.status.forEach(function (st) { st.loest = true; });
        L.vaelg(2); d.querySelector('#lys-ind [data-gaet="0"]').click(); tegnNu();
        var efter = synlig("lys-stoffer");
        nulAlt();
        return foer && efter;
    })());
    paastand("regel 19a: under alle trin og gæt er der ingen knapper, intet greb og ingen boble i scenen", (function () {
        var fejl19 = [];
        L.status.forEach(function (st) { st.loest = false; }); L.naaet = {};
        L.vaelg(0);
        for (var q = 0; q < 2; q++) {
            var k = knapperISzenen();
            if (k.length) fejl19.push("trin " + (q + 1) + ": " + k.join(","));
            L.svarValgt(L.trinNu().svar.map(function (v) { return !!v.ok; }).indexOf(true));
            if (knapperISzenen().length) fejl19.push("trin " + (q + 1) + " med Næste");
            L.videreKlik();
        }
        D.FORUD.forEach(function (f, nr) {
            L.naaet[nr] = true; L.status.forEach(function (st) { st.loest = true; });
            L.vaelg(nr);
            var k2 = knapperISzenen();
            if (k2.length || L.styrVis("l")) fejl19.push(f.id + " gæt: " + k2.join(","));
            d.querySelector('#lys-ind [data-gaet="0"]').click();
            var proev = knapperISzenen();
            var m = f.maal;
            if ((m.c || m.A) && proev.indexOf("lys-c-op") < 0) fejl19.push(f.id + " prøv: mangler c");
            if (!(m.l || m.A) && proev.indexOf("lys-l-op") >= 0) fejl19.push(f.id + " prøv: l uden brug");
            if (!(m.c || m.A) && proev.indexOf("lys-c-op") >= 0) fejl19.push(f.id + " prøv: c uden brug");
        });
        L.status.forEach(function (st) { st.loest = false; }); L.naaet = {};
        return fejl19.length === 0 || (noter(fejl19.join(" | ")), false);
    })());
    paastand("rolige fotoner: højst 128 px/s (40 % af før), med langsomt lys højst 40 px/s", (function () {
        var max = 0, maxL = 0, q;
        for (q = 0; q < 300; q++) max = Math.max(max, L.fart());
        L.langsom = true; for (q = 0; q < 300; q++) maxL = Math.max(maxL, L.fart()); L.langsom = false;
        return max <= 128 && maxL <= 40;
    })());

    nulAlt();
    var forkertOk = [], rigtigOk = [];
    D.FORUD.forEach(function (f, nr) {
        L.naaet[nr] = true;
        vaelgSvar(nr, false);
        noter(L.beskedTekst());
        goerDet(nr);
        var kb = L.el.ind.querySelectorAll("button[data-valg]");
        var jf = -1; f.valg.forEach(function (v, k) { if (!v.ok && jf < 0) jf = k; });
        if (!(L.faerdig && /Prøvet/.test(kortTekst(L)) && bliv(L, "svar") && kb[jf] && kb[jf].classList.contains("forkert"))) forkertOk.push(f.id + ": " + kortTekst(L).slice(0, 60) + " c=" + L.c + " l=" + L.l);
        noter(kortTekst(L));
        vaelgSvar(nr, true);
        goerDet(nr);
        if (!(L.faerdig && /Rigtigt/.test(kortTekst(L)) && bliv(L, "god") && !!L.el.ind.querySelector("[data-videre]"))) rigtigOk.push(f.id + ": " + kortTekst(L).slice(0, 60));
    });
    paastand("alle seks kan prøves med − og + på apparaterne, også efter et forkert gæt", forkertOk.length === 0, forkertOk.join(" | "));

    overskrift("6. Sproget");
    (function saml(x) {
        if (typeof x === "string") tekster.push(x);
        else if (Array.isArray(x)) x.forEach(saml);
        else if (x && typeof x === "object") Object.keys(x).forEach(function (k) { if (k.charAt(0) !== "_") saml(x[k]); });
    }({ K: D.KURVE, F: D.FAERDIG, R: D.ROS_OPGAVE, B: D.BOGSTAV, T: D.TRIN }));
    D.REGN.forEach(function (o2, nr) {
        o2.trin.forEach(function (id, i) { R.formelHint(id).forEach(noter); R.resHint(o2, i).forEach(noter); });
        noter(R.ENHED_FORKLARING);
    });
    tekster.push(d.getElementById("teori").textContent, d.body.textContent);
    var ren = tekster.map(function (t) { return typeof t === "string" ? t : JSON.stringify(t); });
    var tanke = ren.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger", tanke.length === 0, tanke.slice(0, 2).join(" | "));
    var en = ren.filter(function (t) { return /[A-Za-z)\]]¹[⁺⁻]|[A-Za-z)\]]1[+−](?![\d ])/.test(t); });
    paastand("ingen 1+ eller 1− som ladning", en.length === 0, en.slice(0, 2).join(" | "));
    var ascii = ren.filter(function (t) { return ASCII_ORD.test(t.replace(/<[^>]*>/g, "")); });
    paastand("ingen ord uden æ, ø og å", ascii.length === 0, ascii.slice(0, 2).join(" | "));
    var natron = ren.filter(function (t) { return /natronlud/i.test(t); });
    paastand("ingen natronlud", natron.length === 0);
    var punktum = ren.filter(function (t) { return /\d\.\d/.test(t.replace(/<[^>]*>/g, "").replace(/\d+\.\d+\.\d+/g, "").replace(/\b[ABCT]\d+\.\d+\b/g, "")); });
    paastand("decimaltal med komma", punktum.length === 0, punktum.slice(0, 2).join(" | "));

    /* ------------------------------------------------------------------ */
    overskrift("7. Layoutet");
    var ramme = document.getElementById("ramme");
    var maal = [[1100, 700], [1300, 820], [1500, 900], [1600, 950], [1920, 1080]];
    var lFejl = [];
    function under(a, b) { return a.getBoundingClientRect().bottom <= b.getBoundingClientRect().top + 1; }
    function inden(e, r) { var q = e.getBoundingClientRect(); return q.left >= r.left - 1 && q.right <= r.right + 1 && q.top >= r.top - 1 && q.bottom <= r.bottom + 1; }
    maal.forEach(function (m) {
        var navn = m.join("×");
        ramme.style.width = m[0] + "px";
        ramme.style.height = m[1] + "px";
        NK.visFane("fane-lys");
        L.naaet = { 0: true, 1: true, 2: true, 3: true, 4: true };
        L.status.forEach(function (st) { st.loest = true; });
        L.vaelg(4); L.tilpas();
        d.querySelector('#lys-ind [data-gaet="0"]').click();
        [1, 3].forEach(function (lv) {
            L.saetL(lv, false);
            L.opdater(0.016);
            var g = L.geo();
            if (g.kBund - g.kTop < 80) lFejl.push(navn + " kurven er lav");
            if (L.tag.y + L.tag.h > g.H) lFejl.push(navn + " etiketten uden for lærredet");
            if (g.bw > 1200) lFejl.push(navn + " optikbænken er " + g.bw + " px bred");
            if (Math.abs(g.bx0 - (g.W - g.bx1)) > 2) lFejl.push(navn + " optikbænken står ikke i midten");
            var fo = L.formel;
            if (!fo || fo.x < 0 || fo.x + fo.b > g.W) lFejl.push(navn + " loven uden for lærredet");
            else if (fo.y > 12 || fo.y + fo.h > g.kTop - 16) lFejl.push(navn + " loven står ikke øverst lige under kortet");
            else if (Math.abs(fo.x + fo.b / 2 - g.W / 2) > 2) lFejl.push(navn + " loven står ikke i midten");
            if (g.cl < g.x0 + 30 || g.cr > g.x1 - 30) lFejl.push(navn + " kuvetten uden for strålen ved l = " + lv);
            if (L.dispBund > g.H) lFejl.push(navn + " displayet uden for lærredet");
            if (g.ly < g.kBund - 40) lFejl.push(navn + " lampen rører kurven");
            var cr = cv1.getBoundingClientRect();
            ["lys-c-ned", "lys-c-op", "lys-l-ned", "lys-l-op", "lys-langsom", "lys-stoffer"].forEach(function (id) {
                var e = d.getElementById(id);
                if (!e.hidden && !inden(e, cr)) lFejl.push(navn + " " + id + " uden for lærredet ved l = " + lv);
            });
            var st = d.getElementById("lys-stoffer");
            if (!st.hidden && st.getBoundingClientRect().bottom > cr.bottom + 1) lFejl.push(navn + " stofferne uden for lærredet");
        });
        var sp = d.querySelector("#fane-lys .kortzone").getBoundingClientRect(), cvr = cv1.getBoundingClientRect();
        if (cvr.height < 300) lFejl.push(navn + " lærredet på fane 1 er kun " + Math.round(cvr.height) + " px");
        if (sp.bottom > cvr.top + 1) lFejl.push(navn + " kortzonen over lærredet");
        L.status.forEach(function (st) { st.loest = false; st.stjerne = false; });
        L.naaet = {};
        NK.visFane("fane-kurve");
        K.vaelg(3); K.tilpas();
        var g2 = K.geo();
        if (g2.bakkeY + g2.bakkeH > g2.H) lFejl.push(navn + " bakken uden for lærredet");
        if (g2.tabY + g2.tabH > g2.H) lFejl.push(navn + " tabellen Målingerne uden for lærredet");
        if (g2.gy1 - g2.gy0 < 250 || g2.gx1 - g2.gx0 < 300) lFejl.push(navn + " grafen er lille");
        if (g2.W > 1340 || Math.abs(g2.ox - (K.laerred.b - g2.W - g2.ox)) > 2) lFejl.push(navn + " standardkurvens opstilling er ikke samlet i midten");
        if (g2.dispY + g2.dispH > g2.sy + g2.sh) lFejl.push(navn + " displayet uden for spektrofotometret");
        if (g2.slotY + g2.kh + 6 > g2.dispY) lFejl.push(navn + " displayet rører kuvetten");
        NK.visFane("fane-regn");
        D.REGN.forEach(function (o2, nr) {
            G.vaelg(nr);
            /* Den stoerste tavle: alle dele loest undtagen den sidste, der staar med tallet */
            for (var q = 0; q < 60; q++) {
                var st = G.aktivt();
                if (!st || (G.k === G.ts.length - 1 && st.fase === "tal")) break;
                if (G.venter) G.videreKlik(); else G.knap();
            }
            G.tilpas();
            var tv = d.getElementById("regn-tavle");
            if (tv.scrollHeight > tv.clientHeight + 1) lFejl.push(navn + " tavlen er for høj " + o2.id);
            if (tv.scrollWidth > tv.clientWidth + 1) lFejl.push(navn + " tavlen er for bred " + o2.id);
            if (!under(d.querySelector("#fane-regn .kortzone"), tv)) lFejl.push(navn + " tavlen bag kortet " + o2.id);
            if (G.tegnBund > G.laerred.h + 1) lFejl.push(navn + " opstillingen er for høj " + o2.id + " (" + Math.round(G.tegnBund) + " > " + G.laerred.h + ")");
            if (G.tegnHoejre > G.laerred.b + 1) lFejl.push(navn + " opstillingen er for bred " + o2.id);
            var lin = tv.querySelector(".pt-linje");
            var fs = lin ? parseFloat(W.getComputedStyle(lin).fontSize) : 99;
            if (fs < 16) lFejl.push(navn + " skriften på tavlen er " + fs + " px " + o2.id);
        });
        G.status.forEach(function (st) { st.loest = false; st.stjerne = false; });
        G.naaet = {};
        ["lys", "kurve", "regn"].forEach(function (f) {
            NK.visFane("fane-" + f);
            var r = d.getElementById(f + "-raekke");
            if (r.scrollWidth > r.clientWidth + 1) lFejl.push(navn + " rækken på " + f + " er for bred");
            if (!under(r, d.querySelector("#fane-" + f + " .scenekort"))) lFejl.push(navn + " rækken rører kortet på " + f);
        });
    });
    paastand("lærred, knapper, regnestykke og række kan være der fra 1100 × 700 til 1920 × 1080; bænken er højst 1200 px og står i midten", lFejl.length === 0, lFejl.slice(0, 5).join(", "));

    /* ------------------------------------------------------------------ */
    overskrift("8. Papirkortet");
    paastand("body.papirkort, ingen statuslinje, opgavelinje, Tjek-knap, bakke eller panel",
        d.body.classList.contains("papirkort") && !d.querySelector(".statuslinje") && !d.querySelector(".opgavelinje") && !d.querySelector(".tjekknap") &&
        !d.querySelector(".panel") && !d.querySelector(".bakke"));
    paastand("de tre kort står i scenen, og Start forfra står i rækken øverst, aldrig på kortet",
        ["lys", "kurve", "regn"].every(function (n) {
            var e = d.getElementById(n + "-skort");
            return e && e.closest(".scene") && !e.querySelector("[id$=forfra]") && d.getElementById(n + "-forfra").closest(".opgaverad");
        }));
    /* Kortet med det laengste hint, en lang fejl og forklaringen skal kunne
       vaere i zonen, ogsaa paa en lav skaerm, i hvert skridt */
    var zFejl = [];
    var LANG = "Med c = 0,050 mM og l = 1,00 cm passer kuvetten ikke med opgaven. Gør kuvetten 2,00 cm bred med + ved kuvettebredden eller grebet på kuvettens højre side.";
    function maalKort(S, hvad, nv) {
        var e = S.el.skort, z = S.kortZone();
        var r1 = e.getBoundingClientRect(), r2 = e.parentNode.getBoundingClientRect();
        if (e.offsetHeight + 10 > z || r1.bottom > r2.bottom + 1) zFejl.push(nv + " " + S.navn + " " + hvad + " " + e.offsetHeight + ">" + z);
    }
    function proevKort(S, nv) {
        maalKort(S, "start", nv);
        var h = S.hintNu().slice().sort(function (a, b) { return b.length - a.length; })[0];
        S.besked('<span class="b-maerke">Hint 3 af 3</span> ' + h, "hint"); maalKort(S, "hint", nv);
        if (!S.gaetNu()) { S.besked('<span class="b-maerke">Ikke endnu</span> ' + NK.html(LANG), "skidt"); maalKort(S, "fejl", nv); }
        S.besked("", "");
    }
    function loes(S, nv) {
        for (var q = 0; q < 80 && !S.faerdig; q++) {
            if (S.venter) { maalKort(S, "næste " + q, nv); S.videreKlik(); proevKort(S, nv + " skridt " + q); }
            else S.knap();
            koerTil(S, function () { return !S.auto && !S.maaling && !(S.koe && S.koe.length); }, 600);
        }
        return S.faerdig;
    }
    var uloest = [];
    [[1100, 700], [1400, 860], [1600, 950]].forEach(function (m) {
        var nv = m.join("×");
        ramme.style.width = m[0] + "px";
        ramme.style.height = m[1] + "px";
        [["fane-lys", L], ["fane-kurve", K], ["fane-regn", G]].forEach(function (fs) {
            NK.visFane(fs[0]);
            var S = fs[1];
            S.status.forEach(function (s2) { s2.loest = false; s2.stjerne = false; });
            for (var i2 = 0; i2 < S.opgaver.length; i2++) {
                S.naaet = S.naaet || {}; S.naaet[i2] = true;
                S.vaelg(i2); S.tilpas();
                proevKort(S, nv + "#" + i2);
                if (S === L && L.fase === "gaet") { d.querySelector('#lys-ind [data-gaet="0"]').click(); proevKort(S, nv + "#" + i2 + " prøv"); }
                if (!loes(S, nv + "#" + i2)) uloest.push(S.navn + i2);
                maalKort(S, "løst", nv + "#" + i2);
                noter(kortTekst(S));
            }
            S.status.forEach(function (s2) { s2.loest = false; s2.stjerne = false; });
            S.naaet = {};
        });
    });
    paastand("kortet holder sig i zonen i hvert skridt med hint, fejl og forklaring (1100 × 700, 1400 × 860, 1600 × 950)", zFejl.length === 0, zFejl.slice(0, 5).join(", "));
    paastand("alle opgaver kan løses med Giv et hint, Vis svaret og Næste", uloest.length === 0, uloest.join(", "));
    ramme.style.width = "1300px";
    ramme.style.height = "820px";
    var smaa = [];
    ["fane-lys", "fane-kurve", "fane-regn"].forEach(function (f) {
        NK.visFane(f);
        d.querySelectorAll("#" + f + " .opgaverad *, #" + f + " .papirtavle *, #" + f + " .scenekort *, #" + f + " .styr-knap, #" + f + " .scene-knap, #" + f + " .scene-knap *").forEach(function (e) {
            if (!e.childNodes.length || !e.textContent.trim() || e.offsetParent === null) return;
            var egen = Array.prototype.some.call(e.childNodes, function (n2) { return n2.nodeType === 3 && n2.textContent.trim(); });
            if (!egen) return;
            var px = parseFloat(W.getComputedStyle(e).fontSize);
            if (px < 11.5) smaa.push(e.className + " " + px);
        });
    });
    paastand("ingen tekst under 11,5 px", smaa.length === 0, smaa.slice(0, 4).join(", "));
    paastand("kortets plads er fast: scenen skifter ikke størrelse, når kortet skifter (fane 1)", (function () {
        NK.visFane("fane-lys");
        L.status.forEach(function (s2) { s2.loest = false; }); L.naaet = {};
        L.vaelg(0); L.tilpas();
        var h0 = cv1.getBoundingClientRect().height, ens = true;
        d.querySelector('#lys-ind [data-valg="1"]').click(); indsend(L);
        if (cv1.getBoundingClientRect().height !== h0) ens = false;
        forbiTrin(); d.querySelector('#lys-ind [data-gaet="0"]').click();
        L.kortBesked("En kort besked, der gør kortet en linje højere end før, så scenen kunne hoppe, hvis kortets plads fulgte kortet.", 4);
        if (cv1.getBoundingClientRect().height !== h0) ens = false;
        return ens;
    })());

    /* ------------------------------------------------------------------ */
    overskrift("9. Opgaverækken låser titlerne op i takt (21. nov. 2026)");
    function raekkerAf(f) { return [].slice.call(d.querySelectorAll("#" + f + "-liste .or-knap")).filter(function (c) { return !c.hidden; }); }
    function laastNr(c) { return c.disabled && c.classList.contains("laast") && !c.querySelector(".or-navn").textContent && /^\d+$/.test(c.textContent.trim()); }
    [[L, "lys", "Vand i kuvetten", "Dobbelt c: absorbansen"], [K, "kurve", "Permanganat", "Jern(III), rødt"],
     [G, "regn", "Find A", "Find c"]].forEach(function (x) {
        var F = x[0], f = x[1];
        NK.visFane("fane-" + f);
        F.status.forEach(function (st) { st.loest = false; st.stjerne = false; });
        F.naaet = {};
        F.vaelg(0);
        var r = raekkerAf(f);
        var antal = f === "regn" ? 3 : F.opgaver.length;
        paastand(f + ": ved start har kun opgave 1 sit tema; de andre er et låst nummer uden tema",
            r.length === antal && r[0].textContent.indexOf(x[2]) >= 0 && !r[0].disabled && r.slice(1).every(laastNr),
            r.map(function (c) { return c.textContent.trim(); }).join(" | "));
        r[2].click();
        paastand(f + ": et klik på en låst opgave gør intet", F.nr === 0);
        F.loest("svar", "");
        r = raekkerAf(f);
        paastand(f + ": når opgave 1 er løst (Vis svaret tæller), kommer temaet på opgave 2 frem; resten er stadig låst",
            r[1].textContent.indexOf(x[3]) >= 0 && !r[1].disabled && r.slice(2).every(laastNr),
            r.map(function (c) { return c.textContent.trim(); }).join(" | "));
        r[1].click();
        paastand(f + ": opgave 2 kan nu vælges i rækken", F.nr === 1);
        F.status.forEach(function (st) { st.loest = false; st.stjerne = false; });
        F.naaet = {};
    });
    paastand("regn: Let, Middel og Svær står først i rækken og kan altid vælges; så står kun opgaverne på niveauet", (function () {
        NK.visFane("fane-regn");
        G.vaelg(0);
        var niv = [].slice.call(d.querySelectorAll("#regn-niveau .or-knap"));
        var tekst = niv.map(function (b) { return b.textContent; }).join(",");
        niv[2].click();
        var svaer = G.nr === 6 && raekkerAf("regn").length === 2 && niv[2].classList.contains("valgt");
        niv[0].click();
        return tekst === "Let,Middel,Svær" && svaer && G.nr === 0;
    })());
    paastand("under 1200 px står kun numrene i rækken, og temaet står på kortet", (function () {
        ramme.style.width = "1100px"; ramme.style.height = "760px";
        NK.visFane("fane-lys"); L.vaelg(0);
        var navnSkjult = W.getComputedStyle(d.querySelector("#lys-liste .or-navn")).display === "none";
        var ok = navnSkjult && /Vand i kuvetten/.test(kortTekst(L));
        ramme.style.width = "1300px"; ramme.style.height = "820px";
        return ok;
    })());

    /* ------------------------------------------------------------------ */
    overskrift("10. Teorien (regel 31)");
    var tb = d.querySelector("#teori .overlay-boks");
    paastand("teorien står på det lyse ark i Lexend (faelles/teori.css)", tb.classList.contains("teori-ark") && /Lexend/.test(W.getComputedStyle(tb).fontFamily) &&
        !!d.querySelector('link[href="../faelles/teori.css"]'));
    paastand("teorien slutter med en henvisning til B5.2 i Kemibogen", (function () {
        var a = d.querySelector("#teori .teori-bog a");
        return !!a && a.href === "https://kemibogen.dk/b/kapitler/b5-2-absorbans-og-lambert-beers-lov.html" && /B5\.2/.test(a.textContent);
    })());
    paastand("teorien er kort (under 1000 tegn) og har ingen overskrifter i versaler", (function () {
        var t = tb.cloneNode(true);
        [].slice.call(t.querySelectorAll(".genveje, .knapper, .teori-bog")).forEach(function (e) { e.remove(); });
        var hs = [].slice.call(tb.querySelectorAll("h3"));
        return t.textContent.replace(/\s+/g, " ").trim().length < 1000 && hs.every(function (h) { return W.getComputedStyle(h).textTransform === "none"; });
    })());
    NK.visFane("fane-lys");
}
