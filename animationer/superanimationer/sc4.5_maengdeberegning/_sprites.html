<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc4.5 Mængdeberegning</title>
<style>
    body { background: #1b1d24; color: #dde3ea; font-family: "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 1rem; margin: 0 0 14px; color: #f2c53d; }
    .ark { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; padding: 12px; background: #262833; border: 1px solid #3a3a47; border-radius: 8px; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    figcaption { font-size: 0.8rem; color: #a9b0ba; }
</style>
</head>
<body>
<!-- Udviklerværktøj: viser sprites alene, før de sættes i bevægelse. Indgår ikke i animationen. -->
<h1>sc4.5: sprites i dobbelt størrelse</h1>
<div class="ark">
    <figure><img src="sprites/kateder.svg" width="600"><figcaption>kateder.svg (ny)</figcaption></figure>
    <figure><img src="sprites/vaegt.svg" width="480"><figcaption>vaegt.svg (som sc4.2)</figcaption></figure>
    <figure><img src="sprites/vejebaad.svg" width="240"><figcaption>vejebaad.svg (som sc4.2)</figcaption></figure>
    <figure><img src="sprites/pulverglas.svg" width="200"><figcaption>pulverglas.svg (som sc4.2)</figcaption></figure>
    <figure><img src="sprites/skaal_fod.svg" width="200"><figcaption>skaal_fod.svg (som sc4.1)</figcaption></figure>
    <figure><img src="sprites/skaal_arm.svg" width="400"><figcaption>skaal_arm.svg (som sc4.1)</figcaption></figure>
    <figure><img src="sprites/skaal_skaal.svg" width="160"><figcaption>skaal_skaal.svg (som sc4.1)</figcaption></figure>
</div>
</body>
</html>
