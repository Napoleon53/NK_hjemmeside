<svg xmlns="http://www.w3.org/2000/svg" width="64" height="128" viewBox="0 0 64 128">
  <!-- Draabeflaske af brunt glas med dryppetud. Tudens spids er (32, 1);
       det er ankerpunktet, naar flasken holdes med tuden nedad over et
       urglas. Etiketten (x 8-56, y 66-104) skrives af animationen. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a250c"/>
      <stop offset="0.35" stop-color="#7a4418"/>
      <stop offset="0.6" stop-color="#6a3913"/>
      <stop offset="1" stop-color="#3b1d08"/>
    </linearGradient>
    <linearGradient id="haette" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16181c"/>
      <stop offset="0.4" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
  </defs>
  <!-- Tuden -->
  <path d="M30 1 L34 1 Q35 1 35.4 3 L38 18 L26 18 L28.6 3 Q29 1 30 1 Z" fill="#eceff2" stroke="#8b939c" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Haetten -->
  <rect x="19" y="17" width="26" height="19" rx="3" fill="url(#haette)"/>
  <path d="M22 20 V33 M27 20 V33 M32 20 V33 M37 20 V33 M42 20 V33" stroke="#000000" stroke-opacity="0.35" stroke-width="1.4"/>
  <!-- Flasken -->
  <path d="M23 36 L41 36 L41 42 Q58 46 60 60 L60 119 Q60 126 53 126 L11 126 Q4 126 4 119 L4 60 Q6 46 23 42 Z"
        fill="url(#glas)" stroke="#2a1405" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M10 60 Q11 50 20 46" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M9 62 L9 116" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <!-- Etiketten -->
  <rect x="8" y="66" width="48" height="38" rx="3" fill="#f7f2e3" stroke="#b9ae90" stroke-width="1"/>
  <path d="M8 72 H56" stroke="#c0392b" stroke-width="2"/>
</svg>
