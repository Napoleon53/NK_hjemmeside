<svg xmlns="http://www.w3.org/2000/svg" width="220" height="84" viewBox="0 0 220 84">
  <!-- Urglas set lidt oppefra. Kanten er ellipsen (110, 22) rx 104 ry 18.
       Vaesken tegnes af animationen foer glasset, i omridset
       M26 30 A84 13 0 0 1 194 30 Q180 60 110 63 Q40 60 26 30 Z
       med overfladen som ellipsen (110, 30) rx 84 ry 13.
       Glasset hviler paa pladen i (110, 72). -->
  <defs>
    <linearGradient id="skal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4fb" stop-opacity="0.06"/>
      <stop offset="0.7" stop-color="#d7e8f4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bcd4e6" stop-opacity="0.42"/>
    </linearGradient>
  </defs>
  <!-- Skaalen under kanten -->
  <path d="M6 22 Q16 68 110 72 Q204 68 214 22" fill="url(#skal)" stroke="#51657a" stroke-opacity="0.75" stroke-width="1.7" stroke-linejoin="round"/>
  <!-- Kanten -->
  <ellipse cx="110" cy="22" rx="104" ry="18" fill="#e6f1f9" fill-opacity="0.07" stroke="#45596c" stroke-opacity="0.8" stroke-width="1.8"/>
  <ellipse cx="110" cy="22.5" rx="100.5" ry="15.8" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.2"/>
  <!-- Glimt -->
  <path d="M30 36 Q48 58 90 64" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M156 9 Q186 11 202 20" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M172 58 Q192 50 200 40" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.6" stroke-linecap="round"/>
</svg>
