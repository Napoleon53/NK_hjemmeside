<svg xmlns="http://www.w3.org/2000/svg" width="144" height="180" viewBox="0 0 72 90">
  <!-- Baegerglas 250 mL med haeldetud til hoejre. Tuden (ankeret) er
       (68, 3). Inderside: x 8-64 fra y 4 til bunden y 86. Indholdet
       tegnes af animationen bag denne fil. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.38"/>
      <stop offset="0.16" stop-color="#d4ebfa" stop-opacity="0.08"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <path d="M4 2 L6 4 L6 82 Q6 89 13 89 L59 89 Q66 89 66 82 L66 5 L70 1 Z" fill="url(#glas)"/>
  <path d="M4 2 L6 4 L6 82 Q6 89 13 89 L59 89 Q66 89 66 82 L66 5 L70 1" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M3 1.5 L70 1" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8 6 L8 82 Q8 86 12 86 L60 86 Q64 86 64 82 L64 6" fill="none" stroke="#dcecf8" stroke-opacity="0.2" stroke-width="1"/>
