<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest, EscapeRoom Kemi C</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1366px; height:768px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i spillet og kan slettes.

   Aabner index.html?alene i en iframe (1366 x 768) og kontrollerer
   kemien (afstemning, stregtal, frie elektronpar, isotoper,
   faeldningstabellen mod sc2.4 og elektronegativiteterne mod sc3.3),
   2000 tilfaeldige sager (koden og guldkoden er robuste over for
   afrunding), forloebet trin for trin i alle fem rum, bonusruten,
   begge slutninger og seglene, beviset, sproget og skaermen.
   Andre spils rekorder i browseren gemmes foer testen og laegges
   tilbage bagefter. Skal koeres gennem en lokal server.
   ===================================================================== */
var linjer = [], fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); vis(true); }
function vis(undervejs) {
    document.getElementById("ud").innerHTML = linjer.join("\n")
        + (undervejs ? "\n\nKører …" : "\n\n" + (fejl ? '<span class="fejl">' + fejl + " FEJL</span>" : '<span class="ok">ALT OK</span>'));
}
function hentTekst(sti) {
    try { var x = new XMLHttpRequest(); x.open("GET", sti, false); x.send(); return x.status === 200 ? x.responseText : ""; } catch (e) { return ""; }
}

var ANDRE = ["nk-million-rekord", "nk-syregalgen", "nk-pacman-klaret", "nk-organiske-c-rekord", "orgSortering_bestAllTime", "nk-escaperoom"];
var gemt = {};
ANDRE.forEach(function (k) { gemt[k] = localStorage.getItem(k); });
function rydAndre() { ANDRE.forEach(function (k) { localStorage.removeItem(k); }); }
function genskab() {
    ANDRE.forEach(function (k) { if (gemt[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, gemt[k]); });
}

var ramme = document.getElementById("ramme");
function aabn(b, hh) {
    ramme.style.width = (b || 1366) + "px";
    ramme.style.height = (hh || 768) + "px";
    return new Promise(function (ok) {
        ramme.onload = function () { ok(ramme.contentWindow); };
        ramme.src = "index.html?alene&t=" + Date.now();
    });
}

/* Atomer i en formel uden parenteser: "Al2O3(s)" -> { Al: 2, O: 3 } */
function atomer(f) {
    var u = {}, m, re = /([A-Z][a-z]?)(\d*)/g;
    f = f.replace(/\([a-z]+\)$/, "");
    while ((m = re.exec(f))) u[m[1]] = (u[m[1]] || 0) + (m[2] ? Number(m[2]) : 1);
    return u;
}
function tilCifre(s) { return s.replace(/[₀-₉]/g, function (c) { return String(c.charCodeAt(0) - 0x2080); }); }
function lig(a, b) {
    var k = {}; Object.keys(a).concat(Object.keys(b)).forEach(function (x) { k[x] = 1; });
    return Object.keys(k).every(function (x) { return (a[x] || 0) === (b[x] || 0); });
}
function sum(liste) {
    var u = {};
    liste.forEach(function (p) { var a = atomer(p[1]); Object.keys(a).forEach(function (x) { u[x] = (u[x] || 0) + a[x] * p[0]; }); });
    return u;
}
function gcd(a, b) { return b ? gcd(b, a % b) : a; }

async function koer() {
    rydAndre();
    var w = await aabn();
    var NK = w.NK, D = NK.D, Sag = NK.Sag, Se = NK.Sedler;

    /* ------------------------------------------------------------- */
    overskrift("1. Kemien");
    var ikkeAfstemt = D.REAKTIONER.filter(function (r) {
        var v = r.v.map(function (f, i) { return [r.k[i], f]; });
        var hh = r.h.map(function (f, i) { return [r.k[r.v.length + i], f]; });
        return !lig(sum(v), sum(hh)) || r.k.reduce(gcd) !== 1 || r.k.some(function (k) { return k < 1 || k > 9; });
    });
    paastand("alle " + D.REAKTIONER.length + " reaktioner på tavlen er afstemt med de mindste hele tal (1 til 9)", ikkeAfstemt.length === 0,
        ikkeAfstemt.map(function (r) { return r.v.join("+"); }).join("; "));
    D.REDOX.forEach(function (red) {
        var lad = function (l) { return l.reduce(function (s, p) { return s + p[0] * p[2]; }, 0); };
        var tekst = tilCifre(red.skema);
        paastand("permanganatskemaet med " + red.stof + " passer i atomer og ladning og er det, der står på tavlen",
            lig(sum(red.tael.v), sum(red.tael.h)) && lad(red.tael.v) === lad(red.tael.h) &&
            red.tael.v.concat(red.tael.h).every(function (p) { return tekst.indexOf((p[0] === 1 ? "" : p[0] + " ") + p[1]) >= 0; }));
    });
    function streger(a) { var s = 0; Object.keys(a).forEach(function (x) { s += D.VALENS[x] * a[x]; }); return s / 2; }
    function elektroner(a) { var s = 0; Object.keys(a).forEach(function (x) { s += D.VALENSELEKTRONER[x] * a[x]; }); return s; }
    var fs = D.STREGMOLEKYLER.filter(function (m) { return streger(atomer(tilCifre(m.formel))) !== m.streger; });
    paastand("stregtallet for de " + D.STREGMOLEKYLER.length + " molekyler på flasken passer med bindingerne pr. atom", fs.length === 0, fs.map(function (m) { return m.formel; }).join(", "));
    var fb = D.BONUSMOLEKYLER.filter(function (m) {
        var a = atomer(m.brutto), a2 = atomer(tilCifre(m.formel).replace(/\(NH2\)2/, "N2H4"));
        return streger(a) !== m.streger || (elektroner(a) - 2 * m.streger) / 2 !== m.par || !lig(a, a2);
    });
    paastand("bonusmolekylernes streger og frie elektronpar passer med valenselektronerne (" + D.BONUSMOLEKYLER.length + " molekyler)", fb.length === 0, fb.map(function (m) { return m.navn; }).join(", "));
    var raekker = Object.keys(D.LAB).map(function (id) { return D.LAB_REAGENSER.map(function (r) { var x = D.LAB[id][r.id]; return x ? x.ord : "-"; }).join("|"); });
    paastand("de seks ioner på dråbepladen har hver sin række", raekker.filter(function (r, i) { return raekker.indexOf(r) === i; }).length === 6);
    paastand("isotoperne giver hele, positive antal neutroner og elektroner", Object.keys(D.LAB_IONER).every(function (id) {
        var i = D.LAB_IONER[id];
        return i.isotoper.every(function (A) { return A - i.Z > 0 && A - i.Z < 2 * i.Z; }) && i.Z - i.q > 0 && D.SYMBOLER[i.Z - 1] === i.sym;
    }));
    var fael = hentTekst("../sc2.4_faeldningsreaktioner/js/data.js");
    if (!fael) skriv("  note  sc2.4 blev ikke fundet");
    else {
        var KAT = { ag: "Ag", pb: "Pb", ba: "Ba", ca: "Ca", cu: "Cu", mg: "Mg" }, AN = { cl: 1, i: 3, oh: 4, so4: 5 }, afvig = [];
        Object.keys(KAT).forEach(function (id) {
            var m = new RegExp("\\b" + KAT[id] + ':\\s*"([LTx]{8})"').exec(fael);
            if (!m) { afvig.push(id + " mangler"); return; }
            D.LAB_REAGENSER.forEach(function (r) {
                var t = m[1].charAt(AN[r.id]);
                if (!!D.LAB[id][r.id] !== (t === "T" || t === "x")) afvig.push(id + "+" + r.id);
            });
        });
        paastand("dråbepladens bundfald følger sc2.4's fældningstabel", afvig.length === 0, afvig.join(", "));
    }
    var pol = hentTekst("../sc3.3_polaere_molekyler/js/data.js");
    if (!pol) skriv("  note  sc3.3 blev ikke fundet");
    else {
        var afvigEN = Object.keys(D.EN).filter(function (s) {
            var m = new RegExp("\\b" + s + ':\\s*\\{[^}]*en:\\s*([0-9.]+)').exec(pol);
            return !m || Number(m[1]) !== D.EN[s];
        });
        paastand("elektronegativiteterne er de samme som i sc3.3", afvigEN.length === 0, afvigEN.join(", "));
    }
    var alleStoffer = [D.VAND].concat(D.BLAND_POLAER, D.BLAND_UPOLAER);
    paastand("væskerne har ingen stoffer, der blandes med både polære og upolære (ethanol, methanol, eddikesyre)",
        alleStoffer.every(function (s) { return ["ethanol", "methanol", "eddikesyre", "propanon"].indexOf(s.navn) < 0; }));
    var bl = Sag.bland(D.VAND, D.BLAND_UPOLAER[0]), bl2 = Sag.bland(D.BLAND_POLAER[0], D.VAND), urea = D.BLAND_POLAER.filter(function (s) { return s.fast; })[0];
    paastand("vand og heptan giver to lag med heptan øverst, vand og glycerol ét lag", !bl.etLag && bl.oeverst.navn === "heptan" && bl2.etLag);
    paastand("urea opløses i vand, men ikke i hexan", Sag.bland(urea, D.VAND).etLag && !Sag.bland(urea, D.BLAND_UPOLAER[1]).etLag);
    paastand("svarfeltet læser 0,0810, 8,10·10^-2, 8.1e-2 og 8,10 · 10⁻² som det samme tal",
        ["0,0810", "8,10·10^-2", "8.1e-2", "8,10 · 10⁻²", "8,1*10^-2"].every(function (s) { return Math.abs(Se.tal(s) - 0.081) < 1e-12; }) && isNaN(Se.tal("ca. 5")));

    /* ------------------------------------------------------------- */
    overskrift("2. 2000 sager");
    var N = 2000, kast = [], masker = [], r2 = [], robust3 = [], robust4 = [], robust5 = [], koder = {}, rumKoder = [{}, {}, {}, {}, {}, {}], bonKoder = [{}, {}, {}, {}, {}, {}];
    for (var nr = 1000; nr < 1000 + N; nr++) {
        var s;
        try { s = Sag.lav(nr); } catch (e) { kast.push(nr + ": " + e.message); continue; }
        var alle = "";
        for (var r = 1; r <= 5; r++) {
            var q = s.rum[r];
            if ((q.kodeMaske.match(/#/g) || []).length !== q.kode.length || !/^[0-9]+$/.test(q.kode) || q.trin.length !== 3) masker.push(nr + " rum " + r + " kode");
            q.bonus.felter.forEach(function (f) {
                if ((f.maske.match(/#/g) || []).length !== f.svar.length || !/^[0-9]+$/.test(f.svar)) masker.push(nr + " rum " + r + " bonus");
            });
            if (q.bonus.kode === q.kode) masker.push(nr + " rum " + r + ": guldkoden er den samme som koden");
            alle += q.kode + "|";
            rumKoder[r][q.kode] = (rumKoder[r][q.kode] || 0) + 1;
            bonKoder[r][q.bonus.kode] = (bonKoder[r][q.bonus.kode] || 0) + 1;
        }
        koder[alle] = 1;
        var a = s.rum[1], ion = D.LAB_IONER[a.x];
        if (a.kendte.indexOf(a.x) < 0 || a.kendte.length !== 4 || a.bonus.neutroner !== a.bonus.A - ion.Z || a.bonus.elektroner !== ion.Z - ion.q) masker.push(nr + ": rum 1");
        var b = s.rum[2];
        if (b.stoffer.length !== 6 || b.stoffer[0].navn !== "vand" || b.stoffer.filter(function (x) { return !x.polaer; }).length !== b.antalUpolaere ||
            b.antalUpolaere < 2 || b.antalUpolaere > 4 || b.stoffer.filter(function (x) { return x.fast; }).length > 1 ||
            b.molekyler.filter(function (m) { return m.polaer; }).length !== b.antalPolaere || b.antalPolaere < 1 || b.antalPolaere > 4) r2.push(nr);
        var c = s.rum[3];
        if (Sag.RUM3_VALG.some(function (v) { return NK.komma(Sag.rumfang(c.metal, c.m, c.t, c.p, v), 2) !== NK.komma(c.V, 2); }) || c.V < 0.5 || c.V >= 9.995 ||
            Sag.REST_VALG.some(function (v) { return NK.komma(Sag.rest(c.metal, c.m, c.bonus.cHCl, c.bonus.vHCl, v[0], v[1]), 2) !== NK.komma(c.bonus.rest, 2); }) ||
            c.bonus.rest < 0.1 || c.bonus.rest > c.m) robust3.push(nr);
        var d4 = s.rum[4];
        if (NK.komma(d4.efter - d4.foer, 2) !== NK.komma(d4.forbrug, 2) ||
            [0, 3, 4].some(function (v) { return NK.komma(Sag.pH(d4.cBase, d4.forbrug, d4.Vsyre, v), 2) !== NK.komma(d4.pH, 2); }) ||
            [0, 1, 2].some(function (v) { return NK.komma(Sag.pHUndervejs(d4.cBase, d4.forbrug, d4.Vsyre, d4.bonus.x, v), 2) !== NK.komma(d4.bonus.pH, 2); }) ||
            d4.bonus.x >= d4.forbrug || d4.bonus.pH <= d4.pH) robust4.push(nr);
        var e5 = s.rum[5];
        if ([false, true].some(function (bb) { return NK.komma(Sag.koncentration(e5.redox, e5.cMn, e5.Vmn, e5.Vproeve, bb), 3) !== NK.komma(e5.c, 3); }) ||
            [0, 1, 2].some(function (v) { return NK.komma(Sag.masseprocent(e5.redox, e5.c, e5.bonus.Vkolbe, e5.bonus.mProeve, v), e5.redox.pctDec) !== NK.komma(e5.bonus.pct, e5.redox.pctDec); }) ||
            e5.Vmn < 5 || e5.Vmn > 40 || e5.bonus.pct >= 100 || e5.bonus.pct <= 1) robust5.push(nr);
    }
    paastand("alle " + N + " sager kan laves", kast.length === 0, kast.slice(0, 3).join("; "));
    paastand("koden og guldkoden passer med felterne i låsen, og de to koder er forskellige", masker.length === 0, masker.slice(0, 3).join("; "));
    paastand("rum 2: seks stoffer med vand først, 2 til 4 upolære, højst ét fast stof, 1 til 4 polære molekyler", r2.length === 0, r2.slice(0, 5).join(", "));
    paastand("rum 3: rumfanget (16 måder at runde af) og resten af metallet (4 måder) er robuste", robust3.length === 0, robust3.slice(0, 5).join(", "));
    paastand("rum 4: forbruget passer, og pH og pH undervejs er robuste", robust4.length === 0, robust4.slice(0, 5).join(", "));
    paastand("rum 5: koncentrationen og masseprocenten er robuste, og forbruget er 5 til 40 mL", robust5.length === 0, robust5.slice(0, 5).join(", "));
    paastand("alle sager har deres egen samlede kode (" + Object.keys(koder).length + " af " + N + ")", Object.keys(koder).length >= N * 0.99);
    function faelles(tael) {
        return [1, 2, 3, 4, 5].map(function (r) {
            var p = 0; Object.keys(tael[r]).forEach(function (k) { p += Math.pow(tael[r][k] / N, 2); });
            return p;
        });
    }
    var fk = faelles(rumKoder), fg = faelles(bonKoder);
    skriv("  info  to grupper har den samme kode i " + fk.map(function (p) { return NK.komma(p * 100, 1); }).join(" / ") + " % af tilfældene (rum 1 til 5)");
    skriv("  info  to grupper har den samme guldkode i " + fg.map(function (p) { return NK.komma(p * 100, 1); }).join(" / ") + " % af tilfældene");
    paastand("to grupper har den samme kode til et rum i under 3 % af tilfældene", fk.every(function (p) { return p < 0.03; }));
    paastand("den samme sag giver de samme tal", JSON.stringify(Sag.lav(4321)) === JSON.stringify(Sag.lav(4321)));

    /* ------------------------------------------------------------- */
    overskrift("3. Trinene i de fem rum");
    w.localStorage.removeItem("nk-escaperoom");
    w = await aabn();
    NK = w.NK; D = NK.D; Sag = NK.Sag; Se = NK.Sedler;
    var app = NK.app, d = w.document, T, sag;
    paastand("en ny sag begynder på startskærmen", app.skaerm().type === "start" && !d.getElementById("midte").hidden && !!d.getElementById("startknap"));
    app.nySag(4550, true);
    d.getElementById("startknap").click();
    T = app.tilstand(); sag = app.sag();
    paastand("Start fører til rum 1, og uret går", app.skaerm().type === "rum" && app.skaerm().rum === 1 && T.start > 0);

    /* Det rigtige svar til en del */
    function rigtigt(del) {
        if (del.type === "sorter") { var v = {}; del.emner.forEach(function (e) { v[e.id] = e.polaer; }); return v; }
        if (del.type === "koef") return del.svar.map(String);
        if (del.type === "tal") return String(del.svar).replace(".", ",");
        return del.svar;
    }
    function forkert(del) {
        if (del.type === "sorter") { var v = {}; del.emner.forEach(function (e) { v[e.id] = !e.polaer; }); return v; }
        if (del.type === "koef") return del.svar.map(function () { return "9"; });
        if (del.type === "tal") return String(del.svar * 3 + 7).replace(".", ",");
        if (del.type === "ps") return del.svar === 1 ? 2 : 1;
        return del.muligheder.filter(function (m) { return m.v !== del.svar; })[0].v;
    }
    /* Loeser trin i i rum r som en elev: handling, saa hver del. */
    function loesTrin(r, i, medFejl) {
        var tr = sag.rum[r].trin[i], log = { fejl: 0, beskeder: [] };
        app.aabnTrin(r, i);
        var k = Se.trin(r, tr.id, sag, T);
        if (r === 1 && tr.id === "ion") D.LAB_REAGENSER.forEach(function (re) { app.dryp("x-" + re.id); });
        if (k.handling) {
            log.spmFoerHandling = !!d.querySelector("#seddel .del");
            d.querySelector("#seddel [data-handl]").click();
        }
        k = Se.trin(r, tr.id, sag, T);
        k.dele.forEach(function (del) {
            if (medFejl) {
                var u = app.indsend(forkert(del));
                if (u && !u.ok) { log.fejl++; log.beskeder.push(d.getElementById("besked").textContent); }
            }
            app.indsend(rigtigt(del));
        });
        log.loest = !!T.trin[r + ":" + tr.id];
        log.kort = d.getElementById("seddel").textContent;
        return log;
    }
    function aktivSkilt() { var g = d.querySelector("#tegning .spor.aktiv"); return g ? g.getAttribute("data-spor") : null; }

    for (var rum = 1; rum <= 5; rum++) {
        var R = sag.rum[rum];
        paastand("rum " + rum + ": kortet øverst siger trin 1 af 3, og skiltet ved " + R.trin[0].chip + " er fremhævet",
            /Trin 1 af 3/.test(d.getElementById("goer").textContent) && aktivSkilt() === R.trin[0].ting &&
            d.querySelector(".chip.aktiv").getAttribute("data-ting") === R.trin[0].ting);
        var spor = d.querySelectorAll("#tegning .spor");
        paastand("rum " + rum + ": tingene til de tre trin, bonusskrinet og kodelåsen kan klikkes (" + spor.length + " ting)",
            R.trin.every(function (t) { return !!d.querySelector('#tegning .spor[data-spor="' + t.ting + '"]'); }) &&
            !!d.querySelector('#tegning .spor[data-spor="bonus"]') && !!d.querySelector('#tegning .spor[data-spor="laas"]') && spor.length <= 6);
        app.aabnTrin(rum, 2);
        paastand("rum " + rum + ": trin 3 før trin 1 siger, hvad der skal løses først, og har knappen Gå til trin 1",
            /Løs først trin 1/.test(d.getElementById("seddel").textContent) && !!d.querySelector("#seddel [data-gaatrin]") && !d.getElementById("indsend"));
        app.aabnLaas(rum);
        paastand("rum " + rum + ": låsen har ingen cifre endnu, og Lås op er grå", d.getElementById("laasop").disabled &&
            Array.prototype.every.call(d.querySelectorAll('[data-raekke="kode"] .ciffer'), function (c) { return c.value === ""; }));
        var logs = [0, 1, 2].map(function (i) { return loesTrin(rum, i, true); });
        paastand("rum " + rum + ": alle tre trin kan løses, og hver del afviser et forkert svar med en besked",
            logs.every(function (l) { return l.loest && l.fejl >= 1 && l.beskeder.every(function (b) { return b.length > 15; }); }),
            logs.map(function (l) { return l.loest + "/" + l.fejl; }).join(" "));
        paastand("rum " + rum + ": forsøget kommer før spørgsmålet (ingen svarfelt før knappen)", logs.every(function (l) { return !l.spmFoerHandling; }));
        paastand("rum " + rum + ": kortet øverst siger, at koden er fundet, og kodelåsens skilt er fremhævet",
            /Koden er fundet/.test(d.getElementById("goer").textContent) && aktivSkilt() === "laas" &&
            d.querySelector(".chip.kode").textContent.replace(/[^0-9]/g, "") === R.kode);
        d.querySelector("#seddel [data-tillaas]").click();
        var cif = Array.prototype.map.call(d.querySelectorAll('[data-raekke="kode"] .ciffer'), function (c) { return c.value; }).join("");
        paastand("rum " + rum + ": Gå til kodelåsen åbner låsen med koden " + R.kode + " klar", cif === R.kode && !d.getElementById("laasop").disabled);
        d.getElementById("laasop").click();
        paastand("rum " + rum + ": Lås op åbner døren med en almindelig nøgle", T.naaet === rum + 1 && !T.guld[rum] && !!d.querySelector("#tegning .doerblad.aaben") &&
            /Døren går op/.test(d.getElementById("laasbesked").textContent));
        d.querySelector("#seddel [data-videre]").click();
    }
    paastand("efter rum 5 kommer slutningen med fem jernnøgler og vejen til guld", app.skaerm().type === "slut" && d.querySelectorAll(".noegleknap.jern").length === 5 &&
        /bonuskoder/.test(d.querySelector(".guldvej").textContent) && T.tid > 0 && /^RUMLESKAFT-\d{8}-\d{2}$/.test(d.getElementById("bevis").textContent));

    /* enkelte ting undervejs */
    app.nySag(4550, true); app.start(); T = app.tilstand(); sag = app.sag();
    app.aabnTrin(1, 0);
    var u1 = app.indsend(sag.rum[1].x);
    paastand("dråbepladen: svaret afvises gratis, til alle fire reagenser er dryppet i Prøve X", u1 && !u1.ok && u1.gratis && /Dryp først/.test(u1.besked));
    app.dryp("x-oh");
    paastand("et dryp gemmes og vises i dråbepladen på kortet", T.lab["x-oh"] === true && /bundfald/.test(d.querySelector("#labgitter tr.x").textContent));
    paastand("hintet er skjult, til der trykkes på Giv et hint", d.getElementById("hint").hidden && d.getElementById("hintknap").textContent === "Giv et hint");
    d.getElementById("hintknap").click();
    paastand("Giv et hint viser hintet, og knappen bliver til Vis svaret", !d.getElementById("hint").hidden && d.getElementById("hintknap").textContent === "Vis svaret");
    d.getElementById("hintknap").click();
    paastand("Vis svaret løser delen og viser svaret", T.trin["1:ion"] === true && d.querySelector("#seddel .regnestykke").textContent.indexOf(D.LAB_IONER[sag.rum[1].x].formel) >= 0);
    paastand("det løste trin har knappen Videre og intet svarfelt", !!d.querySelector("#seddel [data-luk].hoved") && !d.getElementById("indsend"));
    app.aabnTrin(1, 1); app.indsend(sag.rum[1].Z);
    app.aabnTrin(1, 2);
    var k3 = sag.rum[1].reaktion.k;
    var u2 = app.indsend(k3.map(function (x) { return String(x * 2); }));
    paastand("afstemning med de dobbelte koefficienter: forholdet er rigtigt, brug de mindste hele tal", u2 && !u2.ok && /mindste hele tal/.test(u2.besked));
    var u3 = app.indsend(k3.map(function () { return "1"; }));
    paastand("en forkert afstemning viser en tabel med atomerne på hver side", k3.join() === k3.map(function () { return 1; }).join() || (u3 && /atomtabel/.test(u3.besked)));
    app.luk();
    for (var q2 = 0; q2 < 3; q2++) loesTrin(1, q2);
    app.aabnLaas(1); app.laasOp(); app.videre();
    app.aabnTing(2, "bland");
    app.bland(0); app.bland(1);
    paastand("væskerne: to valgte stoffer blandes og kommer på listen", Object.keys(T.bland).length === 1 && /lag|opløses/.test(d.querySelector(".blandtekst").textContent) && d.querySelectorAll(".blandet span").length === 1);
    var u4 = app.indsend({});
    paastand("sorteringen afvises gratis, til alle seks stoffer er valgt", u4 && !u4.ok && u4.gratis);
    app.luk();
    for (q2 = 0; q2 < 3; q2++) loesTrin(2, q2);
    app.aabnLaas(2); app.laasOp(); app.videre();
    app.aabnTing(3, "info");
    paastand("tavlen i rum 3 er et opslag uden svarfelt", /g\/mol/.test(d.getElementById("seddel").textContent) && !d.getElementById("indsend"));
    loesTrin(3, 0); loesTrin(3, 1);
    app.aabnTrin(3, 2);
    app.indsend(String(sag.rum[3].T).replace(".", ","));
    var r3 = sag.rum[3], ucelsius = app.indsend(NK.komma(r3.nH2 * D.R * r3.t / r3.p, 3));
    paastand("rumfang regnet med °C får beskeden om kelvin", ucelsius && !ucelsius.ok && /kelvin/.test(ucelsius.besked));
    paastand("de løste dele bliver stående som pæne beregninger med enheder", /T = .* K/.test(d.querySelector("#seddel .regnestykke").textContent));
    var uV = app.indsend(NK.komma(r3.V + 0.01, 2));
    paastand("rumfanget godtages med en hundrededel til forskel", uV && uV.ok);

    /* ------------------------------------------------------------- */
    overskrift("4. Bonusruten og guldnøglerne");
    app.nySag(6060, true); app.start(); T = app.tilstand(); sag = app.sag();
    app.aabnTing(1, "bonus");
    paastand("bonusskrinet åbner et kort, der er mærket Bonusrute og forklarer guldkoden", /Bonusrute/.test(d.getElementById("seddel").textContent) &&
        /guldkoden/.test(d.getElementById("seddel").textContent) && d.getElementById("seddel").classList.contains("guldkort") && !d.getElementById("hintknap"));
    d.querySelector("#seddel [data-tillaas]").click();
    app.skrivKode("99999999", "guld");
    app.laasOp();
    paastand("en forkert guldkode åbner ikke døren", T.naaet === 1 && /Guldkoden passer ikke/.test(d.getElementById("laasbesked").textContent));
    app.skrivKode(sag.rum[1].bonus.kode, "guld");
    app.laasOp();
    paastand("guldkoden åbner døren uden de tre trin og giver en guldnøgle", T.naaet === 2 && T.guld[1] === true && app.trinNr(1) === 0 &&
        /nøglen er af guld/.test(d.getElementById("laasbesked").textContent));
    app.videre();
    paastand("toplinjen viser guldnøglen fra rum 1", !!d.querySelector('.rumknap.guldnoegle[data-rum="1"]'));
    for (var g = 2; g <= 5; g++) { for (q2 = 0; q2 < 3; q2++) loesTrin(g, q2); app.aabnLaas(g); app.laasOp(); app.videre(); }
    paastand("én guldnøgle og fire jernnøgler giver slutningen uden knap til den gyldne dør", app.skaerm().type === "slut" && d.querySelectorAll(".noegleknap.guld").length === 1 && !d.querySelector("[data-tilguld]"));
    d.querySelector('.noegleknap.jern[data-noegle="3"]').click();
    paastand("et klik på jernnøglen fra rum 3 går tilbage til rum 3", app.skaerm().type === "rum" && app.skaerm().rum === 3 && app.skaerm().gensyn &&
        /Guldkoden fra bonusruten kan stadig tastes/.test(d.getElementById("goer").textContent));
    app.aabnLaas(3);
    app.skrivKode(sag.rum[3].bonus.kode, "guld");
    app.laasOp();
    paastand("guldkoden kan tastes, efter døren er åbnet, og gør nøglen til guld", T.guld[3] === true && /Nøglen er nu af guld/.test(d.getElementById("laasbesked").textContent));
    [2, 4, 5].forEach(function (r) { T.vist = r; app.vis(); app.aabnLaas(r); app.skrivKode(sag.rum[r].bonus.kode, "guld"); app.laasOp(); });
    app.videre();
    paastand("fem guldnøgler: slutningen har knappen Gå til den gyldne dør", app.skaerm().type === "slut" && app.alleGuld() && !!d.querySelector("[data-tilguld]"));
    d.querySelector("[data-tilguld]").click();
    paastand("knappen fører til den gyldne dør med fire segl", app.skaerm().type === "guld" && d.querySelectorAll('#tegning .spor[data-spor^="segl-"]').length === 4);
    app.aabnSegl("million");
    paastand("en forkert titel holder seglet", app.brydSegl("million", "millionær") === "forkert" && !T.segl.million);
    paastand("den rigtige titel uden en sejr i browseren holder også", app.brydSegl("million", "Superkemiker") === "ikkeVundet" && !T.segl.million);
    w.localStorage.setItem("nk-million-rekord", "1000000");
    w.localStorage.setItem("nk-syregalgen", JSON.stringify({ rekord: { kemi: 4, historie: 6 } }));
    w.localStorage.setItem("nk-pacman-klaret", JSON.stringify({ mix: { svaer: true } }));
    w.localStorage.setItem("orgSortering_bestAllTime", "15000");
    paastand("med sejren i browseren brydes seglet", app.brydSegl("million", "  SuperKemiker ") === "brudt" && T.segl.million === true);
    paastand("de tre andre segl brydes med deres titler", app.brydSegl("syregalgen", "syreimmun") === "brudt" && app.brydSegl("pacman", "labyrintmester") === "brudt" &&
        app.brydSegl("organisk", "stofgruppemester") === "brudt" && app.alleSegl() && !!d.getElementById("guldknap"));
    d.getElementById("guldknap").click();
    paastand("den gyldne dør fører til finalen med guldbeviset", app.skaerm().type === "finale" && /Nillers pokalskab/.test(d.getElementById("midte").textContent) &&
        /^GULDSKAFT-\d{8}-\d{2}$/.test(d.getElementById("bevis").textContent));
    var nrFoer = T.sag;
    w = await aabn();
    NK = w.NK; D = NK.D; Sag = NK.Sag; Se = NK.Sedler; app = NK.app; d = w.document;
    paastand("sagen huskes efter genindlæsning", app.tilstand().sag === nrFoer && app.skaerm().type === "finale");

    /* ------------------------------------------------------------- */
    overskrift("5. Beviset");
    var bv = app.bevis("RUMLESKAFT", new w.Date(2026, 10, 12, 15, 45));
    paastand("12. nov. kl. 15.45 giver RUMLESKAFT-12111545-04 (vægtene 4 3 2 7 6 5 4 3, mod 11)", bv === "RUMLESKAFT-12111545-04", bv);

    /* ------------------------------------------------------------- */
    overskrift("6. Sproget");
    var tekster = [D.START.tekst, D.START.under].concat(D.START.regler, D.HJAELP, [D.SLUT.tekst, D.SLUT.guldvej, D.FINALE.tekst, D.BONUS.om, D.RUM[6].tekst]);
    [1, 2, 3, 4, 5].forEach(function (k) { tekster.push(D.RUM[k].niller); });
    D.SEGL.forEach(function (sg) { tekster.push(sg.spm); });
    var hints = [], Tt = app.tilstand();
    for (var n2 = 1000; n2 < 1060; n2++) {
        var sg2 = Sag.lav(n2);
        for (var rr = 1; rr <= 5; rr++) {
            sg2.rum[rr].trin.forEach(function (tr) {
                tekster.push(tr.goer);
                var k = Se.trin(rr, tr.id, sg2, Tt);
                tekster.push((k.intro || "").replace(/<[^>]+>/g, " "));
                k.dele.forEach(function (del) {
                    tekster.push(String(del.spm).replace(/<[^>]+>/g, " "), del.hint, String(del.vis).replace(/<[^>]+>/g, " "));
                    hints.push(del.hint);
                    (del.fejl || []).forEach(function (f) { tekster.push(f[1]); });
                });
            });
            tekster.push(Se.bonus(rr, sg2).html.replace(/<[^>]+>/g, " "));
            sg2.rum[rr].bonus.felter.forEach(function (f) { tekster.push(f.navn); });
        }
    }
    var streg = tekster.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger", streg.length === 0, streg[0]);
    var en = tekster.filter(function (t) { return /[¹][⁺⁻]|1\+|1−/.test(t); });
    paastand("ladning ±1 skrives + og −, aldrig 1+ eller 1−", en.length === 0, en[0]);
    var ilt = tekster.filter(function (t) { return /\b(ilt|brint|brintoverilte|kvælstof|natronlud)\b/i.test(t); });
    paastand("ingen ilt, brint, brintoverilte, kvælstof eller natronlud", ilt.length === 0, ilt[0]);
    paastand("hvert hint er en hel sætning på højst 170 tegn", hints.every(function (t) { return t && t.length <= 170 && /[.]$/.test(t); }),
        hints.filter(function (t) { return !t || t.length > 170 || !/[.]$/.test(t); })[0]);
    paastand("Nillers replikker er højst 130 tegn", [1, 2, 3, 4, 5].every(function (k) { return D.RUM[k].niller.length <= 130; }));

    /* ------------------------------------------------------------- */
    overskrift("7. Skærmen");
    async function maal(b2, h2) {
        w = await aabn(b2, h2);
        NK = w.NK; D = NK.D; Se = NK.Sedler; app = NK.app; d = w.document;
        app.nySag(4550, true); app.start(); sag = app.sag(); T = app.tilstand();
        var svg = d.querySelector("#tegning svg").getBoundingClientRect();
        var skala = Math.min(svg.width / 1600, svg.height / 780);
        paastand(b2 + " x " + h2 + ": de gule skilte er mindst 13 px (" + NK.komma(23 * skala, 1) + " px)", 23 * skala >= 13);
        var fo = d.getElementById("fortaelling").getBoundingClientRect();
        paastand(b2 + " x " + h2 + ": opgavekortet står i midten og er højst 150 px højt (" + Math.round(fo.height) + " px)", Math.abs((fo.left + fo.right) / 2 - b2 / 2) < 4 && fo.height <= 150);
        var ud = [], smaa = [];
        function tjek(navn) {
            var sd = d.getElementById("seddel"), st = d.querySelector(".studie").getBoundingClientRect(), rc = sd.getBoundingClientRect();
            if (rc.bottom > st.bottom + 1 || rc.right > st.right + 1 || sd.scrollWidth > sd.clientWidth + 1) ud.push(navn);
            Array.prototype.forEach.call(d.querySelectorAll(".seddel *, .fortaelling *"), function (e) {
                var egen = Array.prototype.some.call(e.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
                if (egen && e.offsetParent !== null && parseFloat(w.getComputedStyle(e).fontSize) < 12) smaa.push(navn + ": " + e.tagName + "." + e.className);
            });
        }
        for (var r = 1; r <= 5; r++) {
            for (var i = 0; i < 3; i++) {
                app.aabnTrin(r, i);
                var k = Se.trin(r, sag.rum[r].trin[i].id, sag, T);
                if (r === 1 && i === 0) D.LAB_REAGENSER.forEach(function (re) { app.dryp("x-" + re.id); });
                if (r === 2 && i === 0) { app.bland(0); app.bland(1); app.bland(2); app.bland(3); }
                if (k.handling) app.handling();
                k = Se.trin(r, sag.rum[r].trin[i].id, sag, T);
                k.dele.forEach(function (del, j) {
                    app.hint();
                    tjek("rum " + r + " trin " + (i + 1) + " del " + (j + 1));
                    app.indsend(rigtigt(del));
                });
                tjek("rum " + r + " trin " + (i + 1) + " løst");
            }
            app.aabnBonus(r); tjek("rum " + r + " bonus");
            app.aabnLaas(r); tjek("rum " + r + " lås");
            app.laasOp(); app.videre();
        }
        paastand(b2 + " x " + h2 + ": alle kort er inde i billedet uden vandret rullebjælke", ud.length === 0, ud.slice(0, 4).join(", "));
        paastand(b2 + " x " + h2 + ": ingen tekst på kortene under 12 px", smaa.length === 0, smaa.slice(0, 3).join(", "));
    }
    await maal(1366, 768);
    await maal(1100, 700);
}

window.addEventListener("load", function () {
    koer().then(function () { genskab(); vis(false); }, function (e) {
        genskab();
        skriv("  FEJL  testen stoppede: " + e.message, "fejl"); fejl++; vis(false);
        if (window.console) console.log("selvtest: " + e.stack);
    });
});
</script>
