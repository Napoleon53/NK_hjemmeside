<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Tingene i EscapeRoom Kemi C</title>
<link rel="stylesheet" href="css/stil.css">
<style>
    /* Udviklervaerktoej: viser hver ting alene. Indgaar ikke i spillet. */
    body { overflow: auto; display: block; padding: 16px; background: #e9eef2; color: #1d2433; }
    h1 { font-size: 1.2rem; margin: 0 0 12px; }
    .gitter { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    figure { margin: 0; background: #f5f7f9; border: 1px solid #c9d0d8; border-radius: 10px; padding: 8px; }
    figcaption { font-size: 0.85rem; color: #3a4150; margin-bottom: 4px; }
    svg { width: 100%; height: 220px; display: block; }
</style>
</head>
<body>
<h1>Tingene i EscapeRoom Kemi C</h1>
<div class="gitter" id="gitter"></div>
<script src="js/kerne.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script>
(function () {
    var S = NK.Sprites, vand = [202, 224, 244];
    /* [navn, viewBox, tegning]; de fleste ting har nulpunkt i bund, midt */
    var ting = [
        ["Dør og kodelås", "1160 130 400 630", S.doer(1290, 170, 230, 570, "#2f8fd8", 1, false) + S.kodelaas(1195, 400, false)],
        ["Åben dør", "1160 130 400 630", S.doer(1290, 170, 230, 570, "#e0483a", 5, true) + S.kodelaas(1195, 400, true)],
        ["Tavle", "40 50 660 370", S.tavle(70, 84, 600, 290, S.kridt(370, 240, "__ Al + __ O₂ → __ Al₂O₃", 44, "middle"))],
        ["Periodisk system", "-10 -10 400 280", S.plakat(380)],
        ["Reagensglas (ét lag, to lag, krystaller)", "-140 -190 280 200", S.paa(-90, 0, 1, S.reagensglas(165, [{ farve: vand, andel: 0.6 }])) +
            S.paa(0, 0, 1, S.reagensglas(165, [{ farve: vand, andel: 0.3 }, { farve: [226, 208, 96], andel: 0.3 }])) +
            S.paa(90, 0, 1, S.reagensglas(165, [{ farve: [236, 240, 222], andel: 0.5 }], [250, 250, 250]))],
        ["Dråbeplade", "-10 -120 280 130", S.draabeplade(5, 4, [[null, { vaeske: vand, bundfald: [250, 208, 40] }], [{ vaeske: vand, bundfald: null }]])],
        ["Dråbeflasker", "-50 -150 300 160", ["NaCl", "KI", "Na₂SO₄", "NaOH"].map(function (e, i) { return S.paa(i * 68, 0, 1, S.draabeflaske(e)); }).join("")],
        ["Flasker", "-90 -240 300 250", S.paa(0, 0, 1, S.flaske(124, 210, "HCN", vand, "#c0392b")) + S.paa(140, 0, 1, S.flaske(84, 132, "", [226, 208, 96], "#6b7280"))],
        ["Vægt", "-150 -150 300 160", S.vaegt("2,40 g", "Mg")],
        ["Vejebåde (Mg, Al, Zn, Fe)", "-80 -50 560 60", ["Mg", "Al", "Zn", "Fe"].map(function (m, i) { return S.paa(i * 135, 0, 1, S.vejebaad(m)); }).join("")],
        ["Vejrstation", "-10 -10 240 290", S.vejrstation("23 °C", "1,013 bar")],
        ["Kolbe med gassprøjte", "-110 -260 420 270", S.kolbe(150, 160, vand, 0.42, true) + S.paa(0, -160, 0.8, S.gassproejte(0.8))],
        ["Burette og kolbe", "-110 -480 300 490", S.burette(300, [128, 40, 132], 0.5) + S.paa(0, -14, 1, S.kolbe(124, 112, [226, 190, 232], 0.4))],
        ["Bonusskrin", "-90 -120 180 130", S.skrin(false)],
        ["Segl", "-70 -60 380 120", S.paa(0, 0, 1, S.segl(S.SEGLMAERKER.million, false)) + S.paa(100, 0, 1, S.segl(S.SEGLMAERKER.syregalgen, false)) +
            S.paa(200, 0, 1, S.segl(S.SEGLMAERKER.pacman, false)) + S.paa(300, 0, 1, S.segl(S.SEGLMAERKER.organisk, true))],
        ["Skilte", "0 0 460 220", S.skilt(120, 40, "Dråbepladen", "aktiv") + S.skilt(330, 40, "Tavlen", "") + S.skilt(120, 120, "Vægten", "loest") + S.skilt(330, 120, "Bonusrute", "bonus")],
        ["Nøgler", "0 0 200 90", S.noegle(10, 10, "#f6cd2b", "#27303f", 1) + S.noegle(100, 50, "#aab1ba", "#27303f", 1)]
    ];
    document.getElementById("gitter").innerHTML = ting.map(function (t) {
        return "<figure><figcaption>" + t[0] + '</figcaption><svg viewBox="' + t[1] + '">' + S.defs() + t[2] + "</svg></figure>";
    }).join("");
}());
</script>
</body>
</html>
