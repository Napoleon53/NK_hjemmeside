<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<script src="../../til_panelet.js" data-panel="samling_alt.html" data-emne="spil.escaperoom"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EscapeRoom Kemi C</title>
<link rel="stylesheet" href="css/stil.css">
</head>
<body>

<header class="top">
    <div class="brand">
        <svg class="laasikon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2" fill="#e0b22e"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" fill="none" stroke="#e0b22e" stroke-width="2.4"/><circle cx="12" cy="16" r="2" fill="#2a2208"/></svg>
        <div>
            <h1>EscapeRoom Kemi C</h1>
            <p class="sagnr" id="sagnr"></p>
        </div>
    </div>
    <nav class="noegler" id="noegler" aria-label="Rummene"></nav>
    <div class="hoejre">
        <span class="ur" id="ur" title="Tid siden start">00:00</span>
        <button type="button" class="knap lille" id="nysag" title="Ny sag med nye tal">Ny sag</button>
        <button type="button" class="ikonknap" id="hjaelpknap" title="Sådan spiller I (?)" aria-label="Sådan spiller I">?</button>
    </div>
</header>

<main class="studie">
    <div class="fortaelling" id="fortaelling" aria-live="polite" hidden></div>
    <div class="scene" id="scene">
        <div class="tegning" id="tegning"></div>
        <div class="midte" id="midte" hidden></div>
    </div>
    <!-- Kortet til et trin ligger over baade opgavekortet og scenen, saa det har plads -->
    <div class="slor" id="slor" hidden>
        <div class="seddel" id="seddel" role="dialog" aria-modal="true" aria-label="Kort"></div>
    </div>
</main>

<div class="overlay" id="hjaelp" role="dialog" aria-modal="true" aria-labelledby="hjaelp-titel" hidden>
    <div class="overlay-boks">
        <h2 id="hjaelp-titel">Sådan spiller I</h2>
        <div id="hjaelp-tekst"></div>
        <h3>Genveje</h3>
        <p><kbd>Enter</kbd> låser op &nbsp;·&nbsp; <kbd>Esc</kbd> lukker kortet &nbsp;·&nbsp; <kbd>?</kbd> denne side</p>
        <div class="knaprad"><button type="button" class="knap hoved" id="hjaelp-luk">Luk</button></div>
    </div>
</div>

<script src="js/kerne.js"></script>
<script src="js/data.js"></script>
<script src="js/sag.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scener.js"></script>
<script src="js/sedler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
