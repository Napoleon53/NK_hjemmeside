<svg xmlns="http://www.w3.org/2000/svg" width="80" height="130" viewBox="0 0 80 130">
  <!-- Blaa ballon til ballonmodellen: et bindende elektronpar. Knuden
       (40, 128) sidder i midten, hvor ballonerne er bundet sammen.
       Animationen drejer ballonen ud i sin retning og forkorter den. -->
  <defs>
    <radialGradient id="krop" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a6d8fc"/>
      <stop offset="0.45" stop-color="#3d9ee0"/>
      <stop offset="1" stop-color="#123e62"/>
    </radialGradient>
    <radialGradient id="glans" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M40 127 C 42 120, 37 113, 40 105" fill="none" stroke="#1d5d8f" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M34 106 L 46 106 L 42.5 97 L 37.5 97 Z" fill="#2a76ac" stroke="#123e62" stroke-width="1" stroke-linejoin="round"/>
  <path d="M40 98 C 16 96, 6 72, 6 50 C 6 24, 21 4, 40 4 C 59 4, 74 24, 74 50 C 74 72, 64 96, 40 98 Z"
        fill="url(#krop)" stroke="#123e62" stroke-opacity="0.6" stroke-width="1.2"/>
  <ellipse cx="27" cy="30" rx="8" ry="15" transform="rotate(25 27 30)" fill="url(#glans)"/>
</svg>
