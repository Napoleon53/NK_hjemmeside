  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#krop)"/>
  <ellipse cx="46" cy="40" rx="19" ry="12" transform="rotate(-38 46 40)" fill="url(#glans)"/>
  <circle cx="64" cy="64" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 6"/>
