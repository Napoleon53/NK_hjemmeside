<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Centralatom, der ikke opfylder oktetreglen (fane 1). Graa kugle
       uden symbol. Centrum i (64, 64), radius 60. -->
  <defs>
    <radialGradient id="krop" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#d3d8df"/>
      <stop offset="0.5" stop-color="#7a818c"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </radialGradient>
    <radialGradient id="glans" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
