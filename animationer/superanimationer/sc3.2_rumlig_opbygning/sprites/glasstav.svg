<svg xmlns="http://www.w3.org/2000/svg" width="200" height="14" viewBox="0 0 200 14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Glasstav. Spidsen er venstre ende (0, 7); animationen drejer
