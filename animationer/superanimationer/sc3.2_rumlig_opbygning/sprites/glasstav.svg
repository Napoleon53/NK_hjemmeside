  </defs>
  <rect x="1" y="1" width="198" height="12" rx="6" fill="url(#krop)" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="1"/>
  <rect x="8" y="3" width="184" height="2" rx="1" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="8" y="9.5" width="184" height="1" rx="0.5" fill="#ffffff" fill-opacity="0.3"/>
