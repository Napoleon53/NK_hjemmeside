<svg xmlns="http://www.w3.org/2000/svg" width="64" height="110" viewBox="0 0 64 110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Frit elektronpar: en elektronwolke, der peger opad. Spidsen (32, 108)
       sidder ved atomet. Animationen drejer spritet ud i parrets retning,
       forkorter det, naar det peger mod beskueren, og tegner selv de to
       elektroner ovenpaa. -->
  <defs>
    <radialGradient id="wolke" cx="0.5" cy="0.34" r="0.66">
      <stop offset="0" stop-color="#fff4c4" stop-opacity="0.62"/>
      <stop offset="0.55" stop-color="#f2c53d" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f2c53d" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <path d="M32 108 C 21 93, 3 67, 3 39 C 3 16, 16 3, 32 3 C 48 3, 61 16, 61 39 C 61 67, 43 93, 32 108 Z"
        fill="url(#wolke)" stroke="#f2c53d" stroke-opacity="0.75" stroke-width="1.6" stroke-linejoin="round"/>
  <ellipse cx="22" cy="24" rx="7" ry="11" transform="rotate(20 22 24)" fill="#ffffff" fill-opacity="0.16"/>
</svg>
