<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc3.2 Molekylers rumlige opbygning</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.36; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1400px; height:860px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at molekylerne på fane 2 og 3 opfylder
   oktetreglen og har lærebogens form, vinkel og polaritet; at byggeren
   på fane 1 overholder reglerne og giver de rigtige vinkler; at
   vandstrålen bøjer mest for vand, mindre for ethanol og ikke for
   heptan; at alle opgaver kan løses; og at teksterne overholder sitets
   regler.

   Chrome kigger kun ind i en iframe på file://, hvis den startes med
   --allow-file-access-from-files. Ellers: brug en lokal server eller
   Firefox.
   ===================================================================== */
var linjer = [], fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) skriv("  ok    " + navn, "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function naer(a, b, tol) { return Math.abs(a - b) <= tol; }

window.addEventListener("load", function () { setTimeout(koer, 1500); });

function koer() {
    try { koerTest(); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    skriv("\n" + (antal - fejl) + " af " + antal + " påstande holder." + (fejl ? "" : " Alt ok."), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var W = ramme.contentWindow;
    var NK = W.NK;

    overskrift("1. Indlæsning");
    paastand("NK og de fire faner findes", !!(NK && NK.sims && NK.sims["fane-byg"] && NK.sims["fane-molekyler"] && NK.sims["fane-polaritet"] && NK.sims["fane-vand"]));
    if (!NK || !NK.sims) return;
    var D = NK.Data, V = NK.V, B = NK.Bygning;
    var mangler = Object.keys(NK.Sprites.FILER).filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + Object.keys(NK.Sprites.FILER).length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));

    overskrift("2. Molekylerne på fane 2 og 3");
    var VINKEL = { H2O: 104.5, NH3: 107, CH4: 109.47, CO2: 180, HCN: 180, CH2O: 120, C2H4: 120, C2H2: 180, CCl4: 109.47, CH3Cl: 109.47 };
    var POLAER = { H2O: true, NH3: true, CH4: false, CO2: false, HCN: true, CH2O: true, C2H4: false, C2H2: false, CCl4: false, CH3Cl: true, HCl: true };
    D.MOLEKYLER.forEach(function (mol) {
        var oktet = mol.atomer.every(function (a, i) {
            var sum = mol.naboer[i].reduce(function (s, n) { return s + n.orden; }, 0);
            return 2 * sum + 2 * mol.frieAntal[i] === (a.el === "H" ? 2 : 8);
        });
        var form = mol.centrum === null ? (mol.atomer.length === 2 ? "lineaer" : null)
            : D.form(mol.naboer[mol.centrum].length, mol.frieAntal[mol.centrum]);
        var vinkelOk = mol.vinkel ? naer(mol.vinkelGrader, VINKEL[mol.id], 0.3) : !VINKEL[mol.id];
        paastand(mol.id + ": oktet, " + mol.form + ", " + (mol.vinkel ? NK.grader(mol.vinkelGrader) : "ingen vinkel") + ", " + (mol.polaer ? "polært" : "upolært"),
            oktet && form === mol.form && vinkelOk && mol.polaer === POLAER[mol.id],
            "oktet " + oktet + ", form " + form + ", vinkel " + vinkelOk);
    });

    overskrift("3. Fane 1: byggeren");
    var FORVENTET = { tetraeder: 109.47, pyramide: 107, plan: 120, lineaer: 180 };
    var geoFejl = [];
    B.KENDTE.forEach(function (m) {
        var s = B.fraSpec(m);
        var g = B.geometri(s);
        g.atomer.forEach(function (a, i) {
            if (a.naboer.length < 2) return;
            var form = B.formRundt(g.atomer, i);
            var ref = form === "vinklet" ? (a.frie === 2 ? 104.5 : null) : FORVENTET[form];
            if (ref === null) return;
            for (var x = 0; x < a.naboer.length; x++) {
                for (var y = x + 1; y < a.naboer.length; y++) {
                    var p = g.pos[a.id], p1 = g.pos[g.atomer[a.naboer[x].atom].id], p2 = g.pos[g.atomer[a.naboer[y].atom].id];
                    var v = V.vinkel(V.minus(p1, p), V.minus(p2, p));
                    var tol = form === "pyramide" || form === "vinklet" ? 0.6 : 0.5;
                    if (!naer(v, ref, tol)) geoFejl.push(m.id + " " + a.el + ": " + v.toFixed(1) + "° (" + ref + ")");
                }
            }
        });
        for (var i = 0; i < g.atomer.length; i++) {
            for (var j = i + 1; j < g.atomer.length; j++) {
                var bundet = g.atomer[i].naboer.some(function (nb) { return nb.atom === j; });
                var afst = V.laengde(V.minus(g.pos[g.atomer[i].id], g.pos[g.atomer[j].id]));
                if (!bundet && afst < 1.2) geoFejl.push(m.id + ": " + g.atomer[i].id + " og " + g.atomer[j].id + " for tæt (" + afst.toFixed(2) + ")");
            }
        }
    });
    paastand("alle " + B.KENDTE.length + " kendte molekyler har lærebogens vinkler og ingen atomer oven i hinanden", geoFejl.length === 0, geoFejl.slice(0, 4).join("; "));

    function plan(id) {
        var g = B.geometri(B.fraSpec(B.kendtMedId(id)));
        var pts = g.atomer.map(function (a) { return g.pos[a.id]; });
        var n = V.enhed(V.kryds(V.minus(pts[1], pts[0]), V.minus(pts[2], pts[0])));
        return pts.every(function (p) { return Math.abs(V.prik(V.minus(p, pts[0]), n)) < 0.03; });
    }
    function linje(id) {
        var g = B.geometri(B.fraSpec(B.kendtMedId(id)));
        var pts = g.atomer.map(function (a) { return g.pos[a.id]; });
        var u = V.enhed(V.minus(pts[1], pts[0]));
        return pts.every(function (p) { return V.laengde(V.kryds(V.minus(p, pts[0]), u)) < 0.03; });
    }
    paastand("ethen og methanal ligger i én plan", plan("C2H4") && plan("CH2O"));
    paastand("ethyn, blåsyre og carbondioxid ligger på en linje", linje("C2H2") && linje("HCN") && linje("CO2"));

    var s = B.ny();
    var c1 = B.tilfoej(s, null, "C");
    var o = B.tilfoej(s, c1, "O");
    var c2 = B.tilfoej(s, c1, "C");
    paastand("ethanol bygget i en anden rækkefølge genkendes", (B.kendt(s) || {}).id === "C2H5OH" && B.formel(s) === "C2H6O");
    paastand("dimethylether er ikke det samme som ethanol", B.noegle(B.fraSpec(B.kendtMedId("CH3OCH3"))) !== B.noegle(s));
    paastand("et tredje carbonatom afvises", typeof B.kanTilfoeje(s, c2, "C") === "string" && B.tilfoej(s, c2, "C") === null);
    paastand("O i ethanol har plads til én binding mere, Cl i chlormethan til ingen",
        B.fri(s, o) === 1 && (function () { var t = B.fraSpec(B.kendtMedId("CH3Cl")); return typeof B.kanTilfoeje(t, t.atomer[1].id, "O") === "string"; }()));
    paastand("C-O i ethanol kan være enkelt eller dobbelt, ikke tripel", B.muligeOrdener(s, c1, o).join() === "1,2");
    B.naesteOrden(s, c1, o);
    paastand("klik på bindingen gør den dobbelt, og H forsvinder fra O", B.binding(s, c1, o).orden === 2 && B.fri(s, o) === 0 && (B.kendt(s) || {}).id === "CH3CHO");
    var s5 = B.fraSpec(B.kendtMedId("CCl4"));
    paastand("højst fem atomer ud over hydrogen", typeof B.kanTilfoeje(s5, s5.atomer[0].id, "C") === "string");
    var sf = B.fraSpec(B.kendtMedId("CH3COOH"));
    B.fjern(sf, sf.atomer[1].id);
    paastand("fjernes det midterste C i eddikesyre, beholdes den største del", sf.atomer.length === 1);

    var punkter = [[0, 0, 0], [1.2, 0.1, 0], [0.3, 1.1, 0.4], [-0.5, 0.2, 1.3], [0.9, -0.7, -0.6]];
    var R = NK.M3.gange(NK.M3.omX(0.7), NK.M3.omY(-1.1));
    var drejet = punkter.map(function (p) { return V.plus(NK.M3.anvend(R, p), [2, -1, 0.5]); });
    var j = B.juster(punkter, drejet);
    var maksFejl = Math.max.apply(null, punkter.map(function (p, i) {
        return V.laengde(V.minus(V.plus(NK.M3.anvend(j.R, V.minus(p, j.cFra)), j.cTil), drejet[i]));
    }));
    paastand("drejningen, der lægger den nye form oven i den gamle, findes præcist", maksFejl < 1e-6, maksFejl);

    var byg = NK.sims["fane-byg"];
    byg.saetStruktur(B.fraSpec({ atomer: ["C"] }));
    for (var k = 0; k < 300; k++) byg.opdater(1 / 60);
    var foer = {};
    Object.keys(byg.disp).forEach(function (id) { foer[id] = byg.disp[id].slice(); });
    byg.valgtId = byg.s.atomer[0].id;
    byg.tilfoej("O");
    var flyt = byg.maal.atomer.filter(function (a) { return foer[a.id]; }).map(function (a) { return V.laengde(V.minus(byg.maal.pos[a.id], foer[a.id])); });
    paastand("når O sættes på CH₄, flytter de fælles atomer sig kun lidt (" + Math.max.apply(null, flyt).toFixed(2) + " Å)", Math.max.apply(null, flyt) < 0.7);
    for (k = 0; k < 300; k++) byg.opdater(1 / 60);
    var rest = byg.maal.atomer.map(function (a) { return V.laengde(V.minus(byg.disp[a.id], byg.maal.pos[a.id])); });
    paastand("atomerne glider helt på plads", Math.max.apply(null, rest) < 0.01 && (B.kendt(byg.s) || {}).id === "CH3OH");

    overskrift("4. Opgaverne kan løses");
    function loestOpgave(sim, o, loes) {
        sim.opgaver.startOpgave(o);
        loes(o);
        sim.opdater(1 / 60);
        return o.afsluttet && d.getElementById(sim.opgaver.id("knap")).textContent === "Ny opgave";
    }
    NK.visFane("fane-byg");
    byg.OPGAVER.forEach(function (lav, i) {
        var o = lav(byg);
        var ok = loestOpgave(byg, o, function (o) {
            if (o.valg) { byg.opgaver.vaelg(o.rigtig); return; }
            o.visSvar(byg);
        });
        paastand("fane 1, opgave " + (i + 1) + ": " + o.tekst, ok);
    });
    byg.skiftVinkelmaaler(false);

    ["fane-molekyler", "fane-polaritet"].forEach(function (fane) {
        var sim = NK.sims[fane];
        NK.visFane(fane);
        sim.OPGAVER.forEach(function (lav, i) {
            var alleOk = true, note = "";
            for (var gang = 0; gang < 10; gang++) {
                var o = lav(sim);
                var mol = D.molekyle(o.mol);
                var ok = loestOpgave(sim, o, function (o) {
                    if (o.valg) { sim.opgaver.vaelg(o.rigtig); return; }
                    sim.opgaver.klik(mol.delta.indexOf(-1));
                });
                if (fane === "fane-molekyler" && i === 0) ok = ok && o.valg[o.rigtig] === D.FORMER[mol.form].knap;
                if (fane === "fane-molekyler" && i === 1) ok = ok && o.valg[o.rigtig] === NK.grader(mol.vinkelGrader);
                if (fane === "fane-molekyler" && i === 2) ok = ok && o.rigtig === mol.frieAntal[mol.centrum];
                ok = ok && !sim.menuLaast() && sim.molId() === o.mol;
                if (!ok) { alleOk = false; note = o.mol + ": " + o.tekst; break; }
            }
            paastand(fane.replace("fane-", "") + ", opgavetype " + (i + 1) + " (10 tilfældige)", alleOk, note);
        });
    });

    overskrift("5. Fane 4: vandstrålen");
    var vand = NK.sims["fane-vand"];
    NK.visFane("fane-vand");
    var GRAD16 = 16 * Math.PI / 180;

    /* Straale af vaesken v, ladet stav med spidsen afst til hoejre for straalen. */
    function forsoeg(v, stav, afst, nulstil) {
        if (nulstil !== false) vand.nulstilForsoeg();
        vand.slip();
        vand.fyld(v);
        vand.saetHane(true);
        for (var n = 0; n < 50; n++) vand.opdater(1 / 60);
        var tip = { x: 390 + afst, y: 360 };
        vand.grib(stav, tip.x + 0.8 * 200 * Math.cos(GRAD16), tip.y + 0.8 * 200 * Math.sin(GRAD16), 0.8);
        vand.stave[stav].vinkel = GRAD16;
        vand.stave[stav].ladning = 1;
        var sum = 0, tal = 0;
        for (n = 0; n < 100; n++) {
            vand.opdater(1 / 60);
            if (n >= 60) vand.partikler.forEach(function (p) { if (p.y > 420) { sum += p.x - 390; tal++; } });
        }
        var ud = { udsving: tal ? sum / tal : 0, ladning: vand.stave[stav].ladning, registreret: !!vand.resultater[v][stav] };
        vand.slip();
        return ud;
    }

    var rv = forsoeg("vand", "plastik", 45), re = forsoeg("ethanol", "plastik", 45), rh = forsoeg("heptan", "plastik", 45), rg = forsoeg("vand", "glas", 45);
    skriv("        udsving ved bægerglasset: vand " + rv.udsving.toFixed(1) + ", ethanol " + re.udsving.toFixed(1) + ", heptan " + rh.udsving.toFixed(1) + ", vand med glasstav " + rg.udsving.toFixed(1), "note");
    paastand("vandstrålen bøjer tydeligt mod staven", rv.udsving > 20 && rv.ladning > 0.5);
    paastand("ethanol bøjer mindre end vand, men mere end heptan", re.udsving > 5 && re.udsving < rv.udsving * 0.8);
    paastand("heptan løber næsten lige ned", Math.abs(rh.udsving) < 3);
    paastand("vandstrålen bøjer også mod den positive glasstav", rg.udsving > 20);
    paastand("et test registreres efter lidt over et sekund", rv.registreret && re.registreret && rh.registreret && rg.registreret);

    var rr = forsoeg("vand", "plastik", 2);
    paastand("rører staven strålen, mister den ladningen", rr.ladning === 0);

    vand.nulstilForsoeg();
    vand.grib("plastik", 700, 590, 0.7);
    for (var g = 0; g < 40; g++) { vand.flytStav(g % 2 ? 900 : 960, 598); vand.opdater(1 / 60); }
    paastand("staven bliver ladet, når den gnides på kluden (" + vand.stave.plastik.ladning.toFixed(2) + ")", vand.stave.plastik.ladning > 0.5 && vand.trinGjort("gnedet"));
    vand.slip();

    vand.nulstilForsoeg();
    vand.fyld("vand");
    vand.saetHane(true);
    for (g = 0; g < 60 * 20; g++) vand.opdater(1 / 60);
    var ialt = vand.baeger.vand + vand.pytter.reduce(function (t, p) { return t + p.vol; }, 0);
    paastand("de 30 mL i buretten ender i bægerglasset (" + ialt.toFixed(1) + " mL)", naer(ialt, 30, 0.6) && vand.vol === 0);
    paastand("en fuld burette kan ikke fyldes, og en tom hane kan ikke åbnes",
        (function () { vand.saetHane(false); vand.nulstilForsoeg(); var a = vand.saetHane(true); vand.fyld("vand"); var b = vand.fyld("heptan"); return !a && !b; }()));

    vand.nulstilForsoeg();
    paastand("opgaven er låst, før forsøget er slut", d.getElementById("vand-opg-knap").disabled);
    forsoeg("vand", "plastik", 45, false);
    for (g = 0; g < 60 * 16; g++) vand.opdater(1 / 60);
    vand.saetHane(false);
    forsoeg("ethanol", "plastik", 45, false);
    for (g = 0; g < 60 * 16; g++) vand.opdater(1 / 60);
    vand.saetHane(false);
    forsoeg("heptan", "plastik", 45, false);
    for (g = 0; g < 60 * 16; g++) vand.opdater(1 / 60);
    vand.saetHane(false);
    paastand("efter tre væsker mangler kun vand med glasstaven", vand.trinGjort("alle") && !vand.slut() && vand.aktueltTrin().id === "begge");
    forsoeg("vand", "glas", 45, false);
    paastand("forsøget er slut, og tegneserien og opgaven er låst op",
        vand.slut() && !d.getElementById("vand-serieknap").hidden && !d.getElementById("vand-opg-knap").disabled);
    NK.aabnSerie();
    var ruder = d.querySelectorAll("#serie-ruder .rude");
    var tabel = d.querySelector("#serie-ruder .resultater");
    paastand("tegneserien har " + ruder.length + " ruder og resultatskemaet i sidste rude",
        ruder.length >= 8 && tabel && ruder[ruder.length - 1].contains(tabel) && tabel.querySelectorAll("tr").length === 4);
    paastand("resultatskemaet bruger elevens resultater", tabel && tabel.innerText.indexOf("bøjer tydeligt") >= 0 && tabel.innerText.indexOf("løber lige ned") >= 0);
    var serieTekst = d.getElementById("serie-ruder").innerText;
    d.getElementById("tegneserie").classList.remove("vis");

    vand.OPGAVER.forEach(function (lav, i) {
        var o = lav(vand);
        paastand("fane 4, opgave " + (i + 1) + ": " + o.tekst, loestOpgave(vand, o, function (o) { vand.opgaver.vaelg(o.rigtig); }));
    });

    overskrift("6. Tekster og skrift");
    var tekster = [d.body.innerText, serieTekst];
    D.TEORI.forEach(function (a) { tekster.push(a.h); a.p.forEach(function (p) { tekster.push(p); }); });
    D.MOLEKYLER.forEach(function (m) { tekster.push(m.navn, m.hintForm, m.svarForm, m.hintPol, m.svarPol); });
    [byg, NK.sims["fane-molekyler"], NK.sims["fane-polaritet"], vand].forEach(function (sim) {
        sim.OPGAVER.forEach(function (lav) {
            var o = lav(sim);
            tekster.push(o.tekst, o.hint || "", o.svar || "");
            (o.valg || []).forEach(function (v) { tekster.push(v); });
        });
    });
    vand.TRIN.forEach(function (t) { tekster.push(t.tekst, t.hint(vand)); });
    NK.Rundvisning.TUR.forEach(function (t) { tekster.push(t.titel, t.tekst); });
    var alt = tekster.join("\n");
    var streger = alt.match(/.{0,30}[–—].{0,30}/g);
    paastand("ingen tankestreger (– eller —)", !streger, streger && streger.slice(0, 3).join(" | "));

    var smaa = [];
    ["fane-byg", "fane-molekyler", "fane-polaritet", "fane-vand"].forEach(function (fane) {
        NK.visFane(fane);
        Array.prototype.forEach.call(d.querySelectorAll("body *"), function (e) {
            if (!e.offsetWidth && !e.offsetHeight) return;
            var harTekst = Array.prototype.some.call(e.childNodes, function (n) { return n.nodeType === 3 && n.textContent.trim(); });
            if (!harTekst) return;
            var px = parseFloat(W.getComputedStyle(e).fontSize);
            if (px < 12) smaa.push((e.id || e.className || e.tagName) + " " + px + "px");
        });
    });
    NK.visFane("fane-byg");
    paastand("ingen synlig tekst under 12 px", smaa.length === 0, smaa.slice(0, 6).join(", "));
}
</script>
</body>
</html>
