<svg xmlns="http://www.w3.org/2000/svg" width="210" height="92" viewBox="0 0 210 92">
  <!-- Isbad, den bageste halvdel: krystallisationsskaal af glas med vand
       og is. Tegnes FOER kolben; isbad_for.svg tegnes EFTER kolben.
       Randen er ellipsen (105, 18) rx 100 ry 12, vandets overflade
       ellipsen (105, 36) rx 98 ry 11, og bunden staar paa bordet ved y 90.
       En kolbe i isbadet staar med bunden ved (105, 86). -->
  <defs>
    <linearGradient id="vand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fcff0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6aa9d6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Vandet bag kolben -->
  <path d="M7 36 A98 11 0 0 1 203 36 L203 84 L7 84 Z" fill="url(#vand)"/>
  <!-- Is bagest -->
  <g fill="#eef7fd" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1">
    <rect x="30" y="24" width="18" height="15" rx="4" transform="rotate(-12 39 31)"/>
    <rect x="150" y="23" width="20" height="16" rx="4" transform="rotate(9 160 31)"/>
    <rect x="96" y="22" width="17" height="14" rx="4" transform="rotate(4 104 29)"/>
  </g>
  <!-- Bageste halvdel af randen og vandets overflade -->
  <path d="M5 18 A100 12 0 0 1 205 18" fill="none" stroke="#dcecf8" stroke-opacity="0.8" stroke-width="1.6"/>
  <path d="M7 36 A98 11 0 0 1 203 36" fill="none" stroke="#e6f4fc" stroke-opacity="0.55" stroke-width="1.2"/>
</svg>
