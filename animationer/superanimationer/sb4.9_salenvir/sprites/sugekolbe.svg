<svg xmlns="http://www.w3.org/2000/svg" width="150" height="200" viewBox="0 0 150 200">
  <!-- Sugekolbe: konisk kolbe af tykt glas med slangestuds paa halsen.
       Samme indre maal som kolbe.svg: halsen x 60-90 fra y 6 til y 62,
       bunden y 192 med indersiden x 15-135. Filtratet tegnes af
       animationen BAG filen. Slangestudsens ende er (144, 26).
       Buechnertragtens gummimanchet sidder i aabningen (75, 4). -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.4"/>
      <stop offset="0.14" stop-color="#d4ebfa" stop-opacity="0.1"/>
      <stop offset="0.78" stop-color="#d4ebfa" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <!-- Slangestudsen -->
  <path d="M93 22 L132 20 L132 32 L93 30 Z" fill="#d4ebfa" fill-opacity="0.22" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M130 19 L136 21 L136 31 L130 33 M136 21 L142 23 L142 29 L136 31" fill="none" stroke="#dcecf8" stroke-opacity="0.8" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- Krop og hals (tykkere vaeg end en almindelig kolbe) -->
  <path d="M55 6 L55 60 L9 180 Q5 197 24 197 L126 197 Q145 197 141 180 L95 60 L95 6 Z" fill="url(#glas)"/>
  <path d="M55 6 L55 60 L9 180 Q5 197 24 197 L126 197 Q145 197 141 180 L95 60 L95 6"
        fill="none" stroke="#dcecf8" stroke-opacity="0.9" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M60 6 L60 62 L15 180 Q13 192 24 192 L126 192 Q137 192 135 180 L90 62 L90 6"
        fill="none" stroke="#dcecf8" stroke-opacity="0.28" stroke-width="1.2"/>
  <rect x="51" y="0" width="48" height="7" rx="2.5" fill="#dcecf8" fill-opacity="0.28" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1.4"/>
  <g stroke="#eef6fc" stroke-opacity="0.5" stroke-width="1.1" stroke-linecap="round">
    <path d="M104 140 h10 M97 110 h8"/>
  </g>
  <rect x="63" y="10" width="4" height="48" rx="2" fill="#ffffff" fill-opacity="0.22"/>
  <path d="M53 86 L25 156" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
</svg>
