<svg xmlns="http://www.w3.org/2000/svg" width="210" height="92" viewBox="0 0 210 92">
  <!-- Isbad, den forreste halvdel (se isbad_bag.svg). Tegnes EFTER kolben:
       vandet foran er gennemsigtigt, saa kolbens bund ses gennem det. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.3"/>
      <stop offset="0.12" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="0.88" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.28"/>
    </linearGradient>
  </defs>
  <ellipse cx="105" cy="90" rx="102" ry="2.5" fill="#000000" fill-opacity="0.35"/>
  <!-- Vandet foran -->
  <path d="M7 36 A98 11 0 0 0 203 36 L203 82 A98 6 0 0 1 7 82 Z" fill="#8fc6ec" fill-opacity="0.22"/>
  <path d="M7 36 A98 11 0 0 0 203 36" fill="none" stroke="#e6f4fc" stroke-opacity="0.7" stroke-width="1.3"/>
  <!-- Is foran, halvt under vandet -->
  <g fill="#eef7fd" fill-opacity="0.62" stroke="#ffffff" stroke-opacity="0.9" stroke-width="1">
    <rect x="16" y="38" width="22" height="18" rx="5" transform="rotate(10 27 47)"/>
    <rect x="58" y="42" width="20" height="17" rx="5" transform="rotate(-8 68 50)"/>
    <rect x="132" y="43" width="21" height="17" rx="5" transform="rotate(14 142 51)"/>
    <rect x="172" y="37" width="20" height="17" rx="5" transform="rotate(-6 182 45)"/>
  </g>
  <!-- Glasset -->
  <path d="M5 18 L5 82 A100 8 0 0 0 205 82 L205 18 A100 12 0 0 1 5 18 Z" fill="url(#glas)"/>
  <path d="M5 18 L5 82 A100 8 0 0 0 205 82 L205 18" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M5 18 A100 12 0 0 0 205 18" fill="none" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1.6"/>
  <rect x="12" y="26" width="4" height="50" rx="2" fill="#ffffff" fill-opacity="0.2"/>
</svg>
