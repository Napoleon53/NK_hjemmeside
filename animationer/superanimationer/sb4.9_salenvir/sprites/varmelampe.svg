<svg xmlns="http://www.w3.org/2000/svg" width="190" height="300" viewBox="0 0 190 300">
  <!-- Varmelampe paa stativ. Foden staar paa bordet ved y 300 (x 112-188).
       Lampen haenger over x 60; paeren er ellipsen (60, 86) rx 30 ry 6,
       og animationen tegner gloeden og lyskeglen. Et urglas under lampen
       staar med bunden paa bordet ved x 60. -->
  <defs>
    <linearGradient id="stang" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8591"/>
      <stop offset="0.4" stop-color="#e6ebf0"/>
      <stop offset="1" stop-color="#6a7480"/>
    </linearGradient>
    <linearGradient id="skaerm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a414c"/>
      <stop offset="0.45" stop-color="#7d8794"/>
      <stop offset="1" stop-color="#2c323b"/>
    </linearGradient>
    <linearGradient id="fod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505b"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </linearGradient>
  </defs>
  <ellipse cx="150" cy="299" rx="40" ry="2.5" fill="#000000" fill-opacity="0.35"/>
  <path d="M112 300 L115 288 Q116 284 121 284 L179 284 Q184 284 185 288 L188 300 Z" fill="url(#fod)" stroke="#1c1f24" stroke-width="1"/>
  <rect x="146" y="22" width="7" height="264" rx="3" fill="url(#stang)" stroke="#565f69" stroke-width="0.8"/>
  <rect x="56" y="24" width="96" height="7" rx="3" fill="url(#stang)" stroke="#565f69" stroke-width="0.8"/>
  <rect x="142" y="18" width="15" height="16" rx="3" fill="#8a949f" stroke="#4d5660" stroke-width="1"/>
  <rect x="54" y="28" width="12" height="16" rx="2" fill="#5a636f" stroke="#2c323b" stroke-width="1"/>
  <!-- Skaermen -->
  <path d="M42 44 L78 44 Q96 56 98 86 L22 86 Q24 56 42 44 Z" fill="url(#skaerm)" stroke="#1f242b" stroke-width="1.2" stroke-linejoin="round"/>
  <ellipse cx="60" cy="86" rx="38" ry="7" fill="#2a2f37" stroke="#1f242b" stroke-width="1.2"/>
  <ellipse cx="60" cy="86" rx="30" ry="5.5" fill="#5b4038"/>
  <rect x="44" y="50" width="4" height="26" rx="2" fill="#ffffff" fill-opacity="0.22"/>
</svg>
