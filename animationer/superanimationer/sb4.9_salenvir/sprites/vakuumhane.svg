<svg xmlns="http://www.w3.org/2000/svg" width="100" height="130" viewBox="0 0 100 130">
  <!-- Hane til vakuum paa et roer langs vaeggen. Slangestudsens ende er
       (4, 61). Haandtaget tegnes af animationen med omdrejningspunkt i
       (56, 50): vandret, naar hanen er lukket, og lodret, naar den er aaben. -->
  <defs>
    <linearGradient id="roer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b8591"/>
      <stop offset="0.45" stop-color="#e6ebf0"/>
      <stop offset="1" stop-color="#6a7480"/>
    </linearGradient>
    <linearGradient id="messing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d58a"/>
      <stop offset="0.5" stop-color="#c99a3a"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
  </defs>
  <rect x="80" y="0" width="12" height="130" rx="2" fill="url(#roer)" stroke="#4d5660" stroke-width="0.8"/>
  <rect x="34" y="52" width="48" height="18" rx="4" fill="url(#messing)" stroke="#6b4c16" stroke-width="1"/>
  <circle cx="56" cy="50" r="7" fill="url(#messing)" stroke="#6b4c16" stroke-width="1"/>
  <path d="M34 56 L10 57 L4 58 L4 64 L10 65 L34 66 Z" fill="url(#messing)" stroke="#6b4c16" stroke-width="1" stroke-linejoin="round"/>
  <path d="M12 56 L12 66 M20 56 L20 66" stroke="#6b4c16" stroke-width="1"/>
  <rect x="34" y="84" width="48" height="16" rx="3" fill="#2b3340" stroke="#4a5262" stroke-width="1"/>
  <text x="58" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#dfe4ea">Vakuum</text>
</svg>
