<svg xmlns="http://www.w3.org/2000/svg" width="60" height="84" viewBox="0 0 60 84">
<!-- Et glas med laag til fedtet (sc6.6). Tegnes OVEN PAA indholdet,
     saa glasset er naesten gennemsigtigt.
     Maal (MAAL.glas i js/sprites.js):
       b 60, h 84
       det indre: x 8-52, y 17-79, hjoerner i bunden r 8
       laaget: y 1-13 (farven laegges paa i koden)
       etiketten: y 44-62 -->
<defs>
  <linearGradient id="laag" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f4f6f8"/>
    <stop offset="0.5" stop-color="#c3cad2"/>
    <stop offset="1" stop-color="#8d97a2"/>
  </linearGradient>
  <linearGradient id="glans" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
    <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="0.8" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
  </linearGradient>
</defs>
<!-- Glasset -->
<path d="M9 13 L51 13 Q54 13 54 16 L54 74 Q54 82 46 82 L14 82 Q6 82 6 74 L6 16 Q6 13 9 13 Z"
      fill="url(#glans)" stroke="#cfe0ea" stroke-opacity="0.85" stroke-width="2"/>
<path d="M11 20 L11 70" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
<path d="M48 24 L48 44" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
<!-- Laaget -->
<rect x="4" y="1" width="52" height="12" rx="3" fill="url(#laag)" stroke="#6f7883" stroke-width="1"/>
<path d="M8 4 L8 10 M14 4 L14 10 M20 4 L20 10 M26 4 L26 10 M32 4 L32 10 M38 4 L38 10 M44 4 L44 10 M50 4 L50 10"
