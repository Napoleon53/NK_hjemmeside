<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Skærmbilleder: sb7.7 Aminosyrer</title>
<style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
    iframe { border: 0; display: block; }
</style>
</head>
<body>
<!--
    Udviklerværktøj. Indgår ikke i animationen.
    Åbner index.html i en ramme med fast størrelse og stiller animationen i et
    bestemt trin, så det kan ses som skærmbillede:
      _skud.html?b=1400&h=860&s=<scenarie>
    Kræver en lokal server med mappen animationer/ som rod.
-->
<script>
var q = {};
location.search.replace(/^\?/, "").split("&").forEach(function (p) { var a = p.split("="); if (a[0]) q[a[0]] = decodeURIComponent(a[1] || ""); });
var B = parseInt(q.b || "1400", 10), H = parseInt(q.h || "860", 10);
var f = document.createElement("iframe");
f.width = B; f.height = H;
f.src = "index.html";
document.body.appendChild(f);

function tid(sim, sek) { for (var t = 0; t < sek; t += 1 / 60) sim.opdater(1 / 60); }
function fa(NK) { NK.visFane("fane-f"); var s = NK.sims["fane-f"]; s.vaelg(0); s.tilpas(); s.tegn(); return s; }
function di(NK) { NK.visFane("fane-d"); var s = NK.sims["fane-d"]; s.vaelg(0); return s; }
function fe(NK) { NK.visFane("fane-e"); var s = NK.sims["fane-e"]; s.vaelg(0); return s; }
/* Fane 1 til et bestemt trin */
function faTil(NK, trin) {
    var s = fa(NK);
    if (trin >= 1) { s.visSvar(); tid(s, 0.6); s.valgt = 1; s.indsendKlik(); s.videreKlik(); }
    if (trin >= 2) { s.valgtGruppe = "carboxyl"; s.indsendKlik(); tid(s, 2.2); s.videreKlik(); tid(s, 2.2); }
    return s;
}
/* Fane 3 til et bestemt trin (0-5) */
function feTil(NK, trin) {
    var s = fe(NK);
    if (trin >= 1) { s.visSvar(); s.videreKlik(); }
    if (trin >= 2) { s.valgt = 2; s.indsendKlik(); s.videreKlik(); }
    if (trin >= 3) { s.udfoer(); tid(s, 3); s.videreKlik(); }
    if (trin >= 4) { s.valgt = 0; s.indsendKlik(); tid(s, 3); s.videreKlik(); }
    if (trin >= 5) { s.udfoer(); tid(s, 3); s.videreKlik(); }
    return s;
}
function spor(s) { for (var p = 0; p <= 14.01; p += 0.1) s.saetPh(p); tid(s, 0.3); s.videreKlik(); }

var SCENARIER = {
    "f-start": function (NK) { fa(NK); },
    "f-traek": function (NK) { var s = fa(NK); var h = s.kasser.hydron; s.nedScene({ x: h.cx, y: h.cy }); s.flytScene({ x: s.mol.x - s.fs * 2, y: s.mol.y - s.fs * 1.6 }); },
    "f-spm": function (NK) { var s = fa(NK); s.visSvar(); tid(s, 0.6); s.valgt = 1; s.visKort(); },
    "f-ok": function (NK) { var s = fa(NK); s.visSvar(); tid(s, 0.6); s.valgt = 1; s.indsendKlik(); },
    "f-sur": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "carboxyl"; s.visKort(); },
    "f-sur-fejl": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "amino"; s.indsendKlik(); },
    "f-sur-reak1": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "carboxyl"; s.indsendKlik(); tid(s, 0.5); },
    "f-sur-reak2": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "carboxyl"; s.indsendKlik(); tid(s, 0.95); },
    "f-sur-slut": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "carboxyl"; s.indsendKlik(); tid(s, 2.2); },
    "f-basisk-for": function (NK) { var s = faTil(NK, 1); s.valgtGruppe = "carboxyl"; s.indsendKlik(); tid(s, 2.2); s.videreKlik(); tid(s, 0.9); },
    "f-basisk": function (NK) { faTil(NK, 2); },
    "f-slut": function (NK) { var s = faTil(NK, 2); s.valgtGruppe = "amino"; s.indsendKlik(); tid(s, 2.2); },
    "f-fri": function (NK) { var s = faTil(NK, 2); s.valgtGruppe = "amino"; s.indsendKlik(); tid(s, 2.2); s.saetPh(2.0); },
    "d-start": function (NK) { var s = di(NK); tid(s, 0.5); },
    "d-halv": function (NK) { var s = di(NK); for (var p = 0; p <= 6.5; p += 0.1) s.saetPh(p); tid(s, 0.3); },
    "d-tegnet": function (NK) { var s = di(NK); for (var p = 0; p <= 14.01; p += 0.1) s.saetPh(p); tid(s, 0.3); },
    "d-find": function (NK) { var s = di(NK); spor(s); s.saetPh(3.5); },
    "d-find-fejl": function (NK) { var s = di(NK); spor(s); s.saetPh(3.5); s.indsendKlik(); },
    "d-find-ok": function (NK) { var s = di(NK); spor(s); s.saetPh(2.3); s.indsendKlik(); },
    "d-tal": function (NK) { var s = di(NK); spor(s); s.saetPh(2.3); s.indsendKlik(); s.videreKlik(); s.talTekst = "11,94"; s.visKort(); },
    "d-tal-fejl": function (NK) { var s = di(NK); spor(s); s.saetPh(2.3); s.indsendKlik(); s.videreKlik(); s.talTekst = "11,94"; s.visKort(); s.indsendKlik(); },
    "d-slut": function (NK) { var s = di(NK); spor(s); s.saetPh(2.3); s.indsendKlik(); s.videreKlik(); s.talTekst = "5,97"; s.indsendKlik(); tid(s, 2); },
    "e-start": function (NK) { fe(NK); },
    "e-former-halv": function (NK) { var s = fe(NK); s.elevT.asp.carboxyl = 0; s.elevT.asp.amino = 1; s.elevT.val.carboxyl = 0; s.klikket = 3; s.visKort(); },
    "e-former-fejl": function (NK) { var s = fe(NK); s.elevT.asp.carboxyl = 0; s.elevT.asp.amino = 1; s.klikket = 2; s.indsendKlik(); },
    "e-former-ok": function (NK) { var s = fe(NK); s.visSvar(); },
    "e-minuspol": function (NK) { var s = fe(NK); s.visSvar(); s.videreKlik(); s.valgt = 2; s.visKort(); },
    "e-koer": function (NK) { var s = fe(NK); s.visSvar(); s.videreKlik(); s.valgt = 2; s.indsendKlik(); s.videreKlik(); s.udfoer(); tid(s, 1.2); },
    "e-efter": function (NK) { var s = fe(NK); s.visSvar(); s.videreKlik(); s.valgt = 2; s.indsendKlik(); s.videreKlik(); s.udfoer(); tid(s, 3); },
    "e-slut": function (NK) { var s = fe(NK); s.visSvar(); s.videreKlik(); s.valgt = 2; s.indsendKlik(); s.videreKlik(); s.udfoer(); tid(s, 3); s.videreKlik(); s.valgt = 0; s.indsendKlik(); tid(s, 3.5); },
    "e-ukendt": function (NK) { var s = feTil(NK, 4); },
    "e-ukendt-efter": function (NK) { var s = feTil(NK, 4); s.udfoer(); tid(s, 3); },
    "e-struktur": function (NK) { var s = feTil(NK, 5); s.valgSide.x = "OH"; s.klikket = 1; s.visKort(); },
    "e-struktur-fejl": function (NK) { var s = feTil(NK, 5); s.valgSide.x = "amino"; s.valgSide.y = "amino"; s.klikket = 2; s.indsendKlik(); },
    "e-struktur-ok": function (NK) { var s = feTil(NK, 5); s.valgSide.x = "carboxyl"; s.valgSide.y = "amino"; s.klikket = 2; s.indsendKlik(); },
    "teori": function (NK, W) { W.document.getElementById("teoriknap").click(); }
};

f.addEventListener("load", function () {
    var W = f.contentWindow;
    try { W.localStorage.clear(); } catch (e) { /* ingen hukommelse */ }
    setTimeout(function () {
        var NK = W.NK;
        try { (SCENARIER[q.s] || function () {})(NK, W); } catch (e) { document.title = "FEJL " + e.message; console.log("FEJL " + e.message + " " + e.stack); }
        NK.tid.skala = 0;
        var sims = NK.sims;
        Object.keys(sims).forEach(function (k) { sims[k].tilpas(); });
        setTimeout(function () { Object.keys(sims).forEach(function (k) { try { sims[k].tegn(); } catch (e) { document.title = "FEJL " + e.message; console.log("FEJL tegn " + e.message + " " + e.stack); } }); window.klar = true; }, 80);
    }, 400);
});
</script>
</body>
</html>
