<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - sb2.4 Indgreb i en kemisk ligevægt</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem med de
   samme funktioner, som klik og musen bruger: modellen, del 1 med de
   syv glas, billedet, del 2 med fortyndingen, tegneserien, uheldene,
   quizzen, sproget og ion-notationen. Chrome skal have lov at kigge ind
   i iframen: lokal server eller --allow-file-access-from-files.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    /* Baggrundslivet (han gaar forbi, naar der er stille) skal ikke
       blande sig i testens scener */
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i, t, sek;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("introen aabner og lukker", !!NK.intro && (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) && (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    paastand("forsoeg og quiz er bygget", !!(NK.forsoeg && NK.quiz));
    Object.keys(NK.Sprites.FILER).forEach(function (navn) {
        paastand("sprite " + navn + " er indlaest", NK.Sprites.klar(navn));
    });

    var M = NK.Model, f = NK.forsoeg, S = NK.Scene;
    function adv(s) { for (var k = 0; k < Math.round(s * 60); k++) f.opdater(1 / 60); }
    function vent(betingelse, maks) { var tt = 0; while (!betingelse() && tt < maks) { adv(0.25); tt += 0.25; } return tt; }
    function frisk() { NK.startForfra(); adv(0.1); }
    function G(k) { return f.g["glas" + k]; }
    function V(c) { return M.volumen(c.b); }
    function kx(c) { return M.koncX(M.samlet(c.b)); }
    function komma(x, dec) { var p = Math.pow(10, dec === undefined ? 2 : dec); return String(Math.round(x * p) / p).replace(".", ","); }
    function scene() { return f.laerer.scene ? f.laerer.scene.navn : ""; }
    function sml(a, b) { return M.sammenlign(M.samlet(a.b), M.samlet(b.b)); }
    function midt(r) { return { x: r.x + r.b / 2, y: r.y + r.h / 2 }; }
    function punkt(navn) {
        if (navn === "dunk") return { x: S.DUNK.x + 45, y: S.DUNK.y + 40 };
        var gg = f.g[navn];
        if (gg.erGlas) return { x: gg.p.x, y: gg.p.y + 80 };
        if (gg.greb === "stav") return midt(S.stavRekt(gg.p));
        if (gg.greb === "termometer") return midt(S.termRekt(gg.p));
        if (gg.greb === "bad") return { x: S.BAD[navn].x + 10, y: S.BAD[navn].y + 60 };
        return midt(S.rekt(gg.sprite, gg.p, gg.anker, 0));
    }
    var musTid = 0;
    /* Tager genstanden med musen og slipper den over maal (navn eller punkt) */
    function traek(navn, maal) {
        var a = punkt(navn), b = typeof maal === "string" ? punkt(maal) : maal;
        f.ned(a);
        if (!f.holdt) return false;
        for (var s = 1; s <= 40; s++) {
            musTid += 40;
            f.flyt({ x: a.x + (b.x - a.x) * s / 40, y: a.y + (b.y - a.y) * s / 40 }, musTid);
            f.opdater(1 / 60);
        }
        f.op();
        return true;
    }
    function musRyst(gl, A, hz, s) {
        var x0 = gl.p.x, y0 = gl.p.y + 80, k;
        f.ned({ x: x0, y: y0 });
        if (!f.holdt) return -1;
        for (k = 0; k <= Math.round(s * 60); k++) {
            musTid += 1000 / 60;
            f.flyt({ x: x0 + 12 + A * Math.sin(2 * Math.PI * hz * k / 60), y: y0 }, musTid);
            f.opdater(1 / 60);
            if (f.pyt) break;
        }
        f.op();
        adv(1);
        return k / 60;
    }

    overskrift("2. Modellen");
    paastand("ligevaegten er afstemt", M.afstemt(M.REAKTIONER.ligevaegt));
    paastand("faeldningen er afstemt", M.afstemt(M.REAKTIONER.faeldning));
    paastand("reduktionen med ascorbinsyre er afstemt", M.afstemt(M.REAKTIONER.reduktion));
    paastand("ligningerne skrives rigtigt", M.ligning(M.REAKTIONER.ligevaegt, true) === "Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)" && M.ligning(M.REAKTIONER.reduktion) === "2 Fe³⁺ + C₆H₈O₆ → 2 Fe²⁺ + C₆H₆O₆ + 2 H⁺", M.ligning(M.REAKTIONER.reduktion));
    paastand("formler med ladning", M.formel("SCN-") === "SCN⁻" && M.formel("H+") === "H⁺" && M.formel("Fe2+") === "Fe²⁺" && M.formel("Ag+") === "Ag⁺");
    paastand("K er 140 ved 20 °C, mindre ved 80 °C og stoerre ved 0 °C", Math.abs(M.K(20) - 140) < 1e-9 && M.K(80) < M.K(20) && M.K(0) > M.K(20));
    paastand("stamoploesningen er 2,38 mM og roedbrun", Math.abs(M.stamOpl(1).fe - 2.381) < 0.01 && M.farveNavn(M.stamOpl(3)) === "rødbrun", M.farveNavn(M.stamOpl(3)));

    function glas(fn) { var b = M.beholder(M.MAENGDE.LAG_GLAS); M.haeldI(b, M.stamOpl(3)); if (fn) fn(b); return b; }
    function tid(b, s, st) { for (var k = 0; k < Math.round(s * 60); k++) M.skridt(b, 1 / 60, st || { T: 20, tau: 25, bland: M.BLAND.diffusion, roer: false, ryst: 0 }); return b; }
    function smlB(a, b) { return M.sammenlign(M.samlet(a), M.samlet(b)); }
    var ROER = { T: 20, tau: 25, bland: M.BLAND.diffusion + M.BLAND.roer, roer: true, ryst: 0.6 };
    var ref = tid(glas(), 5);
    var b1 = glas(function (b) { M.spatelspids(b, "fe"); });
    tid(b1, 2.2, ROER); tid(b1, 3);
    paastand("Fe(NO3)3 (s) er oploest efter omroering og giver et moerkere glas", M.fastIalt(b1) === 0 && !b1.lag && smlB(b1, ref) === "mørkere", komma(M.koncX(M.samlet(b1)) / M.koncX(M.samlet(ref))));
    var b1u = tid(glas(function (b) { M.spatelspids(b, "fe"); }), 3);
    paastand("uden omroering er det faste stof ikke oploest efter 3 s", M.fastIalt(b1u) > 1, komma(M.fastIalt(b1u)) + " µmol");
    var b2 = glas(function (b) { M.spatelspids(b, "vitc"); });
    tid(b2, 2.2, ROER); tid(b2, 4);
    paastand("ascorbinsyre giver Fe2+ og et lysere glas", smlB(b2, ref) === "lysere" && M.samlet(b2).fe2 > 5, komma(M.samlet(b2).fe2) + " µmol Fe2+");
    var b3 = glas(function (b) { M.spatelspids(b, "scn"); });
    tid(b3, 2.2, ROER); tid(b3, 3);
    paastand("KSCN (s) giver et moerkere glas", smlB(b3, ref) === "mørkere");
    var b4 = glas(function (b) { M.draabe(b); M.draabe(b); });
    tid(b4, 2.2, ROER);
    paastand("to draaber AgNO3 giver bundfald og et lysere glas", smlB(b4, ref) === "lysere" && M.samlet(b4).agscn > 5);
    var b5 = tid(glas(), 12, { T: 80, tau: 3.5, bland: 0.05, roer: false, ryst: 0 });
    paastand("vandbadet giver et lysere glas", smlB(b5, ref) === "lysere");
    var b6 = tid(glas(), 12, { T: 0, tau: 4.5, bland: 0.05, roer: false, ryst: 0 });
    paastand("isbadet giver et moerkere glas", smlB(b6, ref) === "mørkere");
    var fa = M.farveOpl(20), fb = M.farveOpl(20);
    M.bland(fb, M.vandOpl(20));
    paastand("fortyndet frugtfarve ser ens ud ovenfra", M.sammenlignOvenfra(fb, fa) === "som det andet glas");
    var la = M.stamOpl(20), lb = M.stamOpl(20);
    M.bland(lb, M.vandOpl(20));
    lb.x = M.xLigevaegt(lb);
    paastand("fortyndet ligevaegtsblanding er lysere ovenfra", M.sammenlignOvenfra(lb, la) === "lysere");

    overskrift("3. Del 1: de syv glas");
    frisk();
    paastand("del 1 og baegerglasset er valgt fra start", f.station === 1 && f.valgt === "baegerA");
    /* Klik viser, traek goer: et klik vaelger kun */
    paastand("et klik paa kolben vaelger den og goer ellers ingenting", f.klik("kolbe1") === true && f.valgt === "kolbe1" && !f.handling);
    adv(2);
    paastand("boblen viser, hvad der er i kolben", !!f.bobleBeholder && f.bobleBeholder.navn === "kolbe1" && f.bobleBeholder.mikro.antal("fe") > 0, f.bobleBeholder ? f.bobleBeholder.navn : "ingen");
    paastand("et klik paa spatlen bruger den ikke", f.klik("spatel") === true && !f.handling && f.g.spatel.last === null);

    paastand("kolben traekkes til baegerglasset", traek("kolbe1", "baegerA"));
    adv(4);
    paastand("baegerglasset har 30 mL, trin 1 gjort", Math.abs(V(f.g.baegerA) - 30) < 0.05 && f.trinGjort("stam") && !f.handling, komma(V(f.g.baegerA)));
    paastand("kolben svaever over baegerglasset med en gul ring", f.svaevende() === f.g.kolbe1 && !!f.svaevRing());
    paastand("et klik gentager haeldningen", f.klik("kolbe1") === true);
    adv(4);
    paastand("baegerglasset har 60 mL", Math.abs(V(f.g.baegerA) - 60) < 0.1, komma(V(f.g.baegerA)));

    /* Eleven haelder selv i de syv glas, ét ad gangen */
    for (i = 1; i <= 7; i++) { traek("baegerA", "glas" + i); adv(3.4); }
    paastand("glas 1 til 7 har 3 mL, glas 8 er tomt, trin 2 gjort", [1, 2, 3, 4, 5, 6, 7].every(function (k) { return Math.abs(V(G(k)) - 3) < 0.06 && G(k).fyldt; }) && V(G(8)) === 0 && f.trinGjort("fordel") && !f.handling, komma(V(G(1))));
    paastand("intet glas er valgt efter fordelingen", f.valgt === null);

    paastand("pulverglasset med Fe(NO3)3 traekkes til glas 1", traek("pulver_fe", "glas1"));
    adv(4);
    paastand("glas 1 har fast stof, og pulverglasset er hjemme", G(1).indgreb.fe === 1 && M.fastIalt(G(1).b) > 0 && Math.abs(f.g.pulver_fe.p.x - f.g.pulver_fe.hjem.x) < 1 && !f.handling, komma(M.fastIalt(G(1).b)) + " µmol");
    paastand("spatlen svaever over glas 1 med en gul ring", f.svaevende() === f.g.spatel && !!f.svaevRing());
    paastand("trinnet er ikke gjort foer omroering", !f.trinGjort("g1"));
    paastand("glasstaven traekkes til glas 1", traek("glasstav", "glas1"));
    adv(4.5);
    paastand("glas 1 er oploest og moerkere end glas 7", f.trinGjort("g1") && sml(G(1), G(7)) === "mørkere", komma(kx(G(1)) / kx(G(7))));

    paastand("ascorbinsyren traekkes til glas 2", traek("pulver_vitc", "glas2"));
    adv(4);
    traek("glasstav", "glas2");
    adv(4.5);
    paastand("glas 2 er lysere, og jernet er blevet Fe2+", f.trinGjort("g2") && sml(G(2), G(7)) === "lysere" && M.samlet(G(2).b).fe2 > 5);

    paastand("spatlen traekkes ned i KSCN", traek("spatel", "pulver_scn"));
    adv(2.5);
    paastand("der ligger KSCN paa spatlen", f.g.spatel.last === "scn" && !f.handling);
    paastand("spatlen svaever over pulverglasset med en gul ring", f.svaevende() === f.g.spatel && !!f.svaevRing());
    paastand("spatlen traekkes til glas 3", traek("spatel", "glas3"));
    adv(2.5);
    paastand("glas 3 har faaet KSCN, og spatlen er tom", G(3).indgreb.scn === 1 && f.g.spatel.last === null);
    paastand("knappen ryster glas 3", f.rystKnap(true) === true && f.rystGlas === G(3));
    adv(3); f.rystKnap(false); adv(1);
    paastand("glas 3 er oploest og moerkere", f.trinGjort("g3") && sml(G(3), G(7)) === "mørkere");

    paastand("KSCN 0,1 M traekkes til glas 8", traek("flaske_scn", "glas8"));
    adv(3);
    traek("ag", "glas8"); adv(1.5); f.klik("ag"); adv(3);
    paastand("glas 8: hvidt bundfald, forundersoegelsen er gjort", f.trinGjort("g8") && M.samlet(G(8).b).agscn > 5 && G(8).indgreb.ag === 2);

    paastand("draabeflasken traekkes til glas 4", traek("ag", "glas4"));
    adv(1.5);
    f.klik("ag"); adv(3);
    paastand("glas 4 har to draaber og er lysere", G(4).indgreb.ag === 2 && sml(G(4), G(7)) === "lysere" && f.trinGjort("g4"));

    paastand("glas 5 baeres over i vandbadet", traek("glas5", { x: S.BAD.vandbad.cx, y: S.BAD.vandbad.y - 20 }));
    adv(12);
    paastand("glas 5 er varmt og lysere", G(5).sted === "vandbad" && G(5).b.sol.T > 70 && sml(G(5), G(7)) === "lysere" && f.trinGjort("g5"), komma(G(5).b.sol.T, 0) + " °C");
    paastand("glas 6 baeres over i isbadet", traek("glas6", { x: S.BAD.isbad.cx, y: S.BAD.isbad.y - 20 }));
    adv(12);
    paastand("glas 6 er koldt og moerkere", G(6).sted === "isbad" && G(6).b.sol.T < 3 && sml(G(6), G(7)) === "mørkere" && f.trinGjort("g6"), komma(G(6).b.sol.T, 1) + " °C");

    paastand("termometeret traekkes til glas 5", traek("termometer", "glas5"));
    adv(6);
    paastand("glas 5 maales til omkring 80 °C", G(5).maaltT !== null && G(5).maaltT > 74, G(5).maaltT);
    traek("termometer", "glas6"); adv(6);
    traek("termometer", "glas7"); adv(6);
    paastand("glas 6 og 7 er maalt, trinnet er gjort", G(6).maaltT !== null && G(6).maaltT <= 4 && Math.abs(G(7).maaltT - 20) <= 1 && f.trinGjort("temp"), G(6).maaltT + " og " + G(7).maaltT);
    paastand("glas 7 er stadig uroert", f.uroert(G(7)));
    adv(8);
    paastand("boblen viser glas 7", f.bobleBeholder === G(7));
    paastand("boblen: glas 2 har Fe2+ og ingen Fe3+", G(2).mikro.antal("fe2") >= 5 && G(2).mikro.antal("fe") + G(2).mikro.antal("fescn") === 0, G(2).mikro.antal("fe2") + " Fe2+");
    paastand("boblen: glas 4 har AgSCN og intet FeSCN2+", G(4).mikro.antal("agscn") >= 3 && G(4).mikro.antal("fescn") === 0, G(4).mikro.antal("agscn"));
    paastand("boblen: glas 1 har flere Fe3+ end glas 7", G(1).mikro.antal("fe") > G(7).mikro.antal("fe") + 5, G(1).mikro.antal("fe") + " mod " + G(7).mikro.antal("fe"));

    overskrift("4. Billedet af glas 1 til 7");
    paastand("tegneserie og quiz er laast", d.getElementById("serieknap").hidden && NK.quiz.tilstand === "laast");
    paastand("det hvide kort aabner billedet", f.klik("kort") === true && f.visning === "foto");
    var data = f.fotoData();
    paastand("glas 7 er reference, glas 1 til 6 kan vurderes", data.glas[6].ref && data.glas.slice(0, 6).every(function (g) { return g.kanVurderes; }));
    paastand("udstyret kan ikke bruges, mens billedet er aabent", f.klik("kolbe1") === false && !f.handling);
    paastand("knappen under glas 3 rammes paa billedet", S.fotoHvad({ x: S.fotoX(2), y: S.fotoPille(2).y + 10 }) === "vurder3");
    [1, 2, 3, 4, 5, 6].forEach(function (k) { f.vurderFoto(k); });
    [2, 4, 5].forEach(function (k) { f.vurderFoto(k); });
    paastand("svarene skifter i raekkefoelge", G(1).vurdering.svar === "mørkere" && G(2).vurdering.svar === "lysere" && G(6).vurdering.svar === "mørkere");
    paastand("billedet er ikke taget, mens det er aabent", !f.gjort.billede);
    paastand("billedet lukkes med krydset", f.klik("visLuk") === true && !f.visning);
    paastand("billedet er taget uden fejl, og quizzen er laast op", f.gjort.billede && f.resultat.forkerte.length === 0 && NK.quiz.tilstand !== "laast", f.resultat ? f.resultat.forkerte.join(",") : "");
    t = vent(function () { return scene() === "ros"; }, 5);
    paastand("laereren roser", scene() === "ros", t + " s");
    /* Eleven toemmer selv glassene i dunken */
    for (i = 1; i <= 8; i++) { traek("glas" + i, "dunk"); adv(3.6); }
    traek("baegerA", "dunk");
    adv(6);
    paastand("del 1 er slut, og alt er toemt", f.gjort.affald && [1, 2, 3, 4, 5, 6, 7, 8].every(function (k) { return V(G(k)) < 0.01 && M.fastIalt(G(k).b) === 0 && G(k).sted === "stativ"; }) && V(f.g.baegerA) < 0.01 && !f.handling && f.aktueltTrin() === null);
    paastand("tegneserien er stadig laast, fordi del 2 mangler", d.getElementById("serieknap").hidden);
    paastand("panelet siger, hvilken del der mangler",
        d.getElementById("serie-tekst").textContent === "Del 1 er gjort. Del 2 mangler.",
        d.getElementById("serie-tekst").textContent);

    overskrift("5. Del 2: fortynding");
    d.getElementById("station2").click();
    paastand("knappen skifter til del 2", f.station === 2 && f.valgt === "baeger1" && d.getElementById("station2").classList.contains("aktiv"));
    paastand("frugtfarve i baegerglas 1", traek("flaske_farve", "baeger1"));
    adv(3.5);
    paastand("frugtfarve i baegerglas 2", traek("flaske_farve", "baeger2"));
    adv(3.5);
    paastand("begge glas i par 1 har 20 mL frugtfarve", Math.abs(V(f.g.baeger1) - 20) < 0.1 && Math.abs(V(f.g.baeger2) - 20) < 0.1 && f.trinGjort("farve"));
    paastand("kolben traekkes til baegerglas 3", traek("kolbe2", "baeger3"));
    adv(3.5);
    paastand("kolben traekkes til baegerglas 4", traek("kolbe2", "baeger4"));
    adv(3.5);
    paastand("begge glas i par 2 har 20 mL ligevaegtsblanding", Math.abs(V(f.g.baeger3) - 20) < 0.1 && Math.abs(V(f.g.baeger4) - 20) < 0.1 && f.trinGjort("lv"));
    traek("vand", "baeger2"); adv(2.8);
    paastand("ét skud vand taeller allerede som fortyndet", Math.abs(V(f.g.baeger2) - 30) < 0.1 && f.fortyndetIPar(f.parListe()[0]) === 1, komma(V(f.g.baeger2)));
    f.klik("vand"); adv(2.8);
    paastand("baegerglas 2 er fortyndet til 40 mL", Math.abs(V(f.g.baeger2) - 40) < 0.1, komma(V(f.g.baeger2)));
    paastand("trinnet er ikke gjort, foer begge par er fortyndet", !f.trinGjort("vand"));
    traek("vand", "baeger4"); adv(2.8);
    for (i = 0; i < 3; i++) { f.klik("vand"); adv(2.8); }
    paastand("mere end dobbelt volumen taeller ogsaa, og trinnet er gjort",
        Math.abs(V(f.g.baeger4) - 60) < 0.1 && f.trinGjort("vand"), komma(V(f.g.baeger4)));
    paastand("papiret aabner visningen ovenfra", f.klik("papir") === true && f.visning === "ovenfra");
    var od = f.ovenfraData();
    paastand("visningen har fire glas i to par", od.glas.length === 4 && od.par.length === 2);
    paastand("parrene kendes paa indholdet", od.par[0].titel === "Frugtfarve" && od.par[1].titel === "Ligevægtsblanding");
    paastand("kun de fortyndede glas kan vurderes",
        !od.glas[0].kanVurderes && od.glas[1].kanVurderes && !od.glas[2].kanVurderes && od.glas[3].kanVurderes);
    f.vurderOvenfra(1);
    paastand("frugtfarven ser ens ud ovenfra", f.del2.vurdering.farve.faktisk === "som det andet glas" && f.del2.vurdering.farve.svar === "som det andet glas");
    f.lukVisning();
    paastand("visningen beder om, at begge par noteres", !f.gjort.sml && f.trinGjort("sml") === false);
    f.klik("papir");
    f.vurderOvenfra(3); f.vurderOvenfra(3);
    paastand("ligevaegtsblandingen er lysere ovenfra", f.del2.vurdering.lv.faktisk === "lysere" && f.del2.vurdering.lv.svar === "lysere");
    f.klik("visLuk");
    paastand("del 2 er faerdig, og tegneserien er laast op", f.gjort.sml && f.aktueltTrin() === null && !d.getElementById("serieknap").hidden);
    NK.aabnSerie();
    var ruder = d.querySelectorAll("#serie-ruder .rude");
    var serieTekst = d.getElementById("serie-ruder").textContent;
    paastand("tegneserien har mindst ti ruder", ruder.length >= 10, ruder.length);
    paastand("tegneserien fortaeller om glassene og fortyndingen",
        serieTekst.indexOf("Glas 2 fik ascorbinsyre og blev lysere") >= 0 && serieTekst.indexOf("Forundersøgelsen i glas 8") >= 0 &&
        serieTekst.indexOf("De fire glas ovenfra: frugtfarven var som det andet glas, og ligevægtsblandingen var lysere") >= 0);
    var sidste = ruder[ruder.length - 1];
    var tabeller = sidste.querySelectorAll("table.resultater");
    paastand("sidste rude har resultatskemaerne for begge dele", tabeller.length === 2 && tabeller[0].querySelectorAll("tr").length === 8 && tabeller[1].querySelectorAll("tr").length === 3);
    var rk = tabeller.length ? tabeller[0].querySelectorAll("tr") : [];
    paastand("skemaet for del 2 viser volumen", tabeller.length === 2 && tabeller[1].querySelectorAll("tr")[1].textContent.indexOf("20 mL ⟶ 40 mL") >= 0,
        tabeller.length === 2 ? tabeller[1].querySelectorAll("tr")[1].textContent : "");
    paastand("skemaet: glas 2 lysere og ⟵, glas 5 vandbad med temperatur, glas 7 reference",
        rk.length === 8 && rk[2].textContent.indexOf("lysere") >= 0 && rk[2].textContent.indexOf("⟵") >= 0 &&
        rk[5].textContent.indexOf("vandbad") >= 0 && rk[5].textContent.indexOf("°C") > 0 && rk[7].textContent.indexOf("reference") >= 0,
        rk.length ? rk[5].textContent : "");
    d.getElementById("serie-luk").click();

    overskrift("6. Uheld og bemaerkninger");
    frisk();
    paastand("kolben traekkes over affaldsdunken", traek("kolbe1", "dunk"));
    adv(3.2);
    t = vent(function () { return scene() === "kolbeDunk"; }, 3);
    paastand("stamoploesningen ryger i affaldet, og laereren kommer", f.haendt.kolbeDunk && scene() === "kolbeDunk" && f.laererOptaget(), t + " s");
    vent(function () { return !f.laererOptaget(); }, 20);
    paastand("laereren har fyldt kolben igen", !f.g.kolbe1.tom && traek("kolbe1", "baegerA"));
    adv(4);
    ["glas1", "glas2", "glas7"].forEach(function (n) { traek("baegerA", n); adv(3.4); });
    sek = musRyst(G(2), 160, 9, 3);
    paastand("meget voldsom rystning spilder glas 2", !!f.pyt && V(G(2)) < 0.01 && f.haendt.spild_glas2, komma(sek, 1) + " s");
    adv(0.8);
    paastand("laereren kommer og toerrer op", scene() === "spild" && f.laererOptaget());
    vent(function () { return !f.laererOptaget(); }, 15);
    paastand("pytten er vaek", !f.pyt);
    paastand("glas 7 faar Fe(NO3)3", traek("pulver_fe", "glas7"));
    adv(4);
    t = vent(function () { return scene() === "glas7"; }, 6);
    paastand("laereren siger, at glas 7 skulle vaere uroert", f.haendt.glas7 && scene() === "glas7", t + " s");
    vent(function () { return !scene(); }, 25);
    traek("pulver_fe", "glas1"); adv(4);
    traek("pulver_vitc", "glas1"); adv(4);
    t = vent(function () { return scene() === "blandet"; }, 6);
    paastand("to slags indgreb i glas 1 faar laereren til at sige det", f.haendt.blandet1 && scene() === "blandet", t + " s");
    vent(function () { return !scene(); }, 25);
    paastand("vandbadet kan tages og saettes tilbage", traek("vandbad", { x: 700, y: 300 }) && (adv(1), Math.abs(f.badOff.vandbad.x) < 0.5 && Math.abs(f.badOff.vandbad.y) < 0.5));

    d.getElementById("station2").click();
    traek("flaske_farve", "baeger1"); adv(3.5);
    traek("vand", "baeger1"); adv(2.8);
    for (i = 0; i < 8 && !f.pyt; i++) { f.klik("vand"); adv(2.8); }
    paastand("for meget vand faar baegerglasset til at loebe over", f.haendt.overloeb_baeger1 && V(f.g.baeger1) <= 100.01, komma(V(f.g.baeger1)) + " mL");
    vent(function () { return !f.laererOptaget(); }, 15);
    traek("baeger1", "dunk"); adv(4);
    traek("flaske_farve", "baeger1"); adv(3.5);
    paastand("stamoploesning haeldes i frugtfarven", traek("kolbe2", "baeger1"));
    adv(3.5);
    t = vent(function () { return scene() === "kunst"; }, 6);
    paastand("laereren siger, at det ikke er et forsoeg", f.haendt.kunst && scene() === "kunst", t + " s");
    vent(function () { return !scene(); }, 25);
    var serie2 = d.createElement("div");
    NK.Tegneserie.byg(f, serie2);
    paastand("tegneserien faar ruder for uheldene", serie2.textContent.indexOf("rystet så voldsomt") > 0 && serie2.textContent.indexOf("løb over") > 0 && serie2.textContent.indexOf("affaldsdunken") > 0);

    overskrift("7. Kaffen");
    frisk();
    /* Kaffen er faelles og ikke den samme to gange; her vaelges posten */
    NK.Kemichael.kaffeTvang("kold");
    paastand("laereren henter kaffen", f.klik("kaffekop") === true && scene() === "kaffe");
    vent(function () { return !f.laererOptaget(); }, 20);
    paastand("koppen er vaek, og laereren er gaaet", f.g.kaffekop.skjult && !f.laererOptaget());
    NK.Kemichael.kaffeTvang(null);

    overskrift("8. Quizzens spoergsmaal");
    paastand("quizzen har 10 spoergsmaal", NK.QUIZ.length === 10);
    NK.QUIZ.forEach(function (sp, k) {
        var unikke = sp.valg.filter(function (v, j) { return sp.valg.indexOf(v) === j; }).length === 4;
        var blandOk = true;
        for (i = 0; i < 100; i++) {
            var bl = NK.quiz.bland(sp);
            if (bl.valg[bl.rigtig] !== sp.valg[sp.rigtig]) blandOk = false;
        }
        paastand("spoergsmaal " + (k + 1) + ": fire forskellige svar, blandingen holder styr paa det rigtige", sp.valg.length === 4 && unikke && !!sp.forklaring && blandOk);
    });

    overskrift("9. Sprog og notation");
    var tekster = [d.body.textContent, serieTekst, serie2.textContent];
    NK.QUIZ.forEach(function (sp) { tekster.push(sp.sp, sp.forklaring, sp.valg.join(" ")); });
    NK.TRIN[1].concat(NK.TRIN[2]).forEach(function (tr) { tekster.push(tr.tekst, tr.hint); });
    Object.keys(NK.Mikro.ETIKET).forEach(function (k) { tekster.push(NK.Mikro.ETIKET[k]); });
    [1, 2].forEach(function (st) { S.ETIKETTER[st].forEach(function (e) { tekster.push(e.t); }); });
    var alt = tekster.join(" ");
    paastand("ingen tankestreger", !/[—–]/.test(alt));
    paastand("ingen ladning skrevet som 1+ eller 1−", !/[¹][⁺⁻]|[A-Za-z)\]₀-₉]1[+−-]/.test(alt));

    frisk();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
