<!DOCTYPE html>
<html lang="da">
<head><meta charset="UTF-8"><title>Skud</title>
<style>html,body{margin:0;background:#14141a}iframe{border:0;width:1900px;height:1020px}</style>
</head>
<body>
<iframe id="ramme" src="index.html"></iframe>
<script>
window.addEventListener("load", function () { setTimeout(koer, 1500); });
function koer() {
    var w = document.getElementById("ramme").contentWindow, NK = w.NK, f = NK.forsoeg, S = NK.Scene;
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    if (NK.intro) NK.intro.luk();
    function adv(s) { for (var k = 0; k < Math.round(s * 60); k++) f.opdater(1 / 60); }
    function midt(r) { return { x: r.x + r.b / 2, y: r.y + r.h / 2 }; }
    function punkt(navn) {
        var gg = f.g[navn];
        if (gg.erGlas) return { x: gg.p.x, y: gg.p.y + 80 };
        return midt(S.rekt(gg.sprite, gg.p, gg.anker, 0));
    }
    var mt = 0;
    function traek(navn, maal) {
        var a = punkt(navn), b = typeof maal === "string" ? punkt(maal) : maal;
        f.ned(a);
        if (!f.holdt) return false;
        for (var s = 1; s <= 40; s++) { mt += 40; f.flyt({ x: a.x + (b.x - a.x) * s / 40, y: a.y + (b.y - a.y) * s / 40 }, mt); f.opdater(1 / 60); }
        f.op();
        return true;
    }
    var m = new URLSearchParams(location.search).get("m") || "fe";
    if (m === "glas") { traek("kolbe1", "baegerA"); adv(4); traek("baegerA", "glas1"); adv(4); f.klik("glas1"); adv(3); }
    else { f.klik("pulver_" + m); adv(3); }
    if (NK.opdaterPanel) NK.opdaterPanel();
    document.title = "klar";
}
</script>
</body></html>
