<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 900" width="140" height="900">
<!-- Lyssoejle til Kemi-Jeopardy. Forsiden har lyse felter mellem sorte bjaelker,
     og en smal side vender ind mod braettet. Hoejre soejle er den samme, spejlet i CSS. -->
<defs>
  <linearGradient id="forside" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7f9ff"/>
    <stop offset="0.5" stop-color="#d3dcff"/>
    <stop offset="1" stop-color="#a9b9f4"/>
  </linearGradient>
  <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9aabf0"/>
    <stop offset="1" stop-color="#4e62b8"/>
  </linearGradient>
  <linearGradient id="yderside" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a4a94"/>
    <stop offset="1" stop-color="#7f93e0"/>
  </linearGradient>
  <filter id="gloed" x="-30%" y="-10%" width="160%" height="120%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
</defs>
<rect x="34" y="0" width="80" height="900" fill="#9fb4ff" opacity="0.35" filter="url(#gloed)"/>
