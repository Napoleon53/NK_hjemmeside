<svg xmlns="http://www.w3.org/2000/svg" width="60" height="200" viewBox="0 0 60 200">
  <!-- Reagensglas. Indholdet (vaeske, fast stof, bobler) tegnes af
       animationen BAG denne fil, saa glasset ligger ovenpaa.
       Inderside: x 12-48 fra y 14, bunden er en halvcirkel med midte i
       (30, 170) og radius 18, saa den inderste bund er y 188.
       Mundingen, hvor ballonen sidder, er y 3-11 og x 8-52. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.2"/>
      <stop offset="0.18" stop-color="#cfe6f7" stop-opacity="0.04"/>
      <stop offset="0.8" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <path d="M11 11 L11 170 A19 19 0 0 0 49 170 L49 11 Z" fill="url(#glas)"/>

  <!-- Vaeggen -->
  <path d="M11 10 L11 170 A19 19 0 0 0 49 170 L49 10"
        fill="none" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Kraven ved mundingen -->
  <rect x="8" y="3" width="44" height="8" rx="3.5" fill="#d6eaf8" fill-opacity="0.12" stroke="#d6eaf8" stroke-opacity="0.9" stroke-width="1.8"/>

  <!-- Genskin -->
  <rect x="40" y="22" width="4" height="140" rx="2" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="15" y="22" width="2" height="140" rx="1" fill="#ffffff" fill-opacity="0.09"/>
  <path d="M40 172 A12 12 0 0 1 33 182" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round"/>
</svg>
