<svg xmlns="http://www.w3.org/2000/svg" width="60" height="230" viewBox="0 0 60 230">
  <!-- Reagensglas med prop. Indholdet (bromvand og carbonhydrid) tegnes af
       animationen BAG denne fil, saa glasset ligger ovenpaa.
       Inderside: x 12-48. Den runde bund har midte i (30, 200) og radius 18,
       saa bunden er ved y 218. Vaesken kan staa fra y 40 (under proppen). -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfe6f7" stop-opacity="0.2"/>
      <stop offset="0.2" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="0.8" stop-color="#cfe6f7" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#cfe6f7" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="prop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a6f45"/>
      <stop offset="0.45" stop-color="#c9996a"/>
      <stop offset="1" stop-color="#8a6240"/>
    </linearGradient>
  </defs>

  <path d="M11 22 L11 200 A19 19 0 0 0 49 200 L49 22 Z" fill="url(#glas)"/>

  <!-- Vaeg og bund -->
  <path d="M7 20 Q11 21 11 26 L11 200 A19 19 0 0 0 49 200 L49 26 Q49 21 53 20"
        fill="none" stroke="#d6eaf8" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Genskin -->
  <rect x="40" y="44" width="3.5" height="140" rx="1.7" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="15" y="44" width="2" height="140" rx="1" fill="#ffffff" fill-opacity="0.09"/>

  <!-- Proppen -->
  <path d="M9 4 Q9 2 11 2 L49 2 Q51 2 51 4 L47.5 36 Q47.3 38 45.5 38 L14.5 38 Q12.7 38 12.5 36 Z" fill="url(#prop)" stroke="#6d4c2f" stroke-width="1.2"/>
  <path d="M13 10 L47 10 M14 19 L46 19" stroke="#6d4c2f" stroke-opacity="0.35" stroke-width="1"/>
</svg>
