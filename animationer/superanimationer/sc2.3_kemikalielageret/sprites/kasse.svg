  <polygon points="160,34 170,14 112,20 104,34" fill="#bf9056" stroke="#8a5f31" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="10" y="34" width="150" height="92" rx="2" fill="#b8864f" stroke="#8a5f31" stroke-width="1.6"/>
  <rect x="10" y="34" width="150" height="7" fill="#000000" fill-opacity="0.12"/>
