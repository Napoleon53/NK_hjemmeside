<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sb6.1 Kₛ og pKₛ</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at tallene følger bogens tabel i afsnit B6.3
   (Kₛ og pKₛ, inddelingen og regneeksemplet med ethansyre), at luppen
   viser modellens antal, at de ukendte syrer peger på den rigtige flaske,
   at alle tre faner kan gennemføres, at de typiske fejl får den rigtige
   forklaring og koster stjernen, at intet løses uden Indsend svar, at
   teksterne er korte og uden tankestreger og ASCII-dansk, at intet bevæger
   sig, før eleven gør noget, og at kortet aldrig er højere end pladsen
   over tavlen fra 1100 × 620 til 1600 × 950. Kræver en lokal server med
   mappen animationer/ som rod (siden henter ../faelles/). Testen gemmer
   elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + String(note).replace(/</g, "&lt;") + ")" : ""), "fejl"); }
}
function samlet(navn, liste) { paastand(navn, liste.length === 0, liste.slice(0, 4).join(" | ")); }
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sb6.1-skala", "nk-sb6.1-regn", "nk-sb6.1-ukendt"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|gaar|staa|staar|paa|foerst|hoejre|oeverst|loest|proev\w*|spoerg\w*|faa|saa|naar|vaelg\w*|groen\w*|roed\w*|blaa|traek\w*|baade|laengere|oploesning|maal|maalt|saenk\w*|haev\w*|taeller|naevner|braek\w*|broek\w*)\b/i;
var gemt = {};
var ramme = document.getElementById("ramme");
var trin = 0;

ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 900); }
});

function vent(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function koer() {
    var W = ramme.contentWindow;
    koerTest(W).catch(function (e) {
        fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl");
    }).then(function () {
        try {
            NOEGLER.forEach(function (n) {
                if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
            });
        } catch (e) { /* ingen hukommelse */ }
        vis();
        window.faerdig = true;
    });
}

async function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, S = D.SYRER;
    var k1 = NK.sims["fane-k"], r2 = NK.sims["fane-r"], u3 = NK.sims["fane-u"];
    var tekster = [];

    function el(id) { return d.getElementById(id); }
    /* Kortet viser teksten som HTML (<sub>, haarde mellemrum); testen
       sammenligner med samme tekst laget paa samme maade */
    function tx(t) { var e = d.createElement("div"); e.innerHTML = D.sub(NK.html(t)); return e.textContent; }
    function ie(t) { return "Ikke endnu " + tx(t); }
    function besked(sim) { var b = el(sim.navn + "-besked"); return b.hidden ? "" : b.textContent; }
    function bliv(sim) { var b = el(sim.navn + "-ind").querySelector(".sk-bund.bliv .st-tekst"); return b ? b.textContent : ""; }
    function husk(hvad, t) { if (t) tekster.push({ hvad: hvad, t: String(t) }); }
    function tid(sim, sek) { for (var t = 0; t < sek; t += 1 / 60) sim.opdater(1 / 60); }
    function naer(a, b, tol) { return Math.abs(a - b) <= tol; }
    function lav(id) { return D.u(id); }

    /* ================================================================= */
    overskrift("1. Modellen: tallene er bogens (afsnit B6.3)");
    var afvig = [];
    D.TABEL.forEach(function (id) {
        var p = -Math.log(S[id].ks) / Math.LN10;
        if (!naer(p, S[id].pks, 0.02)) afvig.push(id + " " + p.toFixed(3) + " mod " + S[id].pks);
    });
    samlet("tabellens Kₛ og pKₛ passer for alle elleve syrer (pKₛ = −log Kₛ)", afvig);
    var zoner = { hcl: 0, hno3: 0, h3po4: 1, hf: 1, hcooh: 1, maelk: 1, ascorbin: 2, eddike: 2, kulsyre: 2, nh4: 2, hco3: 3 };
    var forkertZone = [];
    Object.keys(zoner).forEach(function (id) { if (D.zone(S[id].pks) !== zoner[id]) forkertZone.push(id); });
    samlet("styrken er bogens: stærk under 0, middelstærk 0 til 4, svag 4 til 10, meget svag over 10", forkertZone);
    function iLup(id) { return Math.round(100 * D.andel(S[id].ks, D.LUP_C)); }
    paastand("luppen ved 0,10 M: ethansyre 1, methansyre 4, phosphorsyre 23, saltsyre 100, ammonium 0 af 100",
        iLup("eddike") === 1 && iLup("hcooh") === 4 && iLup("h3po4") === 23 && iLup("hcl") === 100 && iLup("nh4") === 0,
        [iLup("eddike"), iLup("hcooh"), iLup("h3po4"), iLup("hcl"), iLup("nh4")].join(", "));
    var bog = D.kaede({ c: 0.100, ph: 2.88 });
    paastand("bogens eksempel: ethansyre 0,100 M med pH 2,88 giver [H₃O⁺] = 1,32 · 10⁻³ M, [S] = 0,0987 M, Kₛ = 1,77 · 10⁻⁵ M og pKₛ = 4,75",
        D.potensU(bog.h) === "1,32 · 10⁻³" && D.decimal(bog.s) === "0,0987" && D.potensU(bog.k) === "1,77 · 10⁻⁵" && D.tal2(bog.pks) === "4,75",
        JSON.stringify(bog));
    paastand("bogens omdannelsesgrad i eksemplet er 1,3 %", D.tal1(bog.alfa) === "1,3", bog.alfa);
    var ukendtFejl = [];
    D.UKENDTE.forEach(function (u) {
        var r = D.kaede(u);
        var t = D.HYLDE.slice().sort(function (a, b) { return Math.abs(S[a].pks - r.pks) - Math.abs(S[b].pks - r.pks); });
        if (t[0] !== u.rigtig) ukendtFejl.push(u.id + ": " + t[0]);
        else if (Math.abs(S[t[1]].pks - r.pks) - Math.abs(S[t[0]].pks - r.pks) < 0.08) ukendtFejl.push(u.id + " for tæt på " + t[1]);
        if (Math.abs(r.pks - S[u.rigtig].pks) > 0.02) ukendtFejl.push(u.id + " pKₛ " + r.pks);
    });
    samlet("de tre ukendte flasker giver en pKₛ, der ligger tydeligt tættest på den rigtige flaske", ukendtFejl);
    paastand("flaske A: 4,17 · 10⁻³ M, 0,0958 M, 1,82 · 10⁻⁴ M, pKₛ 3,74 og α = 4,2 %", (function () {
        var r = D.kaede(D.UKENDTE[0]);
        return D.potensU(r.h) === "4,17 · 10⁻³" && D.decimal(r.s) === "0,0958" && D.potensU(r.k) === "1,82 · 10⁻⁴" && D.tal2(r.pks) === "3,74" && D.tal1(r.alfa) === "4,2";
    }()));
    paastand("flaske C: [S] er lig med cₛ med tre betydende cifre", D.kaede(D.UKENDTE[2]).s === 0.1);
    var tolk = [["4,17·10^-3", 4.17e-3], ["4,17e-3", 4.17e-3], ["0,00417", 0.00417], ["−3,74", -3.74], ["4,17 * 10⁻³", 4.17e-3]];
    var tolkFejl = tolk.filter(function (x) { return !naer(D.tolk(x[0]), x[1], 1e-12); }).map(function (x) { return x[0]; });
    samlet("elevens tal læses med komma, potens og minus", tolkFejl);
    paastand("tal foran og eksponent i to felter: 4,17 og −3", naer(D.tolkPotens("4,17", "−3"), 4.17e-3, 1e-12) && naer(D.tolkPotens("0,00417", ""), 0.00417, 1e-12));
    var budFejl = [];
    D.TABEL.forEach(function (id) {
        var s = S[id], set = {};
        set[s.base] = 1;
        s.fejl.forEach(function (f) {
            if (set[f[0]]) budFejl.push(id + " " + f[0]);
            set[f[0]] = 1;
            if (!D.FEJLTEKST[f[1]]) budFejl.push(id + " " + f[1]);
        });
    });
    samlet("de forkerte bud i fane 2 er forskellige fra basen og har hver sin forklaring", budFejl);

    /* ================================================================= */
    overskrift("2. Fane 1: Syreskalaen");
    NK.visFane("fane-k");
    k1.forfra();
    await vent(50);
    paastand("luppen er skjult, til flasken rører skalaen", !k1.lupVist);
    paastand("Indsend svar kan ikke sendes, før flasken står på skalaen", !k1.kanSendes());
    k1.indsendKlik();
    paastand("et tryk på Indsend svar uden flaske bedømmer intet", !k1.groen && !k1.fejl);
    var flaskeFejl = [];
    D.SKALA.forEach(function (f, j) {
        var s = S[f.id];
        husk("kort " + f.id, D.skalaTekst(f.id));
        D.skalaHint(f.id).forEach(function (h) { husk("hint " + f.id, h); });
        husk("rigtig " + f.id, f.forkl);
        if (Math.abs(s.pks) > 1.5) {
            k1.saetP(Math.round(-s.pks * 10) / 10);
            k1.indsendKlik();
            var b = besked(k1);
            husk("fejl fortegn " + f.id, b);
            if (!/(lille|stor) Ks giver/.test(b)) flaskeFejl.push(f.id + " fortegn: " + b);
        }
        k1.saetP(Math.round((s.pks + 0.8) * 10) / 10);
        if (k1.groen) flaskeFejl.push(f.id + " løst uden Indsend");
        k1.indsendKlik();
        var b2 = besked(k1);
        husk("fejl højre " + f.id, b2);
        if (!/mod venstre/.test(b2)) flaskeFejl.push(f.id + " højre: " + b2);
        k1.saetP(Math.round((s.pks - 0.8) * 10) / 10);
        k1.indsendKlik();
        if (!/mod højre/.test(besked(k1))) flaskeFejl.push(f.id + " venstre: " + besked(k1));
        k1.saetP(Math.round((s.pks + 0.2) * 10) / 10);
        if (k1.groen) flaskeFejl.push(f.id + " løst uden Indsend");
        k1.indsendKlik();
        if (!k1.groen) flaskeFejl.push(f.id + " ikke løst ved +0,2");
        if (!k1.lupVist) flaskeFejl.push(f.id + " luppen ikke vist");
        if (k1.lup.antal().delte !== iLup(f.id)) flaskeFejl.push(f.id + " luppen viser " + k1.lup.antal().delte);
        if (bliv(k1).indexOf(tx(f.forkl).slice(0, 20)) < 0) flaskeFejl.push(f.id + " forklaring");
        k1.videreKlik();
    });
    samlet("hver flaske: fortegnsfejlen og en flaske for langt til højre og til venstre får hver sin forklaring, ±0,2 er rigtigt, og luppen viser modellens antal", flaskeFejl);
    paastand("efter fem flasker kommer spørgsmålet om faktoren 10", k1.erSpm() && k1.placeret.length === 5);
    var q = D.SKALA_SPM;
    husk("kort faktor", q.tekst); q.hint.forEach(function (h) { husk("hint faktor", h); }); husk("rigtig faktor", q.forkl);
    q.svar.forEach(function (sv) { husk("svar", sv); });
    Object.keys(q.fejl).forEach(function (k) { husk("fejl faktor", q.fejl[k]); });
    k1.svarValg(0);
    paastand("et svar på kortet vælger kun", !k1.groen);
    k1.indsendKlik();
    paastand("1 gang giver forklaringen om forskellige pKₛ", besked(k1) === ie(q.fejl[0]), besked(k1));
    k1.svarValg(1); k1.indsendKlik();
    paastand("10 gange er rigtigt, og fanen er gennemført uden stjerne (der var fejl)", !!k1.groen && k1.status.loest && !k1.status.stjerne);
    paastand("slutkortets knap går videre til fane 2", /Regn på syren/.test(k1.groen.knap));
    k1.forfra();
    D.SKALA.forEach(function () { k1.saetP(S[k1.id].pks); k1.indsendKlik(); k1.videreKlik(); });
    k1.svarValg(1); k1.indsendKlik();
    paastand("uden fejl giver fanen en stjerne", k1.status.stjerne);

    /* ================================================================= */
    overskrift("3. Fane 2: Regn på syren");
    NK.visFane("fane-r");
    r2.forfra();
    paastand("den første syre er ethansyre (bogens eksempel), fra Kₛ til pKₛ", r2.id === "eddike" && r2.retning === "pks");
    var regnFejl = [], set = {}, staerk = false, retninger = {};
    function loesRegn(medFejl) {
        var s = r2.syre, id = r2.id;
        set[id] = true;
        retninger[r2.retning] = true;
        /* Trin 1 */
        var rigtig = r2.bud.map(function (b) { return b[1]; }).indexOf(null);
        husk("kort base " + id, D.REGN.base.tekst(s));
        D.REGN.base.hint(s).forEach(function (h) { husk("hint base", h); });
        husk("rigtig base", D.REGN.base.forkl(s));
        r2.bud.forEach(function (b) { husk("svar", D.u(b[0])); });
        if (medFejl) {
            r2.bud.forEach(function (b, j) {
                if (!b[1]) return;
                r2.svarValg(j);
                if (r2.groen) regnFejl.push(id + " trin 1 løst ved valg");
                r2.indsendKlik();
                var t = D.FEJLTEKST[b[1]](b[0]);
                husk("fejl base", t);
                if (besked(r2) !== ie(t)) regnFejl.push(id + " " + b[1] + ": " + besked(r2));
            });
        }
        r2.svarValg(rigtig); r2.indsendKlik();
        if (!r2.groen || !r2.basenVist) regnFejl.push(id + " trin 1");
        r2.videreKlik();
        /* Trin 2 */
        husk("kort ks", D.REGN.ks.tekst(s));
        D.REGN.ks.hint(s).forEach(function (h) { husk("hint ks", h); });
        if (medFejl) {
            r2.indsendKlik();
            if (r2.groen) regnFejl.push(id + " tom brøk løst");
            r2.saetIPlads("base", 0); r2.saetIPlads("vand", 1); r2.saetIPlads("syre", 2);
            r2.indsendKlik();
            if (besked(r2) !== ie(D.REGN.ks.vand)) regnFejl.push(id + " vand: " + besked(r2));
            r2.saetIPlads("base", 1);
            r2.indsendKlik();
            if (besked(r2) !== ie(D.REGN.ks.begge)) regnFejl.push(id + " begge: " + besked(r2));
            r2.saetIPlads("syre", 0); r2.saetIPlads("ox", 1); r2.saetIPlads("base", 2);
            r2.indsendKlik();
            if (besked(r2) !== ie(D.REGN.ks.plads)) regnFejl.push(id + " plads: " + besked(r2));
        }
        r2.saetIPlads("base", 0); r2.saetIPlads("ox", 1); r2.saetIPlads("syre", 2);
        r2.indsendKlik();
        if (!r2.groen || !r2.ksVist) regnFejl.push(id + " trin 2");
        r2.videreKlik();
        /* Trin 3 */
        if (r2.del === "formel") {
            var fd = r2.retning === "pks" ? D.REGN.formelPks : D.REGN.formelKs;
            husk("kort formel", fd.tekst(s)); fd.svar.forEach(function (x) { husk("svar", x); });
            Object.keys(fd.fejl).forEach(function (k) { husk("fejl formel", fd.fejl[k]); }); fd.hint.forEach(function (h) { husk("hint formel", h); });
            r2.svarValg(1); r2.indsendKlik();
            if (besked(r2) !== ie(fd.fejl[1])) regnFejl.push(id + " formel: " + besked(r2));
            r2.svarValg(0); r2.indsendKlik();
            if (!r2.groen) regnFejl.push(id + " formel ikke løst");
            r2.videreKlik();
        }
        if (r2.del !== "tal" || !r2.formelVist) regnFejl.push(id + " tal-delen mangler");
        var td = r2.retning === "pks" ? D.REGN.tilPks : D.REGN.tilKs;
        husk("kort tal", td.tekst(s)); td.hint(s).forEach(function (h) { husk("hint tal", h); }); husk("rigtig tal", td.forkl(s));
        ["fortegn", "ln", "e", "eksponent", "tierpot", "afrund", "andet", "intet"].forEach(function (k) { if (td[k]) husk("fejl tal", td[k]); });
        if (r2.retning === "pks") {
            if (medFejl && Math.abs(s.pks) > 0.5) {
                r2.f1 = D.tal2(-s.pks); r2.indsendKlik();
                if (besked(r2) !== ie(td.fortegn)) regnFejl.push(id + " fortegn: " + besked(r2));
                r2.f1 = (Math.round(-Math.log(D.ksFraPks(s.pks)) * 100) / 100).toFixed(2).replace(".", ","); r2.indsendKlik();
                if (besked(r2) !== ie(td.ln)) regnFejl.push(id + " ln: " + besked(r2));
            }
            r2.f1 = D.tal2(s.pks); r2.indsendKlik();
        } else {
            var m = D.mantisse(D.ksFraPks(s.pks), 3);
            if (medFejl && Math.abs(s.pks) > 0.5) {
                var mf = D.mantisse(Math.pow(10, s.pks), 3);
                r2.f1 = mf.t; r2.f2 = String(mf.e); r2.indsendKlik();
                if (besked(r2) !== ie(td.fortegn)) regnFejl.push(id + " fortegn Kₛ: " + besked(r2));
                var me = D.mantisse(Math.exp(-s.pks), 3);
                r2.f1 = me.t; r2.f2 = String(me.e); r2.indsendKlik();
                if (besked(r2) !== ie(td.e)) regnFejl.push(id + " e: " + besked(r2));
                r2.f1 = m.t; r2.f2 = String(m.e + 1); r2.indsendKlik();
                if (besked(r2) !== ie(td.tierpot)) regnFejl.push(id + " tierpotens: " + besked(r2));
            }
            r2.f1 = m.t; r2.f2 = String(m.e).replace("-", "−"); r2.indsendKlik();
        }
        if (!r2.groen || !r2.tallet) regnFejl.push(id + " tallet ikke løst (" + r2.retning + ", " + besked(r2) + ")");
        r2.videreKlik();
        /* Trin 4 */
        var z = D.zone(s.pks), sd = D.REGN.styrke;
        husk("kort styrke", sd.tekst(s)); husk("rigtig styrke", sd.forkl(s)); husk("fejl styrke", sd.svagere(s)); husk("fejl styrke", sd.staerkere(s));
        if (medFejl) {
            var forkert = z === 0 ? 1 : z - 1;
            r2.svarValg(forkert); r2.indsendKlik();
            var forvent = forkert < z ? sd.svagere(s) : sd.staerkere(s);
            if (besked(r2) !== ie(forvent)) regnFejl.push(id + " styrke: " + besked(r2));
            r2.knap();
            if (!r2.skalaVis) regnFejl.push(id + " skalaen kom ikke med hintet");
        }
        r2.svarValg(z); r2.indsendKlik();
        if (!r2.groen || !r2.styrkeVist) regnFejl.push(id + " styrke ikke løst");
        if (z === 0) staerk = true;
        r2.videreKlik();
    }
    for (var n = 0; n < D.TABEL.length; n++) loesRegn(n < 4);
    samlet("alle elleve syrer kan regnes, og hver typisk fejl får sin forklaring (trin 1 til 4)", regnFejl);
    paastand("alle elleve syrer blev regnet, og begge retninger kom", Object.keys(set).length === 11 && retninger.pks && retninger.ks, Object.keys(set).length);
    paastand("en stærk syre var med, og alle står som regnet i panelet", staerk && D.TABEL.every(function (id) { return r2.regnet[id]; }));
    paastand("efter den sidste syre går knappen videre til fane 3", NK.el("fane-u").classList.contains("aktiv"));
    NK.visFane("fane-r");

    /* ================================================================= */
    overskrift("4. Fane 3: Den ukendte syre");
    NK.visFane("fane-u");
    u3.forfra();
    paastand("flaske A begynder med Mål pH, og displayet er tomt", u3.trin === "maal" && u3.visPh() === "– – –");
    paastand("hylden er skjult, til kortet spørger efter syren", (u3.tegn(), u3.hyldeKasser === null));
    u3.indsendKlik();
    tid(u3, 0.6);
