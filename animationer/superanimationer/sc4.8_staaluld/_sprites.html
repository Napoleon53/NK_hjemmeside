<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sc4.8 Afbrænding af ståluld</title>
<style>
    body { background: #1b1d24; color: #dde3ea; font-family: "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    h1 { font-size: 1rem; margin: 0 0 14px; color: #f2c53d; }
    .ark { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end; }
    figure { margin: 0; padding: 12px; background: #262833; border: 1px solid #3a3a47; border-radius: 8px; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    figure.kort img { background: #1d1f27; border-radius: 9px; }
    figcaption { font-size: 0.8rem; color: #a9b0ba; }
</style>
</head>
<body>
<!-- Udviklerværktøj: viser sprites alene, før de sættes i bevægelse. Indgår ikke i animationen. -->
<h1>sc4.8: sprites i dobbelt størrelse</h1>
<div class="ark">
    <figure><img src="sprites/batteri.svg" width="120"><figcaption>batteri.svg (ny)</figcaption></figure>
    <figure><img src="sprites/iltflaske.svg" width="160"><figcaption>iltflaske.svg (ny)</figcaption></figure>
    <figure><img src="sprites/stjernekaster.svg" width="80"><figcaption>stjernekaster.svg (ny)</figcaption></figure>
    <figure><img src="sprites/vaegt.svg" width="480"><figcaption>vaegt.svg (som sc4.11)</figcaption></figure>
    <figure><img src="sprites/lup.svg" width="140"><figcaption>lup.svg (som sc4.11)</figcaption></figure>
    <figure><img src="sprites/kateder.svg" width="600"><figcaption>kateder.svg (som sc4.11)</figcaption></figure>
</div>
<h1 style="margin-top:20px">Det gratis gæt</h1>
<div class="ark">
    <figure class="kort"><img src="sprites/gaet_lettere.svg" width="480"><figcaption>gaet_lettere.svg</figcaption></figure>
    <figure class="kort"><img src="sprites/gaet_samme.svg" width="480"><figcaption>gaet_samme.svg</figcaption></figure>
    <figure class="kort"><img src="sprites/gaet_tungere.svg" width="480"><figcaption>gaet_tungere.svg</figcaption></figure>
</div>
</body>
</html>
