<svg xmlns="http://www.w3.org/2000/svg" width="60" height="100" viewBox="0 0 60 100">
  <!-- 9 V-batteri, staaende med polerne opad.
       Polerne: minus (sekskant) om (20, 8), plus (rund) om (40, 8).
       Kontaktpunktet mellem dem er (30, 3). Bunden staar paa y 99.
       Animationen drejer spritet om midten (30, 50). -->
  <defs>
    <linearGradient id="krop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15171b"/>
      <stop offset="0.3" stop-color="#3a3f48"/>
      <stop offset="0.75" stop-color="#23262c"/>
      <stop offset="1" stop-color="#101114"/>
    </linearGradient>
    <linearGradient id="baand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8581a"/>
      <stop offset="0.3" stop-color="#f29a3c"/>
      <stop offset="0.75" stop-color="#d8772a"/>
      <stop offset="1" stop-color="#8d4912"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8791"/>
      <stop offset="0.35" stop-color="#eef1f4"/>
      <stop offset="0.7" stop-color="#b9c1ca"/>
      <stop offset="1" stop-color="#6c747e"/>
    </linearGradient>
  </defs>

  <!-- Kroppen -->
  <rect x="6" y="16" width="48" height="83" rx="5" fill="url(#krop)" stroke="#07080a" stroke-width="1"/>
  <rect x="6" y="16" width="48" height="26" rx="5" fill="url(#baand)"/>
  <rect x="6" y="36" width="48" height="6" fill="url(#baand)"/>
  <path d="M10 44 L50 44" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Taeksten -->
  <g font-family="Segoe UI, sans-serif" font-weight="800" text-anchor="middle">
    <text x="30" y="72" font-size="17" fill="#f3f4f6">9 V</text>
    <text x="30" y="33" font-size="9" fill="#2a1606">+ −</text>
  </g>

  <!-- Toppladen og polerne -->
  <rect x="7" y="12" width="46" height="6" rx="2" fill="url(#metal)" stroke="#5a616a" stroke-width="0.8"/>
  <polygon points="14,8 17,3 23,3 26,8 23,13 17,13" fill="url(#metal)" stroke="#4d545c" stroke-width="0.9"/>
  <polygon points="17.5,8 19,5.5 21,5.5 22.5,8 21,10.5 19,10.5" fill="#5d646d"/>
  <rect x="35" y="4" width="10" height="9" rx="1.5" fill="url(#metal)" stroke="#4d545c" stroke-width="0.9"/>
  <ellipse cx="40" cy="4.5" rx="5" ry="1.6" fill="#f1f4f7" stroke="#4d545c" stroke-width="0.7"/>
</svg>
