      <stop offset="0" stop-color="#d9e6f2" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#cfdceb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#b7c7d8" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Traaden og belaegningen -->
