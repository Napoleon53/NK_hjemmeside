<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 300 130">
  <!-- Kemichaels kateder set forfra. Bordpladens overflade, hvor koppen
       og rettebunken staar, er y 22. Pladens forkant er y 18-32 og
       forsiden y 32-130. Kemichael sidder bag pladen omkring x 80.
       Koppen tegnes af animationen, saa den kan klikkes paa. -->
  <defs>
    <linearGradient id="plade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a57"/>
      <stop offset="0.5" stop-color="#9c6f40"/>
      <stop offset="1" stop-color="#7a5430"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e4128"/>
      <stop offset="0.5" stop-color="#6f4d30"/>
      <stop offset="1" stop-color="#553a23"/>
    </linearGradient>
  </defs>
  <!-- Rettebunken: afleveringer i en stak, den oeverste lidt skaev -->
  <rect x="216" y="12" width="44" height="10" fill="#e9e6dc" stroke="#b9b4a6" stroke-width="0.8"/>
  <path d="M216 15 L260 15 M216 18 L260 18" stroke="#c9c4b6" stroke-width="0.7"/>
  <rect x="214" y="7" width="44" height="6" fill="#f6f4ee" stroke="#b9b4a6" stroke-width="0.8" transform="rotate(-4 236 10)"/>
  <path d="M222 9.5 L246 8" stroke="#c0392b" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Kuglepennen paa bunken -->
  <rect x="226" y="3" width="26" height="2.6" rx="1.3" fill="#2d62b3" transform="rotate(-10 239 4)"/>
  <!-- Bordpladen -->
  <rect x="0" y="18" width="300" height="14" rx="3" fill="url(#plade)"/>
  <rect x="0" y="18" width="300" height="2.5" rx="1.2" fill="#d2a877" opacity="0.8"/>
  <!-- Forsiden -->
  <rect x="6" y="32" width="288" height="98" fill="url(#front)"/>
  <rect x="6" y="32" width="288" height="4" fill="#000000" opacity="0.28"/>
  <!-- Paneler og skuffen -->
  <rect x="18" y="46" width="112" height="76" rx="3" fill="none" stroke="#3f2b19" stroke-width="1.6" opacity="0.8"/>
  <rect x="146" y="46" width="136" height="30" rx="3" fill="#6a4a2e" stroke="#3f2b19" stroke-width="1.6" opacity="0.95"/>
  <rect x="198" y="58" width="32" height="6" rx="3" fill="#c9b08a" stroke="#6d5534" stroke-width="0.8"/>
  <rect x="146" y="86" width="136" height="36" rx="3" fill="none" stroke="#3f2b19" stroke-width="1.6" opacity="0.8"/>
  <!-- Et gammelt klistermaerke paa skuffen -->
  <rect x="152" y="50" width="22" height="16" rx="1.5" fill="#f2d35c" transform="rotate(-6 163 58)"/>
  <path d="M156 55 L169 54 M156 59 L166 58.2" stroke="#9a7d1c" stroke-width="1" stroke-linecap="round" transform="rotate(-6 163 58)"/>
</svg>
