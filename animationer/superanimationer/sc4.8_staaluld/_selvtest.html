<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc4.8 Afbrænding af ståluld</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at molarmasserne passer, at klumpen ender på
   det, vægten skal vise, for alle klumper, at ilten gør det hurtigere,
   at formlerne, mellemregningens felter og tallene genkendes med de
   typiske fejl, at facit er pænt og kan skrives som svar, at det gratis
   gæt vises først og kun på måling 1, at begge faner kan gennemføres
   med musen og ved at skrive, at Kemichael kun introducerer gættet og
   ellers taler ved hint og svar, at sproget holder reglerne, og at
   layoutet holder fra 520 × 380 til 1500 × 900.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sc4.8-forsoeg", "nk-sc4.8-beregning", "nk-sc4.8-kemichael-ude", "nk-sc4.8-maalinger", "nk-kemichael"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Ord, der er skrevet uden æ, ø og å, og som derfor ikke må nå eleven */
var ASCII_ORD = /\b(foer|faerdig|naeste|Naeste|gaa|staa|paa|foerst|hoejre|proeve\w*|vaegt\w*|Vaegt\w*|laerer\w*|forsoeg\w*|maaling\w*|Maaling\w*|staaluld\w*|braend\w*|gaet)\b/;

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;

    function tik(sim, sek) { for (var k = 0; k < Math.round(sek * 60); k++) sim.opdater(1 / 60); }
    function enter(inp) { inp.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); }
    function mus(sim, type, x, y) {
        var r = sim.L.canvas.getBoundingClientRect();
        sim.L.canvas.dispatchEvent(new W.PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 1, button: 0, isPrimary: true }));
    }
    function klik(sim, x, y) { mus(sim, "pointerdown", x, y); mus(sim, "pointerup", x, y); }
    function traek(sim, x0, y0, x1, y1) {
        mus(sim, "pointerdown", x0, y0);
        for (var i = 1; i <= 8; i++) { mus(sim, "pointermove", x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8); tik(sim, 0.03); }
        mus(sim, "pointerup", x1, y1);
    }
    function felt(r, hvad, tekst) {
        var e = d.getElementById("forsoeg-" + hvad + r);
        e.value = tekst;
        enter(e);
    }
    function besked(sim) { return sim.beskedTekst(); }
    function komma(v) { return NK.tal2(v); }
    function synlig(e) { return !!e && W.getComputedStyle(e).display !== "none"; }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, K = NK.Kemi, T = NK.Tjek;
    paastand("data.js, kemi.js, tjek.js, regning.js og laerer.js er kørt", !!(D && D.GAET && K && K.Klump && T && T.formel && NK.Regning && NK.RoligLaerer));
    paastand("begge faner er bygget", !!(NK.sims && NK.sims["fane-forsoeg"] && NK.sims["fane-beregning"]));
    var sprites = ["vaegt", "batteri", "iltflaske", "stjernekaster", "lup", "kateder", "kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var billeder = [].slice.call(d.querySelectorAll("#forsoeg-gaet img"));
    paastand("de tre billeder til gættet er indlæst", billeder.length === 3 && billeder.every(function (b) { return b.complete && b.naturalWidth > 0; }));
    var A = NK.sims["fane-forsoeg"], B = NK.sims["fane-beregning"];
    paastand("Kemichael sidder ved katederet på begge faner", [A, B].every(function (s) { return s.k instanceof NK.RoligLaerer; }));
    paastand("der er ingen tilbudsknapper til en præsentation", !d.querySelector(".tilbud") && !d.querySelector(".spring-over"));
    if (!A.k.inde()) { A.k.hentInd(); tik(A, 4); B.k.opdater(4); }

    overskrift("2. Kemien");
    paastand("M(Fe) = 55,85 g/mol og M(FeO) = 71,85 g/mol", K.Mtekst("Fe") === "55,85" && K.Mtekst("FeO") === "71,85");
    var skaeve = [];
    D.KLUMPER.forEach(function (m) {
        [D.UDBYTTE.min, 0.8, D.UDBYTTE.maks].forEach(function (u) {
            var k = new K.Klump(m, u);
            k.taend();
            var n = 0;
            while (k.braender() && n++ < 2000) k.opdater(0.1);
            if (k.visning() !== K.slutVisning(m, u)) skaeve.push(m + "/" + u + ": " + k.visning() + " / " + K.slutVisning(m, u));
            if (!(k.visning() > m)) skaeve.push(m + " blev ikke tungere");
        });
    });
    paastand("alle " + D.KLUMPER.length + " klumper ender på den rigtige visning og bliver tungere", skaeve.length === 0, skaeve.join("; "));
    var k1 = new K.Klump(4, 0.8);
    k1.taend();
    var tid = 0;
    while (k1.braender() && tid < 100) { k1.opdater(0.1); tid += 0.1; }
    paastand("uden ekstra ilt brænder den på 15-30 s", tid >= 15 && tid <= 30, tid.toFixed(1) + " s");
    var k2 = new K.Klump(4, 0.8), tid2 = 0;
    k2.taend();
    while (k2.braender() && tid2 < 100) { if (k2.ilt <= 0) k2.givIlt(); k2.opdater(0.1); tid2 += 0.1; }
    paastand("med ilt hele tiden går det mindst tre gange hurtigere", tid2 * 3 <= tid, tid2.toFixed(1) + " s");
    var k3 = new K.Klump(4, 0.8);
    paastand("ilt virker ikke, før stålulden er tændt", !k3.givIlt() && k3.ilt === 0);
    k3.taend(); k3.opdater(1);
    paastand("mens den brænder, står vægten ikke stille", !k3.stille() && k3.visning() > 4);
    var ekstra = D.EKSEMPEL.filter(function (e) { var u = K.udbytteAf(e.mf, e.me); return u < D.UDBYTTE.min - 0.01 || u > D.UDBYTTE.maks + 0.01; });
    paastand("eksemplerne på fane 2 ligger inden for modellens udbytte", ekstra.length === 0, JSON.stringify(ekstra));
    var f4 = K.facit({ tal: { mf: 4, me: 4.94 } });
    paastand("4,00 g jern: n = 0,0716 mol, m(FeO) = 5,14 g, ca. 82 % reagerede",
        K.mol(f4.n) === "0,0716" && K.g2(f4.m) === "5,14" && K.pct(f4.pct) === "82", K.mol(f4.n) + " " + K.g2(f4.m) + " " + K.pct(f4.pct));

    overskrift("3. Formlerne");
    function f(id, s) { return T.formel(id, s); }
    function ok(id, liste) { return liste.filter(function (s) { return !f(id, s).ok; }); }
    var ikke = ok("n_fe", ["n(Fe) = m(Fe)/M(Fe)", "n = m/M", "nFe = mFe/MFe", "n(Fe) = m(før)/M(Fe)", "m(Fe)/M(Fe)", "n(jern) = m(stålulden)/M(jern)", "n(Fe)=m(Fe):M(Fe)"]);
    paastand("n(Fe): syv skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("m(Fe) = n(Fe) · M(Fe) godkendes med den isolerede vist", f("n_fe", "m(Fe) = n(Fe)·M(Fe)").ok && !!f("n_fe", "m(Fe) = n(Fe)·M(Fe)").note);
    paastand("m · M: ikke ganget", /ikke ganget/.test(f("n_fe", "m*M").besked || ""));
    paastand("M / m: vendt om", /vendt om/.test(f("n_fe", "M/m").besked || ""));
    paastand("m(Fe) / M(FeO): molarmassen for jern", /M\(Fe\)/.test(f("n_fe", "m(Fe)/M(FeO)").besked || ""));
    paastand("m(efter) / M(Fe): massen før", /før/.test(f("n_fe", "m(efter)/M(Fe)").besked || ""));
    paastand("m(FeO) i trin 1: kender du ikke", /kender du ikke/.test(f("n_fe", "n(Fe) = m(FeO)/M(Fe)").besked || ""));
    paastand("4,00/55,85: skriv med symboler", /symboler/.test(f("n_fe", "4,00/55,85").besked || ""));
    paastand("m(Fe)/55,85: skriv molarmassen som M", /Skriv molarmassen/.test(f("n_fe", "m(Fe)/55,85").besked || ""));
    paastand("m(O) i en parentes: Fe eller FeO", /Fe eller FeO/.test(f("n_fe", "m(O)/M(Fe)").besked || ""));
    paastand("x/y kan ikke læses", /kan jeg ikke læse/.test(f("n_fe", "x/y").besked || ""));
    ikke = ok("n_feo", ["n(FeO) = n(Fe)", "n = n(Fe)", "n(FeO) = 2/2 · n(Fe)", "nFeO = nFe", "n(jernoxid) = n(jern)"]);
    paastand("n(FeO): fem skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("2 · n(Fe): forholdet er 2 : 2", /2 : 2/.test(f("n_feo", "2·n(Fe)").besked || ""));
    paastand("n(FeO) = n: skriv hvilken stofmængde", /hvilken stofmængde/.test(f("n_feo", "n(FeO) = n").besked || ""));
    paastand("m(Fe): det er en masse", /en masse/.test(f("n_feo", "m(Fe)").besked || ""));
    ikke = ok("m_feo", ["m(FeO) = n(FeO)·M(FeO)", "m = n·M", "m = n*M", "m(FeO) = n(Fe) · M(FeO)", "mFeO = nFeO*MFeO", "m(FeO) = m(Fe) · M(FeO) / M(Fe)", "m(FeO)=M(FeO)*n(FeO)"]);
    paastand("m(FeO): syv skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("n / M: ikke divideret", /ikke divideret/.test(f("m_feo", "n/M").besked || ""));
    paastand("n(FeO) · M(Fe): molarmassen for FeO", /M\(FeO\)/.test(f("m_feo", "n(FeO)*M(Fe)").besked || ""));
    paastand("m(efter): det, vægten viste", /vægten viste/.test(f("m_feo", "m(FeO) = m(efter)").besked || ""));
    paastand("et tomt felt tæller ikke som et svar", f("n_fe", "  ").tom);

    overskrift("4. Mellemregningen, tallene og de pæne beregninger");
    function opg(tal, kunTal) {
        var o = { id: "m1", tal: tal, kunTal: !!kunTal, spm: true, trin: D.TRINLISTE };
        o.facit = K.facit(o);
        return o;
    }
    var ikkeOk = [], grimme = [], ledIkke = [];
    D.KLUMPER.forEach(function (m) {
        [D.UDBYTTE.min, D.UDBYTTE.maks].forEach(function (u) {
            var o = opg({ mf: m, me: K.slutVisning(m, u) });
            o.trin.forEach(function (id) {
                var ft = T.facitTekst(id, o);
                if (!T.trin(id, ft, o).ok) ikkeOk.push(id + " " + ft);
                var r = T.regning(id, o).join(" ");
                if (/NaN|undefined|Infinity/.test(r) || (D.TRIN[id].op && !/=.*=.*=/.test(r))) grimme.push(id + ": " + r);
                if (D.TRIN[id].op) {
                    T.led(id, o).forEach(function (l, i) {
                        var s = T.tjekLed(id, o, i, l.tekst, D.TRIN[id].op === "/" ? [i] : [0, 1]);
                        if (!s.ok) ledIkke.push(id + "/" + i + " " + l.tekst + ": " + s.besked);
                    });
                }
            });
        });
    });
    paastand("facit i alle trin og for alle klumper godkendes, når det skrives som i feltet", ikkeOk.length === 0, ikkeOk.join("; "));
    paastand("mellemregningens tal godkendes, når de skrives som på tavlen", ledIkke.length === 0, ledIkke.join("; "));
    paastand("alle beregninger har formel, tal og resultat", grimme.length === 0, grimme.join("; "));
    var o4 = opg({ mf: 4.00, me: 4.94 });
    paastand("n(Fe) = m(Fe) / M(Fe) = 4,00 g / 55,85 g/mol = 0,0716 mol", T.regning("n_fe", o4).join(" ") === "n(Fe) = m(Fe) / M(Fe) = 4,00 g / 55,85 g/mol = 0,0716 mol", T.regning("n_fe", o4).join(" "));
    paastand("n(FeO) = n(Fe) = 0,0716 mol", T.regning("n_feo", o4).join(" ") === "n(FeO) = n(Fe) = 0,0716 mol", T.regning("n_feo", o4).join(" "));
    paastand("m(FeO) = n(FeO) · M(FeO) = 0,0716 mol · 71,85 g/mol = 5,14 g", T.regning("m_feo", o4).join(" ") === "m(FeO) = n(FeO) · M(FeO) = 0,0716 mol · 71,85 g/mol = 5,14 g", T.regning("m_feo", o4).join(" "));
    paastand("5,15 g (regnet med alle cifre) godkendes også", T.trin("m_feo", "5,15 g", o4).ok);
    paastand("tallet uden enhed: skriv enheden", /enheden/.test(T.trin("n_fe", "0,0716", o4).besked || ""));
    paastand("0,0716 g: forkert enhed", /ikke enheden/.test(T.trin("n_fe", "0,0716 g", o4).besked || ""));
    paastand("223 mol: ganget", /ganget/.test(T.trin("n_fe", "223,4 mol", o4).besked || ""));
    paastand("0,0557 mol: molarmassen af FeO", /FeO/.test(T.trin("n_fe", "0,0557 mol", o4).besked || ""));
    paastand("0,716 mol: tjek kommaet", /kommaet/.test(T.trin("n_fe", "0,716 mol", o4).besked || ""));
    paastand("0,143 mol i trin 2: forholdet", /2 : 2/.test(T.trin("n_feo", "0,143 mol", o4).besked || ""));
    paastand("4,94 g som massen af FeO: det, vægten viste", /vægten viste/.test(T.trin("m_feo", "4,94 g", o4).besked || ""));
    paastand("felt over brøkstregen: 4,00 uden enhed", /enheden/.test(T.tjekLed("n_fe", o4, 0, "4,00", [0]).besked || ""));
    paastand("felt over brøkstregen: 55,85 g/mol er vendt om", /vendt om/.test(T.tjekLed("n_fe", o4, 0, "55,85 g/mol", [0]).besked || ""));
    paastand("felt over brøkstregen: 4,94 g er m(efter)", /m\(efter\)/.test(T.tjekLed("n_fe", o4, 0, "4,94 g", [0]).besked || ""));
    paastand("felt under brøkstregen: 71,85 g/mol er FeO", /FeO/.test(T.tjekLed("n_fe", o4, 1, "71,85 g/mol", [1]).besked || ""));
    paastand("hele brøken i ét felt: ét tal i hvert felt", /ét tal/.test(T.tjekLed("n_fe", o4, 0, "4,00 g / 55,85 g/mol", [0]).besked || ""));
    paastand("gangestykket: tallene må byttes om", T.tjekLed("m_feo", o4, 0, "71,85 g/mol", [0, 1]).ok);
    paastand("gangestykket: 55,85 g/mol er molarmassen af jern", /jern/.test(T.tjekLed("m_feo", o4, 0, "55,85 g/mol", [0, 1]).besked || ""));

    overskrift("5. Sproget");
    var tekster = [];
    D.FORSOEG.forEach(function (o) { tekster.push(o.titel, o.tekst, o.efter); });
    tekster.push(D.GAET.etiket, D.GAET.spm, D.GAET.note, D.GAET.kemichael);
    D.GAET.svar.forEach(function (s) { tekster.push(s.t, s.tekst, s.forkl || ""); });
    ["LINJE", "HINT", "SVAR", "INTRO", "FAERDIG"].forEach(function (n) { Object.keys(D[n]).forEach(function (k) { tekster.push(D[n][k]); }); });
    D.BEREGNING.forEach(function (o) { tekster.push(o.titel); });
    Object.keys(D.TRIN).forEach(function (id) {
        var t = D.TRIN[id];
        tekster.push(t.navn, t.formelHint, t.talHint);
        (t.indsaetHint || []).forEach(function (h) { tekster.push(h); });
    });
    tekster.push(D.HVORFOR.spm, D.HVORFOR.hint, D.HVORFOR.efter, D.OVER_TAVLE);
    D.HVORFOR.svar.forEach(function (s) { tekster.push(s.t, s.forkl || ""); });
    Object.keys(T.REGLER).forEach(function (id) { T.REGLER[id].fejl.forEach(function (x) { tekster.push(x[1]); }); });
    tekster = tekster.concat(D.ROS, D.ROS_OPGAVE, D.KAFFE, D.STJERNE, [D.UD_LINJE, D.IND_LINJE, D.PRIK_SIDST]);
    tekster.push(d.body.innerText, d.getElementById("teori").innerText);
    var alt = tekster.join("\n");
    paastand("ingen tankestreger", !/[–—]/.test(alt), (alt.match(/.{0,30}[–—].{0,30}/) || [""])[0]);
    paastand("ingen 1+ eller 1−", !/(^|[^0-9,])1[+−-](\s|$)/.test(alt));
    paastand("ingen ord uden æ, ø og å", !ASCII_ORD.test(alt), (alt.match(ASCII_ORD) || [""])[0]);
    paastand("Kemichaels linje til gættet er kort (højst 110 tegn)", D.GAET.kemichael.length <= 110, D.GAET.kemichael.length);

    overskrift("6. Fane 1: det gratis gæt");
    NK.visFane("fane-forsoeg");
    A.tilpas(); A.layout();
    A.vaelg(0, false);
    var gaet = d.getElementById("forsoeg-gaet");
    paastand("måling 1 starter med det gratis gæt: tre kort over scenen", A.fase() === "valg" && synlig(gaet) && gaet.querySelectorAll(".gk").length === 3);
    paastand("kortene ligger over scenen, ikke over Kemichaels bånd", Math.abs(parseFloat(gaet.style.bottom) - (A.L.h - A.k.lay.y)) < 2, gaet.style.bottom);
    paastand("Kemichael introducerer hypotesen", A.k.taler() && /hypotese/.test(A.k.tekst()) && /gratis/.test(A.k.tekst()), A.k.tekst());
    paastand("der er ingen hint-knap under gættet", A.el.knap.hidden && !synlig(A.el.knap));
    paastand("linjen i kortet siger: gæt først", /Gæt først/.test(besked(A)), besked(A));
    var lay = A.lay;
    A.nedScene({ x: lay.bat.x, y: lay.bat.y });
    paastand("batteriet kan ikke bruges før gættet", !A.klump.taendt && /Gæt først/.test(besked(A)), besked(A));
    [].filter.call(gaet.querySelectorAll(".gk"), function (k) { return k.getAttribute("data-gaet") === "lettere"; })[0].click();
    paastand("efter gættet tier Kemichael, og kortet med Lettere er markeret", !A.k.taler() && gaet.querySelector(".gk.valgt").getAttribute("data-gaet") === "lettere");
    tik(A, 1.3);
    paastand("kortene forsvinder, og linjen siger: aflæs m(før)", !synlig(gaet) && /Dit gæt: lettere/.test(besked(A)) && /m\(før\)/.test(besked(A)), besked(A));
    paastand("hint-knappen er tilbage", !A.el.knap.hidden);
    paastand("gættet står under skemaet med billedet", /lettere/.test(d.getElementById("forsoeg-gaetlinje").textContent) && !!d.querySelector("#forsoeg-gaetlinje img"));

    overskrift("7. Fane 1: forsøget med musen");
    felt(0, "f", "0,00");
    paastand("et forkert tal for m(før) afvises", A.noteret.mf === null && /står der ikke/.test(besked(A)), besked(A));
    felt(0, "f", komma(A.proeve) + " g");
    tik(A, 0.1);
    paastand("m(før) aflæst (også med g efter), og linjen siger: tænd", A.noteret.mf === A.proeve && /batteriet/.test(besked(A)), besked(A));
    paastand("m(efter) er lukket, før stålulden er tændt", d.getElementById("forsoeg-e0").disabled);
    var bat = A.batPos();
    traek(A, bat.x, bat.y, lay.zoom.x - lay.zoom.r - 30, lay.bordY - 40);
    tik(A, 1);
    paastand("batteriet sluppet ved siden af: det flyver hjem, og intet brænder", !A.klump.taendt && /poler/.test(besked(A)), besked(A));
    bat = A.batPos();
    var u = lay.uld, M = NK.Sprites.MAAL.batteri, dy = (M.h / 2 - M.pol) * lay.bat.h / M.h;
    traek(A, bat.x, bat.y, u.cx - u.rx * 0.3, u.cy - u.ry * 0.3 - dy);
    tik(A, 0.1);
    paastand("batteriet trukket hen til stålulden: den er tændt", A.klump.taendt, besked(A));
    tik(A, 3);
    paastand("den gløder, der kommer gnister, og vægten stiger", A.uld.frontAndel(A.klump.p) > 0 && A.gnister.antal() > 0 && A.klump.visning() > A.proeve,
        A.uld.frontAndel(A.klump.p).toFixed(2) + " " + A.gnister.antal() + " " + A.klump.visning());
    paastand("luppen: ilten sætter sig på jernatomerne", A.lup.reageret() > 0, A.lup.reageret());
    felt(0, "e", komma(A.klump.visning()));
    paastand("m(efter), mens den gløder: vent", A.noteret.me === null && /gløder stadig|stiger stadig/.test(besked(A)), besked(A));
    var rate0 = A.klump.rate;
    klik(A, A.lay.flGeo.x0 + A.lay.flGeo.b / 2, A.lay.flGeo.y0 + A.lay.flGeo.h * 0.6);
    tik(A, 0.2);
    paastand("et klik på iltflasken: den brænder hurtigere", A.klump.ilt > 0 && A.klump.rate > rate0 * 2, rate0.toFixed(3) + " → " + A.klump.rate.toFixed(3));
    tik(A, 40);
    paastand("vægten står stille, og linjen siger: aflæs m(efter)", A.fase() === "efter" && /m\(efter\)/.test(besked(A)), A.fase() + " " + besked(A));
    paastand("vægten står på det, modellen siger", A.klump.visning() === K.slutVisning(A.proeve, A.klump.udbytte));
    var maks = Math.floor(NK.Tegn.LUP_ATOMER * A.klump.udbytte / 2) * 2;
    paastand("luppen: den inderste del af jernet har ikke reageret", A.lup.reageret() === maks && maks < NK.Tegn.LUP_ATOMER, A.lup.reageret() + " af " + NK.Tegn.LUP_ATOMER);
    felt(0, "e", komma(A.proeve));
    paastand("m(før) i m(efter)-feltet afvises", A.noteret.me === null && /Det er m\(før\)/.test(besked(A)), besked(A));
    felt(0, "e", komma(A.klump.visning()));
    paastand("måling 1 er løst, gættet forklares, og målingen er gemt", A.faerdig && /Du gættede: lettere/.test(besked(A)) && /tog .* g på/.test(besked(A)) &&
        NK.maalinger[0] && NK.maalinger[0].me === A.klump.visning(), besked(A));
    paastand("under skemaet: Den blev tungere", /Den blev tungere/.test(d.getElementById("forsoeg-gaetlinje").textContent));
    paastand("skemaet viser, hvor meget stålulden tog på", /tog .* g på/.test(d.getElementById("forsoeg-note").textContent), d.getElementById("forsoeg-note").textContent);
    paastand("fane 2 regner nu på den egne måling", B.opg.tal.egen && B.opg.tal.mf === NK.maalinger[0].mf);

    /* Maaling 2 med hint og svar hele vejen */
    A.knap();
    paastand("Næste opgave: måling 2 uden gæt og med en anden klump", A.nr === 1 && A.fase() === "foer" && !synlig(gaet) && A.proeve !== NK.maalinger[0].mf, A.fase());
    var svar = 0, set = {};
    while (!A.faerdig && svar++ < 60) {
        if (A.auto) { paastand("mens Vis svaret virker, kan knappen ikke trykkes", A.el.knap.disabled); tik(A, 2); continue; }
        var fa = A.fase();
        A.knap();
        if (!set[fa]) paastand("Giv hint i fasen " + fa + ": Kemichael siger hintet", A.k.taler() && /Hint/.test(A.k.tekst()), A.k.tekst());
        set[fa] = true;
        A.knap();
        tik(A, 1.5);
    }
    paastand("Vis svaret hele vejen løser måling 2 uden stjerne", A.faerdig && !A.status[1].stjerne && NK.maalinger[1] !== null, besked(A));

    /* Start forfra og tænd, før m(før) er skrevet */
    A.forfra();
    paastand("Start forfra: ny klump med samme masse, ikke tændt", !A.faerdig && !A.klump.taendt && A.noteret.mf === null);
    klik(A, A.lay.bat.x, A.lay.bat.y);
    tik(A, 2);
    paastand("et klik på batteriet: det flyver selv hen og tænder", A.klump.taendt, besked(A));
    paastand("tændt uden m(før): linjen siger det", /m\(før\) står ikke i skemaet/.test(besked(A)), besked(A));
    felt(1, "f", komma(A.proeve));
    paastand("m(før) kan stadig skrives, hvis man så den", A.noteret.mf === A.proeve);
    if (A.lay.stjGeo) {
        klik(A, A.lay.stjGeo.x + A.lay.stjGeo.b / 2, A.lay.stjGeo.y + A.lay.stjGeo.h * 0.3);
        paastand("påskeægget: stjernekasteren tænder, og Kemichael siger noget om den", A.stjerneT > 0 && D.STJERNE.indexOf(A.k.tekst()) >= 0, A.k.tekst());
    }

    overskrift("8. Fane 2: beregningen");
    NK.visFane("fane-beregning");
    B.tilpas(); B.layout();
    var FORMLER = { n_fe: "n(Fe) = m(Fe)/M(Fe)", n_feo: "n(FeO) = n(Fe)", m_feo: "m(FeO) = n(FeO)·M(FeO)" };
    function loesB(i, omvendt) {
        B.vaelg(i, false);
        var R = B.regning, n = 0, t;
        while ((t = R.aktivt()) && n++ < 30) {
            if (t.fase === "formel") { t.input.value = FORMLER[t.id]; R.tjek(); }
            else if (t.fase === "indsaet") {
                var led = T.led(t.id, B.opg);
                var byt = omvendt && D.TRIN[t.id].op === "*";
                t.inputs[0].value = led[byt ? 1 : 0].tekst; t.inputs[1].value = led[byt ? 0 : 1].tekst;
                R.tjek();
            } else { t.input.value = T.facitTekst(t.id, B.opg); R.tjek(); }
        }
        tik(B, 1);
    }
    B.vaelg(0, false);
    paastand("måling 1 har tre trin, og det første starter med formlen", B.regning.felter.length === 3 && B.regning.aktivt().fase === "formel");
    paastand("Kemichael siger intet, når opgaven vælges", !B.k.taler());
    paastand("over tavlen står spørgsmålet", !!B.lay.ot && B.lay.ot.linjer.join(" ") === D.OVER_TAVLE);
    B.knap();
    paastand("Giv hint i formlen: halvdelen af formlen", /n\(Fe\) = m\(Fe\) \/ …/.test(B.k.tekst()), B.k.tekst());
    B.knap();
    paastand("Vis svaret: formlen, og så mellemregningen", /Formlen/.test(B.k.tekst()) && B.regning.aktivt().fase === "indsaet", B.k.tekst());
    B.knap();
    paastand("Giv hint i mellemregningen: tallet over brøkstregen", /Over brøkstregen står massen af stålulden: 4,00 g|Over brøkstregen/.test(B.k.tekst()), B.k.tekst());
    var fB = B.regning.aktivt();
    fB.inputs[0].value = "55,85 g/mol";
    enter(fB.inputs[0]);
    paastand("molarmassen over brøkstregen: vendt om", /vendt om/.test(besked(B)), besked(B));
    loesB(0, true);
    paastand("efter tre trin kommer spørgsmålet med tre svar", !B.faerdig && B.spmAabent() && d.querySelectorAll("#beregning-valg .knap").length === 3 && /Vælg et af svarene/.test(besked(B)), besked(B));
    paastand("søjlen Regnet ud står der nu", B.s.teori === true);
    d.querySelectorAll("#beregning-valg .knap")[0].click();
    paastand("et forkert svar forklares, og knappen låses", !B.faerdig && /3000/.test(besked(B)) && d.querySelectorAll("#beregning-valg .knap")[0].disabled, besked(B));
    d.querySelectorAll("#beregning-valg .knap")[1].click();
    paastand("det rigtige svar løser måling 1 uden stjerne og siger, hvor meget der reagerede", B.faerdig && !B.status[0].stjerne && /reagerede ca\. \d+ %/.test(besked(B)), besked(B));
    paastand("den stiplede kasse viser ilten, der mangler", B.s.forskel === true);
    B.vaelg(1, false);
    paastand("måling 2: formlerne står der, og første felt er mellemregningen", B.regning.aktivt().fase === "indsaet" && /Formlerne er de samme/.test(d.getElementById("beregning-prompt").textContent));
    loesB(1, false);
    paastand("måling 2 kan løses, og slutlinjen sammenligner med måling 1", B.faerdig && /måling 1/.test(besked(B)), besked(B));
    paastand("efter sidste opgave går knappen tilbage til Forsøget", /Forsøget/.test(B.el.knap.textContent), B.el.knap.textContent);

    overskrift("9. Kemichael");
    B.vaelg(0, false);
    var fr = B.regning.aktivt();
    fr.input.value = "m*M";
    enter(fr.input);
    paastand("en forkert formel står i kortet, ikke hos Kemichael", !B.k.taler() && /ganget/.test(besked(B)), besked(B));
    B.k.sendUd();
    tik(B, 3);
    paastand("sendt ud: knappen hedder Hent Kemichael på begge faner", [A, B].every(function (s) { return s.k.knap.textContent === "Hent Kemichael"; }));
    B.knap();
    paastand("hintet står i kortet, når han er ude", /Hint:/.test(besked(B)) && !B.k.taler(), besked(B));
    B.k.hentInd();
    tik(B, 4);
    paastand("hentet ind igen", B.k.inde() && B.k.knap.textContent === "Send Kemichael ud");

    overskrift("10. Layout");
    var ramme = window.document.getElementById("ramme");
    var str = [[520, 380], [800, 600], [1100, 700], [1300, 820], [1500, 900]];
    var problemer = [];
    str.forEach(function (s) {
        ramme.style.width = s[0] + "px";
        ramme.style.height = s[1] + "px";
        ["fane-forsoeg", "fane-beregning"].forEach(function (id) {
            NK.visFane(id);
            var sim = NK.sims[id];
            sim.tilpas(); sim.layout();
            var L = sim.lay, Wc = sim.L.b, Hc = sim.L.h;
            var navn = s[0] + "×" + s[1] + " " + id;
            if (id === "fane-forsoeg") {
                if (L.zoom.x + L.zoom.r > Wc + 1) problemer.push(navn + " luppen");
                if (L.fl.x + L.fl.b / 2 > L.zoom.x - L.zoom.r + 4) problemer.push(navn + " flasken rammer luppen");
                if (L.bat.x + L.bat.b / 2 > L.v.x - L.v.b / 2) problemer.push(navn + " batteriet rammer vægten");
                if (L.uld.cy - L.uld.ry < 20) problemer.push(navn + " stålulden");
                if (L.bordY - L.fl.h < 0) problemer.push(navn + " flasken");
                if (L.zoom.y - L.zoom.r < 26) problemer.push(navn + " luppens titel");
            } else {
                if (L.tavle.x + L.tavle.b > Wc || L.tavle.h < 120) problemer.push(navn + " tavlen " + Math.round(L.tavle.h));
                if (L.tavle.y + L.tavle.h + 10 > L.bordY - L.sh) problemer.push(navn + " tavlen rammer søjlerne");
                if (L.soejler[2].x + L.soejler[2].b / 2 > Wc) problemer.push(navn + " søjlerne");
            }
            try { sim.tegn(); } catch (e) { problemer.push(navn + " tegn: " + e.message); }
            if (!(Hc > 100)) problemer.push(navn + " højde " + Hc);
        });
    });
    /* Gaettets kort skal kunne ses helt, ogsaa paa en lille skaerm */
    A.gaet = null;
    A.status[0].loest = false;
    NK.visFane("fane-forsoeg");
    A.vaelg(0, false);
    [[800, 600], [1300, 820]].forEach(function (s) {
        ramme.style.width = s[0] + "px";
        ramme.style.height = s[1] + "px";
        A.tilpas(); A.layout();
        var g = d.getElementById("forsoeg-gaet");
        if (!synlig(g)) problemer.push(s[0] + "×" + s[1] + " gættet vises ikke");
        else if (g.scrollHeight > g.clientHeight + 2) problemer.push(s[0] + "×" + s[1] + " gættets kort er for høje");
    });
    ramme.style.width = "1300px";
    ramme.style.height = "820px";
    paastand("layoutet holder fra 520 × 380 til 1500 × 900", problemer.length === 0, problemer.join("; "));
}
</script>
</body>
</html>
