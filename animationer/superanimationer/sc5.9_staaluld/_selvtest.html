<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc5.8 Afbrænding af ståluld</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at molarmasserne og de to reaktionsskemaer
   passer, at klumpen ender på det, vægten skal vise, for alle klumper,
   at ilten gør det hurtigere, at formlerne, mellemregningens felter og
   tallene genkendes med de typiske fejl i både Let og Svær, at facit er
   pænt og kan skrives som svar, at det gratis gæt står på papirkortet,
   og at intet sker i scenen imens, at papirkortet står øverst i scenen
   med Indsend svar og bliver på opgaven, at begge faner kan
   gennemføres med musen og ved at skrive, at der ikke er nogen lærer,
   men hint på begge faner, at sproget holder reglerne, og at layoutet
   holder fra 520 × 380 til 1500 × 900.

   Kræver en lokal server eller Chrome med --allow-file-access-from-files.
   Testen gemmer elevens fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sc5.8-forsoeg", "nk-sc5.8-beregning", "nk-sc5.8-maalinger", "nk-sc5.8-skema"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Ord, der er skrevet uden æ, ø og å, og som derfor ikke må nå eleven */
var ASCII_ORD = /\b(foer|faerdig|naeste|Naeste|gaa|staa|paa|foerst|hoejre|proeve\w*|vaegt\w*|Vaegt\w*|laerer\w*|forsoeg\w*|maaling\w*|Maaling\w*|staaluld\w*|braend\w*|gaet|svaer)\b/;

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;

    function tik(sim, sek) { for (var k = 0; k < Math.round(sek * 60); k++) sim.opdater(1 / 60); }
    function enter(inp) { inp.dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true })); }
    function mus(sim, type, x, y) {
        var r = sim.L.canvas.getBoundingClientRect();
        sim.L.canvas.dispatchEvent(new W.PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 1, button: 0, isPrimary: true }));
    }
    function klik(sim, x, y) { mus(sim, "pointerdown", x, y); mus(sim, "pointerup", x, y); }
    function traek(sim, x0, y0, x1, y1) {
        mus(sim, "pointerdown", x0, y0);
        for (var i = 1; i <= 8; i++) { mus(sim, "pointermove", x0 + (x1 - x0) * i / 8, y0 + (y1 - y0) * i / 8); tik(sim, 0.03); }
        mus(sim, "pointerup", x1, y1);
    }
    /* Linjen paa kortet; naar opgaven er loest, forklaringen under opgaven */
    function besked(sim) { return sim.faerdig ? sim.el.bliv.textContent : sim.beskedTekst(); }
    function komma(v) { return NK.tal2(v); }
    function synlig(e) { return !!e && W.getComputedStyle(e).display !== "none"; }
    /* De skilte, pegepilen tegner i det billede, fanen tegner nu */
    function skilte(sim) {
        var kald = [], orig = NK.Tegn.pegepil;
        NK.Tegn.pegepil = function (ctx, x, y, t, tekst) { kald.push(tekst || ""); return orig.apply(this, arguments); };
        try { sim.tegn(); } finally { NK.Tegn.pegepil = orig; }
        return kald;
    }

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var D = NK.Data, K = NK.Kemi, T = NK.Tjek;
    paastand("data.js, kemi.js, tjek.js, regning.js og skema.js er kørt", !!(D && D.GAET && K && K.Klump && K.skema && T && T.formel && NK.Regning && NK.Skema));
    paastand("begge faner er bygget", !!(NK.sims && NK.sims["fane-forsoeg"] && NK.sims["fane-beregning"]));
    var sprites = ["vaegt", "bunsen", "iltflaske", "lup"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("alle " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var billeder = [].slice.call(d.querySelectorAll("#forsoeg-kort .gk-billede img"));
    paastand("de tre billeder til gættet er indlæst", billeder.length === 3 && billeder.every(function (b) { return b.complete && b.naturalWidth > 0; }));
    var A = NK.sims["fane-forsoeg"], B = NK.sims["fane-beregning"];
    var udefra = [].filter.call(d.querySelectorAll("script[src], link[href], img[src]"), function (e) {
        var u = e.getAttribute("src") || e.getAttribute("href") || "";
        return /\.\.\/|^https?:/.test(u) && !/^\.\.\/faelles\/papirkort\.(css|js)$/.test(u);
    });
    paastand("mappen henter kun filer inde fra sig selv og papirkortet fra ../faelles/", udefra.length === 0, udefra.map(function (e) { return e.getAttribute("src") || e.getAttribute("href"); }).join(", "));
    paastand("der er ingen lærer: ingen Kemichael, ingen taleboble og ingen knap, der sender ham ud",
        !NK.Kemichael && !NK.RoligLaerer && !A.k && !B.k && !d.querySelector(".kboble") && !d.querySelector(".kknap") && !d.querySelector("[id$='anker-laerer']"));
    paastand("stjernekasteren er væk", !NK.Sprites.MAAL.stjernekaster && !D.STJERNE && !NK.Tegn.stjernekaster);
    paastand("der er ingen tilbudsknapper til en præsentation", !d.querySelector(".tilbud") && !d.querySelector(".spring-over"));

    overskrift("2. Kemien");
    var LET = K.skema("let"), SVAER = K.skema("svaer");
    paastand("M(Fe) = 55,85 g/mol, M(FeO) = 71,85 g/mol og M(Fe₃O₄) = 231,55 g/mol", K.MFeTekst === "55,85" && LET.Mtekst === "71,85" && SVAER.Mtekst === "231,55",
        K.MFeTekst + " " + LET.Mtekst + " " + SVAER.Mtekst);
    paastand("Let: 2 Fe + O₂ → 2 FeO, afstemt, forholdet 1 : 1", LET.reaktion === "2 Fe + O₂ → 2 FeO" && LET.iOrden && LET.del === 1, LET.reaktion);
    paastand("Svær: 3 Fe + 2 O₂ → Fe₃O₄, afstemt, stofmængden af jern deles med 3", SVAER.reaktion === "3 Fe + 2 O₂ → Fe₃O₄" && SVAER.iOrden && SVAER.del === 3, SVAER.reaktion);
    paastand("alle reaktionsskemaer i D.SKEMA kan bruges", D.SKEMAER.every(function (id) { return K.skema(id).iOrden; }));
    /* Braend en klump til den staar stille: med ilt hele tiden, eller uden */
    function braend(m, u, medIlt) {
        var k = new K.Klump(m, u), t = 0;
        k.taend();
        while (k.braender() && t < 200) { if (medIlt && k.ilt <= 0) k.givIlt(); k.opdater(0.1); t += 0.1; }
        k.t = t;
        return k;
    }
    var skaeve = [], luft = [];
    D.KLUMPER.forEach(function (m) {
        [D.UDBYTTE.min, 0.8, D.UDBYTTE.maks].forEach(function (u) {
            var k = braend(m, u, true);
            if (k.visning() !== K.slutVisning(m, u) || k.p < 1) skaeve.push(m + "/" + u + ": " + k.visning() + " / " + K.slutVisning(m, u));
            var l = braend(m, u, false);
            if (!(l.visning() > m && l.visning() < K.slutVisning(m, u) && l.ude && l.p > 0.45 && l.p < 0.7)) luft.push(m + "/" + u + ": " + l.visning() + " p " + l.p.toFixed(2));
        });
    });
    paastand("med ilt hele tiden når alle " + D.KLUMPER.length + " klumper helt til ende og den rigtige visning", skaeve.length === 0, skaeve.join("; "));
    paastand("uden ilt går de ud, før alt jernet har reageret (p mellem 0,45 og 0,7), men de bliver tungere", luft.length === 0, luft.join("; "));
    var k1 = braend(4, 0.8, false);
    paastand("uden ilt gløder den i 25-45 s", k1.t >= 25 && k1.t <= 45, k1.t.toFixed(1) + " s");
    var k2 = braend(4, 0.8, true);
    paastand("med ilt hele tiden er den færdig på under 15 s", k2.t < 15, k2.t.toFixed(1) + " s");
    var k3 = new K.Klump(4, 0.8);
    paastand("ilt virker ikke, før stålulden er tændt", !k3.givIlt() && k3.ilt === 0);
    k3.taend(); k3.opdater(1);
    paastand("mens den gløder, står vægten ikke stille", !k3.stille() && k3.visning() > 4);
    paastand("når den er gået ud, kan den ikke tændes igen, og ilt virker ikke", !k1.taend() && !k1.givIlt() && !k1.braender());
    var ekstra = K.udbytteAf(D.EKSEMPEL[0].mf, D.EKSEMPEL[0].me);
    paastand("eksempel 1 er målt med ilt: udbyttet ligger inden for modellens", ekstra >= D.UDBYTTE.min && ekstra <= D.UDBYTTE.maks, ekstra.toFixed(3));
    paastand("eksempel 2 er målt uden ilt: 3,00 g med 80 % giver 3,41 g", braend(3, 0.8, false).visning() === D.EKSEMPEL[1].me, braend(3, 0.8, false).visning());
    var f4 = K.facit({ tal: { mf: 4, me: 4.94 }, sk: LET });
    paastand("Let, 4,00 g jern: n = 0,0716 mol, m(FeO) = 5,14 g, ca. 82 % reagerede",
        K.mol(f4.n) === "0,0716" && K.mol(f4.nOx) === "0,0716" && K.g2(f4.m) === "5,14" && K.pct(f4.pct) === "82", K.mol(f4.n) + " " + K.g2(f4.m) + " " + K.pct(f4.pct));
    var f4s = K.facit({ tal: { mf: 4, me: 4.94 }, sk: SVAER });
    paastand("Svær, 4,00 g jern: n(Fe₃O₄) = 0,0239 mol, m(Fe₃O₄) = 5,53 g, ca. 62 % reagerede",
        K.mol(f4s.n) === "0,0716" && K.mol(f4s.nOx) === "0,0239" && K.g2(f4s.m) === "5,53" && K.pct(f4s.pct) === "62", K.mol(f4s.nOx) + " " + K.g2(f4s.m) + " " + K.pct(f4s.pct));
    var over = [];
    D.SKEMAER.forEach(function (id) {
        D.KLUMPER.forEach(function (m) {
            var f = K.facit({ tal: { mf: m, me: K.slutVisning(m, D.UDBYTTE.maks) }, sk: K.skema(id) });
            if (!(f.pct > 30 && f.pct < 100 && f.m > K.slutVisning(m, D.UDBYTTE.maks))) over.push(id + " " + m + ": " + f.pct.toFixed(0));
        });
    });
    paastand("i begge skemaer viser vægten altid mindre end det, der regnes ud", over.length === 0, over.join("; "));

    overskrift("3. Formlerne");
    function f(id, s, sk) { return T.formel(id, s, sk || LET); }
    function ok(id, liste, sk) { return liste.filter(function (s) { return !f(id, s, sk).ok; }); }
    var ikke = ok("n_fe", ["n(Fe) = m(Fe)/M(Fe)", "n = m/M", "nFe = mFe/MFe", "n(Fe) = m(før)/M(Fe)", "m(Fe)/M(Fe)", "n(jern) = m(stålulden)/M(jern)", "n(Fe)=m(Fe):M(Fe)"]);
    paastand("n(Fe): syv skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("m(Fe) = n(Fe) · M(Fe) godkendes med den isolerede vist", f("n_fe", "m(Fe) = n(Fe)·M(Fe)").ok && !!f("n_fe", "m(Fe) = n(Fe)·M(Fe)").note);
    paastand("m · M: ikke ganget", /ikke ganget/.test(f("n_fe", "m*M").besked || ""));
    paastand("M / m: vendt om", /vendt om/.test(f("n_fe", "M/m").besked || ""));
    paastand("m(Fe) / M(FeO): molarmassen for jern", /M\(Fe\)/.test(f("n_fe", "m(Fe)/M(FeO)").besked || ""));
    paastand("m(efter) / M(Fe): massen før", /før/.test(f("n_fe", "m(efter)/M(Fe)").besked || ""));
    paastand("m(FeO) i trin 1: kender du ikke", /kender du ikke/.test(f("n_fe", "n(Fe) = m(FeO)/M(Fe)").besked || ""));
    paastand("4,00/55,85: skriv med symboler", /symboler/.test(f("n_fe", "4,00/55,85").besked || ""));
    paastand("m(Fe)/55,85: skriv molarmassen som M", /Skriv molarmassen/.test(f("n_fe", "m(Fe)/55,85").besked || ""));
    paastand("m(O) i en parentes: Fe eller FeO", /Fe eller FeO/.test(f("n_fe", "m(O)/M(Fe)").besked || ""));
    paastand("x/y kan ikke læses", /kan jeg ikke læse/.test(f("n_fe", "x/y").besked || ""));
    ikke = ok("n_ox", ["n(FeO) = n(Fe)", "n = n(Fe)", "n(FeO) = 2/2 · n(Fe)", "nFeO = nFe", "n(jernoxid) = n(jern)"]);
    paastand("Let, n(FeO): fem skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("2 · n(Fe): forholdet er 2 : 2", /2 : 2/.test(f("n_ox", "2·n(Fe)").besked || ""));
    paastand("n(FeO) = n: skriv hvilken stofmængde", /hvilken stofmængde/.test(f("n_ox", "n(FeO) = n").besked || ""));
    paastand("m(Fe): det er en masse", /en masse/.test(f("n_ox", "m(Fe)").besked || ""));
    ikke = ok("m_ox", ["m(FeO) = n(FeO)·M(FeO)", "m = n·M", "m = n*M", "m(FeO) = n(Fe) · M(FeO)", "mFeO = nFeO*MFeO", "m(FeO) = m(Fe) · M(FeO) / M(Fe)", "m(FeO)=M(FeO)*n(FeO)"]);
    paastand("Let, m(FeO): syv skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("n / M: ikke divideret", /ikke divideret/.test(f("m_ox", "n/M").besked || ""));
    paastand("n(FeO) · M(Fe): molarmassen for FeO", /M\(FeO\)/.test(f("m_ox", "n(FeO)*M(Fe)").besked || ""));
    paastand("m(efter): det, vægten viste", /vægten viste/.test(f("m_ox", "m(FeO) = m(efter)").besked || ""));
    paastand("Let, m(Fe₃O₄): produktet er FeO", /produktet FeO/.test(f("m_ox", "m(Fe3O4) = n(Fe3O4)·M(Fe3O4)").besked || ""), f("m_ox", "m(Fe3O4) = n(Fe3O4)·M(Fe3O4)").besked);
    paastand("et tomt felt tæller ikke som et svar", f("n_fe", "  ").tom);
    ikke = ok("n_ox", ["n(Fe3O4) = n(Fe)/3", "n(Fe₃O₄) = 1/3 · n(Fe)", "n = n(Fe):3", "nFe3O4 = nFe/3", "n(jernoxid) = n(jern)/3", "n(Fe)·1/3", "n(Fe3O4) = n(Fe)·(1/3)"], SVAER);
    paastand("Svær, n(Fe₃O₄): syv skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("Svær, 3 · n(Fe): divider med 3", /Divider stofmængden af jern med 3/.test(f("n_ox", "3·n(Fe)", SVAER).besked || ""), f("n_ox", "3·n(Fe)", SVAER).besked);
    paastand("Svær, n(Fe₃O₄) = n(Fe): forholdet er ikke 1 : 1, men 3 : 1", /ikke 1 : 1/.test(f("n_ox", "n(Fe3O4) = n(Fe)", SVAER).besked || "") && /3 : 1/.test(f("n_ox", "n(Fe3O4) = n(Fe)", SVAER).besked || ""));
    paastand("Svær, n(Fe) / 2: 2 er tallet foran O₂", /foran O₂/.test(f("n_ox", "n(Fe)/2", SVAER).besked || ""), f("n_ox", "n(Fe)/2", SVAER).besked);
    paastand("Svær, n(FeO): produktet er Fe₃O₄", /produktet Fe₃O₄/.test(f("n_ox", "n(FeO) = n(Fe)/3", SVAER).besked || ""), f("n_ox", "n(FeO) = n(Fe)/3", SVAER).besked);
    ikke = ok("m_ox", ["m(Fe3O4) = n(Fe3O4)·M(Fe3O4)", "m = n·M", "m(Fe₃O₄) = n(Fe)/3 · M(Fe₃O₄)", "mFe3O4 = nFe3O4*MFe3O4"], SVAER);
    paastand("Svær, m(Fe₃O₄): fire skrivemåder godkendes", ikke.length === 0, ikke.join(" | "));
    paastand("Svær, n(Fe) · M(Fe₃O₄): det er stofmængden af jern", /stofmængden af jern/.test(f("m_ox", "n(Fe)·M(Fe3O4)", SVAER).besked || ""), f("m_ox", "n(Fe)·M(Fe3O4)", SVAER).besked);

    overskrift("4. Mellemregningen, tallene og de pæne beregninger");
    function opg(tal, sk, kunTal) {
        var o = { id: "m1", tal: tal, kunTal: !!kunTal, spm: true, trin: D.TRINLISTE, sk: sk || LET };
        o.facit = K.facit(o);
        return o;
    }
    var ikkeOk = [], grimme = [], ledIkke = [];
    D.SKEMAER.forEach(function (sid) {
        var sk = K.skema(sid);
        D.KLUMPER.forEach(function (m) {
            [D.UDBYTTE.min, D.UDBYTTE.maks].forEach(function (u) {
                var o = opg({ mf: m, me: K.slutVisning(m, u) }, sk);
                o.trin.forEach(function (id) {
                    var def = T.def(id, sk), ft = T.facitTekst(id, o);
                    if (!T.trin(id, ft, o).ok) ikkeOk.push(sid + " " + id + " " + ft);
                    var r = T.regning(id, o).join(" ");
                    if (/NaN|undefined|Infinity|\{/.test(r) || (def.op && !/=.*=.*=/.test(r))) grimme.push(sid + " " + id + ": " + r);
                    if (def.op) {
                        T.led(id, o).forEach(function (l, i) {
                            var s = T.tjekLed(id, o, i, l.tekst, def.op === "/" ? [i] : [0, 1]);
                            if (!s.ok) ledIkke.push(sid + " " + id + "/" + i + " " + l.tekst + ": " + s.besked);
                        });
                    }
                });
            });
        });
    });
    paastand("facit i alle trin, for alle klumper og i begge skemaer godkendes, når det skrives som i feltet", ikkeOk.length === 0, ikkeOk.join("; "));
    paastand("mellemregningens tal godkendes, når de skrives som i regnestykket", ledIkke.length === 0, ledIkke.join("; "));
    paastand("alle beregninger har formel, tal og resultat", grimme.length === 0, grimme.join("; "));
    var o4 = opg({ mf: 4.00, me: 4.94 });
    paastand("n(Fe) = m(Fe) / M(Fe) = 4,00 g / 55,85 g/mol = 0,0716 mol", T.regning("n_fe", o4).join(" ") === "n(Fe) = m(Fe) / M(Fe) = 4,00 g / 55,85 g/mol = 0,0716 mol", T.regning("n_fe", o4).join(" "));
    paastand("n(FeO) = n(Fe) = 0,0716 mol", T.regning("n_ox", o4).join(" ") === "n(FeO) = n(Fe) = 0,0716 mol", T.regning("n_ox", o4).join(" "));
    paastand("m(FeO) = n(FeO) · M(FeO) = 0,0716 mol · 71,85 g/mol = 5,14 g", T.regning("m_ox", o4).join(" ") === "m(FeO) = n(FeO) · M(FeO) = 0,0716 mol · 71,85 g/mol = 5,14 g", T.regning("m_ox", o4).join(" "));
    paastand("5,15 g (regnet med alle cifre) godkendes også", T.trin("m_ox", "5,15 g", o4).ok);
    paastand("tallet uden enhed: skriv enheden", /enheden/.test(T.trin("n_fe", "0,0716", o4).besked || ""));
    paastand("0,0716 g: forkert enhed", /ikke enheden/.test(T.trin("n_fe", "0,0716 g", o4).besked || ""));
    paastand("223 mol: ganget", /ganget/.test(T.trin("n_fe", "223,4 mol", o4).besked || ""));

        maal(B, "måling 2 løst");
        B.vaelgSkema("let");
    });
    paastand("papirkortet holder sig inden for kortZone i alle trin (1400 × 860 og 1100 × 660)", kortProblemer.length === 0,
        kortProblemer.join("; ") + " | højest " + JSON.stringify(hoejest));
    /* Det, kortet skal give plads til, begynder under kortZone */
    paastand("forsøget og tavlen begynder under kortets plads", A.lay.top >= A.kortZone() && B.lay.top >= B.kortZone());

    ramme.style.width = "1300px";
    ramme.style.height = "820px";
    paastand("layoutet holder fra 520 × 380 til 1500 × 900", problemer.length === 0, problemer.join("; "));
}
