<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <!-- Gaettet "det samme": en skaalvaegt i balance med graa ståluld i den
       ene skaal og sort (braendt) ståluld i den anden. Vises paa kortet i
       det gratis gaet. -->
  <defs>
    <linearGradient id="messing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1d58a"/>
      <stop offset="1" stop-color="#a47f33"/>
    </linearGradient>
    <linearGradient id="skaal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d39a"/>
      <stop offset="1" stop-color="#9a7630"/>
    </linearGradient>
  </defs>

  <!-- Foden og stangen -->
  <path d="M96 150 L144 150 L136 140 L104 140 Z" fill="url(#messing)" stroke="#5e4716" stroke-width="1"/>
  <rect x="116" y="42" width="8" height="99" fill="url(#messing)" stroke="#5e4716" stroke-width="0.8"/>

  <!-- Bjaelken, vandret -->
  <rect x="34" y="40" width="172" height="6" rx="3" fill="url(#messing)" stroke="#5e4716" stroke-width="0.8"/>
  <circle cx="120" cy="43" r="6" fill="#d2b060" stroke="#5e4716" stroke-width="1"/>
  <path d="M116 30 L124 30 L120 40 Z" fill="#f2c53d"/>

  <!-- Snorene -->
  <g stroke="#b6bcc4" stroke-width="1.2">
    <line x1="40" y1="44" x2="22" y2="102"/><line x1="40" y1="44" x2="58" y2="102"/>
    <line x1="200" y1="44" x2="182" y2="102"/><line x1="200" y1="44" x2="218" y2="102"/>
  </g>

  <!-- Skaalene -->
  <path d="M14 102 L66 102 Q 62 116, 40 116 Q 18 116, 14 102 Z" fill="url(#skaal)" stroke="#5e4716" stroke-width="1"/>
  <path d="M174 102 L226 102 Q 222 116, 200 116 Q 178 116, 174 102 Z" fill="url(#skaal)" stroke="#5e4716" stroke-width="1"/>

  <!-- Graa ståluld -->
  <g transform="translate(0 7)">
  <g fill="none" stroke="#b9c0c8" stroke-width="1.3">
    <ellipse cx="40" cy="90" rx="17" ry="9" transform="rotate(-12 40 90)"/>
    <ellipse cx="38" cy="88" rx="14" ry="7" transform="rotate(20 38 88)"/>
    <ellipse cx="43" cy="91" rx="12" ry="8" transform="rotate(60 43 91)"/>
    <ellipse cx="36" cy="92" rx="15" ry="6" transform="rotate(-40 36 92)"/>
    <ellipse cx="41" cy="86" rx="11" ry="6" transform="rotate(5 41 86)"/>
    <ellipse cx="44" cy="94" rx="13" ry="5" transform="rotate(30 44 94)"/>
  </g>
  <g fill="none" stroke="#8a929b" stroke-width="1">
    <ellipse cx="39" cy="91" rx="16" ry="8" transform="rotate(75 39 91)"/>
    <ellipse cx="42" cy="89" rx="9" ry="5" transform="rotate(-70 42 89)"/>
  </g>

  </g>

  <!-- Sort ståluld -->
  <g transform="translate(0 7)">
  <g fill="none" stroke="#3a3f4a" stroke-width="1.3">
    <ellipse cx="200" cy="90" rx="17" ry="9" transform="rotate(-12 200 90)"/>
    <ellipse cx="198" cy="88" rx="14" ry="7" transform="rotate(20 198 88)"/>
    <ellipse cx="203" cy="91" rx="12" ry="8" transform="rotate(60 203 91)"/>
    <ellipse cx="196" cy="92" rx="15" ry="6" transform="rotate(-40 196 92)"/>
    <ellipse cx="201" cy="86" rx="11" ry="6" transform="rotate(5 201 86)"/>
    <ellipse cx="204" cy="94" rx="13" ry="5" transform="rotate(30 204 94)"/>
  </g>
  <g fill="none" stroke="#20242c" stroke-width="1">
    <ellipse cx="199" cy="91" rx="16" ry="8" transform="rotate(75 199 91)"/>
    <ellipse cx="202" cy="89" rx="9" ry="5" transform="rotate(-70 202 89)"/>
  </g>

  </g>
</svg>
