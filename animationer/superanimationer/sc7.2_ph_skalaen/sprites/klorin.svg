<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">
  <!-- Klorin: plastflaske med skaev hals og faremaerket for aetsende. Staar paa y 118. -->
  <defs>
    <linearGradient id="flaske" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c08a"/>
      <stop offset="0.35" stop-color="#fbf6d8"/>
      <stop offset="1" stop-color="#bdb37c"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="116" rx="30" ry="3.2" fill="#000000" fill-opacity="0.3"/>
  <!-- Laag paa den skaeve hals -->
  <rect x="47" y="5" width="19" height="13" rx="2.5" fill="#2e7fd6" stroke="#1b4f88" stroke-width="1.2" transform="rotate(16 56.5 11.5)"/>
  <!-- Flasken -->
  <path d="M50 16 L64 20 L60 34 Q76 38 76 54 L76 110 Q76 116 70 116 L30 116 Q24 116 24 110 L24 54 Q24 40 38 36 Q46 34 50 16 Z"
        fill="url(#flaske)" stroke="#8f875a" stroke-width="1.4"/>
  <!-- Etiket -->
  <rect x="28" y="56" width="44" height="52" rx="3" fill="#2e7fd6"/>
  <text x="50" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">KLORIN</text>
  <g transform="translate(50 90)">
    <rect x="-10" y="-10" width="20" height="20" transform="rotate(45)" fill="#ffffff" stroke="#d42020" stroke-width="2.4"/>
    <!-- To glas, der drypper paa en plade og en haand -->
    <rect x="-7.4" y="-7.4" width="2.4" height="5.4" fill="#111111" transform="rotate(-40 -6.2 -4.7)"/>
    <rect x="3.2" y="-7.4" width="2.4" height="5.4" fill="#111111" transform="rotate(40 4.4 -4.7)"/>
    <circle cx="-4.8" cy="0" r="0.8" fill="#111111"/><circle cx="4.2" cy="0" r="0.8" fill="#111111"/>
    <path d="M-7.8 2.8 h3.6 l0.7 -1.1 l0.7 1.1 h1.3 v2.7 h-6.3 z" fill="#111111"/>
    <path d="M1.4 5.5 v-2.2 q0 -1.3 1.3 -1.3 h4.1 v1.1 h-2.7 v2.4 z" fill="#111111"/>
  </g>
  <rect x="29" y="44" width="4" height="62" rx="2" fill="#ffffff" fill-opacity="0.35"/>
</svg>
