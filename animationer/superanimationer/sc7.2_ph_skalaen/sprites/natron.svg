      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.30"/>
    </linearGradient>
  </defs>
  <ellipse cx="50" cy="116" rx="42" ry="3.2" fill="#000000" fill-opacity="0.3"/>
  <!-- Pakken bagved til hoejre -->
