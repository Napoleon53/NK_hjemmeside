<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" viewBox="0 0 100 120">
  <!-- Saebevand: en skaal med skum og bobler og et stykke saebe. Staar paa y 118. -->
  <defs>
    <linearGradient id="skaal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a8f8a"/>
      <stop offset="0.4" stop-color="#7fc4bd"/>
      <stop offset="1" stop-color="#3c7672"/>
    </linearGradient>
    <radialGradient id="boble" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#e3f1ff" stop-opacity="0.18"/>
      <stop offset="0.85" stop-color="#b9d7f5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8c6ff" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="116" rx="40" ry="3.2" fill="#000000" fill-opacity="0.3"/>
  <!-- Bobler i luften -->
  <circle cx="30" cy="30" r="9" fill="url(#boble)" stroke="#dbe9f7" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="60" cy="20" r="6.5" fill="url(#boble)" stroke="#dbe9f7" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="72" cy="42" r="5" fill="url(#boble)" stroke="#dbe9f7" stroke-opacity="0.6" stroke-width="0.8"/>
  <circle cx="44" cy="46" r="4" fill="url(#boble)" stroke="#dbe9f7" stroke-opacity="0.6" stroke-width="0.8"/>
  <!-- Skummet -->
  <g fill="#f4f8fb" stroke="#c6d3de" stroke-width="1">
    <circle cx="22" cy="78" r="9"/><circle cx="34" cy="72" r="11"/><circle cx="50" cy="70" r="12"/>
    <circle cx="66" cy="72" r="11"/><circle cx="78" cy="78" r="9"/>
  </g>
  <!-- Skaalen -->
  <path d="M8 80 L92 80 Q90 104 70 112 Q62 116 50 116 Q38 116 30 112 Q10 104 8 80 Z" fill="url(#skaal)" stroke="#2e5f5b" stroke-width="1.5"/>
  <ellipse cx="50" cy="80" rx="42" ry="4" fill="#dff1ef" stroke="#2e5f5b" stroke-width="1.2"/>
  <!-- Saeben paa kanten -->
  <rect x="58" y="58" width="26" height="14" rx="5" fill="#f2c4d8" stroke="#b77c96" stroke-width="1.2" transform="rotate(-12 71 65)"/>
  <path d="M20 90 Q24 100 34 106" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
</svg>
