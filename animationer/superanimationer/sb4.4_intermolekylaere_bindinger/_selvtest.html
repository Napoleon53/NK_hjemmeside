<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sb4.4 Intermolekylære bindinger</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:820px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at molekylerne har de rigtige atomer, at
   kogepunkterne følger tabellen og tommelfingerreglerne, at modellen
   koger ved kogepunktet og fortætter under det, at alkoholerne danner
   hydrogenbindinger og alkanerne ikke gør, at ethanol uden
   hydrogenbindinger koger ved −42 °C, at alle opgaver på de tre faner
   kan løses (selv og med Vis svaret), at termometeret alene aldrig løser
   en opgave, og at intet bedømmes, før eleven trykker Indsend svar, at
   termometeret er låst under et gæt, at de forkerte svar giver en rød
   linje med forklaringen på kortet, at hvert par i Rangér har en
   forklaring, at sproget holder reglerne, og at kortet øverst og tingene
   under det kan være der fra 1100 × 700 til 1600 × 950.

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-sb4.4-e", "nk-sb4.4-s", "nk-sb4.4-r"];
var ASCII_ORD = /\b(foer|faerdig|naeste|Naeste|gaa|staa|paa|foerst|hoejre|hoejeste|laerer\w*|traek\w*|aendr\w*|vaeske\w*|kraefter|taet)\b/;

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Koer en proeve sek sekunder ved temperaturen T */
function koerP(P, sek, T) { for (var t = 0; t < sek; t += 1 / 60) P.opdater(1 / 60, T); }
/* Koer en fane sek sekunder */
function koerF(F, sek) { for (var t = 0; t < sek; t += 1 / 60) F.opdater(1 / 60); }

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data;
    var E = NK.sims["fane-e"], S = NK.sims["fane-s"], R = NK.sims["fane-r"];
    var alleId = Object.keys(D.STOF);

    /* ------------------------------------------------------------------ */
    overskrift("1. Molekylerne");
    var molFejl = [];
    alleId.forEach(function (id) {
        var st = D.STOF[id], F = NK.Mol.form(st.smiles), t = { C: 0, H: 0, O: 0 };
        F.atomer.forEach(function (a) { t[a.e]++; });
        var nC = st.C, nO = st.OH;
        if (t.C !== nC || t.O !== nO || t.H !== 2 * nC + 2) molFejl.push(id + " " + JSON.stringify(t));
        if (F.donorer.length !== st.OH || F.acceptorer.length !== st.OH) molFejl.push(id + " OH");
        if (F.bindinger.length !== F.atomer.length - 1) molFejl.push(id + " bindinger");
        /* Ingen atomer oven i hinanden */
        for (var i = 0; i < F.atomer.length; i++) for (var j = i + 1; j < F.atomer.length; j++) {
            var a = F.atomer[i], b = F.atomer[j];
            if (Math.hypot(a.x - b.x, a.y - b.y) < 0.45) molFejl.push(id + " " + a.e + i + "/" + b.e + j);
        }
        var M = 12.011 * t.C + 1.008 * t.H + 15.999 * t.O;
        if (Math.abs(M - st.M) > 0.05) molFejl.push(id + " M " + M.toFixed(2));
    });
    paastand("alle 16 stoffer har de rigtige atomer, OH-grupper og molarmasse", molFejl.length === 0, molFejl.slice(0, 4).join(", "));
    paastand("16 stoffer", alleId.length === 16);

    /* ------------------------------------------------------------------ */
    overskrift("2. Kogepunkterne og tommelfingerreglerne");
    function stiger(liste) {
        for (var i = 1; i < liste.length; i++) if (D.STOF[liste[i]].kp <= D.STOF[liste[i - 1]].kp) return false;
        return true;
    }
    paastand("alkanerne koger højere, jo længere kæden er", stiger(D.ALKANER));
    paastand("alkoholerne koger højere, jo længere kæden er", stiger(D.ALKOHOLER));
    var udenFejl = [];
    alleId.forEach(function (id) {
        var st = D.STOF[id];
        if (st.uden && !(st.kp > D.STOF[st.uden].kp + 50)) udenFejl.push(id);
    });
    paastand("hver alkohol koger over 50 °C højere end alkanen med samme form", udenFejl.length === 0, udenFejl.join(", "));
    var s = D.STOF;
    paastand("forskellen bliver mindre med kæden: ethanol/propan 120, pentan-1-ol/hexan 69",
        s.ethanol.kp - s.propan.kp === 120 && s.pentan1ol.kp - s.hexan.kp === 69);
    paastand("de forgrenede koger lavere end de lige", s.mpropan.kp < s.butan.kp && s.propan2ol.kp < s.propan1ol.kp && s.mpropan2ol.kp < s.butan1ol.kp);
    paastand("flere OH-grupper: ethanol < ethan-1,2-diol, propan-1-ol < propan-1,2,3-triol", s.ethanol.kp < s.ethandiol.kp && s.propan1ol.kp < s.glycerol.kp);
    paastand("butan står med én decimal: −0,5 °C", D.kpTekst(s.butan) === "−0,5 °C" && D.kpTekst(s.ethanol) === "78 °C");

    /* ------------------------------------------------------------------ */
    overskrift("3. Modellen");
    var brugt = { ethanol: [D.ETHANOL.antal, D.ETHANOL.Rm] };
    D.PAR.forEach(function (p) {
        [p.a, p.b].forEach(function (id) { brugt[id] = [D.antalILup(s[id]), D.SAMMEN.Rm]; });
    });
    var mFejl = [], hbFejl = [], udFejl = [], dampFejl = [];
    Object.keys(brugt).forEach(function (id) {
        var st = s[id], P = new NK.Proeve(st, brugt[id][0], brugt[id][1], 3);
        P.nulstil(st.kp - 15);
        koerP(P, 5, st.kp - 15);
        if (P.antalGas() > P.N * 0.12 + 0.5) dampFejl.push(id + " " + P.antalGas());
        var nhb = P.hbListe.length;
        if (st.OH && nhb < P.N * 0.25) hbFejl.push(id + " har " + nhb);
        if (!st.OH && nhb) hbFejl.push(id + " (alkan) har " + nhb);
        koerP(P, 2.5, st.kp + 15);
        koerP(P, 4, st.kp + 15);
        if (P.antalGas() !== P.N) mFejl.push(id + " koger ikke: " + P.antalGas() + "/" + P.N);
        if (P.hbListe.length || P.lonListe.length) mFejl.push(id + " har bindinger i dampen");
        koerP(P, 8, st.kp - 20);
        if (P.antalGas() > P.N * 0.12 + 0.5) mFejl.push(id + " fortætter ikke: " + P.antalGas());
        P.mol.forEach(function (m) {
            P.verden(m);
            P.F.atomer.forEach(function (a, i) { if (Math.hypot(m.wx[i], m.wy[i]) > P.Rm + 0.4) udFejl.push(id); });
        });
    });
    paastand("under kogepunktet er højst 12 % damp", dampFejl.length === 0, dampFejl.join(", "));
    paastand("alkoholerne danner hydrogenbindinger, alkanerne ingen", hbFejl.length === 0, hbFejl.join(", "));
    paastand("alle stofferne koger helt 15 °C over kogepunktet og fortætter igen", mFejl.length === 0, mFejl.slice(0, 3).join(", "));
    paastand("ingen molekyler slipper ud af luppen", udFejl.length === 0, udFejl.slice(0, 3).join(", "));
    var Pe = new NK.Proeve(s.ethanol, 22, 11.6, 9);
    Pe.nulstil(20);
    Pe.hb = false;
    paastand("uden hydrogenbindinger er ethanols kogepunkt propans, −42 °C", Pe.kp() === -42);
    koerP(Pe, 6, 20);
    var koger20 = Pe.antalGas() === Pe.N;
    koerP(Pe, 8, -55);
    paastand("uden hydrogenbindinger koger ethanol ved 20 °C og fortætter ved −55 °C", koger20 && Pe.antalGas() <= 3, koger20 + " " + Pe.antalGas());
    var Pp = new NK.Proeve(s.ethanol, 22, 11.6, 4);
    Pp.nulstil(70);
    koerP(Pp, 5, 76);
    paastand("ethanol koger ikke ved 76 °C", Pp.antalGas() <= Pp.N * 0.12 + 0.5, Pp.antalGas());
    koerP(Pp, 3, 80);
    paastand("men begynder ved 80 °C, uden at alt forsvinder på én gang", Pp.antalGas() > 2 && Pp.antalGas() < Pp.N, Pp.antalGas());

    /* ------------------------------------------------------------------ */
    overskrift("4. Fane 1: Ethanol");
    NK.visFane("fane-e");
    function skortKl(F) { return d.getElementById(F.navn + "-skort").className; }
    function blinker(F) { return d.getElementById(F.navn + "-skort").classList.contains("blink"); }
    function nulBlink(F) { d.getElementById(F.navn + "-skort").classList.remove("blink"); }
    function indsendKlar(F) { var k = F.el.indsend; return !k.hidden && k.classList.contains("klar"); }
    function termoPt(F, T) { var TM = F.lay.termo; return { x: TM.x, y: TM.yFor(T) }; }
    E.vaelg(0);
    paastand("første opgave er Ethanols kogepunkt, og opgaven står på kortet øverst i scenen",
        E.opg.o.id === "kog" && /kogepunkt/.test(E.kortTekst()) && /opgave/.test(skortKl(E)));
    paastand("der er ingen linje nederst i scenen og intet opgavekort i panelet",
        !d.querySelector(".statuslinje") && !d.querySelector(".opgavekort") && !d.getElementById("r-tjek"));
    paastand("tælleren af bindinger er væk; forklaringen af stregerne står ved luppen",
        !d.getElementById("e-ant-hb") && /Hydrogenbinding/.test(E.signatur.textContent) && /London-kraft/.test(E.signatur.textContent));
    paastand("Indsend svar er gråt, før termometeret er rørt", !indsendKlar(E) && /20 °C/.test(E.el.indsend.textContent.replace(/ /g, " ")));
    E.indsendKlik();
    paastand("Indsend svar før termometeret er rørt koster intet, men kortet blinker", !E.fejlet && !E.faerdig && blinker(E));
    E.knap();
    paastand("Giv et hint giver hint 1 af 3 på kortet", /Hint 1 af 3/.test(E.beskedTekst()) && E.el.status.classList.contains("hint"));
    /* Det, brugeren klagede over: eleven trækker termometeret helt op */
    E.termo.saet(120); E.roertTermo = true;
    koerF(E, 7);
    paastand("termometeret helt op løser ikke opgaven af sig selv (ethanol koger, men intet er sendt ind)",
        !E.faerdig && E.P.antalGas() === E.P.N, E.P.antalGas());
    paastand("Indsend svar viser temperaturen og banker", indsendKlar(E) && /120 °C/.test(E.el.indsend.textContent.replace(/ /g, " ")));
    E.indsendKlik();
    paastand("120 °C sendt ind: rød linje om, at kogepunktet er lavere, og ingen løsning",
        !E.faerdig && E.el.status.classList.contains("skidt") && /lavere/.test(E.beskedTekst()), E.beskedTekst());
    E.termo.saet(60);
    koerF(E, 4);
    E.indsendKlik();
    paastand("60 °C sendt ind: ethanol koger ikke, kogepunktet er højere", !E.faerdig && /højere/.test(E.beskedTekst()), E.beskedTekst());
    E.termo.saet(79);
    E.indsendKlik();
    paastand("79 °C sendt ind løser opgaven; det grønne kort siger 78 °C og har Næste opgave",
        E.faerdig && /loest/.test(skortKl(E)) && /78 °C/.test(E.kortTekst().replace(/ /g, " ")) && /Næste opgave/.test(E.kortTekst()));
    paastand("to forkerte svar først: ingen stjerne", !E.status[0].stjerne && E.status[0].loest);
    nulBlink(E);
    E.termoNed(termoPt(E, 0));
    paastand("på det grønne kort er termometeret låst, og kortet blinker", E.termo.T === 79 && blinker(E));
    E.knap();
    paastand("opgave 2, Hvad brydes?, er et spørgsmål med fire svar, hvor flere kan vælges, og ethanol varmes op",
        E.opg.o.id === "brydes" && /spm/.test(skortKl(E)) && d.querySelectorAll("#e-ind .sk-knap").length === 4 && E.termo.maal === 84);
    paastand("Indsend svar er gråt, før et svar er valgt", !indsendKlar(E));
    E.valgKlik(0);
    paastand("et klik på et svar vælger det uden at bedømme det", E.valgte[0] && !E.faerdig && !E.el.status.classList.contains("skidt") && indsendKlar(E));
    E.indsendKlik();
    paastand("kun hydrogenbindinger sendt ind: rød linje om London-kræfterne", !E.faerdig && /London/.test(E.beskedTekst()), E.beskedTekst());
    E.valgKlik(1); E.valgKlik(2);
    E.indsendKlik();
    paastand("med bindingen mellem O og H: rød linje om, at molekylet er helt", !E.faerdig && /H på O/.test(E.beskedTekst()), E.beskedTekst());
    E.valgKlik(2);
    E.indsendKlik();
    paastand("hydrogenbindinger og London-kræfter sendt ind løser opgaven", E.faerdig && /mellem molekylerne/.test(E.kortTekst()));
    E.knap();
    koerF(E, 4);
    paastand("opgave 3, Find H'et, begynder med væske ved 20 °C", E.opg.o.id === "hvilket" && E.termo.T === 20 && E.P.antalGas() <= 3);
    var L = E.lay.lup, s1 = L.r / E.P.Rm, A = E.P.F.atomer;
    var mL = E.findMolekyle(false);
    E.P.verden(mL);
    var hC = A.map(function (a, i) { return a.e === "H" && !a.donor ? i : -1; }).filter(function (i) { return i >= 0; })[0];
    E.klikScene({ x: L.x + mL.wx[hC] * s1, y: L.y + mL.wy[hC] * s1 });
    paastand("et klik på et H vælger det (gul ring) uden at bedømme det og uden δ+ og δ−",
        E.opg.atom && E.opg.atom.e === "H" && !E.faerdig && !E.valgt && /valgt et H-atom/.test(E.beskedTekst()), E.beskedTekst());
    E.indsendKlik();
    paastand("H på C sendt ind: rød linje om, at det sidder på C", !E.faerdig && /sidder på C/.test(E.beskedTekst()) && !E.opg.atom, E.beskedTekst());
    E.P.verden(mL);
    var hO = E.P.F.donorer[0];
    E.klikScene({ x: L.x + mL.wx[hO] * s1, y: L.y + mL.wy[hO] * s1 });
    E.indsendKlik();
    paastand("H på O sendt ind løser opgaven, og H på O får δ+-kanten", E.faerdig && E.donorKant);
    E.knap();
    paastand("opgave 4 begynder med et gæt; kontakten og Indsend svar er skjult",
        E.opg.o.id === "uden" && /gaet/.test(skortKl(E)) && E.kontakt.hidden && E.el.indsend.hidden);
    nulBlink(E);
    var foer = E.termo.T;
    E.termoNed(termoPt(E, -60));
    E.tast({ key: "ArrowDown", shiftKey: true });
    paastand("under gættet er termometeret låst (mus og piletaster), og kortet blinker", E.termo.T === foer && blinker(E));
    E.valgKlik(2);
    paastand("efter gættet: kontakten kommer frem og pulserer, og Indsend er gråt, så længe hydrogenbindingerne er til",
        E.opg.fase === "opgave" && !E.kontakt.hidden && E.kontakt.classList.contains("peg") && !indsendKlar(E) && /Dit gæt/.test(E.kortTekst()));
    E.skiftHb();
    paastand("kontakten slår hydrogenbindingerne fra", !E.P.hb && /fra/.test(E.kontakt.textContent) && !E.kontakt.classList.contains("peg"));
    E.tast({ key: "ArrowUp" }); E.termo.saet(20);
    koerF(E, 6);
    paastand("uden hydrogenbindinger er ethanol damp ved 20 °C, og opgaven er ikke løst af sig selv", E.P.antalGas() === E.P.N && !E.faerdig);
    E.termo.saet(-80);
    koerF(E, 8);
    paastand("ved −80 °C er den væske igen, og opgaven er stadig ikke løst", E.P.antalGas() <= 3 && !E.faerdig);
    E.indsendKlik();
    paastand("−80 °C sendt ind: rød linje, kogepunktet er højere", !E.faerdig && /højere/.test(E.beskedTekst()));
    E.termo.saet(-42);
    E.indsendKlik();
    paastand("−42 °C sendt ind løser opgaven med dommen over gættet", E.faerdig && /−42 °C/.test(E.kortTekst().replace(/ /g, " ")) && /Dit gæt holdt/.test(E.kortTekst()));
    paastand("alle fire er løst, og kortets knap går videre til Sammenlign", E.antalLoest() === 4 && /Sammenlign/.test(E.kortTekst()));
    E.vaelg(0);
    paastand("de andre opgaver har altid hydrogenbindingerne slået til og ingen kontakt", E.P.hb && E.kontakt.hidden);
    E.status[0].stjerne = false;
    E.tast({ key: "ArrowUp" }); E.termo.saet(78);
    E.indsendKlik();
    paastand("løst i første forsøg: stjerne", E.faerdig && E.status[0].stjerne);
    var svarOK = true;
    [0, 1, 2, 3].forEach(function (i) {
        E.vaelg(i);
        if (E.gaetNu()) E.valgKlik(0);
        for (var k = 0; k < 6 && !E.faerdig; k++) E.knap();
        if (!E.faerdig || !/svar/.test(skortKl(E)) || E.status[i].stjerne && i !== 0) svarOK = false;
    });
    paastand("Vis svaret virker på alle fire (gult kort)", svarOK);
    E.vaelg(0);
    paastand("påskeægget: termometerets kugle", (function () {
        var TM = E.lay.termo;
        E.klikScene({ x: TM.kugle.x, y: TM.kugle.y });
        return /sprittermometer/.test(E.beskedTekst());
    }()));

    /* ------------------------------------------------------------------ */
    overskrift("5. Fane 2: Sammenlign");
    NK.visFane("fane-s");
    S.maalt = {};
    var parFejl = [];
    D.PAR.forEach(function (p, i) {
        S.vaelg(i);
        var kendtFoer = { a: S.kendt("a"), b: S.kendt("b") };
        if (!/gaet/.test(skortKl(S)) || !S.el.indsend.hidden) parFejl.push(p.id + " gæt");
        nulBlink(S);
        var T0 = S.termo.T;
        S.termoNed(termoPt(S, T0 + 60));
        S.klikScene({ x: S.lay.kol.b.lup.x, y: S.lay.kol.b.lup.y });
        if (S.termo.T !== T0 || !blinker(S) || S.opg.fase !== "gaet") parFejl.push(p.id + " ikke låst under gættet");
        S.valgKlik(0);
        ["a", "b"].forEach(function (k) {
            if (kendtFoer[k]) { if (S.opg.maaler === k) parFejl.push(p.id + " " + k + " måles igen"); return; }
            if (S.opg.fase !== "maal" || S.opg.maaler !== k) { parFejl.push(p.id + " måler ikke " + k); return; }
            var kp = Math.round(S.st[k].kp);
            S.tast({ key: "ArrowUp" });
            S.termo.saet(kp + 30);
            koerF(S, 6);
            if (S.opg.maaler !== k || S.faerdig) parFejl.push(p.id + " " + k + " løst af termometeret");
            S.indsendKlik();
            if (!S.el.status.classList.contains("skidt") || !/lavere/.test(S.beskedTekst())) parFejl.push(p.id + " " + k + " for højt ikke rødt");
            S.termo.saet(kp - 15);
            S.indsendKlik();
            if (!/højere/.test(S.beskedTekst())) parFejl.push(p.id + " " + k + " for lavt ikke rødt");
            S.termo.saet(kp + 2);
            S.indsendKlik();
            if (S.opg.maaler === k && S.opg.fase === "maal") parFejl.push(p.id + " " + k + " ikke fundet");
        });
        if (!S.venter || !/koger ved/.test(S.kortTekst())) parFejl.push(p.id + " intet grønt kort med kogepunkterne");
        S.knap();
        if (S.opg.fase !== "spm" || !/spm/.test(skortKl(S))) parFejl.push(p.id + " ikke spørgsmål");
        var forkert = -1, rigtig = -1;
        p.svar.forEach(function (sv, j) { if (sv.ok) rigtig = j; else if (forkert < 0) forkert = j; });
        S.valgKlik(forkert);
        if (S.el.status.classList.contains("skidt")) parFejl.push(p.id + " bedømt før Indsend");
        S.indsendKlik();
        if (!S.el.status.classList.contains("skidt") || !d.querySelector("#s-ind .sk-knap.forkert")) parFejl.push(p.id + " forkert svar ikke rødt");
        S.valgKlik(rigtig);
        S.indsendKlik();
        if (!S.faerdig) parFejl.push(p.id + " ikke løst");
        if (S.status[i].stjerne) parFejl.push(p.id + " stjerne trods fejl");
        if (p.svar.filter(function (sv) { return sv.ok; }).length !== 1) parFejl.push(p.id + " antal rigtige");
        if (s[p.b].kp <= s[p.a].kp) parFejl.push(p.id + " b skal koge højest");
    });
    paastand("alle fem par: låst under gættet, termometeret løser intet, for højt og for lavt er rødt, rigtigt sendt ind går videre, forkert svar er rødt", parFejl.length === 0, parFejl.slice(0, 4).join(", "));
    paastand("et kogepunkt, der er fundet i et andet par, skal ikke findes igen (ethanol i par 2 og 4)", parFejl.join().indexOf("måles igen") < 0);
    var maalte = Object.keys(S.maalt).length;
    paastand("alle otte stoffer fra parrene er kommet på grafen", maalte === 8, maalte);
    paastand("knappen Vis hele tabellen kommer frem, når alle fem er løst", !S.tabelKnap.hidden);
    var rigtigePlads = D.PAR.map(function (p) { var r = -1; p.svar.forEach(function (sv, j) { if (sv.ok) r = j; }); return r; });
    paastand("det rigtige svar står ikke altid samme sted", rigtigePlads.some(function (x) { return x !== rigtigePlads[0]; }), rigtigePlads.join(""));
    S.maalt = {};
    S.vaelg(0);
    S.valgKlik(1);
    for (var k2 = 0; k2 < 16 && !S.faerdig; k2++) { S.knap(); koerF(S, 2); }
    paastand("Vis svaret fører et par helt igennem uden stjerne", S.faerdig && !S.status[0].stjerne, S.opg.fase);

    /* ------------------------------------------------------------------ */
    overskrift("6. Fane 3: Rangér");
    NK.visFane("fane-r");
    var fFejl = [], lige = [];
    D.RANGER.forEach(function (o) {
        var st = o.stoffer;
        for (var i = 0; i < st.length; i++) for (var j = 0; j < st.length; j++) {
            if (i === j) continue;
            var a = s[st[i]], b = s[st[j]];
            if (a.kp === b.kp) lige.push(o.id);
            if (a.kp < b.kp && !D.forklar(a, b)) fFejl.push(o.id + ": " + a.navn + "/" + b.navn);
        }
    });
    paastand("ingen opgave har to stoffer med samme kogepunkt", lige.length === 0, lige.join(", "));
    paastand("hvert par i hver opgave har en forklaring", fFejl.length === 0, fFejl.slice(0, 4).join(", "));
    paastand("12 opgaver, 4 i hver gruppe", D.RANGER.length === 12 && ["let", "middel", "svaer"].every(function (g) {
        return D.RANGER.filter(function (o) { return o.gruppe === g; }).length === 4;
    }));
    var rFejl = [];
    R.opgaver.forEach(function (o, i) {
        R.vaelg(i);
        if (R.opg.orden.join() === R.opg.rigtig.join()) rFejl.push(o.id + " starter rigtigt");
        if (R.kortEl.length !== o.stoffer.length) rFejl.push(o.id + " kort");
        if (!/Sæt stofferne/.test(R.kortTekst())) rFejl.push(o.id + " opgaven står ikke på kortet");
        var h = R.hintTrin();
        if (h.length !== 3) rFejl.push(o.id + " hint " + h.length);
        R.indsendKlik();
        if (!R.el.status.classList.contains("skidt") || !R.opg.fejlPar) rFejl.push(o.id + " forkert ikke rødt");
        if (d.querySelectorAll("#r-pladser .stofkort.fejl").length !== 2) rFejl.push(o.id + " to røde kort");
        if (d.querySelectorAll("#r-pladser .sk-kp").length) rFejl.push(o.id + " kogepunkt vist for tidligt");
        var g = 0;
        while (R.foersteFejl() && g++ < 20) {
            var f = R.foersteFejl();
            R.byt(R.opg.orden.indexOf(f[0]), R.opg.orden.indexOf(f[1]));
        }
        if (R.faerdig) rFejl.push(o.id + " løst uden Indsend");
        R.indsendKlik();
        if (!R.faerdig) rFejl.push(o.id + " ikke løst");
        if (R.status[i].stjerne) rFejl.push(o.id + " stjerne trods fejl");
        if (d.querySelectorAll("#r-pladser .sk-kp").length !== o.stoffer.length) rFejl.push(o.id + " kogepunkter ikke vist");
    });
    paastand("alle 12: et forkert svar er rødt med to røde kort og uden kogepunkter; først Indsend svar løser opgaven", rFejl.length === 0, rFejl.slice(0, 4).join(", "));
    R.status[0].stjerne = false;
    R.vaelg(0);
    R.opg.orden = R.opg.rigtig.slice(); R.bygKort();
    R.indsendKlik();
    paastand("rigtig rækkefølge i første forsøg giver en stjerne", R.faerdig && R.status[0].stjerne);
    R.vaelg(5);
    R.knap(); R.knap(); R.knap(); R.knap();
    paastand("Vis svaret efter tre hint sætter kortene rigtigt på et gult kort", R.faerdig && R.opg.orden.join() === R.opg.rigtig.join() && /svar/.test(skortKl(R)));

    /* ------------------------------------------------------------------ */
    overskrift("7. Sproget");
    var tekster = [];
    (function saml(x) {
        if (typeof x === "string") tekster.push(x);
        else if (Array.isArray(x)) x.forEach(saml);
        else if (x && typeof x === "object") Object.keys(x).forEach(function (k) { saml(x[k]); });
    }({ E: D.E_MAAL, P: D.PAR, F: D.FAERDIG, R: D.ROS, PA: D.PAASKE, FO: D.FORM }));
    D.RANGER.forEach(function (o) {
        o.stoffer.forEach(function (a) { o.stoffer.forEach(function (b) { if (s[a].kp < s[b].kp) tekster.push(D.forklar(a, b)); }); });
    });
    var falskP = function (kp, gas) { return { kp: function () { return kp; }, antalGas: function () { return gas; }, N: 10 }; };
    var tempTekster = [];
    ["ethanol", "ethanol uden hydrogenbindinger", "ethan-1,2-diol", "2-methylpropan"].forEach(function (n) {
        tempTekster.push(D.tempFejl(n, -100, falskP(0, 0)), D.tempFejl(n, -100, falskP(-150, 10)), D.tempFejl(n, -100, falskP(-150, 4)));
    });
    tekster = tekster.concat(tempTekster);
    alleId.forEach(function (id) { tekster = tekster.concat(D.maalHint(s[id])); });
    R.opgaver.forEach(function (o, i) { R.vaelg(i); R.hintTrin().forEach(function (t) { tekster.push(t); }); tekster.push(R.kortTekst()); });
    E.opgaver.forEach(function (o, i) { E.vaelg(i); tekster.push(E.kortTekst()); });
    tekster.push(d.getElementById("teori").textContent, d.body.textContent);
    var tanke = tekster.filter(function (t) { return /[–—]/.test(t); });
    paastand("ingen tankestreger", tanke.length === 0, tanke.slice(0, 2).join(" | "));
    var en = tekster.filter(function (t) { return /[A-Za-z)]¹[⁺⁻]|[A-Za-z)]1[+−](?![\d ])/.test(t); });
    paastand("ingen 1+ eller 1− som ladning", en.length === 0, en.slice(0, 2).join(" | "));
    var ascii = tekster.filter(function (t) { return ASCII_ORD.test(t); });
    paastand("ingen ord uden æ, ø og å", ascii.length === 0, ascii.slice(0, 2).join(" | "));
    var natron = tekster.filter(function (t) { return /natronlud/i.test(t); });
    paastand("intet natronlud", natron.length === 0);
    var indforstaaet = tekster.filter(function (t) { return /(^|[.?!] )(Begge|Her|Også her|De har|Den har)\b/.test(t); });
    paastand("intet indforstået: ingen tekst begynder en sætning med Begge, Her, Også her, De har eller Den har", indforstaaet.length === 0, indforstaaet.slice(0, 2).join(" | "));
    var lange = [];
    D.PAR.forEach(function (p) { p.svar.forEach(function (sv) { if (sv.t.length > 70) lange.push(sv.t); if (sv.f && sv.f.length > 110) lange.push(sv.f); }); });
    D.E_MAAL.forEach(function (o) {
        (o.svar || []).forEach(function (sv) { if (sv.t.length > 45) lange.push(sv.t); if ((sv.f || sv.mangler || "").length > 110) lange.push(sv.f || sv.mangler); });
        o.hint.forEach(function (h) { if (h.length > 120) lange.push(h); });
    });
    tempTekster.forEach(function (t) { if (t.length > 130) lange.push(t); });
    paastand("korte tekster: svar højst 70 tegn (fane 1: 45), forklaringer højst 110, hint højst 120", lange.length === 0, lange.slice(0, 2).join(" | "));

    /* ------------------------------------------------------------------ */
    overskrift("8. Layoutet");
    var ramme = document.getElementById("ramme");
    var maal = [[1100, 700], [1300, 820], [1500, 900], [1600, 950]];
    var lFejl = [], kFejl = [];
    function over(a, b) { return a.x < b.x + b.b && b.x < a.x + a.b && a.y < b.y + b.h && b.y < a.y + a.h; }
    /* Kortets hoejde med hver af teksterne i den nederste raekke (det laengste
       hint, den laengste forklaring) maa ikke vaere hoejere end pladsen, der
       er sat af til det */
    function kortOK(F, n, navn, tekster) {
        var e = d.getElementById(F.navn + "-skort"), zone = F.kortZone();
        var h = e.offsetHeight, hvor = "";
        (tekster || []).forEach(function (t) {
            F.besked('<span class="b-maerke">Ikke rigtigt</span> ' + NK.html(t), "skidt");
            if (e.offsetHeight > h) { h = e.offsetHeight; hvor = t.slice(0, 30); }
        });
        F.naesteLinje("", "");
        if (h > zone) kFejl.push(n + " " + navn + " " + h + ">" + zone + " " + hvor);
    }
    maal.forEach(function (m) {
        var n = m.join("×");
        ramme.style.width = m[0] + "px";
        ramme.style.height = m[1] + "px";
        NK.visFane("fane-e");
        /* Kortet i alle dele af alle fire opgaver */
        E.vaelg(0); E.tilpas(); E.layout();
        kortOK(E, n, "kog", D.E_MAAL[0].hint.concat(tempTekster.slice(0, 6)));
        E.loest("selv", D.E_MAAL[0].loest, "Ethanol koger ved 78 °C."); kortOK(E, n, "kog løst");
        E.vaelg(1); kortOK(E, n, "brydes", D.E_MAAL[1].hint.concat(D.E_MAAL[1].svar.map(function (sv) { return sv.f || sv.mangler; })));
        E.loest("selv", D.E_MAAL[1].loest); kortOK(E, n, "brydes løst");
        E.vaelg(2); kortOK(E, n, "hvilket", D.E_MAAL[2].hint.concat([D.E_MAAL[2].klik.HC, D.E_MAAL[2].klik.O]));
        E.loest("selv", D.E_MAAL[2].loest); kortOK(E, n, "hvilket løst");
        E.vaelg(3); E.valgKlik(0); kortOK(E, n, "uden", D.E_MAAL[3].hint.concat(tempTekster.slice(3, 6)));
        E.loest("selv", "Dit gæt holdt ikke. " + D.E_MAAL[3].loest); kortOK(E, n, "uden løst");
        E.vaelg(3);
        var l = E.lay, Lp = l.lup, top = E.top();
        var gk = d.getElementById("e-skort").getBoundingClientRect(), scE = d.querySelector("#fane-e .scene").getBoundingClientRect();
        if (gk.bottom - scE.top > l.baand.y - 40) lFejl.push(n + " gættet er for højt");
        E.valgKlik(0);
        E.tilpas(); E.layout();
        l = E.lay; Lp = l.lup;
        if (Lp.y + Lp.r > l.baand.y || Lp.y - Lp.r < top) lFejl.push(n + " luppen under kortet");
        if (Lp.r < 150) lFejl.push(n + " luppen er lille " + Math.round(Lp.r));
        if (l.termo.top < top - 12) lFejl.push(n + " termometeret under kortet");
        var K = l.kammer, G = l.glas;
        var Bm = NK.Tegn.ballonMaal(G.mund.x, G.mund.y, G.s, 1.6), ballonTop = Bm.y - Bm.r * 1.1;
        var kasseKammer = { x: K.x, y: ballonTop, b: K.b, h: l.bordY - ballonTop };
        if (over(kasseKammer, { x: Lp.x - Lp.r, y: Lp.y - Lp.r, b: 2 * Lp.r, h: 2 * Lp.r })) lFejl.push(n + " kammeret rører luppen");
        var sig = E.signatur.getBoundingClientRect(), ko = E.kontakt.getBoundingClientRect(), sc = d.querySelector("#fane-e .scene").getBoundingClientRect();
        var sigK = { x: sig.left - sc.left, y: sig.top - sc.top, b: sig.width, h: ko.bottom - sig.top };
        if (sigK.y < top - 2) lFejl.push(n + " forklaringen under kortet");
        if (sigK.y + sigK.h > ballonTop - 4) lFejl.push(n + " forklaringen eller kontakten rører ballonen");
        if (sigK.x + sigK.b > Lp.x - Lp.r * 0.7) lFejl.push(n + " forklaringen rører luppen");
        if (l.termo.x - 60 < Lp.x + Lp.r) lFejl.push(n + " termometeret rører luppen");

        NK.visFane("fane-s");
        S.maalt = {};
        S.vaelg(4);
        S.tilpas(); S.layout();
        var a = S.lay.kol.a, b = S.lay.kol.b, topS = S.top();
        if (a.lup.x + a.lup.r > b.lup.x - b.lup.r) lFejl.push(n + " lupperne rører hinanden");
        if (a.lup.y - a.lup.r - 46 < topS - 4) lFejl.push(n + " navnet over luppen er under kortet");
        var Ba = NK.Tegn.ballonMaal(a.glas.mund.x, a.glas.mund.y, a.glas.s, 1.6);
        if (a.lup.y + a.lup.r > Ba.y - Ba.r * 1.1) lFejl.push(n + " luppen rører ballonen");
        if (a.lup.r < 105) lFejl.push(n + " lupperne er små " + Math.round(a.lup.r));
        if (b.lup.x + b.lup.r > S.lay.termo.x - 60) lFejl.push(n + " luppen rører termometeret");
        S.valgKlik(1);
        kortOK(S, n, "mål", D.maalHint(s.hexan).concat(tempTekster.slice(6, 9)));
        S.visSvar(); S.visSvar();
        kortOK(S, n, "begge målt");
        D.PAR.forEach(function (p, i) {
            S.maalt = {}; S.vaelg(i); S.valgKlik(0); S.visSvar(); S.visSvar(); S.knap();
            kortOK(S, n, "spm " + p.id, p.hint.concat(p.svar.map(function (sv) { return sv.f || ""; })));
            S.loest("selv", p.loest, S.svarTekst(S.delNu())); kortOK(S, n, "løst " + p.id);
        });

        NK.visFane("fane-r");
        [0, 4, 11].forEach(function (i) {
            R.vaelg(i);
            R.tilpas(); R.layout();
            var t = d.getElementById("r-tavle").getBoundingClientRect();
            var scR = d.querySelector("#fane-r .scene").getBoundingClientRect();
            if (t.top - scR.top < R.top() - 2) lFejl.push(n + " tavlen under kortet");
            if (R.lay.akseY + 30 > R.lay.baand.y) lFejl.push(n + " aksen er ude af scenen");
            d.querySelectorAll("#r-pladser .stofkort").forEach(function (kort) {
                if (kort.scrollHeight > kort.clientHeight + 2) lFejl.push(n + " kortet er for lavt " + R.opgaver[i].id);
            });
            var fl = [];
            R.opg.o.stoffer.forEach(function (x) { R.opg.o.stoffer.forEach(function (y) { if (s[x].kp < s[y].kp) fl.push(D.forklar(x, y)); }); });
            kortOK(R, n, "rangér " + R.opgaver[i].id, R.hintTrin().concat(fl));
        });
        ["#fane-e .panel", "#fane-s .panel", "#fane-r .panel"].forEach(function (sel, i) {
            NK.visFane(["fane-e", "fane-s", "fane-r"][i]);
            var p = d.querySelector(sel);
            if (p.scrollWidth > p.clientWidth + 1) lFejl.push(n + " panelet er for bredt");
        });
    });
    paastand("kortet er aldrig højere end pladsen over luppen, heller ikke med det længste hint eller den længste forklaring", kFejl.length === 0, kFejl.slice(0, 4).join(", "));
    paastand("luppen, kammeret, termometeret, tavlen og kortene kan være der under kortet fra 1100 × 700 til 1600 × 950", lFejl.length === 0, lFejl.slice(0, 5).join(", "));
    ramme.style.width = "1300px";
    ramme.style.height = "820px";
    var smaa = [];
    ["fane-e", "fane-s", "fane-r"].forEach(function (f) {
        NK.visFane(f);
        d.querySelectorAll("#" + f + " .panel *, #" + f + " .scene *").forEach(function (e) {
            if (!e.childNodes.length || !e.textContent.trim() || e.offsetParent === null) return;
            var egen = Array.prototype.some.call(e.childNodes, function (x) { return x.nodeType === 3 && x.textContent.trim(); });
            if (!egen) return;
            var px = parseFloat(W.getComputedStyle(e).fontSize);
            if (px < 11.5) smaa.push(e.className + " " + px);
        });
    });
    paastand("ingen tekst under 11,5 px", smaa.length === 0, smaa.slice(0, 4).join(", "));
    NK.visFane("fane-e");
}
