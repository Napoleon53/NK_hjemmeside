<body>

<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: navnene, kogepunkterne (bogens tal), at
   opløseligheden følger tommelfingerreglen, at strukturformlerne har
   de rigtige atomer og bindinger, at luppen giver én hydrogenbinding pr.
   par alkoholmolekyler, to pr. par syremolekyler og ingen ved alkaner,
   at teksterne er korte og skrevet med æ, ø og å, at alle opgaverne kan
   løses med musen (med forkerte svar, låsen og Vis svaret; fane 3 er
   bygget om i runde T11 27. nov. 2026 med tre opgaver i trin, intet panel,
   stiplede pladser og fri leg), og at
   kortet, pladen, instrumenterne og luppen kan være der fra 1100 × 620
   til 1600 × 950 (kortet måles i alle dele med hvert hint og hvert
   forkert svar).

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + String(note).replace(/</g, "&lt;") + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
function vent(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var NOEGLER = ["nk-sc4.7-n", "nk-sc4.7-k", "nk-sc4.7-v", "nk-sc4.7-vand-opg", "nk-sc4.7-stil", "nk-sc4.7-skema-k", "nk-sc4.7-skema-v"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|staa|paa|foerst|hoejre|oeverst|loest|proev\w*|spoerg\w*|faa|saa|naar|aaben|raekke\w*|groen\w*|roed|blaa|laengde|kaede\w*|oploes\w*|graense|stoerre|foelg\w*)\b/i;
var gemt = {};
var ramme = document.getElementById("ramme");
var trin = 0;

ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 1200); }
});

function koer() {
    var W = ramme.contentWindow;
    koerTest(W).catch(function (e) {
        fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl");
    }).then(function () {
        try {
            NOEGLER.forEach(function (n) {
                if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
            });
        } catch (e) { /* ingen hukommelse */ }
        vis();
    });
}

function koerF(X, sek) { for (var t = 0; t < sek; t += 1 / 60) X.opdater(1 / 60); }

async function koerTest(W) {
    var d = W.document, NK = W.NK, D = NK.Data, F = NK.Formel;
    var N = NK.sims["fane-n"], K = NK.sims["fane-k"], V = NK.sims["fane-v"];
    var aabnetPaa = (d.querySelector(".fane.aktiv") || {}).id;

    function rigtige(X) { var del = X.opg.del, ud = []; del.svar.forEach(function (s, i) { if (s.ok) ud.push(i); }); return ud; }
    function forkerte(X) { var del = X.opg.del, ud = []; del.svar.forEach(function (s, i) { if (!s.ok) ud.push(i); }); return ud; }
    function roed(X) { return /skidt/.test(X.el.status.className); }
    function blinker(X) { return X.el.skort.classList.contains("blink"); }
    function nulBlink(X) { X.el.skort.classList.remove("blink"); }
    function visFane(id) { NK.visFane(id); }
    function mus(X, type, x, y) {
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.PointerEvent(type, { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y, button: 0, pointerId: 1 }));
    }
    function klik(X, x, y) {
        mus(X, "pointermove", x, y); mus(X, "pointerdown", x, y); mus(X, "pointerup", x, y);
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.MouseEvent("click", { bubbles: true, cancelable: true, clientX: r.left + x, clientY: r.top + y, button: 0 }));
    }
    function midt(R) { return { x: R.x + R.b / 2, y: R.y + R.h / 2 }; }
    function klikR(X, R) { var p = midt(R); klik(X, p.x, p.y); }
    function traek(X, fra, til) {
        mus(X, "pointermove", fra.x, fra.y); mus(X, "pointerdown", fra.x, fra.y);
        for (var i = 1; i <= 6; i++) mus(X, "pointermove", fra.x + (til.x - fra.x) * i / 6, fra.y + (til.y - fra.y) * i / 6);
        mus(X, "pointerup", til.x, til.y);
        var r = X.L.canvas.getBoundingClientRect();
        X.L.canvas.dispatchEvent(new W.MouseEvent("click", { bubbles: true, cancelable: true, clientX: r.left + til.x, clientY: r.top + til.y, button: 0 }));
    }
    function traekGruppe(X, g) { traek(X, midt(X.plade.r.tiles[g]), midt(X.plade.r.formel)); }
    function klikKnap(e) { e.dispatchEvent(new W.MouseEvent("click", { bubbles: true, cancelable: true })); }
    function valgKnap(X, j) { var k = X.el.skort.querySelector('[data-valg="' + j + '"]'); if (k) klikKnap(k); return !!k; }
    function videre(X) { var k = X.el.skort.querySelector("[data-videre]"); if (k) klikKnap(k); return !!k; }
    function svarMed(X, t) { var j = -1; X.opg.del.svar.forEach(function (sv, i) { if (sv.t === t) j = i; }); return valgKnap(X, j); }
    function svarRigtigt(X) { rigtige(X).forEach(function (j) { valgKnap(X, j); }); klikKnap(X.el.indsend); }
    function plus(X) { klikR(X, X.plade.r.plus); }
    function minus(X) { klikR(X, X.plade.r.minus); }

    /* ================================================================ */
    overskrift("1. Kemien: navne, kogepunkter og opløselighed");
    var NAVNE = {
        "H1": "methan", "H2": "ethan", "H3": "propan", "H4": "butan", "H8": "octan",
        "OH1": "methanol", "OH2": "ethanol", "OH3": "propan-1-ol", "OH4": "butan-1-ol", "OH8": "octan-1-ol",
        "COOH0": "methansyre", "COOH1": "ethansyre", "COOH3": "butansyre", "COOH7": "octansyre"
    };
    Object.keys(NAVNE).forEach(function (k) {
        var g = k.replace(/\d+$/, ""), n = +k.match(/\d+$/)[0];
        paastand(k + " hedder " + NAVNE[k], D.stof(g, n).navn === NAVNE[k], D.stof(g, n).navn);
    });
    paastand("COOH på en kæde med 2 carbonatomer er propansyre (C i COOH tæller med)", D.stof("COOH", 2).navn === "propansyre" && D.stof("COOH", 2).C === 3);
    paastand("påskeæggene: H−OH er vand og H−H dihydrogen", D.stof("OH", 0).id === "vand" && D.stof("H", 0).id === "dihydrogen" && !D.stof("OH", 0).organisk);
    paastand("kendte navne fra bogen: træsprit, eddikesyre, smørsyre, myresyre", D.stof("OH", 1).kendt === "træsprit" && D.stof("COOH", 1).kendt === "eddikesyre" && D.stof("COOH", 3).kendt === "smørsyre" && D.stof("COOH", 0).kendt === "myresyre");
    paastand("bogens kogepunkter: methan −162, ethan −89, propan −42, butan −1 °C", D.stof("H", 1).kp === -162 && D.stof("H", 2).kp === -89 && D.stof("H", 3).kp === -42 && D.stof("H", 4).kp === -1);
    paastand("bogens kogepunkter: methanol 65, ethanol 78, methansyre 101 °C", D.stof("OH", 1).kp === 65 && D.stof("OH", 2).kp === 78 && D.stof("COOH", 0).kp === 101);
    ["H", "OH", "COOH"].forEach(function (g) {
        var op = true;
        for (var c = 2; c <= 8; c++) if (D.KP[g][c] <= D.KP[g][c - 1]) op = false;
        paastand(D.KLASSE[g] + ": kogepunktet stiger med kæden", op);
    });
    var hoejere = true;
    for (var c = 1; c <= 8; c++) if (!(D.KP.OH[c] > D.KP.H[c] && D.KP.COOH[c] > D.KP.OH[c])) hoejere = false;
    paastand("med samme antal C: alkan < alkohol < carboxylsyre", hoejere);
    paastand("opgave 2.4: butan-1-ol og ethansyre koger begge ved 118 °C, og ingen anden alkohol gør", D.stof("OH", 4).kp === 118 && D.stof("COOH", 1).kp === 118 && [1, 2, 3, 5, 6, 7, 8].every(function (n) { return D.stof("OH", n).kp !== 118; }));
    paastand("opgave 2.3: pentan er den korteste alkan, der er en væske ved 20 °C", D.stof("H", 4).tilstand === "gas" && D.stof("H", 5).tilstand === "væske");
    paastand("bogens tabel i 4.5: ethanol ja, butan-1-ol delvist, octan-1-ol nej, glycerol ja", D.stof("OH", 2).opl === "ja" && D.stof("OH", 4).opl === "delvist" && D.stof("OH", 8).opl === "nej" && D.stof("glycerol", 3).opl === "ja");
    paastand("alkaner kan ikke opløses i vand", [1, 2, 3, 4, 5, 6, 7, 8].every(function (n) { return D.stof("H", n).opl === "nej"; }));
    paastand("carboxylsyrer: ja til 3 C, delvist ved 4, nej fra 5 C", D.stof("COOH", 2).opl === "ja" && D.stof("COOH", 3).opl === "delvist" && D.stof("COOH", 4).opl === "nej");
    paastand("ingen syre har mere end 8 carbonatomer", D.maksN("COOH") === 7 && D.maksN("OH") === 8);

    /* Strukturformlerne: rigtige atomer og bindinger */
    var formelFejl = [];
    D.alle().concat([D.stof("glycerol", 3)]).forEach(function (s) {
        var G = F.graf(s, "alle"), n = { C: 0, H: 0, O: 0 }, val = G.atomer.map(function () { return 0; });
        G.atomer.forEach(function (a) { n[a.s]++; });
        G.bindinger.forEach(function (b) { val[b.a] += b.orden; val[b.b] += b.orden; });
        var forventH = s.id === "glycerol" ? 8 : (s.g === "H" ? 2 * s.C + 2 : (s.g === "OH" ? 2 * s.C + 2 : 2 * s.C));
        var forventO = s.id === "glycerol" ? 3 : (s.g === "H" ? 0 : (s.g === "OH" ? 1 : 2));
        if (s.id === "dihydrogen") { forventH = 2; forventO = 0; }
        if (n.C !== s.C || n.H !== forventH || n.O !== forventO) formelFejl.push(s.id + " atomer " + JSON.stringify(n));
        G.atomer.forEach(function (a, i) {
            var v = { C: 4, O: 2, H: 1 }[a.s];
            if (val[i] !== v) formelFejl.push(s.id + " " + a.s + " har " + val[i] + " bindinger");
        });
    });
    paastand("stregformlerne har de rigtige atomer, og C har 4, O 2 og H 1 binding", formelFejl.length === 0, formelFejl.slice(0, 3).join(" | "));
    var zigFejl = [];
    D.alle().forEach(function (s) {
        var G = F.graf(s, "zigzag");
        if (G.tekst) return;
        var c = G.atomer.filter(function (a) { return a.s === "C"; }).length;
        if (c !== s.C) zigFejl.push(s.id + " C " + c);
        G.bindinger.forEach(function (b) {
            var A = G.atomer[b.a], B = G.atomer[b.b], l = Math.hypot(A.x - B.x, A.y - B.y);
            if (Math.abs(l - 1) > 0.01) zigFejl.push(s.id + " binding " + l.toFixed(2));
        });
    });
    paastand("zigzagformlerne har alle carbonatomer og lige lange bindinger", zigFejl.length === 0, zigFejl.slice(0, 3).join(" | "));
    var oppe = [1, 2, 3, 4, 5, 6, 7].every(function (n) {
        var G = F.graf(D.stof("COOH", n), "zigzag"), od = G.atomer.filter(function (a) { return a.etiket === "O"; })[0], cc = G.grupper[0][0];
        return od && G.atomer[cc].x === od.x && od.y < G.atomer[cc].y;
    });
    paastand("zigzag: =O peger lige op fra carboxylcarbonatomet, som i bogen", oppe);

    /* Luppen */
    var parFejl = [];
    for (var n2 = 1; n2 <= 8; n2++) {
        if (NK.Lup.parBindinger(D.stof("H", n2)) !== 0) parFejl.push("alkan " + n2);
        if (NK.Lup.parBindinger(D.stof("OH", n2)) !== 1) parFejl.push("alkohol " + n2 + ": " + NK.Lup.parBindinger(D.stof("OH", n2)));
        if (n2 <= 7 && NK.Lup.parBindinger(D.stof("COOH", n2)) !== 2) parFejl.push("syre " + n2 + ": " + NK.Lup.parBindinger(D.stof("COOH", n2)));
    }
    if (NK.Lup.parBindinger(D.stof("COOH", 0)) !== 2) parFejl.push("methansyre");
    paastand("luppen: 0 hydrogenbindinger pr. par alkaner, 1 pr. par alkoholer, 2 pr. par syrer", parFejl.length === 0, parFejl.join(", "));
    /* Luppen paa fane 3 (runde T11b): eleven bygger selv hydrogenbindingerne */
    function lupV(s, R) { var l = new NK.LupVand(); l.saet(s, true); if (R) l.layout(R); return l; }
    function afs(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
    var pl = [["OH", 2, 1], ["OH", 5, 1], ["COOH", 3, 1], ["COOH", 0, 1], ["glycerol", 3, 3], ["H", 5, 0], ["H", 0, 0], ["OH", 0, 2]];
    var plFejl = pl.filter(function (p) { return lupV(D.stof(p[0], p[1])).antalSteder() !== p[2]; }).map(function (p) { return p[0] + p[1]; });
    paastand("luppen i vand: én plads til vand pr. H i en polær gruppe (alkohol 1, syre 1, glycerol 3, alkan 0)", plFejl.length === 0, plFejl.join(", "));
    var geoFejl = [];
    D.alle().concat([D.stof("glycerol", 3)]).forEach(function (s) {
        var md = lupV(s).md;
        md.steder.forEach(function (st) {
            var o = st.vand[0], dd = afs(st.h, o);
            if (o.s !== "O" || Math.abs(dd - 3) > 0.01) geoFejl.push(s.id + " H...O " + dd.toFixed(2));
            st.vand.slice(1).forEach(function (w) { if (afs(w, st.h) <= dd) geoFejl.push(s.id + ": vandets H peger mod gruppen"); });
            st.vand.forEach(function (w) {
                md.atomer.forEach(function (a) { if (afs(w, a) < (w.s === "H" && a.s === "H" ? 1.24 : 1.5)) geoFejl.push(s.id + ": vandet rører molekylet"); });
                md.steder.forEach(function (st2) { if (st2 !== st) st2.vand.forEach(function (w2) { if (afs(w, w2) < 1.2) geoFejl.push(s.id + ": to vandmolekyler rører"); }); });
            });
        });
    });
    paastand("luppen i vand: den stiplede linje går fra H i gruppen til O i vandet, vandets H peger væk, og intet rører", geoFejl.length === 0, geoFejl.slice(0, 3).join(" | "));
    function saetn(g, n) { return lupV(D.stof(g, n)).md.saetn.map(function (x) { return x.foer + " " + x.ord; }).join("|"); }
    paastand("luppen i vand: sætningerne er Kæden er upolær og OH-gruppen er polær", saetn("OH", 4) === "Kæden er upolær|OH-gruppen er polær", saetn("OH", 4));
    paastand("luppen i vand: en syre har COOH-gruppen er polær, en alkan Molekylet er upolært", /COOH-gruppen er polær/.test(saetn("COOH", 4)) && saetn("H", 5) === "Molekylet er upolært", saetn("H", 5));
    paastand("luppen i vand: glycerol har Alle tre OH-grupper er polære", saetn("glycerol", 3) === "Alle tre OH-grupper er polære");
    /* Molekylet, vandet paa alle pladser og saetningerne er inde i luppen,
       ved siden af bakken, og intet atom staar ned i en saetning */
    var lupUd = [];
    D.alle().concat([D.stof("glycerol", 3)]).forEach(function (s) {
        [[440, 140], [470, 235], [600, 320]].forEach(function (st) {
            var R = { x: 10, y: 10, b: st[0], h: st[1] }, l = lupV(s, R), L = l.cache, md = l.md;
            var bakkeX = L.bakke.x + L.bakke.b;
            var atomer = md.atomer.concat([].concat.apply([], md.steder.map(function (x) { return x.vand; })));
            atomer.forEach(function (a) {
                var x = L.ox + a.x * L.r, y = L.oy + a.y * L.r, rr = L.r * (a.s === "H" ? 0.62 : 1);
                if (x - rr < bakkeX || x + rr > R.x + R.b || y - rr < R.y || y + rr > R.y + R.h) lupUd.push(s.id + " " + st.join("×") + " atom");
            });
            L.saetn.forEach(function (sl) {
                if (sl.tx < bakkeX || sl.felt.x + sl.felt.b > R.x + R.b + 1 || sl.felt.y + 26 > R.y + R.h) lupUd.push(s.id + " " + st.join("×") + " sætning");
                var x0 = Math.min(sl.x0, sl.tx), x1 = Math.max(sl.x1, sl.felt.x + sl.felt.b);
                atomer.forEach(function (a) {
                    var x = L.ox + a.x * L.r, y = L.oy + a.y * L.r, rr = L.r * (a.s === "H" ? 0.62 : 1);
                    if (x + rr > x0 && x - rr < x1 && y + rr > sl.y - 4) lupUd.push(s.id + " " + st.join("×") + " atom i sætningen");
                });
            });
        });
    });
    paastand("luppen i vand: molekylet, vandet og sætningerne er inde i luppen, også i en lille lup", lupUd.length === 0, lupUd.slice(0, 4).join(", "));
    var kl = [2, 4, 6, 8].map(function (n) { return NK.Lup.kontaktLaengde(D.stof("H", n)); });
    paastand("luppen: kontaktfladerne bliver længere med kæden", kl[0] < kl[1] && kl[1] < kl[2] && kl[2] < kl[3], kl.map(function (x) { return x.toFixed(1); }).join(" "));

    /* ================================================================ */
    overskrift("2. Teksterne: korte, med æ, ø og å, uden tankestreger");
    var tekster = [], langt = [];
    function graense(t, max, hvad) { tekster.push(t); if (t.length > max) langt.push(hvad + " " + t.length + ">" + max + ": " + t.slice(0, 40)); }
    var alleTjek = [["H", 0], ["H", 1], ["H", 4], ["H", 5], ["H", 8], ["OH", 0], ["OH", 1], ["OH", 3], ["OH", 4], ["OH", 8], ["COOH", 0], ["COOH", 1], ["COOH", 3], ["COOH", 4], ["COOH", 7]];
    D.N_MAAL.concat(D.K_MAAL).forEach(function (o) {
        graense(o.loest, 160, o.id + " løst");
        o.dele.forEach(function (del) {
            graense(del.tekst, del.type === "spm" ? 105 : 95, o.id + " tekst");
            (del.hint || []).forEach(function (h) { graense(h, 100, o.id + " hint"); });
            if (del.set) graense(del.set, 160, o.id + " set");
            if (del.setFn) alleTjek.forEach(function (p) { graense(del.setFn(D.stof(p[0], p[1])), 160, o.id + " set"); });
            if (del.tjek) alleTjek.forEach(function (p) { var f = del.tjek(D.stof(p[0], p[1])); if (f) graense(f, 110, o.id + " tjek"); });
            (del.svar || []).forEach(function (s) { graense(s.t, 34, o.id + " svar"); if (s.f) graense(s.f, 110, o.id + " forkert"); });
        });
    });
    [D.gruppeLaast, D.laengdeLaast, D.alleLaast, D.kortest, D.laengst, D.trakForbi, D.PAASKE.vand, D.PAASKE.dihydrogen, D.FAERDIG.n, D.FAERDIG.k, D.FAERDIG.v].forEach(function (t) { graense(t, 110, "besked"); });
    /* Fane 3 (runde T11): trinene i D.OPG_VAND. Tekster, der afhaenger af
       molekylet, proeves med flere molekyler. */
    var vandProever = [["OH", 4], ["OH", 5], ["OH", 8], ["COOH", 0], ["COOH", 3], ["COOH", 4], ["COOH", 7], ["glycerol", 3]];
    function medStof(p) { var sim = Object.create(V); sim.stofNu = function () { return D.stof(p[0], p[1]); }; sim.n = p[1]; return sim; }
    function tAf(v, sim) { return typeof v === "function" ? v(sim) : v; }

    paastand("COOH på kæden: propansyre og et grønt kort, hvor C i COOH tæller med", V.stofNu().navn === "propansyre" && groent() && /C i COOH-gruppen tæller med/.test(vKort()) && /Propansyre har 3 carbonatomer/.test(vKort()));
    vVidere();
    paastand("trin 2: tommelfingerreglen kommer frem, glasset er stadig skjult", O.trinNr === 1 && !V.skjult("regel") && V.skjult("glas"));
    paastand("trin 2: kortet beder konkret om den korteste carboxylsyre med to lag", /korteste carboxylsyre, der giver to lag/.test(vKort()) && !/skjult/i.test(vKort()));
    klikKnap(O.el.indsend);
    paastand("propansyre er forkert (blandes med vand)", vRoed() && /blandes/.test(vBesked()), vBesked());
    plus(V); klikKnap(O.el.indsend);
    paastand("butansyre ligger på grænsen (forkert)", vRoed() && /grænsen/.test(vBesked()), vBesked());
    plus(V); plus(V); klikKnap(O.el.indsend);
    paastand("hexansyre er for lang: der findes en kortere", vRoed() && /kortere/.test(vBesked()), vBesked());
    minus(V); klikKnap(O.el.indsend);
    paastand("pentansyre er rigtig, og glasset kommer frem med to lag", groent() && !V.skjult("glas") && D.oplNoegle(V.glas.stof) === "nej" && /5 carbonatomer/.test(vKort()));
    vVidere();
    paastand("opgave 3: glycerol, glasset er skjult, og bakken har vand", O.nr === 2 && V.stofNu().id === "glycerol" && V.skjult("glas") && V.lup.modus.vand && V.lup.antalSteder() === 3);
    var P3 = lupP();
    vandTil(P3.kaede[1]); vVent(1);
    paastand("glycerol: vand på kæden glider tilbage", V.lup.antalFast() === 0 && /kæden/.test(vBesked()));
    vandTil(P3.steder[0]); vandTil(P3.steder[1]); vVent(1.2);
    paastand("to af tre OH-grupper: kortet venter", O.tilstand === "trin" && V.lup.antalFast() === 2);
    vandTil(P3.steder[2]); vVent(1.2);
    paastand("vand ved alle tre OH-grupper: grønt kort", groent() && /Alle tre OH-grupper/.test(vKort()));
    vVidere();
    paastand("trin 2: to korte svar i kortet (Ét lag og To lag), og glasset er skjult", O.trinNr === 1 && V.skjult("glas") && O.trin().svar.length === 2 && !!V.e.skort.querySelector('[data-nr="1"]') && /Ét lag/.test(vKort()) && /To lag/.test(vKort()));
    vSvar("To lag");
    paastand("et svar vælger kun", !vRoed() && O.tilstand === "trin");
    klikKnap(O.el.indsend);
    paastand("To lag er forkert med forklaring, og glasset er stadig skjult", vRoed() && /1 carbonatom pr. OH-gruppe/.test(vBesked()) && V.skjult("glas"), vBesked());
    vSvar("Ét lag"); klikKnap(O.el.indsend); vVent(1);
    paastand("Ét lag er rigtigt: grønt kort, og glasset kommer frem med ét lag", groent() && !V.skjult("glas") && D.oplNoegle(V.glas.stof) === "ja");
    paastand("efter sidste opgave fører knappen til fri leg", /fri leg/i.test(vKort()));
    vVidere();
    vp = V.visPaaPladen();
    paastand("fri leg: alle grupperne, skifteren og knapperne er fremme, og der er ingen grøn knap", O.erFri() && vp.stil && vp.kontrol && vp.tiles.length === 3 && !V.e.skort.querySelector("[data-videre]"));
    paastand("fri leg: vandet i luppen kan trækkes", V.lup.modus.vand);
    paastand("alle tre er løst", O.alleLoest());
    traekGruppe(V, "H"); vVent(0.5);
    paastand("fri leg: −H giver en alkan, og glasset viser to lag", V.stofNu().klasse === "alkan" && D.oplNoegle(V.glas.stof) !== "ja");
    var P4 = lupP();
    vandTil(P4.kaede[0]); vVent(0.5);
    paastand("fri leg: vand på en alkan glider tilbage med en besked om den polære gruppe", V.lup.antalFast() === 0 && /polær gruppe/.test(vKort()), vKort());
    klikKnap(V.e.skort.querySelector(".sk-luk"));
    paastand("fri leg: det røde kryds lukker kortet", V.e.skort.hidden);
    klikKnap(O.el.forfra);
    paastand("Start forfra giver opgave 1 med trinene igen", O.nr === 0 && O.trinNr === 0 && V.skjult("lup") && V.stofNu().navn === "ethanol" && !V.e.skort.hidden && V.lup.antalFast() === 0);
    klikKnap(O.el.fri);
    paastand("Fri leg: alt kan bruges, og kortet har et rødt kryds", O.erFri() && !!V.e.skort.querySelector(".sk-luk"));
    klikKnap(O.el.fri);
    paastand("Tilbage til opgaverne: opgave 1 igen", !O.erFri() && O.nr === 0);

    /* Vis svaret løser hver opgave på fane 3 */
    O.opg.forEach(function (o, i) {
        O.aabn(i, true);
        for (var n = 0; n < 60 && !(O.tilstand === "bliv" && O.trinNr === o.trin.length - 1); n++) {
            if (O.tilstand === "bliv") O.videre(); else O.hjaelpKlik();
            vVent(0.6);
        }
        paastand("Vis svaret løser fane-v " + o.navn, O.tilstand === "bliv" && O.trinNr === o.trin.length - 1);
    });

    /* Vis svaret i alle opgaver */
    [["fane-n", N], ["fane-k", K]].forEach(function (x) {
        var X = x[1];
        visFane(x[0]); X.tilpas(); X.layout();
        X.opgaver.forEach(function (o, i) {
            X.vaelg(i);
            for (var n = 0; n < 30 && !X.faerdig; n++) { X.knap(); koerF(X, 0.05); }
            paastand("Vis svaret løser " + x[0] + " " + o.navn, X.faerdig);
        });
    });

    /* ================================================================ */
    overskrift("6. Skærmstørrelser: kortet og tingene kan være der");
    var STR = [[1100, 620], [1280, 720], [1400, 860], [1600, 950]];
    for (var si = 0; si < STR.length; si++) {
        var bb = STR[si][0], hh = STR[si][1];
        ramme.style.width = bb + "px";
        ramme.style.height = hh + "px";
        await vent(300);
        var problem = [];
        [["fane-n", N], ["fane-k", K]].forEach(function (x) {
            var X = x[1];
            visFane(x[0]);
            X.tilpas();
            X.layout();
            X.opgaver.forEach(function (o, i) {
                X.vaelg(i);
                function maal(hvad) {
                    var r = X.el.skort.getBoundingClientRect(), c = X.L.canvas.getBoundingClientRect();
                    var bund = r.bottom - c.top;
                    if (bund > 10 + X.kortZone() + 2) problem.push(x[0] + " " + o.id + " " + hvad + " " + Math.round(bund) + ">" + (10 + X.kortZone()));
                }
                for (var di = 0; di < o.dele.length; di++) {
                    maal("del " + di);
                    var h2 = X.hintNu();
                    for (var kk = 0; kk < h2.length; kk++) { X.knap(); maal("del " + di + " hint " + (kk + 1)); }
                    if (X.erSpm()) {
                        forkerte(X).forEach(function (j) { X.svarValg(j); X.indsendKlik(); maal("del " + di + " forkert " + j); });
                    } else if (X.opg.del.indsend) {
                        X.indsendKlik(); maal("del " + di + " indsend");
                    }
                    X.visSvar();
                    maal("del " + di + " svar");
                    if (X.venter) X.knap();
                }
            });
            var L = X.lay, pr = X.plade.r, kz = 10 + X.kortZone();
            var ud = [];
            if (L.plade.y < kz) ud.push("pladen under kortet");
            if (L.plade.y + L.plade.h > L.H) ud.push("pladen nederst");
            if (pr.formel.h < 70) ud.push("formlen " + Math.round(pr.formel.h));
            if (pr.hylde.y - (pr.minus.y + pr.minus.h) < 36) ud.push("plads til skiltet under +");
            ["H", "OH", "COOH"].forEach(function (g) { var t = pr.tiles[g]; if (t.x < L.plade.x || t.x + t.b > L.plade.x + L.plade.b) ud.push("gruppen " + g); });
            if (pr.minus.x < L.plade.x + 4 || pr.plus.x + pr.plus.b > L.plade.x + L.plade.b - 4) ud.push("knapperne");
            if (pr.stilAlle.x < L.plade.x + 120) ud.push("skifteren over titlen");
            if (X.plade.skala.alle < 26) ud.push("formlen er lille: " + X.plade.skala.alle.toFixed(1) + " px pr. binding");
            if (L.lup) {
                if (L.lup.y - 26 < kz) ud.push("luppen under kortet");
                /* Paa fane 3 er luppen med vilje lille (brugeren 13. nov. 2026) */
                if (L.lup.h < (L.regel ? 120 : 180)) ud.push("luppen er lav: " + Math.round(L.lup.h));
                if (L.lup.y + L.lup.h + 30 > L.H) ud.push("signaturen under luppen");
                if (L.instr.x + L.instr.b > L.lup.x) ud.push("instrumentet ind i luppen");
                if (L.plade.x + L.plade.b > L.instr.x) ud.push("pladen ind i instrumentet");
            }
            if (L.maskine && L.maskine.x + L.maskine.b > L.W) ud.push("navnemaskinen");
            if (L.regel) {
                if (L.regel.y + L.regel.h + 24 > L.lup.y) ud.push("oversigten ind i luppens titel");
                if (L.regel.x < L.instr.x + L.instr.b) ud.push("oversigten ind i glasset");
                if (L.regel.b < 200) ud.push("oversigten er smal: " + Math.round(L.regel.b));
            }
            paastand(bb + " × " + hh + " " + x[0] + ": pladen, instrumentet og luppen er på plads", ud.length === 0, ud.join(" | "));
        });
        paastand(bb + " × " + hh + ": kortet er inden for sin zone i alle dele af alle opgaver", problem.length === 0, problem.slice(0, 4).join(" | "));
        /* Fane 3: kortet i hvert trin med hvert hint, hvert forkert svar og det groenne kort */
        visFane("fane-v"); V.tilpas(); V.layout();
        var vprob = [];
        function vMaal(hvad) {
            var r = V.e.skort.getBoundingClientRect(), c = V.L.canvas.getBoundingClientRect();
            var bund = r.bottom - c.top;
            if (!V.e.skort.hidden && bund > V.kortZone() + 2) vprob.push(hvad + " " + Math.round(bund) + ">" + V.kortZone());
        }
        O.opg.forEach(function (o, i) {
            o.trin.forEach(function (t, j) {
                O.aabn(i, true);
                O.trinNr = j; O.nytTrin();
                vMaal(o.id + " " + j);
                for (var k = 0; k < 3; k++) { O.hjaelpKlik(); vMaal(o.id + " " + j + " hint " + (k + 1)); }
                O.hjaelp = 0; O.saetBesked("", "");
                if (t.type === "valg") t.svar.forEach(function (sv, q) { if (!sv.ok) { O.vaelg(q); O.indsendKlik(); vMaal(o.id + " " + j + " forkert " + q); } });
                if (t.type === "indsend") { V.saetMolekyle("COOH", 3); O.indsendKlik(); vMaal(o.id + " " + j + " indsend"); }
                O.visSvar(); vVent(0.2);
                vMaal(o.id + " " + j + " svar");
            });
        });
        O.friLeg(); vMaal("fri leg"); O.tilbage();
        paastand(bb + " × " + hh + " fane-v: kortet er inden for sin zone i alle trin", vprob.length === 0, vprob.slice(0, 4).join(" | "));
        var L3 = V.lay, pr3 = V.plade.r, ud3 = [];
        var rr = NK.el("vand-raekke").getBoundingClientRect(), kr = V.e.skort.getBoundingClientRect();
        if (rr.bottom > kr.top) ud3.push("rækken ind i kortet");
        if (L3.plade.y < V.kortZone()) ud3.push("pladen under kortet");
        if (L3.plade.y + L3.plade.h > L3.H) ud3.push("pladen nederst");
        if (L3.plade.x < 0 || L3.lup.x + L3.lup.b > L3.W) ud3.push("uden for siderne");
        if (L3.plade.x + L3.plade.b > L3.instr.x) ud3.push("pladen ind i glasset");
        if (L3.instr.x + L3.instr.b > L3.regel.x) ud3.push("glasset ind i reglen");
        if (L3.regel.y + L3.regel.h + 24 > L3.lup.y) ud3.push("reglen ind i luppens titel");
        if (L3.lup.y + L3.lup.h > L3.H) ud3.push("luppen nederst");
        if (L3.lup.h < 130) ud3.push("luppen er lav: " + Math.round(L3.lup.h));
        if (L3.regel.b < 250) ud3.push("reglen er smal: " + Math.round(L3.regel.b));
        if (pr3.formel.h < 70) ud3.push("formlen " + Math.round(pr3.formel.h));
        if (V.plade.skala.alle < 26) ud3.push("formlen er lille: " + V.plade.skala.alle.toFixed(1));
        ["H", "OH", "COOH"].forEach(function (g) { var t = pr3.tiles[g]; if (t.x < L3.plade.x || t.x + t.b > L3.plade.x + L3.plade.b) ud3.push("gruppen " + g); });
        /* Molekylerne i luppen er store nok til at laese atomsymbolerne (REGELSAET 45) */
        ["OH", 5, "COOH", 4, "glycerol", 3].forEach(function (x, q, arr) {
            if (q % 2) return;
            var l = lupV(D.stof(arr[q], arr[q + 1]), L3.lup);
            /* Kun i de tre stoerrelser fra REGELSAET (hoejde 700 og derover);
               i 1100 × 620 er det nok, at alt er inde i luppen (afsnit 1) */
            if (hh >= 700 && l.cache.r < 18) ud3.push(arr[q] + " i luppen er lille: r = " + l.cache.r.toFixed(1));
        });
        paastand(bb + " × " + hh + " fane-v: pladen, glasset, reglen og luppen er på plads", ud3.length === 0, ud3.join(" | "));
    }
    ramme.style.width = "1300px";
    ramme.style.height = "760px";

    /* ================================================================ */
    overskrift("Opgavelisten: titlerne låses op i takt (21. nov. 2026)");
    (function () {
        var X = N, sel = "#n-liste .opg-chip";
        function knapper() { return [].slice.call(d.querySelectorAll(sel)); }
        function tekster() { return knapper().map(function (c) { return c.textContent.trim(); }).join(" | "); }
        NK.visFane("fane-n");
        X.status.forEach(function (s) { s.loest = false; s.stjerne = false; });
        X.naaet = {};
        X.vaelg(0);
        var OP = X.opgaver, ch = knapper();
        paastand("ved start viser listen kun titlen på opgave 1; de andre er et nummer med en grå streg og kan ikke klikkes",
            ch.length === OP.length && ch.length > 2 && ch[0].textContent.indexOf(OP[0].navn) >= 0 && !ch[0].disabled &&
            ch.slice(1).every(function (c, j) { return c.disabled && c.classList.contains("laast") && !!c.querySelector(".hl-streg") && c.textContent.trim() === String(j + 2) && !c.title; }),
            tekster());
        ch[2].click();
        paastand("et klik på en låst opgave gør intet", X.nr === 0, X.nr);
        for (var n = 0; n < 40 && !X.faerdig; n++) { X.knap(); koerF(X, 0.05); }
        ch = knapper();
        paastand("når opgave 1 er løst (Vis svaret tæller som løst), kommer titlen på opgave 2 frem; de senere er stadig låst",
            X.faerdig && ch[1].textContent.indexOf(OP[1].navn) >= 0 && !ch[1].disabled &&
            ch.slice(2).every(function (c) { return c.disabled && !!c.querySelector(".hl-streg"); }), tekster());
        var sidste = OP.length - 1;
        X.status[sidste].loest = true; X.visListe();
        ch = knapper();
        paastand("en opgave, der er løst før (gemt i browseren), har sin titel og kan vælges",
            ch[sidste].textContent.indexOf(OP[sidste].navn) >= 0 && !ch[sidste].disabled, tekster());
        X.status.forEach(function (s) { s.loest = false; s.stjerne = false; });
        X.naaet = {};
        X.vaelg(0);
    })();
}
</script>
