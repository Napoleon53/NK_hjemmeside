<svg xmlns="http://www.w3.org/2000/svg" width="140" height="120" viewBox="0 0 140 120">
  <!-- Morter af porcelaen med pistil og lidt knust skal i bunden.
       Morterens aabning er ellipsen (70, 50) med radius 60 x 11.
       Den staar paa bordet paa y 116. -->
  <defs>
    <linearGradient id="porcelaen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3c7cb"/>
      <stop offset="0.3" stop-color="#fbfbf8"/>
      <stop offset="0.65" stop-color="#e8eaea"/>
      <stop offset="1" stop-color="#aeb3b8"/>
    </linearGradient>
    <linearGradient id="pistil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cdd1"/>
      <stop offset="0.4" stop-color="#fcfcfa"/>
      <stop offset="1" stop-color="#b3b8bd"/>
    </linearGradient>
    <radialGradient id="inde" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9ea3a8"/>
      <stop offset="1" stop-color="#d3d6d9"/>
    </radialGradient>
  </defs>

  <!-- Skygge paa bordet -->
  <ellipse cx="70" cy="115" rx="52" ry="4" fill="#000000" fill-opacity="0.35"/>

  <!-- Foden -->
  <path d="M44 102 L96 102 L101 113 Q70 118 39 113 Z" fill="url(#porcelaen)" stroke="#9aa0a6" stroke-width="1"/>

  <!-- Indersiden og det knuste pulver -->
  <ellipse cx="70" cy="50" rx="58" ry="10" fill="url(#inde)"/>
  <ellipse cx="70" cy="53" rx="38" ry="5" fill="#eee4cf"/>
  <g fill="#c9b18a">
    <circle cx="56" cy="52" r="1.2"/><circle cx="74" cy="54" r="1"/><circle cx="86" cy="52" r="1.3"/>
    <circle cx="64" cy="55" r="0.9"/><circle cx="92" cy="54" r="0.9"/>
  </g>

  <!-- Pistillen, der hviler i morteren -->
  <g transform="rotate(-34 84 50)">
    <rect x="77" y="-8" width="14" height="58" rx="7" fill="url(#pistil)" stroke="#9aa0a6" stroke-width="1"/>
    <ellipse cx="84" cy="50" rx="10" ry="9" fill="url(#pistil)" stroke="#9aa0a6" stroke-width="1"/>
    <rect x="80" y="-4" width="3" height="46" rx="1.5" fill="#ffffff" fill-opacity="0.7"/>
  </g>

  <!-- Skaalen foran -->
  <path d="M10 50 A60 11 0 0 0 130 50 Q128 94 92 103 L48 103 Q12 94 10 50 Z" fill="url(#porcelaen)" stroke="#9aa0a6" stroke-width="1.2"/>
  <ellipse cx="70" cy="50" rx="60" ry="11" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <path d="M22 62 Q24 84 42 94" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round"/>
  <!-- Tuden -->
  <path d="M124 45 Q133 45 134 50 Q132 54 127 54" fill="#f1f2f0" stroke="#9aa0a6" stroke-width="1"/>
</svg>
