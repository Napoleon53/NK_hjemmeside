  <path d="M26 30 L52 39 L52 65 L26 55 Z" fill="url(#venstre)" stroke="#7a4a1b" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M52 39 L76 28 L76 54 L52 65 Z" fill="url(#hoejre)" stroke="#7a4a1b" stroke-width="0.9" stroke-linejoin="round"/>
