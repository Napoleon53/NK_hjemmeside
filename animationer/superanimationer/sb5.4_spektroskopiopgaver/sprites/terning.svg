<svg xmlns="http://www.w3.org/2000/svg" width="100" height="86" viewBox="0 0 100 86">
  <!-- Bouillonterning paa sin udfoldede guldfolie, set skraat fra oven. -->
  <defs>
    <linearGradient id="folie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.6" stop-color="#f7dc86"/>
      <stop offset="1" stop-color="#b98a22"/>
    </linearGradient>
    <linearGradient id="topf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ad5c"/>
      <stop offset="1" stop-color="#c58a37"/>
    </linearGradient>
    <linearGradient id="venstre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a1682a"/>
      <stop offset="1" stop-color="#b87a33"/>
    </linearGradient>
    <linearGradient id="hoejre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d5822"/>
      <stop offset="1" stop-color="#6f431a"/>
