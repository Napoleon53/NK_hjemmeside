    <path d="M30 16 L26 32"/><path d="M37 16 L33 32"/><path d="M44 16 L40 32"/><path d="M51 16 L47 32"/>
    <path d="M58 16 L54 32"/><path d="M65 16 L61 32"/><path d="M72 16 L68 32"/><path d="M79 16 L75 32"/>
    <path d="M86 16 L82 32"/><path d="M93 16 L89 32"/><path d="M100 16 L96 32"/><path d="M107 17.5 L104 30.5"/>
    <path d="M113 20 L111 28"/>
  </g>
  <g stroke="#fff3c8" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round">
    <path d="M32 16.5 L28.5 30"/><path d="M39 16.5 L35.5 30"/><path d="M46 16.5 L42.5 30"/><path d="M53 16.5 L49.5 30"/>
    <path d="M60 16.5 L56.5 30"/><path d="M67 16.5 L63.5 30"/><path d="M74 16.5 L70.5 30"/><path d="M81 16.5 L77.5 30"/>
    <path d="M88 16.5 L84.5 30"/><path d="M95 16.5 L91.5 30"/><path d="M102 16.5 L98.5 30"/>
