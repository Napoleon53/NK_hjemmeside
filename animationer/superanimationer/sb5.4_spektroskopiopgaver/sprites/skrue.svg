<svg xmlns="http://www.w3.org/2000/svg" width="128" height="48" viewBox="0 0 128 48">
  <!-- Messingskrue liggende: rundt hoved med kaerv til venstre, gevind
       og spids til hoejre. -->
  <defs>
    <linearGradient id="messing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a6"/>
      <stop offset="0.3" stop-color="#e5bf55"/>
      <stop offset="0.65" stop-color="#b48a2b"/>
      <stop offset="1" stop-color="#7d5c14"/>
    </linearGradient>
    <linearGradient id="hoved" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9a7420"/>
      <stop offset="0.35" stop-color="#f2d47c"/>
      <stop offset="0.75" stop-color="#c79a35"/>
      <stop offset="1" stop-color="#8a6618"/>
    </linearGradient>
    <radialGradient id="skygge" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3c4a52" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#3c4a52" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="64" cy="40" rx="60" ry="6" fill="url(#skygge)"/>
  <!-- skaftet og spidsen -->
  <path d="M24 16 L104 16 L122 24 L104 32 L24 32 Z" fill="url(#messing)" stroke="#7d5c14" stroke-width="0.9" stroke-linejoin="round"/>
  <!-- gevindet -->
