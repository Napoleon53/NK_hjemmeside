<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest: sc8.6 Korrosion</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.4; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; } .note { color:#9fb3c8; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:760px; opacity:0.001; pointer-events:none; border:0; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at spændingsrækken afgør, hvilket rør der
   tæres, at tallene for rørene og skibet passer med modellen, at de
   fire skemaer er afstemt i atomer og ladning, at partikelbilledet
   følger skemaerne (afgivne elektroner = optagne), at jern kun ruster
   med både vand og ilt og tre gange så hurtigt med salt, at alle mål
   på de tre faner kan løses (selv og med Vis svaret), at de forkerte
   svar giver en rød linje med forklaringen, at sproget holder
   reglerne, og at tingene kan være der fra 1100 × 700 til 1600 × 950.

   Iframen skal åbnes gennem en lokal server. Testen gemmer elevens
   fremskridt og lægger det tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0, antal = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    antal++;
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + antal + " påstande");
    skriv(fejl ? fejl + " FEJL" : "ALT OK", fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

var NOEGLER = ["nk-sc8.6-r", "nk-sc8.6-s", "nk-sc8.6-j"];
var ASCII_ORD = /\b(foer|faerdig|naeste|gaa|staa|paa|foerst|hoejre|roer\w*|aar|taere\w*|aedel\w*|proev\w*|draabe\w*|loest|vaeg\w*|oeverst)\b/i;
var gemt = {};
var ramme = document.getElementById("ramme");
var trin = 0;

/* Første indlæsning: gem elevens fremskridt, ryd det, og indlæs siden igen,
   så fanerne begynder ved første mål. Anden indlæsning: kør testen. */
ramme.addEventListener("load", function () {
    var W = ramme.contentWindow;
    if (trin === 0) {
        trin = 1;
        try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); W.localStorage.removeItem(n); }); } catch (e) { /* ingen hukommelse */ }
        W.location.reload();
        return;
    }
    if (trin === 1) { trin = 2; setTimeout(koer, 1200); }
});

function koer() {
    var W = ramme.contentWindow;
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Kør en fane sek sekunder */
function koerF(F, sek) { for (var t = 0; t < sek; t += 1 / 60) F.opdater(1 / 60); }
function taet(a, b, tol) { return Math.abs(a - b) <= tol; }

function koerTest(W) {
    var d = W.document;
    var NK = W.NK, D = NK.Data, K = NK.Kemi;
    var R = NK.sims["fane-r"], S = NK.sims["fane-s"], J = NK.sims["fane-j"];
    function linje(F) { return F.beskedTekst(); }
    function klasse(F) { return F.el.status.className; }
    function roed(F) { return /skidt/.test(klasse(F)); }
    /* Tryk på hjælpeknappen, til målet er løst (hint, hint, hint, Vis svaret ...) */
    function visSvaret(F, i) {
        F.vaelg(i);
        for (var n = 0; n < 16 && !F.faerdig; n++) F.knap();
        return F.faerdig;
    }

    /* ------------------------------------------------------------------ */
    overskrift("1. Spændingsrækken");
    var M = K.METAL;
    paastand("rækkefølgen er Mg, Zn, Fe, Cu (Databogens E°)", M.Mg.E < M.Zn.E && M.Zn.E < M.Fe.E && M.Fe.E < M.Cu.E);
    paastand("E°: Mg −2,37, Zn −0,76, Fe −0,44, Cu 0,34 V", M.Mg.E === -2.37 && M.Zn.E === -0.76 && M.Fe.E === -0.44 && M.Cu.E === 0.34);
    paastand("metallerne står i bogens række i samme rækkefølge",
        K.RAEKKE.indexOf("Mg") < K.RAEKKE.indexOf("Zn") && K.RAEKKE.indexOf("Zn") < K.RAEKKE.indexOf("Fe") && K.RAEKKE.indexOf("Fe") < K.RAEKKE.indexOf("Cu"));
    paastand("det mindst ædle af kobber og jern er jern, af zink og jern er det zink", K.mindstAedel("Cu", "Fe") === "Fe" && K.mindstAedel("Fe", "Zn") === "Zn" && K.mindstAedel("Fe", "Fe") === null);
    paastand("ionerne skrives Fe²⁺, Zn²⁺, Mg²⁺", K.ion("Fe") === "Fe²⁺" && K.ion("Zn") === "Zn²⁺" && K.ion("Mg") === "Mg²⁺");

    /* ------------------------------------------------------------------ */
    overskrift("2. Rørene: modellen");
    var cufe = K.roerpar("Cu", "Fe", false), fecu = K.roerpar("Fe", "Cu", false), cuzn = K.roerpar("Cu", "Zn", false);
    var znfe = K.roerpar("Zn", "Fe", false), fefe = K.roerpar("Fe", "Fe", false), cucu = K.roerpar("Cu", "Cu", false), plast = K.roerpar("Cu", "Fe", true);
    paastand("kobber + jern: jernrøret tæres, hul efter ca. 10 år", cufe.anode === "Fe" && cufe.side === "h" && taet(cufe.hul, 10.2, 0.1), cufe.hul);
    paastand("det er lige meget, hvilken side jernrøret sidder i", fecu.anode === "Fe" && fecu.side === "v" && taet(fecu.hul, cufe.hul, 1e-9));
    paastand("kobber + zink: zinkrøret tæres, og hurtigere end jern (større afstand i rækken)", cuzn.anode === "Zn" && cuzn.hul < cufe.hul, cuzn.hul);
    paastand("zink + jern: zinkrøret tæres, jernrøret er beskyttet, intet hul på 20 år", znfe.anode === "Zn" && znfe.hul === null && znfe.egen.h === 0);
    paastand("zink + jern: zinkrørets væg er 2,0 mm tyndere ved samlingen efter 20 år", taet(K.tab(znfe, "v", 20, 0), 2.0, 0.01), K.tab(znfe, "v", 20, 0));
    paastand("jern + jern: ingen anode, begge ruster 1,0 mm på 20 år, lige meget overalt",
        fefe.anode === null && taet(K.tab(fefe, "v", 20, 0), 1.0, 1e-9) && taet(K.tab(fefe, "h", 20, 0.9), 1.0, 1e-9));
    paastand("kobber + kobber: ingen tæring", K.tab(cucu, "v", 20, 0) === 0 && K.tab(cucu, "h", 20, 0) === 0);
    paastand("plastmuffe: ingen anode, jernrøret ruster kun, som om det sad alene", plast.anode === null && plast.hul === null && taet(K.tab(plast, "h", 20, 0), 1.0, 1e-9));
    paastand("tæringen er størst ved samlingen og aftager væk fra den", K.tab(cufe, "h", 8, 0) > K.tab(cufe, "h", 8, 0.3) && K.tab(cufe, "h", 8, 0.3) > K.tab(cufe, "h", 8, 1));
    paastand("væggen kan ikke tæres mere end sin tykkelse", K.tab(cufe, "h", 20, 0) === K.ROER.vaeg);

    /* ------------------------------------------------------------------ */
    overskrift("3. Skibet: modellen");
    function skib(klodser, aar) {
        var t = { rust: 0, klodser: klodser.map(function (m) { return m ? { metal: m, rest: 100 } : null; }) };
        K.sejl(t, aar);
        return t;
    }
    var uden = skib([null, null], 3), zn3 = skib(["Zn", null], 3), zn4 = skib(["Zn", null], 4), mg2 = skib(["Mg", null], 2), cu1 = skib(["Cu", null], 1);
    paastand("uden klods: 12 % rust pr. år, 36 % efter 3 år", taet(uden.rust, 36, 0.01), uden.rust);
    paastand("zinkklods: ingen rust i 3 år, klodsen svinder", zn3.rust === 0 && zn3.klodser[0].rest > 5 && zn3.klodser[0].rest < 25, zn3.klodser[0].rest);
    paastand("en zinkklods holder ca. tre et halvt år", taet(100 / K.klodsForbrug("Zn"), 3.5, 0.05) && zn4.rust > 0 && zn4.klodser[0].rest === 0);
    paastand("magnesium bruges hurtigere end zink og er væk efter ca. halvandet år", K.klodsForbrug("Mg") > K.klodsForbrug("Zn") && taet(100 / K.klodsForbrug("Mg"), 1.42, 0.05) && mg2.klodser[0].rest === 0 && mg2.rust > 0);
    paastand("kobberklods: skroget ruster hurtigere (20 % pr. år), klodsen bruges ikke", taet(cu1.rust, 20, 0.01) && cu1.klodser[0].rest === 100);
    var begge = skib(["Zn", "Mg"], 1);
    paastand("magnesium og zink sammen: magnesium afgiver først, zinken er urørt", begge.klodser[1].rest < 35 && begge.klodser[0].rest === 100 && begge.rust === 0);
    var to = skib(["Zn", "Zn"], 6);
    paastand("to zinkklodser deles om det og holder dobbelt så længe", to.rust === 0 && taet(to.klodser[0].rest, to.klodser[1].rest, 1e-6) && to.klodser[0].rest > 10);
    paastand("anoden er det mindst ædle metal, der er noget tilbage af", K.skibAnode([{ metal: "Zn", rest: 0 }, { metal: "Cu", rest: 100 }]) === "Fe" && K.skibAnode([{ metal: "Zn", rest: 5 }, null]) === "Zn");

    /* ------------------------------------------------------------------ */
    overskrift("4. Reaktionsskemaerne");
    var skemaFejl = [];
    Object.keys(K.SKEMA).forEach(function (id) {
        var r = K.tjekSkema(id, K.facit(id));
        if (!r.ok) skemaFejl.push(id + ": " + r.fejl);
    });
    paastand("alle fire skemaer er afstemt i Fe, O, H og ladning", skemaFejl.length === 0, skemaFejl.join(", "));
    paastand("skemaerne som tekst", K.skemaTekst("ox") === "Fe → Fe²⁺ + 2 e⁻" && K.skemaTekst("red") === "O₂ + 2 H₂O + 4 e⁻ → 4 OH⁻" &&
        K.skemaTekst("samlet") === "2 Fe + O₂ + 2 H₂O → 2 Fe²⁺ + 4 OH⁻" && K.skemaTekst("rust") === "4 Fe(OH)₂ + O₂ → 4 FeO(OH) + 2 H₂O",
        K.skemaTekst("rust"));
    paastand("i det samlede skema afgiver jern lige så mange elektroner, som ilt optager", 2 * K.facit("samlet")[0] === K.facit("red")[0]);
    var P0 = K.PARTIKEL, alt = { Fe: 4 * P0.Fe.Fe, O: 3 * 2 + 2 * 1, H: 2 * 2 };
    paastand("teoriens 4 Fe + 3 O₂ + 2 H₂O → 4 FeO(OH) er afstemt", alt.Fe === 4 && alt.O === 4 * P0["FeO(OH)"].O && alt.H === 4 * P0["FeO(OH)"].H);
    var typiske = [["ox", [3]], ["ox", [1]], ["red", [4, 2]], ["red", [2, 4]], ["samlet", [1, 1, 4]], ["samlet", [2, 1, 4]], ["samlet", [4, 4, 4]],
        ["rust", [2, 2, 2]], ["rust", [4, 4, 1]], ["rust", [1, 1, 1]]];
    var besk = [];
    typiske.forEach(function (t) {
        var r = K.tjekSkema(t[0], t[1]);
        var b = r.ok ? "" : D.skemaFejl(t[0], t[1], r);
        if (r.ok || !b || /undefined|NaN/.test(b) || b.length < 20) besk.push(t[0] + " " + t[1].join(","));
    });
    paastand("ti typiske fejl giver hver sin besked med elevens egne tal", besk.length === 0, besk.join(" | "));
    paastand("beskeden til 3 e⁻ i oxidationen regner på ladningen", /2\+/.test(D.skemaFejl("ox", [3], K.tjekSkema("ox", [3]))) && /3−/.test(D.skemaFejl("ox", [3], K.tjekSkema("ox", [3]))));
    paastand("beskeden til 1 Fe i det samlede skema nævner 2 e⁻ og 4 e⁻", /afgiver 2 e⁻/.test(D.skemaFejl("samlet", [1, 1, 4], K.tjekSkema("samlet", [1, 1, 4]))));

    /* ------------------------------------------------------------------ */
    overskrift("5. Partikelbilledet på fane 3");
    NK.visFane("fane-j");
    J.til = { vand: true, ilt: true, salt: false };
    J.nulstilScene();
    J.brugTil();
    koerF(J, 45);
    var T = J.M.tael;
    paastand("med vand og ilt forlader jernatomerne pladen (0,4 pr. sekund)", T.afgivet >= 14 && T.afgivet <= 20, T.afgivet);
    paastand("hvert jernatom afgiver 2 elektroner", T.eAfgivet === 2 * T.afgivet);
    paastand("afgivne elektroner = optagne + dem, der er på vej", T.eAfgivet === T.eOptaget + J.M.elektronerUndervejs(), T.eAfgivet + " / " + T.eOptaget + " + " + J.M.elektronerUndervejs());
    paastand("ét O₂ optager 4 elektroner og giver 4 OH⁻", T.oh === T.eOptaget && T.o2 === T.eOptaget / 4 + T.rust / 4, JSON.stringify(T));
    paastand("Fe(OH)₂ bruger 2 OH⁻ hver, og rust dannes 4 ad gangen", T.feoh2 * 2 + J.M.oh.length === T.oh && T.rust % 4 === 0 && T.rust <= T.feoh2 && T.feoh2 > 0, JSON.stringify(T) + " oh=" + J.M.oh.length);
    var ude = 0, dr = J.M.draabe;
    J.M.ion.concat(J.M.oh).forEach(function (q) {
        if (q.y < 0 && !J.M.iDraabe(q.x, q.y, -0.3)) ude++;
    });
    paastand("ionerne bliver i dråben", ude === 0, ude);
    paastand("jernet forsvinder midt under dråben, ikke ved kanten", J.M.top.every(function (t, c) { return t === 0 || Math.abs(c + 0.5 - dr.cx) <= dr.R * 0.52 + 0.01; }));
    var foer = T.afgivet;
    J.skift("vand");
    koerF(J, 12);
    paastand("uden vand ruster jernet ikke", J.M.tael.afgivet === foer && J.fart() === 0);
    J.skift("vand"); J.skift("ilt");
    koerF(J, 12);
    paastand("uden ilt ruster jernet ikke", J.M.tael.afgivet === foer && J.fart() === 0);
    paastand("uden ilt er der kun N₂ i luften", J.M.gas.every(function (g) { return g.type === "n2"; }) && J.M.gas.length === 14, J.M.gas.length);
    J.skift("ilt");
    J.nulstilScene();
    koerF(J, 30);
    var udenSalt = J.M.tael.afgivet;
    J.til.salt = true; J.brugTil(); J.nulstilScene();
    koerF(J, 30);
    var medSalt = J.M.tael.afgivet;
    paastand("med salt går det tre gange så hurtigt", K.rustFart(true, true, true) === 3 * K.rustFart(true, true, false) && medSalt > 2.3 * udenSalt, udenSalt + " / " + medSalt);
    paastand("saltets ioner er i dråben og bliver ikke brugt (5 Na⁺ og 5 Cl⁻)", J.M.salt.length === 10);
    J.til.salt = false; J.brugTil(); J.nulstilScene();

    /* ------------------------------------------------------------------ */
    overskrift("6. Fane 1: Rørene");
    NK.visFane("fane-r");
    var afg = [], gammelAfgiv = null;
    function lyt() {
        afg = [];
        var Mk = R.M, org = Mk.afgiv;
        Mk.afgiv = function (c, k) { var ok = org.call(Mk, c, k); if (ok) afg.push([c, k]); return ok; };
    }
    R.vaelg(0);
    paastand("mål 1 begynder med et gæt, og rørene er kobber og jern", R.opg.fase === "gaet" && R.a === "Cu" && R.b === "Fe");
    R.svarValg(0);
    paastand("efter gættet skal det prøves", R.opg.fase === "forsoeg" && /Lad tiden gå/.test(linje(R)), linje(R));
    lyt();
    R.tidKlik();
    koerF(R, 3);
    paastand("mens tiden går, står det i linjen, og knappen er låst", R.koerer && /Tiden går/.test(linje(R)) && R.tidknap.disabled);
    koerF(R, 9);
    paastand("mål 1 løses af forsøget: hul i jernrøret efter 10 år", R.faerdig && R.slut && taet(R.t, 10.2, 0.1) && /efter 10 år/.test(linje(R)), linje(R));
    paastand("gættet får sin dom", /Dit gæt holdt ikke/.test(linje(R)));
    paastand("luppen følger væggen: atomerne mangler nærmest samlingen", R.M.top[6] === 4 && R.M.top[6] >= R.M.top[8] && R.M.top[8] >= R.M.top[11] && R.M.top.slice(0, 6).every(function (t) { return t === 0; }), R.M.top.join(","));
    paastand("elektronerne går fra jernet over i kobberet", afg.length >= 10 && afg.every(function (p) { return p[0] >= 6 && p[1] < 6; }), afg.length);
    paastand("forsøget står under Rør, der er prøvet", /hul i jernrøret efter 10 år/.test(d.getElementById("r-proevet").textContent));
    R.vaelg(1);
    R.svarValg(1);
    paastand("mål 2: et forkert svar giver en rød linje med forklaringen", roed(R) && /jernatom forlader/.test(linje(R)) && !R.faerdig, linje(R));
    R.svarValg(0);
    paastand("mål 2: det rigtige svar løser målet", R.faerdig && /mindre ædelt/.test(linje(R)));
    R.vaelg(2);
    R.tidKlik(); koerF(R, 12);
    paastand("mål 3: to forskellige rør giver en rød linje", roed(R) && R.opg.fase === "forsoeg" && /jernrøret er tæret mest/i.test(linje(R)), linje(R));
    R.saetRoer("Fe", "Fe", false);
    lyt();
    R.tidKlik(); koerF(R, 18);
    paastand("mål 3: to jernrør holder i 20 år, og så kommer spørgsmålet", R.opg.fase === "spm" && R.t === 20 && /Vælg et svar/.test(linje(R)), linje(R));
    paastand("to ens rør: ingen elektroner over samlingen", afg.length > 0 && afg.every(function (p) { return (p[0] < 6) === (p[1] < 6); }), afg.length);
    R.svarValg(0);
    paastand("mål 3 er løst", R.faerdig);
    R.vaelg(3);
    paastand("mål 4: zink og jern, og et gæt først", R.a === "Zn" && R.b === "Fe" && R.opg.fase === "gaet");
    R.svarValg(1);
    R.tidKlik(); koerF(R, 18);
    paastand("mål 4: zinkrøret tæres, jernrøret er beskyttet", R.faerdig && R.par.anode === "Zn" && /Dit gæt holdt\./.test(linje(R)) && R.M.top.slice(6).every(function (t) { return t === 0; }) && R.M.top[5] > 0, R.M.top.join(","));
    paastand("spændingsrækken kommer frem i panelet", !d.getElementById("r-raekkekort").hidden && /Zink står til venstre for jern/.test(d.getElementById("r-raekke").textContent));
    R.vaelg(4);
    paastand("mål 5: plastmuffen kommer frem", !R.plastknap.hidden && R.opg.fase === "forsoeg");
    R.tidKlik(); koerF(R, 12);
    paastand("mål 5: uden muffe går der hul, og linjen siger det", roed(R) && /plastmuffen/i.test(linje(R)), linje(R));
    R.saetRoer("Cu", "Fe", true);
    lyt();
    R.tidKlik(); koerF(R, 18);
    paastand("mål 5: med plastmuffe holder jernrøret i 20 år", R.opg.fase === "spm" && R.t === 20 && R.par.hul === null);
    paastand("med plastmuffe går ingen elektroner over samlingen", afg.length > 0 && afg.every(function (p) { return p[0] >= 7 && p[1] >= 7; }), JSON.stringify(afg));
    R.svarValg(1);
    var roed5 = roed(R);
    R.svarValg(0);
    paastand("mål 5: forkert svar rødt, rigtigt svar løser", roed5 && R.faerdig && R.antalLoest() === 5);
    var svarOk = [0, 1, 2, 3, 4].every(function (i) { return visSvaret(R, i) && /gul/.test(klasse(R)); });
    paastand("alle fem mål kan løses med Vis svaret (gul linje)", svarOk);
    R.vaelg(0); R.svarValg(1); R.tidKlik(); koerF(R, 14);
    R.tegn();
    R.klikScene({ x: R.pyt.x, y: R.pyt.y });
    paastand("påskeægget: et klik på vandpytten", /VVS/.test(linje(R)) && NK.paaskeaeg >= 1, linje(R));

    /* ------------------------------------------------------------------ */
    overskrift("7. Fane 2: Skibet");
    NK.visFane("fane-s");
    function aar(n) { for (var i = 0; i < n; i++) { S.sejlKlik(); koerF(S, 2.8); } }
    S.vaelg(0);
    aar(1);
    paastand("mål 1: efter et år er skroget rustet 12 %, og der er sendt elektroner og Fe²⁺", taet(S.rust, 12, 0.1) && S.aar === 1 && !S.sejler, S.rust);
    aar(2);
    paastand("mål 1: efter 3 år kommer spørgsmålet", S.opg.fase === "spm" && taet(S.rust, 36, 0.1), S.opg.fase + " " + S.rust);
    S.svarValg(0);
    var r1 = roed(S) && /fane 1/.test(linje(S));
    S.svarValg(1);
    paastand("mål 1: forkert svar peger på rørene, rigtigt svar løser", r1 && S.faerdig);
    S.vaelg(1);
    aar(1);
