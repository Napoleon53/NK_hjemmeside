<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <!-- Bundfalds baegerglas. Spillets maal (i viewBox-enheder) staar i js/scene.js:
       indersiden x 78 til 922, vaeskens overflade y 112, bunden y 758. -->
  <defs>
    <linearGradient id="glas" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#dfeaf2" stop-opacity="0.75"/>
      <stop offset="0.08" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#eef5fa" stop-opacity="0.18"/>
      <stop offset="0.92" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#d6e4ee" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="vaeske" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#bfe0f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9ccbec" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="inde">
      <path d="M78 46 L78 718 Q78 758 118 758 L882 758 Q922 758 922 718 L922 46 Z"/>
    </clipPath>
  </defs>

  <!-- Skygge paa bordet -->
  <ellipse cx="500" cy="782" rx="470" ry="12" fill="#1d2433" opacity="0.18"/>

  <!-- Glassets bagvaeg -->
  <path d="M66 40 L66 720 Q66 770 116 770 L884 770 Q934 770 934 720 L934 40 Z" fill="url(#glas)"/>

  <!-- Vaesken -->
  <g clip-path="url(#inde)">
    <rect x="70" y="112" width="860" height="660" fill="url(#vaeske)"/>
    <!-- Menisken: overfladen boejer lidt op ved glasset -->
    <path d="M78 104 Q86 112 104 112 L896 112 Q914 112 922 104 L922 118 L78 118 Z" fill="#a9d3ef" opacity="0.8"/>
    <path d="M78 104 Q86 112 104 112 L896 112 Q914 112 922 104" fill="none" stroke="#5e9cc6" stroke-width="3"/>
  </g>

  <!-- Inddelingen i venstre side -->
  <g stroke="#3b5a73" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="92" y1="180" x2="132" y2="180"/>
    <line x1="92" y1="246" x2="116" y2="246"/>
    <line x1="92" y1="312" x2="132" y2="312"/>
    <line x1="92" y1="378" x2="116" y2="378"/>
    <line x1="92" y1="444" x2="132" y2="444"/>
    <line x1="92" y1="510" x2="116" y2="510"/>
    <line x1="92" y1="576" x2="132" y2="576"/>
    <line x1="92" y1="642" x2="116" y2="642"/>
  </g>
  <g font-family="Lexend, Segoe UI, sans-serif" font-size="20" fill="#3b5a73" opacity="0.6">
    <text x="140" y="187">800 mL</text>
    <text x="140" y="319">600</text>
    <text x="140" y="451">400</text>
    <text x="140" y="583">200</text>
  </g>

  <!-- Glassets kant, tud og lys -->
  <path d="M66 40 L66 720 Q66 770 116 770 L884 770 Q934 770 934 720 L934 40"
        fill="none" stroke="#2c3e50" stroke-width="7" stroke-linejoin="round"/>
  <path d="M78 46 L78 718 Q78 758 118 758 L882 758 Q922 758 922 718 L922 46"
        fill="none" stroke="#2c3e50" stroke-width="2.5" opacity="0.55"/>
  <!-- Kanten foroven og tuden til venstre -->
  <path d="M38 22 Q50 26 58 36 L66 40" fill="none" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
  <path d="M934 40 Q944 30 956 28" fill="none" stroke="#2c3e50" stroke-width="7" stroke-linecap="round"/>
  <!-- Lysstriber -->
  <rect x="96" y="70" width="12" height="640" rx="6" fill="#ffffff" opacity="0.45"/>
  <rect x="890" y="90" width="8" height="600" rx="4" fill="#ffffff" opacity="0.3"/>
  <!-- Navneskiltet paa glasset -->
  <g transform="translate(770 150)">
    <rect x="0" y="0" width="120" height="44" rx="6" fill="#fbfaf6" stroke="#2c3e50" stroke-width="2.5" opacity="0.92"/>
    <text x="60" y="29" text-anchor="middle" font-family="Lexend, Segoe UI, sans-serif" font-size="20" font-weight="600" fill="#1d2433">H₂O</text>
  </g>
</svg>
