<svg xmlns="http://www.w3.org/2000/svg" width="160" height="170" viewBox="0 0 160 170">
  <!-- En skaal i tre snore. Den haenger i krogen (80, 6) og holder sig
       lodret, naar armen drejer. Det, der ligger i skaalen, staar paa
       midten af skaalens flade (80, 146). -->
  <defs>
    <linearGradient id="skaal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5c24"/>
      <stop offset="0.3" stop-color="#e8c97f"/>
      <stop offset="0.65" stop-color="#c9a24f"/>
      <stop offset="1" stop-color="#6e531f"/>
    </linearGradient>
  </defs>
  <g stroke="#cdb488" stroke-opacity="0.85" stroke-width="1.3" fill="none">
    <path d="M80 8 L10 144"/>
    <path d="M80 8 L150 144"/>
    <path d="M80 8 L80 140"/>
  </g>
  <circle cx="80" cy="6" r="4" fill="none" stroke="#5e4619" stroke-width="2"/>
  <path d="M6 146 Q12 166 80 166 Q148 166 154 146 Z" fill="url(#skaal)" stroke="#5e4619" stroke-width="1"/>
  <ellipse cx="80" cy="146" rx="74" ry="7" fill="#d9bb72" stroke="#5e4619" stroke-width="1"/>
  <ellipse cx="80" cy="146" rx="62" ry="4.5" fill="#b8954a" fill-opacity="0.6"/>
</svg>
