  <text x="75" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#f2f3f5">O<tspan font-size="21" dy="7">2</tspan></text>

  <!-- Faresymbol GHS04: gas under tryk, kan eksplodere ved opvarmning -->
  <g transform="translate(97 356) scale(1.15)">
    <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="2.8"/>
