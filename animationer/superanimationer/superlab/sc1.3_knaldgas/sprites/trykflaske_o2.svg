  <rect x="40" y="192" width="70" height="116" rx="8" fill="#0e1117" stroke="#5a6478" stroke-width="1.5"/>
  <circle cx="63" cy="226" r="13" fill="url(#atom)" stroke="#7a2019" stroke-width="0.8"/>
