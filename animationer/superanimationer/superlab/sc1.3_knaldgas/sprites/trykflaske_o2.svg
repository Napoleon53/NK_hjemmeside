      <path d="M-6.5 -1.6 H2" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Faresymbol GHS03: brandnaerende -->
  <g transform="translate(53 356) scale(1.15)">
    <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="2.8"/>
