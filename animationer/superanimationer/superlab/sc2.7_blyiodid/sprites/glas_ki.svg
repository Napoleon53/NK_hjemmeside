<svg xmlns="http://www.w3.org/2000/svg" width="116" height="168" viewBox="0 0 58 84">
  <!-- Hvid plastbeholder med kaliumiodid. Laaget tegnes af animationen.
       Aabningen er (29, 6). -->
  <defs>
    <linearGradient id="plast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab2bb"/>
      <stop offset="0.25" stop-color="#e9edf1"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#dfe4e9"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </linearGradient>
  </defs>

  <!-- Hals med gevind -->
  <rect x="15" y="5" width="28" height="11" fill="url(#plast)"/>
  <path d="M15 9 h28 M15 12.5 h28" stroke="#8c959f" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Krop -->
  <path d="M15 15 Q4 16 3 24 L3 76 Q3 82 9 82 L49 82 Q55 82 55 76 L55 24 Q54 16 43 15 Z" fill="url(#plast)"/>

  <!-- Etiket -->
  <rect x="8" y="27" width="42" height="50" rx="3" fill="#f7f7f2" stroke="#b9c0c7" stroke-width="0.7"/>
  <rect x="8" y="27" width="42" height="7" rx="3" fill="#2c6fb0"/>
  <rect x="8" y="31" width="42" height="3" fill="#2c6fb0"/>
  <text x="29" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">KI</text>
  <text x="29" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="600" fill="#4a4f57">Kaliumiodid</text>
  <text x="29" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="4.2" fill="#6a717a">p.a.</text>
</svg>
