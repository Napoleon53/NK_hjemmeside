<svg xmlns="http://www.w3.org/2000/svg" width="240" height="130" viewBox="0 0 240 130">
  <!-- Digital laboratorievaegt set forfra, lidt oppefra.
       Skaalens overflade: midte (120, 13), bredde 156 (x 42-198).
       Displayet tegnes af animationen OVENPAA i x 72-168, y 68-94.
       Bunden staar paa y 128. -->
  <defs>
    <linearGradient id="krop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ecef"/>
      <stop offset="0.55" stop-color="#cdd2d8"/>
      <stop offset="1" stop-color="#a9afb7"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f48"/>
      <stop offset="1" stop-color="#2a2e35"/>
    </linearGradient>
    <linearGradient id="skaal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1a9"/>
      <stop offset="0.3" stop-color="#eef1f4"/>
      <stop offset="0.7" stop-color="#d7dce1"/>
      <stop offset="1" stop-color="#8e959d"/>
    </linearGradient>
  </defs>

  <!-- Skygge paa bordet -->
  <ellipse cx="120" cy="127" rx="112" ry="4" fill="#000000" fill-opacity="0.35"/>

  <!-- Kroppen -->
  <path d="M18 40 Q18 34 26 34 L214 34 Q222 34 222 40 L230 118 Q231 128 220 128 L20 128 Q9 128 10 118 Z"
        fill="url(#krop)" stroke="#7f868f" stroke-width="1.2"/>
  <path d="M24 38 L216 38" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.4"/>

  <!-- Frontpanelet med displayet -->
  <path d="M34 58 Q34 54 38 54 L202 54 Q206 54 206 58 L210 112 Q210 116 206 116 L34 116 Q30 116 30 112 Z"
        fill="url(#front)" stroke="#1d2026" stroke-width="1"/>
  <rect x="70" y="66" width="100" height="30" rx="3" fill="#10161a" stroke="#050708" stroke-width="1"/>

  <!-- Knapperne -->
  <g font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" text-anchor="middle">
    <circle cx="48" cy="80" r="8" fill="#4b525c" stroke="#1d2026"/>
    <text x="48" y="83" fill="#dfe4ea">T</text>
    <circle cx="192" cy="80" r="8" fill="#4b525c" stroke="#1d2026"/>
    <text x="192" y="83" fill="#dfe4ea">I/O</text>
    <text x="120" y="109" fill="#aeb6c0" font-size="7" font-weight="600">Max 600 g   d = 0,01 g</text>
  </g>

  <!-- Staaende foedder -->
  <rect x="26" y="126" width="18" height="3" rx="1.5" fill="#50565e"/>
  <rect x="196" y="126" width="18" height="3" rx="1.5" fill="#50565e"/>

  <!-- Skaalens stilk og skaalen -->
  <rect x="108" y="18" width="24" height="17" fill="#8c939b" stroke="#6b727a" stroke-width="1"/>
  <ellipse cx="120" cy="18" rx="80" ry="8" fill="#7d848c"/>
  <ellipse cx="120" cy="14" rx="80" ry="8" fill="url(#skaal)" stroke="#6b727a" stroke-width="1"/>
  <ellipse cx="120" cy="13" rx="66" ry="5" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1"/>
</svg>
