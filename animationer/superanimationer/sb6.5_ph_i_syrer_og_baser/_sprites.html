<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Sprites: sb6.5 pH i syrer og baser</title>
<style>
    body { background: #f4f6f5; font-family: 'Segoe UI', sans-serif; color: #1d2433; margin: 24px; }
    .raekke { display: flex; gap: 48px; align-items: flex-end; flex-wrap: wrap; }
    figure { margin: 0; text-align: center; }
    figure img { display: block; margin: 0 auto 8px; }
    .stor img { transform: scale(1.6); transform-origin: bottom center; margin-top: 90px; }
</style>
</head>
<body>
<!-- Udviklerværktøj: de tre sprites alene, i deres egen størrelse og forstørret.
     Indgår ikke i animationen. -->
<h1>Sprites i sb6.5 (de samme som i sb6.1)</h1>
<div class="raekke">
    <figure><img src="sprites/flaske.svg" alt=""><figcaption>flaske.svg (80 × 130)</figcaption></figure>
    <figure><img src="sprites/kolbe.svg" alt=""><figcaption>kolbe.svg (150 × 170)</figcaption></figure>
    <figure><img src="sprites/phmeter.svg" alt=""><figcaption>phmeter.svg (150 × 112)</figcaption></figure>
</div>
<div class="raekke stor">
    <figure><img src="sprites/flaske.svg" alt=""></figure>
    <figure><img src="sprites/kolbe.svg" alt=""></figure>
    <figure><img src="sprites/phmeter.svg" alt=""></figure>
</div>
</body>
</html>
