<body>

<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklerværktøj. Indgår ikke i animationen og kan slettes.

   Siden åbner index.html i en iframe og kontrollerer det, man ikke kan
   se på et skærmbillede: at navngivningen giver bogens navne (også alle
   isomerer af C4 til C9), at molekylformel og molarmasse passer, at de
   tilfældige opgaver har det navn, de siger, og kan tegnes med luft, at
   tjekket giver den rigtige besked ved de typiske fejl, at tavlen på
   quizfanerne overholder reglerne, at alle fire faner kan gennemføres
   (også opløselighedsspillet og reglen om 4 C pr. polær gruppe), at
   klistermærkerne låses op, at sproget overholder reglerne, og at
   layoutet holder fra 520 × 380 til 1500 × 900.

   Tegnebrættet og det meste af motoren testes i
   ../tegnebraet/_selvtest.html (fra 25. sept. 2026).

   Kræver en lokal server (iframe, motoren fra ../../molekylemotor/ og
   Kemichael fra ../../v2/kemichael/). Testen gemmer elevens valg og
   lægger dem tilbage bagefter.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) { skriv("  ok    " + navn, "ok"); }
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}

window.addEventListener("load", function () { setTimeout(koer, 1500); });

var NOEGLER = ["nk-skuffe", "nk-sc4.2-skuffe", "nk-sc4.2-intro-zigzag", "nk-sc4.2-intro-navne", "nk-sc4.2-intro-isomerer",
    "nk-sc4.2-intro-oploeselighed", "nk-sc4.2-oploeselighed-rekord"];

function koer() {
    var W = document.getElementById("ramme").contentWindow;
    var gemt = {};
    try { NOEGLER.forEach(function (n) { gemt[n] = W.localStorage.getItem(n); }); } catch (e) { /* ingen hukommelse */ }
    try { koerTest(W); }
    catch (e) { fejl++; skriv("\nUNDTAGELSE: " + e.message + "\n" + (e.stack || ""), "fejl"); }
    try {
        NOEGLER.forEach(function (n) {
            if (gemt[n] === null || gemt[n] === undefined) W.localStorage.removeItem(n); else W.localStorage.setItem(n, gemt[n]);
        });
    } catch (e) { /* ingen hukommelse */ }
    vis();
}

/* Et molekyle ud fra en lille SMILES-streng: C, N, O, S, F, Cl, Br, I,
   grene (), bindinger = og #, ringlukning med cifre. Koordinaterne er
   tilfældige, så navnet må ikke afhænge af dem (undtagen cis/trans). */
function smiles(NK, s) {
    var m = new NK.Molekyle(), i = 0, forrige = null, orden = 1, stak = [], ringe = {};
    while (i < s.length) {
        var c = s[i];
        if (c === "(") { stak.push(forrige); i++; continue; }
        if (c === ")") { forrige = stak.pop(); i++; continue; }
        if (c === "=") { orden = 2; i++; continue; }
        if (c === "#") { orden = 3; i++; continue; }
        if (/\d/.test(c)) {
            if (ringe[c]) { m.bind(ringe[c].id, forrige, Math.max(orden, ringe[c].orden)); delete ringe[c]; }
            else ringe[c] = { id: forrige, orden: orden };
            orden = 1; i++; continue;
        }
        var el = c;
        if (s.substr(i, 2) === "Cl" || s.substr(i, 2) === "Br") { el = s.substr(i, 2); i += 2; } else i++;
        var a = m.tilfoej(el, Math.random() * 10, Math.random() * 10);
        if (forrige !== null) m.bind(forrige, a.id, orden);
        orden = 1; forrige = a.id;
    }
    return m;
}

/* Navne efter bogens regler (IUPAC 1979/1993, dansk stavning) */
var NAVNE = [
    ["CCCC", "butan"], ["CC(C)C", "2-methylpropan"], ["C", "methan"], ["CC", "ethan"],
    ["CC(CC)CC", "3-methylpentan"], ["CCC(C)CC", "3-methylpentan"], ["C(C)(C)CC", "2-methylbutan"],
    ["CC(C)C(C)C", "2,3-dimethylbutan"], ["CCC(CC)C(C)C", "3-ethyl-2-methylpentan"],
    ["CC(CC)C(C)C", "2,3-dimethylpentan"], ["CC(C)(C)C(C)CC", "2,2,3-trimethylpentan"],
    ["CCC(C)C(CC)CC", "3-ethyl-4-methylhexan"], ["CCC(C(C)C)CCC", "3-ethyl-2-methylhexan"],
    ["CCCCC(C(C)C)CCCC", "5-(1-methylethyl)nonan"], ["CCCCC(C(C)(C)C)CCCC", "5-(1,1-dimethylethyl)nonan"],
    ["CCCCC(CCl)CCCC", "5-(chlormethyl)nonan"],
    ["CC(Br)C", "2-brompropan"], ["BrCCBr", "1,2-dibromethan"], ["CC(C)(Br)C", "2-brom-2-methylpropan"],
    ["ClC(Cl)Cl", "trichlormethan"], ["CCCCCCBr", "1-bromhexan"], ["CC(Cl)C(C)C", "2-chlor-3-methylbutan"],
    ["CCBr", "bromethan"], ["FC(F)(F)C(Cl)Br", "2-brom-2-chlor-1,1,1-trifluorethan"],
    ["C=C", "ethen"], ["C=CC", "propen"], ["C=CCC", "but-1-en"], ["CC=CC", "but-2-en"], ["C=C(C)C", "2-methylpropen"],
    ["CC(C)=CC", "2-methylbut-2-en"], ["C=CC=C", "buta-1,3-dien"], ["C=CC(C)C", "3-methylbut-1-en"],
    ["CCC(=C)CC", "2-ethylbut-1-en"], ["CCC(C=C)CCC", "3-ethylhex-1-en"], ["CC(C)C=CC(C)C", "2,5-dimethylhex-3-en"],
    ["C#C", "ethyn"], ["CC#C", "propyn"], ["CC#CC", "but-2-yn"], ["C#CC=C", "but-1-en-3-yn"],
    ["BrCC=C", "3-brompropen"], ["ClC=CCl", "1,2-dichlorethen"], ["C=CCl", "chlorethen"],
    ["C1CCCCC1", "cyclohexan"], ["CC1CCCCC1", "methylcyclohexan"], ["CC1CCCCC1C", "1,2-dimethylcyclohexan"],
    ["C1=CCCCC1", "cyclohexen"], ["CC1C=CCCC1", "3-methylcyclohexen"], ["C1=CC=CC=C1", "benzen"],
    ["CC1=CC=CC=C1", "methylbenzen"], ["ClC1=CC=CC=C1", "chlorbenzen"], ["BrC1CCCCC1Br", "1,2-dibromcyclohexan"],
    ["CCCCCCCCCCCCCCCCCC", "octadecan"]

/* Antal isomerer af CnH2n+2 (kendte tal) og alkener uden ring (strukturisomerer) */
var ISOMERER = { 4: 2, 5: 3, 6: 5, 7: 9, 8: 18, 9: 35 };

function koerTest(W) {
    var d = W.document;
    var NK = W.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i;

    overskrift("1. Indlæsning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("motoren er kørt (fra ../../molekylemotor/)", !!(NK.Molekyle && NK.Navn && NK.Layout && NK.Struktur && NK.Tegnebraet && NK.Skuffe && NK.Tavle && NK.Opgaver && NK.Tjek));
    paastand("alle fire faner er bygget, og tegnebrættet er ikke en fane længere", !!(NK.sims && NK.sims["fane-zigzag"] && NK.sims["fane-navne"] && NK.sims["fane-isomerer"] && NK.sims["fane-oploeselighed"]) &&
        !NK.sims["fane-tegn"] && !d.getElementById("fane-tegn"));
    var sprites = ["kaffekop", "laererKrop", "laererHoved", "laererArm"];
    var mangler = sprites.filter(function (n) { return !NK.Sprites.klar(n); });
    paastand("Kemichaels " + sprites.length + " sprites er indlæst", mangler.length === 0, "mangler: " + mangler.join(", "));
    var Z = NK.sims["fane-zigzag"], N = NK.sims["fane-navne"], I = NK.sims["fane-isomerer"], OS = NK.sims["fane-oploeselighed"];
    /* Papirkortet: teksten paa kortet, knappen, der foerer videre, og hintknappen */
    function kortT(pre) { return d.getElementById(pre + "-skort").textContent; }
    function videreK(pre) { var b = d.querySelector("#" + pre + "-skort [data-videre]"); return b ? b.textContent : ""; }
    function hjaelpK(pre) { var b = d.querySelector("#" + pre + "-skort .knap.hjaelp"); return b ? b.textContent : ""; }
    function svarOP(lag) { OS.vaelg(lag); OS.indsend(); }
    paastand("Kemichael er koblet på alle fire faner", !!(Z.laerer && N.laerer && I.laerer && OS.laerer));
    var knapper = Array.prototype.map.call(d.querySelectorAll(".faneknap"), function (k) { return k.getAttribute("data-fane"); });
    paastand("Zigzag er fane 1 og den, siden åbner med", knapper.join() === "fane-zigzag,fane-navne,fane-isomerer,fane-oploeselighed" &&
        d.getElementById("fane-zigzag").classList.contains("aktiv") && d.querySelector(".faneknap.aktiv") === d.querySelector(".faneknap"), knapper.join());
    W.document.dispatchEvent(new W.KeyboardEvent("keydown", { key: "2", bubbles: true }));
    var efter2 = d.getElementById("fane-navne").classList.contains("aktiv");
    W.document.dispatchEvent(new W.KeyboardEvent("keydown", { key: "1", bubbles: true }));
    paastand("tast 2 giver Navne, tast 1 Zigzag", efter2 && d.getElementById("fane-zigzag").classList.contains("aktiv"));
    W.document.dispatchEvent(new W.KeyboardEvent("keydown", { key: "4", bubbles: true }));
    var efter4 = d.getElementById("fane-oploeselighed").classList.contains("aktiv");
    NK.visFane("zigzag");
    NK.visFane("oploeselighed");
    paastand("tast 4 og #oploeselighed giver Opløselighed som fane 4", efter4 && d.getElementById("fane-oploeselighed").classList.contains("aktiv"));
    NK.visFane("zigzag");
    var link = d.getElementById("tegnelink");
    paastand("knappen Tegnebræt i toppen åbner tegnebrættets egen side i en ny fane", !!link && /\.\.\/tegnebraet\/index\.html$/.test(link.getAttribute("href")) && link.getAttribute("target") === "_blank");

    overskrift("2. Navngivningen");
    var navnFejl = NAVNE.filter(function (r) { return NK.Navn.analyser(smiles(NK, r[0])).navnUdenStereo !== r[1]; });
    paastand(NAVNE.length + " navne efter bogens regler", navnFejl.length === 0,
        navnFejl.map(function (r) { return r[0] + " gav " + NK.Navn.analyser(smiles(NK, r[0])).navnUdenStereo + ", ikke " + r[1]; }).join("; "));
    paastand("navnet afhænger ikke af, hvilket atom man tegner fra", ["CC(CC)CC", "C(CC)(CC)C", "C(C)(CC)CC"].every(function (s) {
        return NK.Navn.analyser(smiles(NK, s)).navn === "3-methylpentan";
    }));
    paastand("flest sidegrupper vinder ved lige lange kæder: 3-ethyl-2-methylhexan", NK.Navn.analyser(smiles(NK, "CCC(C(C)C)CCC")).navn === "3-ethyl-2-methylhexan");
    paastand("lige numre: den første i alfabetet får det laveste", NK.Navn.analyser(smiles(NK, "CCC(CC)C(C)CC")).navn === "3-ethyl-4-methylhexan");
    paastand("hovedkæden går gennem dobbeltbindingen", NK.Navn.analyser(smiles(NK, "CCCC(C=C)CCCC")).navn === "3-propylhept-1-en");
    var r = NK.Navn.analyser(smiles(NK, "CCO"));
    paastand("motoren kender også de funktionelle grupper: ethanol", r.navn === "ethanol" && r.stofklasse === "alkohol");
    paastand("to ringe: intet navn", NK.Navn.analyser(smiles(NK, "C1CC2CCC1C2")).grund === "ringe");

    function traeer(n) {
        var lag = [smiles(NK, "C")];
        for (var k = 2; k <= n; k++) {
            var ny = [], set = {};
            lag.forEach(function (m) {
                m.atomer.forEach(function (a) {
                    if (m.grad(a.id) >= 4) return;
                    var m2 = m.kopi(), b = m2.tilfoej("C", Math.random(), Math.random());
                    m2.bind(a.id, b.id, 1);
                    var nv = NK.Navn.analyser(m2).navn;
                    if (!set[nv]) { set[nv] = true; ny.push(m2); }
                });
            });
            lag = ny;
        }
        return lag;
    }
    var talFejl = [];
    for (var n = 4; n <= 9; n++) { var l = traeer(n).length; if (l !== ISOMERER[n]) talFejl.push("C" + n + ": " + l); }
    paastand("alle alkaner C4-C9 får hver sit navn (2, 3, 5, 9, 18, 35 isomerer)", talFejl.length === 0, talFejl.join(", "));
    var c8 = traeer(8).map(function (m) { return NK.Navn.analyser(m).navn; }).sort().join(",");
    paastand("de 18 navne på C8H18 er bogens", c8 === C8, c8);
    function alkener(n) {
        var set = {};
        traeer(n).forEach(function (m) {
            m.bindinger.forEach(function (bd, j) {
                if (m.bindingssum(bd.a) >= 4 || m.bindingssum(bd.b) >= 4) return;
                var m2 = m.kopi();
                m2.bindinger[j].orden = 2;
                set[NK.Navn.analyser(m2).navnUdenStereo] = true;
            });
        });
        return Object.keys(set).length;
    }
    paastand("alkener uden ring: 3, 5 og 13 strukturisomerer af C4H8, C5H10, C6H12", alkener(4) === 3 && alkener(5) === 5 && alkener(6) === 13,
        alkener(4) + ", " + alkener(5) + ", " + alkener(6));

    function buten(cis) {
        var m = new NK.Molekyle();
        var p = [[0, 0], [0.866, -0.5], [1.732, 0], [2.598, cis ? 1 : -0.5]];
        var a = p.map(function (q) { return m.tilfoej("C", q[0], q[1]); });
        m.bind(a[0].id, a[1].id, 1); m.bind(a[1].id, a[2].id, 2); m.bind(a[2].id, a[3].id, 1);
        return m;
    }
    paastand("zigzag er trans: trans-but-2-en", NK.Navn.analyser(buten(false)).navn === "trans-but-2-en");
    paastand("samme side er cis: cis-but-2-en", NK.Navn.analyser(buten(true)).navn === "cis-but-2-en");
    paastand("but-1-en og 2-methylbut-2-en har ingen cis/trans", !NK.Navn.analyser(smiles(NK, "C=CCC")).stereoMulig && NK.Navn.analyser(smiles(NK, "CC(C)=CC")).stereo === null);
    paastand("den gamle skrivemåde 2-methyl-2-buten kendes", NK.Navn.gammelForm(NK.Navn.analyser(smiles(NK, "CC(C)=CC"))) === "2-methyl-2-buten");

    overskrift("3. Molekylformel og molarmasse (H 1,01 som i sc5.1)");
    var fm = [["CCO", "C₂H₆O", "46,08"], ["CC(=O)O", "C₂H₄O₂", "60,06"], ["CCCCCC", "C₆H₁₄", "86,20"], ["CBr", "CH₃Br", "94,94"],
        ["CN", "CH₅N", "31,07"], ["C1=CC=CC=C1", "C₆H₆", "78,12"], ["ClC(Cl)Cl", "CHCl₃", "119,37"]];
    var fmFejl = fm.filter(function (x) { var m = smiles(NK, x[0]); return m.formel() !== x[1] || NK.komma(m.molarmasse()) !== x[2]; });
    paastand("formel og M for ethanol, eddikesyre, hexan, brommethan, methylamin, benzen, chloroform", fmFejl.length === 0,
        fmFejl.map(function (x) { var m = smiles(NK, x[0]); return m.formel() + " " + NK.komma(m.molarmasse()); }).join("; "));
    var tegnetH = new NK.Molekyle(), ca = tegnetH.tilfoej("C", 0, 0), ha = tegnetH.tilfoej("H", 1, 0);
    tegnetH.bind(ca.id, ha.id, 1);
    paastand("et tegnet H tæller med: CH₄", tegnetH.formel() === "CH₄");

    overskrift("4. Opgaverne");
    var O = NK.Opgaver, sFejl = [];
    ["ZIGZAG", "ATOMER", "ALKANER", "ALKENER"].forEach(function (k) {
        for (var runde = 0; runde < 6; runde++) {
            var s = O.serie(O[k]);
            if (s.length !== 10) sFejl.push(k + " har " + s.length);
            s.forEach(function (m, j) {
                var rr = NK.Navn.analyser(m.mol);
                if (rr.navn !== m.navn) sFejl.push(k + j + ": " + rr.navn + " / " + m.navn);
                if (k === "ATOMER" && m.antal > 7) sFejl.push(k + j + " har " + m.antal + " C");
                if (k === "ALKENER" && j >= 5 && !m.stereo) sFejl.push(k + j + " uden cis/trans: " + m.navn);
                if (k === "ALKENER" && j < 5 && m.stereo) sFejl.push(k + j + " med cis/trans: " + m.navn);
                if (k === "ALKANER" && !m.res.sub.length) sFejl.push(k + j + " uden sidegruppe: " + m.navn);
                var A = m.mol.atomer;
                for (var a = 0; a < A.length; a++) for (var b = a + 1; b < A.length; b++) {
                    if (Math.hypot(A[a].x - A[b].x, A[a].y - A[b].y) < 0.6) { sFejl.push(m.navn + " har atomer oven i hinanden"); a = A.length; break; }
                }
                var s90 = NK.Layout.struktur90(m.mol, rr), t90 = s90.optaelling(), t0 = m.mol.optaelling();
                if (t90.C !== t0.C || t90.H !== t0.H) sFejl.push(m.navn + ": strukturformlen har " + s90.formel());
            });
        }
    });
    paastand("seks serier af hver slags: ti opgaver med rigtigt navn, cis/trans som trinnet siger, og luft mellem atomerne", sFejl.length === 0, sFejl.slice(0, 5).join("; "));
    var isoFejl = [4, 5, 6, 7].filter(function (n) { return O.isomerer(n).length !== ISOMERER[n]; });
    paastand("Isomerer har 2, 3, 5 og 9 isomerer", isoFejl.length === 0, isoFejl.join(", "));

    overskrift("5. Tjekket");
    var TJ = NK.Tjek;
    function besked(r) { return r.ok ? "OK" + (r.note ? ": " + r.note : "") : r.besked; }
    var fT = [
        ["C5H12", 5, 12, false, "OK"], ["c5h12", 5, 12, false, "OK: Rigtigt. Grundstofsymbolerne"], ["C₅H₁₂", 5, 12, false, "OK"],
        ["H12C5", 5, 12, false, "Skriv C først"], ["C4H12", 5, 12, false, "Tæl C-atomerne"], ["C5H10", 5, 12, false, "Tæl H-atomerne igen"],
        ["C5H12", 5, 10, true, "formlen for en alkan"], ["pentan", 5, 12, false, "Skriv formlen som C og H"]
    ];
    var fFejl = fT.filter(function (x) { return besked(TJ.formel(x[0], x[1], x[2], x[3])).indexOf(x[4]) !== 0 && besked(TJ.formel(x[0], x[1], x[2], x[3])).indexOf(x[4]) < 0; });
    paastand("formlen: rigtige svar og de typiske fejl", fFejl.length === 0, fFejl.map(function (x) { return x[0] + " -> " + besked(TJ.formel(x[0], x[1], x[2], x[3])); }).join("; "));

    function maal(s, stereo) {
        var m = smiles(NK, s);
        return O.faerdig(m, stereo || null);
    }
    var m1 = maal("CCC(CC)C(C)C"), m2 = maal("CC(C)(C)CC"), m3 = maal("CC=CC(C)C", "cis"), m4 = maal("CC(C)=CC");
    var nT = [
        [m1, "3-ethyl-2-methylpentan", "OK"], [m1, "3-Ethyl-2-methylpentan", "OK"], [m1, " 3-ethyl-2-methylpentan ", "OK"],
        [m1, "2-methyl-3-ethylpentan", "alfabetisk"], [m1, "3ethyl2methylpentan", "bindestreg"], [m1, "3-ethyl-2-methylhexan", "hovedkæden"],
        [m1, "3-ethyl-4-methylpentan", "numrene"], [m1, "2-methylpentan", "mangler en sidegruppe"], [m1, "ethylmethylpentan", "mangler numrene"],
        [m1, "3-ethyl-2-methylpentane", "dansk"], [m2, "2,2-methylbutan", "di"], [m2, "2-2-dimethylbutan", "komma"],
        [m2, "2,2-dimethylbuten", "ingen dobbeltbinding"],
        [m3, "cis-4-methylpent-2-en", "OK"], [m3, "4-methylpent-2-en", "mangler cis eller trans"], [m3, "trans-4-methylpent-2-en", "dobbeltbindingen igen"],
        [m3, "cis-2-methylpent-3-en", "dobbeltbindingens nummer"], [m3, "cis-4-methyl-2-penten", "OK: Rigtigt. Den nyere"], [m3, "4-methylpent-2-an", "-en"],
        [m4, "2-methylbut-2-en", "OK"], [m4, "cis-2-methylbut-2-en", "ingen cis eller trans"]
    ];
    var nFejl = nT.filter(function (x) { return besked(TJ.navn(x[1], x[0])).indexOf(x[2]) < 0; });
    paastand("navnet: " + nT.length + " rigtige svar og typiske fejl giver den rette besked", nFejl.length === 0,
        nFejl.map(function (x) { return x[1] + " -> " + besked(TJ.navn(x[1], x[0])); }).join("; "));

    paastand("fane 4: hintet farver de polære grupper, og knappen bliver Vis svaret", OS.farver === 1 && hjaelpK("op") === "Vis svaret");
    OS.vaelg("heptan");
    paastand("fane 4: at lægge molekylet i et lag bedømmer ikke af sig selv", !OS.svaret && OS.res[0] === 0 && OS.valgtLag === "heptan");
    OS.indsend();
    paastand("fane 4: rigtigt med hint giver 70 point, og knappen er Næste molekyle", OS.point === 70 && OS.res[0] === 1 && videreK("op").indexOf("Næste") === 0);
    paastand("fane 4: regnestykket står med brøkstreg: 9 C-atomer / 2 polære grupper = 4,5", !!d.querySelector("#op-regn .broek") && /Forhold\s*=\s*9 C-atomer\s*2 polære grupper\s*=\s*4,5/.test(d.getElementById("op-regn").textContent.replace(/\s+/g, " ")),
        d.getElementById("op-regn").textContent);
    OS.knap();
    saetOP("glycerol");
    svarOP("heptan");
    paastand("fane 4: forkert koster et liv og giver beskeden til fejlen", OS.liv === 2 && OS.res[1] === 3 && /Forkert\. Det opløses i vand\. De 3 polære grupper vejer tungest/.test(kortT("op")),
        kortT("op"));
    tid(3);
    paastand("fane 4: og molekylet flytter selv over i vandet", OS.fig.sted === "vand" && OS.fig.y > OS.zoner.graense);
    OS.knap();
    saetOP("butan-1-ol");
    svarOP("vand");
    tid(3.5);
    paastand("fane 4: præcis 4 C pr. gruppe tæller begge veje og lægger sig i grænsen med OH nedad",
        OS.point === 170 && OS.fig.sted === "graense" && Math.abs(OS.fig.rot) > 0.5 && Math.abs(OS.fig.y - OS.zoner.graense) < OS.zoner.vand.h);
    OS.knap();
    saetOP("octadecansyre");
    OS.knap(); OS.knap();
    tid(3);
    paastand("fane 4: Vis svaret giver 0 point, gul prik og molekylet i heptan", OS.point === 170 && OS.res[3] === 2 && OS.fig.sted === "heptan" &&
        d.querySelectorAll("#op-prikker .prik")[3].classList.contains("vist"));
    OS.knap();
    saetOP("octan");
    var f5 = OS.fig, hp = OS.zoner.heptan;
    OS.musKrog("ned", { x: f5.x, y: f5.y }, { button: 0, pointerId: 1 });
    OS.musKrog("flyt", { x: hp.x + hp.b / 2, y: hp.y + hp.h / 2 }, {});
    var lyser = OS.overLag === "heptan";
    OS.musKrog("op", { x: hp.x + hp.b / 2, y: hp.y + hp.h / 2 }, {});
    OS.indsend();
    paastand("fane 4: molekylet trækkes ned i heptan; laget lyser op, mens det holdes", lyser && OS.res[4] === 1 && OS.point === 270);
    OS.knap();
    saetOP("ethanol");
    var vd = { x: OS.zoner.vand.x + OS.zoner.vand.b / 2, y: OS.zoner.vand.y + 20 };
    OS.musKrog("ned", vd, { button: 0, pointerId: 1 });
    OS.musKrog("op", vd, {});
    OS.indsend();
    paastand("fane 4: et klik på vandet er også et svar", OS.res[5] === 1 && OS.point === 370);
    OS.knap();
    saetOP("hexan");
    d.querySelector('#op-tegning button[data-v="alle"]').click();
    var gAlle = OS.geo(0);
    paastand("fane 4: Alle atomer tegner også H-atomerne", OS.stil === "alle" && gAlle.tekster.filter(function (t) { return t.t === "H"; }).length === 14);
    d.querySelector('#op-tegning button[data-v="zigzag"]').click();
    svarOP("vand");
    OS.knap();
    saetOP("pentan-1-ol");
    svarOP("vand");
    paastand("fane 4: tre liv brugt: spillet er slut, og knappen på kortet er Ny bunke", OS.slut === "tabt" && videreK("op").indexOf("Ny bunke") === 0 &&
        d.getElementById("op-titel").textContent === "Spillet er slut");
    d.querySelectorAll("#op-prikker .prik")[1].click();
    paastand("fane 4: en rød prik viser molekylet og det lag, eleven valgte", d.querySelectorAll("#op-prikker .prik.forkert").length === 3 &&
        /glycerol/.test(d.getElementById("op-mini").textContent) && /Du valgte heptan/.test(d.getElementById("op-mini").textContent));
    OS.knap();
    paastand("fane 4: Nyt spil giver en ny bunke med tre liv og 0 point", !OS.slut && OS.liv === 3 && OS.point === 0 && OS.nr === 0 && OS.res.every(function (x) { return x === 0; }));
    OS.bunke.forEach(function (m, k) { svarOP(OS.m.svar === "begge" ? "vand" : OS.m.svar); if (k < OS.bunke.length - 1) OS.knap(); });
    paastand("fane 4: hele bunken rigtigt: 1500 point, rekorden huskes, og Kemichael roser", OS.slut === "vundet" && OS.point === 1500 &&
        W.JSON.parse(W.localStorage.getItem("nk-sc4.2-oploeselighed-rekord")) === 1500 && OS.laerer && OS.laerer.scene && OS.laerer.scene.navn === "faerdig");
    OS.nytSpil();
    NK.visFane("zigzag");

    overskrift("Kemichaels præsentation: ét trin ad gangen (fælles test)");
    function koerTid(sim, sek) { for (var k = 0; k < Math.round(sek * 60); k++) sim.opdater(1 / 60); }
    [["zigzag", "tegn"], ["zigzag", "atomer"], ["navne"], ["isomerer"], ["oploeselighed"]].forEach(function (f) {
        NK.visFane(f[0]);
        var sim = NK.sims["fane-" + f[0]];
        if (f[1]) d.querySelector('#zz-retning button[data-v="' + f[1] + '"]').click();
        sim.tilpas();
        koerTid(sim, 4);
        NK.Praesentation.selvtest(sim, function (sek) { koerTid(sim, sek); }).forEach(function (r) {
            paastand(f.join(" ") + ": " + r[0], r[1], r[2]);
        });
    });
    d.querySelector('#zz-retning button[data-v="tegn"]').click();
    /* Under praesentationen venter rosen, til han er faerdig */
    NK.visFane("oploeselighed");
    OS.startIntro(true); koerTid(OS, 2.5);
    OS.laererFaerdig(NK.Data.ROS.oploes); koerTid(OS, 1);
    paastand("rosen venter, til præsentationen er slut", OS.laererIIntro() && OS.rosVenter === NK.Data.ROS.oploes);
    OS.springIntro(); koerTid(OS, 0.5);
    paastand("efter præsentationen kommer rosen", !OS.laererIIntro() && !OS.rosVenter && !!(OS.laerer.scene && OS.laerer.scene.navn === "faerdig"));
    koerTid(OS, 12);
    NK.visFane("zigzag");

    overskrift("10. Sproget");
    var tekst = d.body.innerText + "\n" + JSON.stringify(NK.Data) + "\n" + nT.map(function (x) { return besked(TJ.navn(x[1], x[0])); }).join("\n");
    paastand("ingen tankestreger (– og —)", !/[–—]/.test(tekst), (tekst.match(/.{0,30}[–—].{0,30}/) || [""])[0]);
    paastand("ingen 1+ eller 1−", !/\b1[+−-]\s/.test(tekst));
    /* Brugerens regel 4. nov. 2026: han siger mere ad gangen, i hele saetninger */
    var intro = [].concat(NK.Data.INTRO_ZIGZAG, NK.Data.INTRO_ZIGZAG_ATOMER, NK.Data.INTRO_NAVNE, NK.Data.INTRO_ISOMERER, NK.Data.INTRO_OPLOES)
        .map(function (l) { return l.tekst; });
    var lange = intro.filter(function (t) { var n = t.split(/[.?] /).length; return t.length > 420 || n < 2 || n > 4; });
    paastand("hvert trin i præsentationen er to til fire sætninger (højst 420 tegn)", lange.length === 0, lange[0]);
    var halve = intro.filter(function (t) { return !/^[A-ZÆØÅ].*\.$/.test(t) || /^Her\b/.test(t); });
    paastand("præsentationens trin er hele sætninger, og intet begynder med 'Her'", halve.length === 0, halve[0]);
    var ros = Object.keys(NK.Data.ROS).map(function (k) { return NK.Data.ROS[k]; });
    var korte = ros.filter(function (t) { return t.length > 130 || !/^[A-ZÆØÅ].*\.$/.test(t) || t.split(" ").length < 5; });
    paastand("rosen er hele sætninger på højst 130 tegn", korte.length === 0, korte[0]);

    overskrift("11. Layout");
    var ramme = document.getElementById("ramme");
    [[520, 380], [900, 600], [1300, 820], [1500, 900]].forEach(function (st) {
        ramme.style.width = st[0] + "px";
        ramme.style.height = st[1] + "px";
        W.dispatchEvent(new W.Event("resize"));
        var fejlL = [];
        ["fane-zigzag", "fane-navne", "fane-isomerer", "fane-oploeselighed"].forEach(function (id) {
            NK.visFane(id.replace("fane-", ""));
            var s = NK.sims[id];
            s.tilpas();
            s.opdater(1 / 60);
            s.tegn();
            if (!s.lay || s.lay.tavle.b < 150 || s.lay.tavle.h < 100) fejlL.push(id + " tavle " + (s.lay ? Math.round(s.lay.tavle.b) + "x" + Math.round(s.lay.tavle.h) : "mangler"));
            var f = s.felt();
            if (f.h < 60) fejlL.push(id + " felt " + Math.round(f.h));
        });
        var vandret = d.documentElement.scrollWidth > d.documentElement.clientWidth + 1;
        paastand(st[0] + " × " + st[1] + ": tavler og felter har plads, ingen vandret rulning", !fejlL.length && !vandret, fejlL.join(", ") + (vandret ? " rulning" : ""));
        /* Fane 5: de store molekyler kan stå på tavlen over glasset og ligge i begge lag */
        NK.visFane("oploeselighed");
        var o5 = NK.sims["fane-oploeselighed"], fejl5 = [];
        ["octadecansyre", "tetradecan-5,10-diol", "hexan-1,2,3,4,5,6-hexol"].forEach(function (navn) {
            ["zigzag", "alle"].forEach(function (stil) {
                o5.stil = stil;
                o5.bunke[o5.nr] = lavOP(navn);
                o5.startMolekyle();
                o5.tilpas();
                o5.opdater(1 / 60);
                var g = o5.geo(0), mt = o5.maal("tavle"), t = o5.lay.tavle, z = o5.zoner;
                if (mt.y + g.y0 < t.y || mt.y + g.y1 > z.glas.y || mt.x + g.x0 < t.x || mt.x + g.x1 > t.x + t.b) fejl5.push(navn + " " + stil + " tavle");
                ["heptan", "vand"].forEach(function (lag) {
                    var m = o5.maal(lag), L = z[lag];
                    if (m.y + g.y0 * m.s < L.y - 1 || m.y + g.y1 * m.s > L.y + L.h + 1 || m.x + g.x0 * m.s < L.x - 1 || m.x + g.x1 * m.s > L.x + L.b + 1) fejl5.push(navn + " " + stil + " " + lag);
                });
            });
        });
        o5.stil = "zigzag";
        o5.nytSpil();
        paastand(st[0] + " × " + st[1] + ": fane 4: lange molekyler står på tavlen over glasset og ligger inde i lagene", !fejl5.length, fejl5.join(", "));
    });

    overskrift("12. Papirkortet (6. nov. 2026)");
    var PRE = ["zz", "nv", "is", "op"], FANER = ["zigzag", "navne", "isomerer", "oploeselighed"];
    paastand("papirkortet er slået til (papirkort.css, papirkort.js og body.papirkort)", d.body.classList.contains("papirkort") && !!NK.Papir &&
        !!d.querySelector('link[href="../faelles/papirkort.css"]'));
    var iScene = PRE.filter(function (p) { var e = d.getElementById(p + "-skort"); return e && e.parentElement.classList.contains("scene"); });
    paastand("hver fane har ét papirkort i scenen", iScene.length === 4, iScene.join(","));
    paastand("ingen statuslinje nederst i scenen", !d.querySelector(".scene-mrk"));
    var iPanel = d.querySelectorAll(".panel .besked, .panel .opgave-spm, .panel .knaprad, .panel .scenekort");
    paastand("opgaveteksten, beskeden og hintknappen står ikke i panelet", iPanel.length === 0, iPanel.length + " i panelet");
    function rydZZ() { d.querySelector('#zz-retning button[data-v="tegn"]').click(); Z.serier.tegn.status = Z.serier.tegn.status.map(function () { return 0; }); Z.startOpgave(); }
    NK.visFane("zigzag"); rydZZ();
    var ind = d.querySelector("#zz-skort .knap.indsend");
    paastand("Zigzag: Indsend svar er grå, før alle C-atomer er brugt", ind && ind.classList.contains("ikke-klar") && !Z.loest);
    Z.indsend();
    paastand("Zigzag: Indsend svar uden en færdig tegning bedømmer ikke", !Z.loest && Z.beskedKlasse !== "skidt");
    Z.braet.saet(Z.maal.mol.kopi(), true); Z.aendret("atom");
    ind = d.querySelector("#zz-skort .knap.indsend");
    paastand("Zigzag: med alle C-atomer er Indsend svar klar, men intet er bedømt", ind && ind.classList.contains("klar") && !Z.loest);
    var opgTekst = d.querySelector("#zz-skort .sk-tekst").textContent;
    Z.indsend();
    var bliv = d.querySelector("#zz-skort .sk-bund.bliv");
    paastand("Zigzag: rigtigt svar bliver på opgaven med forklaringen og Næste dér, hvor Indsend svar stod",
        Z.loest && bliv && bliv.querySelector("[data-videre]") && d.querySelector("#zz-skort .sk-tekst").textContent === opgTekst && !d.querySelector("#zz-skort .knap.indsend"));
    Z.videre();
    paastand("Zigzag: rosen står ikke under det næste molekyle", !Z.loest && !d.querySelector("#zz-skort .bliv") && !/Rigtigt/.test(kortT("zz")));
    var forfra = PRE.filter(function (p) { return /forfra|Nye molekyler|Nyt spil|↺/i.test(kortT(p)); });
    paastand("Start forfra står aldrig på kortet (forfra ligger i panelet)", forfra.length === 0 && !!d.getElementById("zz-forfra").closest(".panel"), forfra.join(","));
    Z.braet.saet(Z.maal.mol.kopi(), true); Z.aendret("atom"); Z.indsend();
    var gem = Z.braet.antal();
    Z.L.canvas.dispatchEvent(new W.PointerEvent("pointerdown", { clientX: 200, clientY: 300, bubbles: true, button: 0 }));
    paastand("Zigzag: et klik på tavlen, mens kortet er løst, får kortet til at blinke", d.getElementById("zz-skort").classList.contains("blink") && Z.braet.antal() === gem);
    Z.videre();
    NK.visFane("navne");
    N.retning = "navn"; N.startOpgave();
    paastand("Navne: Indsend svar er grå uden et navn i feltet", d.querySelector("#nv-skort .knap.indsend").classList.contains("ikke-klar"));
    d.getElementById("nv-input").value = "x"; d.getElementById("nv-input").dispatchEvent(new W.Event("input"));
    paastand("Navne: med et navn i feltet er Indsend svar klar", d.querySelector("#nv-skort .knap.indsend").classList.contains("klar"));
    d.getElementById("nv-input").value = N.maal.navn;
    d.getElementById("nv-input").dispatchEvent(new W.KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
    paastand("Navne: Enter i feltet er Indsend svar", N.loest);
    N.videre();
    d.querySelector('#nv-retning button[data-v="byg"]').click();
    /* Kortets hoejde: hoejst kortZone() i en almindelig og en lav skaerm, ogsaa med
       det laengste hint og den laengste forklaring */
    function kortMaal(sim, pre, navn, fejl) {
        sim.visKort();
        var h = d.getElementById(pre + "-skort").offsetHeight, z = sim.kortZone();
        if (h > z) fejl.push(navn + " " + h + ">" + z);
        if (sim.lay && sim.lay.tavle.y < 10 + z) fejl.push(navn + " tavlen under kortet");
    }
    [[1400, 860], [1400, 640], [1024, 640]].forEach(function (st) {
        ramme.style.width = st[0] + "px"; ramme.style.height = st[1] + "px";
        W.dispatchEvent(new W.Event("resize"));
        var fejlK = [];
        NK.visFane("zigzag"); rydZZ(); Z.tilpas(); kortMaal(Z, "zz", "zz opgave", fejlK);
        Z.hjaelpKlik(); kortMaal(Z, "zz", "zz hint", fejlK);
        Z.besked("To C-atomer har forkert antal H. De er markeret med rødt. Hvert C har fire bindinger i alt.", "skidt"); kortMaal(Z, "zz", "zz fejl", fejlK);
        Z.hjaelpKlik(); kortMaal(Z, "zz", "zz svaret", fejlK);
        Z.besked(Z.linje + " " + NK.Data.KLISTER_KRAV.serie, "gul"); kortMaal(Z, "zz", "zz krav", fejlK);
        Z.videre();
        NK.visFane("navne"); N.tilpas();
        var langt = N.serie().liste.slice().sort(function (a, b) { return b.navn.length - a.navn.length; })[0];
        N.serie().liste[N.serie().nr] = langt; N.startOpgave(); kortMaal(N, "nv", "nv opgave", fejlK);
        N.hjaelpKlik(); kortMaal(N, "nv", "nv hint", fejlK);
        N.hjaelpKlik(); kortMaal(N, "nv", "nv svaret", fejlK);
        N.videre();
        NK.visFane("isomerer"); I.nytNiveau(7); I.tilpas(); kortMaal(I, "is", "is opgave", fejlK);
        I.hjaelpKlik(); kortMaal(I, "is", "is hint", fejlK);
        I.hjaelpKlik(); kortMaal(I, "is", "is vist", fejlK);
        I.fundet[7] = []; I.vist[7] = {}; I.nytNiveau(4);
        NK.visFane("oploeselighed"); OS.nytSpil(); OS.tilpas();
        OS.bunke[OS.nr] = lavOP("hexan-1,2,3,4,5,6-hexol"); OS.startMolekyle(); kortMaal(OS, "op", "op opgave", fejlK);
        OS.hjaelpKlik(); kortMaal(OS, "op", "op hint", fejlK);
        OS.vaelg("heptan"); kortMaal(OS, "op", "op valgt", fejlK);
        OS.liv = 1; OS.indsend(); kortMaal(OS, "op", "op forkert", fejlK);
        OS.nytSpil();
        paastand(st[0] + " × " + st[1] + ": kortet holder sig i kortZone på alle fire faner, og tavlen begynder under det", !fejlK.length, fejlK.join(", "));
    });
    ramme.style.width = ""; ramme.style.height = "";
    W.dispatchEvent(new W.Event("resize"));
    NK.visFane("zigzag");
}
</script>
