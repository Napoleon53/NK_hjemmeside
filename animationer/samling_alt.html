<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemi-animationer</title>
<!-- Animationspanelet (28. nov. 2026). Indholdet står i panel/menu.js, koden i panel/panel.js. -->
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="panel/panel.css">
<script>window.goatcounter = {path: function (p) { return location.host + p; }};</script>
<script data-goatcounter="https://napoleon53.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="bibliotek">
    <header class="top">
        <div class="top-inder">
            <div>
                <h1 id="titel">Animationer til kemi C</h1>
                <p class="manchet">Animationerne kører direkte i browseren. De bliver løbende rettet til.</p>
            </div>
            <div class="niveau" id="niveau" role="group" aria-label="Kemi C eller kemi B"></div>
            <label class="soeg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
                <input type="search" id="soeg" placeholder="Søg efter en animation, fx titrering eller pH" aria-label="Søg efter en animation" autocomplete="off">
            </label>
        </div>
    </header>
    <div class="krop">
        <nav aria-label="Kapitler"><ul class="kapnav" id="kapnav"></ul></nav>
        <main>
            <div id="sektioner"></div>
            <p class="intet" id="intet"></p>
        </main>
    </div>
    <footer class="fod">
        <div id="novoFod"></div>
        <span class="fod-tekst"><a href="../index.html">kemiformler.dk</a> &middot; &copy; Niels Kr&aelig;mmer &middot; <a href="../licens.html">CC BY-NC 4.0</a></span>
        <button type="button" class="fb-link" id="fbFod">Giv feedback på animationerne</button>
    </footer>
</div>

<iframe id="vindue" title="Animation"></iframe>
<button type="button" class="hjoerne" id="hjoerne" title="Menu: skift animation, kopiér link, feedback" aria-label="Åbn menuen" aria-controls="skuffe" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
<div class="slor" id="slor"></div>
<aside class="skuffe" id="skuffe" aria-label="Menu">
    <div class="sk-top">
        <button type="button" class="sk-tilbage" id="tilBibliotek">&lsaquo; Alle animationer</button>
        <button type="button" class="sk-luk" id="skLuk" aria-label="Luk menuen">&times;</button>
    </div>
    <div class="sk-chips" id="skChips" role="group" aria-label="Kapitler"></div>
    <div class="sk-kap"><h2 id="skKapTitel"></h2></div>
    <ul class="sk-liste" id="skListe"></ul>
    <div class="sk-bund">
        <div class="sk-knapper">
            <button type="button" id="linkKnap" title="Kopiér link til denne animation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><span>Kopiér link</span></button>
            <button type="button" id="fbKnap" class="fb" title="Giv feedback (rettelser eller forslag)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Feedback</span></button>
        </div>
        <div id="novoSkuffe"></div>
    </div>
</aside>

<div class="fb-overlay" id="fbOverlay">
    <div class="fb-modal" role="dialog" aria-modal="true" aria-labelledby="fbTitel">
        <div class="fb-hoved"><h2 id="fbTitel">Giv feedback</h2><button type="button" class="fb-luk" id="fbLuk" aria-label="Luk">&times;</button></div>
        <p class="fb-intro">Har du fundet en fejl, eller har du et forslag til en forbedring? Al feedback bliver læst.</p>
        <label for="fbKap">Kapitel</label><select id="fbKap"></select>
        <label for="fbAnim">Animation</label><select id="fbAnim"></select>
        <label for="fbNavn">Dit navn (valgfrit)</label><input type="text" id="fbNavn" maxlength="60" placeholder="Kan udelades">
        <label for="fbTekst">Din feedback <span id="fbTal">(0 tegn, mindst 20)</span></label>
        <textarea id="fbTekst" maxlength="3000" placeholder="Beskriv fejlen eller forslaget"></textarea>
        <div class="fb-status" id="fbStatus" role="status"></div>
        <div class="fb-knapper"><button type="button" class="fb-annuller" id="fbAnnuller">Annuller</button><button type="button" class="fb-send" id="fbSend">Send feedback</button></div>
    </div>
</div>

<script src="panel/menu.js"></script>
<script src="panel/panel.js"></script>
</body>
</html>
