<svg xmlns="http://www.w3.org/2000/svg" width="224" height="264" viewBox="0 0 112 132" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Det store baegerglas (baegerStor og badet). Inderside x 8-104 fra
       y 8 til 126, aabningen er (56, 4). Indholdet tegnes bag filen.
       Inddelingen og rumfanget staar ikke her: tegning.js tegner dem ud
       fra geometrien (streger i udstyr.js), saa de passer til maks. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.34"/>
      <stop offset="0.12" stop-color="#d4ebfa" stop-opacity="0.07"/>
      <stop offset="0.85" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <path d="M5 5 L5 122 Q5 130 13 130 L99 130 Q107 130 107 122 L107 5 Z" fill="url(#glas)"/>
  <path d="M5 5 L5 122 Q5 130 13 130 L99 130 Q107 130 107 122 L107 5" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M8 6 L8 121 Q8 126 13 126 L99 126 Q104 126 104 121 L104 6" fill="none" stroke="#dcecf8" stroke-opacity="0.2" stroke-width="0.8"/>

  <!-- Kant med tud -->
  <path d="M0.5 3.5 Q2 0.5 7 2 L109 2 Q111 2 111 4 Q111 6 109 6 L7 6 Q3 6 0.5 3.5 Z" fill="#dcecf8" fill-opacity="0.26" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1.1"/>

  <!-- Genskin -->
  <rect x="12" y="12" width="3.6" height="104" rx="1.8" fill="#ffffff" fill-opacity="0.2"/>
</svg>
