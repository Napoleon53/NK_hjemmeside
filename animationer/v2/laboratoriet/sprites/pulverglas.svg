  <!-- Aabent pulverglas. Aabningen er (19, 4). Pulveret tegnes af
       animationen i stoffets farve (pulverfelt), saa et tomt glas er tomt.
       Etiketten (x 4-34, y 15-34) har formlen oeverst og faremaerkerne
       nederst; begge tegnes af animationen (etiket og maerkeFelt i
       udstyr.js). -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#d4ebfa" stop-opacity="0.12"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <path d="M10 2 L28 2 L28 9 Q36 10 36 17 L36 47 Q36 51 32 51 L6 51 Q2 51 2 47 L2 17 Q2 10 10 9 Z" fill="url(#glas)" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.2"/>
