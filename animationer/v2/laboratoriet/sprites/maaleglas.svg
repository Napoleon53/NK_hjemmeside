<svg xmlns="http://www.w3.org/2000/svg" width="88" height="440" viewBox="0 0 44 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Maaleglas, 100 mL. Inderside x 7-37 fra y 8 til 200, og tuden er
       (2, 3,5). Aabningen er (22, 4). Indholdet tegnes bag filen.
       Inddelingen og rumfanget staar ikke her: tegning.js tegner dem ud fra
       geometrien (streger i udstyr.js), saa de passer til maks. -->
  <defs>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.36"/>
      <stop offset="0.2" stop-color="#d4ebfa" stop-opacity="0.07"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="fod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86cc"/>
      <stop offset="1" stop-color="#1f5a94"/>
    </linearGradient>
  </defs>

  <path d="M5 6 L5 202 L39 202 L39 6 Z" fill="url(#glas)"/>
  <path d="M5 6 L5 202 L39 202 L39 6" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.5"/>
  <path d="M1 2.5 Q3.5 6.5 6 6.5 L39 6.5 L41 2.5 Z" fill="#dcecf8" fill-opacity="0.25" stroke="#e6f2fb" stroke-opacity="0.9" stroke-width="1"/>
  <rect x="9" y="12" width="2.6" height="182" rx="1.3" fill="#ffffff" fill-opacity="0.2"/>

  <!-- Fod -->
  <path d="M2 202 L42 202 L44 212 Q44 220 37 220 L7 220 Q0 220 0 212 Z" fill="url(#fod)"/>
</svg>
