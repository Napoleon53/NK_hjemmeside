<svg xmlns="http://www.w3.org/2000/svg" width="220" height="52" viewBox="0 0 110 26" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Kummen i en haandvask, sat ned i bordpladen (F53). Kummens midte
       er (55, 13); afloebet sidder lige under. Hanen er sin egen sprite
       (vandhane.svg), saa glasset under hanen og kummen er to maal. -->
  <defs>
    <radialGradient id="bund" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#3a414c"/>
      <stop offset="1" stop-color="#15181d"/>
    </radialGradient>
    <linearGradient id="kant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f6"/>
      <stop offset="1" stop-color="#8e98a5"/>
    </linearGradient>
  </defs>
  <ellipse cx="55" cy="13" rx="53" ry="12" fill="url(#kant)" stroke="#5d6574" stroke-width="0.8"/>
  <ellipse cx="55" cy="13.5" rx="46" ry="9" fill="url(#bund)"/>
  <ellipse cx="55" cy="16" rx="6" ry="2" fill="#4a515d" stroke="#8a929e" stroke-width="0.6"/>
  <path d="M14 10 Q30 5 55 4.6" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2"/>
</svg>
