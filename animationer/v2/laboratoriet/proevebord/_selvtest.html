<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - Prøvebordet</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer bordet igennem med de samme
   funktioner, som musen bruger: stofmodellen, haeldning, draaber,
   spatel, roering, termometer, varmeplade, stativ, at saette ned,
   overloeb, spild, vaeltede glas, affald og laereren. Skal aabnes
   gennem en lokal server (Chrome afviser iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    /* Baggrundslivet (han gaar forbi, naar der er stille) skal ikke
       blande sig i testens scener */
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var bord = NK.bord, St = NK.Stof, B = NK.Beholder, g = bord.g;
    paastand("bordet er bygget", !!bord && bord.liste.length > 20, bord.liste.length + " genstande");
    paastand("introen aabner og lukker", !!NK.intro && (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) && (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    var alle = Object.keys(NK.Sprites.FILER);
    var klar = alle.filter(function (n) { return NK.Sprites.klar(n); });
    paastand("sprites er indlaest", klar.length === alle.length, klar.length + " af " + alle.length + (klar.length < alle.length ? ": mangler " + alle.filter(function (n) { return !NK.Sprites.klar(n); }).join(", ") : ""));

    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) bord.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function faerdig() { vent(function () { return !bord.koer.igang(); }, 8); }
    /* Det, der svaever, traekkes vaek (som med musen): det gaar hjem */
    function vaek(gg) { if (!gg.svaev) return; gg.svaev = null; bord.koer.start([NK.Koer.hjemTil(gg, 0.3, 20)], "hjem"); faerdig(); }
    function V(c) { return B.volumen(c); }
    function n(c, s) { return B.samlet(c).n[s] || 0; }
    function frisk() { NK.startForfra(); adv(0.1); g = bord.g; }
    /* Laereren ser alt i testen, saa den er deterministisk */
    bord.laererAltid = true;
    /* Som musen: tag genstanden, flyt dens anker til pt, og slip */
    function traek(gg, pt) { bord.startBaer(gg); gg.p.x = pt.x; gg.p.y = pt.y; bord.stopBaer(pt); }
    /* Punktet, ankeret skal staa i, for at foden er i (x, y) */
    function medFod(gg, x, y) { var t = gg.type; return { x: x - t.b / 2 + t.anker.x, y: y - t.h + t.anker.y }; }

    overskrift("2. Stoffer og notation");
    paastand("NO₃⁻ skrives med ét minus", St.formel("NO3-") === "NO₃⁻", St.formel("NO3-"));
    paastand("Cu²⁺ og Fe³⁺", St.formel("Cu2+") === "Cu²⁺" && St.formel("Fe3+") === "Fe³⁺");
    paastand("PbI₂(s) med fase", St.formel("PbI2(s)", true) === "PbI₂(s)", St.formel("PbI2(s)", true));
    var uden1 = Object.keys(St.STOFFER).every(function (s) { var f = St.formel(s); return f.indexOf("¹") < 0; });
    paastand("ingen formel har ladningen 1+ eller 1−", uden1);
    var alleAfstemt = St.REAKTIONER.every(function (rx) { return St.afstemt(rx); });
    paastand("alle reaktioner er afstemt i ladning", alleAfstemt, St.REAKTIONER.filter(function (rx) { return !St.afstemt(rx); }).map(function (rx) { return rx.id; }).join(", "));
    paastand("ligning med ligevaegtspil", St.ligning(St.REAKTIONER.filter(function (rx) { return rx.id === "fescn"; })[0], true) === "Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)", St.ligning(St.REAKTIONER.filter(function (rx) { return rx.id === "fescn"; })[0], true));
    var o = St.lav({ V: 10, mM: { "Cu2+": 100, "SO42-": 100 } });
    var f = St.farve(o, 1);
    paastand("0,1 M CuSO₄ er blaat", f && f.b > f.r + 60 && f.a > 0.7, f ? Math.round(f.r) + "," + Math.round(f.g) + "," + Math.round(f.b) + " a=" + f.a.toFixed(2) : "ingen");
    var d2 = St.del(o, 4);
    paastand("del tager 4 mL med 40 % af ionerne", Math.abs(d2.V - 4) < 1e-9 && Math.abs(d2.n["Cu2+"] - 400) < 1e-6 && Math.abs(o.n["Cu2+"] - 600) < 1e-6);

    overskrift("3. Haeldning");
    frisk();
    var b100 = g.baegerLille, glas1 = g.glas1;
    paastand("baegerglasset staar tomt paa varmepladen", V(b100) < 0.01 && b100.paa === g.plade);
    paastand("haeld fra flasken med CuSO₄ i baegerglasset", bord.haeld(g.fl_cu, b100, 10));
    faerdig();
    paastand("baegerglasset har 10 mL", Math.abs(V(b100) - 10) < 0.3, V(b100).toFixed(2));
    paastand("flasken har 190 mL (den er fyldt til 200)", Math.abs(V(g.fl_cu) - 190) < 0.3, V(g.fl_cu).toFixed(1));
    paastand("flasken bliver haengende over baegerglasset", !!g.fl_cu.svaev && g.fl_cu.svaev.maal === b100 && g.fl_cu.p.y < b100.p.y, g.fl_cu.p.y.toFixed(0));
    paastand("klik paa et andet glas afvises, mens flasken haenger", !bord.ned({ x: g.baegerStor.p.x, y: g.baegerStor.p.y + 20 }) && !bord.holdt);
    paastand("klik paa flasken haelder en portion til", bord.klik("fl_cu"));
    faerdig();
    paastand("baegerglasset har 20 mL (flaskens portion er 10 mL, under en femtedel af 100 mL)", Math.abs(V(b100) - 20) < 0.3, V(b100).toFixed(2));
    vaek(g.fl_cu);
    paastand("flasken er hjemme igen", Math.abs(g.fl_cu.p.x - g.fl_cu.hjem.x) < 1 && Math.abs(g.fl_cu.p.y - g.fl_cu.hjem.y) < 1);
    paastand("baegerglasset er valgt", bord.valgtBeholder() === b100);
    paastand("Cu²⁺ er 100 mM i baegerglasset", Math.abs(St.konc(B.samlet(b100), "Cu2+") - 100) < 1, St.konc(B.samlet(b100), "Cu2+").toFixed(1));
    paastand("haeld baegerglasset i glas 1", bord.haeld(b100, glas1, 5));
    faerdig();
    paastand("glas 1 har 5 mL, baegerglasset 15 mL", Math.abs(V(glas1) - 5) < 0.3 && Math.abs(V(b100) - 15) < 0.3, V(glas1).toFixed(2) + " / " + V(b100).toFixed(2));
    paastand("zoomboblen viser partikler", bord.mikro.partikler.length > 0, bord.mikro.partikler.length);
    paastand("partiklerne har formler med ladning", bord.mikro.partikler.every(function (p) { return p.tekst.length > 0; }) && bord.mikro.partikler.some(function (p) { return p.tekst === "Cu²⁺"; }));
    NK.opdaterPanel();
    paastand("zoomboblen staar i panelet, ikke paa scenen", !bord.boble && !d.getElementById("boble-laerred").hidden);
    var V1 = V(glas1);
    paastand("et klik paa en flaske vaelger den og haelder ikke", bord.klik("fl_pb") && bord.valgtBeholder() === g.fl_pb && Math.abs(V(glas1) - V1) < 1e-9 && !bord.koer.igang());
    paastand("panelet viser flaskens indhold", (NK.opdaterPanel(), d.getElementById("glas-titel").textContent.indexOf("Pb(NO₃)₂") >= 0), d.getElementById("glas-titel").textContent);
    paastand("et klik paa spatlen goer ingenting", !bord.klik("spatel") && !bord.koer.igang() && !g.spatel.last);

    overskrift("3b. Haeldning med haanden");
    frisk();
    /* Holder flasken stille over baegerglasset: musen staar i pt, tiden gaar */
    function hold(gg, pt, sek) {
        var nu = 1000;
        bord.flyt(pt, nu);
        for (var k = 0; k < Math.round(sek * 60); k++) { nu += 1000 / 60; bord.flyt(pt, nu); bord.opdater(1 / 60); }
    }
    var b250 = g.baegerStor;
    bord.ned({ x: g.fl_cu.p.x, y: g.fl_cu.p.y + 30 });
    var over = { x: b250.p.x + 6, y: b250.p.y - 30 };
    hold(g.fl_cu, over, 0.2);
    paastand("flasken er taget og holdes over baegerglasset", bord.baerer === g.fl_cu && bord.slipMaal === "baegerStor", bord.slipMaal);
    paastand("intet er haeldt endnu", V(b250) < 0.01);
    hold(g.fl_cu, over, 2.0);
    var V2 = V(b250);
    paastand("efter 2 s har den vippet og haeldt", V2 > 5 && V2 < 40 && g.fl_cu.p.v < -0.8, V2.toFixed(1) + " mL, v " + g.fl_cu.p.v.toFixed(2));
    paastand("straalen tegnes", !!bord.straale && bord.straale.haand);
    hold(g.fl_cu, over, 1.0);
    paastand("den haelder videre, saa laenge den holdes", V(b250) > V2 + 5, V(b250).toFixed(1));
    var V3 = V(b250);
    bord.op();
    faerdig();
    paastand("slip efter haeldning giver ingen portion oveni, og flasken bliver haengende", Math.abs(V(b250) - V3) < 0.01 && !!g.fl_cu.svaev, V(b250).toFixed(1));
    paastand("kobberioner i baegerglasset", n(b250, "Cu2+") > 500, n(b250, "Cu2+").toFixed(0));
    vaek(g.fl_cu);
    bord.ned({ x: g.fl_ki.p.x, y: g.fl_ki.p.y + 30 });
    hold(g.fl_ki, { x: b250.p.x + 5, y: b250.p.y - 30 }, 0.15);
    bord.op(); faerdig();
    paastand("et hurtigt slip giver én portion (10 mL)", Math.abs(V(b250) - V3 - 10) < 0.3, (V(b250) - V3).toFixed(1));
    var uheldH = bord.antalUheld;
    vaek(g.fl_ki);
    bord.ned({ x: g.fl_hcl.p.x, y: g.fl_hcl.p.y + 30 });
    hold(g.fl_hcl, { x: b250.p.x + 62, y: b250.p.y - 40 }, 2.2);
    paastand("holdes tuden ved siden af glasset, haeldes der paa bordet", bord.antalUheld === uheldH + 1 && bord.pytter.length > 0 && Math.abs(V(b250) - V3 - 10) < 0.3, "uheld " + bord.antalUheld + ", V " + V(b250).toFixed(1));
    bord.op(); faerdig();
    vent(function () { return !bord.laerer.scene; }, 30);
    vaek(g.fl_hcl);
    bord.ned({ x: g.ag.p.x, y: g.ag.p.y + 30 });
    hold(g.ag, { x: b250.p.x, y: b250.p.y - 40 }, 2.5);
    paastand("draabeflasken vender og drypper, mens den holdes", Math.abs(Math.abs(g.ag.p.v) - Math.PI) < 0.3 && V(g.ag) < 59.9, V(g.ag).toFixed(2) + " mL tilbage");
    bord.op(); faerdig();
    vent(function () { return bord.draaber.length === 0; }, 4); adv(1);
    var agIalt = n(b250, "Ag+") + n(b250, "AgI(s)") + n(b250, "Ag2SO4(s)") + n(b250, "Ag(s)");
    paastand("draaberne landede i glasset (soelv i alt; iodidet er allerede brugt af kobberionerne til CuI)", agIalt > 2, agIalt.toFixed(1) + " umol Ag, CuI " + n(b250, "CuI(s)").toFixed(0) + ", I2 " + n(b250, "I2").toFixed(0));

    overskrift("4. Bundfald, ligevaegt og neutralisation");
    frisk();
    bord.haeld(g.fl_ki, g.glas2, 3); faerdig();
    bord.haeld(g.fl_pb, g.glas2, 3); faerdig();
    adv(3);
    paastand("Pb²⁺ + 2 I⁻ giver gult PbI₂(s)", n(g.glas2, "PbI2(s)") > 50, n(g.glas2, "PbI2(s)").toFixed(0) + " µmol");
    paastand("I⁻ er brugt op, Pb²⁺ i overskud", n(g.glas2, "I-") < 5 && n(g.glas2, "Pb2+") > 100, "I⁻ " + n(g.glas2, "I-").toFixed(1) + ", Pb²⁺ " + n(g.glas2, "Pb2+").toFixed(0));
    paastand("vaesken er uklar af bundfaldet", St.uklar(B.samlet(g.glas2)) > 0.3, St.uklar(B.samlet(g.glas2)).toFixed(2));
    bord.haeld(g.fl_fe, g.glas3, 3); faerdig();
    bord.haeld(g.fl_scn, g.glas3, 3); faerdig();
    adv(3);
    var x = n(g.glas3, "FeSCN2+");
    paastand("Fe³⁺ + SCN⁻ ⇌ FeSCN²⁺ indstiller sig", x > 1 && x < 30, x.toFixed(1) + " µmol");
    var fr = St.farve(B.samlet(g.glas3), 1);
    paastand("blandingen er roedlig", fr && fr.r > fr.g + 30 && fr.r > fr.b + 30, Math.round(fr.r) + "," + Math.round(fr.g) + "," + Math.round(fr.b));
    var x0 = x;
    bord.sproejt(g.vand, g.glas3); faerdig();
    adv(3);
    paastand("fortynding forskyder mod venstre", n(g.glas3, "FeSCN2+") < x0, x0.toFixed(1) + " -> " + n(g.glas3, "FeSCN2+").toFixed(1));
    bord.haeld(g.fl_hcl, g.glas4, 2); faerdig();
    bord.haeld(g.fl_naoh, g.glas4, 2); faerdig();
    adv(2);
    paastand("H⁺ + OH⁻ neutraliserer", n(g.glas4, "H+") < 1 && n(g.glas4, "OH-") < 1, "H⁺ " + n(g.glas4, "H+").toFixed(1) + ", OH⁻ " + n(g.glas4, "OH-").toFixed(1));

    overskrift("4b. Syre-base, redox, gas og varme");
    frisk();
    bord.haeld(g.fl_hcl, g.glas1, 3); faerdig(); adv(1);
    paastand("0,1 M HCl har pH 1", Math.abs(St.pH(B.samlet(g.glas1)) - 1) < 0.1, St.pH(B.samlet(g.glas1)).toFixed(2));
    bord.haeld(g.fl_naoh, g.glas2, 3); faerdig(); adv(1);
    paastand("0,1 M NaOH har pH 13", Math.abs(St.pH(B.samlet(g.glas2)) - 13) < 0.1, St.pH(B.samlet(g.glas2)).toFixed(2));
    bord.sproejt(g.vand, g.glas3); faerdig(); adv(2);
    paastand("vand har pH 7", Math.abs(St.pH(B.samlet(g.glas3)) - 7) < 0.3, St.pH(B.samlet(g.glas3)).toFixed(2));
    bord.haeld(g.fl_hac, g.glas4, 3); faerdig(); adv(2);
    paastand("0,1 M ethansyre har pH ca. 2,9", Math.abs(St.pH(B.samlet(g.glas4)) - 2.88) < 0.15, St.pH(B.samlet(g.glas4)).toFixed(2));
    var T1 = B.samlet(g.glas1).T;
    bord.haeld(g.fl_naoh, g.glas1, 3); faerdig(); adv(2);
    paastand("HCl + NaOH giver pH 7 og lidt varme", Math.abs(St.pH(B.samlet(g.glas1)) - 7) < 0.5 && B.samlet(g.glas1).T > T1 + 0.3, "pH " + St.pH(B.samlet(g.glas1)).toFixed(2) + ", T " + B.samlet(g.glas1).T.toFixed(2));
    bord.draabe(g.phph, g.glas2); faerdig(); vent(function () { return bord.draaber.length === 0; }, 4); adv(2);
    var fp = St.farve(B.samlet(g.glas2), 1);
    paastand("phenolphthalein i NaOH er pink", fp && fp.r > fp.g + 40 && fp.r > fp.b + 20, Math.round(fp.r) + "," + Math.round(fp.g) + "," + Math.round(fp.b));
    bord.draabe(g.btb, g.glas4); faerdig(); vent(function () { return bord.draaber.length === 0; }, 4); adv(2);
    var fb = St.farve(B.samlet(g.glas4), 1);
    paastand("bromthymolblaat i syre er gult", fb && fb.r > fb.b + 60 && fb.g > fb.b + 40, Math.round(fb.r) + "," + Math.round(fb.g) + "," + Math.round(fb.b));
    frisk();
    bord.haeld(g.fl_hcl, g.baegerStor, 20); faerdig();
    bord.fyldSpatel(g.spatel, g.metal_mg); faerdig();
    var gas0 = bord.gasIalt || 0;
    bord.toemSpatel(g.spatel, g.baegerStor); faerdig();
    adv(4);
    paastand("magnesium i syre giver H₂ og Mg²⁺", (bord.gasIalt || 0) > gas0 + 100 && n(g.baegerStor, "Mg2+") > 100, "gas " + ((bord.gasIalt || 0) - gas0).toFixed(0) + " µmol, Mg²⁺ " + n(g.baegerStor, "Mg2+").toFixed(0));
    paastand("det bobler i glasset", (g.baegerStor.bobler || []).length > 0, (g.baegerStor.bobler || []).length + " bobler");
    bord.fyldSpatel(g.spatel, g.metal_cu); faerdig();
    bord.toemSpatel(g.spatel, g.glas1); faerdig();
    bord.haeld(g.fl_hcl, g.glas1, 3); faerdig(); adv(5);
    paastand("kobber i fortyndet syre reagerer ikke", n(g.glas1, "Cu2+") < 0.5 && n(g.glas1, "Cu(s)") > 1400, "Cu²⁺ " + n(g.glas1, "Cu2+").toFixed(1));
    bord.fyldSpatel(g.spatel, g.metal_cu); faerdig();
    bord.toemSpatel(g.spatel, g.glas2); faerdig();
    bord.haeld(g.fl_hno3, g.glas2, 3); faerdig(); adv(5);
    paastand("kobber i koncentreret salpetersyre giver Cu²⁺ og brune dampe", n(g.glas2, "Cu2+") > 100 && bord.dampe.some(function (d) { return !!d.farve; }), "Cu²⁺ " + n(g.glas2, "Cu2+").toFixed(0));
    bord.fyldSpatel(g.spatel, g.metal_zn); faerdig();
    bord.toemSpatel(g.spatel, g.glas3); faerdig();
    bord.haeld(g.fl_cu, g.glas3, 3); faerdig(); adv(6);
    paastand("zink i kobbersulfat giver Zn²⁺ og kobber", n(g.glas3, "Zn2+") > 100 && n(g.glas3, "Cu(s)") > 100, "Zn²⁺ " + n(g.glas3, "Zn2+").toFixed(0) + ", Cu(s) " + n(g.glas3, "Cu(s)").toFixed(0));
    bord.fyldSpatel(g.spatel, g.pulver_na2co3); faerdig();
    bord.toemSpatel(g.spatel, g.glas4); faerdig();
    var gas1 = bord.gasIalt || 0;
    bord.haeld(g.fl_hcl, g.glas4, 3); faerdig();
    adv(6);
    paastand("carbonat og syre giver CO₂", (bord.gasIalt || 0) > gas1 + 100, ((bord.gasIalt || 0) - gas1).toFixed(0) + " µmol");
    frisk();
    bord.sproejt(g.vand, g.baegerLille); faerdig();
    var uheldV = bord.antalUheld, T2 = B.samlet(g.baegerLille).T;
    bord.haeld(g.fl_h2so4, g.baegerLille, 10);
    var Tmaks = 0;
    vent(function () { Tmaks = Math.max(Tmaks, B.samlet(g.baegerLille).T); return !bord.koer.igang(); }, 8);
    paastand("koncentreret svovlsyre i vand bliver kogende varmt", Tmaks > 90, Tmaks.toFixed(0) + " °C fra " + T2.toFixed(0));
    paastand("det sproejter, og laereren kommenterer", bord.haendt_voldsom || !!(bord.laerer && (bord.laerer.scene || (bord.laererVent && bord.laererVent.length))), bord.laerer && bord.laerer.scene ? bord.laerer.scene.navn : "ingen scene");
    vent(function () { return !bord.laerer.scene; }, 30);

    overskrift("4c. Vaegt, vejebaad, pH-meter, braender og flammeproeve");
    frisk();
    paastand("vejebaaden staar paa vaegten, som viser dens masse", g.vejebaad.paa === g.vaegt && bord.vaegtTekst(g.vaegt) === "1,50 g", bord.vaegtTekst(g.vaegt));
    paastand("klik paa vaegten tarerer", bord.klik("vaegt") && bord.vaegtTekst(g.vaegt) === "0,00 g", bord.vaegtTekst(g.vaegt));
    bord.fyldSpatel(g.spatel, g.pulver_nacl); faerdig();
    bord.toemSpatel(g.spatel, g.vejebaad); faerdig();
    paastand("en spatelspids NaCl vejer 0,09 g", bord.vaegtTekst(g.vaegt) === "0,09 g", bord.vaegtTekst(g.vaegt));
    bord.sproejt(g.vand, g.glas1); faerdig();
    paastand("vejebaaden haeldes i glas 1", bord.haeld(g.vejebaad, g.glas1, 0));
    faerdig(); adv(8);
    paastand("saltet er i glas 1 og vejebaaden tom", n(g.glas1, "Na+") > 1000 && B.fastIalt(g.vejebaad) < 0.5 && bord.vaegtTekst(g.vaegt) === "0,00 g", n(g.glas1, "Na+").toFixed(0) + ", " + bord.vaegtTekst(g.vaegt));
    traek(g.baegerStor, medFod(g.baegerStor, g.vaegt.p.x + 70, g.vaegt.p.y + 6));
    faerdig();
    paastand("et baegerglas kan saettes paa vaegten", g.baegerStor.paa === g.vaegt && bord.vaegtTekst(g.vaegt) === "100,00 g", bord.vaegtTekst(g.vaegt));
    bord.haeld(g.fl_hcl, g.baegerStor, 20); faerdig();
    paastand("20 mL vejer 20 g mere", Math.abs(bord.masseePaa(g.vaegt) - (g.vaegt.tara || 0) - 120) < 0.3, bord.vaegtTekst(g.vaegt));
    paastand("saet pH-meteret i baegerglasset", bord.maal(g.phmeter, g.baegerStor));
    faerdig(); adv(1);
    paastand("pH-meteret viser pH 1", g.phmeter.i === g.baegerStor && Math.abs(g.phmeter.pH - 1) < 0.1, String(g.phmeter.pH));
    paastand("klik taender braenderen", bord.klik("braender") && g.braender.taendt);
    traek(g.baegerLille, medFod(g.baegerLille, g.braender.p.x + 25, g.braender.p.y - 20));
    faerdig();
    paastand("baegerglasset staar paa trefoden", g.baegerLille.paa === g.braender, g.baegerLille.paa ? g.baegerLille.paa.navn : "ingen");
    bord.sproejt(g.vand, g.baegerLille); faerdig(); adv(25);
    paastand("vandet koger over braenderen", g.baegerLille.koger, B.samlet(g.baegerLille).T.toFixed(0) + " °C");
    paastand("dyp podetraaden i glas 1 (NaCl)", bord.dyp(g.podetraad, g.glas1));
    faerdig();
    paastand("draaben sidder i oejet", !!g.podetraad.last);
    paastand("flammeproeve", bord.flammeproeve(g.podetraad, g.braender));
    adv(0.8);
    var ff = g.braender.flammeFarve;
    paastand("natrium giver gul flamme", !!ff && ff.r > 200 && ff.g > 150 && ff.b < 100, ff ? Math.round(ff.r) + "," + Math.round(ff.g) + "," + Math.round(ff.b) : "ingen farve");
    faerdig(); adv(3);
    paastand("flammen er blaa igen, og traaden er tom", (g.braender.flammeStyrke || 0) < 0.05 && !g.podetraad.last);
    bord.haeld(g.fl_cu, g.glas2, 3); faerdig();
    bord.dyp(g.podetraad, g.glas2); faerdig();
    bord.flammeproeve(g.podetraad, g.braender); adv(0.8);
    ff = g.braender.flammeFarve;
    paastand("kobber giver groen flamme", !!ff && ff.g > ff.r + 60 && ff.g > ff.b + 40, ff ? Math.round(ff.r) + "," + Math.round(ff.g) + "," + Math.round(ff.b) : "ingen farve");
    faerdig(); adv(3);
    bord.haeld(g.fl_hcl, g.glas3, 3); faerdig();
    bord.dyp(g.podetraad, g.glas3); faerdig();
    bord.flammeproeve(g.podetraad, g.braender); adv(0.8);
    paastand("saltsyre giver ingen flammefarve", !g.braender.flammeFarve);
    faerdig(); adv(3);
    bord.vaelg("baegerStor");
    var linje = NK.logbog.aflaesning();
    paastand("logbogen kan aflaese det valgte glas", !!linje && linje.indexOf("bægerglas") >= 0 && linje.indexOf("pH 1,0") >= 0 && linje.indexOf("vægt") >= 0, linje);

    overskrift("5. Draaber, spatel, stav og termometer");
    frisk();
    bord.haeld(g.fl_hcl, g.glas1, 3); faerdig();
    paastand("dryp AgNO₃ i glas 1", bord.draabe(g.ag, g.glas1));
    faerdig();
    vent(function () { return bord.draaber.length === 0; }, 4);
    adv(1.5);
    paastand("draaben giver hvidt AgCl(s)", n(g.glas1, "AgCl(s)") > 2, n(g.glas1, "AgCl(s)").toFixed(1) + " µmol");
    paastand("flasken haenger over glasset", !!g.ag.svaev);
    paastand("et klik paa flasken drypper igen", bord.klik("ag"));
    vent(function () { return bord.draaber.length === 0; }, 4);
    adv(1);
    paastand("to draaber er 0,1 mL", Math.abs(V(g.ag) - 59.9) < 0.02, V(g.ag).toFixed(2));
    adv(5);
    paastand("flasken bliver haengende, til den traekkes vaek", !!g.ag.svaev && !bord.koer.igang());
    vaek(g.ag);
    paastand("flasken gaar hjem, naar den traekkes vaek", Math.abs(g.ag.p.x - g.ag.hjem.x) < 1, g.ag.p.x.toFixed(0) + " / " + g.ag.hjem.x.toFixed(0));

    bord.sproejt(g.vand, g.glas2); faerdig();
    paastand("tag en spatelspids NaCl", bord.fyldSpatel(g.spatel, g.pulver_nacl));
    faerdig();
    paastand("spatlen baerer NaCl", !!g.spatel.last && g.spatel.last.navn === "NaCl(s)");
    paastand("spatelspidsen i glas 2", bord.toemSpatel(g.spatel, g.glas2));
    faerdig();
    paastand("spatlen er tom", !g.spatel.last);
    paastand("saltet ligger som korn", n(g.glas2, "NaCl(s)") > 100, n(g.glas2, "NaCl(s)").toFixed(0));
    adv(6);
    paastand("saltet oploeses til Na⁺ og Cl⁻", n(g.glas2, "Na+") > 500, n(g.glas2, "Na+").toFixed(0));
    paastand("roer rundt med glasstaven", bord.roer(g.glasstav, g.glas2));
    faerdig();
    paastand("staven er hjemme", Math.abs(g.glasstav.p.x - g.glasstav.hjem.x) < 1);
    paastand("saet termometeret i glas 2", bord.maal(g.termometer, g.glas2));
    faerdig();
    paastand("termometeret sidder i glasset", g.termometer.i === g.glas2);
    adv(4);
    paastand("termometeret viser stuetemperatur", Math.abs(g.termometer.T - 20) < 1, g.termometer.T.toFixed(1));

    overskrift("6. Varmepladen og stativet");
    frisk();
    bord.haeld(g.fl_hcl, g.baegerLille, 20); faerdig();
    paastand("klik taender varmepladen", bord.klik("plade") && g.plade.taendt);
    adv(40);
    paastand("vandet i baegerglasset bliver varmt", B.samlet(g.baegerLille).T > 50, B.samlet(g.baegerLille).T.toFixed(0) + " °C");
    adv(60);
    paastand("det koger og damper", g.baegerLille.koger && bord.dampe.length > 0, B.samlet(g.baegerLille).T.toFixed(0) + " °C, " + bord.dampe.length + " damp");
    bord.klik("plade");
    paastand("klik slukker igen", !g.plade.taendt);
    bord.startBaer(g.glas1);
    paastand("glas 1 er ude af stativet", g.stativ.glas[0] === null && !g.glas1.sted);
    g.glas1.p.x = bord.hulX(g.stativ, 1); g.glas1.p.y = g.stativ.p.y - 40;
    bord.stopBaer({ x: g.glas1.p.x, y: g.glas1.p.y });
    faerdig();
    paastand("glas 1 sat i hul 2", g.stativ.glas[1] === g.glas1 && g.glas1.sted && g.glas1.sted.hul === 1);
    traek(g.baegerStor, medFod(g.baegerStor, g.plade.p.x + 60, g.plade.p.y + 10));
    faerdig();
    paastand("baegerglasset kan saettes paa varmepladen", g.baegerStor.paa === g.plade, g.baegerStor.paa ? g.baegerStor.paa.navn : "ingen");

    overskrift("7. At saette ned, vaelte, spilde og loebe over");
    frisk();
    traek(g.fl_cu, { x: 1360, y: 420 });
    paastand("flasken staar der, hvor den blev sluppet", Math.abs(g.fl_cu.p.x - 1360) < 30 && Math.abs(g.fl_cu.hjem.x - g.fl_cu.p.x) < 0.1, g.fl_cu.p.x.toFixed(0));
    paastand("den staar paa bordet", bord.staarPaaBord(g.fl_cu));
    var uheld0 = bord.antalUheld;
    traek(g.glas3, { x: 1150, y: 350 });
    paastand("et tomt reagensglas vaelter uden uheld", Math.abs(Math.abs(g.glas3.p.v) - Math.PI / 2) < 0.01 && bord.antalUheld === uheld0, "v " + g.glas3.p.v.toFixed(2) + ", uheld " + bord.antalUheld);
    traek(g.glas3, { x: bord.hulX(g.stativ, 4), y: g.stativ.p.y - 40 });
    faerdig();
    paastand("glasset er tilbage i stativet", g.glas3.sted && g.glas3.sted.hul === 4);
    bord.haeld(g.fl_ki, g.glas3, 4); faerdig();
    paastand("glas 3 har 4 mL KI", Math.abs(V(g.glas3) - 4) < 0.2, V(g.glas3).toFixed(2));
    traek(g.glas3, { x: 1150, y: 350 });
    paastand("et fyldt reagensglas vaelter og spilder", bord.antalUheld === uheld0 + 1 && V(g.glas3) < 0.01 && bord.pytter.length > 0, "uheld " + bord.antalUheld + ", pyt " + bord.pytter.length);
    paastand("laereren kommer og rydder op", !!(bord.laerer && bord.laerer.scene), bord.laerer && bord.laerer.scene ? bord.laerer.scene.navn : "ingen scene");
    vent(function () { return !bord.laerer.scene; }, 30);
    paastand("pytten er toerret op", bord.pytter.length === 0 || bord.pytter.every(function (p) { return p.vaad < 0.05; }));
    var uheld1 = bord.antalUheld;
    bord.haeld(g.fl_pb, g.glas4, 0); faerdig();
    paastand("25 mL i et reagensglas loeber over", bord.antalUheld === uheld1 + 1 && V(g.glas4) <= g.glas4.type.maks + 0.01, V(g.glas4).toFixed(1) + " mL, uheld " + bord.antalUheld);
    vent(function () { return !bord.laerer.scene; }, 30);
    var uheld2 = bord.antalUheld;
    bord.haeld(g.fl_cu, g.glas1, 3);
    faerdig();
    bord.startBaer(g.glas1);
    bord.musFart = 5000; bord.vold = 5000;
    adv(0.6);
    paastand("voldsom rystning spilder", bord.antalUheld === uheld2 + 1 && V(g.glas1) < 0.01, "uheld " + bord.antalUheld + ", V " + V(g.glas1).toFixed(2));
    paastand("glasset er sluppet", !bord.baerer && !bord.holdt);
    vent(function () { return !bord.laerer.scene; }, 30);

    overskrift("8. Knust glas");
    frisk();
    var uheldK = bord.antalUheld;
    bord.haeld(g.fl_cu, g.baegerStor, 20); faerdig();
    traek(g.baegerStor, { x: 400, y: 560 });
    faerdig();
    paastand("et glas sluppet foran bordkanten falder paa gulvet og knuses", g.baegerStor.skjult && g.baegerStor.knust && bord.skaar.length > 0 && bord.antalUheld === uheldK + 1, "skaar " + bord.skaar.length + ", uheld " + bord.antalUheld);
    paastand("indholdet loeb ud paa gulvet", bord.pytter.some(function (p) { return p.y !== undefined && p.y > 550; }));
    paastand("laereren kommer med kosten", !!(bord.laerer.scene), bord.laerer.scene ? bord.laerer.scene.navn : "ingen");
    vent(function () { return !bord.laerer.scene && !bord.koer.igang(); }, 40);
    paastand("skaarene er fejet op", bord.skaar.length === 0 && bord.pytter.length === 0, "skaar " + bord.skaar.length);
    g = bord.g;
    paastand("et nyt, tomt baegerglas staar paa sin plads", !!g.baegerStor && !g.baegerStor.skjult && V(g.baegerStor) < 0.01 && bord.staarPaaBord(g.baegerStor) && Math.abs(g.baegerStor.p.x - 170 + 56 - 56) < 60, g.baegerStor ? g.baegerStor.p.x.toFixed(0) : "mangler");
    bord.startBaer(g.glas4);
    bord.vold = 5000; bord.musFart = 5000;
    adv(0.6);
    paastand("ekstrem rystning knuser et tomt glas i haanden", g.glas4.knust && bord.antalUheld === uheldK + 2 && bord.skaar.length > 0, "uheld " + bord.antalUheld);
    vent(function () { return !bord.laerer.scene && !bord.koer.igang(); }, 40);
    g = bord.g;
    paastand("glas 4 er tilbage i stativet", !!g.glas4 && !g.glas4.skjult && g.glas4.sted && g.glas4.sted.hul === 6, g.glas4 && g.glas4.sted ? "hul " + g.glas4.sted.hul : "ingen plads");
    traek(g.vand, { x: 300, y: 560 });
    faerdig();
    paastand("sproejteflasken falder paa gulvet uden at gaa i stykker", !g.vand.skjult && !g.vand.knust && bord.fod(g.vand).y > 560, "fod " + bord.fod(g.vand).y.toFixed(0));
    paastand("den kan tages op igen", bord.grebbar("vand"));

    overskrift("9. Affald og start forfra");
    frisk();
    bord.haeld(g.fl_cu, g.baegerStor, 25); faerdig();
    paastand("baegerglasset toemmes i affaldsdunken", bord.toemI(g.baegerStor, g.dunk));
    faerdig();
    paastand("det er tomt bagefter", V(g.baegerStor) < 0.01);
    paastand("flasken i affaldsdunken giver en bemaerkning", bord.toemI(g.fl_scn, g.dunk) && (faerdig(), !!(bord.laerer && (bord.laerer.scene || bord.laererVent && bord.laererVent.length))));
    vent(function () { return !bord.laerer.scene; }, 30);
    NK.startForfra();
    adv(0.2);
    g = bord.g;
    paastand("start forfra stiller alt tilbage", V(g.baegerStor) < 0.01 && Math.abs(V(g.fl_cu) - 200) < 0.01 && g.stativ.glas[0] === g.glas1 && bord.antalUheld === 0 && bord.pytter.length === 0);
    paastand("panelet kan opdateres", (NK.opdaterPanel(), true));

    overskrift("10. Udstyr i mindre maalestok");
    /* Et lille bord kan have udstyr i halv stoerrelse. Kun tegnemaalene
       skaleres: rumfang, lysvej og kemi skal vaere uaendret. */
    var U = NK.Udstyr, stor = U.type("baegerLille");
    var lb = bord.tilfoej({ navn: "_lille_baeger", type: "baegerLille", x: 1180, skala: 0.5 });
    var lst = bord.tilfoej({ navn: "_lille_stativ", type: "stativ", p: { x: 1180, y: 300, v: 0 }, skala: 0.5 });
    var lgl = bord.tilfoej({ navn: "_lille_glas", type: "reagensglas", stativ: "_lille_stativ", hul: 1, nr: 9, titel: "lille glas" });
    paastand("spritet er halvt saa stort", Math.abs(lb.type.b - stor.b / 2) < 1e-9 && Math.abs(lb.type.h - stor.h / 2) < 1e-9, lb.type.b);
    paastand("rumfang, lysvej og masse er uaendrede", lb.type.maks === stor.maks && lb.type.vejlaengde === stor.vejlaengde && lb.type.masse === stor.masse, lb.type.maks + " mL");
    paastand("vaesken staar lige saa hoejt i det lille glas", (function () {
        function andel(t) {
            var verden = t.indre.map(function (q) { return NK.tilVerden({ x: 300, y: 300, v: 0 }, t.anker, q.x, q.y); });
            var y0 = Math.min.apply(null, verden.map(function (q) { return q.y; }));
            var y1 = Math.max.apply(null, verden.map(function (q) { return q.y; }));
            return (y1 - NK.vaeskeNiveau(verden, 50 * t.mlPrAreal)) / (y1 - y0);
        }
        return Math.abs(andel(stor) - andel(lb.type)) < 0.01;
    }()));
    bord.haeld(g.fl_cu, lb, 20);
    faerdig();
    paastand("der kan haeldes i det, og koncentrationen er den samme", Math.abs(V(lb) - 20) < 0.2 && Math.abs(NK.Stof.konc(lb.indhold, "Cu2+") - 100) < 1, NK.Stof.konc(lb.indhold, "Cu2+").toFixed(1) + " mM");
    paastand("glasset arver stativets skala og staar i hullet", lgl.skala === 0.5 && Math.abs(lgl.p.x - (lst.p.x + lst.type.huller[1])) < 1.5, lgl.skala);
    var lr = bord.rekt(lgl, 0);
    paastand("musen rammer det, der er tegnet", bord.hvad({ x: lr.x + lr.b / 2, y: lr.y + lr.h / 2 }) === "_lille_glas" && Math.abs(lr.h - U.type("reagensglas").h / 2) < 1.5, lr.h.toFixed(0));
    [lgl, lst, lb].forEach(function (x) { bord.tagUd(x); });
    paastand("de kan tages af bordet igen", !bord.g._lille_glas && !bord.g._lille_stativ && !bord.g._lille_baeger);

    overskrift("11. Slipmaalet: naermeste, ikke oeverst tegnede");
    /* Slipmaalet vaelges blandt alle, der vil tage imod, efter afstanden fra
       det, man sigter med, til det, man sigter efter - ikke efter hvad der
       er tegnet oeverst. To reagensglas i naboglas-huller er proeven. */
    frisk();
    var st = g.stativ, gl1 = g.glas1, gl2 = g.glas2;
    bord.frigoer(gl2);
    bord.iStativ(gl2, st, 1, true);
    faerdig();
    paastand("glas 1 og 2 staar i naboglas-huller", gl1.sted && gl1.sted.hul === 0 && gl2.sted && gl2.sted.hul === 1,
        (gl1.sted && gl1.sted.hul) + " og " + (gl2.sted && gl2.sted.hul));
    var fl = g.fl_cu;
    /* Flasken holdes, saa tuden staar over hullerne; x forskydes fra glas 1's aabning */
    var o1 = B.aabning(gl1), o2 = B.aabning(gl2), afst = o2.x - o1.x;
    function tudVed(x) {
        var p = B.haeldPositur(fl, gl1, 14);
        var t = B.tudVerden({ p: p, anker: fl.anker, type: fl.type });
        fl.p = { x: p.x + (x - t.x), y: p.y, v: p.v };
        return { x: fl.p.x, y: fl.p.y - 10 };   /* musen: paa flasken, ikke over glasset */
    }
    bord.startBaer(fl);
    var rigtige = 0, forkerte = [];
    for (var r = 0; r < 10; r++) {
        var modGlas1 = r % 2 === 0;
        var x = modGlas1 ? o1.x + 16 : o2.x - 16;   /* inde i begge glas' zone, men naermest det ene */
        var pt = tudVed(x);
        bord.slipMaal = null;
        var m = bord.maalVed(fl, pt);
        if (m === (modGlas1 ? "glas1" : "glas2")) rigtige++; else forkerte.push(r + ":" + m);
    }
    paastand("ti gange i traek faar tuden det glas, den peger paa", rigtige === 10, rigtige + " af 10" + (forkerte.length ? " (forkerte: " + forkerte.join(", ") + ")" : ""));
    var raekkefoelge = bord.liste.indexOf(gl1) < bord.liste.indexOf(gl2);
    bord.tilFront(gl1);
    bord.slipMaal = null;
    paastand("det, man sidst roerte, vinder ikke laengere", bord.maalVed(fl, tudVed(o2.x - 16)) === "glas2", "glas 1 forrest, tuden naermest glas 2");
    /* Hysterese: det valgte maal beholdes, naar forskellen er lille */
    bord.slipMaal = "glas2";
    var midt = o1.x + afst / 2;
    paastand("naesten midt imellem beholdes det valgte", bord.maalVed(fl, tudVed(midt - 3)) === "glas2");
    paastand("men et tydeligt bedre maal vinder", bord.maalVed(fl, tudVed(o1.x + 4)) === "glas1");
    paastand("stille mus giver samme svar hver gang", (function () {
        var pt2 = tudVed(o1.x + 5), foerste = bord.maalVed(fl, pt2);
        for (var q = 0; q < 20; q++) if (bord.maalVed(fl, pt2) !== foerste) return false;
        return true;
    }()));
    bord.stopBaer({ x: fl.hjem.x, y: fl.hjem.y });
    faerdig();

    /* Flaskehalsen: et baegerglas med vaeske haeldes tilbage i en flaske */
    var bs = g.baegerStor;
    bord.haeld(g.fl_ki, bs, 30);
    faerdig();
    bord.startBaer(bs);
    var ok = B.aabning(g.fl_ki);
    function bsTudVed(x) {
        var p = B.haeldPositur(bs, g.fl_ki, 14);
        var t = B.tudVerden({ p: p, anker: bs.anker, type: bs.type });
        bs.p = { x: p.x + (x - t.x), y: p.y, v: p.v };
        return { x: bs.p.x, y: bs.p.y };
    }
    bord.slipMaal = null;
    paastand("flaskehalsen rammes uden at sigte pixelvis (12 enheder ved siden af)", bord.maalVed(bs, bsTudVed(ok.x + 12)) === "fl_ki");
    bord.slipMaal = null;
    var vedSiden = bord.maalVed(bs, bsTudVed(ok.x + 30));
    paastand("tydeligt ved siden af saettes det ned mellem flaskerne", vedSiden !== "fl_ki" && vedSiden !== "fl_cu", String(vedSiden));
    bord.stopBaer({ x: bs.hjem.x, y: bs.hjem.y });
    faerdig();
    frisk();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
</body>
</html>
