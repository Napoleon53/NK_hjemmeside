<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - Prøvebordet</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script src="../js/proeve.js"></script>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer bordet igennem med de samme
   funktioner, som musen bruger: stofmodellen, haeldning, draaber,
   spatel, roering, termometer, varmeplade, stativ, at saette ned,
   overloeb, spild, vaeltede glas, affald og laereren. Skal aabnes
   gennem en lokal server (Chrome afviser iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    /* Baggrundslivet (han gaar forbi, naar der er stille) skal ikke
       blande sig i testens scener */
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var bord = NK.bord, St = NK.Stof, B = NK.Beholder, g = bord.g;
    paastand("bordet er bygget", !!bord && bord.liste.length > 20, bord.liste.length + " genstande");
    paastand("introen aabner og lukker", !!NK.intro && (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) && (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    var alle = Object.keys(NK.Sprites.FILER);
    var klar = alle.filter(function (n) { return NK.Sprites.klar(n); });
    paastand("sprites er indlaest", klar.length === alle.length, klar.length + " af " + alle.length + (klar.length < alle.length ? ": mangler " + alle.filter(function (n) { return !NK.Sprites.klar(n); }).join(", ") : ""));

    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) bord.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function faerdig() { vent(function () { return !bord.koer.igang(); }, 8); }
    /* Det, der svaever, traekkes vaek (som med musen): det gaar hjem */
    function vaek(gg) { if (!gg.svaev) return; gg.svaev = null; bord.koer.start([NK.Koer.hjemTil(gg, 0.3, 20)], "hjem"); faerdig(); }
    function V(c) { return B.volumen(c); }
    function n(c, s) { return B.samlet(c).n[s] || 0; }
    function frisk() { NK.startForfra(); adv(0.1); g = bord.g; }
    /* Laereren ser alt i testen, saa den er deterministisk */
    bord.laererAltid = true;
    /* Som musen: tag genstanden, flyt dens anker til pt, og slip */
    function traek(gg, pt) { bord.startBaer(gg); gg.p.x = pt.x; gg.p.y = pt.y; bord.stopBaer(pt); }
    /* Punktet, ankeret skal staa i, for at foden er i (x, y) */
    function medFod(gg, x, y) { var t = gg.type; return { x: x - t.b / 2 + t.anker.x, y: y - t.h + t.anker.y }; }

    overskrift("2. Stoffer og notation");
    paastand("NO₃⁻ skrives med ét minus", St.formel("NO3-") === "NO₃⁻", St.formel("NO3-"));
    paastand("Cu²⁺ og Fe³⁺", St.formel("Cu2+") === "Cu²⁺" && St.formel("Fe3+") === "Fe³⁺");
    paastand("PbI₂(s) med fase", St.formel("PbI2(s)", true) === "PbI₂(s)", St.formel("PbI2(s)", true));
    var uden1 = Object.keys(St.STOFFER).every(function (s) { var f = St.formel(s); return f.indexOf("¹") < 0; });
    paastand("ingen formel har ladningen 1+ eller 1−", uden1);
    var alleAfstemt = St.REAKTIONER.every(function (rx) { return St.afstemt(rx); });
    paastand("alle reaktioner er afstemt i ladning", alleAfstemt, St.REAKTIONER.filter(function (rx) { return !St.afstemt(rx); }).map(function (rx) { return rx.id; }).join(", "));
    paastand("ligning med ligevaegtspil", St.ligning(St.REAKTIONER.filter(function (rx) { return rx.id === "fescn"; })[0], true) === "Fe³⁺(aq) + SCN⁻(aq) ⇌ FeSCN²⁺(aq)", St.ligning(St.REAKTIONER.filter(function (rx) { return rx.id === "fescn"; })[0], true));
    var o = St.lav({ V: 10, mM: { "Cu2+": 100, "SO42-": 100 } });
    var f = St.farve(o, 1);
    paastand("0,1 M CuSO₄ er blaat", f && f.b > f.r + 60 && f.a > 0.7, f ? Math.round(f.r) + "," + Math.round(f.g) + "," + Math.round(f.b) + " a=" + f.a.toFixed(2) : "ingen");
    var d2 = St.del(o, 4);
    paastand("del tager 4 mL med 40 % af ionerne", Math.abs(d2.V - 4) < 1e-9 && Math.abs(d2.n["Cu2+"] - 400) < 1e-6 && Math.abs(o.n["Cu2+"] - 600) < 1e-6);
    /* Zoomboblen viser ikke det, der er for lidt af: vandets egne ioner
       (10⁻⁷ M) hverken i et lille glas eller i en stor flaske */
    function kugler(V, mM) { return St.partikelTal(St.lav({ V: V, mM: mM }), 6); }
    var tV3 = kugler(3, { "H+": 1e-4, "OH-": 1e-4 }), tV500 = kugler(500, { "H+": 1e-4, "OH-": 1e-4 });
    paastand("rent vand viser ingen ioner i zoomboblen, heller ikke 500 mL",
        Object.keys(tV3).length === 0 && Object.keys(tV500).length === 0, JSON.stringify(tV500));
    var tHcl = kugler(3, { "H+": 100, "Cl-": 100 }), tNacl = kugler(3, { "Na+": 100, "Cl-": 100, "H+": 1e-4, "OH-": 1e-4 });
    paastand("saltsyre viser H⁺ og Cl⁻", tHcl["H+"] === 6 && tHcl["Cl-"] === 6, JSON.stringify(tHcl));
    paastand("en neutral saltoploesning viser kun saltets ioner", JSON.stringify(tNacl) === JSON.stringify({ "Na+": 6, "Cl-": 6 }), JSON.stringify(tNacl));
    var tPhph = kugler(3, { "phph": 0.005, "Na+": 10, "OH-": 10 });
    paastand("en indikator faar stadig én kugle, selv om der er meget lidt", tPhph.phph === 1, JSON.stringify(tPhph));
    /* Fast skala (ref i mM): et stof, der bliver mere af, faar flere kugler,
       ogsaa naar noget andet er i stort overskud */
    var oRef = St.lav({ V: 6, mM: { "Fe3+": 250, "SCN-": 0.15, "FeSCN2+": 4.8 } });
    var tRef = St.partikelTal(oRef, 6, null, 3), tRel = St.partikelTal(oRef, 6);
    paastand("med fast skala forsvinder FeSCN2+ ikke i et overskud af Fe3+", tRef["FeSCN2+"] >= 8 && tRef["SCN-"] === 1 && tRef["Fe3+"] >= 10, JSON.stringify(tRef) + " (relativt: " + JSON.stringify(tRel) + ")");
    /* Loftet: hoejst 20 kugler i alt, i samme forhold som foer */
    function sum(t) { return Object.keys(t).reduce(function (a, k) { return a + t[k]; }, 0); }
    paastand("der er hoejst 20 kugler i boblen (Fe3+ 12 + SCN- 1 + FeSCN2+ 10 bliver 10 + 1 + 9)",
        sum(tRef) === 20 && tRef["Fe3+"] === 10 && tRef["FeSCN2+"] === 9, JSON.stringify(tRef));
    var tMange = kugler(3, { "Na+": 100, "Cl-": 100, "K+": 100, "NO3-": 100, "Cu2+": 50 });
    paastand("fem slags ioner i 0,1 M deler 20 kugler i forholdet (4-5 hver og 2-3 af den halve)",
        sum(tMange) === 20 && ["Na+", "Cl-", "K+", "NO3-"].every(function (k) { return tMange[k] >= 4 && tMange[k] <= 5; }) &&
        tMange["Cu2+"] >= 2 && tMange["Cu2+"] <= 3, JSON.stringify(tMange));
    var tFaa = kugler(3, { "Na+": 100, "Cl-": 100 });
    paastand("under loftet er intet aendret", tFaa["Na+"] === 6 && tFaa["Cl-"] === 6, JSON.stringify(tFaa));
    var oMange = { V: 3, n: {} }; for (var i = 0; i < 24; i++) oMange.n["x" + i] = 3;
    var tMange2 = St.partikelTal(oMange, 6);
    paastand("flere slags end loftet: hver faar én, og ingen forsvinder", Object.keys(tMange2).length === 24 &&
        Object.keys(tMange2).every(function (k) { return tMange2[k] === 1; }) && St.PARTIKEL_LOFT === 20);
    paastand("tilskuerionerne findes ud fra reaktionerne: Pb(NO3)2 og KI giver K+ og NO3-",
        St.tilskuerioner(["Pb(NO3)2(s)", "KI(s)"]).join(",") === "K+,NO3-", St.tilskuerioner(["Pb(NO3)2(s)", "KI(s)"]).join(", "));
    paastand("men NO3- er ikke tilskuer, naar kobber oploeses i salpetersyre",
        St.tilskuerioner(["Cu(s)", "HNO3", "NaCl(s)"]).join(",") === "Cl-,Na+", St.tilskuerioner(["Cu(s)", "HNO3", "NaCl(s)"]).join(", "));

    overskrift("3. Haeldning");
    frisk();
    var b100 = g.baegerLille, glas1 = g.glas1;
    paastand("baegerglasset staar tomt paa varmepladen", V(b100) < 0.01 && b100.paa === g.plade);
    paastand("haeld fra flasken med CuSO₄ i baegerglasset", bord.haeld(g.fl_cu, b100, 10));
    faerdig();
    paastand("baegerglasset har 10 mL", Math.abs(V(b100) - 10) < 0.3, V(b100).toFixed(2));
    paastand("flasken har 190 mL (den er fyldt til 200)", Math.abs(V(g.fl_cu) - 190) < 0.3, V(g.fl_cu).toFixed(1));
    paastand("flasken bliver haengende over baegerglasset", !!g.fl_cu.svaev && g.fl_cu.svaev.maal === b100 && g.fl_cu.p.y < b100.p.y, g.fl_cu.p.y.toFixed(0));
    /* Et klik paa et andet glas vaelger det, og flasken bliver haengende;
       foerst naar noget andet TRAEKKES, stilles den ned (F35) */
    bord.ned({ x: g.baegerStor.p.x, y: g.baegerStor.p.y + 20 }); bord.op();
    paastand("klik paa et andet glas vaelger det, og flasken bliver haengende (F35)", bord.valgt === "baegerStor" && !!g.fl_cu.svaev && !bord.holdt, bord.valgt);
    var V10 = V(b100);
    paastand("et klik paa selve flasken haelder ikke", !bord.klik("fl_cu") && Math.abs(V(b100) - V10) < 1e-9 && !bord.koer.igang());
    paastand("klik paa pilen haelder en portion til", bord.klik("svaevring"));
    faerdig();
    paastand("baegerglasset har 20 mL (flaskens portion er 10 mL, under en femtedel af 100 mL)", Math.abs(V(b100) - 20) < 0.3, V(b100).toFixed(2));
    vaek(g.fl_cu);
    paastand("flasken er hjemme igen", Math.abs(g.fl_cu.p.x - g.fl_cu.hjem.x) < 1 && Math.abs(g.fl_cu.p.y - g.fl_cu.hjem.y) < 1);
    paastand("baegerglasset er valgt", bord.valgtBeholder() === b100);
    paastand("Cu²⁺ er 100 mM i baegerglasset", Math.abs(St.konc(B.samlet(b100), "Cu2+") - 100) < 1, St.konc(B.samlet(b100), "Cu2+").toFixed(1));
    paastand("haeld baegerglasset i glas 1", bord.haeld(b100, glas1, 5));
    faerdig();
    paastand("glas 1 har 5 mL, baegerglasset 15 mL", Math.abs(V(glas1) - 5) < 0.3 && Math.abs(V(b100) - 15) < 0.3, V(glas1).toFixed(2) + " / " + V(b100).toFixed(2));
    paastand("zoomboblen viser partikler", bord.mikro.partikler.length > 0, bord.mikro.partikler.length);
    paastand("partiklerne har formler med ladning", bord.mikro.partikler.every(function (p) { return p.tekst.length > 0; }) && bord.mikro.partikler.some(function (p) { return p.tekst === "Cu²⁺"; }));
    NK.opdaterPanel();
    paastand("zoomboblen staar i panelet, ikke paa scenen", !bord.boble && !d.getElementById("boble-laerred").hidden);
    var V1 = V(glas1);
    paastand("et klik paa en flaske vaelger den og haelder ikke", bord.klik("fl_pb") && bord.valgtBeholder() === g.fl_pb && Math.abs(V(glas1) - V1) < 1e-9 && !bord.koer.igang());
    paastand("panelet viser flaskens indhold", (NK.opdaterPanel(), d.getElementById("glas-titel").textContent.indexOf("Pb(NO₃)₂") >= 0), d.getElementById("glas-titel").textContent);
    paastand("et klik paa spatlen goer ingenting", !bord.klik("spatel") && !bord.koer.igang() && !g.spatel.last);

    overskrift("3b. Der haeldes kun, naar eleven beder om det (F36)");
    frisk();
    /* Holder flasken stille over baegerglasset: musen staar i pt, tiden gaar */
    function hold(gg, pt, sek) {
        var nu = 1000;
        bord.flyt(pt, nu);
        for (var k = 0; k < Math.round(sek * 60); k++) { nu += 1000 / 60; bord.flyt(pt, nu); bord.opdater(1 / 60); }
    }
    var b250 = g.baegerStor;
    bord.ned({ x: g.fl_cu.p.x, y: g.fl_cu.p.y + 30 });
    var over = { x: b250.p.x + 6, y: b250.p.y - 30 };
    hold(g.fl_cu, over, 0.2);
    paastand("flasken er taget og holdes over baegerglasset", bord.baerer === g.fl_cu && bord.slipMaal === "baegerStor", bord.slipMaal);
    paastand("intet er haeldt endnu", V(b250) < 0.01);
    hold(g.fl_cu, over, 3.0);
    paastand("holdt stille over glasset i 3 s haelder den ikke og vipper ikke", V(b250) < 0.01 && g.fl_cu.p.v > -0.2 && !bord.straale,
        V(b250).toFixed(1) + " mL, v " + g.fl_cu.p.v.toFixed(2));
    bord.op();
    faerdig();
    var V3 = V(b250);
    paastand("et slip giver én portion (10 mL), og flasken bliver haengende", Math.abs(V3 - 10) < 0.3 && !!g.fl_cu.svaev, V3.toFixed(1));
    paastand("kobberioner i baegerglasset", n(b250, "Cu2+") > 500, n(b250, "Cu2+").toFixed(0));
    vaek(g.fl_cu);
    bord.ned({ x: g.fl_ki.p.x, y: g.fl_ki.p.y + 30 });
    hold(g.fl_ki, { x: b250.p.x + 5, y: b250.p.y - 30 }, 0.15);
    bord.op(); faerdig();
    paastand("et hurtigt slip giver én portion (10 mL)", Math.abs(V(b250) - V3 - 10) < 0.3, (V(b250) - V3).toFixed(1));
    var uheldH = bord.antalUheld;
    vaek(g.fl_ki);
    bord.ned({ x: g.fl_hcl.p.x, y: g.fl_hcl.p.y + 30 });
    hold(g.fl_hcl, { x: b250.p.x + 62, y: b250.p.y - 40 }, 2.2);
    var VH = V(b250);
    bord.op(); faerdig();
    /* Tuden er ude ved kanten af det groenne felt, uden for aabningen:
       holdt der haelder den ikke, og et slip haelder i glasset (F8, F36) */
    paastand("holdes tuden ude ved glassets kant, haelder den ikke, og et slip haelder i glasset, ikke paa bordet",
        Math.abs(VH - V3 - 10) < 0.3 && bord.antalUheld === uheldH && bord.pytter.length === 0 && Math.abs(V(b250) - V3 - 20) < 0.3,
        "uheld " + (bord.antalUheld - uheldH) + ", V " + V(b250).toFixed(1));
    vent(function () { return !bord.laerer.scene; }, 30);
    vaek(g.fl_hcl);
    bord.ned({ x: g.ag.p.x, y: g.ag.p.y + 30 });
    hold(g.ag, { x: b250.p.x, y: b250.p.y - 40 }, 2.5);
    paastand("draabeflasken drypper ikke, mens den holdes", Math.abs(V(g.ag) - 60) < 1e-6, V(g.ag).toFixed(2) + " mL tilbage");
    bord.op(); faerdig();
    paastand("et slip giver én draabe", Math.abs(V(g.ag) - 59.95) < 0.001, V(g.ag).toFixed(2) + " mL tilbage");
    vent(function () { return bord.draaber.length === 0; }, 4); adv(1);
    var agIalt = n(b250, "Ag+") + n(b250, "AgI(s)") + n(b250, "AgCl(s)") + n(b250, "Ag2SO4(s)") + n(b250, "Ag(s)");
    paastand("draaberne landede i glasset (soelv i alt, ogsaa som AgCl fra saltsyren; iodidet er allerede brugt af kobberionerne til CuI)", agIalt > 2, agIalt.toFixed(1) + " umol Ag, CuI " + n(b250, "CuI(s)").toFixed(0) + ", I2 " + n(b250, "I2").toFixed(0));

    overskrift("3c. Fast stof oploeses paa endelig tid (F34)");
    /* To bidrag: et relativt (fart · n) og et konstant (OPLOES_K0 µmol/s),
       saa den sidste rest ikke gaar mod nul uden at blive faerdig */
    (function () {
        var o = St.lav({ V: 6, T: 20, umol: { "NaCl(s)": 60 } }), t = 0;
        while ((o.n["NaCl(s)"] || 0) > 1e-9 && t < 60) { St.skridt(o, 0.05); t += 0.05; }
        paastand("en spatelspids NaCl (60 µmol) er helt oploest efter under 10 s", (o.n["NaCl(s)"] || 0) <= 1e-9 && t < 10, t.toFixed(1) + " s");
        paastand("og der er ikke oploest mere, end der var", Math.abs(o.n["Na+"] - 60) < 1e-6, o.n["Na+"].toFixed(3) + " µmol Na⁺");
        var o2 = St.lav({ V: 6, T: 20, umol: { "NaCl(s)": 60 } });
        St.skridt(o2, 0.05);
        var ud = 60 - o2.n["NaCl(s)"], rel = 60 * (1 - Math.exp(-0.35 * 0.05));
        paastand("i det foerste skridt er begge bidrag med", Math.abs(ud - rel - St.OPLOES_K0 * 0.05) < 1e-6, ud.toFixed(4) + " µmol");
    }());

    overskrift("4. Bundfald, ligevaegt og neutralisation");
    frisk();
    bord.haeld(g.fl_ki, g.glas2, 3); faerdig();
    bord.haeld(g.fl_pb, g.glas2, 3); faerdig();
    adv(3);
    paastand("Pb²⁺ + 2 I⁻ giver gult PbI₂(s)", n(g.glas2, "PbI2(s)") > 50, n(g.glas2, "PbI2(s)").toFixed(0) + " µmol");
    paastand("I⁻ er brugt op, Pb²⁺ i overskud", n(g.glas2, "I-") < 5 && n(g.glas2, "Pb2+") > 100, "I⁻ " + n(g.glas2, "I-").toFixed(1) + ", Pb²⁺ " + n(g.glas2, "Pb2+").toFixed(0));
    paastand("vaesken er uklar af bundfaldet", St.uklar(B.samlet(g.glas2)) > 0.3, St.uklar(B.samlet(g.glas2)).toFixed(2));
    bord.haeld(g.fl_fe, g.glas3, 3); faerdig();
    bord.haeld(g.fl_scn, g.glas3, 3); faerdig();
    adv(3);
    var x = n(g.glas3, "FeSCN2+");
    paastand("Fe³⁺ + SCN⁻ ⇌ FeSCN²⁺ indstiller sig", x > 1 && x < 30, x.toFixed(1) + " µmol");
    var fr = St.farve(B.samlet(g.glas3), 1);
    paastand("blandingen er roedlig", fr && fr.r > fr.g + 30 && fr.r > fr.b + 30, Math.round(fr.r) + "," + Math.round(fr.g) + "," + Math.round(fr.b));
    var x0 = x;
    bord.sproejt(g.vand, g.glas3); faerdig();
    adv(3);
    paastand("fortynding forskyder mod venstre", n(g.glas3, "FeSCN2+") < x0, x0.toFixed(1) + " -> " + n(g.glas3, "FeSCN2+").toFixed(1));
    bord.haeld(g.fl_hcl, g.glas4, 2); faerdig();
    bord.haeld(g.fl_naoh, g.glas4, 2); faerdig();
    adv(2);
    paastand("H⁺ + OH⁻ neutraliserer", n(g.glas4, "H+") < 1 && n(g.glas4, "OH-") < 1, "H⁺ " + n(g.glas4, "H+").toFixed(1) + ", OH⁻ " + n(g.glas4, "OH-").toFixed(1));

    overskrift("4b. Syre-base, redox, gas og varme");
    frisk();
    bord.haeld(g.fl_hcl, g.glas1, 3); faerdig(); adv(1);
    paastand("0,1 M HCl har pH 1", Math.abs(St.pH(B.samlet(g.glas1)) - 1) < 0.1, St.pH(B.samlet(g.glas1)).toFixed(2));
    bord.haeld(g.fl_naoh, g.glas2, 3); faerdig(); adv(1);
    paastand("0,1 M NaOH har pH 13", Math.abs(St.pH(B.samlet(g.glas2)) - 13) < 0.1, St.pH(B.samlet(g.glas2)).toFixed(2));
    bord.sproejt(g.vand, g.glas3); faerdig(); adv(2);
    paastand("vand har pH 7", Math.abs(St.pH(B.samlet(g.glas3)) - 7) < 0.3, St.pH(B.samlet(g.glas3)).toFixed(2));
    bord.haeld(g.fl_hac, g.glas4, 3); faerdig(); adv(2);

    paastand("sproejteflasken falder paa gulvet uden at gaa i stykker", !g.vand.skjult && !g.vand.knust && bord.fod(g.vand).y > 560, "fod " + bord.fod(g.vand).y.toFixed(0));
    paastand("den kan tages op igen", bord.grebbar("vand"));

    overskrift("9. Affald og start forfra");
    frisk();
    bord.haeld(g.fl_cu, g.baegerStor, 25); faerdig();
    paastand("baegerglasset toemmes i affaldsdunken", bord.toemI(g.baegerStor, g.dunk));
    faerdig();
    paastand("det er tomt bagefter", V(g.baegerStor) < 0.01);
    paastand("flasken i affaldsdunken giver en bemaerkning", bord.toemI(g.fl_scn, g.dunk) && (faerdig(), !!(bord.laerer && (bord.laerer.scene || bord.laererVent && bord.laererVent.length))));
    vent(function () { return !bord.laerer.scene; }, 30);
    NK.startForfra();
    adv(0.2);
    g = bord.g;
    paastand("start forfra stiller alt tilbage", V(g.baegerStor) < 0.01 && Math.abs(V(g.fl_cu) - 200) < 0.01 && g.stativ.glas[0] === g.glas1 && bord.antalUheld === 0 && bord.pytter.length === 0);
    paastand("panelet kan opdateres", (NK.opdaterPanel(), true));

    overskrift("9b. Inddelingen paa glasudstyr (F4)");
    /* Stregerne og rumfanget paa baegerglas, kolbe og maaleglas tegnes af
       koden ud fra geometrien. Hver streg for V mL skal staa, hvor vaesken
       naar op til med V mL i glasset - baade efter arealet og efter den
       vaeske, tegning.js faktisk tegner - ogsaa i mindre maalestok. */
    (function () {
        var U = NK.Udstyr, Tg = NK.Tegning, St2 = NK.Stof;
        var cv = document.createElement("canvas"), cx = cv.getContext("2d");
        cv.width = 400; cv.height = 400;
        ["baegerStor", "baegerLille", "kolbe", "maaleglas", "bad"].forEach(function (navn) {
            [1, 0.6].forEach(function (k) {
                var t = k === 1 ? U.type(navn) : U.skaleret(U.type(navn), k);
                var liste = U.streger ? U.streger(t) : [];
                var fejlA = [], fejlT = [];
                liste.forEach(function (st) {
                    var A = NK.polyAreal(NK.klipUnder(t.indre, st.y)) / t.mlPrAreal;
                    if (Math.abs(A - st.mL) > Math.max(0.5, st.mL * 0.01)) fejlA.push(st.mL + ":" + A.toFixed(1));
                    var gg = { type: t, p: { x: t.anker.x, y: t.anker.y, v: 0 }, anker: t.anker, skala: k, indhold: St2.lav({ V: st.mL, mM: {} }), lag: null, bund: 0 };
                    var top = Tg.tegnBeholder(cx, gg, 0, {});
                    if (top === null || Math.abs(top - st.y) > 0.6) fejlT.push(st.mL + ":" + (top === null ? "-" : top.toFixed(1)) + "/" + st.y.toFixed(1));
                });
                var s = t.streger;
                paastand(navn + (k === 1 ? "" : " (skala " + k + ")") + ": stregerne staar, hvor " + liste.length + " rumfang naar op til",
                    liste.length >= 3 && !fejlA.length && !fejlT.length,
                    liste.map(function (st) { return st.mL; }).join(" ") + (fejlA.length ? " areal: " + fejlA.join(", ") : "") + (fejlT.length ? " tegnet: " + fejlT.join(", ") : ""));
                if (k === 1) paastand(navn + ": rumfanget paa glasset er dets maks (" + t.maks + " mL), og den oeverste streg er under kanten",
                    !!(s && s.navn) && liste.length > 0 && liste[liste.length - 1].mL <= t.maks && liste[liste.length - 1].y > Math.min.apply(null, t.indre.map(function (q) { return q.y; })) - 0.01);
            });
        });
    }());

    overskrift("9c. Lysvejen ovenfra (S1)");
    /* Ses der ned i et glas, er lysvejen vaeskens dybde og ikke glassets
       bredde. Proeven er en fortynding: samme stofmaengde, dobbelt
       rumfang. Et farvestof, der bare bliver fortyndet, skal staa ens
       ovenfra (halv koncentration gange dobbelt dybde) og lysere fra
       siden. En ligevaegtsblanding skal blive lysere ogsaa ovenfra,
       fordi der bliver faerre farvede molekyler.
       Maalt i tal, ikke med oejnene: farven laegges paa hvidt papir, og
       lysheden regnes ud - det er praecis det, del 2 viser paa papiret. */
    (function () {
        var U = NK.Udstyr, t = U.type("baegerLille");
        /* Farven som den staar paa det hvide papir, og hvor lys den er.
           Det er det samme maal som motorens NK.Vilkaar.lyshed, men
           proevebordet indlaeser ikke vilkaar.js, saa den regnes her. */
        function lyshed(gg, retning) {
            var f = B.farve(gg, retning);
            if (!f) return 255;
            var a = f.a;
            return 0.2126 * (255 * (1 - a) + f.r * a) +
                   0.7152 * (255 * (1 - a) + f.g * a) +
                   0.0722 * (255 * (1 - a) + f.b * a);
        }
        function opret(navn, x) { return bord.tilfoej({ navn: navn, type: "baegerLille", x: x }); }
        function fyld(gg, o) { B.toem(gg); B.haeldI(gg, o, true); }
        var a = opret("_ov_a", 1180), b2 = opret("_ov_b", 1260);

        /* Geometrien: vejen ovenfra er dybden, saa den vokser med rumfanget */
        var l40 = U.vejOvenfra(t, 40), l80 = U.vejOvenfra(t, 80);
        paastand("vejen ovenfra fordobles, naar rumfanget fordobles",
            Math.abs(l80 / l40 - 2) < 0.05,
            l40.toFixed(3) + " -> " + l80.toFixed(3) + " reagensglas (" + (l80 / l40).toFixed(3) + "x)");
        paastand("de sidste par procent mangler, fordi bunden er rundet af", l80 / l40 < 2);
        paastand("et tomt glas har ingen vej ovenfra", U.vejOvenfra(t, 0) === 0);
        paastand("vejen ovenfra er den samme i mindre maalestok",
            Math.abs(U.vejOvenfra(U.skaleret(t, 0.5), 40) - l40) < 1e-9);
        var K = U.type("kolbe");
        paastand("kolben er bredest forneden, saa dens vej ovenfra vokser hurtigere end rumfanget",
            U.vejOvenfra(K, 100) / U.vejOvenfra(K, 50) > 2.1,
            (U.vejOvenfra(K, 100) / U.vejOvenfra(K, 50)).toFixed(2) + "x ved 50 -> 100 mL");
        paastand("lysvejen fra siden er uaendret: glassets egen",
            B.lysvej(a) === t.vejlaengde && B.lysvej(a, "side") === t.vejlaengde, t.vejlaengde.toFixed(3));

        /* Frugtfarve: 40 umol i begge glas, det ene fortyndet til det dobbelte */
        fyld(a, St.lav({ V: 40, umol: { farve: 40 } }));
        fyld(b2, St.lav({ V: 80, umol: { farve: 40 } }));
        paastand("frugtfarve: samme stofmaengde, halv koncentration i det fortyndede",
            Math.abs(n(a, "farve") - n(b2, "farve")) < 1e-9 &&
            Math.abs(St.konc(a.indhold, "farve") / St.konc(b2.indhold, "farve") - 2) < 0.01,
            St.konc(a.indhold, "farve").toFixed(2) + " mM mod " + St.konc(b2.indhold, "farve").toFixed(2) + " mM");
        var fa = lyshed(a, "ovenfra"), fb = lyshed(b2, "ovenfra");
        paastand("ovenfra ser de to glas ens ud", Math.abs(fa - fb) < 0.5,
            "lyshed " + fa.toFixed(2) + " mod " + fb.toFixed(2));
        var sa = lyshed(a), sb = lyshed(b2);
        paastand("fra siden er det fortyndede glas tydeligt lysere", sb - sa > 15,
            "lyshed " + sa.toFixed(2) + " mod " + sb.toFixed(2));

        /* Ligevaegt: Fe3+ + SCN- = FeSCN2+, samme stofmaengder, dobbelt rumfang */
        fyld(a, St.lav({ V: 40, mM: { "Fe3+": 5, "NO3-": 15, "K+": 5, "SCN-": 5 } }));
        fyld(b2, St.lav({ V: 80, mM: { "Fe3+": 2.5, "NO3-": 7.5, "K+": 2.5, "SCN-": 2.5 } }));
        adv(60);
        paastand("ligevaegten har indstillet sig i begge glas", n(a, "FeSCN2+") > 10 && n(b2, "FeSCN2+") > 10,
            n(a, "FeSCN2+").toFixed(1) + " umol mod " + n(b2, "FeSCN2+").toFixed(1) + " umol");
        paastand("fortyndingen har flyttet ligevaegten: faerre FeSCN2+ i alt",
            n(b2, "FeSCN2+") < n(a, "FeSCN2+") * 0.85,
            (n(b2, "FeSCN2+") / n(a, "FeSCN2+") * 100).toFixed(0) + " % af stofmaengden tilbage");
        var ga = lyshed(a, "ovenfra"), gb = lyshed(b2, "ovenfra");
        paastand("og derfor er det fortyndede glas ogsaa lysere OVENFRA", gb - ga > 8,
            "lyshed " + ga.toFixed(2) + " mod " + gb.toFixed(2));
        var la = lyshed(a), lb = lyshed(b2);
        paastand("men forskellen er mindre ovenfra end fra siden: den laengere vej tager noget af den",
            gb - ga < (lb - la) * 0.5,
            (gb - ga).toFixed(1) + " mod " + (lb - la).toFixed(1) + " i lyshed");
        paastand("det er forskellen paa de to: frugtfarven staar ens, ligevaegten bliver lysere",
            Math.abs(fa - fb) < 0.5 && gb - ga > 8);

        [a, b2].forEach(function (x) { bord.tagUd(x); });
        paastand("proeveglassene er taget af bordet igen", !bord.g._ov_a && !bord.g._ov_b);
    }());

    overskrift("9d. Glas rammes, hvor der er glas (F12)");
    /* Et omdrejningslegeme uden etiket over sig rammes efter sin
       silhuet og ikke efter sit rektangel. For et reagensglas og et
       baegerglas er det naesten den samme kasse, men kolben er smal
       foroven, og dens oeverste hjoerner er luft. */
    (function () {
        var U = NK.Udstyr;
        function laeg(navn, x) { return bord.tilfoej({ navn: navn, type: navn, x: x }); }
        var kb = bord.tilfoej({ navn: "_traef_kolbe", type: "kolbe", x: 1180 });
        var rk = bord.rekt(kb, 0);
        function traf(dx, dy) { return bord.hvad({ x: rk.x + dx, y: rk.y + dy }); }
        paastand("kolbens oeverste hjoerner er luft", traf(5, 6) === null && traf(rk.b - 5, 6) === null,
            "[" + traf(5, 6) + ", " + traf(rk.b - 5, 6) + "]");
        paastand("men halsen og bunden er glas",
            traf(rk.b / 2, 10) === "_traef_kolbe" && traf(6, rk.h - 6) === "_traef_kolbe");
        paastand("og midten af kolben er glas", traf(rk.b / 2, rk.h * 0.7) === "_traef_kolbe");
        paastand("skraaningen rammes, hvor glasset er, og ikke ved siden af",
            traf(14, rk.h * 0.78) === "_traef_kolbe" && traf(14, rk.h * 0.45) === null,
            "[" + traf(14, rk.h * 0.78) + ", " + traf(14, rk.h * 0.45) + "]");
        bord.tagUd(kb);

        /* Et baegerglas og et reagensglas rammes som foer */
        var bg = bord.tilfoej({ navn: "_traef_baeger", type: "baegerLille", x: 1180 });
        var rb = bord.rekt(bg, 0);
        paastand("et baegerglas rammes stadig i hele sin kasse",
            bord.hvad({ x: rb.x + 4, y: rb.y + 4 }) === "_traef_baeger" &&
            bord.hvad({ x: rb.x + rb.b - 4, y: rb.y + rb.h - 6 }) === "_traef_baeger");
        bord.tagUd(bg);
        var rg1 = bord.rekt(g.glas1, 0);
        paastand("et reagensglas rammes foroven, men ikke nede i stativet",
            bord.hvad({ x: rg1.x + rg1.b / 2, y: rg1.y + 20 }) === "glas1" &&
            bord.hvad({ x: rg1.x + rg1.b / 2, y: rg1.y + rg1.h - 6 }) !== "glas1");
        /* En flaske har etiket over det meste af sig: dens inderside er kun
           et kig ind i den, saa den rammes som et rektangel */
        var rf = bord.rekt(g.fl_hcl, 0);
        paastand("en flaske rammes som foer, i hele sin kasse",
            bord.hvad({ x: rf.x + 3, y: rf.y + 3 }) === "fl_hcl");
        paastand("proevegenstandene er taget af bordet igen", !bord.g._traef_kolbe && !bord.g._traef_baeger);

        /* Og rammen, man ser, skal vise det samme: den foelger silhuetten
           for et omdrejningslegeme og er ellers en kasse. */
        var k2 = bord.tilfoej({ navn: "_form_kolbe", type: "kolbe", x: 1180 });
        var form = NK.Tegning.markeringsForm(k2);
        paastand("markeringen om kolben er en form og ikke en kasse", !!form && form.length === k2.type.indre.length);
        paastand("og den ligger uden om glasset hele vejen rundt",
            form.every(function (q) { return !NK.iPoly(NK.Tegning.indreVerden(k2), q.x, q.y); }));
        var rk2 = bord.rekt(k2, 0);
        var halsY = rk2.y + 14;
        var formHals = form.filter(function (q) { return Math.abs(q.y - halsY) < 40; });
        paastand("ved halsen snoerer den ind om halsen og fylder ikke hele kassen",
            formHals.length > 0 && Math.max.apply(null, formHals.map(function (q) { return q.x; })) < rk2.x + rk2.b - 6,
            "hoejst x " + Math.max.apply(null, formHals.map(function (q) { return q.x; })).toFixed(0) + " mod kassens " + (rk2.x + rk2.b).toFixed(0));
        bord.tagUd(k2);
        var b2 = bord.tilfoej({ navn: "_form_flaske", type: "flaske", x: 1180 });
        paastand("en flaske med etiket faar ingen form, kun sin kasse", NK.Tegning.markeringsForm(b2) === null);
        bord.tagUd(b2);
    }());

    overskrift("9e. Farven er dybest, hvor glasset er bredest");
    /* Lysvejen gennem vaesken foelger indersidens bredde. En konisk kolbe
       er bredest forneden, saa lyset gaar laengst gennem bunden, og bunden
       staar moerkest. Et baegerglas er lige i siderne og har derfor samme
       farve hele vejen ned. */
    (function () {
        var Tg = NK.Tegning, St2 = NK.Stof;
        function tl(x, d) { return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ","); }
        function lys(f) { return (0.2126 * f.r + 0.7152 * f.g + 0.0722 * f.b) / 255; }
        var kb = bord.tilfoej({ navn: "_dyb_kolbe", type: "kolbe", x: 1180 });
        B.haeldI(kb, St2.lav({ V: 150, mM: { "Cu2+": 20 } }), true);
        adv(0.5);
        var verden = Tg.indreVerden(kb);
        var ved = Tg.vejVedY(kb, verden);
        paastand("kolben har ikke samme lysvej hele vejen ned", !!ved);
        var y0 = Math.min.apply(null, verden.map(function (q) { return q.y; }));
        var y1 = Math.max.apply(null, verden.map(function (q) { return q.y; }));
        var vHals = ved(y0 + (y1 - y0) * 0.2), vBund = ved(y1 - (y1 - y0) * 0.1);
        paastand("vejen gennem bunden er over dobbelt saa lang som gennem halsen",
            vBund > vHals * 2, tl(vHals, 2) + " mod " + tl(vBund, 2) + " reagensglas");
        var o = B.samlet(kb);
        var lysHals = lys(St2.gennem(o, vHals)), lysBund = lys(St2.gennem(o, vBund));
        paastand("og farven er derfor tydeligt moerkere forneden", lysBund < lysHals - 0.08,
            "lyshed " + tl(lysHals, 2) + " foroven mod " + tl(lysBund, 2) + " forneden");
        paastand("gennemsnittet er stadig glassets egen vejlaengde",
            Math.abs(ved((y0 + y1) / 2) - kb.type.vejlaengde) < kb.type.vejlaengde * 0.6);
        bord.tagUd(kb);

        var bg2 = bord.tilfoej({ navn: "_dyb_baeger", type: "baegerLille", x: 1180 });
        B.haeldI(bg2, St2.lav({ V: 150, mM: { "Cu2+": 20 } }), true);
        adv(0.5);
        paastand("et baegerglas er lige i siderne, saa farven er den samme hele vejen ned",
            Tg.vejVedY(bg2, Tg.indreVerden(bg2)) === null);
        bord.tagUd(bg2);
        paastand("proevegenstandene er taget af bordet igen", !bord.g._dyb_kolbe && !bord.g._dyb_baeger);
    }());

    overskrift("10. Udstyr i mindre maalestok");
    /* Et lille bord kan have udstyr i halv stoerrelse. Kun tegnemaalene
       skaleres: rumfang, lysvej og kemi skal vaere uaendret. */
    var U = NK.Udstyr, stor = U.type("baegerLille");
    var lb = bord.tilfoej({ navn: "_lille_baeger", type: "baegerLille", x: 1180, skala: 0.5 });
    var lst = bord.tilfoej({ navn: "_lille_stativ", type: "stativ", p: { x: 1180, y: 300, v: 0 }, skala: 0.5 });
    var lgl = bord.tilfoej({ navn: "_lille_glas", type: "reagensglas", stativ: "_lille_stativ", hul: 1, nr: 9, titel: "lille glas" });
    paastand("spritet er halvt saa stort", Math.abs(lb.type.b - stor.b / 2) < 1e-9 && Math.abs(lb.type.h - stor.h / 2) < 1e-9, lb.type.b);
    paastand("rumfang, lysvej og masse er uaendrede", lb.type.maks === stor.maks && lb.type.vejlaengde === stor.vejlaengde && lb.type.masse === stor.masse, lb.type.maks + " mL");
    paastand("vaesken staar lige saa hoejt i det lille glas", (function () {
        function andel(t) {
            var verden = t.indre.map(function (q) { return NK.tilVerden({ x: 300, y: 300, v: 0 }, t.anker, q.x, q.y); });
            var y0 = Math.min.apply(null, verden.map(function (q) { return q.y; }));
            var y1 = Math.max.apply(null, verden.map(function (q) { return q.y; }));
            return (y1 - NK.vaeskeNiveau(verden, 50 * t.mlPrAreal)) / (y1 - y0);
        }
        return Math.abs(andel(stor) - andel(lb.type)) < 0.01;
    }()));
    bord.haeld(g.fl_cu, lb, 20);
    faerdig();
    paastand("der kan haeldes i det, og koncentrationen er den samme", Math.abs(V(lb) - 20) < 0.2 && Math.abs(NK.Stof.konc(lb.indhold, "Cu2+") - 100) < 1, NK.Stof.konc(lb.indhold, "Cu2+").toFixed(1) + " mM");
    paastand("glasset arver stativets skala og staar i hullet", lgl.skala === 0.5 && Math.abs(lgl.p.x - (lst.p.x + lst.type.huller[1])) < 1.5, lgl.skala);
    var lr = bord.rekt(lgl, 0);
    paastand("musen rammer det, der er tegnet", bord.hvad({ x: lr.x + lr.b / 2, y: lr.y + lr.h / 2 }) === "_lille_glas" && Math.abs(lr.h - U.type("reagensglas").h / 2) < 1.5, lr.h.toFixed(0));
    [lgl, lst, lb].forEach(function (x) { bord.tagUd(x); });
    paastand("de kan tages af bordet igen", !bord.g._lille_glas && !bord.g._lille_stativ && !bord.g._lille_baeger);

    overskrift("11. Slipmaalet: naermeste, ikke oeverst tegnede");
    /* Slipmaalet vaelges blandt alle, der vil tage imod, efter afstanden fra
       det, man sigter med, til det, man sigter efter - ikke efter hvad der
       er tegnet oeverst. To reagensglas i naboglas-huller er proeven. */
    frisk();
    var st = g.stativ, gl1 = g.glas1, gl2 = g.glas2;
    bord.frigoer(gl2);
    bord.iStativ(gl2, st, 1, true);
    faerdig();
    paastand("glas 1 og 2 staar i naboglas-huller", gl1.sted && gl1.sted.hul === 0 && gl2.sted && gl2.sted.hul === 1,
        (gl1.sted && gl1.sted.hul) + " og " + (gl2.sted && gl2.sted.hul));
    var fl = g.fl_cu;
    /* Flasken holdes, saa tuden staar over hullerne; x forskydes fra glas 1's aabning */
    var o1 = B.aabning(gl1), o2 = B.aabning(gl2), afst = o2.x - o1.x;
    function tudVed(x) {
        var p = B.haeldPositur(fl, gl1, 14);
        var t = B.tudVerden({ p: p, anker: fl.anker, type: fl.type });
        fl.p = { x: p.x + (x - t.x), y: p.y, v: p.v };
        return { x: fl.p.x, y: fl.p.y - 10 };   /* musen: paa flasken, ikke over glasset */
    }
    bord.startBaer(fl);
    var rigtige = 0, forkerte = [];
    for (var r = 0; r < 10; r++) {
        var modGlas1 = r % 2 === 0;
        var x = modGlas1 ? o1.x + 16 : o2.x - 16;   /* inde i begge glas' zone, men naermest det ene */
        var pt = tudVed(x);
        bord.slipMaal = null;
        var m = bord.maalVed(fl, pt);
        if (m === (modGlas1 ? "glas1" : "glas2")) rigtige++; else forkerte.push(r + ":" + m);
    }
    paastand("ti gange i traek faar tuden det glas, den peger paa", rigtige === 10, rigtige + " af 10" + (forkerte.length ? " (forkerte: " + forkerte.join(", ") + ")" : ""));
    var raekkefoelge = bord.liste.indexOf(gl1) < bord.liste.indexOf(gl2);
    bord.tilFront(gl1);
    bord.slipMaal = null;
    paastand("det, man sidst roerte, vinder ikke laengere", bord.maalVed(fl, tudVed(o2.x - 16)) === "glas2", "glas 1 forrest, tuden naermest glas 2");
    /* Hysterese: det valgte maal beholdes, naar forskellen er lille */
    bord.slipMaal = "glas2";
    var midt = o1.x + afst / 2;
    paastand("naesten midt imellem beholdes det valgte", bord.maalVed(fl, tudVed(midt - 3)) === "glas2");
    paastand("men et tydeligt bedre maal vinder", bord.maalVed(fl, tudVed(o1.x + 4)) === "glas1");
    paastand("stille mus giver samme svar hver gang", (function () {
        var pt2 = tudVed(o1.x + 5), foerste = bord.maalVed(fl, pt2);
        for (var q = 0; q < 20; q++) if (bord.maalVed(fl, pt2) !== foerste) return false;
        return true;
    }()));
    bord.stopBaer({ x: fl.hjem.x, y: fl.hjem.y });
    faerdig();

    /* Flaskehalsen: et baegerglas med vaeske haeldes tilbage i en flaske */
    var bs = g.baegerStor;
    bord.haeld(g.fl_ki, bs, 30);
    faerdig();
    bord.startBaer(bs);
    var ok = B.aabning(g.fl_ki);
    function bsTudVed(x) {
        var p = B.haeldPositur(bs, g.fl_ki, 14);
        var t = B.tudVerden({ p: p, anker: bs.anker, type: bs.type });
        bs.p = { x: p.x + (x - t.x), y: p.y, v: p.v };
        return { x: bs.p.x, y: bs.p.y };
    }
    bord.slipMaal = null;
    paastand("flaskehalsen rammes uden at sigte pixelvis (12 enheder ved siden af)", bord.maalVed(bs, bsTudVed(ok.x + 12)) === "fl_ki");
    bord.slipMaal = null;
    var vedSiden = bord.maalVed(bs, bsTudVed(ok.x + 30));
    paastand("tydeligt ved siden af saettes det ned mellem flaskerne", vedSiden !== "fl_ki" && vedSiden !== "fl_cu", String(vedSiden));
    bord.stopBaer({ x: bs.hjem.x, y: bs.hjem.y });
    faerdig();
    frisk();

    overskrift("12. Med musen: som en elev");
    /* Rigtige pointer-haendelser gennem laerredet (../js/proeve.js). Proeven
       styrer tiden, saa bordet ser musens fart. */
    frisk();
    var mus = NKProeve.mus(bord, { tik: function (dt) { bord.opdater(dt); } });
    var uheldM = bord.antalUheld;
    /* Sammenlignes med det gamle hjem: saetNed flytter hjem med */
    function hjemMedMusen(navn) {
        var gg = g[navn], hjem0 = { x: gg.hjem.x, y: gg.hjem.y };
        if (!mus.tag(navn)) { mus.slip(); return false; }
        mus.baer(hjem0, 0.8);
        mus.hold(0.5);
        mus.slip();
        mus.hold(0.8);
        return !gg.svaev && Math.abs(gg.p.x - hjem0.x) < 2 && Math.abs(gg.p.y - hjem0.y) < 2;
    }
    /* Flasken sluppet hurtigt over glas 1 giver en portion */
    var rkG1 = bord.rekt(g.glas1, 0);
    paastand("saltsyreflasken kan tages med musen", mus.tag("fl_hcl"));
    mus.til({ x: g.glas1.p.x, y: rkG1.y + 30 }, 0.7);
    paastand("over glas 1 faar glasset den groenne ramme", bord.slipMaal === "glas1", bord.slipMaal);
    mus.slip();
    mus.hold(2);
    paastand("et hurtigt slip haelder en portion i glas 1", V(g.glas1) > 1, V(g.glas1).toFixed(1) + " mL");
    paastand("og flasken kan traekkes hjem igen", hjemMedMusen("fl_hcl"));
    /* De tre draabeflasker holdt med bunden lige over glas 2, 3 og 4 */
    [["ag", "glas2"], ["phph", "glas3"], ["btb", "glas4"]].forEach(function (par) {
        var fl = g[par[0]], gl = g[par[1]], rk = bord.rekt(gl, 0), V0 = V(gl);
        mus.tag(par[0]);
        mus.baer({ x: gl.p.x, y: rk.y - 5 - fl.type.h + fl.anker.y }, 0.7);
        var maal = bord.slipMaal;
        mus.hold(1.8);
        var holdtV = V(gl) - V0;
        mus.slip();
        mus.hold(2);
        paastand(par[0] + " holdt over " + par[1] + " drypper ikke, og et slip giver én draabe i glasset",
            maal === par[1] && holdtV < 1e-9 && Math.abs(V(gl) - V0 - 0.05) < 0.001,
            maal + ", " + (V(gl) - V0).toFixed(3) + " mL");
        paastand("og kan traekkes hjem igen", hjemMedMusen(par[0]));
    });
    /* Glas 4 flyttes et hul til hoejre i stativet */
    var st4 = g.stativ, hul4 = g.glas4.sted.hul;
    mus.tag("glas4", 0.5, 0.3);
    mus.baer({ x: bord.hulX(st4, hul4 + 1), y: st4.p.y - 90 }, 0.6);
    mus.slip();
    mus.hold(1);
    paastand("glas 4 kan flyttes til naeste hul i stativet", g.glas4.sted && g.glas4.sted.hul === hul4 + 1, g.glas4.sted ? "hul " + g.glas4.sted.hul : "ikke i stativet");
    paastand("intet uheld undervejs", bord.antalUheld === uheldM, bord.antalUheld - uheldM + " uheld");
    frisk();

    overskrift("13. Kemichael slutter ved gulvet");
    /* F3: kitlen fortsatte 1500 enheder ned under figuren, saa han fik
       meget lange ben i et hoejt laerred. Nu klippes han ved scenens gulv
       (NK.Scene.GULV). Proeven tegner ham paa et frit laerred, hvor gulvet
       ligger 150 px nede, og ser efter, at der ikke er tegnet noget under
       det. */
    var Sg = NK.Scene;
    var gulv = Sg.GULV === undefined ? Sg.HOEJDE : Sg.GULV;
    paastand("scenen har et gulv", Sg.GULV === Sg.HOEJDE, "gulv " + Sg.GULV + ", scene " + Sg.HOEJDE + " hoej");
    var Lg = bord.laerer;
    Lg.x = 500; Lg.maalX = 500;
    var lrd = d.createElement("canvas");
    lrd.width = 420; lrd.height = 320;
    var cg = lrd.getContext("2d");
    cg.translate(210 - Lg.x, 150 - gulv);
    bord.tegnLaerer(cg, 0, { udenBoble: true });
    var dat = cg.getImageData(0, 152, 420, 168).data, tegnet = 0;
    for (var ig = 3; ig < dat.length; ig += 4) if (dat[ig] > 10) tegnet++;
    paastand("intet af figuren er tegnet under gulvet", tegnet === 0, tegnet + " pixel under gulvet");
    var over = cg.getImageData(0, 60, 420, 80).data, kittel = 0;
    for (var jg = 3; jg < over.length; jg += 4) if (over[jg] > 10) kittel++;
    paastand("men han er der: kitlen naar ned til gulvet", kittel > 2000, kittel + " pixel lige over gulvet");
    paastand("og man rammer ham ikke under gulvet med musen",
        bord.overLaerer({ x: Lg.x, y: gulv + 30 }) === null && bord.overLaerer({ x: Lg.x, y: gulv - 30 }) === "laerer");
    frisk();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
