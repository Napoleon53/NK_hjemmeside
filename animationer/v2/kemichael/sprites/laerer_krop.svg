<svg xmlns="http://www.w3.org/2000/svg" width="440" height="500" viewBox="0 0 220 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Laereren i kittel, set forfra fra livet og op. Halsen (hovedets
       anker) er (110, 18). Hoejre skulder, hvor armen drejer, er (176, 58).
       Den venstre arm haenger ned langs siden. -->
  <defs>
    <linearGradient id="kittel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9d2da"/>
      <stop offset="0.3" stop-color="#f7f9fb"/>
      <stop offset="0.7" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#bcc6cf"/>
    </linearGradient>
    <linearGradient id="hud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9a37f"/>
      <stop offset="0.5" stop-color="#f1c7a3"/>
      <stop offset="1" stop-color="#d49c77"/>
    </linearGradient>
  </defs>
  <!-- Hals -->
  <rect x="96" y="6" width="28" height="34" rx="8" fill="url(#hud)"/>
  <!-- Skjorte og slips -->
  <path d="M84 34 L110 64 L136 34 L136 120 L84 120 Z" fill="#8fb4d8"/>
  <path d="M104 44 L116 44 L113 54 L119 104 L110 114 L101 104 L107 54 Z" fill="#8b2a2a"/>
  <path d="M104 44 L116 44 L113 54 L107 54 Z" fill="#6d1f1f"/>
  <path d="M92 32 L110 46 L100 58 Z M128 32 L110 46 L120 58 Z" fill="#dce8f3" stroke="#7a9cc0" stroke-width="0.8"/>
  <!-- Kittel. Aabningen ned ad midten er en STREG og ikke et hul i
       fladen: gik omridset helt ned til (110, 250), vendte vindingen, og
       saa stod hele venstre forstykke gennemsigtigt, saa vaeggen kunne ses
       gennem kitlen med knapperne svaevende paa. -->
  <path d="M84 30 Q52 32 36 50 Q20 66 18 110 L14 250 L206 250 L202 110 Q200 66 184 50 Q168 32 136 30 L122 120 L110 158 L98 120 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M110 158 L110 250" fill="none" stroke="#9aa6b1" stroke-width="1.2"/>
  <!-- Revers -->
  <path d="M84 30 L98 120 L72 70 L86 62 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <path d="M136 30 L122 120 L148 70 L134 62 Z" fill="#e3e9ee" stroke="#9aa6b1" stroke-width="1"/>
  <!-- Venstre aerme og haand -->
  <path d="M36 50 Q18 64 16 110 L12 206 L44 208 L50 112 Q52 80 58 60 Z" fill="url(#kittel)" stroke="#9aa6b1" stroke-width="1.2"/>
  <path d="M12 200 L44 202" stroke="#9aa6b1" stroke-width="1.2"/>
  <ellipse cx="28" cy="220" rx="15" ry="17" fill="url(#hud)"/>
  <!-- Brystlomme med kuglepenne og navneskilt -->
  <path d="M146 96 L182 96 L180 132 L148 132 Z" fill="none" stroke="#9aa6b1" stroke-width="1.2"/>
  <rect x="152" y="82" width="4" height="18" rx="1" fill="#2d62b3"/>
  <rect x="159" y="84" width="4" height="16" rx="1" fill="#c0392b"/>
  <rect x="166" y="80" width="4" height="20" rx="1" fill="#2b2f36"/>
  <rect x="34" y="91" width="58" height="19" rx="3" fill="#ffffff" stroke="#6f7a85" stroke-width="1"/>
  <text x="51" y="104.5" font-family="Segoe UI, Arial, sans-serif" font-size="8.4" font-weight="800" fill="#2a3038">MICHAEL</text>
  <!-- "KE" er skrevet foran med kuglepen af en elev -->
  <text x="36.5" y="105.5" font-family="Segoe Print, Comic Sans MS, cursive" font-size="8.5" font-weight="700" fill="#2d62b3" transform="rotate(-9 42 102)">KE</text>
  <!-- Knapper -->
  <circle cx="112" cy="150" r="2.6" fill="#c3ccd4"/>
  <circle cx="111" cy="190" r="2.6" fill="#c3ccd4"/>
  <circle cx="110" cy="230" r="2.6" fill="#c3ccd4"/>
</svg>
