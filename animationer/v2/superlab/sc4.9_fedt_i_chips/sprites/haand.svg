<svg xmlns="http://www.w3.org/2000/svg" width="192" height="168" viewBox="0 0 96 84">
  <!-- Haand i blaa nitrilhandske, der griber om en lodret kolbehals.
       Grebet (halsens midte) er (40, 46). Haandleddet gaar op til hoejre. -->
  <defs>
    <linearGradient id="handske" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb3f7"/>
      <stop offset="0.5" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3563c4"/>
    </linearGradient>
    <linearGradient id="finger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbdf8"/>
      <stop offset="0.55" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3a68c8"/>
    </linearGradient>
  </defs>
  <!-- Haandled og manchet -->
  <path d="M58 24 L80 0 L96 14 L76 40 Z" fill="url(#handske)"/>
  <path d="M74 4 L92 18" stroke="#3563c4" stroke-width="2" stroke-linecap="round"/>
  <!-- Haandryg -->
  <path d="M46 22 Q62 16 72 30 Q80 46 70 64 Q62 76 50 74 Z" fill="url(#handske)"/>
  <!-- Fingre om halsen -->
  <g stroke="#2f5bb5" stroke-width="1">
    <rect x="14" y="26" width="46" height="12" rx="6" fill="url(#finger)"/>
    <rect x="12" y="37" width="48" height="12" rx="6" fill="url(#finger)"/>
    <rect x="13" y="48" width="46" height="12" rx="6" fill="url(#finger)"/>
    <rect x="16" y="59" width="40" height="11" rx="5.5" fill="url(#finger)"/>
  </g>
  <!-- Tommelfinger -->
  <path d="M60 22 Q44 10 28 16 Q20 19 24 25 Q30 28 44 24 Q52 24 58 30 Z" fill="url(#finger)" stroke="#2f5bb5" stroke-width="1"/>
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.6" stroke-linecap="round">
    <path d="M20 30 h18 M18 41 h20 M19 52 h18 M22 63 h14"/>
  </g>
</svg>
