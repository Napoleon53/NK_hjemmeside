<svg xmlns="http://www.w3.org/2000/svg" width="160" height="44" viewBox="0 0 80 22">
  <!-- Petriskaal i glas, set lidt fra oven. Bundens midte (ankeret) er
       (40, 21). Bunden er en ellipse med midte (40, 16), randen en ellipse
       med midte (40, 6), begge med halvakser 38 og 5. Indholdet tegnes af
       animationen bag denne fil. -->
  <!-- Bagkant -->
  <path d="M2 6 A38 5 0 0 1 78 6" fill="none" stroke="#dcecf8" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- Forvaeg -->
  <path d="M2 6 A38 5 0 0 0 78 6 L78 16 A38 5 0 0 1 2 16 Z" fill="#d4ebfa" fill-opacity="0.12"/>
  <path d="M2 6 L2 16 A38 5 0 0 0 78 16 L78 6" fill="none" stroke="#dcecf8" stroke-opacity="0.85" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M2 6 A38 5 0 0 0 78 6" fill="none" stroke="#eef6fc" stroke-opacity="0.95" stroke-width="1.4"/>
  <!-- Genskin -->
  <path d="M10 13 Q24 17.5 40 18" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M62 9 L70 8.2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" stroke-linecap="round"/>
</svg>
