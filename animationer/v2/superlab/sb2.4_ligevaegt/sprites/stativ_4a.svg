<svg xmlns="http://www.w3.org/2000/svg" width="784" height="200" viewBox="0 0 392 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Reagensglasstativ i trae til sb2.4: syv glas i raekke og et for sig
       (glas 4a, forundersoegelsen, der ikke skal have stamoploesning).
       Hullerne sidder ved x 34, 76, 118, 160, 202, 244, 286 og 358. Uden
       tal: glassene har selv deres skilte (1-6, R, 4a og 4b). Tegnes
       efter glassene, saa topbraettet daekker dem. -->
  <defs>
    <linearGradient id="trae" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ac72"/>
      <stop offset="1" stop-color="#a8773f"/>
    </linearGradient>
    <linearGradient id="stolpe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c6d38"/>
      <stop offset="0.5" stop-color="#d4a66c"/>
      <stop offset="1" stop-color="#946634"/>
    </linearGradient>
  </defs>
  <rect x="4" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="378" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="0" y="88" width="392" height="12" rx="2" fill="url(#trae)"/>
  <g fill="#6b4520" fill-opacity="0.6">
    <ellipse cx="34" cy="89" rx="10" ry="2"/>
    <ellipse cx="76" cy="89" rx="10" ry="2"/>
    <ellipse cx="118" cy="89" rx="10" ry="2"/>
    <ellipse cx="160" cy="89" rx="10" ry="2"/>
    <ellipse cx="202" cy="89" rx="10" ry="2"/>
