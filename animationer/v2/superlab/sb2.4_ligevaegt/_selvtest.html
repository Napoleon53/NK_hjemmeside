<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - Indgreb i en kemisk ligevægt</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script src="../../laboratoriet/js/proeve.js"></script>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem: kemien i de
   fire indgreb, badene, forloebets trin (ogsaa i forkert raekkefoelge),
   flagene, udloeserne, gemningen, opstillingen mod stoftabellen,
   Kemichaels replikker fra forloebet og taleboblen som eget lag. Til
   sidst goeres det samme med musen, som en elev (proeve.js).

   Skal aabnes gennem en lokal server (eller Chrome med
   --allow-file-access-from-files), ellers kan iframen ikke laeses.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function tal(x, d) { return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ","); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var bord = NK.bord, B = NK.Beholder, St = NK.Stof, V = NK.Vilkaar;
    var side = NK.Side.nu, F = NK.Forloeb.nu;
    paastand("bordet er bygget", !!bord);
    paastand("skallen er den faelles side.js", !!side);
    paastand("forloebet er bygget", !!F && F.trin.length === 13, F && F.trin.length + " trin");
    paastand("de syv glas staar i stativet, og der er intet glas 8 (F48)", [1,2,3,4,5,6,7].every(function (i) { return !!bord.g["glas" + i]; }) && !bord.g.glas8);
    paastand("badene staar paa bordet", !!bord.g.vandbad && !!bord.g.isbad &&
        bord.g.vandbad.kan.bad && bord.g.isbad.kan.bad);
    paastand("vandbadet staar paa varmepladen", bord.g.vandbad.paa === bord.g.plade);
    paastand("teksterne er skrevet ind fra tekst.js",
        d.getElementById("teori-indhold").textContent.indexOf("exoterm") > 0);
    paastand("panelet viser foerste trin",
        d.getElementById("forloeb-tekst").textContent.indexOf("stamopløsning") > 0);
    paastand("introen aabner og lukker", !!NK.intro &&
        (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) &&
        (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    var alle = Object.keys(NK.Sprites.FILER);
    var klar = alle.filter(function (n) { return NK.Sprites.klar(n); });
    paastand("sprites er indlaest", klar.length === alle.length, klar.length + " af " + alle.length);

    /* Zoomboblen staar i laboratoriets oeverste venstre hjoerne og skalerer
       med det. Opstillingen holder hjoernet frit: intet udstyr, ingen hylde
       og ikke plakaten maa ligge inden for boblen og dens navn. */
    var valgtFoer = bord.valgt;
    var vin = ramme.contentWindow;
    var Sc = NK.Scene;
    paastand("zoomboblen staar paa scenen og ikke i panelet",
        !d.getElementById("boble-laerred") && !!bord.boble && bord.bobleR === 135);
    paastand("og indholdet i den er en tiendedel mindre", bord.bobleIndhold === 0.9 && bord.mikro.k === 0.9);
    var br = bord.bobleRekt(), daekker = [];
    function overlap(a, b) { return a.x < b.x + b.b && a.x + a.b > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    bord.liste.forEach(function (gg) {
        if (bord.synlig(gg) && overlap(bord.rekt(gg, 0), br)) daekker.push(gg.navn);
    });
    (Sc.HYLDER || []).forEach(function (H, i) {
        if (overlap({ x: H.x0, y: H.y, b: H.x1 - H.x0, h: 21 }, br)) daekker.push("hylde " + i);
    });
    if (bord.plakat && overlap(bord.plakatRekt(), br)) daekker.push("plakaten");
    paastand("zoomboblens hjoerne er frit", daekker.length === 0, daekker.join(", ") || "frit");
    paastand("laboratoriet er smallere, saa alt er stoerre", Sc.BREDDE === 1040);
    paastand("aflaesningen har sin stil",
        vin.getComputedStyle(d.getElementById("glas-indhold")).borderCollapse === "collapse");

    /* Indholdet i tal er foldet sammen som udgangspunkt, og folden er
       skjult, naar der ikke er noget at vise */
    var fold = d.getElementById("glas-indhold-fold");
    bord.vaelg("kolbe");
    side.opdaterPanel();
    paastand("indholdet er foldet sammen som udgangspunkt",
        !!fold && !fold.hidden && !fold.open && d.getElementById("glas-indhold").rows.length > 0);
    bord.vaelg("glas1");
    side.opdaterPanel();
    paastand("folden er skjult for et tomt glas", !!fold && fold.hidden);
    bord.vaelg(valgtFoer);
    side.opdaterPanel();

    /* Ligevaegten staar i toplinjen, teorien bag knappen Teori og T, og
       uheldskortet har kun sin taeller */
    var teori = d.getElementById("teori"), topL = d.getElementById("top-ligning");
    paastand("ligningen staar i toplinjen", !!topL && topL.textContent.indexOf("⇌") > 0 &&
        topL.parentNode.classList.contains("top") && topL.getBoundingClientRect().width > 100, topL && topL.textContent);
    paastand("panelet har ikke laengere et ligevaegtskort", !d.getElementById("teori-kort-ramme") && !d.getElementById("teori-aabn"));
    paastand("uheldskortet har kun taelleren", !d.getElementById("uheld-tekst") && !!d.getElementById("uheld-taeller") &&
        d.getElementById("uheld-kort").textContent.replace(/\s+/g, " ").trim() === "Uheld " + bord.antalUheld);
    d.getElementById("teoriknap").click();
    paastand("knappen Teori aabner teoriboksen", teori.classList.contains("vis"));
    paastand("teorien er bygget af blokke",
        teori.querySelectorAll("#teori-indhold p").length >= 5 &&
        teori.querySelectorAll("#teori-indhold h3").length >= 4 &&
        teori.querySelectorAll("#teori-indhold .ligning").length >= 4);
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "t" }));
    paastand("T lukker den igen", !teori.classList.contains("vis"));
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "T" }));
    paastand("og T aabner den", teori.classList.contains("vis"));
    NK.teori.luk();

    /* Noterne foldes ud fra toplinjen ved siden af Teori */
    var noter = d.getElementById("noter"), noterknap = d.getElementById("noterknap"), felt = d.getElementById("logbog-tekst");
    var noterFoer = felt.value;
    paastand("knappen Noter staar lige efter Teori", !!noterknap && d.getElementById("teoriknap").nextElementSibling === noterknap);
    paastand("noterne er foldet ind som udgangspunkt", noter.hidden && noterknap.getAttribute("aria-expanded") === "false");
    noterknap.click();
    /* F56: noterne aabner paa fanen »Uheld og replikker« */
    paastand("knappen folder dem ud paa fanen »Uheld og replikker« (F56)", !noter.hidden &&
        !d.getElementById("noter-sket").hidden && d.getElementById("noter-egne").hidden &&
        d.activeElement === d.getElementById("fane-sket") &&
        noterknap.getAttribute("aria-expanded") === "true" && noterknap.classList.contains("aktiv"));
    paastand("skraldespanden ses kun i »Mine noter«", d.getElementById("logbog-ryd").hidden);
    d.getElementById("fane-egne").click();
    paastand("»Mine noter« viser feltet, og markoeren staar i det", d.getElementById("noter-sket").hidden &&
        !d.getElementById("noter-egne").hidden && d.activeElement === felt && !d.getElementById("logbog-ryd").hidden);
    d.getElementById("fane-sket").click();
    var rN = noter.getBoundingClientRect(), rS = d.getElementById("scene").getBoundingClientRect();
    paastand("de ligger i scenens oeverste hoejre hjoerne, ikke over panelet", rN.right <= rS.right + 0.5 && rN.top >= rS.top && rN.top - rS.top < 20,
        Math.round(rN.left) + "-" + Math.round(rN.right) + " / scene " + Math.round(rS.right));
    felt.value = "";
    bord.vaelg("kolbe");
    d.getElementById("logbog-noter").click();
    var noteret = felt.value;
    paastand("»Notér det valgte glas« skriver kolbens aflaesning som tabellen: uden tilskuere og spor",
        noteret.indexOf("Kolben") >= 0 && noteret.indexOf("Fe³⁺") >= 0 && noteret.indexOf("K⁺") < 0 && noteret.indexOf("0,00") < 0, noteret);
    paastand("og markoeren staar efter den, saa man kan skrive videre", d.activeElement === felt && felt.selectionStart === felt.value.length);
    felt.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "t", bubbles: true }));
    paastand("et t i feltet aabner ikke teorien", !teori.classList.contains("vis"));
    felt.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    paastand("Esc i feltet folder noterne ind", noter.hidden && !noterknap.classList.contains("aktiv"));
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "n" }));
    paastand("tasten N folder dem ud igen", !noter.hidden);
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "N" }));
    paastand("og ind", noter.hidden);
    felt.value = noterFoer;
    side.logbogGem();
    bord.vaelg(valgtFoer);

    function adv(sek) { for (var k = 0; k < Math.round(sek * 20); k++) bord.opdater(0.05); F.opdater(); }
    function lys(gg) { return V.lysstyrke(gg); }
    function konc(gg, navn) { return St.konc(B.samlet(gg), navn); }
    function g(n) { return bord.g["glas" + n]; }

    overskrift("2. Stamoploesningen");
    var kolbe = bord.g.kolbe;
    /* Det, et tryk giver i et reagensglas (S31: modtager i opstillingen) */
    var PORTION = bord.portion(kolbe, g(1));
    paastand("et tryk fra kolben giver 4 mL i et reagensglas", Math.abs(PORTION - 4) < 1e-9, tal(PORTION, 1) + " mL");
    for (var i = 1; i <= 7; i++) B.haeldI(g(i), B.udtag(kolbe, PORTION), true);
    adv(25);
    var ref = g(7), lys0 = lys(ref), fescn0 = konc(ref, "FeSCN2+");
    paastand("komplekset danner sig af sig selv", fescn0 > 0.4 && fescn0 < 1.5, tal(fescn0) + " mM FeSCN2+");
    paastand("farven er tydelig, men ikke sort", lys0 < 0.75 && lys0 > 0.12, "lys " + tal(lys0));
    paastand("trin 1 er gjort, naar alle syv glas er fyldt", F.erGjort("fyld"));
    paastand("naeste trin er glas 1", F.nuTrin() && F.nuTrin().id === "glas1", F.nuTrin() && F.nuTrin().id);

    overskrift("3. De fire indgreb");
    /* Med vilje i en anden raekkefoelge end listen: et trin afgoeres af
       bordets tilstand, ikke af den vej eleven kom */
    B.tilsaetFast(g(3), "KSCN(s)", 20);
    adv(40);
    paastand("et trin laengere fremme taeller ogsaa", F.erGjort("glas3"));
    paastand("men glas 1 er stadig ikke gjort", !F.erGjort("glas1"));
    paastand("glas 3 blev moerkere", lys(g(3)) < lys0 - 0.02, tal(lys0) + " -> " + tal(lys(g(3))));

    B.tilsaetFast(g(1), "Fe(NO3)3(s)", 20);
    B.tilsaetFast(g(2), "Asc(s)", 12);
    /* AgNO3 til to tredjedele af glassets SCN-: 0,02 mL 0,1 M pr. mL
       stamoploesning (3 mM), saa glasset bliver lysere, men ikke farveloest */
    B.haeldI(g(4), B.udtag(bord.g.ag, 0.02 * PORTION), true);
    adv(50);
    paastand("glas 1: mere Fe3+ giver moerkere", F.erGjort("glas1") && konc(g(1), "FeSCN2+") > fescn0,
        tal(fescn0) + " -> " + tal(konc(g(1), "FeSCN2+")) + " mM");
    paastand("glas 2: ascorbinsyre reducerer til Fe2+ og giver lysere",
        F.erGjort("glas2") && konc(g(2), "Fe2+") > 0.5, tal(konc(g(2), "Fe2+")) + " mM Fe2+");
    paastand("glas 4: AgNO3 faelder AgSCN og giver lysere",
        F.erGjort("glas4") && B.samlet(g(4)).n["AgSCN(s)"] > 1,
        tal((B.samlet(g(4)).n["AgSCN(s)"] || 0) / 1000, 3) + " mmol AgSCN");

    overskrift("3b. Boblen og tabellen: fast skala og tilskuerioner");
    /* Boblens skala er fast (partikelRef), saa FeSCN2+ faar flere kugler i
       glas 1 end i referencen, selv om Fe3+ er i stort overskud. K+ og NO3-
       er tilskuere: de skjules, naar der er mere end tre slags ioner, og
       staar for sig nederst i tabellen, naar fluebenet er sat. */
    function kugler(gl) { var o = B.samlet(gl); return St.partikelTal(o, bord.valg.partikler, bord.skjulteI(o), bord.valg.partikelRef); }
    var k7 = kugler(g(7)), k1 = kugler(g(1)), k4 = kugler(g(4));
    paastand("tilskuerionerne fra start er K+ og NO3-", bord.tilskuere.join(",") === "K+,NO3-", bord.tilskuere.join(", "));
    /* Forsoeget siger, hvad der er CENTRALT, og alt andet ionisk er
       tilskuer. Det er den vej, der holder: H+ opstaar foerst, naar
       redoxen loeber, og er tilskuer HER - men ville vaere hovedperson i
       en titrering. Motoren kan ikke gaette det; forsoeget ved det. */
    paastand("og forsoeget siger, hvad der er centralt, ikke hvad der er tilskuer",
        !!bord.centrale && bord.centrale.indexOf("FeSCN2+") >= 0 && bord.centrale.indexOf("H+") < 0,
        (bord.centrale || []).join(", "));
    (function () {
        var o = St.lav({ V: 6, mM: { "Fe3+": 2, "SCN-": 2, "FeSCN2+": 1, "K+": 3, "NO3-": 9, "H+": 5, "Fe2+": 4 } });
        var sk = bord.tilskuereI(o);
        paastand("saa H+ er tilskuer, ogsaa selv om den ikke stod paa bordet fra start",
            sk.indexOf("H+") >= 0 && sk.indexOf("Fe2+") < 0 && sk.indexOf("FeSCN2+") < 0, sk.join(", "));
    }());
    paastand("FeSCN2+ faar flere kugler i glas 1 (mere Fe3+) end i referencen", (k1["FeSCN2+"] || 0) > (k7["FeSCN2+"] || 0),
        (k7["FeSCN2+"] || 0) + " -> " + (k1["FeSCN2+"] || 0) + " " + JSON.stringify(k1));
    paastand("og faerre i glas 4 (AgNO3), men forsvinder ikke", (k4["FeSCN2+"] || 0) >= 1 && (k4["FeSCN2+"] || 0) <= (k7["FeSCN2+"] || 0),
        (k7["FeSCN2+"] || 0) + " -> " + (k4["FeSCN2+"] || 0));
    paastand("tilskuerionerne er ikke i boblen for referencen", !k7["K+"] && !k7["NO3-"], JSON.stringify(k7));
    /* Loftet: hoejst 20 kugler i alt, ogsaa med tilskuerne vist */
    function ialt(k) { return Object.keys(k).reduce(function (a, n) { return a + k[n]; }, 0); }
    var alle1 = St.partikelTal(B.samlet(g(1)), bord.valg.partikler, [], bord.valg.partikelRef);
    paastand("boblen har hoejst 20 kugler i glas 1, ogsaa med tilskuerne", ialt(k1) <= 20 && ialt(alle1) <= 20 && ialt(alle1) >= ialt(k1),
        ialt(k1) + " / " + ialt(alle1) + " " + JSON.stringify(alle1));
    var kAg = kugler(bord.g.ag);
    paastand("men med kun to ioner vises de (AgNO3-flasken)", kAg["NO3-"] > 0 && kAg["Ag+"] > 0);
    bord.vaelg("glas7");
    side.opdaterPanel();
    function tabelNavne() { return [].map.call(d.querySelectorAll("#glas-indhold tr"), function (tr) { return tr.className === "kategori" ? "|" : tr.querySelector("th").textContent; }); }
    function tabelTal() { return [].map.call(d.querySelectorAll("#glas-indhold tr:not(.kategori):not(.fast) td:not(.enhed)"), function (td) { return parseFloat(td.textContent.replace(",", ".")); }); }
    var tn = tabelNavne(), tt = tabelTal();
    paastand("tabellen har ingen tilskuerioner, og fluebenet staar der", tn.join(" ").indexOf("K⁺") < 0 && tn.join(" ").indexOf("NO₃⁻") < 0 && !d.getElementById("tilskuere-linje").hidden, tn.join(" "));
    paastand("tabellen er sorteret med den stoerste koncentration foerst", tt.every(function (v, i) { return i === 0 || v <= tt[i - 1]; }), tt.join(" "));
    d.getElementById("tilskuere-vis").click();
    var tn2 = tabelNavne();
    paastand("med fluebenet staar tilskuerionerne for sig nederst", tn2.indexOf("|") > 0 && tn2.slice(tn2.indexOf("|") + 1).join(" ") === "NO₃⁻(aq) K⁺(aq)" && bord.visTilskuere, tn2.join(" "));
    paastand("og boblen viser dem", kugler(g(7))["NO3-"] > 0);
    d.getElementById("tilskuere-vis").click();
    paastand("fluebenet kan slaas fra igen", !bord.visTilskuere && tabelNavne().indexOf("|") < 0);
    bord.vaelg("ag");
    side.opdaterPanel();
    paastand("i AgNO3-flasken staar begge ioner i tabellen, og fluebenet er skjult", tabelNavne().slice().sort().join(" ") === "Ag⁺(aq) NO₃⁻(aq)" && d.getElementById("tilskuere-linje").hidden, tabelNavne().join(" "));
    bord.vaelg(null);

    overskrift("4. Badene");
    paastand("zoomboblen viser ingen H⁺ og OH⁻ i badenes rene vand",
        Object.keys(St.partikelTal(B.samlet(bord.g.vandbad), 6)).length === 0 &&
        Object.keys(St.partikelTal(B.samlet(bord.g.vand), 6)).length === 0,
        JSON.stringify(St.partikelTal(B.samlet(bord.g.vandbad), 6)));
    paastand("der er plads til flere glas i et bad", bord.badPladser(bord.g.isbad).length >= 2,
        bord.badPladser(bord.g.isbad).length + " pladser");
    paastand("glas 5 kan saettes i vandbadet", bord.moede(g(5), bord.g.vandbad, { x: bord.g.vandbad.p.x - 24 }));
    paastand("glas 6 kan saettes i isbadet", bord.moede(g(6), bord.g.isbad, { x: bord.g.isbad.p.x - 24 }));
    paastand("varmetrinnet er ikke gjort, foer pladen er taendt", !F.erGjort("varme"));
    paastand("isbadet holder sin temperatur uden varmeplade", B.samlet(bord.g.isbad).T < 5,
        tal(B.samlet(bord.g.isbad).T, 1) + " grader");
    bord.g.plade.taendt = true;
    adv(200);
    paastand("vandbadet gaar til sin termostat og koger ikke", B.samlet(bord.g.vandbad).T > 70 && B.samlet(bord.g.vandbad).T < 90,
        tal(B.samlet(bord.g.vandbad).T, 1) + " grader");
    paastand("glas 5 foelger vandbadet", B.samlet(g(5)).T > 55, tal(B.samlet(g(5)).T, 1) + " grader");
    paastand("glas 6 foelger isbadet", B.samlet(g(6)).T < 8, tal(B.samlet(g(6)).T, 1) + " grader");
    paastand("varme flytter den exoterme ligevaegt mod venstre", konc(g(5), "FeSCN2+") < fescn0 * 0.9,
        tal(fescn0) + " -> " + tal(konc(g(5), "FeSCN2+")) + " mM");
    paastand("kulde flytter den mod hoejre", konc(g(6), "FeSCN2+") > fescn0 * 1.1,
        tal(fescn0) + " -> " + tal(konc(g(6), "FeSCN2+")) + " mM");
    paastand("begge badtrin er gjort", F.erGjort("varme") && F.erGjort("kulde"));
    paastand("flaget blev sat, da indgrebene var gjort", F.flag("indgreb_gjort"));
    paastand("et glas kan tages op af badet igen", (bord.frigoer(g(6)), g(6).paa === null));

    overskrift("5. Billedet og journalen");
    var Jn = NK.Journal.find("billede");
    paastand("journalen er registreret", !!Jn && Jn.kraevede.length === 6);
    paastand("facit regnes af verden, ikke af en facitliste",
        NK.BILLEDE.facit("glas1", bord) === "moerkere" && NK.BILLEDE.facit("glas2", bord) === "lysere" &&
        NK.BILLEDE.facit("glas7", bord) === "ens",
        "glas 1 " + NK.BILLEDE.facit("glas1", bord) + ", glas 2 " + NK.BILLEDE.facit("glas2", bord));
    paastand("billedet kan tages", (NK.billede.aabn(bord), d.getElementById("billede").classList.contains("vis")));
    paastand("trinnet er ikke gjort, foer der er noteret", !F.erGjort("billede"));

    /* Fem rigtige og ét forkert */
    ["glas1", "glas2", "glas3", "glas4", "glas5"].forEach(function (n) {
        NK.billede.noter(n, NK.BILLEDE.facit(n, bord), bord);
    });
    NK.billede.noter("glas6", "lysere", bord);          /* glas 6 er i virkeligheden moerkere */
    adv(1);
    paastand("journalen er udfyldt", Jn.faerdig(), Jn.antal() + " af 6");
    paastand("fem er rigtige og ét forkert", Jn.antalRigtige() === 5 && Jn.antalForkerte() === 1,
        Jn.antalRigtige() + " rigtige, " + Jn.antalForkerte() + " forkerte");
    paastand("trinnet er gjort, naar alle seks er noteret", F.erGjort("billede"));
    paastand("det forkerte glas udloeser en bemaerkning", !!F.fyret.kig_igen);
    paastand("et svar kan rettes",
        (NK.billede.noter("glas6", "moerkere", bord), Jn.antalForkerte() === 0 && Jn.rigtig("glas6") === true));
    paastand("oejebliksbilledet blev gemt med svaret", !!Jn.billede("glas1") && !!Jn.billede("glas1").farve,
        JSON.stringify(Jn.billede("glas1").farve));
    NK.billede.luk();
    paastand("billedet kan lukkes", !d.getElementById("billede").classList.contains("vis"));

    overskrift("6. Referencen");
    paastand("glas 7 staar uroert", Math.abs(konc(ref, "FeSCN2+") - fescn0) < 0.05, tal(konc(ref, "FeSCN2+")) + " mM");
    paastand("udloeseren om referencen har ikke fyret", !F.fyret.roert_reference);

    overskrift("7. Oprydning");
    paastand("oprydningen er ikke gjort endnu", !F.erGjort("ryd"));
    /* Ét glas ad gangen: toemI er en koreografi, og der koerer kun én */
    for (var j = 1; j <= 7; j++) { bord.toemI(g(j), bord.g.dunk); adv(4); }
    adv(4);
    paastand("alle glas er tomme", [1,2,3,4,5,6,7].every(function (n) { return B.tom(g(n)); }));
    paastand("oprydningen taeller nu", F.erGjort("ryd"));
    paastand("del 1 er gjort, og del 2 staar tilbage", !F.faerdig &&
        d.getElementById("forloeb-taeller").textContent === "9/13",
        d.getElementById("forloeb-taeller").textContent);
    /* Naar der er ryddet op, skifter bordet IKKE af sig selv (F28): pilen
       til del 2 dukker op, og eleven skifter selv */
    adv(2);
    paastand("bordet bliver i del 1, naar der er ryddet op (F28)", NK.DELE.nu() === 1, NK.DELE.nu());
    var pl7 = bord.pil, pm7 = pl7 ? { x: pl7.x + pl7.b / 2, y: pl7.y + pl7.h / 2 } : null;
    paastand("og den store pil paa vaeggen dukker op og rammes af musen (F43)",
        !!pl7 && bord.pilAktiv && bord.hvad(pm7) === "naestepil", pm7 ? bord.hvad(pm7) : "ingen pil");
    bord.klik("naestepil");
    adv(0.5);
    paastand("pilen skifter til del 2 og forsvinder", NK.DELE.nu() === 2 && !bord.pilAktiv && bord.hvad(pm7) !== "naestepil", NK.DELE.nu());
    paastand("og saa er del 1's udstyr vaek fra bordet",
        bord.g.stativ.skjult && bord.g.isbad.skjult && !bord.g.baeger1.skjult && !bord.g.kolbe.skjult);

    overskrift("8. Gemning: historien, ikke bordene");
    var t = F.tilstand();
    paastand("tilstanden rummer trin, udloesere, flag og journal",
        Object.keys(t.gjort).length === 9 && !!t.flag.indgreb_gjort && !!t.journal.billede);
    F.nulstil();
    paastand("efter nulstil er intet gjort og journalen tom",
        !F.erGjort("fyld") && !F.flag("indgreb_gjort") && Jn.antal() === 0);
    paastand("tilstanden kan spilles tilbage, ogsaa journalen",
        (F.saetTilstand(t), F.erGjort("ryd") && F.erGjort("billede") && Jn.antal() === 6));

    overskrift("9. Udloesere");
    NK.startForfra();
    adv(2);
    paastand("start forfra nulstiller forloeb og journal", !F.erGjort("fyld") && F.nummer() === 0 && Jn.antal() === 0);
    var g7 = bord.g.glas7;
    B.haeldI(g7, B.udtag(bord.g.kolbe, 3), true);
    adv(10);
    paastand("udloeseren har stadig ikke fyret", !F.fyret.roert_reference);
    B.haeldI(g7, B.udtag(bord.g.ag, 0.3), true);
    adv(30);
    paastand("et indgreb i glas 7 udloeser bemaerkningen", !!F.fyret.roert_reference);
    var g1 = bord.g.glas1;
    B.haeldI(g1, B.udtag(bord.g.kolbe, 3), true);
    B.haeldI(g1, B.udtag(bord.g.ag, 0.3), true);
    B.tilsaetFast(g1, "Asc(s)", 20);
    adv(60);
    paastand("to slags indgreb i samme glas udloeser en bemaerkning", !!F.fyret.to_indgreb);

    overskrift("10. Vilkaarssproget");
    paastand("et tal betyder over", V.passer(5, 3) && !V.passer(2, 3));
    paastand("over og under kan staa sammen", V.passer(50, { over: 20, under: 80 }) && !V.passer(90, { over: 20, under: 80 }));
    paastand("ikke vender et vilkaar", V.opfyldt({ ikke: { beholder: "glas2", V: { over: 1 } } }, bord));
    paastand("nogen er sandt, naar ét er sandt",
        V.opfyldt({ nogen: [{ beholder: "glas1", V: { over: 1 } }, { beholder: "glas2", V: { over: 1 } }] }, bord));
    paastand("et ukendt glas giver falsk, ikke en undtagelse",
        V.opfyldt({ beholder: "findes_ikke", V: { over: 1 } }, bord) === false);

    overskrift("11. Opstillingen mod kataloget");
    var ukendte = [];
    NK.OPSTILLING.forEach(function (spec) {
        var kilder = [];
        if (spec.indhold && spec.indhold.mM) kilder = kilder.concat(Object.keys(spec.indhold.mM));
        if (spec.indhold && spec.indhold.umol) kilder = kilder.concat(Object.keys(spec.indhold.umol));
        kilder.forEach(function (n) { if (!St.STOFFER[n]) ukendte.push(spec.navn + ": " + n); });
    });
    paastand("alle stoffer paa bordet findes i stoftabellen", ukendte.length === 0, ukendte.join(", ") || "ingen ukendte");
    var udenType = NK.OPSTILLING.filter(function (s) { return !NK.Udstyr.TYPER[s.type]; });
    paastand("alt udstyr i opstillingen findes i kataloget", udenType.length === 0,
        udenType.map(function (s) { return s.type; }).join(", ") || "ingen ukendte");

    /* Oevelsestjekket i sin spaede form: peger et trin paa et glas eller et
       stof, der ikke findes, er forsoeget i stykker, og det skal opdages
       her - ikke af en elev. */
    var navne = {}, mangler = [], manglerStof = [];
    NK.OPSTILLING.forEach(function (s) { navne[s.navn] = true; });
    F.trin.concat(F.udloesere).forEach(function (x) {
        NK.Vilkaar.naevnte(x.naar).forEach(function (n) { if (!navne[n]) mangler.push(x.id + ": " + n); });
        NK.Vilkaar.naevnteStoffer(x.naar).forEach(function (n) { if (!St.STOFFER[n]) manglerStof.push(x.id + ": " + n); });
        /* peg maa vaere en genstand paa bordet eller et element i panelet */
        if (x.peg && !navne[x.peg] && !d.getElementById(x.peg)) mangler.push(x.id + " peger paa " + x.peg);
    });
    paastand("alle trin peger paa genstande, der findes", mangler.length === 0, mangler.join(", ") || "ingen mangler");
    paastand("alle trin naevner stoffer, der findes", manglerStof.length === 0, manglerStof.join(", ") || "ingen mangler");
    paastand("hvert trin har tekst og hint",
        F.trin.every(function (x) { return x.tekst && x.hint && x.kort; }));

    overskrift("12. Start forfra");
    NK.startForfra();
    var friske = [];
    for (var m = 1; m <= 7; m++) friske.push(bord.g["glas" + m]);
    paastand("glassene er tomme igen", friske.every(function (x) { return B.tom(x); }));
    paastand("kolben er fyldt op igen", B.volumen(bord.g.kolbe) > 140, tal(B.volumen(bord.g.kolbe), 0) + " mL");
    paastand("forloebet staar paa foerste trin", F.nuTrin() && F.nuTrin().id === "fyld");
    paastand("panelet kan opdateres", (NK.opdaterPanel(), true));

    overskrift("13. Replikker: forloebet taler gennem Kemichael");
    /* En konsekvens { sig } i forloebet gaar gennem side.sig til bordets
       laererReplik: han kommer ind, siger linjerne og gaar igen, uden at
       laase bordet. Uden laerer bliver det en besked. */
    var L = bord.laerer;
    paastand("bordet har en laerer med laererReplik", !!L && typeof bord.laererReplik === "function");
    bord.laererNyt();
    var tog = bord.laererReplik("Prøve.", {}, { id: "proeve" });
    paastand("laererReplik tager imod", tog === true);
    paastand("han fik en replik-scene med det samme", !!L.scene && L.scene.navn === "replik", L.scene && L.scene.navn);
    paastand("scenen laaser ikke bordet", !bord.laererOptaget());
    bord.laererReplik("Nummer to.", {}, { id: "to" });
    bord.laererReplik("Nummer tre.", {}, { id: "tre" });
    bord.laererReplik("Nummer to igen.", {}, { id: "to" });   /* samme kilde: kun én gang */
    paastand("replikker venter paa hinanden og kollapser ikke", bord.laererVent.length === 2, bord.laererVent.length + " i koe");
    adv(4);
    paastand("han siger replikken, naar han er kommet ind", L.tale === "Prøve.", JSON.stringify(L.tale));
    adv(40);
    paastand("koeen er afviklet", bord.laererVent.length === 0 && !L.scene, bord.laererVent.length + " i koe");

    /* Udloeseren om referencen: han stiller sig ved glas 7, markerer det,
       siger linjerne fra tekst.js og slutter med glimtet om afslaget.
       Glimtene huskes i browseren, saa hukommelsen tages ud imens og
       saettes tilbage bagefter. */
    var huskGlimt = null;
    try { huskGlimt = ramme.contentWindow.localStorage.getItem("nk-kemichael"); } catch (e) { /* ingen localStorage */ }
    NK.Kemichael.glimtNulstil();
    var g7b = bord.g.glas7;
    B.haeldI(g7b, B.udtag(bord.g.kolbe, 3), true);
    adv(5);
    B.haeldI(g7b, B.udtag(bord.g.ag, 0.3), true);
    var fyrede = false;
    for (var q = 0; q < 60 && !fyrede; q++) { adv(0.5); fyrede = !!F.fyret.roert_reference; }
    paastand("udloeseren fyrede", fyrede);
    /* Bag bordet gaar han ikke hen til glasset: han standser, hvor der er
       plads, og peger paa det (S8). Foelg ham, til glimtet er sagt. */
    var saaFoerste = false, saaAnden = false, saaAfslag = false, markeret = false;
    var stodVed = null, pegVink = null, pegFacit = null, planUnder = null;
    for (q = 0; q < 80 && !saaAfslag; q++) {
        adv(0.5);
        if (L.taleUr <= 0) continue;
        if (L.tale === NK.TEKST["sig-reference"][0]) {
            saaFoerste = true;
            stodVed = L.x;
            planUnder = L.plan;
            pegVink = L.arm;
            var rk7 = bord.rekt(g7b, 0);
            pegFacit = bord.pegVinkel(g7b.p.x, rk7.y + Math.min(24, rk7.h * 0.3));
            markeret = markeret || bord.markeret("glas7");
        }
        if (L.tale === NK.TEKST["sig-reference"][1]) saaAnden = true;
        if (L.tale.indexOf("afslag") >= 0) saaAfslag = true;
    }
    paastand("han kom ind og sagde foerste linje fra tekst.js", saaFoerste);
    paastand("han staar bag bordet, mens han taler", planUnder === 1, "plan " + planUnder);
    paastand("og han gaar ikke hen til glasset, men standser hvor der er plads",
        stodVed !== null && Math.abs(stodVed - g7b.p.x) > 100,
        stodVed === null ? "kom aldrig" : tal(stodVed, 0) + ", glasset staar i " + tal(g7b.p.x, 0));
    paastand("og peger paa glas 7 inden for 10 grader", pegVink !== null &&
        Math.abs(pegVink - pegFacit) < 10 * Math.PI / 180,
        pegVink === null ? "pegede ikke" : tal(pegVink * 180 / Math.PI, 1) + "° mod " + tal(pegFacit * 180 / Math.PI, 1) + "°");
    paastand("glas 7 er markeret, mens han taler", markeret);
    paastand("anden linje foelger", saaAnden);
    paastand("glimtet om afslaget kommer til sidst", saaAfslag);
    try {
        if (huskGlimt !== null) ramme.contentWindow.localStorage.setItem("nk-kemichael", huskGlimt);
        else ramme.contentWindow.localStorage.removeItem("nk-kemichael");
    } catch (e) { /* ingen localStorage */ }
    adv(30);

    /* Uden laerer: side.sig falder tilbage til beskeden paa scenen */
    var gemtL = bord.laerer;
    bord.laerer = null;
    side.sig(["Uden", "lærer."], { slags: "info" });
    bord.laerer = gemtL;
    paastand("uden laerer bliver replikken en besked",
        d.getElementById("scenebesked").textContent === "Uden lærer.", JSON.stringify(d.getElementById("scenebesked").textContent));

    /* Et trins eget sig: gaar samme vej */
    NK.startForfra();
    adv(1);
    var trinSig = F.trin.filter(function (x) { return x.sig; }).map(function (x) { return x.id; });
    paastand("tre trin har en replik, naar de er gjort", trinSig.length === 3, trinSig.join(", "));
    F.gjortNu("billede");
    adv(0.1);
    paastand("trinnets replik gaar til Kemichael", !!L.scene && L.scene.navn === "replik" &&
        L.scene.trin.some(function (x) { return x.sig === NK.TEKST.trin.billede.sig; }), L.scene && L.scene.navn);
    NK.startForfra();
    adv(1);
    paastand("start forfra toemmer koeen og scenen", !L.scene && bord.laererVent.length === 0);

    overskrift("14. Taleboblen: eget lag, der finder sin plads");
    /* laboratoriet/js/taleboble.js. Placeringen er ren geometri og proeves
       direkte; derefter at Kemichael tegner gennem laget. */
    var Tb = NK.Taleboble;
    paastand("taleboble.js er indlaest", !!Tb && typeof Tb.placer === "function" && typeof Tb.tegn === "function");
    var ctx2 = d.getElementById("scene-laerred").getContext("2d");
    var mKort = Tb.maal(ctx2, "Kort.", 1);
    paastand("en kort replik er én linje", mKort.linjer.length === 1 && mKort.b > 0 && mKort.h > 0, tal(mKort.b, 0) + " x " + tal(mKort.h, 0));
    var langTekst = "En replik, der er saa lang, at den maa brydes over flere linjer, for boblen maa ikke loebe ud over scenen, og saa lidt mere tekst for at naa fire.";
    var mLang = Tb.maal(ctx2, langTekst, 1);
    paastand("en lang replik brydes over flere linjer", mLang.linjer.length >= 3 && mLang.b <= Tb.STIL.maksBredde + 2 * Tb.STIL.polsterX + 1,
        mLang.linjer.length + " linjer, " + tal(mLang.b, 0) + " bred");
    var R = { x: 0, y: 0, b: NK.Scene.BREDDE, h: NK.Scene.HOEJDE };
    var hoved = { op: 97, side: 55, ned: 33 };
    function inden(p) { return p.x >= 0 && p.y >= 0 && p.x + p.b <= R.b && p.y + p.h <= R.h; }
    function rammer(a, b) { return a.x < b.x + b.b && a.x + a.b > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    var p1 = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved });
    paastand("med plads over hovedet staar boblen over", p1.side === "over" && p1.y + p1.h <= 380 - 97 && inden(p1), p1.side);
    paastand("halen staar lige over munden og ender ved issen", Math.abs(p1.hale.x - 600) < 1 && Math.abs(p1.hale.y - (p1.y + p1.h)) < 1 &&
        Math.abs(p1.spids.x - 600) < 1 && p1.spids.y > 380 - 97 - 1 && p1.spids.y < 380 - 97 + 4);
    var p2 = Tb.placer(mLang, { x: 600, y: 40 }, R, { hoved: hoved });
    paastand("uden plads over hovedet vendes den, og den daekker ikke hovedet", p2.side !== "over" && inden(p2) &&
        !rammer(p2, { x: 600 - 55, y: 40 - 97, b: 110, h: 130 }), p2.side);
    var p3 = Tb.placer(mLang, { x: R.b - 10, y: 380 }, R, { hoved: hoved });
    paastand("ved hoejre kant bliver den inden for scenen", inden(p3), p3.side + " x=" + tal(p3.x, 0) + " b=" + tal(p3.b, 0));
    var glas = { x: 560, y: 150, b: 80, h: 120 };
    var p4 = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved, undgaa: glas });
    paastand("boblen laegger sig ikke over det, replikken handler om", !rammer(p4, glas) && inden(p4), p4.side + " x=" + tal(p4.x, 0) + " y=" + tal(p4.y, 0));
    var p4b = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved, undgaa: glas, side: "under" });
    paastand("en foretrukken side foelges, naar den er fri", p4b.side === "under" && inden(p4b), p4b.side);

    /* Kemichael tegner gennem laget: mens han taler om glas 3, ligger
       boblen inden for scenen, holder mindste skrift og daekker ikke glasset */
    NK.startForfra();
    adv(1);
    bord.laererReplik("Prøve af boblen, mens han taler om glas 3.", { peg: "glas3" }, { id: "boble" });
    var tegnet = false, p5 = null;
    for (var q3 = 0; q3 < 40 && !tegnet; q3++) {
        adv(0.5);
        bord.tegn();
        if (L.taleUr > 0 && L.taleAlfa > 0.5 && Tb.sidst) { tegnet = true; p5 = Tb.sidst; }
    }
    paastand("figuren tegner sin boble gennem laget", tegnet && inden(p5), p5 && (p5.side + " f=" + tal(p5.f, 2)));
    paastand("skriften holder mindst " + Tb.STIL.minSkaerm + " px paa skaermen", tegnet && p5.f >= 1);
    paastand("han taler om glas 3, og boblen daekker det ikke", tegnet && L.undgaa === "glas3" && !rammer(p5, bord.rekt(bord.g.glas3, 8)));
    adv(30);
    paastand("efter replikken er der ikke laengere noget at undgaa", L.undgaa === null && !L.scene);
    paastand("og armen haenger ned igen", Math.abs(L.arm - NK.Kemichael.HAENGER) < 0.05, tal(L.arm, 2));
    paastand("og han er gaaet ud af scenen igen", L.x <= NK.Kemichael.UDE + 1, tal(L.x, 0));

    /* F5: taleboblen er oeverste lag. Zoomboblen staar i venstre hjoerne,
       saa proeven er ham ovre i venstre side med en lang replik. */
    NK.startForfra();
    adv(1);
    B.haeldI(bord.g.glas5, B.udtag(bord.g.kolbe, 3), true);
    bord.vaelg("glas5");
    adv(1);
    L.x = 200; L.maalX = 200;
    bord.laererSig("Sølvnitrat giver sorte pletter på huden. Det går af igen efter en uge.", 8);
    adv(0.6);
    var raekke = [];
    var gemtZoom = bord.tegnBobleIScenen, gemtTale = bord.tegnLaererBoble;
    bord.tegnBobleIScenen = function () { raekke.push("zoom"); return gemtZoom.apply(this, arguments); };
    bord.tegnLaererBoble = function () { raekke.push("tale"); return gemtTale.apply(this, arguments); };
    Tb.sidst = null;
    bord.tegn();
    delete bord.tegnBobleIScenen;
    delete bord.tegnLaererBoble;
    var bRekt = bord.bobleRekt();
    paastand("taleboblen tegnes efter zoomboblen",
        raekke.indexOf("zoom") >= 0 && raekke.indexOf("tale") > raekke.indexOf("zoom"), raekke.join(" > "));
    paastand("og den laegger sig ikke under zoomboblen, naar der er plads andetsteds",
        !!Tb.sidst && !rammer(Tb.sidst, bRekt) && inden(Tb.sidst),
        Tb.sidst ? Tb.sidst.side + " x=" + tal(Tb.sidst.x, 0) + " y=" + tal(Tb.sidst.y, 0) : "ingen boble");
    L.tale = ""; L.taleUr = 0;
    NK.startForfra();
    adv(1);

    overskrift("15. En replik, der afbrydes af et uheld, kommer igen");
    /* Uheldet tager over med det samme (hoejere prioritet), men de linjer,
       der ikke blev sagt, venter forrest i koeen og siges bagefter.
       Regnskabet over uheld huskes i browseren og saettes tilbage. */
    var huskUheld = null;
    try { huskUheld = ramme.contentWindow.localStorage.getItem("nk-kemichael"); } catch (e) { /* ingen localStorage */ }
    var altidFoer = bord.laererAltid;
    bord.laererAltid = true;
    NK.startForfra();
    adv(1);
    bord.laererReplik(["Første linje.", "Anden linje.", "Tredje linje."], {}, { id: "afbrudt" });
    var sagdeFoerste = false;
    for (var q4 = 0; q4 < 20 && !sagdeFoerste; q4++) { adv(0.25); sagdeFoerste = L.taleUr > 0 && L.tale === "Første linje."; }
    paastand("han er i gang med foerste linje", sagdeFoerste && L.scene && L.scene.navn === "replik");
    bord.laererUheld("spild", bord.g.glas1);
    paastand("uheldet tager over med det samme", L.scene && L.scene.navn === "spild", L.scene && L.scene.navn);
    paastand("de linjer, der ikke blev sagt, venter forrest i koeen",
        bord.laererVent.length === 1 && bord.laererVent[0].fn === "laererSigReplik" &&
        bord.laererVent[0].arg.linjer.join("|") === "Anden linje.|Tredje linje.",
        bord.laererVent.length ? bord.laererVent[0].arg.linjer.join(" / ") : "tom koe");
    var sagdeAnden = false, sagdeTredje = false;
    for (var q5 = 0; q5 < 120 && !sagdeTredje; q5++) {
        adv(0.5);
        if (L.taleUr > 0 && L.tale === "Anden linje.") sagdeAnden = true;
        if (L.taleUr > 0 && L.tale === "Tredje linje.") sagdeTredje = true;
    }
    paastand("og bliver sagt, naar han har toerret op", sagdeAnden && sagdeTredje);
    adv(20);
    bord.laererAltid = altidFoer;
    try {
        if (huskUheld !== null) ramme.contentWindow.localStorage.setItem("nk-kemichael", huskUheld);
        else ramme.contentWindow.localStorage.removeItem("nk-kemichael");
    } catch (e) { /* ingen localStorage */ }
    NK.startForfra();

    overskrift("16. Bordets dybde");
    /* Bordpladen er en flade: noget kan stilles foran stativet, og det
       forreste tegnes og rammes foerst */
    var bg = bord.g.baeger, stv = bord.g.stativ, sp = bord.g.spatel;
    function stilMedFod(gg, x, fodY, musY) {
        bord.frigoer(gg);
        var f0 = bord.fod(gg);
        gg.p.x += x - f0.x;
        gg.p.y += fodY - f0.y;
        return bord.saetNed(gg, { x: x, y: musY === undefined ? fodY : musY });
    }
    function bundAf(gg) { return gg.p.y - gg.anker.y + gg.type.h; }
    paastand("bordpladen har dybde, og tegnebordet staar forneden",
        Sc.DYBDE === 64 && Sc.FORKANT === 564 && Sc.LODRET === "bund");
    paastand("vaerktoejet ligger forrest fra start",
        ["spatel", "glasstav", "termometer"].every(function (n) {
            return bord.dybdeAf(bord.g[n]) > Sc.BORD && bord.liste.indexOf(bord.g[n]) > bord.liste.indexOf(stv);
        }));
    stilMedFod(bg, 500, 540);
    paastand("et baegerglas kan stilles foran stativet",
        Math.abs(bundAf(bg) - 540) < 0.5 && bord.staarPaaBord(bg), tal(bundAf(bg), 0));
    var iB = bord.liste.indexOf(bg);
    paastand("og tegnes foran stativet og glassene i det",
        iB > bord.liste.indexOf(stv) && [1, 2, 3, 4, 5, 6, 7].every(function (i) { return bord.liste.indexOf(g(i)) < iB; }));
    var rkB = bord.rekt(bg, 0);
    paastand("det forreste rammes foerst med musen", bord.hvad({ x: rkB.x + rkB.b / 2, y: rkB.y + 12 }) === "baeger");
    stilMedFod(bg, 500, 600, 560);
    paastand("slippes det laengere fremme, staar det paa forkanten", Math.abs(bundAf(bg) - Sc.FORKANT) < 0.5, tal(bundAf(bg), 0));
    stilMedFod(bg, 500, 470);
    paastand("slippes det i luften over bordet, staar det ved bagkanten", Math.abs(bundAf(bg) - Sc.BORD) < 0.5, tal(bundAf(bg), 0));
    stilMedFod(sp, 600, 560, Sc.FORKANT + 40);
    adv(1);
    paastand("slippes noget foran forkanten, falder det paa gulvet", sp.p.y > Sc.FORKANT + 40, tal(sp.p.y, 0));
    try { bord.tegn(); paastand("bordet tegnes med dybde og boble uden fejl", true); }
    catch (e) { paastand("bordet tegnes med dybde og boble uden fejl", false, e.message); }

    /* Kaffen staar paa den foerste hylde, og han gaar derhen, hvor hylden
       er (kaffeX i laerer.js). Hans hukommelse saettes tilbage bagefter. */
    var huskK = null;
    try { huskK = vin.localStorage.getItem("nk-kemichael"); } catch (e) { /* ingen localStorage */ }
    NK.startForfra();
    var Lk = bord.laerer, maalKaffe = null;
    bord.klikKop();
    for (var qk = 0; qk < 60 && maalKaffe === null; qk++) { adv(0.05); if (Lk.maalX > 0) maalKaffe = Lk.maalX; }
    /* F58: koppen staar ved plakaten, helt til hoejre, saa han stiller
       sig til venstre for den og raekker armen mod den */
    var kopR = bord.rekt(bord.g.kaffekop, 0), kopX = kopR.x + kopR.b / 2;
    paastand("han gaar hen til kaffen ved plakaten (til venstre for koppen)",
        maalKaffe !== null && Math.abs(maalKaffe - (kopX - 100 * bord.laererSkala())) < 1, maalKaffe === null ? "gik ikke" : tal(maalKaffe, 0) + " / kop " + tal(kopX, 0));
    adv(30);
    try {
        if (huskK !== null) vin.localStorage.setItem("nk-kemichael", huskK);
        else vin.localStorage.removeItem("nk-kemichael");
    } catch (e) { /* ingen localStorage */ }
    NK.startForfra();

    overskrift("17. Med musen: som en elev");
    /* Rigtige pointer-haendelser gennem laerredet (laboratoriet/js/proeve.js):
       tag fat, baer, hold stille, slip, klik. Proeven styrer tiden, saa
       bordet ser musens fart. Det, der svaever efter en haeldning, traekkes
       vaek med musen igen, ligesom eleven skal. */
    NK.startForfra();
    adv(0.5);
    var mus = NKProeve.mus(bord);
    var beskeder = [], vedB = bord.vedBesked;
    bord.vedBesked = function (t, s) { beskeder.push(t); if (vedB) vedB.call(bord, t, s); };
    var uheld0 = bord.antalUheld;
    var seet = mus.bordetSer({ x: 400, y: 300 });
    paastand("musen rammer det punkt paa scenen, der sigtes paa", Math.abs(seet.x - 400) < 0.01 && Math.abs(seet.y - 300) < 0.01, tal(seet.x) + ", " + tal(seet.y));
    function ankerMedFod(gg, x, y) { var t = gg.type; return { x: x - t.b / 2 + gg.anker.x, y: y - t.h + gg.anker.y }; }
    /* Traek genstanden hjem med musen; true, hvis den staar dér, hvor den
       stod foer (saetNed flytter hjem med, saa det sammenlignes med det
       gamle hjem) */
    function flytHjem(navn) {
        var gg = bord.g[navn], hjem0 = { x: gg.hjem.x, y: gg.hjem.y };
        if (!mus.tag(navn)) { mus.slip(); return false; }
        mus.baer(hjem0, 0.8);
        mus.hold(0.5);
        mus.slip();
        mus.hold(0.8);
        return !gg.svaev && Math.abs(gg.p.x - hjem0.x) < 2 && Math.abs(gg.p.y - hjem0.y) < 2;
    }

    /* Kolben: et hurtigt slip over glas 1 giver en portion */
    var kb = bord.g.kolbe, rk1 = bord.rekt(g(1), 0);
    paastand("kolben kan tages med musen", mus.tag("kolbe"));
    mus.til({ x: g(1).p.x, y: rk1.y + 30 }, 0.7);
    paastand("over glas 1 faar glasset den groenne ramme", bord.slipMaal === "glas1", bord.slipMaal);
    mus.slip();
    mus.hold(2);
    paastand("et hurtigt slip haelder én portion (4 mL) i glas 1", Math.abs(B.volumen(g(1)) - PORTION) < 0.05, tal(B.volumen(g(1)), 1) + " mL");
    paastand("og kolben bliver haengende over glasset", !!kb.svaev && kb.svaev.maal === g(1));
    paastand("kolben kan traekkes hjem igen", flytHjem("kolbe"));

    /* Glas 7 op af stativet, ned i vandbadet og tilbage */
    var stv8 = bord.g.stativ, vb8 = bord.g.vandbad, g8 = g(7), hul8 = g8.sted && g8.sted.hul;
    paastand("glas 7 kan tages op af stativet", mus.tag("glas7", 0.5, 0.3));
    mus.baer({ x: vb8.p.x, y: vb8.p.y - 60 }, 0.8);
    paastand("over vandbadet faar badet den groenne ramme", bord.slipMaal === "vandbad", bord.slipMaal);
    mus.slip();
    mus.hold(1);
    paastand("sluppet over vandbadet staar glas 7 i badet", g8.paa === vb8 && !g8.sted);
    mus.tag("glas7", 0.5, 0.3);
    mus.baer({ x: bord.hulX(stv8, hul8), y: stv8.p.y - 90 }, 0.8);
    paastand("over sit hul i stativet faar stativet den groenne ramme", bord.slipMaal === "stativ", bord.slipMaal);
    mus.slip();
    mus.hold(1);
    paastand("og sluppet der staar det i stativet igen", !!g8.sted && g8.sted.stativ === stv8 && g8.sted.hul === hul8, g8.sted ? "hul " + g8.sted.hul : "ikke i stativet");

    /* Draabeflasken holdt med bunden lige over glas 4: den drypper ikke,
       mens den holdes (F36), men et slip giver én draabe (F2) */
    var ag = bord.g.ag, g4 = g(4), rk4 = bord.rekt(g4, 0);
    var agV0 = B.volumen(ag), g4V0 = B.volumen(g4);
    paastand("draabeflasken kan tages med musen", mus.tag("ag"));
    mus.baer({ x: g4.p.x, y: rk4.y - 5 - ag.type.h + ag.anker.y }, 0.7);
    paastand("holdt med bunden lige over glas 4 faar glasset den groenne ramme", bord.slipMaal === "glas4", bord.slipMaal);
    mus.hold(1.8);
    paastand("holdt stille over glas 4 drypper den ikke (F36)", Math.abs(B.volumen(ag) - agV0) < 1e-9 && Math.cos(ag.p.v) > 0.98,
        tal(agV0 - B.volumen(ag)) + " mL ud, vinkel " + tal(ag.p.v));
    mus.slip();
    mus.hold(2);
    paastand("et slip giver én draabe i glas 4 og intet paa bordet", Math.abs(B.volumen(g4) - g4V0 - 0.05) < 0.001 && bord.pytter.length === 0 && bord.antalUheld === uheld0,
        tal(B.volumen(g4) - g4V0, 3) + " mL i glasset, " + bord.pytter.length + " pytter");
    var dV4 = B.volumen(g4);
    paastand("sluppet bliver den haengende over glasset", !!ag.svaev && ag.svaev.maal === g4);
    paastand("og beskeden siger, hvordan man faar flere",
        beskeder.length > 0 && beskeder[beskeder.length - 1].indexOf("dråbe mere") > 0, beskeder[beskeder.length - 1]);
    var nB0 = beskeder.length;
    mus.klik("ag");
    mus.hold(1);
    paastand("et klik paa selve flasken drypper ikke, men siger, hvad pilen goer",
        Math.abs(B.volumen(g4) - dV4) < 0.001 && beskeder.slice(nB0).some(function (t) { return t.indexOf("pilen") >= 0; }), beskeder[beskeder.length - 1]);
    var ringA = bord.svaevRing();
    mus.stil({ x: ringA.x, y: ringA.y });
    paastand("musen over pilen: pilen lyser op og siger, hvad den goer", bord.hover === "svaevring" && ringA.tekst === "En dråbe mere", ringA.tekst);
    mus.klik({ x: ringA.x, y: ringA.y });
    mus.hold(1);
    paastand("et klik paa pilen giver en draabe mere", Math.abs(B.volumen(g4) - dV4 - 0.05) < 0.001, tal(B.volumen(g4) - dV4, 3) + " mL");
    var r0 = bord.rekt(ag, 0);
    mus.tag("ag");
    mus.til({ x: mus.her().x + 10, y: mus.her().y - 10 }, 0.1);
    var r1 = bord.rekt(ag, 0);
    paastand("taget igen rettes den op under haanden uden at springe",
        Math.abs(r1.y - r0.y + 10) < 3 && Math.cos(ag.p.v) > 0.98, "fra y " + tal(r0.y, 0) + " til " + tal(r1.y, 0));
    mus.baer(ag.hjem, 0.8);
    mus.hold(0.1);
    mus.slip();
    mus.hold(0.8);
    paastand("og den kan stilles paa hylden igen", !ag.svaev && Math.abs(bundAf(ag) - 170) < 1, "bund " + tal(bundAf(ag), 0));

    /* Et hurtigt slip over glas 4 giver én draabe og beskeden */
    var g4V1 = B.volumen(g4), nB = beskeder.length;
    mus.tag("ag");
    mus.baer({ x: g4.p.x, y: rk4.y - 5 - ag.type.h + ag.anker.y }, 0.7);
    mus.slip();
    mus.hold(1.5);
    paastand("et hurtigt slip over glas 4 giver én draabe", Math.abs(B.volumen(g4) - g4V1 - 0.05) < 0.001, tal(B.volumen(g4) - g4V1, 3) + " mL");
    paastand("og samme besked", beskeder.slice(nB).some(function (t) { return t.indexOf("dråbe mere") > 0; }));
    paastand("draabeflasken kan traekkes hjem igen", flytHjem("ag"));
    paastand("intet uheld undervejs", bord.antalUheld === uheld0, bord.antalUheld - uheld0 + " uheld");

    /* Stillet paa bordet foran stativet: en flaske, der tages i toppen og
       saenkes, til bunden roerer bordpladen, skal stilles ned - ikke
       haelde eller dryppe i reagensglasset bag den, selv om musen er ud
       for glasset. Reagensglassets traefzone stopper over bunden. */
    function stilForan(navn, glas, bundY) {
        NK.startForfra();
        adv(0.2);
        var fl = bord.g[navn], gl = g(glas), V0 = B.volumen(gl), fV0 = B.volumen(fl), u0 = bord.antalUheld;
        mus.tag(navn, 0.5, 0.1);
        mus.baer({ x: gl.p.x, y: bundY - fl.type.h + fl.anker.y }, 0.8);
        var ud = { maal: bord.slipMaal };
        mus.hold(2);
        ud.ud = fV0 - B.volumen(fl);
        mus.slip();
        mus.hold(1.5);
        ud.ind = B.volumen(gl) - V0;
        ud.uheld = bord.antalUheld - u0;
        ud.bund = bundAf(fl);
        ud.svaev = !!fl.svaev;
        ud.tekst = "maal " + ud.maal + ", " + tal(ud.ud) + " mL ud, bund " + tal(ud.bund, 0) + (ud.uheld ? ", uheld" : "");
        return ud;
    }
    [540, 505].forEach(function (y) {
        var r = stilForan("ag", 4, y);
        paastand("draabeflasken taget i toppen og stillet med bunden i " + y + " foran glas 4 drypper ikke",
            r.maal !== "glas4" && r.ud < 0.001 && r.ind < 0.001, r.tekst);
        paastand("og den staar paa bordet bagefter", !r.svaev && Math.abs(r.bund - y) < 1.5, r.tekst);
    });
    /* F48: sb2.4 har ikke laengere en almindelig flaske i del 1 (KSCN-
       flasken gik ud med forundersoegelsen). Proeverne af en flaske foran
       stativet laaner derfor en midlertidig flaske som den gamle; den
       staar i opstillingen, til proeverne er faerdige. */
    var FL_TEST = { navn: "fl_kscn", type: "flaske", x: 400, y: 170, etiket: ["KSCN", "0,1 M"], del: 1,
                    titel: "flasken med KSCN", indhold: { V: 200, T: 20, mM: { "K+": 100, "SCN-": 100 } } };
    bord.specs.push(FL_TEST);
    [540, 505].forEach(function (y) {
        var r = stilForan("fl_kscn", 3, y);
        paastand("KSCN-flasken stillet med bunden i " + y + " foran glas 3 haelder ikke og spilder ikke",
            r.maal !== "glas3" && r.ud < 0.01 && r.uheld === 0, r.tekst);
        paastand("og den staar paa bordet bagefter", !r.svaev && Math.abs(r.bund - y) < 1.5, r.tekst);
    });
    NK.startForfra();
    adv(0.2);
    var rkT = bord.rekt(g(4), 0);
    paastand("reagensglassets traefzone stopper lidt over bunden",
        bord.hvad({ x: g(4).p.x, y: rkT.y + rkT.h - 12 }) !== "glas4" && bord.hvad({ x: g(4).p.x, y: rkT.y + rkT.h - 40 }) === "glas4",
        "12 over bunden: " + bord.hvad({ x: g(4).p.x, y: rkT.y + rkT.h - 12 }));
    paastand("og glasset kan stadig tages i den oeverste del", mus.tag("glas4", 0.5, 0.15) && (mus.slip(), true));

    /* Tuden holdes 18 enheder ved siden af glas 3's midte - i det groenne
       felt, men uden for aabningen. Holdt der haelder den ikke (F36); et
       slip haelder én portion, og det hele ryger i glasset (F8) */
    [-1, 1].forEach(function (side) {
        NK.startForfra();
        adv(0.2);
        var fk = bord.g.fl_kscn, g3 = g(3), rk3 = bord.rekt(g3, 0);
        var V0 = B.volumen(g3), u0 = bord.antalUheld;
        mus.tag("fl_kscn", 0.5, 0.2);
        var tt = fk.type.tud, aa = fk.anker;
        var tx = g3.p.x + side * 18, ty = rk3.y - 30;
        mus.baer({ x: tx - (tt.x - aa.x), y: ty - (tt.y - aa.y) }, 0.8);
        mus.hold(0.6);
        var maalK = bord.slipMaal;
        mus.hold(1.4);
        var holdt = B.volumen(g3) - V0;
        mus.slip();
        mus.hold(1);
        faerdig();
        var ind = B.volumen(g3) - V0, uh = bord.antalUheld - u0, py = bord.pytter.length;
        paastand("KSCN-flasken med tuden 18 til " + (side < 0 ? "venstre" : "hoejre") + " for glas 3 haelder ikke, mens den holdes, og et slip giver én portion i glasset",
            maalK === "glas3" && holdt < 1e-9 && Math.abs(ind - PORTION) < 0.05 && uh === 0 && py === 0,
            "maal " + maalK + ", " + tal(ind, 1) + " mL i glasset, " + uh + " uheld, " + py + " pytter");
        var hj = flytHjem("fl_kscn"), fk2 = bord.g.fl_kscn;
        paastand("og flasken kan traekkes hjem igen", hj, "p " + tal(fk2.p.x, 0) + "," + tal(fk2.p.y, 0) + " v " + tal(fk2.p.v) + " hjem " + tal(fk2.hjem.x, 0) + "," + tal(fk2.hjem.y, 0) + " svaev " + !!fk2.svaev + " maal " + bord.slipMaal);
    });
    bord.specs.splice(bord.specs.indexOf(FL_TEST), 1);

    /* Den store zoomboble: et klik paa boblen viser den stor, et klik hvor
       som helst lukker den uden at tage noget, og Esc lukker den ogsaa */
    NK.startForfra();
    adv(0.2);
    B.haeldI(g(4), B.udtag(bord.g.kolbe, PORTION), true);
    bord.vaelg("glas4");
    mus.hold(1);
    paastand("zoomboblen vises for glas 4, med en lup paa kanten", bord.bobleVises());
    mus.klik(bord.boble);
    mus.hold(0.6);
    paastand("et klik paa boblen viser den stor midt paa scenen", bord.storBoble && bord.storAlfa > 0.9, tal(bord.storAlfa));
    try { bord.tegn(); paastand("den store boble tegnes uden fejl", true); }
    catch (e) { paastand("den store boble tegnes uden fejl", false, e.message); }
    var tog = mus.tag("kolbe");
    mus.slip();
    paastand("et klik hvor som helst lukker den uden at tage noget", !tog && !bord.storBoble && !bord.baerer);
    mus.klik(bord.boble);
    mus.hold(0.3);
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "Escape" }));
    paastand("og Esc lukker den", !bord.storBoble);
    mus.hold(0.6);
    paastand("bagefter kan kolben tages igen", mus.tag("kolbe") && (mus.slip(), true));

    /* Spatlen med musen: en spatelspids Fe(NO3)3 fra pulverglasset paa
       hylden til glas 1. En fuld spatel kan ikke tage mere; pilen ved den
       tomme spatel henter selv en spatelspids mere og kommer tilbage. */
    NK.startForfra();
    adv(0.5);
    var sp = bord.g.spatel, feJar = bord.g.pulver_fe;
    function feI1() { var o = B.samlet(g(1)).n; return ["Fe(NO3)3(s)", "Fe3+", "FeSCN2+", "Fe(OH)3(s)"].reduce(function (a, k) { return a + (o[k] || 0); }, 0); }
    function sidsteBesked() { return beskeder[beskeder.length - 1] || ""; }
    var rkJar = bord.rekt(feJar, 0);
    paastand("spatlen kan tages med musen", mus.tag("spatel"));
    mus.til({ x: rkJar.x + rkJar.b / 2, y: rkJar.y + rkJar.h * 0.4 }, 0.8);
    paastand("over pulverglasset med Fe(NO3)3 faar det den groenne ramme", bord.slipMaal === "pulver_fe", bord.slipMaal);
    mus.slip();
    mus.hold(2);
    paastand("spatlen er fuld og haenger over pulverglasset uden pil", !!sp.last && !!sp.svaev && sp.svaev.maal === feJar && !bord.svaevRing());
    mus.klik("spatel");
    paastand("et klik paa den fulde spatel tager ikke mere, men siger, hvad man goer", sp.last.umol === 8 && sidsteBesked().indexOf("Spatlen er fuld") === 0, sidsteBesked());
    var rkG1 = bord.rekt(g(1), 0);
    mus.tag("spatel");
    mus.til({ x: g(1).p.x, y: rkG1.y + 10 }, 0.8);
    paastand("over glas 1 faar glasset den groenne ramme", bord.slipMaal === "glas1", bord.slipMaal);
    mus.slip();
    mus.hold(2);
    paastand("glas 1 fik spatelspidsen", Math.abs(feI1() - 8) < 0.01, tal(feI1()));
    var ringS = bord.svaevRing();
    paastand("pilen ved den tomme spatel siger »En spatelspids mere«", !!ringS && ringS.tekst === "En spatelspids mere", ringS && ringS.tekst);
    if (ringS) mus.klik({ x: ringS.x, y: ringS.y });
    mus.hold(3);
    paastand("et klik paa pilen: spatlen henter selv og giver glas 1 en spatelspids mere", Math.abs(feI1() - 16) < 0.01 && !sp.last && !!sp.svaev && sp.svaev.maal === g(1), tal(feI1()));
    paastand("spatlen kan traekkes hjem", flytHjem("spatel"));
    bord.vedBesked = vedB;
    NK.startForfra();

    overskrift("18. Kemichael bag bordet");
    /* S8: han bor ikke bag bordet - han er ude det meste af tiden og kommer
       kun ind, naar han har noget at sige. Saa staar han bag bordpladen, som
       daekker hans underkrop, og han standser dér, hvor der er plads i netop
       dette rum. Det, der kraever hans haender, foregaar foran bordet. */
    NK.startForfra();
    adv(1);
    var BB = NK.Scene.BAGBORD;
    paastand("opstillingen giver ham et plan bag bordet og ingen fast plads",
        !!BB && BB.x === undefined && BB.y === 358 && BB.skala < 1,
        BB ? "y=" + BB.y + " skala=" + tal(BB.skala, 2) + (BB.x === undefined ? ", intet x" : ", x=" + BB.x) : "intet plan");
    paastand("han er ude af scenen, naar han ikke har noget at sige",
        L.x <= NK.Kemichael.UDE + 1 && !L.scene, tal(L.x, 0));

    /* Pladsen regnes ud i oejeblikket: hvad han taler om, afgoer hvor han
       standser, og han staar aldrig bag noget, der skal kunne ses */
    function pegMaal(navn) {

    NK.startForfra();

    /* Par 1: en portion frugtfarve fra stamflasken og vand op til. En
       sjat paa bunden har for kort en lysvej til at kunne ses ned i, saa
       der skal mindst 30 mL i hvert glas. */
    function farveOgVand(gg, sjatter) {

        faerdig();

    }

    function lysSide(n) { return NK.Vilkaar.lyshed(baeg(n)) * 255; }
    var foerFarve = lysSide(2), foerLv = lysSide(4);
    for (var sp2 = 0; sp2 < 4; sp2++) { bord.sproejt(bord.g.vand, baeg(2)); faerdig(); }
    for (var sp4 = 0; sp4 < 4; sp4++) { bord.sproejt(bord.g.vand, baeg(4)); faerdig(); }

        [1,2,3,4].map(function (i) { return Math.round(B.volumen(baeg(i))); }).join(" / ") + " mL");
    paastand("motoren ved, hvilket glas i hvert par der er fortyndet",
        O.fortyndet(O.par(bord, 0)) === 1 && O.fortyndet(O.par(bord, 1)) === 1);
    paastand("de to glas i et par fik lige meget stof",
        Math.abs(O.maengde(baeg(1), "farve") - O.maengde(baeg(2), "farve")) < 0.01);

    paastand("lysvejen ovenfra fulgte med rumfanget",

        "lyshed " + tal(lysO(1)) + " mod " + tal(lysO(2)));
    paastand("LIGEVAEGTSBLANDINGEN er tydeligt lysere ovenfra",
        lysO(4) - lysO(3) > O.GRAENSE * 255,

        B.samlet(baeg(4)).n["FeSCN2+"] < B.samlet(baeg(3)).n["FeSCN2+"] * 0.85,
        Math.round(B.samlet(baeg(4)).n["FeSCN2+"] / B.samlet(baeg(3)).n["FeSCN2+"] * 100) + " % af stofmaengden tilbage");
    paastand("fra SIDEN ligner de to fortyndinger hinanden: begge blev tydeligt lysere",
        lysSide(2) - foerFarve > 20 && lysSide(4) - foerLv > 20,
        "frugtfarve +" + tal(lysSide(2) - foerFarve, 0) + ", ligevaegt +" + tal(lysSide(4) - foerLv, 0) +
        " i lyshed - derfor skal der ses ovenfra");

    /* Facit regnes af verden, og journalen bedoemmer svaret */
    /* Fortyndingen skal goere vaesken LYSERE, ikke MAT. Vaesken er et
       filter: det, man ser paa hvidt papir, er papiret ganget med det lys,
       der slipper igennem (Stof.gennem). Blev den blandet som et
       halvgennemsigtigt lag maling oven paa papiret, ville vandets egen
       blaa tone traekke kuloeren ud af enhver fortyndet oploesning. */
    function kulor(gg) {
        var f = NK.Stof.gennem(B.samlet(gg), B.lysvej(gg, "ovenfra"));
        var r = f.r / 255, gr = f.g / 255, b = f.b / 255;
        var mx = Math.max(r, gr, b), mn = Math.min(r, gr, b), d = mx - mn;
        var h = 0;
        if (d > 0) {
            if (mx === r) h = ((gr - b) / d + (gr < b ? 6 : 0));
            else if (mx === gr) h = (b - r) / d + 2;
            else h = (r - gr) / d + 4;
            h *= 60;
        }
        return { h: h, m: d / (mx || 1), l: (mx + mn) / 2, gr: f.g / Math.max(f.r, 1) };
    }

    paastand("ligevaegten er i spil begge veje, udledt af stoftabellen",
        spil.indexOf("fescn>") >= 0 && spil.indexOf("fescn<") >= 0, spil.slice(0, 6).join(" "));
    paastand("og en faeldning kun den ene vej", spil.indexOf("agscn>") >= 0 && spil.indexOf("agscn<") < 0);

    /* ----- Dynamisk ligevaegt: bind og split lige ofte ----------------- */
    nulTael(m7);
    var foer7 = JSON.stringify(m7.taeller);
    adv(60);
    var t7 = m7.taeller, ialt7 = t7.bind + t7.split;
    paastand("i referencen sker der stadig noget, naar tallene staar stille",
        ialt7 > 20, t7.bind + " bind og " + t7.split + " split paa et minut");
    paastand("og bind og split kommer lige ofte (dynamisk ligevaegt)",
        Math.abs(t7.bind - t7.split) <= 0.2 * Math.max(t7.bind, t7.split),
        "forskel " + Math.abs(t7.bind - t7.split) + " af " + Math.max(t7.bind, t7.split));
    /* Boblen aander hele tiden: lige efter et skub staar der ét kompleks
       for meget, til afstemningen retter det. Derfor ventes der hoejst tre
       sekunder paa, at tallene er tilbage - ellers afhang paastanden af,
       om minuttet sluttede midt i et aandedrag (det gjorde det omkring
       hver femte gang efter S31, fordi haeldningerne tog en anden tid) */
    var maal7 = St.partikelTal(B.samlet(g(7)), bord.valg.partikler, bord.skjulteI(B.samlet(g(7))), bord.valg.partikelRef);
    var c7 = {}, vent7 = 0;
    for (;;) {
        c7 = {};
        m7.partikler.forEach(function (p) { c7[p.navn] = (c7[p.navn] || 0) + 1; });
        if (Object.keys(maal7).every(function (n) { return c7[n] === maal7[n]; }) || vent7 >= 3) break;
        adv(0.1); vent7 += 0.1;
    }
    paastand("og tallene staar, hvor de skal, bagefter",
        Object.keys(maal7).every(function (n) { return c7[n] === maal7[n]; }),
        JSON.stringify(c7) + " mod " + JSON.stringify(maal7) + ", efter " + tal(vent7, 1) + " s");

    /* ----- Et indgreb: den ene retning overvejer ---------------------- */
    var m1 = boble("glas1");
    nulTael(m1);
    St.tilsaet(g(1).indhold, "Fe(NO3)3(s)", 60);
    adv(8);
    paastand("mere Fe³⁺ faar bind til at overveje, til tallene passer igen",
        m1.taeller.bind > m1.taeller.split, m1.taeller.bind + " bind mod " + m1.taeller.split + " split");
    paastand("og saltet bliver oploest i boblen, ikke bare talt op",
        m1.taeller.oploes > 0, m1.taeller.oploes + " oploesninger");

    /* ----- Faeldningen: bundfaldet dannes og synker ------------------- */
    var m4 = boble("glas4");
    nulTael(m4);
    bord.haeld(bord.g.ag, g(4), 0.3);
    faerdig();
    adv(8);
    paastand("soelv faelder AgSCN i boblen, det falder ikke ned oppefra",
        m4.taeller.faeld > 0, m4.taeller.faeld + " faeldninger");
    var fasteM = m4.partikler.filter(function (p) { return p.fast; });
    paastand("og bundfaldet ligger i bunden af boblen",
        fasteM.length > 0 && fasteM.every(function (p) { return p.y > 0; }),
        fasteM.length + " kugler, laveste y " + tal(Math.min.apply(null, fasteM.map(function (p) { return p.y; })), 0));

    /* ----- Redoxen: flere partikler fanget paa én gang ---------------- */
    var m2 = boble("glas2");
    nulTael(m2);
    St.tilsaet(g(2).indhold, "Asc(s)", 40);
    adv(12);
    paastand("ascorbinsyren omdanner jern i boblen (to Fe³⁺ paa én gang)",
        m2.taeller.omdan > 0, JSON.stringify(m2.taeller));
    paastand("og den faste ascorbinsyre gaar i oploesning undervejs",
        m2.taeller.oploes > 0, m2.taeller.oploes + " oploesninger");
    slipTilfaeldigheden();

    NK.startForfra();
    adv(1);

    overskrift("24. Reagensglassene rummer en tredjedel mindre (S31, F33)");
    /* Glassene rummer 20 mL i stedet for 30. Rumfanget foelger tegningen,
       saa de er (2/3)^(1/3) = 87 % saa store, og et tryk - en femtedel af
       glasset - giver 4 mL af sig selv. De staar i stativets huller, som
       de stod. */
    NK.startForfra();
    adv(0.5);
    var st24 = bord.g.stativ, fuld = NK.Udstyr.type("reagensglas"), G24 = [1, 2, 3, 4, 5, 6, 7].map(g);
    var top24 = st24.p.y - st24.anker.y;
    var k24 = Math.cbrt(2 / 3);
    paastand("de syv glas rummer 20 mL, en tredjedel mindre end 30",
        G24.every(function (x) { return Math.abs(x.type.maks - 20) < 1e-9; }), tal(g(1).type.maks, 2) + " mL");
    paastand("og er tegnet 87 % saa store, saa rumfanget foelger tegningen",
        G24.every(function (x) { return Math.abs(x.skala - k24) < 1e-9 && Math.abs(x.type.h - fuld.h * k24) < 1e-6; }),
        tal(g(1).type.h, 1) + " mod " + fuld.h);
    paastand("en portion er en femtedel af glasset, uden modtager", Math.abs(bord.portion(bord.g.kolbe, g(1)) - 4) < 1e-9 && !g(1).spec.modtager);
    var vmaal = NK.Udstyr.maal(fuld);
    paastand("tegningens rumfang passer: 30 mL gange k³ er 20 mL", Math.abs(vmaal.V_mL * k24 * k24 * k24 - g(1).type.maks) < 0.02 * 20,
        tal(vmaal.V_mL * k24 * k24 * k24, 1) + " mL");
    paastand("stativet er uaendret, og glassene staar i de samme huller med samme afstand",
        (st24.skala || 1) === 1 && G24.every(function (x, i) {
            return x.sted && x.sted.stativ === st24 && x.sted.hul === i && Math.abs(x.p.x - bord.hulX(st24, i)) < 0.01;
        }) && Math.abs(g(2).p.x - g(1).p.x - 42) < 0.01, "afstand " + tal(g(2).p.x - g(1).p.x, 1));
    function indreBund(x) {
        var ib = -Infinity; x.type.indre.forEach(function (q) { ib = Math.max(ib, q.y); });
        return x.p.y + ib - x.anker.y;
    }
    paastand("et kortere glas staar paa stativets bund og haenger ikke i luften",
        G24.every(function (x) { return Math.abs(indreBund(x) - (top24 + st24.type.bundY)) < 0.01; }),
        "indersidens bund " + tal(indreBund(g(1)), 1) + ", stativets bund " + tal(top24 + st24.type.bundY, 1));
    B.haeldI(g(1), B.udtag(bord.g.kolbe, PORTION), true);
    var niv = NK.vaeskeNiveau(g(1).type.indre, B.volumen(g(1)) * g(1).type.mlPrAreal) + g(1).p.y - g(1).anker.y;
    /* stativ8.svg: topbraettet gaar fra 20 til 34, bunden fra 88 */
    paastand("4 mL staar frit mellem stativets to braedder, saa farven kan ses",
        Math.abs(B.volumen(g(1)) - 4) < 0.01 && niv > top24 + 34 && indreBund(g(1)) <= top24 + 88 + 0.01,
        tal(B.volumen(g(1)), 1) + " mL, overfladen i " + tal(niv, 1) + ", topbraettet slutter i " + tal(top24 + 34, 0));
    /* I badet synker et kortere glas ogsaa ned (badets bundY), ellers
       kom indholdet ikke ned i vandet */
    var vb24 = bord.g.vandbad;
    B.haeldI(g(5), B.udtag(bord.g.kolbe, PORTION), true);
    bord.iBad(g(5), vb24, undefined, true);
    function flade(x) { return NK.vaeskeNiveau(x.type.indre, B.volumen(x) * x.type.mlPrAreal) + x.p.y - x.anker.y; }
    var yb5 = indreBund(g(5)), ys5 = flade(g(5)), yv5 = flade(vb24);
    var nede5 = (yb5 - Math.max(ys5, yv5)) / (yb5 - ys5);
    paastand("i vandbadet staar mindst halvdelen af glassets indhold under vandet",
        g(5).paa === vb24 && nede5 >= 0.5,
        tal(nede5 * 100, 0) + " % nede, glassets overflade " + tal(ys5, 1) + ", vandets " + tal(yv5, 1));
    paastand("og aabningen er oppe ved badets kant, saa glasset kan tages med musen",
        B.aabning(g(5)).y < vb24.p.y - vb24.anker.y + 20 && mus.tag("glas5") && (mus.slip(), mus.hold(0.8), g(5).paa === vb24),
        "aabningen " + tal(B.aabning(g(5)).y, 1) + ", badets kant " + tal(vb24.p.y - vb24.anker.y + 6, 1));
    NK.startForfra();
    adv(0.5);
    /* Et glas i fuld stoerrelse staar, som det altid har: det naar bunden fra hullet */
    paastand("et glas i fuld stoerrelse haenger i hullet som foer",
        top24 + st24.type.hulY - fuld.anker.y + 152 >= top24 + st24.type.bundY, "hulY " + st24.type.hulY);

    /* Klikfelterne: to naboglas deler ikke et eneste punkt, og musen
       vaelger det glas, den klikker paa */
    var fael = 0, proever = 0;
    for (var n24 = 1; n24 < 7; n24++) {
        var a24 = g(n24), b24 = g(n24 + 1), ra = bord.rekt(a24, 0);
        for (var x24 = a24.p.x; x24 <= b24.p.x; x24 += 0.5) {
            for (var y24 = ra.y - 6; y24 <= ra.y + ra.h + 6; y24 += 2) {
                proever++;
                if (bord.inden(a24, { x: x24, y: y24 }, 5) && bord.inden(b24, { x: x24, y: y24 }, 5)) fael++;
            }
        }
    }
    paastand("ingen to klikfelter overlapper", fael === 0, fael + " faelles punkter af " + proever);
    var klikket = [];
    G24.forEach(function (x) { mus.klik(x.navn); mus.hold(0.2); klikket.push(bord.valgt); });
    paastand("musen vaelger det glas, der klikkes paa, for alle syv",
        klikket.every(function (v, i) { return v === "glas" + (i + 1); }), klikket.join(" "));
    var mellem = { x: (g(4).p.x + g(5).p.x) / 2, y: B.aabning(g(4)).y + 20 };
    paastand("og midt imellem to glas rammer den ingen af dem",
        ["glas4", "glas5"].indexOf(bord.hvad(mus.bordetSer(mellem))) < 0, bord.hvad(mus.bordetSer(mellem)));

    /* Kolben hurtigt sluppet over glas 7 giver 4 mL, og pilen 4 mL mere */
    NK.startForfra();
    adv(0.5);
    var u24 = bord.antalUheld, rk8 = bord.rekt(g(7), 0);
    mus.tag("kolbe");
    mus.til({ x: g(7).p.x, y: rk8.y + 20 }, 0.7);
    mus.slip();
    mus.hold(2);
    var v8 = B.volumen(g(7));
    paastand("kolben sluppet over glas 7 giver 4 mL", Math.abs(v8 - 4) < 0.05, tal(v8, 2) + " mL");
    paastand("uden uheld", bord.antalUheld === u24, bord.antalUheld - u24 + " uheld");
    /* Kolben traekkes vaek fra glas 8 og stilles paa bordet. (flytHjem
       rammer ikke hjemmet paa 2 enheder her: en kolbe, der tages skraat
       over glas 8, lander 3,7 enheder fra hjemmet - ogsaa med de gamle
       glas, saa det er proeve.js' udligning af opretningen og ikke S31) */
    var kb24 = bord.g.kolbe;
    mus.tag("kolbe");
    mus.baer({ x: kb24.hjem.x, y: kb24.hjem.y }, 0.8);
    mus.hold(0.5);
    mus.slip();
    mus.hold(0.8);
    paastand("kolben kan traekkes vaek og staar paa bordet igen, uden uheld",
        !kb24.svaev && !bord.holdt && Math.abs(kb24.p.x - kb24.hjem.x) < 6 && bord.antalUheld === u24,
        "x " + tal(kb24.p.x, 1) + " mod hjem " + tal(kb24.hjem.x, 1));

    overskrift("25. Intet bliver haengende i luften (F28, F35)");
    /* Kolben hurtigt sluppet over et glas bliver haengende over det. Det
       maa aldrig spaerre for det naeste: tager man fat i noget andet, eller
       skifter man del, stilles den ned paa et ledigt sted paa bordet. */
    function kolbeOver(n) {
        var rk = bord.rekt(g(n), 0);
        mus.tag("kolbe");
        mus.til({ x: g(n).p.x, y: rk.y + 20 }, 0.7);
        mus.slip();
        mus.hold(2);
        return bord.g.kolbe;
    }
    function ovenI(gg) {
        var r = bord.rekt(gg, 0);
        return bord.liste.filter(function (o) {
            if (o === gg || !bord.synlig(o) || o === bord.holdt) return false;
            if (bord.holdt && o === bord.g[bord.holdt.navn]) return false;
            var q = bord.rekt(o, 0);
            return !(r.x + r.b <= q.x || q.x + q.b <= r.x || r.y + r.h <= q.y || q.y + q.h <= r.y);
        }).map(function (o) { return o.navn; });
    }
    function paaBordet(gg) { var f = bord.fod(gg).y; return f >= NK.Scene.BORD - 0.5 && f <= NK.Scene.FORKANT + 0.5; }
    NK.startForfra();
    adv(0.5);
    var kb25 = kolbeOver(1);
    paastand("kolben haenger over glas 1 efter et slip", !!kb25.svaev, kb25.svaev && kb25.svaev.maal.navn);
    var tog25 = mus.tag("spatel");
    mus.til({ x: bord.g.spatel.p.x + 40, y: bord.g.spatel.p.y - 80 }, 0.4);
    mus.hold(0.8);
    paastand("at tage fat i spatlen virker og stiller kolben ned (F35)",
        tog25 && !kb25.svaev && !!bord.holdt && bord.holdt.navn === "spatel");
    paastand("kolben staar paa bordet og ikke oven i andet udstyr",
        paaBordet(kb25) && ovenI(kb25).length === 0, "fod " + tal(bord.fod(kb25).y, 0) + (ovenI(kb25).length ? ", oven i " + ovenI(kb25).join(", ") : ""));
    mus.slip();
    mus.hold(1);

    NK.startForfra();
    adv(0.5);
    kb25 = kolbeOver(2);
    paastand("kolben haenger over glas 2", !!kb25.svaev);
    d.getElementById("del2knap").click();
    adv(0.5);
    paastand("der kan skiftes til del 2, mens den haenger (F28)", NK.DELE.nu() === 2, NK.DELE.nu());
    paastand("og saa staar kolben paa bordet i del 2 og ikke i luften",
        !kb25.svaev && paaBordet(kb25) && ovenI(kb25).length === 0, "fod " + tal(bord.fod(kb25).y, 0));
    paastand("og den kan tages igen", mus.tag("kolbe") && (mus.slip(), mus.hold(1), true));

    /* F36: en fuld kolbe baaret langsomt hen over alle syv glas haelder
       ikke - der haeldes kun, naar eleven slipper */
    NK.startForfra();
    adv(0.5);
    var rkF = bord.rekt(g(1), 0), kbF = bord.g.kolbe, VkF = B.volumen(kbF);
    mus.tag("kolbe");
    mus.til({ x: g(1).p.x, y: rkF.y + 15 }, 0.8);
    mus.til({ x: g(7).p.x, y: rkF.y + 15 }, 6);
    mus.hold(1.5);
    var fyldt = [1, 2, 3, 4, 5, 6, 7].filter(function (n) { return B.volumen(g(n)) > 0; });
    paastand("kolben baaret langsomt hen over de syv glas haelder ikke (F36)",
        fyldt.length === 0 && Math.abs(B.volumen(kbF) - VkF) < 1e-9, fyldt.length ? "haeldt i " + fyldt.join(", ") : "intet haeldt");
    mus.baer(kbF.hjem, 0.8);
    mus.slip();
    mus.hold(1);

    /* F32: i del 2 staar hvert par paa et hvidt underlag med sin maerkat */
    NK.startForfra();
    adv(0.5);
    var ul = bord.underlag || [];
    paastand("del 2 har et hvidt underlag med maerkat for hvert par (F32)",
        ul.length === 2 && /frugtfarve/.test(ul[0].tekst) && /stamopløsning/.test(ul[1].tekst), ul.map(function (u) { return u.tekst; }).join(" / "));
    paastand("underlagene ses ikke i del 1", NK.DELE.nu() === 1 && !ul[0].vis() && !ul[1].vis());
    side.skiftDel(2);
    adv(0.5);
    var paaPapir = [1, 2, 3, 4].every(function (n) {
        var bb = bord.g["baeger" + n], u = ul[n <= 2 ? 0 : 1], f = bord.fod(bb);
        return f.x > u.x0 && f.x < u.x1 && f.y > u.y0 && f.y < u.y1;
    });
    paastand("i del 2 ses de, og hvert baegerglas staar paa sit pars underlag", ul[0].vis() && ul[1].vis() && paaPapir);

    /* F29: sproejteflasken er stoerre, og over et glas kan man skrive,
       hvor meget der skal fyldes op til */
    paastand("sproejteflasken er tegnet 25 % stoerre", Math.abs(bord.g.vand.type.h - 150) < 1e-9 && bord.g.vand.type.maks === 500,
        bord.g.vand.type.h + " hoej");
    var fo = d.getElementById("fyldop"), rbF = bord.rekt(bord.g.baeger2, 0);
    paastand("feltet »fyld op til« findes og er skjult, naar intet svaever", !!fo && fo.hidden);
    mus.tag("vand");
    mus.til({ x: bord.g.baeger2.p.x, y: rbF.y - 6 }, 0.7);
    mus.slip();
    mus.hold(1.5);
    faerdig();
    var vF = B.volumen(bord.g.baeger2);
    side.ramme(performance.now());
    paastand("en sjat giver 10 mL, og saa staar feltet ved pilen", Math.abs(vF - 10) < 0.05 && !fo.hidden, tal(vF, 1) + " mL");
    d.getElementById("fyldop-ml").value = "44";
    fo.requestSubmit();
    faerdig();
    paastand("skrives 44, fyldes glasset op til 44 mL i én sproejtning", Math.abs(B.volumen(bord.g.baeger2) - 44) < 0.05,
        tal(B.volumen(bord.g.baeger2), 1) + " mL");
    d.getElementById("fyldop-ml").value = "900";
    fo.requestSubmit();
    faerdig();
    paastand("og aldrig over glassets rumfang", Math.abs(B.volumen(bord.g.baeger2) - bord.g.baeger2.type.maks) < 0.2 && bord.pytter.length === 0 && bord.antalUheld === 0,
        tal(B.volumen(bord.g.baeger2), 1) + " mL af " + bord.g.baeger2.type.maks);

    /* F31 og F48: glas 7 hedder R, glas 4 hedder 4 igen, og der er ingen
       forundersoegelse og ingen KSCN-flaske */
    NK.startForfra();
    adv(0.5);
    paastand("glas 7 hedder R, og glas 4 hedder 4 (F48)",
        g(7).nr === "R" && g(4).nr === "4" && g(4).titel === "glas 4", [g(4).nr, g(7).nr].join(" "));
    var afst = [1, 2, 3, 4, 5, 6].map(function (n) { return g(n + 1).p.x - g(n).p.x; });
    paastand("de syv glas staar med samme afstand", afst.every(function (a) { return Math.abs(a - 42) < 0.01; }),
        afst.map(function (a) { return tal(a, 0); }).join(" "));
    paastand("der er ingen KSCN-flaske og ingen udloeser om 4a", !bord.g.fl_kscn && NK.FORLOEB.udloesere.every(function (u) { return u.id !== "stam_i_4a"; }));
    var alleTekster = JSON.stringify(NK.TEKST);
    paastand("ingen tekst naevner 4a, 4b eller forundersoegelsen",
        !/\b4a\b|\b4b\b|forundersøgelse/i.test(alleTekster), (alleTekster.match(/.{30}(\b4a\b|\b4b\b|forundersøgelse).{30}/i) || [""])[0]);
    NK.startForfra();
    adv(1);
    NK.startForfra();
    adv(0.5);

    NK.startForfra();
    adv(1);

    overskrift("26. Spatelspidserne og tilskuerionerne (S12, F25, F27)");
    /* S12: hvert pulverglas har sin egen spatelspids. Spatlen bruges, som
       eleven bruger den: fyldt i pulverglasset og toemt i glasset. */
    [1, 2, 3, 7].forEach(function (n) { B.haeldI(g(n), B.udtag(bord.g.kolbe, PORTION), true); });
    adv(25);
    var spids = {};
    [["pulver_fe", 1], ["pulver_asc", 2], ["pulver_kscn", 3]].forEach(function (par) {
        var sp = bord.g.spatel;
        bord.fyldSpatel(sp, bord.g[par[0]]);
        faerdig();
        spids[par[0]] = sp.last ? sp.last.umol : 0;
        bord.toemSpatel(sp, g(par[1]));
        faerdig();
    });
    paastand("en spatelspids er 8 µmol Fe(NO3)3, 3 µmol ascorbinsyre og 30 µmol KSCN",
        spids.pulver_fe === 8 && spids.pulver_asc === 3 && spids.pulver_kscn === 30, JSON.stringify(spids));
    adv(40);
    var l7 = lys(g(7)), l1 = lys(g(1)), l2 = lys(g(2)), l3 = lys(g(3));
    paastand("glas 1 er tydeligt moerkere end R, men ikke sort", l1 < l7 - 0.05 && l1 > 0.12, tal(l7) + " -> " + tal(l1));
    paastand("glas 2 er lysere end R, men ikke farveloest", l2 > l7 + 0.05 && konc(g(2), "FeSCN2+") > 0.2,
        tal(l7) + " -> " + tal(l2) + ", " + tal(konc(g(2), "FeSCN2+")) + " mM FeSCN2+");
    paastand("glas 3 har mere end dobbelt saa meget kompleks som R", konc(g(3), "FeSCN2+") > 2 * konc(g(7), "FeSCN2+") && l3 < l7 - 0.02,
        tal(konc(g(7), "FeSCN2+")) + " -> " + tal(konc(g(3), "FeSCN2+")) + " mM");
    var ph2 = St.pH(B.samlet(g(2)));
    paastand("pH i glas 2 er omkring 2,8: redoxen afgiver to H+ pr. ascorbinsyre (F25)", ph2 > 2.5 && ph2 < 3.2, tal(ph2, 2));
    paastand("trinene for glas 1, 2 og 3 er gjort", F.erGjort("glas1") && F.erGjort("glas2") && F.erGjort("glas3"));

    /* F27: en tilskuerion kan loeftes op i tabellen og boblen */
