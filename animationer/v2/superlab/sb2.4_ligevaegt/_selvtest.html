        uh34.children.length === 1 && uh34.children[0].textContent.indexOf("Uheld 1: Glas 2") === 0 && d.getElementById("noter-uheld").textContent === "Uheld: 1",
        uh34.children.length ? uh34.children[0].textContent : "ingen");
    for (var r34 = 0; r34 < 80 && bord.laerer.scene; r34++) adv(0.25);
    bord.laererAltid = false;

    /* F54: et pulverglas hen til et glas - en ren spatel fra boetten */
    NK.startForfra();
    adv(0.5);
    function fe34(n) { var o = B.samlet(g(n)); return (o.n["Fe(NO3)3(s)"] || 0) + (o.n["Fe3+"] || 0) + (o.n["FeSCN2+"] || 0) + (o.n["Fe2+"] || 0); }
    B.haeldI(g(1), B.udtag(bord.g.kolbe, PORTION), true);
    var fe0 = fe34(1), n34 = bord.liste.length, jar34 = bord.g.pulver_fe, hjem34 = { x: jar34.hjem.x, y: jar34.hjem.y };
    klikKlik("pulver_fe", "glas1");
    var sp34 = jar34.svaev && jar34.svaev.spatel;
    paastand("pulverglasset og så glas 1: en spatelspids (8 µmol) i glasset (F54)", Math.abs(fe34(1) - fe0 - 8) < 0.01, tal(fe34(1) - fe0, 2) + " µmol");
    paastand("spatlen kom fra bøtten og var ren", !!sp34 && sp34.spec && sp34.spec.ekstra && bord.liste.length === n34 + 1 &&
        sp34.snavs.length === 1 && sp34.snavs[0].stof === "Fe(NO3)3(s)" && !(jar34.forurenet && jar34.forurenet.length));
    paastand("pulverglasset svæver ved glasset med »En spatelspids mere«", jar34.svaev.maal === g(1) && !!bord.svaevRing() && bord.svaevRing().tekst === "En spatelspids mere");
    paastand("og den grønne tekst siger »1 spatelspids tilsat« (F64)", bord.tilsat.some(function (t) { return t.c === g(1) && t.tekst === "1 spatelspids tilsat"; }));
    bord.klik("svaevring");
    faerdig();
    paastand("pilen: en spatelspids mere med den samme spatel", Math.abs(fe34(1) - fe0 - 16) < 0.01 && jar34.svaev && jar34.svaev.spatel === sp34 && bord.liste.length === n34 + 1,
        tal(fe34(1) - fe0, 2) + " µmol");
    bord.stilSvaevendeNed();
    faerdig();
    paastand("tages der fat i noget andet: pulverglasset hjem, spatlen i kurven", !jar34.svaev && Math.abs(jar34.p.x - hjem34.x) < 1 && Math.abs(jar34.p.y - hjem34.y) < 1 &&
        bord.liste.indexOf(sp34) < 0 && bord.liste.length === n34);
    /* Med musen */
    B.haeldI(g(2), B.udtag(bord.g.kolbe, PORTION), true);
    var o34 = B.aabning(g(2));
    mus.tag("pulver_asc");
    mus.til({ x: o34.x, y: o34.y - 8 }, 0.8);
    var m34 = bord.slipMaal;
    mus.slip();
    faerdig();
    paastand("pulverglasset trukket hen over glas 2: målet er glasset, og C-vitaminen kommer i", m34 === "glas2" &&
        (B.samlet(g(2)).n["Asc(s)"] || 0) + (B.samlet(g(2)).n.Asc || 0) + (B.samlet(g(2)).n["Fe2+"] || 0) > 0.5, m34);
    bord.stilSvaevendeNed(true);

    /* F55: en brugt spatel i et andet stof */
    var sp55 = bord.g.spatel, sagt34 = [], lsig34 = bord.laererSig;
    bord.laererSig = function (tekst) { sagt34.push(tekst); return lsig34.apply(this, arguments); };
    bord.fyldSpatel(sp55, bord.g.pulver_fe);
    faerdig();
    bord.toemSpatel(sp55, g(3));
    faerdig();
    bord.stilSvaevendeNed(true);
    paastand("samme stof igen er ikke en forurening", !bord.g.pulver_fe.forurenet || !bord.g.pulver_fe.forurenet.length);
    bord.fyldSpatel(sp55, bord.g.pulver_kscn);
    faerdig();
    var kscn34 = bord.g.pulver_kscn;
    paastand("den brugte spatel i KSCN: bøtten er forurenet med Fe(NO₃)₃ (F55)", kscn34.forurenet && kscn34.forurenet.length === 1 && kscn34.forurenet[0].stof === "Fe(NO3)3(s)");
    bord.stilSvaevendeNed(true);
    bord.vaelg("pulver_kscn");
    side.opdaterPanel();
    var fu34 = d.getElementById("glas-forurenet");
    paastand("klikker man på bøtten, står det i beskrivelsen", !fu34.hidden && fu34.textContent.indexOf("Forurenet med jern(III)nitrat") === 0, fu34.textContent);
    for (r34 = 0; r34 < 60 && !sagt34.some(function (t) { return t.indexOf("Stop!") === 0; }); r34++) adv(0.5);
    paastand("og Kemichael skælder ud", sagt34.some(function (t) { return t.indexOf("Stop! Den spatel har været i jern(III)nitrat") === 0; }), sagt34.join(" | "));
    bord.laererSig = lsig34;
    for (r34 = 0; r34 < 80 && bord.laerer.scene; r34++) adv(0.25);
    NK.startForfra();
    adv(0.5);
    paastand("Start forfra: bøtterne er rene igen", !bord.g.pulver_kscn.forurenet);

    /* F60-F64 i del 2: frugtfarven, pilen, feltet og den groenne tekst */
    NK.DELE.saet(bord, 2, true);
    adv(0.5);
    bord.moede(bord.g.fl_farve, baeg(1));
    faerdig();
    paastand("frugtfarven giver 5 mL (F60), og det står over glasset (F64)", Math.abs(B.volumen(baeg(1)) - 5) < 0.05 &&
        bord.tilsat.some(function (t) { return t.c === baeg(1) && t.tekst === "5 mL tilsat"; }), tal(B.volumen(baeg(1)), 1) + " mL");
    paastand("pilen siger »5 mL mere« (F62)", !!bord.svaevRing() && bord.svaevRing().tekst === "5 mL mere", bord.svaevRing() && bord.svaevRing().tekst);
    side.opdaterFyldOp();
    paastand("»Fyld op til« foreslår 10 mL, når der er 5 (F61)", d.getElementById("fyldop-ml").value === "10", d.getElementById("fyldop-ml").value);
    bord.stilSvaevendeNed(true);
    bord.sproejt(bord.g.vand, baeg(1), 20);
    faerdig();
    paastand("sprøjteflasken: »20 mL tilsat«", bord.tilsat.some(function (t) { return t.c === baeg(1) && t.tekst === "20 mL tilsat"; }),
        bord.tilsat.map(function (t) { return t.tekst; }).join(" | "));
    NK.DELE.saet(bord, 1, true);

    NK.startForfra();
    adv(1);
}

function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
