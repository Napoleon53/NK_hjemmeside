<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - Indgreb i en kemisk ligevægt</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script src="../../laboratoriet/js/proeve.js"></script>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem: kemien i de
   fire indgreb, badene, forloebets trin (ogsaa i forkert raekkefoelge),
   flagene, udloeserne, gemningen, opstillingen mod stoftabellen,
   Kemichaels replikker fra forloebet og taleboblen som eget lag. Til
   sidst goeres det samme med musen, som en elev (proeve.js).

   Skal aabnes gennem en lokal server (eller Chrome med
   --allow-file-access-from-files), ellers kan iframen ikke laeses.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function tal(x, d) { return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ","); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var bord = NK.bord, B = NK.Beholder, St = NK.Stof, V = NK.Vilkaar;
    var side = NK.Side.nu, F = NK.Forloeb.nu;
    paastand("bordet er bygget", !!bord);
    paastand("skallen er den faelles side.js", !!side);
    paastand("forloebet er bygget", !!F && F.trin.length === 13, F && F.trin.length + " trin");
    paastand("de otte glas staar i stativet", [1,2,3,4,5,6,7,8].every(function (i) { return !!bord.g["glas" + i]; }));
    paastand("badene staar paa bordet", !!bord.g.vandbad && !!bord.g.isbad &&
        bord.g.vandbad.kan.bad && bord.g.isbad.kan.bad);
    paastand("vandbadet staar paa varmepladen", bord.g.vandbad.paa === bord.g.plade);
    paastand("teksterne er skrevet ind fra tekst.js",
        d.getElementById("teori-indhold").textContent.indexOf("exoterm") > 0);
    paastand("panelet viser foerste trin",
        d.getElementById("forloeb-tekst").textContent.indexOf("stamopløsning") > 0);
    paastand("introen aabner og lukker", !!NK.intro &&
        (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) &&
        (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    var alle = Object.keys(NK.Sprites.FILER);
    var klar = alle.filter(function (n) { return NK.Sprites.klar(n); });
    paastand("sprites er indlaest", klar.length === alle.length, klar.length + " af " + alle.length);

    /* Zoomboblen staar i laboratoriets oeverste venstre hjoerne og skalerer
       med det. Opstillingen holder hjoernet frit: intet udstyr, ingen hylde
       og ikke plakaten maa ligge inden for boblen og dens navn. */
    var valgtFoer = bord.valgt;
    var vin = ramme.contentWindow;
    var Sc = NK.Scene;
    paastand("zoomboblen staar paa scenen og ikke i panelet",
        !d.getElementById("boble-laerred") && !!bord.boble && bord.bobleR === 135);
    paastand("og indholdet i den er en tiendedel mindre", bord.bobleIndhold === 0.9 && bord.mikro.k === 0.9);
    var br = bord.bobleRekt(), daekker = [];
    function overlap(a, b) { return a.x < b.x + b.b && a.x + a.b > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    bord.liste.forEach(function (gg) {
        if (bord.synlig(gg) && overlap(bord.rekt(gg, 0), br)) daekker.push(gg.navn);
    });
    (Sc.HYLDER || []).forEach(function (H, i) {
        if (overlap({ x: H.x0, y: H.y, b: H.x1 - H.x0, h: 21 }, br)) daekker.push("hylde " + i);
    });
    if (bord.plakat && overlap({ x: bord.plakat.x, y: bord.plakat.y, b: 132, h: 128 }, br)) daekker.push("plakaten");
    paastand("zoomboblens hjoerne er frit", daekker.length === 0, daekker.join(", ") || "frit");
    paastand("laboratoriet er smallere, saa alt er stoerre", Sc.BREDDE === 1040);
    paastand("aflaesningen har sin stil",
        vin.getComputedStyle(d.getElementById("glas-indhold")).borderCollapse === "collapse");

    /* Indholdet i tal er foldet sammen som udgangspunkt, og folden er
       skjult, naar der ikke er noget at vise */
    var fold = d.getElementById("glas-indhold-fold");
    bord.vaelg("kolbe");
    side.opdaterPanel();
    paastand("indholdet er foldet sammen som udgangspunkt",
        !!fold && !fold.hidden && !fold.open && d.getElementById("glas-indhold").rows.length > 0);
    bord.vaelg("glas1");
    side.opdaterPanel();
    paastand("folden er skjult for et tomt glas", !!fold && fold.hidden);
    bord.vaelg(valgtFoer);
    side.opdaterPanel();

    /* Ligevaegten staar i toplinjen, teorien bag knappen Teori og T, og
       uheldskortet har kun sin taeller */
    var teori = d.getElementById("teori"), topL = d.getElementById("top-ligning");
    paastand("ligningen staar i toplinjen", !!topL && topL.textContent.indexOf("⇌") > 0 &&
        topL.parentNode.classList.contains("top") && topL.getBoundingClientRect().width > 100, topL && topL.textContent);
    paastand("panelet har ikke laengere et ligevaegtskort", !d.getElementById("teori-kort-ramme") && !d.getElementById("teori-aabn"));
    paastand("uheldskortet har kun taelleren", !d.getElementById("uheld-tekst") && !!d.getElementById("uheld-taeller") &&
        d.getElementById("uheld-kort").textContent.replace(/\s+/g, " ").trim() === "Uheld " + bord.antalUheld);
    d.getElementById("teoriknap").click();
    paastand("knappen Teori aabner teoriboksen", teori.classList.contains("vis"));
    paastand("teorien er bygget af blokke",
        teori.querySelectorAll("#teori-indhold p").length >= 5 &&
        teori.querySelectorAll("#teori-indhold h3").length >= 4 &&
        teori.querySelectorAll("#teori-indhold .ligning").length >= 4);
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "t" }));
    paastand("T lukker den igen", !teori.classList.contains("vis"));
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "T" }));
    paastand("og T aabner den", teori.classList.contains("vis"));
    NK.teori.luk();

    /* Noterne foldes ud fra toplinjen ved siden af Teori */
    var noter = d.getElementById("noter"), noterknap = d.getElementById("noterknap"), felt = d.getElementById("logbog-tekst");
    var noterFoer = felt.value;
    paastand("knappen Noter staar lige efter Teori", !!noterknap && d.getElementById("teoriknap").nextElementSibling === noterknap);
    paastand("noterne er foldet ind som udgangspunkt", noter.hidden && noterknap.getAttribute("aria-expanded") === "false");
    noterknap.click();
    paastand("knappen folder dem ud, og markoeren staar i feltet", !noter.hidden && d.activeElement === felt &&
        noterknap.getAttribute("aria-expanded") === "true" && noterknap.classList.contains("aktiv"));
    var rN = noter.getBoundingClientRect(), rS = d.getElementById("scene").getBoundingClientRect();
    paastand("de ligger i scenens oeverste hoejre hjoerne, ikke over panelet", rN.right <= rS.right + 0.5 && rN.top >= rS.top && rN.top - rS.top < 20,
        Math.round(rN.left) + "-" + Math.round(rN.right) + " / scene " + Math.round(rS.right));
    felt.value = "";
    bord.vaelg("kolbe");
    d.getElementById("logbog-noter").click();
    var noteret = felt.value;
    paastand("»Notér det valgte glas« skriver kolbens aflaesning som tabellen: uden tilskuere og spor",
        noteret.indexOf("Kolben") >= 0 && noteret.indexOf("Fe³⁺") >= 0 && noteret.indexOf("K⁺") < 0 && noteret.indexOf("0,00") < 0, noteret);
    paastand("og markoeren staar efter den, saa man kan skrive videre", d.activeElement === felt && felt.selectionStart === felt.value.length);
    felt.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "t", bubbles: true }));
    paastand("et t i feltet aabner ikke teorien", !teori.classList.contains("vis"));
    felt.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
    paastand("Esc i feltet folder noterne ind", noter.hidden && !noterknap.classList.contains("aktiv"));
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "n" }));
    paastand("tasten N folder dem ud igen", !noter.hidden);
    d.dispatchEvent(new vin.KeyboardEvent("keydown", { key: "N" }));
    paastand("og ind", noter.hidden);
    felt.value = noterFoer;
    side.logbogGem();
    bord.vaelg(valgtFoer);

    function adv(sek) { for (var k = 0; k < Math.round(sek * 20); k++) bord.opdater(0.05); F.opdater(); }
    function lys(gg) { return V.lysstyrke(gg); }
    function konc(gg, navn) { return St.konc(B.samlet(gg), navn); }
    function g(n) { return bord.g["glas" + n]; }

    overskrift("2. Stamoploesningen");
    var kolbe = bord.g.kolbe;
    for (var i = 1; i <= 8; i++) B.haeldI(g(i), B.udtag(kolbe, 6), true);
    adv(25);
    var ref = g(7), lys0 = lys(ref), fescn0 = konc(ref, "FeSCN2+");
    paastand("komplekset danner sig af sig selv", fescn0 > 0.8 && fescn0 < 2.5, tal(fescn0) + " mM FeSCN2+");
    paastand("farven er tydelig, men ikke sort", lys0 < 0.75 && lys0 > 0.12, "lys " + tal(lys0));
    paastand("trin 1 er gjort, naar alle otte glas er fyldt", F.erGjort("fyld"));
    paastand("naeste trin er glas 1", F.nuTrin() && F.nuTrin().id === "glas1", F.nuTrin() && F.nuTrin().id);

    overskrift("3. De fire indgreb");
    /* Med vilje i en anden raekkefoelge end listen: et trin afgoeres af
       bordets tilstand, ikke af den vej eleven kom */
    B.tilsaetFast(g(3), "KSCN(s)", 20);
    adv(40);
    paastand("et trin laengere fremme taeller ogsaa", F.erGjort("glas3"));
    paastand("men glas 1 er stadig ikke gjort", !F.erGjort("glas1"));
    paastand("glas 3 blev moerkere", lys(g(3)) < lys0 - 0.02, tal(lys0) + " -> " + tal(lys(g(3))));

    B.tilsaetFast(g(1), "Fe(NO3)3(s)", 20);
    B.tilsaetFast(g(2), "Asc(s)", 12);
    B.haeldI(g(4), B.udtag(bord.g.ag, 0.12), true);
    adv(50);
    paastand("glas 1: mere Fe3+ giver moerkere", F.erGjort("glas1") && konc(g(1), "FeSCN2+") > fescn0,
        tal(fescn0) + " -> " + tal(konc(g(1), "FeSCN2+")) + " mM");
    paastand("glas 2: ascorbinsyre reducerer til Fe2+ og giver lysere",
        F.erGjort("glas2") && konc(g(2), "Fe2+") > 0.5, tal(konc(g(2), "Fe2+")) + " mM Fe2+");
    paastand("glas 4: AgNO3 faelder AgSCN og giver lysere",
        F.erGjort("glas4") && B.samlet(g(4)).n["AgSCN(s)"] > 1,
        tal((B.samlet(g(4)).n["AgSCN(s)"] || 0) / 1000, 3) + " mmol AgSCN");

    overskrift("3b. Boblen og tabellen: fast skala og tilskuerioner");
    /* Boblens skala er fast (partikelRef), saa FeSCN2+ faar flere kugler i
       glas 1 end i referencen, selv om Fe3+ er i stort overskud. K+ og NO3-
       er tilskuere: de skjules, naar der er mere end tre slags ioner, og
       staar for sig nederst i tabellen, naar fluebenet er sat. */
    function kugler(gl) { var o = B.samlet(gl); return St.partikelTal(o, 6, bord.skjulteI(o), bord.valg.partikelRef); }
    var k7 = kugler(g(7)), k1 = kugler(g(1)), k4 = kugler(g(4));
    paastand("forsoeget finder selv tilskuerionerne K+ og NO3-", bord.tilskuere.join(",") === "K+,NO3-", bord.tilskuere.join(", "));
    paastand("FeSCN2+ faar flere kugler i glas 1 (mere Fe3+) end i referencen", (k1["FeSCN2+"] || 0) > (k7["FeSCN2+"] || 0),
        (k7["FeSCN2+"] || 0) + " -> " + (k1["FeSCN2+"] || 0) + " " + JSON.stringify(k1));
    paastand("og faerre i glas 4 (AgNO3), men forsvinder ikke", (k4["FeSCN2+"] || 0) >= 1 && (k4["FeSCN2+"] || 0) <= (k7["FeSCN2+"] || 0),
        (k7["FeSCN2+"] || 0) + " -> " + (k4["FeSCN2+"] || 0));
    paastand("tilskuerionerne er ikke i boblen for referencen", !k7["K+"] && !k7["NO3-"], JSON.stringify(k7));
    /* Loftet: hoejst 20 kugler i alt, ogsaa med tilskuerne vist */
    function ialt(k) { return Object.keys(k).reduce(function (a, n) { return a + k[n]; }, 0); }
    var alle1 = St.partikelTal(B.samlet(g(1)), 6, [], bord.valg.partikelRef);
    paastand("boblen har hoejst 20 kugler i glas 1, ogsaa med tilskuerne", ialt(k1) <= 20 && ialt(alle1) <= 20 && ialt(alle1) >= ialt(k1),
        ialt(k1) + " / " + ialt(alle1) + " " + JSON.stringify(alle1));
    var kAg = kugler(bord.g.ag), kSCN = kugler(bord.g.fl_kscn);
    paastand("men med kun to ioner vises de (AgNO3- og KSCN-flasken)", kAg["NO3-"] > 0 && kAg["Ag+"] > 0 && kSCN["K+"] > 0 && kSCN["SCN-"] > 0);
    bord.vaelg("glas7");
    side.opdaterPanel();
    function tabelNavne() { return [].map.call(d.querySelectorAll("#glas-indhold tr"), function (tr) { return tr.className === "kategori" ? "|" : tr.querySelector("th").textContent; }); }
    function tabelTal() { return [].map.call(d.querySelectorAll("#glas-indhold tr:not(.kategori):not(.fast) td:not(.enhed)"), function (td) { return parseFloat(td.textContent.replace(",", ".")); }); }
    var tn = tabelNavne(), tt = tabelTal();
    paastand("tabellen har ingen tilskuerioner, og fluebenet staar der", tn.join(" ").indexOf("K⁺") < 0 && tn.join(" ").indexOf("NO₃⁻") < 0 && !d.getElementById("tilskuere-linje").hidden, tn.join(" "));
    paastand("tabellen er sorteret med den stoerste koncentration foerst", tt.every(function (v, i) { return i === 0 || v <= tt[i - 1]; }), tt.join(" "));
    d.getElementById("tilskuere-vis").click();
    var tn2 = tabelNavne();
    paastand("med fluebenet staar tilskuerionerne for sig nederst", tn2.indexOf("|") > 0 && tn2.slice(tn2.indexOf("|") + 1).join(" ") === "NO₃⁻(aq) K⁺(aq)" && bord.visTilskuere, tn2.join(" "));
    paastand("og boblen viser dem", kugler(g(7))["NO3-"] > 0);
    d.getElementById("tilskuere-vis").click();
    paastand("fluebenet kan slaas fra igen", !bord.visTilskuere && tabelNavne().indexOf("|") < 0);
    bord.vaelg("ag");
    side.opdaterPanel();
    paastand("i AgNO3-flasken staar begge ioner i tabellen, og fluebenet er skjult", tabelNavne().slice().sort().join(" ") === "Ag⁺(aq) NO₃⁻(aq)" && d.getElementById("tilskuere-linje").hidden, tabelNavne().join(" "));
    bord.vaelg(null);

    overskrift("4. Badene");
    paastand("zoomboblen viser ingen H⁺ og OH⁻ i badenes rene vand",
        Object.keys(St.partikelTal(B.samlet(bord.g.vandbad), 6)).length === 0 &&
        Object.keys(St.partikelTal(B.samlet(bord.g.vand), 6)).length === 0,
        JSON.stringify(St.partikelTal(B.samlet(bord.g.vandbad), 6)));
    paastand("der er plads til flere glas i et bad", bord.badPladser(bord.g.isbad).length >= 2,
        bord.badPladser(bord.g.isbad).length + " pladser");
    paastand("glas 5 kan saettes i vandbadet", bord.moede(g(5), bord.g.vandbad, { x: bord.g.vandbad.p.x - 24 }));
    paastand("glas 6 kan saettes i isbadet", bord.moede(g(6), bord.g.isbad, { x: bord.g.isbad.p.x - 24 }));
    paastand("varmetrinnet er ikke gjort, foer pladen er taendt", !F.erGjort("varme"));
    paastand("isbadet holder sin temperatur uden varmeplade", B.samlet(bord.g.isbad).T < 5,
        tal(B.samlet(bord.g.isbad).T, 1) + " grader");
    bord.g.plade.taendt = true;
    adv(200);
    paastand("vandbadet gaar til sin termostat og koger ikke", B.samlet(bord.g.vandbad).T > 70 && B.samlet(bord.g.vandbad).T < 90,
        tal(B.samlet(bord.g.vandbad).T, 1) + " grader");
    paastand("glas 5 foelger vandbadet", B.samlet(g(5)).T > 55, tal(B.samlet(g(5)).T, 1) + " grader");
    paastand("glas 6 foelger isbadet", B.samlet(g(6)).T < 8, tal(B.samlet(g(6)).T, 1) + " grader");
    paastand("varme flytter den exoterme ligevaegt mod venstre", konc(g(5), "FeSCN2+") < fescn0 * 0.9,
        tal(fescn0) + " -> " + tal(konc(g(5), "FeSCN2+")) + " mM");
    paastand("kulde flytter den mod hoejre", konc(g(6), "FeSCN2+") > fescn0 * 1.1,
        tal(fescn0) + " -> " + tal(konc(g(6), "FeSCN2+")) + " mM");
    paastand("begge badtrin er gjort", F.erGjort("varme") && F.erGjort("kulde"));
    paastand("flaget blev sat, da indgrebene var gjort", F.flag("indgreb_gjort"));
    paastand("et glas kan tages op af badet igen", (bord.frigoer(g(6)), g(6).paa === null));

    overskrift("5. Billedet og journalen");
    var Jn = NK.Journal.find("billede");
    paastand("journalen er registreret", !!Jn && Jn.kraevede.length === 6);
    paastand("facit regnes af verden, ikke af en facitliste",
        NK.BILLEDE.facit("glas1", bord) === "moerkere" && NK.BILLEDE.facit("glas2", bord) === "lysere" &&
        NK.BILLEDE.facit("glas7", bord) === "ens",
        "glas 1 " + NK.BILLEDE.facit("glas1", bord) + ", glas 2 " + NK.BILLEDE.facit("glas2", bord));
    paastand("billedet kan tages", (NK.billede.aabn(bord), d.getElementById("billede").classList.contains("vis")));
    paastand("trinnet er ikke gjort, foer der er noteret", !F.erGjort("billede"));

    /* Fem rigtige og ét forkert */
    ["glas1", "glas2", "glas3", "glas4", "glas5"].forEach(function (n) {
        NK.billede.noter(n, NK.BILLEDE.facit(n, bord), bord);
    });
    NK.billede.noter("glas6", "lysere", bord);          /* glas 6 er i virkeligheden moerkere */
    adv(1);
    paastand("journalen er udfyldt", Jn.faerdig(), Jn.antal() + " af 6");
    paastand("fem er rigtige og ét forkert", Jn.antalRigtige() === 5 && Jn.antalForkerte() === 1,
        Jn.antalRigtige() + " rigtige, " + Jn.antalForkerte() + " forkerte");
    paastand("trinnet er gjort, naar alle seks er noteret", F.erGjort("billede"));
    paastand("det forkerte glas udloeser en bemaerkning", !!F.fyret.kig_igen);
    paastand("et svar kan rettes",
        (NK.billede.noter("glas6", "moerkere", bord), Jn.antalForkerte() === 0 && Jn.rigtig("glas6") === true));
    paastand("oejebliksbilledet blev gemt med svaret", !!Jn.billede("glas1") && !!Jn.billede("glas1").farve,
        JSON.stringify(Jn.billede("glas1").farve));
    NK.billede.luk();
    paastand("billedet kan lukkes", !d.getElementById("billede").classList.contains("vis"));

    overskrift("6. Referencen");
    paastand("glas 7 staar uroert", Math.abs(konc(ref, "FeSCN2+") - fescn0) < 0.05, tal(konc(ref, "FeSCN2+")) + " mM");
    paastand("udloeseren om referencen har ikke fyret", !F.fyret.roert_reference);

    overskrift("7. Oprydning");
    paastand("oprydningen er ikke gjort endnu", !F.erGjort("ryd"));
    /* Ét glas ad gangen: toemI er en koreografi, og der koerer kun én */
    for (var j = 1; j <= 8; j++) { bord.toemI(g(j), bord.g.dunk); adv(4); }
    adv(4);
    paastand("alle glas er tomme", [1,2,3,4,5,6,7,8].every(function (n) { return B.tom(g(n)); }));
    paastand("oprydningen taeller nu", F.erGjort("ryd"));
    paastand("del 1 er gjort, og del 2 staar tilbage", !F.faerdig &&
        d.getElementById("forloeb-taeller").textContent === "9/13",
        d.getElementById("forloeb-taeller").textContent);
    /* Naar der er ryddet op, kommer de fire baegerglas frem af sig selv */
    adv(2);
    paastand("bordet skifter selv til del 2, naar der er ryddet op", NK.DELE.nu() === 2, NK.DELE.nu());
    paastand("og saa er del 1's udstyr vaek fra bordet",
        bord.g.stativ.skjult && bord.g.isbad.skjult && !bord.g.baeger1.skjult && !bord.g.kolbe.skjult);

    overskrift("8. Gemning: historien, ikke bordene");
    var t = F.tilstand();
    paastand("tilstanden rummer trin, udloesere, flag og journal",
        Object.keys(t.gjort).length === 9 && !!t.flag.indgreb_gjort && !!t.journal.billede);
    F.nulstil();
    paastand("efter nulstil er intet gjort og journalen tom",
        !F.erGjort("fyld") && !F.flag("indgreb_gjort") && Jn.antal() === 0);
    paastand("tilstanden kan spilles tilbage, ogsaa journalen",
        (F.saetTilstand(t), F.erGjort("ryd") && F.erGjort("billede") && Jn.antal() === 6));

    overskrift("9. Udloesere");
    NK.startForfra();
    adv(2);
    paastand("start forfra nulstiller forloeb og journal", !F.erGjort("fyld") && F.nummer() === 0 && Jn.antal() === 0);
    var g7 = bord.g.glas7;
    B.haeldI(g7, B.udtag(bord.g.kolbe, 3), true);
    adv(10);
    paastand("udloeseren har stadig ikke fyret", !F.fyret.roert_reference);
    B.haeldI(g7, B.udtag(bord.g.ag, 0.3), true);
    adv(30);
    paastand("et indgreb i glas 7 udloeser bemaerkningen", !!F.fyret.roert_reference);
    var g1 = bord.g.glas1;
    B.haeldI(g1, B.udtag(bord.g.kolbe, 3), true);
    B.haeldI(g1, B.udtag(bord.g.ag, 0.3), true);
    B.tilsaetFast(g1, "Asc(s)", 20);
    adv(60);
    paastand("to slags indgreb i samme glas udloeser en bemaerkning", !!F.fyret.to_indgreb);

    overskrift("10. Vilkaarssproget");
    paastand("et tal betyder over", V.passer(5, 3) && !V.passer(2, 3));
    paastand("over og under kan staa sammen", V.passer(50, { over: 20, under: 80 }) && !V.passer(90, { over: 20, under: 80 }));
    paastand("ikke vender et vilkaar", V.opfyldt({ ikke: { beholder: "glas2", V: { over: 1 } } }, bord));
    paastand("nogen er sandt, naar ét er sandt",
        V.opfyldt({ nogen: [{ beholder: "glas1", V: { over: 1 } }, { beholder: "glas2", V: { over: 1 } }] }, bord));
    paastand("et ukendt glas giver falsk, ikke en undtagelse",
        V.opfyldt({ beholder: "findes_ikke", V: { over: 1 } }, bord) === false);

    overskrift("11. Opstillingen mod kataloget");
    var ukendte = [];
    NK.OPSTILLING.forEach(function (spec) {
        var kilder = [];
        if (spec.indhold && spec.indhold.mM) kilder = kilder.concat(Object.keys(spec.indhold.mM));
        if (spec.indhold && spec.indhold.umol) kilder = kilder.concat(Object.keys(spec.indhold.umol));
        kilder.forEach(function (n) { if (!St.STOFFER[n]) ukendte.push(spec.navn + ": " + n); });
    });
    paastand("alle stoffer paa bordet findes i stoftabellen", ukendte.length === 0, ukendte.join(", ") || "ingen ukendte");
    var udenType = NK.OPSTILLING.filter(function (s) { return !NK.Udstyr.TYPER[s.type]; });
    paastand("alt udstyr i opstillingen findes i kataloget", udenType.length === 0,
        udenType.map(function (s) { return s.type; }).join(", ") || "ingen ukendte");

    /* Oevelsestjekket i sin spaede form: peger et trin paa et glas eller et
       stof, der ikke findes, er forsoeget i stykker, og det skal opdages
       her - ikke af en elev. */
    var navne = {}, mangler = [], manglerStof = [];
    NK.OPSTILLING.forEach(function (s) { navne[s.navn] = true; });
    F.trin.concat(F.udloesere).forEach(function (x) {
        NK.Vilkaar.naevnte(x.naar).forEach(function (n) { if (!navne[n]) mangler.push(x.id + ": " + n); });
        NK.Vilkaar.naevnteStoffer(x.naar).forEach(function (n) { if (!St.STOFFER[n]) manglerStof.push(x.id + ": " + n); });
        /* peg maa vaere en genstand paa bordet eller et element i panelet */
        if (x.peg && !navne[x.peg] && !d.getElementById(x.peg)) mangler.push(x.id + " peger paa " + x.peg);
    });
    paastand("alle trin peger paa genstande, der findes", mangler.length === 0, mangler.join(", ") || "ingen mangler");
    paastand("alle trin naevner stoffer, der findes", manglerStof.length === 0, manglerStof.join(", ") || "ingen mangler");
    paastand("hvert trin har tekst og hint",
        F.trin.every(function (x) { return x.tekst && x.hint && x.kort; }));

    overskrift("12. Start forfra");
    NK.startForfra();
    var friske = [];
    for (var m = 1; m <= 8; m++) friske.push(bord.g["glas" + m]);
    paastand("glassene er tomme igen", friske.every(function (x) { return B.tom(x); }));
    paastand("kolben er fuld igen", B.volumen(bord.g.kolbe) > 190, tal(B.volumen(bord.g.kolbe), 0) + " mL");
    paastand("forloebet staar paa foerste trin", F.nuTrin() && F.nuTrin().id === "fyld");
    paastand("panelet kan opdateres", (NK.opdaterPanel(), true));

    overskrift("13. Replikker: forloebet taler gennem Kemichael");
    /* En konsekvens { sig } i forloebet gaar gennem side.sig til bordets
       laererReplik: han kommer ind, siger linjerne og gaar igen, uden at
       laase bordet. Uden laerer bliver det en besked. */
    var L = bord.laerer;
    paastand("bordet har en laerer med laererReplik", !!L && typeof bord.laererReplik === "function");
    bord.laererNyt();
    var tog = bord.laererReplik("Prøve.", {}, { id: "proeve" });
    paastand("laererReplik tager imod", tog === true);
    paastand("han fik en replik-scene med det samme", !!L.scene && L.scene.navn === "replik", L.scene && L.scene.navn);
    paastand("scenen laaser ikke bordet", !bord.laererOptaget());
    bord.laererReplik("Nummer to.", {}, { id: "to" });
    bord.laererReplik("Nummer tre.", {}, { id: "tre" });
    bord.laererReplik("Nummer to igen.", {}, { id: "to" });   /* samme kilde: kun én gang */
    paastand("replikker venter paa hinanden og kollapser ikke", bord.laererVent.length === 2, bord.laererVent.length + " i koe");
    adv(4);
    paastand("han siger replikken, naar han er kommet ind", L.tale === "Prøve.", JSON.stringify(L.tale));
    adv(40);
    paastand("koeen er afviklet", bord.laererVent.length === 0 && !L.scene, bord.laererVent.length + " i koe");

    /* Udloeseren om referencen: han stiller sig ved glas 7, markerer det,
       siger linjerne fra tekst.js og slutter med glimtet om afslaget.
       Glimtene huskes i browseren, saa hukommelsen tages ud imens og
       saettes tilbage bagefter. */
    var huskGlimt = null;
    try { huskGlimt = ramme.contentWindow.localStorage.getItem("nk-kemichael"); } catch (e) { /* ingen localStorage */ }
    NK.Kemichael.glimtNulstil();
    var g7b = bord.g.glas7;
    B.haeldI(g7b, B.udtag(bord.g.kolbe, 3), true);
    adv(5);
    B.haeldI(g7b, B.udtag(bord.g.ag, 0.3), true);
    var fyrede = false;
    for (var q = 0; q < 60 && !fyrede; q++) { adv(0.5); fyrede = !!F.fyret.roert_reference; }
    paastand("udloeseren fyrede", fyrede);
    /* Bag bordet gaar han ikke hen til glasset: han standser, hvor der er
       plads, og peger paa det (S8). Foelg ham, til glimtet er sagt. */
    var saaFoerste = false, saaAnden = false, saaAfslag = false, markeret = false;
    var stodVed = null, pegVink = null, pegFacit = null, planUnder = null;
    for (q = 0; q < 80 && !saaAfslag; q++) {
        adv(0.5);
        if (L.taleUr <= 0) continue;
        if (L.tale === NK.TEKST["sig-reference"][0]) {
            saaFoerste = true;
            stodVed = L.x;
            planUnder = L.plan;
            pegVink = L.arm;
            var rk7 = bord.rekt(g7b, 0);
            pegFacit = bord.pegVinkel(g7b.p.x, rk7.y + Math.min(24, rk7.h * 0.3));
            markeret = markeret || bord.markeret("glas7");
        }
        if (L.tale === NK.TEKST["sig-reference"][1]) saaAnden = true;
        if (L.tale.indexOf("afslag") >= 0) saaAfslag = true;
    }
    paastand("han kom ind og sagde foerste linje fra tekst.js", saaFoerste);
    paastand("han staar bag bordet, mens han taler", planUnder === 1, "plan " + planUnder);
    paastand("og han gaar ikke hen til glasset, men standser hvor der er plads",
        stodVed !== null && Math.abs(stodVed - g7b.p.x) > 100,
        stodVed === null ? "kom aldrig" : tal(stodVed, 0) + ", glasset staar i " + tal(g7b.p.x, 0));
    paastand("og peger paa glas 7 inden for 10 grader", pegVink !== null &&
        Math.abs(pegVink - pegFacit) < 10 * Math.PI / 180,
        pegVink === null ? "pegede ikke" : tal(pegVink * 180 / Math.PI, 1) + "° mod " + tal(pegFacit * 180 / Math.PI, 1) + "°");
    paastand("glas 7 er markeret, mens han taler", markeret);
    paastand("anden linje foelger", saaAnden);
    paastand("glimtet om afslaget kommer til sidst", saaAfslag);
    try {
        if (huskGlimt !== null) ramme.contentWindow.localStorage.setItem("nk-kemichael", huskGlimt);
        else ramme.contentWindow.localStorage.removeItem("nk-kemichael");
    } catch (e) { /* ingen localStorage */ }
    adv(30);

    /* Uden laerer: side.sig falder tilbage til beskeden paa scenen */
    var gemtL = bord.laerer;
    bord.laerer = null;
    side.sig(["Uden", "lærer."], { slags: "info" });
    bord.laerer = gemtL;
    paastand("uden laerer bliver replikken en besked",
        d.getElementById("scenebesked").textContent === "Uden lærer.", JSON.stringify(d.getElementById("scenebesked").textContent));

    /* Et trins eget sig: gaar samme vej */
    NK.startForfra();
    adv(1);
    var trinSig = F.trin.filter(function (x) { return x.sig; }).map(function (x) { return x.id; });
    paastand("tre trin har en replik, naar de er gjort", trinSig.length === 3, trinSig.join(", "));
    F.gjortNu("billede");
    adv(0.1);
    paastand("trinnets replik gaar til Kemichael", !!L.scene && L.scene.navn === "replik" &&
        L.scene.trin.some(function (x) { return x.sig === NK.TEKST.trin.billede.sig; }), L.scene && L.scene.navn);
    NK.startForfra();
    adv(1);
    paastand("start forfra toemmer koeen og scenen", !L.scene && bord.laererVent.length === 0);

    overskrift("14. Taleboblen: eget lag, der finder sin plads");
    /* laboratoriet/js/taleboble.js. Placeringen er ren geometri og proeves
       direkte; derefter at Kemichael tegner gennem laget. */
    var Tb = NK.Taleboble;
    paastand("taleboble.js er indlaest", !!Tb && typeof Tb.placer === "function" && typeof Tb.tegn === "function");
    var ctx2 = d.getElementById("scene-laerred").getContext("2d");
    var mKort = Tb.maal(ctx2, "Kort.", 1);
    paastand("en kort replik er én linje", mKort.linjer.length === 1 && mKort.b > 0 && mKort.h > 0, tal(mKort.b, 0) + " x " + tal(mKort.h, 0));
    var langTekst = "En replik, der er saa lang, at den maa brydes over flere linjer, for boblen maa ikke loebe ud over scenen, og saa lidt mere tekst for at naa fire.";
    var mLang = Tb.maal(ctx2, langTekst, 1);
    paastand("en lang replik brydes over flere linjer", mLang.linjer.length >= 3 && mLang.b <= Tb.STIL.maksBredde + 2 * Tb.STIL.polsterX + 1,
        mLang.linjer.length + " linjer, " + tal(mLang.b, 0) + " bred");
    var R = { x: 0, y: 0, b: NK.Scene.BREDDE, h: NK.Scene.HOEJDE };
    var hoved = { op: 97, side: 55, ned: 33 };
    function inden(p) { return p.x >= 0 && p.y >= 0 && p.x + p.b <= R.b && p.y + p.h <= R.h; }
    function rammer(a, b) { return a.x < b.x + b.b && a.x + a.b > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
    var p1 = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved });
    paastand("med plads over hovedet staar boblen over", p1.side === "over" && p1.y + p1.h <= 380 - 97 && inden(p1), p1.side);
    paastand("halen staar lige over munden og ender ved issen", Math.abs(p1.hale.x - 600) < 1 && Math.abs(p1.hale.y - (p1.y + p1.h)) < 1 &&
        Math.abs(p1.spids.x - 600) < 1 && p1.spids.y > 380 - 97 - 1 && p1.spids.y < 380 - 97 + 4);
    var p2 = Tb.placer(mLang, { x: 600, y: 40 }, R, { hoved: hoved });
    paastand("uden plads over hovedet vendes den, og den daekker ikke hovedet", p2.side !== "over" && inden(p2) &&
        !rammer(p2, { x: 600 - 55, y: 40 - 97, b: 110, h: 130 }), p2.side);
    var p3 = Tb.placer(mLang, { x: R.b - 10, y: 380 }, R, { hoved: hoved });
    paastand("ved hoejre kant bliver den inden for scenen", inden(p3), p3.side + " x=" + tal(p3.x, 0) + " b=" + tal(p3.b, 0));
    var glas = { x: 560, y: 150, b: 80, h: 120 };
    var p4 = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved, undgaa: glas });
    paastand("boblen laegger sig ikke over det, replikken handler om", !rammer(p4, glas) && inden(p4), p4.side + " x=" + tal(p4.x, 0) + " y=" + tal(p4.y, 0));
    var p4b = Tb.placer(mLang, { x: 600, y: 380 }, R, { hoved: hoved, undgaa: glas, side: "under" });
    paastand("en foretrukken side foelges, naar den er fri", p4b.side === "under" && inden(p4b), p4b.side);

    /* Kemichael tegner gennem laget: mens han taler om glas 3, ligger
       boblen inden for scenen, holder mindste skrift og daekker ikke glasset */
    NK.startForfra();
    adv(1);
    bord.laererReplik("Prøve af boblen, mens han taler om glas 3.", { peg: "glas3" }, { id: "boble" });
    var tegnet = false, p5 = null;
    for (var q3 = 0; q3 < 40 && !tegnet; q3++) {
        adv(0.5);
        bord.tegn();
        if (L.taleUr > 0 && L.taleAlfa > 0.5 && Tb.sidst) { tegnet = true; p5 = Tb.sidst; }
    }
    paastand("figuren tegner sin boble gennem laget", tegnet && inden(p5), p5 && (p5.side + " f=" + tal(p5.f, 2)));
    paastand("skriften holder mindst " + Tb.STIL.minSkaerm + " px paa skaermen", tegnet && p5.f >= 1);
    paastand("han taler om glas 3, og boblen daekker det ikke", tegnet && L.undgaa === "glas3" && !rammer(p5, bord.rekt(bord.g.glas3, 8)));
    adv(30);
    paastand("efter replikken er der ikke laengere noget at undgaa", L.undgaa === null && !L.scene);
    paastand("og armen haenger ned igen", Math.abs(L.arm - NK.Kemichael.HAENGER) < 0.05, tal(L.arm, 2));
    paastand("og han er gaaet ud af scenen igen", L.x <= NK.Kemichael.UDE + 1, tal(L.x, 0));

    /* F5: taleboblen er oeverste lag. Zoomboblen staar i venstre hjoerne,
       saa proeven er ham ovre i venstre side med en lang replik. */
    NK.startForfra();
    adv(1);
    B.haeldI(bord.g.glas5, B.udtag(bord.g.kolbe, 3), true);
    bord.vaelg("glas5");
    adv(1);
    L.x = 200; L.maalX = 200;
    bord.laererSig("Sølvnitrat giver sorte pletter på huden. Det går af igen efter en uge.", 8);
    adv(0.6);
    var raekke = [];
    var gemtZoom = bord.tegnBobleIScenen, gemtTale = bord.tegnLaererBoble;
    bord.tegnBobleIScenen = function () { raekke.push("zoom"); return gemtZoom.apply(this, arguments); };
    bord.tegnLaererBoble = function () { raekke.push("tale"); return gemtTale.apply(this, arguments); };
    Tb.sidst = null;
    bord.tegn();
    delete bord.tegnBobleIScenen;
    delete bord.tegnLaererBoble;
    var bRekt = bord.bobleRekt();
    paastand("taleboblen tegnes efter zoomboblen",
        raekke.indexOf("zoom") >= 0 && raekke.indexOf("tale") > raekke.indexOf("zoom"), raekke.join(" > "));
    paastand("og den laegger sig ikke under zoomboblen, naar der er plads andetsteds",
        !!Tb.sidst && !rammer(Tb.sidst, bRekt) && inden(Tb.sidst),
        Tb.sidst ? Tb.sidst.side + " x=" + tal(Tb.sidst.x, 0) + " y=" + tal(Tb.sidst.y, 0) : "ingen boble");
    L.tale = ""; L.taleUr = 0;
    NK.startForfra();
    adv(1);

    overskrift("15. En replik, der afbrydes af et uheld, kommer igen");
    /* Uheldet tager over med det samme (hoejere prioritet), men de linjer,
       der ikke blev sagt, venter forrest i koeen og siges bagefter.
       Regnskabet over uheld huskes i browseren og saettes tilbage. */
    var huskUheld = null;
    try { huskUheld = ramme.contentWindow.localStorage.getItem("nk-kemichael"); } catch (e) { /* ingen localStorage */ }
    var altidFoer = bord.laererAltid;
    bord.laererAltid = true;
    NK.startForfra();
    adv(1);
    bord.laererReplik(["Første linje.", "Anden linje.", "Tredje linje."], {}, { id: "afbrudt" });
    var sagdeFoerste = false;
    for (var q4 = 0; q4 < 20 && !sagdeFoerste; q4++) { adv(0.25); sagdeFoerste = L.taleUr > 0 && L.tale === "Første linje."; }
    paastand("han er i gang med foerste linje", sagdeFoerste && L.scene && L.scene.navn === "replik");
    bord.laererUheld("spild", bord.g.glas1);
    paastand("uheldet tager over med det samme", L.scene && L.scene.navn === "spild", L.scene && L.scene.navn);
    paastand("de linjer, der ikke blev sagt, venter forrest i koeen",
        bord.laererVent.length === 1 && bord.laererVent[0].fn === "laererSigReplik" &&
        bord.laererVent[0].arg.linjer.join("|") === "Anden linje.|Tredje linje.",
        bord.laererVent.length ? bord.laererVent[0].arg.linjer.join(" / ") : "tom koe");
    var sagdeAnden = false, sagdeTredje = false;
    for (var q5 = 0; q5 < 120 && !sagdeTredje; q5++) {
        adv(0.5);
        if (L.taleUr > 0 && L.tale === "Anden linje.") sagdeAnden = true;
        if (L.taleUr > 0 && L.tale === "Tredje linje.") sagdeTredje = true;
    }
    paastand("og bliver sagt, naar han har toerret op", sagdeAnden && sagdeTredje);
    adv(20);
    bord.laererAltid = altidFoer;
    try {
        if (huskUheld !== null) ramme.contentWindow.localStorage.setItem("nk-kemichael", huskUheld);
        else ramme.contentWindow.localStorage.removeItem("nk-kemichael");
    } catch (e) { /* ingen localStorage */ }
    NK.startForfra();

    overskrift("16. Bordets dybde");
    /* Bordpladen er en flade: noget kan stilles foran stativet, og det
       forreste tegnes og rammes foerst */
    var bg = bord.g.baeger, stv = bord.g.stativ, sp = bord.g.spatel;
    function stilMedFod(gg, x, fodY, musY) {
        bord.frigoer(gg);
        var f0 = bord.fod(gg);
        gg.p.x += x - f0.x;
        gg.p.y += fodY - f0.y;
        return bord.saetNed(gg, { x: x, y: musY === undefined ? fodY : musY });
    }
    function bundAf(gg) { return gg.p.y - gg.anker.y + gg.type.h; }
    paastand("bordpladen har dybde, og tegnebordet staar forneden",
        Sc.DYBDE === 64 && Sc.FORKANT === 564 && Sc.LODRET === "bund");
    paastand("vaerktoejet ligger forrest fra start",
        ["spatel", "glasstav", "termometer"].every(function (n) {
            return bord.dybdeAf(bord.g[n]) > Sc.BORD && bord.liste.indexOf(bord.g[n]) > bord.liste.indexOf(stv);
        }));
    stilMedFod(bg, 500, 540);
    paastand("et baegerglas kan stilles foran stativet",
        Math.abs(bundAf(bg) - 540) < 0.5 && bord.staarPaaBord(bg), tal(bundAf(bg), 0));
    var iB = bord.liste.indexOf(bg);
    paastand("og tegnes foran stativet og glassene i det",
        iB > bord.liste.indexOf(stv) && [1, 2, 3, 4, 5, 6, 7, 8].every(function (i) { return bord.liste.indexOf(g(i)) < iB; }));
    var rkB = bord.rekt(bg, 0);
    paastand("det forreste rammes foerst med musen", bord.hvad({ x: rkB.x + rkB.b / 2, y: rkB.y + 12 }) === "baeger");
    stilMedFod(bg, 500, 600, 560);
    paastand("slippes det laengere fremme, staar det paa forkanten", Math.abs(bundAf(bg) - Sc.FORKANT) < 0.5, tal(bundAf(bg), 0));
    stilMedFod(bg, 500, 470);
    paastand("slippes det i luften over bordet, staar det ved bagkanten", Math.abs(bundAf(bg) - Sc.BORD) < 0.5, tal(bundAf(bg), 0));
    stilMedFod(sp, 600, 560, Sc.FORKANT + 40);
    adv(1);
    paastand("slippes noget foran forkanten, falder det paa gulvet", sp.p.y > Sc.FORKANT + 40, tal(sp.p.y, 0));

    NK.startForfra();

    var mus = NKProeve.mus(bord);
    var beskeder = [], vedB = bord.vedBesked;

    var uheld0 = bord.antalUheld;
    var seet = mus.bordetSer({ x: 400, y: 300 });
    paastand("musen rammer det punkt paa scenen, der sigtes paa", Math.abs(seet.x - 400) < 0.01 && Math.abs(seet.y - 300) < 0.01, tal(seet.x) + ", " + tal(seet.y));
    function ankerMedFod(gg, x, y) { var t = gg.type; return { x: x - t.b / 2 + gg.anker.x, y: y - t.h + gg.anker.y }; }

    /* Kolben: et hurtigt slip over glas 1 giver en portion */

    /* Draabeflasken holdt med bunden lige over glas 4 (F2) */

    /* Stillet paa bordet foran stativet: en flaske, der tages i toppen og

    function stilForan(navn, glas, bundY) {
        NK.startForfra();

        var fl = bord.g[navn], gl = g(glas), V0 = B.volumen(gl), fV0 = B.volumen(fl), u0 = bord.antalUheld;

    [540, 505].forEach(function (y) {

    [-1, 1].forEach(function (side) {

    var tog = mus.tag("kolbe");

    mus.slip();

    function pegMaal(navn) {

        mus2.tag("vand") && (mus2.til({ x: baeg(2).p.x, y: rb2.y - 6 }, 0.7), mus2.hold(3.0),
        mus2.slip(), mus2.hold(1.0), faerdig(), B.volumen(baeg(2)) > 8),
        tal(B.volumen(baeg(2)), 0) + " mL");
    mus2.tag("vand");
    mus2.baer({ x: bord.g.vand.hjem.x, y: bord.g.vand.hjem.y }, 0.8);
    mus2.slip();
    mus2.hold(0.6);
    faerdig();
    paastand("intet gik galt undervejs", bord.antalUheld === uheld2 && bord.pytter.length === 0,
        bord.antalUheld - uheld2 + " uheld, " + bord.pytter.length + " pytter");
    d.getElementById("ovenfraknap").click();
    paastand("knappen Se ovenfra i panelet aabner visningen",
        d.getElementById("ovenfra").classList.contains("vis"));
    d.getElementById("ovenfra-luk").click();
    paastand("og knappen Luk lukker den", !d.getElementById("ovenfra").classList.contains("vis"));

    NK.startForfra();
    adv(1);
    paastand("Start forfra stiller bordet tilbage i del 1 med tomme baegerglas",
        NK.DELE.nu() === 1 && baeg(1).skjult && B.tom(baeg(1)) &&
        Jf.antal() === 0 && !bord.g.stativ.skjult);
    paastand("og knapperne viser del 1 igen",
        d.getElementById("del1knap").getAttribute("aria-pressed") === "true" &&
        d.getElementById("del2knap").getAttribute("aria-pressed") === "false");
}

function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
