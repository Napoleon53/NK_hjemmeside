<svg xmlns="http://www.w3.org/2000/svg" width="152" height="88" viewBox="0 0 76 44">
  <!-- Rulle alufolie, der ligger paa bordet. Midten er (38, 22).
       Et stykke folie er trukket ud til hoejre. -->
  <defs>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.3" stop-color="#b5bcc4"/>
      <stop offset="0.5" stop-color="#f4f6f8"/>
      <stop offset="0.75" stop-color="#9aa2ab"/>
      <stop offset="1" stop-color="#6f7780"/>
    </linearGradient>
    <linearGradient id="ark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dee3"/>
      <stop offset="0.4" stop-color="#f6f8fa"/>
      <stop offset="0.7" stop-color="#c3c9d0"/>
      <stop offset="1" stop-color="#e6eaee"/>
    </linearGradient>
  </defs>
  <!-- Det udtrukne ark -->
  <path d="M40 30 L74 24 L75 38 L40 42 Z" fill="url(#ark)" stroke="#9aa2ab" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M50 29 L52 41 M60 27 L61 40 M69 25 L70 39" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
  <path d="M46 36 L72 31" stroke="#8f979f" stroke-opacity="0.5" stroke-width="0.7"/>
  <!-- Rullen -->
  <rect x="6" y="14" width="40" height="28" rx="14" fill="url(#alu)"/>
  <ellipse cx="6" cy="28" rx="6" ry="14" fill="#8f979f" stroke="#5f666e" stroke-width="0.8"/>
  <ellipse cx="6" cy="28" rx="2.6" ry="6" fill="#4a3320"/>
  <path d="M46 28 L46 24" stroke="#5f666e" stroke-width="0.6"/>
  <text x="26" y="10" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="6.5" font-weight="700" fill="#c8ced6">alufolie</text>
</svg>
