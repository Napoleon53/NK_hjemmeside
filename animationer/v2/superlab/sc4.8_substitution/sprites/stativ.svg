<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 150 100">
  <!-- Reagensglasstativ i trae til to glas. Hullerne sidder ved x 45 og
       105. Tegnes efter glassene, saa topbraettet daekker dem. -->
  <defs>
    <linearGradient id="trae" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ac72"/>
      <stop offset="1" stop-color="#a8773f"/>
    </linearGradient>
    <linearGradient id="stolpe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c6d38"/>
      <stop offset="0.5" stop-color="#d4a66c"/>
      <stop offset="1" stop-color="#946634"/>
    </linearGradient>
  </defs>
  <rect x="4" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="136" y="22" width="10" height="68" fill="url(#stolpe)"/>
  <rect x="0" y="88" width="150" height="12" rx="2" fill="url(#trae)"/>
  <ellipse cx="45" cy="89" rx="11" ry="2" fill="#6b4520" fill-opacity="0.6"/>
  <ellipse cx="105" cy="89" rx="11" ry="2" fill="#6b4520" fill-opacity="0.6"/>
  <rect x="0" y="20" width="150" height="14" rx="2" fill="url(#trae)"/>
  <path d="M2 21.5 h146" stroke="#f0cf9e" stroke-opacity="0.7" stroke-width="1"/>
  <path d="M10 27 q30 -2 60 1 t70 -1 M8 30.5 q40 2 80 -1 t54 1" fill="none" stroke="#9a6a36" stroke-opacity="0.45" stroke-width="0.8"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#5a3814" text-anchor="middle">
    <text x="45" y="97">1</text>
    <text x="105" y="97">2</text>
  </g>
</svg>
