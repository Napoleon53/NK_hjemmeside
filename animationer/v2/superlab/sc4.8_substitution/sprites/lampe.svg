<svg xmlns="http://www.w3.org/2000/svg" width="440" height="600" viewBox="0 0 220 300">
  <!-- Kraftig arbejdslampe paa en arm. Fodens midte (ankeret) er
       (165, 296). Skaermen haenger med aabningen nedad om (70, 100);
       lyset tegnes af animationen ud fra det punkt. Kontakten sidder
       paa foden om (190, 282). -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f4650"/>
      <stop offset="0.45" stop-color="#8d97a3"/>
      <stop offset="1" stop-color="#353b44"/>
    </linearGradient>
    <linearGradient id="skaerm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2f36"/>
      <stop offset="0.3" stop-color="#6b7480"/>
      <stop offset="0.55" stop-color="#4a525c"/>
      <stop offset="1" stop-color="#1f2329"/>
    </linearGradient>
    <linearGradient id="fod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b636e"/>
      <stop offset="1" stop-color="#23272e"/>
    </linearGradient>
  </defs>
  <!-- Fod -->
  <ellipse cx="165" cy="290" rx="46" ry="9" fill="#15181c"/>
  <path d="M121 288 Q121 272 165 270 Q209 272 209 288 L209 292 Q209 298 165 299 Q121 298 121 292 Z" fill="url(#fod)"/>
  <ellipse cx="165" cy="272" rx="44" ry="8" fill="#6b7480"/>
  <!-- Kontakt paa foden -->
  <rect x="181" y="276" width="18" height="10" rx="3" fill="#15181c"/>
  <!-- Nederste arm -->
  <path d="M158 272 L164 130" stroke="#1d2126" stroke-width="12" stroke-linecap="round"/>
  <path d="M158 272 L164 130" stroke="url(#metal)" stroke-width="9" stroke-linecap="round"/>
  <!-- Led -->
  <circle cx="164" cy="128" r="9" fill="#1d2126"/>
  <circle cx="164" cy="128" r="6" fill="#8d97a3"/>
  <!-- Oeverste arm -->
  <path d="M164 128 L82 62" stroke="#1d2126" stroke-width="12" stroke-linecap="round"/>
  <path d="M164 128 L82 62" stroke="url(#metal)" stroke-width="9" stroke-linecap="round"/>
  <!-- Led ved skaermen -->
  <circle cx="82" cy="62" r="9" fill="#1d2126"/>
  <circle cx="82" cy="62" r="6" fill="#8d97a3"/>
  <path d="M82 62 L70 76" stroke="#1d2126" stroke-width="8" stroke-linecap="round"/>
  <!-- Skaerm med aabningen nedad -->
  <path d="M56 72 Q70 66 84 72 L112 100 L28 100 Z" fill="url(#skaerm)" stroke="#111418" stroke-width="1.5" stroke-linejoin="round"/>
  <ellipse cx="70" cy="100" rx="42" ry="7" fill="#0f1216" stroke="#3a4149" stroke-width="1.2"/>
  <path d="M62 74 L44 96" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
  <!-- Ledning -->
  <path d="M176 292 Q205 292 214 300" fill="none" stroke="#0f1216" stroke-width="3" stroke-linecap="round"/>
</svg>
