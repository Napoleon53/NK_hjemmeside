<svg xmlns="http://www.w3.org/2000/svg" width="116" height="168" viewBox="0 0 58 84">
  <!-- Brunt glas med bly(II)nitrat. Laaget tegnes af animationen.
       Aabningen er (29, 6). Faresymboler: GHS03 (brandnaerende),
       GHS05 (aetsende), GHS07 (sundhedsfare), GHS08 (sundhedsskadelig)
       og GHS09 (miljoefare). -->
  <defs>
    <linearGradient id="brun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1407"/>
      <stop offset="0.22" stop-color="#5a2c0e"/>
      <stop offset="0.42" stop-color="#8a4a1a"/>
      <stop offset="0.65" stop-color="#5e2f10"/>
      <stop offset="1" stop-color="#241106"/>
    </linearGradient>
  </defs>

  <!-- Hals med gevind -->
  <rect x="15" y="5" width="28" height="11" fill="url(#brun)"/>
  <path d="M15 9 h28 M15 12.5 h28" stroke="#1f0e04" stroke-opacity="0.6" stroke-width="1"/>

  <!-- Krop -->
  <path d="M15 15 Q4 16 3 24 L3 76 Q3 82 9 82 L49 82 Q55 82 55 76 L55 24 Q54 16 43 15 Z" fill="url(#brun)"/>
  <path d="M7 26 L7 76" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Etiket -->
  <rect x="8" y="27" width="42" height="50" rx="3" fill="#f4efe4" stroke="#c8bda6" stroke-width="0.7"/>
  <text x="29" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8.2" font-weight="700" fill="#1f2328">Pb(NO<tspan font-size="5.4" dy="2">3</tspan><tspan dy="-2">)</tspan><tspan font-size="5.4" dy="2">2</tspan></text>
  <text x="29" y="46.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="600" fill="#4a4f57">Bly(II)nitrat</text>

  <g stroke="#d8342a" stroke-width="0.9" fill="#ffffff">
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" transform="translate(16 56) rotate(45)"/>
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" transform="translate(29 56) rotate(45)"/>
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" transform="translate(42 56) rotate(45)"/>
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" transform="translate(22.5 68) rotate(45)"/>
    <rect x="-3.4" y="-3.4" width="6.8" height="6.8" transform="translate(35.5 68) rotate(45)"/>
  </g>
  <!-- GHS03: brandnaerende -->
  <g transform="translate(16 56) scale(0.55)" fill="#111111">
    <circle cx="0" cy="2.4" r="2.4" fill="none" stroke="#111111" stroke-width="1.1"/>
    <path d="M-1.8 0.6 q-1.2 -2.2 0.6 -4.4 q0 1.6 1.1 2.1 q0.4 -1.5 1.6 -2.2 q0.8 2.6 -0.6 4.5 Z"/>
    <path d="M-4 5 h8" stroke="#111111" stroke-width="0.9"/>
  </g>
  <!-- GHS05: aetsende -->
  <g transform="translate(29 56) scale(0.55)" fill="#111111">
    <path d="M-4.5 -4 l3 -1.4 l0.8 1.6 l-3 1.4 Z M0.8 -4.6 l3 1.2 l-0.7 1.6 l-3 -1.2 Z"/>
    <path d="M-4.6 2.4 h3.6 v1.6 h-3.6 Z M0.8 2.2 q2 -0.8 3.8 0.4 v1.4 h-3.8 Z"/>
  </g>
  <!-- GHS07: sundhedsfare -->
  <g transform="translate(42 56) scale(0.55)" fill="#111111">
    <path d="M-0.9 -4.4 h1.8 l-0.35 5.6 h-1.1 Z"/>
    <circle cx="0" cy="3.2" r="0.95"/>
  </g>
  <!-- GHS08: sundhedsskadelig -->
  <g transform="translate(22.5 68) scale(0.55)" fill="#111111">
    <circle cx="0" cy="-3.6" r="1.3"/>
    <path d="M-2.8 4.6 L-2.6 -1.6 Q0 -2.8 2.6 -1.6 L2.8 4.6 Z"/>
    <path d="M0 -0.6 l0.5 1.1 l1.2 0.1 l-0.9 0.8 l0.3 1.2 l-1.1 -0.6 l-1.1 0.6 l0.3 -1.2 l-0.9 -0.8 l1.2 -0.1 Z" fill="#ffffff"/>
  </g>
  <!-- GHS09: miljoefare -->
  <g transform="translate(35.5 68) scale(0.55)">
    <path d="M-3 3.4 L-3 -3 M-3 -1.6 L-4.6 -3.4 M-3 -0.6 L-1.2 -2.8" stroke="#111111" stroke-width="0.9" stroke-linecap="round" fill="none"/>
    <path d="M-0.6 2.2 q1.8 -1.8 3.8 0 q-2 1.8 -3.8 0 Z M3.2 2.2 l1.2 -0.9 v1.8 Z" fill="#111111"/>
    <path d="M-4.4 4 h8.8" stroke="#111111" stroke-width="0.8"/>
  </g>
</svg>
