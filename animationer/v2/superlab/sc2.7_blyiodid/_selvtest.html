<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - sc2.7 Opløselighed af blyiodid</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem med de
   samme funktioner, som klik og knapper bruger: modellen, afvejningen,
   raekkefoelgen, maalingen ved afkoeling, beregningen af Ko med den
   trinvise hjaelp, de valgfri ekstra maalinger, graenserne, tegneserien,
   paaskeaeggene, quizzen, sproget og ion-notationen. Skal aabnes gennem
   en lokal server (Chrome afviser iframes paa file://).
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument;
    var NK = ramme.contentWindow.NK;
    /* Baggrundslivet (han gaar forbi, naar der er stille) skal ikke
       blande sig i testens scener */
    if (NK.Kemichael) NK.Kemichael.baggrundsliv(false);
    var i;

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    paastand("introen aabner og lukker", !!NK.intro && (NK.intro.aabn(), d.getElementById("intro").classList.contains("vis")) && (NK.intro.luk(), !d.getElementById("intro").classList.contains("vis")));
    paastand("forsoeg, quiz, graf og tegneserie er bygget", !!(NK.forsoeg && NK.quiz && NK.Graf && NK.Tegneserie));
    Object.keys(NK.Sprites.FILER).forEach(function (n) {
        paastand("sprite " + n + " er indlaest", NK.Sprites.klar(n));
    });

    var M = NK.Model, f = NK.forsoeg, SP = M.SPATEL;
    function adv(sek) { for (var k = 0; k < Math.round(sek * 60); k++) f.opdater(1 / 60); }
    function vent(betingelse, maks) { var t = 0; while (!betingelse() && t < maks) { adv(0.25); t += 0.25; } return t; }
    function frisk() { NK.startForfra(); adv(0.1); }
    function roligt() { vent(function () { return !f.travl(); }, 12); }
    function klik(navn) { roligt(); return f.klik(navn); }
    function komma(x, n) { return x.toFixed(n === undefined ? 3 : n).replace(".", ","); }
    function baad() { return Math.round(f.g.vejebaad.masse * 1000) / 1000; }
    function haeld() { var ok = klik("vejebaad"); roligt(); return ok; }
    /* Spatelspidser paa, og lidt af med spatlen, til vaegten er i vinduet */
    function afvej(glas, maal, tol) {
        for (var n = 0; n < 40; n++) {
            roligt();
            var m = baad();
            if (m > maal + tol) { if (!f.klik("spatel")) return false; }
            else if (m < maal - tol) { if (!f.klik(glas)) return false; }
            else return true;
        }
        return false;
    }
    function tilsaet(pbMaal) {
        return afvej("pbGlas", pbMaal, SP.tolerance) && haeld() && afvej("kiGlas", f.tils.pb, SP.forskel) && haeld();
    }
    /* Varm op til klar, sluk, og notér ved de foerste krystaller */
    function maal() {
        if (!f.varme) f.klik("varme");
        if (!f.omroer) f.klik("omroer");
        vent(function () { return f.tils.klarSet; }, 60);
        f.klik("varme");
        f.klik("omroer");
        vent(function () { return f.b.fast > 1e-6; }, 40);
        return f.klik("termometer");
    }

    overskrift("2. Modellen");
    paastand("faeldningen er afstemt", M.afstemt(M.REAKTIONER.faeldning));
    paastand("den samlede reaktion er afstemt", M.afstemt(M.REAKTIONER.samlet));
    paastand("opløsningen af Pb(NO3)2 og KI er afstemt", M.afstemt(M.REAKTIONER.oploesPb) && M.afstemt(M.REAKTIONER.oploesKI));
    paastand("formler med ladning", M.formel("Pb2+") === "Pb²⁺" && M.formel("I-") === "I⁻" && M.formel("K+") === "K⁺" && M.formel("NO3-") === "NO₃⁻");
    paastand("ligningen skrives med pil og faser", M.ligning(M.REAKTIONER.faeldning, true) === "Pb²⁺(aq) + 2 I⁻(aq) → PbI₂(s)", M.ligning(M.REAKTIONER.faeldning, true));
    function naer(a, b, pct) { return Math.abs(a - b) <= Math.abs(b) * pct; }
    paastand("opløseligheden passer med tabelvaerdierne", naer(M.oploeselighed(0), 0.044, 0.03) && naer(M.oploeselighed(20), 0.069, 0.03) && naer(M.oploeselighed(100), 0.41, 0.03),
        komma(M.oploeselighed(0)) + " / " + komma(M.oploeselighed(20)) + " / " + komma(M.oploeselighed(100)));
    paastand("maetningstemperaturen er den omvendte funktion", Math.abs(M.maetningsTemp(M.oploeselighed(63)) - 63) < 1e-9);
    paastand("samme masse giver forholdet 1 : 2", naer(M.MOLMASSE["Pb(NO3)2"] / M.MOLMASSE.KI, 2, 0.005));
    paastand("0,100 g af hvert stof giver 0,139 g PbI2", Math.abs(M.pbi2Masse(0.1, 0.1) - 0.139) < 0.001, komma(M.pbi2Masse(0.1, 0.1)));
    paastand("vinduet er bredere end det mest, spatlen tager af", 2 * SP.tolerance > SP.fjernMaks && 2 * SP.forskel > SP.fjernMaks);
    var tb = { T: 20, koger: false };
    var sek = 0;
    while (tb.T < 52 && sek < 60) { M.skridtTemp(tb, 1 / 60, 1); sek += 1 / 60; }
    paastand("fra 20 til 52 °C tager under 20 s", sek < 20, sek.toFixed(1) + " s");
    for (i = 0; i < 6000; i++) M.skridtTemp(tb, 1 / 60, 1);
    paastand("vandet koger ved 100 °C og bliver ikke varmere", tb.T === 100 && tb.koger);

    overskrift("2b. Opløselighedsproduktet");
    paastand("Ko ved 20 °C er 1,3 · 10^-8 M^3", naer(M.ko(20), 1.33e-8, 0.03), M.videnskabelig(M.ko(20), 2));
    var s50 = M.oploeselighed(50) * 10 / M.MOLMASSE.PbI2;
    paastand("Ko(T) = 4 s^3 med s i mol/L", naer(M.ko(50), 4 * s50 * s50 * s50, 1e-9));
    paastand("Ko stiger med temperaturen", M.ko(20) < M.ko(50) && M.ko(50) < M.ko(80));
    paastand("maetningstemperaturen for Y er den omvendte funktion af Ko", Math.abs(M.maetningsTempY(M.ko(63)) - 63) < 1e-9);
    var b1 = M.beregning(0.1, 0.1);
    paastand("0,100 g af hvert stof: 3,02 · 10^-3 M Pb2+ og 6,02 · 10^-3 M I-", naer(b1.cPb, 3.02e-3, 0.002) && naer(b1.cI, 6.02e-3, 0.002),
        M.videnskabelig(b1.cPb, 2) + " / " + M.videnskabelig(b1.cI, 2));
    paastand("og reaktionsbroeken 1,10 · 10^-7 M^3", naer(b1.Y, 1.096e-7, 0.005) && M.videnskabelig(b1.Y, 2) === "1,10·10⁻⁷", M.videnskabelig(b1.Y, 2));
    var stoek = 0.1 * M.MOLMASSE.KI * 2 / M.MOLMASSE["Pb(NO3)2"];
    paastand("med forholdet 1 : 2 er bundfaldet det samme som efter opløseligheden i gram",
        Math.abs(M.ligevaegt({ pb: 0.1, ki: stoek, T: 20 }) - (M.pbi2Masse(0.1, stoek) - M.oploeselighed(20))) < 1e-6,
        komma(M.ligevaegt({ pb: 0.1, ki: stoek, T: 20 })) + " g");
    var tM = M.maetningsTempY(b1.Y);
    paastand("intet bundfald over maetningstemperaturen, bundfald under", M.ligevaegt({ pb: 0.1, ki: 0.1, T: tM + 0.5 }) === 0 && M.ligevaegt({ pb: 0.1, ki: 0.1, T: tM - 0.5 }) > 0, komma(tM, 1) + " °C");
    paastand("overskud af KI giver mere bundfald (faelles ion)", M.ligevaegt({ pb: 0.1, ki: 0.11, T: 40 }) > M.ligevaegt({ pb: 0.1, ki: 0.1, T: 40 }));
    paastand("elevens tal laeses med komma og potens",
        naer(M.tal("1,09·10^-7"), 1.09e-7, 1e-9) && naer(M.tal("1,09·10⁻⁷ M³"), 1.09e-7, 1e-9) && naer(M.tal("0,000000109"), 1.09e-7, 1e-9)
        && naer(M.tal("1.09e-7"), 1.09e-7, 1e-9) && naer(M.tal("3,02 · 10^-4 mol"), 3.02e-4, 1e-9) && isNaN(M.tal("abc")) && isNaN(M.tal("")));
    function slags(v) { return M.tjekKo(String(v), 0.1, 0.1).slags; }
    paastand("rigtig Ko godtages, ogsaa afrundet", slags("1,1·10^-7") === "rigtig" && slags(b1.Y) === "rigtig" && slags("1,09e-7") === "rigtig");
    paastand("de typiske fejl genkendes",
        slags(b1.cPb * b1.cI) === "udenAnden" && slags(b1.cPb * 2 * b1.cI) === "gangeTo" && slags(b1.cPb * 4 * b1.cI * b1.cI) === "dobbeltI"
        && slags(b1.nPb * b1.nI * b1.nI) === "mol" && slags(b1.Y * 1e-9) === "ml" && slags(b1.Y * 100) === "potens",
        [slags(b1.cPb * b1.cI), slags(b1.cPb * 2 * b1.cI), slags(b1.cPb * 4 * b1.cI * b1.cI), slags(b1.nPb * b1.nI * b1.nI), slags(b1.Y * 1e-9), slags(b1.Y * 100)].join(" / "));
    paastand("tomt felt og tekst er ikke et forkert svar", slags("") === "tom" && slags("ved ikke") === "ikketal" && slags("5,5·10^-7") === "forkert");

    /* Tal skrevet, som en elev ville skrive dem */
    function skriv4(x) { var e = Math.floor(Math.log(x) / Math.LN10); return (x / Math.pow(10, e)).toFixed(3).replace(".", ",") + "·10^" + e; }
    function felt(id) { return d.getElementById(id); }
    function svarIPanel(v) { felt("svar").value = v; NK.tjekSvar(); }

    overskrift("3. Afvejning og én maaling");
    frisk();
    paastand("stof afvises uden vand", f.klik("pbGlas") === false && !f.handling);
    paastand("varmen afvises med tomt glas", f.klik("varme") === false && !f.varme);
    paastand("termometret afviser uden stof", f.klik("termometer") === false);
    paastand("resterne kan ikke afleveres uden en maaling", f.klik("dunk") === false && !f.gjort.affald);
    paastand("vand haeldes i", klik("maaleglas") === true);
    roligt();
    paastand("baegerglasset har 100 mL vand", f.b.vand && f.g.maaleglas.vandAreal === 0 && f.trinGjort("vand"));
    paastand("KI afvises foer Pb(NO3)2", f.klik("kiGlas") === false);
    var spidser = [];
    for (i = 0; i < 6; i++) {
        var foer = f.g.vejebaad.masse;
        klik("pbGlas"); roligt();
        spidser.push(f.g.vejebaad.masse - foer);
        klik("spatel"); roligt();
        while (f.g.vejebaad.masse > 0) { klik("spatel"); roligt(); }
    }
    paastand("en spatelspids er mellem 0,038 og 0,062 g og ikke altid den samme",
        spidser.every(function (x) { return x >= SP.min - 1e-9 && x <= SP.maks + 1e-9; }) && Math.max.apply(null, spidser) - Math.min.apply(null, spidser) > 0.003,
        spidser.map(function (x) { return komma(x); }).join(" / "));
    klik("pbGlas"); roligt();
    paastand("én spatelspids er for lidt", f.klik("vejebaad") === false);
    var foerFjern = f.g.vejebaad.masse;
    klik("spatel"); roligt();
    var fjernet = foerFjern - f.g.vejebaad.masse;
    paastand("spatlen tager lidt af", fjernet >= SP.fjernMin - 1e-9 && fjernet <= SP.fjernMaks + 1e-9, komma(fjernet));
    paastand("ca. 0,100 g Pb(NO3)2 afvejes", afvej("pbGlas", SP.foerste, SP.tolerance), komma(baad()));
    paastand("vaegten viser tre decimaler", M.komma(baad(), 3).length === 5);
    paastand("Pb(NO3)2 haeldes i", haeld() && Math.abs(f.b.pb - 0.1) <= 0.0101 && f.tils.pb === f.b.pb && f.iagttaget.pb_oploest, komma(f.b.pb));
    paastand("massen staar i kortet Beregning", felt("m-pb").textContent === komma(f.b.pb) + " g" && felt("m-ki").textContent === "" && felt("beregn").hidden, felt("m-pb").textContent);
    paastand("mere Pb(NO3)2 afvises, foer KI er i", klik("pbGlas") === false);
    klik("kiGlas"); roligt();
    paastand("forkert masse KI afvises", f.klik("vejebaad") === false);
    paastand("samme masse KI afvejes", afvej("kiGlas", f.tils.pb, SP.forskel), komma(baad()) + " mod " + komma(f.tils.pb));
    paastand("KI haeldes i", haeld());
    adv(2);
    paastand("gult bundfald dannes straks", f.b.fast > 0.03 && f.iagttaget.bundfald, komma(f.b.fast) + " g");
    paastand("partikelmodellen har ioner og krystal", f.mikro.antal("pb") === 2 && f.mikro.antal("i") === 4 && f.mikro.antal("k") === 4 && f.mikro.antal("no3") === 4 && f.mikro.fastAntal() >= 1);
    paastand("temperaturen kan ikke noteres, foer glasset har vaeret klart", f.klik("termometer") === false);
    f.klik("varme"); f.klik("omroer");
    var t = vent(function () { return f.tils.klarSet; }, 45);
    paastand("ved opvarmning bliver opløsningen klar", f.tils.klarSet && f.b.fast === 0 && f.iagttaget.klar && f.trinGjort("klar"), t + " s, " + komma(f.b.T, 1) + " °C");
    adv(1);
    paastand("krystallen i luppen er vaek", f.mikro.fastAntal() === 0);
    paastand("i den klare opløsning kan der ikke noteres", f.klik("termometer") === false);
    paastand("noter-knappen vises", !felt("noter-knap").hidden);
    f.klik("varme"); f.klik("omroer");
    t = vent(function () { return f.b.fast > 1e-6; }, 40);
    var tSat = M.maetningsTempY(M.ionprodukt(f.b.pb, f.b.ki));
    paastand("de foerste krystaller kommer, naar reaktionsbroeken er lig med Ko", Math.abs(f.b.T - tSat) < 1.5 && f.iagttaget.regn, komma(f.b.T, 1) + " °C mod " + komma(tSat, 1) + " °C efter " + t + " s");
    paastand("temperaturen noteres", f.klik("termometer") === true && f.maalinger.length === 1 && f.trinGjort("maal1"));
    paastand("samme maaling kan ikke noteres igen", f.klik("termometer") === false);
    var m1 = f.maalinger[0], c1 = M.beregning(m1.pb, m1.ki);
    paastand("maalingen har reaktionsbroeken ved den noterede temperatur", naer(m1.Y, c1.Y, 1e-12) && naer(M.ko(m1.T), m1.Y, 0.15), M.videnskabelig(m1.Y, 2) + " mod tabellens " + M.videnskabelig(M.ko(m1.T), 2));

    overskrift("3b. Beregningen af Ko");
    paastand("beregningen er det aktuelle trin", f.aktueltTrin().id === "beregn" && !f.trinGjort("beregn"));
    paastand("kortet viser masserne og temperaturen, og feltet er aabent",
        felt("m-pb").textContent === komma(m1.pb) + " g" && felt("m-ki").textContent === komma(m1.ki) + " g" && felt("t-krystal").textContent === komma(m1.T, 1) + " °C"
        && !felt("beregn").hidden && !felt("hjaelp-beregn").hidden && felt("maal-nr").textContent === "Måling 1");
    paastand("quizzen og tegneserien er laast", NK.quiz.tilstand === "laast" && felt("serieknap").hidden);
    svarIPanel("");
    paastand("et tomt felt taeller ikke som forkert", m1.forkerte === 0 && !felt("beregn-hint").hidden);
    svarIPanel(skriv4(c1.cPb * c1.cI));
    paastand("uden i anden: hintet siger det", m1.forkerte === 1 && !m1.beregnet && felt("beregn-hint").textContent.indexOf("i anden") > 0, felt("beregn-hint").textContent);
    svarIPanel(skriv4(c1.nPb * c1.nI * c1.nI));
    paastand("stofmaengder i stedet for koncentrationer: hintet siger det", m1.forkerte === 2 && felt("beregn-hint").textContent.indexOf("stofmængder") > 0);
    svarIPanel("5,5·10^-7");
    paastand("efter flere forkerte svar staar hele vejen i hintet", m1.forkerte === 3 && felt("beregn-hint").textContent.indexOf("Hjælp til beregningen") > 0);

    NK.guide.aabn();
    paastand("den trinvise hjaelp aabner med elevens masse", felt("guide").classList.contains("vis") && felt("g1-tal").textContent.indexOf(komma(m1.pb) + " g") === 0 && felt("g2-svar").disabled, felt("g1-tal").textContent);
    function trin(n, v) { felt("g" + n + "-svar").value = v; NK.guide.tjek(n); }
    trin(1, skriv4(m1.pb * 331.2));
    paastand("trin 1: ganget i stedet for divideret giver et hint", NK.guide.tilstand().trin === 1 && felt("g1-hint").textContent.indexOf("ganget") > 0);
    trin(1, skriv4(c1.nPb));
    paastand("trin 1: stofmaengden af Pb(NO3)2", NK.guide.tilstand().trin === 2 && !felt("g2-svar").disabled && felt("g2-tal").textContent.indexOf("mol") > 0, felt("g2-tal").textContent);
    trin(2, skriv4(c1.nPb / 100));
    paastand("trin 2: volumen i mL giver et hint om liter", NK.guide.tilstand().trin === 2 && felt("g2-hint").textContent.indexOf("liter") > 0);
    trin(2, skriv4(c1.cPb));
    trin(3, skriv4(c1.nI * 2));
    paastand("trin 3: ganget med 2 giver et hint", NK.guide.tilstand().trin === 3 && felt("g3-hint").textContent.indexOf("ganges med 2") > 0);
    trin(3, skriv4(c1.nI));
    trin(4, skriv4(c1.cI));
    paastand("trin 5 har elevens egne koncentrationer", NK.guide.tilstand().trin === 5 && felt("g5-tal").textContent.indexOf("M · (") > 0 && felt("g5-tal").textContent.indexOf("M)²") > 0, felt("g5-tal").textContent);
    trin(5, skriv4(c1.cPb * c1.cI));
    paastand("trin 5: uden i anden giver et hint", NK.guide.tilstand().trin === 5 && felt("g5-hint").textContent.indexOf("i anden") > 0);
    trin(5, skriv4(c1.Y));
    paastand("alle fem trin er regnet", NK.guide.tilstand().trin === 6 && !felt("guide-brug").hidden);
    NK.guide.brug();
    paastand("svaret skrives i panelet og er rigtigt", m1.beregnet && f.erBeregnet() && f.trinGjort("beregn") && !felt("guide").classList.contains("vis"));
    paastand("kortet viser den beregnede Ko, og feltet er vaek", !felt("beregn-svar").hidden && felt("beregn-svar").textContent.indexOf(M.videnskabelig(m1.Y, 2)) > 0 && felt("beregn").hidden, felt("beregn-svar").textContent);
    paastand("quizzen er laast op, og laereren roser", NK.quiz.tilstand !== "laast" && f.laerer.rost && f.iagttaget.beregnet1);
    paastand("naeste trin er resterne, ikke flere maalinger", f.aktueltTrin().id === "affald" && !f.trinGjort("flere"));
    paastand("tegneserien er stadig laast", felt("serieknap").hidden);
    vent(function () { return !f.laererOptaget(); }, 25);

    overskrift("3c. Valgfrit: flere maalinger");
    paastand("maaling 2: ca. 0,050 g af hvert stof", tilsaet(SP.senere) && Math.abs(f.tilsaetninger[1].pb - 0.05) <= 0.0101, f.tilsaetninger.length > 1 ? komma(f.tilsaetninger[1].pb) : "");
    paastand("kortet skifter til maaling 2 med masserne i alt", felt("maal-nr").textContent === "Måling 2" && felt("m-pb").textContent === komma(f.b.pb) + " g" && felt("t-krystal").textContent === "" && felt("beregn-svar").hidden);
    paastand("maaling 2 noteres", maal() && f.maalinger.length === 2 && f.trinGjort("flere"), f.maalinger.length === 2 ? komma(f.maalinger[1].T, 1) + " °C" : "");
    paastand("feltet aabner igen for maaling 2", !felt("beregn").hidden && felt("svar").value === "");
    svarIPanel(skriv4(f.maalinger[1].Y));
    paastand("Ko for maaling 2 regnes", f.maalinger[1].beregnet && f.iagttaget.beregnet2);
    paastand("maaling 3", tilsaet(SP.senere) && maal() && f.maalinger.length === 3, f.maalinger.length === 3 ? komma(f.maalinger[2].T, 1) + " °C" : "");
    var afvig = f.maalinger.map(function (m) { return f.afvigelse(m); });
    paastand("alle tre maalinger ligger paa kurven", afvig.every(function (a) { return a < 3; }), afvig.map(function (a) { return a.toFixed(1); }).join(" / "));
    paastand("temperaturen og Ko stiger med massen", f.maalinger[0].T < f.maalinger[1].T && f.maalinger[1].T < f.maalinger[2].T && f.maalinger[0].Y < f.maalinger[1].Y && f.maalinger[1].Y < f.maalinger[2].Y);
    paastand("kurven er noteret, og laereren roser igen", f.iagttaget.kurve && f.laerer.rostKurve);
    paastand("det varme glas kan tages op", f.b.T > 50 && f.klik("dunk") === true);
    adv(1);
    paastand("der skvulper lidt ud, og uheldet er noteret", !!f.skvulp && f.iagttaget.varmt && f.b.vand && !f.gjort.affald);
    adv(2.5);
    paastand("laereren kommer og taler om varmt glas", !!(f.laerer.scene && f.laerer.scene.navn === "varmt") && f.laerer.tale.indexOf("Varmt glas") === 0, f.laerer.tale);
    vent(function () { return !f.laererOptaget() && !f.handling; }, 15);
    paastand("laereren har toerret op og er gaaet", !f.skvulp && !f.laererOptaget() && f.laerer.x < -200);
    t = vent(function () { return f.b.T < 50; }, 90);
    paastand("glasset koeler af til under 50 °C", f.b.T < 50, t + " s");
    paastand("resterne afleveres", klik("dunk") === true);
    roligt();
    paastand("forsoeget er slut, glasset er tomt", f.gjort.affald && f.erSlut() && !f.b.vand && f.b.pb === 0 && f.aktueltTrin() === null);
    paastand("alle trin er gjort", NK.TRIN.every(function (tr) { return f.trinGjort(tr.id); }));
    paastand("kortet viser stadig den sidste maaling", felt("maal-nr").textContent === "Måling 3" && felt("m-pb").textContent === komma(f.maalinger[2].pb) + " g");

    overskrift("4. Tegneserien");
    paastand("tegneserien er laast op", !felt("serieknap").hidden);
    NK.aabnSerie();
    var ruder = d.querySelectorAll("#serie-ruder .rude");
    /* En rude pr. iagttagelse, en med maalingerne og en med oprydningen,
       hvis laereren har ryddet op undervejs */
    var forventet = f.logbog.filter(function (e) { return !!NK.Tegneserie.RUDER[e.noegle]; }).length + 1
        + (NK.Kemichael.uheldIForsoeget() ? 1 : 0);
    paastand("én rude pr. iagttagelse og én med maalingerne", ruder.length === forventet && ruder.length >= 8 && felt("tegneserie").classList.contains("vis"), ruder.length + " ruder");
    var sidste = ruder[ruder.length - 1];
    var raekker = sidste ? sidste.querySelectorAll("table.maalinger tr") : [];
    paastand("sidste rude har tabellen med tre maalinger og grafen", raekker.length === 4 && !!sidste.querySelector("canvas"));
    paastand("masserne staar med tre decimaler", raekker.length === 4 && /^\d,\d{3} g$/.test(raekker[1].children[1].textContent), raekker.length ? raekker[1].children[1].textContent : "");
    paastand("sidste kolonne er Ko", raekker.length === 4 && raekker[1].children[4].textContent === M.videnskabelig(f.maalinger[0].Y, 2), raekker.length ? raekker[1].children[4].textContent : "");
    paastand("konklusionen har elevens Ko og tabelvaerdien", sidste.textContent.indexOf("Tabelværdien") > 0 && sidste.textContent.indexOf("stiger med temperaturen") > 0);
    paastand("grafens akse passer til det stoerste punkt", NK.Graf.aksetop(f.maalinger) >= f.maalinger[2].Y / 1e-7, String(NK.Graf.aksetop(f.maalinger)));
    paastand("ruderne har elevens temperaturer", felt("serie-ruder").textContent.indexOf(komma(f.maalinger[0].T, 1) + " °C") >= 0);
    felt("serie-luk").click();
    paastand("tegneserien lukkes", !felt("tegneserie").classList.contains("vis"));

    overskrift("4b. Én maaling er nok");
    frisk();
    klik("maaleglas"); roligt();
    paastand("vand, stof og én maaling", tilsaet(SP.foerste) && maal() && f.maalinger.length === 1);
    t = vent(function () { return f.b.T < 50; }, 120);
    paastand("resterne kan afleveres foer beregningen", klik("dunk") === true);
    roligt();
    paastand("forsoeget er ikke slut, foer Ko er beregnet", f.gjort.affald && !f.erSlut() && f.aktueltTrin().id === "beregn" && felt("serieknap").hidden && !felt("beregn").hidden,
        felt("serie-tekst").textContent);
    paastand("der kan ikke maales mere, naar resterne er afleveret", f.klik("pbGlas") === false);
    svarIPanel(skriv4(f.maalinger[0].Y));
    paastand("med Ko beregnet er forsoeget slut efter én maaling", f.erSlut() && f.aktueltTrin() === null && !felt("serieknap").hidden && !f.trinGjort("flere"));
    paastand("taelleren regner ikke det valgfri trin med", felt("forloeb-taeller").textContent === "7/7", felt("forloeb-taeller").textContent);
    NK.aabnSerie();
    ruder = d.querySelectorAll("#serie-ruder .rude");
    sidste = ruder[ruder.length - 1];
    paastand("tegneserien har én maaling i tabellen og tabelvaerdien i teksten", sidste.querySelectorAll("table.maalinger tr").length === 2 && sidste.textContent.indexOf("Tabelværdien") > 0 && sidste.textContent.indexOf("stiger med temperaturen") < 0);
    felt("serie-luk").click();

    overskrift("5. Graenser");
    frisk();
    klik("maaleglas"); roligt();
    f.b.pb = 0.27; f.b.ki = 0.27;
    f.tils = { pb: 0.05, ki: 0.05, bundfaldSet: true, klarSet: true, forsvundet: false, noteret: true };
    paastand("mere end 0,30 g Pb(NO3)2 i alt afvises", f.klik("pbGlas") === false);
    f.b.pb = 0.30; f.b.ki = 0.30;
    f.klik("varme"); f.klik("omroer");
    t = vent(function () { return f.b.koger && f.kogeTid > 7; }, 90);
    paastand("vandet koger, men bundfaldet forsvinder ikke", f.b.koger && f.b.fast > 0 && f.iagttaget.koger, t + " s");
    paastand("laereren siger til, naar det koger", f.kogeSagt);

    overskrift("6. Paaskeaeggene");
    paastand("hoejst 2 uheld, og anden gang kraever flere klik", M.SPILD.MAKS_UHELD === 2 && M.SPILD.KLIK[1] > M.SPILD.KLIK[0]);
    frisk();
    klik("maaleglas"); roligt();
    f.klik("pbGlas");
    for (i = 0; i < M.SPILD.KLIK[0] - 1; i++) f.klik("pbGlas");
    paastand("faa hurtige klik spilder ikke", f.antalUheld === 0);
    f.klik("pbGlas");
    paastand("hektiske klik spilder pulveret", f.antalUheld === 1 && !!f.spild && f.iagttaget.spild1);
    adv(0.8);
    paastand("laereren er paa vej", f.laererOptaget() && f.laerer.scene.navn === "spild");
    paastand("klik afvises, mens laereren er der", f.klik("pbGlas") === false);
    vent(function () { return !f.laererOptaget(); }, 15);
    paastand("laereren har toerret op og er gaaet", !f.spild && !f.laererOptaget());
    roligt();
    f.klik("pbGlas");
    for (i = 0; i < M.SPILD.KLIK[0]; i++) f.klik("pbGlas");
    paastand("anden gang spilder samme antal klik ikke", f.antalUheld === 1);
    roligt();
    f.klik("pbGlas");
    for (i = 0; i < M.SPILD.KLIK[1]; i++) f.klik("pbGlas");
    paastand("flere klik spilder anden gang", f.antalUheld === 2);
    vent(function () { return !f.laererOptaget() && !f.handling; }, 15);
    f.klik("pbGlas");
    for (i = 0; i < 12; i++) f.klik("pbGlas");
    paastand("efter to uheld sker det ikke mere", f.antalUheld === 2);
    frisk();
    /* Kaffen er faelles og ikke den samme to gange; her vaelges posten */
    NK.Kemichael.kaffeTvang("kold");
    paastand("laereren henter kaffen", f.klik("kaffekop") === true);
    adv(16);
    paastand("koppen er vaek, og laereren er gaaet", f.g.kaffekop.skjult && !f.laererOptaget());
    NK.Kemichael.kaffeTvang(null);

    overskrift("7. Quizzens spoergsmaal");
    paastand("quizzen har 10 spoergsmaal", NK.QUIZ.length === 10);
    NK.QUIZ.forEach(function (sp, n) {
        var unikke = sp.valg.filter(function (v, k) { return sp.valg.indexOf(v) === k; }).length === 4;
        var blandOk = true;
        for (i = 0; i < 100; i++) {
            var b = NK.quiz.bland(sp);
            if (b.valg[b.rigtig] !== sp.valg[sp.rigtig]) blandOk = false;
        }
        paastand("spoergsmaal " + (n + 1) + ": fire forskellige svar, blandingen holder styr paa det rigtige",
            sp.valg.length === 4 && unikke && !!sp.forklaring && blandOk);
    });

    overskrift("8. Sprog og notation");
    var tekster = [d.body.textContent];
    NK.QUIZ.forEach(function (sp) { tekster.push(sp.sp, sp.forklaring, sp.valg.join(" ")); });
    NK.TRIN.forEach(function (tr) { tekster.push(tr.tekst, tr.hint); });
    Object.keys(NK.IAGTTAGELSER).forEach(function (k) { tekster.push(NK.IAGTTAGELSER[k].tekst); });
    Object.keys(NK.Mikro.ETIKET).forEach(function (k) { tekster.push(NK.Mikro.ETIKET[k]); });
    var alt = tekster.join(" ");
    paastand("ingen tankestreger", !/[—–]/.test(alt));
    paastand("ingen ladning skrevet som 1+ eller 1−", !/[¹][⁺⁻]|[A-Za-z)\]₀-₉]1[+−-]/.test(alt));

    frisk();
}

function vis() {
    skriv("\n" + (fejl === 0 ? "ALT OK" : fejl + " FEJL"), fejl === 0 ? "ok" : "fejl");
    document.getElementById("ud").innerHTML = linjer.join("\n");
    document.title = (fejl === 0 ? "ALT OK" : fejl + " FEJL") + " - sc2.7";
}
</script>
</body>
</html>
