<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Selvtest - Opløselighed af blyiodid</title>
<style>
    body { background:#14141a; color:#e9eef4; font-family:Consolas,monospace; font-size:13px; margin:0; padding:14px; }
    pre { margin:0; line-height:1.45; white-space:pre-wrap; }
    .ok { color:#7ee0a8; } .fejl { color:#f0918a; } .h { color:#f2c53d; font-weight:700; }
    iframe { position:fixed; right:0; bottom:0; width:1300px; height:800px; opacity:0.001; pointer-events:none; }
</style>
</head>
<body>
<pre id="ud">Kører …</pre>
<iframe id="ramme" src="index.html"></iframe>
<script src="../../laboratoriet/js/proeve.js"></script>
<script src="../../laboratoriet/js/tjek.js"></script>
<script>
/* =====================================================================
   Udviklervaerktoej. Indgaar ikke i animationen og kan slettes.

   Aabner index.html i en iframe og koerer forsoeget igennem: PbI2's
   oploselighed og maetningstemperaturerne i stoftabellen, afvejningen
   (spatelspidser, at tage af, vaegtens tre decimaler og reglen for,
   hvad der maa haeldes i), varmepladen med magnetomroereren, de tre
   maalinger med facit fra verden og grafen i maalingskortet, Start
   forfra, oevelsestjekket (M2), det samme med musen, som en elev
   (proeve.js), grafen (graf.js, M9) med kendte tal, og til sidst quizzen
   og tegneserien.

   Skal aabnes gennem en lokal server (eller Chrome med
   --allow-file-access-from-files), ellers kan iframen ikke laeses.
   ===================================================================== */
var linjer = [];
var fejl = 0;
function skriv(t, k) { linjer.push(k ? '<span class="' + k + '">' + t + "</span>" : t); }
function paastand(navn, sand, note) {
    if (sand) skriv("  ok    " + navn + (note !== undefined ? "   (" + note + ")" : ""), "ok");
    else { fejl++; skriv("  FEJL  " + navn + (note !== undefined ? "   (" + note + ")" : ""), "fejl"); }
}
function overskrift(t) { skriv("\n" + t, "h"); }
function tal(x, d) { return Number(x).toFixed(d === undefined ? 2 : d).replace(".", ","); }

window.addEventListener("load", function () { setTimeout(koer, 1800); });

function koer() {
    try { koerTest(); } catch (e) { fejl++; skriv("UNDTAGELSE: " + e.message + "\n" + e.stack, "fejl"); }
    vis();
}

function koerTest() {
    var ramme = document.getElementById("ramme");
    var d = ramme.contentDocument, vin = ramme.contentWindow;
    var NK = vin.NK;
    if (NK && NK.Kemichael) NK.Kemichael.baggrundsliv(false);

    overskrift("1. Indlaesning");
    paastand("NK findes", !!NK);
    if (!NK) return;
    var bord = NK.bord, B = NK.Beholder, St = NK.Stof, V = NK.Vilkaar, M = NK.MAALING;
    var side = NK.Side.nu, F = NK.Forloeb.nu;
    NK.intro.luk();
    paastand("bordet er bygget", !!bord);
    paastand("skallen er den faelles side.js", !!side && side.navn === "sc27");
    /* Fem udloesere: husk_klar, de to, der gemmer et oejeblik til
       tegneserien, for_meget og tre_rigtige */
    paastand("forloebet har syv trin og fem udloesere", !!F && F.trin.length === 7 && F.udloesere.length === 5,
        F && F.trin.length + " trin, " + F.udloesere.length + " udloesere");
    var navne = ["dunk", "vaegt", "baad", "plade", "baeger", "maaleglas", "pb", "ki", "papir", "kurv", "spatler", "spatel", "termometer"];
    var mangler = navne.filter(function (n) { return !bord.g[n]; });
    paastand("udstyret staar paa bordet", !mangler.length, mangler.join(", ") || navne.length + " genstande");
    paastand("vejebaaden staar paa vaegten, bægerglasset paa varmepladen",
        bord.g.baad.paa === bord.g.vaegt && bord.g.baeger.paa === bord.g.plade);
    paastand("maaleglasset har 100 mL vand", Math.abs(B.volumen(bord.g.maaleglas) - 100) < 0.01);
    paastand("teksterne er skrevet ind fra tekst.js",
        d.getElementById("teori-indhold").textContent.indexOf("Opløseligheden") >= 0 &&
        d.getElementById("forloeb-tekst").textContent.indexOf("100 mL vand") >= 0);
    paastand("knappen Notér temperatur og kortet Målinger findes",
        !!d.getElementById("maaleknap") && !!d.getElementById("maaling-kort") &&
        d.getElementById("maaling-tom").textContent.indexOf("Ingen målinger") === 0);
    var alle = Object.keys(NK.Sprites.FILER);
    var klar = alle.filter(function (n) { return NK.Sprites.klar(n); });
    paastand("sprites er indlaest", klar.length === alle.length, klar.length + " af " + alle.length);
    paastand("vaegten viser tre decimaler og er tareret med vejebaaden", bord.vaegtTekst(bord.g.vaegt) === "0,000 g",
        bord.vaegtTekst(bord.g.vaegt));
    paastand("vejebaaden og pulverglassene kan ikke rystes, bægerglasset kan (F76)", !bord.kanRystes(bord.g.baad) &&
        !bord.kanRystes(bord.g.pb) && bord.kanRystes(bord.g.baeger));

    /* F73-F75: bøtterne er større, etiketten har kun formlen, og
       faremaerkerne staar paa etiketten og stort i panelet */
    var pb = bord.g.pb;
    paastand("pulverglassene er 1,45 gange motorens, og etiketten har kun formlen (F73)", pb.skala === 1.45 &&
        pb.etiket === "Pb(NO₃)₂" && Math.abs(pb.type.b - 38 * 1.45) < 1e-9 && !!pb.type.maerkeFelt, pb.type.b.toFixed(1) + " bred");
    var tegnet = [], ctxSpy = { save: function () {}, restore: function () {}, translate: function () {}, rotate: function () {}, scale: function () {},
        beginPath: function () {}, moveTo: function () {}, lineTo: function () {}, closePath: function () {}, fill: function () {}, stroke: function () {},
        quadraticCurveTo: function () {}, arc: function () {}, ellipse: function () {}, fillRect: function () {}, measureText: function (t) { return { width: t.length * 5 }; },
        fillText: function (t) { tegnet.push(t); }, strokeText: function () {} };
    NK.Tegning.tegnEtiket(ctxSpy, pb);
    paastand("formlen staar på etiketten med stor skrift", tegnet.indexOf("Pb(NO₃)₂") >= 0);
    var buer = 0;
    ctxSpy.arc = function () { buer++; };
    bord.mikro.tegnKant(ctxSpy, 1);
    paastand("zoomboblens kant er én cirkel uden glansbue (F72)", buer === 1, buer + " buer");
    bord.vaelg("pb");
    side.opdaterPanel();
    var fare = d.getElementById("glas-fare"), figurer = fare ? fare.querySelectorAll("figure") : [];
    paastand("det valgte pulverglas viser sine faremærker stort med navn (F74)", !!fare && !fare.hidden && figurer.length === 3 &&
        fare.textContent.indexOf("Brandnærende") >= 0 && fare.querySelector("canvas").getBoundingClientRect().width >= 36,
        fare ? fare.textContent : "intet felt");
    var formel = d.querySelector("#glas-titel .formel");
    paastand("formlen i overskriften står ikke med store bogstaver (F75)", !!formel && formel.textContent === "Pb(NO₃)₂" &&
        vin.getComputedStyle(formel).textTransform === "none", d.getElementById("glas-titel").textContent);
    bord.vaelg("ki");
    side.opdaterPanel();
    paastand("KI har ingen faremærker, og feltet er skjult", fare.hidden);
    bord.vaelg(null);
    side.opdaterPanel();
    paastand("graf.js er indlaest, og grafen er skjult, foer der er maalt (M9)", !!NK.Graf && d.getElementById("graf-boks").hidden);

    function adv(sek) { for (var k = 0; k < Math.round(sek * 20); k++) bord.opdater(0.05); F.opdater(); }
    var beskeder = [], vedB = bord.vedBesked;
    bord.vedBesked = function (t, s) { beskeder.push(t); if (vedB) vedB.call(bord, t, s); };
    function sidste() { return beskeder.length ? beskeder[beskeder.length - 1] : ""; }
    /* M9: farven i et punkt paa et laerred (CSS-pixel) og hvor mange
       pixel i laerredet, der har kurvens blaa */
    function farveI(c, x, y) {
        var k = c.width / (c.clientWidth || c.width);
        var px = c.getContext("2d").getImageData(Math.round(x * k), Math.round(y * k), 1, 1).data;
        return [px[0], px[1], px[2]];
    }
    function erGul(f) { return f[0] > 200 && f[1] > 160 && f[1] < 225 && f[2] < 120; }
    function blaaPixel(c) {
        var dd = c.getContext("2d").getImageData(0, 0, c.width, c.height).data, n = 0;
        for (var i = 0; i < dd.length; i += 4) if (dd[i + 2] > 170 && dd[i] < 130 && dd[i + 1] > 110 && dd[i + 1] < 200) n++;
        return n;
    }

    overskrift("2. Kemien: PbI2's oploselighed");
    var rx = St.REAKTIONER.filter(function (r) { return r.id === "pbi2"; })[0];
    paastand("faeldningen staar i stoftabellen med ΔH og ΔCp", !!rx && rx.slags === "faeld" && rx.dH > 0 && rx.dCp > 0,
        rx && "K " + rx.K + ", ΔH " + rx.dH + " kJ/mol, ΔCp " + rx.dCp + " J/(mol·K)");
    /* Oploeseligheden i g pr. 100 mL: Ksp = 4s³ (mM), m = s · 461 · 0,1 mg */
    function opl(T) { return Math.pow(St.Kved(rx, T) / 4, 1 / 3) * 461 * 1e-4; }
    [[0, 0.044, 0.003], [20, 0.069, 0.003], [100, 0.41, 0.02]].forEach(function (p) {
        paastand("oploeseligheden ved " + p[0] + " °C er " + tal(p[1], 3) + " g pr. 100 mL", Math.abs(opl(p[0]) - p[1]) <= p[2],
            tal(opl(p[0]), 4) + " g");
    });
    var stiger = true;
    for (var tt = 0; tt < 100; tt += 5) if (!(St.Kved(rx, tt + 5) > St.Kved(rx, tt))) stiger = false;
    paastand("K stiger hele vejen fra 0 til 100 °C", stiger);
    function glas(gPb, gKI, T) {
        return { V: 100, T: T === undefined ? 20 : T, n: { "Pb2+": gPb / 331.2 * 1e6, "NO3-": 2 * gPb / 331.2 * 1e6,
            "K+": gKI / 166 * 1e6, "I-": gKI / 166 * 1e6 } };
    }
    [[0.100, 51.5], [0.150, 69.7], [0.200, 82.6]].forEach(function (p) {
        var t = St.maetningsT(glas(p[0], p[0]), rx);
        paastand("de foerste krystaller ved " + tal(p[0], 3) + " g af hvert salt: ca. " + tal(p[1], 0) + " °C (som den gamle)",
            t !== null && Math.abs(t - p[1]) < 1.5, t === null ? "null" : tal(t, 1) + " °C");
    });
    var o1 = glas(0.1, 0.1);
    paastand("ved maetningstemperaturen er ionproduktet K", Math.abs(St.ionprodukt(o1, rx) / St.Kved(rx, St.maetningsT(o1, rx)) - 1) < 1e-6);
    paastand("bundet PbI2 taeller med i maetningen", (function () {
        var o2 = glas(0.1, 0.1); o2.n["Pb2+"] -= 100; o2.n["I-"] -= 200; o2.n["PbI2(s)"] = 100;
        return Math.abs(St.maetningsT(o2, rx) - St.maetningsT(o1, rx)) < 1e-6;
    }()));
    /* Bundfaldet oploeses hurtigere under omroering (fartOploes) */
    function oploesTid(s) {
        var o = { V: 100, T: 70, n: { "PbI2(s)": 300, "K+": 600, "NO3-": 600 } };
        for (var i = 0; i < 2000; i++) {
            St.skridt(o, 0.05, [rx], s);
            if ((o.n["PbI2(s)"] || 0) < 1) return i * 0.05;
        }
        return Infinity;
    }
    var med = oploesTid({ roer: true }), uden = oploesTid({});
    paastand("bundfaldet oploeses hurtigere under omroering", med * 2 < uden, tal(med, 1) + " s med, " + tal(uden, 1) + " s uden");
    var o3 = glas(0.1, 0.1, 20);
    for (var i3 = 0; i3 < 200; i3++) St.skridt(o3, 0.05, [rx], {});
    var fast3 = (o3.n["PbI2(s)"] || 0) * 461e-6;
    paastand("ved 20 °C falder 0,146 − 0,069 g PbI2 ud", Math.abs(fast3 - (0.1 / 331.2 * 461 - 0.0688)) < 0.004, tal(fast3, 4) + " g");
    paastand("PbI2 farver vaesken tydeligt gul, naar det hvirvler rundt (daekke)", St.uklar(o3) > 0.3 &&
        St.fastFarve({ V: 100, n: { "PbI2(s)": 10, "KI(s)": 500 } }, true).b < 60, tal(St.uklar(o3)));

    overskrift("3. Afvejningen");
    NK.startForfra();
    adv(0.5);
    var baad = bord.g.baad, pb = bord.g.pb, ki = bord.g.ki;
    function gram() { var f = St.faste(baad.indhold)[0]; return f ? f.umol * f.stof.M * 1e-6 : 0; }
    function vist() { return parseFloat(bord.vaegtTekst(bord.g.vaegt).replace(",", ".")); }
    function renSpatel() {
        return bord.liste.filter(function (x) { return x.type.navn === "spatel" && !x.autoFor && !x.last && !x.svaev; })[0];
    }
    function afvej(jar, lo, hi) {
        var n = 0;
        while (vist() < lo && n++ < 20) { bord.moede(bord.g[jar], baad); adv(3.5); }
        n = 0;
        while (vist() > hi && n++ < 30) { var sp = renSpatel(); bord.moede(sp, baad); adv(2.5); bord.moede(sp, bord.g.kurv); adv(2); }
        return vist();
    }
    function tilDunk() { bord.moede(baad, bord.g.dunk); adv(4); }
    paastand("spatlen er den gamle sc2.7's", NK.SPATEL.spids[0] === 0.038 && NK.SPATEL.spids[1] === 0.062 &&
        NK.SPATEL.af[0] === 0.004 && NK.SPATEL.af[1] === 0.016 &&
        pb.spec.spatelGram === NK.SPATEL.spids && ki.spec.spatelGram === NK.SPATEL.spids && baad.spec.spatelGram === NK.SPATEL.af);
    var spidser = [], foer = 0;
    for (var s1 = 0; s1 < 6; s1++) { bord.moede(pb, baad); adv(3.5); spidser.push(gram() - foer); foer = gram(); }
    paastand("en spatelspids er 0,038-0,062 g", spidser.every(function (x) { return x > 0.038 - 1e-6 && x < 0.062 + 1e-6; }),
        spidser.map(function (x) { return tal(x, 3); }).join(" "));
    paastand("og forskellig hver gang", spidser.some(function (x) { return Math.abs(x - spidser[0]) > 0.001; }));
    paastand("vaegten viser massen med tre decimaler", bord.vaegtTekst(bord.g.vaegt) === tal(Math.round(gram() * 1000) / 1000, 3) + " g",
        bord.vaegtTekst(bord.g.vaegt) + " for " + tal(gram(), 5) + " g");
    paastand("vejebaaden er noget, en tom spatel kan tage af", bord.kanTageAf(baad) && !bord.kanTageAf(bord.g.baeger));
    var af = [];
    for (var s2 = 0; s2 < 4; s2++) {
        var sp2 = renSpatel(), g0 = gram();
        bord.moede(sp2, baad); adv(2.5);
        af.push(g0 - gram());
        bord.moede(sp2, bord.g.kurv); adv(2);
    }
    paastand("en tom spatel tager 0,004-0,016 g af", af.every(function (x) { return x > 0.004 - 1e-6 && x < 0.016 + 1e-6; }),
        af.map(function (x) { return tal(x, 3); }).join(" "));
    paastand("og kommer i kurven, hvor den skiftes ud med en ren (F68)",
        beskeder.indexOf("Spatlen er skiftet ud med en ren.") >= 0 && !!renSpatel());
    tilDunk();
    paastand("vejebaaden kan toemmes i dunken og staar paa vaegten igen", gram() === 0 && baad.paa === bord.g.vaegt &&
        bord.vaegtTekst(bord.g.vaegt) === "0,000 g", bord.vaegtTekst(bord.g.vaegt));

    /* Reglen: hvad der maa haeldes i bægerglasset */
    var baeger = bord.g.baeger;
    bord.moede(bord.g.maaleglas, baeger); adv(6);
    paastand("maaleglasset giver hele sine 100 mL i ét tryk", Math.abs(B.volumen(baeger) - 100) < 0.05, tal(B.volumen(baeger), 1) + " mL");
    function iGlasset(navn) { return V.tilsatGram(B.samlet(baeger), navn); }
    afvej("ki", 0.095, 0.105);
    beskeder.length = 0;
    bord.moede(baad, baeger); adv(4);
    paastand("KI foer Pb(NO3)2 afvises", iGlasset("KI(s)") === 0 && sidste() === NK.TEKST.maaling["foerst-pb"], sidste());
    paastand("og vejebaaden gaar hjem til vaegten og vejes igen", baad.paa === bord.g.vaegt && vist() > 0.09 && !baad.svaev,
        bord.vaegtTekst(bord.g.vaegt));
    tilDunk();
    bord.moede(pb, baad); adv(3.5);
    var enSpids = vist();
    bord.moede(baad, baeger); adv(4);
    paastand("én spatelspids Pb(NO3)2 er for lidt første gang", iGlasset("Pb(NO3)2(s)") === 0 &&
        sidste().indexOf("mellem 0,090 og 0,110 g") > 0 && sidste().indexOf(tal(enSpids, 3)) > 0, sidste());
    var mPb = afvej("pb", 0.093, 0.107);
    beskeder.length = 0;
    bord.moede(baad, baeger); adv(4);
    paastand("0,090-0,110 g Pb(NO3)2 kommer i", Math.abs(iGlasset("Pb(NO3)2(s)") - mPb) < 0.0006 && M.ventKI && M.sidstePb === mPb,
        tal(mPb, 3) + " g");
    paastand("trinnet Pb(NO3)2 er gjort", F.erGjort("vand") && F.erGjort("pb") && !F.erGjort("ki"));
    afvej("pb", 0.040, 0.060);
    bord.moede(baad, baeger); adv(4);
    paastand("mere Pb(NO3)2, foer KI er kommet i, afvises", sidste() === NK.TEKST.maaling["foerst-ki"], sidste());
    tilDunk();
    afvej("ki", 0.030, mPb - 0.012);
    bord.moede(baad, baeger); adv(4);
    paastand("KI mere end 0,010 g fra Pb(NO3)2 afvises", iGlasset("KI(s)") === 0 && sidste().indexOf("samme masse") > 0, sidste());
    afvej("ki", mPb - 0.006, mPb + 0.006);
    var mKI = vist();
    bord.moede(baad, baeger); adv(4);
    paastand("samme masse KI kommer i", Math.abs(iGlasset("KI(s)") - mKI) < 0.0006 && !M.ventKI, tal(mKI, 3) + " g mod " + tal(mPb, 3) + " g");
    paastand("trinnet KI er gjort", F.erGjort("ki"));
    bord.moede(pb, baad); adv(3.5);
    bord.moede(ki, baad); adv(3.5);
    bord.moede(baad, baeger); adv(4);
    paastand("to stoffer paa vejebaaden afvises", sidste() === NK.TEKST.maaling.blandet, sidste());
    tilDunk();
    afvej("pb", 0.095, 0.105);
    bord.moede(baad, baeger); adv(4);
    paastand("anden gang er 0,100 g for meget (0,040-0,060 g)", sidste().indexOf("mellem 0,040 og 0,060 g") > 0, sidste());
    tilDunk();
    paastand("afvisningerne har ikke flyttet noget i glasset", Math.abs(iGlasset("Pb(NO3)2(s)") - mPb) < 0.0006 &&
        Math.abs(iGlasset("KI(s)") - mKI) < 0.0006);
    var tm = bord.g.termometer;
    side.noterTemperatur();
    paastand("uden termometer i glasset kan der ikke noteres", M.journal.antal() === 0 && sidste() === NK.TEKST.maaling.termometer, sidste());
    bord.moede(tm, baeger); adv(3);
    paastand("termometeret sidder i bægerglasset", tm.i === baeger);
    side.noterTemperatur();
    paastand("med bundfald fra start: »varm op, til bundfaldet er væk«", M.journal.antal() === 0 && sidste() === NK.TEKST.maaling["ikke-klar"], sidste());

    overskrift("4. Varmepladen med magnetomroerer");
    var plade = bord.g.plade, rp = bord.rekt(plade, 0);
    var venstre = { x: rp.x + rp.b * 0.25, y: rp.y + rp.h * 0.6 }, hoejre = { x: rp.x + rp.b * 0.75, y: rp.y + rp.h * 0.6 };
    paastand("pladen har effekt, traeghed og omroerer", plade.spec.effekt === 1100 && plade.spec.traeghed === 2.2 && !!plade.kan.omroerer);
    bord.klik("plade", hoejre);
    paastand("et klik paa hoejre halvdel taender omroeringen", !!plade.omroerer && !plade.taendt && sidste() === "Omrøringen er tændt.", sidste());
    paastand("og glasset paa pladen roeres", bord.omgivelser(baeger).roer === true);
    bord.klik("plade", venstre);
    paastand("et klik paa venstre halvdel taender varmen", !!plade.taendt && !!plade.omroerer);
    adv(10);
    var T0 = B.samlet(baeger).T;
    adv(2);
    var T1 = B.samlet(baeger).T, midt = (T0 + T1) / 2;
    var brutto = (T1 - T0) / 2 + (midt - 20) / B.TEMP.tauLuft;
    paastand("1100 W varmer 100 mL med ca. 2,6 °C/s (som den gamle)", Math.abs(brutto - 2.63) < 0.35,
        tal((T1 - T0) / 2) + " °C/s netto ved " + tal(midt, 0) + " °C, " + tal(brutto) + " °C/s brutto");
    var n0 = 0;
    while (!M.klar(baeger) && n0++ < 200) adv(0.5);
    var Tklar = B.samlet(baeger).T, facit1 = M.maetning(baeger);
    paastand("glasset bliver klart lidt over maetningstemperaturen", M.klar(baeger) && Tklar > facit1 && Tklar < facit1 + 8,
        "klart ved " + tal(Tklar, 1) + " °C, maetning " + tal(facit1, 1) + " °C");
    paastand("trinnet »varm op« er gjort", F.erGjort("klar"));
    adv(1);
    paastand("i det klare glas er der ingen krystaller at se", !(baeger.flager || []).length);
    side.noterTemperatur();
    paastand("klart og varmt: »der er ingen krystaller endnu«", M.journal.antal() === 0 && sidste() === NK.TEKST.maaling["ingen-krystaller"], sidste());
    bord.klik("plade", venstre);
    bord.klik("plade", hoejre);
    paastand("begge knapper slukker igen", !plade.taendt && !plade.omroerer && bord.omgivelser(baeger).roer === false);

        Qz.tilstand === "klar" && d.getElementById("quiz-tekst").textContent === NK.TEKST.quiz.klar, Qz.tilstand);
    Qz.knap();
    paastand("foerste spoergsmaal kommer med fire knapper", Qz.tilstand === "sp" &&
        d.getElementById("quiz-valg").querySelectorAll(".valgknap").length === 4 &&
        d.getElementById("quiz-taeller").textContent === "1/10",
        d.getElementById("quiz-taeller").textContent);
    var forkert = (Qz.aktuel.rigtig + 1) % 4;
    paastand("et forkert svar giver forklaringen, ikke bare et kryds", Qz.svar(forkert) === false &&
        d.getElementById("quiz-forklaring").className.indexOf("skidt") >= 0 &&
        d.getElementById("quiz-forklaring").textContent.indexOf("Forkert.") === 0 &&
        d.getElementById("quiz-forklaring").textContent.length > 40);
    for (var q1 = 0; q1 < 20 && Qz.tilstand === "sp"; q1++) { Qz.knap(); if (Qz.tilstand === "sp") Qz.svarRigtigt(); }
    paastand("resten rigtigt giver 9 af 10 til sidst", Qz.tilstand === "slut" &&
        d.getElementById("quiz-score").textContent === "9 / 10", d.getElementById("quiz-score").textContent);

    overskrift("11. Tegneserien: sc2.7's ruder af elevens egne tal (S29, M9)");
    /* Rammen staar i ../../laboratoriet/js/tegneserie.js, ruderne i
       js/serie.js. Ruderne tegnes af journalen og af de oejeblikke,
       forloebets udloesere har gemt - ikke af bordet, som det ser ud nu. */
    var TS = NK.Tegneserie, SR = NK.SERIE, serie = side.serie;
    paastand("rammen findes, og forsoeget har sin egen liste over ruder",
        !!TS && !!serie && !!SR && typeof SR.ruder === "function");
    paastand("forloebet har gemt de tre oejeblikke: vandet, bundfaldet og det klare glas",
        !!SR.OEJEBLIKKE.vand && !!SR.OEJEBLIKKE.bundfald && !!SR.OEJEBLIKKE.klar,
        Object.keys(SR.OEJEBLIKKE).join(", "));
    paastand("bundfaldets oejeblik har et bundfald i sig (over 0,05 mmol PbI2)",
        (SR.OEJEBLIKKE.bundfald.opl.umol["PbI2(s)"] || 0) > 50,
        Math.round(SR.OEJEBLIKKE.bundfald.opl.umol["PbI2(s)"] || 0) + " µmol");
    paastand("og det klare glas var varmt og uden fast stof",
        SR.OEJEBLIKKE.klar.T > 40 && !(SR.OEJEBLIKKE.klar.opl.umol["PbI2(s)"] > 0.5),
        tal(SR.OEJEBLIKKE.klar.T, 1) + " °C");
    paastand("med tre maalinger, men uden oprydning, er tegneserien stadig laast",
        serie.laast() && d.getElementById("serieknap").disabled && serie.aabn() === false);
    paastand("og knappen siger med forsoegets egne ord hvorfor",
        d.getElementById("serie-laast").textContent === NK.TEKST.serie.laast);

    bord.moede(baeger, bord.g.dunk);
    adv(6);
    F.opdater();
    side.opdaterPanel();
    paastand("naar resterne er afleveret, aabner laasen af sig selv",
        !serie.laast() && !d.getElementById("serieknap").disabled && B.tom(baeger));
    paastand("tegneserien aabner", serie.aabn() === true && d.getElementById("serie").classList.contains("vis"));
    var ruder = d.getElementById("serie-ruder").querySelectorAll(".rude");
    paastand("den har en rude for hvert skridt, grafen og skemaet", ruder.length === 8, ruder.length + " ruder");
    paastand("hver rude har et nummer og en tekst", [].every.call(ruder, function (r) {
        return r.querySelector(".nr") && r.textContent.length > 12;
    }));
    paastand("grafen staar i sin egen brede rude (M9)",
        ruder[6].className.indexOf("bred") >= 0 && !!ruder[6].querySelector("canvas") &&
        ruder[6].textContent.indexOf("tabelværdierne") > 0);
    var skema = d.getElementById("serie-ruder").querySelector(".rude.bred table.resultater");
    paastand("skemaet har en raekke pr. maaling med masserne, elevens tal og verdens",
        !!skema && skema.querySelectorAll("tr").length === 4 &&
        skema.querySelectorAll("tr")[1].textContent.indexOf("0,100 g") >= 0 &&
        skema.querySelectorAll("tr")[1].textContent.indexOf(tal(M.journal.post("1").svar, 1) + " °C") >= 0,
        skema ? skema.querySelectorAll("tr")[1].textContent : "intet skema");
    paastand("og konklusionen siger, at punkterne ligger paa kurven",
        d.getElementById("serie-ruder").textContent.indexOf(NK.TEKST.serie.skema.konklusion) > 0);

    /* Den vigtigste paastand: ruden viser glasset, som det saa ud, og ikke
       som det ser ud nu. Glasset er tomt paa bordet - bundfaldsruden har
       stadig sit bundfald. */
    function rudeData(n) {
        var c = d.getElementById("serie-ruder").querySelectorAll(".rude")[n].querySelector("canvas");
        return c ? c.toDataURL() : "";
    }
    var foer = rudeData(2);
    B.haeldI(baeger, St.lav({ V: 60, T: 20, mM: {} }), true);
    adv(2);
    serie.luk();
    serie.aabn();
    paastand("glasset er fyldt med rent vand nu, men bundfaldsruden viser stadig bundfaldet",
        B.volumen(baeger) > 50 && rudeData(2) === foer && foer.length > 1000);
    serie.luk();
    serie.aabn();
    paastand("og den samme rude ser ens ud, hver gang serien aabnes", rudeData(2) === foer);

    /* Kogte det med bundfald i, faar det sin egen roede rude */
    B.tilsaetFast(baeger, "PbI2(s)", 3000);
    bord.g.plade.taendt = true;
    var n11 = 0;
    while (!baeger.koger && n11++ < 300) adv(0.5);
    adv(2);
    bord.g.plade.taendt = false;
    paastand("kogte det med bundfald i, er det gemt som et oejeblik", !!SR.OEJEBLIKKE.koger,
        Object.keys(SR.OEJEBLIKKE).join(", "));
    bord.uheld("spild", baeger, "");
    bord.moede(baeger, bord.g.dunk);
    adv(6);
    side.opdaterPanel();
    serie.luk();
    serie.aabn();
    ruder = d.getElementById("serie-ruder").querySelectorAll(".rude");
    paastand("og saa er der to roede ruder: det, der kogte, og uheldet",
        d.getElementById("serie-ruder").querySelectorAll(".rude.fejl").length === 2,
        d.getElementById("serie-ruder").querySelectorAll(".rude.fejl").length + " roede ruder");

    serie.luk();
    paastand("Luk lukker serien", !serie.aaben());
    d.getElementById("serieknap").click();
    paastand("knappen i panelet aabner den", serie.aaben());
    side.lukOverlay();
    paastand("Esc lukker ethvert overlay, ogsaa denne", !serie.aaben());

    NK.startForfra();
    adv(1);
    side.opdaterPanel();
    paastand("Start forfra laaser quizzen og tegneserien og rydder begge",
        Qz.tilstand === "laast" && Qz.nr === 0 && serie.laast() &&
        d.getElementById("serie-ruder").children.length === 0 && !Object.keys(SR.OEJEBLIKKE).length,
        Qz.tilstand + ", " + Object.keys(SR.OEJEBLIKKE).length + " oejeblikke");

}

function vis() {
    skriv("\n" + (fejl ? fejl + " FEJL" : "ALT OK"), fejl ? "fejl" : "ok");
    document.getElementById("ud").innerHTML = linjer.join("\n");
}
</script>
