<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Oxygenatom til kugle-stang-modellen. Kuglen har centrum i (64, 64)
       og radius 60. Lyset kommer oppefra til venstre. -->
  <defs>
    <radialGradient id="krop" cx="0.38" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#ffa396"/>
      <stop offset="0.5" stop-color="#d93a2a"/>
      <stop offset="1" stop-color="#560d07"/>
    </radialGradient>
    <radialGradient id="glans" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="genskin" cx="0.72" cy="0.82" r="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#krop)"/>
  <circle cx="64" cy="64" r="60" fill="url(#genskin)"/>
  <ellipse cx="46" cy="40" rx="19" ry="12" transform="rotate(-38 46 40)" fill="url(#glans)"/>
  <circle cx="64" cy="64" r="59.3" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="1.4"/>
</svg>
