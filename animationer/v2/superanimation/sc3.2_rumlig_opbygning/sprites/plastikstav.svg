<svg xmlns="http://www.w3.org/2000/svg" width="200" height="14" viewBox="0 0 200 14">
  <!-- Plastikstav. Spidsen er venstre ende (0, 7); animationen drejer
       staven om den. Ladningen tegnes i koden. -->
  <defs>
    <linearGradient id="krop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7180"/>
      <stop offset="0.35" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#15171c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="198" height="12" rx="6" fill="url(#krop)" stroke="#0b0d10" stroke-width="1"/>
  <rect x="8" y="3" width="184" height="2.4" rx="1.2" fill="#ffffff" fill-opacity="0.22"/>
</svg>
