<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Der er en lille rest kobber(II)sulfatopløsning i bunden af
       baegerglasset. En tragt er sat i flaskens hals, og affaldsdunken
       staar ved siden af. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="dunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dfe1"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d4"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <g id="ghs07">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <rect x="-5" y="-26" width="10" height="34" rx="4" fill="#111"/>
      <circle cy="18" r="6" fill="#111"/>
    </g>
    <g id="ghs09">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <path d="M-15 17 V-15 M-15 -8 L-23 -17 M-15 -3 L-6 -14" stroke="#111" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-3 11 q9 -9 19 0 q-10 9 -19 0 Z M16 11 l6 -4.5 v9 Z" fill="#111"/>
      <path d="M-22 20 h44" stroke="#111" stroke-width="4"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Stamflasken med kobbersulfat og en tragt i halsen -->
  <g transform="translate(250 266)">
    <ellipse cx="90" cy="276" rx="104" ry="13" fill="#000" opacity="0.28"/>
    <path d="M8 150 V256 Q8 272 24 272 H156 Q172 272 172 256 V150 Z" fill="#3d8fd6" fill-opacity="0.6"/>
    <path d="M70 38 H110 V62 C110 80 176 84 176 116 V256 Q176 276 156 276 H24 Q4 276 4 256 V116 C4 84 70 80 70 62 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <rect x="24" y="130" width="132" height="122" rx="6" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="90" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">CuSO<tspan font-size="16" dy="6">4</tspan><tspan dy="-6"> (aq)</tspan></text>
    <text x="90" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#4a4f57">0,1 M</text>
    <use href="#ghs07" transform="translate(64 222) scale(0.38)"/>
    <use href="#ghs09" transform="translate(116 222) scale(0.38)"/>
    <path d="M18 120 V250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <!-- Tragt -->
    <path d="M22 -40 H158 L100 30 V64 H80 V30 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <!-- Laaget ligger ved siden af -->
  <g transform="translate(160 640) rotate(-10)">
    <ellipse cx="4" cy="30" rx="40" ry="8" fill="#000" opacity="0.3"/>
    <rect x="-30" y="-16" width="60" height="42" rx="6" fill="#2d2d2d"/>
    <ellipse cx="0" cy="-16" rx="30" ry="8" fill="#3c3c3c"/>
  </g>

  <!-- Baegerglas med en lille rest i bunden -->
  <g transform="translate(560 356)">
    <ellipse cx="80" cy="190" rx="92" ry="11" fill="#000" opacity="0.28"/>
    <path d="M12 162 V172 Q12 188 28 188 H132 Q148 188 148 172 V162 Z" fill="#3d8fd6" fill-opacity="0.7"/>
    <path d="M12 162 H148" stroke="#8cc7ea" stroke-width="3"/>
    <path d="M0 0 H160 L148 14 V172 Q148 188 132 188 H28 Q12 188 12 172 V14 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#9dbdd1" stroke-width="2.5" stroke-linecap="round">
      <path d="M112 50 h24 M120 84 h16 M112 118 h24 M120 152 h16"/>
    </g>
    <path d="M40 16 q-4 30 2 60 M58 14 q3 20 -1 38" fill="none" stroke="#3d8fd6" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 30 V170" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Affaldsdunk -->
  <g transform="translate(860 226)">
    <ellipse cx="120" cy="312" rx="140" ry="14" fill="#000" opacity="0.28"/>
    <rect x="150" y="0" width="56" height="34" rx="6" fill="#e6892a"/>
    <path d="M150 10 h56 M150 20 h56" stroke="#b96613" stroke-width="2"/>
    <path d="M40 30 H110 V52 H20 Q20 30 40 30 Z" fill="url(#dunk)" stroke="#b9c3c6" stroke-width="3"/>
    <path d="M14 48 H226 Q240 48 240 62 V296 Q240 312 224 312 H16 Q0 312 0 296 V62 Q0 48 14 48 Z" fill="url(#dunk)" stroke="#b9c3c6" stroke-width="3"/>
    <rect x="130" y="34" width="96" height="18" rx="4" fill="url(#dunk)" stroke="#b9c3c6" stroke-width="3"/>
    <rect x="24" y="110" width="192" height="150" rx="6" fill="#f2c53d"/>
    <text x="120" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#1f2328">AFFALD</text>
    <text x="120" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">Tungmetaller</text>
    <use href="#ghs09" transform="translate(120 224) scale(0.42)"/>
  </g>
</svg>
