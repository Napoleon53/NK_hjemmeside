<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Oevelsen er ikke gaaet i gang: flaskerne er lukkede, og vejledningen
       er ikke laest. Handskerne er allerede paa, der scrolles paa mobilen,
       og en handske er pustet op til en ballon med ansigt. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="ballon" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#a9c6fa"/>
      <stop offset="0.6" stop-color="#6b98f0"/>
      <stop offset="1" stop-color="#3f6fd0"/>
    </radialGradient>
    <linearGradient id="handske" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb3f7"/>
      <stop offset="0.5" stop-color="#5b8def"/>
      <stop offset="1" stop-color="#3563c4"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Lukkede flasker og tomt baegerglas -->
  <g transform="translate(560 370)">
    <ellipse cx="40" cy="104" rx="50" ry="7" fill="#000" opacity="0.25"/>
    <rect x="26" y="0" width="28" height="18" rx="3" fill="#2c6fb3"/>
    <path d="M30 18 H50 V28 C50 36 78 38 78 52 V96 Q78 104 70 104 H10 Q2 104 2 96 V52 C2 38 30 36 30 28 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <rect x="12" y="52" width="56" height="34" rx="3" fill="#fbfaf5"/>
  </g>
  <g transform="translate(680 360)">
    <ellipse cx="40" cy="114" rx="50" ry="7" fill="#000" opacity="0.25"/>
    <rect x="26" y="0" width="28" height="18" rx="3" fill="#2d2d2d"/>
    <path d="M30 18 H50 V30 C50 38 78 40 78 54 V106 Q78 114 70 114 H10 Q2 114 2 106 V54 C2 40 30 38 30 30 Z" fill="#6b3a17"/>
    <rect x="12" y="58" width="56" height="34" rx="3" fill="#f4efe4"/>
  </g>
  <g transform="translate(470 404)">
    <ellipse cx="44" cy="82" rx="52" ry="7" fill="#000" opacity="0.25"/>
    <path d="M0 0 H88 L82 7 V72 Q82 80 74 80 H14 Q6 80 6 72 V7 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Handskeaeske -->
  <g transform="translate(920 350)">
    <ellipse cx="110" cy="124" rx="120" ry="10" fill="#000" opacity="0.25"/>
    <path d="M70 20 q10 -40 30 -30 q16 8 10 -20 q24 16 14 40 q20 -10 22 10" fill="#5b8def" stroke="#3563c4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="0" y="16" width="220" height="108" rx="6" fill="#ffffff" stroke="#b9c3c6" stroke-width="3"/>
    <ellipse cx="110" cy="24" rx="60" ry="10" fill="#3563c4"/>
    <rect x="0" y="92" width="220" height="32" fill="#2c6fb3"/>
    <text x="110" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">Nitrilhandsker</text>
    <text x="110" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">M</text>
  </g>

  <!-- Oevelsesvejledning, ulaest -->
  <g transform="translate(150 640) rotate(4)">
    <rect x="-130" y="-80" width="270" height="170" rx="3" fill="#fbfaf5"/>
    <text x="-108" y="-44" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1f2328">Øvelsesvejledning</text>
    <path d="M-108 -14 h200 M-108 14 h170 M-108 42 h210" stroke="#b7bec4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Handskeballon med ansigt -->
  <g transform="translate(380 520)">
    <ellipse cx="0" cy="104" rx="120" ry="14" fill="#000" opacity="0.28"/>
    <g fill="url(#ballon)" stroke="#3563c4" stroke-width="4">
      <ellipse cx="-66" cy="-104" rx="26" ry="52" transform="rotate(-34 -66 -104)"/>
      <ellipse cx="-22" cy="-128" rx="26" ry="56" transform="rotate(-10 -22 -128)"/>
      <ellipse cx="26" cy="-126" rx="26" ry="56" transform="rotate(10 26 -126)"/>
      <ellipse cx="68" cy="-100" rx="24" ry="50" transform="rotate(34 68 -100)"/>
      <ellipse cx="-104" cy="-6" rx="24" ry="50" transform="rotate(-72 -104 -6)"/>
      <ellipse cx="0" cy="-8" rx="96" ry="88"/>
    </g>
    <path d="M-20 76 Q0 96 20 76 L12 100 H-12 Z" fill="#3f6fd0" stroke="#3563c4" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-44 -50 q10 -34 36 -30" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
    <g fill="#12213d">
      <circle cx="-30" cy="-12" r="9"/>
      <circle cx="30" cy="-12" r="9"/>
    </g>
    <path d="M-36 22 Q0 58 36 22" fill="none" stroke="#12213d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Dine haender i handsker med mobilen -->
  <g transform="translate(830 560) rotate(-8)">
    <rect x="-86" y="-120" width="172" height="300" rx="22" fill="#1f2328"/>
    <rect x="-74" y="-104" width="148" height="262" rx="10" fill="#2f4858"/>
    <rect x="-74" y="-104" width="148" height="110" fill="#e0703a"/>
    <path d="M-14 -70 L22 -50 L-14 -30 Z" fill="#ffffff"/>
    <path d="M-60 30 h110 M-60 56 h80 M-60 90 h110 M-60 116 h70" stroke="#6f8a99" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M640 740 Q650 640 720 600 Q760 580 780 610 Q800 640 790 700 L780 740 Z" fill="url(#handske)" stroke="#3563c4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M734 612 Q744 560 776 546 Q796 540 796 560 Q792 590 770 620" fill="url(#handske)" stroke="#3563c4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="600" y="700" width="200" height="40" rx="10" transform="rotate(-6 700 720)" fill="#3563c4"/>
  </g>
  <g>
    <path d="M1090 740 Q1060 640 1000 610 Q960 596 940 620 L930 660 Q950 700 990 740 Z" fill="url(#handske)" stroke="#3563c4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M960 624 Q920 590 880 560" fill="none" stroke="#3563c4" stroke-width="32" stroke-linecap="round"/>
    <path d="M960 624 Q920 590 880 560" fill="none" stroke="#6b98f0" stroke-width="26" stroke-linecap="round"/>
    <rect x="980" y="700" width="200" height="40" rx="10" transform="rotate(10 1080 720)" fill="#3563c4"/>
  </g>
</svg>
