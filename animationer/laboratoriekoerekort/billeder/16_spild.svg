<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Der er spildt en klar oploesning paa bordet. Den kan vaere
       natriumchlorid eller saltsyre; det kan ingen se. En arm er paa vej
       ned i pytten, og koekkenrullen staar ubrugt. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="rulle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dcdcd4"/>
      <stop offset="0.4" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d2d2ca"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <g id="ghs05">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <path d="M-22 -19 l14 -7 l4 8 l-14 7 Z M4 -23 l14 6 l-3.5 8 l-14 -6 Z" fill="#111"/>
      <circle cx="-9" cy="-3" r="3.4" fill="#111"/>
      <circle cx="11" cy="-3" r="3.4" fill="#111"/>
      <path d="M-23 12 h18 v8 h-18 Z M4 11 q10 -4 19 2 v7 h-19 Z" fill="#111"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Koekkenrulle -->
  <g transform="translate(110 330)">
    <ellipse cx="60" cy="196" rx="74" ry="11" fill="#000" opacity="0.28"/>
    <rect x="52" y="-20" width="16" height="210" rx="4" fill="#8e9a99"/>
    <rect x="0" y="12" width="120" height="176" rx="8" fill="url(#rulle)"/>
    <ellipse cx="60" cy="12" rx="60" ry="14" fill="#f4f4ee" stroke="#d2d2ca" stroke-width="2"/>
    <ellipse cx="60" cy="12" rx="20" ry="6" fill="#c8a978"/>
    <path d="M118 60 Q140 90 132 150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 60 H110 M10 110 H110 M10 160 H110" stroke="#e2e2da" stroke-width="2" stroke-dasharray="4 6"/>
  </g>

  <!-- Natriumchlorid, hvid plastflaske -->
  <g transform="translate(470 336)">
    <ellipse cx="70" cy="200" rx="84" ry="11" fill="#000" opacity="0.28"/>
    <rect x="46" y="0" width="48" height="34" rx="5" fill="#2e9b52"/>
    <path d="M52 34 H88 V50 C88 64 138 66 138 90 V186 Q138 200 124 200 H16 Q2 200 2 186 V90 C2 66 52 64 52 50 Z" fill="#ffffff" stroke="#b9c3c6" stroke-width="3"/>
    <rect x="16" y="98" width="108" height="80" rx="5" fill="#eef4f3" stroke="#c7d3d2" stroke-width="2"/>
    <text x="70" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2328">NaCl (aq)</text>
    <text x="70" y="156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#4a4f57">1 M</text>
  </g>

  <!-- Saltsyre ved siden af -->
  <g transform="translate(700 350)">
    <ellipse cx="66" cy="188" rx="80" ry="11" fill="#000" opacity="0.28"/>
    <rect x="46" y="0" width="40" height="32" rx="5" fill="#2c6fb3"/>
    <path d="M50 32 H82 V48 C82 62 130 64 130 88 V174 Q130 188 116 188 H16 Q2 188 2 174 V88 C2 64 50 62 50 48 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <rect x="14" y="94" width="104" height="82" rx="5" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="66" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2328">HCl (aq)</text>
    <use href="#ghs05" transform="translate(66 154) scale(0.34)"/>
  </g>

  <!-- Klar pyt, som kun kan ses paa genskinnet -->
  <path d="M360 590 Q420 560 520 566 Q640 560 700 590 Q730 616 660 636 Q560 660 460 648 Q350 640 340 614 Q336 600 360 590 Z" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
  <g fill="#ffffff">
    <ellipse cx="450" cy="590" rx="36" ry="5" fill-opacity="0.55"/>
    <ellipse cx="600" cy="600" rx="20" ry="4" fill-opacity="0.45"/>
    <ellipse cx="520" cy="630" rx="46" ry="4" fill-opacity="0.3"/>
    <ellipse cx="760" cy="620" rx="10" ry="3" fill-opacity="0.35"/>
    <ellipse cx="300" cy="640" rx="8" ry="3" fill-opacity="0.35"/>
  </g>

  <!-- Arm i kittel paa vej ned i pytten -->
  <g>
    <path d="M1260 760 Q1000 700 760 640" fill="none" stroke="#b9c3c6" stroke-width="96" stroke-linecap="round"/>
    <path d="M1260 760 Q1000 700 760 640" fill="none" stroke="#f4f6f7" stroke-width="88" stroke-linecap="round"/>
    <path d="M820 610 Q800 640 812 676" fill="none" stroke="#d6dde0" stroke-width="6" stroke-linecap="round"/>
    <path d="M722 612 Q680 606 664 622 Q654 636 672 644 L710 652 Q730 650 740 640 Z" fill="#e2a987"/>
    <path d="M664 622 Q640 620 628 628 M668 632 Q644 634 632 640 M676 642 Q656 648 646 654" stroke="#e2a987" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
