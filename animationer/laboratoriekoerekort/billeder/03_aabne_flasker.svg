<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- To aabne flasker: koncentreret ammoniakvand og saltsyre. Laagene
       ligger paa bordet, og dampene moedes i en hvid roeg af NH4Cl. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#d4ebfa" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="brun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1407"/>
      <stop offset="0.2" stop-color="#5a2c0e"/>
      <stop offset="0.4" stop-color="#8a4a1a"/>
      <stop offset="0.62" stop-color="#5e2f10"/>
      <stop offset="1" stop-color="#241106"/>
    </linearGradient>
    <radialGradient id="roeg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="ghs05">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <path d="M-22 -19 l14 -7 l4 8 l-14 7 Z M4 -23 l14 6 l-3.5 8 l-14 -6 Z" fill="#111"/>
      <circle cx="-9" cy="-3" r="3.4" fill="#111"/>
      <circle cx="11" cy="-3" r="3.4" fill="#111"/>
      <path d="M-23 12 h18 v8 h-18 Z M4 11 q10 -4 19 2 v7 h-19 Z" fill="#111"/>
    </g>
    <g id="ghs07">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <rect x="-5" y="-26" width="10" height="34" rx="4" fill="#111"/>
      <circle cy="18" r="6" fill="#111"/>
    </g>
  </defs>

  <!-- Vaeg og fliser -->
  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="#f4f7f6"/>
  <g stroke="#d2dddb" stroke-width="2">
    <path d="M0 356 H1200 M0 394 H1200 M0 432 H1200"/>
    <path d="M60 318 V356 M180 318 V356 M300 318 V356 M420 318 V356 M540 318 V356 M660 318 V356 M780 318 V356 M900 318 V356 M1020 318 V356 M1140 318 V356"/>
    <path d="M0 356 V394 M120 356 V394 M240 356 V394 M360 356 V394 M480 356 V394 M600 356 V394 M720 356 V394 M840 356 V394 M960 356 V394 M1080 356 V394"/>
    <path d="M60 394 V432 M180 394 V432 M300 394 V432 M420 394 V432 M540 394 V432 M660 394 V432 M780 394 V432 M900 394 V432 M1020 394 V432 M1140 394 V432"/>
    <path d="M0 432 V470 M120 432 V470 M240 432 V470 M360 432 V470 M480 432 V470 M600 432 V470 M720 432 V470 M840 432 V470 M960 432 V470 M1080 432 V470"/>
  </g>

  <!-- Stinkskab i baggrunden, tomt og med lyset taendt -->
  <g>
    <rect x="30" y="40" width="330" height="430" rx="6" fill="#c9d3d1"/>
    <rect x="52" y="88" width="286" height="360" fill="#f3f7f2"/>
    <rect x="52" y="88" width="286" height="22" fill="#fffbe0"/>
    <rect x="52" y="250" width="286" height="198" fill="#cfe3ef" opacity="0.45" stroke="#9fb1b0" stroke-width="5"/>
    <rect x="160" y="252" width="70" height="10" rx="4" fill="#8e9a99"/>
    <path d="M70 272 L140 430" stroke="#ffffff" stroke-opacity="0.7" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="40" width="330" height="36" rx="6" fill="#b3bfbd"/>
    <circle cx="326" cy="58" r="8" fill="#2eb04f"/>
  </g>

  <!-- Bordplade -->
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Roeg og dampe -->
  <g fill="none" stroke-linecap="round" stroke-width="7">
    <path d="M556 336 q-14 -30 4 -58 q18 -28 2 -60 q-10 -22 26 -50" stroke="#eef3ee" stroke-opacity="0.8"/>
    <path d="M576 340 q16 -34 -2 -66 q-16 -30 12 -64" stroke="#eef3ee" stroke-opacity="0.55"/>
    <path d="M896 354 q14 -30 -4 -60 q-18 -28 0 -60 q10 -22 -30 -52" stroke="#eef3ee" stroke-opacity="0.8"/>
    <path d="M876 358 q-16 -34 4 -66 q14 -28 -14 -62" stroke="#eef3ee" stroke-opacity="0.55"/>
  </g>
  <ellipse cx="724" cy="170" rx="190" ry="84" fill="url(#roeg)"/>
  <ellipse cx="650" cy="196" rx="110" ry="54" fill="url(#roeg)"/>
  <ellipse cx="806" cy="150" rx="120" ry="60" fill="url(#roeg)"/>

  <!-- Ammoniakvand, brun flaske uden laag -->
  <g transform="translate(486 336)">
    <ellipse cx="80" cy="226" rx="94" ry="12" fill="#000" opacity="0.28"/>
    <rect x="58" y="0" width="44" height="40" fill="#5a2c0e"/>
    <path d="M58 10 h44 M58 20 h44 M58 30 h44" stroke="#1f0e04" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M58 38 C58 60 8 64 6 90 V210 Q6 226 22 226 H138 Q154 226 154 210 V90 C152 64 102 60 102 38 Z" fill="url(#brun)"/>
    <rect x="20" y="96" width="120" height="112" rx="6" fill="#f4efe4" stroke="#c8bda6" stroke-width="2"/>
    <text x="80" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">NH<tspan font-size="16" dy="6">3</tspan><tspan dy="-6"> (aq)</tspan></text>
    <text x="80" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a4f57">Ammoniakvand</text>
    <use href="#ghs05" transform="translate(56 182) scale(0.36)"/>
    <use href="#ghs07" transform="translate(104 182) scale(0.36)"/>
  </g>

  <!-- Saltsyre, klar flaske uden laag -->
  <g transform="translate(806 350)">
    <ellipse cx="80" cy="214" rx="92" ry="12" fill="#000" opacity="0.28"/>
    <rect x="60" y="0" width="40" height="36" fill="#d4ebfa" fill-opacity="0.35" stroke="#e6f2fb" stroke-width="3"/>
    <path d="M62 36 H98 V52 C98 68 154 72 154 100 V198 Q154 214 138 214 H22 Q6 214 6 198 V100 C6 72 62 68 62 52 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3"/>
    <path d="M9 130 V198 Q9 210 22 210 H138 Q151 210 151 198 V130 Z" fill="#dff0f8" opacity="0.3"/>
    <rect x="20" y="92" width="120" height="106" rx="6" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="80" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">HCl (aq)</text>
    <text x="80" y="144" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#4a4f57">Saltsyre</text>
    <use href="#ghs05" transform="translate(56 174) scale(0.36)"/>
    <use href="#ghs07" transform="translate(104 174) scale(0.36)"/>
  </g>

  <!-- Laagene ligger paa bordet -->
  <g transform="translate(390 596) rotate(-14)">
    <ellipse cx="4" cy="30" rx="40" ry="8" fill="#000" opacity="0.3"/>
    <rect x="-32" y="-18" width="64" height="44" rx="6" fill="#2d2d2d"/>
    <path d="M-32 -6 h64 M-32 6 h64" stroke="#454545" stroke-width="3"/>
    <ellipse cx="0" cy="-18" rx="32" ry="8" fill="#3c3c3c"/>
  </g>
  <g transform="translate(1062 640) rotate(78)">
    <ellipse cx="18" cy="6" rx="10" ry="34" fill="#000" opacity="0.25"/>
    <rect x="-30" y="-22" width="60" height="44" rx="6" fill="#2c6fb3"/>
    <path d="M-18 -22 v44 M-6 -22 v44 M6 -22 v44 M18 -22 v44" stroke="#1e548a" stroke-width="3"/>
  </g>

  <!-- Pipette i et reagensglasstativ -->
  <g transform="translate(160 520)">
    <ellipse cx="80" cy="92" rx="100" ry="10" fill="#000" opacity="0.25"/>
    <rect x="0" y="40" width="160" height="16" rx="3" fill="#e9eef0"/>
    <rect x="0" y="80" width="160" height="12" rx="3" fill="#c9d1d3"/>
    <path d="M8 56 V80 M152 56 V80" stroke="#c9d1d3" stroke-width="8"/>
    <rect x="30" y="-10" width="20" height="96" rx="9" fill="url(#glas)" stroke="#e6f2fb" stroke-width="2.5"/>
    <rect x="70" y="-10" width="20" height="96" rx="9" fill="url(#glas)" stroke="#e6f2fb" stroke-width="2.5"/>
    <rect x="110" y="-10" width="20" height="96" rx="9" fill="url(#glas)" stroke="#e6f2fb" stroke-width="2.5"/>
    <path d="M72 50 V84 Q80 90 88 84 V50 Z" fill="#a8d8f0" opacity="0.6"/>
  </g>
</svg>
