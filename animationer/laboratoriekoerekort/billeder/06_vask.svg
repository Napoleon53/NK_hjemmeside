<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Der skal haeldes fra en stor flaske over i en lille. Vasken er til
       venstre, men der er allerede spildt paa bordet og kladdehaeftet. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#d4ebfa" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="kar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56636a"/>
      <stop offset="1" stop-color="#8b989d"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <g id="ghs05">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <path d="M-22 -19 l14 -7 l4 8 l-14 7 Z M4 -23 l14 6 l-3.5 8 l-14 -6 Z" fill="#111"/>
      <circle cx="-9" cy="-3" r="3.4" fill="#111"/>
      <circle cx="11" cy="-3" r="3.4" fill="#111"/>
      <path d="M-23 12 h18 v8 h-18 Z M4 11 q10 -4 19 2 v7 h-19 Z" fill="#111"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Vask med hane -->
  <rect x="90" y="498" width="440" height="150" rx="20" fill="#aab5b9"/>
  <rect x="114" y="514" width="392" height="120" rx="14" fill="url(#kar)"/>
  <circle cx="310" cy="596" r="15" fill="#454f54"/>
  <path d="M300 596 h20 M310 586 v20" stroke="#6f7c80" stroke-width="3"/>
  <rect x="292" y="470" width="36" height="34" rx="4" fill="#8e9a9e"/>
  <path d="M310 476 V372 Q310 330 352 330 Q394 330 394 372 V404" fill="none" stroke="#a9b4b8" stroke-width="16" stroke-linecap="round"/>
  <path d="M254 486 h30 M336 486 h30" stroke="#8e9a9e" stroke-width="10" stroke-linecap="round"/>

  <!-- Stor flaske med natriumhydroxid -->
  <g transform="translate(660 262)">
    <ellipse cx="90" cy="276" rx="104" ry="13" fill="#000" opacity="0.28"/>
    <rect x="64" y="0" width="52" height="38" rx="5" fill="#2e9b52"/>
    <path d="M64 9 h52 M64 18 h52 M64 27 h52" stroke="#237a40" stroke-width="2"/>
    <path d="M70 38 H110 V62 C110 80 176 84 176 116 V256 Q176 276 156 276 H24 Q4 276 4 256 V116 C4 84 70 80 70 62 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3"/>
    <path d="M8 130 V256 Q8 272 24 272 H156 Q172 272 172 256 V130 Z" fill="#dff0f8" opacity="0.3"/>
    <rect x="24" y="130" width="132" height="120" rx="6" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="90" y="162" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2328">NaOH (aq)</text>
    <text x="90" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#4a4f57">2 M</text>
    <use href="#ghs05" transform="translate(90 220) scale(0.42)"/>
    <path d="M18 120 V250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 104 q6 40 2 80" fill="none" stroke="#dff0f8" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Lille flaske med tragt -->
  <g transform="translate(900 380)">
    <ellipse cx="60" cy="160" rx="72" ry="10" fill="#000" opacity="0.28"/>
    <path d="M44 30 H76 V44 C76 56 116 60 116 84 V146 Q116 160 102 160 H18 Q4 160 4 146 V84 C4 60 44 56 44 44 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3"/>
    <rect x="18" y="92" width="84" height="50" rx="4" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <path d="M30 108 h60 M30 124 h40" stroke="#4a4f57" stroke-width="4" stroke-linecap="round"/>
    <path d="M10 -40 H110 L68 18 V52 H52 V18 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Spild paa bordet og haeftet -->
  <g fill="#bfe3f6" fill-opacity="0.45" stroke="#dff0f8" stroke-opacity="0.5" stroke-width="2">
    <path d="M760 560 q60 -14 120 0 q40 10 10 26 q-50 18 -110 8 q-50 -12 -20 -34 Z"/>
    <ellipse cx="930" cy="604" rx="18" ry="6"/>
    <ellipse cx="700" cy="590" rx="12" ry="4"/>
    <ellipse cx="966" cy="628" rx="10" ry="4"/>
  </g>
  <g transform="translate(1060 640) rotate(-8)">
    <rect x="-110" y="-70" width="230" height="160" rx="4" fill="#2c6fb3"/>
    <rect x="-100" y="-62" width="212" height="146" rx="2" fill="#fbfaf5"/>
    <path d="M-80 -36 h170 M-80 -10 h150 M-80 16 h170 M-80 42 h110" stroke="#b7bec4" stroke-width="5" stroke-linecap="round"/>
    <path d="M-60 -50 q46 -14 72 14 q24 30 -8 52 q-36 20 -64 -6 q-24 -26 0 -60 Z" fill="#8cc7ea" fill-opacity="0.35"/>
  </g>
</svg>
