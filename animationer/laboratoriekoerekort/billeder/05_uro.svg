<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- To elever oever karatespark i gangen. Den ene vakler baglaens mod
       bordet ved vaeggen, hvor deres eget forsoeg koger uden opsyn, og paa
       dit bord koger der vand over en taendt braender. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="gulv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8b3a6"/>
      <stop offset="1" stop-color="#a39d90"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="krom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="0.4" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#4c5361"/>
    </linearGradient>
    <linearGradient id="flamme" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f6fe0"/>
      <stop offset="0.6" stop-color="#7fb2ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#bcd7ff" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="kittel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfe5e8"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d0d8db"/>
    </linearGradient>

    <!-- Trefod, taendt braender og kogende vand. Midt i x = 0, bund ved y 700. -->
    <g id="opstilling">
      <ellipse cx="0" cy="700" rx="130" ry="12" fill="#000" opacity="0.3"/>
      <path d="M-58 520 L-104 700 M58 520 L104 700 M0 520 L0 540" stroke="#3a3f47" stroke-width="10" stroke-linecap="round"/>
      <rect x="-80" y="512" width="160" height="12" rx="3" fill="#3a3f47"/>
      <rect x="-86" y="504" width="172" height="8" fill="#8e969e"/>
      <path d="M-52 700 L-40 676 H40 L52 700 Z" fill="#3a3f47"/>
      <rect x="-12" y="592" width="24" height="86" fill="url(#krom)"/>
      <rect x="-16" y="640" width="32" height="18" rx="3" fill="#6c7480"/>
      <path d="M16 690 h70" stroke="#e05446" stroke-width="12" stroke-linecap="round"/>
      <path d="M-14 594 Q-22 560 0 518 Q22 560 14 594 Z" fill="url(#flamme)"/>
      <path d="M-7 594 Q-8 572 0 554 Q8 572 7 594 Z" fill="#9fe0ff"/>
      <path d="M-62 440 V492 Q-62 504 -50 504 H50 Q62 504 62 492 V440 Z" fill="#8cc7ea" opacity="0.45"/>
      <path d="M-72 400 H72 L62 410 V492 Q62 504 50 504 H-50 Q-62 504 -62 492 V410 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
      <g fill="#ffffff" fill-opacity="0.8">
        <circle cx="-30" cy="482" r="5"/><circle cx="10" cy="470" r="6"/><circle cx="32" cy="488" r="4"/>
        <circle cx="-8" cy="454" r="4"/><circle cx="24" cy="450" r="5"/>
      </g>
      <path d="M-50 412 V490" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round">
        <path d="M-30 392 q-14 -24 2 -48 q14 -22 0 -46"/>
        <path d="M22 390 q14 -24 -2 -48 q-14 -22 2 -44"/>
      </g>
    </g>
  </defs>

  <!-- Vaeg, fliser og gulv -->
  <rect width="1200" height="520" fill="url(#vaeg)"/>
  <rect y="280" width="1200" height="120" fill="#f4f7f6"/>
  <g stroke="#d2dddb" stroke-width="2">
    <path d="M0 320 H1200 M0 360 H1200"/>
    <path d="M60 280 V320 M180 280 V320 M300 280 V320 M420 280 V320 M540 280 V320 M660 280 V320 M780 280 V320 M900 280 V320 M1020 280 V320 M1140 280 V320"/>
    <path d="M0 320 V360 M120 320 V360 M240 320 V360 M360 320 V360 M480 320 V360 M600 320 V360 M720 320 V360 M840 320 V360 M960 320 V360 M1080 320 V360"/>
    <path d="M60 360 V400 M180 360 V400 M300 360 V400 M420 360 V400 M540 360 V400 M660 360 V400 M780 360 V400 M900 360 V400 M1020 360 V400 M1140 360 V400"/>
  </g>

  <!-- Advarselsskilt: brandfarlig -->
  <g transform="translate(1060 150)">
    <path d="M0 -74 L78 58 H-78 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
    <path d="M0 -64 L68 52 H-68 Z" fill="#f2c53d" stroke="#1f2328" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 -24 Q22 2 14 20 Q26 14 22 2 Q36 24 22 38 H-22 Q-38 20 -18 -2 Q-18 12 -8 16 Q-16 -4 0 -24 Z" fill="#1f2328"/>
  </g>

  <!-- Bordet ved vaeggen med deres eget forsoeg, der koger uden opsyn -->
  <rect y="400" width="1200" height="20" fill="#56676c"/>
  <rect y="420" width="1200" height="10" fill="#2c373b"/>
  <rect y="430" width="1200" height="90" fill="#cfd8d6"/>
  <g stroke="#b3bfbd" stroke-width="3"><path d="M200 430 V520 M500 430 V520 M800 430 V520 M1100 430 V520"/></g>
  <rect y="520" width="1200" height="90" fill="url(#gulv)"/>
  <use href="#opstilling" transform="translate(840 64) scale(0.48)"/>

  <!-- Taleboble -->
  <g>
    <path d="M70 110 H232 Q252 110 252 130 V168 Q252 188 232 188 H214 L244 236 L172 188 H70 Q50 188 50 168 V130 Q50 110 70 110 Z" fill="#ffffff" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/>
    <text x="151" y="163" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" fill="#1f2328">Hiyaa!</text>
  </g>

  <!-- Eleven, der sparker -->
  <g transform="translate(0 -14)">
    <path d="M262 356 L222 402 L238 440" fill="none" stroke="#c5ced1" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="240" cy="448" r="12" fill="#b97a56"/>
    <path d="M292 476 L276 538 L292 594" fill="none" stroke="#2e4053" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="306" cy="600" rx="28" ry="11" fill="#1f2328"/>
    <path d="M238 346 Q266 326 294 340 L326 486 Q296 502 250 498 Z" fill="url(#kittel)" stroke="#b9c3c6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M304 470 L474 406" fill="none" stroke="#34495e" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="490" cy="398" rx="12" ry="26" transform="rotate(-20 490 398)" fill="#1f2328"/>
    <rect x="246" y="306" width="24" height="30" rx="7" fill="#a86c4b"/>
    <circle cx="258" cy="292" r="32" fill="#b97a56"/>
    <path d="M226 300 Q216 256 258 256 Q286 256 290 276 Q266 268 252 280 Q244 302 226 300 Z" fill="#1f1a17"/>
    <path d="M228 286 H290" stroke="#1f5fa8" stroke-width="6"/>
    <rect x="266" y="276" width="24" height="18" rx="6" fill="#9ed2ee" fill-opacity="0.7" stroke="#1f5fa8" stroke-width="4"/>
    <circle cx="279" cy="285" r="3.5" fill="#1f1a17"/>
    <path d="M274 305 Q284 302 290 308 Q284 318 274 311 Z" fill="#6e3b24"/>
    <path d="M280 352 L322 384 L338 346" fill="none" stroke="#e6ebed" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="340" cy="338" r="13" fill="#b97a56"/>
    <g fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round">
      <path d="M516 366 q18 30 2 64"/>
      <path d="M536 380 q10 18 0 38"/>
      <path d="M400 380 l-40 10 M420 400 l-44 12"/>
    </g>
  </g>

  <!-- Eleven, der vakler baglaens -->
  <g transform="translate(0 -14)">
    <path d="M696 358 L744 322 L754 270" fill="none" stroke="#c5ced1" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="756" cy="260" r="12" fill="#f0c9a8"/>
    <path d="M648 482 L690 540 L698 594" fill="none" stroke="#2e4053" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="684" cy="600" rx="28" ry="11" fill="#1f2328"/>
    <path d="M630 482 L590 520 L568 562" fill="none" stroke="#34495e" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="554" cy="568" rx="26" ry="11" transform="rotate(-20 554 568)" fill="#1f2328"/>
    <path d="M652 352 Q680 330 708 346 L676 500 Q640 510 604 498 Z" fill="url(#kittel)" stroke="#b9c3c6" stroke-width="3" stroke-linejoin="round"/>
    <rect x="672" y="312" width="24" height="30" rx="7" fill="#e0b08e"/>
    <path d="M716 290 Q746 298 740 334" fill="none" stroke="#d9a441" stroke-width="12" stroke-linecap="round"/>
    <circle cx="686" cy="298" r="32" fill="#f0c9a8"/>
    <path d="M655 284 Q656 258 688 262 Q722 266 718 302 Q716 322 704 334 Q706 306 694 290 Q676 278 655 284 Z" fill="#d9a441"/>
    <path d="M654 292 H716" stroke="#1f5fa8" stroke-width="6"/>
    <rect x="654" y="282" width="24" height="18" rx="6" fill="#9ed2ee" fill-opacity="0.7" stroke="#1f5fa8" stroke-width="4"/>
    <circle cx="664" cy="291" r="3.5" fill="#1f1a17"/>
    <ellipse cx="661" cy="316" rx="5" ry="7" fill="#6e3b24"/>
    <path d="M664 362 L620 336 L600 296" fill="none" stroke="#e6ebed" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="598" cy="286" r="12" fill="#f0c9a8"/>
    <g fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round">
      <path d="M736 430 h40 M744 462 h50 M732 494 h36"/>
    </g>
  </g>

  <!-- Dit bord med taendt braender og kogende vand -->
  <rect y="606" width="1200" height="114" fill="url(#bord)"/>
  <rect y="602" width="1200" height="8" fill="#56676c"/>
  <use href="#opstilling" transform="translate(1010 0)"/>
</svg>
