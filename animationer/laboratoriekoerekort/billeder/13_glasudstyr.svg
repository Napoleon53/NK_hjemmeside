<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Fire stykker glasudstyr mærket A-D: A baegerglas, B maaleglas,
       C konisk kolbe, D reagensglas i et stativ. Navnene staar bevidst
       ikke paa billedet. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#d4ebfa" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <g id="bogstav">
      <circle r="32" fill="#ffffff" stroke="#0f766e" stroke-width="5"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- A: baegerglas -->
  <g transform="translate(100 380)">
    <ellipse cx="90" cy="186" rx="100" ry="11" fill="#000" opacity="0.28"/>
    <path d="M12 80 V168 Q12 184 28 184 H152 Q168 184 168 168 V80 Z" fill="#8cc7ea" fill-opacity="0.45"/>
    <path d="M0 0 H180 L168 14 V168 Q168 184 152 184 H28 Q12 184 12 168 V14 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 80 H168" stroke="#bfe3f6" stroke-width="3"/>
    <g stroke="#eef6fc" stroke-width="2.5" stroke-linecap="round"><path d="M128 50 h26 M138 90 h16 M128 130 h26"/></g>
    <path d="M28 26 V160" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- B: maaleglas -->
  <g transform="translate(450 566)">
    <ellipse cx="0" cy="2" rx="66" ry="8" fill="#000" opacity="0.28"/>
    <path d="M-54 0 H54 L40 -18 H-40 Z" fill="#cfe3ef" fill-opacity="0.7" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 -18 V-130 H26 V-18 Z" fill="#8cc7ea" fill-opacity="0.45"/>
    <path d="M-22 -18 V-300 H-30 L-25 -308 H26 V-18 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 -130 H26" stroke="#bfe3f6" stroke-width="3"/>
    <g stroke="#eef6fc" stroke-width="2" stroke-linecap="round">
      <path d="M4 -50 h18 M12 -70 h10 M4 -90 h18 M12 -110 h10 M4 -150 h18 M12 -170 h10 M4 -190 h18 M12 -210 h10 M4 -230 h18 M12 -250 h10 M4 -270 h18"/>
    </g>
    <path d="M-14 -34 V-290" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- C: konisk kolbe -->
  <g transform="translate(750 474) scale(1.3)">
    <ellipse cx="0" cy="72" rx="84" ry="8" fill="#000" opacity="0.28"/>
    <path d="M-44 12 L-70 54 Q-72 64 -60 64 H60 Q72 64 70 54 L44 12 Z" fill="#8cc7ea" fill-opacity="0.45"/>
    <path d="M-16 -112 V-50 L-72 52 Q-78 70 -58 70 H58 Q78 70 72 52 L16 -50 V-112 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-22" y="-120" width="44" height="10" rx="4" fill="#d4ebfa" fill-opacity="0.4" stroke="#e6f2fb" stroke-width="2"/>
    <g stroke="#eef6fc" stroke-width="2" stroke-linecap="round"><path d="M-8 44 h12 M-8 26 h8 M-8 8 h12"/></g>
    <path d="M-6 -100 V-56 M-26 -20 L-54 40" stroke="#ffffff" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- D: reagensglas i stativ -->
  <g transform="translate(1030 566)">
    <ellipse cx="0" cy="2" rx="80" ry="9" fill="#000" opacity="0.28"/>
    <rect x="-70" y="-14" width="140" height="14" rx="3" fill="#c9d1d3"/>
    <path d="M-60 -14 V-110 M60 -14 V-110" stroke="#c9d1d3" stroke-width="10"/>
    <path d="M-18 -100 V-40 Q-18 -20 0 -20 Q18 -20 18 -40 V-100 Z" fill="#8cc7ea" fill-opacity="0.45"/>
    <rect x="-70" y="-126" width="140" height="18" rx="3" fill="#e9eef0"/>
    <path d="M-18 -240 V-40 Q-18 -20 0 -20 Q18 -20 18 -40 V-240" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3"/>
    <ellipse cx="0" cy="-240" rx="21" ry="4" fill="none" stroke="#e6f2fb" stroke-width="3"/>
    <rect x="-70" y="-126" width="52" height="18" rx="3" fill="#e9eef0"/>
    <rect x="18" y="-126" width="52" height="18" rx="3" fill="#e9eef0"/>
    <path d="M-10 -226 V-44" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bogstaver -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#0b544e" text-anchor="middle">
    <use href="#bogstav" x="190" y="646"/><text x="190" y="659">A</text>
    <use href="#bogstav" x="450" y="646"/><text x="450" y="659">B</text>
    <use href="#bogstav" x="750" y="646"/><text x="750" y="659">C</text>
    <use href="#bogstav" x="1030" y="646"/><text x="1030" y="659">D</text>
  </g>
</svg>
