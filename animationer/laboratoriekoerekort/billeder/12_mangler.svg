<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Udstyret til oevelsen er fundet frem, men den koniske kolbe mangler.
       Glasskabene paa vaeggen er fulde af udstyr. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4ebfa" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#d4ebfa" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#d4ebfa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#d4ebfa" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <!-- Smaa glas i skabene -->
    <g id="skabsglas" fill="none" stroke="#8fb0c4" stroke-width="3" stroke-linejoin="round">
      <path d="M0 -44 H34 L30 -40 V-4 Q30 0 26 0 H8 Q4 0 4 -4 V-40 Z"/>
      <path d="M52 -50 V-34 L40 -4 Q38 0 44 0 H70 Q76 0 74 -4 L62 -34 V-50 Z"/>
      <path d="M90 -60 V0 M104 -60 V0 M86 0 H108"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>

  <!-- Glasskabe -->
  <g>
    <rect x="600" y="30" width="570" height="250" rx="6" fill="#c9d3d1"/>
    <g fill="#eef5f7" stroke="#aebbb9" stroke-width="4">
      <rect x="620" y="48" width="170" height="214"/>
      <rect x="800" y="48" width="170" height="214"/>
      <rect x="980" y="48" width="170" height="214"/>
    </g>
    <path d="M620 155 H1150" stroke="#aebbb9" stroke-width="4"/>
    <use href="#skabsglas" transform="translate(644 150)"/>
    <use href="#skabsglas" transform="translate(824 150)"/>
    <use href="#skabsglas" transform="translate(1004 150)"/>
    <use href="#skabsglas" transform="translate(644 256)"/>
    <use href="#skabsglas" transform="translate(824 256)"/>
    <use href="#skabsglas" transform="translate(1004 256)"/>
    <g fill="#ffffff" fill-opacity="0.5">
      <path d="M636 60 L680 60 L630 130 Z"/><path d="M816 60 L860 60 L810 130 Z"/><path d="M996 60 L1040 60 L990 130 Z"/>
    </g>
    <g fill="#8e9a99">
      <rect x="772" y="140" width="8" height="34" rx="3"/><rect x="810" y="140" width="8" height="34" rx="3"/><rect x="1132" y="140" width="8" height="34" rx="3"/>
    </g>
  </g>

  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Baegerglas -->
  <g transform="translate(90 400)">
    <ellipse cx="70" cy="146" rx="80" ry="10" fill="#000" opacity="0.28"/>
    <path d="M0 0 H140 L130 12 V130 Q130 144 116 144 H24 Q10 144 10 130 V12 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#eef6fc" stroke-width="2.5" stroke-linecap="round"><path d="M96 40 h22 M104 70 h14 M96 100 h22"/></g>
    <path d="M22 24 V124" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Maaleglas -->
  <g transform="translate(340 560)">
    <ellipse cx="0" cy="2" rx="62" ry="8" fill="#000" opacity="0.28"/>
    <path d="M-50 0 H50 L38 -16 H-38 Z" fill="#cfe3ef" fill-opacity="0.7" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-22 -16 V-262 H-28 L-24 -270 H26 V-16 Z" fill="url(#glas)" stroke="#e6f2fb" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#eef6fc" stroke-width="2" stroke-linecap="round">
      <path d="M4 -60 h16 M10 -80 h10 M4 -100 h16 M10 -120 h10 M4 -140 h16 M10 -160 h10 M4 -180 h16 M10 -200 h10 M4 -220 h16 M10 -240 h10"/>
    </g>
    <path d="M-14 -30 V-250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Tom plads til den koniske kolbe -->
  <g transform="translate(600 486) scale(1.3)">
    <path d="M-16 -112 V-50 L-72 52 Q-78 70 -58 70 H58 Q78 70 72 52 L16 -50 V-112 Z" fill="#ffffff" fill-opacity="0.06" stroke="#eef6fc" stroke-opacity="0.75" stroke-width="3.5" stroke-dasharray="10 9" stroke-linejoin="round"/>
    <text x="0" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="76" font-weight="800" fill="#f2c53d">?</text>
  </g>

  <!-- Udstyrsliste -->
  <g transform="translate(960 610) rotate(-4)">
    <rect x="-200" y="-104" width="400" height="220" rx="4" fill="#fbfaf5"/>
    <g font-family="Segoe UI, Arial, sans-serif" fill="#1f2328">
      <text x="-172" y="-64" font-size="24" font-weight="700">Udstyr</text>
      <text x="-130" y="-22" font-size="20">Bægerglas, 250 mL</text>
      <text x="-130" y="18" font-size="20">Måleglas, 50 mL</text>
      <text x="-130" y="58" font-size="20" font-weight="700">Konisk kolbe, 250 mL</text>
    </g>
    <g fill="none" stroke="#1f2328" stroke-width="3">
      <rect x="-170" y="-42" width="24" height="24" rx="3"/>
      <rect x="-170" y="-2" width="24" height="24" rx="3"/>
      <rect x="-170" y="38" width="24" height="24" rx="3"/>
    </g>
    <path d="M-166 -30 l7 7 l14 -18 M-166 10 l7 7 l14 -18" fill="none" stroke="#1d8a4e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
