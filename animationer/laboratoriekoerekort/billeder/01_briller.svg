<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Titrering: buretten i stativet er fyldt med natriumhydroxid, og
       kolben staar klar. Sikkerhedsbrillerne ligger paa bordet, og paa
       vaeggen haenger et paabudsskilt for oejenvaern. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.55"/>
      <stop offset="0.18" stop-color="#b5d6ea" stop-opacity="0.18"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="krom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a6270"/>
      <stop offset="0.4" stop-color="#e9eef3"/>
      <stop offset="1" stop-color="#4c5361"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>

  <!-- Hylde med flasker -->
  <rect x="640" y="176" width="520" height="12" rx="2" fill="#b9c6c4"/>
  <path d="M660 188 v18 M1140 188 v18" stroke="#9aa9a7" stroke-width="6"/>
  <g>
    <rect x="672" y="104" width="46" height="72" rx="6" fill="#6b3a17"/>
    <rect x="684" y="90" width="22" height="16" rx="2" fill="#2d2d2d"/>
    <rect x="740" y="118" width="40" height="58" rx="5" fill="#cfe3ef" opacity="0.8"/>
    <rect x="750" y="104" width="20" height="15" rx="2" fill="#2c6fb3"/>
    <rect x="806" y="96" width="54" height="80" rx="6" fill="#ffffff" stroke="#c7d3d2" stroke-width="2"/>
    <rect x="818" y="82" width="30" height="16" rx="2" fill="#d8342a"/>
    <rect x="884" y="112" width="42" height="64" rx="5" fill="#6b3a17"/>
    <rect x="895" y="98" width="20" height="15" rx="2" fill="#2d2d2d"/>
    <rect x="950" y="100" width="50" height="76" rx="6" fill="#cfe3ef" opacity="0.8"/>
    <rect x="963" y="86" width="24" height="16" rx="2" fill="#2e9b52"/>
    <rect x="1024" y="120" width="38" height="56" rx="5" fill="#ffffff" stroke="#c7d3d2" stroke-width="2"/>
    <rect x="1033" y="106" width="20" height="15" rx="2" fill="#2c6fb3"/>
    <rect x="1086" y="106" width="46" height="70" rx="6" fill="#6b3a17"/>
    <rect x="1098" y="92" width="22" height="16" rx="2" fill="#2d2d2d"/>
  </g>

  <!-- Paabudsskilt: brug oejenvaern -->
  <g transform="translate(160 178)">
    <rect x="-7" y="66" width="14" height="10" fill="#9aa9a7"/>
    <circle r="72" fill="#ffffff"/>
    <circle r="64" fill="#1f5fa8"/>
    <path d="M-44 -12 Q-44 -26 -28 -26 H28 Q44 -26 44 -12 V10 Q44 24 28 24 H12 Q6 24 3 16 Q0 10 -3 16 Q-6 24 -12 24 H-28 Q-44 24 -44 10 Z" fill="#ffffff"/>
    <path d="M-36 -8 Q-36 -18 -26 -18 H-6 V14 H-26 Q-36 14 -36 4 Z M36 -8 Q36 -18 26 -18 H6 V14 H26 Q36 14 36 4 Z" fill="#1f5fa8" opacity="0.35"/>
    <path d="M-44 -4 H-56 M44 -4 H56" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Bordplade -->
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Oevelsesvejledning -->
  <g transform="translate(140 640) rotate(4)">
    <rect x="-112" y="-72" width="236" height="160" rx="3" fill="#fbfaf5"/>
    <text x="-90" y="-36" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1f2328">Titrering</text>
    <path d="M-90 -6 h176 M-90 20 h150 M-90 46 h180" stroke="#b7bec4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Stativ med buretteklemme -->
  <g>
    <ellipse cx="430" cy="642" rx="170" ry="12" fill="#000" opacity="0.28"/>
    <rect x="280" y="608" width="300" height="30" rx="6" fill="#3a3f47"/>
    <rect x="280" y="604" width="300" height="9" rx="4" fill="#5a616c"/>
    <rect x="316" y="26" width="14" height="586" rx="3" fill="url(#krom)"/>
    <rect x="310" y="16" width="26" height="14" rx="4" fill="#6c7480"/>
    <rect x="330" y="202" width="120" height="12" rx="3" fill="#6c7480"/>
    <rect x="306" y="194" width="34" height="28" rx="5" fill="#3a3f47"/>
    <circle cx="323" cy="208" r="5" fill="#8e969e"/>
    <rect x="444" y="194" width="52" height="28" rx="7" fill="#3a3f47"/>
  </g>

  <!-- Burette fyldt med natriumhydroxid -->
  <g>
    <rect x="458" y="74" width="24" height="310" fill="#e4f2f9" opacity="0.85"/>
    <path d="M458 74 Q470 82 482 74" fill="none" stroke="#86a9c0" stroke-width="2"/>
    <rect x="455" y="46" width="30" height="340" rx="4" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <g stroke="#5d6f7a" stroke-width="2">
      <path d="M457 70 h14 M457 90 h7 M457 110 h7 M457 130 h7 M457 150 h7 M457 170 h14 M457 190 h7 M457 230 h7 M457 250 h7 M457 270 h14 M457 290 h7 M457 310 h7 M457 330 h7 M457 350 h7 M457 370 h14"/>
    </g>
    <rect x="444" y="194" width="10" height="28" rx="3" fill="#3a3f47"/>
    <rect x="486" y="194" width="10" height="28" rx="3" fill="#3a3f47"/>
    <path d="M464 60 V372" stroke="#ffffff" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round"/>
    <!-- Hane og spids -->
    <path d="M459 384 H481 L476 404 H464 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
    <rect x="438" y="388" width="64" height="12" rx="5" fill="#2c6fb3"/>
    <circle cx="470" cy="394" r="9" fill="#1e548a"/>
    <path d="M466 404 L468 452 H472 L474 404 Z" fill="#e4f2f9" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Hvidt underlag og konisk kolbe under buretten -->
  <path d="M372 596 H568 L588 624 H352 Z" fill="#f4f3ee"/>
  <g transform="translate(470 546) scale(0.9)">
    <ellipse cx="0" cy="72" rx="84" ry="8" fill="#000" opacity="0.15"/>
    <path d="M-50 12 L-70 54 Q-72 64 -60 64 H60 Q72 64 70 54 L50 12 Z" fill="#cfe6f2" fill-opacity="0.75"/>
    <path d="M-16 -112 V-50 L-72 52 Q-78 70 -58 70 H58 Q78 70 72 52 L16 -50 V-112 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-22" y="-120" width="44" height="10" rx="4" fill="#d4ebfa" fill-opacity="0.5" stroke="#86a9c0" stroke-width="3"/>
    <path d="M-26 -20 L-54 40" stroke="#ffffff" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Flaske med natriumhydroxid -->
  <g transform="translate(700 286)">
    <ellipse cx="90" cy="276" rx="104" ry="13" fill="#000" opacity="0.28"/>
    <rect x="64" y="0" width="52" height="38" rx="5" fill="#2e9b52"/>
    <path d="M64 9 h52 M64 18 h52 M64 27 h52" stroke="#237a40" stroke-width="2"/>
    <path d="M70 38 H110 V62 C110 80 176 84 176 116 V256 Q176 276 156 276 H24 Q4 276 4 256 V116 C4 84 70 80 70 62 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <path d="M8 130 V256 Q8 272 24 272 H156 Q172 272 172 256 V130 Z" fill="#dff0f8" opacity="0.3"/>
    <rect x="24" y="140" width="132" height="92" rx="6" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="90" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2328">NaOH (aq)</text>
    <text x="90" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#4a4f57">0,1 M</text>
    <path d="M18 120 V250" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sikkerhedsbriller paa bordet -->
  <g transform="translate(960 636) rotate(-6) scale(0.86)">
    <ellipse cx="0" cy="62" rx="190" ry="16" fill="#000" opacity="0.3"/>
    <path d="M-150 10 Q-210 30 -196 58 Q-180 80 -120 64" fill="none" stroke="#1d2a30" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 10 Q210 30 196 58 Q180 80 120 64" fill="none" stroke="#1d2a30" stroke-width="12" stroke-linecap="round"/>
    <path d="M-160 -30 Q-160 -62 -126 -62 H126 Q160 -62 160 -30 V24 Q160 58 126 58 H40 Q24 58 16 44 Q0 22 -16 44 Q-24 58 -40 58 H-126 Q-160 58 -160 24 Z" fill="#9ed2ee" fill-opacity="0.45" stroke="#2f7fb8" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-160 -30 Q-160 -62 -126 -62 H126 Q160 -62 160 -30" fill="none" stroke="#1f5fa8" stroke-width="12" stroke-linecap="round"/>
    <path d="M-130 -34 L-70 -44 M60 -44 L110 -36" stroke="#ffffff" stroke-opacity="0.75" stroke-width="7" stroke-linecap="round"/>
    <g fill="#1f5fa8"><circle cx="-110" cy="-50" r="4"/><circle cx="-80" cy="-50" r="4"/><circle cx="80" cy="-50" r="4"/><circle cx="110" cy="-50" r="4"/></g>
  </g>
</svg>
