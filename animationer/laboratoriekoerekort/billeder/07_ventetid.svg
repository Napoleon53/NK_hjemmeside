<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Reaktionen koerer, uret taeller ned fra 10 minutter, og udstyret til
       naeste trin ligger stadig uden at vaere gjort klar. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>
  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- Konisk kolbe, hvor reaktionen koerer -->
  <g transform="translate(230 470) scale(1.6)">
    <ellipse cx="0" cy="72" rx="84" ry="8" fill="#000" opacity="0.28"/>
    <path d="M-46 8 L-70 54 Q-72 64 -60 64 H60 Q72 64 70 54 L46 8 Z" fill="#dfe9ea" fill-opacity="0.75"/>
    <rect x="-24" y="52" width="40" height="5" rx="2" transform="rotate(-10)" fill="#9aa3a8"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <circle cx="-20" cy="40" r="3"/><circle cx="-6" cy="30" r="2.5"/><circle cx="8" cy="44" r="3.5"/>
      <circle cx="22" cy="24" r="2.5"/><circle cx="-30" cy="20" r="2"/><circle cx="4" cy="14" r="2"/>
      <circle cx="-8" cy="-10" r="2"/><circle cx="4" cy="-40" r="1.8"/>
    </g>
    <path d="M-16 -112 V-50 L-72 52 Q-78 70 -58 70 H58 Q78 70 72 52 L16 -50 V-112 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-22" y="-120" width="44" height="10" rx="4" fill="#d4ebfa" fill-opacity="0.4" stroke="#86a9c0" stroke-width="2"/>
    <path d="M-6 -100 V-56 M-26 -20 L-54 40" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Nedtaellingsur -->
  <g transform="translate(560 500)">
    <ellipse cx="0" cy="68" rx="110" ry="10" fill="#000" opacity="0.3"/>
    <rect x="-40" y="-86" width="26" height="14" rx="4" fill="#c9d1d3"/>
    <rect x="14" y="-86" width="26" height="14" rx="4" fill="#c9d1d3"/>
    <rect x="-100" y="-76" width="200" height="140" rx="22" fill="#f2f4f5" stroke="#c3cbcd" stroke-width="3"/>
    <rect x="-80" y="-56" width="160" height="80" rx="10" fill="#1d2a24"/>
    <text x="0" y="6" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="56" font-weight="700" fill="#7ee0a8">09:58</text>
    <text x="0" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6f7b7a">MIN   SEK</text>
  </g>

  <!-- Udstyr til naeste trin, ikke gjort klar -->
  <g transform="translate(740 372)">
    <ellipse cx="66" cy="100" rx="80" ry="8" fill="#000" opacity="0.25"/>
    <rect x="0" y="18" width="132" height="82" rx="4" fill="#ffffff" stroke="#c7d3d2" stroke-width="2"/>
    <circle cx="66" cy="54" r="26" fill="none" stroke="#c7d3d2" stroke-width="3"/>
    <text x="66" y="92" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#4a4f57">Filtrerpapir</text>
  </g>
  <g transform="translate(950 440) rotate(-78)">
    <path d="M-50 0 H50 L8 60 V110 H-8 V60 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <rect x="1000" y="452" width="190" height="14" rx="7" fill="#8e9a99"/>

  <!-- Oevelsesvejledning -->
  <g transform="translate(930 604) rotate(-3)">
    <rect x="-240" y="-126" width="480" height="260" rx="4" fill="#fbfaf5"/>
    <g font-family="Segoe UI, Arial, sans-serif" fill="#1f2328">
      <text x="-212" y="-86" font-size="24" font-weight="700">Øvelsesvejledning</text>
      <text x="-212" y="-50" font-size="19">1. Hæld 50 mL saltsyre i kolben.</text>
      <text x="-212" y="-20" font-size="19">2. Tilsæt magnesiumbåndet.</text>
      <rect x="-218" y="-6" width="352" height="30" rx="4" fill="#f7e07a"/>
      <text x="-212" y="16" font-size="19" font-weight="700">3. Reaktionen tager 10 minutter.</text>
      <text x="-212" y="46" font-size="19">4. Filtrer opløsningen.</text>
      <text x="-212" y="76" font-size="19">5. Inddamp filtratet.</text>
    </g>
  </g>
</svg>
