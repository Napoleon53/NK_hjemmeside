<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <!-- Kemikaliehylden har en maerket plads til hver flaske. Pladsen til
       NaOH er tom, fordi flasken staar ude paa bordet. -->
  <defs>
    <linearGradient id="vaeg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4e2"/>
      <stop offset="1" stop-color="#e8efee"/>
    </linearGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46555a"/>
      <stop offset="1" stop-color="#2c373b"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5d6ea" stop-opacity="0.6"/>
      <stop offset="0.2" stop-color="#b5d6ea" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#b5d6ea" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#b5d6ea" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="brun" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1407"/>
      <stop offset="0.35" stop-color="#8a4a1a"/>
      <stop offset="1" stop-color="#2f1708"/>
    </linearGradient>
    <pattern id="fliser" width="120" height="76" patternUnits="userSpaceOnUse" y="318">
      <rect width="120" height="76" fill="#f4f7f6"/>
      <path d="M0 1 H120 M0 39 H120 M60 0 V38 M1 38 V76" stroke="#d2dddb" stroke-width="2"/>
    </pattern>
    <!-- Flaske paa hylden: bund i (0, 0), 76 bred og 112 hoej -->
    <path id="hyldeflaske" d="M-12 -112 H12 V-96 C12 -86 38 -84 38 -70 V-8 Q38 0 30 0 H-30 Q-38 0 -38 -8 V-70 C-38 -84 -12 -86 -12 -96 Z"/>
    <g id="ghs05">
      <rect x="-30" y="-30" width="60" height="60" transform="rotate(45)" fill="#ffffff" stroke="#d8342a" stroke-width="7"/>
      <path d="M-22 -19 l14 -7 l4 8 l-14 7 Z M4 -23 l14 6 l-3.5 8 l-14 -6 Z" fill="#111"/>
      <circle cx="-9" cy="-3" r="3.4" fill="#111"/>
      <circle cx="11" cy="-3" r="3.4" fill="#111"/>
      <path d="M-23 12 h18 v8 h-18 Z M4 11 q10 -4 19 2 v7 h-19 Z" fill="#111"/>
    </g>
  </defs>

  <rect width="1200" height="470" fill="url(#vaeg)"/>
  <rect y="318" width="1200" height="152" fill="url(#fliser)"/>

  <!-- Hylde med maerkede pladser -->
  <g>
    <path d="M150 262 v26 M1050 262 v26" stroke="#8e9a99" stroke-width="10"/>
    <rect x="90" y="246" width="1020" height="18" rx="3" fill="#a9b7b5"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">
      <rect x="140" y="250" width="80" height="12" rx="2" fill="#fbfaf5"/><text x="180" y="261">HCl</text>
      <rect x="300" y="250" width="80" height="12" rx="2" fill="#fbfaf5"/><text x="340" y="261">H₂SO₄</text>
      <rect x="460" y="250" width="80" height="12" rx="2" fill="#f7e07a"/><text x="500" y="261">NaOH</text>
      <rect x="620" y="250" width="80" height="12" rx="2" fill="#fbfaf5"/><text x="660" y="261">NH₃</text>
      <rect x="780" y="250" width="80" height="12" rx="2" fill="#fbfaf5"/><text x="820" y="261">CuSO₄</text>
      <rect x="940" y="250" width="80" height="12" rx="2" fill="#fbfaf5"/><text x="980" y="261">NaCl</text>
    </g>

    <!-- HCl -->
    <g transform="translate(180 246)">
      <use href="#hyldeflaske" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
      <rect x="-14" y="-124" width="28" height="16" rx="3" fill="#2c6fb3"/>
      <rect x="-28" y="-62" width="56" height="40" rx="3" fill="#fbfaf5"/>
      <text y="-37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">HCl</text>
    </g>
    <!-- H2SO4 -->
    <g transform="translate(340 246)">
      <use href="#hyldeflaske" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
      <rect x="-14" y="-124" width="28" height="16" rx="3" fill="#d8342a"/>
      <rect x="-30" y="-62" width="60" height="40" rx="3" fill="#fbfaf5"/>
      <text y="-37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">H₂SO₄</text>
    </g>
    <!-- Tom plads til NaOH -->
    <g transform="translate(500 246)">
      <use href="#hyldeflaske" fill="#ffffff" fill-opacity="0.35" stroke="#6f7f82" stroke-width="3" stroke-dasharray="9 7"/>
      <text y="-40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#6f7f82">?</text>
    </g>
    <!-- NH3 -->
    <g transform="translate(660 246)">
      <use href="#hyldeflaske" fill="url(#brun)"/>
      <rect x="-14" y="-124" width="28" height="16" rx="3" fill="#2d2d2d"/>
      <rect x="-28" y="-62" width="56" height="40" rx="3" fill="#f4efe4"/>
      <text y="-37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">NH₃</text>
    </g>
    <!-- CuSO4 -->
    <g transform="translate(820 246)">
      <path d="M-38 -60 V-8 Q-38 0 -30 0 H30 Q38 0 38 -8 V-60 Z" fill="#3d8fd6" fill-opacity="0.6"/>
      <use href="#hyldeflaske" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
      <rect x="-14" y="-124" width="28" height="16" rx="3" fill="#2c6fb3"/>
      <rect x="-32" y="-62" width="64" height="40" rx="3" fill="#fbfaf5"/>
      <text y="-37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1f2328">CuSO₄</text>
    </g>
    <!-- NaCl -->
    <g transform="translate(980 246)">
      <use href="#hyldeflaske" fill="#ffffff" stroke="#9aa9a7" stroke-width="3"/>
      <rect x="-14" y="-124" width="28" height="16" rx="3" fill="#2e9b52"/>
      <rect x="-28" y="-62" width="56" height="40" rx="3" fill="#eef4f3"/>
      <text y="-37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#1f2328">NaCl</text>
    </g>
  </g>

  <rect y="470" width="1200" height="250" fill="url(#bord)"/>
  <rect y="466" width="1200" height="8" fill="#56676c"/>

  <!-- NaOH-flasken staar ude paa bordet -->
  <g transform="translate(700 340)">
    <ellipse cx="90" cy="260" rx="104" ry="13" fill="#000" opacity="0.28"/>
    <rect x="64" y="0" width="52" height="38" rx="5" fill="#2e9b52"/>
    <path d="M64 9 h52 M64 18 h52 M64 27 h52" stroke="#237a40" stroke-width="2"/>
    <path d="M70 38 H110 V58 C110 76 176 80 176 110 V240 Q176 260 156 260 H24 Q4 260 4 240 V110 C4 80 70 76 70 58 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3"/>
    <rect x="24" y="120" width="132" height="118" rx="6" fill="#fbfaf5" stroke="#c8bda6" stroke-width="2"/>
    <text x="90" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2328">NaOH (aq)</text>
    <text x="90" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#4a4f57">2 M</text>
    <use href="#ghs05" transform="translate(90 210) scale(0.42)"/>
    <path d="M18 114 V234" stroke="#ffffff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Brugt baegerglas og pipette -->
  <g transform="translate(330 430)">
    <ellipse cx="70" cy="166" rx="80" ry="10" fill="#000" opacity="0.28"/>
    <path d="M10 100 V150 Q10 164 24 164 H116 Q130 164 130 150 V100 Z" fill="#b5d6ea" fill-opacity="0.45"/>
    <path d="M0 0 H140 L130 12 V150 Q130 164 116 164 H24 Q10 164 10 150 V12 Z" fill="url(#glas)" stroke="#86a9c0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 100 H130" stroke="#9dbdd1" stroke-width="3"/>
    <g stroke="#9dbdd1" stroke-width="2.5" stroke-linecap="round"><path d="M96 40 h22 M104 70 h14 M96 130 h22"/></g>
  </g>
  <g transform="translate(160 650) rotate(-10)">
    <rect x="-90" y="-7" width="150" height="14" rx="7" fill="#f6f8f8"/>
    <path d="M60 -3 L130 -1 L130 1 L60 3 Z" fill="#f6f8f8"/>
    <ellipse cx="-96" cy="0" rx="26" ry="14" fill="#f6f8f8"/>
  </g>
</svg>
