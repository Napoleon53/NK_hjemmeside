<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kemi-Træner: Fra Ks til pKs</title>
    <style>
        :root {
            --bg:         #0f1115;
            --panel:      #171a21;
            --panel-2:    #20242d;
            --kant:       #2b303b;
            --tekst:      #f3f4f6;
            --daempet:    #9ca3af;
            --groen:      #10b981;
            --roed:       #ef4444;
            --gul:        #fbbf24;
            /* Korresponderende syre-basepar, samme farver som c7.1:
               par 1 = syren og dens base, par 2 = H2O og H3O+ */
            --par1:       #3498db;
            --par1-tekst: #74b9ec;
            --par2:       #9b59b6;
            --par2-tekst: #c9a0e2;
            --radius:     12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        [hidden] { display: none !important; }

        body { background: var(--bg); color: var(--tekst); }
        button { font: inherit; color: inherit; }

        /* Sænket og hævet skrift uden at ændre linjehøjden */
        sub, sup { font-size: 0.7em; line-height: 0; position: relative; vertical-align: baseline; }
        sub { bottom: -0.3em; }
        sup { top: -0.55em; }

        /* ── TOPBJÆLKE ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 9px 20px;
            background: #14161a;
            border-bottom: 1px solid var(--kant);
        }

        .topbar h1 { font-size: 1.15rem; white-space: nowrap; }

        .trinlinje { display: flex; gap: 4px; list-style: none; }
        .trinlinje li {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px 3px 3px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--daempet);
        }
        .trinlinje .nr {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            background: var(--panel-2);
            border: 1px solid var(--kant);
        }
        .trinlinje li.aktiv { color: var(--tekst); background: rgba(255,255,255,0.06); }
        .trinlinje li.aktiv .nr { background: var(--tekst); border-color: var(--tekst); color: var(--bg); }
        .trinlinje li.faerdig .nr { background: var(--groen); border-color: var(--groen); color: white; }

        .stats { display: flex; gap: 8px; }
        .stat {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--daempet);
            white-space: nowrap;
        }
        .stat b { color: var(--tekst); margin-left: 6px; }

        /* ── SIDE ── */
        .side {
            max-width: 900px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ── TAVLEN: løsningen bygges op her ── */
        .tavle {
            position: relative;
            background: var(--panel);
            border: 1px solid var(--kant);
            border-radius: var(--radius);
            padding: 8px 20px 14px;
        }

        .syrenavn { position: absolute; top: 12px; left: 18px; font-size: 1.2rem; font-weight: bold; }

        .raekke {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
            transition: opacity 0.4s;
        }

        /* Rækker, der ikke er nået endnu, fylder deres plads, så kortet
           nedenunder ikke flytter sig, når tavlen udfyldes. */
        .skjult { visibility: hidden; opacity: 0; }

        /* Reaktionsskema */
        .skema { position: relative; flex-wrap: wrap; align-items: flex-start; gap: 0 10px; padding-top: 30px; margin-top: 0; }
        .bue { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
        .bue.frem { animation: fadeIn 0.5s; }
        .bue text { fill: #e5e7eb; font-size: 15px; font-weight: 600; }

        .art { display: flex; flex-direction: column; align-items: center; }
        .formel {
            height: 40px;
            line-height: 40px;
            padding: 0 6px;
            font-size: 1.5rem;
            font-weight: 600;
            white-space: nowrap;
            border-radius: 8px;
            transition: color 0.5s;
        }
        .tf { font-size: 0.95rem; font-weight: normal; color: var(--daempet); margin-left: 2px; }
        .formel.slot {
            min-width: 110px;
            line-height: 36px;
            text-align: center;
            border: 2px dashed #5b6270;
            color: var(--daempet);
            transition: border-color 0.2s, background 0.2s;
        }
        .formel.slot.fejl { border-color: var(--roed); background: rgba(239,68,68,0.12); }

        .rolle { height: 20px; line-height: 20px; font-size: 0.9rem; visibility: hidden; }
        .skema.farvet .rolle { visibility: visible; animation: fadeIn 0.5s; }
        .op  { font-size: 1.5rem; line-height: 40px; color: var(--daempet); }
        .pil { font-size: 1.6rem; line-height: 40px; padding: 0 4px; }

        .skema.farvet .p1 .formel, .p1 .rolle { color: var(--par1-tekst); }
        .skema.farvet .p2 .formel, .p2 .rolle { color: var(--par2-tekst); }

        /* Ks-udtryk */
        .ks { gap: 12px; font-size: 1.3rem; flex-wrap: wrap; }
        .ks-navn, .ks-vaerdi { white-space: nowrap; font-weight: 600; }
        .brok { display: inline-flex; flex-direction: column; }
        .taeller, .naevner { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 3px 6px; }
        .taeller { border-bottom: 2px solid rgba(255,255,255,0.6); }
        .prik { color: var(--daempet); }

        .plads {
            min-width: 96px;
            height: 34px;
            padding: 0 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: 2px dashed #5b6270;
            border-radius: 8px;
            color: var(--daempet);
            font-size: 1.2rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .plads:hover:not(:disabled) { border-color: #8b93a1; }
        .plads.fyldt { border-style: solid; border-color: #3a404c; background: rgba(255,255,255,0.03); }
        .plads.aktiv { border-color: var(--tekst); box-shadow: 0 0 0 3px rgba(255,255,255,0.12); }
        .plads.fejl  { border-color: var(--roed); background: rgba(239,68,68,0.12); }
        .plads.p1 { color: var(--par1-tekst); }
        .plads.p2 { color: var(--par2-tekst); }
        .ks.faerdig .plads { min-width: 0; padding: 0 2px; border-color: transparent; background: none; box-shadow: none; cursor: default; }

        /* pKs */
        .pks { min-height: 34px; font-size: 1.3rem; }
        .pks b { margin-left: 4px; }

        /* Skala for syrestyrke */
        .styrke { display: block; max-width: 640px; margin: 10px auto 0; }
        .skala { position: relative; height: 72px; padding-top: 22px; }
        .skala-bar { display: flex; height: 30px; border: 1px solid var(--kant); border-radius: 6px; overflow: hidden; }
        .zone {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: var(--daempet);
            white-space: nowrap;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
        }
        .zone + .zone { border-left: 1px solid var(--kant); }
        .zone.aktiv { background: rgba(16,185,129,0.2); color: var(--tekst); font-weight: 600; }
        .streg { position: absolute; bottom: 0; transform: translateX(-50%); font-size: 0.85rem; color: var(--daempet); }
        .markoer { position: absolute; top: 20px; width: 0; height: 36px; border-left: 2px solid var(--tekst); }
        .markoer span {
            position: absolute;
            bottom: 100%;
            left: 0;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .markoer.venstre span { transform: translateX(-10px); }
        .markoer.hoejre span  { transform: translateX(calc(-100% + 10px)); }

        /* ── OPGAVEKORTET: kun det aktive trin ── */
        .kort {
            background: var(--panel);
            border: 1px solid var(--kant);
            border-radius: var(--radius);
            padding: 10px 20px 14px;
        }

        .etiket { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--daempet); }
        .opgavetekst { font-size: 1.1rem; margin: 2px 0 10px; }

        .valg { display: flex; flex-wrap: wrap; gap: 8px; }
        .brik {
            min-width: 92px;
            padding: 5px 14px;
            background: var(--panel-2);
            border: 1px solid #3a404c;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s, transform 0.1s;
        }
        .brik:hover:not(:disabled)  { border-color: #8b93a1; }
        .brik:active:not(:disabled) { transform: scale(0.97); }
        .brik.p1 { color: var(--par1-tekst); border-color: rgba(52,152,219,0.5); }
        .brik.p2 { color: var(--par2-tekst); border-color: rgba(155,89,182,0.5); }
        .brik.ord { font-size: 1.05rem; padding: 8px 16px; }
        .brik.forkert { border-color: var(--roed); color: #fca5a5; text-decoration: line-through; opacity: 0.55; cursor: not-allowed; }
        .brik.rigtig  { border-color: var(--groen); background: rgba(16,185,129,0.15); }
        .brik:disabled:not(.forkert):not(.rigtig) { opacity: 0.45; cursor: default; }

        .svarlinje { display: flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 600; }
        .svarlinje input {
            width: 130px;
            padding: 5px 10px;
            background: rgba(0,0,0,0.35);
            border: 1px solid #3a404c;
            border-radius: 8px;
            color: var(--tekst);
            font-size: 1.25rem;
            text-align: center;
        }
        .svarlinje input:focus { outline: none; border-color: var(--tekst); }

        .hint {
            margin-top: 10px;
            padding: 6px 12px;
            border-left: 3px solid var(--gul);
            border-radius: 0 6px 6px 0;
            background: rgba(251,191,36,0.08);
            color: #fde68a;
            animation: fadeIn 0.3s;
        }

        .fod { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
        .besked { flex: 1; line-height: 1.4; }
        .besked.ok   { color: #6ee7b7; }
        .besked.fejl { color: #fca5a5; }
        .besked.svar { color: var(--daempet); }

        .knap {
            flex-shrink: 0;
            min-width: 130px;
            padding: 9px 20px;
            background: var(--panel-2);
            border: 1px solid #454b58;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .knap:hover { background: #2a2f3a; border-color: #6b7280; }
        .knap.tjek  { border-color: var(--tekst); }
        .knap.groen { background: rgba(16,185,129,0.2); border-color: var(--groen); }
        .knap.groen:hover { background: rgba(16,185,129,0.32); }

        /* Den knap, der er det naturlige næste skridt, banker stille. */
        .knap.banker { animation: bank 1.7s ease-out infinite; }
        @keyframes bank {
            0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(16,185,129,0); }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 760px) {
            .topbar { flex-wrap: wrap; padding: 8px 16px; }
            .trinlinje .navn { display: none; }
            .trinlinje li { padding: 3px; }
            .syrenavn { position: static; margin-top: 4px; }
            .formel, .op, .pil { font-size: 1.2rem; }
            .ks, .pks { font-size: 1.1rem; }
            .fod { flex-wrap: wrap; }
            .zone:not(.aktiv) { color: transparent; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <h1>Fra K<sub>s</sub> til pK<sub>s</sub></h1>
    <ol class="trinlinje" id="trinlinje">
        <li><span class="nr">1</span><span class="navn">Reaktion</span></li>
        <li><span class="nr">2</span><span class="navn">K<sub>s</sub></span></li>
        <li><span class="nr">3</span><span class="navn">pK<sub>s</sub></span></li>
        <li><span class="nr">4</span><span class="navn">Styrke</span></li>
    </ol>
    <div class="stats">
        <div class="stat">I træk<b id="i-traek">0</b></div>
        <div class="stat">Point<b id="point">0</b></div>
    </div>
</header>

<main class="side">

    <!-- ── TAVLE ── -->
    <section class="tavle">
        <div class="syrenavn" id="syrenavn"></div>

        <div class="raekke skema" id="skema">
            <svg class="bue" id="bue"></svg>
            <div class="art p1" id="art-syre"><span class="formel"></span><span class="rolle">syre 1</span></div>
            <span class="op">+</span>
            <div class="art p2"><span class="formel">H<sub>2</sub>O<span class="tf">(l)</span></span><span class="rolle">base 2</span></div>
            <span class="pil" id="pil">⇌</span>
            <div class="art p1" id="art-base"><span class="formel slot">?</span><span class="rolle">base 1</span></div>
            <span class="op">+</span>
            <div class="art p2"><span class="formel">H<sub>3</sub>O<sup>+</sup><span class="tf">(aq)</span></span><span class="rolle">syre 2</span></div>
        </div>

        <div class="raekke ks skjult" id="ks">
            <span class="ks-navn">K<sub>s</sub> =</span>
            <span class="brok">
                <span class="taeller">
                    <button class="plads" data-plads="0"></button>
                    <span class="prik">·</span>
                    <button class="plads" data-plads="1"></button>
                </span>
                <span class="naevner">
                    <button class="plads" data-plads="2"></button>
                </span>
            </span>
            <span class="ks-vaerdi skjult" id="ks-vaerdi"></span>
        </div>

        <div class="raekke pks skjult" id="pks"></div>

        <div class="raekke styrke skjult" id="styrke"></div>
    </section>

    <!-- ── AKTIVT TRIN ── -->
    <section class="kort">
        <div class="etiket" id="etiket"></div>
        <div class="opgavetekst" id="opgavetekst"></div>

        <div class="valg" id="valg1"></div>
        <div class="valg" id="valg2" hidden></div>
        <div class="svarlinje" id="felt3" hidden>
            <label for="input-pks">pK<sub>s</sub> =</label>
            <input type="text" id="input-pks" inputmode="decimal" autocomplete="off">
        </div>
        <div class="valg" id="valg4" hidden></div>

        <div class="hint" id="hint" hidden></div>

        <div class="fod">
            <div class="besked" id="besked"></div>
            <button class="knap" id="knap"></button>
        </div>
    </section>

</main>

<script>
    /* ────────────────────────────────
       DATA
    ──────────────────────────────── */
    function st(f, q) { return { f: f, q: q || 0 }; }

    var VAND    = st("H2O");
    var OXONIUM = st("H3O", 1);
    var HPLUS   = "H<sup>+</sup>";
    var TF_AQ   = '<span class="tf">(aq)</span>';

    /* Hver syre har sin korresponderende base og tre forkerte bud. Hvert
       bud svarer til en typisk fejl, som FEJLTEKST giver et konkret svar på. */
    var SYRER = [
        { navn: "Saltsyre",            syre: st("HCl"),      base: st("Cl", -1),     pKs: -7.00,
          fejl: [[st("Cl"), "ladning"], [st("H2Cl", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Salpetersyre",        syre: st("HNO3"),     base: st("NO3", -1),    pKs: -1.40,
          fejl: [[st("NO3"), "ladning"], [st("H2NO3", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Hydrogensulfation",   syre: st("HSO4", -1), base: st("SO4", -2),    pKs:  1.99,
          fejl: [[st("SO4", -1), "ladning"], [st("H2SO4"), "optag"], [st("HSO4"), "brint"]] },
        { navn: "Phosphorsyre",        syre: st("H3PO4"),    base: st("H2PO4", -1),  pKs:  2.12,
          fejl: [[st("H2PO4"), "ladning"], [st("PO4", -3), "flere"], [st("H4PO4", 1), "optag"]] },
        { navn: "Flussyre",            syre: st("HF"),       base: st("F", -1),      pKs:  3.17,
          fejl: [[st("F"), "ladning"], [st("H2F", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Methansyre",          syre: st("HCOOH"),    base: st("HCOO", -1),   pKs:  3.75,
          fejl: [[st("HCOO"), "ladning"], [st("HCOOH2", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Eddikesyre",          syre: st("CH3COOH"),  base: st("CH3COO", -1), pKs:  4.76,
          fejl: [[st("CH3COO"), "ladning"], [st("CH3COOH2", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Kulsyre",             syre: st("H2CO3"),    base: st("HCO3", -1),   pKs:  6.37,
          fejl: [[st("HCO3"), "ladning"], [st("CO3", -2), "flere"], [st("H3CO3", 1), "optag"]] },
        { navn: "Hypochlorsyrling",    syre: st("HClO"),     base: st("ClO", -1),    pKs:  7.53,
          fejl: [[st("ClO"), "ladning"], [st("H2ClO", 1), "optag"], [st("OH", -1), "oh"]] },
        { navn: "Ammoniumion",         syre: st("NH4", 1),   base: st("NH3"),        pKs:  9.25,
          fejl: [[st("NH3", -1), "ladning"], [st("NH4"), "brint"], [st("NH5", 2), "optag"]] },
        { navn: "Hydrogenphosphation", syre: st("HPO4", -2), base: st("PO4", -3),    pKs: 12.32,
          fejl: [[st("PO4", -2), "ladning"], [st("H2PO4", -1), "optag"], [st("OH", -1), "oh"]] }
    ];

    var FEJLTEKST = {
        ladning: function ()  { return "Tjek ladningen. " + HPLUS + " tager én positiv ladning med, så ladningen falder med 1."; },
        brint:   function ()  { return "Tjek antallet af H. Syren afgiver ét H-atom."; },
        flere:   function ()  { return "Syren afgiver kun én " + HPLUS + " ad gangen."; },
        optag:   function (s) { return formel(s) + " dannes, hvis syren optager " + HPLUS + ". Her afgiver den " + HPLUS + "."; },
        oh:      function ()  { return formel(st("OH", -1)) + " dannes, når vand afgiver " + HPLUS + ". Her optager vand " + HPLUS + "."; }
    };

    /* Grænser for syrestyrke. En syre hører til den første gruppe,
       hvis øvre grænse dens pKs ligger under. */
    var GRAENSER = [
        { navn: "stærk",       til: 0 },
        { navn: "middelstærk", til: 4 },
        { navn: "svag",        til: 12 },
        { navn: "meget svag",  til: Infinity }
    ];
    var STYRKETEKST = [
        "pK<sub>s</sub> er under 0. En stærk syre reagerer fuldstændigt med vand, så pilen bliver →.",
        "pK<sub>s</sub> ligger mellem 0 og 4.",
        "pK<sub>s</sub> ligger mellem 4 og 12.",
        "pK<sub>s</sub> er over 12."
    ];
    var SKALA_MIN = -8, SKALA_MAX = 16;

    var OPGAVETEKST = {
        1: function () { return "Hvad dannes, når " + formel(opg.syre) + " afgiver " + HPLUS + " til vand?"; },
        2: function () { return "Opstil K<sub>s</sub>-udtrykket. Klik på et stof for at sætte det på den markerede plads."; },
        3: function () { return "Beregn pK<sub>s</sub> ud fra K<sub>s</sub>."; },
        4: function () { return "Hvor stærk er syren?"; }
    };

    /* ────────────────────────────────
       TILSTAND
    ──────────────────────────────── */
    var opg = null, sidste = -1;
    var trin = 1;
    var loest = false;       // det aktive trin er løst eller vist
    var hintVist = false;    // hint vist i det aktive trin
    var svarVist = false;    // et svar er vist et sted i opgaven
    var pladser = [null, null, null], aktivPlads = 0, fejlPladser = [];
    var ubekraeftet = false; // trin 3: indtastning, der ikke er tjekket
    var point = 0, iTraek = 0;

    /* ────────────────────────────────
       HJÆLPEFUNKTIONER
    ──────────────────────────────── */
    function el(id) { return document.getElementById(id); }
    function vis(id) { el(id).classList.remove("skjult"); }
    function skjul(id) { el(id).classList.add("skjult"); }

    function noegle(s) { return s.f + "|" + s.q; }
    function ens(a, b) { return !!a && !!b && a.f === b.f && a.q === b.q; }
    function par(s) { return ens(s, VAND) || ens(s, OXONIUM) ? "p2" : "p1"; }

    /* Ladning ±1 skrives som + eller − alene (Na⁺, ikke Na¹⁺) */
    function ladningHaevet(q) {
        if (q === 0) return "";
        var n = Math.abs(q);
        return "<sup>" + (n === 1 ? "" : n) + (q > 0 ? "+" : "−") + "</sup>";
    }

    function formel(s) { return s.f.replace(/(\d+)/g, "<sub>$1</sub>") + ladningHaevet(s.q); }

    function tal(x, dec) { return x.toFixed(dec).replace(".", ",").replace("-", "−"); }
    function stort(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

    function ksDele(pKs) {
        var ks  = Math.pow(10, -pKs);
        var exp = Math.floor(Math.log10(ks) + 1e-9);
        var m   = ks / Math.pow(10, exp);
        if (Number(m.toFixed(2)) >= 10) { m /= 10; exp += 1; }
        return { m: m, exp: exp };
    }

    function ksHTML(pKs) {
        var d = ksDele(pKs);
        return tal(d.m, 2) + " · 10<sup>" + String(d.exp).replace("-", "−") + "</sup>";
    }

    function styrkeIndeks(pKs) {
        for (var i = 0; i < GRAENSER.length; i++) if (pKs < GRAENSER[i].til) return i;
    }

    function blandet(liste) {
        var a = liste.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
    }

    function saetBesked(klasse, html) {
        el("besked").className = "besked " + klasse;
        el("besked").innerHTML = html;
    }

    function lavBrik(klasse, html, klik) {
        var b = document.createElement("button");
        b.className = "brik " + klasse;
        b.innerHTML = html;
        b.onclick = klik;
        return b;
    }

    /* ────────────────────────────────
       NY OPGAVE
       Tavlen fyldes på forhånd med hele løsningen, men skjult. Hvert trin
       viser sin række, når det er løst, så intet flytter sig undervejs.
    ──────────────────────────────── */
    function nyOpgave(indeks) {
        if (indeks === undefined) {
            do { indeks = Math.floor(Math.random() * SYRER.length); } while (indeks === sidste);
        }
        sidste = indeks;
        opg = SYRER[indeks];
        svarVist = false;

        el("syrenavn").textContent = opg.navn;

        el("skema").classList.remove("farvet");
        el("bue").innerHTML = "";
        el("pil").textContent = "⇌";
        el("art-syre").querySelector(".formel").innerHTML = formel(opg.syre) + TF_AQ;
        var slot = el("art-base").querySelector(".formel");
        slot.className = "formel slot";
        slot.innerHTML = "?";

        pladser = [null, null, null]; aktivPlads = 0; fejlPladser = [];
        el("ks").classList.remove("faerdig");
        el("ks-vaerdi").innerHTML = "= " + ksHTML(opg.pKs) + " M";
        el("pks").innerHTML = "pK<sub>s</sub> = −log(" + ksHTML(opg.pKs) + ") =<b>" + tal(opg.pKs, 2) + "</b>";
        visSkala(false);
        ["ks", "ks-vaerdi", "pks", "styrke"].forEach(skjul);

        var input = el("input-pks");
        input.value = "";
        input.disabled = false;
        ubekraeftet = false;

        byggValg1();
        byggValg2();
        byggValg4();
        startTrin(1);
    }

    function startTrin(n) {
        trin = n; loest = false; hintVist = false;

        el("etiket").textContent = "Trin " + n + " af 4";
        el("opgavetekst").innerHTML = OPGAVETEKST[n]();
        el("valg1").hidden = n !== 1;
        el("valg2").hidden = n !== 2;
        el("felt3").hidden = n !== 3;
        el("valg4").hidden = n !== 4;
        el("hint").hidden = true;
        saetBesked("", "");

        if (n === 2) { vis("ks"); tegnPladser(); }

        opdaterTrinlinje();
        opdaterKnap();

        el("knap").blur();
        if (n === 3) el("input-pks").focus({ preventScroll: true });
    }

    /* Afslutter det aktive trin, uanset om eleven løste det, eller svaret blev vist. */
    function trinLoest(klasse, tekst) {
        loest = true;
        saetBesked(klasse, tekst);
        if (trin === 4) afslutOpgave();
        opdaterTrinlinje();
        opdaterKnap();
        el("knap").focus({ preventScroll: true });
    }

    function afslutOpgave() {
        if (svarVist) {
            iTraek = 0;
        } else {
            point += 100 + iTraek * 20;
            iTraek += 1;
        }
        el("point").textContent = point;
        el("i-traek").textContent = iTraek;
        el("i-traek").style.color = iTraek >= 3 ? "var(--gul)" : "";
    }

    function opdaterTrinlinje() {
        var lis = el("trinlinje").children;
        for (var i = 0; i < lis.length; i++) {
            var t = i + 1;
            var k = t === trin ? "aktiv" : "";
            if (t < trin || (t === trin && loest)) k += " faerdig";
            lis[i].className = k;
        }
    }

    /* ────────────────────────────────
       KNAPPEN
       Der er kun én knap, og den viser det næste skridt:
         Giv hint → Vis svaret → Næste trin (Ny opgave efter trin 4)
       Løser eleven selv trinnet, springer knappen direkte til Næste trin.
       Selve svaret tjekkes, når eleven vælger en brik. I trin 3 bliver
       knappen til Tjek svar, så længe der står et utjekket tal i feltet.
    ──────────────────────────────── */
    function opdaterKnap() {
        var k = el("knap");
        if (loest) {
            k.textContent = trin < 4 ? "Næste trin" : "Ny opgave";
            k.className = "knap groen banker";
        } else if (trin === 3 && ubekraeftet) {
            k.textContent = "Tjek svar";
            k.className = "knap tjek";
        } else {
            k.textContent = hintVist ? "Vis svaret" : "Giv hint";
            k.className = "knap";
        }
    }

    function knapKlik() {
        if (loest) {
            if (trin < 4) startTrin(trin + 1); else nyOpgave();
            return;
        }
        if (trin === 3 && ubekraeftet) { tjekTrin3(); return; }
        if (!hintVist) visHint(); else visSvar();
    }

    function visHint() {
        hintVist = true;
        var h = el("hint");
        if (trin === 1) h.innerHTML = HPLUS + " består af ét H-atom og én positiv ladning.";
        if (trin === 2) h.innerHTML = "Tæller: de to produkter. Nævner: syren. Vand er opløsningsmiddel og tages ikke med.";
        if (trin === 3) h.innerHTML = "pK<sub>s</sub> = −log(K<sub>s</sub>). Brug log, ikke ln.";
        if (trin === 4) {
            vis("styrke");
            h.innerHTML = "Find pK<sub>s</sub> = " + tal(opg.pKs, 2) + " på skalaen på tavlen.";
        }
        h.hidden = false;
        opdaterKnap();
    }

    function visSvar() {
        svarVist = true;
        if (trin === 1) {
            el("valg1").querySelector('[data-noegle="' + noegle(opg.base) + '"]').classList.add("rigtig");
            visBase();
        }
        if (trin === 2) {
            pladser = [opg.base, OXONIUM, opg.syre];
            loesTrin2();
        }
        if (trin === 3) {
            var input = el("input-pks");
            input.value = tal(opg.pKs, 2);
            input.disabled = true;
            ubekraeftet = false;
            vis("pks");
        }
        if (trin === 4) {
            el("valg4").querySelector('[data-styrke="' + GRAENSER[styrkeIndeks(opg.pKs)].navn + '"]').classList.add("rigtig");
            visStyrke();
        }
        trinLoest("svar", "Svaret står på tavlen.");
    }

    /* ────────────────────────────────
       TRIN 1: Reaktionen
    ──────────────────────────────── */
    function byggValg1() {
        var boks = el("valg1");
        boks.innerHTML = "";
        blandet([[opg.base, null]].concat(opg.fejl)).forEach(function (bud) {
            var b = lavBrik("", formel(bud[0]), function () { vaelgBase(b, bud[0], bud[1]); });
            b.dataset.noegle = noegle(bud[0]);
            boks.appendChild(b);
        });
    }

    function vaelgBase(b, s, fejltype) {
        if (trin !== 1 || loest) return;

        if (!fejltype) {
            b.classList.add("rigtig");
            visBase();
            trinLoest("ok", "Rigtigt. " + formel(opg.syre) + " og " + formel(opg.base) + " er et korresponderende syre-basepar.");
            return;
        }

        b.classList.add("forkert");
        b.disabled = true;
        var slot = el("art-base").querySelector(".formel");
        slot.classList.add("fejl");
        setTimeout(function () { slot.classList.remove("fejl"); }, 700);
        saetBesked("fejl", FEJLTEKST[fejltype](s));
    }

    /* Basen sættes ind, og skemaet farves efter syre-basepar med roller og H+-bue. */
    function visBase() {
        var slot = el("art-base").querySelector(".formel");
        slot.className = "formel";
        slot.innerHTML = formel(opg.base) + TF_AQ;
        el("valg1").querySelectorAll(".brik").forEach(function (b) { b.disabled = true; });
        el("skema").classList.add("farvet");
        tegnBue();
        el("bue").classList.remove("frem");
        void el("bue").getBoundingClientRect();
        el("bue").classList.add("frem");
    }

    /* Buen viser, at H+ går fra syren til vand. Den tegnes ud fra, hvor
       formlerne faktisk står, og udelades, hvis skemaet er brudt over. */
    function tegnBue() {
        var svg = el("bue");
        if (!el("skema").classList.contains("farvet")) { svg.innerHTML = ""; return; }

        var r = el("skema").getBoundingClientRect();
        var a = el("art-syre").querySelector(".formel").getBoundingClientRect();
        var v = el("skema").querySelectorAll(".art")[1].querySelector(".formel").getBoundingClientRect();
        if (Math.abs(a.top - v.top) > 4) { svg.innerHTML = ""; return; }

        var x1 = a.left + a.width / 2 - r.left;
        var x2 = v.left + v.width / 2 - r.left - 6;
        var y  = a.top - r.top + 4;
        var mx = (x1 + x2) / 2;

        svg.innerHTML =
            '<defs><marker id="spids" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">' +
            '<path d="M0,0 L8,4 L0,8 z" fill="#d1d5db"/></marker></defs>' +
            '<path d="M' + x1 + ',' + y + ' Q' + mx + ',' + (y - 36) + ' ' + x2 + ',' + y + '"' +
            ' fill="none" stroke="#d1d5db" stroke-width="1.8" marker-end="url(#spids)"/>' +
            '<text x="' + mx + '" y="' + (y - 21) + '" text-anchor="middle">H<tspan dy="-6" font-size="11">+</tspan></text>';
    }

    /* ────────────────────────────────
       TRIN 2: Ks-udtrykket
    ──────────────────────────────── */
    function byggValg2() {
        var boks = el("valg2");
        boks.innerHTML = "";
        [opg.syre, VAND, opg.base, OXONIUM].forEach(function (s) {
            var b = lavBrik(par(s), formel(s), function () { saetIPlads(s); });
            b.dataset.noegle = noegle(s);
            boks.appendChild(b);
        });
    }

    function saetIPlads(s) {
        if (trin !== 2 || loest || aktivPlads < 0) return;
        pladser[aktivPlads] = s;
        fejlPladser = fejlPladser.filter(function (i) { return i !== aktivPlads; });

        var tom = naesteTomme(aktivPlads);
        if (tom >= 0) {
            aktivPlads = tom;
            tegnPladser();
        } else {
            tjekTrin2();
        }
    }

    function naesteTomme(fra) {
        for (var i = 1; i <= 3; i++) {
            var j = (fra + i) % 3;
            if (!pladser[j]) return j;
        }
        return -1;
    }

    /* Klik på en plads: den tømmes og bliver den markerede plads. */
    function klikPlads(i) {
        if (trin !== 2 || loest) return;
        pladser[i] = null;
        fejlPladser = fejlPladser.filter(function (j) { return j !== i; });
        aktivPlads = i;
        tegnPladser();
    }

    function tegnPladser() {
        el("ks").querySelectorAll(".plads").forEach(function (b) {
            var i = Number(b.dataset.plads), s = pladser[i];
            var k = "plads";
            if (s) k += " fyldt " + par(s);
            if (i === aktivPlads && !loest) k += " aktiv";
            if (fejlPladser.indexOf(i) >= 0) k += " fejl";
            b.className = k;
            b.innerHTML = s ? "[" + formel(s) + "]" : "?";
            b.disabled = loest;
        });
    }

    function tjekTrin2() {
        var t0 = pladser[0], t1 = pladser[1], n = pladser[2];
        function produkt(s) { return ens(s, opg.base) || ens(s, OXONIUM); }

        fejlPladser = [];
        if (!produkt(t0)) fejlPladser.push(0);
        if (!produkt(t1) || ens(t0, t1)) fejlPladser.push(1);
        if (!ens(n, opg.syre)) fejlPladser.push(2);

        if (fejlPladser.length === 0) {
            loesTrin2();
            trinLoest("ok", "Rigtigt. For " + opg.navn.toLowerCase() + " er K<sub>s</sub> = " + ksHTML(opg.pKs) + " M.");
            return;
        }

        var tekst;
        if (pladser.some(function (s) { return ens(s, VAND); })) {
            tekst = "Vand er opløsningsmiddel og indgår ikke i K<sub>s</sub>-udtrykket.";
        } else if (fejlPladser.indexOf(2) >= 0 || !produkt(t0) || !produkt(t1)) {
            tekst = "Produkterne står i tælleren, og syren står i nævneren.";
        } else {
            tekst = "Begge produkter skal stå i tælleren.";
        }
        aktivPlads = fejlPladser[0];
        tegnPladser();
        saetBesked("fejl", tekst);
    }

    function loesTrin2() {
        loest = true;
        aktivPlads = -1;
        fejlPladser = [];
        el("ks").classList.add("faerdig");
        tegnPladser();
        vis("ks-vaerdi");
    }

    /* ────────────────────────────────
       TRIN 3: Beregn pKs
    ──────────────────────────────── */
    function tolkTal(tekst) {
        var t = tekst.replace(/\s+/g, "").replace(",", ".").replace(/[−–]/g, "-");
        return t === "" ? NaN : Number(t);
    }

    function tjekTrin3() {
        var input = el("input-pks");
        var u = tolkTal(input.value);
        var p = opg.pKs;
        ubekraeftet = false;

        if (isNaN(u)) {
            saetBesked("fejl", "Skriv pK<sub>s</sub> som et tal.");
        } else if (Math.abs(u - p) < 0.011) {
            input.disabled = true;
            vis("pks");
            trinLoest("ok", "Rigtigt.");
            return;
        } else if (Math.abs(u + p) < 0.011) {
            saetBesked("fejl", "Tjek fortegnet. Husk minus foran log.");
        } else if (Math.abs(Math.abs(u) - Math.abs(p) * Math.LN10) < 0.03) {
            saetBesked("fejl", "Du har brugt ln. pK<sub>s</sub> beregnes med log.");
        } else if (Math.abs(u + ksDele(p).exp) < 0.011) {
            saetBesked("fejl", "Tag hele K<sub>s</sub>-værdien med, ikke kun eksponenten.");
        } else if (Math.abs(u - p) < 0.1) {
            saetBesked("fejl", "Tæt på. Tjek afrundingen, og angiv to decimaler.");
        } else {
            saetBesked("fejl", "Ikke rigtigt. Tjek beregningen.");
        }
        opdaterKnap();
    }

    /* ────────────────────────────────
       TRIN 4: Syrestyrke
    ──────────────────────────────── */
    function byggValg4() {
        var boks = el("valg4");
        boks.innerHTML = "";
        GRAENSER.forEach(function (g, i) {
            var b = lavBrik("ord", stort(g.navn), function () { vaelgStyrke(b, i); });
            b.dataset.styrke = g.navn;
            boks.appendChild(b);
        });
    }

    function vaelgStyrke(b, i) {
        if (trin !== 4 || loest) return;
        var rigtig = styrkeIndeks(opg.pKs);

        if (i === rigtig) {
            b.classList.add("rigtig");
            visStyrke();
            trinLoest("ok", "Rigtigt. " + STYRKETEKST[rigtig]);
            return;
        }

        b.classList.add("forkert");
        b.disabled = true;
        saetBesked("fejl", i < rigtig ? "Syren er svagere end det." : "Syren er stærkere end det.");
    }

    function visStyrke() {
        visSkala(true);
        vis("styrke");
        if (styrkeIndeks(opg.pKs) === 0) {
            el("pil").textContent = "→";
            tegnBue();
        }
    }

    /* Skala fra SKALA_MIN til SKALA_MAX med de fire grupper. Uden svar
       (hintet) vises kun grupperne; med svar markeres syrens pKs. */
    function visSkala(medSvar) {
        var rigtig = styrkeIndeks(opg.pKs);
        function pct(v) { return (v - SKALA_MIN) / (SKALA_MAX - SKALA_MIN) * 100; }

        var zoner = "", streger = "", fra = SKALA_MIN;
        GRAENSER.forEach(function (g, i) {
            var til = Math.min(g.til, SKALA_MAX);
            zoner += '<div class="zone' + (medSvar && i === rigtig ? " aktiv" : "") + '" style="flex:' + (til - fra) + '">' + stort(g.navn) + '</div>';
            if (g.til < SKALA_MAX) streger += '<span class="streg" style="left:' + pct(g.til) + '%">' + g.til + '</span>';
            fra = til;
        });

        var markoer = "";
        if (medSvar) {
            var x = pct(opg.pKs);
            var side = x < 12 ? " venstre" : (x > 88 ? " hoejre" : "");
            markoer = '<div class="markoer' + side + '" style="left:' + x + '%"><span>pK<sub>s</sub> = ' + tal(opg.pKs, 2) + '</span></div>';
        }

        el("styrke").innerHTML = '<div class="skala"><div class="skala-bar">' + zoner + '</div>' + streger + markoer + '</div>';
    }

    /* ────────────────────────────────
       START
    ──────────────────────────────── */
    el("knap").onclick = knapKlik;

    el("ks").querySelectorAll(".plads").forEach(function (b) {
        b.onclick = function () { klikPlads(Number(b.dataset.plads)); };
    });

    el("input-pks").addEventListener("input", function () {
        if (loest) return;
        ubekraeftet = this.value.trim() !== "";
        opdaterKnap();
    });

    el("input-pks").addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (!loest && ubekraeftet) tjekTrin3();
    });

    window.addEventListener("resize", tegnBue);
    window.onload = function () { nyOpgave(); };
</script>
</body>
</html>
